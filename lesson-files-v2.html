<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | ملفات الدرس</title><link rel="stylesheet" href="css/premium-shell.css?v=20260817-files-v8"><style>body{margin:0;background:#f4f7fc;color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:1050px;margin:auto;padding:20px 14px 55px}.hero,.file{background:#fff;border:1px solid #e1e7f0;border-radius:22px;padding:20px;box-shadow:0 10px 28px #14264a10}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff}.files{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.file h3{margin:7px 0}.file p{color:#68758b;line-height:1.7;font-size:13px}.file a{display:inline-block;background:#2563eb;color:#fff;text-decoration:none;padding:10px 14px;border-radius:12px;font-weight:900}.badge{font-size:11px;font-weight:900;color:#147a48;background:#effaf4;padding:5px 9px;border-radius:9px}.back{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.back a{background:#fff;border:1px solid #e1e7f0;border-radius:12px;padding:10px 14px;text-decoration:none;color:#315fc8;font-weight:900}.empty{grid-column:1/-1;text-align:center;color:#68758b;padding:28px}@media(max-width:700px){.files{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><h1 id="title">📁 ملفات الدرس</h1><p id="subtitle">كل ملفات الدرس في مكان واحد، مع فصل واضح بين التقييم الرسمي والتفاعلي وصفحة النطق.</p></section><section id="files" class="files"></section><div class="back"><a id="back" href="lesson.html?id=grade8-u1-l1">← العودة إلى الدرس</a><a href="grade-8.html">الصف الثاني الإعدادي</a><a href="dashboard.html">📈 لوحة الطالب</a></div></main><script>(function(){const id=new URLSearchParams(location.search).get('lesson')||'grade8-u1-l1';const m=id.match(/^grade8-u(\d+)-l(\d+)$/);const u=m?.[1]||'1',l=m?.[2]||'1';const base='data/lessons/grade-8/unit-'+u+'/';const fallback={interactive:'lesson.html?id='+id,reference:base+'reference_lecon'+l+'_unite'+u+'.html',assessment:base+'formal_assessment_lecon'+l+'_unite'+u+'.html',quiz:base+'examen_u'+u+'-l'+l+'.html',games:base+'lesson-'+l+'-games.html'};if(id==='grade8-u3-l1'){fallback.pronunciation=base+'pronunciation_challenge_lecon1_unite3.html';fallback.games=base+'lesson-1-games-v3.html'}const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const labels=[['📘','الدرس التفاعلي','interactive','الشرح والتعلم داخل Learning Studio.'],['📄','المرجع التعليمي','reference','مرجع مستقل للمراجعة والطباعة.'],['📝','التقييم الرسمي','assessment','تقييم مستقل بدون تصحيح فوري أثناء الحل.'],['🎯','التقييم التفاعلي','quiz','تدريب تفاعلي مع تغذية راجعة فورية.'],['🔊','صفحة النطق','pronunciation','نطق الكلمات والأمثلة بمحرك فرنسي مستقل.'],['🎮','الألعاب التعليمية','games','تدريب ألعاب منفصل عن التقييمات.']];function render(f){files.innerHTML=labels.filter(x=>f[x[2]]).map(x=>'<article class="file"><span class="badge">متاح</span><h3>'+x[0]+' '+x[1]+'</h3><p>'+x[3]+'</p><a target="_blank" rel="noopener" href="'+esc(f[x[2]])+'">فتح الملف ↗</a></article>').join('')||'<div class="empty">لا توجد ملفات مسجلة لهذا الدرس.</div>';back.href='lesson.html?id='+encodeURIComponent(id)}render(fallback);fetch(base+'lesson-'+l+'.json?v=20260817',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(data=>{if(data?.files)render(Object.assign({},fallback,data.files))}).catch(()=>{})})();</script></body></html>
