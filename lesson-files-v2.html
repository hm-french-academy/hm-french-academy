<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | ملفات الدرس</title><style>body{margin:0;background:#f4f7fb;color:#16213e;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 28px #14264a12;margin-bottom:12px}.file{border:1px solid #dfe6f1;border-radius:13px;padding:13px;margin:8px 0;direction:ltr;text-align:left;word-break:break-word}.ok{background:#eefbf3;border-right:4px solid #21a366;padding:13px;border-radius:10px;line-height:1.8}.bad{background:#fff8e8;border-right:4px solid #f59e0b;padding:13px;border-radius:10px;line-height:1.8}a{display:inline-block;margin-top:10px;background:#2563eb;color:#fff;text-decoration:none;padding:10px 14px;border-radius:11px;font-weight:800}</style></head><body><div class="wrap"><section class="card"><h1>📁 ملفات الدرس</h1><div id="status">جاري تحميل ملفات الدرس…</div><div id="files"></div><a id="back" href="#">← العودة إلى الدرس</a></section></div><script>(async()=>{const q=new URLSearchParams(location.search);const id=q.get('lesson')||q.get('id')||'';const ids=['grade7-u1-l1','grade7-u1-l2','grade7-u1-l3','grade7-u1-l4','grade7-u1-l5','grade7-u1-l6','grade7-u2-l1','grade7-u2-l2','grade7-u3-l1','grade7-u3-l2','grade7-u3-l3'];const i=ids.indexOf(id);if(i<0){status.innerHTML='<div class="bad">معرف الدرس غير صالح. يجب فتح ملفات درس تابع للصف الأول الإعدادي.</div>';return}try{const r=await fetch(`data/lessons/grade-7/unit-1/lesson-${i+1}.json`,{cache:'no-store'});if(!r.ok)throw Error();const raw=await r.json(),d=typeof raw.content==='string'?JSON.parse(raw.content):raw;if(d.grade!=='grade-7'||d.id!==id)throw Error();document.querySelector('h1').textContent='📁 '+(d.titleAr||'ملفات الدرس');status.innerHTML='<div class="ok">هذه الملفات مرتبطة بالدرس الحالي فقط: <b>'+id+'</b><br>تم منع أي انتقال تلقائي إلى الصف الثاني الإعدادي.</div>';const fs=d.sourceFiles||{};files.innerHTML=Object.keys(fs).length?Object.entries(fs).map(([k,v])=>`<div class="file"><b>${k}</b><br>${v}</div>`).join(''):'<div class="bad">لا توجد ملفات مصدر مسجلة لهذا الدرس.</div>';back.href=`grade7-lesson-studio.html?id=${encodeURIComponent(id)}&section=introduction`}catch(e){status.innerHTML='<div class="bad">تعذر تحميل بيانات الدرس، وتم منع أي fallback من الصف الثاني الإعدادي.</div>'}})();</script></body></html>
