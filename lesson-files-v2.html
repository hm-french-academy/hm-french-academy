<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | ملفات الدرس</title><style>body{margin:0;background:#f4f7fc;color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:1050px;margin:auto;padding:24px 14px 55px}.hero,.file,.note{background:#fff;border:1px solid #e1e7f0;border-radius:22px;padding:20px;box-shadow:0 10px 28px #14264a10}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff}.files{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.file h3{margin:7px 0}.file p{color:#68758b;line-height:1.7;font-size:13px}.file a{display:inline-block;background:#2563eb;color:#fff;text-decoration:none;padding:10px 14px;border-radius:12px;font-weight:900}.badge{font-size:11px;font-weight:900;color:#147a48;background:#effaf4;padding:5px 9px;border-radius:9px}.back{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.back a{background:#fff;border:1px solid #e1e7f0;border-radius:12px;padding:10px 14px;text-decoration:none;color:#315fc8;font-weight:900}@media(max-width:700px){.files{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><h1 id="title">ملفات الدرس</h1><p>كل ملفات الدرس في مكان واحد.</p></section><section id="files" class="files"></section><section class="note" style="margin-top:18px">الألعاب منفصلة عن التقييم الرسمي، والاختبار الإلكتروني مستقل. الوحدة الرابعة من المنهج مستبعدة بالكامل.</section><div class="back"><a id="back">← الدرس التفاعلي</a><a href="grade-8.html">الصف الثاني الإعدادي</a><a href="dashboard.html">📈 لوحة الطالب</a></div></main><script>const id=new URLSearchParams(location.search).get('lesson')||'grade8-u1-l1';const map={u1:{name:'À l’école',unit:'unit-1',n:1},u2:{name:'La maison',unit:'unit-2',n:1}};const m=id.includes('u2-')?{name:'La maison',unit:'unit-2',n:Number(id.match(/l(\d+)/)?.[1]||1)}:{name:'À l’école',unit:'unit-1',n:Number(id.match(/l(\d+)/)?.[1]||1)};const base='data/lessons/grade-8/'+m.unit+'/';const unit=m.unit.split('-')[1];const n=m.n;const title=m.name+' · Leçon '+n;document.getElementById('title').textContent='ملفات الدرس · '+title;const f=[['الملف التفاعلي','lesson-'+n+'-interactive.html'],['الملف المرجعي','reference_lecon'+n+'_unite'+unit+'.html'],['التقييم الرسمي','formal_assessment_lecon'+n+'_unite'+unit+'.html'],['الاختبار الإلكتروني','examen_u'+unit+'-l'+n+'.html'],['الألعاب التعليمية','lesson-'+n+'-games.html']];document.getElementById('files').innerHTML=f.map(x=>'<article class="file"><span class="badge">متاح</span><h3>'+x[0]+'</h3><p>ملف مستقل مرتبط بهذا الدرس.</p><a href="'+base+x[1]+'">فتح الملف</a></article>').join('');document.getElementById('back').href=base+'lesson-'+n+'-interactive.html';</script></body></html>
