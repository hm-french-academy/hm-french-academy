:'lesson.html?id='+id,reference:base+'reference_lecon'+l+'_unite'+u+'.html',assessment:base+'formal_assessment_lecon'+l+'_unite'+u+'.html',quiz:base+'examen_u'+u+'-l'+l+'.html'};const labels=[['📘','الدرس التفاعلي','الشرح والتعلم داخل Learning Studio.','interactive'],['📄','المرجع التعليمي','مرجع مستقل للمراجعة والطباعة.','reference'],['📝','التقييم الرسمي','اختبار مستقل؛ تظهر النتيجة والمراجعة بعد التسليم.','assessment'],['🎯','التقييم التفاعلي','تدريب تفاعلي مع تصحيح وتغذية راجعة فورية.','quiz']];const filesEl=document.getElementById('files');filesEl.innerHTML=labels.map(x=>'<article class="file"><span class="badge">متاح</span><h3>'+x[0]+' '+x[1]+'</h3><p>'+x[2]+'</p><a target="_blank" rel="noopener" href="'+files[x[3]]+'">فتح الملف ↗</a></article>').join('');document.getElementById('back').href='lesson.html?id='+encodeURIComponent(id)})()</script></body></html>
