<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | ملفات الدرس</title><style>body{margin:0;background:#f4f7fb;color:#16213e;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 28px #14264a12;margin-bottom:12px}.file{border:1px solid #dfe6f1;border-radius:13px;padding:13px;margin:8px 0;direction:ltr;text-align:left;word-break:break-word}.ok{background:#eefbf3;border-right:4px solid #21a366;padding:13px;border-radius:10px;line-height:1.8}.bad{background:#fff8e8;border-right:4px solid #f59e0b;padding:13px;border-radius:10px;line-height:1.8}a{display:inline-block;margin-top:10px;background:#2563eb;color:#fff;text-decoration:none;padding:10px 14px;border-radius:11px;font-weight:800}</style></head><body><div class="wrap"><section class="card"><h1 id="title">📁 ملفات الدرس</h1><div id="status">جاري تحميل ملفات الدرس…</div><div id="files"></div><a id="back" href="#">← العودة إلى الدرس</a></section></div><script>(async()=>{const q=new URLSearchParams(location.search);const id=q.get('lesson')||q.get('id')||'';const statusEl=document.getElementById('status'),filesEl=document.getElementById('files'),titleEl=document.getElementById('title'),backEl=document.getElementById('back');backEl.href=`grade7-lesson-studio.html?id=${encodeURIComponent(id)}&section=introduction`;if(!/^grade7-u[1-3]-l\d+$/.test(id)){statusEl.innerHTML='<div class="bad">معرف الدرس غير صالح. يجب فتح ملفات درس تابع للصف الأول الإعدادي.</div>';return}try{const r=await fetch('data/lessons/grade-7/source-package-manifest.json?v=20260904-files-v9',{cache:'no-store'});if(!r.ok)throw Error('manifest-http-'+r.status);const raw=await r.json();let manifest=raw;for(let n=0;n<4&&manifest&&typeof manifest.content==='string';n++){try{manifest=JSON.parse(manifest.content)}catch(e){throw Error('manifest-invalid-json')}}const lesson=(manifest.lessons||[]).find(x=>x.id===id);if(!lesson)throw Error('lesson-not-found');titleEl.textContent='📁 '+(lesson.title||'ملفات الدرس');statusEl.innerHTML='<div class="ok">هذه الملفات مرتبطة بالدرس الحالي فقط: <b>'+id+'</b><br>المصدر المعتمد: حزمة محتوى الصف الأول الإعدادي.</div>';const fs={interactive:lesson.interactive,reference:lesson.reference,assessment:lesson.assessment,quiz:lesson.quiz};filesEl.innerHTML=Object.entries(fs).map(([k,v])=>`<div class="file"><b>${k}</b><br>${v}</div>`).join('')}catch(e){console.error(e);statusEl.innerHTML='<div class="bad">تعذر تحميل بيانات ملفات هذا الدرس حاليًا.<br><span style="font-size:13px">سيتم منع أي fallback إلى الصف الثاني الإعدادي.</span></div>'}})();</script></body></html>
