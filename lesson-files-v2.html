<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | ملفات الدرس</title><style>body{margin:0;background:#f4f7fb;color:#16213e;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 28px #14264a12;margin-bottom:12px}.file{border:1px solid #dfe6f1;border-radius:13px;padding:13px;margin:8px 0;direction:ltr;text-align:left;word-break:break-word}.ok{background:#eefbf3;border-right:4px solid #21a366;padding:13px;border-radius:10px;line-height:1.8}.bad{background:#fff8e8;border-right:4px solid #f59e0b;padding:13px;border-radius:10px;line-height:1.8}a{display:inline-block;margin-top:10px;background:#2563eb;color:#fff;text-decoration:none;padding:10px 14px;border-radius:11px;font-weight:800}</style></head><body><div class="wrap"><section class="card"><h1>📁 ملفات الدرس</h1><div id="status">جاري تحميل ملفات الدرس…</div><div id="files"></div><a id="back" href="#">← العودة إلى الدرس</a></section></div><script>(async()=>{const q=new URLSearchParams(location.search);const id=q.get('lesson')||q.get('id')||'';const m=/^grade7-u(\d+)-l(\d+)$/.exec(id);if(!m){status.innerHTML='<div class="bad">معرف الدرس غير صالح. يجب فتح ملفات درس تابع للصف الأول الإعدادي.</div>';return}const unit=Number(m[1]),lesson=Number(m[2]);if(![1,2,3].includes(unit)||lesson<1||lesson>6){status.innerHTML='<div class="bad">معرف الدرس خارج نطاق محتوى الصف الأول الإعدادي المتاح حاليًا.</div>';return}const url=`data/lessons/grade-7/unit-${unit}/lesson-${lesson}.json`;try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('http-'+r.status);let d=await r.json();for(let n=0;n<4&&d&&typeof d.content==='string';n++){try{d=JSON.parse(d.content)}catch(e){throw Error('invalid-json')}}if(!d||d.grade!=='grade-7'||d.id!==id)throw Error('lesson-integrity');document.querySelector('h1').textContent='📁 '+(d.titleAr||'ملفات الدرس');status.innerHTML='<div class="ok">هذه الملفات مرتبطة بالدرس الحالي فقط: <b>'+id+'</b><br>تم تحميل بيانات الدرس الصحيحة دون أي fallback إلى درس أو صف آخر.</div>';const fs=d.sourceFiles||d.sourceAssets||{};files.innerHTML=Object.keys(fs).length?Object.entries(fs).map(([k,v])=>`<div class="file"><b>${k}</b><br>${v}</div>`).join(''):'<div class="bad">لا توجد ملفات مصدر مسجلة لهذا الدرس.</div>';back.href=`grade7-lesson-studio.html?id=${encodeURIComponent(id)}&section=introduction`}catch(e){console.error(e);status.innerHTML='<div class="bad">تعذر تحميل بيانات ملفات هذا الدرس حاليًا.<br><span style="font-size:13px">المسار المستخدم: '+url+'</span></div>'}})();</script></body></html>
