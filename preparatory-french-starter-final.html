<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Premier Pas</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f3f7fc;color:#1d2c45}.wrap{max-width:1120px;margin:auto;padding:18px 14px 70px}.hero{background:linear-gradient(135deg,#14264a,#2563eb);color:#fff;border-radius:28px;padding:28px}.hero h1{font-size:clamp(30px,6vw,48px);margin:8px 0}.hero p{line-height:1.9}.progress,.content{background:#fff;border:1px solid #dce5f2;border-radius:20px;padding:16px;margin:14px 0}.top{display:flex;justify-content:space-between;font-weight:900}.track{height:9px;background:#e8eef7;border-radius:99px;overflow:hidden;margin-top:8px}.bar{height:100%;width:0;background:#2563eb}.journey{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.step,.btn,.filter{border:0;border-radius:13px;padding:10px 13px;font:inherit;font-weight:900;cursor:pointer}.step{min-height:66px;background:#fff;color:#34435d;border:1px solid #dce5f2}.step.active{background:#2563eb;color:#fff}.step.done{background:#f1f6ff}.grid,.words{display:grid;gap:10px}.grid{grid-template-columns:repeat(2,1fr)}.words{grid-template-columns:repeat(4,1fr)}.box,.word{background:#f8fbff;border:1px solid #dce5f2;border-radius:16px;padding:14px}.word{text-align:center}.word strong{display:block;direction:ltr;font-size:20px}.word small{display:block;color:#738198;margin:5px}.visual{height:100px;display:grid;place-items:center;font-size:56px;background:#eef5ff;border-radius:12px;margin-bottom:10px}.btn{background:#2563eb;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.quiz{border:1px solid #dce5f2;border-radius:16px;padding:14px;margin:10px 0}.quiz label{display:block;padding:9px}.result{margin-top:10px;padding:12px;border-radius:13px;background:#f0f7ff;font-weight:900}.tip{margin-top:13px;border-right:4px solid #2563eb;background:#f5f8ff;padding:12px;line-height:1.8}@media(max-width:800px){.journey{grid-template-columns:repeat(3,1fr)}.words{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:520px){.journey{grid-template-columns:repeat(2,1fr)}.words{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><section class="hero"><b>🇫🇷 كورس تمهيدي • Premier Pas</b><h1>استكشف la langue française</h1><p>رحلتك الأولى في الفرنسية: اسمع، انطق، اكتشف كلمات تعرفها بالفعل، وتدرّب قبل بدء منهج الصف الأول الإعدادي.</p></section><section class="progress"><div class="top"><span>تقدم الرحلة</span><span id="pct">0%</span><span id="xp">⭐ 0 XP</span></div><div class="track"><div id="bar" class="bar"></div></div></section><div id="journey" class="journey"></div><section id="content" class="content"></section></main><script>(function(){'use strict';const $=id=>document.getElementById(id),KEY='hmPremierPasFinalV12';const bank=[['Bonjour','مرحبًا','☀️'],['Salut','أهلًا','👋'],['Merci','شكرًا','❤️'],['Au revoir','إلى اللقاء','🚪'],['croissant','كرواسون','🥐'],['café','قهوة','☕'],['pomme','تفاحة','🍎'],['école','المدرسة','🏫'],['livre','كتاب','📖'],['bus','حافلة','🚌'],['famille','العائلة','👨‍👩‍👧'],['maison','منزل','🏠'],['zéro','صفر','0️⃣'],['un','واحد','1️⃣'],['deux','اثنان','2️⃣'],['français','الفرنسية','🇫🇷']];const steps=[{e:'🧭',t:'البداية',h:'ابدأ بدون خوف',p:'اختبار خفيف للتعرّف على نقطة البداية.',q:[['هل تعرف معنى Bonjour؟',['نعم','لا'],'نعم']]},{e:'🇫🇷',t:'Bienvenue',h:'ما هي الفرنسية؟',p:'اكتشف الفرنسية كلغة للتواصل والثقافة والسفر والتعلم.',grid:[['🌍','لغة عالمية','تفتح أبوابًا للتواصل والثقافة.'],['🎓','التعلّم','من الاستماع إلى الاستخدام خطوة خطوة.'],['✈️','السفر','مفيدة في مواقف تواصل كثيرة.'],['💬','التواصل','الكلمات تصبح لغة عندما تستخدمها.']]},{e:'🌉',t:'Français ↔ عربي',h:'كلمات مألوفة',p:'اكتشف كلمات تعرفها بالفعل.',words:bank.slice(0,6)},{e:'😄',t:'كلمات تعرفها',h:'أنت بتتكلم فرنسي!',p:'بطاقات مفردات مصوّرة، مع النطق والمعنى.',vocab:true},{e:'🔤',t:'Alphabet',h:'الحروف الفرنسية',p:'استمع إلى أسماء الحروف الفرنسية.',letters:true},{e:'🔊',t:'Premiers sons',h:'اسمع الأصوات قبل الكلمات',p:'اربط الصوت بمثال فرنسي.',sounds:[['A','/a/','ami'],['OU','/u/','rouge'],['OI','/wa/','moi'],['CH','/ʃ/','chat'],['PH','/f/','photo'],['GN','/ɲ/','montagne']]},{e:'💬',t:'Premières phrases',h:'أول جمل تستطيع قولها',p:'الكلمة تصبح لغة عندما تستخدمها.',dialog:true},{e:'🎮',t:'Entraînement',h:'تدريبك الأول',p:'جرّب ثم راجع أخطاءك.',q:[['كيف تقول «شكرًا»؟',['Merci !','Salut !','Bonsoir !'],'Merci !'],['أي كلمة تعني المدرسة؟',['école','famille','piscine'],'école']]},{e:'🏆',t:'Défi final',h:'هل أنت مستعد؟',p:'اختبار قصير يجمع أهم ما اكتشفته.',q:[['التعبير المناسب للشكر هو:',['Merci !','Salut !','À demain !'],'Merci !'],['ما معنى Je m’appelle Lina؟',['اسمي لينا','عمري لينا','أحب لينا'],'اسمي لينا']]},{e:'🎓',t:'Premier Pas',h:'أكملت خطوتك الأولى!',p:'أنت الآن جاهز للخطوة الأولى في منهج الصف الأول الإعدادي.',finish:true}];let i=Math.max(0,Math.min(Number(localStorage.getItem(KEY+'Step'))||0,steps.length-1)),xp=Number(localStorage.getItem(KEY+'XP'))||0;function save(){localStorage.setItem(KEY+'Step',i);localStorage.setItem(KEY+'XP',xp)}function speak(t){try{if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;window.speechSynthesis.speak(u)}catch(e){}}function qhtml(qs){return qs.map((q,n)=>'<div class="quiz"><b>'+(n+1)+'. '+q[0]+'</b>'+q[1].map(o=>'<label><input type="radio" name="q'+n+'" value="'+o.replace(/"/g,'&quot;')+'"> '+o+'</label>').join('')+'</div>').join('')+'<button class="btn" id="check">تصحيح الإجابات</button><div id="result"></div>'}function render(){const s=steps[i];$('journey').innerHTML=steps.map((x,n)=>'<button class="step '+(n===i?'active ':'')+(n<i?'done':'')+'" data-n="'+n+'">'+x.e+'<br>'+x.t+'</button>').join('');document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{i=Number(b.dataset.n);save();render()});const p=Math.round(i/(steps.length-1)*100);$('pct').textContent=p+'%';$('bar').style.width=p+'%';$('xp').textContent='⭐ '+xp+' XP';let h='<span>'+(i+1)+' / '+steps.length+'</span><h2>'+s.e+' '+s.h+'</h2><p>'+s.p+'</p>';if(s.grid)h+='<div class="grid">'+s.grid.map(x=>'<div class="box"><h3>'+x[0]+' '+x[1]+'</h3><p>'+x[2]+'</p></div>').join('')+'</div>';if(s.words)h+='<div class="words">'+s.words.map(w=>'<div class="word"><div class="visual">'+w[2]+'</div><strong>'+w[0]+'</strong><small>'+w[1]+'</small><button class="btn speak" data-s="'+w[0]+'">🔊 استمع</button></div>').join('')+'</div>';if(s.vocab)h+='<div class="words">'+bank.map(w=>'<div class="word"><div class="visual">'+w[2]+'</div><strong>'+w[0]+'</strong><small>'+w[1]+'</small><button class="btn speak" data-s="'+w[0]+'">🔊 استمع</button></div>').join('')+'</div>';if(s.letters)h+='<div class="words">'+Array.from('ABCDEFGHIJKLMNOPQRSTUVWXYZ').map(x=>'<button class="btn speak" data-s="'+x+'">'+x+' 🔊</button>').join('')+'</div>';if(s.sounds)h+='<div class="words">'+s.sounds.map(x=>'<div class="word"><strong>'+x[0]+'</strong><small>'+x[1]+'</small><b dir="ltr">'+x[2]+'</b><button class="btn speak" data-s="'+x[2]+'">🔊 استمع</button></div>').join('')+'</div><div class="tip">🎧 نسمع التركيبة كوحدة صوتية ونربطها بمثال.</div>';if(s.dialog)h+='<div class="box"><p>👤 A: Bonjour !</p><p>👤 B: Salut ! Comment ça va ?</p><p>👤 A: Ça va bien. Je m’appelle Lina.</p><p>👤 B: Enchanté(e) ! Au revoir !</p><button class="btn" id="dialogSpeak">🔊 استمع إلى الحوار</button></div>';if(s.q)h+=qhtml(s.q);if(s.finish)h+='<div class="box"><h2>🎉 Félicitations !</h2><p>أكملت رحلة Premier Pas بنجاح.</p><p>⭐ '+xp+' XP</p></div>';if(!s.finish)h+='<div class="actions"><button class="btn" id="next">إتمام المحطة والانتقال ←</button></div>';$('content').innerHTML=h;document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>speak(b.dataset.s));if($('dialogSpeak'))$('dialogSpeak').onclick=()=>speak('Bonjour ! Salut ! Comment ça va ? Ça va bien. Je m’appelle Lina. Enchanté(e) ! Au revoir !');if($('check'))$('check').onclick=()=>{let score=0;s.q.forEach((q,n)=>{const x=document.querySelector('input[name="q'+n+'"]:checked');if(x&&x.value===q[2])score++});if(score/s.q.length>=.75){xp+=5;save()}$('result').innerHTML='<div class="result">النتيجة: '+score+'/'+s.q.length+' — '+Math.round(score/s.q.length*100)+'%</div>'};if($('next'))$('next').onclick=()=>{i=Math.min(i+1,steps.length-1);xp+=3;save();render();scrollTo(0,0)}}try{render()}catch(e){console.error(e);$('content').innerHTML='<div class="box"><h2>تعذر تشغيل محتوى الرحلة</h2><p>أعد تحميل الصفحة.</p></div>'}})();</script></body></html>
