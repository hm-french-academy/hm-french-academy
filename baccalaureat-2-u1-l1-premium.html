.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.pill,.tag{background:#edf3ff;color:var(--brand);padding:8px 13px;border-radius:99px;font-weight:900}.muted{color:var(--muted);line-height:1.9}.progress{height:9px;background:#e8edf6;border-radius:99px;overflow:hidden;margin-top:15px}.progress i{display:block;height:100%;width:10%;background:var(--brand);transition:.25s}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}.v{border:1px solid var(--line);border-radius:17px;padding:14px;background:#fbfcff}.v b{font-size:20px;direction:ltr;display:block}.v span{color:var(--muted);display:block;margin:4px 0 10px}.speak,.opt{border:0;border-radius:10px;padding:8px 11px;background:#edf3ff;color:var(--brand);font-weight:900;cursor:pointer}.rule,.reading,.dialogue,.mission{background:var(--soft);border:1px solid #e5ebf3;border-radius:17px;padding:16px;line-height:2;margin-top:11px}.model{font-size:18px;font-weight:800;background:#fff;border-right:4px solid var(--brand);padding:13px;border-radius:13px;margin:10px 0;direction:ltr;text-align:left}.q{border:1px solid var(--line);border-radius:17px;padding:15px;margin:11px 0}.opts{display:grid;gap:8px;margin-top:9px}.opt{border:1px solid var(--line);background:#fff;color:var(--ink);text-align:right}.opt.ok{background:var(--ok);border-color:#2d9b70}.opt.bad{background:var(--bad);border-color:#d35b5b}.feedback{margin-top:8px;font-weight:800;line-height:1.8}.write{width:100%;min-height:105px;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;box-sizing:border-box}.small{min-height:44px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}.metric b{display:block;font-size:24px}.btn{border:0;border-radius:13px;padding:11px 15px;background:var(--brand);color:#fff;text-decoration:none;font-weight:900;cursor:pointer}.btn.alt{background:#edf3ff;color:var(--brand)}.actions{display:flex;gap:8px;flex-wrap:wrap}.fr{direction:ltr;text-align:left}.ar{direction:rtl;text-align:right}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.tabs{grid-template-columns:repeat(2,1fr)}.hero{flex-direction:column}.metrics,.two{grid-template-columns:1fr}.card{padding:15px}.wrap{width:min(100% - 14px,1160px)}}

<script>
const stages=[['Vue d’ensemble','🎯'],['Les repas','🍽️'],['Vocabulaire','🗂️'],['Manger · Prendre · Boire','📘'],['Articles partitifs','🧩'],['Interrogation','❓'],['Documents','📖'],['Situations','💬'],['Production','✍️'],['Entraînement','🏆']];
const vocab=[['un aliment','طعام'],['un menu','قائمة طعام'],['un jus','عصير'],['un repas','وجبة'],['le petit-déjeuner','الفطور'],['le déjeuner','الغداء'],['le goûter','وجبة خفيفة'],['le dîner','العشاء'],['un fruit','فاكهة'],['un animateur','مقدم برامج'],['le matin','الصباح'],['le midi','منتصف النهار'],["l’après-midi",'بعد الظهر'],['le soir','المساء'],['le minuit','منتصف الليل'],['un sandwich','ساندويتش'],['un dessert','حلوى'],['un fast-food','مطعم أكلات سريعة'],['un restaurant','مطعم'],['un légume','خضار'],['une journée','يوم (نهار)'],['une heure','ساعة'],['une chaîne','قناة تلفزيونية'],['une cantine','مقصف (كانتينا)'],['une famille','عائلة'],['une boisson','مشروب'],['une maison','منزل'],['une raison','سبب'],['le riz','الأرز'],['le lait','اللبن'],['un poulet','دجاجة'],['un café','قهوة'],['un thé','شاي'],['un œuf','بيض'],['un pain','خبز'],['un croissant','كرواسون'],['un fromage','جبنة'],['une salade','سلطة'],['une soupe','حساء (شوربة)'],['une farine','دقيق'],['une pomme','تفاح'],['une pomme de terre','بطاطس'],['une orange','برتقال'],['une banane','موز'],['une fraise','فراولة'],['une poire','كمثرى']];
const qs=[
['Pierre prend-il le petit-déjeuner à…',['6 heures','7 heures','9 heures'],1],
['Qu’est-ce qu’Ali mange au petit-déjeuner ?',['Du riz','Des légumes','Du pain et du fromage'],2],
['Où est-ce que Pierre dîne ?',['À la maison','À la cantine','Au restaurant'],2],
['À 16 heures, Pierre mange…',['Un fruit','Un sandwich','Des biscuits'],2],
['Quel est le dessert préféré de Sophie ?',['Le gâteau','La tarte','La glace au chocolat','Les biscuits'],2],
['À quelle heure Sophie prend-elle son petit-déjeuner ?',['À six heures','À huit heures','À sept heures','À neuf heures'],2],
['Avec qui Sophie déjeune-t-elle ?',['Avec ses amis','Avec ses voisins','Avec ses parents','Avec sa sœur'],2],
['Que boit Sophie le soir ?',['Du lait','Du café','De l’eau','Du jus d’orange'],3],
['À quelle heure Pierre prend-il le goûter ?',['À 15 heures','À 16 heures','À 17 heures'],1],
['Où Pierre prend-il le dîner ?',['À la maison','À la cantine','Au restaurant','À l’école'],2]
];
let i=0,score=0,answered=0;
function speak(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.9;speechSynthesis.speak(u)}
function qBlock(q,n){return `<div class="q"><b>${n+1}. ${q[0]}</b><div class="opts">${q[1].map((x,j)=>`<button class="opt" data-q="${n}" data-a="${j}">${x}</button>`).join('')}</div><div class="feedback" id="f${n}"></div></div>`}
function render(){
 document.getElementById('tabs').innerHTML=stages.map((s,n)=>`<button class="tab ${n===i?'on':''}" data-i="${n}">${s[1]} ${s[0]}</button>`).join('');document.getElementById('bar').style.width=((i+1)/stages.length*100)+'%';let h='';
 if(i===0)h=`<section class="card"><h2>Les objectifs de la leçon</h2><div class="grid"><div class="v">🍽️ <b>Nommer les repas</b><span>الحديث عن وجبات اليوم.</span></div><div class="v">⏰ <b>Dire l’heure des repas</b><span>الحديث عن أوقات الوجبات.</span></div><div class="v">🍴 <b>Dialogue au restaurant</b><span>عمل حوار في مطعم.</span></div><div class="v">🧩 <b>Articles partitifs</b><span>استخدام أدوات التجزئة.</span></div><div class="v">📘 <b>Manger · prendre · boire</b><span>تصريف الأفعال: يأكل، يتناول، يشرب.</span></div></div><div class="mission"><b>المسار:</b> افهم أسماء الوجبات → تعلّم الأطعمة → صرّف الأفعال → استخدم أدوات التجزئة → اسأل وأجب → طبّق في مواقف وإنتاج.</div></section>`;
 if(i===1)h=`<section class="card"><h2>🍽️ Les repas de la journée</h2><div class="two"><div class="rule"><h3>Le petit-déjeuner · الفطور</h3><b>7h – 9h</b><br>Le croissant · Le pain avec du beurre et de la confiture · Le café ou le lait · Le jus d’orange</div><div class="rule"><h3>Le déjeuner · الغداء</h3><b>12h – 13h</b><br>Une entrée (salade) · Un plat principal (viande, poisson, poulet avec riz, pâtes ou légumes) · Le fromage · Un dessert</div><div class="rule"><h3>Le goûter · الوجبة الخفيفة</h3><b>16h – 17h</b><br>Des biscuits · Un fruit · Un chocolat · Du lait ou un jus de fruits</div><div class="rule"><h3>Le dîner · العشاء</h3><b>19h – 21h</b><br>La soupe · Le yaourt ou un fruit · La salade · L’omelette</div></div><p class="muted">ملاحظة الكتاب: في بعض المناطق بفرنسا يتناولون وجبة خفيفة بعد العشاء تسمى <b>le souper</b>.</p></section>`;
 if(i===2)h=`<section class="card"><h2>🗂️ Vocabulaire — مفردات الدرس</h2><p class="muted">هذه الكلمات مأخوذة من صفحة المفردات في الدرس، وليست قائمة عامة.</p><div class="grid">${vocab.map(v=>`<article class="v"><b>${v[0]}</b><span>${v[1]}</span><button class="speak" onclick="speak('${v[0].replaceAll("'","\\'")}')">🔊 نطق</button></article>`).join('')}</div></section>`;
 if(i===3)h=`<section class="card"><h2>📘 Utiliser les verbes</h2><div class="two"><div class="rule"><h3>manger · يأكل</h3>je mange · tu manges · il/elle/on mange · nous mangeons · vous mangez · ils/elles mangent</div><div class="rule"><h3>prendre · يتناول</h3>je prends · tu prends · il/elle/on prend · nous prenons · vous prenez · ils/elles prennent</div><div class="rule"><h3>boire · يشرب</h3>je bois · tu bois · il/elle/on boit · nous buvons · vous buvez · ils/elles boivent</div></div><div class="dialogue"><div class="model">Qu’est-ce que tu bois ? → Je bois du café.</div><div class="model">Vous mangez quoi ? → Nous mangeons des frites.</div><div class="model">Je prends le petit-déjeuner à 8h.</div></div><button class="speak" onclick="speak('Qu’est-ce que tu bois ? Je bois du café. Vous mangez quoi ? Nous mangeons des frites.')">🔊 استمع للنماذج</button></section>`;
 if(i===4)h=`<section class="card"><h2>🧩 Utiliser les articles partitifs</h2><div class="rule"><b>du</b> → Je mange du pain.<br><b>de la</b> → Elle boit de la soupe.<br><b>de l’</b> → Il prend de l’eau.<br><b>des</b> → Nous achetons des poires.</div><div class="mission"><b>قاعدة الكتاب:</b> أدوات التجزئة تُستخدم مع كمية غير محددة. بعد النفي تتحول إلى <b>de / d’</b>، وبعد ظروف الكمية مثل <b>beaucoup / un peu</b> نستخدم de / d’. وبعد أفعال المشاعر مثل aimer / adorer / préférer / détester تُستخدم أدوات التعريف.</div><div class="grid"><div class="v">J’aime le café.</div><div class="v">Il adore la salade.</div><div class="v">Elle préfère l’eau minérale.</div><div class="v">Ils détestent les desserts.</div></div></section>`;
 if(i===5)h=`<section class="card"><h2>❓ L’interrogation</h2><div class="grid"><div class="v"><b>Que / Qu’est-ce que ?</b><span>للسؤال عن مفعول به غير عاقل.</span><div class="model">Qu’est-ce que tu manges ?<br>Que manges-tu ?<br>Tu manges quoi ?</div></div><div class="v"><b>Combien de / d’</b><span>للسؤال عن العدد.</span><div class="model">Combien de repas tu prends ?<br>Combien d’eau il boit ?</div></div><div class="v"><b>À quelle heure ?</b><span>للسؤال عن وقت محدد.</span><div class="model">À quelle heure tu prends le dîner ?</div></div><div class="v"><b>Quand ?</b><span>للسؤال عن الوقت.</span><div class="model">Quand vous déjeunez ?</div></div><div class="v"><b>Pourquoi ?</b><span>للسؤال عن السبب.</span><div class="model">Pourquoi tu préfères le gâteau ?<br>Parce que c’est délicieux.</div></div></div></section>`;
 if(i===6)h=`<section class="card"><h2>📖 Documents — نصوص الكتاب</h2><h3>Document 1 · Ali et Pierre</h3><div class="reading"><b>Ali :</b> Salut Pierre ! À quelle heure tu prends le petit-déjeuner ?<br><b>Pierre :</b> Salut Ali ! Je prends le petit-déjeuner à sept heures, et toi ?<br><b>Ali :</b> Je prends le petit-déjeuner à huit heures. Je mange du pain et du fromage.<br><b>Pierre :</b> Moi, je mange un croissant et je bois du café.<br><b>Ali :</b> À midi, je déjeune avec ma famille. Nous mangeons du riz et du poulet.<br><b>Pierre :</b> Moi, je déjeune à la cantine. Je prends des légumes et de la viande.<br><b>Ali :</b> À quelle heure tu prends le goûter ?<br><b>Pierre :</b> À seize heures, je mange un fruit ou un sandwich et je bois du jus.<br><b>Ali :</b> Moi, je prends du jus et je mange des biscuits.<br><b>Pierre :</b> Et le dîner ?<br><b>Ali :</b> Je dîne à vingt heures avec ma famille.<br><b>Pierre :</b> Moi, je dîne à dix-neuf heures au restaurant.</div><h3>Document 2 · Sophie — Mes trois repas</h3><div class="reading"><b>Bonjour !</b><br>Je m’appelle Sophie. Je prends trois repas par jour. Le matin, à 7 heures, je prends mon petit-déjeuner à la maison. Je mange du pain avec du fromage et je bois du lait. À midi, à 13 heures, je déjeune avec mes parents à la maison. Je mange du poulet, du riz et une salade. Je bois de l’eau. Le soir, à 20 heures, je dîne avec ma famille. Je mange une soupe et du pain. Je bois du jus d’orange. Après le dîner, j’aime manger une glace au chocolat. C’est mon dessert préféré. Entre 16h et 17h, je mange des biscuits ou un fruit, c’est mon goûter préféré.</div><button class="speak" onclick="speak('Salut Pierre ! À quelle heure tu prends le petit-déjeuner ? Je prends le petit-déjeuner à sept heures.')">🔊 استمع إلى بداية الحوار</button></section>`;
 if(i===7)h=`<section class="card"><h2>💬 Situations — مواقف</h2>${[['ما وجبتك المفضلة؟','Quel est ton repas idéal ?'],['كم وجبة تتناول؟','Combien de repas prends-tu ?'],['في أي وقت تتناول العشاء؟','Ton dîner, c’est à quelle heure ?'],['اذكر أطعمة الغداء.','Je mange du poulet et du riz.'],['أين تتناول الغداء؟','En famille, chez moi.'],['كم وجبة تتناول في اليوم؟','Je prends trois repas.'],['ما الوجبة التي تتناولها مساءً؟','C’est le dîner.'],['ما رأيك في وجبة؟','Comment trouves-tu le repas ?'],['لا تحب المشروبات الباردة.','Ce n’est pas délicieux.']].map((x,n)=>`<div class="q"><b>${n+1}. ${x[0]}</b><div class="model">${x[1]}</div><button class="speak" onclick="speak('${x[1].replaceAll("'","\\'")}')">🔊 نطق</button></div>`).join('')}</section>`;
 if(i===8)h=`<section class="card"><h2>✍️ Production — الإنتاج</h2><div class="two"><div class="reading"><b>Mail 1</b><br>Quel repas prends-tu à midi ? Qu’est-ce que tu manges dans ce repas ?<hr>Je prends le déjeuner à midi. Au déjeuner, je mange du poulet et du riz.</div><div class="reading"><b>Mail 2</b><br>Qu’est-ce que tu bois au dîner ? À quelle heure prends-tu le dîner ?<hr>Je bois du jus d’orange au dîner. Je prends le dîner à 21 heures.</div></div><div class="mission"><b>Sujet A:</b> Parlez de vos repas quotidiens. Combien de repas ? Qu’est-ce que vous mangez ou buvez ? À quelle heure ?</div><textarea class="write" placeholder="Écrivez votre production ici..."></textarea><div class="mission"><b>Sujet B:</b> Vous êtes animateur à la chaîne « Nile TV ». Présentez votre repas préféré en utilisant : l’heure et le lieu de repas · le plat préféré · les boissons.</div><textarea class="write" placeholder="Présentez votre repas préféré..."></textarea></section>`;
 if(i===9)h=`<section class="card"><h2>🏆 Entraînement — من صفحات التمارين</h2><p class="muted">الأسئلة التالية مأخوذة من تمارين الدرس، مع تصحيح فوري.</p>${qs.map(qBlock).join('')}<h3>Complète</h3><div class="grid"><div class="v">À midi, nous prenons <input class="write small" placeholder="le repas"></div><div class="v">Le matin, je prends <input class="write small" placeholder="le repas"></div><div class="v">Le soir, ils prennent <input class="write small" placeholder="le repas"></div><div class="v">À 16 heures, il prend <input class="write small" placeholder="le repas"></div></div><h3>Correction de verbes</h3><div class="rule">1. Nous mangeons une salade. ✓<br>2. Il boit du thé. ✓<br>3. Ils prennent le dîner. ✓<br>4. Tu manges du pain ? ✓<br>5. Vous buvez du thé. ✓<br>6. Tu prends quel repas ? ✓</div><div class="metrics"><div class="metric"><b id="sc">${score}</b>صحيح</div><div class="metric"><b id="an">${answered}</b>تمت الإجابة</div><div class="metric"><b id="pct">0%</b>النتيجة</div></div></section>`;
 document.getElementById('view').innerHTML=h;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{i=+b.dataset.i;render()});document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.q,+b.dataset.a,b));
}
function answer(n,a,b){if(b.parentElement.dataset.done)return;b.parentElement.dataset.done='1';answered++;const ok=qs[n][2]===a;if(ok)score++;b.classList.add(ok?'ok':'bad');document.querySelectorAll(`[data-q="${n}"]`).forEach(x=>x.disabled=true);document.getElementById('f'+n).textContent=ok?'✓ إجابة صحيحة':'✗ الإجابة الصحيحة: '+qs[n][1][qs[n][2]];const sc=document.getElementById('sc');if(sc)sc.textContent=score;const an=document.getElementById('an');if(an)an.textContent=answered;const pct=document.getElementById('pct');if(pct)pct.textContent=Math.round(score/qs.length*100)+'%'}
document.getElementById('next').onclick=()=>{if(i<stages.length-1){i++;render()}else{alert('أكملت الدرس. راجع نتيجتك في التدريب.')}};document.getElementById('prev').onclick=()=>{if(i>0){i--;render()}};render();
