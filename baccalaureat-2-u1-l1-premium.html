if(stage===3)h='<section class="card"><h2>📘 Les verbes au présent — الأفعال في المضارع</h2><p class="muted">نستخدم هذه الأفعال للحديث عمّا نأكله أو نشربه أو نتناوله.</p><div class="two"><div class="rule"><h3>1. Manger — يأكل</h3><b>je mange · tu manges · il/elle/on mange</b><br><b>nous mangeons · vous mangez · ils/elles mangent</b><p>ملحوظة: نضيف e إلى صيغة nous للمحافظة على نطق g: mangeons.</p></div><div class="rule"><h3>2. Boire — يشرب</h3><b>je bois · tu bois · il/elle/on boit</b><br><b>nous buvons · vous buvez · ils/elles boivent</b><p>يتغير جذر الفعل بين المفرد والجمع: boi- / buv- / boiv-.</p></div><div class="rule"><h3>3. Prendre — يتناول</h3><b>je prends · tu prends · il/elle/on prend</b><br><b>nous prenons · vous prenez · ils/elles prennent</b><p>لاحظ: d موجودة في المفرد، وتختفي مع nous و vous، وتعود مضاعفة في prennent.</p></div></div><h3>Exemples — أمثلة</h3>'+model('Je mange du pain. · Nous mangeons des fruits.')+model('Elle boit du lait. · Ils boivent de l’eau.')+model('Tu prends le déjeuner à midi. · On prend le dîner le soir.')+'<button class="speak" onclick="speak(\'Je mange du pain. Nous mangeons des fruits. Elle boit du lait. Ils boivent de l’eau. Tu prends le déjeuner à midi.\')">🔊 استمع إلى الأمثلة</button></section>';
if(stage===4)h='<section class="card"><h2>🧩 Les articles partitifs — أدوات التجزئة</h2><p class="muted">نستخدمها مع الطعام والشراب للتعبير عن كمية غير محددة.</p><div class="grid"><div class="v"><b>DU</b><span>مذكر مفرد</span>'+model('Je mange du poisson.')+'</div><div class="v"><b>DE LA</b><span>مؤنث مفرد</span>'+model('On prend de la viande.')+'</div><div class="v"><b>DE L’</b><span>قبل حرف متحرك أو h صامتة</span>'+model('Il boit de l’eau.')+'</div><div class="v"><b>DES</b><span>جمع</span>'+model('Ils achètent des pâtes.')+'</div></div><h3>قواعد مهمة جدًا</h3><div class="rule"><b>1) بعد النفي ne … pas</b>'+model('Je mange du riz. → Je ne mange pas de riz.')+model('J’achète des ananas. → Je n’achète pas d’ananas.')+'تتحول أدوات التجزئة غالبًا إلى de أو d’ بعد النفي إذا كان النفي واقعًا على فعل الأكل أو الشرب نفسه.</div><div class="rule"><b>استثناء مهم: النفي مع aimer + infinitif</b><p>إذا كان النفي واقعًا على aimer أو adorer أو préférer، وتبعها مصدر مثل prendre أو boire، تبقى أداة التجزئة كما هي.</p><div class="model">J’aime prendre du lait. → Je n’aime pas prendre du lait.</div></div><div class="rule"><b>2) بعد ظروف الكمية</b><p>beaucoup de · un peu de · assez de · trop de</p>'+model('Je mange beaucoup de pommes.')+'لا نستخدم des بعد beaucoup؛ الصحيح beaucoup de.</div><div class="rule"><b>3) بعد أفعال التفضيل والمشاعر</b><p>aimer · adorer · préférer · détester</p>'+model('J’aime le café. · J’adore cette glace. · Je préfère le poisson.')+'نستخدم أداة التعريف le / la / l’ / les، وليس أداة التجزئة.</div><div class="rule"><b>4) مع الكمية المحددة أو المعدودة</b>'+model('J’achète un gâteau. · Je prends une pizza.')+'نستخدم un / une مع الاسم المفرد المعدود.</div><div class="note">احفظ الفرق: Je bois <b>du</b> lait. / Je ne bois pas <b>de</b> lait. / J’aime <b>le</b> lait. / Je bois beaucoup <b>de</b> lait.</div></section>';
if(stage===5)h='<section class="card"><h2>❓ L’interrogation — أدوات الاستفهام</h2><div class="rule"><h3>1. Qui ? — مَن؟</h3><p>للسؤال عن فاعل عاقل.</p>'+model('Qui aime la banane ? → Mona aime la banane.')+model('Qui prend des croissants ? → Marc et Alex prennent des croissants.')+'إذا جاء الفعل بعد Qui مباشرة فلا نضع حرف s في نهايته بسبب الفاعل المفرد.</div><div class="rule"><h3>2. Qu’est-ce que ? / Que ? / Quoi ? — ماذا؟</h3><p>للسؤال عن مفعول به غير عاقل.</p>'+model('Qu’est-ce que tu prends au petit-déjeuner ?')+model('Que prends-tu au petit-déjeuner ?')+model('Tu prends quoi au petit-déjeuner ?')+'يمكن أن تأتي صيغة Que مع القلب بين الفعل والضمير، بينما Qu’est-ce que تأتي قبل الجملة العادية.</div><div class="rule"><h3>3. Combien de / d’ ? — كم؟</h3>'+model('Combien de repas prends-tu par jour ? → Je prends trois repas par jour.')+model('Combien d’eau bois-tu ? → Je bois deux verres d’eau.')+'</div><div class="rule"><h3>4. À quelle heure ? — في أي ساعة؟</h3>'+model('À quelle heure tu prends le petit-déjeuner ? → À 7 h 30.')+'</div><div class="rule"><h3>5. Quand ? — متى؟</h3>'+model('Quand tu prends le dîner ? → Je prends le dîner le soir.')+'</div><div class="rule"><h3>6. Pourquoi ? — لماذا؟</h3>'+model('Pourquoi tu aimes déjeuner en famille ? → Parce que j’aime passer du temps en famille.')+'يمكن أن تكون الإجابة: Parce que + جملة، أو Pour + مصدر.</div><div class="rule"><h3>7. Quel / Quelle / Quels / Quelles ? — ما / أي؟</h3><p>تتغير حسب نوع الاسم وعدده.</p>'+model('Quel aliment tu aimes ? → J’aime le fromage.')+model('Quelle boisson tu aimes ? → J’aime le jus d’orange.')+'</div></section>';
if(stage===6)h='<section class="card"><h2>👥 Le pronom sujet « On » — ضمير الفاعل On</h2><p>يُستخدم On بمعنى: نحن، الناس، أو المرء/الشخص بوجه عام.</p><div class="rule"><h3>On = Nous / Les gens / Les personnes</h3>'+model('Nous allons au restaurant. = On va au restaurant.')+model('Les gens vont au restaurant. = On va au restaurant.')+'يُعامل On في تصريف الفعل معاملة il / elle، أي المفرد الغائب.</div><div class="note">حتى لو كان المعنى «نحن»، يظل الفعل بعد On مفردًا: On est contents. وليس On sommes contents.</div><h3>تطبيق</h3>'+model('Sami et moi, on est contents.')+model('On mange à midi. · On boit du jus.')+'</section>';
if(stage===7)h='<section class="card"><h2>🔊 Prononciation et orthographe — النطق والإملاء</h2><div class="rule"><h3>Le son [w] — صوت قريب من «و»</h3><p>يظهر غالبًا في التركيب <b>oi</b>.</p><div class="grid">'+['moi','boire','soir','voir','poire','boisson','poisson','week-end','kiwi','sandwich','jouer','oui'].map(x=>'<div class="v"><b>'+x+'</b><button class="speak" onclick="speak(\''+x+'\')">🔊</button></div>').join('')+'</div><p>أمثلة: moi · boire · soir · poisson.</p></div><div class="rule"><h3>Le son [ɥ] — صوت فرنسي خاص</h3><p>يظهر غالبًا في التركيب <b>ui</b>، ويبدأ بصوت [ɥ] ثم [i].</p><div class="grid">'+['nuit','fruit','suis','lui','puis','huit','pluie'].map(x=>'<div class="v"><b>'+x+'</b><button class="speak" onclick="speak(\''+x+'\')">🔊</button></div>').join('')+'</div><p>تدرّب على الفرق بين: <b>moi</b> [w] و <b>nuit</b> [ɥ].</p></div><h3>جمل للتكرار</h3>'+model('Quel fruit tu aimes et pourquoi ?')+model('Chaque soir, j’aime manger une poire, parce que c’est délicieux.')+'<button class="speak" onclick="speak(\'Quel fruit tu aimes et pourquoi ? Chaque soir, j’aime manger une poire, parce que c’est délicieux.\')">🔊 استمع وكرّر</button><div class="note">تذكّر: oi غالبًا [wa]، أما ui فصوتها [ɥi]. استمع إلى الكلمة ثم كررها ببطء.</div></section>';
if(stage===8)h='<section class="card"><h2>📖 Compréhension et situations — الفهم والمواقف</h2><h3>Les repas — وجبات الطعام</h3><div class="grid">'+[['Le petit-déjeuner','Le matin'],['Le déjeuner','À midi'],['Le goûter','L’après-midi'],['Le dîner','Le soir']].map(x=>'<div class="v"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')+'</div><h3>Dialogue — حوار قصير</h3><div class="reading"><b>Salut !</b><br>À quelle heure tu prends ton petit-déjeuner ?<br><b>Je prends mon petit-déjeuner à 7 h.</b><br>Qu’est-ce que tu manges au petit-déjeuner ?<br><b>Je mange du fromage et du pain.</b><br>Et qu’est-ce que tu bois ?<br><b>Je bois du lait.</b></div><h3>Questions et réponses</h3><div class="reading"><b>Combien de repas tu prends par jour ?</b><br>Je prends trois repas par jour.<hr><b>Quel est ton repas préféré ?</b><br>Mon repas préféré est le déjeuner.</div><button class="speak" onclick="speak(\'Salut ! À quelle heure tu prends ton petit-déjeuner ? Je prends mon petit-déjeuner à sept heures. Qu’est-ce que tu manges au petit-déjeuner ? Je mange du fromage et du pain.\')">🔊 استمع إلى الحوار</button></section>';
if(stage===9)h='<section class="card"><h2>✍️ Production écrite — التعبير الكتابي</h2><h3>Mail 1 — الحديث عن الفطور</h3><div class="reading"><b>Question :</b> À quelle heure tu prends ton petit-déjeuner ? Qu’est-ce que tu manges au petit-déjeuner ?<hr><b>Réponse :</b><br>Salut !<br>Je prends mon petit-déjeuner à 7 h. Je mange du fromage et du pain.<br>À plus !</div><h3>Mail 2 — عدد الوجبات والوجبة المفضلة</h3><div class="reading"><b>Question :</b> Combien de repas tu prends par jour ? Quel est ton repas préféré ?<hr><b>Réponse :</b><br>Salut !<br>Je prends trois repas par jour. Mon repas préféré est le déjeuner.<br>À plus !</div><h3>Sujet 1 — Parlez de vos repas quotidiens</h3><div class="reading">Je prends trois repas par jour. Au petit-déjeuner, je mange des fèves, du fromage et du pain et je bois du café. Au déjeuner, je mange de la viande avec des pâtes et de la salade. Et après, je prends de la glace comme dessert. Le soir, au dîner, je prends un yaourt et je bois un jus d’orange.</div><h3>Sujet 2 — Parlez de votre repas principal</h3><div class="reading">Salut,<br>Le déjeuner, c’est mon repas principal. Je prends ce repas à midi avec ma famille. Au déjeuner, je prends du poisson avec du riz. Comme boisson, je bois un jus d’orange. Comme dessert, je prends du gâteau.</div><h3>اكتب إجابتك</h3><textarea class="write" placeholder="Écris ici ton paragraphe en français..."></textarea><div class="note">تأكد من ذكر: اسم الوجبة، الوقت، المكان أو الأشخاص، الأطعمة والمشروبات، ثم راجع أدوات التجزئة وتصريف الأفعال.</div></section>';
if(stage===10)h='<section class="card"><h2>🏆 Entraînement — اختبار شامل على الدرس</h2><p class="muted">25 سؤالًا تغطي المفردات، أوقات الوجبات، تصريف الأفعال، أدوات التجزئة، الاستفهام، On والنطق. تظهر الإجابة الصحيحة وسببها بعد الاختيار.</p><div id="quiz">'+qs.map((q,n)=>'<div class="q"><b>'+ (n+1)+'. '+q[0]+'</b><div class="opts">'+q[1].map((o,j)=>'<button class="opt" data-q="'+n+'" data-a="'+j+'">'+o+'</button>').join('')+'</div><div class="feedback" id="f'+n+'"></div></div>').join('')+'</div><div class="mission"><b>نتيجتك:</b> <span id="score">0</span> / '+qs.length+' — تمت الإجابة عن <span id="count">0</span> سؤال.</div><button class="btn alt" onclick="resetQuiz()">إعادة الاختبار</button></section>';
document.getElementById('view').innerHTML=h;
document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stage=+b.dataset.stage;render()});
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>answer(b));
}
function answer(b){const n=+b.dataset.q;if(answered.has(n))return;answered.add(n);const q=qs[n],a=+b.dataset.a,ok=a===q[2];if(ok)score++;document.querySelectorAll('[data-q="'+n+'"]').forEach(x=>{x.disabled=true;if(+x.dataset.a===q[2])x.classList.add('ok')});if(!ok)b.classList.add('bad');document.getElementById('f'+n).textContent=(ok?'✓ إجابة صحيحة. ':'✗ الإجابة الصحيحة: '+q[1][q[2]]+'. ')+q[3];document.getElementById('score').textContent=score;document.getElementById('count').textContent=answered.size}
function resetQuiz(){score=0;answered.clear();render()}
document.getElementById('prev').onclick=()=>{stage=Math.max(0,stage-1);render();window.scrollTo({top:0,behavior:'smooth'})};
document.getElementById('next').onclick=()=>{stage=Math.min(stages.length-1,stage+1);render();window.scrollTo({top:0,behavior:'smooth'})};
render();
</script>
</body></html>
