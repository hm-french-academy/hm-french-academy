<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14264a"><title>HM Academy | الكورس</title><link rel="stylesheet" href="css/premium-shell.css?v=20260818-coursedetail1"><link rel="stylesheet" href="css/hm-fonts.css?v=20260818-typography1"><style>.detail{max-width:1000px;margin:auto;padding:28px 18px 60px}.head{background:linear-gradient(135deg,#14264a,#2563eb);color:#fff;border-radius:28px;padding:28px;margin-bottom:20px}.head .icon{font-size:42px}.head h1{margin:8px 0}.head p{margin:0;color:#e7eefc;line-height:1.9}.unit-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.unit{background:#fff;border:1px solid #e2e8f2;border-radius:20px;padding:18px}.unit-num{font-size:12px;color:#2563eb;font-weight:950}.unit h2{margin:5px 0;color:#14264a;font-size:18px}.unit p{margin:0;color:#68758b;line-height:1.7}.review{margin-top:20px;padding:16px 18px;border-radius:18px;background:#f8fbff;border:1px solid #dfe7f3;color:#59677e;line-height:1.8}@media(max-width:600px){.detail{padding:20px 12px 45px}.unit-grid{grid-template-columns:1fr}}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="index.html">الرئيسية</a><a href="course.html">المناهج الدراسية</a><a href="levels.html">مستويات اللغة</a><a href="language-courses.html">مسارات اللغة والكورسات</a><a href="library.html">المكتبة</a><a href="settings.html">الإعدادات</a></nav><div class="hm-tools"><select class="hm-lang" data-lang-select aria-label="Display language"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select></div></header><main class="detail"><section class="head"><div class="icon" id="icon">🎙️</div><h1 id="title">الكورس</h1><p id="desc"></p></section><section class="unit-grid" id="units"></section><div class="review" id="review">هذه بنية أولية للمسار التعليمي. المادة التعليمية التفصيلية والأمثلة والأنشطة ستُراجع قبل اعتمادها النهائي داخل HM Academy.</div></main><footer class="hm-footer"><div class="hm-footer-brand"><strong>HM Academy</strong><span>French Language Education</span><small>© 2026</small></div></footer><script src="scripts/i18n.js?v=20260818-coursedetail1"></script><script src="scripts/brand.js?v=20260818-coursedetail1"></script><script>(async function(){const r=await fetch('data/language-courses.json?'+Date.now(),{cache:'no-store'});const d=await r.json();const id=new URLSearchParams(location.search).get('id')||'phonetics';const c=d.specializedCourses.find(x=>x.id===id)||d.specializedCourses[0];const T={ar:{review:'هذه بنية أولية للمسار التعليمي. المادة التعليمية التفصيلية والأمثلة والأنشطة ستُراجع قبل اعتمادها النهائي داخل HM Academy.'},fr:{review:'Cette structure est une base de parcours. Le contenu détaillé, les exemples et les activités seront révisés avant validation finale dans HM Academy.'},en:{review:'This is the initial course structure. Detailed teaching content, examples and activities will be reviewed before final approval in HM Academy.'}};function lang(){return window.HMLanguage?.get?.()||'ar'}function render(){const l=lang();document.documentElement.lang=l;document.getElementById('icon').textContent=c.icon;document.getElementById('title').textContent=c.title[l]||c.title.ar;document.getElementById('desc').textContent=c.description[l]||c.description.ar;document.getElementById('review').textContent=T[l].review;document.getElementById('units').innerHTML=c.units.map((u,i)=>'<article class="unit"><div class="unit-num">'+String(i+1).padStart(2,'0')+'</div><h2>'+u.replaceAll('-',' ')+'</h2><p>'+({'ar':'سيتم بناء الدرس والأنشطة والأمثلة بعد مراجعة المادة التعليمية.','fr':'Leçon, activités et exemples à construire après révision pédagogique.','en':'Lesson, activities and examples to be built after educational review.'}[l])+'</p></article>').join('')}render();window.addEventListener('hm:languagechange',render)})();</script></body></html>
