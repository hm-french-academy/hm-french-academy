<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HM Academy | Au marché · الصف السادس</title>
<style>
html,body{margin:0;padding:0;background:#f3f6ff;overflow-x:hidden}
#lesson{display:block;width:100%;border:0;height:0;min-height:0;background:#fff;overflow:hidden}
</style>
</head>
<body>
<iframe id="lesson" src="grade6-au-marche-v5.html" title="Au marché"></iframe>
<script>
const labels={'Le chariot':'عربة التسوق','La balance':'الميزان','La caisse':'صندوق الدفع','La vitrine':'الفاترينة','Le panier':'السلة','Le sachet':'الكيس',"L'argent":'المال','Le vendeur':'البائع','La baguette':'الخبز الفرنسي','Le pain':'الخبز','Le croissant':'الكرواسون','Le gâteau':'الكعكة','La viande':'اللحوم','Le poulet':'الدجاج','Le fromage':'الجبن','Le lait':'اللبن','Le beurre':'الزبدة','Le poisson':'السمك','La farine':'الدقيق',"L'œuf":'البيض','La crème':'الكريمة','Le sucre':'السكر','Le sel':'الملح','Le vinaigre':'الخل','La pomme':'التفاح','La banane':'الموز','La fraise':'الفراولة',"L'orange":'البرتقال','La poire':'الكمثرى','La cerise':'الكريز','Le raisin':'العنب','Le citron':'الليمون','La carotte':'الجزر','La tomate':'الطماطم','Le concombre':'الخيار','La pomme de terre':'البطاطس',"L'aubergine":'الباذنجان','Le chou':'الكرنب','Le chou-fleur':'القرنبيط'};
const fixedEmoji={'La balance':'⚖️','Le sachet':'🛍️'};
function emojiUrl(emoji){return 'https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/'+[...emoji.trim()].map(c=>c.codePointAt(0).toString(16)).join('-')+'.svg'}
function frenchSpeak(doc,text,button){const t=String(text||'').trim();if(!t)return;const s=doc.defaultView.speechSynthesis;if(!s||!doc.defaultView.SpeechSynthesisUtterance){if(button)button.textContent='⚠️ النطق غير متاح';return}s.cancel();const u=new doc.defaultView.SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;u.pitch=1;u.volume=1;const voices=s.getVoices?s.getVoices():[];const fr=voices.find(v=>/^fr(-|_)/i.test(v.lang));if(fr)u.voice=fr;const old=button?button.innerHTML:'';if(button)button.innerHTML='🔊 جاري النطق…';u.onend=()=>{if(button)button.innerHTML=old||'🔊 استمع'};u.onerror=()=>{if(button)button.innerHTML='⚠️ حاول مرة أخرى'};s.resume();s.speak(u)}
function enhance(doc){if(!doc||!doc.body)return;const style=doc.createElement('style');style.textContent=`html,body{overflow-x:hidden!important}.word .visual{height:136px!important;min-height:0!important;padding:8px!important;background:linear-gradient(135deg,#f8fbff,#f2f8ff)!important;overflow:hidden!important;border:1px solid #dfe7f4!important;border-radius:18px!important;display:grid!important;place-items:center!important}.word .visual img{width:92px!important;height:92px!important;object-fit:contain!important;display:block!important}.word .visual-label{display:none!important}.word{border-radius:22px!important;padding:13px!important;min-width:0!important}.word .say{min-height:44px!important;padding:10px 13px!important;touch-action:manipulation!important;-webkit-tap-highlight-color:transparent!important}.word .say:active{transform:scale(.97)!important}@media(max-width:520px){main{padding-left:8px!important;padding-right:8px!important}.view{padding:11px!important}.word .visual{height:116px!important}.word .visual img{width:76px!important;height:76px!important}.word{padding:10px!important}.word .fr{font-size:18px!important}.word .ex{font-size:13px!important}.word .say{width:100%!important;margin-top:8px!important}.grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:9px!important}}`;doc.head.appendChild(style);
function applyVisuals(){doc.querySelectorAll('.word').forEach(card=>{const fr=card.querySelector('.fr'),box=card.querySelector('.visual');if(!fr||!box)return;const key=fr.textContent.trim();const emoji=fixedEmoji[key]||box.textContent.trim();if(!emoji)return;const label=labels[key]||card.querySelector('.ar')?.textContent?.trim()||key;if(box.dataset.visualEnhanced===key)return;box.innerHTML='<img alt="'+label.replace(/"/g,'&quot;')+'" src="'+emojiUrl(emoji)+'">';box.dataset.visualEnhanced=key})}
function bindSpeech(){doc.querySelectorAll('.say').forEach(btn=>{if(btn.dataset.speechBound)return;const card=btn.closest('.word');if(!card)return;const buttons=card.querySelectorAll('.say'),fr=card.querySelector('.fr'),ex=card.querySelector('.ex');const text=btn===buttons[0]?(fr?fr.textContent:''):(ex?ex.textContent:'');btn.dataset.speechBound='1';btn.removeAttribute('onclick');btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();frenchSpeak(doc,text,btn)},true)})}
function apply(){applyVisuals();bindSpeech()}apply();new MutationObserver(apply).observe(doc.body,{childList:true,subtree:true})}
const frame=document.getElementById('lesson');frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;enhance(doc);const resize=()=>{try{frame.style.height=Math.max(doc.documentElement.scrollHeight,doc.body?doc.body.scrollHeight:0)+'px'}catch(e){}};resize();if(window.ResizeObserver)new ResizeObserver(resize).observe(doc.documentElement);else setInterval(resize,700)}catch(e){console.error(e)}});
</script>
</body>
</html>
