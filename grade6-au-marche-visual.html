<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Au marché · الصف السادس</title><style>html,body{margin:0;padding:0;background:#f3f6ff;overflow-x:hidden}#lesson{display:block;width:100%;border:0;height:0;min-height:0;background:#fff;overflow:hidden}</style></head><body><iframe id="lesson" src="grade6-au-marche-premium.html" title="Au marché"></iframe><script>const frame=document.getElementById('lesson');const enhanceVocabulary=doc=>{try{const win=doc.defaultView;const cards=doc.getElementById('cards');const audio=doc.getElementById('audio');if(!cards||!audio)return;const old=[...cards.children];const byWord={};old.forEach(el=>{const w=el.querySelector('.fr')?.textContent?.trim();if(w)byWord[w]=el});const data=[['Le chariot','عربة التسوق'],['La balance','الميزان'],['La caisse','صندوق الدفع'],['La vitrine','الفاترينة'],['Le panier','السلة'],['Le sachet','الكيس'],["L’argent",'الفلوس'],['Le vendeur / la vendeuse','البائع / البائعة'],['La baguette','العِيش الفرنسي'],['Le pain','العيش'],['Le croissant','الكرواسون'],['Le gâteau','التورتة'],['La viande','اللحمة'],['Le poulet','الفراخ'],['Le fromage','الجبنة'],['Le lait','اللبن'],['Le beurre','الزبدة'],['Le poisson','السمك'],['La farine','الدقيق'],["L’œuf",'البيض'],['La crème','الكريمة'],['Le sucre','السكر'],['Le sel','الملح'],['Le vinaigre','الخل'],['La pomme','التفاحة'],['La banane','الموزة'],['La fraise','الفراولة'],["L’orange",'البرتقالة'],['La poire','الكمثرى'],['La cerise','الكرز'],['Le raisin','العنب'],['Le citron','الليمون'],['La carotte','الجزر'],['La tomate','الطماطم'],['Le concombre','الخيار'],['La pomme de terre','البطاطس'],["L’aubergine",'الباذنجان'],['Le chou','الكرنب'],['Le chou-fleur','القرنبيط']];const ex={"La vitrine":'La vitrine est propre.',"L’argent":'J’ai de l’argent.',"Le vendeur / la vendeuse":'Le vendeur est au marché.',"Le croissant":'Je voudrais un croissant.',"Le gâteau":'Je voudrais un gâteau.',"Le poulet":'J’achète du poulet.',"Le beurre":'J’achète du beurre.',"Le poisson":'J’achète du poisson.',"La farine":'Je voudrais de la farine.',"L’œuf":'Je prends un œuf.',"La crème":'Je prends de la crème.',"Le sucre":'Je prends du sucre.',"Le sel":'Je prends du sel.',"Le vinaigre":'Je prends du vinaigre.',"La fraise":'Je voudrais des fraises.',"L’orange":'Je voudrais une orange.',"La poire":'Je voudrais une poire.',"La cerise":'Je voudrais des cerises.',"Le raisin":'Je voudrais du raisin.',"Le citron":'Je voudrais un citron.',"Le concombre":'Je prends un concombre.',"La pomme de terre":'Je prends des pommes de terre.',"L’aubergine":'Je prends une aubergine.',"Le chou":'Je prends du chou.',"Le chou-fleur":'Je prends du chou-fleur.'};const notes={"Le chariot":'ch تُنطق ش، و t الأخيرة لا تُنطق: شَارْيو.',"La balance":'c تُنطق س، والنهاية ce خفيفة: بالانس.',"La caisse":'ai تُنطق مثل é تقريبًا، و ss تُنطق س: كيس.',"La vitrine":'vi تُنطق ڤي، و tr متصلة: ڤيترين.',"Le panier":'الـ er في النهاية تُنطق é: بانييه.',"Le sachet":'ch تُنطق ش، و t الأخيرة صامتة: ساشيه.',"L’argent":'ج في الجملة الفرنسية هنا صوتها ژ، و t الأخيرة صامتة: أَرژان.',"Le vendeur / la vendeuse":'v تُنطق ڤ، و eu صوت فرنسي بين الضمة والكسرة: ڤوندور / ڤوندوز.',"La baguette":'gu تُنطق ج، و ette قصيرة: باجيت.',"Le pain":'ain صوت أنفي؛ لا تُنطق n منفصلة: بان.',"Le croissant":'oi تُنطق وا، و an صوت أنفي: كرواسَان.',"Le gâteau":'â طويل نسبيًا، و eau تُنطق o: جاتو.',"La viande":'ie تُنطق يي تقريبًا، و d الأخيرة صامتة: ڤياند.',"Le poulet":'ou تُنطق و، و t الأخيرة صامتة: بوليه.',"Le fromage":'ge في النهاية تُنطق ژ: فرُماژ.',"Le lait":'ai تُنطق é تقريبًا، و t صامتة: ليه.',"Le beurre":'eu صوت فرنسي دائري؛ r في النهاية فرنسية: بور.',"Le poisson":'oi تُنطق وا، و ss تُنطق س: بواسون.',"La farine":'r فرنسية، و ine في النهاية تُنطق إن: فارين.',"L’œuf":'œu صوت فرنسي قريب من «أُ» مع تدوير الشفتين، و f تُنطق: أُف.',"La crème":'cr متصلة، و è مفتوحة: كريم.',"Le sucre":'su تُنطق سُ، و cr متصلة، و e الأخيرة صامتة: سوكر.',"Le sel":'e قصيرة مفتوحة، و l واضحة: سِل.',"Le vinaigre":'vi ڤي، و ai تُنطق é تقريبًا، و gre في النهاية خفيفة: ڤينيغر.',"La pomme":'o مفتوحة، و mm واضحة، و e الأخيرة صامتة: بوم.',"La banane":'a واضحة، و e الأخيرة صامتة: بانان.',"La fraise":'ai تُنطق é تقريبًا، و s بين الحركات تُنطق ز: فريز.',"L’orange":'an صوت أنفي، و ge تُنطق ژ: أورانژ.',"La poire":'oi تُنطق وا، و r فرنسية: بوار.',"La cerise":'c قبل e تُنطق س، و s بين الحركات تُنطق ز: سُريز.',"Le raisin":'ai تُنطق é تقريبًا، و ain أنفي: ريزان.',"Le citron":'c قبل i تُنطق س، و on صوت أنفي: سيتغون.',"La carotte":'c تُنطق ك، و o مفتوحة، و e الأخيرة صامتة: كاروت.',"La tomate":'o مفتوحة، و t واضحة، و e الأخيرة صامتة: تومات.',"Le concombre":'c الأولى ك، و om صوت أنفي، و e الأخيرة صامتة: كونكونبر.',"La pomme de terre":'pomme = بوم، و de تُنطق دُ، و terre فيها r فرنسية: بوم دُ تير.',"L’aubergine":'au تُنطق o، و ge تُنطق ژ، و ine = إن: أوبيرژين.',"Le chou":'ch تُنطق ش، و ou تُنطق و: شو.',"Le chou-fleur":'ch = ش، و fleur فيها eu صوت فرنسي: شو فلور.'};const iconIndex=Object.fromEntries(data.map(([word],i)=>[word,i]));const iconFor=word=>'<svg viewBox="0 0 100 80" aria-hidden="true" focusable="false"><use href="grade6-au-marche-icons.svg#i'+iconIndex[word]+'"></use></svg>';const speak=t=>{try{win.speak(t)}catch(e){if(win.speechSynthesis){win.speechSynthesis.cancel();const u=new win.SpeechSynthesisUtterance(t);u.lang='fr-FR';win.speechSynthesis.speak(u)}}};const makeCard=([word,ar])=>{const oldCard=byWord[word];if(oldCard){const el=oldCard.cloneNode(true);const p=el.querySelector('.muted');if(p&&!el.querySelector('.exampleSpeak')){const b=doc.createElement('button');b.type='button';b.className='speak exampleSpeak';b.textContent='🔊 اسمع المثال';b.setAttribute('aria-label','استمع إلى المثال '+(p.textContent||''));b.onclick=()=>speak(p.textContent||'');p.after(b)}const visual=el.querySelector('.visual');if(visual)visual.innerHTML=iconFor(word);return el}const article=doc.createElement('article');article.className='card';const sentence=ex[word]||'';article.innerHTML='<div class="visual">'+iconFor(word)+'</div><div class="fr">'+word+'</div><div class="ar">'+ar+'</div><p class="muted">'+sentence+'</p><button class="speak" type="button">🔊 اسمع الكلمة</button><button class="speak exampleSpeak" type="button">🔊 اسمع المثال</button>';article.querySelector('.speak').onclick=()=>speak(word);article.querySelector('.exampleSpeak').onclick=()=>speak(sentence);return article};const frag=doc.createDocumentFragment();data.forEach(v=>frag.appendChild(makeCard(v)));cards.replaceChildren(frag);const audioFrag=doc.createDocumentFragment();data.forEach(([word,ar])=>{const article=doc.createElement('article');article.className='card audioCard';const note=notes[word]||'';article.innerHTML='<div class="fr">'+word+'</div><div class="ar">'+ar+'</div><div class="pronunciationNote"><strong>ملاحظة النطق:</strong> '+note+'</div><div class="audioBtns"><button class="speak" type="button">▶ الكلمة</button></div>';article.querySelector('button').onclick=()=>speak(word);audioFrag.appendChild(article)});audio.replaceChildren(audioFrag)}catch(e){console.error('Vocabulary enhancement failed',e)}};frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;const resize=()=>{try{frame.style.height=Math.max(doc.documentElement.scrollHeight,doc.body?doc.body.scrollHeight:0)+'px'}catch(e){}};resize();enhanceVocabulary(doc);if(window.ResizeObserver)new ResizeObserver(resize).observe(doc.documentElement);else setInterval(resize,700)}catch(e){console.error(e)}});</script></body></html>
