function svg(icon,label){return `<svg viewBox="0 0 420 230" role="img" aria-label="${label}" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf3ff"/><stop offset="1" stop-color="#f2fbfa"/></linearGradient></defs><rect x="5" y="5" width="410" height="220" rx="28" fill="url(#bg)"/><circle cx="210" cy="102" r="68" fill="#fff" stroke="#dce5f4" stroke-width="4"/><text x="210" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="78" font-weight="800" fill="#2556d8">${icon}</text><text x="210" y="198" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#173a82">${label}</text></svg>`}
function enhance(doc){if(!doc||!doc.body)return;const style=doc.createElement('style');style.textContent=`html,body{overflow-x:hidden!important}.word .visual{height:124px!important;min-height:0!important;padding:0!important;background:#f8faff!important;overflow:hidden!important;border:1px solid #dfe7f4!important}.word .visual svg{width:100%;height:100%;display:block}.word{border-radius:22px!important;padding:13px!important;min-width:0!important}.word .say{min-height:42px!important;padding:10px 13px!important;touch-action:manipulation!important;-webkit-tap-highlight-color:transparent}.word:hover{transform:translateY(-4px)!important;box-shadow:0 16px 30px #14264a18!important}@media(max-width:520px){main{padding-left:8px!important;padding-right:8px!important}.view{padding:11px!important}.word .visual{height:108px!important}.word{padding:10px!important}.word .fr{font-size:18px!important}.word .ex{font-size:13px!important}.word .say{width:100%!important;margin-top:8px!important}.grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:9px!important}}`;doc.head.appendChild(style);function apply(){doc.querySelectorAll('.word').forEach(card=>{const fr=card.querySelector('.fr');if(!fr)return;const key=fr.textContent.trim();const data=map[key];if(!data)return;const box=card.querySelector('.visual');if(box&&!box.dataset.visualEnhanced){box.innerHTML=svg(data[0],data[1]);box.dataset.visualEnhanced='1'}})}apply();new MutationObserver(apply).observe(doc.body,{childList:true,subtree:true});
const originalSpeak=doc.defaultView.speak;doc.defaultView.speak=function(text){const t=String(text||'').trim();if(!t)return;const st=doc.getElementById('pronStatus');if(st)st.textContent='🔊 جاري تشغيل النطق الفرنسي…';let audio=null;try{audio=new doc.defaultView.Audio('https://translate.google.com/translate_tts?ie=UTF-8&tl=fr&client=gtx&q='+encodeURIComponent(t));audio.preload='auto';audio.volume=1;const p=audio.play();if(p&&typeof p.then==='function'){p.then(()=>{if(st)st.textContent='🔊 يتم تشغيل النطق…'}).catch(()=>{try{const s=doc.defaultView.speechSynthesis;if(!s){if(st)st.textContent='⚠️ تعذر تشغيل النطق.';return}s.cancel();const u=new doc.defaultView.SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;u.pitch=1;u.volume=1;u.onstart=()=>{if(st)st.textContent='🔊 يتم تشغيل النطق…'};u.onend=()=>{if(st)st.textContent='تم تشغيل النطق.'};u.onerror=()=>{if(st)st.textContent='⚠️ تعذر تشغيل النطق.'};s.speak(u)}catch(e){if(st)st.textContent='⚠️ تعذر تشغيل النطق.'}})}else if(st)st.textContent='🔊 يتم تشغيل النطق…';return}catch(e){}try{const s=doc.defaultView.speechSynthesis;s.cancel();const u=new doc.defaultView.SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;u.volume=1;s.speak(u)}catch(e){if(st)st.textContent='⚠️ تعذر تشغيل النطق.'}};
}
const frame=document.getElementById('lesson');frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;enhance(doc);const resize=()=>{try{const h=Math.max(doc.documentElement.scrollHeight,doc.body?doc.body.scrollHeight:0);frame.style.height=h+'px'}catch(e){}};resize();if(window.ResizeObserver){new ResizeObserver(resize).observe(doc.documentElement)}else{setInterval(resize,1000)}}catch(e){}});
</script></body></html>
