<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Au marché · الصف السادس</title><style>html,body{margin:0;padding:0;background:#f3f6ff}#lesson{display:block;width:100%;border:0;min-height:100vh;background:#fff}</style></head><body><iframe id="lesson" src="grade6-au-marche-v5.html" title="Au marché"></iframe><script>
const map={
'Le chariot':['🛒','عربة التسوق'],'La balance':['⚖','الميزان'],'La caisse':['▣','صندوق الدفع'],'La vitrine':['▤','الفاترينة'],'Le panier':['🧺','السلة'],'Le sachet':['▱','الكيس'],"L'argent":['€','المال'],'Le vendeur':['●','البائع'],'La baguette':['🥖','الخبز الفرنسي'],'Le pain':['🍞','الخبز'],'Le croissant':['◜','الكرواسون'],'Le gâteau':['◆','الكعكة'],'La viande':['◆','اللحوم'],'Le poulet':['●','الدجاج'],'Le fromage':['◆','الجبن'],'Le lait':['◡','اللبن'],'Le beurre':['▰','الزبدة'],'Le poisson':['◓','السمك'],'La farine':['▤','الدقيق'],"L'œuf":['●','البيض'],'La crème':['◡','الكريمة'],'Le sucre':['◇','السكر'],'Le sel':['▥','الملح'],'Le vinaigre':['◉','الخل'],'La pomme':['●','التفاح'],'La banane':['◜','الموز'],'La fraise':['✦','الفراولة'],"L'orange":['●','البرتقال'],'La poire':['◐','الكمثرى'],'La cerise':['●●','الكريز'],'Le raisin':['●●●','العنب'],'Le citron':['◒','الليمون'],'La carotte':['◢','الجزر'],'La tomate':['●','الطماطم'],'Le concombre':['▭','الخيار'],'La pomme de terre':['●','البطاطس'],"L'aubergine":['◖','الباذنجان'],'Le chou':['✤','الكرنب'],'Le chou-fleur':['✿','القرنبيط']};
function svg(icon,label){return `<svg viewBox="0 0 420 230" role="img" aria-label="${label}" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf3ff"/><stop offset="1" stop-color="#f2fbfa"/></linearGradient></defs><rect x="5" y="5" width="410" height="220" rx="28" fill="url(#bg)"/><circle cx="210" cy="102" r="68" fill="#fff" stroke="#dce5f4" stroke-width="4"/><text x="210" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="78" font-weight="800" fill="#2556d8">${icon}</text><text x="210" y="198" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#173a82">${label}</text></svg>`}
function enhance(doc){if(!doc||!doc.body)return;const style=doc.createElement('style');style.textContent=`.word .visual{height:145px!important;padding:0!important;background:#f8faff!important;overflow:hidden!important;border:1px solid #dfe7f4!important}.word .visual svg{width:100%;height:100%;display:block}.word{border-radius:22px!important;padding:13px!important}.word:hover{transform:translateY(-4px)!important;box-shadow:0 16px 30px #14264a18!important}`;doc.head.appendChild(style);function apply(){doc.querySelectorAll('.word').forEach(card=>{const fr=card.querySelector('.fr');if(!fr)return;const key=fr.textContent.trim();const data=map[key];if(!data)return;const box=card.querySelector('.visual');if(box&&!box.dataset.visualEnhanced){box.innerHTML=svg(data[0],data[1]);box.dataset.visualEnhanced='1'}})}apply();new MutationObserver(apply).observe(doc.body,{childList:true,subtree:true})}
const frame=document.getElementById('lesson');frame.addEventListener('load',()=>{try{enhance(frame.contentDocument);const resize=()=>{try{frame.style.height=Math.max(frame.contentDocument.documentElement.scrollHeight,900)+'px'}catch(e){}};resize();setInterval(resize,500)}catch(e){}});
</script></body></html>
