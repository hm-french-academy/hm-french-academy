<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Au marché · الصف السادس</title><style>html,body{margin:0;padding:0;background:#f3f6ff;overflow-x:hidden}#lesson{display:block;width:100%;border:0;height:0;min-height:0;background:#fff;overflow:hidden}</style></head><body><iframe id="lesson" src="grade6-au-marche-premium.html" title="Au marché"></iframe><script>const frame=document.getElementById('lesson');const enhanceVocabulary=doc=>{try{const win=doc.defaultView;const cards=doc.getElementById('cards');const audio=doc.getElementById('audio');if(!cards||!audio)return;const old=[...cards.children];const byWord={};old.forEach((el,i)=>{const w=el.querySelector('.fr')?.textContent?.trim();if(w)byWord[w]=el});const data=[['Le chariot','عربة التسوق','market'],['La balance','الميزان','market'],['La caisse','صندوق الدفع','market'],['La vitrine','الفاترينة','market'],['Le panier','السلة','market'],['Le sachet','الكيس','market'],["L’argent",'الفلوس','market'],['Le vendeur / la vendeuse','البائع / البائعة','market'],['La baguette','العِيش الفرنسي','food'],['Le pain','العيش','food'],['Le croissant','الكرواسون','food'],['Le gâteau','التورتة','food'],['La viande','اللحمة','food'],['Le poulet','الفراخ','food'],['Le fromage','الجبنة','food'],['Le lait','اللبن','food'],['Le beurre','الزبدة','food'],['Le poisson','السمك','food'],['La farine','الدقيق','food'],["L’œuf",'البيض','food'],['La crème','الكريمة','food'],['Le sucre','السكر','food'],['Le sel','الملح','food'],['Le vinaigre','الخل','food'],['La pomme','التفاحة','fruit'],['La banane','الموزة','fruit'],['La fraise','الفراولة','fruit'],["L’orange",'البرتقالة','fruit'],['La poire','الكمثرى','fruit'],['La cerise','الكرز','fruit'],['Le raisin','العنب','fruit'],['Le citron','الليمون','fruit'],['La carotte','الجزر','veg'],['La tomate','الطماطم','veg'],['Le concombre','الخيار','veg'],['La pomme de terre','البطاطس','veg'],["L’aubergine",'الباذنجان','veg'],['Le chou','الكرنب','veg'],['Le chou-fleur','القرنبيط','veg']];const ex={"La vitrine":'La vitrine est propre.',"L’argent":'J’ai de l’argent.',"Le vendeur / la vendeuse":'Le vendeur est au marché.',"Le croissant":'Je voudrais un croissant.',"Le gâteau":'Je voudrais un gâteau.',"Le poulet":'J’achète du poulet.',"Le beurre":'J’achète du beurre.',"Le poisson":'J’achète du poisson.',"La farine":'Je voudrais de la farine.',"L’œuf":'Je prends un œuf.',"La crème":'Je prends de la crème.',"Le sucre":'Je prends du sucre.',"Le sel":'Je prends du sel.',"Le vinaigre":'Je prends du vinaigre.',"La fraise":'Je voudrais des fraises.',"L’orange":'Je voudrais une orange.',"La poire":'Je voudrais une poire.',"La cerise":'Je voudrais des cerises.',"Le raisin":'Je voudrais du raisin.',"Le citron":'Je voudrais un citron.',"Le concombre":'Je prends un concombre.',"La pomme de terre":'Je prends des pommes de terre.',"L’aubergine":'Je prends une aubergine.',"Le chou":'Je prends du chou.',"Le chou-fleur":'Je prends du chou-fleur.'};const icon={market:'<svg viewBox="0 0 100 80" aria-hidden="true"><path d="M15 30h70l-7 39H22z" fill="#fff" stroke="#2556d8" stroke-width="5"/><path d="M28 30c0-22 44-22 44 0" fill="none" stroke="#0d9f98" stroke-width="5"/><path d="M20 20h60" stroke="#e72b82" stroke-width="7"/></svg>',food:'<svg viewBox="0 0 100 80" aria-hidden="true"><path d="M12 49c13-25 48-35 76-18 7 4 5 13-3 17-25 12-49 15-73 8z" fill="#e5bd68" stroke="#a86b20" stroke-width="4"/><path d="M35 36l7 7m14-14 7 7m-3 11 7 6" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>',fruit:'<svg viewBox="0 0 100 80" aria-hidden="true"><path d="M50 27c-23-18-40 2-31 27 9 24 25 24 31 7 6 17 22 17 31-7 9-25-8-45-31-27z" fill="#e85a68" stroke="#bd3c4b" stroke-width="3"/><path d="M50 25c3-12 11-16 20-15" fill="none" stroke="#0d9f98" stroke-width="4" stroke-linecap="round"/><path d="M65 13c8-4 13-1 16 4-8 3-13 1-16-4z" fill="#0d9f98"/></svg>',veg:'<svg viewBox="0 0 100 80" aria-hidden="true"><path d="M53 23 34 68c-2 6 7 8 11 3l25-42z" fill="#f08a35" stroke="#c85e1d" stroke-width="3"/><path d="M54 23c-9-8-4-15 4-18m4 20c-2-11 5-15 12-17" fill="none" stroke="#0d9f98" stroke-width="5" stroke-linecap="round"/></svg>'};const esc=t=>t.replace(/\\/g,'\\\\').replace(/'/g,"\\'");const speak=t=>{try{win.speak(t)}catch(e){if(win.speechSynthesis){win.speechSynthesis.cancel();const u=new win.SpeechSynthesisUtterance(t);u.lang='fr-FR';win.speechSynthesis.speak(u)}}};const makeCard=(v)=>{const [word,ar,type]=v;const oldCard=byWord[word];if(oldCard){const el=oldCard.cloneNode(true);const p=el.querySelector('.muted');if(p&&!el.querySelector('.exampleSpeak')){const b=doc.createElement('button');b.type='button';b.className='speak exampleSpeak';b.textContent='🔊 اسمع المثال';b.setAttribute('aria-label','استمع إلى المثال '+(p.textContent||''));b.onclick=()=>speak(p.textContent||'');p.after(b)}return el}const article=doc.createElement('article');article.className='card';const sentence=ex[word]||'';article.innerHTML='<div class="visual">'+icon[type]+'</div><div class="fr">'+word+'</div><div class="ar">'+ar+'</div><p class="muted">'+sentence+'</p><button class="speak" type="button">🔊 اسمع الكلمة</button><button class="speak exampleSpeak" type="button">🔊 اسمع المثال</button>';article.querySelector('.speak').onclick=()=>speak(word);article.querySelector('.exampleSpeak').onclick=()=>speak(sentence);return article};const frag=doc.createDocumentFragment();data.forEach(v=>frag.appendChild(makeCard(v)));cards.replaceChildren(frag);const audioFrag=doc.createDocumentFragment();data.forEach(([word,ar])=>{const article=doc.createElement('article');article.className='card audioCard';article.innerHTML='<div class="fr">'+word+'</div><div class="ar">'+ar+'</div><div class="audioBtns"><button class="speak" type="button">▶ الكلمة</button></div>';article.querySelector('button').onclick=()=>speak(word);audioFrag.appendChild(article)});audio.replaceChildren(audioFrag)}catch(e){console.error('Vocabulary enhancement failed',e)}};frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;const resize=()=>{try{frame.style.height=Math.max(doc.documentElement.scrollHeight,doc.body?doc.body.scrollHeight:0)+'px'}catch(e){}};resize();enhanceVocabulary(doc);if(window.ResizeObserver)new ResizeObserver(resize).observe(doc.documentElement);else setInterval(resize,700)}catch(e){console.error(e)}});</script></body></html>
