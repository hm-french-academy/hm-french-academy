<style>

.goal{background:#f7f9fd;border-radius:16px;padding:15px;line-height:2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}

.game{border:1px solid #dfe6f1;border-radius:18px;padding:16px;background:#fff}.game h3{margin-top:0}.badge{display:inline-block;background:#eef3ff;color:#173a82;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900}

<div class="wrap">

<section class="hero">
<h1>Le verbe être et la présentation</h1>
<p>فعل <b>être</b> والتقديم — تعلّم التصريف، قدّم نفسك، وقدّم شخصًا آخر خطوة بخطوة.</p>
<div class="chips"><span class="chip">🎯 Source-first</span><span class="chip">🧠 Smart Review</span><span class="chip">🎮 Game Center</span><span class="chip">📱 Mobile First</span><span class="chip">🏆 Mastery</span></div>

<script>
const p=new URLSearchParams(location.search),sec=p.get('section')||'introduction';
const S=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];
const forms=[['Je','suis','أنا'],['Tu','es','أنتَ / أنتِ'],['Il','est','هو'],['Elle','est','هي'],['Nous','sommes','نحن'],['Vous','êtes','أنتم / حضرتك'],['Ils','sont','هم'],['Elles','sont','هنّ']];
const expressions=[
['Je m’appelle Ahmed.','اسمي أحمد.'],['Je suis un garçon.','أنا ولد.'],['Il s’appelle Marc.','اسمه مارك.'],['Voilà Marc.','ها هو مارك.'],
['Vous êtes avocate ?','هل أنتِ محامية؟'],['Je suis professeur.','أنا مدرس.'],['Tu es sympa !','أنت لطيف!'],['Nous sommes élèves.','نحن تلاميذ.'],
['Ils sont petits.','هم صغار.'],['Elle est Mona.','هي منى.']
];
const questions=[
{q:'اختر التصريف الصحيح: Je ___ élève.',o:['suis','es','sont'],a:'suis',why:'مع Je نستخدم suis.'},
{q:'اختر التصريف الصحيح: Tu ___ sympa.',o:['est','es','sommes'],a:'es',why:'مع Tu نستخدم es.'},
{q:'اختر التصريف الصحيح: Elle ___ Mona.',o:['sont','est','êtes'],a:'est',why:'مع Elle نستخدم est.'},
{q:'اختر التصريف الصحيح: Nous ___ élèves.',o:['sommes','êtes','sont'],a:'sommes',why:'مع Nous نستخدم sommes.'},
{q:'اختر التصريف الصحيح: Vous ___ professeur.',o:['es','êtes','suis'],a:'êtes',why:'مع Vous نستخدم êtes.'},
{q:'اختر التصريف الصحيح: Ils ___ petits.',o:['est','sont','sommes'],a:'sont',why:'مع Ils نستخدم sont.'}
];
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function say(x){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}
function key(){return'hm-g7-mastery-grade7-u1-l4'}
function setProgress(v){let n=Math.max(0,Math.min(100,v));localStorage.setItem(key(),String(n));status()}
function finish(){setProgress(100)}
function status(){let n=Number(localStorage.getItem(key())||0);state.textContent=n>=100?'✅ مكتمل':n+'% إنجاز';fill.style.width=n+'%'}
function nav(){tabs.innerHTML=S.map(x=>'<button class="tab '+(x[0]===sec?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('')}
function go(s){location.href='grade7-u1-l4-gold-standard.html?id=grade7-u1-l4&section='+encodeURIComponent(s)}
function audio(x,label='🔊 استمع'){return '<button class="btn" onclick=\'say('+JSON.stringify(x)+')\'>'+label+'</button>'}
function intro(){return '<h2>🚀 ضربة البداية</h2><div class="goal"><b>Le verbe être et la présentation</b><br>فعل être والتقديم<br><br>🎯 ستتعلم تصريف être، ثم تستخدمه في تقديم نفسك وتقديم شخص آخر.<br><br>المحتوى الأصلي محفوظ، والإثراء التفاعلي هنا مكمّل له وليس بديلًا عنه.</div><div class="grid">'+['تصريف être كاملًا','التعريف بالنفس','تقديم شخص آخر','بناء جملة تقديم','تدريب فوري','مركز ألعاب','مراجعة ذكية','تقييم ذاتي'].map((x,i)=>'<article class="card"><b>'+String(i+1).padStart(2,'0')+' · '+x+'</b></article>').join('')+'</div><div class="note enriched"><b>طريقة الدراسة:</b> شاهد القاعدة → استمع → كوّن الجملة → العب → راجع → قيّم نفسك.</div>'}
function vocabulary(){return '<h2>🖼️ المفردات والتعبيرات</h2><p class="goal">بطاقات كبيرة وواضحة لأهم صيغ التقديم والتعريف الواردة في بيانات الدرس.</p><div class="word-grid">'+expressions.map((x,i)=>'<article class="word-card"><span class="badge">عبارة '+(i+1)+'</span><div class="word-fr">'+esc(x[0])+'</div><div class="word-ar">'+esc(x[1])+'</div>'+audio(x[0])+'</article>').join('')+'</div><button class="btn" onclick="setProgress(20)">✓ أنجزت المفردات</button>'}
function pronunciation(){const notes={suis:'suis: صوت ui فرنسي؛ لا تنطقه مثل «سْوِس» بالعربية.',es:'es قصيرة جدًا، وs النهائية لا تُنطق في النطق المعتاد.',est:'est تُنطق مثل /ɛ/ تقريبًا، وحرف t لا يُسمع.',sommes:'sommes: الـs الأخيرة لا تُنطق، ركّز على o المفتوحة.',êtes:'êtes: ê تعطي صوتًا مفتوحًا، وs النهائية لا تُنطق.',sont:'sont: النهاية nt لا تُنطق؛ ركّز على الصوت الأنفي.',m'appelle:'في m’appelle: انتبه إلى الشدة في ll وصوت a المفتوح.'};return '<h2>🎧 مختبر النطق</h2><div class="goal"><b>استمع → لاحظ → كرر.</b><br>هذه الصفحة تركّز على النطق، وليست مجرد تكرار لقائمة المفردات.</div><div class="word-grid">'+forms.map((x,i)=>'<article class="word-card"><span class="badge">تصريف '+(i+1)+'</span><div class="word-fr">'+x[0]+' '+x[1]+'</div><div class="word-ar">'+x[2]+'</div><div class="note"><b>👂 لاحظ:</b> '+esc(notes[x[1]]||'استمع إلى العبارة كاملة ثم كررها ببطء.')+'</div>'+audio(x[0]+' '+x[1],'🔊 استمع وكرر')+'</article>').join('')+'</div><div class="note enriched"><b>تدريب:</b> كرر كل صيغة مرتين، ثم حاول قولها دون النظر إلى الكتابة.</div><button class="btn" onclick="setProgress(35)">✓ أتممت تدريب النطق</button>'}
function grammar(){return '<h2>📘 القاعدة ببساطة</h2><div class="goal"><b>être = يكون</b><br>فعل غير منتظم؛ لذلك نحفظ تصريفه مع كل ضمير.</div><div class="rule">'+forms.map(x=>'<span>'+x[0]+' → '+x[1]+'</span>').join('')+'</div><div class="grid" style="margin-top:14px">'+forms.map(x=>'<article class="card"><div class="big">'+x[0]+'</div><div class="fr">'+x[1]+'</div><div class="ar">'+x[2]+'</div>'+audio(x[0]+' '+x[1])+'</article>').join('')+'</div><div class="note enriched"><b>ملاحظة مهمة:</b> نستخدم être مع التعريف بالنفس والصفة والحالة، مثل: <b dir="ltr">Je suis professeur.</b> و<b dir="ltr">Tu es sympa.</b></div><button class="btn" onclick="setProgress(50)">✓ فهمت القاعدة</button>'}
function conversation(){return '<h2>💬 المحادثة والتقديم</h2><div class="note source"><b>عبارات المصدر:</b> العبارات التالية محفوظة من بيانات الدرس.</div>'+expressions.map((x,i)=>'<div class="dialog"><span class="badge">المصدر · '+(i+1)+'</span><div class="fr">'+esc(x[0])+'</div><div class="ar">'+esc(x[1])+'</div>'+audio(x[0])+'</div>').join('')+'<h3>🎭 Role Play — إثراء</h3><div class="grid"><article class="card"><b>الموقف 1</b><p class="fr">Bonjour ! Je m’appelle Sara. Je suis élève.</p>'+audio('Bonjour ! Je m’appelle Sara. Je suis élève.','🔊 استمع')+'</article><article class="card"><b>الموقف 2</b><p class="fr">Voilà Omar. Il est professeur.</p>'+audio('Voilà Omar. Il est professeur.','🔊 استمع')+'</article></div><button class="btn" onclick="setProgress(60)">🎭 أتممت Role Play</button>'}
function answer(b,v,c,why,id){const box=b.closest('.question-card');if(box.dataset.done)return;box.dataset.done='1';box.querySelectorAll('.opt').forEach(x=>x.disabled=true);const f=document.getElementById(id);if(v===c){b.classList.add('good');f.innerHTML='✅ <b>إجابة صحيحة.</b> '+esc(why);setProgress(Math.max(70,Number(localStorage.getItem(key())||0)))}else{b.classList.add('selected-wrong');const r=[...box.querySelectorAll('.opt')].find(x=>x.textContent.trim()===c);if(r)r.classList.add('correct-answer');f.innerHTML='❌ <b>ليست الإجابة الصحيحة.</b><br>الإجابة الصحيحة: <b>'+esc(c)+'</b><br>'+esc(why)}}
function qbox(arr,prefix){return arr.map((q,i)=>'<article class="card question-card"><span class="badge">سؤال '+(i+1)+'</span><h3>'+esc(q.q)+'</h3><div class="opts">'+[...q.o].sort(()=>Math.random()-.5).map(o=>'<button class="opt" onclick=\'answer(this,'+JSON.stringify(o)+','+JSON.stringify(q.a)+','+JSON.stringify(q.why)+','+JSON.stringify(prefix+i)+')\'>'+esc(o)+'</button>').join('')+'</div><div class="feedback" id="'+prefix+i+'"></div></article>').join('')}
function practice(){return '<h2>✍️ التدريب التفاعلي</h2><div class="note source"><b>6 أسئلة تدريبية</b> مبنية مباشرة على تصريف être وعبارات التقديم الموجودة في بيانات الدرس.</div>'+qbox(questions,'p')+'<button class="btn" onclick="setProgress(75)">✓ أنهيت التدريب</button>'}
function games(){return '<h2>🎮 مركز الألعاب</h2><div class="goal">ثلاثة أنشطة مختلفة الوظيفة، بنفس روح مركز الألعاب الحديث: تعرّف → طابق → ابنِ جملة.</div><div class="grid"><article class="game"><span class="badge">🎯 لعبة 1 · طابق</span><h3>être-form match</h3><p>أي تصريف يناسب <b>Nous</b>؟</p><div class="opts"><button class="opt" onclick="game(this,true,'g1')">sommes</button><button class="opt" onclick="game(this,false,'g1')">êtes</button><button class="opt" onclick="game(this,false,'g1')">sont</button></div><div id="g1" class="feedback"></div></article><article class="game"><span class="badge">🧩 لعبة 2 · ابنِ</span><h3>Presentation Builder</h3><p>اضغط الكلمات بالترتيب لبناء جملة صحيحة.</p><div class="builder" id="builder"><button class="piece" onclick="pickWord(this)">suis</button><button class="piece" onclick="pickWord(this)">Je</button><button class="piece" onclick="pickWord(this)">élève.</button><button class="piece" onclick="pickWord(this)">un</button></div><div id="built" class="note">جملتك: …</div><button class="btn" onclick="checkBuild()">✓ تحقق</button></article><article class="game"><span class="badge">⚡ لعبة 3 · اختر</span><h3>Correct être</h3><p>Elle ___ Mona.</p><div class="opts"><button class="opt" onclick="game(this,false,'g3')">sont</button><button class="opt" onclick="game(this,true,'g3')">est</button><button class="opt" onclick="game(this,false,'g3')">êtes</button></div><div id="g3" class="feedback"></div></article><article class="game"><span class="badge">🔎 لعبة 4 · اكتشف</span><h3>من المتحدث؟</h3><p><b>Nous sommes élèves.</b> الضمير يدل على:</p><div class="opts"><button class="opt" onclick="game(this,true,'g4')">نحن</button><button class="opt" onclick="game(this,false,'g4')">هو</button><button class="opt" onclick="game(this,false,'g4')">هم</button></div><div id="g4" class="feedback"></div></article></div>'}
function game(b,ok,id){const box=b.closest('.game');if(box.dataset.done)return;box.dataset.done='1';box.querySelectorAll('.opt').forEach(x=>x.disabled=true);document.getElementById(id).innerHTML=ok?'✅ <b>ممتاز!</b>':'❌ <b>حاول مرة أخرى.</b>';if(ok)setProgress(82)}
let picked=[];function pickWord(b){if(b.dataset.used)return;b.dataset.used='1';picked.push(b.textContent.trim());document.getElementById('built').textContent='جملتك: '+picked.join(' ')}function checkBuild(){const good=picked.join(' ')==='Je suis un élève.';document.getElementById('built').innerHTML=good?'✅ <b>جملة صحيحة!</b> Je suis un élève.':'❌ الترتيب يحتاج مراجعة. الترتيب الصحيح: <b>Je suis un élève.</b>';if(good)setProgress(88)}
function smart(){const qs=[{q:'اختر الصيغة الصحيحة: Je ___ professeur.',o:['suis','es','est'],a:'suis',why:'مع Je نستخدم suis.'},{q:'اختر الصيغة الصحيحة: Nous ___ élèves.',o:['sommes','êtes','sont'],a:'sommes',why:'مع Nous نستخدم sommes.'},{q:'اختر الصيغة الصحيحة: Elles ___ petites.',o:['est','sont','êtes'],a:'sont',why:'مع Elles نستخدم sont.'},{q:'اختر العبارة التي تعني «ها هو مارك».',o:['Voilà Marc.','Je suis Marc.','Tu es Marc.'],a:'Voilà Marc.',why:'Voilà تُستخدم للإشارة أو التقديم.'},{q:'اختر العبارة المناسبة للتعريف بالنفس.',o:['Je m’appelle Ahmed.','Il s’appelle Ahmed.','Voilà Ahmed.'],a:'Je m’appelle Ahmed.',why:'Je m’appelle = اسمي.'},{q:'اختر الصيغة الصحيحة: Vous ___ avocate ?',o:['êtes','es','suis'],a:'êtes',why:'مع Vous نستخدم êtes.'}];return '<h2>🧠 المراجعة الذكية</h2><div class="goal">مراجعة مركزة على أكثر نقاط الدرس أهمية: تصريف être، والتقديم، والتمييز بين <b>Je / Tu / Il / Nous / Vous / Ils</b>.</div>'+qbox(qs,'s')+'<button class="btn" onclick="setProgress(94)">✓ أتممت المراجعة</button>'}
