<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | الصف الأول الإعدادي</title><style>:root{--n:#102a56;--b:#2563eb;--t:#0f9f91;--ink:#14213d;--muted:#667085;--line:#e1e7f0;--ok:#087443;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef4ff,#fff);color:var(--ink);font-family:Arial,"Noto Sans Arabic",sans-serif;line-height:1.7}.wrap{max-width:1180px;margin:auto;padding:10px}.hero{background:linear-gradient(135deg,#102a56,#2455a6,#0f9f91);color:#fff;border-radius:24px;padding:22px}.hero h1{margin:6px 0;font-size:clamp(24px,4vw,40px)}.fr{direction:ltr;font-weight:900}.bar{display:flex;gap:7px;overflow:auto;background:#fff;padding:10px;border:1px solid var(--line);border-radius:18px;margin-top:12px}.bar a{white-space:nowrap;text-decoration:none;background:#eef3fb;color:var(--n);padding:8px 12px;border-radius:999px;font-weight:800}.bar a.on{background:var(--b);color:#fff}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:18px}.panel{padding:16px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}.card{padding:14px}.ar{text-align:center;color:#315aa4;font-weight:800}.note{padding:12px;border-radius:12px;background:#f8fafc;border-right:4px solid #94a3b8;margin:10px 0}.source{background:#effbf8;border-right-color:var(--t)}button{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer;background:var(--b);color:#fff}.options{display:grid;gap:7px;margin-top:8px}.options button{text-align:right;background:#fff;color:var(--ink);border:1px solid var(--line)}.feedback{min-height:25px;margin-top:7px}.ok{color:var(--ok);font-weight:900}.bad{color:var(--bad);font-weight:900}.score{font-size:22px;font-weight:900}.muted{color:var(--muted)}.progress{height:10px;background:#e8edf5;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--t))}.video{position:relative;width:100%;padding-top:56.25%;overflow:hidden;border-radius:16px;background:#111}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><body><div class="wrap"><header class="hero"><b>🇫🇷 HM Academy · الصف الأول الإعدادي</b><h1 id="title">جاري التحميل…</h1><div id="fr" class="fr"></div><p id="goal"></p></header><nav class="bar" id="nav"></nav><main class="panel" id="app">جاري تجهيز الدرس…</main></div><script>
const p=new URLSearchParams(location.search);
const id=p.get('id')||'grade7-u1-l4';
const sec=p.get('section')||'introduction';
const student=p.get('student')==='1';
const stages=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];
const navEl=document.getElementById('nav'),appEl=document.getElementById('app'),titleEl=document.getElementById('title'),frEl=document.getElementById('fr'),goalEl=document.getElementById('goal');
let D=null, quizCounter=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const shuffle=a=>[...(a||[])].sort(()=>Math.random()-.5);
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}
function urlFor(section){let q=new URLSearchParams();q.set('id',id);q.set('section',section);if(student)q.set('student','1');return '?'+q.toString()}
function nav(){navEl.innerHTML=stages.map(x=>'<a class="'+(x[0]===sec?'on':'')+'" href="'+urlFor(x[0])+'">'+x[1]+'</a>').join('')}
function expressions(){return Array.isArray(D?.sourceData?.expressions)?D.sourceData.expressions:[]}
function forms(){return Array.isArray(D?.sourceData?.forms)?D.sourceData.forms:[]}
function quizData(){return Array.isArray(D?.sourceData?.quizData)?D.sourceData.quizData:[]}
function intro(){return '<h2>🚀 البداية</h2><div class="note source"><b>هدف الدرس</b><br>'+esc(D?.journeyContent?.introduction?.goal||'التعرف على فعل être والتقديم عن النفس والآخرين.')+'</div><p>ابدأ بالمفردات، ثم القاعدة والتدريب، وبعدها المراجعة والتقييم.</p>'}
function vocabulary(){return '<h2>🖼️ المفردات والتعبيرات</h2><div class="grid">'+expressions().map((x,i)=>'<article class="card"><b dir="ltr">'+esc(x)+'</b><p class="ar">تعبير من الدرس</p><button onclick="speak('+JSON.stringify(x)+')">🔊 استمع</button></article>').join('')+'</div>'}
function pronunciation(){return '<h2>🎧 النطق</h2><div class="grid">'+expressions().map(x=>'<article class="card"><b dir="ltr">'+esc(x)+'</b><br><button onclick="speak('+JSON.stringify(x)+')">🔊 استمع وكرر</button></article>').join('')+'</div>'}
function grammar(){return '<h2>📘 القواعد</h2><div class="grid">'+forms().map(x=>'<article class="card"><div class="fr">'+esc(x[0])+' → '+esc(x[1])+'</div><button onclick="speak('+JSON.stringify(x[0]+' '+x[1])+')">🔊 استمع</button></article>').join('')+'</div><div class="note source">être: suis · es · est · sommes · êtes · sont</div>'}
function conversation(){return '<h2>💬 المحادثة والتقديم</h2><div class="grid">'+expressions().map(x=>'<article class="card"><p dir="ltr">'+esc(x)+'</p><button onclick="speak('+JSON.stringify(x)+')">🔊 استمع</button></article>').join('')+'</div>'}
function normalizedSource(){return quizData().filter(x=>Array.isArray(x)&&x.length>=3).map(x=>({q:x[0],o:Array.isArray(x[1])?x[1]:[],a:x[2]})).filter(x=>x.o.length&&x.a!==undefined)}
function generatedPractice(){return forms().map((x,i)=>({q:'اختر التصريف الصحيح مع '+x[0],o:[x[1],...forms().filter((_,j)=>j!==i).slice(0,2).map(y=>y[1])],a:x[1]}))}
function practice(){const a=normalizedSource().slice(0,6);const qs=a.length?a:generatedPractice().slice(0,6);return '<h2>✍️ التدريب</h2>'+renderQuiz(qs)}
function smartReview(){const a=generatedPractice().slice(0,6);return '<h2>🧠 المراجعة الذكية</h2><p class="note">مراجعة مركزة على تصريف être، مع أسئلة مختلفة عن التقييم.</p>'+renderQuiz(a)}
function assessment(){let a=normalizedSource().slice(0,6);if(!a.length)a=generatedPractice().slice(0,6);return '<h2>🏆 التقييم</h2><p class="note source">أسئلة التقييم مستقلة عن المراجعة الذكية.</p>'+renderQuiz(a)}
function renderQuiz(qs){const k='q'+(++quizCounter);return '<div id="score-'+k+'" class="score">0 / '+qs.length+'</div><div class="grid">'+qs.map((q,i)=>'<article class="card"><b>'+String(i+1)+'. '+esc(q.q)+'</b><div class="options">'+shuffle(q.o).map(o=>'<button data-k="'+k+'" data-i="'+i+'" onclick="answer(this,'+JSON.stringify(o)+','+JSON.stringify(q.a)+','+JSON.stringify(k)+')">'+esc(o)+'</button>').join('')+'</div><div id="feed-'+k+'-'+i+'" class="feedback"></div></article>').join('')+'</div>'}
function answer(btn,value,correct,k){if(btn.disabled)return;const i=btn.getAttribute('data-i');document.querySelectorAll('[data-k="'+k+'"][data-i="'+i+'"]').forEach(x=>x.disabled=true);const ok=value===correct;btn.classList.add(ok?'ok':'bad');const f=document.getElementById('feed-'+k+'-'+i);f.innerHTML=ok?'✅ صحيح — أحسنت!':'❌ غير صحيح — الإجابة الصحيحة: <b>'+esc(correct)+'</b>';if(ok)speak(correct);const total=document.querySelectorAll('[data-k="'+k+'"]').length;const done=[...document.querySelectorAll('[data-k="'+k+'"]')].filter(x=>x.disabled).length;const score=[...document.querySelectorAll('[data-k="'+k+'"]')].filter(x=>x.classList.contains('ok')).length;document.getElementById('score-'+k).textContent=score+' / '+(total/Math.max(1,document.querySelectorAll('[data-k="'+k+'"][data-i="0"]').length))}
function video(){return '<h2>🎬 الفيديو</h2><p class="note">فيديو الدرس الأصلي إن كان مساره موثقًا في بيانات المصدر.</p>'}
function games(){const g=D?.enrichment?.games||[];return '<h2>🎮 الألعاب</h2><div class="grid">'+g.map((x,i)=>'<article class="card"><div style="font-size:42px">🎮</div><b>'+String(i+1)+'. '+esc(x)+'</b></article>').join('')+'</div>'}
function progress(){return '<h2>📈 التقدم</h2><div class="card"><b>تقدمك في الدرس</b><p>أكمل مراحل الدرس ثم استخدم التقييم النهائي.</p></div>'}
async function load(){
try{
const res=await fetch('data/lessons/grade-7/unit-1/lesson-4.json?v=20261005',{cache:'no-store'});
if(!res.ok)throw new Error('HTTP '+res.status);
D=await res.json();
titleEl.textContent=D.titleAr||'فعل être والتقديم';frEl.textContent=D.titleFr||'';goalEl.textContent='فعل être والتقديم — تعلّم، تدرّب، ثم راجع.';
nav();
const views={introduction:intro,vocabulary,pronunciation,grammar,conversation,practice,video,games,'smart-review':smartReview,assessment,progress};
appEl.innerHTML=(views[sec]||intro)();
}catch(e){titleEl.textContent='فعل être والتقديم';frEl.textContent='Le verbe être et la présentation';goalEl.textContent='';appEl.innerHTML='<div class="note"><b>تعذر تحميل بيانات الدرس.</b><br>البيانات الأساسية موجودة محليًا، لكن حدث خطأ أثناء قراءتها.</div>'}
}
load();
</script>
