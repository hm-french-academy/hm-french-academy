</style><script src="scripts/student-gate.js?v=20261010-grade7-l4-student-ui"></script></head><body><div class="wrap"><header class="hero"><b>🇫🇷 HM Academy · الصف الأول الإعدادي</b><h1 id="title">فعل être والتقديم</h1><div id="fr" class="fr">Le verbe être et la présentation</div><p id="goal">تعلّم كيف تعرّف بنفسك وتقدّم شخصًا آخر بالفرنسية.</p></header><nav class="bar" id="nav"></nav><main class="panel" id="app">جاري تجهيز الدرس…</main></div><script>
const p=new URLSearchParams(location.search),id=p.get('id')||'grade7-u1-l4',sec=p.get('section')||'introduction',student=p.get('student')==='1';
const stages=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];
const navEl=document.getElementById('nav'),appEl=document.getElementById('app'),titleEl=document.getElementById('title'),frEl=document.getElementById('fr'),goalEl=document.getElementById('goal');
let D=null,quizCounter=0,gameState={index:0,score:0,order:[]};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const shuffle=a=>{const b=[...(a||[])];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function speak(t){if(!('speechSynthesis'in window)){alert('خاصية النطق غير مدعومة في هذا المتصفح. جرّب فتح الدرس في Chrome.');return}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t));u.lang='fr-FR';u.rate=.82;const vs=speechSynthesis.getVoices();const v=vs.find(x=>/^fr(-|_)/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){console.error('speech error',e)}}
function urlFor(section){const q=new URLSearchParams();q.set('id',id);q.set('section',section);if(student)q.set('student','1');return '?'+q.toString()}
function nav(){navEl.innerHTML=stages.map(x=>'<a class="'+(x[0]===sec?'on':'')+'" href="'+urlFor(x[0])+'">'+x[1]+'</a>').join('')}
function expressions(){return Array.isArray(D?.sourceData?.expressions)?D.sourceData.expressions:[]}
function forms(){return Array.isArray(D?.sourceData?.forms)?D.sourceData.forms:[]}
function quizData(){return Array.isArray(D?.sourceData?.quizData)?D.sourceData.quizData:[]}
function head(icon,title,sub=''){return '<div class="section-head"><span class="icon">'+icon+'</span><div><h2>'+title+'</h2>'+(sub?'<div class="muted">'+sub+'</div>':'')+'</div></div>'}
function intro(){return head('🚀','رحلة الدرس','من التعارف إلى استخدام فعل être')+'<div class="grid"><article class="card"><span class="pill">1 · افهم</span><h3>أنا مين؟</h3><div class="big-fr">Je suis…</div><p class="ar">أنا… / أنا أكون…</p><p>تعرّف بنفسك باستخدام الاسم أو الصفة أو الدور.</p></article><article class="card"><span class="pill">2 · تعلّم</span><h3>صرّف الفعل</h3><div class="big-fr">être</div><p class="ar">فعل «يكون»</p><p>لاحظ كيف تتغير صيغة الفعل حسب الضمير.</p></article><article class="card"><span class="pill">3 · طبّق</span><h3>قدّم شخصًا</h3><div class="big-fr">Voilà mon ami !</div><p class="ar">هذا صديقي!</p><p>استخدم تعبيرات بسيطة للتعريف بنفسك وبالآخرين.</p></article></div><div class="note source"><b>هدفك في نهاية الدرس:</b> تختار تصريف être الصحيح، وتنطق التعبيرات الأساسية، وتكوّن تقديمًا قصيرًا عن نفسك.</div><p><a class="button" href="'+urlFor('vocabulary')+'">ابدأ بالمفردات ←</a></p>'}
function vocabulary(){return head('🖼️','المفردات والتعبيرات','اضغط «استمع» لسماع كل عبارة')+'<div class="grid">'+expressions().map((x,i)=>'<article class="card"><span class="pill">عبارة '+(i+1)+'</span><div class="big-fr">'+esc(x)+'</div><p class="ar">'+(i===0?'اسمي أحمد.':i===1?'أنا ولد.':i===2?'اسمه مارك.':i===3?'هذا مارك.':'تعبير للتعريف أو الوصف')+'</p><button type="button" data-speak="'+esc(x)+'">🔊 استمع</button></article>').join('')+'</div>'}
function pronunciation(){const items=[...forms().map(x=>x[0]+' '+x[1]),...expressions()];return head('🎧','معمل النطق','استمع إلى العبارة الفرنسية ثم كررها بصوت واضح')+'<div class="note">لو لم يعمل الصوت من أول مرة، اضغط زر الاستماع مرة أخرى وتأكد أن صوت الجهاز غير مكتوم.</div><div class="grid">'+items.map((x,i)=>'<article class="card"><span class="pill">'+(i<forms().length?'تصريف être':'تعبير')+'</span><div class="big-fr">'+esc(x)+'</div><button type="button" data-speak="'+esc(x)+'">🔊 استمع وكرّر</button></article>').join('')+'</div>'}
function grammar(){return head('📘','قاعدة فعل être','احفظ التصريف من خلال الضمير')+'<div class="form-row">'+forms().map(x=>'<article class="card"><div class="big-fr">'+esc(x[0])+'</div><div class="big-fr">↓</div><div class="big-fr">'+esc(x[1])+'</div><button type="button" data-speak="'+esc(x[0]+' '+x[1])+'">🔊 اسمع التصريف</button></article>').join('')+'</div><div class="note source"><b>تذكّر:</b> Je suis · Tu es · Il/Elle est · Nous sommes · Vous êtes · Ils/Elles sont.</div><div class="grid"><article class="card"><b>للتعريف بالنفس</b><div class="big-fr">Je suis élève.</div><p class="ar">أنا تلميذ.</p></article><article class="card"><b>لوصف شخص</b><div class="big-fr">Elle est sympa.</div><p class="ar">هي لطيفة.</p></article><article class="card"><b>للتعريف بمجموعة</b><div class="big-fr">Nous sommes élèves.</div><p class="ar">نحن تلاميذ.</p></article></div>'}
function conversation(){const lines=[['A','Bonjour ! Je m’appelle Ali.'],['B','Salut Ali ! Moi, c’est Mona.'],['A','Je suis élève. Et toi ?'],['B','Je suis élève aussi.'],['A','Voilà mon ami, Marc.'],['B','Enchantée, Marc !']];return head('💬','حوار: نتعرّف على بعضنا','استمع لكل جملة ثم تدرّب على قراءتها')+'<div class="grid">'+lines.map((x,i)=>'<article class="card"><span class="pill">'+(x[0]==='A'?'علي':'منى')+'</span><div class="big-fr">'+esc(x[1])+'</div><button type="button" data-speak="'+esc(x[1])+'">🔊 استمع</button></article>').join('')+'</div>'}
function generatedPractice(){return forms().map((x,i)=>{const wrong=shuffle(forms().filter((_,j)=>j!==i).map(y=>y[1])).slice(0,2);return {q:'اختر التصريف الصحيح: '+x[0]+' ___',o:shuffle([x[1],...wrong]),a:x[1]}})}
function sourceQuestions(){const raw=quizData().filter(x=>Array.isArray(x)&&x.length>=3).map(x=>({q:x[0],o:Array.isArray(x[1])?x[1]:[],a:x[2]})).filter(x=>x.o.length&&x.a!==undefined);return raw}
function practice(){const qs=generatedPractice().slice(0,6);return head('✍️','التدريب','تطبيق موجه مع تصحيح فوري')+'<div class="mode-banner practice-banner"><span class="pill">وضع التعلّم</span><h2>حلّ خطوة بخطوة</h2><p>كل سؤال له تصحيح فوري. استخدم النتيجة لمعرفة التصريف الذي تحتاج إلى مراجعته.</p></div>'+renderQuiz(qs,'practice')}
function smartReview(){const qs=shuffle([{q:'أي تصريف يخص Nous؟',o:['sommes','êtes','sont'],a:'sommes'},{q:'أي تصريف يخص Ils / Elles؟',o:['est','sont','es'],a:'sont'},{q:'ما معنى Voilà mon ami ؟',o:['هذا صديقي','أنا تلميذ','صباح الخير'],a:'هذا صديقي'},{q:'أكمل: Je ___ élève.',o:['suis','es','sommes'],a:'suis'},{q:'أكمل: Vous ___ ici.',o:['êtes','est','sont'],a:'êtes'},{q:'أكمل: Elle ___ sympa.',o:['suis','est','sommes'],a:'est'}]);return head('🧠','المراجعة الذكية','اختبار استرجاع متنوع من الذاكرة')+'<div class="mode-banner review-banner"><span class="pill">وضع التثبيت</span><h2>استرجع المعلومة قبل اختيار الإجابة</h2><p>هذه مراجعة مختلطة للتصريف والمعنى، وليست نسخة من ترتيب التدريب.</p></div>'+renderQuiz(qs,'review')}
function assessment(){const qs=[{q:'Je ___ Ahmed.',o:['suis','es','est'],a:'suis'},{q:'Tu ___ élève.',o:['sont','es','sommes'],a:'es'},{q:'Elle ___ sympa.',o:['êtes','est','suis'],a:'est'},{q:'Nous ___ amis.',o:['sommes','est','es'],a:'sommes'},{q:'Vous ___ professeur.',o:['sont','êtes','sommes'],a:'êtes'},{q:'Ils ___ petits.',o:['est','suis','sont'],a:'sont'}];return head('🏆','التقييم النهائي','اختبار مستقل لقياس إتقان الدرس')+'<div class="mode-banner exam-banner"><span class="pill">وضع الاختبار</span><h2>ورقة تقييم الدرس</h2><p>6 أسئلة ودرجة من 6. أجب عن الأسئلة ثم راجع التصحيح والنتيجة.</p></div>'+renderQuiz(qs,'assessment')}
function renderQuiz(qs,label){const k=label+'-'+(++quizCounter);return '<div id="score-'+k+'" class="score">النتيجة: 0 / '+qs.length+'</div><div class="progress"><i id="progress-'+k+'" style="width:0%"></i></div><div class="grid">'+qs.map((q,i)=>'<article class="card"><b>'+String(i+1)+'. '+esc(q.q)+'</b><div class="options">'+shuffle(q.o).map(o=>'<button type="button" data-quiz="'+k+'" data-index="'+i+'" data-value="'+esc(o)+'" data-correct="'+esc(q.a)+'">'+esc(o)+'</button>').join('')+'</div><div id="feed-'+k+'-'+i+'" class="feedback" aria-live="polite"></div></article>').join('')+'</div><div id="finish-'+k+'" class="note" hidden></div>'}
function answer(btn){if(btn.disabled)return;const k=btn.dataset.quiz,i=btn.dataset.index,correct=btn.dataset.correct,value=btn.dataset.value;const group=[...document.querySelectorAll('[data-quiz="'+k+'"][data-index="'+i+'"]')];group.forEach(x=>x.disabled=true);const ok=value===correct;if(ok)btn.classList.add('ok');else{btn.classList.add('bad');const right=group.find(x=>x.dataset.value===correct);if(right)right.classList.add('ok')}document.getElementById('feed-'+k+'-'+i).innerHTML=ok?'✅ إجابة صحيحة، أحسنت!':'❌ الإجابة الصحيحة: <b>'+esc(correct)+'</b>';const all=[...document.querySelectorAll('[data-quiz="'+k+'"]')],done=all.filter(x=>x.disabled),total=new Set(all.map(x=>x.dataset.index)).size,score=[...new Set(all.map(x=>x.dataset.index))].filter(idx=>all.some(x=>x.dataset.index===idx&&x.classList.contains('ok'))).length;document.getElementById('score-'+k).textContent='النتيجة: '+score+' / '+total;document.getElementById('progress-'+k).style.width=(done.length/Math.max(1,all.length)*100)+'%';if(done.length===all.length){const f=document.getElementById('finish-'+k);f.hidden=false;f.innerHTML='<b>اكتمل النشاط!</b> حصلت على '+score+' من '+total+'. '+(score===total?'ممتاز، أتقنت الأسئلة كلها.':'راجع الإجابات ثم أعد المحاولة بفتح القسم مرة أخرى.')}if(ok)speak(correct)}
function qsPerQuestion(k){const first=document.querySelector('[data-quiz="'+k+'"]');if(!first)return 3;return document.querySelectorAll('[data-quiz="'+k+'"][data-index="'+first.dataset.index+'"]').length}
function video(){return head('🎬','فيديو مساعد للدرس','شرح مناسب للمبتدئين لتصريف être ونطقه')+'<div class="note source"><b>شاهد الفيديو ثم ارجع للدرس:</b> يركز على تصريف فعل être والنطق، وهو داعم لجزء القواعد في هذا الدرس.</div><div class="video" style="position:relative;padding-top:56.25%;height:0;background:#111;border-radius:16px;overflow:hidden"><iframe src="https://www.youtube-nocookie.com/embed/KY32SIbmE-c" title="Learn French easy for beginner: the verb être and avoir in the present" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe></div><p><a class="button" href="https://www.youtube.com/watch?v=KY32SIbmE-c" target="_blank" rel="noopener noreferrer">▶ فتح الفيديو على YouTube</a></p><p class="muted">إذا لم يظهر المشغّل داخل الصفحة، استخدم زر فتح الفيديو.</p>'}
function games(){gameState={index:0,score:0,order:shuffle(forms())};return head('🎮','ساحة الألعاب','تدرّب بالاختيار السريع، ثم كوّن جملة تقديم')+'<div class="grid"><article class="card"><span class="pill">اللعبة 1</span><h3>🎯 اختار التصريف</h3><p>اختر صيغة être المناسبة للضمير الذي يظهر أمامك.</p><div id="match-game"></div></article><article class="card"><span class="pill">اللعبة 2</span><h3>🧩 ابنِ تقديمك</h3><p>رتّب أجزاء التقديم لتكوّن جملة صحيحة.</p><div id="builder-game"></div></article></div>'}
function gamesInit(){renderMatch();renderBuilder()}
function renderMatch(){const box=document.getElementById('match-game');if(!box)return;const rows=gameState.order||forms();if(gameState.index>=rows.length){box.innerHTML='<div class="note source"><b>انتهت الجولة!</b><br>إجابات صحيحة: '+gameState.score+' من '+rows.length+'.</div><button type="button" id="restart-game">العب مرة أخرى ↻</button>';return}const row=rows[gameState.index];const options=shuffle([row[1],...shuffle(forms().filter(x=>x[1]!==row[1]).map(x=>x[1])).slice(0,2)]);box.innerHTML='<div class="game-prompt">ما التصريف الصحيح مع <span class="fr">'+esc(row[0])+'</span>؟</div><div class="options">'+options.map(o=>'<button type="button" data-game-answer="'+esc(o)+'" data-game-correct="'+esc(row[1])+'">'+esc(o)+'</button>').join('')+'</div><div id="game-feedback" class="feedback" aria-live="polite"></div><p class="muted">السؤال '+(gameState.index+1)+' من '+rows.length+' · النقاط: '+gameState.score+'</p>'}
function renderBuilder(){const box=document.getElementById('builder-game');if(!box)return;const words=shuffle(['Je','suis','élève.']);box.innerHTML='<div class="game-prompt">كوّن الجملة: «أنا تلميذ»</div><div class="note" id="built-words" style="min-height:54px;background:#f8fafc;direction:ltr;text-align:center;font-size:22px;font-weight:900"></div><div class="game-controls">'+words.map(w=>'<button type="button" data-word="'+esc(w)+'">'+esc(w)+'</button>').join('')+'</div><div class="game-controls"><button type="button" id="check-builder">تحقق من الجملة</button><button type="button" id="reset-builder">إعادة المحاولة ↻</button></div><div id="builder-feedback" class="feedback" aria-live="polite"></div>'}
function progress(){return head('📈','تقدمك في الدرس','تابع المهارات التي تدربت عليها')+'<div class="grid"><article class="card"><h3>🎧 النطق</h3><p>استمع إلى تصريفات être وكررها بصوت مرتفع.</p><a class="button" href="'+urlFor('pronunciation')+'">مراجعة النطق</a></article><article class="card"><h3>✍️ التدريب</h3><p>طبّق على التصريفات الأساسية.</p><a class="button" href="'+urlFor('practice')+'">ابدأ التدريب</a></article><article class="card"><h3>🏆 التقييم</h3><p>اختبر فهمك بأسئلة مستقلة.</p><a class="button" href="'+urlFor('assessment')+'">ابدأ التقييم</a></article></div>'}
async function load(){try{const res=await fetch('data/lessons/grade-7/unit-1/lesson-4.json?v=20261009-fix1',{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);D=await res.json();titleEl.textContent=D.titleAr||'فعل être والتقديم';frEl.textContent=D.titleFr||'';goalEl.textContent='تعلّم كيف تعرّف بنفسك وتقدّم شخصًا آخر بالفرنسية.';nav();const views={introduction:intro,vocabulary,pronunciation,grammar,conversation,practice,video,games,'smart-review':smartReview,assessment,progress};appEl.innerHTML=(views[sec]||intro)();if(sec==='games')gamesInit()}catch(e){console.error(e);titleEl.textContent='فعل être والتقديم';frEl.textContent='Le verbe être et la présentation';goalEl.textContent='';appEl.innerHTML='<div class="note"><b>تعذر تحميل بيانات الدرس.</b><br>تأكد من اتصال الإنترنت ثم أعد تحميل الصفحة.</div>'}}
document.addEventListener('click',e=>{const speakBtn=e.target.closest('[data-speak]');if(speakBtn){speak(speakBtn.dataset.speak);return}const ans=e.target.closest('[data-quiz]');if(ans){answer(ans);return}const ga=e.target.closest('[data-game-answer]');if(ga){const group=[...document.querySelectorAll('[data-game-answer]')];group.forEach(x=>x.disabled=true);const ok=ga.dataset.gameAnswer===ga.dataset.gameCorrect;if(ok){ga.classList.add('ok');gameState.score++}else{ga.classList.add('bad');const right=group.find(x=>x.dataset.gameAnswer===ga.dataset.gameCorrect);if(right)right.classList.add('ok')}document.getElementById('game-feedback').textContent=ok?'✅ ممتاز!':'الإجابة الصحيحة: '+ga.dataset.gameCorrect;const box=document.getElementById('match-game');box.insertAdjacentHTML('beforeend','<button type="button" id="next-game" style="margin-top:10px">السؤال التالي ←</button>');return}if(e.target.closest('#next-game')){gameState.index++;renderMatch();return}if(e.target.closest('#restart-game')){gameState={index:0,score:0,order:shuffle(forms())};renderMatch();return}const w=e.target.closest('[data-word]');if(w){const out=document.getElementById('built-words');out.textContent=(out.textContent+' '+w.dataset.word).trim();w.disabled=true;return}if(e.target.closest('#reset-builder')){renderBuilder();return}if(e.target.closest('#check-builder')){const val=document.getElementById('built-words').textContent.trim().replace(/\s+/g,' ');document.getElementById('builder-feedback').textContent=val==='Je suis élève.'?'✅ صحيح! Je suis élève.':'جرّب ترتيب الكلمات هكذا: Je suis élève.'}});
