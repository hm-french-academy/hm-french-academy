function quiz(final){score=0;answered.clear();const qs=d.slice(5),head=final?'🏆 اختبار التحقق النهائي':'🧪 تدريب الدرس';view.innerHTML=`<section class="card"><h2>${head}</h2><p class="muted">اختر الإجابة. بعد الاختيار ستظهر الإجابة الصحيحة وسببها مباشرة.</p>${qs.map((q,i)=>`<div class="q"><b>${i+1}. ${q[0]}</b><div class="opts">${shuffle(q[1].map((o,j)=>({o,j}))).map(x=>`<button class="opt" data-i="${i}" data-a="${x.j}">${x.o}</button>`).join('')}</div><div class="result" id="r${i}"></div></div>`).join('')}<div id="score" class="score"></div></section>`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b,qs));}
function answer(btn,qs){const i=+btn.dataset.i;if(answered.has(i))return;answered.add(i);const q=qs[i],a=+btn.dataset.a;document.querySelectorAll(`.opt[data-i="${i}"]`).forEach(x=>{x.disabled=true;if(+x.dataset.a===q[2])x.classList.add('correct')});if(a===q[2]){score++;btn.classList.add('correct')}else btn.classList.add('wrong');document.getElementById('r'+i).textContent=(a===q[2]?'✅ صحيح — ':'❌ غير صحيح — ') + q[3];document.getElementById('score').textContent=`النتيجة: ${score}/${qs.length}`;}
function mastery(){const pct=Math.round(score/3*100);view.innerHTML=`<section class="card"><h2>📈 الإتقان</h2><p class="score">${score===3?'ممتاز — الدرس جاهز للانتقال.':score===2?'جيد جدًا — راجع نقطة واحدة ثم أعد التدريب.':'نحتاج إلى مراجعة المفردات والقاعدة ثم إعادة التدريب.'}</p><div class="progress"><i style="width:${pct}%"></i></div><p class="muted">نتيجة آخر تدريب: ${score}/3</p><div class="actions"><button class="btn" onclick="stage=8;render()">إعادة التدريب</button><button class="btn" onclick="stage=9;render()">اختبار التحقق</button></div></section>`}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function speak(){if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance(d[3]);u.lang='fr-FR';speechSynthesis.cancel();speechSynthesis.speak(u)}else alert('تشغيل الصوت غير مدعوم في هذا المتصفح.');}
document.getElementById('next').onclick=()=>{if(idx<keys.length-1){location.href='baccalaureat-2-lesson-studio-v3.html?lesson='+keys[idx+1]}else{location.href='baccalaureat-2.html'}};init();
</script></body></html>
