<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Student Profile</title><link rel="stylesheet" href="css/premium-shell.css?v=20260810"></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline" data-i18n="tagline">منصة تعليم الفرنسية بذكاء ومتعة</small></span></a><nav class="hm-nav"><a href="index.html" data-i18n="home">الرئيسية</a><a href="dashboard.html" data-i18n="student">الطالب</a><a href="course.html" data-i18n="courses">المسارات</a><a href="grade-8.html" data-i18n="grade8">الصف الثاني الإعدادي</a><a href="library.html" data-i18n="library">المكتبة</a><a href="settings.html" data-i18n="settings">الإعدادات</a></nav><div class="hm-tools"><select class="hm-lang" data-lang-select><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select><a class="hm-student" href="student-profile.html">👨‍🎓</a></div></header><div class="hm-page"><main class="hm-main"><section class="hm-hero"><h1>👤 <span data-i18n="studentArea">منطقة الطالب</span></h1><p>أنشئ ملفك ليصبح التقدم والـXP والدروس المفضلة مرتبطة بتجربتك التعليمية.</p></section><section class="hm-card" style="margin-top:20px"><form id="studentForm" style="display:grid;gap:13px"><label>الاسم الكامل<input id="fullName" required style="width:100%;padding:13px;border:1px solid #e5eaf4;border-radius:14px;margin-top:6px"></label><label>البريد الإلكتروني<input id="email" type="email" style="width:100%;padding:13px;border:1px solid #e5eaf4;border-radius:14px;margin-top:6px"></label><label>الصف الدراسي<input id="grade" value="الصف الثاني الإعدادي" style="width:100%;padding:13px;border:1px solid #e5eaf4;border-radius:14px;margin-top:6px"></label><label>مستوى اللغة<select id="level" style="width:100%;padding:13px;border:1px solid #e5eaf4;border-radius:14px;margin-top:6px"><option>A1</option><option>A2</option><option>B1</option><option>B2</option></select></label><label>أهداف التعلم<textarea id="goals" rows="4" style="width:100%;padding:13px;border:1px solid #e5eaf4;border-radius:14px;margin-top:6px"></textarea></label><button class="hm-btn" type="submit">💾 حفظ ملف الطالب</button></form><p id="status" style="font-weight:800"></p></section></main></div><footer class="hm-footer">HM Academy © 2026</footer><script src="scripts/i18n.js?v=20260810"></script><script>const form=document.getElementById('studentForm');const saved=JSON.parse(localStorage.getItem('hm_student_profile')||'null');if(saved){fullName.value=saved.name||'';email.value=saved.email||'';grade.value=saved.grade||'الصف الثاني الإعدادي';level.value=saved.level||'A1';goals.value=saved.goals||''}form.addEventListener('submit',e=>{e.preventDefault();localStorage.setItem('hm_student_profile',JSON.stringify({name:fullName.value,email:email.value,grade:grade.value,level:level.value,goals:goals.value}));status.textContent='✓ تم حفظ بيانات الطالب ويمكن استخدامها داخل لوحة الطالب.';});</script></body></html>
