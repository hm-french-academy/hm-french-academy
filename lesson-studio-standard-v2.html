<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Learning Studio</title><style>body{margin:0;background:#f4f7fc;color:#17223b;font-family:Arial,"Cairo",sans-serif}.wrap{max-width:1120px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff;border-radius:28px;padding:24px}.hero h1{margin:0 0 6px}.hero p{line-height:1.8;margin:5px 0}.journey,.nav{display:flex;gap:7px;overflow:auto}.journey{margin-top:14px}.journey span,.nav button{white-space:nowrap;border-radius:13px;padding:10px 13px;font-weight:900}.journey span{background:#ffffff22;border:1px solid #ffffff44}.nav{background:#fff;padding:8px;border-radius:18px;margin:14px 0}.nav button{border:0;background:#eef3ff;color:#173a82;cursor:pointer}.nav button.active{background:#e92d83;color:#fff}.panel{background:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 30px #14264a12}.group{margin:0 0 26px}.group-head{padding:16px 18px;border-radius:18px;background:#f5f8ff;border:1px solid #dfe7f5;margin-bottom:13px}.group-head h3{margin:0;color:#173a82;font-size:24px}.group-head p{margin:5px 0 0;color:#64748b}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.card{border:1px solid #e1e6ef;border-radius:18px;padding:15px}.icon{text-align:center;font-size:52px;padding:8px}.fr{font-weight:900;direction:ltr;text-align:center;font-size:20px}.ar{color:#315aa4;font-weight:800;text-align:center}.example{background:#f7f9fd;border-radius:12px;padding:10px;margin-top:8px;direction:ltr;text-align:left}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;margin:7px 3px 0 0}.primary{background:#2563eb;color:#fff}.secondary{background:#edf3ff;color:#173a82}.goal{background:#f7f9fd;border-radius:16px;padding:15px;line-height:2}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}.option{padding:12px;border:1px solid #dbe1eb;border-radius:11px;background:#fff;font-weight:800;cursor:pointer}.option:disabled{opacity:.7}.feedback{min-height:24px;font-weight:800;margin-top:10px}.dialogue{border-right:4px solid #e92d83;padding:12px;margin:8px 0;background:#fff7fb;border-radius:12px}.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.file{padding:18px;border:1px solid #e1e6ef;border-radius:16px;font-weight:900}.file a{color:#2563eb;text-decoration:none}.complete{margin-top:14px;background:#fff;border-radius:20px;padding:17px;display:flex;justify-content:space-between;gap:12px;align-items:center}.section-note{padding:12px 15px;border-radius:14px;background:#f8fafc;color:#5b677a;line-height:1.8;margin-bottom:16px}@media(max-width:650px){.complete{display:block}.panel{padding:14px}}</style></head><body><div class="wrap"><section class="hero"><h1 id="title">Learning Studio</h1><p id="subtitle">HM Academy</p><div class="journey"><span>🚀 استكشف</span><span>🖼️ تعلم</span><span>💬 تواصل</span><span>📘 افهم</span><span>🎮 تدرب</span><span>🏆 قيّم نفسك</span></div></section><nav class="nav" id="nav"></nav><section class="panel" id="panel"></section><section class="complete"><div><b>🏁 رحلة التعلم</b><div id="status">تقدمك محفوظ على هذا الجهاز.</div></div><button class="btn primary" id="complete">إكمال الدرس</button></section></div><script>const qs=new URLSearchParams(location.search),id=qs.get('id')||'grade8-u1-l1',requested=qs.get('section')||'introduction';const map={'grade8-u1-l1':'data/lessons/grade-8/unit-1/lesson-1.json','grade8-u1-l2':'data/lessons/grade-8/unit-1/lesson-2.json','grade8-u1-l3':'data/lessons/grade-8/unit-1/lesson-3.json','grade8-u1-l4':'data/lessons/grade-8/unit-1/lesson-4.json','grade8-u2-l1':'data/lessons/grade-8/unit-2/lesson-1.json','grade8-u2-l2':'data/lessons/grade-8/unit-2/lesson-2.json','grade8-u2-l3':'data/lessons/grade-8/unit-2/lesson-3.json','grade8-u2-l4':'data/lessons/grade-8/unit-2/lesson-4.json','grade8-u3-l1':'data/lessons/grade-8/unit-3/lesson-1.json','grade8-u3-l2':'data/lessons/grade-8/unit-3/lesson-2.json','grade8-u3-l3':'data/lessons/grade-8/unit-3/lesson-3.json','grade8-u3-l4':'data/lessons/grade-8/unit-3/lesson-4.json'};let d={};function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.86;speechSynthesis.speak(u)}function check(btn){const c=btn.closest('.card');const bs=c.querySelectorAll('.option');bs.forEach(b=>b.disabled=true);const ok=btn.dataset.answer==='true';btn.style.borderColor=ok?'#20a45a':'#d9534f';c.querySelector('.feedback').textContent=ok?'✅ صحيح! أحسنت.':'❌ ليست الإجابة الصحيحة. راجع محتوى الدرس ثم حاول مرة أخرى.'}function qcard(x,i){const opts=x.options||[],ans=x.answer??x.correct;return `<article class="card"><b>${i+1}. ${x.question||''}</b><div class="options">${opts.map((o,j)=>`<button class="option" data-answer="${j===ans}" onclick="check(this)">${o}</button>`).join('')}</div><div class="feedback"></div></article>`}function intro(){return `<h2>🚀 ضربة البداية</h2><p>${d.title||'هذا الدرس'} جزء من <b>${d.unit||'الوحدة'}</b>. استكشف الموضوع سريعًا ثم ابدأ رحلة التعلم.</p><div class="goal"><b>🎯 ماذا ستتعلم؟</b><br>🖼️ مفردات الدرس وتصنيفها حسب السياق<br>📘 القاعدة من خلال أمثلة الدرس<br>💬 محادثة مرتبطة بالموضوع<br>🎮 تدريب وألعاب ثم تقييم</div><h3>🧭 خريطة الرحلة</h3><div class="cards"><button class="btn primary" onclick="go('vocabulary')">🖼️ تعلم المفردات</button><button class="btn secondary" onclick="go('grammar')">📘 افهم القاعدة</button><button class="btn secondary" onclick="go('conversation')">💬 استمع للمحادثة</button><button class="btn secondary" onclick="go('practice')">🎯 تدرب بنفسك</button><button class="btn secondary" onclick="go('games')">🎮 تحدَّ نفسك</button><button class="btn secondary" onclick="go('assessment')">🏆 قيّم نفسك</button></div>`}function vocabulary(){const groups=d.vocabularyGroups||[{id:'all',title:'🖼️ مفردات الدرس',description:'مفردات الدرس كاملة.'}];return `<h2>🖼️ مفردات الدرس</h2><p class="section-note">تم تنظيم المفردات حسب السياق حتى لا تختلط مرافق المدرسة بمفردات الفصل.</p>${groups.map(g=>{const vs=(d.vocabulary||[]).filter(v=>!v.category||v.category===g.id);return `<section class="group"><div class="group-head"><h3>${g.title}</h3><p>${g.description||''}</p></div><div class="cards">${vs.map(v=>`<article class="card"><div class="icon">${v.image||'🖼️'}</div><div class="fr">${v.word||''}</div><div class="ar">${v.translation||''}</div><div class="example">${v.example||''}</div><button class="btn primary" onclick='speak(${JSON.stringify(v.word||'')})'>🔊 نطق الكلمة</button><button class="btn secondary" onclick='speak(${JSON.stringify(v.example||'')})'>▶ نطق المثال</button></article>`).join('')}</div></section>`}).join('')}` }function grammar(){return `<h2>📘 ${d.grammar?.title||'قاعدة الدرس'}</h2><div class="goal">${d.grammar?.explanation||'افهم القاعدة من خلال أمثلة الدرس.'}</div>${(d.grammar?.steps||[]).map((s,i)=>`<p><b>${i+1}.</b> ${s}</p>`).join('')}<h3>أمثلة</h3><div class="cards">${(d.grammar?.examples||[]).map(e=>`<article class="card"><div class="example">${e.fr||''}</div><p>${e.ar||''}</p><button class="btn" onclick='speak(${JSON.stringify(e.fr||'')})'>🔊 استمع</button></article>`).join('')}</div>`}function conversation(){return `<h2>💬 محادثة الدرس</h2><p>استمع إلى كل جملة ثم حاول تقليدها.</p>${(d.conversation?.lines||[]).map(x=>`<div class="dialogue"><b>${x.speaker||''}</b> <span dir="ltr">${x.fr||''}</span><br>${x.ar||''}<br><button class="btn" onclick='speak(${JSON.stringify(x.fr||'')})'>🔊 استمع</button></div>`).join('')}`}function practice(){const a=d.practice||[];return `<h2>🎯 تدرّب بنفسك</h2><p>أسئلة مرتبطة بالمحتوى الفعلي لهذا الدرس.</p><div class="cards">${a.map(qcard).join('')}</div>`}function assessment(){const a=d.assessment?.questions||[];return `<h2>🏆 التقييم</h2><p>تقييم مرتبط بالمحتوى الفعلي للدرس.</p><div class="cards">${a.map(qcard).join('')}</div>`}function games(){const v=d.vocabulary||[],first=v[0]||{},pool=[...v].sort(()=>Math.random()-.5).slice(0,4);return `<h2>🎮 الألعاب التعليمية</h2><div class="cards"><article class="card"><div class="icon">🧩</div><h3>الصورة → المعنى</h3><div class="icon">${first.image||'🖼️'}</div><div class="options">${pool.map(x=>`<button class="option" data-answer="${x.word===first.word}" onclick="check(this)">${x.translation}</button>`).join('')}</div><div class="feedback"></div></article><article class="card"><div class="icon">🎯</div><h3>التقاط الكلمات</h3><p>اختر الكلمة الفرنسية المناسبة للصورة. لا تظهر الإجابة مسبقًا.</p><div class="icon">${first.image||'🖼️'}</div><div class="options">${pool.map(x=>`<button class="option" data-answer="${x.word===first.word}" onclick="check(this)">${x.word}</button>`).join('')}</div><div class="feedback"></div></article></div>`}function files(){const f=d.files||{};return `<h2>📁 ملفات الدرس</h2><p>مواد التعلم والمراجعة الخاصة بهذا الدرس فقط.</p><div class="files">${[['🧠','الشرح التفاعلي',f.interactive],['📖','المرجع',f.reference],['📝','التقييم',f.assessment],['💻','الاختبار',f.quiz],['🎮','الألعاب',f.games]].filter(x=>x[2]).map(x=>`<div class="file">${x[0]} <a href="${x[2]}">${x[1]}</a></div>`).join('')}</div>`}const views={introduction:intro,vocabulary,grammar,conversation,practice,games,assessment,files};function go(n){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.k===n));document.getElementById('panel').innerHTML=(views[n]||intro)()}function render(){document.getElementById('title').textContent=d.title||'Learning Studio';document.getElementById('subtitle').textContent=(d.unit||'HM Academy')+' • رحلة تعلم متكاملة';const items=[['introduction','🚀 الاستكشاف'],['vocabulary','🖼️ المفردات'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','🎯 التدريب'],['games','🎮 الألعاب'],['assessment','🏆 التقييم'],['files','📁 الملفات']];const nav=document.getElementById('nav');nav.innerHTML=items.map(x=>`<button data-k="${x[0]}">${x[1]}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.k));go(views[requested]?requested:'introduction')}fetch(map[id]||map['grade8-u1-l1']).then(r=>r.json()).then(x=>{d=x;render()}).catch(()=>{d={title:'تعذر تحميل الدرس',unit:'HM Academy'};render()});const key='hm_completed_'+id;if(localStorage.getItem(key)){document.getElementById('status').textContent='✅ أكملت هذا الدرس سابقًا.';document.getElementById('complete').disabled=true}document.getElementById('complete').onclick=()=>{localStorage.setItem(key,'1');document.getElementById('status').textContent='🏆 تم حفظ إكمال الدرس.';document.getElementById('complete').disabled=true};</script></body></html>
