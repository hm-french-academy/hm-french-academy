<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy — Lesson 7 Two Modes Preview</title><style>body{margin:0;background:#f4f7fb;color:#17233d;font-family:Arial,"Noto Sans Arabic",sans-serif}.wrap{max-width:1050px;margin:auto;padding:12px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#0f9f91);color:#fff;padding:22px;border-radius:24px}.hero h1{margin:8px 0}.switch{display:flex;gap:8px;margin:12px 0}.switch button,.next{flex:1;padding:13px;border:0;border-radius:13px;font-weight:900;cursor:pointer;background:#e8eef8;color:#173a82}.switch .on,.next{background:#2563eb;color:#fff}.panel{background:#fff;border-radius:22px;padding:18px;min-height:610px;box-shadow:0 8px 28px #0001}.stepbar{display:flex;gap:6px;overflow:auto;margin-bottom:15px}.stepbar button{border:0;border-radius:10px;padding:9px;white-space:nowrap;background:#edf2fb}.stepbar .on{background:#2563eb;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.card{border:1px solid #dfe6f1;border-radius:17px;padding:15px;background:#fff}.word{direction:ltr;text-align:center;font-size:23px;font-weight:900}.ar{text-align:center;color:#3560a7}.ico{font-size:32px}.audio{text-align:center;margin-top:10px}.btn{border:0;border-radius:10px;padding:9px 12px;background:#2563eb;color:#fff;font-weight:800}.bubble{padding:13px;border-radius:16px;background:#eef4ff;margin:9px 0;line-height:1.9;max-width:82%}.me{margin-right:auto;background:#fff0f7}.rule{background:#f8faff;border-right:5px solid #0f9f91;padding:17px;border-radius:14px;line-height:2}.formula{direction:ltr;text-align:center;font-size:23px;font-weight:900}.q{border:1px solid #dfe6f1;border-radius:16px;padding:15px}.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.opts button{padding:10px;border:1px solid #dfe6f1;border-radius:10px;background:#fff}.muted{color:#6c7890;line-height:1.8}.video{aspect-ratio:16/9;background:#17213f;color:#fff;border-radius:17px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:25px}@media(max-width:550px){.wrap{padding:7px}.panel{padding:12px}.opts{grid-template-columns:1fr 1fr}}</style><body><div class="wrap"><div class="hero"><div>🇫🇷 HM Academy · معاينة قبل اعتماد أي تغيير</div><h1>الدرس 7 — Tu as quel âge ?</h1><div>نفس المحتوى — طريقتان مختلفتان لعرض الدرس من الداخل</div></div><div class="switch"><button id="m0" onclick="mode=0;step=0;render()">🧭 رحلة الدرس</button><button id="m1" onclick="mode=1;step=0;render()">⚡ الدرس التفاعلي</button></div><div class="panel"><div id="steps" class="stepbar"></div><div id="view"></div></div></div><script>let mode=0,step=0;const vocab=[['Quel âge as-tu ?','كم عمرك؟'],['J’ai treize ans.','عمري 13 سنة'],['Tu as quel âge ?','كم عمرك؟']];const stages=[['🚀','البداية'],['🖼️','المفردات'],['🎧','النطق'],['📘','القواعد'],['💬','المحادثة'],['✍️','التدريب'],['🎬','الفيديو'],['🎮','الألعاب'],['🧠','المراجعة'],['🏆','التقييم']];function sp(t){if(speechSynthesis){let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';speechSynthesis.speak(u)}}function cards(){return `<div class="grid">${vocab.map(x=>`<div class="card"><div class="ico">🧩</div><div class="word">${x[0]}</div><div class="ar">${x[1]}</div><div class="audio"><button class="btn" onclick="sp('${x[0].replaceAll("'","\\'")}')">🔊 اسمع</button></div></div>`).join('')}</div>`}function quiz(){return `<div class="q"><b>Complète : J’___ treize ans.</b><div class="opts">${['ai','as','a'].map(x=>`<button onclick="this.style.background=x==='ai'?'#e9f8f0':'#fff0f2'">${x}</button>`).join('')}</div></div>`}function intro(){return `<div class="card"><div class="ico">🎯</div><h2>كم عمرك؟</h2><p class="muted">سنتعلم كيف نسأل عن العمر وكيف نجيب باستخدام فعل avoir.</p><button class="next" onclick="step=1;render()">ابدأ الدرس ←</button></div>`}function render(){document.getElementById('m0').className=mode===0?'on':'';document.getElementById('m1').className=mode===1?'on':'';document.getElementById('steps').innerHTML=mode===0?stages.map((x,i)=>`<button class="${i===step?'on':''}" onclick="step=${i};render()">${x[0]} ${x[1]}</button>`).join(''):'';let h='';if(mode===0){if(step===0)h=`<h2>🚀 البداية</h2>${intro()}`;if(step===1)h=`<h2>🖼️ المفردات</h2><p class="muted">بطاقات المفردات داخل المرحلة.</p>${cards()}`;if(step===2)h=`<h2>🎧 النطق</h2><p class="muted">استمع ثم كرر كل عبارة.</p>${cards()}`;if(step===3)h=`<h2>📘 القواعد</h2><div class="rule"><h3>Le verbe avoir</h3><p>نستخدم avoir للتعبير عن العمر.</p><div class="formula">J’ai · Tu as · Il/Elle a · Nous avons · Vous avez · Ils/Elles ont</div></div>`;if(step===4)h=`<h2>💬 المحادثة</h2><div class="bubble">👦 Amr: Quel âge as-tu ?<br><button class="btn" onclick="sp('Quel âge as-tu ?')">🔊</button></div><div class="bubble me">👧 Seif: J’ai treize ans.<br><button class="btn" onclick="sp('J’ai treize ans.')">🔊</button></div>`;if(step===5)h=`<h2>✍️ التدريب</h2>${quiz()}`;if(step===6)h=`<h2>🎬 الفيديو</h2><div class="video">▶️<br>منطقة الفيديو التعليمي</div>`;if(step===7)h=`<h2>🎮 اللعبة</h2><div class="card" style="text-align:center"><div class="ico">🎯</div><p>اختر الإجابة الصحيحة بأسرع وقت.</p><button class="next" onclick="this.textContent='🎉 أحسنت!'">ابدأ اللعبة</button></div>`;if(step===8)h=`<h2>🧠 المراجعة الذكية</h2><div class="card"><b>راجع:</b><p>J’ai treize ans.</p><button class="btn" onclick="this.textContent='✓ تمت المراجعة'">راجع</button></div>`;if(step===9)h=`<h2>🏆 التقييم</h2>${quiz()}`}else{h=`<h2>⚡ الدرس التفاعلي</h2><p class="muted">هنا نفس محتوى الدرس، لكن الطالب لا يشعر أنه يفتح صفحات منفصلة؛ المحتوى يتدفق في تجربة واحدة.</p><div class="card"><div class="ico">👋</div><h3>تمهيد</h3><p>Quel âge as-tu ?</p></div><div class="card"><h3>🖼️ اكتشف</h3>${cards()}</div><div class="rule"><h3>📘 افهم</h3><p>avoir + العمر</p><div class="formula">J’ai treize ans.</div></div><div class="card"><h3>💬 استخدمها</h3><div class="bubble">Quel âge as-tu ?</div><div class="bubble me">J’ai treize ans.</div></div><div class="card"><h3>✍️ جرّب</h3>${quiz()}</div><div class="card"><h3>🎮 تحدٍ سريع</h3><button class="next" onclick="this.textContent='🎉 أحسنت! التحدي مكتمل'">ابدأ التحدي</button></div>`}document.getElementById('view').innerHTML=h}render();</script></body></html>
