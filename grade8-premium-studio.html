<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Grade 8 Premium Studio</title><style>body{margin:0;background:#f5f7fb;color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:1050px;margin:auto;padding:16px}.hero,.panel{background:#fff;border-radius:24px;padding:22px;margin-bottom:14px;box-shadow:0 10px 30px #14264a12}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff}.hero h1{margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{display:block;text-decoration:none;color:#173a82;background:#f7f9fd;border:1px solid #dfe6f2;border-radius:18px;padding:18px;font-weight:900}.card b{display:block;font-size:20px;margin-bottom:7px}.muted{color:#66738a;line-height:1.8}.video{background:#fff7fb}.review{background:linear-gradient(135deg,#f3efff,#f7f9ff);border-color:#cfc4ff}.back{display:inline-block;margin-bottom:12px;text-decoration:none;background:#eef3ff;color:#173a82;padding:10px 14px;border-radius:12px;font-weight:900}</style></head><body><div class="wrap"><a class="back" href="index.html">⌂ الرئيسية</a><section class="hero"><h1 id="title">HM Academy — Premium Lesson Studio</h1><p id="subtitle">جارٍ تحميل الدرس…</p></section><section class="panel"><h2>🚀 مسارات الدرس المعتمدة</h2><div id="links" class="grid"></div></section><section class="panel"><h2>🎬 الفيديو</h2><div id="videos" class="grid"></div></section><section class="panel"><p class="muted">هذا المسار يحافظ على نموذج الصف الثاني الإعدادي المعتمد: الدرس، الملفات والمرجع، النطق، الفيديو، الألعاب، الاختبار التفاعلي، والتقييم الرسمي، وكل منها مستقل عن الآخر.</p></section></div><script>(async function(){const p=new URLSearchParams(location.search),id=p.get('id')||'grade8-u1-l1',m=id.match(/^grade8-u(\d+)-l(\d+)$/);if(!m){document.getElementById('subtitle').textContent='معرف الدرس غير صالح';return}const u=m[1],l=m[2],base=`data/lessons/grade-8/unit-${u}/`;let d=null;try{const r=await fetch(`${base}lesson-${l}-manifest.json?ts=${Date.now()}`,{cache:'no-store'});if(r.ok)d=await r.json()}catch(e){}document.getElementById('subtitle').textContent=d?.title||`Leçon ${l} — Unité ${u}`;const links=document.getElementById('links');const add=(label,href,desc,cls='')=>{if(!href)return;const a=document.createElement('a');a.className='card '+cls;a.href=href;a.innerHTML=`<b>${label}</b><span>${desc||''}</span>`;links.appendChild(a)};add('🖼️ الدرس التفاعلي',`lesson.html?id=${id}&section=vocabulary`,'Learning Studio والمفردات');add('🧠 المراجعة الذكية',`smart-review.html?lesson=${id}`,'المراجعة المستقلة الخاصة بهذا الدرس','review');add('🗂️ الملفات والمرجع',d?.referenceFile||`${base}reference_lecon${l}_unite1.html`,'المادة المرجعية الكاملة');const pron=d?.activities?.find(x=>x.type==='pronunciation')?.file||`${base}pronunciation_challenge_lecon${l}_unite1.html`;add('🔊 صفحة النطق',pron,'صفحة النطق والتدريب الصوتي');add('🎮 مركز الألعاب',d?.gamesHubFile||`${base}lesson-${l}-games.html`,'ألعاب وتدريبات الدرس');add('🧠 الاختبار التفاعلي',d?.interactiveAssessmentFile||`interactive-assessment.html?lesson=${id}`,'تقييم تفاعلي مستقل');add('🏆 التقييم الرسمي',d?.assessmentFile||`${base}formal_assessment_lecon${l}_unite1.html`,'التقييم الرسمي المستقل');const vs=document.getElementById('videos');(d?.videoLinks||[]).forEach(v=>{const a=document.createElement('a');a.className='card video';a.target='_blank';a.rel='noopener';a.href=v.url;a.innerHTML=`<b>🎬 ${v.title||'فيديو الدرس'}</b><span>فتح الفيديو</span>`;vs.appendChild(a)});if(!vs.children.length)vs.innerHTML='<div class="muted">لا يوجد رابط فيديو مسجل في Manifest هذا الدرس.</div>';})()</script></body></html>
