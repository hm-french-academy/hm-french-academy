<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b6c"><title>HM Academy | Premium Lesson Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:#24344d;font-family:Arial,Tahoma,sans-serif;user-select:none;-webkit-user-select:none}.app{max-width:1080px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 2px 12px}.brand{font-weight:900;color:#173b6c}.tools{display:flex;gap:8px;align-items:center}.btn,.choice,.word{border:0;border-radius:14px;padding:12px 16px;font-weight:900;cursor:pointer;font-size:16px;touch-action:manipulation}.btn:disabled{opacity:.45;cursor:not-allowed}.light{background:#eef4fb;color:#173b6c}.primary{background:#173b6c;color:#fff}.counter{font-weight:900;color:#68758a}.bar{height:8px;background:#e3eaf3;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#2d74da;transition:.3s}.status{margin-top:15px;padding:13px;border-radius:14px;background:#eef6ff;font-weight:800}.screen{display:none;margin-top:14px;min-height:620px;border-radius:30px;padding:28px;background:#fff;border:1px solid #dce5f0}.screen.active{display:block}.hero{background:linear-gradient(145deg,#173b6c,#2d74da 60%,#18a78b);color:#fff}.hero h1{font-size:clamp(42px,8vw,74px);margin:24px 0 8px}.hero h2{font-size:clamp(20px,4vw,30px)}.title{color:#173b6c;font-size:clamp(30px,5vw,48px);margin:4px 0 8px}.sub,.lead{line-height:1.9;font-weight:700;max-width:820px}.sub{color:#68758a}.cards,.gamegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}.card,.game{border:1px solid #dce5f0;border-radius:22px;padding:18px;text-align:center;background:#fff;box-shadow:0 10px 25px #173b6c0b}.emoji{font-size:42px}.fr{direction:ltr;color:#173b6c;font-weight:900;font-size:22px;margin:8px 0}.ar{color:#68758a;font-weight:800}.speak{cursor:pointer}.choices,.wordbank,.sentence{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}.choice,.word{border:2px solid #d7e1ee;background:#fff}.choice.correct{background:#dff7ea;border-color:#25a56a}.choice.wrong{background:#ffe7e7;border-color:#d55}.result{margin-top:14px;font-weight:900;min-height:26px}.dialogue{display:grid;gap:10px;margin-top:20px}.line{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:13px;border-radius:17px;background:#eef6ff}.say{direction:ltr;text-align:left;font-weight:900;font-size:18px;cursor:pointer}.play{border:0;border-radius:50%;width:44px;height:44px;cursor:pointer;background:#173b6c;color:#fff}.activity{margin-top:20px;padding:20px;border-radius:22px;background:#eef6ff}.sentence{min-height:58px;padding:10px;border-radius:15px;background:#fff;border:2px dashed #cdd9e8;direction:ltr}.media{margin-top:18px;aspect-ratio:16/9;background:#101820;border-radius:22px;overflow:hidden}.media iframe{width:100%;height:100%;border:0}.score{font-size:46px;font-weight:900;color:#173b6c;text-align:center;margin:22px}.stars{text-align:center;font-size:48px;letter-spacing:6px}.nav{position:sticky;bottom:10px;display:flex;justify-content:space-between;gap:12px;margin-top:24px;padding:12px;border-radius:18px;background:#ffffffee;box-shadow:0 8px 30px #173b6c18;z-index:5}.nav .next{min-width:150px}.reference{position:fixed;inset:0;background:#173b6c66;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.reference.open{display:flex}.refbox{width:min(760px,100%);max-height:85vh;overflow:auto;background:#fff;border-radius:26px;padding:24px}.ref-item{padding:14px;border-radius:15px;background:#f4f7fb;margin:9px 0;font-weight:800}.small{font-size:14px;color:#68758a}@media(max-width:760px){.cards,.gamegrid{grid-template-columns:1fr}.screen{min-height:680px;padding:20px}.say{font-size:15px}.tools{flex-direction:column;align-items:flex-end}.nav{bottom:6px}.nav .next{min-width:135px}}
</style></head>
<body><main class="app">
<div class="top"><div><div class="brand">🇫🇷 HM Academy · Premium Lesson Studio</div><div id="lessonLabel">الصف الثالث الابتدائي</div></div><div class="tools"><button class="btn light" id="referenceBtn">📘 المرجع</button><div class="counter" id="counter">—</div></div></div>
<div class="bar"><i id="progress" style="width:0%"></i></div><div id="loading" class="status">جاري تحميل محتوى الدرس المرجعي…</div><div id="studio" hidden></div></main>
<div class="reference" id="reference"><div class="refbox"><button class="btn light" id="closeRef">إغلاق</button><h2>📘 مرجع الدرس</h2><div id="refContent"></div></div></div>
<script>
const DATA='data/lessons/grade-3/studio/g3-l01.json';let lesson=null,step=0,score=0,assessmentScore=0,attempts=0;
const $=s=>document.querySelector(s);const norm=s=>String(s??'').trim().replace(/[؟?!.,]/g,'').replace(/\s+/g,' ').toLowerCase();
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function speak(text){if(!text||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}
function accepted(el){try{return JSON.parse(el.dataset.accepted||'[]')}catch{return[]}}
function choiceHandler(e){const b=e.target.closest('.choice');if(!b)return;const box=b.closest('.choices');if(!box||box.dataset.locked==='1')return;const ok=accepted(box).some(a=>norm(a)===norm(b.textContent));b.classList.add(ok?'correct':'wrong');const r=box.parentElement.querySelector('.result');if(ok){box.dataset.locked='1';r.textContent='🎉 رائع! إجابة صحيحة.';r.style.color='#188653';score++;if(box.dataset.assessment==='1')assessmentScore++}else{attempts++;r.textContent='💡 جرّب مرة أخرى.';r.style.color='#b54b4b'}updateProgress()}
function choices(q,assessment=false){return `<div class="choices" data-id="${esc(q.id)}" data-assessment="${assessment?'1':'0'}" data-accepted='${JSON.stringify(q.acceptedAnswers)}'>${q.options.map(o=>`<button class="choice">${esc(o)}</button>`).join('')}</div><div class="result"></div>`}
function vocab(){return lesson.vocabulary.map(v=>`<div class="card"><div class="emoji">🔤</div><div class="fr speak" data-speak="${esc(v.audio||v.fr)}">${esc(v.fr)}</div><div class="ar">${esc(v.ar)}</div><button class="btn light speak" data-speak="${esc(v.audio||v.fr)}">🔊 اسمع</button></div>`).join('')}
function listening(){return lesson.listening.map(q=>`<div class="activity"><b>🎧 ${esc(q.prompt)}</b><br><button class="btn primary speak" data-speak="${esc(q.audio)}">🔊 اسمع</button>${choices(q)}</div>`).join('')}
function practice(){return lesson.practice.map(q=>`<div class="activity"><div class="fr speak" data-speak="${esc(q.prompt)}">${esc(q.prompt)}</div>${choices(q)}</div>`).join('')}
function grammar(){return lesson.grammar.map(g=>`<div class="card"><div class="emoji">🧠</div><h3>${esc(g.label)}</h3>${g.questionForms.map(x=>`<div class="fr speak" data-speak="${esc(x)}">${esc(x)}</div>`).join('')}<hr>${g.answers.map(x=>`<div class="ar speak" data-speak="${esc(x)}">${esc(x)} 🔊</div>`).join('')}<p class="small">${esc(g.note)}</p></div>`).join('')}
function conversation(){return lesson.conversation.map(l=>`<div class="line"><span>${esc(l.speaker)}</span><span class="say speak" data-speak="${esc(l.audio||l.text)}">${esc(l.text)}</span><button class="play speak" data-speak="${esc(l.audio||l.text)}">🔊</button></div>`).join('')}
function games(){return lesson.games.map((g,i)=>`<div class="game"><div class="emoji">${i===0?'🎧':i===1?'🧩':i===2?'🃏':'🎯'}</div><h3>${esc(g.title)}</h3><p>${esc(g.description)}</p><button class="btn primary gameBtn" data-game="${esc(g.id)}">ابدأ اللعبة</button></div>`).join('')}
function assessment(){return lesson.assessment.map(q=>`<div class="activity"><div class="fr speak" data-speak="${esc(q.audio||'')}">${esc(q.prompt)}</div>${q.audio?`<button class="btn primary speak" data-speak="${esc(q.audio)}">🔊 اسمع</button>`:''}${choices(q,true)}</div>`).join('')}
function nav(){return `<div class="nav"><button class="btn light prev">← السابق</button><button class="btn primary next">التالي →</button></div>`}
function build(){const s=$('#studio');const mood=lesson.expressions.find(x=>x.id==='ask-mood');s.innerHTML=`
<section class="screen active hero"><div>🚀 رحلة التعلم</div><h1>${esc(lesson.title)}</h1><h2>هيا نتعرف على بعضنا!</h2><p class="lead">${esc(lesson.objectives.join(' · '))}</p>${nav()}</section>
<section class="screen"><h1 class="title">👀 اكتشف أولًا</h1><p class="sub">اضغط على أي جملة أو 🔊 لسماعها.</p><div class="cards">${lesson.expressions.map(x=>`<div class="card"><div class="emoji">${x.category==='الحال'?'😊':x.category==='العمر'?'🎂':'🪪'}</div><h3>${esc(x.category)}</h3>${x.questions.map(q=>`<div class="fr speak" data-speak="${esc(q)}">${esc(q)} 🔊</div>`).join('')}<hr>${x.answers.map(a=>`<div class="ar speak" data-speak="${esc(a)}">${esc(a)} 🔊</div>`).join('')}</div>`).join('')}</div>${nav()}</section>
<section class="screen"><h1 class="title">🎭 الشخصيات والحوار</h1><p class="sub">استمع إلى كل دور، ثم حاول تقليده.</p><div class="dialogue">${conversation()}</div>${nav()}</section>
<section class="screen"><h1 class="title">🧩 المفردات</h1><p class="sub">كل مفردة مرتبطة بالمعنى والنطق.</p><div class="cards">${vocab()}</div>${nav()}</section>
<section class="screen"><h1 class="title">🎧 اسمع واختر</h1><p class="sub">أكثر من سؤال وأكثر من إجابة من المادة الأصلية.</p>${listening()}${nav()}</section>
<section class="screen"><h1 class="title">🗣️ حان دورك</h1><p class="sub">سؤال الحال يقبل الإجابات الأربع الواردة في المصدر.</p>${practice()}${nav()}</section>
<section class="screen"><h1 class="title">🧠 اكتشف القاعدة</h1><p class="sub">نبدأ بالأمثلة ثم نفهم وظيفة كل صيغة.</p><div class="cards">${grammar()}</div>${nav()}</section>
<section class="screen"><h1 class="title">🎬 الوسائط</h1><p class="sub">الوسائط الأصلية جزء من رحلة الدرس.</p><div class="media"><iframe src="https://www.youtube.com/embed/${encodeURIComponent(lesson.media.youtubeId)}" title="${esc(lesson.media.title)}" allowfullscreen></iframe></div>${nav()}</section>
<section class="screen"><h1 class="title">🎮 مركز الألعاب</h1><p class="sub">ألعاب مرتبطة مباشرة بمحتوى الدرس.</p><div class="gamegrid">${games()}</div><div id="gameArea"></div>${nav()}</section>
<section class="screen"><h1 class="title">🏆 التقييم النهائي</h1><p class="sub">التقييم يستخدم نفس الإجابات المعتمدة في المصدر.</p><div id="assessment">${assessment()}</div>${nav()}</section>
<section class="screen"><h1 class="title">🎉 أحسنت!</h1><div class="score" id="finalScore">0 / ${lesson.assessment.length}</div><div class="stars" id="stars">☆☆☆☆☆</div><p class="sub" id="finalMessage"></p><div class="activity"><b>📘 راجع ما تحتاجه</b><p class="small">يمكنك فتح مرجع الدرس في أي وقت.</p></div><div class="nav"><button class="btn light prev">← السابق</button><button class="btn primary" id="finish">إنهاء الدرس ✓</button></div></section>`;attach()}
function attach(){document.querySelectorAll('.next').forEach(b=>b.onclick=()=>go(step+1));document.querySelectorAll('.prev').forEach(b=>b.onclick=()=>go(step-1));document.querySelectorAll('.choices').forEach(x=>x.addEventListener('click',choiceHandler));document.querySelectorAll('.speak').forEach(x=>x.addEventListener('click',()=>speak(x.dataset.speak||x.textContent)));document.querySelectorAll('.gameBtn').forEach(x=>x.onclick=()=>runGame(x.dataset.game));$('#finish').onclick=()=>go(0)}
function runGame(id){const area=$('#gameArea');const g=lesson.games.find(x=>x.id===id);if(!g)return;if(id==='sentence-builder'){let pool=[...g.target].sort(()=>Math.random()-.5);area.innerHTML=`<div class="activity"><h3>🧩 ابنِ الجملة</h3><div class="sentence" id="sentence"></div><div class="wordbank">${pool.map(w=>`<button class="word" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div><div class="result" id="gameResult"></div></div>`;const sent=$('#sentence');area.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{b.disabled=true;const x=document.createElement('button');x.className='word';x.textContent=b.dataset.w;x.onclick=()=>{x.remove();b.disabled=false};sent.appendChild(x);const words=[...sent.children].map(n=>n.textContent);if(words.length===g.target.length){const ok=words.every((w,i)=>w===g.target[i]);$('#gameResult').textContent=ok?g.successMessage:g.retryMessage;if(ok)speak(g.audio)}})}else{const answers=mood?.answers||[];area.innerHTML=`<div class="activity"><h3>${esc(g.title)}</h3><p>${esc(g.description)}</p><div class="choices" data-id="game-${esc(id)}" data-accepted='${JSON.stringify(answers)}'>${answers.map(a=>`<button class="choice">${esc(a)}</button>`).join('')}</div><div class="result"></div></div>`;area.querySelector('.choices').addEventListener('click',choiceHandler)}}
function go(n){const screens=[...document.querySelectorAll('.screen')];if(n<0)n=0;if(n>=screens.length)n=screens.length-1;screens.forEach((x,i)=>x.classList.toggle('active',i===n));step=n;updateProgress();window.scrollTo({top:0,behavior:'smooth'});if(n===screens.length-1){const total=lesson.assessment.length;const pct=total?assessmentScore/total:0;$('#finalScore').textContent=`${Math.min(assessmentScore,total)} / ${total}`;const stars=Math.round(pct*5);$('#stars').textContent='★'.repeat(stars)+'☆'.repeat(5-stars);$('#finalMessage').textContent=stars>=4?'🏆 ممتاز! أنهيت الرحلة بقوة.':stars>=3?'👏 جيد جدًا! راجع الأخطاء ثم أعد المحاولة.':'💪 راجع مرجع الدرس وحاول مرة أخرى.'}}
function updateProgress(){$('#counter').textContent=`${step+1} / ${document.querySelectorAll('.screen').length}`;$('#progress').style.width=`${Math.round(((step+1)/document.querySelectorAll('.screen').length)*100)}%`;localStorage.setItem('hm-g3-l01-progress',JSON.stringify({step,assessmentScore}))}
function openRef(){const r=lesson.reference;$('#refContent').innerHTML=r.items.map(x=>`<div class="ref-item">${esc(x)}</div>`).join('')+`<p class="small">المصدر: ${esc(r.source)}</p>`;$('#reference').classList.add('open')}
$('#referenceBtn').onclick=openRef;$('#closeRef').onclick=()=>$('#reference').classList.remove('open');
(async()=>{try{const res=await fetch(DATA,{cache:'no-store'});if(!res.ok)throw Error('schema '+res.status);lesson=await res.json();$('#lessonLabel').textContent=`الصف الثالث الابتدائي · ${lesson.title}`;build();$('#loading').remove();$('#studio').hidden=false;const saved=JSON.parse(localStorage.getItem('hm-g3-l01-progress')||'null');if(saved)assessmentScore=Number(saved.assessmentScore)||0;go(saved?.step>0?Math.min(saved.step,document.querySelectorAll('.screen').length-1):0)}catch(e){$('#loading').textContent='تعذر تحميل محتوى الدرس المرجعي.';console.error(e)}})();
</script></body></html>
