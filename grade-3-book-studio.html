<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b6c"><title>HM Academy | Premium Lesson Studio</title><style>:root{--n:#173b6c;--b:#2d74da;--t:#18a78b;--ink:#20314d;--muted:#66758c;--line:#dce7f3}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Arial,Tahoma,sans-serif;user-select:none;-webkit-user-select:none;background:#eef5fb;background-image:radial-gradient(circle at 8% 12%,#fff 0 52px,transparent 53px),radial-gradient(circle at 92% 20%,#dff4ef 0 72px,transparent 73px),radial-gradient(circle at 20% 92%,#e7edff 0 90px,transparent 91px)}button{font-family:inherit}.app{max-width:1120px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 2px 12px}.brand{font-weight:900;color:var(--n)}.label{font-size:13px;color:var(--muted);margin-top:3px}.tools{display:flex;gap:8px;align-items:center}.btn,.choice{border:0;border-radius:16px;padding:12px 17px;font-weight:900;cursor:pointer;font-size:16px;touch-action:manipulation;transition:.18s}.btn:hover,.choice:hover{transform:translateY(-2px)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}.light{background:#fff;color:var(--n);border:1px solid var(--line)}.primary{background:var(--n);color:#fff;box-shadow:0 8px 18px #173b6c20}.counter{font-weight:900;color:var(--muted);white-space:nowrap}.bar{height:9px;background:#dfe8f2;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--t));transition:.3s}.status{margin-top:15px;padding:13px;border-radius:16px;background:#fff;border:1px solid var(--line);font-weight:800}.screen{display:none;margin-top:14px;min-height:650px;border-radius:32px;padding:30px;background:rgba(255,255,255,.96);border:1px solid var(--line);box-shadow:0 18px 50px #173b6c0c;position:relative;overflow:hidden}.screen:before{content:'✦';position:absolute;top:18px;left:22px;color:#d9e7f8;font-size:34px}.screen.active{display:block;animation:in .22s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.hero{background:linear-gradient(145deg,#173b6c,#2d74da 58%,#18a78b);color:#fff;border:0}.hero:after{content:'⭐ 🌈 ✨ 🧩';position:absolute;left:20px;bottom:110px;font-size:34px;opacity:.7}.hero h1{font-size:clamp(42px,8vw,76px);margin:24px 0 8px}.title{color:var(--n);font-size:clamp(30px,5vw,48px);margin:4px 0 8px}.sub,.lead{line-height:1.9;font-weight:700;max-width:860px}.sub{color:var(--muted)}.cards,.gamegrid,.toolgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:22px}.card,.game,.toolcard{border:1px solid var(--line);border-radius:24px;padding:20px;text-align:center;background:linear-gradient(180deg,#fff,#f8fbff);box-shadow:0 12px 28px #173b6c0d}.emoji{font-size:44px}.fr{direction:ltr;color:var(--n);font-weight:900;font-size:22px;margin:9px 0}.ar{color:var(--muted);font-weight:800;line-height:1.8}.sp{cursor:pointer}.choices{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}.choice{border:2px solid #d7e1ee;background:#fff}.choice.correct{background:#ddf7e9;border-color:#25a56a}.choice.wrong{background:#ffe8e8;border-color:#d55}.result{margin-top:12px;font-weight:900;min-height:25px}.activity{margin-top:18px;padding:20px;border-radius:23px;background:linear-gradient(145deg,#f2f8ff,#f0fbf8);border:1px solid #dceaf5}.media{margin-top:18px;aspect-ratio:16/9;background:#101820;border-radius:24px;overflow:hidden}.media iframe{width:100%;height:100%;border:0}.score{font-size:46px;font-weight:900;color:var(--n);text-align:center;margin:22px}.nav{position:sticky;bottom:10px;display:flex;justify-content:space-between;gap:12px;margin-top:26px;padding:12px;border-radius:20px;background:#ffffffed;box-shadow:0 8px 30px #173b6c18;z-index:5}.nav .next{min-width:150px}.reference{position:fixed;inset:0;background:#173b6c66;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.reference.open{display:flex}.refbox{width:min(780px,100%);max-height:85vh;overflow:auto;background:#fff;border-radius:28px;padding:24px}.ref-item{padding:14px;border-radius:16px;background:#f4f8fc;margin:9px 0;font-weight:800}@media(max-width:760px){.cards,.gamegrid,.toolgrid{grid-template-columns:1fr}.screen{min-height:690px;padding:21px}.tools{flex-direction:column;align-items:flex-end}.nav{bottom:6px}.nav .next{min-width:135px}.hero:after{bottom:130px}}</style></head><body><main class="app"><div class="top"><div><div class="brand">🇫🇷 HM Academy · Premium Lesson Studio</div><div class="label" id="label">الصف الثالث الابتدائي</div></div><div class="tools"><button class="btn light" id="referenceBtn">📘 المرجع</button><div class="counter" id="counter">1/11</div></div></div><div class="bar"><i id="progress" style="width:9%"></i></div><div id="loading" class="status">جاري تحميل رحلة التعلم…</div><div id="studio" hidden></div></main><div class="reference" id="reference"><div class="refbox"><button class="btn light" id="closeRef">إغلاق</button><h2>📘 مرجع الدرس</h2><div id="refContent"></div></div></div><script src="scripts/grade-3-premium-runtime-v2.js"></script></body></html>
