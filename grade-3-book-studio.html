<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b6c"><title>HM Academy | Premium Lesson Studio</title><style>:root{--n:#173b6c;--b:#2d74da;--t:#18a78b;--ink:#20314d;--muted:#66758c;--line:#dce7f3}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Arial,Tahoma,sans-serif;user-select:none;-webkit-user-select:none;background:#eef5fb;background-image:radial-gradient(circle at 8% 12%,#fff 0 52px,transparent 53px),radial-gradient(circle at 92% 20%,#dff4ef 0 72px,transparent 73px),radial-gradient(circle at 20% 92%,#e7edff 0 90px,transparent 91px)}button{font-family:inherit}.app{max-width:1120px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 2px 12px}.brand{font-weight:900;color:var(--n)}.label{font-size:13px;color:var(--muted);margin-top:3px}.tools{display:flex;gap:8px;align-items:center}.btn,.choice,.word{border:0;border-radius:16px;padding:12px 17px;font-weight:900;cursor:pointer;font-size:16px;touch-action:manipulation;transition:.18s}.btn:hover,.choice:hover,.word:hover{transform:translateY(-2px)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}.light{background:#fff;color:var(--n);border:1px solid var(--line)}.primary{background:var(--n);color:#fff;box-shadow:0 8px 18px #173b6c20}.counter{font-weight:900;color:var(--muted);white-space:nowrap}.bar{height:9px;background:#dfe8f2;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--t));transition:.3s}.status{margin-top:15px;padding:13px;border-radius:16px;background:#fff;border:1px solid var(--line);font-weight:800}.screen{display:none;margin-top:14px;min-height:650px;border-radius:32px;padding:30px;background:rgba(255,255,255,.96);border:1px solid var(--line);box-shadow:0 18px 50px #173b6c0c;position:relative;overflow:hidden}.screen:before{content:'✦';position:absolute;top:18px;left:22px;color:#d9e7f8;font-size:34px}.screen.active{display:block;animation:in .22s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.hero{background:linear-gradient(145deg,#173b6c,#2d74da 58%,#18a78b);color:#fff;border:0}.hero:after{content:'⭐  🌈  ✨  🧩';position:absolute;left:20px;bottom:110px;font-size:34px;opacity:.7}.hero h1{font-size:clamp(42px,8vw,76px);margin:24px 0 8px}.hero h2{font-size:clamp(21px,4vw,31px)}.title{color:var(--n);font-size:clamp(30px,5vw,48px);margin:4px 0 8px}.sub,.lead{line-height:1.9;font-weight:700;max-width:860px}.sub{color:var(--muted)}.cards,.gamegrid,.toolgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:22px}.card,.game,.toolcard{border:1px solid var(--line);border-radius:24px;padding:20px;text-align:center;background:linear-gradient(180deg,#fff,#f8fbff);box-shadow:0 12px 28px #173b6c0d}.emoji{font-size:44px}.fr{direction:ltr;color:var(--n);font-weight:900;font-size:22px;margin:9px 0}.ar{color:var(--muted);font-weight:800;line-height:1.8}.speak{cursor:pointer}.choices,.wordbank,.sentence{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}.choice,.word{border:2px solid #d7e1ee;background:#fff}.choice.correct{background:#ddf7e9;border-color:#25a56a}.choice.wrong{background:#ffe8e8;border-color:#d55}.result{margin-top:12px;font-weight:900;min-height:25px}.dialogue{display:grid;gap:11px;margin-top:20px}.line{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:14px;border-radius:18px;background:#eef6ff;border:1px solid #dceafb}.say{direction:ltr;text-align:left;font-weight:900;font-size:18px;cursor:pointer}.play{border:0;border-radius:50%;width:44px;height:44px;cursor:pointer;background:var(--n);color:#fff}.activity{margin-top:18px;padding:20px;border-radius:23px;background:linear-gradient(145deg,#f2f8ff,#f0fbf8);border:1px solid #dceaf5}.sentence{min-height:62px;padding:10px;border-radius:15px;background:#fff;border:2px dashed #cdd9e8;direction:ltr}.media{margin-top:18px;aspect-ratio:16/9;background:#101820;border-radius:24px;overflow:hidden}.media iframe{width:100%;height:100%;border:0}.score{font-size:46px;font-weight:900;color:var(--n);text-align:center;margin:22px}.stars{text-align:center;font-size:48px;letter-spacing:6px}.nav{position:sticky;bottom:10px;display:flex;justify-content:space-between;gap:12px;margin-top:26px;padding:12px;border-radius:20px;background:#ffffffed;box-shadow:0 8px 30px #173b6c18;z-index:5}.nav .next{min-width:150px}.reference{position:fixed;inset:0;background:#173b6c66;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.reference.open{display:flex}.refbox{width:min(780px,100%);max-height:85vh;overflow:auto;background:#fff;border-radius:28px;padding:24px}.ref-item{padding:14px;border-radius:16px;background:#f4f8fc;margin:9px 0;font-weight:800}.small{font-size:14px;color:var(--muted);line-height:1.8}.review-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px;border-radius:16px;background:#fff;margin:8px 0;border:1px solid var(--line)}.badge{padding:6px 10px;border-radius:999px;font-size:13px;font-weight:900}.good{background:#ddf7e9;color:#16794f}.need{background:#fff0d9;color:#9a6613}.matchItem{display:inline-flex;align-items:center;justify-content:center;min-width:140px;min-height:58px;padding:12px;margin:5px;border:2px solid var(--line);border-radius:16px;background:#fff;font-weight:900;cursor:pointer}.matchItem.done{border-color:#1e9b68;background:#ddf7e9}@media(max-width:760px){.cards,.gamegrid,.toolgrid{grid-template-columns:1fr}.screen{min-height:690px;padding:21px}.say{font-size:15px}.tools{flex-direction:column;align-items:flex-end}.nav{bottom:6px}.nav .next{min-width:135px}.hero:after{bottom:130px}}</style></head><body><main class="app"><div class="top"><div><div class="brand">🇫🇷 HM Academy · Premium Lesson Studio</div><div class="label">الصف الثالث الابتدائي · Je me présente</div></div><div class="tools"><button class="btn light" id="referenceBtn">📘 المرجع</button><div class="counter" id="counter">1/11</div></div></div><div class="bar"><i id="progress" style="width:9%"></i></div><div id="loading" class="status">جاري تحميل رحلة التعلم…</div><div id="studio" hidden></div></main><div class="reference" id="reference"><div class="refbox"><button class="btn light" id="closeRef">إغلاق</button><h2>📘 مرجع الدرس</h2><div id="refContent"></div></div></div><script>
const DATA='data/lessons/grade-3/studio/g3-l01.json',TOTAL=11;let lesson,step=0,practiceState={},assessmentState={},gameState={};const $=s=>document.querySelector(s),norm=s=>String(s??'').trim().replace(/[؟?!.,]/g,'').replace(/\s+/g,' ').toLowerCase();function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function speak(t){if(!t||!window.speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}function save(){localStorage.setItem('hm_g3_l01_progress',JSON.stringify({step,practiceState,assessmentState,gameState}))}function load(){try{let x=JSON.parse(localStorage.getItem('hm_g3_l01_progress')||'{}');step=Number.isInteger(x.step)?Math.min(Math.max(x.step,0),TOTAL-1):0;practiceState=x.practiceState||{};assessmentState=x.assessmentState||{};gameState=x.gameState||{}}catch(e){step=0}}function accepted(q,v){return(q.acceptedAnswers||[]).some(a=>norm(a)===norm(v))}function nav(){return'<div class="nav"><button class="btn light prev">← السابق</button><button class="btn primary next">التالي →</button></div>'}function choice(q,type){let st=(type==='assessment'?assessmentState:practiceState)[q.id];return'<div class="choices" data-id="'+esc(q.id)+'" data-type="'+type+'">'+q.options.map(o=>'<button class="choice '+(st&&st.value===o&&st.ok?'correct':'')+'" data-value="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div><div class="result">'+(st?(st.ok?'🎉 إجابة صحيحة.':'💡 جرّب مرة أخرى.'):'')+'</div>'}function vocab(){return lesson.vocabulary.map(v=>'<div class="card"><div class="emoji">🔤</div><div class="fr speak" data-speak="'+esc(v.audio||v.fr)+'">'+esc(v.fr)+' 🔊</div><div class="ar">'+esc(v.ar)+'</div><button class="btn light speak" data-speak="'+esc(v.audio||v.fr)+'">استمع</button></div>').join('')}function conversation(){return lesson.conversation.map(l=>'<div class="line"><span>'+esc(l.speaker)+'</span><span class="say speak" data-speak="'+esc(l.audio||l.text)+'">'+esc(l.text)+'</span><button class="play speak" data-speak="'+esc(l.audio||l.text)+'">🔊</button></div>').join('')}function build(){let s=$('#studio');s.innerHTML='<section class="screen hero"><div>🚀 البداية</div><h1>'+esc(lesson.title)+'</h1><h2>هيا نتعلم الفرنسية بطريقة ممتعة!</h2><p class="lead">'+esc(lesson.objectives.join(' · '))+'</p>'+nav()+'</section><section class="screen"><h1 class="title">🔎 اكتشف</h1><p class="sub">اكتشف السؤال والجواب، واضغط على النص أو 🔊 للاستماع.</p><div class="cards">'+lesson.expressions.map(x=>'<div class="card"><div class="emoji">'+(x.category==='الحال'?'😊':x.category==='العمر'?'🎂':'🪪')+'</div><h3>'+esc(x.category)+'</h3>'+x.questions.map(q=>'<div class="fr speak" data-speak="'+esc(q)+'">'+esc(q)+' 🔊</div>').join('')+'<hr>'+x.answers.map(a=>'<div class="ar speak" data-speak="'+esc(a)+'">'+esc(a)+' 🔊</div>').join('')+'</div>').join('')+'</div>'+nav()+'</section><section class="screen"><h1 class="title">🎭 الحوار</h1><p class="sub">استمع إلى كل سطر ثم حاول تردده.</p><div class="dialogue">'+conversation()+'</div>'+nav()+'</section><section class="screen"><h1 class="title">🧩 المفردات</h1><p class="sub">الكلمة + المعنى + النطق.</p><div class="cards">'+vocab()+'</div>'+nav()+'</section><section class="screen"><h1 class="title">🎧 اسمع واختر</h1><p class="sub">عدة أسئلة وأنشطة بدل سؤال واحد.</p>'+lesson.listening.map(q=>'<div class="activity"><b>🎧 '+esc(q.prompt)+'</b><br><button class="btn primary speak" data-speak="'+esc(q.audio)+'">🔊 اسمع</button>'+choice(q,'practice')+'</div>').join('')+nav()+'</section><section class="screen"><h1 class="title">🗣️ حان دورك</h1><p class="sub">استخدم أكثر من صيغة صحيحة لسؤال الحال كما وردت في المادة الأصلية.</p>'+lesson.practice.map(q=>'<div class="activity"><div class="fr speak" data-speak="'+esc(q.prompt)+'">'+esc(q.prompt)+'</div>'+choice(q,'practice')+'</div>').join('')+nav()+'</section><section class="screen"><h1 class="title">🧠 اكتشف القاعدة</h1><p class="sub">نبدأ بالأمثلة ثم نفهم وظيفة كل صيغة.</p><div class="cards">'+lesson.grammar.map(g=>'<div class="card"><div class="emoji">🧠</div><h3>'+esc(g.label)+'</h3>'+g.questionForms.map(x=>'<div class="fr speak" data-speak="'+esc(x)+'">'+esc(x)+' 🔊</div>').join('')+'<hr>'+g.answers.map(x=>'<div class="ar speak" data-speak="'+esc(x)+'">'+esc(x)+' 🔊</div>').join('')+'<p class="small">'+esc(g.note)+'</p></div>').join('')+'</div>'+nav()+'</section><section class="screen"><h1 class="title">🎬 الوسائط</h1><p class="sub">شاهد الوسائط الأصلية داخل رحلة التعلم دون عرض الملف الخام.</p><div class="media"><iframe src="https://www.youtube.com/embed/'+encodeURIComponent(lesson.media.youtubeId)+'" title="'+esc(lesson.media.title)+'" allowfullscreen></iframe></div>'+nav()+'</section><section class="screen"><h1 class="title">🎮 مركز الألعاب</h1><p class="sub">كل لعبة لها زر بدء حقيقي، منطقة لعب، نتيجة، وإمكانية العودة للمركز.</p><div class="gamegrid">'+lesson.games.map((g,i)=>'<div class="game"><div class="emoji">'+['🎧','🧩','🃏','🎯'][i%4]+'</div><h3>'+esc(g.title)+'</h3><p>'+esc(g.description)+'</p><button class="btn primary gameBtn" data-game="'+esc(g.id)+'">▶ ابدأ اللعبة</button></div>').join('')+'</div><div id="gameArea"></div>'+nav()+'</section><section class="screen"><h1 class="title">🏆 التقييم</h1><p class="sub">التقييم التدريبي مستقل في الحساب، ويقبل فقط ما يحدده سؤال التقييم.</p><div id="assessment">'+lesson.assessment.map(q=>'<div class="activity"><div class="fr speak" data-speak="'+esc(q.audio||'')+'">'+esc(q.prompt)+'</div>'+(q.audio?'<button class="btn primary speak" data-speak="'+esc(q.audio)+'">🔊 اسمع</button>':'')+choice(q,'assessment')+'</div>').join('')+'</div>'+nav()+'</section><section class="screen"><h1 class="title">🎉 أحسنت! انتهت رحلة التعلم</h1><div class="score" id="finalScore">0 / '+lesson.assessment.length+'</div><div class="stars" id="stars">☆☆☆☆☆</div><p class="sub">أكملت الرحلة. الآن تبدأ منطقة ما بعد الدرس.</p><div class="toolgrid"><div class="toolcard"><div class="emoji">📘</div><h3>مرجع الدرس</h3><p class="small">الكلمات والعبارات والقاعدة والحوار.</p><button class="btn light" id="endRef">فتح المرجع</button></div><div class="toolcard"><div class="emoji">📝</div><h3>التقييم الرسمي</h3><p class="small">التقييم الرسمي يظل منفصلًا عن تدريب الرحلة.</p><button class="btn light" id="officialBtn">فتح الأصل الرسمي</button></div><div class="toolcard"><div class="emoji">🧠</div><h3>المراجعة الذكية</h3><p class="small">تتغير حسب أداء الطالب الفعلي.</p><button class="btn primary" id="smartBtn">ابدأ المراجعة الذكية</button></div></div><div id="smartArea"></div><div class="nav"><button class="btn light prev">← السابق</button><button class="btn primary" id="finish">إنهاء الدرس ✓</button></div></section>';attach();update();renderEnd()}function attach(){document.querySelectorAll('.next').forEach(b=>b.onclick=()=>go(step+1));document.querySelectorAll('.prev').forEach(b=>b.onclick=()=>go(step-1));document.querySelectorAll('.speak').forEach(x=>x.onclick=()=>speak(x.dataset.speak||x.textContent));document.querySelectorAll('.choices').forEach(x=>x.onclick=choiceClick);document.querySelectorAll('.gameBtn').forEach(b=>b.onclick=()=>runGame(b.dataset.game));$('#endRef').onclick=openReference;$('#smartBtn').onclick=smartReview;$('#officialBtn').onclick=()=>alert('التقييم الرسمي محفوظ ضمن ملفات المصدر الرسمية للدرس، ويظل منفصلًا عن تدريب الرحلة.');$('#finish').onclick=()=>{localStorage.removeItem('hm_g3_l01_progress');go(0)}}function choiceClick(e){let b=e.target.closest('.choice');if(!b)return;let box=b.closest('.choices'),q=(box.dataset.type==='assessment'?lesson.assessment:lesson.practice).find(x=>x.id===box.dataset.id)||lesson.listening.find(x=>x.id===box.dataset.id);if(!q)return;let ok=accepted(q,b.dataset.value),store=box.dataset.type==='assessment'?assessmentState:practiceState;store[q.id]={value:b.dataset.value,ok};box.querySelectorAll('.choice').forEach(x=>x.classList.remove('correct','wrong'));b.classList.add(ok?'correct':'wrong');box.parentElement.querySelector('.result').textContent=ok?'🎉 إجابة صحيحة.':'💡 جرّب مرة أخرى.';save();renderEnd()}function runGame(id){let area=$('#gameArea'),g=lesson.games.find(x=>x.id===id);if(!g)return;if(id==='sentence-builder'){let target=[...(g.target||[])],chosen=[];const draw=()=>{area.innerHTML='<div class="activity"><h3>🧩 ابنِ الجملة</h3><div class="sentence">'+chosen.map(w=>'<span class="word">'+esc(w)+'</span>').join(' ')+'</div><div class="wordbank">'+target.filter(w=>!chosen.includes(w)).map(w=>'<button class="word" data-word="'+esc(w)+'">'+esc(w)+'</button>').join('')+'</div><button class="btn primary" id="checkSentence">تحقق ✓</button><div class="result" id="gameResult"></div></div>';area.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{chosen.push(b.dataset.word);draw()});area.querySelector('#checkSentence').onclick=()=>{let ok=chosen.join(' ')===target.join(' ');$('#gameResult').textContent=ok?'🎉 ممتاز! الجملة صحيحة.':'💡 أعد الترتيب وحاول مرة أخرى.';if(ok){gameState[id]=true;save()}}};draw();return}if(id==='listen-choice'){let q=lesson.listening.find(x=>x.id==='listen-mood-1')||lesson.listening[0];area.innerHTML='<div class="activity"><h3>🎧 صائد السؤال</h3><p>اسمع ثم اختر المعنى.</p><button class="btn primary" id="gameListen">🔊 اسمع</button>'+choice(q,'practice')+'</div>';$('#gameListen').onclick=()=>speak(q.audio);area.querySelector('.choices').onclick=e=>{let b=e.target.closest('.choice');if(!b)return;let ok=accepted(q,b.dataset.value);b.classList.add(ok?'correct':'wrong');if(ok){gameState[id]=true;save()}};return}if(id==='mood-match'){let answers=lesson.expressions.find(x=>x.id==='ask-mood').answers;area.innerHTML='<div class="activity"><h3>🃏 طابق إجابات الحال</h3><p>كل إجابات الحال الأربع من المصدر.</p>'+answers.map(a=>'<div class="matchItem" data-a="'+esc(a)+'">'+esc(a)+' 🔊</div>').join('')+'<div class="result" id="matchResult"></div></div>';area.querySelectorAll('.matchItem').forEach(b=>b.onclick=()=>{speak(b.dataset.a);b.classList.add('done');gameState[id]=true;save();$('#matchResult').textContent='✓ '+b.dataset.a});return}area.innerHTML='<div class="activity"><h3>🎯 اختر الإجابة المناسبة</h3>'+lesson.practice.map(q=>'<p><b>'+esc(q.prompt)+'</b></p>'+q.options.map(o=>'<button class="choice" data-value="'+esc(o)+'">'+esc(o)+'</button>').join('')).join('')+'<div class="result" id="gameResult"></div></div>';area.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{let q=lesson.practice.find(q=>q.options.includes(b.dataset.value)),ok=accepted(q,b.dataset.value);b.classList.add(ok?'correct':'wrong');$('#gameResult').textContent=ok?'🎉 ممتاز!':'💡 حاول مرة أخرى.';if(ok){gameState[id]=true;save()}})}function go(n){if(n<0||n>=TOTAL)return;step=n;document.querySelectorAll('.screen').forEach((s,i)=>s.classList.toggle('active',i===step));update();save();renderEnd();window.scrollTo({top:0,behavior:'smooth'})}function update(){$('#counter').textContent=(step+1)+'/'+TOTAL;$('#progress').style.width=((step+1)/TOTAL*100)+'%'}function renderEnd(){if(!lesson)return;let score=lesson.assessment.filter(q=>assessmentState[q.id]?.ok).length,el=$('#finalScore');if(el)el.textContent=score+' / '+lesson.assessment.length;let st=$('#stars');if(st){let n=Math.round(score/lesson.assessment.length*5);st.textContent='★'.repeat(n)+'☆'.repeat(5-n)}}function openReference(){$('#refContent').innerHTML=lesson.reference.items.map(x=>'<div class="ref-item">'+esc(x)+'</div>').join('')+'<div class="small">المصدر: '+esc(lesson.reference.source)+'</div>';$('#reference').classList.add('open')}function smartReview(){let rows=lesson.assessment.map(q=>{let s=assessmentState[q.id];return'<div class="review-row"><span>'+esc(q.prompt)+'</span><span class="badge '+(s?.ok?'good':'need')+'">'+(s?.ok?'ممتاز':'تحتاج مراجعة')+'</span></div>'}).join('');$('#smartArea').innerHTML='<div class="activity"><h3>🧠 مراجعتك الذكية</h3>'+rows+'<p class="small">هذه المراجعة مبنية على أدائك الفعلي.</p></div>'}$('#referenceBtn').onclick=openReference;$('#closeRef').onclick=()=>$('#reference').classList.remove('open');async function init(){load();try{let r=await fetch(DATA,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);lesson=await r.json();$('#loading').hidden=true;$('#studio').hidden=false;build();go(step)}catch(e){$('#loading').textContent='تعذر تحميل بيانات الدرس. '+e.message}}init();</script></body></html>
