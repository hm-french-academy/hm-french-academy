<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HM Academy - اختبار المستوى</title>
<link rel="stylesheet" href="css/style.css?v=20260817">
</head>
<body>
<header><h2>🇫🇷 HM Academy</h2><p>اختبار تحديد المستوى الذكي</p></header>
<main><section class="hero"><h1>📝 اختبار اللغة الفرنسية</h1><div id="question-area">جاري تحميل الاختبار...</div><button id="next-btn">التالي</button><div id="result"></div></section></main>
<script src="scripts/skills-engine.js"></script>
<script src="scripts/assessment-engine.js"></script>
<script src="scripts/learning-progress.js"></script>
<script>
let current=0, answers=[], questions=[];
async function loadAssessment(){
  try{
    const response=await fetch('data/assessments/assessment-template.json');
    const data=await response.json();
    questions=(data.questions||[]).map(q=>({...q,q:q.question||'سؤال تجريبي'}));
  }catch(e){questions=[];}
  if(!questions.length){questions=[{skill:'grammar',q:'Je ___ étudiant',options:['suis','es'],answer:'suis'}];}
  render();
}
function render(){
  const q=questions[current];
  document.getElementById('question-area').innerHTML='<h3>'+q.q+'</h3>'+q.options.map(o=>'<label><input type="radio" name="a" value="'+o+'">'+o+'</label><br>').join('');
  document.getElementById('next-btn').textContent=current===questions.length-1?'إنهاء الاختبار':'التالي';
}
document.getElementById('next-btn').onclick=()=>{
  const selected=document.querySelector('input[name="a"]:checked');
  if(!selected)return;
  const q=questions[current];
  answers.push({skill:q.skill,correct:selected.value===q.answer});
  current++;
  if(current<questions.length){render();return;}

  const correct=answers.filter(a=>a.correct).length;
  const percent=HMAssessment.calculate(correct,questions.length);
  HMAssessment.updateSkills(answers);
  localStorage.setItem('hm_last_score',String(percent));
  localStorage.setItem('hm_last_assessment_at',new Date().toISOString());
  if(window.HMProgress){
    HMProgress.setSection('assessment');
    HMProgress.completeActivity('placement-assessment',30);
  }
  document.getElementById('question-area').innerHTML='';
  document.getElementById('next-btn').style.display='none';
  document.getElementById('result').innerHTML='تم حفظ نتيجة الاختبار ✓<br><strong>النتيجة: '+percent+'%</strong><br><br><a class="btn" href="assessment-result.html">عرض التقرير</a>';
};
loadAssessment();
</script>
</body>
</html>
