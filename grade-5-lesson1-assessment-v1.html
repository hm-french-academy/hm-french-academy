<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="cache-control" content="no-cache,no-store,must-revalidate"><meta http-equiv="pragma" content="no-cache"><meta http-equiv="expires" content="0"><title>HM Academy | التقييم الرسمي · الجملة البسيطة</title><script>(function(){const v='20260822-g5l1-assessment-v2';if(!location.search.includes('build=')){history.replaceState(null,'',location.pathname+'?build='+v)}})();</script><style>:root{--navy:#14264a;--blue:#2563eb;--purple:#713bd1;--green:#20a45a;--red:#d14b4b;--line:#e1e7f0;--muted:#68758c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8faff,#eef3fb);color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:950px;margin:auto;padding:16px 14px 55px}.top{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 15px;display:flex;justify-content:space-between;gap:10px}.brand{font-weight:900;color:var(--navy);text-decoration:none}.hero{margin-top:16px;padding:28px;border-radius:28px;background:linear-gradient(135deg,#173a82,#2563eb 58%,#713bd1);color:#fff}.hero h1{margin:0 0 8px}.hero p{line-height:1.8;margin:6px 0}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{padding:8px 11px;border-radius:12px;background:#ffffff18;border:1px solid #ffffff30;font-weight:900}.q{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:12px;box-shadow:0 12px 30px #14264a0d}.q h2{margin:0 0 8px;color:var(--navy);font-size:18px}.prompt{font-size:17px;font-weight:800;line-height:1.9}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}.opt{padding:13px;border:1px solid #d5ddea;border-radius:13px;background:#fff;font-weight:900;cursor:pointer;text-align:right}.opt.selected{border:2px solid var(--blue);background:#edf3ff}.check{border:0;border-radius:12px;padding:12px 18px;background:linear-gradient(135deg,#743bd1,#2563eb);color:#fff;font-weight:900;cursor:pointer}.feedback{margin-top:10px;min-height:23px;font-weight:900}.score{position:sticky;bottom:10px;margin-top:18px;padding:15px;background:#fff;border:1px solid var(--line);border-radius:17px;text-align:center;font-weight:900;box-shadow:0 8px 25px #14264a18}.final{display:none;text-align:center}.final.show{display:block}.final h2{font-size:30px;color:var(--navy)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.btn{display:inline-block;border:0;border-radius:12px;padding:11px 15px;background:var(--blue);color:#fff;text-decoration:none;font-weight:900;cursor:pointer}.btn.alt{background:#eef3ff;color:#2451a0}@media(max-width:600px){.top{display:block}.opts{grid-template-columns:1fr}.q{padding:15px}.wrap{padding:10px 8px 40px}}</style></head><body><main class="wrap"><header class="top"><a class="brand" href="grade-5-lesson-v3.html?id=g5-t1-l01&section=overview&build=20260822-v3">HM 🇫🇷 ACADEMY</a><a class="btn alt" href="grade-5-lesson1-games-v1.html?build=20260822-g5l1-games-v2">🎮 مركز الألعاب</a></header><section class="hero"><h1>📝 التقييم الرسمي · La phrase simple</h1><p>تقييم مستقل لقياس إتقان أهداف الدرس الأول: Sujet + Verbe + Complément.</p><div class="meta"><span class="pill">10 مهام</span><span class="pill">محاولة واحدة لكل سؤال</span><span class="pill">لا توجد إجابات مكشوفة قبل المحاولة</span></div></section><div id="qs"></div><div class="score" id="score">النتيجة: 0 / 10</div><section class="panel final" id="final"><h2 id="finalTitle"></h2><p id="finalText"></p><div class="actions"><a class="btn" href="grade-5-lesson-v3.html?id=g5-t1-l01&section=overview&build=20260822-v3">← العودة إلى الدرس</a><a class="btn alt" href="grade-5-lesson1-games-v1.html?build=20260822-g5l1-games-v2">🎮 التدريب بالألعاب</a></div></section></main><script>(function(){const Q=[['اختيار الفاعل','في «Mona parle français.» من هو Sujet؟',['Mona','parle','français'],'Mona'],['اختيار الفعل','في «Je parle anglais.» ما هو Verbe؟',['Je','parle','anglais'],'parle'],['اختيار المتمم','في «Ali aime le français.» ما هو Complément؟',['Ali','aime','le français'],'le français'],['ترتيب الجملة','ما الترتيب الصحيح للجملة البسيطة في هذا الدرس؟',['Sujet + Verbe + Complément','Verbe + Sujet + Complément','Complément + Sujet + Verbe'],'Sujet + Verbe + Complément'],['تحليل جملة','أي جملة من أمثلة الدرس تحتوي على Sujet = Ali؟',['Ali aime le français.','Mona parle français.','Je parle anglais.'],'Ali aime le français.'],['تحليل فعل','أي فعل يطابق «Mona parle français.»؟',['aime','parle','parlent'],'parle'],['فهم المتمم','في «Je parle anglais.» ما الكلمة التي تكمل معنى الفعل؟',['Je','parle','anglais'],'anglais'],['تمييز النموذج','أي نموذج يطابق الجملة «Ali aime le français.»؟',['Sujet + Verbe + Complément','Verbe + Complément + Sujet','Complément + Verbe + Sujet'],'Sujet + Verbe + Complément'],['تطبيق','اختر الجملة الصحيحة من أمثلة الدرس.',['Mona parle français.','Parle Mona français.','Français Mona parle.'],'Mona parle français.'],['إتقان القاعدة','ما الصيغة التي يجب أن تبدأ بها لبناء جملة بسيطة في هذا الدرس؟',['Sujet','Complément','Verbe'],'Sujet']];let score=0,done=0,answers={};const qs=document.getElementById('qs');function render(){qs.innerHTML=Q.map((x,i)=>`<section class="q"><h2>${i+1}. ${x[0]}</h2><div class="prompt">${x[1]}</div><div class="opts" data-q="${i}">${x[2].map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join('')}</div><button class="check" data-check="${i}">تحقق</button><div class="feedback" id="f${i}"></div></section>`).join('');qs.querySelectorAll('.opts').forEach(box=>box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{box.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');answers[box.dataset.q]=b.dataset.v}));qs.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>check(+b.dataset.check))}function check(i){const f=document.getElementById('f'+i);if(f.dataset.done)return;const v=answers[i];if(!v){f.textContent='اختر إجابة أولًا.';return}f.dataset.done='1';done++;const ok=v===Q[i][3];if(ok){score++;f.textContent='✓ إجابة صحيحة.';f.style.color='var(--green)'}else{f.textContent='✗ غير صحيحة. راجع شرح الدرس دون كشف الإجابة.';f.style.color='var(--red)'}document.getElementById('score').textContent=`النتيجة: ${score} / 10 — أُجيب عن ${done} / 10`;if(done===10)finish()}function finish(){const f=document.getElementById('final');f.classList.add('show');const pct=score*10;document.getElementById('finalTitle').textContent=pct>=80?'🏆 ممتاز!':pct>=60?'👏 جيد جدًا!':'💪 استمر في التدريب!';document.getElementById('finalText').textContent=`نتيجتك ${score} من 10 (${pct}%). راجع الأجزاء التي أخطأت فيها ثم استخدم مركز الألعاب للتثبيت.`;try{localStorage.setItem('hm-g5-l01-assessment-score',JSON.stringify({score,total:10,pct,at:Date.now()}));if(window.HMProgress)window.HMProgress.completeLesson('g5-t1-l01',pct)}catch(e){}}render()})();</script></body></html>
