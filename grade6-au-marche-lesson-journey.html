function render(section){current=section;document.querySelectorAll('.step').forEach(function(b){b.classList.toggle('active',b.dataset.section===section)});var html='';if(section==='lesson'){html='<span class="tag">01 · البداية</span><h2>Au marché</h2><p>في السوق</p><div class="grid"><article class="card"><h3>رحلة الدرس</h3><p>ابدأ بالمفردات، ثم النطق، القاعدة، المحادثة، التدريب، الألعاب والتقييم.</p><button class="btn" data-go="vocabulary">ابدأ الدرس</button></article><article class="card"><h3>الهدف</h3><p>استخدام مفردات السوق وعبارات الكمية في مواقف بسيطة باللغة الفرنسية.</p></article></div>'}else if(section==='vocabulary'){html='<span class="tag">02 · المفردات</span><h2>المفردات</h2><p>الكلمة + معناها + جملة قابلة للاستخدام.</p><div class="grid">'+vocab.map(card).join('')+'</div>'}else if(section==='pronunciation'){html='<span class="tag">03 · النطق</span><h2>اسمع وانطق</h2><p>ملاحظة نطق لكل كلمة، مع نطق الكلمة فقط دون المثال.</p><div class="grid">'+vocab.map(function(v,i){return '<article class="card"><div class="word-image"><img src="'+imageFor(i)+'" alt="'+esc(v[1])+'" loading="lazy"></div><div class="fr">'+esc(v[0])+'</div><div class="ar">'+esc(v[1])+'</div><div class="pron-note"><b>ملاحظة النطق:</b> '+esc(pronNotes[i])+'</div><button class="btn speak" data-speak="'+esc(v[0])+'">🔊 نطق الكلمة</button></article>'}).join('')+'</div>'}else if(section==='grammar'){html='<span class="tag">04 · القواعد</span><h2>افهم القاعدة</h2><p>لاحظ أدوات الكمية مع الأسماء.</p><div class="grid">'+rules.map(function(r){return '<article class="card"><div class="fr">'+esc(r[0])+'</div><h3>'+esc(r[1])+'</h3><p>'+esc(r[2])+'</p></article>'}).join('')+'</div>'}else if(section==='conversation'){html='<span class="tag">05 · المحادثة</span><h2>تحدث داخل السوق</h2>'+dialogue.map(function(d){return '<article class="card"><strong>'+(d[0]==='seller'?'🧑‍💼 البائع':'🧑‍🛒 العميل')+'</strong><p class="fr">'+esc(d[1])+'</p><p class="ar">'+esc(d[2])+'</p><button class="btn speak" data-speak="'+esc(d[ function bind(){document.querySelectorAll('[data-speak]').forEach(function(b){b.addEventListener('click',function(){speak(this.dataset.speak)})});document.querySelectorAll('[data-go]').forEach(function(b){b.addEventListener('click',function(){go(this.dataset.go)})});document.querySelectorAll('[data-answer]').forEach(function(b){b.addEventListener('click',function(){var p=this.closest('.card'),bs=p.querySelectorAll('[data-answer]');bs.forEach(function(x){x.disabled=true});var ok=this.dataset.answer===this.dataset.correct;this.classList.add(ok?'ok':'bad');p.querySelector('[id^="feedback"]').textContent=ok?'✓ ممتاز — إجابة صحيحة':'✗ راجع الإجابة ثم أعد المحاولة في تدريب آخر.'})});document.querySelectorAll('[data-assess]').forEach(function(b){b.addEventListener('click',function(){var p=this.closest('.card'),bs=p.querySelectorAll('[data-assess]');bs.forEach(function(x){x.disabled=true});var ok=this.dataset.assess===this.dataset.correct;this.classList.add(ok?'ok':'bad');p.querySelector('[id^="assess"]').textContent=ok?'✓ صحيح':'✗ غير صحيح'})});var g1s=document.getElementById('g1start');if(g1s)g1s.addEventListener('click',game1);var g2s=document.getElementById('g2start');if(g2s)g2s.addEventListener('click',game2);var g3s=document.getElementById('g3start');if(g3s)g3s.addEventListener('click',game3);var g4s=document.getElementById('g4start');if(g4s)g4s.addEventListener('click',game4);var tp=document.getElementById('toggleProgress');if(tp)tp.addEventListener('click',function(){var done=localStorage.getItem('hm-g6-au-marche-complete')==='1';localStorage.setItem('hm-g6-au-marche-complete',done?'0':'1');render('progress')})}
function gamePick(b,ok,right){var box=b.parentElement;if(box.dataset.done)return;box.dataset.done='1';box.querySelectorAll('button').forEach(function(x){x.disabled=true});b.classList.add(ok?'ok':'bad');var f=document.createElement('div');f.style.fontWeight='900';f.textContent=ok?'✓ إجابة صحيحة':'✗ الإجابة الصحيحة: '+right;box.appendChild(f)}function randomItem(){return vocab[Math.floor(Math.random()*vocab.length)]}function uniqueChoices(c,n){var a=[c];while(a.length<n){var x=randomItem()[0];if(a.indexOf(x)<0)a.push(x)}return a.sort(function(){return Math.random()-.5})}function game1(){var item=randomItem(),box=document.getElementById('g1a');document.getElementById('g1q').textContent='المعنى: '+item[1];box.innerHTML='<button class="btn" id="showG1">أظهر الكلمة</button>';document.getElementById('showG1').addEventListener('click',function(){this.disabled=true;var f=document.createElement('div');f.className='fr';f.textContent=item[0];box.appendChild(f)})}function game2(){var item=randomItem(),choices=uniqueChoices(item[0],3),box=document.getElementById('g2');box.dataset.done='';box.innerHTML='<b>المعنى: '+esc(item[1])+'</b>'+choices.map(function(x){return '<button data-game-choice="'+esc(x)+'" class="btn">'+esc(x)+'</button>'}).join('');box.querySelectorAll('[data-game-choice]').forEach(function(b){b.addEventListener('click',function(){gamePick(this,this.dataset.gameChoice===item[0],item[0])})})}function game3(){var left=30,tm=document.getElementById('tm'),item=randomItem(),choices=uniqueChoices(item[0],4),box=document.getElementById('g3a');clearInterval(window.hmGameTimer);tm.textContent=left;box.dataset.done='';box.innerHTML='<b>المعنى: '+esc(item[1])+'</b>'+choices.map(function(x){return '<button data-game-choice="'+esc(x)+'" class="btn">'+esc(x)+'</button>'}).join('');box.querySelectorAll('[data-game-choice]').forEach(function(b){b.addEventListener('click',function(){gamePick(this,this.dataset.gameChoice===item[0],item[0]);clearInterval(window.hmGameTimer)})});window.hmGameTimer=setInterval(function(){left--;tm.textContent=left;if(left<=0){clearInterval(window.hmGameTimer);if(!box.dataset.done){box.dataset.done='1';box.querySelectorAll('button').forEach(function(x){x.disabled=true});var f=document.createElement('div');f.textContent='⏱ انتهى الوقت — الإجابة الصحيحة: '+item[0];f.style.fontWeight='900';box.appendChild(f)}}},1000)}function game4(){var groups=[['🛒 أدوات السوق',['Le chariot','La balance','La caisse','La vitrine','Le panier','Le sachet',"L'argent",'Le vendeur']],['🥖 المخبوزات والألبان',['La baguette','Le pain','Le croissant','Le gâteau','Le fromage','Le lait','Le beurre','La farine',"L'œuf",'La crème']],['🥩 الأطعمة',['La viande','Le poulet','Le poisson','Le sucre','Le sel','Le vinaigre']],['🍎 الفواكه',['La pomme','La banane','La fraise',"L'orange",'La poire','La cerise','Le raisin','Le citron']],['🥕 الخضروات',['La carotte','La tomate','Le concombre','La pomme de terre',"L'aubergine",'Le chou','Le chou-fleur']]],g=groups[Math.floor(Math.random()*groups.length)],w=g[1][Math.floor(Math.random()*g[1].length)],box=document.getElementById('g4');box.dataset.done='';box.innerHTML='<b>الكلمة: '+esc(w)+'</b>'+groups.map(function(x){return '<button data-game-group="'+esc(x[0])+'" class="btn">'+esc(x[0])+'</button>'}).join('');box.querySelectorAll('[data-game-group]').forEach(function(b){b.addEventListener('click',function(){gamePick(this,this.dataset.gameGroup===g[0],g[0])})})}
