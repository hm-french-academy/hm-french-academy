<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14264a"><title>HM Academy | المراجعة السنوية</title><link rel="stylesheet" href="css/premium-shell.css?v=20260820-revision"><style>main{max-width:1100px;margin:auto;padding:28px 18px 60px}.hero{background:linear-gradient(135deg,#14264a,#315fc8);color:#fff;border-radius:28px;padding:28px;margin-bottom:20px}.hero h1{margin:0 0 8px}.hero p{margin:0;opacity:.9;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:22px;padding:20px;box-shadow:0 12px 32px #14264a10}.stage{display:flex;justify-content:space-between;align-items:center;gap:12px}.stage h2{margin:0;color:#14264a;font-size:18px}.stage p{color:#6c7890;margin:7px 0 0;line-height:1.6}.badge{padding:7px 11px;border-radius:999px;font-size:11px;font-weight:900;background:#eaf8f5;color:#16796b;white-space:nowrap}.locked .badge{background:#f1f3f7;color:#778197}.btn{display:block;margin-top:15px;text-align:center;text-decoration:none;padding:11px;border-radius:13px;background:#2563eb;color:#fff;font-weight:900}.locked .btn{pointer-events:none;background:#edf0f5;color:#8993a5}.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.module{border:1px solid #e4e9f2;border-radius:16px;padding:14px;background:#fbfcff}.module strong{display:block;color:#14264a}.module small{color:#778197}.bar{height:8px;background:#edf1f6;border-radius:99px;margin-top:8px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:#2563eb}@media(max-width:700px){.grid,.modules{grid-template-columns:1fr}.hero{border-radius:22px}}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="index.html">الرئيسية</a><a href="dashboard.html">الطالب</a><a href="course.html">المناهج الدراسية</a><a href="levels.html">مستويات اللغة</a><a href="library.html">المكتبة</a><a href="settings.html">الإعدادات</a></nav></header><main><section class="hero"><h1>🧠 المراجعة السنوية — الصف الثاني الإعدادي</h1><p>استرجع أساسيات <b dir="ltr">Le Français Simple 1</b> بالكامل واستعد للانتقال إلى <b dir="ltr">Le Français Simple 2</b>.</p></section><section class="grid" id="stages"></section><section class="card" style="margin-top:16px"><h2>مسارات المراجعة</h2><div class="modules" id="modules"></div></section></main><script>const C='data/revision-readiness/grade-8/';const fallback={stages:[{id:'diagnostic',label:'التشخيص',items:36},{id:'remediation',label:'المراجعة الذكية',locked:true},{id:'retrieval',label:'التدريب السنوي',locked:true},{id:'final',label:'اختبار الجاهزية',locked:true}],modules:[['r8-u1','Je me présente'],['r8-u2','Nombres, âge et école'],['r8-u3','Couleurs et calendrier'],['r8-u4','Nationalités et être'],['r8-u5','La famille'],['r8-u6','Les vêtements']]};async function load(){let d;try{const r=await fetch(C+'revision-dashboard-config.json?'+Date.now());d=await r.json();}catch(e){d=fallback}render(d)}function render(d){document.getElementById('stages').innerHTML=d.stages.map((s,i)=>{const locked=s.status?.includes('locked')||s.locked;let href='';if(s.id==='diagnostic')href='interactive-assessment.html?revision=g8-rev-diagnostic';if(s.id==='remediation')href='revision-module.html?revision=grade8-annual-revision&module={moduleId}';if(s.id==='retrieval')href='interactive-assessment.html?revision=g8-rev-retrieval';if(s.id==='final')href='interactive-assessment.html?revision=g8-rev-final';return `<article class="card ${locked?'locked':''}"><div class="stage"><div><h2>${s.label}</h2><p>${s.items?`اختبار من ${s.items} سؤالًا`:locked?'يفتح تلقائيًا بعد تحقيق شروط المرحلة السابقة':'جاهز'}</p></div><span class="badge">${locked?'🔒 مغلق':'متاح'}</span></div><a class="btn" href="${locked?'#':href}">${locked?'سيُفتح بعد التقدم':'ابدأ الآن'}</a></article>`}).join('');document.getElementById('modules').innerHTML=d.modules.map(m=>{const id=m.id||m[0],label=m.label||m[1];return `<div class="module"><strong>${label}</strong><small>${id}</small><div class="bar"><span></span></div></div>`}).join('')}load()</script></body></html>
