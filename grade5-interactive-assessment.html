<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="cache-control" content="no-cache,no-store,must-revalidate"><title>HM Academy | التقييم التفاعلي</title><style>body{margin:0;font-family:Arial,Cairo,sans-serif;background:#f4f7fb;color:#17223b}.wrap{max-width:850px;margin:auto;padding:22px}.hero,.card{border-radius:22px;padding:22px;margin-top:16px}.hero{background:linear-gradient(135deg,#173a82,#2563eb);color:#fff}.card{background:#fff;border:1px solid #dfe6ef}.q{font-size:21px;font-weight:900;line-height:1.8}.opts{display:grid;gap:10px;margin-top:16px}.opts button{padding:14px;border:2px solid #d8e0eb;background:#f8fafc;border-radius:13px;text-align:right;font-weight:800;font-size:17px}.correct{border-color:#16834b!important;background:#eaf8f0!important}.wrong{border-color:#b42318!important;background:#fff0ef!important}.fb{min-height:45px;margin-top:14px;font-weight:900;line-height:1.8}.next{margin-top:12px;padding:11px 18px;border:0;border-radius:11px;background:#2563eb;color:#fff;font-weight:900}.result{text-align:center}.score{font-size:42px;font-weight:900}.muted{color:#667085}</style></head><body><main class="wrap"><section class="hero"><h1>🏆 التقييم التفاعلي</h1><p id="lessonTitle">جارٍ تحميل الدرس…</p><p>تقييم مستقل يقيس الفهم والتطبيق. لا يعتمد على أسئلة المراجعة الذكية أو الاختبار الرسمي.</p></section><section id="quiz"></section><section id="result" class="card result" hidden><div class="score" id="score"></div><h2>انتهى التقييم التفاعلي</h2><p id="msg"></p><button class="next" id="retry">إعادة التقييم</button><br><a id="back" href="#">← العودة إلى صفحة التقييم</a></section></main><script>(async()=>{const p=new URLSearchParams(location.search),id=p.get('lesson')||'g5-t1-l01';let D=null;const quiz=document.getElementById('quiz'),res=document.getElementById('result');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function unwrap(x){for(let i=0;i<8;i++){if(typeof x==='string'){try{x=JSON.parse(x);continue}catch{return x}}if(x&&typeof x.content==='string'){try{x=JSON.parse(x.content);continue}catch{return x}}break}return x}try{const r=await fetch('data/lessons/grade-5/lesson-studio-content.json?v=20260822-interactive7',{cache:'no-store'});D=unwrap(await r.json())?.lessons?.[id];if(!D)throw Error('lesson missing');document.getElementById('lessonTitle').textContent=(D.titleFr||D.titleAr||id)+' · '+(D.titleAr||'');document.getElementById('back').href='grade-5-lesson-v3.html?id='+encodeURIComponent(id)+'&section=assessment&build=20260822-premium7'}catch(e){quiz.innerHTML='<section class="card"><b>تعذر تحميل التقييم.</b></section>';return}
const questions=[];const add=(q,a,o,w)=>{o=[...new Set(o.filter(Boolean))];if(q&&a&&o.length>=3&&o.includes(a)&&!questions.some(x=>x.q===q&&x.a===a))questions.push({q,a,o,w})};
(D.practice||[]).forEach(x=>add(x.q,x.answer,x.options||[],x.explanation||''));const ex=(D.grammar?.examples||[]).filter(x=>x?.parts?.length>=3);ex.forEach(x=>{const z=x.parts;add(`في «${x.fr}» من هو Sujet؟`,z[0],[z[0],z[1],z[2]],'الفاعل هو من يقوم بالفعل.');add(`في «${x.fr}» ما هو Verbe؟`,z[1],[z[1],z[0],z[2]],'الفعل يعبّر عن الحدث.');add(`أي ترتيب يطابق «${x.fr}»؟`,'Sujet + Verbe + Complément',['Sujet + Verbe + Complément','Verbe + Sujet + Complément','Complément + Sujet + Verbe'],'هذا هو النموذج الأساسي في الدرس.');});if(D.grammar?.miniRule){const s=(D.grammar.steps||[]).slice(0,3);add('ما النموذج الأساسي الذي يطبقه الدرس؟',D.grammar.miniRule,[D.grammar.miniRule,...s],'هذه هي القاعدة الأساسية للدرس.');}const Q=questions.slice(0,10);let i=0,score=0,locked=false;function render(){locked=false;const x=Q[i];quiz.innerHTML='<section class="card"><div class="q">سؤال '+(i+1)+' من '+Q.length+'<br>'+esc(x.q)+'</div><div class="opts">'+x.o.map(o=>'<button data-v="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div><div class="fb" id="fb"></div><button class="next" id="next" hidden>'+((i===Q.length-1)?'إنهاء التقييم':'السؤال التالي')+'</button></section>'}quiz.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b||locked)return;locked=true;const x=Q[i],ok=b.dataset.v===x.a;if(ok)score++;quiz.querySelectorAll('[data-v]').forEach(z=>{z.disabled=true;if(z.dataset.v===x.a)z.classList.add('correct')});if(!ok)b.classList.add('wrong');document.getElementById('fb').textContent=ok?'✅ صحيح!':'❌ غير صحيح. '+x.w;document.getElementById('next').hidden=false});quiz.addEventListener('click',e=>{if(e.target.id!=='next'||!locked)return;i++;if(i<Q.length)render();else{quiz.hidden=true;res.hidden=false;document.getElementById('score').textContent=score+' / '+Q.length;document.getElementById('msg').textContent='نتيجتك مستقلة عن التدريب والمراجعة الذكية والاختبار الرسمي.';try{localStorage.setItem('hm-g5-'+id+'-interactive-score',String(Math.round(score/Q.length*100)))}catch(e){}}});document.getElementById('retry').onclick=()=>{i=0;score=0;res.hidden=true;quiz.hidden=false;render()};if(Q.length)render();else quiz.innerHTML='<section class="card"><b>لا توجد أسئلة تقييم تفاعلي عالية الجودة لهذا الدرس.</b><p class="muted">لن يتم اختراع أسئلة ضعيفة لإكمال العدد.</p></section>'})();</script></body></html>
