<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>HM Academy | الدرس الأول — الصف الثالث الإعدادي</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#fff}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="lesson" src="grade9-u1-l1-standard.html?v=20260911-final" title="الرياضات — الدرس الأول — الصف الثالث الإعدادي"></iframe>
<script>
const frame=document.getElementById('lesson');
function clean(){
  try{
    const doc=frame.contentDocument;
    if(!doc)return;
    const style=doc.createElement('style');
    style.textContent=`
      .student-header{display:none!important}
      .student-note{margin-top:0!important}
    `;
    doc.head.appendChild(style);
    document.title=doc.title||document.title;
  }catch(e){}
}
frame.addEventListener('load',()=>{clean();setTimeout(clean,100);setTimeout(clean,500);setTimeout(clean,1200);});
</script>
</body>
</html>
