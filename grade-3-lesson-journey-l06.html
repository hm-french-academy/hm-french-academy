<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate">
<title>HM Academy | Fruits et légumes</title>
<style>
:root{--ink:#2b2e24;--muted:#65695c;--paper:#f7faf3;--green:#4f9b52;--green2:#e1f3e1;--orange:#e8952e;--orange2:#fcebd3;--pink:#d65a6b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 8%,#fbe1e5,transparent 35%),radial-gradient(circle at 90% 10%,#fcebd3,transparent 35%),var(--paper);font-family:Arial,Tahoma,sans-serif;color:var(--ink)}.wrap{max-width:1120px;margin:auto;padding:10px 14px 40px}.top{position:sticky;top:0;z-index:10;background:#ffffffee;backdrop-filter:blur(8px);padding:11px 15px;border-radius:0 0 22px 22px;display:flex;justify-content:space-between;box-shadow:0 8px 28px #2b2e2415}.top a{color:var(--ink);text-decoration:none;font-weight:900}.book{margin-top:14px;background:#fffdf9;border-radius:32px;box-shadow:0 18px 55px #2b2e2420;overflow:hidden}.hero{padding:30px 28px;background:linear-gradient(135deg,#f6b8c1,#f9d69f 55%,#bfe3c1);min-height:175px}.unit{font-weight:900;opacity:.78}.hero h1{margin:8px 0;font-size:clamp(28px,6vw,48px)}.hero p{margin:0;font-weight:800}.journey{display:flex;gap:7px;overflow-x:auto;padding:12px;background:#fffffff5;border-bottom:1px solid #eadfd5}.step{border:0;background:#f3efeb;color:#665b4f;border-radius:999px;padding:9px 13px;font-weight:900;white-space:nowrap;cursor:pointer}.step.active{background:#2b2e24;color:#fff}.stepIcon{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin-left:5px;border-radius:50%;background:#fff8ef}.page{margin:16px;background:#fff;border:1px solid #eee4d9;border-radius:26px;padding:22px;min-height:610px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:16px}.card{background:#fff;border:2px solid #eee5dc;border-radius:22px;padding:17px;box-shadow:0 10px 26px #2b2e2410}.visual{height:150px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:70px;background:linear-gradient(135deg,#fff0f2,#fff8e9)}.pill{display:inline-block;border-radius:999px;padding:6px 11px;background:var(--orange2);font-weight:900}.btn{border:0;border-radius:13px;padding:10px 14px;font-weight:900;cursor:pointer;background:#2b2e24;color:#fff;margin:4px}.btn.light{background:#f2ece5;color:var(--ink)}.btn.good{background:var(--green);color:#fff}.choices{display:flex;gap:8px;flex-wrap:wrap}.feedback{font-weight:900;min-height:25px;margin-top:8px}.ok{color:var(--green)}.bad{color:#bd3f31}.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.vcard{height:260px;perspective:900px;cursor:pointer}.vin{height:100%;position:relative;transform-style:preserve-3d;transition:.5s}.vcard.flip .vin{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:13px;background:#fff;border:2px solid #eee3d7;text-align:center;box-shadow:0 10px 22px #2b2e2410}.face.back{transform:rotateY(180deg);background:var(--green2)}.face .visual{height:145px}.dialogue{display:grid;gap:10px}.line{display:grid;grid-template-columns:100px 1fr auto;gap:10px;align-items:center;padding:12px;border:2px solid #eee5dc;border-radius:17px}.speaker{font-weight:900}.fr{direction:ltr;text-align:left;font-weight:800}.quiz{background:#fff9f3;border:2px solid #efe1d3;border-radius:18px;padding:16px;margin:12px 0}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding-top:14px;border-top:1px solid #eee5dc}.ref{background:linear-gradient(135deg,#f7f0ff,#fff7ea);border:2px solid #eadccf;border-radius:22px;padding:18px}.refgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.refitem{background:#fff;border-radius:16px;padding:13px;border:1px solid #eee3d7}@media(max-width:650px){.wrap{padding:7px 9px 25px}.hero{padding:24px 19px}.page{margin:9px;padding:16px}.line{grid-template-columns:1fr}.fr{text-align:right}}
</style>
</head>
<body>
<div class="wrap"><header class="top"><a href="grade-3.html">← الصف الثالث</a><a href="index.html">HM Academy · الرئيسية</a></header>
<section class="book"><header class="hero"><div class="unit">Le français pour vous · 3e année · Unité 3</div><h1>Les fruits et les légumes 🍎🥕</h1><p>رحلة تفاعلية للدرس السادس: مفردات مصورة، قاعدة، محادثة، تدريب، استماع وتقييم.</p></header><nav id="journey" class="journey"></nav><main id="viewer" class="page"></main></section></div>
<script>
"use strict";
const pages=["🚀 البداية","🔎 افهم","🧩 المفردات","🧠 القاعدة","💬 المحادثة","🎯 التدريب","🎧 اسمع وتحدث","🎬 الوسائط","🎮 مركز الألعاب","🏆 التقييم","🎓 بعد الرحلة"];
let page=0;
const vocab=[
 ["la pomme","تفاح","🍎"],["la banane","موز","🍌"],["l'orange","برتقال","🍊"],["le kiwi","كيوي","🥝"],["la carotte","جزر","🥕"],["la tomate","طماطم","🍅"],["l'oignon","بصل","🧅"],["le chou","كرنب","🥬"],["la fraise","فراولة","🍓"],["la poire","كمثرى","🍐"],["l'ananas","أناناس","🍍"],["le citron","ليمون","🍋"]
];
const official=[
 ["اختر الأداة الصحيحة: ______ citron",["le","la","l'"],"le"],
 ["اختر الأداة الصحيحة: ______ orange",["le","la","l'"],"l'"],
 ["اختر الأداة الصحيحة: ______ banane",["le","la","l'"],"la"],
 ["أي مما يلي خضروات وليست فاكهة؟",["poire","tomate","ananas"],"tomate"],
 ["ما معنى la carotte؟",["بصل","جزر","خيار"],"جزر"],
 ["Le chou-fleur هو خضار.",["Vrai","Faux"],"Vrai"],
 ["La fraise هي خضار.",["Vrai","Faux"],"Faux"],
 ["Ce sont des ____.",["fruits","légumes"],"fruits"]
];
function say(text){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="fr-FR";u.rate=.82;window.speechSynthesis.speak(u)}
function esc(text){return String(text).replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function nav(){return `<div class="nav"><button class="btn light" ${page===0?"disabled":""} id="prevBtn">← السابق</button><b>${page+1} / ${pages.length}</b><button class="btn" ${page===pages.length-1?"disabled":""} id="nextBtn">التالي →</button></div>`}
function shell(tag,title,desc,body){const viewer=document.getElementById("viewer");viewer.innerHTML=`<span class="pill">${tag}</span><h2>${title}</h2><p>${desc}</p>${body}${nav()}`;document.getElementById("journey").innerHTML=pages.map((x,i)=>`<button class="step ${i===page?"active":""}" data-page="${i}"><span class="stepIcon">${i+1}</span>${x}</button>`).join("");document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>go(Number(b.dataset.page))));document.getElementById("prevBtn")?.addEventListener("click",()=>go(page-1));document.getElementById("nextBtn")?.addEventListener("click",()=>go(page+1));document.querySelectorAll("[data-say]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();say(b.dataset.say)}))}
function go(n){page=Math.max(0,Math.min(pages.length-1,n));render()}
function start(){shell("01 · START","🚀 Bienvenue !","الهدف: تسمية الفواكه والخضروات، واختيار le / la / l'، ثم استعمال الكلمات في جمل قصيرة.`, `<div class="cards"><article class="card"><span class="pill">🎯 ماذا سأتعلم؟</span><h3>Fruits & légumes</h3><p>سأتعرف على كلمات الدرس من خلال صور واضحة، ثم أميز أداة كل اسم.</p></article><article class="card"><span class="pill">🧭 المسار</span><p>افهم → مفردات مصورة → القاعدة → محادثة → تدريب → اسمع وتحدث → فيديو → ألعاب → تقييم → مرجع.</p></article></div>`)}
function understand(){const groups=[["🍎","Fruits sucrés","فواكه حلوة",["la pomme","la banane","la fraise","la poire"]],["🍊","Fruits exotiques","فواكه متنوعة",["l'orange","le kiwi","l'ananas","le citron"]],["🥕","Les légumes","الخضروات",["la carotte","la tomate","l'oignon","le concombre"]]];shell("02 · UNDERSTAND","🔎 افهم","كل مجموعة تربط الكلمة بالصورة والفئة، مع نطق قابل للتشغيل.",`<div class="cards">${groups.map(g=>`<article class="card"><div class="visual">${g[0]}</div><h3>${g[1]}</h3><p>${g[2]}</p>${g[3].map(w=>`<button class="btn light" data-say="${esc(w)}">${w} 🔊</button>`).join("")}</article>`).join("")}</div>`)}
function vocabulary(){shell("03 · VOCABULARY","🧩 المفردات","اضغط على البطاقة لتشاهد الصورة والمعنى، ثم استمع للنطق. كل صورة تعبر عن الكلمة نفسها.",`<div class="vgrid">${vocab.map(x=>`<article class="vcard" tabindex="0"><div class="vin"><div class="face"><div class="visual">${x[2]}</div><h3 dir="ltr">${x[0]}</h3><p>اضغط لقلب البطاقة</p><button class="btn speakCard" data-say="${esc(x[0])}">🔊 النطق</button></div><div class="face back"><div class="visual">${x[2]}</div><h3>${x[1]}</h3><p dir="ltr"><b>${x[0]}</b></p><button class="btn good speakCard" data-say="${esc(x[0])}">🔊 استمع</button></div></div></article>`).join("")}</div>`);document.querySelectorAll(".vcard").forEach(c=>c.addEventListener("click",e=>{if(!e.target.closest("button"))c.classList.toggle("flip")}))}
function grammar(){shell("04 · GRAMMAR","🧠 le — la — l'","le مع الاسم المذكر، la مع الاسم المؤنث، و l' مع الاسم الذي يبدأ بحرف علة.",`<div class="cards"><article class="card"><h3 dir="ltr">le citron · le kiwi</h3><p>أسماء مذكرة.</p><button class="btn" data-say="le citron, le kiwi">🔊</button></article><article class="card"><h3 dir="ltr">la pomme · la carotte</h3><p>أسماء مؤنثة.</p><button class="btn" data-say="la pomme, la carotte">🔊</button></article><article class="card"><h3 dir="ltr">l'orange · l'ananas</h3><p>يبدأ الاسم بحرف علة، لذلك نستخدم l'.</p><button class="btn" data-say="l'orange, l'ananas">🔊</button></article></div>`)}
function conversation(){const lines=[["👩‍🏫 المعلمة","Qu'est-ce que c'est ?","C'est une pomme."],["👧 التلميذة","Et ça ?","C'est une banane."],["👩‍🏫 المعلمة","Quelle est cette couleur ?","La pomme est rouge."],["👧 التلميذة","Tu aimes les légumes ?","Oui, j'aime la carotte !"],["👩‍🏫 المعلمة","Et l'orange ?","J'aime l'orange aussi !"]];shell("05 · SPEAK","💬 المحادثة","حوار جديد يستخدم مفردات الدرس داخل موقف، بدل إعادة قائمة الكلمات مع الصوت.",`<div class="dialogue">${lines.map(x=>`<div class="line"><div class="speaker">${x[0]}</div><div><div class="fr">${x[1]}</div><div class="fr" style="color:#65695c">${x[2]}</div></div><button class="btn" data-say="${esc(x[1]+" "+x[2])}">🔊</button></div>`).join("")}</div>`)}
function practice(){const qs=[["اختر: ___ pomme",["le","la","l'"],"la"],["اختر: ___ orange",["le","la","l'"],"l'"],["اختر: ___ kiwi",["le","la","l'"],"le"],["ما معنى la carotte؟",["جزر","بصل","كرنب"],"جزر"],["ما الذي ينتمي للخضروات؟",["ananas","tomate","poire"],"tomate"],["أكمل: C'est ___ pomme.",["la","le","l'"],"la"],["أكمل: C'est ___ orange.",["la","le","l'"],"l'"]];shell("06 · PRACTICE","🎯 التدريب","تدريبات متعددة على الأداة والمعنى والفئة وإكمال الجملة.",`<div>${qs.map((q,i)=>`<div class="quiz"><b>${i+1}. ${q[0]}</b><div class="choices">${q[1].map(o=>`<button class="btn light pchoice" data-q="${i}" data-a="${esc(q[2])}">${o}</button>`).join("")}</div><div id="pf${i}" class="feedback"></div></div>`).join("")}</div>`);document.querySelectorAll(".pchoice").forEach(b=>b.addEventListener("click",()=>{const ok=b.textContent.trim()===b.dataset.a;const el=document.getElementById("pf"+b.dataset.q);el.textContent=ok?"🎉 صحيح!":"💡 حاول مرة أخرى.";el.className="feedback "+(ok?"ok":"bad")}))}
function listen(){const a=[["🍎","Qu'est-ce que c'est ?","C'est une pomme."],["🍌","Quel fruit est jaune ?","C'est une banane."],["🍊","Qu'est-ce que c'est ?","C'est une orange."],["🥝","Quel fruit est vert ?","C'est le kiwi."],["🥕","Quel légume est orange ?","C'est la carotte."],["🍅","Quel légume est rouge ?","C'est la tomate."],["🧅","Qu'est-ce que c'est ?","C'est un oignon."],["🍋","Quel fruit est jaune ?","C'est le citron."]];shell("07 · LISTEN & SPEAK","🎧 اسمع وتحدث","ثمانية مواقف مختلفة: استمع للسؤال، حاول الإجابة، ثم افتح النموذج وانطقه.",`<div class="cards">${a.map((x,i)=>`<article class="card"><span class="pill">موقف ${i+1}</span><div class="visual">${x[0]}</div><p class="fr">${x[1]}</p><button class="btn" data-say="${esc(x[1])}">🔊 السؤال</button><details><summary>أظهر الإجابة</summary><p class="fr">${x[2]}</p><button class="btn good" data-say="${esc(x[2])}">🔊 الإجابة</button></details></article>`).join("")}</div>`)}
function media(){shell("08 · MEDIA","🎬 La comptine des fruits et légumes","فيديو الدرس الأصلي داخل الرحلة.",`<div class="card"><h3>La comptine des fruits et légumes</h3><div style="aspect-ratio:16/9"><iframe src="https://www.youtube.com/embed/xvkWHY39L74" style="width:100%;height:100%;border:0;border-radius:18px" allowfullscreen title="La comptine des fruits et légumes"></iframe></div></div>`)}
function games(){const words=[["citron","le"],["pomme","la"],["orange","l'"],["chou","le"],["carotte","la"],["ananas","l'"]];shell("09 · GAME CENTER","🎮 مركز الألعاب","لعبة تصنيف سريعة مرتبطة مباشرة بقاعدة le / la / l'.",`<div class="card"><h3>LE أم LA أم L'؟</h3><p>اضغط على الكلمة ثم اختر الأداة.</p>${words.map((x,i)=>`<div class="quiz"><b>${x[0]}</b><div class="choices">${["le","la","l'"].map(a=>`<button class="btn light gameChoice" data-q="${i}" data-a="${a}">${a}</button>`).join("")}</div><div id="gf${i}" class="feedback"></div></div>`).join("")}</div>`);document.querySelectorAll(".gameChoice").forEach(b=>b.addEventListener("click",()=>{const expected=words[Number(b.dataset.q)][1];const el=document.getElementById("gf"+b.dataset.q);const ok=b.dataset.a===expected;el.textContent=ok?"🎉 صحيح!":"💡 حاول مرة أخرى.";el.className="feedback "+(ok?"ok":"bad")}))}
function assessment(){shell("10 · ASSESSMENT","🏆 التقييم","التقييم مبني على أسئلة التقييم السريع المرتبطة بمحتوى الدرس، ولم تعد الصفحة فارغة.",`<div>${official.map((q,i)=>`<div class="quiz"><b>${i+1}. ${q[0]}</b><div class="choices">${q[1].map(o=>`<button class="btn light achoice" data-q="${i}" data-a="${esc(o)}">${o}</button>`).join("")}</div><div id="af${i}" class="feedback"></div></div>`).join("")}</div><button class="btn good" id="scoreBtn">✅ احسب النتيجة</button><div id="score" style="font-size:26px;font-weight:900;text-align:center;margin-top:15px"></div>`);document.querySelectorAll(".achoice").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(`.achoice[data-q="${b.dataset.q}"]`).forEach(x=>x.classList.remove("good"));b.classList.add("good");document.getElementById("af"+b.dataset.q).dataset.answer=b.dataset.a}));document.getElementById("scoreBtn").addEventListener("click",()=>{let score=0;official.forEach((q,i)=>{const v=document.getElementById("af"+i).dataset.answer||"";const ok=v===q[2];if(ok)score++;const el=document.getElementById("af"+i);el.textContent=ok?"✔️ صحيح":"✘ الإجابة الصحيحة: "+q[2];el.className="feedback "+(ok?"ok":"bad")});document.getElementById("score").textContent=`النتيجة: ${score} / ${official.length}`})}
function post(){shell("11 · POST LESSON","🎓 بعد الرحلة","مرجع سريع منظم للمفردات والقاعدة والأمثلة والمراجعة الذاتية.",`<div class="ref"><h3>📘 Fruits et légumes — Référence</h3><div class="refgrid"><div class="refitem"><b>🍎 Fruits</b><p dir="ltr">la pomme · la banane · la fraise · la poire</p></div><div class="refitem"><b>🍊 Fruits variés</b><p dir="ltr">l'orange · le kiwi · l'ananas · le citron</p></div><div class="refitem"><b>🥕 Légumes</b><p dir="ltr">la carotte · la tomate · l'oignon · le concombre · le chou</p></div><div class="refitem"><b>🧠 La règle</b><p dir="ltr">le + masculin<br>la + féminin<br>l' + voyelle</p></div><div class="refitem"><b>🗣️ Phrases</b><p dir="ltr">C'est la pomme.<br>C'est l'orange.<br>C'est la carotte.</p></div><div class="refitem"><b>🎯 Je peux...</b><p>أسمي فاكهة وخضار، أختار le / la / l'، وأجيب عن سؤال بسيط حول الطعام.</p></div></div></div>`)}
function render(){[start,understand,vocabulary,grammar,conversation,practice,listen,media,games,assessment,post][page]();window.scrollTo({top:0,behavior:"smooth"})}
render();
</script>
</body></html>
