<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>HM Academy | Fruits et légumes</title><style>:root{--ink:#24352a;--bg:#f7faf3;--green:#4f9b52;--soft:#e1f3e1;--orange:#e8952e}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f8e1e5,#f7faf3 55%,#e6f2e5);font-family:Arial,Tahoma,sans-serif;color:var(--ink)}.wrap{max-width:1120px;margin:auto;padding:10px}.top,.journey,.page{background:#fff}.top{position:sticky;top:0;z-index:5;padding:12px 16px;border-radius:0 0 20px 20px;display:flex;justify-content:space-between;box-shadow:0 5px 20px #0001}.top a{color:var(--ink);text-decoration:none;font-weight:900}.book{margin-top:14px;border-radius:28px;overflow:hidden;box-shadow:0 15px 45px #0002}.hero{padding:28px;background:linear-gradient(135deg,#f6b8c1,#f9d69f 55%,#bfe3c1)}.hero h1{margin:8px 0;font-size:clamp(28px,6vw,48px)}.journey{display:flex;gap:7px;overflow:auto;padding:12px;border-bottom:1px solid #eee}.step{border:0;border-radius:99px;padding:9px 13px;font-weight:900;white-space:nowrap;cursor:pointer}.step.active{background:var(--ink);color:#fff}.page{margin:16px;padding:22px;border-radius:24px;min-height:620px}.cards,.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card,.quiz,.refitem{border:2px solid #eee5dc;border-radius:20px;padding:16px;background:#fff}.visual{height:140px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:68px;background:#fff6ed}.pill{display:inline-block;padding:6px 11px;border-radius:99px;background:#fcebd3;font-weight:900}.btn{border:0;border-radius:12px;padding:10px 14px;margin:4px;background:var(--ink);color:#fff;font-weight:900;cursor:pointer}.btn.light{background:#f1ece5;color:var(--ink)}.btn.good{background:var(--green)}.choices{display:flex;flex-wrap:wrap;gap:6px}.feedback{min-height:24px;font-weight:900}.ok{color:var(--green)}.bad{color:#b33}.vcard{height:255px;perspective:900px;cursor:pointer}.vin{height:100%;position:relative;transform-style:preserve-3d;transition:.5s}.vcard.flip .vin{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border:2px solid #eee;border-radius:20px;padding:12px;text-align:center;background:#fff}.face.back{transform:rotateY(180deg);background:var(--soft)}.dialogue{display:grid;gap:10px}.line{display:grid;grid-template-columns:100px 1fr auto;gap:10px;padding:12px;border:2px solid #eee;border-radius:16px}.fr{direction:ltr;text-align:left;font-weight:800}.nav{display:flex;justify-content:space-between;margin-top:20px;padding-top:15px;border-top:1px solid #eee}.refgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.result{padding:18px;border-radius:18px;background:var(--soft);font-weight:900}@media(max-width:650px){.page{margin:8px;padding:15px}.line{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="top"><a href="grade-3.html">← الصف الثالث</a><a href="index.html">HM Academy · الرئيسية</a></header><section class="book"><header class="hero"><b>Le français pour vous · 3e année · Unité 3</b><h1>Les fruits et les légumes 🍎🥕</h1><p>رحلة تفاعلية للدرس السادس: مفردات مصورة، قاعدة، محادثة، تدريب، استماع وتقييم.</p></header><nav id="journey" class="journey"></nav><main id="viewer" class="page"></main></section></div><script>"use strict";const pages=["🚀 البداية","🔎 افهم","🧩 المفردات","🧠 القاعدة","💬 المحادثة","🎯 التدريب","🎧 اسمع وتحدث","🎬 الوسائط","🎮 مركز الألعاب","🏆 التقييم","🎓 بعد الرحلة"];let page=0;const vocab=[["la pomme","تفاح","🍎"],["la banane","موز","🍌"],["l'orange","برتقال","🍊"],["le kiwi","كيوي","🥝"],["la carotte","جزر","🥕"],["la tomate","طماطم","🍅"],["l'oignon","بصل","🧅"],["le chou","كرنب","🥬"],["la fraise","فراولة","🍓"],["la poire","كمثرى","🍐"],["l'ananas","أناناس","🍍"],["le citron","ليمون","🍋"]];const questions=[["اختر الأداة الصحيحة: citron",["le","la","l'"],"le"],["اختر الأداة الصحيحة: orange",["le","la","l'"],"l'"],["اختر الأداة الصحيحة: banane",["le","la","l'"],"la"],["أي مما يلي خضروات؟",["poire","tomate","ananas"],"tomate"],["ما معنى la carotte؟",["بصل","جزر","خيار"],"جزر"],["Le chou-fleur هو خضار.",["Vrai","Faux"],"Vrai"],["La fraise هي خضار.",["Vrai","Faux"],"Faux"],["Ce sont des ____ .",["fruits","légumes"],"fruits"]];function say(t){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.82;window.speechSynthesis.speak(u)}function esc(s){return String(s).replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}function nav(){return '<div class="nav"><button class="btn light" id="prev">← السابق</button><b>'+(page+1)+' / '+pages.length+'</b><button class="btn" id="next">التالي →</button></div>'}function shell(tag,title,desc,body){const v=document.getElementById("viewer"),j=document.getElementById("journey");v.innerHTML='<span class="pill">'+tag+'</span><h2>'+title+'</h2><p>'+desc+'</p>'+body+nav();j.innerHTML=pages.map((x,i)=>'<button class="step '+(i===page?'active':'')+'" data-go="'+i+'">'+(i+1)+' · '+x+'</button>').join('');j.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(Number(b.dataset.go)));document.getElementById('prev').onclick=()=>go(page-1);document.getElementById('next').onclick=()=>go(page+1);v.querySelectorAll('[data-say]').forEach(b=>b.onclick=e=>{e.stopPropagation();say(b.getAttribute('data-say'))})}function go(n){page=Math.max(0,Math.min(pages.length-1,n));render()}function start(){shell('01','🚀 Bienvenue !','الهدف: تسمية الفواكه والخضروات، واختيار le / la / l’، ثم استعمال الكلمات في جمل قصيرة.','<div class="cards"><article class="card"><span class="pill">🎯 الهدف</span><h3>Fruits & légumes</h3><p>أتعرف إلى الكلمات من خلال صور واضحة وأميز أداة كل اسم.</p></article><article class="card"><span class="pill">🧭 الرحلة</span><p>افهم → مفردات → قاعدة → محادثة → تدريب → اسمع وتحدث → فيديو → ألعاب → تقييم → مرجع.</p></article></div>')}function understand(){const groups=[["🍎","Fruits sucrés","فواكه",["la pomme","la banane","la fraise","la poire"]],["🍊","Fruits variés","فواكه",["l'orange","le kiwi","l'ananas","le citron"]],["🥕","Les légumes","خضروات",["la carotte","la tomate","l'oignon","le chou"]]];shell('02','🔎 افهم','كل فئة تربط الكلمة بالصورة والمعنى مع النطق.','<div class="cards">'+groups.map(g=>'<article class="card"><div class="visual">'+g[0]+'</div><h3>'+g[1]+'</h3><p>'+g[2]+'</p>'+g[3].map(w=>'<button class="btn light" data-say="'+esc(w)+'">'+w+' 🔊</button>').join('')+'</article>').join('')+'</div>')}function vocabulary(){shell('03','🧩 المفردات','اضغط البطاقة لقلبها: صورة، معنى عربي، ثم نطق فرنسي.','<div class="vgrid">'+vocab.map(x=>'<article class="vcard"><div class="vin"><div class="face"><div class="visual">'+x[2]+'</div><h3 dir="ltr">'+x[0]+'</h3><p>اضغط لقلب البطاقة</p><button class="btn" data-say="'+esc(x[0])+'">🔊 النطق</button></div><div class="face back"><div class="visual">'+x[2]+'</div><h3>'+x[1]+'</h3><p dir="ltr">'+x[0]+'</p><button class="btn good" data-say="'+esc(x[0])+'">🔊 استمع</button></div></div></article>').join('')+'</div>');document.querySelectorAll('.vcard').forEach(c=>c.onclick=e=>{if(!e.target.closest('button'))c.classList.toggle('flip')})}function grammar(){shell('04','🧠 le — la — l’','le للمذكر، la للمؤنث، و l’ قبل الاسم الذي يبدأ بحرف علة.','<div class="cards"><article class="card"><div class="visual">🔵</div><h3 dir="ltr">le citron · le kiwi</h3><p>مذكر.</p><button class="btn" data-say="le citron, le kiwi">🔊</button></article><article class="card"><div class="visual">🔴</div><h3 dir="ltr">la pomme · la carotte</h3><p>مؤنث.</p><button class="btn" data-say="la pomme, la carotte">🔊</button></article><article class="card"><div class="visual">🟢</div><h3 dir="ltr">l’orange · l’ananas</h3><p>قبل حرف علة.</p><button class="btn" data-say="lorange, lananas">🔊</button></article></div>')}function conversation(){const lines=[["👩‍🏫","Qu'est-ce que c'est ?","C'est une pomme."],["👧","Et ça ?","C'est une banane."],["👩‍🏫","Quelle est cette couleur ?","La pomme est rouge."],["👧","Tu aimes les légumes ?","Oui, j'aime la carotte !"],["👩‍🏫","Et l'orange ?","J'aime l'orange aussi !"]];shell('05','💬 المحادثة','حوار مستقل يستخدم مفردات الدرس داخل موقف، وليس تكرار قائمة الكلمات.','<div class="dialogue">'+lines.map(x=>'<div class="line"><b>'+x[0]+'</b><div><div class="fr">'+x[1]+'</div><div class="fr">'+x[2]+'</div></div><button class="btn" data-say="'+esc(x[1]+' '+x[2])+'">🔊</button></div>').join('')+'</div>')}function practice(){const qs=[["___ pomme",["le","la","l'"],"la"],["___ orange",["le","la","l'"],"l'"],["___ kiwi",["le","la","l'"],"le"],["la carotte = ؟",["جزر","بصل","كرنب"],"جزر"],["أيها خضار؟",["ananas","tomate","poire"],"tomate"],["C'est ___ pomme.",["la","le","l'"],"la"],["C'est ___ orange.",["la","le","l'"],"l'"]];shell('06','🎯 التدريب','تدريبات متنوعة على الأداة والمعنى والفئة والإكمال.','<div>'+qs.map((q,i)=>'<div class="quiz"><b>'+(i+1)+'. '+q[0]+'</b><div class="choices">'+q[1].map(o=>'<button class="btn light p" data-i="'+i+'" data-a="'+esc(q[2])+'">'+o+'</button>').join('')+'</div><div id="pf'+i+'" class="feedback"></div></div>').join('')+'</div>');document.querySelectorAll('.p').forEach(b=>b.onclick=()=>{const ok=b.textContent.trim()===b.dataset.a,e=document.getElementById('pf'+b.dataset.i);e.textContent=ok?'🎉 صحيح!':'💡 حاول مرة أخرى.';e.className='feedback '+(ok?'ok':'bad')})}function listen(){const a=[["🍎","Qu'est-ce que c'est ?","C'est une pomme."],["🍌","Quel fruit est jaune ?","C'est une banane."],["🍊","Qu'est-ce que c'est ?","C'est une orange."],["🥝","Quel fruit est vert ?","C'est le kiwi."],["🥕","Quel légume est orange ?","C'est la carotte."],["🍅","Quel légume est rouge ?","C'est la tomate."],["🧅","Qu'est-ce que c'est ?","C'est un oignon."],["🍋","Quel fruit est jaune ?","C'est le citron."]];shell('07','🎧 اسمع وتحدث','ثمانية مواقف مختلفة؛ استمع للسؤال ثم انطق الإجابة.','<div class="cards">'+a.map(x=>'<article class="card"><div class="visual">'+x[0]+'</div><p class="fr">'+x[1]+'</p><button class="btn light" data-say="'+esc(x[1])+'">🔊 السؤال</button><p class="fr">'+x[2]+'</p><button class="btn" data-say="'+esc(x[2])+'">🎙️ تحدث</button></article>').join('')+'</div>')}function media(){shell('08','🎬 الوسائط','استمع وشاهد ثم أعد تسمية الكلمات بصوتك.','<div class="card"><h3>Les fruits et les légumes</h3><p>يمكنك تشغيل الوسيط الأصلي للدرس من مصدره، ثم العودة للتدريب والتقييم.</p><button class="btn good" data-say="Les fruits et les légumes">🔊 انطق عنوان الدرس</button></div>')}function games(){shell('09','🎮 مركز الألعاب','تحديات سريعة لتثبيت الأدوات والمفردات.','<div class="cards"><article class="card"><h3>🎯 تحدي الأداة</h3><p>قل: le citron · la pomme · l’orange.</p><button class="btn" data-say="le citron, la pomme, l'orange">🔊 استمع</button></article><article class="card"><h3>🧠 تحدي الذاكرة</h3><p>اختر ثلاث كلمات وحاول تذكرها بالترتيب.</p><button class="btn good" onclick="go(9)">ابدأ التقييم</button></article></div>')}function assessment(){shell('10','🏆 التقييم','اختبار قصير من محتوى الدرس.','<div id="assessment"></div>');const box=document.getElementById('assessment');box.innerHTML=questions.map((q,i)=>'<div class="quiz"><b>'+(i+1)+'. '+q[0]+'</b><div class="choices">'+q[1].map(o=>'<button class="btn light aq" data-i="'+i+'" data-a="'+esc(q[2])+'">'+o+'</button>').join('')+'</div><div id="af'+i+'" class="feedback"></div></div>').join('')+'<div id="score" class="result">Score : 0 / '+questions.length+'</div>';let score=0;document.querySelectorAll('.aq').forEach(b=>b.onclick=()=>{if(b.disabled)return;const ok=b.textContent.trim()===b.dataset.a;if(ok)score++;b.disabled=true;document.getElementById('af'+b.dataset.i).textContent=ok?'✅ صحيح':'❌ إجابة غير صحيحة';document.getElementById('af'+b.dataset.i).className='feedback '+(ok?'ok':'bad');document.getElementById('score').textContent='Score : '+score+' / '+questions.length})}function reference(){shell('11','🎓 بعد الرحلة','مرجع مختصر منظم لما تعلمناه في الدرس السادس.','<div class="refgrid"><article class="refitem"><h3>🍎 Fruits</h3><p>la pomme · la banane · l’orange · le kiwi · la fraise · la poire · l’ananas · le citron</p></article><article class="refitem"><h3>🥕 Légumes</h3><p>la carotte · la tomate · l’oignon · le chou</p></article><article class="refitem"><h3>🧠 La règle</h3><p>le = مذكر · la = مؤنث · l’ = قبل حرف علة.</p></article><article class="refitem"><h3>💬 Exemple</h3><p class="fr">C'est une pomme. C'est un citron. C'est l'orange.</p></article></div>')}function render(){[start,understand,vocabulary,grammar,conversation,practice,listen,media,games,assessment,reference][page]()}render();</script></body></html>
