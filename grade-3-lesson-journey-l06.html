<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate"><title>HM Academy | Fruits et légumes</title><style>:root{--ink:#2b2e24;--bg:#f7faf3;--green:#4f9b52;--soft:#e1f3e1;--orange:#e8952e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 10%,#fbe1e5,transparent 35%),var(--bg);font-family:Arial,Tahoma,sans-serif;color:var(--ink)}.wrap{max-width:1120px;margin:auto;padding:10px}.top,.journey,.page{background:#fff}.top{position:sticky;top:0;z-index:5;padding:12px 16px;border-radius:0 0 20px 20px;display:flex;justify-content:space-between;box-shadow:0 5px 20px #0001}.top a{color:var(--ink);text-decoration:none;font-weight:900}.book{margin-top:14px;border-radius:28px;overflow:hidden;box-shadow:0 15px 45px #0002}.hero{padding:28px;background:linear-gradient(135deg,#f6b8c1,#f9d69f 55%,#bfe3c1)}.hero h1{margin:8px 0;font-size:clamp(28px,6vw,48px)}.journey{display:flex;gap:7px;overflow:auto;padding:12px;border-bottom:1px solid #eee}.step{border:0;border-radius:99px;padding:9px 13px;font-weight:900;white-space:nowrap}.step.active{background:var(--ink);color:#fff}.page{margin:16px;padding:22px;border-radius:24px;min-height:620px}.cards,.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card,.quiz,.refitem{border:2px solid #eee5dc;border-radius:20px;padding:16px;background:#fff}.visual{height:140px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:68px;background:#fff6ed}.pill{display:inline-block;padding:6px 11px;border-radius:99px;background:#fcebd3;font-weight:900}.btn{border:0;border-radius:12px;padding:10px 14px;margin:4px;background:var(--ink);color:#fff;font-weight:900;cursor:pointer}.btn.light{background:#f1ece5;color:var(--ink)}.btn.good{background:var(--green)}.choices{display:flex;flex-wrap:wrap;gap:6px}.feedback{min-height:24px;font-weight:900}.ok{color:var(--green)}.bad{color:#b33}.vcard{height:255px;perspective:900px;cursor:pointer}.vin{height:100%;position:relative;transform-style:preserve-3d;transition:.5s}.vcard.flip .vin{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border:2px solid #eee;border-radius:20px;padding:12px;text-align:center;background:#fff}.face.back{transform:rotateY(180deg);background:var(--soft)}.dialogue{display:grid;gap:10px}.line{display:grid;grid-template-columns:100px 1fr auto;gap:10px;padding:12px;border:2px solid #eee;border-radius:16px}.fr{direction:ltr;text-align:left;font-weight:800}.nav{display:flex;justify-content:space-between;margin-top:20px;padding-top:15px;border-top:1px solid #eee}.refgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}@media(max-width:650px){.page{margin:8px;padding:15px}.line{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="top"><a href="grade-3.html">← الصف الثالث</a><a href="index.html">HM Academy · الرئيسية</a></header><section class="book"><header class="hero"><b>Le français pour vous · 3e année · Unité 3</b><h1>Les fruits et les légumes 🍎🥕</h1><p>رحلة تفاعلية للدرس السادس: مفردات مصورة، قاعدة، محادثة، تدريب، استماع وتقييم.</p></header><nav id="journey" class="journey"></nav><main id="viewer" class="page"></main></section></div><script>
"use strict";
const pages=[`🚀 البداية`,`🔎 افهم`,`🧩 المفردات`,`🧠 القاعدة`,`💬 المحادثة`,`🎯 التدريب`,`🎧 اسمع وتحدث`,`🎬 الوسائط`,`🎮 مركز الألعاب`,`🏆 التقييم`,`🎓 بعد الرحلة`];let page=0;
const vocab=[[`la pomme`,`تفاح`,`🍎`],[`la banane`,`موز`,`🍌`],[`l'orange`,`برتقال`,`🍊`],[`le kiwi`,`كيوي`,`🥝`],[`la carotte`,`جزر`,`🥕`],[`la tomate`,`طماطم`,`🍅`],[`l'oignon`,`بصل`,`🧅`],[`le chou`,`كرنب`,`🥬`],[`la fraise`,`فراولة`,`🍓`],[`la poire`,`كمثرى`,`🍐`],[`l'ananas`,`أناناس`,`🍍`],[`le citron`,`ليمون`,`🍋`]];
const questions=[[`اختر الأداة الصحيحة: citron`,[`le`,`la`,`l'`],`le`],[`اختر الأداة الصحيحة: orange`,[`le`,`la`,`l'`],`l'`],[`اختر الأداة الصحيحة: banane`,[`le`,`la`,`l'`],`la`],[`أي مما يلي خضروات؟`,[`poire`,`tomate`,`ananas`],`tomate`],[`ما معنى la carotte؟`,[`بصل`,`جزر`,`خيار`],`جزر`],[`Le chou-fleur هو خضار.`,[`Vrai`,`Faux`],`Vrai`],[`La fraise هي خضار.`,[`Vrai`,`Faux`],`Faux`],[`Ce sont des ____ .`,[`fruits`,`légumes`],`fruits`]];
function say(t){if(!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=`fr-FR`;u.rate=.82;speechSynthesis.speak(u)}
function esc(s){return String(s).replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function nav(){return `<div class="nav"><button class="btn light" id="prev">← السابق</button><b>${page+1} / ${pages.length}</b><button class="btn" id="next">التالي →</button></div>`}
function shell(tag,title,desc,body){document.querySelector(`#viewer`).innerHTML=`<span class="pill">${tag}</span><h2>${title}</h2><p>${desc}</p>${body}${nav()}`;document.querySelector(`#journey`).innerHTML=pages.map((x,i)=>`<button class="step ${i===page?`active`:``}" data-go="${i}">${i+1} · ${x}</button>`).join(``);document.querySelectorAll(`[data-go]`).forEach(b=>b.onclick=()=>go(+b.dataset.go));document.querySelector(`#prev`).onclick=()=>go(page-1);document.querySelector(`#next`).onclick=()=>go(page+1);document.querySelectorAll(`[data-say]`).forEach(b=>b.onclick=e=>{e.stopPropagation();say(b.dataset.say)})}
function go(n){page=Math.max(0,Math.min(pages.length-1,n));render()}
function start(){shell(`01`,`🚀 Bienvenue !`,`الهدف: تسمية الفواكه والخضروات، واختيار le / la / l'، ثم استعمال الكلمات في جمل قصيرة.`,`<div class="cards"><article class="card"><span class="pill">🎯 الهدف</span><h3>Fruits & légumes</h3><p>أتعرف إلى الكلمات من خلال صور واضحة وأميز أداة كل اسم.</p></article><article class="card"><span class="pill">🧭 الرحلة</span><p>افهم → مفردات → قاعدة → محادثة → تدريب → اسمع وتحدث → فيديو → ألعاب → تقييم → مرجع.</p></article></div>`)}
function understand(){let groups=[[`🍎`,`Fruits sucrés`,`فواكه`,[`la pomme`,`la banane`,`la fraise`,`la poire`]],[`🍊`,`Fruits variés`,`فواكه`,[`l'orange`,`le kiwi`,`l'ananas`,`le citron`]],[`🥕`,`Les légumes`,`خضروات`,[`la carotte`,`la tomate`,`l'oignon`,`le concombre`]]];shell(`02`,`🔎 افهم`,`كل فئة تربط الكلمة بالصورة والمعنى مع النطق.`,`<div class="cards">${groups.map(g=>`<article class="card"><div class="visual">${g[0]}</div><h3>${g[1]}</h3><p>${g[2]}</p>${g[3].map(w=>`<button class="btn light" data-say="${esc(w)}">${w} 🔊</button>`).join(``)}</article>`).join(``)}</div>`)}
function vocabulary(){shell(`03`,`🧩 المفردات`,`اضغط البطاقة لقلبها: صورة، معنى عربي، ثم نطق فرنسي.`,`<div class="vgrid">${vocab.map(x=>`<article class="vcard"><div class="vin"><div class="face"><div class="visual">${x[2]}</div><h3 dir="ltr">${x[0]}</h3><p>اضغط لقلب البطاقة</p><button class="btn" data-say="${esc(x[0])}">🔊 النطق</button></div><div class="face back"><div class="visual">${x[2]}</div><h3>${x[1]}</h3><p dir="ltr">${x[0]}</p><button class="btn good" data-say="${esc(x[0])}">🔊 استمع</button></div></div></article>`).join(``)}</div>`);document.querySelectorAll(`.vcard`).forEach(c=>c.onclick=e=>{if(!e.target.closest(`button`))c.classList.toggle(`flip`)})}
function grammar(){shell(`04`,`🧠 le — la — l'`,`le للمذكر، la للمؤنث، و l' قبل الاسم الذي يبدأ بحرف علة.`,`<div class="cards"><article class="card"><div class="visual">🔵</div><h3 dir="ltr">le citron · le kiwi</h3><p>مذكر.</p><button class="btn" data-say="le citron, le kiwi">🔊</button></article><article class="card"><div class="visual">🔴</div><h3 dir="ltr">la pomme · la carotte</h3><p>مؤنث.</p><button class="btn" data-say="la pomme, la carotte">🔊</button></article><article class="card"><div class="visual">🟢</div><h3 dir="ltr">l'orange · l'ananas</h3><p>قبل حرف علة.</p><button class="btn" data-say="l'orange, l'ananas">🔊</button></article></div>`)}
function conversation(){let lines=[[`👩‍🏫`,`Qu'est-ce que c'est ?`,`C'est une pomme.`],[`👧`,`Et ça ?`,`C'est une banane.`],[`👩‍🏫`,`Quelle est cette couleur ?`,`La pomme est rouge.`],[`👧`,`Tu aimes les légumes ?`,`Oui, j'aime la carotte !`],[`👩‍🏫`,`Et l'orange ?`,`J'aime l'orange aussi !`]];shell(`05`,`💬 المحادثة`,`حوار مستقل يستخدم مفردات الدرس داخل موقف، وليس تكرار قائمة الكلمات.`,`<div class="dialogue">${lines.map(x=>`<div class="line"><b>${x[0]}</b><div><div class="fr">${x[1]}</div><div class="fr">${x[2]}</div></div><button class="btn" data-say="${esc(x[1]+` `+x[2])}">🔊</button></div>`).join(``)}</div>`)}
function practice(){let qs=[[`___ pomme`,[`le`,`la`,`l'`],`la`],[`___ orange`,[`le`,`la`,`l'`],`l'`],[`___ kiwi`,[`le`,`la`,`l'`],`le`],[`la carotte = ؟`,[`جزر`,`بصل`,`كرنب`],`جزر`],[`أيها خضار؟`,[`ananas`,`tomate`,`poire`],`tomate`],[`C'est ___ pomme.`,[`la`,`le`,`l'`],`la`],[`C'est ___ orange.`,[`la`,`le`,`l'`],`l'`]];shell(`06`,`🎯 التدريب`,`تدريبات متنوعة على الأداة والمعنى والفئة والإكمال.`,`<div>${qs.map((q,i)=>`<div class="quiz"><b>${i+1}. ${q[0]}</b><div class="choices">${q[1].map(o=>`<button class="btn light p" data-i="${i}" data-a="${esc(q[2])}">${o}</button>`).join(``)}</div><div id="pf${i}" class="feedback"></div></div>`).join(``)}</div>`);document.querySelectorAll(`.p`).forEach(b=>b.onclick=()=>{let ok=b.textContent.trim()===b.dataset.a,e=document.querySelector(`#pf${b.dataset.i}`);e.textContent=ok?`🎉 صحيح!`:`💡 حاول مرة أخرى.`;e.className=`feedback ${ok?`ok`:`bad`}`})}
function listen(){let a=[[`🍎`,`Qu'est-ce que c'est ?`,`C'est une pomme.`],[`🍌`,`Quel fruit est jaune ?`,`C'est une banane.`],[`🍊`,`Qu'est-ce que c'est ?`,`C'est une orange.`],[`🥝`,`Quel fruit est vert ?`,`C'est le kiwi.`],[`🥕`,`Quel légume est orange ?`,`C'est la carotte.`],[`🍅`,`Quel légume est rouge ?`,`C'est la tomate.`],[`🧅`,`Qu'est-ce que c'est ?`,`C'est un oignon.`],[`🍋`,`Quel fruit est jaune ?`,`C'est le citron.`]];shell(`07`,`🎧 اسمع وتحدث`,`ثمانية مواقف مختلفة؛ استمع للسؤال ثم افتح الإجابة وانطقها.`,`<div class="cards">${a.map((x,i)=>`<article class="card"><span class="pill">موقف ${i+1}</span><div class="visual">${x[0]}</div><p class="fr">${x[1]}</p><button class="btn" data-say="${esc(x[1])}">🔊 السؤال</button><details><summary>أظهر الإجابة</summary><p class="fr">${x[2]}</p><button class="btn good" data-say="${esc(x[2])}">🔊 الإجابة</button></details></article>`).join(``)}</div>`)}
function media(){shell(`08`,`🎬 La comptine des fruits et légumes`,`فيديو الدرس داخل الرحلة.`,`<div class="card"><div style="aspect-ratio:16/9"><iframe src="https://www.youtube.com/embed/xvkWHY39L74" style="width:100%;height:100%;border:0;border-radius:18px" allowfullscreen title="La comptine des fruits et légumes"></iframe></div></div>`)}
function games(){let words=[[`citron`,`le`],[`pomme`,`la`],[`orange`,`l'`],[`chou`,`le`],[`carotte`,`la`],[`ananas`,`l'`]];shell(`09`,`🎮 مركز الألعاب`,`اختر الأداة الصحيحة لكل كلمة.`,`<div class="cards">${words.map((x,i)=>`<article class="quiz"><h3>${x[0]}</h3><div class="choices">${[`le`,`la`,`l'`].map(a=>`<button class="btn light g" data-i="${i}" data-a="${a}">${a}</button>`).join(``)}</div><div id="gf${i}" class="feedback"></div></article>`).join(``)}</div>`);document.querySelectorAll(`.g`).forEach(b=>b.onclick=()=>{let expected=words[+b.dataset.i][1],ok=b.dataset.a===expected,e=document.querySelector(`#gf${b.dataset.i}`);e.textContent=ok?`🎉 صحيح!`:`💡 حاول مرة أخرى.`;e.className=`feedback ${ok?`ok`:`bad`}`})}
function assessment(){shell(`10`,`🏆 التقييم`,`التقييم لم يعد فارغًا؛ ثمانية أسئلة مرتبطة بمحتوى الدرس.`,`<div>${questions.map((q,i)=>`<div class="quiz"><b>${i+1}. ${q[0]}</b><div class="choices">${q[1].map(o=>`<button class="btn light a" data-i="${i}" data-a="${esc(o)}">${o}</button>`).join(``)}</div><div id="af${i}" class="feedback"></div></div>`).join(``)}</div><button class="btn good" id="score">✅ احسب النتيجة</button><div id="result" style="font-size:25px;font-weight:900;text-align:center"></div>`);document.querySelectorAll(`.a`).forEach(b=>b.onclick=()=>{document.querySelectorAll(`.a[data-i="${b.dataset.i}"]`).forEach(x=>x.classList.remove(`good`));b.classList.add(`good`);document.querySelector(`#af${b.dataset.i}`).dataset.answer=b.dataset.a});document.querySelector(`#score`).onclick=()=>{let s=0;questions.forEach((q,i)=>{let e=document.querySelector(`#af${i}`),ok=e.dataset.answer===q[2];if(ok)s++;e.textContent=ok?`✔️ صحيح`:`✘ الإجابة الصحيحة: ${q[2]}`;e.className=`feedback ${ok?`ok`:`bad`}`});document.querySelector(`#result`).textContent=`النتيجة: ${s} / ${questions.length}`})}
function post(){shell(`11`,`🎓 بعد الرحلة`,`مرجع سريع منظم للمفردات والقاعدة والأمثلة.`,`<div class="ref"><h3>📘 Fruits et légumes — Référence</h3><div class="refgrid"><div class="refitem"><b>🍎 Fruits</b><p dir="ltr">la pomme · la banane · la fraise · la poire</p></div><div class="refitem"><b>🍊 Fruits variés</b><p dir="ltr">l'orange · le kiwi · l'ananas · le citron</p></div><div class="refitem"><b>🥕 Légumes</b><p dir="ltr">la carotte · la tomate · l'oignon · le chou</p></div><div class="refitem"><b>🧠 La règle</b><p dir="ltr">le + masculin<br>la + féminin<br>l' + voyelle</p></div><div class="refitem"><b>🗣️ Phrases</b><p dir="ltr">C'est la pomme.<br>C'est l'orange.<br>C'est la carotte.</p></div><div class="refitem"><b>🎯 Je peux...</b><p>أسمي الفواكه والخضروات، أختار الأداة، وأجيب عن سؤال بسيط.</p></div></div></div>`)}
function render(){[start,understand,vocabulary,grammar,conversation,practice,listen,media,games,assessment,post][page]();window.scrollTo(0,0)}render();
</script></body></html>
