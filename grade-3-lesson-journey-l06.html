<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate"><title>HM Academy | Fruits et légumes</title><style>:root{--ink:#332b24;--soft:#665b4f;--cream:#fbf6f2;--paper:#fff;--violet:#8073b0;--violet-soft:#e7e3f3;--orange:#c97d3e;--orange-soft:#fbe8d6;--teal:#3e9187;--teal-soft:#dbf0ec;--green:#2e8b57;--red:#c0392b;--shadow:0 12px 32px rgba(51,43,36,.12)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 8%,#e7e3f3 0,transparent 38%),radial-gradient(circle at 92% 12%,#fbe8d6 0,transparent 38%),var(--cream);color:var(--ink);font-family:Arial,Tahoma,sans-serif}.wrap{max-width:1120px;margin:auto;padding:10px 14px 40px}.top{position:sticky;top:0;z-index:20;background:#ffffffee;backdrop-filter:blur(8px);padding:11px 15px;border-radius:0 0 22px 22px;display:flex;justify-content:space-between;box-shadow:0 8px 28px #332b2415}.top a{color:var(--ink);text-decoration:none;font-weight:900}.book{margin-top:14px;background:#fffdf9;border-radius:34px;box-shadow:0 18px 55px #332b2420;overflow:hidden}.hero{padding:30px 28px;background:linear-gradient(135deg,#d9cfee,#f7d5b7 55%,#c8e7e2);min-height:175px}.unit{font-weight:900;opacity:.78}.hero h1{margin:8px 0;font-size:clamp(28px,6vw,48px)}.hero p{margin:0;font-weight:800;color:#574c43}.journey{display:flex;gap:7px;overflow-x:auto;padding:12px;background:#fffffff5;border-bottom:1px solid #eadfd5}.step{border:0;background:#f3efeb;color:#665b4f;border-radius:999px;padding:9px 13px;font-weight:900;white-space:nowrap;cursor:pointer}.step.active{background:#332b24;color:#fff}.stepIcon{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin-left:5px;border-radius:50%;background:#fff8ef}.step.active .stepIcon{background:#fff;color:#332b24}.bookpage{margin:16px;background:#fff;border:1px solid #eee4d9;border-radius:26px;padding:22px;min-height:610px}.panel{line-height:1.9}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:16px}.card{background:linear-gradient(180deg,#fff,#fffaf5);border:2px solid #efe5da;border-radius:22px;padding:17px;box-shadow:0 10px 26px #332b2410}.pill{display:inline-block;border-radius:999px;padding:6px 11px;background:var(--orange-soft);font-weight:900}.btn{border:0;border-radius:14px;padding:11px 15px;font-weight:900;cursor:pointer;background:#332b24;color:#fff;margin:4px;touch-action:manipulation}.btn.light{background:#f2ece5;color:var(--ink)}.btn.good{background:var(--green)}.btn:disabled{opacity:.45;cursor:not-allowed}.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.choices .btn{flex:1;min-width:145px}.feedback{font-weight:900;margin-top:9px;min-height:25px}.ok{color:var(--green)}.bad{color:var(--red)}.scene{height:180px;border-radius:18px;background:linear-gradient(180deg,#dff3f0,#fff);display:flex;align-items:center;justify-content:center;overflow:hidden}.scene svg,.vscene svg{width:100%;height:100%}.vocabGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.vcard{min-height:285px;perspective:900px;cursor:pointer}.vinner{height:285px;position:relative;transform-style:preserve-3d;transition:.5s}.vcard.flipped .vinner{transform:rotateY(180deg)}.vface{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:13px;background:#fff;border:2px solid #eee3d7;box-shadow:0 10px 22px #332b2410;text-align:center}.vface.back{transform:rotateY(180deg);background:var(--teal-soft)}.vface h3{margin:7px 0 3px}.vscene{height:155px;border-radius:15px;overflow:hidden;background:#f5faf8}.ruleBox{background:linear-gradient(135deg,#f7f0ff,#fff7ea);border:2px solid #eadccf;border-radius:22px;padding:18px;margin-top:14px}.ruleGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.ruleCard{background:#fff;border-radius:18px;padding:15px;border:2px solid #eee3d7;text-align:center}.ruleCard .big{font-size:34px;font-weight:900}.sortArea{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.sortBox{min-height:160px;background:#fff;border:2px dashed #d9cfc3;border-radius:18px;padding:12px}.wordBtn{background:#f2ece5;color:var(--ink);border:0;border-radius:12px;padding:9px;margin:4px;font-weight:900;cursor:pointer}.dialogue{display:grid;gap:10px}.line{display:grid;grid-template-columns:105px 1fr auto;gap:9px;align-items:center;background:#fff;border:2px solid #eee5dc;border-radius:17px;padding:11px}.fr{direction:ltr;text-align:left;font-weight:800}.quiz{background:#fff9f3;border-radius:18px;padding:16px;margin:12px 0;border:2px solid #efe1d3}.qtitle{font-weight:900;margin-bottom:8px}.refBox{background:linear-gradient(135deg,#f7f0ff,#fff7ea);border:2px solid #eadccf;border-radius:22px;padding:20px}.refGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}.refItem{background:#fff;border-radius:16px;padding:14px;border:1px solid #eee3d7}.refItem h3{margin-top:0}.mediaWrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:20px;background:#111;margin-top:16px}.mediaWrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.score{font-size:26px;font-weight:900;text-align:center;padding:16px}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding-top:14px;border-top:1px solid #eee5dc}.counter{font-weight:900;color:var(--soft)}@media(max-width:700px){.wrap{padding:7px 9px 25px}.hero{padding:24px 19px}.bookpage{margin:9px;padding:16px}.line{grid-template-columns:1fr}.vocabGrid{grid-template-columns:1fr 1fr}.ruleGrid,.sortArea{grid-template-columns:1fr}.step{padding:8px 10px;font-size:13px}}</style></head><body><div class="wrap"><header class="top"><a href="grade-3.html">← الصف الثالث</a><a href="index.html">HM Academy · الرئيسية</a></header><section class="book"><header class="hero"><div class="unit">Le français pour vous · 3e année · Unité 3</div><h1>Les fruits et les légumes 🍎🥕</h1><p>رحلة تفاعلية للدرس السادس: مفردات مصورة، قاعدة، محادثة، تدريب، استماع وتقييم.</p></header><nav class="journey" id="journey"></nav><main id="viewer" class="bookpage"></main></section></div><script>"use strict";const pages=["🚀 البداية","🔎 افهم","🧩 المفردات","🧠 القاعدة","💬 المحادثة","🎯 التدريب","🎧 اسمع وتحدث","🎬 الوسائط","🎮 مركز الألعاب","🏆 التقييم","🎓 بعد الرحلة"];let page=0;const vocab=[["la pomme","تفاح","🍎"],["la banane","موز","🍌"],["l'orange","برتقال","🍊"],["le kiwi","كيوي","🥝"],["la carotte","جزر","🥕"],["la tomate","طماطم","🍅"],["l'oignon","بصل","🧅"],["le chou","كرنب","🥬"],["la fraise","فراولة","🍓"],["la poire","كمثرى","🍐"],["l'ananas","أناناس","🍍"],["le citron","ليمون","🍋"]];const questions=[["اختر الأداة الصحيحة: citron",["le","la","l'"],"le"],["اختر الأداة الصحيحة: orange",["le","la","l'"],"l'"],["اختر الأداة الصحيحة: banane",["le","la","l'"],"la"],["أي مما يلي خضروات؟",["poire","tomate","ananas"],"tomate"],["ما معنى la carotte؟",["بصل","جزر","كرنب"],"جزر"],["Le chou-fleur هو خضار.",["Vrai","Faux"],"Vrai"],["La fraise هي خضار.",["Vrai","Faux"],"Faux"],["Ce sont des ____ .",["fruits","légumes"],"fruits"]];function say(t){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.82;window.speechSynthesis.speak(u)}function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function art(icon,label){return '<svg viewBox="0 0 260 155" role="img" aria-label="'+esc(label)+'"><defs><linearGradient id="g'+Math.random().toString(36).slice(2)+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7e3f3"/><stop offset="1" stop-color="#dbf0ec"/></linearGradient></defs><rect width="260" height="155" rx="18" fill="#eef6ef"/><circle cx="220" cy="28" r="16" fill="#fff" opacity=".8"/><text x="130" y="96" text-anchor="middle" font-size="64">'+icon+'</text><text x="130" y="132" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#332b24">'+esc(label)+'</text></svg>'}function nav(){return '<div class="nav"><button class="btn light" '+(page===0?'disabled':'')+' onclick="go('+(page-1)+')">← السابق</button><span class="counter">'+(page+1)+' / '+pages.length+'</span><button class="btn" '+(page===pages.length-1?'disabled':'')+' onclick="go('+(page+1)+')">التالي →</button></div>'}function go(n){page=Math.max(0,Math.min(pages.length-1,n));render()}function shell(tag,title,desc,body){document.getElementById('viewer').innerHTML='<section class="panel"><span class="pill">'+tag+'</span><h2>'+title+'</h2><p>'+desc+'</p>'+body+nav()+'</section>';document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say))}function renderJourney(){document.getElementById('journey').innerHTML=pages.map((x,i)=>'<button class="step '+(i===page?'active':'')+'" onclick="go('+i+')"><span class="stepIcon">'+(i+1)+'</span>'+x+'</button>').join('')}function start(){shell('01 · START','🚀 Bienvenue !','هدف الرحلة: تسمية الفواكه والخضروات، واختيار le / la / l’، ثم استعمال الكلمات في جمل قصيرة.','<div class="cards"><article class="card"><span class="pill">🎯 الهدف</span><h3>أتعرف إلى الكلمات من خلال الصورة</h3><p>أتعلم اسم كل فاكهة أو خضار بصورة مستقلة، ثم أسمع النطق وأستخدم الكلمة في جملة.</p></article><article class="card"><span class="pill">🧭 الرحلة</span><p>افهم → مفردات → قاعدة → محادثة → تدريب → اسمع وتحدث → فيديو → ألعاب → تقييم → مرجع.</p></article></div>')}function understand(){const groups=[["🍎","Fruits sucrés","فواكه",["la pomme","la banane","la fraise","la poire"]],["🍊","Fruits variés","فواكه",["l'orange","le kiwi","l'ananas","le citron"]],["🥕","Les légumes","خضروات",["la carotte","la tomate","l'oignon","le chou"]]];shell('02 · UNDERSTAND','🔎 افهم','نفهم الكلمات من خلال الفئات، لكن كل كلمة في صفحة المفردات ستظهر بصورة مستقلة.','<div class="cards">'+groups.map(g=>'<article class="card"><div class="scene">'+art(g[0],g[1])+'</div><h3>'+g[1]+'</h3><p>'+g[2]+'</p>'+g[3].map(w=>'<button class="btn light" data-say="'+esc(w)+'">'+w+' 🔊</button>').join('')+'</article>').join('')+'</div>')}function vocabulary(){shell('03 · VOCABULAIRE','🧩 المفردات','كل مفردة لها بطاقة وصورة مستقلة تمامًا؛ اضغط البطاقة لقلبها، ثم استمع للنطق.','<div class="vocabGrid">'+vocab.map(x=>'<article class="vcard"><div class="vinner"><div class="vface"><div class="vscene">'+art(x[2],x[0])+'</div><h3 dir="ltr">'+x[0]+'</h3><p>'+x[1]+'</p><button class="btn" data-say="'+esc(x[0])+'">🔊 النطق</button><div class="mini">اضغط البطاقة لرؤية الوجه الآخر</div></div><div class="vface back"><div class="vscene">'+art(x[2],x[1])+'</div><h3>'+x[1]+'</h3><p dir="ltr">'+x[0]+'</p><button class="btn good" data-say="'+esc(x[0])+'">🔊 استمع مرة أخرى</button></div></div></article>').join('')+'</div>');document.querySelectorAll('.vcard').forEach(c=>c.onclick=e=>{if(!e.target.closest('button'))c.classList.toggle('flipped')})}function grammar(){shell('04 · GRAMMAIRE','🧠 القاعدة: le — la — l\'','في الفرنسية، لكل اسم أداة تعريف. نختار الأداة بحسب جنس الاسم، ومع بداية الاسم بحرف علة نستخدم l\'.','<div class="ruleBox"><h3>1️⃣ ماذا تعني الأدوات؟</h3><p><b>LE</b> مع الاسم المذكر: <span dir="ltr"><b>le citron</b>, <b>le kiwi</b></span>.</p><p><b>LA</b> مع الاسم المؤنث: <span dir="ltr"><b>la pomme</b>, <b>la carotte</b></span>.</p><p><b>L\'</b> تأتي قبل اسم يبدأ بحرف علة: <span dir="ltr"><b>l\'orange</b>, <b>l\'ananas</b></span>.</p><p><b>ملاحظة مهمة:</b> لا نختار le أو la من معنى الكلمة بالعربية؛ نحفظ الكلمة مع أداتها كما نتعلمها.</p><div class="ruleGrid"><article class="ruleCard"><div class="big">LE</div><p dir="ltr">le citron</p><button class="btn" data-say="le citron">🔊</button></article><article class="ruleCard"><div class="big">LA</div><p dir="ltr">la pomme</p><button class="btn" data-say="la pomme">🔊</button></article><article class="ruleCard"><div class="big">L’</div><p dir="ltr">l'orange</p><button class="btn" data-say="orange">🔊</button></article></div></div><div class="ruleBox"><h3>2️⃣ جرّب بنفسك</h3><p>اضغط الاسم، ثم اختر الأداة المناسبة.</p><div id="sortWords">'+['citron','pomme','orange','kiwi','carotte','ananas'].map(w=>'<button class="wordBtn" data-word="'+w+'">'+w+'</button>').join('')+'</div><div class="sortArea"><div class="sortBox"><h3>LE</h3><div id="leBox"></div></div><div class="sortBox"><h3>LA</h3><div id="laBox"></div></div><div class="sortBox"><h3>L\'</h3><div id="liBox"></div></div></div><p id="sortFeedback" class="feedback"></p></div>');const ans={citron:'le',pomme:'la',orange:"l'",kiwi:'le',carotte:'la',ananas:"l'"};document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{const w=b.dataset.word;const a=prompt('ضع '+w+' تحت أي أداة؟ اكتب: le أو la أو l\'');if(!a)return;const ok=a.trim().toLowerCase()===ans[w];document.getElementById('sortFeedback').textContent=ok?'🎉 ممتاز! '+w+' → '+ans[w]:'💡 راجع المثال ثم حاول مرة أخرى.';document.getElementById('sortFeedback').className='feedback '+(ok?'ok':'bad');if(ok){document.getElementById(ans[w]==='le'?'leBox':ans[w]==='la'?'laBox':'liBox').innerHTML+='<span class="pill" dir="ltr">'+ans[w]+' '+w+'</span> '}})}function conversation(){const lines=[["👩‍🏫","Qu'est-ce que c'est ?","C'est une pomme."],["👧","Et ça ?","C'est une banane."],["👩‍🏫","Quel fruit est jaune ?","C'est une banane."],["👧","Et l'orange ?","J'aime l'orange aussi !"],["👩‍🏫","Quels légumes aimes-tu ?","J'aime la carotte et la tomate !"]];shell('05 · CONVERSATION','💬 المحادثة','حوار قصير داخل موقف، باستخدام مفردات الدرس في جمل حقيقية.','<div class="dialogue">'+lines.map(x=>'<div class="line"><b>'+x[0]+'</b><div><div class="fr">'+x[1]+'</div><div class="fr">'+x[2]+'</div></div><button class="btn" data-say="'+esc(x[1]+' '+x[2])+'">🔊</button></div>').join('')+'</div>')}function practice(){const qs=[["___ pomme",["le","la","l'"],"la"],["___ orange",["le","la","l'"],"l'"],["___ kiwi",["le","la","l'"],"le"],["la carotte = ؟",["جزر","بصل","كرنب"],"جزر"],["أيها خضار؟",["ananas","tomate","poire"],"tomate"],["C'est ___ citron.",["le","la","l'"],"le"],["C'est ___ ananas.",["le","la","l'"],"l'"]];shell('06 · TRAINING','🎯 التدريب','تدريبات متنوعة على الأداة والمعنى والفئة وإكمال الجملة.','<div>'+qs.map((q,i)=>'<div class="quiz"><div class="qtitle">'+(i+1)+'. '+q[0]+'</div><div class="choices">'+q[1].map(o=>'<button class="btn light p" data-i="'+i+'" data-a="'+esc(q[2])+'">'+o+'</button>').join('')+'</div><div id="pf'+i+'" class="feedback"></div></div>').join('')+'</div>');document.querySelectorAll('.p').forEach(b=>b.onclick=()=>{const ok=b.textContent.trim()===b.dataset.a,e=document.getElementById('pf'+b.dataset.i);e.textContent=ok?'🎉 صحيح!':'💡 حاول مرة أخرى.';e.className='feedback '+(ok?'ok':'bad')})}function listen(){const a=[["🍎","Qu'est-ce que c'est ?","C'est une pomme."],["🍌","Quel fruit est jaune ?","C'est une banane."],["🍊","Qu'est-ce que c'est ?","C'est une orange."],["🥝","Quel fruit est vert ?","C'est le kiwi."],["🥕","Quel légume est orange ?","C'est la carotte."],["🍅","Quel légume est rouge ?","C'est la tomate."],["🧅","Qu'est-ce que c'est ?","C'est un oignon."],["🍋","Quel fruit est jaune ?","C'est le citron."]];shell('07 · ÉCOUTE','🎧 اسمع وتحدث','ثمانية مواقف مختلفة؛ استمع للسؤال ثم استمع للإجابة ورددها بصوتك.','<div class="cards">'+a.map(x=>'<article class="card"><div class="scene">'+art(x[0],x[1])+'</div><p class="fr">'+x[1]+'</p><button class="btn" data-say="'+esc(x[1])+'">🔊 السؤال</button><p class="fr">'+x[2]+'</p><button class="btn good" data-say="'+esc(x[2])+'">🎙️ الإجابة</button></article>').join('')+'</div>')}function media(){shell('08 · MEDIA','🎬 الوسائط','شاهد فيديو الدرس الأصلي ثم ارجع إلى المفردات والقاعدة والتدريب.','<div class="card"><h3>La comptine des fruits et légumes</h3><p>الفيديو الأصلي المرتبط بالدرس.</p><div class="mediaWrap"><iframe src="https://www.youtube.com/embed/xvkWHY39L74?rel=0" title="La comptine des fruits et légumes" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><p><button class="btn" data-say="Les fruits et les légumes">🔊 استمع إلى عنوان الدرس</button></p></div>')}function games(){shell('09 · GAMES','🎮 مركز الألعاب','تحدي سريع قبل التقييم: تذكر الأداة المناسبة لكل اسم.','<div class="cards"><article class="card"><h3>🎯 تحدي الأدوات</h3><p>le citron · la pomme · l\'orange</p><button class="btn" data-say="le citron, la pomme, orange">🔊</button></article><article class="card"><h3>🧠 تذكّر</h3><p>ما الأداة الصحيحة لـ <b dir="ltr">ananas</b>؟</p><div class="choices"><button class="btn light" onclick="this.nextElementSibling.textContent='💡 الإجابة: l\''">le</button><span></span><button class="btn good" onclick="this.nextElementSibling.textContent='🎉 صحيح: l\''">l'</button><span></span></div></article></div>')}function assess(){shell('10 · ASSESSMENT','🏆 التقييم','تقييم قصير مبني على محتوى الدرس الرسمي.','<div id="aq"></div>');const b=document.getElementById('aq');let score=0;b.innerHTML=questions.map((q,i)=>'<div class="quiz"><div class="qtitle">'+(i+1)+'. '+q[0]+'</div><div class="choices">'+q[1].map(o=>'<button class="btn light aa" data-i="'+i+'" data-a="'+esc(q[2])+'">'+o+'</button>').join('')+'</div><div id="af'+i+'" class="feedback"></div></div>').join('')+'<div class="score" id="sc">Score : 0 / '+questions.length+'</div>';b.querySelectorAll('.aa').forEach(z=>z.onclick=()=>{if(z.dataset.done)return;z.dataset.done='1';const ok=z.textContent.trim()===z.dataset.a;if(ok)score++;document.getElementById('af'+z.dataset.i).textContent=ok?'✅ صحيح':'❌ خطأ';document.getElementById('af'+z.dataset.i).className='feedback '+(ok?'ok':'bad');document.getElementById('sc').textContent='Score : '+score+' / '+questions.length})}function ref(){shell('11 · POST-LESSON','🎓 بعد الرحلة','مرجع الدرس السادس في نفس أسلوب صفحة ما بعد الرحلة: خلاصة، مفردات، قاعدة، أمثلة، واستعداد للمراجعة.','<div class="refBox"><h3>📌 خلاصة الدرس</h3><p>في هذا الدرس نتعلم أسماء الفوا
