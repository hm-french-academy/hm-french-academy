<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Fruits et légumes</title><style>body{margin:0;background:#f7faf3;font-family:Arial;color:#24352a}.wrap{max-width:1100px;margin:auto;padding:12px}.hero,.page,.journey{background:#fff}.hero{padding:28px;border-radius:24px;background:linear-gradient(135deg,#f6b8c1,#f9d69f,#bfe3c1)}.hero h1{font-size:42px}.journey{display:flex;gap:6px;overflow:auto;padding:12px;margin-top:10px}.step,.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.step.active,.btn{background:#24352a;color:white}.btn.light{background:#eee;color:#24352a}.page{margin-top:10px;padding:20px;border-radius:24px;min-height:600px}.cards,.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card,.quiz,.ref{border:2px solid #eee5dc;border-radius:18px;padding:15px}.visual{height:120px;display:flex;align-items:center;justify-content:center;font-size:64px;background:#fff6ed;border-radius:15px}.vcard{height:230px;perspective:800px}.vin{height:100%;position:relative;transform-style:preserve-3d;transition:.4s}.vcard.flip .vin{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border:2px solid #eee;border-radius:18px;padding:10px;text-align:center;background:white}.back{transform:rotateY(180deg);background:#e1f3e1}.choices{display:flex;flex-wrap:wrap;gap:6px}.nav{display:flex;justify-content:space-between;margin-top:18px;padding-top:12px;border-top:1px solid #ddd}.fr{direction:ltr;text-align:left}.ok{color:#4f9b52}.bad{color:#b33}</style></head><body><div class="wrap"><section class="hero"><b>Le français pour vous · 3e année · Unité 3</b><h1>Les fruits et les légumes 🍎🥕</h1><p>رحلة تفاعلية للدرس السادس: مفردات مصورة، قاعدة، محادثة، تدريب، استماع وتقييم.</p></section><nav id="j" class="journey"></nav><main id="v" class="page"></main></div><script>"use strict";var P=["🚀 البداية","🔎 افهم","🧩 المفردات","🧠 القاعدة","💬 المحادثة","🎯 التدريب","🎧 اسمع وتحدث","🎬 الوسائط","🎮 مركز الألعاب","🏆 التقييم","🎓 بعد الرحلة"],n=0,V=[["la pomme","تفاح","🍎"],["la banane","موز","🍌"],["l'orange","برتقال","🍊"],["le kiwi","كيوي","🥝"],["la carotte","جزر","🥕"],["la tomate","طماطم","🍅"],["l'oignon","بصل","🧅"],["le chou","كرنب","🥬"],["la fraise","فراولة","🍓"],["la poire","كمثرى","🍐"],["l'ananas","أناناس","🍍"],["le citron","ليمون","🍋"]],Q=[["citron",["le","la","l'"],"le"],["orange",["le","la","l'"],"l'"],["banane",["le","la","l'"],"la"],["أيها خضار؟",["poire","tomate","ananas"],"tomate"],["la carotte؟",["بصل","جزر","كرنب"],"جزر"],["Le chou-fleur خضار؟",["Vrai","Faux"],"Vrai"],["La fraise خضار؟",["Vrai","Faux"],"Faux"],["Ce sont des ___.",["fruits","légumes"],"fruits"]];function say(x){if(!speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(x);u.lang="fr-FR";u.rate=.82;speechSynthesis.speak(u)}function nav(){return '<div class="nav"><button class="btn light" id="p">← السابق</button><b>'+(n+1)+' / '+P.length+'</b><button class="btn" id="x">التالي →</button></div>'}function S(t,h,d,b){v.innerHTML='<b>'+t+'</b><h2>'+h+'</h2><p>'+d+'</p>'+b+nav();j.innerHTML=P.map(function(x,i){return '<button class="step '+(i==n?'active':'')+'" data-i="'+i+'">'+(i+1)+' · '+x+'</button>'}).join('');j.querySelectorAll('[data-i]').forEach(function(z){z.onclick=function(){G(+z.dataset.i)}});p.onclick=function(){G(n-1)};x.onclick=function(){G(n+1)};v.querySelectorAll('[data-s]').forEach(function(z){z.onclick=function(e){e.stopPropagation();say(z.dataset.s)}})}function G(x){n=Math.max(0,Math.min(10,x));R()}function start(){S('01','🚀 Bienvenue !','الهدف: أسماء الفواكه والخضروات واستعمال le / la / l\'.','<div class="cards"><div class="card"><h3>🎯 الهدف</h3><p>أتعرف إلى الكلمات من خلال الصور والنطق.</p></div><div class="card"><h3>🧭 الرحلة</h3><p>افهم → مفردات → قاعدة → محادثة → تدريب → اسمع وتحدث → ألعاب → تقييم → مرجع.</p></div></div>')}function understand(){var g=[["🍎","Fruits","la pomme · la banane · la fraise · la poire"],["🍊","Fruits variés","l'orange · le kiwi · l'ananas · le citron"],["🥕","Légumes","la carotte · la tomate · l'oignon · le chou"]];S('02','🔎 افهم','اربط الفئة بالكلمة والصورة ثم استمع.','<div class="cards">'+g.map(function(a){return '<div class="card"><div class="visual">'+a[0]+'</div><h3>'+a[1]+'</h3><p dir="ltr">'+a[2]+'</p><button class="btn" data-s="'+a[2]+'">🔊</button></div>'}).join('')+'</div>')}function vocab(){S('03','🧩 المفردات','اضغط البطاقة لقلبها ومشاهدة المعنى والنطق.','<div class="vgrid">'+V.map(function(a){return '<div class="vcard"><div class="vin"><div class="face"><div class="visual">'+a[2]+'</div><h3 dir="ltr">'+a[0]+'</h3><button class="btn" data-s="'+a[0]+'">🔊</button></div><div class="face back"><div class="visual">'+a[2]+'</div><h3>'+a[1]+'</h3><p dir="ltr">'+a[0]+'</p><button class="btn" data-s="'+a[0]+'">🔊</button></div></div></div>'}).join('')+'</div>');v.querySelectorAll('.vcard').forEach(function(z){z.onclick=function(e){if(!e.target.closest('button'))z.classList.toggle('flip')}})}function grammar(){S('04','🧠 القاعدة','le للمذكر، la للمؤنث، و l\' قبل حرف علة.','<div class="cards"><div class="card"><div class="visual">🔵</div><h3>le citron · le kiwi</h3></div><div class="card"><div class="visual">🔴</div><h3>la pomme · la carotte</h3></div><div class="card"><div class="visual">🟢</div><h3>l\'orange · l\'ananas</h3></div></div>')}function convo(){var a=[["Qu'est-ce que c'est ?","C'est une pomme."],["Et ça ?","C'est une banane."],["Tu aimes les légumes ?","Oui, j'aime la carotte !"],["Et l'orange ?","J'aime l'orange aussi !"]];S('05','💬 المحادثة','حوار مستقل داخل موقف.','<div>'+a.map(function(x){return '<div class="card"><p class="fr">'+x[0]+'</p><p class="fr">'+x[1]+'</p><button class="btn" data-s="'+x[0]+' '+x[1]+'">🔊</button></div>'}).join('')+'</div>')}function practice(){var a=[["___ pomme",["le","la","l'"],"la"],["___ orange",["le","la","l'"],"l'"],["___ kiwi",["le","la","l'"],"le"],["la carotte",["جزر","بصل","كرنب"],"جزر"],["أيها خضار؟",["ananas","tomate","poire"],"tomate"]];S('06','🎯 التدريب','تدريبات متنوعة.','<div>'+a.map(function(q,i){return '<div class="quiz"><b>'+(i+1)+'. '+q[0]+'</b><div class="choices">'+q[1].map(function(o){return '<button class="btn light pp" data-i="'+i+'" data-a="'+q[2]+'">'+o+'</button>'}).join('')+'</div><div id="f'+i+'"></div></div>'}).join('')+'</div>');v.querySelectorAll('.pp').forEach(function(b){b.onclick=function(){var ok=b.textContent.trim()==b.dataset.a,e=document.getElementById('f'+b.dataset.i);e.textContent=ok?'🎉 صحيح':'💡 حاول مرة أخرى';e.className=ok?'ok':'bad'}})}function listen(){var a=[["🍎","Qu'est-ce que c'est ?","C'est une pomme."],["🍌","Quel fruit est jaune ?","C'est une banane."],["🍊","Qu'est-ce que c'est ?","C'est une orange."],["🥝","Quel fruit est vert ?","C'est le kiwi."],["🥕","Quel légume est orange ?","C'est la carotte."],["🍅","Quel légume est rouge ?","C'est la tomate."],["🧅","Qu'est-ce que c'est ?","C'est un oignon."],["🍋","Quel fruit est jaune ?","C'est le citron."]];S('07','🎧 اسمع وتحدث','ثمانية مواقف مختلفة.','<div class="cards">'+a.map(function(x){return '<div class="card"><div class="visual">'+x[0]+'</div><p class="fr">'+x[1]+'</p><button class="btn" data-s="'+x[1]+'">🔊 السؤال</button><p class="fr">'+x[2]+'</p><button class="btn" data-s="'+x[2]+'">🎙️ تحدث</button></div>'}).join('')+'</div>')}function media(){S('08','🎬 الوسائط','استمع وراجع كلمات الدرس.','<div class="card"><h3>Les fruits et les légumes</h3><button class="btn" data-s="Les fruits et les légumes">🔊 استمع</button></div>')}function games(){S('09','🎮 مركز الألعاب','تحدي سريع قبل التقييم.','<div class="cards"><div class="card"><h3>🎯 الأداة</h3><p>le citron · la pomme · l\'orange</p><button class="btn" data-s="le citron, la pomme, orange">🔊</button></div><div class="card"><h3>🧠 الذاكرة</h3><button class="btn good" id="gt">ابدأ التقييم</button></div></div>');gt.onclick=function(){G(9)}}function assess(){S('10','🏆 التقييم','اختبار قصير من محتوى الدرس.','<div id="aq"></div>');var b=document.getElementById('aq'),score=0;b.innerHTML=Q.map(function(q,i){return '<div class="quiz"><b>'+(i+1)+'. '+q[0]+'</b><div class="choices">'+q[1].map(function(o){return '<button class="btn light aa" data-i="'+i+'" data-a="'+q[2]+'">'+o+'</button>'}).join('')+'</div><div id="af'+i+'"></div></div>'}).join('')+'<p id="sc">Score : 0 / '+Q.length+'</p>';b.querySelectorAll('.aa').forEach(function(z){z.onclick=function(){if(z.disabled)return;var ok=z.textContent.trim()==z.dataset.a;if(ok)score++;z.disabled=true;document.getElementById('af'+z.dataset.i).textContent=ok?'✅ صحيح':'❌ خطأ';document.getElementById('sc').textContent='Score : '+score+' / '+Q.length}})}function ref(){S('11','🎓 بعد الرحلة','مرجع منظم للدرس السادس.','<div class="cards"><div class="ref"><h3>🍎 Fruits</h3><p>la pomme · la banane · l\'orange · le kiwi · la fraise · la poire · l\'ananas · le citron</p></div><div class="ref"><h3>🥕 Légumes</h3><p>la carotte · la tomate · l\'oignon · le chou</p></div><div class="ref"><h3>🧠 La règle</h3><p>le = مذكر · la = مؤنث · l\' = قبل حرف علة.</p></div></div>')}function R(){[start,understand,vocab,grammar,convo,practice,listen,media,games,assess,ref][n]()}R();</script></body></html>
