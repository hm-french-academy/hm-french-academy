<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Fruits et légumes</title><style>body{margin:0;background:#fbf6f2;color:#332b24;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:1120px;margin:auto;padding:10px}.top,.journey,.bookpage{background:#fff;border-radius:20px}.top{padding:12px 16px;display:flex;justify-content:space-between}.top a{color:#332b24;text-decoration:none;font-weight:900}.book{margin-top:12px;overflow:hidden}.hero{padding:28px;background:linear-gradient(135deg,#d9cfee,#f7d5b7,#c8e7e2)}.hero h1{margin:8px 0;font-size:clamp(28px,6vw,48px)}.hero p{font-weight:800}.journey{display:flex;gap:7px;padding:10px;overflow:auto}.step{border:0;border-radius:999px;padding:9px 12px;font-weight:900;white-space:nowrap;cursor:pointer}.step.active{background:#332b24;color:#fff}.bookpage{margin-top:12px;padding:20px;min-height:560px}.pill{display:inline-block;padding:6px 10px;border-radius:99px;background:#fbe8d6;font-weight:900}.cards,.vocab{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card,.vcard,.rule,.ref{background:#fff;border:2px solid #eee3d7;border-radius:20px;padding:15px;box-shadow:0 8px 22px #332b2410}.vcard{text-align:center}.pic{height:150px;border-radius:16px;background:#eef6ef;display:flex;align-items:center;justify-content:center;font-size:72px}.btn{border:0;border-radius:12px;padding:10px 14px;background:#332b24;color:#fff;font-weight:900;cursor:pointer;margin:4px}.light{background:#f2ece5;color:#332b24}.feedback{min-height:25px;font-weight:900}.rulegrid,.refgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.rule{text-align:center}.big{font-size:38px;font-weight:900}.dialogue{display:grid;gap:10px}.line{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center;padding:12px;border:2px solid #eee3d7;border-radius:16px}.fr{direction:ltr;text-align:left;font-weight:900}.quiz{margin:12px 0;padding:15px;border:2px solid #eee3d7;border-radius:18px}.media{position:relative;padding-bottom:56.25%;height:0;background:#111;border-radius:18px;overflow:hidden}.media iframe{position:absolute;width:100%;height:100%;inset:0;border:0}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding-top:14px;border-top:1px solid #eee3d7}.score{text-align:center;font-size:28px;font-weight:900}@media(max-width:700px){.rulegrid,.refgrid{grid-template-columns:1fr}.line{grid-template-columns:1fr}.bookpage{padding:14px}}</style></head><body><main class="wrap"><header class="top"><a href="grade-3.html">← الصف الثالث</a><a href="index.html">HM Academy</a></header><section class="book"><header class="hero"><div>Le français pour vous · 3e année · Unité 3</div><h1>Les fruits et les légumes 🍎🥕</h1><p>رحلة تفاعلية للدرس السادس: مفردات مصورة، قاعدة، محادثة، تدريب، استماع وتقييم.</p></header><nav id="journey" class="journey"></nav><main id="viewer" class="bookpage"></main></section></main><script>var pages=['🚀 البداية','🔎 افهم','🧩 المفردات','🧠 القاعدة','💬 المحادثة','🎯 التدريب','🎧 اسمع وتحدث','🎬 الوسائط','🎮 مركز الألعاب','🏆 التقييم','🎓 بعد الرحلة'];var vocab=[['la pomme','تفاح','🍎'],['la banane','موز','🍌'],["l'orange",'برتقال','🍊'],['le kiwi','كيوي','🥝'],['la carotte','جزر','🥕'],['la tomate','طماطم','🍅'],["l'oignon",'بصل','🧅'],['le chou','كرنب','🥬'],['la fraise','فراولة','🍓'],['la poire','كمثرى','🍐'],["l'ananas",'أناناس','🍍'],['le citron','ليمون','🍋']];var qs=[['اختر الأداة الصحيحة: citron',['le','la',"l'"],'le'],['اختر الأداة الصحيحة: orange',['le','la',"l'"],"l'"],['اختر الأداة الصحيحة: banane',['le','la',"l'"],'la'],['أي كلمة من الخضروات؟',['poire','tomate','ananas'],'tomate'],['ما معنى la carotte؟',['بصل','جزر','كرنب'],'جزر'],['Le chou-fleur est un légume.',['Vrai','Faux'],'Vrai'],['La fraise est un légume.',['Vrai','Faux'],'Faux'],['Ce sont des fruits.',['Vrai','Faux'],'Vrai']];var page=0;var score=0;function speak(t){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;window.speechSynthesis.speak(u)}function go(n){page=Math.max(0,Math.min(pages.length-1,n));render()}function nav(){return '<div class="nav"><button class="btn light" onclick="go('+Math.max(0,page-1)+')">← السابق</button><b>'+ (page+1)+' / '+pages.length+'</b><button class="btn" onclick="go('+Math.min(pages.length-1,page+1)+')">التالي →</button></div>'}function shell(label,title,desc,body){document.getElementById('viewer').innerHTML='<span class="pill">'+label+'</span><h2>'+title+'</h2><p>'+desc+'</p>'+body+nav()}function renderJourney(){document.getElementById('journey').innerHTML=pages.map(function(x,i){return '<button class="step '+(i===page?'active':'')+'" onclick="go('+i+')">'+x+'</button>'}).join('')}function start(){shell('01 · START','🚀 Bienvenue !','هدف الرحلة: التعرف إلى الفواكه والخضروات، استعمال le / la / l\'، والتحدث بجمل قصيرة.','<div class="cards"><article class="card"><h3>🎯 أتعلم</h3><p>أتعرف إلى كل كلمة من خلال صورة مستقلة، وأسمع النطق.</p></article><article class="card"><h3>🧭 الرحلة</h3><p>افهم → مفردات → قاعدة → محادثة → تدريب → اسمع وتحدث → فيديو → ألعاب → تقييم → مرجع.</p></article></div>')}function understand(){shell('02 · UNDERSTAND','🔎 افهم','نميز بين الفواكه والخضروات ونربط الاسم بالصورة.','<div class="cards"><article class="card"><div class="pic">🍎</div><h3>Les fruits</h3><button class="btn" onclick="speak(\'la pomme, la banane, la fraise\')">🔊 استمع</button></article><article class="card"><div class="pic">🥕</div><h3>Les légumes</h3><button class="btn" onclick="speak(\'la carotte, la tomate, le chou\')">🔊 استمع</button></article><article class="card"><div class="pic">🍊</div><h3>Une famille de mots</h3><p>كل اسم نحفظه مع أداته: le أو la أو l\'.</p></article></div>')}function vocabulary(){shell('03 · VOCABULAIRE','🧩 المفردات','كل مفردة لها صورة مستقلة وبطاقة مستقلة. اضغط على النطق لسماعها.','<div class="vocab">'+vocab.map(function(x){return '<article class="vcard"><div class="pic">'+x[2]+'</div><h3>'+x[0]+'</h3><p>'+x[1]+'</p><button class="btn" onclick="speak(\''+x[0].replace(/'/g,"\\'")+'\')">🔊 النطق</button></article>'}).join('')+'</div>')}function grammar(){shell('04 · GRAMMAIRE','🧠 القاعدة: le / la / l\'','في الفرنسية نحفظ الاسم مع أداة التعريف. نستخدم le مع الاسم المذكر، la مع الاسم المؤنث، وl\' قبل حرف علة.','<div class="rulegrid"><article class="rule"><div class="big">LE</div><h3>مذكر</h3><p>le citron<br>le kiwi<br>le chou</p></article><article class="rule"><div class="big">LA</div><h3>مؤنث</h3><p>la pomme<br>la banane<br>la carotte</p></article><article class="rule"><div class="big">L\'</div><h3>قبل حرف علة</h3><p>l\'orange<br>l\'oignon<br>l\'ananas</p></article></div><div class="card"><h3>💡 كيف أتذكر؟</h3><p>لا تحفظ pomme وحدها؛ احفظ <b>la pomme</b>. ولا تحفظ orange وحدها؛ احفظ <b>l\'orange</b>.</p></div>')}function dialogue(){var lines=[['Maman','Qu\'est-ce que c\'est ?','ما هذا؟'],['Lina','C\'est une pomme.','إنها تفاحة.'],['Maman','Et ça ?','وماذا عن هذا؟'],['Lina','C\'est une carotte.','إنها جزرة.'],['Maman','Tu aimes les fruits ?','هل تحبين الفواكه؟'],['Lina','Oui, j\'aime la banane et l\'orange !','نعم، أحب الموز والبرتقال!']];shell('05 · DIALOGUE','💬 المحادثة','حوار قصير داخل المطبخ. استمع لكل جملة وتدرب على نطقها.','<div class="dialogue">'+lines.map(function(l){return '<div class="line"><b>'+l[0]+'</b><div><div class="fr">'+l[1]+'</div><small>'+l[2]+'</small></div><button class="btn" onclick="speak(\''+l[1].replace(/'/g,"\\'")+'\')">🔊</button></div>'}).join('')+'</div>')}function training(){shell('06 · TRAINING','🎯 التدريب','اختر الإجابة ثم تابع.','<div id="train"></div>');var i=0;function draw(){if(i>=qs.length){document.getElementById('train').innerHTML='<div class="score">أحسنت! النتيجة '+score+' / '+qs.length+'</div>';return}var q=qs[i];document.getElementById('train').innerHTML='<div class="quiz"><h3>'+q[0]+'</h3>'+q[1].map(function(a){return '<button class="btn light" onclick="window.answerTrain(\''+a.replace(/'/g,"\\'")+'\')">'+a+'</button>'}).join('')+'<div id="tf" class="feedback"></div></div>'}window.answerTrain=function(a){var q=qs[i];var f=document.getElementById('tf');if(a===q[2]){score++;f.textContent='✅ إجابة صحيحة';}else{f.textContent='❌ الإجابة الصحيحة: '+q[2]}i++;setTimeout(draw,500)};draw()}function listenSpeak(){var items=['la pomme','la banane','l\'orange','la carotte','le citron','la tomate','le kiwi','l\'ananas'];shell('07 · ÉCOUTE ET PARLE','🎧 اسمع وتحدث','ثمانية مواقف قصيرة؛ اسمع ثم كرر بصوتك.','<div class="cards">'+items.map(function(w,i){return '<article class="card"><span class="pill">موقف '+(i+1)+'</span><h3>'+w+'</h3><p>استمع، ثم قل الكلمة أو ضعها في جملة قصيرة.</p><button class="btn" onclick="speak(\''+w.replace(/'/g,"\\'")+'\')">🔊 اسمع</button></article>'}).join('')+'</div>')}function media(){shell('08 · MEDIA','🎬 الوسائط','شاهد فيديو الدرس الأصلي ثم عد إلى الرحلة وطبق الكلمات.','<div class="media"><iframe src="https://www.youtube.com/embed/xvkWHY39L74" title="Fruits et légumes" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><p>إذا لم يظهر الفيديو داخل التطبيق، افتحه مباشرة من YouTube باستخدام زر المشاركة في المتصفح.</p>')}function games(){shell('09 · GAMES','🎮 مركز الألعاب','اختر الأداة الصحيحة لكل كلمة.','<div class="cards">'+[['le citron',['le','la']],['la pomme',['le','la']],['l\'orange',["l'",'la']],['la carotte',['le','la']]].map(function(x){return '<article class="card"><h3>'+x[0]+'</h3>'+x[1].map(function(a){return '<button class="btn light" onclick="this.parentElement.querySelector(\'.fb\').textContent=(\''+a.replace(/'/g,"\\'")+'\'===\''+x[0].slice(0,x[0].indexOf(' ')).replace(/'/g,"\\'")+'\'?\'✅\':\'❌\')">'+a+'</button>'}).join('')+'<div class="fb feedback"></div></article>'}).join('')+'</div>')}function assessment(){shell('10 · ÉVALUATION','🏆 التقييم','اختبار قصير من محتوى الدرس.','<div id="exam"></div>');var n=0;var s=0;function draw(){if(n===qs.length){document.getElementById('exam').innerHTML='<div class="score">🏆 نتيجتك: '+s+' / '+qs.length+'</div>';return}var q=qs[n];document.getElementById('exam').innerHTML='<div class="quiz"><h3>'+q[0]+'</h3>'+q[1].map(function(a){return '<button class="btn light" onclick="window.answerExam(\''+a.replace(/'/g,"\\'")+'\')">'+a+'</button>'}).join('')+'</div>'}window.answerExam=function(a){if(a===qs[n][2])s++;n++;draw()};draw()}function reference(){shell('11 · APRÈS LE VOYAGE','🎓 بعد الرحلة','مرجع سريع منظم للمراجعة قبل مغادرة الدرس.','<div class="refgrid"><article class="ref"><h3>🍎 Fruits</h3><p>la pomme · la banane · l\'orange · le kiwi · la fraise · la poire · l\'ananas · le citron</p></article><article class="ref"><h3>🥕 Légumes</h3><p>la carotte · la tomate · l\'oignon · le chou</p></article><article class="ref"><h3>🧠 القاعدة</h3><p><b>le</b> للمذكر، <b>la</b> للمؤنث، و<b>l\'</b> قبل حرف العلة.</p></article><article class="ref"><h3>💬 جمل مفيدة</h3><p>C'est une pomme.<br>C'est une carotte.<br>J'aime la banane.</p></article><article class="ref"><h3>✅ قبل أن أغادر</h3><p>أستطيع تسمية 5 فواكه، 4 خضروات، واختيار الأداة الصحيحة.</p></article></div>')}function render(){renderJourney();if(page===0)start();else if(page===1)understand();else if(page===2)vocabulary();else if(page===3)grammar();else if(page===4)dialogue();else if(page===5)training();else if(page===6)listenSpeak();else if(page===7)media();else if(page===8)games();else if(page===9)assessment();else reference()}render();</script></body></html>
