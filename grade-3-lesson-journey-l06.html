<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Fruits et légumes</title><style>body{margin:0;background:#fbf6f2;color:#332b24;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:1120px;margin:auto;padding:12px}.top,.journey,.page{background:#fff;border-radius:20px}.top{padding:12px 16px;display:flex;justify-content:space-between}.top a{color:#332b24;text-decoration:none;font-weight:900}.hero{margin-top:12px;padding:28px;border-radius:20px;background:linear-gradient(135deg,#d9cfee,#f7d5b7,#c8e7e2)}.hero h1{margin:8px 0;font-size:clamp(28px,6vw,48px)}.hero p{font-weight:800}.journey{display:flex;gap:7px;padding:10px;margin-top:12px;overflow:auto}.step{border:0;border-radius:999px;padding:9px 12px;font-weight:900;white-space:nowrap;cursor:pointer;background:#f2ece5;color:#332b24}.step.active{background:#332b24;color:#fff}.page{margin-top:12px;padding:20px;min-height:560px}.pill{display:inline-block;padding:6px 10px;border-radius:99px;background:#fbe8d6;font-weight:900}.cards,.vocab,.rules,.refs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card,.vcard,.rule,.ref{background:#fff;border:2px solid #eee3d7;border-radius:20px;padding:15px;box-shadow:0 8px 22px #332b2410}.vcard{text-align:center}.pic{height:150px;border-radius:16px;background:#eef6ef;display:flex;align-items:center;justify-content:center;font-size:72px}.btn{border:0;border-radius:12px;padding:10px 14px;background:#332b24;color:#fff;font-weight:900;cursor:pointer;margin:4px}.light{background:#f2ece5;color:#332b24}.feedback{min-height:25px;font-weight:900}.rule{text-align:center}.big{font-size:38px;font-weight:900}.dialogue{display:grid;gap:10px}.line{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center;padding:12px;border:2px solid #eee3d7;border-radius:16px}.fr{direction:ltr;text-align:left;font-weight:900}.quiz{margin:12px 0;padding:15px;border:2px solid #eee3d7;border-radius:18px}.media{position:relative;padding-bottom:56.25%;height:0;background:#111;border-radius:18px;overflow:hidden}.media iframe{position:absolute;width:100%;height:100%;inset:0;border:0}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding-top:14px;border-top:1px solid #eee3d7}.score{text-align:center;font-size:28px;font-weight:900}@media(max-width:700px){.line{grid-template-columns:1fr}.page{padding:14px}}</style></head><body><main class="wrap"><header class="top"><a href="grade-3.html">← الصف الثالث</a><a href="index.html">HM Academy</a></header><section class="hero"><div>Le français pour vous · 3e année · Unité 3</div><h1>Les fruits et les légumes 🍎🥕</h1><p>رحلة تفاعلية للدرس السادس: مفردات مستقلة مصورة، شرح القاعدة، محادثة، تدريب، استماع، فيديو وتقييم.</p></section><nav id="journey" class="journey" aria-label="مراحل الدرس"></nav><section id="page" class="page"></section></main><script>
(function(){
'use strict';
var labels=['🚀 البداية','🔎 افهم','🧩 المفردات','🧠 القاعدة','💬 المحادثة','🎯 التدريب','🎧 اسمع وتحدث','🎬 الوسائط','🎮 مركز الألعاب','🏆 التقييم','🎓 بعد الرحلة'];
var words=[['la pomme','تفاح','🍎'],['la banane','موز','🍌'],["l'orange",'برتقال','🍊'],['le kiwi','كيوي','🥝'],['la carotte','جزر','🥕'],['la tomate','طماطم','🍅'],["l'oignon",'بصل','🧅'],['le chou','كرنب','🥬'],['la fraise','فراولة','🍓'],['la poire','كمثرى','🍐'],["l'ananas",'أناناس','🍍'],['le citron','ليمون','🍋']];
var questions=[['اختر الأداة الصحيحة: citron',['le','la',"l'"],'le'],['اختر الأداة الصحيحة: orange',['le','la',"l'"],"l'"],['اختر الأداة الصحيحة: banane',['le','la',"l'"],'la'],['أي كلمة من الخضروات؟',['poire','tomate','ananas'],'tomate'],['ما معنى la carotte؟',['بصل','جزر','كرنب'],'جزر'],['Le chou-fleur est un légume.',['Vrai','Faux'],'Vrai'],['La fraise est un légume.',['Vrai','Faux'],'Faux'],['Ce sont des fruits.',['Vrai','Faux'],'Vrai']];
var current=0, trainScore=0;
var journey=document.getElementById('journey'), page=document.getElementById('page');
function speak(text){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=.82;window.speechSynthesis.speak(u)}
function button(text,action,light){var b=document.createElement('button');b.className='btn'+(light?' light':'');b.textContent=text;b.type='button';b.addEventListener('click',action);return b}
function nav(){var n=document.createElement('div');n.className='nav';var prev=button('← السابق',function(){show(current-1)},true);var count=document.createElement('b');count.textContent=(current+1)+' / '+labels.length;var next=button('التالي →',function(){show(current+1)});prev.disabled=current===0;next.disabled=current===labels.length-1;n.append(prev,count,next);return n}
function shell(tag,title,desc){page.replaceChildren();var p=document.createElement('span');p.className='pill';p.textContent=tag;var h=document.createElement('h2');h.textContent=title;var d=document.createElement('p');d.textContent=desc;page.append(p,h,d)}
function card(title,text){var a=document.createElement('article');a.className='card';var h=document.createElement('h3');h.textContent=title;var p=document.createElement('p');p.textContent=text;a.append(h,p);return a}
function renderStart(){shell('01 · START','🚀 Bienvenue !','نتعلم أسماء الفواكه والخضروات، نحفظ الاسم مع أداته، ثم نستخدمها في جمل قصيرة.');var g=document.createElement('div');g.className='cards';g.append(card('🎯 أتعلم','أتعرف إلى كل كلمة من خلال صورة مستقلة وأسمع نطقها.'),card('🧭 الرحلة','افهم → مفردات → قاعدة → محادثة → تدريب → اسمع وتحدث → فيديو → ألعاب → تقييم → مرجع.'));page.append(g)}
function renderUnderstand(){shell('02 · UNDERSTAND','🔎 افهم','نميز بين الفواكه والخضروات ونربط الاسم بالصورة.');var g=document.createElement('div');g.className='cards';[['🍎','Les fruits','la pomme, la banane, la fraise'],['🥕','Les légumes','la carotte, la tomate, le chou'],['🍊','احفظ الاسم مع الأداة','le أو la أو l\' حسب الكلمة']].forEach(function(x){var c=card(x[1],x[2]);var pic=document.createElement('div');pic.className='pic';pic.textContent=x[0];c.prepend(pic);if(x[1]!=='احفظ الاسم مع الأداة')c.append(button('🔊 استمع',function(){speak(x[2])}));g.append(c)});page.append(g)}
function renderVocabulary(){shell('03 · VOCABULAIRE','🧩 المفردات','كل مفردة لها بطاقة وصورة مستقلة، بدون تجميع كلمات تحت صورة واحدة.');var g=document.createElement('div');g.className='vocab';words.forEach(function(w){var c=document.createElement('article');c.className='vcard';var pic=document.createElement('div');pic.className='pic';pic.textContent=w[2];var h=document.createElement('h3');h.textContent=w[0];var p=document.createElement('p');p.textContent=w[1];c.append(pic,h,p,button('🔊 النطق',function(){speak(w[0])}));g.append(c)});page.append(g)}
function renderGrammar(){shell('04 · GRAMMAIRE','🧠 القاعدة: le / la / l\'','في الفرنسية نحفظ الاسم مع أداة التعريف. le للمذكر، la للمؤنث، وl\' عندما تبدأ الكلمة بحرف علة.');var g=document.createElement('div');g.className='rules';[['LE','مذكر','le citron · le kiwi · le chou'],['LA','مؤنث','la pomme · la banane · la carotte'],["L'",'قبل حرف علة',"l'orange · l'oignon · l'ananas"]].forEach(function(x){var c=document.createElement('article');c.className='rule';c.innerHTML='<div class="big">'+x[0]+'</div><h3>'+x[1]+'</h3><p>'+x[2]+'</p>';g.append(c)});var tip=card('💡 طريقة سهلة للحفظ','لا تحفظ pomme وحدها؛ احفظ la pomme. ولا تحفظ orange وحدها؛ احفظ l\'orange.');page.append(g,tip)}
function renderDialogue(){shell('05 · DIALOGUE','💬 المحادثة','حوار قصير داخل المطبخ. استمع لكل جملة وتدرب على نطقها.');var lines=[['Maman','Qu\'est-ce que c\'est ?','ما هذا؟'],['Lina','C\'est une pomme.','إنها تفاحة.'],['Maman','Et ça ?','وماذا عن هذا؟'],['Lina','C\'est une carotte.','إنها جزرة.'],['Maman','Tu aimes les fruits ?','هل تحبين الفواكه؟'],['Lina','Oui, j\'aime la banane et l\'orange !','نعم، أحب الموز والبرتقال!']];var g=document.createElement('div');g.className='dialogue';lines.forEach(function(l){var row=document.createElement('div');row.className='line';var who=document.createElement('b');who.textContent=l[0];var text=document.createElement('div');var fr=document.createElement('div');fr.className='fr';fr.textContent=l[1];var ar=document.createElement('small');ar.textContent=l[2];text.append(fr,ar);row.append(who,text,button('🔊',function(){speak(l[1])}));g.append(row)});page.append(g)}
function renderTraining(){shell('06 · TRAINING','🎯 التدريب','أجب عن الأسئلة واحدًا تلو الآخر.');var box=document.createElement('div');page.append(box);var i=0,score=0;function draw(){box.replaceChildren();if(i===questions.length){var s=document.createElement('div');s.className='score';s.textContent='أحسنت! النتيجة '+score+' / '+questions.length;box.append(s);return}var q=questions[i],qbox=document.createElement('div');qbox.className='quiz';var h=document.createElement('h3');h.textContent=q[0];qbox.append(h);q[1].forEach(function(a){qbox.append(button(a,function(){if(a===q[2])score++;i++;draw()},true))});box.append(qbox)}draw()}
function renderListen(){shell('07 · ÉCOUTE ET PARLE','🎧 اسمع وتحدث','ثمانية مواقف قصيرة. استمع ثم كرر الكلمة أو استخدمها في جملة.');var g=document.createElement('div');g.className='cards';words.slice(0,8).forEach(function(w,i){var c=card('موقف '+(i+1),w[0]);c.append(button('🔊 اسمع',function(){speak(w[0])}));g.append(c)});page.append(g)}
function renderMedia(){shell('08 · MEDIA','🎬 الوسائط','شاهد فيديو الدرس الأصلي داخل الصفحة.');var wrap=document.createElement('div');wrap.className='media';var iframe=document.createElement('iframe');iframe.src='https://www.youtube.com/embed/xvkWHY39L74';iframe.title='Fruits et légumes';iframe.loading='lazy';iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';iframe.allowFullscreen=true;wrap.append(iframe);page.append(wrap)}
function renderGames(){shell('09 · GAMES','🎮 مركز الألعاب','اختر الأداة الصحيحة.');var g=document.createElement('div');g.className='cards';[['le citron','le'],['la pomme','la'],["l'orange","l'"],['la carotte','la']].forEach(function(x){var c=card(x[0],'اختر الأداة المناسبة');['le','la',"l'"].forEach(function(a){c.append(button(a,function(){c.querySelector('.feedback').textContent=a===x[1]?'✅ صحيح':'❌ حاول مرة أخرى'},true))});var f=document.createElement('div');f.className='feedback';c.append(f);g.append(c)});page.append(g)}
function renderAssessment(){shell('10 · ÉVALUATION','🏆 التقييم','تقييم قصير مبني على مفردات وقاعدة الدرس.');var box=document.createElement('div');page.append(box);var i=0,s=0;function draw(){box.replaceChildren();if(i===questions.length){var end=document.createElement('div');end.className='score';end.textContent='🏆 نتيجتك: '+s+' / '+questions.length;box.append(end);return}var q=questions[i],qb=document.createElement('div');qb.className='quiz';var h=document.createElement('h3');h.textContent=q[0];qb.append(h);q[1].forEach(function(a){qb.append(button(a,function(){if(a===q[2])s++;i++;draw()},true))});box.append(qb)}draw()}
function renderReference(){shell('11 · APRÈS LE VOYAGE','🎓 بعد الرحلة','مرجع منظم للمراجعة النهائية، بنفس أسلوب صفحة ما بعد الرحلة.');var g=document.createElement('div');g.className='refs';g.append(card('🍎 Fruits','la pomme · la banane · l\'orange · le kiwi · la fraise · la poire · l\'ananas · le citron'),card('🥕 Légumes','la carotte · la tomate · l\'oignon · le chou'),card('🧠 القاعدة','le للمذكر · la للمؤنث · l\' قبل حرف العلة'),card('💬 جمل مفيدة','C\'est une pomme. · C\'est une carotte. · J\'aime la banane.'),card('✅ قبل أن أغادر','أستطيع تسمية 5 فواكه و4 خضروات واختيار الأداة الصحيحة.'));page.append(g)}
function show(n){current=Math.max(0,Math.min(labels.length-1,n));journey.querySelectorAll('.step').forEach(function(b,i){b.classList.toggle('active',i===current)});switch(current){case 0:renderStart();break;case 1:renderUnderstand();break;case 2:renderVocabulary();break;case 3:renderGrammar();break;case 4:renderDialogue();break;case 5:renderTraining();break;case 6:renderListen();break;case 7:renderMedia();break;case 8:renderGames();break;case 9:renderAssessment();break;default:renderReference()}var navi=nav();page.append(navi);window.scrollTo({top:0,behavior:'smooth'})}
labels.forEach(function(label,i){var b=document.createElement('button');b.className='step';b.type='button';b.textContent=label;b.addEventListener('click',function(){show(i)});journey.append(b)});show(0);
})();
</script></body></html>
