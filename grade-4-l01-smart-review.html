<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache"><title>HM Academy | المراجعة الذكية — الدرس الأول</title><link rel="stylesheet" href="css/premium-shell.css?v=20260824-g4l01review1"><style>body{background:#f5f7fb}.wrap{max-width:900px;margin:auto;padding:28px 16px}.hero,.card{background:#fff;border:1px solid #e1e7f0;border-radius:24px;padding:22px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#173a82,#2563eb);color:#fff}.mode{display:inline-block;padding:8px 11px;border-radius:10px;background:#edf3ff;color:#315aa4;font-weight:900}.options{display:grid;gap:10px}.option{border:1px solid #dce3ee;background:#fff;border-radius:14px;padding:13px;text-align:right;cursor:pointer;font-weight:800}.result{font-weight:900;margin-top:12px;min-height:24px}.bar{height:10px;background:#e8edf5;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:#2563eb;width:0}.btn{display:inline-block;border:0;background:#2563eb;color:#fff;border-radius:12px;padding:11px 15px;font-weight:900;text-decoration:none;margin:5px}</style></head><body><header class="hm-header"><a class="hm-brand" href="grade-4.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">الصف الرابع</small></span></a><nav class="hm-nav"><a href="grade-4.html">الصف الرابع</a><a href="grade-4-l01-learning-studio.html?id=g4-l01">الدرس الأول</a></nav></header><main class="wrap"><section class="hero"><h1>🧠 المراجعة الذكية</h1><p>الدرس الأول · <b>Les saisons</b></p><p>مراجعة مبنية على محتوى الصف الرابع للدرس الأول فقط، وليست اختبارًا رسميًا.</p></section><section class="card" id="app"></section></main><script>(function(){const questions=[{q:'Nous sommes en Juillet. Quelle saison ?',o:['Le printemps','L’été','L’automne','L’hiver'],a:'L’été'},{q:'Il fait froid et la neige tombe. Quelle saison ?',o:['Le printemps','L’été','L’automne','L’hiver'],a:'L’hiver'},{q:'Les feuilles sont jaunes et tombent. Quelle saison ?',o:['Le printemps','L’été','L’automne','L’hiver'],a:'L’automne'},{q:'Il y a des fleurs. Nous sommes…',o:['au printemps','en été','en automne','en hiver'],a:'au printemps'},{q:'Quel mois appartient à l’été ?',o:['Juillet','Janvier','Mars','Octobre'],a:'Juillet'},{q:'Quel mois appartient à l’automne ?',o:['Octobre','Juin','Février','Avril'],a:'Octobre'},{q:'Quel mois appartient au printemps ?',o:['Avril','Août','Décembre','Novembre'],a:'Avril'},{q:'En hiver, il fait…',o:['froid','chaud','beau','mauvais'],a:'froid'},{q:'On dit…',o:['en été','au été','en printemps','au automne'],a:'en été'},{q:'On dit…',o:['au printemps','en printemps','au été','en automne'],a:'au printemps'}];let i=0,score=0;const app=document.getElementById('app');function clean(s){return String(s).replace(/[<>]/g,'')}function render(){if(i>=questions.length){app.innerHTML='<h2>🎉 انتهت المراجعة</h2><p>نتيجتك: <b>'+score+' / '+questions.length+'</b></p><p>المراجعة خاصة بالدرس الأول من الصف الرابع فقط.</p><a class="btn" href="grade-4-l01-learning-studio.html?id=g4-l01">العودة إلى الدرس</a><a class="btn" href="grade-4.html">العودة إلى الصف الرابع</a>';return}const x=questions[i];app.innerHTML='<div class="mode">الدرس 01 · Les saisons</div><h2>'+clean(x.q)+'</h2><div class="bar"><i style="width:'+((i/questions.length)*100)+'%"></i></div><p>السؤال '+(i+1)+' من '+questions.length+'</p><div class="options">'+x.o.map(o=>'<button class="option" data-v="'+clean(o).replace(/"/g,'&quot;')+'">'+clean(o)+'</button>').join('')+'</div><div class="result" id="r"></div>';document.querySelectorAll('.option').forEach(b=>b.onclick=function(){document.querySelectorAll('.option').forEach(x=>x.disabled=true);const ok=this.dataset.v===x.a;if(ok)score++;document.getElementById('r').textContent=ok?'✅ إجابة صحيحة':'❌ الإجابة الصحيحة: '+x.a;setTimeout(function(){i++;render()},650)})}render()})()</script></body></html>
