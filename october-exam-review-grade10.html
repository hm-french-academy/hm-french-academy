<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مراجعة أكتوبر — الصف الأول الثانوي</title><link rel="stylesheet" href="css/premium-shell.css"><style>main{max-width:900px;margin:auto;padding:20px}.box{background:white;padding:20px;border:1px solid #ddd;border-radius:16px;margin:12px 0}.hero{background:#14264a;color:white;padding:22px;border-radius:18px}.q{direction:ltr;text-align:left;padding:12px;border-bottom:1px solid #ddd}.ok{background:#dcfce7}.bad{background:#fee2e2}button{padding:10px 16px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:bold}</style></head><body><main><div class="hero"><h1>مراجعة مقرر شهر أكتوبر</h1><p>اللغة الفرنسية — الصف الأول الثانوي</p><p>نموذجان تدريبيان تفاعليان، كل نموذج من 30 درجة.</p></div><section class="box"><h2>كويزات بنك أسئلة حسب المواصفات الجديدة</h2><p>بنك أسئلة تفاعلي للصف الأول الثانوي وفق المواصفات الجديدة، مع تصحيح فوري للإجابات.</p><a href="bravo-bank-questions-grade10.html" style="display:inline-block;padding:10px 16px;border-radius:10px;background:#2563eb;color:#fff;font-weight:bold;text-decoration:none">افتح كويزات بنك الأسئلة</a></section><div><button onclick="show(0)">الامتحان الأول</button> <button onclick="show(1)">الامتحان الثاني</button></div><div id="content"></div></main><script>
const data=[
{t:"Bonjour ! Je m'appelle Lina. J'ai 15 ans et je suis élève au lycée. J'habite à Alexandrie. Ma meilleure amie s'appelle Salma. Elle est sympa et sociable. Nous aimons la musique et le français.",q:[["Lina a … ans.",["quatorze","quinze","seize"],1],["Lina habite …",["au Caire","à Paris","à Alexandrie"],2],["Salma est …",["sympa","timide","méchante"],0],["Lina et Salma aiment …",["le tennis","la musique","les maths"],1],["Tu salues ton professeur le matin.",["Bonsoir !","Bonjour, monsieur !","Au revoir !"],1],["Tu demandes le nom.",["Comment tu t'appelles ?","Quel âge as-tu ?","Où habites-tu ?"],0],["Tu demandes l'âge.",["Tu habites où ?","Quel âge as-tu ?","Tu aimes quoi ?"],1],["Je … quinze ans.",["ai","as","a"],0],["Elle … sympa.",["suis","est","sont"],1],["Nous … élèves.",["êtes","sommes","sont"],1],["Tu … le français.",["aime","aimes","aiment"],1],["Ils … au lycée.",["est","sommes","sont"],2],["C'est … amie.",["un","une","des"],1],["… m'appelle Karim.",["Je","Tu","Il"],0],["Voici mon …",["amie","copain","copines"],1]]},
{t:"Salut ! Moi, c'est Adam. J'ai 16 ans. Je suis élève au lycée « La Paix ». J'ai un copain, Youssef. Il est drôle mais un peu bavard. Nous aimons le sport. Ma couleur préférée est le bleu.",q:[["Adam a … ans.",["quinze","seize","dix-sept"],1],["Le lycée s'appelle …",["La Paix","Victor","Alex"],0],["Youssef est …",["timide","drôle","méchant"],1],["Adam préfère la couleur …",["rouge","vert","bleu"],2],["Tu prends congé.",["Au revoir !","Bonjour !","Merci !"],0],["Tu demandes comment ça va.",["Ça va ?","Quel âge as-tu ?","Qui est-ce ?"],0],["Tu présentes un camarade.",["Voici mon copain.","J'ai seize ans.","J'habite ici."],0],["Tu demandes la couleur préférée.",["Quel âge as-tu ?","Quelle est ta couleur préférée ?","Comment tu t'appelles ?"],1],["Il … seize ans.",["ai","as","a"],2],["Je … élève.",["suis","es","est"],0],["Vous … sympathiques.",["sommes","êtes","sont"],1],["Elle … le tennis.",["aime","aimes","aimons"],0],["Tu … un copain.",["ai","as","a"],1],["… est mon ami.",["Elle","Il","Elles"],1],["C'est … lycée.",["une","un","des"],1]]}
];
function show(k){const d=data[k];document.getElementById('content').innerHTML='<section class="box"><h2>الامتحان '+(k+1)+' — 30 درجة</h2><p class="q">'+d.t+'</p>'+d.q.map((q,i)=>'<div class="q"><b>'+(i+1)+'. '+q[0]+'</b>'+q[1].map((o,j)=>'<label style="display:block;padding:6px"><input type="radio" name="q'+i+'" value="'+j+'"> '+o+'</label>').join('')+'</div>').join('')+'<div class="q"><b>Expression écrite</b><p>Présente-toi et parle de ton ami(e) en 3 ou 4 phrases.</p><textarea style="width:100%;min-height:90px;direction:ltr"></textarea></div><button onclick="grade('+k+')">تصحيح الإجابات</button><div id="result"></div></section>'}
const keys=[[1,2,0,1,1,0,1,0,1,1,1,2,1,0,1],[1,0,1,2,0,0,0,1,2,0,1,0,1,1,1]];
function grade(k){let s=0;data[k].q.forEach((q,i)=>{let chosen=document.querySelector('input[name="q'+i+'"]:checked');document.querySelectorAll('input[name="q'+i+'"]').forEach((x,j)=>{x.parentElement.classList.remove('ok','bad');if(j===keys[k][i])x.parentElement.classList.add('ok')});if(chosen){if(+chosen.value===keys[k][i])s++}});document.getElementById('result').innerHTML='<h3>النتيجة: '+(s*2)+' / 30</h3><p>الأخضر يوضح الإجابة الصحيحة. راجع التعبير الكتابي مع معلمك.</p>'}
show(0);</script></main></body></html>
