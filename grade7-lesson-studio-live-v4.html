<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a56"><title>HM Academy | الصف الأول الإعدادي</title><style>:root{--n:#102a56;--b:#2563eb;--t:#0f9f91;--ink:#14213d;--muted:#667085;--line:#e1e7f0;--ok:#087443;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef4ff,#fff);color:var(--ink);font-family:Arial,"Noto Sans Arabic",sans-serif;line-height:1.7}.wrap{max-width:1180px;margin:auto;padding:10px}.hero{background:linear-gradient(135deg,#102a56,#2455a6,#0f9f91);color:#fff;border-radius:24px;padding:22px;box-shadow:0 15px 40px #102a5620}.hero h1{margin:6px 0;font-size:clamp(24px,4vw,40px)}.fr{direction:ltr;text-align:right;font-weight:900}.bar{display:flex;gap:7px;overflow:auto;background:#fff;padding:10px;border:1px solid var(--line);border-radius:18px;margin-top:12px}.bar a{white-space:nowrap;text-decoration:none;background:#eef3fb;color:var(--n);padding:8px 12px;border-radius:999px;font-weight:800}.bar a.on{background:var(--b);color:#fff}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:18px}.panel{padding:16px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}.card{padding:14px}.visual{font-size:42px;text-align:center}.ar{text-align:center;color:#315aa4;font-weight:800}.note{padding:12px;border-radius:12px;background:#f8fafc;border-right:4px solid #94a3b8;margin:10px 0}.source{background:#eefbf8;border-right-color:var(--t)}button,.cta{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer;background:var(--b);color:#fff}.cta{display:inline-block;text-decoration:none;margin:4px}.secondary{background:#eef3fb;color:var(--n)}.options{display:grid;gap:7px;margin-top:8px}.options button{text-align:right;background:#fff;color:var(--ink);border:1px solid var(--line)}.options button:disabled{cursor:default;opacity:.72}.feedback{min-height:26px;margin-top:7px}.ok{color:var(--ok);font-weight:900}.bad{color:var(--bad);font-weight:900}.score{font-size:22px;font-weight:900}.progress{height:10px;background:#e8edf5;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--t))}.muted{color:var(--muted)}.video{position:relative;width:100%;padding-top:56.25%;overflow:hidden;border-radius:16px;background:#111}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}@media(max-width:650px){.wrap{padding:7px}.panel{padding:12px}.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="hero"><b>🇫🇷 HM Academy · الصف الأول الإعدادي</b><h1 id="title">جاري التحميل…</h1><div id="fr" class="fr"></div><p id="goal"></p></header><nav class="bar" id="nav"></nav><main class="panel" id="app">جاري تجهيز الدرس…</main><footer class="footer">HM Academy · تعلّم الفرنسية بطريقة أبسط وأذكى.</footer></div><script>
const p=new URLSearchParams(location.search),id=p.get('id')||'grade7-u1-l2',sec=p.get('section')||'introduction';
const paths={'grade7-u1-l2':'unit-1/lesson-2.json','grade7-u1-l3':'unit-1/lesson-3.json','grade7-u1-l4':'unit-1/lesson-4.json','grade7-u1-l5':'unit-1/lesson-5.json','grade7-u1-l6':'unit-1/lesson-6.json','grade7-u2-l1':'unit-2/lesson-1.json','grade7-u2-l2':'unit-2/lesson-2.json','grade7-u3-l1':'unit-3/lesson-1.json','grade7-u3-l2':'unit-3/lesson-2.json','grade7-u3-l3':'unit-3/lesson-3.json'};
const titles={'grade7-u1-l2':'التحيات','grade7-u1-l3':'ضمائر الفاعل وأفعال المجموعة الأولى','grade7-u1-l4':'فعل être والتقديم','grade7-u1-l5':'الأعداد 0–20','grade7-u1-l6':'الساعة','grade7-u2-l1':'كم عمرك؟','grade7-u2-l2':'ما هذا؟ أدوات الفصل','grade7-u3-l1':'الألوان','grade7-u3-l2':'أدوات المعرفة وأيام الأسبوع','grade7-u3-l3':'شهور السنة والفصول'};
const stages=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];
let D={};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const shuffle=a=>[...a].sort(()=>Math.random()-.5);function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}
function nav(){document.getElementById('nav').innerHTML=stages.map(x=>`<a class="${x[0]===sec?'on':''}" href="?id=${encodeURIComponent(id)}&section=${x[0]}">${x[1]}</a>`).join('')}
function vals(){const v=D.journeyContent?.vocabulary?.items;return Array.isArray(v)?v.filter(x=>Array.isArray(x)&&x[0]&&x[1]):[]}
function introduction(){const j=D.journeyContent?.introduction||{};return `<h2>🚀 البداية</h2><div class="note source"><b>هدف الدرس</b><br>${esc(j.goal||'اكتشف الدرس خطوة بخطوة.')}</div><p>ابدأ بالملاحظة، ثم استمع، طبّق، واختبر فهمك. المحتوى مرتبط بالمصدر المعتمد لهذا الدرس.</p><a class="cta" href="?id=${encodeURIComponent(id)}&section=vocabulary">ابدأ الاكتشاف ←</a>`}
function vocabulary(){const v=vals();return `<h2>🖼️ المفردات</h2><p class="note source">المفردات هنا مأخوذة من بيانات الدرس المصدرية، مع نطق فرنسي مباشر.</p><div class="grid">${v.map(x=>`<article class="card"><b dir="ltr">${esc(x[0])}</b><p class="ar">${esc(x[1])}</p>${x[2]?`<p dir="ltr">${esc(x[2])}</p>`:''}<button onclick='speak(${JSON.stringify(x[0])})'>🔊 استمع</button></article>`).join('')}</div>`}
function pronunciation(){const a=Array.isArray(D.journeyContent?.pronunciation?.items)?D.journeyContent.pronunciation.items:[];return `<h2>🎧 النطق</h2><p class="note">استمع إلى كل عنصر ثم كرره بصوت مرتفع.</p><div class="grid">${a.map(x=>`<article class="card"><b dir="ltr">${esc(x)}</b><br><button onclick='speak(${JSON.stringify(x)})'>🔊 استمع</button></article>`).join('')}</div>`}
function grammar(){const j=D.journeyContent?.grammar||{};return `<h2>📘 القواعد</h2>${j.notes?.map((x,i)=>`<article class="card" style="margin:8px 0"><b>${i+1}</b> — ${esc(x)}</article>`).join('')||'<p class="note">راجع القاعدة من أمثلة المصدر.</p>'}`}
function conversation(){const a=Array.isArray(D.journeyContent?.conversation?.sourcePreserved)?D.journeyContent.conversation.sourcePreserved:[];return `<h2>💬 المحادثة</h2><p class="note source">الحوار الأصلي محفوظ ومميز عن أي إثراء إضافي.</p>${a.map((x,i)=>`<article class="card" style="margin:8px 0"><b>${i+1}</b><p dir="ltr">${esc(x)}</p><button onclick='speak(${JSON.stringify(x)})'>🔊 استمع</button></article>`).join('')||'<p class="note">لا يوجد حوار نصي منظم في البيانات.</p>'}`}
function sourceQuiz(){const a=D.sourceData?.quizData;return Array.isArray(a)?a.filter(x=>Array.isArray(x)&&x.length>=3).map(x=>({q:x[0],o:x[1],a:x[2]})):[]}
function assessmentItems(){const a=D.assessment?.items;return Array.isArray(a)?a.filter(x=>Array.isArray(x)&&x.length>=3).map(x=>({q:x[0],o:x[1],a:x[2]})):[]}
let quizSeq=0;function quiz(qs,label){const key='q'+(++quizSeq);window.__Q=window.__Q||{};window.__Q[key]={correct:0,answered:0,total:qs.length};return `<div id="score-${key}" class="score">0 / ${qs.length}</div><div class="grid">${qs.map((q,i)=>{const opts=shuffle(q.o);return `<article class="card"><b>${i+1}. ${esc(q.q)}</b><div class="options">${opts.map(o=>`<button data-qi="${i}" onclick='answer(${JSON.stringify(key)},${i},${JSON.stringify(o)},${JSON.stringify(q.a)},this)'>${esc(o)}</button>`).join('')}</div><div class="feedback" id="f-${key}-${i}"></div></article>`}).join('')}</div>`}
function answer(k,i,v,c,b){const s=window.__Q?.[k];if(!s||b.disabled)return;document.querySelectorAll(`[data-qi="${i}"]`).forEach(x=>x.disabled=true);const f=document.getElementById(`f-${k}-${i}`);s.answered++;if(v===c){s.correct++;f.innerHTML='<span class="ok">✅ صحيح — أحسنت!</span>'}else f.innerHTML=`<span class="bad">❌ غير صحيح.</span><br><span class="muted">الإجابة الصحيحة: ${esc(c)}</span>`;document.getElementById('score-'+k).textContent=`${s.correct} / ${s.total}`}
function practice(){let qs=sourceQuiz();if(qs.length>6)qs=qs.slice(0,6);return `<h2>✍️ التدريب التفاعلي</h2><p class="note source">6 أسئلة مرتبطة مباشرة بالأنشطة الأصلية للدرس، مع تصحيح فوري.</p>${qs.length?quiz(qs,'practice'):'<p class="note">لا توجد أسئلة منظمة للتدريب.</p>'}`}
function assessment(){let qs=assessmentItems();if(qs.length>20)qs=qs.slice(0,20);return `<h2>🏆 التقييم</h2><p class="note source">20 عنصرًا من بنك التقييم المصدر لهذا الدرس، مع تصحيح فوري لكل إجابة.</p>${qs.length===20?quiz(qs,'assessment'):`<p class="note">تعذر تجهيز التقييم الكامل لهذا الدرس (${qs.length}/20).</p>`}`}
function games(){const g=Array.isArray(D.journeyContent?.games)?D.journeyContent.games:[];return `<h2>🎮 الألعاب</h2><div class="grid">${g.map((x,i)=>`<article class="card"><div class="visual">🎮</div><b>${i+1}. ${esc(x)}</b><p class="muted">نشاط لعب مرتبط مباشرة بهدف الدرس.</p></article>`).join('')||'<p class="note">لا توجد ألعاب منظمة في بيانات الدرس.</p>'}</div>`}
function video(){const vid=D.sourceVideoId;return `<h2>🎬 الفيديو</h2>${vid?`<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(vid)}?rel=0" title="فيديو الدرس الأصلي" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div><p class="note source">فيديو المصدر الأصلي للدرس.</p>`:'<p class="note">لا يوجد فيديو مصدر محفوظ لهذا الدرس.</p>'}`}
function progress(){const k='hm_g7_'+id+'_progress',v=Number(localStorage.getItem(k)||0);return `<h2>📈 التقدم</h2><div class="card"><b>تقدم هذا الدرس</b><div class="progress" style="margin:12px 0"><i style="width:${Math.min(100,v)}%"></i></div><p>${Math.min(100,v)}%</p><button onclick='localStorage.setItem(${JSON.stringify(k)},"100");location.reload()'>تسجيل إتمام الدرس</button></div>`}
function render(){const map={introduction,vocabulary,pronunciation,grammar,conversation,practice,video,games,assessment,progress};document.getElementById('app').innerHTML=(map[sec]||introduction)();nav()}
async function load(){try{if(!paths[id])throw 0;let r=await fetch(`data/lessons/grade-7/${paths[id]}?v=20260908-v4`,{cache:'no-store'});if(!r.ok)throw 0;let x=await r.json();for(let i=0;i<8&&typeof x.content==='string';i++)x=JSON.parse(x.content);D=x;document.getElementById('title').textContent=D.titleAr||titles[id]||id;document.getElementById('fr').textContent=D.titleFr||'';document.getElementById('goal').textContent=D.journeyContent?.introduction?.goal||'';render()}catch(e){document.getElementById('app').innerHTML='<div class="note"><b>تعذر فتح محتوى الدرس.</b><br>أعد المحاولة بعد لحظات.</div>'}}load();
</script></body></html>
