<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>HM Academy | Grade 9 Learning Studio</title><link rel="stylesheet" href="css/premium-shell.css?v=20260828-grade9-fix"></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a></header><main style="max-width:1120px;margin:auto;padding:18px"><section class="hero" style="background:#fff;border:1px solid #e3e9f3;border-radius:28px;padding:24px"><div style="font-weight:900;color:#2563eb">3ème année du collège · Premium Learning Studio</div><h1 id="title">الصف الثالث الإعدادي</h1><div id="meta" style="color:#64748b;font-weight:800"></div><div style="height:10px;background:#edf1f7;border-radius:99px;overflow:hidden;margin-top:10px"><i id="bar" style="display:block;height:100%;background:#2563eb;width:0"></i></div><div id="journey" style="display:flex;gap:7px;overflow:auto;margin-top:18px"></div></section><section id="panel" style="background:#fff;border:1px solid #e3e9f3;border-radius:28px;padding:22px;margin-top:16px"></section></main><script>const steps=[['start','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['evaluation','🏆 التقييم'],['progress','📈 التقدم']];const fallback={'g9-u1-l1':{id:'g9-u1-l1',unit:'Le sport',titleFr:'Les sports',titleAr:'الرياضات',sourcePages:'16-20',journey:{vocabulary:[{fr:'le football',ar:'كرة القدم'},{fr:'le ping-pong',ar:'تنس الطاولة'},{fr:'le karaté',ar:'الكاراتيه'},{fr:'le cyclisme / le vélo',ar:'ركوب الدراجات'},{fr:'la boxe',ar:'الملاكمة'},{fr:'la natation',ar:'السباحة'},{fr:'le tennis',ar:'التنس'},{fr:'le basket-ball',ar:'كرة السلة'},{fr:'le volley-ball',ar:'الكرة الطائرة'},{fr:"l'équitation",ar:'الفروسية'},{fr:"l'escrime",ar:'المبارزة'},{fr:'le ski',ar:'التزلج'},{fr:'le judo',ar:'الجودو'},{fr:'le rugby',ar:'الرجبي'},{fr:'la pêche',ar:'صيد السمك'},{fr:'la voile',ar:'الإبحار'},{fr:'la gymnastique',ar:'الجمباز'},{fr:'les échecs',ar:'الشطرنج'},{fr:'la marche',ar:'المشي'},{fr:'la randonnée',ar:'التنزه'}],grammar:["Faire du / de la / de l'","Pratiquer + le / la / l' / les"],conversation:["Qu'est-ce que tu portes pour jouer ... ?","Où pratiques-tu ton sport préféré ?"],practice:['Classer les sports selon le genre','Compléter des phrases avec le sport convenable'],pronunciation:["Répéter chaque sport avec son article","Distinguer les articles le, la, l' et les à l'oral","Répéter les questions Qu'est-ce que tu pratiques ? et Où pratiques-tu ton sport préféré ?","Lire à voix haute les noms de sports puis les utiliser dans une phrase"],visual:['Associer chaque sport à une illustration واضحة','Classer visuellement les sports individuels et collectifs','Identifier les sports selon les équipements et lieux représentés','Associer une image de situation à la phrase française correspondante']},assessment:['Nommer des sports à partir d’images','Choisir le sport adapté à une situation','Prononcer correctement les noms de sports','Associer une représentation visuelle à l’expression française correcte']}};const q=new URLSearchParams(location.search),id=q.get('id')||'g9-u1-l1';let d,idx=Math.max(0,steps.findIndex(x=>x[0]===(q.get('section')||'start')));const panel=document.getElementById('panel'),nav=document.getElementById('journey'),bar=document.getElementById('bar');const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const speak=t=>{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.85;speechSynthesis.speak(u)};const arr=x=>Array.isArray(x)?x:[];const btn='border:0;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer;background:#eef4ff;color:#2457bb';function list(title,a,voice=false){if(!a?.length)return '<p>لا توجد بيانات لهذه المرحلة.</p>';return '<div style="border:1px solid #e3e9f3;border-radius:20px;padding:16px"><h3>'+esc(title)+'</h3>'+a.map(x=>{if(typeof x==='string')return '<div style="padding:11px 0;border-bottom:1px solid #edf1f7">'+esc(x)+(voice?' <button style="'+btn+'" onclick="speak('+JSON.stringify(x)+')">🔊</button>':'')+'</div>';const fr=x.fr||x.word||'';return '<div style="padding:11px 0;border-bottom:1px solid #edf1f7;direction:ltr;text-align:left"><b>'+esc(fr)+'</b> <span style="direction:rtl;color:#64748b">'+esc(x.ar||'')+'</span>'+(voice?' <button style="'+btn+'" onclick="speak('+JSON.stringify(fr)+')">🔊</button>':'')+'</div>'}).join('')+'</div>'}function quiz(items,title){if(!items?.length)return '<p>لا توجد عناصر لهذه المرحلة.</p>';return '<div><h2>'+esc(title)+'</h2>'+items.slice(0,8).map((x,i)=>{const t=typeof x==='string'?x:(x.fr||x.word||'');return '<div style="border:1px solid #e3e9f3;border-radius:20px;padding:16px;margin:10px 0"><b>'+(i+1)+'. '+esc(t)+'</b><br><button style="'+btn+'" onclick="this.textContent=\'✓ أتقنتها\'">✓ أتقنتها</button> <button style="'+btn+'" onclick="this.textContent=\'↻ أراجعها\'">↻ أحتاج مراجعة</button></div>'}).join('')+'</div>'}function render(){nav.innerHTML=steps.map((s,i)=>'<button style="'+btn+';white-space:nowrap;margin:3px;background:'+(i===idx?'#2563eb':'#eef4ff')+';color:'+(i===idx?'#fff':'#2457bb')+'" onclick="idx='+i+';render()">'+s[1]+'</button>').join('');bar.style.width=(idx/(steps.length-1)*100)+'%';const k=steps[idx][0],j=d.journey||{};let b='';if(k==='start')b='<h2>'+esc(d.titleFr)+'</h2><p>'+esc(d.titleAr)+'</p><p>📚 الصفحات: '+esc(d.sourcePages)+'</p>';else if(k==='vocabulary')b='<div style="display:grid;gap:14px">'+list('🖼️ مفردات الدرس',j.vocabulary,true)+list('👁️ التعلم البصري',j.visual)+'</div>';else if(k==='pronunciation')b=list('🎧 النطق',j.pronunciation||j.vocabulary,true);else if(k==='grammar')b=list('📘 القواعد',j.grammar,true);else if(k==='conversation')b='<h2>💬 المحادثة</h2>'+arr(j.conversation).map(x=>'<p style="padding:13px;background:#fff7fb;border-radius:12px;direction:ltr">'+esc(x)+'<br><button style="'+btn+'" onclick="speak('+JSON.stringify(x)+')">🔊 استمع</button></p>').join('');else if(k==='practice')b=quiz(j.practice,'✍️ التدريب التفاعلي');else if(k==='video')b='<h2>🎬 الفيديو</h2><p>سيتم ربط أصل الفيديو عند توفره.</p>';else if(k==='games')b=quiz(j.practice,'🎮 الألعاب');else if(k==='smart-review')b=quiz([...(j.vocabulary||[]),...(j.grammar||[])],'🧠 المراجعة الذكية');else if(k==='evaluation')b=quiz(d.assessment||j.evaluation,'🏆 التقييم');else b='<h2>📈 التقدم</h2><p>أكملت الوصول إلى مرحلة '+esc(steps[idx][1])+'</p>';panel.innerHTML=b+'<div style="margin-top:20px">'+(idx?'<button style="'+btn+'" onclick="idx--;render()">السابق</button> ':'')+(idx<steps.length-1?'<button style="'+btn+';background:#2563eb;color:#fff" onclick="idx++;render()">التالي</button>':'')+'</div>'}async function load(){if(fallback[id]){d=fallback[id];document.getElementById('title').textContent=d.titleAr;document.getElementById('meta').textContent=d.unit+' · الصفحات '+d.sourcePages;render();return}const u='data/lessons/grade-9/semester-1/'+encodeURIComponent(id)+'.json?v=20260828-final';try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);d=JSON.parse(await r.text());document.getElementById('title').textContent=d.titleAr||d.titleFr;document.getElementById('meta').textContent=(d.unit||'')+' · الصفحات '+(d.sourcePages||'');render()}catch(e){panel.innerHTML='<h2>تعذر تحميل محتوى الدرس</h2><p>معرّف الدرس: '+esc(id)+'</p><p>الخطأ: '+esc(e.message)+'</p>'}}load();</script></body></html>
