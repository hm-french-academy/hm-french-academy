<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>HM Academy | Grade 9 Learning Studio</title><link rel="stylesheet" href="css/premium-shell.css?v=20260828-grade9"><style>main{max-width:1120px;margin:auto;padding:18px}.hero,.panel{background:#fff;border:1px solid #e3e9f3;border-radius:28px;box-shadow:0 18px 50px #14264a12}.hero{padding:24px}.eyebrow{font-weight:900;color:#2563eb}.hero h1{margin:8px 0}.meta{color:#64748b;font-weight:800}.journey{display:flex;gap:7px;overflow:auto;margin-top:18px;padding-bottom:3px}.step{border:1px solid #dfe6f2;background:#f8faff;color:#2457bb;border-radius:999px;padding:10px 14px;font-weight:900;white-space:nowrap;cursor:pointer}.step.active{background:#2563eb;color:#fff}.step.done{border-color:#20a45a}.panel{margin-top:16px;padding:22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{border:1px solid #e3e9f3;border-radius:20px;padding:16px;background:#fff}.card h3{margin:0 0 10px;color:#173a82}.word{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #edf1f7;line-height:1.6}.word:last-child{border-bottom:0}.fr{direction:ltr;text-align:left;font-weight:900}.ar{color:#64748b}.dialogue{padding:13px;border-right:4px solid #e92d83;background:#fff7fb;border-radius:12px;margin:8px 0;direction:ltr;text-align:left;line-height:1.7}.tip{background:#f7f9fd;border-radius:16px;padding:15px;line-height:1.8}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.btn,.link{border:0;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer;text-decoration:none;background:#eef4ff;color:#2457bb}.primary{background:#2563eb;color:#fff}.progress{height:10px;background:#edf1f7;border-radius:99px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:#2563eb;width:0}.option{width:100%;text-align:right;margin:6px 0}.ok{background:#ecfdf3!important;border:1px solid #20a45a!important}.bad{background:#fff2f8!important;border:1px solid #e92d83!important}.score{font-size:22px;font-weight:900;margin-top:12px}@media(max-width:700px){main{padding:10px}.grid{grid-template-columns:1fr}.panel,.hero{padding:16px}.step{padding:9px 11px;font-size:13px}}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a></header><main><section class="hero"><div class="eyebrow">3ème année du collège · Premium Learning Studio</div><h1 id="title">الصف الثالث الإعدادي</h1><div id="meta" class="meta"></div><div class="progress"><i id="bar"></i></div><div id="journey" class="journey"></div></section><section id="panel" class="panel"></section></main><script>const steps=[['start','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['evaluation','🏆 التقييم'],['progress','📈 التقدم']];const q=new URLSearchParams(location.search),id=q.get('id')||'g9-u1-l1';let d,idx=Math.max(0,steps.findIndex(x=>x[0]===(q.get('section')||'start')));const panel=document.getElementById('panel'),nav=document.getElementById('journey'),bar=document.getElementById('bar');const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.85;speechSynthesis.speak(u)}function arr(x){return Array.isArray(x)?x:[]}function list(title,a,voice=false){if(!a.length)return '<div class="tip">لا توجد بيانات مخصصة لهذه المرحلة بعد.</div>';return '<div class="card"><h3>'+esc(title)+'</h3>'+a.map(x=>{if(typeof x==='string')return '<div class="word"><span>'+esc(x)+'</span>'+(voice?'<button class="btn" onclick="speak('+JSON.stringify(x)+')">🔊</button>':'')+'</div>';const fr=x.fr||x.word||'';return '<div class="word"><span><b class="fr">'+esc(fr)+'</b><br><span class="ar">'+esc(x.ar||x.translation||'')+'</span></span>'+(voice?'<button class="btn" onclick="speak('+JSON.stringify(fr)+')">🔊</button>':'')+'</div>'}).join('')+'</div>'}function renderNav(){nav.innerHTML=steps.map((s,i)=>'<button class="step '+(i===idx?'active ':'')+(i<idx?'done':'')+'" data-i="'+i+'">'+s[1]+'</button>').join('');nav.querySelectorAll('.step').forEach(b=>b.onclick=()=>{idx=+b.dataset.i;save();render()});bar.style.width=(idx/(steps.length-1)*100)+'%'}function buildQuiz(items,title){if(!items.length)return '<div class="tip">لا توجد أسئلة مخصصة لهذه المرحلة بعد.</div>';const qs=items.slice(0,5).map((x,i)=>{const text=typeof x==='string'?x:(x.fr||x.word||'');const ar=typeof x==='string'?'':(x.ar||'');return '<div class="card"><h3>'+(i+1)+'. '+esc(text)+'</h3><p class="ar">'+esc(ar)+'</p><button class="option btn" data-answer="1">✓ أعرفها</button><button class="option btn" data-answer="0">أحتاج مراجعة</button></div>'}).join('');return '<div class="grid" id="quiz"><div class="tip"><h2>'+esc(title)+'</h2><p>اختبر نفسك ثم احسب نتيجتك. هذه المراجعة تعتمد على محتوى الدرس نفسه.</p></div>'+qs+'</div>'}function bindQuiz(){const quiz=document.getElementById('quiz');if(!quiz)return;quiz.querySelectorAll('.card').forEach(card=>card.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{card.querySelectorAll('[data-answer]').forEach(x=>x.classList.remove('ok','bad'));b.classList.add(b.dataset.answer==='1'?'ok':'bad');updateScore()}));}function updateScore(){const buttons=[...document.querySelectorAll('#quiz [data-answer].ok')];const total=document.querySelectorAll('#quiz .card').length-1;const box=document.getElementById('score');if(box)box.textContent='النتيجة: '+buttons.length+' / '+Math.max(total,0)}function render(){renderNav();const k=steps[idx][0],j=d.journey||{};let body='';if(k==='start')body='<h2>'+esc(d.titleFr)+'</h2><p>'+esc(d.titleAr)+'</p><div class="tip"><b>📚 نطاق المصدر:</b> الصفحات '+esc(d.sourcePages)+'<br><b>🎯 هدف الرحلة:</b> تعلّم المفردات ثم النطق والقواعد والتواصل والتدريب والتقييم في مسار واحد.</div>';else if(k==='vocabulary')body='<div class="grid">'+list('مفردات الدرس',j.vocabulary,true)+(j.visual?.length?list('👁️ تعلم بصري',j.visual):'')+'</div>';else if(k==='pronunciation')body='<div class="grid">'+list('🎧 أنشطة النطق',j.pronunciation?.length?j.pronunciation:(j.vocabulary||[]).map(x=>typeof x==='string'?x:x.fr),true)+'</div>';else if(k==='grammar')body='<div class="grid">'+list('📘 القواعد',j.grammar,true)+'</div>';else if(k==='conversation')body='<div class="card"><h3>💬 المحادثة</h3>'+arr(j.conversation).map(x=>'<div class="dialogue">'+esc(x)+'<br><button class="btn" onclick="speak('+JSON.stringify(x)+')">🔊 استمع</button></div>').join('')+'</div>';else if(k==='practice')body=buildQuiz(j.practice,'✍️ التدريب التفاعلي')+'<div id="score" class="score">النتيجة: 0</div>';else if(k==='video')body='<div class="tip"><h2>🎬 الفيديو</h2><p>تم تجهيز مساحة الفيديو داخل الرحلة دون اختلاق رابط غير موجود. عند إضافة أصل فيديو لاحقًا يمكن ربطه هنا.</p></div>';else if(k==='games')body=buildQuiz(j.practice,'🎮 تحدي الدرس');else if(k==='smart-review')body=buildQuiz([...(j.vocabulary||[]),...(j.grammar||[])],'🧠 المراجعة الذكية');else if(k==='evaluation')body=buildQuiz(d.assessment||j.evaluation||[],'🏆 التقييم');else if(k==='progress')body='<div class="tip"><h2>📈 تقدمك</h2><p>أكملت الوصول حتى مرحلة: <b>'+esc(steps[idx][1])+'</b>.</p><p>يمكنك التنقل بين المراحل في أي وقت، ويُحفظ آخر موضع على هذا الجهاز.</p></div>';panel.innerHTML=body+'<div class="controls">'+(idx?'<button class="btn" id="prev">السابق</button>':'')+(idx<steps.length-1?'<button class="btn primary" id="next">التالي</button>':'')+'<a class="link" href="grade-9.html">العودة للصف الثالث</a></div>';document.getElementById('prev')?.addEventListener('click',()=>{idx--;save();render()});document.getElementById('next')?.addEventListener('click',()=>{idx++;save();render()});bindQuiz()}function save(){localStorage.setItem('hm-g9-progress-'+id,String(idx))}async function load(){const r=await fetch('data/lessons/grade-9/semester-1/'+id+'.json?v=20260828-content');if(!r.ok)throw Error();d=await r.json();document.getElementById('title').textContent=d.titleAr;document.getElementById('meta').textContent=d.unit+' · الصفحات '+d.sourcePages;const saved=Number(localStorage.getItem('hm-g9-progress-'+id));if(!q.get('section')&&Number.isInteger(saved)&&saved>=0)idx=Math.min(saved,steps.length-1);render()}load().catch(()=>panel.innerHTML='<div class="tip"><h2>تعذر تحميل محتوى الدرس</h2><p>معرّف الدرس: '+esc(id)+'</p></div>');</script></body></html>
