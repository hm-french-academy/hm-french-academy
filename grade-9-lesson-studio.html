<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>HM Academy | Grade 9 Learning Studio</title><link rel="stylesheet" href="css/premium-shell.css?v=20260828-grade9"><style>main{max-width:1120px;margin:auto;padding:18px}.hero,.panel{background:#fff;border:1px solid #e3e9f3;border-radius:28px;box-shadow:0 18px 50px #14264a12}.hero{padding:24px}.eyebrow{font-weight:900;color:#2563eb}.hero h1{margin:8px 0}.meta{color:#64748b;font-weight:800}.journey{display:flex;gap:7px;overflow:auto;margin-top:18px;padding-bottom:3px}.step{border:1px solid #dfe6f2;background:#f8faff;color:#2457bb;border-radius:999px;padding:10px 14px;font-weight:900;white-space:nowrap;cursor:pointer}.step.active{background:#2563eb;color:#fff}.step.done{border-color:#20a45a}.panel{margin-top:16px;padding:22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{border:1px solid #e3e9f3;border-radius:20px;padding:16px;background:#fff}.card h3{margin:0 0 10px;color:#173a82}.word{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #edf1f7;line-height:1.6}.word:last-child{border-bottom:0}.fr{direction:ltr;text-align:left;font-weight:900}.ar{color:#64748b}.dialogue{padding:13px;border-right:4px solid #e92d83;background:#fff7fb;border-radius:12px;margin:8px 0;direction:ltr;text-align:left;line-height:1.7}.tip{background:#f7f9fd;border-radius:16px;padding:15px;line-height:1.8}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.btn,.link{border:0;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer;text-decoration:none;background:#eef4ff;color:#2457bb}.primary{background:#2563eb;color:#fff}.progress{height:10px;background:#edf1f7;border-radius:99px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:#2563eb;width:0}.option{width:100%;text-align:right;margin:6px 0}.ok{background:#ecfdf3!important;border:1px solid #20a45a!important}.bad{background:#fff2f8!important;border:1px solid #e92d83!important}.score{font-size:22px;font-weight:900;margin-top:12px}@media(max-width:700px){main{padding:10px}.grid{grid-template-columns:1fr}.panel,.hero{padding:16px}.step{padding:9px 11px;font-size:13px}}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a></header><main><section class="hero"><div class="eyebrow">3ème année du collège · Premium Learning Studio</div><h1 id="title">الصف الثالث الإعدادي</h1><div id="meta" class="meta"></div><div class="progress"><i id="bar"></i></div><div id="journey" class="journey"></div></section><section id="panel" class="panel"></section></main><script>const steps=[['start','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['evaluation','🏆 التقييم'],['progress','📈 التقدم']];const q=new URLSearchParams(location.search),id=q.get('id')||'g9-u1-l1';let d,idx=Math.max(0,steps.findIndex(x=>x[0]===(q.get('section')||'start')));const panel=document.getElementById('panel'),nav=document.getElementById('journey'),bar=document.getElementById('bar');const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.85;speechSynthesis.speak(u)}function arr(x){return Array.isArray(x)?x:[]}function list(title,a,voice=false){if(!a.length)return '<div class="tip">لا توجد بيانات مخصصة لهذه المرحلة بعد.</div>';return '<div class="card"><h3>'+esc(title)+'</h3>'+a.map(x=>{if(typeof x==='string')return '<div class="word"><span>'+esc(x)+'</span>'+(voice?'<button class="btn" onclick="speak('+JSON.stringify(x)+')">🔊</button>':'')+'</div>';const fr=x.fr||x.word||'';return '<div class="word"><span><b class="fr">'+esc(fr)+'</b><br><span class="ar">'+esc(x.ar||x.translation||'')+'</span></span>'+(voice?'<button class="btn" onclick="speak('+JSON.stringify(fr)+')">🔊</button>':'')+'</div>'}).join('')+'</div>'}function quiz(items,title){if(!items.length)return '<div class="tip">لا توجد عناصر لهذه المرحلة.</div>';const qs=items.slice(0,8).map((x,i)=>{const text=typeof x==='string'?x:(x.fr||x.word||'');const ar=typeof x==='string'?'':(x.ar||'');return '<div class="card"><h3>'+(i+1)+'. '+esc(text)+'</h3><p class="ar">'+esc(ar)+'</p><button class="option btn" data-a="1">✓ أتقنها</button><button class="option btn" data-a="0">↻ أحتاج مراجعة</button></div>'}).join('');return '<div class="tip"><h2>'+esc(title)+'</h2><p>اختر حالتك لكل عنصر، ويمكنك تغيير الاختيار.</p></div><div class="grid" id="quiz">'+qs+'</div><div id="score" class="score">النتيجة: 0 / '+Math.min(items.length,8)+'</div>'}function bindQuiz(){const z=document.getElementById('quiz');if(!z)return;z.querySelectorAll('.card').forEach(c=>c.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{c.querySelectorAll('[data-a]').forEach(x=>x.classList.remove('ok','bad'));b.classList.add(b.dataset.a==='1'?'ok':'bad');score()}))}function score(){const z=document.getElementById('quiz');if(!z)return;const total=z.querySelectorAll('.card').length,n=z.querySelectorAll('[data-a="1"].ok').length;const s=document.getElementById('score');if(s)s.textContent='النتيجة: '+n+' / '+total}function renderNav(){nav.innerHTML=steps.map((s,i)=>'<button class="step '+(i===idx?'active ':'')+(i<idx?'done':'')+'" data-i="'+i+'">'+s[1]+'</button>').join('');nav.querySelectorAll('.step').forEach(b=>b.onclick=()=>{idx=+b.dataset.i;save();render()});bar.style.width=(idx/(steps.length-1)*100)+'%'}function render(){renderNav();const k=steps[idx][0],j=d.journey||{};let body='';if(k==='start')body='<h2>'+esc(d.titleFr)+'</h2><p>'+esc(d.titleAr)+'</p><div class="tip"><b>📚 نطاق المصدر:</b> الصفحات '+esc(d.sourcePages)+'<br><b>🎯 هدف الرحلة:</b> مسار متكامل من المفردات إلى التقييم.</div>';else if(k==='vocabulary')body='<div class="grid">'+list('مفردات الدرس',j.vocabulary,true)+(j.visual?.length?list('👁️ التعلم البصري',j.visual):'')+'</div>';else if(k==='pronunciation')body='<div class="grid">'+list('🎧 النطق',j.pronunciation?.length?j.pronunciation:(j.vocabulary||[]).map(x=>typeof x==='string'?x:x.fr),true)+'</div>';else if(k==='grammar')body='<div class="grid">'+list('📘 القواعد',j.grammar,true)+'</div>';else if(k==='conversation')body='<div class="card"><h3>💬 المحادثة</h3>'+arr(j.conversation).map(x=>'<div class="dialogue">'+esc(x)+'<br><button class="btn" onclick="speak('+JSON.stringify(x)+')">🔊 استمع</button></div>').join('')+'</div>';else if(k==='practice')body=quiz(j.practice,'✍️ التدريب التفاعلي');else if(k==='video')body='<div class="tip"><h2>🎬 الفيديو</h2><p>لا يتم اختلاق رابط فيديو. ستظهر الأصول هنا عند ربطها بالمقرر.</p></div>';else if(k==='games')body=quiz(j.practice,'🎮 تحدي الدرس');else if(k==='smart-review')body=quiz([...(j.vocabulary||[]),...(j.grammar||[])],'🧠 المراجعة الذكية');else if(k==='evaluation')body=quiz(d.assessment||j.evaluation||[],'🏆 التقييم');else if(k==='progress')body='<div class="tip"><h2>📈 تقدمك</h2><p>موضعك الحالي: <b>'+esc(steps[idx][1])+'</b>.</p><p>آخر موضع محفوظ على هذا الجهاز.</p></div>';panel.innerHTML=body+'<div class="controls">'+(idx?'<button class="btn" id="prev">السابق</button>':'')+(idx<steps.length-1?'<button class="btn primary" id="next">التالي</button>':'')+'<a class="link" href="grade-9.html">العودة للصف الثالث</a></div>';document.getElementById('prev')?.addEventListener('click',()=>{idx--;save();render()});document.getElementById('next')?.addEventListener('click',()=>{idx++;save();render()});bindQuiz()}function save(){localStorage.setItem('hm-g9-progress-'+id,String(idx))}async function load(){const base=location.pathname.split('/').slice(0,-1).join('/')+'/';const candidates=[base+'data/lessons/grade-9/semester-1/'+encodeURIComponent(id)+'.json?v=20260828-content',new URL('data/lessons/grade-9/semester-1/'+encodeURIComponent(id)+'.json?v=20260828-content',location.href).href,'https://raw.githubusercontent.com/hm-french-academy/hm-french-academy/main/data/lessons/grade-9/semester-1/'+encodeURIComponent(id)+'.json?v=20260828-content'];let last='';for(const u of candidates){try{const r=await fetch(u,{cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok){last='HTTP '+r.status;continue}const text=await r.text();if(!text.trim().startsWith('{')){last='non-JSON response';continue}const parsed=JSON.parse(text);if(!parsed||typeof parsed!=='object')throw Error('invalid JSON');d=parsed;document.getElementById('title').textContent=d.titleAr||d.titleFr||'الدرس';document.getElementById('meta').textContent=(d.unit||'')+' · الصفحات '+(d.sourcePages||'');const saved=Number(localStorage.getItem('hm-g9-progress-'+id));if(!q.get('section')&&Number.isInteger(saved)&&saved>=0)idx=Math.min(saved,steps.length-1);render();return}catch(e){last=e.message||String(e)}}throw Error(last||'load failed')}load().catch(e=>{panel.innerHTML='<div class="tip"><h2>تعذر تحميل محتوى الدرس</h2><p>معرّف الدرس: '+esc(id)+'</p><p>حاول إعادة تحميل الصفحة بعد اكتمال النشر.</p><button class="btn primary" onclick="location.reload()">إعادة المحاولة</button></div>'});</script></body></html>
