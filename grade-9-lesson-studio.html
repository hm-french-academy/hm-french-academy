<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Grade 9 Learning Studio</title><link rel="stylesheet" href="css/premium-shell.css?v=20260828-grade9"><style>main{max-width:1100px;margin:auto;padding:28px 18px}.hero{background:#fff;border:1px solid #e3e9f3;border-radius:28px;padding:26px;box-shadow:0 18px 50px #14264a12}.eyebrow{font-weight:900;color:#2563eb}.journey{display:flex;gap:8px;overflow:auto;margin:18px 0}.step{padding:10px 14px;border:1px solid #dfe6f2;border-radius:14px;background:#fff;font-weight:900;white-space:nowrap}.step.active{background:#2563eb;color:#fff}.panel{margin-top:16px;background:#fff;border:1px solid #e3e9f3;border-radius:24px;padding:22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{border:1px solid #e3e9f3;border-radius:18px;padding:16px;background:#fff}.card h3{margin-top:0}.word{display:flex;justify-content:space-between;gap:12px;padding:10px;border-bottom:1px solid #edf1f7}.ar{color:#64748b}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button,.link{border:0;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer;background:#eef4ff;color:#2457bb;text-decoration:none}.primary{background:#2563eb;color:#fff}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a></header><main><section class="hero"><div class="eyebrow">3ème année du collège · Learning Studio</div><h1 id="title">الصف الثالث الإعدادي</h1><p id="meta"></p><div id="journey" class="journey"></div></section><section id="panel" class="panel"></section></main><script>const steps=[['start','البداية'],['vocabulary','المفردات'],['pronunciation','النطق'],['grammar','القواعد'],['conversation','المحادثة'],['practice','التدريب'],['video','الفيديو'],['games','الألعاب'],['smart-review','المراجعة الذكية'],['evaluation','التقييم'],['progress','التقدم']];const qs=new URLSearchParams(location.search),id=qs.get('id')||'g9-u1-l1';let data,idx=Math.max(0,steps.findIndex(s=>s[0]===(qs.get('section')||'start')));const journey=document.getElementById('journey'),panel=document.getElementById('panel');function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function renderNav(){journey.innerHTML=steps.map((s,i)=>'<button class="step '+(i===idx?'active':'')+'" data-i="'+i+'">'+s[1]+'</button>').join('');journey.querySelectorAll('button').forEach(b=>b.onclick=()=>{idx=+b.dataset.i;render()})}function list(title,arr){if(!arr?.length)return '';return '<div class="card"><h3>'+esc(title)+'</h3>'+arr.map(x=>{if(typeof x==='string')return '<div class="word">'+esc(x)+'</div>';return '<div class="word"><strong>'+esc(x.fr)+'</strong><span class="ar">'+esc(x.ar)+'</span></div>'}).join('')+'</div>'}function render(){renderNav();const key=steps[idx][0];let body='';if(key==='start')body='<h2>'+esc(data.titleFr)+'</h2><p>'+esc(data.titleAr)+'</p><p>المصدر: صفحات '+esc(data.sourcePages)+'</p>';if(key==='vocabulary')body='<div class="grid">'+list('Vocabulaire',data.journey.vocabulary)+'</div>';if(key==='grammar')body='<div class="grid">'+list('Grammaire',data.journey.grammar)+'</div>';if(key==='conversation')body='<div class="grid">'+list('Conversation',data.journey.conversation)+'</div>';if(key==='practice')body='<div class="grid">'+list('Activités',data.journey.practice)+'</div>';if(key==='evaluation')body='<div class="grid">'+list('Évaluation',data.assessment||data.journey.evaluation)+'</div>';if(key==='pronunciation')body='<h2>النطق</h2><p>تُجهّز أنشطة النطق من مفردات هذا الدرس دون تغيير النص الأصلي.</p>';if(key==='video')body='<h2>الفيديو</h2><p>مساحة الفيديو المرتبطة بالدرس.</p>';if(key==='games')body='<h2>الألعاب</h2><p>مساحة الألعاب التفاعلية المرتبطة بالمحتوى.</p>';if(key==='smart-review')body='<h2>المراجعة الذكية</h2><p>مراجعة تراكمية للمفردات والقواعد والتواصل.</p>';if(key==='progress')body='<h2>التقدم</h2><p>تمثل هذه الصفحة نقطة تتبع إكمال مراحل الدرس.</p>';panel.innerHTML=body+'<div class="controls">'+(idx>0?'<button id="prev">السابق</button>':'')+(idx<steps.length-1?'<button class="primary" id="next">التالي</button>':'')+'<a class="link" href="grade-9.html">العودة للصف الثالث</a></div>';document.getElementById('prev')?.addEventListener('click',()=>{idx--;render()});document.getElementById('next')?.addEventListener('click',()=>{idx++;render()})}async function load(){const r=await fetch('data/lessons/grade-9/semester-1/'+id.replaceAll('/','')+'.json');if(!r.ok)throw Error();data=await r.json();document.getElementById('meta').textContent=data.unit+' · '+data.sourcePages;render()}load().catch(()=>panel.innerHTML='<h2>تعذر تحميل محتوى الدرس</h2><p>تحقق من معرف الدرس.</p>');</script></body></html>
