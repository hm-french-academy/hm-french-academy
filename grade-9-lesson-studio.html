<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>HM Academy | Grade 9 Learning Studio</title>
<link rel="stylesheet" href="css/premium-shell.css?v=20260828-g9-studio-v2">
</head>
<body class="g9-body">
<header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a></header>
<main class="g9-main">
<section class="g9-hero">
  <div class="g9-hero-copy"><span class="g9-kicker">3ème année du collège · Premium Learning Studio</span><h1 id="title">الرياضات</h1><p id="subtitle">Les sports · تعلّم المفردات واستعملها في مواقف حقيقية.</p><div class="g9-meta"><span id="meta">Le sport · الصفحات 16–20</span><span class="g9-status">● درس تفاعلي</span></div></div>
  <div class="g9-hero-orb"><span>⚽</span><small>LE SPORT</small></div>
</section>
<section class="g9-progress-card"><div class="g9-progress-top"><strong>رحلة الدرس</strong><span id="progressText">1 من 11</span></div><div class="g9-progress"><i id="bar"></i></div><div id="journey" class="g9-journey" aria-label="مراحل الدرس"></div></section>
<section id="panel" class="g9-panel"></section>
</main>
<script>
const steps=[['start','🚀','البداية'],['vocabulary','🖼️','المفردات'],['pronunciation','🎧','النطق'],['grammar','📘','القواعد'],['conversation','💬','المحادثة'],['practice','✍️','التدريب'],['video','🎬','الفيديو'],['games','🎮','الألعاب'],['smart-review','🧠','المراجعة الذكية'],['evaluation','🏆','التقييم'],['progress','📈','التقدم']];
const fallback={'g9-u1-l1':{id:'g9-u1-l1',unit:'Le sport',titleFr:'Les sports',titleAr:'الرياضات',sourcePages:'16–20',journey:{vocabulary:[{fr:'le football',ar:'كرة القدم',icon:'⚽'},{fr:'le ping-pong',ar:'تنس الطاولة',icon:'🏓'},{fr:'le karaté',ar:'الكاراتيه',icon:'🥋'},{fr:'le cyclisme / le vélo',ar:'ركوب الدراجات',icon:'🚴'},{fr:'la boxe',ar:'الملاكمة',icon:'🥊'},{fr:'la natation',ar:'السباحة',icon:'🏊'},{fr:'le tennis',ar:'التنس',icon:'🎾'},{fr:'le basket-ball',ar:'كرة السلة',icon:'🏀'},{fr:'le volley-ball',ar:'الكرة الطائرة',icon:'🏐'},{fr:"l'équitation",ar:'الفروسية',icon:'🏇'},{fr:"l'escrime",ar:'المبارزة',icon:'🤺'},{fr:'le ski',ar:'التزلج',icon:'⛷️'},{fr:'le judo',ar:'الجودو',icon:'🥋'},{fr:'le rugby',ar:'الرجبي',icon:'🏉'},{fr:'la pêche',ar:'صيد السمك',icon:'🎣'},{fr:'la voile',ar:'الإبحار',icon:'⛵'},{fr:'la gymnastique',ar:'الجمباز',icon:'🤸'},{fr:'les échecs',ar:'الشطرنج',icon:'♟️'},{fr:'la marche',ar:'المشي',icon:'🚶'},{fr:'la randonnée',ar:'التنزه',icon:'🥾'}],grammar:["Faire du / de la / de l'","Pratiquer + le / la / l' / les"],conversation:["Qu'est-ce que tu pratiques comme sport ?","Où pratiques-tu ton sport préféré ?"],practice:['Classer les sports selon le genre','Compléter des phrases avec le sport convenable','Choisir l’article correct : le / la / l’ / les','Associer chaque sport بالمكان أو الأداة المناسبة'],pronunciation:["Répéter chaque sport avec son article","Distinguer les articles le, la, l' et les à l'oral","Répéter : Qu'est-ce que tu pratiques ?","Lire à voix haute les noms de sports puis les utiliser dans une phrase"],visual:['Associer chaque sport à une illustration واضحة','Classer visuellement les sports individuels et collectifs','Identifier les sports selon les équipements et lieux représentés','Associer une image de situation à la phrase française correspondante']},assessment:['Nommer des sports à partir d’images','Choisir le sport adapté à une situation','Prononcer correctement les noms de sports','Associer une représentation visuelle à l’expression française correcte']}};
const q=new URLSearchParams(location.search),id=q.get('id')||'g9-u1-l1';let d,idx=Math.max(0,steps.findIndex(x=>x[0]===(q.get('section')||'start'))),mastered=new Set();
const panel=document.getElementById('panel'),nav=document.getElementById('journey'),bar=document.getElementById('bar');
const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const speak=t=>{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.86;speechSynthesis.speak(u)};
const arr=x=>Array.isArray(x)?x:[];
function go(i){idx=Math.max(0,Math.min(steps.length-1,i));render();window.scrollTo({top:0,behavior:'smooth'})}
function chip(label,icon,active){return `<button class="g9-step ${active?'active':''}" onclick="go(${steps.findIndex(s=>s[0]===label)})"><span>${icon}</span><b>${esc(steps.find(s=>s[0]===label)[2])}</b></button>`}
function vocabCard(x,i){return `<article class="g9-vocab-card"><div class="g9-vocab-art">${x.icon||'🏅'}</div><div class="g9-vocab-text"><span>${esc(x.fr)}</span><strong>${esc(x.ar)}</strong></div><button class="g9-audio" aria-label="نطق ${esc(x.fr)}" onclick="speak(${JSON.stringify(x.fr)})">🔊</button><button class="g9-star ${mastered.has(i)?'done':''}" onclick="toggleMaster(${i})">${mastered.has(i)?'✓':'☆'}</button></article>`}
function toggleMaster(i){mastered.has(i)?mastered.delete(i):mastered.add(i);render()}
function simpleList(title,items,voice=false){if(!items?.length)return `<div class="g9-empty">لا توجد بيانات لهذه المرحلة.</div>`;return `<section class="g9-section"><div class="g9-section-head"><div><span class="g9-eyebrow">HM ACADEMY</span><h2>${esc(title)}</h2></div><span class="g9-count">${items.length}</span></div><div class="g9-list">${items.map((x,i)=>`<div class="g9-list-row"><span class="g9-index">${String(i+1).padStart(2,'0')}</span><span>${esc(typeof x==='string'?x:(x.fr||x.word||''))}</span>${voice?`<button class="g9-mini-audio" onclick="speak(${JSON.stringify(typeof x==='string'?x:(x.fr||x.word||''))})">🔊</button>`:''}</div>`).join('')}</div></section>`}
function quiz(items,title){if(!items?.length)return `<div class="g9-empty">لا توجد عناصر لهذه المرحلة.</div>`;return `<section class="g9-section"><div class="g9-section-head"><div><span class="g9-eyebrow">INTERACTIVE</span><h2>${esc(title)}</h2></div></div><div class="g9-quiz">${items.slice(0,8).map((x,i)=>{const t=typeof x==='string'?x:(x.fr||x.word||'');return `<div class="g9-question"><div class="g9-q-no">${i+1}</div><div class="g9-q-body"><b>${esc(t)}</b><div class="g9-q-actions"><button onclick="this.classList.add('chosen');this.textContent='✓ أتقنتها'">✓ أتقنتها</button><button onclick="this.classList.add('chosen');this.textContent='↻ أحتاج مراجعة'">↻ أحتاج مراجعة</button></div></div></div>`}).join('')}</div></section>`}
function render(){
 nav.innerHTML=steps.map((s,i)=>`<button class="g9-step ${i===idx?'active':''} ${i<idx?'visited':''}" onclick="go(${i})"><span>${s[1]}</span><b>${s[2]}</b></button>`).join('');
 bar.style.width=(idx/(steps.length-1)*100)+'%';document.getElementById('progressText').textContent=`${idx+1} من ${steps.length}`;
 const k=steps[idx][0],j=d.journey||{};let b='';
 if(k==='start')b=`<div class="g9-welcome"><div class="g9-welcome-icon">🏆</div><div><span class="g9-eyebrow">BIENVENUE</span><h2>جاهز لاكتشاف عالم الرياضات؟</h2><p>في هذا الدرس ستتعلم أسماء الرياضات بالفرنسية، تتدرب على النطق، وتستخدمها في مواقف حقيقية.</p><div class="g9-goals"><span>🖼️ 20 مفردة</span><span>🎧 نطق فرنسي</span><span>✍️ تدريب</span><span>🏆 تقييم</span></div></div></div>`;
 else if(k==='vocabulary')b=`<div class="g9-section"><div class="g9-section-head"><div><span class="g9-eyebrow">VOCABULAIRE</span><h2>مفردات الرياضات</h2><p>اضغط 🔊 لسماع النطق، و ☆ لحفظ الكلمة كمتقنة.</p></div><span class="g9-count">${j.vocabulary?.length||0}</span></div><div class="g9-vocab-grid">${arr(j.vocabulary).map(vocabCard).join('')}</div></div><div class="g9-visual-strip">${arr(j.visual).map((x,i)=>`<div><span>${['👁️','🧩','📍','💡'][i%4]}</span><b>${esc(x)}</b></div>`).join('')}</div>`;
 else if(k==='pronunciation')b=simpleList('تدريب النطق',j.pronunciation||j.vocabulary,true);
 else if(k==='grammar')b=`<div class="g9-section"><div class="g9-section-head"><div><span class="g9-eyebrow">GRAMMAIRE</span><h2>كيف نتحدث عن ممارسة الرياضة؟</h2></div></div><div class="g9-rule-grid">${arr(j.grammar).map((x,i)=>`<article><span>${i===0?'1':'2'}</span><h3>${esc(x)}</h3><p>${i===0?'Je fais du football. · Je fais de la natation.':'Je pratique le tennis. · Je pratique l’escrime.'}</p><button class="g9-mini-audio" onclick="speak(${JSON.stringify(i===0?'Je fais du football.':'Je pratique le tennis.')})">🔊 استمع</button></article>`).join('')}</div></div>`;
 else if(k==='conversation')b=`<div class="g9-dialog"><span class="g9-eyebrow">DIALOGUE</span><h2>💬 حوار قصير</h2>${arr(j.conversation).map((x,i)=>`<div class="g9-bubble ${i?'student':''}"><span>${i?'👤':'🧑‍🏫'}</span><div><small>${i?'Élève':'Professeur'}</small><p dir="ltr">${esc(x)}</p><button class="g9-mini-audio" onclick="speak(${JSON.stringify(x)})">🔊 استمع</button></div></div>`).join('')}</div>`;
 else if(k==='practice')b=quiz(j.practice,'✍️ التدريب التفاعلي');
 else if(k==='video')b=`<div class="g9-media"><div class="g9-play">▶</div><span class="g9-eyebrow">VIDEO</span><h2>🎬 فيديو الدرس</h2><p>سيتم ربط مصدر الفيديو الأصلي عند توفره، مع الحفاظ على مكانه داخل رحلة الدرس.</p></div>`;
 else if(k==='games')b=quiz(j.practice,'🎮 تحدي الرياضات');
 else if(k==='smart-review')b=quiz([...(j.vocabulary||[]).slice(0,6),...(j.grammar||[])],'🧠 المراجعة الذكية');
 else if(k==='evaluation')b=`<div class="g9-eval"><div class="g9-trophy">🏆</div><span class="g9-eyebrow">FINAL CHECK</span><h2>هل أتقنت الدرس؟</h2><p>اختبر قدرتك على تسمية الرياضات واختيار التعبير الفرنسي المناسب ونطق الكلمات.</p>${quiz(d.assessment||j.evaluation,'التقييم النهائي')}</div>`;
 else b=`<div class="g9-complete"><div>🎉</div><h2>أحسنت! وصلت إلى نهاية رحلة الدرس.</h2><p>يمكنك إعادة أي مرحلة من الأعلى، أو الانتقال للدرس التالي عندما يصبح متاحًا.</p></div>`;
 panel.innerHTML=`${b}<div class="g9-nav-buttons">${idx?`<button onclick="go(${idx-1})">→ السابق</button>`:''}${idx<steps.length-1?`<button class="primary" onclick="go(${idx+1})">التالي ←</button>`:''}</div>`;
}
async function load(){if(fallback[id]){d=fallback[id];document.getElementById('title').textContent=d.titleAr;document.getElementById('subtitle').textContent=`${d.titleFr} · تعلّم المفردات واستعملها في مواقف حقيقية.`;document.getElementById('meta').textContent=`${d.unit} · الصفحات ${d.sourcePages}`;render();return}try{const r=await fetch('data/lessons/grade-9/semester-1/'+encodeURIComponent(id)+'.json?v=20260828-final',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);d=await r.json();document.getElementById('title').textContent=d.titleAr||d.titleFr;document.getElementById('meta').textContent=(d.unit||'')+' · الصفحات '+(d.sourcePages||'');render()}catch(e){panel.innerHTML=`<div class="g9-error"><h2>تعذر تحميل محتوى الدرس</h2><p>معرّف الدرس: ${esc(id)}</p><small>${esc(e.message)}</small></div>`}}load();
</script>
</body></html>
