<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>HM Academy | Grade 9 Learning Studio</title><script>/* loader patch */</script></head><body><main><h1>HM Academy | Grade 9</h1><p>تم تحديث محمّل الدروس.</p></main><script>const q=new URLSearchParams(location.search),id=q.get('id')||'g9-u1-l1';async function load(){const urls=['data/lessons/grade-9/semester-1/'+id+'.json?v=20260828-content','./data/lessons/grade-9/semester-1/'+encodeURIComponent(id)+'.json?v=20260828-content','https://raw.githubusercontent.com/hm-french-academy/hm-french-academy/main/data/lessons/grade-9/semester-1/'+encodeURIComponent(id)+'.json?v=20260828-content'];let d=null,last=null;for(const u of urls){try{const r=await fetch(u,{cache:'no-store'});if(r.ok){d=await r.json();break}last=new Error('HTTP '+r.status)}catch(e){last=e}}if(!d)throw last;document.querySelector('main').innerHTML='<h1>'+String(d.titleAr||'الدرس')+'</h1><p>'+String(d.unit||'')+'</p>'}load().catch(()=>document.querySelector('main').innerHTML='<h1>تعذر تحميل محتوى الدرس</h1><p>معرّف الدرس: '+id+'</p><button onclick="location.reload()">إعادة المحاولة</button>');</script></body></html>
