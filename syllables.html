<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | المقاطع وبناء الكلمات</title><link rel="stylesheet" href="css/premium-shell.css"><style>main{max-width:1050px;margin:auto;padding:28px 16px}.hero,.card{background:#fff;border:1px solid #e1e7f0;border-radius:22px;padding:22px}.hero{background:linear-gradient(135deg,#14264a,#2563eb);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:18px}.unit{min-height:150px}.unit h3{color:#14264a}.unit a{display:inline-block;margin-top:10px;padding:9px 12px;border-radius:10px;background:#2563eb;color:#fff;text-decoration:none;font-weight:800}.muted{color:#68758b;line-height:1.8}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy</span></a><nav class="hm-nav"><a href="language-courses.html">← الكورسات</a><a href="dashboard.html">لوحة الطالب</a></nav></header><main><section class="hero"><h1>🔤 كورس المقاطع وبناء الكلمات</h1><p>مسار تدريجي لفهم المقطع الفرنسي، تقسيم الكلمات، ثم إعادة تركيبها وقراءتها بصورة صحيحة. هذه نسخة بنية أولية للمراجعة الأكاديمية قبل اعتماد المادة التعليمية النهائية.</p></section><section class="card" style="margin-top:18px"><h2>خريطة الكورس</h2><div id="units" class="grid"></div></section></main><script>const units=[['syllable-types','أنواع المقاطع','التعرف إلى مفهوم المقطع في الكلمة الفرنسية.'],['open-closed-syllables','المقطع المفتوح والمغلق','التمييز بين البنية المفتوحة والمغلقة في أمثلة واضحة.'],['vowel-groups','مجموعات الحروف المتحركة','قراءة تجمعات الحروف المتحركة دون الخلط بين الكتابة والصوت.'],['consonant-groups','مجموعات الحروف الساكنة','فهم التجمعات الساكنة الشائعة في الكلمات.'],['word-segmentation','تقسيم الكلمات','تدريب عملي على فصل الكلمات إلى مقاطع صوتية/قرائية.'],['stress-group','المجموعة الإيقاعية','ربط المقاطع بالإيقاع الطبيعي للكلام الفرنسي.'],['practice','تدريب شامل','تطبيق متدرج على كلمات جديدة ثم جمل قصيرة.']];document.getElementById('units').innerHTML=units.map((u,i)=>`<article class="unit card"><small>الوحدة ${i+1}</small><h3>${u[1]}</h3><p class="muted">${u[2]}</p><a href="syllables-lesson.html?unit=${encodeURIComponent(u[0])}">فتح الوحدة →</a></article>`).join('')</script></body></html>
