<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173a82"><title>HM Academy | الصف الأول الإعدادي</title><style>body{margin:0;background:#f4f7fb;color:#17223b;font-family:Arial,"Cairo",sans-serif}.wrap{max-width:1120px;margin:auto;padding:12px}.top,.hero,.panel,.foot{border-radius:22px}.top{background:#0f1b33;color:#fff;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}.top a{background:#eef3ff;color:#173a82;padding:9px 12px;border-radius:11px;text-decoration:none;font-weight:900}.hero{margin-top:12px;padding:22px;color:#fff;background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6)}h1{margin:0 0 7px;font-size:clamp(25px,6vw,40px)}.hero p{line-height:1.8}.chips,.tabs{display:flex;gap:8px;overflow:auto}.chips{margin-top:13px}.chip,.tab,.btn,.opt{border:0;border-radius:12px;padding:10px 13px;font-weight:900}.chip{white-space:nowrap;background:#ffffff22;border:1px solid #ffffff44}.tabs{background:#fff;padding:8px;margin:12px 0}.tab{white-space:nowrap;background:#eef3ff;color:#173a82;cursor:pointer}.tab.on{background:#e92d83;color:#fff}.panel{background:#fff;padding:19px;box-shadow:0 10px 30px #14264a12;min-height:390px}.goal{background:#f7f9fd;border-radius:16px;padding:15px;line-height:2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{border:1px solid #e1e6ef;border-radius:17px;padding:14px;background:#fff}.fr{direction:ltr;text-align:center;font-size:21px;font-weight:900}.ar{text-align:center;color:#315aa4;font-weight:800;margin-top:5px}.big{text-align:center;font-size:38px;font-weight:900;padding:8px}.btn{cursor:pointer;background:#2563eb;color:#fff;margin:5px 3px 0 0}.secondary{background:#edf3ff;color:#173a82}.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.opt{background:#fff;border:1px solid #dbe1eb;cursor:pointer;text-align:center}.good{background:#ecfdf3!important;border-color:#20a45a!important}.bad{background:#fff2f8!important;border-color:#e92d83!important}.small{font-size:13px;color:#718096}.bar{height:10px;background:#e7ecf5;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;width:0;background:#2563eb;transition:.3s}.dialog{background:#f7f9fd;border-right:4px solid #e92d83;border-radius:13px;padding:12px;margin:8px 0;line-height:1.8}.rule{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.rule span{background:#eef3ff;color:#173a82;border-radius:12px;padding:10px 14px;font-weight:900}.input{padding:10px;border:1px solid #dbe1eb;border-radius:10px;width:min(100%,240px)}@media(max-width:650px){.wrap{padding:8px}.panel{padding:14px}.top{border-radius:14px}}</style></head><body><div class="wrap"><header class="top"><b>🇫🇷 HM Academy · الصف الأول الإعدادي</b><a href="grade-7.html">المرحلة</a></header><section class="hero"><h1 id="title">Learning Studio</h1><p id="desc">رحلة تعلم تفاعلية مبنية على المصدر الأصلي مع إثراء تربوي من HM Academy.</p><div class="chips"><span class="chip">🎯 Source-first</span><span class="chip">🧠 Smart Review</span><span class="chip">📱 Mobile First</span><span class="chip">🏆 Mastery</span></div></section><nav class="tabs" id="tabs"></nav><main class="panel" id="panel"></main><footer style="display:flex;align-items:center;gap:12px;background:#fff;padding:13px;margin-top:12px;border-radius:18px"><div style="flex:1"><b>📈 تقدم الدرس</b><div class="small" id="state">لم تبدأ بعد</div><div class="bar"><div class="fill" id="fill"></div></div></div><button class="btn" onclick="finish()">إكمال الدرس</button></footer></div><script>
const p=new URLSearchParams(location.search),id=p.get('id')||'grade7-u1-l1',sec=p.get('section')||'introduction';
const S=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function say(x){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x);u.lang='fr-FR';u.rate=.84;speechSynthesis.speak(u)}
function go(s){location.href='grade7-lesson-studio.html?id='+encodeURIComponent(id)+'&section='+s}
function key(){return'hm-g7-mastery-'+id}function setProgress(v){let n=Math.max(0,Math.min(100,v));localStorage.setItem(key(),String(n));status()}function finish(){setProgress(100)}function status(){let n=Number(localStorage.getItem(key())||0);state.textContent=n>=100?'✅ مكتمل':n+'% إنجاز';fill.style.width=n+'%'}
function nav(){tabs.innerHTML=S.map(x=>`<button class="tab ${x[0]===sec?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
let d;
const L3={id:'grade7-u1-l3',titleFr:'Les pronoms sujets et les verbes du 1er groupe',titleAr:'ضمائر الفاعل وأفعال المجموعة الأولى',goal:'التعرف على ضمائر الفاعل وتصريف أفعال المجموعة الأولى في الحاضر.',pronouns:[['Je','أنا'],['Tu','أنتَ/أنتِ'],['Il','هو'],['Elle','هي'],['Nous','نحن'],['Vous','أنتم'],['Ils','هم'],['Elles','هنّ']],replace:[['Noura','est une fille','elle',['il','elle','ils']],['Magdi','est un garçon','il',['il','elle','elles']],['Ahmed et Mona','sont sportifs','ils',['il','elles','ils']],['Hoda et Mona','vont au club','elles',['ils','elles','il']],['Ali et moi','jouons au foot','nous',['vous','nous','ils']],['Ali et toi','chantez bien','vous',['nous','vous','elles']]],verbs:{parler:['parle','parles','parle','parlons','parlez','parlent'],aimer:['aime','aimes','aime','aimons','aimez','aiment'],chanter:['chante','chantes','chante','chantons','chantez','chantent'],présenter:['présente','présentes','présente','présentons','présentez','présentent']},fill:[['Nous _____ le Français.','aimer','aimons'],['Tu _____ bien !','chanter','chantes'],['Ils _____ Tamer et Omar.','s\'appeler','appellent'],['Je _____ Ali à Rami.','présenter','présente'],['Vous _____ le Français ?','parler','parlez']],quiz:[['Ali يُستبدل بالضمير:',['il','elle','ils'],0,'il'],['Mona et Mona et Laila يُستبدل بالضمير:',['ils','elles','nous'],1,'elles'],['نهاية فعل parler مع nous هي:',['parle','parlons','parlez'],1,'nous parlons'],['نهاية فعل aimer مع ils هي:',['aiment','aimez','aime'],0,'ils aiment'],['Ali et moi يُستبدل بالضمير:',['vous','nous','ils'],1,'nous'],['صرّف chanter مع tu:',['chante','chantes','chantez'],1,'tu chantes']]};
const lessons={'grade7-u1-l3':L3};
function wordCard(v){return`<article class="card"><div class="fr">${esc(v[0])}</div><div class="ar">${esc(v[1])}</div><button class="btn" onclick='say(${JSON.stringify(v[0])})'>🔊 استمع</button></article>`}
function intro(){return`<h2>🚀 ضربة البداية</h2><div class="goal"><b>${esc(d.titleFr)}</b><br>${esc(d.titleAr)}<br><br>🎯 ${esc(d.goal)}<br><br>المصدر الأصلي محفوظ، والإثراء التربوي هنا مكمّل له وليس بديلًا عنه.</div>`}
function vocab(){if(d===L3)return`<h2>🖼️ المفردات والضمائر</h2><p class="small">جميع الضمائر الثمانية الواردة في المصدر، مع نطق تفاعلي.</p><div class="grid">${d.pronouns.map(wordCard).join('')}</div><button class="btn" onclick="setProgress(20)">✓ أنجزت المفردات</button>`;return`<h2>🖼️ المفردات</h2><div class="goal">يتم عرض المحتوى الموثق للدرس كاملًا مع النطق والسياق.</div>`}
function pron(){if(d===L3)return`<h2>🎧 مختبر النطق</h2><div class="grid">${d.pronouns.map(v=>`<article class="card"><div class="big">${esc(v[0])}</div><button class="btn" onclick='say(${JSON.stringify(v[0])})'>🔊 اسمع</button></article>`).join('')}</div><button class="btn" onclick="setProgress(35)">✓ أتممت التدريب</button>`;return`<h2>🎧 النطق</h2><div class="goal">اسمع، كرر، ثم أعد المحاولة.</div>`}
function grammar(){if(d===L3)return`<h2>📘 القاعدة ببساطة</h2><div class="goal"><b>أفعال المجموعة الأولى (-er):</b> نحذف <b>er</b> من نهاية المصدر، ثم نضيف النهاية المناسبة حسب الضمير.</div><div class="rule">${[['Je','e'],['Tu','es'],['Il/Elle','e'],['Nous','ons'],['Vous','ez'],['Ils/Elles','ent']].map(x=>`<span>${x[0]} → ${x[1]}</span>`).join('')}</div><div class="card"><div class="fr">parler → je parle · tu parles · nous parlons · vous parlez · ils parlent</div><button class="btn" onclick='say("Je parle. Tu parles. Nous parlons. Vous parlez. Ils parlent.")'>🔊 استمع</button></div><button class="btn" onclick="setProgress(50)">✓ فهمت القاعدة</button>`;return`<h2>📘 القواعد</h2><div class="goal">إثراء لغوي مرتبط مباشرة بهدف الدرس.</div>`}
function convo(){if(d===L3)return`<h2>💬 المحادثة — إثراء</h2><div class="goal">هذا تدريب محادثة إضافي، وليس حوارًا من المصدر. نستخدم لغة الدرس فقط.</div><div class="dialog">👩 Élève : Je parle français. <button class="btn secondary" onclick='say("Je parle français")'>🔊</button></div><div class="dialog">👨 Professeur : Tu parles français ? <button class="btn secondary" onclick='say("Tu parles français")'>🔊</button></div><button class="btn" onclick="setProgress(60)">🎭 أتممت Role Play</button>`;return`<h2>💬 المحادثة</h2><div class="goal">تدريب تفاعلي مرتبط بمفردات الدرس.</div>`}
function practice(){if(d===L3)return`<h2>✍️ Complète avec la bonne forme du verbe</h2>${d.fill.map((x,i)=>`<div class="card"><b>${esc(x[0])}</b><br><span class="small">(${esc(x[1])})</span><br><input class="input" id="f${i}" placeholder="..."> <button class="btn" onclick="fillAns(${i})">✓ Vérifier</button><span id="r${i}"></span></div>`).join('')}`;return`<h2>✍️ التدريب</h2><div class="goal">تدريب متدرج مع Feedback وإعادة المحاولة.</div>`}
function fillAns(i){let x=d.fill[i],v=document.getElementById('f'+i).value.trim().toLowerCase(),r=document.getElementById('r'+i);r.textContent=v===x[2].toLowerCase()?' ✅ صحيح!':' ❌ الصحيح: '+x[2];if(v===x[2].toLowerCase())setProgress(70)}
function video(){return`<h2>🎬 الفيديو</h2><div class="goal">يُعرض فيديو المصدر الأصلي عند توفر الـasset الموثق. لا نضع رابطًا وهميًا.</div>`}
function games(){if(d===L3)return`<h2>🎮 لعبة الضمير</h2><div class="goal">استبدل الاسم بالضمير الصحيح.</div>${d.replace.map((x,i)=>`<div class="card"><b>${esc(x[0])}</b> — ${esc(x[1])}<div class="opts">${x[3].map(o=>`<button class="opt" onclick="rep(this,'${o}','${x[2]}')">${o}</button>`).join('')}</div></div>`).join('')}`;return`<h2>🎮 لعبة مرتبطة بالمهارة</h2><div class="goal">اللعبة تتغير حسب طبيعة الدرس.</div>`}
function rep(b,a,c){b.classList.add(a===c?'good':'bad');if(a===c){b.textContent+=' ✓';setProgress(80)}}
function smart(){return`<h2>🧠 المراجعة الذكية</h2><div class="goal">نراجع المهارة التي تحتاج إلى تحسين بدل إعادة كل المحتوى.</div><button class="btn" onclick="go('grammar')">راجع القاعدة</button><button class="btn secondary" onclick="go('practice')">أعد التدريب</button>`}
function assess(){if(d===L3)return`<h2>🏆 Vérifie-toi !</h2>${d.quiz.map((x,i)=>`<div class="card"><b>${i+1}. ${esc(x[0])}</b><div class="opts">${x[1].map((o,j)=>`<button class="opt" onclick="quiz(this,${j===x[2]},'${esc(x[3])}')">${esc(o)}</button>`).join('')}</div><div id="q${i}"></div></div>`).join('')}`;return`<h2>🏆 التقييم</h2><div class="goal">التقييم الرسمي للمصدر هو المرجع الأساسي.</div>`}
function quiz(b,ok,a){b.classList.add(ok?'good':'bad');b.parentElement.nextElementSibling.textContent=ok?'✓ أحسنت!':'✗ حاول مرة أخرى.';if(ok){say(a);setProgress(90)}}
function progress(){let n=Number(localStorage.getItem(key())||0);return`<h2>📈 تقدمك</h2><div class="goal">${n>=100?'🎉 أحسنت! أكملت الدرس.':'أكملت '+n+'% من رحلة الدرس.'}<br><br>المهارات: المفردات · النطق · القواعد · المحادثة · التدريب</div><button class="btn" onclick="finish()">تأكيد الإكمال</button>`}
const V={introduction:intro,vocabulary:vocab,pronunciation:pron,grammar,conversation:convo,practice,video,games,'smart-review':smart,assessment:assess,progress};
fetch('data/lessons/grade-7/grade7-source-content.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{let src=x.lessons.find(z=>z.id===id);if(!src)throw Error('lesson');d=lessons[id]||src;title.textContent=d.titleAr+' · '+d.titleFr;nav();panel.innerHTML=(V[sec]||intro)();status()}).catch(()=>{if(id==='grade7-u1-l3'){d=L3;title.textContent=d.titleAr+' · '+d.titleFr;nav();panel.innerHTML=(V[sec]||intro)();status()}else panel.innerHTML='<div class="goal">تعذر تحميل بيانات الدرس.</div>'});
</script></body></html>
