<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | الصف الأول الإعدادي</title><style>body{margin:0;background:#f4f7fb;color:#16213e;font-family:Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:12px}.hero,.panel,.progress{background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 8px 28px #14264a12}.hero{color:#fff;background:linear-gradient(135deg,#173a82,#2563eb,#0f9f91)}h1{margin:8px 0;line-height:1.35}.tabs{display:flex;gap:7px;overflow:auto;flex-wrap:wrap;padding:4px 0}.tabs a,.btn,.opt{border:0;border-radius:11px;padding:10px 13px;text-decoration:none;font-weight:800;background:#edf2fb;color:#173a82;white-space:nowrap;cursor:pointer}.tabs a.on,.btn{background:#2563eb;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.card{background:#fff;border:1px solid #dfe6f1;border-radius:16px;padding:14px}.source{border-right:5px solid #0f9f91}.enrich{border-right:5px solid #e92d83}.fr{direction:ltr;text-align:center;font-size:21px;font-weight:900}.ar{text-align:center;color:#315aa4;margin-top:6px;font-weight:800}.notice{padding:13px;border-radius:12px;background:#fff8e8;border-right:4px solid #f59e0b;line-height:1.8}.ok{padding:13px;border-radius:12px;background:#eefbf3;border-right:4px solid #21a366}.small,.muted{font-size:13px;color:#68758d;line-height:1.8}.qbox{background:#fff;border:1px solid #dfe6f1;border-radius:15px;padding:14px;margin:10px 0}.opts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.result{margin-top:9px;font-weight:800}.vocab-card{overflow:hidden;padding:0}.vocab-visual{min-height:110px;display:grid;place-items:center;background:#f7faff;border-bottom:1px solid #e1e8f3}.vocab-icon{font-size:60px}.vocab-body{padding:13px;text-align:center}.vocab-actions{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:9px}.section-lead{background:#f7faff;border:1px solid #dfe8f5;border-radius:14px;padding:13px;line-height:1.9;margin:10px 0}@media(max-width:560px){.wrap{padding:9px}.hero,.panel,.progress{border-radius:17px;padding:13px}.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><section class="hero"><div>🇫🇷 HM Academy · الصف الأول الإعدادي</div><h1 id="title">جاري التحميل…</h1><div id="goal"></div></section><nav class="tabs" id="tabs"></nav><main class="panel" id="panel"><div class="notice">جاري تجهيز محتوى الدرس…</div></main><section class="progress"><b>📈 تقدم الرحلة</b><div id="progressText" class="small"></div></section></div><script>
const STAGES=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];
const IDS=['grade7-u1-l1','grade7-u1-l2','grade7-u1-l3','grade7-u1-l4','grade7-u1-l5','grade7-u1-l6','grade7-u2-l1','grade7-u2-l2','grade7-u3-l1','grade7-u3-l2','grade7-u3-l3'];
const q=new URLSearchParams(location.search);const id=q.get('id')||'grade7-u1-l1';const section=q.get('section')||'introduction';
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const speak=t=>{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t));u.lang='fr-FR';speechSynthesis.speak(u)};
const fallback={id:'grade7-u1-l1',titleFr:"L'alphabet, les voyelles et les mots transparents",titleAr:'الأبجدية والحروف المتحركة والكلمات الشفافة',grade:'grade-7',journeyContent:{introduction:{goal:'في هذا الدرس نتعرف إلى الأبجدية الفرنسية، نميز الحروف المتحركة، ثم نكتشف الكلمات الشفافة التي تساعدنا على فهم كلمات مألوفة.',learningPath:['أرى الحرف','أسمع النطق','أميز الحرف المتحرك','أكتشف الكلمة الشفافة','أطبق وأتحقق من إجابتي']},vocabulary:{items:[['A','arbre','شجرة','A comme arbre'],['E','éléphant','فيل','E comme éléphant'],['I','image','صورة','I comme image'],['O','orange','برتقالة','O comme orange'],['U','uniforme','زي مدرسي','U comme uniforme'],['Y','yoyo','يويو'],['Un téléphone','تليفون'],['Une guitare','جيتار'],['Un cinéma','سينما'],['Un taxi','تاكسي'],['Un autobus','أوتوبيس']]},pronunciation:{items:'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')},grammar:{title:'Comment reconnaître un mot transparent ?',explanation:'نبحث عن كلمة فرنسية تشبه كلمة نعرفها، ثم نتحقق من النطق والمعنى. التشابه وسيلة للاكتشاف وليس بديلًا عن الاستماع.'},conversation:{prompts:['A comme arbre.','E comme éléphant.','Un téléphone.','Une guitare.','Un cinéma.']},smartReview:{targets:['alphabet','vowels','transparent words']}},embeddedPractice:[{q:'ما الحرف المتحرك الذي تبدأ به كلمة «éléphant»؟',options:['A','E','O'],answer:'E',reason:'كلمة «éléphant» تبدأ بالحرف E، وهو من الحروف المتحركة.'},{q:'اختر الكلمة الشفافة الصحيحة لـ «تليفون»',options:['Un taxi','Un téléphone','Un piano'],answer:'Un téléphone',reason:'Un téléphone تشبه كلمة «تليفون» في الشكل والمعنى.'},{q:'أي مجموعة تحتوي على الحروف المتحركة فقط؟',options:['A – E – I','B – C – D','M – N – P'],answer:'A – E – I',reason:'A وE وI حروف متحركة.'},{q:'ما معنى «Une guitare»؟',options:['جيتار','راديو','كاميرا'],answer:'جيتار',reason:'Une guitare كلمة شفافة يمكن التعرف إليها من تشابهها مع «جيتار».'},{q:'أي كلمة شفافة تناسب «سينما»؟',options:['Un cinéma','Un garage','Un journal'],answer:'Un cinéma',reason:'Un cinéma تشبه «سينما» في الشكل والمعنى.'},{q:'أي كلمة تعني «أوتوبيس»؟',options:['Un autobus','Un balcon','Un bouquet'],answer:'Un autobus',reason:'Un autobus تعني أوتوبيس.'}]};
const visuals={'A':'🌳','E':'🐘','I':'🖼️','O':'🍊','U':'👕','Y':'🪀','Un téléphone':'📱','Une guitare':'🎸','Un cinéma':'🎬','Un taxi':'🚕','Un autobus':'🚌','Un piano':'🎹'};
let data=null;
function unwrap(x){for(let i=0;i<6&&x&&typeof x.content==='string';i++){try{x=JSON.parse(x.content)}catch{return null}}return x}
async function loadData(){if(!IDS.includes(id))throw Error('lesson');const m=id.match(/u(\d+)-l(\d+)/);const path=`data/lessons/grade-7/unit-${m[1]}/lesson-${m[2]}.json`;for(const u of [new URL(path,document.baseURI).href,'https://raw.githubusercontent.com/hm-french-academy/hm-french-academy/main/'+path]){try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)continue;const d=unwrap(JSON.parse(await r.text()));if(d&&d.id===id&&d.grade==='grade-7')return d}catch(e){}}if(id==='grade7-u1-l1')return fallback;throw Error('تعذر الوصول إلى بيانات الدرس')}
function items(){const v=data?.journeyContent?.vocabulary?.items;if(Array.isArray(v)&&v.length)return v;return []}
function card(x){const fr=Array.isArray(x)?x[0]:x,ar=Array.isArray(x)?x[x.length>2?2:1]:'',ex=Array.isArray(x)&&x.length>3?x[3]:'';return `<article class="card vocab-card"><div class="vocab-visual"><div class="vocab-icon">${visuals[fr]||'🇫🇷'}</div></div><div class="vocab-body"><div class="fr">${esc(fr)}</div>${ex?`<div>${esc(ex)}</div>`:''}<div class="ar">${esc(ar)}</div><div class="vocab-actions"><button class="btn" onclick='speak(${JSON.stringify(String(fr))})'>🔊 استمع</button></div></div></article>`}
function list(a){return `<div class="grid">${(a||[]).map(x=>`<div class="card">${esc(Array.isArray(x)?x.join(' — '):x)}</div>`).join('')}</div>`}
function renderPractice(){const qs=data.embeddedPractice||[];return `<div class="card enrich"><h2>✍️ التدريب</h2><p class="muted">أجب ثم ستظهر لك الإجابة الصحيحة والسبب.</p>${qs.map((x,i)=>`<div class="qbox"><b>${i+1}. ${esc(x.q)}</b><div class="opts">${x.options.map(o=>`<button class="opt" data-q="${i}" data-a="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="r${i}" class="result"></div></div>`).join('')}</div>`}
function bindPractice(){panel.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.q),x=(data.embeddedPractice||[])[i],ok=b.dataset.a===x.answer;const r=$('r'+i);r.innerHTML=ok?`<span class="ok">✅ إجابة صحيحة<br>${esc(x.reason)}</span>`:`<span class="notice">❌ الإجابة الصحيحة: <b>${esc(x.answer)}</b><br>${esc(x.reason)}</span>`})}
function renderGames(){const pool=items().filter(Array.isArray).map(x=>String(x[0]));const answer=pool[0]||'Un taxi';const opts=[answer,...pool.filter(x=>x!==answer).slice(0,2)].sort(()=>Math.random()-.5);panel.innerHTML=`<div class="card enrich"><h2>🎮 لعبة الدرس</h2><p>اختر الكلمة المطابقة لـ <b>${esc(answer)}</b>:</p><div class="grid">${opts.map(o=>`<button class="card opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="gameResult" class="result"></div></div>`;panel.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{gameResult.innerHTML=b.dataset.v===answer?'✅ إجابة صحيحة':'❌ حاول مرة أخرى'})}
function render(){const jc=data.journeyContent||{};if(section==='introduction')return `<div class="card source"><h2>🚀 بداية الدرس</h2><p>${esc(data.titleAr||'')}</p><div class="section-lead">${esc(jc.introduction?.goal||'تعرف على أهداف الدرس.')}</div>${list(jc.introduction?.learningPath||[])}</div>`;if(section==='vocabulary')return `<div class="card source"><h2>🖼️ المفردات</h2><p class="muted">بطاقات بصرية مع المعنى والنطق.</p><div class="grid">${items().map(card).join('')}</div></div>`;if(section==='pronunciation'){const p=Array.isArray(jc.pronunciation?.items)?jc.pronunciation.items:'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');return `<div class="card source"><h2>🎧 النطق</h2><p>اضغط للاستماع إلى النطق الفرنسي.</p><div class="grid">${p.map(x=>card(x)).join('')}</div></div>`}if(section==='grammar')return `<div class="card enrich"><h2>📘 ${esc(jc.grammar?.title||'القواعد')}</h2><div class="section-lead">${esc(jc.grammar?.explanation||'')}</div></div>`;if(section==='conversation')return `<div class="card source"><h2>💬 المحادثة</h2><p>استمع وردد الجمل التالية:</p>${list(jc.conversation?.prompts||[])}</div>`;if(section==='practice')return renderPractice();if(section==='video')return `<div class="card source"><h2>🎬 الفيديو</h2><div class="notice">محتوى الفيديو سيظهر هنا عند توفر رابط الفيديو الخاص بالدرس.</div></div>`;if(section==='games')return '';if(section==='smart-review')return `<div class="card enrich"><h2>🧠 المراجعة الذكية</h2><p>راجع أهداف الدرس الأساسية:</p>${list(jc.smartReview?.targets||[])}</div>`;if(section==='assessment')return `<div class="card enrich"><h2>🏆 التقييم</h2><p>أكمل التدريب أولًا، ثم انتقل إلى التقييم النهائي.</p><div class="section-lead">التقييم مبني على مفردات الدرس والحروف المتحركة والكلمات الشفافة.</div></div>`;if(section==='progress')return `<div class="card source"><h2>📈 تقدم الرحلة</h2><p>أنت الآن في مرحلة: <b>${esc(STAGES.find(s=>s[0]===section)?.[1]||section)}</b></p></div>`;return `<div class="notice">هذا القسم غير متاح.</div>`}
function renderTabs(){tabs.innerHTML=STAGES.map(([k,label])=>`<a class="${k===section?'on':''}" href="?id=${encodeURIComponent(id)}&section=${encodeURIComponent(k)}">${label}</a>`).join('')}
async function init(){try{data=await loadData();title.textContent=data.titleFr||data.titleAr||'درس الصف الأول الإعدادي';goal.textContent=data.journeyContent?.introduction?.goal||'';renderTabs();if(section==='games'){renderGames()}else{panel.innerHTML=render();if(section==='practice')bindPractice()}progressText.textContent=`الدرس: ${data.titleAr||data.titleFr||id} · القسم الحالي: ${STAGES.find(s=>s[0]===section)?.[1]||section}`;}catch(e){console.error(e);panel.innerHTML=`<div class="notice"><b>تعذر تحميل محتوى هذا الدرس.</b><br>${esc(e.message||'حدث خطأ غير متوقع.')}</div>`}}
init();
</script></body></html>
