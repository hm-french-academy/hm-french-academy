<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HM Academy | الصف الأول الإعدادي</title>
<style>
:root{--navy:#173a82;--blue:#2563eb;--teal:#0f9f91;--pink:#e92d83;--bg:#f4f7fb;--ink:#16213e;--muted:#68758d;--line:#dfe6f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans Arabic",sans-serif}.wrap{max-width:1180px;margin:auto;padding:12px}.hero{background:linear-gradient(135deg,var(--navy),var(--blue),var(--teal));color:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 30px #0002}.eyebrow{font-size:13px;opacity:.9}.hero h1{margin:8px 0;font-size:clamp(24px,5vw,38px)}.hero p{margin:0;line-height:1.8}.lessonbar,.tabs,.panel,.progressbox{background:#fff;border-radius:20px;padding:12px;margin:11px 0;box-shadow:0 5px 20px #0000000b}.lessonbar,.tabs{display:flex;gap:7px;overflow:auto}.lessonbar a,.tab,.filebtn{border:0;border-radius:11px;padding:10px 12px;background:#edf2fb;color:var(--navy);text-decoration:none;font-weight:800;white-space:nowrap;cursor:pointer}.lessonbar a.on,.tab.on{background:var(--blue);color:#fff}.filebtn{background:var(--pink);color:#fff}.panel{min-height:520px;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}.card{border:1px solid var(--line);border-radius:16px;padding:15px;background:#fff}.source{border-right:5px solid var(--teal)}.enrich{border-right:5px solid var(--pink)}.fr{direction:ltr;text-align:center;font-size:21px;font-weight:900}.ar{text-align:center;color:#315aa4;margin-top:6px}.btn,.opt{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.btn{background:var(--blue);color:#fff}.secondary{background:#edf2fb;color:var(--navy)}.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.opt{background:#f7f9fd;border:1px solid var(--line)}.good{background:#e9f9ef!important;border-color:#20a464!important}.bad{background:#fff0f2!important;border-color:#d33!important}.notice{padding:12px;background:#fff8e8;border-right:4px solid #f59e0b;border-radius:10px;line-height:1.8}.ok{padding:12px;background:#eefbf3;border-right:4px solid #21a366;border-radius:10px;line-height:1.8}.rule{display:flex;flex-wrap:wrap;gap:8px}.rule span{background:#edf2fb;color:var(--navy);padding:9px 11px;border-radius:9px;font-weight:800}.small{font-size:13px;color:var(--muted);line-height:1.8}.timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.stage{padding:11px;border-radius:12px;background:#f7f9fd;border:1px solid #e1e7f0}.done{border-color:#21a366;background:#eefbf3}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.bar{height:9px;background:#e5eaf2;border-radius:9px;overflow:hidden}.fill{height:100%;background:var(--blue);width:0;transition:.25s}.filegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.file{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fafcff}.file code{display:block;direction:ltr;text-align:left;word-break:break-word;margin-top:7px;color:#40516f}.tag{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800;background:#eef2f8;color:#4a5870}
</style>
</head>
<body><div class="wrap">
<section class="hero"><div class="eyebrow">🇫🇷 HM Academy · Learning Studio · الصف الأول الإعدادي</div><h1 id="title">جاري التحميل…</h1><p id="goal"></p><div class="actions"><a id="filesLink" class="filebtn" href="#">📁 ملفات الدرس</a></div></section>
<div class="lessonbar" id="lessons"></div><nav class="tabs" id="tabs"></nav><main id="panel" class="panel"></main>
<section class="progressbox"><b>📈 تقدم الرحلة</b><div class="small" id="state"></div><div class="bar"><div id="fill" class="fill"></div></div><div class="actions"><button class="btn secondary" onclick="resetLesson()">إعادة تقدم الدرس</button></div></section>
</div>
<script>
const STAGES=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];
const LESSONS=[['grade7-u1-l1','L’alphabet et les mots transparents','الأبجدية والكلمات الشفافة'],['grade7-u1-l2','Les salutations','التحيات'],['grade7-u1-l3','Les pronoms sujets et les verbes du 1er groupe','ضمائر الفاعل وأفعال المجموعة الأولى'],['grade7-u1-l4','Le verbe être et la présentation','فعل être والتقديم'],['grade7-u1-l5','Les nombres (0-20)','الأعداد 0–20'],['grade7-u1-l6','L’heure','الساعة'],['grade7-u2-l1','Tu as quel âge ?','كم عمرك؟'],['grade7-u2-l2','Qu’est-ce que c’est ? Les objets de la classe','ما هذا؟ أدوات الفصل'],['grade7-u3-l1','Les couleurs','الألوان'],['grade7-u3-l2','Les articles définis et les jours de la semaine','أدوات المعرفة وأيام الأسبوع'],['grade7-u3-l3','Les mois de l’année et les saisons','شهور السنة والفصول']];
const PATHS={'grade7-u1-l1':'data/lessons/grade-7/unit-1/lesson-1.json','grade7-u1-l2':'data/lessons/grade-7/unit-1/lesson-2.json','grade7-u1-l3':'data/lessons/grade-7/unit-1/lesson-3.json','grade7-u1-l4':'data/lessons/grade-7/unit-1/lesson-4.json','grade7-u1-l5':'data/lessons/grade-7/unit-1/lesson-5.json','grade7-u1-l6':'data/lessons/grade-7/unit-1/lesson-6.json','grade7-u2-l1':'data/lessons/grade-7/unit-1/lesson-7.json','grade7-u2-l2':'data/lessons/grade-7/unit-1/lesson-8.json','grade7-u3-l1':'data/lessons/grade-7/unit-1/lesson-9.json','grade7-u3-l2':'data/lessons/grade-7/unit-1/lesson-10.json','grade7-u3-l3':'data/lessons/grade-7/unit-1/lesson-11.json'};
const fallback={'grade7-u1-l1':{goal:'التعرف على الأبجدية والحروف المتحركة والكلمات الشفافة.',sourceSections:["L'alphabet français","Les voyelles","Les mots transparents (1)","Les mots transparents (2)","Vérifie-toi !","Vidéo complémentaire"],journeyContent:{vocabulary:{items:[["A","arbre — شجرة"],["E","éléphant — فيل"],["I","image — صورة"],["O","orange — برتقالة"],["U","uniforme — زي مدرسي"],["Y","yoyo — يويو"],["H","hôpital — مستشفى"],["Un pyjama","بيجاما"],["Un pantalon","بنطلون"],["Un taxi","تاكسي"],["Un domino","دومينو"],["Un canapé","كنبة"],["Un téléphone","تليفون"],["Un biscuit","بسكويت"],["Un balcon","بلكونة"],["Un vase","فازة"],["Un ascenseur","أسانسير"],["Une caméra","كاميرا"],["Un autobus","أوتوبيس"],["Un gilet","جيلية"],["Une écharpe","إيشارب"],["Un bouquet","باقة ورد"],["Une guitare","جيتار"],["Une télévision","تليفزيون"],["Une plage","شاطئ"],["Une lampe","لمبة"],["Une raquette","مضرب"],["Une radio","راديو"],["Un piano","بيانو"],["Un garage","جراج"],["Un cinéma","سينما"],["Un journal","جورنال"]]},pronunciation:{items:["A","E","I","O","U","Y","H","Un pyjama","Un téléphone","Une guitare"]},grammar:{mode:'not-applicable',notes:[]},conversation:{sourcePreserved:[]},practice:{sourceTasks:["Vérifie-toi !"]},games:["alphabet recognition","vowel sorting","transparent-word matching"],smartReview:{targets:["alphabet","vowels","transparent words"]},assessment:{source:'official assessment + secure quiz'}},sourceFiles:{interactive:'Leçon_1/lesson1_interactive.html',reference:'Leçon_1/lesson1_reference.pdf',assessment:'Leçon_1/lesson1_assessment.pdf',quiz:'Leçon_1/lesson1_quiz_secure.html'}},'grade7-u1-l2':{goal:'تمييز التحيات الفرنسية واختيار التعبير المناسب حسب الموقف.'}};
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';speechSynthesis.speak(u)}}function params(){const q=new URLSearchParams(location.search);return[q.get('id')||'grade7-u1-l1',q.get('section')||'introduction']}function storage(id,s){return 'hm-g7-v3:'+id+':'+s}function done(id,s){return localStorage.getItem(storage(id,s))==='1'}function mark(id,s){localStorage.setItem(storage(id,s),'1')}
function nav(id,s){document.getElementById('lessons').innerHTML=LESSONS.map((x,i)=>`<a class="${x[0]===id?'on':''}" href="?id=${encodeURIComponent(x[0])}&section=${encodeURIComponent(s)}">الدرس ${i+1}</a>`).join('');document.getElementById('tabs').innerHTML=STAGES.map(x=>`<a class="tab ${x[0]===s?'on':''}" href="?id=${encodeURIComponent(id)}&section=${encodeURIComponent(x[0])}">${x[1]}</a>`).join('')}
function cards(items){return `<div class="grid">${(items||[]).map(x=>{const a=Array.isArray(x)?x:[x,''];return `<article class="card"><div class="fr">${esc(a[0])}</div>${a[1]?`<div class="ar">${esc(a[1])}</div>`:''}<button class="btn" onclick='speak(${JSON.stringify(String(a[0]))})'>🔊 استمع</button></article>`}).join('')}</div>`}
function list(items){return `<div class="grid">${(items||[]).map(x=>`<article class="card">${esc(x)}</article>`).join('')}</div>`}
function quiz(items){return `<div>${(items||[]).map((q,i)=>`<article class="card" style="margin-top:10px"><b>${i+1}. ${esc(q.q||q[0]||'')}</b><div class="opts">${(q.options||q[2]||[]).map(o=>`<button class="opt" onclick="answer(this,${JSON.stringify(o===((q.answer)||q[1]))})">${esc(o)}</button>`).join('')}</div></article>`).join('')}</div>`}
function answer(el,good){el.parentElement.querySelectorAll('.opt').forEach(x=>x.disabled=true);el.classList.add(good?'good':'bad')}
function filesView(data){const files=data?.sourceFiles||{};const entries=Object.entries(files);return `<div class="card source"><h2>📁 ملفات الدرس</h2><p>المصادر مرتبطة بالدرس الحالي فقط. لا يوجد تحويل تلقائي إلى الصف الثاني الإعدادي.</p>${entries.length?`<div class="filegrid">${entries.map(([k,v])=>`<div class="file"><span class="tag">${esc(k)}</span><code>${esc(v)}</code><div class="small">مرجع المصدر محفوظ في بيانات الدرس؛ لا يتم إنشاء رابط خارجي وهمي إذا لم يكن الملف منشورًا كـ asset.</div></div>`).join('')}</div>`:'<div class="notice">لا توجد قائمة ملفات مصدر مسجلة لهذا الدرس.</div>'}</div>`}
function renderSection(id,s,data){const jc=data?.journeyContent||{};if(s==='files')return filesView(data);if(s==='introduction')return `<div class="card source"><h2>🚀 بداية الدرس</h2><h3>${esc(data?.titleFr||'')}</h3><p>${esc(data?.titleAr||'')}</p><p>${esc(data?.goal||data?.journeyConfig?.introduction?.goal||'')}</p><div class="ok">الصفحة مرتبطة بمعرف <b>${esc(id)}</b> داخل الصف الأول الإعدادي فقط.</div>${(data?.sourceSections||[]).length?`<h3>مكونات المصدر</h3>${list(data.sourceSections)}`:''}</div>`;if(s==='vocabulary'){const items=jc.vocabulary?.items||[];return items.length?cards(items):list(data?.sourceAtoms||[])}if(s==='pronunciation'){const items=jc.pronunciation?.items||[];return items.length?cards(items):`<div class="notice">لا توجد عناصر نطق مسجلة في بيانات هذا الدرس. لن نضع مادة من درس آخر.</div>`}if(s==='grammar'){if(jc.grammar?.mode==='not-applicable'||data?.journeyConfig?.grammar?.enabled===false)return `<div class="notice"><b>القواعد غير مطلوبة في هذا الدرس كمحور مستقل.</b><br>تم منع إنشاء قواعد مصطنعة للحفاظ على المصدر.</div>`;return `<div class="card enrich"><h2>📘 القواعد</h2>${list(jc.grammar?.notes||data?.journeyConfig?.grammar?.notes||[])}<p class="small">أي ملاحظة هنا إثراء تعليمي وليست نصًا منسوبًا للمصدر.</p></div>`}if(s==='conversation'){const src=jc.conversation?.sourcePreserved||[];const enr=jc.conversation?.enrichment||[];return `<div class="card source"><h2>💬 الحوار الأصلي</h2>${src.length?list(src):'<div class="notice">لا يوجد حوار مستقل مسجل لهذا الدرس.</div>'}</div>${enr.length?`<div class="card enrich"><h3>إثراء تفاعلي</h3>${list(enr)}</div>`:''}`}if(s==='practice'){const tasks=jc.practice?.sourceTasks||data?.sourceActivities||[];const enr=jc.practice?.enrichment||[];return `<div class="card source"><h2>✍️ التدريب</h2>${list(tasks)}</div>${enr.length?`<div class="card enrich"><h3>تدريبات إثرائية</h3>${list(enr)}</div>`:''}${data?.embeddedPractice?quiz(data.embeddedPractice):''}`}if(s==='video')return `<div class="card source"><h2>🎬 الفيديو</h2><div class="ok">سيتم تشغيل أصل الفيديو فقط عندما يكون الـasset منشورًا وقابلًا للوصول. لا يوجد رابط وهمي أو تحويل إلى درس آخر.</div>${data?.sourceFiles?.interactive?`<p class="small">مرجع المصدر: <code>${esc(data.sourceFiles.interactive)}</code></p>`:''}</div>`;if(s==='games'){const g=jc.games||data?.journeyConfig?.games?.games||[];return `<div class="card enrich"><h2>🎮 مركز الألعاب</h2><p>الألعاب مرتبطة بمعرف الدرس الحالي: <b>${esc(id)}</b>.</p>${g.length?list(g):'<div class="notice">لا توجد ألعاب مسجلة لهذا الدرس بعد.</div>'}</div>`}if(s==='smart-review'){const t=jc.smartReview?.targets||[];return `<div class="card enrich"><h2>🧠 المراجعة الذكية</h2><p>المراجعة الذكية خارج دخول الدرس كما هو معتمد في النظام.</p>${t.length?list(t):'<div class="notice">سيتم بناء أهداف المراجعة من أخطاء الطالب والعناصر الموثقة عند توفرها.</div>'}</div>`}if(s==='assessment'){const a=jc.assessment||{};const fa=data?.formalAssessment;return `<div class="card source"><h2>🏆 التقييم</h2><p>${esc(a.source||'التقييم المعتمد للمصدر')}</p>${fa?.sourceDeclaredTotal?`<div class="ok">إجمالي المصدر المعلن: <b>${esc(fa.sourceDeclaredTotal)}</b> درجة.</div><h3>هيكل التقييم الأصلي</h3>${list((fa.sourceExerciseStructure||[]).map(x=>x.title))}`:''}</div>`}if(s==='progress'){const n=STAGES.filter(x=>done(id,x[0])).length;return `<div class="card"><h2>📈 التقدم</h2><p>أكملت <b>${n}</b> من ${STAGES.length} مراحل.</p>${STAGES.map(x=>`<div class="stage ${done(id,x[0])?'done':''}">${done(id,x[0])?'✓':'○'} ${x[1]}</div>`).join('')}</div>`}return ''}
async function loadLesson(id){try{const r=await fetch(PATHS[id],{cache:'no-store'});if(!r.ok)throw 0;return await r.json()}catch(e){return fallback[id]||null}}
async function render(){const [id,s]=params();const meta=LESSONS.find(x=>x[0]===id)||LESSONS[0];const data=await loadLesson(meta[0]);if(!data){document.getElementById('panel').innerHTML='<div class="notice">تعذر تحميل بيانات الدرس. لم يتم استبدالها بمحتوى من الصف الثاني الإعدادي.</div>';return}data.titleFr=data.titleFr||meta[1];data.titleAr=data.titleAr||meta[2];document.getElementById('title').textContent=data.titleFr+' — '+data.titleAr;document.getElementById('goal').textContent=data.goal||data.journeyConfig?.introduction?.goal||'منهج الصف الأول الإعدادي';document.getElementById('filesLink').href=`?id=${encodeURIComponent(meta[0])}&section=files`;nav(meta[0],s);document.getElementById('panel').innerHTML=renderSection(meta[0],s,data);if(s!=='files')mark(meta[0],s);updateProgress(meta[0])}
function updateProgress(id){const n=STAGES.filter(x=>done(id,x[0])).length;document.getElementById('state').textContent=`${n} / ${STAGES.length} مراحل مكتملة · ${Math.round(n/STAGES.length*100)}%`;document.getElementById('fill').style.width=(n/STAGES.length*100)+'%'}function resetLesson(){const [id]=params();STAGES.forEach(x=>localStorage.removeItem(storage(id,x[0])));render()}render();
</script></body></html>
