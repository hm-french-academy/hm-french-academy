<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="HM Academy — الاستوديو التعليمي المستقل للصف الأول الإعدادي">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>HM Academy | الصف الأول الإعدادي</title>
<style>
:root{--nav:#173a82;--blue:#2563eb;--teal:#0f9f91;--ink:#14213d;--muted:#667085;--bg:#f4f7fb;--card:#fff;--line:#e4e9f2;--good:#087443;--bad:#b42318;--gold:#b7791f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans Arabic",sans-serif;line-height:1.7}.wrap{max-width:1120px;margin:auto;padding:12px}.hero{background:linear-gradient(135deg,var(--nav),#2563eb,var(--teal));color:#fff;border-radius:24px;padding:22px 20px;box-shadow:0 12px 35px #173a8220}.hero-top{display:flex;justify-content:space-between;gap:15px;align-items:center}.eyebrow{font-weight:800;opacity:.9}.hero h1{margin:6px 0 2px;font-size:clamp(23px,4vw,38px);line-height:1.25}.hero .fr{direction:ltr;text-align:right;font-weight:800;opacity:.92}.hero p{margin:8px 0 0;opacity:.94}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;background:#ffffff20;border:1px solid #ffffff40;font-size:13px;font-weight:800;white-space:nowrap}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;margin-top:12px;padding:15px;box-shadow:0 6px 24px #173a820b}.stagebar{display:flex;gap:7px;overflow:auto;padding-bottom:2px;scrollbar-width:thin}.stagebar a{flex:0 0 auto;text-decoration:none;color:var(--nav);background:#eef3fb;border:1px solid #e0e7f4;border-radius:999px;padding:8px 12px;font-weight:800;font-size:14px}.stagebar a.on{background:var(--blue);border-color:var(--blue);color:#fff}.crumb{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.source{font-size:12px;color:var(--muted)}h2{margin:5px 0 12px;font-size:24px}.lead{font-size:17px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}.grid.wide{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.card{border:1px solid var(--line);border-radius:16px;padding:13px;background:#fff}.card h3{margin:0 0 7px;font-size:18px}.fr{direction:ltr;text-align:center;font-size:22px;font-weight:900}.ar{text-align:center;color:#315aa4;font-weight:800}.muted{color:var(--muted)}.note{padding:12px 13px;border-radius:13px;background:#f8fafc;border-right:4px solid #94a3b8;margin:10px 0}.enriched{background:#f0fdfa;border-right-color:var(--teal)}.sourcebox{background:#fffaf0;border-right:4px solid #e3a008;padding:12px;border-radius:13px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.btn{border:0;border-radius:11px;padding:9px 12px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#eef3fb;color:var(--nav)}.btn.good{background:#087443}.btn:disabled{opacity:.55;cursor:default}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2f7;font-size:12px;font-weight:800;margin:2px}.progress{height:10px;background:#e8edf5;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));width:0}.feedback{min-height:26px;margin-top:7px;font-weight:800}.ok{color:var(--good)}.bad{color:var(--bad)}.q{margin:10px 0}.options{display:grid;gap:7px;margin-top:8px}.options button{text-align:right;background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:10px;font-weight:700;cursor:pointer}.options button:hover{border-color:#9bb5e8}.table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid var(--line);border-radius:13px}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:center}.table th{background:#f7f9fc}.table tr:last-child td{border-bottom:0}.footer{padding:12px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:650px){.wrap{padding:7px}.hero{border-radius:18px;padding:17px 14px}.hero-top{align-items:flex-start}.badge{font-size:11px}.panel{border-radius:16px;padding:12px}.grid,.grid.wide{grid-template-columns:1fr}.stagebar a{font-size:13px;padding:7px 10px}h2{font-size:21px}.lead{font-size:15px}}
</style>
</head>
<body><div class="wrap">
<header class="hero"><div class="hero-top"><div><div class="eyebrow">🇫🇷 HM Academy · الصف الأول الإعدادي</div><h1 id="title">جاري تحميل الدرس…</h1><div id="frTitle" class="fr"></div></div><span class="badge">مسار مستقل · مصدر أصلي + إثراء</span></div><p id="goal">يتم تجهيز رحلة التعلم من ملفات المصدر الموثقة.</p></header>
<nav class="panel stagebar" id="stages" aria-label="أقسام الدرس"></nav>
<main class="panel"><div class="crumb"><span class="source">المحتوى مرتبط بملف الدرس الأصلي.</span><span class="pill" id="lessonPill"></span></div><div id="app">جاري تحميل محتوى الدرس…</div></main>
<footer class="footer">HM Academy · المحتوى الأصلي محفوظ، والإثراء التعليمي مميز بوضوح عن المصدر.</footer>
</div>
<script>
const STAGES=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];
const LESSONS=[['grade7-u1-l1','الوحدة 1 · الدرس 1'],['grade7-u1-l2','الوحدة 1 · الدرس 2'],['grade7-u1-l3','الوحدة 1 · الدرس 3'],['grade7-u1-l4','الوحدة 1 · الدرس 4'],['grade7-u1-l5','الوحدة 1 · الدرس 5'],['grade7-u1-l6','الوحدة 1 · الدرس 6'],['grade7-u2-l1','الوحدة 2 · الدرس 1'],['grade7-u2-l2','الوحدة 2 · الدرس 2'],['grade7-u3-l1','الوحدة 3 · الدرس 1'],['grade7-u3-l2','الوحدة 3 · الدرس 2'],['grade7-u3-l3','الوحدة 3 · الدرس 3']];
const AR_TITLES={'grade7-u2-l1':'العمر وفعل avoir','grade7-u2-l2':'ما هذا؟ أدوات الفصل','grade7-u3-l1':'الألوان','grade7-u3-l2':'أدوات التعريف وأيام الأسبوع','grade7-u3-l3':'شهور السنة والفصول'};
const params=new URLSearchParams(location.search);const id=params.get('id')||'grade7-u1-l1';const section=params.get('section')||'introduction';let d=null;let extracted=null;const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';speechSynthesis.speak(u)}
function dataPath(){const m=id.match(/^grade7-u([1-3])-l([1-6])$/);if(!m)throw Error('معرف الدرس غير صالح.');const u=+m[1],l=+m[2];if(u===1&&l<=6)return `data/lessons/grade-7/unit-1/lesson-${l}.json`;return 'data/lessons/grade-7/unit-1/lessons-7-11-source-extracted.json'}
async function load(){const r=await fetch(dataPath(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const raw=await r.json();if(id==='grade7-u1-l6'&&raw.content){d=JSON.parse(raw.content)}else if(raw.lessons&&/^grade7-u[23]-l[1-6]$/.test(id)){const n=id.match(/l(\d+)$/)[1];extracted=raw.lessons[n];d={id,titleFr:extracted.title,titleAr:AR_TITLES[id]||'',grade:'grade-7',sourceLesson:+n,sourceSections:extracted.sections,journeyContent:{},sourceData:extracted}}else d=raw;if(d.id&&d.id!==id)throw Error('بيانات الدرس لا تطابق المعرف.');}
function stageNav(){document.getElementById('stages').innerHTML=STAGES.map(([k,t])=>`<a class="${k===section?'on':''}" href="?id=${encodeURIComponent(id)}&section=${k}">${t}</a>`).join('')}
function loadState(){try{return JSON.parse(localStorage.getItem('hm_g7_progress_'+id)||'{"answers":{}}')}catch(e){return {answers:{}}}}let state=loadState();function save(){try{localStorage.setItem('hm_g7_progress_'+id,JSON.stringify(state))}catch(e){}}
function sourceSections(){return Array.isArray(d?.sourceSections)?d.sourceSections:[]}function genericItems(){const v=d?.journeyContent?.vocabulary?.items||[];if(v.length)return v;return d?.sourceData?.pronouns||d?.sourceData?.verbs||[]}
function cardItems(items){return `<div class="grid">${items.map((x,i)=>{const fr=Array.isArray(x)?x[0]:x;const ar=Array.isArray(x)?(x[2]||x[1]||''):'';const ex=Array.isArray(x)?(x[3]||''):'';return `<article class="card"><div class="fr">${esc(fr)}</div>${ar?`<div class="ar">${esc(ar)}</div>`:''}${ex?`<div class="note">${esc(ex)}</div>`:''}<div class="actions"><button class="btn" onclick='speak(${JSON.stringify(String(fr))})'>🔊 استمع</button></div></article>`}).join('')}</div>`}
function intro(){const j=d.journeyContent?.introduction||{};return `<h2>🚀 البداية</h2><p class="lead">${esc(j.goal||'ابدأ بفهم هدف الدرس ثم انتقل تدريجيًا من الاستكشاف إلى التطبيق.')}</p>${j.learningPath?.length?`<div class="grid">${j.learningPath.map((x,i)=>`<div class="card"><b>${i+1}. ${esc(x)}</b></div>`).join('')}</div>`:''}<div class="sourcebox"><b>محتوى المصدر داخل هذا الدرس</b><div class="muted">${sourceSections().map(x=>`<span class="pill">${esc(typeof x==='string'?x:x.title||x.id||'قسم')}</span>`).join('')}</div></div>`}
function vocabulary(){let items=genericItems();if(id==='grade7-u1-l5')items=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf','vingt'];if(id==='grade7-u1-l6')items=d.interactiveExtraction?.vocabulary||[];if(extracted?.objects)items=extracted.objects.map(x=>[x,'']);if(extracted?.colors)items=extracted.colors.map(x=>[x,'']);if(extracted?.months)items=extracted.months.map(x=>[x,'']);return `<h2>🖼️ المفردات</h2><p class="muted">اقرأ، استمع، ثم استخدم الكلمة في التدريب.</p>${cardItems(items.map(x=>Array.isArray(x)?x:[x,'']))}`}
function pronunciation(){let items=d.journeyContent?.pronunciation?.items||[];if(id==='grade7-u1-l6')items=(d.interactiveExtraction?.vocabulary||[]).map(x=>x[0]);if(!items.length&&extracted)items=extracted.number_words||extracted.colors||extracted.months||extracted.weather||[];return `<h2>🎧 النطق</h2><p>استمع إلى النموذج الفرنسي ثم كرر بصوتك.</p>${cardItems(items.map(x=>Array.isArray(x)?x:[x,'']))}<div class="note enriched"><b>إثراء مهاري:</b> الاستماع ← التكرار ← المقارنة ← إعادة المحاولة.</div>`}
function grammar(){const g=d.journeyContent?.grammar||{};let html='<h2>📘 القواعد</h2>';if(d.sourceData?.forms)html+=`<table class="table"><tr><th>الضمير</th><th>être</th></tr>${d.sourceData.forms.map(x=>`<tr><td>${esc(x[0])}</td><td dir="ltr"><b>${esc(x[1])}</b></td></tr>`).join('')}</table>`;else if(d.sourceData?.rule)html+=`<table class="table"><tr><th>الفاعل</th><th>النهاية</th></tr>${d.sourceData.rule.map(x=>`<tr><td>${esc(x[0])}</td><td dir="ltr"><b>${esc(x[1])}</b></td></tr>`).join('')}</table>`;else if(extracted?.articles)html+=cardItems(extracted.articles);else if(extracted?.invariant)html+=`<div class="note"><b>كلمات ثابتة:</b> ${extracted.invariant.map(esc).join(' · ')}</div><div class="note"><b>مطابقة الصفة:</b> ${extracted.agreement.map(esc).join(' · ')}</div>`;else if(extracted?.seasons)html+=cardItems(extracted.seasons.map(s=>[s.fr,s.months,s.weather]));else html+=`<p class="lead">${esc(g.explanation||g.notes?.join(' — ')||'لا توجد قاعدة مستقلة مسجلة في المصدر لهذا الدرس.')}</p>`;if(g.notes?.length)html+=`<div class="note enriched"><b>ملاحظات إثرائية:</b><ul>${g.notes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;return html}
function conversation(){let arr=d.journeyContent?.conversation?.sourcePreserved||d.journeyContent?.conversation?.prompts||d.sourceData?.expressions||[];if(!arr.length&&extracted){arr=extracted.age_example?[extracted.age_example]:extracted.fill||extracted.backpack||extracted.match?.map(x=>x.join(' → '))||[]}return `<h2>💬 المحادثة</h2><div class="grid">${arr.map((x,i)=>{const txt=Array.isArray(x)?x.join(' — '):x;return `<article class="card"><b>${i+1}</b><p dir="ltr" class="fr">${esc(txt)}</p><button class="btn" onclick='speak(${JSON.stringify(String(txt))})'>🔊 استمع</button></article>`}).join('')}</div><div class="note enriched"><b>إثراء:</b> بعد الاستماع، حاول إعادة الجملة دون النظر إليها ثم تحقق من نفسك.</div>`}
function buildQuestions(){if(d.embeddedPractice?.length)return d.embeddedPractice;if(d.interactiveExtraction?.assessment?.length)return d.interactiveExtraction.assessment;if(d.sourceData?.replacement)return d.sourceData.replacement.map(x=>({q:`اختر الضمير المناسب: ${x[0]} ${x[1]}`,options:[x[2],'nous','vous'].filter((v,i,a)=>a.indexOf(v)===i),answer:x[2],reason:'الضمير يطابق الفاعل المذكور.'}));if(d.sourceData?.forms)return d.sourceData.forms.slice(0,6).map(x=>({q:`أكمل: ${x[0]} ___`,options:[x[1],'est','sont'],answer:x[1],reason:'هذا هو تصريف être الصحيح مع الضمير.'}));if(extracted?.avoir)return extracted.avoir.slice(0,6).map(x=>({q:`أكمل: ${x[0]} ___`,options:[x[1],'est','sont'],answer:x[1],reason:'هذا هو تصريف avoir الصحيح مع الضمير.'}));if(extracted?.articles)return extracted.articles.map(x=>({q:`اختر الأداة المناسبة: ${x[2]}`,options:[x[0],'les','des'],answer:x[0],reason:x[1]}));if(extracted?.match)return extracted.match.map(x=>({q:`صل ${x[0]} بالموسم المناسب`,options:[x[1],'Le printemps','L’hiver'],answer:x[1],reason:'هذه المطابقة واردة في بيانات المصدر.'}));if(extracted?.colors)return extracted.colors.slice(0,6).map(x=>({q:`اختر اللون الصحيح`,options:[x,'bleu','vert'],answer:x,reason:'اختيار من قائمة ألوان المصدر.'}));if(extracted?.months)return extracted.months.slice(0,6).map(x=>({q:`اختر الشهر الصحيح`,options:[x,'Janvier','Décembre'],answer:x,reason:'الشهر جزء من قائمة المصدر.'}));if(d.journeyContent?.vocabulary?.items?.length)return d.journeyContent.vocabulary.items.slice(0,6).map(x=>({q:`ما معنى: ${x[0]}`,options:[x[1]||x[2]||'',d.journeyContent.vocabulary.items[(d.journeyContent.vocabulary.items.indexOf(x)+1)%d.journeyContent.vocabulary.items.length]?.[1]||'غير ذلك','غير ذلك'],answer:x[1]||x[2]||'',reason:'سؤال إثرائي مبني على مفردات الدرس.'}));return []}
function answer(key,value,correct,reason,btn){const box=document.getElementById('f-'+key);if(value===correct){box.innerHTML='<span class="ok">✅ صحيح — أحسنت!</span>';state.answers[key]='صحيح';btn.classList.add('good')}else{box.innerHTML=`<span class="bad">❌ ليست الإجابة الصحيحة.</span><br><span>الإجابة: <b>${esc(correct)}</b></span>${reason?`<br><span class="muted">السبب: ${esc(reason)}</span>`:''}`;state.answers[key]='خطأ: '+correct}save()}
function practice(){const qs=buildQuestions();if(!qs.length)return `<h2>✍️ التدريب</h2><div class="note">لا توجد أسئلة قابلة للتشغيل في ملف البيانات الحالي.</div>`;return `<h2>✍️ التدريب</h2><p class="muted">الإجابة الخاطئة تظهر معها الإجابة الصحيحة والسبب. الأسئلة الإثرائية مميزة داخل بيانات الدرس وليست منسوبة للمصدر.</p>${qs.map((q,i)=>{const key='q'+i;return `<article class="card q"><b>${i+1}. ${esc(q.q)}</b><div class="options">${(q.options||[]).map(o=>`<button onclick='answer(${JSON.stringify(key)},${JSON.stringify(String(o))},${JSON.stringify(String(q.answer))},${JSON.stringify(String(q.reason||''))},this)'>${esc(o)}</button>`).join('')}</div><div id="f-${key}" class="feedback">${state.answers?.[key]||''}</div></article>`}).join('')}`}
function video(){const v=d.journeyContent?.video||d.video||null;return `<h2>🎬 الفيديو</h2>${v?.url?`<div class="card"><p>${esc(v.title||'الفيديو المرتبط بالدرس')}</p><a class="btn" href="${esc(v.url)}" target="_blank" rel="noopener">فتح الفيديو</a></div>`:`<div class="note">لا يوجد رابط فيديو موثق داخل بيانات هذا الدرس، لذلك لا يتم اختراع رابط أو تضمين وسائط غير مؤكدة.</div>`}`}
function games(){const items=genericItems().slice(0,8).map(x=>Array.isArray(x)?x[0]:x);const target=items[0]||'';return `<h2>🎮 الألعاب</h2><div class="grid"><article class="card"><h3>⚡ تحدي سريع</h3><p>اختبر تركيزك على كلمة من محتوى الدرس.</p><button class="btn" onclick="miniGame()">ابدأ التحدي</button><div id="gameResult" class="feedback"></div></article><article class="card"><h3>🎧 اسمع واختر</h3><button class="btn secondary" onclick='speak(${JSON.stringify(target)})'>🔊 استمع</button><div class="options">${items.slice(0,4).map(x=>`<button onclick='this.parentElement.nextElementSibling.innerHTML=${JSON.stringify(x===target?'<span class="ok">✅ ممتاز!</span>':'<span class="bad">❌ أعد الاستماع.</span>')}'>${esc(x)}</button>`).join('')}</div><div class="feedback"></div></article></div><div class="note enriched"><b>إثراء:</b> الاختيار السريع، الاستماع والاختيار، والمراجعة المتكيفة كلها منفصلة عن النشاط الأصلي.</div>`}
function miniGame(){document.getElementById('gameResult').innerHTML=Math.random()>.5?'<span class="ok">🎉 اختيار موفق! استمر.</span>':'<span>🔄 محاولة جديدة — ركز قبل الاختيار.</span>'}
function review(){const qs=buildQuestions();const vals=Object.values(state.answers||{});const correct=vals.filter(x=>x==='صحيح').length;return `<h2>🧠 المراجعة الذكية</h2><div class="note enriched"><b>المنهج:</b> نعيد المهارة التي ظهر فيها الخطأ بدل إعادة الدرس كله.</div><div class="grid"><div class="card"><b>أسئلة متاحة</b><div class="lead">${qs.length}</div></div><div class="card"><b>إجابات صحيحة مسجلة</b><div class="lead">${correct}</div></div></div><div class="actions"><a class="btn" href="?id=${encodeURIComponent(id)}&section=practice">إعادة التدريب</a><a class="btn secondary" href="?id=${encodeURIComponent(id)}&section=vocabulary">مراجعة المفردات</a></div>`}
function assessment(){const a=d.formalAssessment||d.journeyContent?.assessment||{};const total=a.sourceDeclaredTotal||a.assessmentItems||d.interactiveExtraction?.assessment?.length||extracted?.quiz_count||'غير محدد';return `<h2>🏆 التقييم</h2><div class="sourcebox"><b>التقييم الأصلي</b><p>مرجع التقييم: ${esc(a.source||'Vérifie-toi !')}</p><p>عدد العناصر المسجل في المصدر: <b>${esc(total)}</b></p></div><div class="note enriched">التدريب الإثرائي منفصل عن التقييم الأصلي؛ لا يتم تقديم أي سؤال مُنشأ على أنه سؤال من الكتاب.</div><a class="btn" href="?id=${encodeURIComponent(id)}&section=practice">ابدأ التحقق التدريبي</a>`}
function progress(){const qs=buildQuestions();const vals=Object.values(state.answers||{});const done=vals.length;const correct=vals.filter(x=>x==='صحيح').length;const pct=qs.length?Math.round(done/qs.length*100):0;return `<h2>📈 التقدم</h2><div class="card"><div class="crumb"><b>تقدم هذا الدرس</b><b>${pct}%</b></div><div class="progress"><i style="width:${pct}%"></i></div><div class="grid" style="margin-top:12px"><div class="card"><b>محاولات</b><div class="lead">${done}</div></div><div class="card"><b>صحيح</b><div class="lead ok">${correct}</div></div><div class="card"><b>متبقي</b><div class="lead">${Math.max(0,qs.length-done)}</div></div></div></div><div class="actions"><button class="btn secondary" onclick="resetProgress()">إعادة ضبط تقدم الدرس</button></div>`}
function resetProgress(){state={answers:{}};save();render()}
function render(){stageNav();const idx=LESSONS.findIndex(x=>x[0]===id);document.getElementById('lessonPill').textContent=idx>=0?LESSONS[idx][1]:id;document.getElementById('title').textContent=d.titleAr||'الصف الأول الإعدادي';document.getElementById('frTitle').textContent=d.titleFr||'';document.getElementById('goal').textContent=d.journeyContent?.introduction?.goal||'رحلة تعلم مستقلة مبنية على المصدر الأصلي.';let h='';if(section==='introduction')h=intro();else if(section==='vocabulary')h=vocabulary();else if(section==='pronunciation')h=pronunciation();else if(section==='grammar')h=grammar();else if(section==='conversation')h=conversation();else if(section==='practice')h=practice();else if(section==='video')h=video();else if(section==='games')h=games();else if(section==='smart-review')h=review();else if(section==='assessment')h=assessment();else h=progress();document.getElementById('app').innerHTML=h}
(async()=>{try{await load();render()}catch(e){stageNav();document.getElementById('app').innerHTML=`<div class="note"><b>تعذر تحميل محتوى هذا الدرس.</b><br>${esc(e.message)}<br><small>المسار: ${esc(dataPath())}</small></div>`}})();
</script></body></html>
