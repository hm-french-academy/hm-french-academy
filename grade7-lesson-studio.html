<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HM Academy | الصف الأول الإعدادي</title>
<style>
:root{--navy:#173a82;--blue:#2563eb;--teal:#0f9f91;--pink:#e92d83;--bg:#f3f6fb;--ink:#16213e;--muted:#6b7890}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans Arabic",sans-serif}.wrap{max-width:1180px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,var(--navy),var(--blue),var(--teal));color:#fff;border-radius:24px;padding:22px;box-shadow:0 10px 30px #0001}.eyebrow{font-size:13px;opacity:.9}.hero h1{margin:8px 0;font-size:clamp(24px,4vw,38px)}.hero p{margin:0;line-height:1.8}.barbox,.lessonbar,.tabs,.panel,.progressbox{background:#fff;border-radius:20px;padding:12px;margin:11px 0;box-shadow:0 5px 20px #0000000b}.lessonbar,.tabs{display:flex;gap:7px;overflow:auto}.lessonbar a,.tab{border:0;border-radius:11px;padding:9px 12px;background:#edf2fb;color:var(--navy);text-decoration:none;font-weight:800;white-space:nowrap;cursor:pointer}.lessonbar a.on,.tab.on{background:var(--blue);color:#fff}.panel{min-height:500px;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}.card{border:1px solid #e0e6f0;border-radius:16px;padding:15px;background:#fff}.source{border-right:5px solid var(--teal)}.enrich{border-right:5px solid var(--pink)}.fr{direction:ltr;text-align:center;font-size:21px;font-weight:900}.ar{text-align:center;color:#315aa4;margin-top:6px}.btn,.opt,.select{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.btn{background:var(--blue);color:#fff}.secondary{background:#edf2fb;color:var(--navy)}.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.opt{background:#f7f9fd;border:1px solid #dbe2ee;text-align:center}.good{background:#e9f9ef!important;border-color:#20a464!important}.bad{background:#fff0f2!important;border-color:#d33!important}.dialog{background:#f8faff;padding:14px;border-right:5px solid var(--pink);border-radius:13px;line-height:2.1}.rule{display:flex;flex-wrap:wrap;gap:8px}.rule span{background:#edf2fb;color:var(--navy);padding:9px 11px;border-radius:9px;font-weight:800}.notice{padding:12px;background:#fff8e8;border-right:4px solid #f59e0b;border-radius:10px}.bar{height:9px;background:#e5eaf2;border-radius:9px;overflow:hidden}.fill{height:100%;background:var(--blue);width:0;transition:.25s}.small{font-size:13px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.score{font-size:18px;font-weight:900}.check{margin-top:10px;font-weight:800}.timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.stage{padding:10px;border-radius:12px;background:#f7f9fd;border:1px solid #e1e7f0}.done{border-color:#21a366;background:#eefbf3}.empty{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body><div class="wrap">
<section class="hero"><div class="eyebrow">🇫🇷 HM Academy · Learning Studio · الصف الأول الإعدادي</div><h1 id="title">جاري التحميل…</h1><p id="goal"></p></section>
<div class="lessonbar" id="lessons"></div><nav class="tabs" id="tabs"></nav><main id="panel" class="panel"></main>
<section class="progressbox"><b>📈 تقدم الرحلة</b><div class="small" id="state"></div><div class="bar"><div id="fill" class="fill"></div></div><div class="actions"><button class="btn secondary" onclick="resetLesson()">إعادة تقدم الدرس</button></div></section>
</div>
<script>
const STAGES=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];
const base={

'grade7-u1-l2':{fr:'Les salutations',ar:'التحيات',goal:'تمييز التحيات والتعبير عن الحالة.',v:[['Salut !','مرحبًا'],['Bonjour','مرحبًا / صباح الخير'],['Bonsoir','مساء الخير'],['Ça va bien.','أنا بخير'],['Ça va mal.','أنا لست بخير'],['Comme ci, comme ça.','هكذا هكذا']]},
'grade7-u1-l3':{fr:'Les pronoms sujets et les verbes du 1er groupe',ar:'ضمائر الفاعل وأفعال المجموعة الأولى',goal:'استخدام الضمائر وتصريف أفعال المجموعة الأولى.',v:[['Je','أنا'],['Tu','أنت'],['Il','هو'],['Elle','هي'],['Nous','نحن'],['Vous','أنتم'],['Ils','هم'],['Elles','هنّ']],extra:['parler','aimer','chanter','présenter']},
'grade7-u1-l4':{fr:'Le verbe être et la présentation',ar:'فعل être والتقديم',goal:'استخدام être والتعريف بالنفس والآخرين.',v:[['Je suis','أنا'],['Tu es','أنت'],['Il / Elle est','هو / هي'],['Nous sommes','نحن'],['Vous êtes','أنتم'],['Ils / Elles sont','هم / هنّ']],extra:['Je m’appelle Ahmed.','Je suis un garçon.','Il s’appelle Marc.','Voilà Marc.','Nous sommes élèves.']},
'grade7-u1-l5':{fr:'Les nombres (0-20)',ar:'الأعداد من 0 إلى 20',goal:'قراءة وكتابة الأعداد من 0 إلى 20.',v:[['zéro','0'],['un','1'],['deux','2'],['trois','3'],['quatre','4'],['cinq','5'],['six','6'],['sept','7'],['huit','8'],['neuf','9'],['dix','10'],['onze','11'],['douze','12'],['treize','13'],['quatorze','14'],['quinze','15'],['seize','16'],['dix-sept','17'],['dix-huit','18'],['dix-neuf','19'],['vingt','20']]},
'grade7-u1-l6':{fr:'L’heure',ar:'الساعة',goal:'قراءة الوقت والتعبير عنه بالفرنسية.',v:[['Il est une heure','1:00'],['Il est deux heures cinq','2:05'],['Il est deux heures dix','2:10'],['Il est deux heures et quart','2:15'],['Il est deux heures vingt','2:20'],['Il est deux heures et demie','2:30'],['Il est trois heures moins vingt','2:40'],['Il est trois heures moins le quart','2:45'],['Il est trois heures moins cinq','2:55'],['Il est midi','12:00'],['Il est minuit','00:00']]},
'grade7-u1-l7':{fr:'Tu as quel âge ?',ar:'كم عمرك؟',goal:'السؤال عن العمر والإجابة عنه باستخدام avoir.',v:[['Quel âge as-tu ?','كم عمرك؟'],['J’ai treize ans.','عمري 13 سنة'],['Tu as quel âge ?','كم عمرك؟']],avoir:[['J’','ai'],['Tu','as'],['Il / Elle','a'],['Nous','avons'],['Vous','avez'],['Ils / Elles','ont']],fill:['Nous avons des amis.','Vous avez un copain français ?','Tu as un stylo ?','Amr a une trousse rouge.','J’ai un frère.','Nader et Seif ont des crayons.'],numbers:['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf','vingt'],quiz:[['Complète : J’___ treize ans.','ai',['ai','as','a']],['Complète : Tu ___ douze ans.','as',['ai','as','a']],['Complète : Nous ___ des amis.','avons',['avons','avez','ont']],['Complète : Ils ___ des crayons.','ont',['a','avez','ont']],['Choisis : Il ___ dix ans.','a',['ai','a','as']],['Choisis : Vous ___ un copain français ?','avez',['avez','avons','ont']]]},
'grade7-u1-l8':{fr:'Qu’est-ce que c’est ? Les objets de la classe',ar:'ما هذا؟ أدوات الفصل',goal:'استخدام أدوات النكرة والتحدث عن أدوات الفصل والحقيبة.',articles:[['un','مذكر مفرد','un garçon'],['une','مؤنث مفرد','une fille'],['des','جمع','des garçons, des filles']],objects:['un livre','un cahier','un stylo','un crayon','un banc','un tableau','un sac à dos','une maison','une règle','une trousse','une chaise','une table','une gomme','une porte','une fenêtre','une classe'],backpack:['un livre','un cahier','une trousse','un stylo','une règle','une gomme','un crayon'],quiz:[['___ livre','un',['un','une','des']],['___ trousse','une',['un','une','des']],['___ crayons','des',['un','une','des']],['___ règle','une',['un','une','des']],['___ tableau','un',['un','une','des']],['___ filles','des',['un','une','des']]]},
'grade7-u1-l9':{fr:'Les couleurs',ar:'الألوان',goal:'التعرف على الألوان واستخدام صفة اللون مع الاسم.',colors:['rouge','orange','blanc','gris','bleu','violet','jaune','vert','marron','rose','noir'],invariant:['orange','marron'],agreement:['vert/verte/verts/vertes','bleu/bleue/bleus/bleues','noir/noire/noirs/noires','gris/grise/gris/grises','jaune/jaune/jaunes/jaunes','rouge/rouge/rouges/rouges','orange/orange/orange/orange','marron/marron/marron/marron','blanc/blanche/blancs/blanches','violet/violette/violets/violettes'],quiz:[['La voiture est ___.','rouge',['rouge','rouges','rougees']],['Les sacs sont ___.','bleus',['bleu','bleue','bleus']],['La chemise est ___.','blanche',['blanc','blanche','blanches']],['Les fleurs sont ___.','violettes',['violet','violette','violettes']],['Le pantalon est ___.','marron',['marron','marronne','marrons']],['Les pommes sont ___.','vertes',['vert','verte','vertes']]]},
'grade7-u1-l10':{fr:'Les articles définis et les jours de la semaine',ar:'أدوات المعرفة وأيام الأسبوع',goal:'اختيار أداة المعرفة المناسبة والتعرف على أيام الأسبوع.',articles:[['Le','مذكر مفرد','Le crayon'],['La','مؤنث مفرد','La classe'],["L’",'قبل حرف متحرك','L’école'],['Les','جمع','Les professeurs']],days_france:['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'],days_egypt:['Samedi','Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi'],quiz:[['___ crayon','Le',['Le','La','Les']],['___ classe','La',['Le','La','Les']],['___ école',"L’",['Le','La',"L’"]],['___ professeurs','Les',['Le','La','Les']],['في فرنسا يأتي Lundi بعد','Dimanche',['Dimanche','Samedi','Mardi']],['في مصر يأتي Samedi بعد','Vendredi',['Vendredi','Jeudi','Dimanche']]]},
'grade7-u1-l11':{fr:'Les mois de l’année et les saisons',ar:'شهور السنة والفصول',goal:'التعرف على الشهور والفصول والطقس وربط الشهر بالفصل.',months:['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'],seasons:[{fr:'Le printemps',months:'Mars - Avril - Mai',weather:'Il fait beau'},{fr:'L’été',months:'Juin - Juillet - Août',weather:'Il fait chaud'},{fr:'L’automne',months:'Septembre - Octobre - Novembre',weather:'Il fait mauvais'},{fr:'L’hiver',months:'Décembre - Janvier - Février',weather:'Il fait froid'}],weather:['il fait beau','il fait chaud','il fait mauvais','il fait froid'],match:[['Juillet','L’été'],['Décembre','L’hiver'],['Avril','Le printemps'],['Octobre','L’automne']],quiz:[['Juillet appartient à','L’été',['L’été','L’hiver','Le printemps']],['Décembre appartient à','L’hiver',['L’hiver','L’automne','L’été']],['Avril appartient à','Le printemps',['Le printemps','L’été','L’hiver']],['Octobre appartient à','L’automne',['L’automne','Le printemps','L’été']],['En été','Il fait chaud',['Il fait chaud','Il fait froid','Il fait mauvais']],['En hiver','Il fait froid',['Il fait froid','Il fait beau','Il fait chaud']]]}
};
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';speechSynthesis.speak(u)}}
function params(){const p=new URLSearchParams(location.search);return[p.get('id')||'grade7-u1-l1',p.get('section')||'introduction']}
function key(id,s){return 'hm-g7:'+id+':'+s}
function done(id,s){return localStorage.getItem(key(id,s))==='1'}
function mark(id,s){localStorage.setItem(key(id,s),'1')}
function lessonNav(id,s){document.getElementById('lessons').innerHTML=Object.keys(base).map((k,i)=>`<a class="${k===id?'on':''}" href="?id=${k}&section=${s}">الدرس ${i+1}</a>`).join('');document.getElementById('tabs').innerHTML=STAGES.map(x=>`<a class="tab ${x[0]===s?'on':''}" href="?id=${id}&section=${x[0]}">${x[1]}</a>`).join('')}
function cards(arr){return `<div class="grid">${arr.map(x=>`<article class="card"><div class="fr">${esc(x[0])}</div><div class="ar">${esc(x[1])}</div><button class="btn" onclick='speak(${JSON.stringify(String(x[0]))})'>🔊 النطق</button></article>`).join('')}</div>`}
function quiz(d){const qs=d.quiz||[];if(!qs.length)return '<div class="empty">لا يوجد Quiz مصدر منظم لهذا الدرس.</div>';return `<div id="quiz"><div class="score">الاختبار: ${qs.length} أسئلة</div>${qs.map((q,i)=>`<article class="card" style="margin-top:10px"><b>${i+1}. ${esc(q[0])}</b><div class="opts" style="margin-top:9px">${q[2].map(o=>`<button class="opt" data-q="${i}" data-a="${esc(o)}" onclick="answer(this,${i},${JSON.stringify(q[1])})">${esc(o)}</button>`).join('')}</div><div id="fb${i}" class="check"></div></article>`).join('')}</div>`}
function answer(btn,i,correct){if(btn.parentElement.dataset.done)return;btn.parentElement.dataset.done='1';const ok=btn.dataset.a===correct;btn.classList.add(ok?'good':'bad');document.getElementById('fb'+i).textContent=ok?'✓ إجابة صحيحة':'✗ راجع القاعدة وحاول فهم سبب الاختيار.';document.getElementById('fb'+i).style.color=ok?'#16834d':'#c32d43';}
function grammar(d,id){let rows=[];if(d.avoir)rows=d.avoir.map(x=>x[0]+' → '+x[1]);else if(d.articles)rows=d.articles.map(x=>x[0]+' — '+x[1]+' — '+x[2]);else if(d.agreement)rows=d.agreement;else if(id.endsWith('l11'))rows=d.seasons.map(x=>x.fr+' : '+x.months);else rows=d.extra||[];return `<div class="card enrich"><h2>📘 القاعدة بأسلوب تعليمي</h2><p>${esc(d.goal)}</p><div class="rule">${rows.map(x=>`<span>${esc(x)}</span>`).join('')}</div>${d.invariant?`<p><b>ملاحظة مهمة:</b> ${d.invariant.join(' و ')} لا تتغير في صور التذكير والتأنيث والجمع.</p>`:''}</div>`}
function conversation(id){const map={l7:['— Quel âge as-tu ?','— J’ai treize ans.','— Et ton ami ?','— Il a douze ans.'],l8:['— Qu’est-ce que c’est ?','— C’est un livre.','— Qu’est-ce qu’il y a dans ton sac ?','— Il y a une trousse et un stylo.'],l9:['— De quelle couleur est le sac ?','— Il est bleu.','— Et la trousse ?','— Elle est rouge.'],l10:['— Quel jour sommes-nous ?','— Nous sommes lundi.','— Tu as le livre ?','— Oui, j’ai le livre.'],l11:['— Quel mois sommes-nous ?','— Nous sommes en juillet.','— Quelle saison ?','— C’est l’été. Il fait chaud.']};const k=id.slice(-2);const lines=map[k]||['— Bonjour !','— Bonjour ! Ça va ?','— Ça va bien, merci. Et toi ?','— Très bien !'];return `<div class="dialog">${lines.map(x=>`<div>${esc(x)}</div>`).join('')}</div><div class="card enrich" style="margin-top:12px"><b>🎯 نشاط تواصل:</b> بدّل الكلمة الأساسية في الحوار بمعلومة من درس اليوم، ثم استمع لنطقك وكرر الجملة.</div>`}
function render(){const [id,s]=params();const d=base[id]||base['grade7-u1-l1'];document.getElementById('title').textContent=d.fr+' — '+d.ar;document.getElementById('goal').textContent=d.goal;lessonNav(id,s);let h='';
if(s==='introduction')h=`<div class="card"><h2>🚀 ابدأ رحلتك</h2><p>${esc(d.goal)}</p><div class="timeline">${STAGES.map((x,i)=>`<div class="stage ${done(id,x[0])?'done':''}">${x[1]}<br><span class="small">${done(id,x[0])?'مكتملة':'ابدأ'}</span></div>`).join('')}</div></div><div class="card source" style="margin-top:12px"><b>Source Truth</b><p>${d.quiz||d.avoir||d.objects||d.colors||d.months?'هذا الدرس متصل ببيانات المصدر المستخرجة من الـInteractive HTML الأصلي، مع طبقة إثراء منفصلة.':'هذا الدرس مبني داخل الـStudio الحالي مع الحفاظ على المحتوى المعتمد.'}</p></div>`;
else if(s==='vocabulary'){let v=d.v||[];if(d.articles)v=d.articles.map(x=>[x[0],x[1]+' — '+x[2]]);if(d.objects)v=d.objects.map(x=>[x,'أداة من أدوات الفصل']);if(d.colors)v=d.colors.map(x=>[x,'لون']);if(d.months)v=d.months.map(x=>[x,'شهر']);if(d.seasons)v=v.concat(d.seasons.map(x=>[x.fr,x.months]));h=cards(v)}
else if(s==='pronunciation'){let v=d.v||[];if(d.colors)v=d.colors.map(x=>[x,'لون']);if(d.months)v=d.months.map(x=>[x,'شهر']);if(d.weather)v=v.concat(d.weather.map(x=>[x,'الطقس']));if(d.days_france)v=v.concat(d.days_france.map(x=>[x,'أيام الأسبوع']));h=`<div class="card"><h2>🎧 مختبر النطق</h2><p>اضغط على 🔊، استمع للنطق الفرنسي، ثم كرر الجملة أو الكلمة بصوتك.</p></div>${cards(v)}`}
else if(s==='grammar')h=grammar(d,id);
else if(s==='conversation')h=conversation(id);
else if(s==='practice'){if(d.fill)h=`<div class="card"><h2>✍️ Complète avec avoir</h2><p>أكمل الجمل شفهيًا أولًا، ثم استخدمها في محادثة قصيرة.</p>${d.fill.map(x=>`<div class="card" style="margin-top:8px;direction:ltr;text-align:left"><b>${esc(x)}</b><button class="btn" onclick='speak(${JSON.stringify(x)})' style="margin-right:8px">🔊</button></div>`).join('')}</div>`;else if(d.backpack)h=`<div class="card"><h2>✍️ Qu’est-ce qu’il y a dans ton sac ?</h2><p>كوّن جملة باستخدام <b>Il y a</b> ثم اختر 3 عناصر من حقيبتك.</p>${cards(d.backpack.map(x=>[x,'في الحقيبة']))}</div>`;else if(d.agreement)h=grammar(d,id);else h=`<div class="card"><h2>✍️ تدريب تطبيقي</h2><p>راجع المفردات، اختر عنصرًا، ثم استخدمه في جملة فرنسية قصيرة.</p>${cards((d.v||[]).slice(0,8))}</div>`}
else if(s==='video')h=`<div class="card"><h2>🎬 الفيديو التكميلي</h2><div class="notice">مسار الفيديو الأصلي محفوظ ضمن المصدر، ولن يتم اختلاق رابط. عند نشر ملف الفيديو في Runtime سيظهر المشغل هنا تلقائيًا.</div></div>`;
else if(s==='games'){if(d.match)h=`<div class="card"><h2>🎮 طابق الشهر بالفصل</h2><div class="grid">${d.match.map(x=>`<div class="card"><b>${esc(x[0])}</b><div class="opts" style="margin-top:8px">${d.seasons.map(y=>`<button class="opt" onclick="this.classList.add(this.textContent.trim()===${JSON.stringify(x[1])}?'good':'bad')">${esc(y.fr)}</button>`).join('')}</div></div>`).join('')}</div></div>`;else h=`<div class="card"><h2>🎮 تحدي سريع</h2>${quiz(d)}</div>`}
else if(s==='smart-review'){let v=d.v||[];if(d.colors)v=d.colors.map(x=>[x,'لون']);if(d.months)v=d.months.map(x=>[x,'شهر']);h=`<div class="card enrich"><h2>🧠 المراجعة الذكية</h2><p>راجع أقل عدد ممكن من العناصر أولًا، ثم اختبر نفسك.</p>${cards(v.slice(0,8))}</div>`}
else if(s==='assessment')h=`<div class="card"><h2>🏆 Vérifie-toi !</h2><p>هذا الاختبار يعيد بناء الأسئلة الأصلية المنظمة في المصدر حيث تتوفر، ولا يلغي أي Assessment أصلي آخر.</p>${quiz(d)}</div>`;
else h=`<div class="card"><h2>📈 تقدمك</h2><p>أنهيت ${STAGES.filter(x=>done(id,x[0])).length} من ${STAGES.length} مراحل في هذا الدرس.</p><div class="timeline">${STAGES.map(x=>`<div class="stage ${done(id,x[0])?'done':''}">${x[1]} — ${done(id,x[0])?'✓':'○'}</div>`).join('')}</div></div>`;
document.getElementById('panel').innerHTML=h;mark(id,s);updateProgress(id)}
function updateProgress(id){const n=STAGES.filter(x=>done(id,x[0])).length;document.getElementById('state').textContent=`${n} / ${STAGES.length} مراحل مكتملة · ${Math.round(n/STAGES.length*100)}%`;document.getElementById('fill').style.width=(n/STAGES.length*100)+'%'}
function resetLesson(){const [id]=params();STAGES.forEach(x=>localStorage.removeItem(key(id,x[0])));render()}
render();
</script></body></html>
