<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | الصف الأول الإعدادي — Learning Studio</title><style>body{margin:0;background:#f5f7fb;color:#17223b;font-family:Arial,"Cairo",sans-serif}.wrap{max-width:1120px;margin:auto;padding:16px}.header{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#0f1b33;color:#fff;padding:12px 14px;border-radius:18px;margin-bottom:14px}.brand{font-weight:900}.actions{display:flex;gap:7px}.actions a{color:#173a82;background:#eef3ff;text-decoration:none;border-radius:11px;padding:9px 12px;font-weight:900}.actions a.primary{background:#2563eb;color:#fff}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff;border-radius:28px;padding:24px}.hero h1{margin:0 0 8px;font-size:clamp(26px,6vw,42px)}.hero p{line-height:1.8}.journey{display:flex;gap:7px;overflow:auto;margin-top:14px}.journey span{background:#ffffff22;border:1px solid #ffffff44;border-radius:999px;padding:8px 12px;white-space:nowrap;font-weight:800}.nav{display:flex;gap:7px;overflow:auto;background:#fff;padding:8px;border-radius:18px;margin:14px 0}.nav button{border:0;background:#eef3ff;color:#173a82;border-radius:12px;padding:10px 13px;font-weight:900;white-space:nowrap;cursor:pointer}.nav button.active{background:#e92d83;color:#fff}.panel{background:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 30px #14264a12}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{border:1px solid #e1e6ef;border-radius:18px;padding:15px}.fr{direction:ltr;text-align:center;font-weight:900;font-size:20px}.ar{text-align:center;color:#315aa4;font-weight:800;margin-top:5px}.icon{text-align:center;font-size:42px;padding:8px}.example,.dialogue{background:#f7f9fd;border-radius:13px;padding:11px;margin-top:8px;line-height:1.7}.dialogue{border-right:4px solid #e92d83}.goal{background:#f7f9fd;border-radius:16px;padding:15px;line-height:2}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.option{padding:12px;border:1px solid #dbe1eb;border-radius:11px;background:#fff;font-weight:800;cursor:pointer}.option.correct{background:#ecfdf3;border-color:#20a45a}.option.wrong{background:#fff2f8;border-color:#e92d83}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:900;cursor:pointer;margin:5px 3px 0 0}.primary{background:#2563eb;color:#fff}.secondary{background:#edf3ff;color:#173a82}.complete{margin-top:14px;background:#fff;border-radius:20px;padding:17px;display:flex;justify-content:space-between;gap:12px;align-items:center}.small{color:#718096;font-size:13px}.progress{height:10px;background:#e7ecf5;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:#2563eb}.unit-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.unit-list a{display:block;text-decoration:none;color:#173a82;background:#f7f9fd;border-radius:15px;padding:13px;font-weight:900}.empty{padding:18px;background:#f8fafc;border-radius:16px;color:#66738a}@media(max-width:650px){.complete{display:block}.wrap{padding:10px}.header{border-radius:14px}.actions a{padding:8px 9px}}</style></head><body><div class="wrap"><header class="header"><div class="brand">🇫🇷 HM Academy · الصف الأول الإعدادي</div><div class="actions"><a href="grade-7.html">المرحلة</a><a class="primary" id="unitLink" href="grade7-unit-map.html">خريطة الوحدات</a></div></header><section class="hero"><h1 id="title">Learning Studio</h1><p id="subtitle">رحلة تعلم متكاملة للصف الأول الإعدادي</p><div class="journey"><span>🚀 البداية</span><span>🖼️ المفردات</span><span>🎧 النطق</span><span>📘 القواعد</span><span>💬 المحادثة</span><span>✍️ التدريب</span><span>🎬 الفيديو</span><span>🎮 الألعاب</span><span>🧠 المراجعة الذكية</span><span>🏆 التقييم</span><span>📈 التقدم</span></div></section><nav class="nav" id="nav"></nav><section class="panel" id="panel"></section><section class="complete"><div><b>📈 تقدمك</b><div class="small" id="status">التقدم محفوظ على هذا الجهاز.</div><div class="progress"><div class="bar" id="bar"></div></div></div><button class="btn primary" id="complete">إكمال الدرس</button></section></div><script>const qs=new URLSearchParams(location.search),id=qs.get('id')||'grade7-u1-l1',requested=qs.get('section')||'introduction';let all=null,d=null;const sections=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function speak(t){if(!t||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.86;speechSynthesis.speak(u)}function storeKey(){return 'hm-grade7-progress-'+id}function done(){localStorage.setItem(storeKey(),'1');renderStatus()}function renderStatus(){const ok=localStorage.getItem(storeKey())==='1';document.getElementById('status').textContent=ok?'✅ تم إكمال هذا الدرس على هذا الجهاز.':'التقدم محفوظ على هذا الجهاز.';document.getElementById('bar').style.width=ok?'100%':'0%'}function renderNav(){document.getElementById('nav').innerHTML=sections.map(([k,t])=>`<button class="${k===requested?'active':''}" onclick="go('${k}')">${t}</button>`).join('')}function go(s){history.replaceState({},'',`?id=${encodeURIComponent(id)}&section=${encodeURIComponent(s)}`);location.reload()}function intro(){return `<h2>🚀 ضربة البداية</h2><p>${esc(d.titleAr)} · <b>${esc(d.titleFr)}</b></p><div class="goal"><b>🎯 هدف الدرس:</b><br>${esc(d.objectiveAr||'التعلم من محتوى المصدر وتنظيمه داخل رحلة HM Academy.') }<br><br><b>🧭 هوية الدرس:</b> grade-7 · ${esc(d.focus||'source-aligned')}</div><h3>المسار الكامل</h3><div class="unit-list">${sections.slice(0,10).map(([k,t])=>`<a href="?id=${id}&section=${k}">${t}</a>`).join('')}</div>`}function vocab(){if(!d.vocabulary?.length)return '<div class="empty">لا توجد مفردات مسجلة لهذا الدرس.</div>';return `<h2>🖼️ المفردات</h2><p class="small">المفردات منظمة من محور الدرس ومتصلة مباشرة بالتدريب والنطق.</p><div class="cards">${d.vocabulary.map(v=>`<article class="card"><div class="icon">📚</div><div class="fr">${esc(v[0])}</div><div class="ar">${esc(v[1])}</div><button class="btn primary" onclick='speak(${JSON.stringify(v[0])})'>🔊 استمع</button></article>`).join('')}</div>`}function pronunciation(){return `<h2>🎧 النطق</h2><div class="goal">استمع إلى المفردات والعبارات الأساسية، ثم أعد نطقها بصوتك. هذه الصفحة تستخدم النطق الفرنسي من المتصفح ولا تغيّر محتوى المصدر.</div><div class="cards">${(d.vocabulary||[]).slice(0,12).map(v=>`<article class="card"><div class="fr">${esc(v[0])}</div><button class="btn primary" onclick='speak(${JSON.stringify(v[0])})'>🔊 نطق</button></article>`).join('')}</div>`}function grammar(){return `<h2>📘 القواعد</h2><div class="goal"><b>${esc(d.grammar||'قاعدة الدرس')}</b><br>افهم القاعدة من خلال الأمثلة والتطبيق داخل سياق الدرس.</div><div class="example">${esc(exampleFor(d.grammar))}</div>`}function exampleFor(g){const m={'Être et avoir':'Je suis égyptien. J’ai douze ans.','Je m’appelle / Tu t’appelles':'Je m’appelle Sara.','Habiter : à / au / en':'J’habite à Louxor, en Égypte.','Il / Elle + être / avoir':'Elle a 12 ans. Elle est égyptienne.','Dire la profession avec être':'Il est mécanicien.','Je suis né(e) le + date / en + mois':'Je suis né le 8 mars.','C’est / Ce sont / Il y a':'Il y a une table. C’est une chaise.','un / une / des':'C’est un livre. Ce sont des livres.','Il y a + nombre':'Il y a cinq classes.','Révision : c’est / ce sont / il y a + final e muet':'Dans ma classe, il y a des tables.','Aimer / faire du sport':'J’aime le football.','Aimer / adorer / préférer / détester':'Je préfère le sport.','Ne ... pas':'Je n’aime pas le rouge.','Les nombres jusqu’à 100':'Quatre-vingt-dix-neuf.','Voici / C’est pour présenter la famille':'Voici ma famille.','Le féminin des noms de profession':'Elle est pharmacienne.','Accord des adjectifs':'Elle est grande.','Les adjectifs possessifs':'C’est ma sœur.'};return m[g]||'طبّق القاعدة على مفردات وأمثلة الدرس.'}function conversation(){return `<h2>💬 المحادثة</h2>${(d.conversation||[]).map((x,i)=>`<div class="dialogue"><b>${i%2?'الطالب':'المحاور'}:</b> ${esc(x)}</div><button class="btn secondary" onclick='speak(${JSON.stringify(x)})'>🔊 استمع</button>`).join('')}`}function practice(){const q=d.vocabulary?.slice(0,3)||[];return `<h2>✍️ التدريب</h2><p>اختر الكلمة الصحيحة لمعناها.</p><div class="cards">${q.map((v,i)=>`<article class="card"><b>${esc(v[1])}</b><div class="options"><button class="option" onclick="pick(this,${i===0})">${esc(v[0])}</button><button class="option" onclick="pick(this,${i!==0})">${esc(q[(i+1)%q.length]?.[0]||'—')}</button></div><div class="small">التدريب تفاعلي ويمكن إعادته.</div></article>`).join('')}</div>`}function pick(b,ok){b.classList.remove('correct','wrong');b.classList.add(ok?'correct':'wrong')}function video(){return `<h2>🎬 الفيديو</h2><div class="empty">مسار الفيديو محفوظ كجزء مستقل من رحلة الدرس. لا يتم اختلاق رابط فيديو غير موجود في المصدر. يمكن ربط فيديو المنهج عند توفر ملفه الرسمي.</div>`}function games(){return `<h2>🎮 الألعاب</h2><div class="goal">تحدي سريع: اقرأ المفردات بصوت مرتفع، ثم اختر ثلاث كلمات وركّب بها جملًا من أمثلة الدرس. هذه مساحة لعب تعليمية مستقلة عن التقييم الرسمي.</div><button class="btn primary" onclick="alert('ابدأ بتكوين 3 جمل فرنسية من مفردات الدرس.')">ابدأ التحدي</button>`}function smart(){return `<h2>🧠 المراجعة الذكية</h2><div class="goal">المراجعة الذكية تعيدك إلى العناصر الأساسية في هذا الدرس: المفردات → القاعدة → المحادثة → التدريب. استخدمها قبل التقييم أو عند إعادة الدرس.</div><button class="btn primary" onclick="go('vocabulary')">ابدأ من المفردات</button><button class="btn secondary" onclick="go('grammar')">راجع القاعدة</button>`}function assessment(){const q=d.vocabulary?.slice(0,2)||[];return `<h2>🏆 التقييم</h2><p>تقييم ختامي سريع مبني على محتوى الدرس نفسه.</p>${q.map((v,i)=>`<article class="card"><b>ما معنى: ${esc(v[0])}؟</b><div class="options"><button class="option" onclick="pick(this,${i===0})">${esc(v[1])}</button><button class="option" onclick="pick(this,false)">إجابة أخرى</button></div></article>`).join('')}<button class="btn primary" onclick="done()">تسجيل إكمال التقييم</button>`}function progress(){return `<h2>📈 التقدم</h2><div class="goal">هوية التقدم: <b>${esc(id)}</b><br>المسار: الصف الأول الإعدادي فقط<br>المرحلة: 1ère année préparatoire<br><br><button class="btn primary" onclick="done()">إكمال الدرس</button></div>`}function render(){document.getElementById('title').textContent=d.titleFr||'Learning Studio';document.getElementById('subtitle').textContent=d.titleAr||'الصف الأول الإعدادي';renderNav();const views={introduction:intro,vocabulary:vocab,pronunciation,grammar,conversation,practice,video,games,'smart-review':smart,assessment,progress};document.getElementById('panel').innerHTML=(views[requested]||intro)();renderStatus()}fetch('data/lessons/grade-7/grade7-content.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{all=x;for(const u of x.units){const hit=u.lessons.find(l=>l.id===id);if(hit){d=hit;document.getElementById('unitLink').href='grade7-unit-map.html?unit='+encodeURIComponent(u.id);break}}if(!d){document.getElementById('panel').innerHTML='<div class="empty">لم يتم العثور على درس الصف الأول الإعدادي.</div>';return}render()}).catch(()=>document.getElementById('panel').innerHTML='<div class="empty">تعذر تحميل بيانات الدرس.</div>');document.getElementById('complete').onclick=done;</script></body></html>
