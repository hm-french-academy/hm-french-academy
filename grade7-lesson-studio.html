<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Grade 7 Studio</title><style>body{margin:0;background:#f4f7fb;color:#17223b;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:12px}.hero,.panel,.tabs,footer{background:#fff;border-radius:20px;padding:16px;margin:10px 0}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff}h1{margin:0}.tabs{display:flex;gap:7px;overflow:auto}.tab,.btn,.opt{border:0;border-radius:11px;padding:10px 13px;font-weight:bold;cursor:pointer}.tab{white-space:nowrap;background:#edf2fb;color:#173a82}.on,.btn{background:#2563eb;color:#fff}.panel{min-height:430px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.card{border:1px solid #dfe5ef;border-radius:15px;padding:13px}.fr{direction:ltr;text-align:center;font-size:21px;font-weight:900}.ar{text-align:center;color:#315aa4}.goal{background:#f7f9fd;border-radius:14px;padding:14px;line-height:1.9}.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.opt{background:#fff;border:1px solid #dbe1eb}.good{background:#ecfdf3}.bad{background:#fff0f5}.bar{height:9px;background:#e5eaf2;border-radius:9px}.fill{height:100%;background:#2563eb;width:0;border-radius:9px}.small{font-size:13px;color:#718096}.dialog{background:#f7f9fd;padding:11px;border-right:4px solid #e92d83;margin:7px 0}@media(max-width:600px){.wrap{padding:7px}.panel{padding:13px}}</style></head><body><div class="wrap"><section class="hero"><div>🇫🇷 HM Academy · الصف الأول الإعدادي</div><h1 id="title">Learning Studio</h1><p id="goal"></p></section><nav class="tabs" id="tabs"></nav><main class="panel" id="panel"></main><footer><b>📈 التقدم</b><div class="small" id="state"></div><div class="bar"><div id="fill" class="fill"></div></div></footer></div><script>const q=new URLSearchParams(location.search),id=q.get('id')||'grade7-u1-l1',sec=q.get('section')||'introduction';const S=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];const L={
'grade7-u1-l1':{fr:'L’alphabet et les mots transparents',ar:'الأبجدية والكلمات الشفافة',goal:'التعرف على الأبجدية الفرنسية والحروف المتحركة والكلمات الشفافة.',v:[['A','آ'],['B','بي'],['C','سي'],['D','دي'],['E','أُ'],['F','إف'],['G','جي'],['H','آش'],['I','إي'],['J','جي'],['K','كا'],['L','إل'],['M','إم'],['N','إن'],['O','أو'],['P','بي'],['Q','كو'],['R','إغ'],['S','إس'],['T','تي'],['U','يو'],['V','في'],['W','دوبل في'],['X','إكس'],['Y','إيغريك'],['Z','زِد']]},
'grade7-u1-l2':{fr:'Les salutations',ar:'التحيات',goal:'تمييز التحيات الفرنسية واختيار التعبير المناسب حسب الوقت والموقف.',v:[['Salut !','مرحبًا / أهلًا'],['Bonjour','صباح الخير / مرحبًا'],['Bonsoir','مساء الخير'],['Bonjour madame !','مرحبًا سيدتي!'],['Bonjour monsieur !','مرحبًا سيدي!'],['Ça va bien.','أنا بخير.'],['Ça va mal.','أنا لست بخير.'],['Comme ci, comme ça.','هكذا هكذا.']]},
'grade7-u1-l3':{fr:'Les pronoms sujets et les verbes du 1er groupe',ar:'ضمائر الفاعل وأفعال المجموعة الأولى',goal:'استخدام ضمائر الفاعل وتصريف أفعال المجموعة الأولى.',v:[['Je','أنا'],['Tu','أنت'],['Il','هو'],['Elle','هي'],['Nous','نحن'],['Vous','أنتم'],['Ils','هم'],['Elles','هنّ']]},
'grade7-u1-l4':{fr:'Le verbe être et la présentation',ar:'فعل être والتقديم',goal:'استخدام être والتعريف بالنفس وبالآخرين.',v:[['Je suis','أنا أكون'],['Tu es','أنت تكون'],['Il / Elle est','هو / هي يكون'],['Nous sommes','نحن نكون'],['Vous êtes','أنتم تكونون'],['Ils / Elles sont','هم / هنّ يكونون']]},
'grade7-u1-l5':{fr:'Les nombres (0-20)',ar:'الأعداد من 0 إلى 20',goal:'التعرف على الأعداد الفرنسية من 0 إلى 20 واستخدامها في العد والكتابة.',v:[['zéro','0'],['un','1'],['deux','2'],['trois','3'],['quatre','4'],['cinq','5'],['six','6'],['sept','7'],['huit','8'],['neuf','9'],['dix','10'],['onze','11'],['douze','12'],['treize','13'],['quatorze','14'],['quinze','15'],['seize','16'],['dix-sept','17'],['dix-huit','18'],['dix-neuf','19'],['vingt','20']]}};let d=L[id]||L['grade7-u1-l1'];title.textContent=d.ar+' · '+d.fr;goal.textContent=d.goal;function say(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.84;speechSynthesis.speak(u)}}function key(){return'hm-g7-'+id}function prog(v){let n=Math.max(+localStorage.getItem(key())||0,v);localStorage.setItem(key(),n);status()}function status(){let n=+localStorage.getItem(key())||0;state.textContent=n>=100?'✅ مكتمل':n+'%';fill.style.width=n+'%'}function go(s){location.href='grade7-lesson-studio.html?id='+encodeURIComponent(id)+'&section='+s}tabs.innerHTML=S.map(x=>`<button class="tab ${x[0]===sec?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');function words(){return`<h2>🖼️ ${sec==='vocabulary'?'المفردات':'محتوى الدرس'}</h2><div class="grid">${d.v.map(x=>`<article class="card"><div class="fr">${x[0]}</div><div class="ar">${x[1]}</div><button class="btn" onclick='say(${JSON.stringify(x[0])})'>🔊</button></article>`).join('')}</div><button class="btn" onclick="prog(25)">حفظ التقدم</button>`}function render(){let h='';if(sec==='introduction')h=`<h2>🚀 البداية</h2><div class="goal"><b>${d.fr}</b><br>${d.ar}<br><br>${d.goal}</div>`;else if(sec==='vocabulary'||sec==='pronunciation')h=words();else if(sec==='grammar')h=`<h2>📘 القواعد / الإثراء</h2><div class="goal">نشرح القاعدة المرتبطة بمحتوى الدرس فقط، ونفصل الإثراء عن المصدر الأصلي.</div><div class="grid"><div class="card">${id==='grade7-u1-l3'?'Je parle · Tu parles · Il parle · Nous parlons · Vous parlez · Ils parlent':id==='grade7-u1-l4'?'Je suis · Tu es · Il/Elle est · Nous sommes · Vous êtes · Ils/Elles sont':id==='grade7-u1-l5'?'الأعداد تُستخدم للعد والكتابة، والتدريب يركز على 0–20.':'الحروف المتحركة: A · E · I · O · U · Y'}</div></div>`;else if(sec==='conversation')h=`<h2>💬 المحادثة</h2><div class="goal">إثراء شفهي قصير مبني على مفردات الدرس، ومميز عن الحوار الأصلي.</div><div class="dialog">اسمع → كرر → أكمل → Role Play</div><button class="btn" onclick="prog(45)">أتممت المحادثة</button>`;else if(sec==='practice')h=`<h2>✍️ التدريب</h2><div class="card"><b>${id==='grade7-u1-l5'?'اختر العدد الصحيح لكلمة quinze':'اختر الإجابة الصحيحة'}</b><div class="opts"><button class="opt" onclick="ans(this,${id==='grade7-u1-l5'})">15</button><button class="opt" onclick="ans(this,false)">12</button></div><div id="fb"></div></div>`;else if(sec==='video')h=`<h2>🎬 الفيديو</h2><div class="goal">يُعرض فيديو المصدر فقط عند توفر الـasset الموثق، ولا نضع رابطًا وهميًا.</div>`;else if(sec==='games')h=`<h2>🎮 لعبة المهارة</h2><div class="goal">تحدٍّ قصير مرتبط مباشرة بمهارة الدرس.</div><button class="btn" onclick="prog(75)">ابدأ وأنجز</button>`;else if(sec==='smart-review')h=`<h2>🧠 المراجعة الذكية</h2><div class="goal">اختر المهارة التي تحتاج مراجعة.</div><button class="btn" onclick="go('vocabulary')">المفردات</button><button class="btn" onclick="go('pronunciation')">النطق</button><button class="btn" onclick="go('practice')">التدريب</button>`;else if(sec==='assessment')h=`<h2>🏆 التقييم</h2><div class="goal">التقييم الأصلي هو المرجع، وهذه مساحة تحقق تدريبية قبل الإتمام.</div><button class="btn" onclick="prog(90)">اجتز التحقق</button>`;else h=`<h2>📈 التقدم</h2><div class="goal">أكملت ${+localStorage.getItem(key())||0}% من الرحلة.</div><button class="btn" onclick="prog(100)">إكمال الدرس</button>`;panel.innerHTML=h;status()}function ans(b,ok){b.classList.add(ok?'good':'bad');fb.textContent=ok?'✓ صحيح':'✗ حاول مرة أخرى';if(ok)prog(65)}render();</script></body></html>
