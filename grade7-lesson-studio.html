<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | الصف الأول الإعدادي</title><style>body{margin:0;background:#f4f7fb;color:#16213e;font-family:Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:14px}.hero,.panel,.progress{background:#fff;border-radius:22px;padding:18px;margin-bottom:12px;box-shadow:0 8px 28px #14264a12}.hero{color:#fff;background:linear-gradient(135deg,#173a82,#2563eb,#0f9f91)}h1{margin:8px 0}.bar,.tabs,.lessons{display:flex;gap:8px;overflow:auto}.tabs{padding:4px 0;flex-wrap:wrap}.tabs a,.lessons a,.btn{border:0;border-radius:11px;padding:10px 13px;text-decoration:none;font-weight:800;background:#edf2fb;color:#173a82;white-space:nowrap}.tabs a.on,.lessons a.on,.btn{background:#2563eb;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.card{background:#fff;border:1px solid #dfe6f1;border-radius:16px;padding:14px}.source{border-right:5px solid #0f9f91}.enrich{border-right:5px solid #e92d83}.fr{direction:ltr;text-align:center;font-size:20px;font-weight:900}.ar{text-align:center;color:#315aa4}.notice{padding:13px;border-radius:12px;background:#fff8e8;border-right:4px solid #f59e0b;line-height:1.8}.ok{padding:13px;border-radius:12px;background:#eefbf3;border-right:4px solid #21a366}.small{font-size:13px;color:#68758d;line-height:1.8}.stage{padding:9px;border-radius:10px;background:#f6f8fc;margin:5px 0}.done{background:#eefbf3}.files{margin-top:10px}.file{padding:12px;border:1px solid #dfe6f1;border-radius:12px;margin:7px 0;direction:ltr;text-align:left;word-break:break-word}@media(max-width:560px){.wrap{padding:9px}.hero,.panel,.progress{border-radius:17px;padding:13px}.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="hero"><div>🇫🇷 HM Academy · الصف الأول الإعدادي</div><h1 id="title">جاري التحميل…</h1><div id="goal"></div></section><div class="lessons" id="lessons"></div><div class="tabs" id="tabs"></div><main class="panel" id="panel"></main><section class="progress"><b>📈 تقدم الرحلة</b><div id="progressText" class="small"></div></section></div><script>
const STAGES=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];
const IDS=['grade7-u1-l1','grade7-u1-l2','grade7-u1-l3','grade7-u1-l4','grade7-u1-l5','grade7-u1-l6','grade7-u2-l1','grade7-u2-l2','grade7-u3-l1','grade7-u3-l2','grade7-u3-l3'];
const PATH=id=>{const m=/^grade7-u(\d+)-l(\d+)$/.exec(id);if(!m)return null;return `data/lessons/grade-7/unit-${Number(m[1])}/lesson-${Number(m[2])}.json`};const q=new URLSearchParams(location.search);let id=q.get('id')||'grade7-u1-l1',section=q.get('section')||'introduction';let data=null;
const esc=x=>String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const speak=t=>{if(window.speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';speechSynthesis.speak(u)}};const mark=()=>localStorage.setItem('hm-g7:'+id+':'+section,'1');const done=s=>localStorage.getItem('hm-g7:'+id+':'+s)==='1';
function links(){lessons.innerHTML=IDS.map((x,i)=>`<a class="${x===id?'on':''}" href="?id=${x}&section=${section}">الدرس ${i+1}</a>`).join('');tabs.innerHTML=STAGES.map(x=>`<a class="${x[0]===section?'on':''}" href="?id=${id}&section=${x[0]}">${x[1]}</a>`).join('')}
function list(a){return `<div class="grid">${(a||[]).map(x=>`<div class="card">${esc(Array.isArray(x)?x.join(' — '):x)}</div>`).join('')}</div>`}function cards(a){return `<div class="grid">${(a||[]).map(x=>{let fr=Array.isArray(x)?x[0]:x,ar=Array.isArray(x)?x[1]:'';return `<div class="card"><div class="fr">${esc(fr)}</div><div class="ar">${esc(ar)}</div><button class="btn" onclick='speak(${JSON.stringify(fr)})'>🔊 استمع</button></div>`}).join('')}</div>`}
function sourceObjects(){return Array.isArray(data.sourceSections)?data.sourceSections:[]}function render(){let jc=data.journeyContent||{},sd=data.sourceData||{},en=data.enrichment||{};if(section==='introduction')return `<div class="card source"><h2>🚀 بداية الدرس</h2><p>${esc(data.titleAr||'')}</p><p>${esc(jc.introduction?.goal||data.goal||'التعرف على أهداف الدرس ومحتواه.')}</p><div class="ok">المعرف: <b>${esc(id)}</b> · الصف الأول الإعدادي فقط</div>${sourceObjects().length?'<h3>مكونات المصدر</h3>'+list(sourceObjects().map(x=>typeof x==='string'?x:x.title)):''}</div>`;if(section==='vocabulary'){let v=jc.vocabulary?.items;if(!v&&sd.pronouns)v=sd.pronouns;if(!v&&sd.forms)v=sd.forms;if(!v&&sd.expressions)v=sd.expressions;if(!v&&sourceObjects().length)v=sourceObjects().flatMap(x=>x.items||[]);if(!v)v=data.sourceAtoms;return cards(v)}if(section==='pronunciation'){let p=jc.pronunciation?.items;if(!p&&sd.pronouns)p=sd.pronouns.map(x=>x[0]);if(!p&&sd.forms)p=sd.forms.map(x=>x[0]+' '+x[1]);if(!p&&sourceObjects().length)p=sourceObjects().flatMap(x=>x.items||[]).map(x=>Array.isArray(x)?x[0]:x);return cards(p||data.sourceAtoms||[])}if(section==='grammar'){if(jc.grammar?.mode==='not-applicable'||data.journeyConfig?.grammar?.enabled===false)return '<div class="notice"><b>لا يوجد محور قواعد مستقل في المصدر لهذا الدرس.</b><br>لن نضع محتوى مصطنعًا.</div>';let g=jc.grammar?.notes||sd.rule||[];return `<div class="card enrich"><h2>📘 القواعد</h2>${list(g)}</div>`}if(section==='conversation'){let c=jc.conversation?.sourcePreserved||sd.expressions||[];return `<div class="card source"><h2>💬 المحادثة</h2>${c.length?list(c):'<div class="notice">لا يوجد حوار مستقل موثق لهذا الدرس.</div>'}</div>`}if(section==='practice'){let p=jc.practice?.sourceTasks||sd.practice||data.sourceActivities||[];let checks=data.embeddedPractice||[];return `<div class="card source"><h2>✍️ التدريب</h2>${list(p)}</div>${checks.length?'<div class="card enrich"><h3>تدريب تفاعلي</h3>'+checks.map((x,i)=>`<div class="card"><b>${i+1}. ${esc(x.q)}</b>${list(x.options)}</div>`).join('')+'</div>':''}`}if(section==='video')return `<div class="card source"><h2>🎬 الفيديو</h2><div class="ok">الفيديو لا يُستدعى من درس آخر. سيعمل فقط عند توفر الـasset الموثق.</div><p class="small">${esc(data.sourceFiles?.interactive||data.sourceTruth||'لا يوجد asset مسجل')}</p></div>`;if(section==='games'){let g=jc.games||data.journeyConfig?.games?.games||en.games||[];return `<div class="card enrich"><h2>🎮 مركز الألعاب</h2><p>اللعب مرتبط بالدرس الحالي: <b>${esc(id)}</b></p>${list(g)}</div>`}if(section==='smart-review')return `<div class="card enrich"><h2>🧠 المراجعة الذكية</h2><p>هذه المرحلة مرتبطة بالدرس الحالي فقط، وتبقى خارج دخول الدرس في الواجهة الرئيسية.</p>${list(jc.smartReview?.targets||[])}</div>`;if(section==='assessment'){let a=data.formalAssessment;return `<div class="card source"><h2>🏆 التقييم</h2>${a?`<div class="ok">إجمالي المصدر المعلن: <b>${esc(a.sourceDeclaredTotal)}</b></div>${list((a.sourceExerciseStructure||[]).map(x=>x.title))}`:'<div class="notice">سيتم عرض التقييم الموثق لهذا الدرس عند توفر بياناته.</div>'}</div>`}if(section==='progress'){let n=STAGES.filter(x=>done(x[0])).length;return `<div class="card"><h2>📈 التقدم</h2><p>${n}/${STAGES.length} مراحل مكتملة.</p>${STAGES.map(x=>`<div class="stage ${done(x[0])?'done':''}">${done(x[0])?'✓':'○'} ${x[1]}</div>`).join('')}</div>`}return '<div class="notice">قسم غير معروف.</div>'}
async function load(){const path=PATH(id);if(!path)throw Error('invalid lesson id');let r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error('lesson not found');let raw=await r.json();data=typeof raw.content==='string'?JSON.parse(raw.content):raw;if(data.grade!=='grade-7'||data.id!==id)throw Error('grade/lesson mismatch');title.textContent=`${data.titleFr||''} — ${data.titleAr||''}`;goal.textContent='منهج الصف الأول الإعدادي · بيانات الدرس الموثقة';links();panel.innerHTML=render();if(section!=='progress')mark();progressText.textContent=STAGES.filter(x=>done(x[0])).length+' / '+STAGES.length+' مراحل مكتملة';}load().catch(e=>{panel.innerHTML='<div class="notice">تعذر تحميل بيانات هذا الدرس، وتم منع أي fallback من الصف الثاني الإعدادي.</div>'});
</script></body></html>
