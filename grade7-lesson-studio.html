<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Grade 7</title><style>body{margin:0;background:#f4f7fb;color:#17223b;font-family:Arial,sans-serif}.w{max-width:1100px;margin:auto;padding:10px}.hero,.tabs,.panel,footer{background:#fff;border-radius:20px;padding:16px;margin:10px 0}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff}.tabs{display:flex;gap:7px;overflow:auto}.tab,.btn,.opt{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer}.tab{white-space:nowrap;background:#edf2fb;color:#173a82}.on,.btn{background:#2563eb;color:#fff}.panel{min-height:430px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.card{border:1px solid #dfe5ef;border-radius:15px;padding:13px;background:#fff}.fr{direction:ltr;text-align:center;font-size:21px;font-weight:900}.ar{text-align:center;color:#315aa4}.goal{background:#f7f9fd;border-radius:14px;padding:14px;line-height:1.9}.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.opt{background:#fff;border:1px solid #dbe1eb}.good{background:#ecfdf3!important}.bad{background:#fff0f5!important}.bar{height:9px;background:#e5eaf2;border-radius:9px}.fill{height:100%;background:#2563eb;width:0;border-radius:9px}.small{font-size:13px;color:#718096}.dialog{background:#f7f9fd;padding:11px;border-right:4px solid #e92d83;margin:7px 0}.rule{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.rule span{background:#edf2fb;color:#173a82;padding:9px;border-radius:10px;font-weight:bold}</style></head><body><div class="w"><section class="hero"><div>🇫🇷 HM Academy · الصف الأول الإعدادي</div><h1 id="title"></h1><p id="goal"></p></section><nav class="tabs" id="tabs"></nav><main class="panel" id="panel"></main><footer><b>📈 تقدم الدرس</b><div class="small" id="state"></div><div class="bar"><div id="fill" class="fill"></div></div></footer></div><script>const q=new URLSearchParams(location.search),id=q.get('id')||'grade7-u1-l1',sec=q.get('section')||'introduction';const S=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];const L={'grade7-u1-l1':{fr:'L’alphabet et les mots transparents',ar:'الأبجدية والكلمات الشفافة',goal:'التعرف على الأبجدية والحروف المتحركة والكلمات الشفافة.',v:[['A','آ'],['B','بي'],['C','سي'],['D','دي'],['E','أُ'],['F','إف'],['G','جي'],['H','آش'],['I','إي'],['J','جي'],['K','كا'],['L','إل'],['M','إم'],['N','إن'],['O','أو'],['P','بي'],['Q','كو'],['R','إغ'],['S','إس'],['T','تي'],['U','يو'],['V','في'],['W','دوبل في'],['X','إكس'],['Y','إيغريك'],['Z','زِد']]},'grade7-u1-l2':{fr:'Les salutations',ar:'التحيات',goal:'تمييز التحيات واختيار التعبير المناسب حسب الوقت والموقف.',v:[['Salut !','مرحبًا / أهلًا'],['Bonjour','صباح الخير / مرحبًا'],['Bonsoir','مساء الخير'],['Bonjour madame !','مرحبًا سيدتي!'],['Bonjour monsieur !','مرحبًا سيدي!'],['Ça va bien.','أنا بخير.'],['Ça va mal.','أنا لست بخير.'],['Comme ci, comme ça.','هكذا هكذا.']]},'grade7-u1-l3':{fr:'Les pronoms sujets et les verbes du 1er groupe',ar:'ضمائر الفاعل وأفعال المجموعة الأولى',goal:'استخدام الضمائر وتصريف أفعال المجموعة الأولى.',v:[['Je','أنا'],['Tu','أنت'],['Il','هو'],['Elle','هي'],['Nous','نحن'],['Vous','أنتم'],['Ils','هم'],['Elles','هنّ']],verbs:['parler','aimer','chanter','présenter']},'grade7-u1-l4':{fr:'Le verbe être et la présentation',ar:'فعل être والتقديم',goal:'استخدام être والتعريف بالنفس وبالآخرين.',v:[['Je suis','أنا'],['Tu es','أنت'],['Il / Elle est','هو / هي'],['Nous sommes','نحن'],['Vous êtes','أنتم'],['Ils / Elles sont','هم / هنّ']],expressions:['Je m’appelle Ahmed.','Je suis un garçon.','Il s’appelle Marc.','Voilà Marc.','Vous êtes avocate ?','Je suis professeur.','Tu es sympa !','Nous sommes élèves.','Ils sont petits.','Elle est Mona.']},'grade7-u1-l5':{fr:'Les nombres (0-20)',ar:'الأعداد من 0 إلى 20',goal:'التعرف على الأعداد الفرنسية من 0 إلى 20 واستخدامها في العد والكتابة.',v:[['zéro','0'],['un','1'],['deux','2'],['trois','3'],['quatre','4'],['cinq','5'],['six','6'],['sept','7'],['huit','8'],['neuf','9'],['dix','10'],['onze','11'],['douze','12'],['treize','13'],['quatorze','14'],['quinze','15'],['seize','16'],['dix-sept','17'],['dix-huit','18'],['dix-neuf','19'],['vingt','20']]}};let d=L[id]||L['grade7-u1-l1'];title.textContent=d.ar+' · '+d.fr;goal.textContent=d.goal;function say(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.84;speechSynthesis.speak(u)}}function key(){return'hm-g7-'+id}function prog(v){let n=Math.max(+localStorage.getItem(key())||0,v);localStorage.setItem(key(),n);status()}function status(){let n=+localStorage.getItem(key())||0;state.textContent=n>=100?'✅ مكتمل':n+'%';fill.style.width=n+'%'}function go(s){location.href='grade7-lesson-studio.html?id='+encodeURIComponent(id)+'&section='+s}tabs.innerHTML=S.map(x=>`<button class="tab ${x[0]===sec?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');function cards(){return`<div class="grid">${d.v.map(x=>`<article class="card"><div class="fr">${x[0]}</div><div class="ar">${x[1]}</div><button class="btn" onclick='say(${JSON.stringify(x[0])})'>🔊 استمع</button></article>`).join('')}</div><button class="btn" onclick="prog(25)">حفظ التقدم</button>`}function render(){let h='';if(sec==='introduction')h=`<h2>🚀 البداية</h2><div class="goal"><b>${d.fr}</b><br>${d.ar}<br><br>${d.goal}<br><br>المصدر أولًا، والإثراء واضح ومكمل.</div>`;else if(sec==='vocabulary')h=`<h2>🖼️ المحتوى الأساسي</h2>${cards()}`;else if(sec==='pronunciation')h=`<h2>🎧 مختبر النطق</h2><div class="goal">اسمع → كرر → ميّز → أعد المحاولة.</div>${cards()}`;else if(sec==='grammar')h=grammar();else if(sec==='conversation')h=conversation();else if(sec==='practice')h=practice();else if(sec==='video')h=`<h2>🎬 الفيديو</h2><div class="goal">فيديو المصدر فقط عند توفر asset موثق.</div>`;else if(sec==='games')h=game();else if(sec==='smart-review')h=`<h2>🧠 المراجعة الذكية</h2><div class="goal">اختر المهارة التي تحتاج مراجعتها.</div><button class="btn" onclick="go('vocabulary')">المفردات</button><button class="btn" onclick="go('pronunciation')">النطق</button><button class="btn" onclick="go('practice')">التدريب</button>`;else if(sec==='assessment')h=`<h2>🏆 التقييم</h2><div class="goal">التقييم الأصلي هو المرجع الأساسي. هذه مرحلة تحقق تدريبية.</div><button class="btn" onclick="prog(90)">اجتز التحقق</button>`;else h=`<h2>📈 التقدم</h2><div class="goal">التقدم الحالي: ${+localStorage.getItem(key())||0}%</div><button class="btn" onclick="prog(100)">إكمال الدرس</button>`;panel.innerHTML=h;status()}function grammar(){if(id==='grade7-u1-l3')return`<h2>📘 القواعد — أفعال -er</h2><div class="rule"><span>Je → e</span><span>Tu → es</span><span>Il/Elle → e</span><span>Nous → ons</span><span>Vous → ez</span><span>Ils/Elles → ent</span></div><p>أمثلة المصدر: ${d.verbs.join(' · ')}</p>`;if(id==='grade7-u1-l4')return`<h2>📘 القواعد — être</h2><div class="rule">${d.v.map(x=>`<span>${x[0]} → ${x[1]}</span>`).join('')}</div>`;if(id==='grade7-u1-l2')return`<h2>📘 إثراء لغوي</h2><div class="goal">Bonjour للتحية العامة/الصباح، Bonsoir للمساء، Salut للتحية غير الرسمية، وÇa va? للسؤال عن الحال.</div>`;if(id==='grade7-u1-l5')return`<h2>📘 ملاحظة لغوية</h2><div class="goal">التركيز هنا على الأعداد 0–20 في العد والكتابة، دون إدخال قواعد غير مرتبطة.</div>`;return`<h2>📘 الحروف المتحركة</h2><div class="rule"><span>A</span><span>E</span><span>I</span><span>O</span><span>U</span><span>Y</span></div>`}function conversation(){let t=id==='grade7-u1-l2'?['Bonjour ! Comment ça va ?','Ça va bien. Et toi ?','Comme ci, comme ça.']:id==='grade7-u1-l3'?['Tu parles français ?','Oui, je parle français.']:id==='grade7-u1-l4'?['Je m’appelle Ahmed. Je suis un garçon.','Il s’appelle Marc. Voilà Marc.']:id==='grade7-u1-l5'?['Compte : un, deux, trois…','Quel âge as-tu ? — Douze ans.']:['A comme arbre.','E comme éléphant.'];return`<h2>💬 المحادثة</h2><div class="goal">تدريب إثرائي مبني على لغة الدرس، ومميز عن الحوار الأصلي.</div>${t.map(x=>`<div class="dialog">${x} <button class="btn" onclick='say(${JSON.stringify(x)})'>🔊</button></div>`).join('')}<button class="btn" onclick="prog(45)">أتممت Role Play</button>`}function practice(){let text=id==='grade7-u1-l2'?'Le soir → ؟':id==='grade7-u1-l3'?'Ahmed et Mona → ؟':id==='grade7-u1-l4'?'Nous ___ élèves.':id==='grade7-u1-l5'?'quinze = ؟':'اختر الحرف الصحيح';let a=id==='grade7-u1-l2'?['Bonsoir','Bonjour']:id==='grade7-u1-l3'?['ils','elle']:id==='grade7-u1-l4'?['sommes','êtes']:id==='grade7-u1-l5'?['15','12']:['A','B'];return`<h2>✍️ التدريب</h2><div class="card"><b>${text}</b><div class="opts">${a.map((x,i)=>`<button class="opt" onclick="ans(this,${i===0})">${x}</button>`).join('')}</div><div id="fb"></div></div>`}function ans(b,ok){b.classList.add(ok?'good':'bad');fb.textContent=ok?'✓ صحيح — أحسنت!':'✗ حاول مرة أخرى';if(ok)prog(65)}function game(){return`<h2>🎮 لعبة المهارة</h2><div class="goal">تحدٍ سريع مرتبط مباشرة بمهارة الدرس.</div><button class="btn" onclick="prog(75)">ابدأ التحدي</button>`}render();</script></body></html>
