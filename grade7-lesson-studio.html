<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173a82"><title>HM Academy | الصف الأول الإعدادي</title><style>body{margin:0;background:#f4f7fb;color:#17223b;font-family:Arial,"Cairo",sans-serif}.wrap{max-width:1120px;margin:auto;padding:12px}.top,.hero,.panel,.foot{border-radius:22px}.top{background:#0f1b33;color:#fff;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;gap:10px}.top a{background:#eef3ff;color:#173a82;padding:9px 12px;border-radius:11px;text-decoration:none;font-weight:900}.hero{margin-top:12px;padding:22px;color:#fff;background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6)}h1{margin:0 0 7px;font-size:clamp(25px,6vw,40px)}.hero p{line-height:1.8}.chips,.tabs,.grid,.opts{display:flex;gap:8px;overflow:auto}.chips{margin-top:13px}.chip,.tab,.btn,.opt{border:0;border-radius:12px;padding:10px 13px;font-weight:900}.chip{white-space:nowrap;background:#ffffff22;border:1px solid #ffffff44}.tabs{background:#fff;padding:8px;margin:12px 0}.tab{white-space:nowrap;background:#eef3ff;color:#173a82;cursor:pointer}.tab.on{background:#e92d83;color:#fff}.panel{background:#fff;padding:19px;box-shadow:0 10px 30px #14264a12;min-height:390px}.goal{background:#f7f9fd;border-radius:16px;padding:15px;line-height:2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));overflow:visible}.card{border:1px solid #e1e6ef;border-radius:17px;padding:14px;background:#fff}.fr{direction:ltr;text-align:center;font-size:21px;font-weight:900}.ar{text-align:center;color:#315aa4;font-weight:800;margin-top:5px}.big{text-align:center;font-size:45px;font-weight:900;padding:8px}.btn{cursor:pointer;background:#2563eb;color:#fff;margin:5px 3px 0 0}.secondary{background:#edf3ff;color:#173a82}.opts{display:grid;overflow:visible;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.opt{background:#fff;border:1px solid #dbe1eb;cursor:pointer;text-align:center}.good{background:#ecfdf3!important;border-color:#20a45a!important}.bad{background:#fff2f8!important;border-color:#e92d83!important}.small{font-size:13px;color:#718096}.bar{height:10px;background:#e7ecf5;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;width:0;background:#2563eb;transition:.3s}.dialog{background:#f7f9fd;border-right:4px solid #e92d83;border-radius:13px;padding:12px;margin:8px 0;line-height:1.8}.foot{background:#fff;margin-top:12px;padding:15px;display:flex;justify-content:space-between;gap:10px;align-items:center}.hide{display:none}@media(max-width:650px){.wrap{padding:8px}.foot{display:block}.top{border-radius:14px}.panel{padding:14px}}</style></head><body><div class="wrap"><header class="top"><b>🇫🇷 HM Academy · الصف الأول الإعدادي</b><a href="grade-7.html">المرحلة</a></header><section class="hero"><h1 id="title">Learning Studio</h1><p id="desc">تعلم الفرنسية داخل رحلة تفاعلية مبنية على المصدر الأصلي مع إثراء تربوي من HM Academy.</p><div class="chips"><span class="chip">🎯 Source-first</span><span class="chip">🧠 Smart Review</span><span class="chip">📱 Mobile First</span><span class="chip">🏆 Mastery</span></div></section><nav class="tabs" id="tabs"></nav><main class="panel" id="panel"></main><footer class="foot"><div style="flex:1"><b>📈 تقدم الدرس</b><div class="small" id="state">لم تبدأ بعد</div><div class="bar"><div class="fill" id="fill"></div></div></div><button class="btn" onclick="finish()">إكمال الدرس</button></footer></div><script>const p=new URLSearchParams(location.search),id=p.get('id')||'grade7-u1-l1',sec=p.get('section')||'introduction';const S=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];let d;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function say(x){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x);u.lang='fr-FR';u.rate=.84;speechSynthesis.speak(u)}function go(s){location.href='grade7-lesson-studio.html?id='+encodeURIComponent(id)+'&section='+s}function key(){return'hm-g7-mastery-'+id}function setProgress(v){let n=Math.max(0,Math.min(100,v));localStorage.setItem(key(),String(n));status()}function finish(){setProgress(100)}function status(){let n=Number(localStorage.getItem(key())||0);state.textContent=n>=100?'✅ مكتمل':n+'% إنجاز';fill.style.width=n+'%'}function nav(){tabs.innerHTML=S.map(x=>`<button class="tab ${x[0]===sec?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}function cardWord(v){return`<article class="card"><div class="big">📚</div><div class="fr">${esc(v[0])}</div><div class="ar">${esc(v[1])}</div><button class="btn" onclick='say(${JSON.stringify(v[0])})'>🔊 استمع</button></article>`}function intro(){return`<h2>🚀 ضربة البداية</h2><div class="goal"><b>${esc(d.titleFr)}</b><br>${esc(d.titleAr)}<br><br><b>🎯 هدفنا:</b> التعرف على الأبجدية الفرنسية، الحروف المتحركة، وقراءة الكلمات الشفافة.<br><b>🧭 القاعدة:</b> كل ما هو أصلي محفوظ، والإثراء واضح ومكمّل له.</div><h3>رحلتك</h3><div class="grid">${S.slice(1,10).map(x=>`<article class="card"><b>${x[1]}</b><p class="small">انتقل إليها من شريط الرحلة.</p></article>`).join('')}</div>`}function vocab(){let a=d.vocabulary||[];return`<h2>🖼️ المفردات</h2><p class="small">المحتوى الأصلي كامل، مع بطاقات صوتية وتفاعل إضافي.</p><div class="grid">${a.map(cardWord).join('')}</div><button class="btn" onclick="setProgress(25)">حفظ تقدم المفردات</button>`}function pron(){let a=d.vocabulary||[];return`<h2>🎧 مختبر النطق</h2><div class="goal">اسمع الكلمة، كررها بصوتك، ثم أعد المحاولة. لا يتم تغيير الكلمات الأصلية.</div><div class="grid">${a.slice(0,16).map(v=>`<article class="card"><div class="fr">${esc(v[0])}</div><button class="btn" onclick='say(${JSON.stringify(v[0])})'>🔊 اسمع</button></article>`).join('')}</div>`}function grammar(){let g=d.grammar||'ملاحظات لغوية مرتبطة بالدرس';return`<h2>📘 افهمها ببساطة</h2><div class="goal"><b>المصدر:</b> ${esc(g)}<br><br><b>💡 طريقة HM Academy:</b> لا نحول هذا القسم إلى قاعدة خارج المنهج؛ نستخدم ملاحظة قصيرة وأمثلة تساعدك على فهم لغة الدرس.</div><div class="card"><div class="fr">A → arbre · E → éléphant · I → image · O → orange · U → uniforme · Y → yoyo</div><button class="btn" onclick='say("arbre, éléphant, image, orange, uniforme, yoyo")'>🔊 استمع للأمثلة</button></div>`}function convo(){return`<h2>💬 المحادثة الذكية</h2><div class="goal">لا يوجد حوار مستقل في المصدر لهذا الدرس؛ لذلك هذه <b>إضافة تدريبية</b> وليست جزءًا من المصدر. استخدم فقط لغة الدرس الموثقة.</div><div class="dialog">👩‍🎓 <b>Élève :</b> A comme arbre. <button class="btn secondary" onclick='say("A comme arbre")'>🔊</button></div><div class="dialog">👨‍🏫 <b>Professeur :</b> E comme éléphant. <button class="btn secondary" onclick='say("E comme éléphant")'>🔊</button></div><button class="btn" onclick="setProgress(45)">أتممت Role Play</button>`}function practice(){let a=d.vocabulary||[];let x=a.slice(0,4);return`<h2>✍️ التدريب</h2><p>اختر الكلمة الصحيحة للمعنى.</p>${x.map((v,i)=>`<article class="card"><b>${esc(v[1])}</b><div class="opts"><button class="opt" onclick="ans(this,${i===0})">${esc(v[0])}</button><button class="opt" onclick="ans(this,false)">اختيار آخر</button></div></article>`).join('')}`}function ans(b,ok){b.classList.add(ok?'good':'bad');if(ok)setProgress(Math.max(Number(localStorage.getItem(key())||0),65))}function video(){return`<h2>🎬 الفيديو</h2><div class="goal">فيديو الدرس يُربط فقط عند توفر الـasset الأصلي الموثق داخل الحزمة. لن نضع رابطًا وهميًا.</div>`}function games(){return`<h2>🎮 الألعاب</h2><div class="goal"><b>تحدي الأبجدية:</b> اسمع الحرف ثم حدده من بين الاختيارات.</div><div class="opts"><button class="opt" onclick='say("Y")'>A</button><button class="opt" onclick='say("Y")'>Y</button><button class="opt" onclick='say("Y")'>H</button></div><button class="btn" onclick="setProgress(75)">إنهاء التحدي</button>`}function smart(){return`<h2>🧠 المراجعة الذكية</h2><div class="goal">ابدأ من أضعف مهارة لديك. عند إعادة الدرس، نعيدك إلى المفردات والنطق والتدريب بدل إعادة كل شيء.</div><button class="btn" onclick="go('vocabulary')">راجع المفردات</button><button class="btn secondary" onclick="go('pronunciation')">راجع النطق</button><button class="btn secondary" onclick="go('practice')">أعد التدريب</button>`}function assess(){return`<h2>🏆 التقييم</h2><div class="goal">التقييم الرسمي للمصدر محفوظ منفصلًا. هذه مساحة تحقق قصيرة قبل التقييم الرسمي.</div><div class="card"><b>أي كلمة تبدأ بالحرف E؟</b><div class="opts"><button class="opt" onclick="ans(this,true)">éléphant</button><button class="opt" onclick="ans(this,false)">orange</button></div></div><button class="btn" onclick="setProgress(90)">اجتز التحقق</button>`}function progress(){let n=Number(localStorage.getItem(key())||0);return`<h2>📈 تقدمك</h2><div class="goal">${n>=100?'🎉 أحسنت! أكملت الدرس.':'أكملت '+n+'% من تجربة الدرس.'}<br><br>المهارات: المفردات · النطق · القراءة · التدريب</div><button class="btn" onclick="finish()">تأكيد إكمال الدرس</button>`}const V={introduction:intro,vocabulary:vocab,pronunciation:pron,grammar,conversation:convo,practice,video,games,'smart-review':smart,assessment:assess,progress};fetch('data/lessons/grade-7/grade7-source-content.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{d=x.lessons.find(z=>z.id===id);if(!d)throw Error('lesson');title.textContent=d.titleAr+' · '+d.titleFr;nav();panel.innerHTML=(V[sec]||intro)();status()}).catch(()=>panel.innerHTML='<div class="goal">تعذر تحميل بيانات الدرس. يرجى المحاولة مرة أخرى.</div>');</script></body></html>
