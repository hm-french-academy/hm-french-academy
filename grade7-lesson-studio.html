<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HM Academy | الصف الأول الإعدادي</title><style>body{margin:0;background:#f4f7fb;color:#16213e;font-family:Arial,sans-serif}.w{max-width:1100px;margin:auto;padding:10px}.b{background:#fff;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 6px 24px #173a8212}.hero{color:#fff;background:linear-gradient(135deg,#173a82,#2563eb,#0f9f91)}h1{margin:8px 0}.tabs{display:flex;gap:7px;overflow:auto}.tabs a{white-space:nowrap;text-decoration:none;padding:9px 12px;border-radius:999px;background:#edf2fb;color:#173a82;font-weight:800}.tabs a.on{background:#2563eb;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.card{border:1px solid #dfe6f0;border-radius:14px;padding:12px}.fr{direction:ltr;text-align:center;font-size:21px;font-weight:900}.ar{text-align:center;color:#315aa4;font-weight:800}.item{background:#f8fafc;border:1px solid #e1e7f0;border-radius:11px;padding:10px;margin:7px 0;line-height:1.8}.btn{border:0;border-radius:10px;padding:9px 12px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.notice{padding:12px;background:#fff8e8;border-right:4px solid #f59e0b;border-radius:10px;line-height:1.8}.ok{background:#e9f9ef}.bad{background:#fff0f3}@media(max-width:600px){.w{padding:7px}}</style></head><body><div class="w"><section class="b hero"><b>🇫🇷 HM Academy · الصف الأول الإعدادي</b><h1 id="title">جاري تحميل الدرس…</h1><div>نسخة مستقلة للمرحلة: تعتمد فقط على بيانات Grade 7.</div></section><nav class="b tabs" id="lessons"></nav><nav class="b tabs" id="sections"></nav><main class="b" id="app">جاري تحميل محتوى الدرس…</main></div><script>
const SECTIONS=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];
const LESSONS=[['grade7-u1-l1','الوحدة 1 · الدرس 1'],['grade7-u1-l2','الوحدة 1 · الدرس 2'],['grade7-u1-l3','الوحدة 1 · الدرس 3'],['grade7-u1-l4','الوحدة 1 · الدرس 4'],['grade7-u1-l5','الوحدة 1 · الدرس 5'],['grade7-u1-l6','الوحدة 1 · الدرس 6'],['grade7-u2-l1','الوحدة 2 · الدرس 1'],['grade7-u2-l2','الوحدة 2 · الدرس 2'],['grade7-u3-l1','الوحدة 3 · الدرس 1'],['grade7-u3-l2','الوحدة 3 · الدرس 2'],['grade7-u3-l3','الوحدة 3 · الدرس 3']];
const p=new URLSearchParams(location.search),id=p.get('id')||'grade7-u1-l1',section=p.get('section')||'introduction';let d=null;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function path(){const m=id.match(/^grade7-u([1-3])-l([1-6])$/);return m?`data/lessons/grade-7/unit-${m[1]}/lesson-${m[2]}.json`:null}function nav(){lessons.innerHTML=LESSONS.map(x=>`<a class="${x[0]===id?'on':''}" href="?id=${x[0]}&section=${section}">${x[1]}</a>`).join('');sections.innerHTML=SECTIONS.map(x=>`<a class="${x[0]===section?'on':''}" href="?id=${id}&section=${x[0]}">${x[1]}</a>`).join('')}function speak(x){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x);u.lang='fr-FR';speechSynthesis.speak(u)}function allItems(){let a=[];(d.sourceSections||[]).forEach(s=>(s.items||[]).forEach(x=>a.push(x)));return a}function vocab(a){return a.length?`<div class="grid">${a.map(x=>`<article class="card"><div class="fr">${esc(x[0])}</div><div class="ar">${esc(x[2]||x[1]||'')}</div>${x[3]?`<div class="item">${esc(x[3])}</div>`:''}<button class="btn" onclick='speak(${JSON.stringify(String(x[0]))})'>🔊 استمع</button></article>`).join('')}</div>`:'<div class="notice">لا توجد مفردات موثقة في ملف المصدر لهذا الدرس.</div>'}function practice(){let q=d.embeddedPractice||[];if(!q.length)return '<div class="notice">لا توجد أسئلة تدريب مضمّنة في ملف المصدر.</div>';return q.map((x,i)=>`<article class="card"><b>${i+1}. ${esc(x.q)}</b><div class="grid">${(x.options||[]).map(o=>`<button class="btn" onclick="this.parentNode.nextElementSibling.innerHTML=(this.dataset.c==='1'?'<span class=\'ok\'>✅ صحيح</span>':'<span class=\'bad\'>❌ حاول مرة أخرى — الإجابة الصحيحة: ${esc(x.answer)}</span>')" data-c="${o===x.answer?'1':'0'}">${esc(o)}</button>`).join('')}</div><div class="item"></div></article>`).join('')}function render(){nav();title.textContent=(d.titleFr||id)+' — '+(d.titleAr||'');let h='';if(section==='introduction'){let j=d.journeyContent?.introduction||{};h=`<h2>🚀 البداية</h2><p>${esc(j.goal||'استكشف الدرس من المصدر.')}</p>`+(d.sourceSections||[]).map(s=>`<div class="item"><b>${esc(s.title||'قسم المصدر')}</b>${s.verified?' · ✅ موثق':''}</div>`).join('')}else if(section==='vocabulary'){h='<h2>🖼️ المفردات</h2>'+vocab(d.journeyContent?.vocabulary?.items||allItems())}else if(section==='pronunciation'){h='<h2>🎧 النطق</h2>'+vocab((d.journeyContent?.pronunciation?.items||[]).map(x=>[x,'','']))}else if(section==='grammar'){let g=d.journeyContent?.grammar||{};h=`<h2>📘 ${esc(g.title||'القواعد')}</h2><p>${esc(g.explanation||'لا توجد قاعدة مسجلة في ملف الدرس.')}</p>`}else if(section==='conversation'){let a=d.journeyContent?.conversation?.prompts||[];h='<h2>💬 المحادثة</h2>'+a.map(x=>`<div class="item" dir="ltr">${esc(x)} <button class="btn" onclick='speak(${JSON.stringify(x)})'>🔊</button></div>`).join('')}else if(section==='practice'){h='<h2>✍️ التدريب</h2>'+practice()}else if(section==='assessment'){let a=d.formalAssessment||{};h=`<h2>🏆 التقييم</h2><div class="notice">إجمالي الأسئلة المسجل في المصدر: ${esc(a.sourceDeclaredTotal||'غير محدد')}</div>`}else if(section==='video'){h='<h2>🎬 الفيديو</h2><div class="notice">لا يتم استدعاء فيديو إلا إذا كان رابطه موثقًا داخل بيانات Grade 7.</div>'}else if(section==='games'){h='<h2>🎮 الألعاب</h2><div class="notice">لا توجد لعبة موثقة داخل ملف المصدر لهذا الدرس.</div>'}else if(section==='smart-review'){h='<h2>🧠 المراجعة الذكية</h2><div class="notice">المراجعة مرتبطة بهذا الدرس فقط، ولا تستخدم بيانات الصف الثاني الإعدادي.</div>'}else{h='<h2>📈 التقدم</h2><div class="notice">تقدم هذه النسخة مستقل عن أي مرحلة أخرى.</div>'}app.innerHTML=h}async function load(){try{let u=path();if(!u)throw Error('معرف الدرس غير صالح.');let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);d=await r.json();if(d.id!==id)throw Error('بيانات الدرس لا تطابق المعرف.');render()}catch(e){nav();app.innerHTML=`<div class="notice"><b>تعذر تحميل محتوى هذا الدرس.</b><br>${esc(e.message)}</div>`}}load();
</script></body></html>
