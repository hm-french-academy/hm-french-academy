<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | الصف الأول الإعدادي</title><style>body{margin:0;background:#f4f7fb;color:#17223b;font-family:Arial,sans-serif}.w{max-width:1100px;margin:auto;padding:12px}.hero,.tabs,.panel,footer{background:#fff;border-radius:20px;padding:16px;margin:10px 0;box-shadow:0 5px 20px #0000000b}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff}.tabs{display:flex;gap:7px;overflow:auto}.tab,.btn,.opt{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer}.tab{white-space:nowrap;background:#edf2fb;color:#173a82}.on,.btn{background:#2563eb;color:#fff}.panel{min-height:430px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.card{border:1px solid #dfe5ef;border-radius:15px;padding:13px;background:#fff}.fr{direction:ltr;text-align:center;font-size:20px;font-weight:900}.ar{text-align:center;color:#315aa4;margin:5px}.goal{background:#f7f9fd;border-radius:14px;padding:14px;line-height:1.9}.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.opt{background:#fff;border:1px solid #dbe1eb}.good{background:#ecfdf3!important}.bad{background:#fff0f5!important}.bar{height:9px;background:#e5eaf2;border-radius:9px}.fill{height:100%;background:#2563eb;width:0;border-radius:9px}.small{font-size:13px;color:#718096}.dialog{background:#f7f9fd;padding:11px;border-right:4px solid #e92d83;margin:7px 0}.rule{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.rule span{background:#edf2fb;color:#173a82;padding:9px;border-radius:10px;font-weight:bold}.lessonbar{display:flex;gap:7px;overflow:auto;padding:5px}.lessonbar a{padding:8px 11px;border-radius:10px;background:#eef3fb;color:#173a82;text-decoration:none;font-weight:bold;white-space:nowrap}.source{border-right:4px solid #14b8a6}.enrich{border-right:4px solid #e92d83}</style></head><body>< const d=data[id]||data['grade7-u1-l1'];document.getElementById('title').textContent=d.fr+' — '+d.ar;document.getElementById('goal').textContent=d.goal;document.getElementById('lessons').innerHTML=Object.keys(data).map((k,i)=>`<a href="?id=${k}&section=${sec}" class="${k===id?'on':''}">الدرس ${i+1}</a>`).join('');document.getElementById('tabs').innerHTML=sections.map(s=>`<a class="tab ${s[0]===sec?'on':''}" href="?id=${id}&section=${s[0]}">${s[1]}</a>`).join('');const esc=x=>String(x).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));function render(){let h='';if(sec==='introduction')h=`<div class="goal"><b>هدف التعلم</b><br>${esc(d.goal)}</div><div class="card source"><b>المحتوى الأصلي</b><p>هذا القسم يقدم مدخلًا واضحًا للدرس قبل الانتقال إلى التدريب والإثراء.</p></div>`;else if(sec==='vocabulary'||sec==='pronunciation')h=`<div class="grid">${(d.v||[]).map(x=>`<div class="card"><div class="fr">${esc(x[0])}</div><div class="ar">${esc(x[1])}</div><button class="btn" onclick="speechSynthesis.speak(new SpeechSynthesisUtterance('${esc(x[0]).replace(/'/g,"\\'")}'))">🔊 اسمع</button></div>`).join('')}</div>`;else if(sec==='grammar')h=`<div class="card enrich"><h2>📘 القاعدة بطريقة مبسطة</h2><p>${esc(d.goal)}</p><div class="rule">${(d.extra||d.v||[]).slice(0,12).map(x=>`<span>${esc(Array.isArray(x)?x[0]:x)}</span>`).join('')}</div></div>`;else if(sec==='conversation')h=`<div class="dialog"><b>🇫🇷 حوار تطبيقي</b><br>— Bonjour !<br>— Bonjour ! Ça va ?<br>— Ça va bien, merci. Et toi ?<br>— Très bien !</div><div class="card enrich">تدرّب على استبدال الكلمات بما يناسب موضوع الدرس.</div>`;else if(sec==='practice'||sec==='games')h=`<div class="card"><h2>${sec==='games'?'🎮 تحدي سريع':'✍️ تدريب تفاعلي'}</h2><p>اختر الإجابة الصحيحة:</p><div class="opts"><button class="opt" onclick="this.classList.add('good')">${esc((d.v||[])[0]?.[0]||'اختيار A')}</button><button class="opt" onclick="this.classList.add('bad')">اختيار B</button><button class="opt" onclick="this.classList.add('
