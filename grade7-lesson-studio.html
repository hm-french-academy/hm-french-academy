<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/images/hm-academy-favicon.svg?v=3"><title>HM Academy | الصف الأول الإعدادي</title><style>body{margin:0;background:#f4f7fb;color:#16213e;font-family:Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:12px}.hero,.panel,.progress{background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 8px 28px #14264a12}.hero{color:#fff;background:linear-gradient(135deg,#173a82,#2563eb,#0f9f91)}h1{margin:8px 0;line-height:1.35}.tabs{display:flex;gap:7px;overflow:auto;flex-wrap:wrap;padding:4px 0}.tabs a,.btn,.opt{border:0;border-radius:11px;padding:10px 13px;text-decoration:none;font-weight:800;background:#edf2fb;color:#173a82;white-space:nowrap;cursor:pointer}.tabs a.on,.btn{background:#2563eb;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.card{background:#fff;border:1px solid #dfe6f1;border-radius:16px;padding:14px}.source{border-right:5px solid #0f9f91}.enrich{border-right:5px solid #e92d83}.fr{direction:ltr;text-align:center;font-size:21px;font-weight:900}.ar{text-align:center;color:#315aa4;margin-top:6px;font-weight:800}.notice{padding:13px;border-radius:12px;background:#fff8e8;border-right:4px solid #f59e0b;line-height:1.8}.ok{padding:13px;border-radius:12px;background:#eefbf3;border-right:4px solid #21a366}.small,.muted{font-size:13px;color:#68758d;line-height:1.8}.stage{padding:9px;border-radius:10px;background:#f6f8fc;margin:5px 0}.done{background:#eefbf3}.vocab-card{overflow:hidden;padding:0}.vocab-visual{min-height:125px;display:grid;place-items:center;background:linear-gradient(135deg,#eef5ff,#f8fbff);border-bottom:1px solid #e1e8f3}.vocab-icon{font-size:65px}.vocab-body{padding:13px;text-align:center}.vocab-actions{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:9px}.example{direction:ltr;text-align:center;margin-top:7px;font-size:17px;font-weight:800;color:#0f766e}.section-lead{background:#f7faff;border:1px solid #dfe8f5;border-radius:14px;padding:13px;line-height:1.9;margin:10px 0}.qbox{background:#fff;border:1px solid #dfe6f1;border-radius:15px;padding:14px;margin:10px 0}.opts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.result{margin-top:9px;font-weight:800}.review-row{display:flex;gap:8px;flex-wrap:wrap}.review-chip{padding:9px 12px;border-radius:999px;background:#edf3ff;color:#173a82;font-weight:800;border:0;cursor:pointer}@media(max-width:560px){.wrap{padding:9px}.hero,.panel,.progress{border-radius:17px;padding:13px}.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="hero"><div>🇫🇷 HM Academy · الصف الأول الإعدادي</div><h1 id="title">جاري التحميل…</h1><div id="goal"></div></section><nav class="tabs" id="tabs"></nav><main class="panel" id="panel"><div class="notice">جاري تجهيز محتوى الدرس…</div></main><section class="progress"><b>📈 تقدم الرحلة</b><div id="progressText" class="small"></div></section></div><script>const STAGES=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']],IDS=['grade7-u1-l1','grade7-u1-l2','grade7-u1-l3','grade7-u1-l4','grade7-u1-l5','grade7-u1-l6','grade7-u2-l1','grade7-u2-l2','grade7-u3-l1','grade7-u3-l2','grade7-u3-l3'];const q=new URLSearchParams(location.search);let id=q.get('id')||'grade7-u1-l1',currentSection=q.get('section')||'introduction',data=null;const titleEl=document.getElementById('title'),goalEl=document.getElementById('goal'),tabsEl=document.getElementById('tabs'),panelEl=document.getElementById('panel'),progressEl=document.getElementById('progressText');const esc=x=>String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const speak=t=>{if(window.speechSynthesis){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t));u.lang='fr-FR';speechSynthesis.speak(u)}};const done=s=>localStorage.getItem('hm-g7:'+id+':'+s)==='1';function links(){tabsEl.innerHTML=STAGES.map(x=>`<a class="${x[0]===currentSection?'on':''}" href="?id=${encodeURIComponent(id)}&section=${x[0]}">${x[1]}</a>`).join('')}function list(a){a=Array.isArray(a)?a:[];return a.length?`<div class="grid">${a.map(x=>`<div class="card">${esc(Array.isArray(x)?x.join(' — '):x)}</div>`).join('')}</div>`:'<div class="notice">لا توجد عناصر معروضة في هذا القسم حاليًا.</div>'}const visuals={'A':'🌳','E':'🐘','I':'🖼️','O':'🍊','U':'👕','Y':'🪀','H':'🏥','Un pyjama':'🛏️','Un pantalon':'👖','Un taxi':'🚕','Un domino':'🎲','Un canapé':'🛋️','Un téléphone':'📱','Un biscuit':'🍪','Un balcon':'🏢','Un vase':'🏺','Un ascenseur':'🛗','Une caméra':'📹','Un autobus':'🚌','Un gilet':'🦺','Une écharpe':'🧣','Un bouquet':'💐','Une guitare':'🎸','Une télévision':'📺','Une plage':'🏖️','Une lampe':'💡','Une raquette':'🏸','Une radio':'📻','Un piano':'🎹','Un garage':'🚗','Un cinéma':'🎬','Un journal':'📰'};function visualFor(term){let t=String(term||'');if(visuals[t])return visuals[t];let s=t.toLowerCase();if(/bonjour|salut|bonsoir/.test(s))return'👋';if(/école|classe|professeur|élève/.test(s))return'🎒';if(/chat|chien|oiseau|animal/.test(s))return'🐾';if(/pomme|banane|orange|fruit|pain|lait|eau/.test(s))return'🍎';return'🇫🇷'}function vocabCard(x){let fr=Array.isArray(x)?x[0]??'':x,ex=Array.isArray(x)&&x.length>2?x[1]:'',ar=Array.isArray(x)?x[x.length>2?2:1]:'';return `<article class="card vocab-card"><div class="vocab-visual"><div class="vocab-icon" role="img" aria-label="${esc(fr)}">${visualFor(fr)}</div></div><div class="vocab-body"><div class="fr">${esc(fr)}</div>${ex?`<div class="example">${esc(ex)}</div>`:''}${ar?`<div class="ar">${esc(ar)}</div>`:''}<div class="vocab-actions"><button class="btn" type="button" onclick='speak(${JSON.stringify(String(fr))})'>🔊 ${/^[A-ZÀ-Ÿ]$/.test(String(fr).trim())?'نطق الحرف':'استمع'}</button>${ex?`<button class="btn" type="button" onclick='speak(${JSON.stringify(String(ex))})'>🔊 نطق المثال</button>`:''}</div></div></article>`}function cards(a){a=Array.isArray(a)?a:[];return a.length?`<div class="grid">${a.map(vocabCard).join('')}</div>`:'<div class="notice">لا توجد مفردات أو عناصر معروضة في هذا القسم حاليًا.</div>'}function sections(){return Array.isArray(data?.sourceSections)?data.sourceSections:[]}function allItems(){return sections().flatMap(s=>Array.isArray(s?.items)?s.items:[])}function vocabularyItems(){const v=data?.journeyContent?.vocabulary?.items;return Array.isArray(v)&&v.length?v:(allItems().length?allItems():(data?.sourceAtoms||[]))}function pronunciationItems(){const p=data?.journeyContent?.pronunciation?.items;return Array.isArray(p)&&p.length?p:vocabularyItems()}function renderGames(){const items=vocabularyItems().filter(Array.isArray).map(x=>({fr:String(x[0]||''),ar:String(x[2]||x[1]||'')})).filter(x=>x.fr),letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');let mode='race',score=0,round=0;const shuffle=a=>a.slice().sort(()=>Math.random()-.5);function draw(){round++;let answer,opts,title,prompt;if(mode==='race'){answer=letters[Math.floor(Math.random()*letters.length)];opts=shuffle([answer,...shuffle(letters.filter(x=>x!==answer)).slice(0,2)]);title='🏁 سباق الحروف';prompt='اختر الحرف المطلوب: '+answer}else if(mode==='who'){let p=items[Math.floor(Math.random()*items.length)]||{fr:'Un taxi',ar:'تاكسي'};answer=p.fr;opts=shuffle([answer,...shuffle(items.filter(x=>x.fr!==answer).map(x=>x.fr)).slice(0,2)]);title='🕵️ من أنا؟';prompt='اختر الكلمة التي معناها: '+p.ar}else{let p=shuffle(items).slice(0,3);answer=p.slice().sort((a,b)=>a.fr.localeCompare(b.fr,'fr'))[0]?.fr||'Un taxi';opts=shuffle(p.map(x=>x.fr));title='🔤 رتّب الكلمات';prompt='اختر الكلمة الأولى أبجديًا:'}panelEl.innerHTML=`<div class="card enrich"><div class="vocab-actions"><button class="btn" data-g="race">🏁 سباق الحروف</button><button class="btn" data-g="who">🕵️ من أنا؟</button><button class="btn" data-g="order">🔤 رتّب الكلمات</button></div><h2>${title}</h2><p>${esc(prompt)}</p><div class="grid">${opts.map(o=>`<button class="card opt game-option" type="button" data-answer="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="gameResult" class="result">الجولة ${round} — النتيجة ${score}</div></div>`;panelEl.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{mode=b.dataset.g;score=0;round=0;draw()});panelEl.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const ok=b.dataset.answer===answer;if(ok)score++;panelEl.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);document.getElementById('gameResult').innerHTML=ok?'✅ إجابة صحيحة — '+score+' نقطة':'❌ ليست الإجابة الصحيحة — الصحيح: <b>'+esc(answer)+'</b>';document.getElementById('gameResult').insertAdjacentHTML('beforeend','<br><button class="btn" id="nextGame" type="button">التالي</button>');document.getElementById('nextGame').onclick=draw})}draw()}function render(){const jc=data?.journeyContent||{};if(currentSection==='introduction')return `<div class="card source"><h2>🚀 بداية الدرس</h2><p>${esc(data.titleAr||data.titleFr||'')}</p><div class="section-lead">${esc(jc.introduction?.goal||data.goal||'التعرف على موضوع الدرس ومخرجاته.')}</div>${list(sections().map(x=>x.title))}</div>`;if(currentSection==='vocabulary')return `<div class="card source"><h2>🖼️ المفردات</h2><p class="muted">بطاقات بصرية من محتوى المصدر، مع معنى ونطق واضح.</p>${cards(vocabularyItems())}</div>`;if(currentSection==='pronunciation')return `<div class="card source"><h2>🎧 النطق</h2><p class="muted">استمع إلى الحروف والكلمات والأمثلة.</p>${cards(pronunciationItems())}</div>`;if(currentSection==='grammar')return `<div class="card enrich"><h2>📘 القواعد</h2><div class="section-lead"><b>Les mots transparents</b><br>الكلمات الشفافة تساعدك على التعرف السريع على كلمات فرنسية تشبه كلمات تعرفها، مع الانتباه إلى النطق الفرنسي.</div>${list(['Un pyjama — بيجاما','Un téléphone — تليفون','Une guitare — جيتار','Un cinéma — سينما'])}</div>`;if(currentSection==='conversation')return `<div class="card source"><h2>💬 التطبيق الشفهي</h2><div class="section-lead">لا يوجد حوار مستقل في المصدر؛ لذلك نستخدم عناصر الدرس نفسها في تدريب شفهي.</div><div class="vocab-actions"><button class="btn" onclick='speak("A comme arbre")'>🔊 A comme arbre</button><button class="btn" onclick='speak("Un téléphone")'>🔊 Un téléphone</button></div></div>`;if(currentSection==='practice'){const qs=Array.isArray(data.embeddedPractice)?data.embeddedPractice:[];return `<div class="card source"><h2>✍️ التدريب</h2><div class="section-lead">أسئلة تدريبية من محتوى الدرس مع تصحيح فوري وبيان الإجابة الصحيحة.</div>${qs.map((q,i)=>`<div class="qbox"><b>${i+1}. ${esc(q.q)}</b><div class="opts">${(q.options||[]).map(o=>`<button class="opt" type="button" data-answer="${esc(q.answer)}" data-value="${esc(o)}">${esc(o)}</button>`).join('')}</div><div class="result" aria-live="polite"></div></div>`).join('')}</div>`}if(currentSection==='video')return `<div class="card source"><h2>🎬 الفيديو</h2><div class="ok">المصدر المرتبط: ${esc(data.sourceFiles?.interactive||data.journeyConfig?.video?.source||'غير محدد')}</div></div>`;if(currentSection==='games'){renderGames();return ''}if(currentSection==='smart-review')return `<div class="card enrich"><h2>🧠 المراجعة الذكية</h2><div class="section-lead">مراجعة أهداف الدرس: الأبجدية، الحروف المتحركة، والكلمات الشفافة.</div><div class="review-row">${['A → arbre','E → éléphant','I → image','O → orange','U → uniforme','Y → yoyo','H → hôpital','Un téléphone','Une guitare','Un cinéma'].map(x=>`<button class="review-chip" onclick='speak(${JSON.stringify(x.includes('→')?x.split(' → ')[1]:x)})'>${esc(x)} 🔊</button>`).join('')}</div></div>`;if(currentSection==='assessment'){const a=data.formalAssessment;return `<div class="card source"><h2>🏆 التقييم</h2>${a?`<div class="ok">إجمالي التقييم الرسمي: <b>${esc(a.sourceDeclaredTotal)} سؤالًا</b></div>${list((a.sourceExerciseStructure||[]).map(x=>x.title+' — '+x.items+' عنصر'))}`:'<div class="notice">بيانات التقييم غير متاحة حاليًا.</div>'}</div>`}if(currentSection==='progress'){const n=STAGES.filter(x=>done(x[0])).length;return `<div class="card"><h2>📈 التقدم</h2><p>${n}/${STAGES.length} مراحل مكتملة.</p>${STAGES.map(x=>`<div class="stage ${done(x[0])?'done':''}">${done(x[0])?'✓':'○'} ${x[1]}</div>`).join('')}</div>`}return '<div class="notice">القسم المطلوب غير متاح.</div>'}async function jsonAt(url){const local=new URL(url,document.baseURI).href;const rawUrl='https://raw.githubusercontent.com/hm-french-academy/hm-french-academy/main/'+url;async function get(u){const c=new AbortController(),timer=setTimeout(()=>c.abort(),8000);try{const r=await fetch(u,{cache:'no-store',signal:c.signal});if(!r.ok)throw Error('HTTP '+r.status);let raw=JSON.parse(await r.text());for(let i=0;i<5&&raw&&typeof raw.content==='string';i++)raw=JSON.parse(raw.content);return raw}finally{clearTimeout(timer)}}try{return await get(local)}catch(e){return await get(rawUrl)}}async function load(){if(!IDS.includes(id))throw Error('lesson');try{data=await jsonAt(`data/lessons/grade-7/unit-${id.match(/u(\d+)-l(\d+)/)[1]}/lesson-${id.match(/u(\d+)-l(\d+)/)[2]}.json`)}catch(primary){try{data=await jsonAt('data/lessons/grade-7/grade7-source-content.json');data=(data.lessons||[]).find(x=>x.id===id)||data}catch(e){throw Error('تعذر الوصول إلى بيانات الدرس')}}if(!data||data.id!==id||data.grade!=='grade-7')throw Error('lesson-integrity');titleEl.textContent=`${data.titleFr||''} — ${data.titleAr||''}`;goalEl.textContent='منهج الصف الأول الإعدادي';links();if(currentSection==='games'){renderGames()}else{panelEl.innerHTML=render()}if(currentSection!=='progress')localStorage.setItem('hm-g7:'+id+':'+currentSection,'1');progressEl.textContent=STAGES.filter(x=>done(x[0])).length+' / '+STAGES.length+' مراحل مكتملة'}document.addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b)return;const box=b.closest('.qbox'),out=box?.querySelector('.result');if(!out)return;const ok=b.dataset.value===b.dataset.answer;out.innerHTML=ok?'✅ إجابة صحيحة':'❌ ليست الإجابة الصحيحة — الإجابة الصحيحة: <b>'+esc(b.dataset.answer)+'</b>';out.className='result '+(ok?'ok':'notice')});load().catch(e=>{console.error(e);titleEl.textContent='تعذر تحميل الدرس';goalEl.textContent='حدث خطأ في بيانات هذا الدرس';panelEl.innerHTML='<div class="notice"><b>تعذر تحميل محتوى هذا الدرس.</b><br>'+esc(e.message||'تحقق من الاتصال ثم أعد المحاولة.')+'</div>';progressEl.textContent='لم يتم تحميل محتوى الدرس بعد.'});</script></body></html>
