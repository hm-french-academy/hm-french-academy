const PATH=id=>{const m=/^grade7-u(\d+)-l(\d+)$/.exec(id);return m?`data/lessons/grade-7/unit-${m[1]}/lesson-${m[2]}.json`:null},SOURCE_PATH='data/lessons/grade-7/grade7-source-content.json',q=new URLSearchParams(location.search);let id=q.get('id')||'grade7-u1-l1',currentSection=q.get('section')||'introduction',data=null;const titleEl=document.getElementById('title'),goalEl=document.getElementById('goal'),tabsEl=document.getElementById('tabs'),panelEl=document.getElementById('panel'),progressEl=document.getElementById('progressText');const esc=x=>String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const speak=t=>{if(window.speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(String(t));u.lang='fr-FR';speechSynthesis.speak(u)}};const done=s=>localStorage.getItem('hm-g7:'+id+':'+s)==='1';
function links(){tabsEl.innerHTML=STAGES.map(x=>`<a class="${x[0]===currentSection?'on':''}" href="?id=${encodeURIComponent(id)}&section=${x[0]}">${x[1]}</a>`).join('')}function list(a){a=Array.isArray(a)?a:[];return a.length?`<div class="grid">${a.map(x=>`<div class="card">${esc(Array.isArray(x)?x.join(' — '):x)}</div>`).join('')}</div>`:'<div class="notice">لا توجد عناصر معروضة في هذا القسم حاليًا.</div>'}

const exactKeys=new Set(Object.keys(lesson1Visuals));function visualFor(term){if(id==='grade7-u1-l1'&&exactKeys.has(term)){let v=lesson1Visuals[term];return typeof v==='string'?{html:`<div class="vocab-icon" role="img" aria-label="${esc(term)}">${v}</div>`,label:'صورة الكلمة'}:{html:v,label:'صورة الكلمة'}}const s=String(term||'').toLowerCase(),rules=[[/bonjour|salut|bonsoir|bienvenue/,'👋','تحية'],[/ami|amie|garçon|fille|homme|femme|personne|famille/,'🧑‍🤝‍🧑','أشخاص'],[/école|classe|professeur|élève|livre|cahier|stylo|crayon|règle|cartable/,'🎒','المدرسة'],[/maison|chambre|porte|fenêtre|table|chaise|lit/,'🏠','المنزل'],[/rouge|orange|blanc|gris|bleu|violet|jaune|vert|marron|rose|noir/,'🎨','ألوان'],[/zéro|un|deux|trois|quatre|cinq|six|sept|huit|neuf|dix/,'🔢','أرقام'],[/janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre/,'📅','الزمن'],[/lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche/,'🗓️','أيام'],[/printemps|été|automne|hiver/,'🌦️','فصول'],[/chat|chien|oiseau|poisson|animal/,'🐾','حيوانات'],[/pomme|banane|orange|fraise|fruit|pain|lait|eau|café|fromage/,'🍎','طعام'],[/soleil|pluie|neige|vent|mer|montagne/,'🌤️','طبيعة'],[/heure|minute|matin|soir|aujourd|demain|hier/,'⏰','وقت']];for(const [re,icon,label] of rules)if(re.test(s))return{html:`<div class="vocab-icon">${icon}</div>`,label};return{html:'<div class="vocab-icon">🇫🇷</div>',label:'Français'}}
function vocabCard(x){let fr='',ar='';if(Array.isArray(x)){fr=x[0]??'';ar=x.length>2?x[2]:(x[1]??'')}else fr=x;let v=visualFor(fr);return `<article class="card vocab-card"><div class="vocab-visual"><span class="visual-kicker">${esc(v.label)}</span>${v.html}</div><div class="vocab-body"><div class="fr">${esc(fr)}</div>${ar?`<div class="ar">${esc(ar)}</div>`:''}<div class="vocab-actions"><button class="btn" type="button" onclick='speak(${JSON.stringify(String(fr))})'>🔊 استمع للنطق</button></div></div></article>`}function cards(a){a=Array.isArray(a)?a:[];return a.length?`<div class="grid">${a.map(vocabCard).join('')}</div>`:'<div class="notice">لا توجد مفردات أو عناصر معروضة في هذا القسم حاليًا.</div>'}function sections(){return Array.isArray(data?.sourceSections)?data.sourceSections:[]}function allSourceItems(){return sections().flatMap(s=>Array.isArray(s?.items)?s.items:[])}function vocabularyItems(){let v=data?.journeyContent?.vocabulary?.items;if(Array.isArray(v)&&v.length)return v;let a=allSourceItems();return a.length?a:(data?.sourceAtoms||[])}function pronunciationItems(){let p=data?.journeyContent?.pronunciation?.items;if(Array.isArray(p)&&p.length)return p;return vocabularyItems().map(x=>Array.isArray(x)?x[0]:x).filter(Boolean)}function practiceItems(){let p=data?.journeyContent?.practice?.sourceTasks;return Array.isArray(p)&&p.length?p:(data?.sourceActivities||[])}function grammarEnabled(){return data?.journeyConfig?.grammar?.enabled!==false&&data?.journeyConfig?.grammar?.mode!=='not-applicable'}function conversationItems(){let c=data?.journeyContent?.conversation?.sourcePreserved;return Array.isArray(c)?c:[]}
function render(){let jc=data?.journeyContent||{},cfg=data?.journeyConfig||{};if(currentSection==='introduction')return `<div class="card source"><h2>🚀 بداية الدرس</h2><p>${esc(data.titleAr||'')}</p><p>${esc(jc.introduction?.goal||cfg.introduction?.goal||data.goal||'التعرف على موضوع الدرس ومحتواه.')}</p>${sections().length?'<h3>مكونات المصدر</h3>'+list(sections().map(x=>x.title)):''}</div>`;if(currentSection==='vocabulary')return `<div class="card source"><h2>🖼️ المفردات</h2><p class="muted">مفردات الدرس من المصدر المعتمد — كل كلمة أصبحت بطاقة بصرية مستقلة مع نطق مباشر.</p>${cards(vocabularyItems())}</div>`;if(currentSection==='pronunciation')return `<div class="card source"><h2>🎧 النطق</h2><p class="muted">استمع إلى الكلمات والعبارات ثم كررها.</p>${cards(pronunciationItems())}</div>`;if(currentSection==='grammar')return grammarEnabled()?`<div class="card enrich"><h2>📘 القواعد</h2>${list(jc.grammar?.notes)}</div>`:'<div class="notice"><b>لا يوجد محور قواعد مستقل في هذا الدرس.</b></div>';if(currentSection==='conversation'){let c=conversationItems();return `<div class="card source"><h2>💬 المحادثة</h2>${c.length?list(c):'<div class="notice">لا يوجد حوار مستقل في هذا الدرس.</div>'}</div>`}if(currentSection==='practice'){let p=practiceItems();return `<div class="card source"><h2>✍️ التدريب</h2>${list(p)}</div>`}if(currentSection==='video')return `<div class="card source"><h2>🎬 الفيديو</h2><div class="ok">الفيديو مرتبط بالمصدر: ${esc(data.sourceFiles?.interactive||cfg.video?.source||'غير محدد')}.</div></div>`;if(currentSection==='games')return `<div class="card enrich"><h2>🎮 مركز الألعاب</h2>${list(jc.games||cfg.games?.games)}</div>`;if(currentSection==='smart-review')return `<div class="card enrich"><h2>🧠 المراجعة الذكية</h2>${list(jc.smartReview?.targets)}</div>`;if(currentSection==='assessment'){let a=data.formalAssessment;return `<div class="card source"><h2>🏆 التقييم</h2>${a?`<div class="ok">إجمالي الأسئلة المعلن في المصدر: <b>${esc(a.sourceDeclaredTotal)}</b></div>${list((a.sourceExerciseStructure||[]).map(x=>x.title))}`:'<div class="notice">التقييم الخاص بهذا الدرس غير متاح حاليًا.</div>'}</div>`}if(currentSection==='progress'){let n=STAGES.filter(x=>done(x[0])).length;return `<div class="card"><h2>📈 التقدم</h2><p>${n}/${STAGES.length} مراحل مكتملة.</p>${STAGES.map(x=>`<div class="stage ${done(x[0])?'done':''}">${done(x[0])?'✓':'○'} ${x[1]}</div>`).join('')}</div>`}return '<div class="notice">القسم المطلوب غير متاح.</div>'}
async function jsonAt(url){let r=await fetch(new URL(url,document.baseURI).href,{cache:'no-store'});if(!r.ok)throw Error('fetch-failed:'+r.status);let t=await r.text(),raw=JSON.parse(t);for(let i=0;i<4&&raw&&typeof raw.content==='string';i++){try{raw=JSON.parse(raw.content)}catch(e){break}}return raw}async function load(){if(!IDS.includes(id))throw Error('lesson');try{data=await jsonAt(PATH(id))}catch(primary){let source=await jsonAt(SOURCE_PATH),wanted=(source.lessons||[]).find(x=>x.id===id);if(!wanted)throw primary;data={...wanted,grade:'grade-7',sourceSections:(wanted.sections||[]).map(title=>({title})),sourceAtoms:[],sourceActivities:wanted.sections||[],journeyConfig:{grammar:{enabled:false,mode:'not-applicable'},conversation:{enabled:false,mode:'not-applicable'}}}}if(!data||data.id!==id||data.grade!=='grade-7')throw Error('lesson-integrity');titleEl.textContent=`${data.titleFr||''} — ${data.titleAr||''}`;goalEl.textContent='منهج الصف الأول الإعدادي';links();panelEl.innerHTML=render();if(currentSection!=='progress')localStorage.setItem('hm-g7:'+id+':'+currentSection,'1');progressEl.textContent=STAGES.filter(x=>done(x[0])).length+' / '+STAGES.length+' مراحل مكتملة'}load().catch(e=>{console.error(e);panelEl.innerHTML='<div class="notice"><b>تعذر تحميل محتوى هذا الدرس.</b><br>تحقق من اتصال الإنترنت ثم أعد المحاولة.</div>'});</script></body></html>
