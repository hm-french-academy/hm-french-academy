<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | الصف الأول الإعدادي</title><style>body{margin:0;background:#f3f6fb;color:#16213e;font-family:Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#0f9f91);color:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 28px #0001}.eyebrow{font-size:13px;opacity:.9}.hero h1{margin:7px 0}.lessonbar,.tabs{display:flex;gap:7px;overflow:auto;background:#fff;border-radius:18px;padding:9px;margin:11px 0;box-shadow:0 5px 20px #0000000b}.lessonbar a,.tab{border:0;border-radius:11px;padding:9px 12px;background:#edf2fb;color:#173a82;text-decoration:none;font-weight:800;white-space:nowrap;cursor:pointer}.lessonbar a.on,.tab.on{background:#2563eb;color:#fff}.panel{background:#fff;border-radius:20px;min-height:480px;padding:18px;box-shadow:0 5px 20px #0000000b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}.card{border:1px solid #e0e6f0;border-radius:16px;padding:14px;background:#fff}.source{border-right:5px solid #0f9f91}.enrich{border-right:5px solid #e92d83}.fr{direction:ltr;text-align:center;font-size:20px;font-weight:900}.ar{text-align:center;color:#315aa4;margin-top:5px}.btn,.opt{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.btn{background:#2563eb;color:#fff}.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.opt{background:#f7f9fd;border:1px solid #dbe2ee}.good{background:#e9f9ef!important}.bad{background:#fff0f2!important}.dialog{background:#f8faff;padding:13px;border-right:5px solid #e92d83;border-radius:13px;line-height:2}.rule{display:flex;flex-wrap:wrap;gap:8px}.rule span{background:#edf2fb;color:#173a82;padding:8px 10px;border-radius:9px;font-weight:800}.progress{margin-top:12px}.bar{height:9px;background:#e5eaf2;border-radius:9px;overflow:hidden}.fill{height:100%;background:#2563eb;width:0}.small{font-size:13px;color:#718096}.notice{padding:11px;background:#fff8e8;border-right:4px solid #f59e0b;border-radius:10px}.loading{text-align:center;padding:60px}.locked{opacity:.75}</style></head><body><div class="wrap"><section class="hero"><div class="eyebrow">🇫🇷 HM Academy · Learning Studio · الصف الأول الإعدادي</div><h1 id="title">جاري تحميل الدرس…</h1><p id="goal"></p></section><div class="lessonbar" id="lessons"></div><nav class="tabs" id="tabs"></nav><main id="panel" class="panel"><div class="loading">جاري تحميل محتوى المصدر…</div></main><section class="progress card"><b>📈 تقدم الرحلة</b><div class="small" id="state"></div><div class="bar"><div id="fill" class="fill"></div></div></section></div><script>
const sections=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];
const base={
'grade7-u1-l1':{fr:'Bienvenue en français !',ar:'مرحبًا بك في الفرنسية!',goal:'مدخل إلى الفرنسية والتحيات الأولى.',v:[['Bonjour','مرحبًا'],['Salut','أهلاً'],['Au revoir','إلى اللقاء'],['Merci','شكرًا'],["S’il vous plaît",'من فضلك']]},
'grade7-u1-l2':{fr:'Les salutations',ar:'التحيات',goal:'تمييز التحيات والتعبير عن الحالة.',v:[['Salut !','مرحبًا'],['Bonjour','مرحبًا / صباح الخير'],['Bonsoir','مساء الخير'],['Ça va bien.','أنا بخير'],['Ça va mal.','أنا لست بخير'],['Comme ci, comme ça.','هكذا هكذا']]},
'grade7-u1-l3':{fr:'Les pronoms sujets et les verbes du 1er groupe',ar:'ضمائر الفاعل وأفعال المجموعة الأولى',goal:'استخدام الضمائر وتصريف أفعال المجموعة الأولى.',v:[['Je','أنا'],['Tu','أنت'],['Il','هو'],['Elle','هي'],['Nous','نحن'],['Vous','أنتم'],['Ils','هم'],['Elles','هنّ']],extra:['parler','aimer','chanter','présenter']},
'grade7-u1-l4':{fr:'Le verbe être et la présentation',ar:'فعل être والتقديم',goal:'استخدام être والتعريف بالنفس والآخرين.',v:[['Je suis','أنا'],['Tu es','أنت'],['Il / Elle est','هو / هي'],['Nous sommes','نحن'],['Vous êtes','أنتم'],['Ils / Elles sont','هم / هنّ']],extra:['Je m’appelle Ahmed.','Je suis un garçon.','Il s’appelle Marc.','Voilà Marc.','Nous sommes élèves.']},
'grade7-u1-l5':{fr:'Les nombres (0-20)',ar:'الأعداد من 0 إلى 20',goal:'قراءة وكتابة الأعداد من 0 إلى 20.',v:[['zéro','0'],['un','1'],['deux','2'],['trois','3'],['quatre','4'],['cinq','5'],['six','6'],['sept','7'],['huit','8'],['neuf','9'],['dix','10'],['onze','11'],['douze','12'],['treize','13'],['quatorze','14'],['quinze','15'],['seize','16'],['dix-sept','17'],['dix-huit','18'],['dix-neuf','19'],['vingt','20']]},
'grade7-u1-l6':{fr:'L’heure',ar:'الساعة',goal:'قراءة الوقت والتعبير عنه بالفرنسية.',v:[['Il est une heure','1:00'],['Il est deux heures cinq','2:05'],['Il est deux heures dix','2:10'],['Il est deux heures et quart','2:15'],['Il est deux heures vingt','2:20'],['Il est deux heures et demie','2:30'],['Il est trois heures moins vingt','2:40'],['Il est trois heures moins le quart','2:45'],['Il est trois heures moins cinq','2:55'],['Il est midi','12:00'],['Il est minuit','00:00']]}}
let source={};
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';speechSynthesis.speak(u)}}
async function loadSource(){try{const r=await fetch('data/lessons/grade-7/unit-1/lessons-7-11-source-extracted.json',{cache:'no-store'});if(!r.ok)throw new Error(r.status);const j=await r.json();source=j.lessons||{};}catch(e){console.warn('Source extraction unavailable',e)}}
function makeData(){for(const n of ['7','8','9','10','11']){const x=source[n];if(!x)continue;let v=[];if(x.avoir)v=x.avoir.map(a=>[a[0]+' '+a[1],'تصريف avoir']);if(x.age_example)v.push([x.age_example,'مثال على العمر']);if(x.articles)v.push(...x.articles.map(a=>[a[0],a[1]]));if(x.objects)v.push(...x.objects.map(a=>[a,'من أدوات الفصل']));if(x.colors)v=x.colors.map(a=>[a,'لون']);if(x.agreement)v.push(...x.agreement.map(a=>[a,'اتفاق صفة اللون']));if(x.days_france)v.push(...x.days_france.map(a=>[a,'يوم في الأسبوع']));if(x.months)v=x.months.map(a=>[a,'شهر']);if(x.seasons)v.push(...x.seasons.map(a=>[a.fr,a.months]));if(x.weather)v.push(...x.weather.map(a=>[a,'الطقس']));base['grade7-u1-l'+n]={fr:x.title,ar:'الدرس '+n,goal:'محتوى مبني على المصدر الأصلي مع إثراء تعليمي منفصل.',v:v,source:x}}}
function current(){const p=new URLSearchParams(location.search);return [p.get('id')||'grade7-u1-l1',p.get('section')||'introduction']}
function nav(id,sec){document.getElementById('lessons').innerHTML=Object.keys(base).map((k,i)=>`<a class="${k===id?'on':''}" href="?id=${k}&section=${sec}">الدرس ${i+1}</a>`).join('');document.getElementById('tabs').innerHTML=sections.map(s=>`<a class="tab ${s[0]===sec?'on':''}" href="?id=${id}&section=${s[0]}">${s[1]}</a>`).join('')}
function cards(arr){return `<div class="grid">${arr.map(x=>`<article class="card"><div class="fr">${esc(x[0])}</div><div class="ar">${esc(x[1])}</div><button class="btn" onclick="speak(${JSON.stringify(String(x[0]))})">🔊 النطق</button></article>`).join('')}</div>`}
function render(id,sec){const d=base[id]||base['grade7-u1-l1'];document.getElementById('title').textContent=d.fr+' — '+d.ar;document.getElementById('goal').textContent=d.goal;nav(id,sec);let h='';const s=d.source;
if(sec==='introduction')h=`<div class="goal card"><h2>هدف الدرس</h2><p>${esc(d.goal)}</p></div><div class="card source"><b>المصدر الأصلي</b><p>${s?'تم تحميل بيانات هذا الدرس من Source Extraction المرتبط بالـInteractive HTML الأصلي.':'هذا الدرس من المحتوى المبني سابقًا داخل الـStudio.'}</p></div>`;
else if(sec==='vocabulary'||sec==='pronunciation')h=cards(d.v||[]);
else if(sec==='grammar'){let r=[];if(s?.avoir)r=s.avoir.map(a=>a[0]+' → '+a[1]);else if(s?.articles)r=s.articles.map(a=>a[0]+' — '+a[1]);else if(s?.agreement)r=s.agreement;else if(id.endsWith('l10'))r=['le','la',"l’",'les'];else if(id.endsWith('l11'))r=s?.seasons?.map(a=>a.fr+' : '+a.months)||[];else r=d.extra||[];h=`<div class="card enrich"><h2>📘 القاعدة — شرح مبسط</h2><p>${esc(d.goal)}</p><div class="rule">${r.map(x=>`<span>${esc(x)}</span>`).join('')}</div></div>`;}
else if(sec==='conversation'){let lines=[];if(id.endsWith('l7'))lines=['— Quel âge as-tu ?','— J’ai treize ans.','— Et ton ami ?','— Il a douze ans.'];else if(id.endsWith('l8'))lines=['— Qu’est-ce que c’est ?','— C’est un livre.','— Qu’est-ce qu’il y a dans ton sac ?','— Il y a une trousse et un stylo.'];else if(id.endsWith('l9'))lines=['— De quelle couleur est le sac ?','— Il est bleu.','— Et la trousse ?','— Elle est rouge.'];else if(id.endsWith('l10'))lines=['— Quel jour sommes-nous ?','— Nous sommes lundi.','— Tu as le livre ?','— Oui, j’ai le livre.'];else if(id.endsWith('l11'))lines=['— Quel mois sommes-nous ?','— Nous sommes en juillet.','— Quelle saison ?','— C’est l’été. Il fait chaud.'];else lines=['— Bonjour !','— Bonjour ! Ça va ?','— Ça va bien, merci. Et toi ?','— Très bien !'];h=`<div class="dialog">${lines.map(x=>`<div>${esc(x)}</div>`).join('')}</div><div class="card enrich"><b>🎯 إثراء:</b> استبدل الكلمات الأساسية بمفردات الدرس وكرر الحوار بصوتك.</div>`;}
else if(sec==='practice'||sec==='games'){const q=d.v?.[0]?.[0]||'اختيار';h=`<div class="card"><h2>${sec==='games'?'🎮 تحدي':'✍️ تدريب'}</h2><p>اختر العنصر الصحيح المرتبط بالدرس:</p><div class="opts"><button class="opt" onclick="this.classList.add('good')">${esc(q)}</button><button class="opt" onclick="this.classList.add('bad')">اختيار آخر</button><button class="opt" onclick="this.classList.add('bad')">اختيار آخر</button></div><p class="small">هذه طبقة تدريب وإثراء، ولا تستبدل أنشطة المصدر الأصلية.</p></div>`;}
else if(sec==='video')h=`<div class="card"><h2>🎬 الفيديو التكميلي</h2><div class="notice">سيتم تشغيل ملف الفيديو الأصلي من الحزمة عندما يكون مساره منشورًا في Runtime. لن يتم اختلاق رابط أو استبدال الفيديو بمحتوى آخر.</div></div>`;
else if(sec==='smart-review')h=`<div class="card enrich"><h2>🧠 المراجعة الذكية</h2><p>راجع الكلمات الأساسية والقاعدة والحوار، ثم انتقل إلى التدريب والتقييم.</p>${cards((d.v||[]).slice(0,6))}</div>`;
else if(sec==='assessment')h=`<div class="card"><h2>🏆 التقييم</h2><p>التقييم الأصلي للدرس يظل المرجع. هذه الصفحة تجهز الطالب قبل الدخول إليه.</p><div class="notice">${s?.quiz_count?`المصدر الأصلي يحتوي على ${s.quiz_count} أسئلة Quiz لهذا الدرس.`:'التقييم الأصلي مرتبط بالمصدر عند توفره.'}</div></div>`;
else h=`<div class="card"><h2>📈 تقدمك</h2><p>استكملت عرض هذه المرحلة. عد إلى المراحل السابقة للمراجعة أو انتقل إلى الدرس التالي.</p></div>`;
document.getElementById('panel').innerHTML=h;const done=sections.filter(x=>localStorage.getItem('g7:'+id+':'+x[0])).length;localStorage.setItem('g7:'+id+':'+sec,'done');const now=done+1;document.getElementById('state').textContent=`${Math.min(now,sections.length)} / ${sections.length} مراحل مكتملة`;document.getElementById('fill').style.width=(Math.min(now,sections.length)/sections.length*100)+'%'}
(async()=>{await loadSource();makeData();const [id,sec]=current();render(id,sec)})();</script></body></html>
