body.lesson-face{background:radial-gradient(circle at 8% 5%,#e5f4ff 0,transparent 28%),radial-gradient(circle at 95% 15%,#ffe8f2 0,transparent 26%),#f5f7fc;color:#17233d;padding:clamp(10px,2.2vw,24px)}

"#78d9ce"/><circle cx="169" cy="61" r="7" fill="#fff"/></svg></div></div><div class="face-start-grid"><article><b>01</b><strong>شاهد وتعرّف</strong><span>اربط كل كلمة بالصورة الصحيحة.</span></article><article><b>02</b><strong>استمع وكرّر</strong><span>اضغط زر الاستماع لتتدرّب على النطق.</span></article><article><b>03</b><strong>اختبر فهمك</strong><span>انتقل للتدريب ثم راجع إجاباتك.</span></article></div><div class="rule"><b>🎯 هدف الدرس</b><br>أن تتعرّف على مفردات الوجه بالفرنسية، وتربط كل مفردة بمعناها، وتستمع إلى نطقها الصحيح.</div>`:`<h2>ابدأ الرحلة</h2><div class="rule">${D.focus}</div>`;if(s==='vocab')h=vocab();if(s==='under')h=id==='g4-l04'?understanding():vocab();if(s==='rules')h=id==='g4-l04'?grammarPage():`<h2>القاعدة</h2><div class="rule">راجع أدوات التعريف أو صفات الملكية باستخدام مفردات الدرس الأصلية.</div>`;if(s==='interact')h=id==='g4-l04'?quiz('interact'):legacyQuiz();if(s==='practice')h=id==='g4-l04'?quiz('practice'):legacyQuiz();if(s==='talk')h=`<h2>المحادثة</h2><div class="grid">${D.parts.slice(0,5).map(x=>`<article class="card"><div class="fr">Qu'est-ce que c'est ?</div><p>${x[1]}</p><button class="btn" data-s="${x[1]}">🔊 استمع</button></article>`).join('')}</div>`;if(s==='media')h=`<h2>الفيديو</h2><div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${D.video}?rel=0&modestbranding=1" allowfullscreen></iframe></div>`;if(s==='review')h=id==='g4-l04'?quiz('review'):legacyQuiz();if(s==='after')h=`<h2>بعد الرحلة</h2><div class="rule">أحسنت! أكملت رحلة الدرس وراجعت مفرداته بصريًا وتفاعليًا.</div>`;page.innerHTML=h;bind();page.querySelectorAll('.quiz-set').forEach(set=>{let score=0;const scoreEl=set.querySelector('.quiz-score');set.querySelectorAll('.quiz-card').forEach(card=>{card.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{if(card.dataset.done)return;card.dataset.done='1';card.querySelectorAll('.choice').forEach(x=>x.disabled=true);const correct=card.querySelector('.choice[data-answer="yes"]');correct.classList.add('ok');const feedback=card.querySelector('.feedback');if(btn.dataset.answer==='yes'){score++;feedback.textContent='✅ إجابة صحيحة، أحسنت!';btn.classList.add('ok')}else{btn.classList.add('no');feedback.textContent='❌ ليست الإجابة الصحيحة. راجع الاختيار المميز بالأخضر.'}scoreEl.textContent=score;});});});}nav.onclick=e=>{const b=e.target.closest('button');if(b)render(b.dataset.s)};render(new URLSearchParams(location.search).get('section')||'start')})();</script></body></html>
