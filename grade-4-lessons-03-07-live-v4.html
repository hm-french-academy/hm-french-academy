/* Premium visual refresh — scoped to Grade 4 lesson Mon visage only */
body.lesson-face{background:radial-gradient(circle at 8% 5%,#e5f4ff 0,transparent 28%),radial-gradient(circle at 95% 15%,#ffe8f2 0,transparent 26%),#f5f7fc;color:#17233d;padding:clamp(10px,2.2vw,24px)}
.lesson-face .wrap{max-width:1160px}
.lesson-face .top{align-items:center;border:1px solid #e6ebf4;box-shadow:0 12px 32px #10244a0c;padding:14px 18px}
.lesson-face .top b{letter-spacing:.2px;color:#173a82}
.lesson-face .top a{background:#eef4ff;padding:10px 13px;border-radius:12px}
.lesson-face .hero{position:relative;overflow:hidden;border:1px solid #dce8fa;background:linear-gradient(120deg,#102f67 0%,#2256a5 56%,#7d4c9e 100%);color:#fff;padding:clamp(22px,4vw,38px);box-shadow:0 18px 42px #173a8224}
.lesson-face .hero:after{content:"";position:absolute;width:250px;height:250px;border:1px solid #ffffff24;border-radius:50%;right:-75px;top:-105px;box-shadow:0 0 0 28px #ffffff09,0 0 0 58px #ffffff07}
.lesson-face #unit{display:inline-flex;position:relative;z-index:1;border:1px solid #ffffff50;background:#ffffff18;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:800}
.lesson-face .hero h1{position:relative;z-index:1;font-size:clamp(27px,5vw,42px);margin:15px 0 8px;line-height:1.2}
.lesson-face #focus{position:relative;z-index:1;max-width:720px;line-height:1.9;color:#eef5ff;margin:0;font-size:16px}
.lesson-face .nav{gap:8px;margin:12px 0 16px;padding:8px;border:1px solid #e5eaf3;border-radius:18px;box-shadow:0 8px 22px #10244a08;scrollbar-width:thin}
.lesson-face .nav button{border:1px solid #e4eaf4;background:#fff;color:#40516e;padding:11px 15px;transition:transform .18s,background .18s;box-shadow:0 2px 6px #10244a05}
.lesson-face .nav button:hover{transform:translateY(-1px);border-color:#aac5f5}
.lesson-face .nav button.active{background:linear-gradient(135deg,#2256a5,#6b4cb0);border-color:transparent;color:#fff;box-shadow:0 6px 16px #2256a52b}
.lesson-face .page{border:1px solid #e5eaf3;border-radius:26px;padding:clamp(15px,2.6vw,28px);box-shadow:0 14px 38px #10244a0b;min-height:330px}
.lesson-face .page h2{font-size:clamp(23px,3.5vw,30px);color:#173a82;margin:0 0 16px}
.lesson-face .grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,225px),1fr));gap:16px}
.lesson-face .card,.lesson-face .review{border:1px solid #e2e9f4;border-radius:22px;padding:15px;background:linear-gradient(180deg,#fff,#fbfcff);box-shadow:0 7px 20px #10244a08;transition:transform .18s,box-shadow .18s}
.lesson-face .card:hover,.lesson-face .review:hover{transform:translateY(-3px);box-shadow:0 13px 28px #10244a12}
.lesson-face .visual{height:185px;border:1px solid #e7edf8;background:radial-gradient(circle at 50% 35%,#fff 0,#f1f6ff 62%,#fdf1f7 100%);overflow:hidden}
.lesson-face .visual svg{max-width:100%;max-height:100%}
.lesson-face .fr{font-size:22px;color:#173a82;text-align:center;margin-top:13px}
.lesson-face .ar{text-align:center;font-size:16px;color:#53627c;margin:8px 0}
.lesson-face .card>span{display:inline-block;background:#edf4ff;color:#31558f;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:800;margin-top:4px}
.lesson-face .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,#2256a5,#416fd0);box-shadow:0 5px 12px #2256a51b;padding:10px 15px;margin-top:12px}
.lesson-face .rule,.lesson-face .passage{background:linear-gradient(120deg,#edf5ff,#fff3f8);border:1px solid #e1eaf7;border-radius:18px;line-height:2.05}
.lesson-face .choice{border:1.5px solid #dce5f2;border-radius:14px;text-align:center;min-height:48px;color:#273957;transition:background .15s,border .15s}
.lesson-face .choice:hover:not(:disabled){border-color:#8aafea;background:#f3f7ff}
.lesson-face .choice.ok{background:#e9f9ef;border-color:#32a66a;color:#17663a}
.lesson-face .choice.no{background:#fff0f3;border-color:#e889a0;color:#a32648}
.lesson-face .feedback{padding:4px 2px;line-height:1.7}
.lesson-face .video{overflow:hidden;border-radius:20px;box-shadow:0 12px 30px #10244a18}
.lesson-face .exam{max-width:100%}
@media(max-width:600px){.lesson-face .top{gap:10px;padding:11px 12px}.lesson-face .top b{font-size:13px}.lesson-face .hero{border-radius:20px}.lesson-face .page{border-radius:20px}.lesson-face .visual{height:165px}.lesson-face .nav button{padding:10px 12px;font-size:13px}}

.lesson-face .face-intro{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(190px,.65fr);gap:18px;align-items:center;position:relative;overflow:hidden;border-radius:23px;padding:clamp(20px,3.5vw,34px);background:linear-gradient(120deg,#102f67,#2859a7 62%,#7d4c9e);color:#fff;margin-bottom:18px}
.lesson-face .face-kicker{display:inline-block;border:1px solid #ffffff50;background:#ffffff17;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:900}
.lesson-face .face-intro h2{color:#fff;margin:14px 0 9px;line-height:1.35}
.lesson-face .face-intro p{line-height:1.95;color:#edf4ff;margin:0;max-width:620px}
.lesson-face .face-art{width:min(100%,220px);justify-self:center}
.lesson-face .face-art svg{display:block;width:100%;filter:drop-shadow(0 12px 20px #071b4033)}
.lesson-face .face-pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:17px}
.lesson-face .face-pills span{background:#ffffff19;border:1px solid #ffffff35;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}
.lesson-face .face-start-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.lesson-face .face-start-grid article{display:flex;flex-direction:column;gap:7px;background:#fff;border:1px solid #e4eaf4;border-radius:18px;padding:15px;box-shadow:0 6px 18px #10244a07}
.lesson-face .face-start-grid article>b{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:#edf4ff;color:#2256a5;font-size:13px}
.lesson-face .face-start-grid strong{color:#173a82;font-size:16px}
.lesson-face .face-start-grid span{font-size:13px;line-height:1.8;color:#697790}
@media(max-width:650px){.lesson-face .face-intro{grid-template-columns:1fr}.lesson-face .face-art{width:150px;grid-row:1}.lesson-face .face-start-grid{grid-template-columns:1fr}.lesson-face .face-start-grid article{display:grid;grid-template-columns:34px 1fr;align-items:center}.lesson-face .face-start-grid article span{grid-column:2}}

b29e" stroke="#c88979" stroke-width="2"/><path d="M91 153Q111 166 132 153" fill="none" stroke="#b95068" stroke-width="5" stroke-linecap="round"/><circle cx="46" cy="111" r="14" fill="#ffd166"/><circle cx="177" cy="135" r="10" fill="#78d9ce"/><circle cx="169" cy="61" r="7" fill="#fff"/></svg></div></div><div class="face-start-grid"><article><b>01</b><strong>شاهد وتعرّف</strong><span>اربط كل كلمة بالصورة الصحيحة.</span></article><article><b>02</b><strong>استمع وكرّر</strong><span>اضغط زر الاستماع لتتدرّب على النطق.</span></article><article><b>03</b><strong>اختبر فهمك</strong><span>انتقل للتدريب ثم راجع إجاباتك.</span></article></div><div class="rule"><b>🎯 هدف الدرس</b><br>أن تتعرّف على مفردات الوجه بالفرنسية، وتربط كل مفردة بمعناها، وتستمع إلى نطقها الصحيح.</div>`:`<h2>ابدأ الرحلة</h2><div class="rule">${D.focus}</div>`;if(s==='vocab')h=vocab();if(s==='under')h=vocab();if(s==='rules')h=`<h2>القاعدة</h2><div class="rule">راجع أدوات التعريف أو صفات الملكية باستخدام مفردات الدرس الأصلية.</div>`;if(s==='interact'||s==='practice')h=quiz();if(s==='talk')h=`<h2>المحادثة</h2><div class="grid">${D.parts.slice(0,5).map(x=>`<article class="card"><div class="fr">Qu'est-ce que c'est ?</div><p>${x[1]}</p><button class="btn" data-s="${x[1]}">🔊 استمع</button></article>`).join('')}</div>`;if(s==='media')h=`<h2>الفيديو</h2><div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${D.video}?rel=0&modestbranding=1" allowfullscreen></iframe></div>`;if(s==='review')h=quiz();if(s==='after')h=`<h2>بعد الرحلة</h2><div class="rule">أحسنت! أكملت رحلة الدرس وراجعت مفرداته بصريًا وتفاعليًا.</div>`;page.innerHTML=h;bind()}nav.onclick=e=>{const b=e.target.closest('button');if(b)render(b.dataset.s)};render(new URLSearchParams(location.search).get('section')||'start')})();</script></body></html>
