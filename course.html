<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14264a"><title>HM Academy | المناهج الدراسية</title><link rel="stylesheet" href="css/premium-shell.css?v=20260830-course-nav"></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="index.html">🏠 الرئيسية</a><a href="course.html" aria-current="page">📚 المناهج</a><a href="language-courses.html">🎙️ الكورسات</a><a href="levels.html">🎯 المستويات</a><a href="library.html">📚 المكتبة</a><a href="academy-map.html">🗺️ الخريطة</a><a href="dictionary.html">📖 القاموس</a><a href="settings.html">⚙️ الإعدادات</a></nav><div class="hm-tools"><select class="hm-lang" data-lang-select aria-label="Display language"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select><a class="hm-student" href="student-profile.html" aria-label="حساب الطالب">👨‍🎓</a></div></header><main class="hm-main"><section class="hm-hero"><h1 id="pageTitle">المناهج الدراسية</h1><p id="pageSub">اختر المنهج أولًا، ثم المرحلة، ثم الترم الدراسي. هذه الصفحة خاصة بالمناهج المدرسية فقط.</p></section><section class="hm-card"><div id="programs"><p>جاري تحميل المناهج…</p></div></section></main><footer class="hm-footer"><strong>HM Academy</strong> · French Language Education · © 2026</footer><script src="scripts/i18n.js?v=20260830-course-nav"></script><script src="scripts/brand.js?v=20260830-course-nav"></script><script>(async function(){const T={ar:{title:'المناهج الدراسية',sub:'اختر المنهج أولًا، ثم المرحلة، ثم الترم الدراسي. هذه الصفحة خاصة بالمناهج المدرسية فقط.',middleDesc:'المنهج المدرسي للمرحلة الإعدادية',primaryDesc:'المنهج المدرسي للمرحلة الابتدائية',term1:'الترم الأول',term2:'الترم الثاني',planned:'قريبًا',noFile:'سيتم ربط ملفات الترم',loading:'جاري تحميل المناهج…',error:'تعذر تحميل دليل المناهج'},fr:{title:'Programmes scolaires',sub:'Choisissez d’abord le programme, puis le niveau et le semestre.',middleDesc:'Programme scolaire du collège',primaryDesc:'Programme scolaire du primaire',term1:'1er semestre',term2:'2e semestre',planned:'Bientôt',noFile:'Fichiers du semestre à relier',loading:'Chargement des programmes…',error:'Impossible de charger le catalogue'},en:{title:'School Curricula',sub:'Choose the curriculum first, then the grade and academic term.',middleDesc:'Middle-school curriculum',primaryDesc:'Primary-school curriculum',term1:'Term 1',term2:'Term 2',planned:'Coming soon',noFile:'Term files will be connected',loading:'Loading curricula…',error:'Unable to load curriculum catalog'}};let data;function lang(){return window.HMLanguage?.get?.()||'ar'}function t(){return T[lang()]||T.ar}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function normalizePage(g){if(g.page)return g.page;const id=String(g.id||'');return ({'primary-3':'grade-3.html','primary-4':'grade-4.html','primary-5':'grade-5.html','primary-6':'grade-6.html','grade-7':'grade-7.html','grade-8':'grade-8.html','grade-9':'grade-9.html'})[id]||''}function render(){const x=t();document.getElementById('pageTitle').textContent=x.title;document.getElementById('pageSub').textContent=x.sub;document.title='HM Academy | '+x.title;document.getElementById('programs').innerHTML=(data?.programs||[]).map(p=>{const pName=p.fixedName||p.name?.fr||p.id,pDesc=p.description?.[lang()]||p.description?.fr||'',badge=p.category==='middle-school'?'Collège':'Primaire';return '<article class="hm-card" style="margin-bottom:16px"><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><div style="font-size:30px">'+(p.category==='middle-school'?'🎓':'📚')+'</div><div><h2 style="margin:0">'+esc(pName)+'</h2><p style="margin:4px 0">'+esc(pDesc)+'</p></div><strong style="margin-inline-start:auto">'+badge+'</strong></div><div class="hm-grid" style="margin-top:16px">'+(p.grades||[]).map(g=>{const gName=g.label?.[lang()]||g.label?.ar||g.id,gradeFr=g.label?.fr||'',page=normalizePage(g);return '<article class="hm-card"><h3 style="margin-top:0">'+esc(gName)+'</h3><p>'+esc(lang()==='fr'?'':gradeFr)+'</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+(g.terms||[]).map(term=>{const label=term.id==='term-1'?x.term1:x.term2,href=(page&&term.id==='term-1')?page:(term.file||null);return href?'<a class="hm-nav a" href="'+esc(href)+'">'+esc(label)+' →</a>':'span' }).join('').replace(/span/g,'<span style="padding:10px;border:1px solid var(--hm-border);border-radius:12px;color:var(--hm-muted)">'+x.noFile+'</span>')+'</div></article>'}).join('')+'</div></article>'}).join('')}async function load(){try{const r=await fetch('data/programs-catalog.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);const raw=await r.json();data=typeof raw.content==='string'?JSON.parse(raw.content):raw;render()}catch(e){console.error(e);document.getElementById('programs').innerHTML='<article class="hm-card"><h2>'+esc(t().error)+'</h2></article>'}}window.addEventListener('hm:languagechange',()=>{if(data)render();else load()});load()})();</script></body></html>
