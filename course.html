ادية',primaryDesc:'مناهج المرحلة الابتدائية',term1:'الفصل الدراسي الأول',term2:'الفصل الدراسي الثاني',planned:'قريبًا',noFile:'المحتوى قيد الإعداد',loading:'نجهّز لك المناهج الدراسية…',error:'تعذر تحميل المناهج. حاول مرة أخرى.'},fr:{title:'Programmes scolaires',sub:'Choisissez le programme, puis le niveau, la classe et le semestre pour accéder à vos cours.',middleDesc:'Programmes du collège',primaryDesc:'Programmes du primaire',term1:'1er semestre',term2:'2e semestre',planned:'Bientôt',noFile:'Contenu en préparation',loading:'Préparation de vos programmes…',error:'Impossible de charger les programmes. Réessayez.'},en:{title:'School Curricula',sub:'Choose the curriculum, then your stage, grade, and academic term to access your lessons.',middleDesc:'Middle-school curricula',primaryDesc:'Primary-school curricula',term1:'Term 1',term2:'Term 2',planned:'Coming soon',noFile:'Content in preparation',loading:'Preparing your curricula…',error:'We could not load the curricula. Please try again.'}};let data;function lang(){return window.HMLanguage?.get?.()||'ar'}function t(){return T[lang()]||T.ar}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function normalizePage(g){if(g.page)return g.page;const id=String(g.id||'');return ({'primary-3':'grade-3.html','primary-4':'grade-4.html','primary-5':'grade-5.html','primary-6':'grade-6.html','grade-7':'grade-7.html','grade-8':'grade-8.html','grade-9':'grade-9.html'})[id]||''}function render(){const x=t();document.getElementById('pageTitle').textContent=x.title;document.getElementById('pageSub').textContent=x.sub;document.title='HM Academy | '+x.title;document.getElementById('programs').innerHTML=(data?.programs||[]).map(p=>{const pName=p.fixedName||p.name?.[lang()]||p.name?.fr||p.id,pDesc=p.description?.[lang()]||p.description?.fr||'',badge=p.category==='middle-school'?(lang()==='ar'?'إعدادي':lang()==='fr'?'Collège':'Middle School'):(lang()==='ar'?'ابتدائي':lang()==='fr'?'Primaire':'Primary');return '<article class="hm-card" style="margin-bottom:16px"><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><div style="font-size:30px">'+(p.category==='middle-school'?'🎓':'📚')+'</div><div><h2 style="margin:0">'+esc(pName)+'</h2><p style="margin:4px 0">'+esc(pDesc)+'</p></div><strong style="margin-inline-start:auto">'+badge+'</strong></div><div class="hm-grid" style="margin-top:16px">'+(p.grades||[]).map(g=>{const gName=g.label?.[lang()]||g.label?.ar||g.id,page=normalizePage(g);return '<article class="hm-card"><h3 style="margin-top:0">'+esc(gName)+'</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+(g.terms||[]).map(term=>{const label=term.id==='term-1'?x.term1:x.term2,href=(page&&term.id==='term-1')?page:(term.file||null);return href?'<a class="hm-nav a" href="'+esc(href)+'">'+esc(label)+' →</a>':'<span style="padding:10px;border:1px solid var(--hm-border);border-radius:12px;color:var(--hm-muted)">'+x.noFile+'</span>'}).join('')+'</div></article>'}).join('')+'</div></article>'}).join('')}async function load(){try{const r=await fetch('data/programs-catalog.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);const raw=await r.json();data=typeof raw.content==='string'?JSON.parse(raw.content):raw;render()}catch(e){console.error(e);document.getElementById('programs').innerHTML='<article class="hm-card"><h2>'+esc(t().error)+'</h2></article>'}}window.addEventListener('hm:languagechange',()=>{if(data)render();else load()});load()})();</script></body></html>
