<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="hm-build" content="20260914-bac2-u1-l1-v2"><title>HM Academy | Les repas et les habitudes alimentaires</title><link rel="stylesheet" href="css/premium-shell.css"><style>body{background:linear-gradient(135deg,#f7f9ff,#eef4ff);color:#14213d}.wrap{max-width:1120px;margin:auto}.card{background:#fff;border:1px solid #dce5f2;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 12px 30px rgba(20,33,61,.07)}.hero{display:flex;justify-content:space-between;gap:15px}.pill{background:#edf3ff;color:#245bd7;padding:8px 13px;border-radius:99px;font-weight:900}.muted{color:#66758d;line-height:1.9}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0}.tab{border:1px solid #dce5f2;background:#fff;border-radius:14px;padding:11px;font-weight:900;cursor:pointer}.tab.on{background:#245bd7;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.v{border:1px solid #dce5f2;border-radius:16px;padding:14px;background:#fbfcff}.v b{display:block;font-size:19px;direction:ltr}.v span{color:#66758d}.speak,.btn{border:0;border-radius:11px;padding:9px 12px;font-weight:900;cursor:pointer}.speak{background:#edf3ff;color:#245bd7}.btn{background:#245bd7;color:#fff;text-decoration:none}.alt{background:#edf3ff;color:#245bd7}.model{direction:ltr;text-align:left;background:#f7f9fd;border-right:4px solid #245bd7;border-radius:13px;padding:13px;margin:10px 0;font-size:18px}.rule,.dialogue{background:#f7f9fd;border:1px solid #e4eaf3;border-radius:16px;padding:16px;line-height:2}.q{border:1px solid #dce5f2;border-radius:16px;padding:15px;margin:11px 0}.opts{display:grid;gap:8px;margin-top:9px}.opt{border:1px solid #dce5f2;background:#fff;border-radius:11px;padding:11px;text-align:right;cursor:pointer}.ok{background:#eaf9f2!important}.bad{background:#fff0f0!important}.feedback{font-weight:800;margin-top:8px;line-height:1.8}.progress{height:9px;background:#e8edf6;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#245bd7;transition:.25s}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:700px){.tabs{grid-template-columns:repeat(2,1fr)}.hero{flex-direction:column}.card{padding:15px}}</style></head><body><main class="hm-main wrap"><section class="hm-hero card"><div class="hero"><div><div class="eyebrow">HM ACADEMY · BACCALAURÉAT 2 · UNITÉ 1</div><h1>Les repas et les habitudes alimentaires</h1><p class="muted">الوجبات والعادات الغذائية · الدرس الأول</p></div><span class="pill">Leçon 1</span></div><div class="progress"><i id="bar"></i></div></section><div id="tabs" class="tabs"></div><section id="view"></section><section class="card actions"><a class="btn alt" href="baccalaureat-2.html">← العودة للمنهج</a><button class="btn alt" id="prev">السابق</button><button class="btn" id="next">التالي</button></section></main><script>const S=[['اكتشف','ابدأ من المعنى قبل الحفظ'],['المفردات','الكلمات الأساسية والنطق'],['افهم','كيف نتحدث عن الوجبات؟'],['طبّق','تدريب بتصحيح فوري'],['أتقن','تقييم نهائي وإتقان']];const V=[['le petit-déjeuner','الإفطار'],['le déjeuner','الغداء'],['le goûter','الوجبة الخفيفة'],['le dîner','العشاء'],['un repas','وجبة'],['manger','يأكل'],['boire','يشرب'],['prendre','يتناول'],['le pain','الخبز'],['le fromage','الجبن'],['le poulet','الدجاج'],['la salade','السلطة'],['le lait','الحليب'],['l’eau','الماء']];const Q=[['Le matin, je ___ le petit-déjeuner.',['prends','prend','prendre'],0,'مع je نستخدم prends من prendre.'],['À midi, je prends…',['le déjeuner','le dîner','le goûter'],0,'Le déjeuner هو وجبة منتصف اليوم.'],['Je ___ de l’eau.',['bois','boit','boire'],0,'مع je من boire نستخدم bois.'],['Le soir, je prends…',['le dîner','le déjeuner','le petit-déjeuner'],0,'Le dîner هو وجبة المساء.'],['Je mange ___ poulet.',['du','de la','des'],0,'poulet اسم مذكر مفرد: du poulet.'],['Je bois ___ eau.',['de l’','du','des'],0,'قبل eau نستخدم de l’.']];let i=0,score=0,done=0;function speak(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';speechSynthesis.speak(u)}function render(){document.getElementById('tabs').innerHTML=S.map((x,n)=>`<button class="tab ${n===i?'on':''}" data-i="${n}">${n+1}. ${x[0]}</button>`).join('');document.getElementById('bar').style.width=((i+1)/S.length*100)+'%';let h='';if(i===0)h=`<section class="card"><h2>اكتشف قبل أن تحفظ</h2><p class="muted">نبدأ من فكرة الدرس: خلال اليوم توجد وجبات مختلفة، ويمكننا الحديث عن وقت الوجبة وما نأكله ونشربه.</p><div class="model">Le matin, je prends le petit-déjeuner. À midi, je prends le déjeuner. Le soir, je prends le dîner.</div><div class="dialogue"><b>Observe → Notice → Rule → Try</b><br>لاحظ تكرار <b>je prends</b> ثم جرّب تكوين جملة عن وجبة من يومك.</div></section>`;if(i===1)h=`<section class="card"><h2>🗂️ المفردات + النطق</h2><div class="grid">${V.map(v=>`<article class="v"><b>${v[0]}</b><span>${v[1]}</span><br><button class="speak" onclick="speak('${v[0].replaceAll("'","\\'")}')">🔊 نطق الكلمة</button></article>`).join('')}</div></section>`;if(i===2)h=`<section class="card"><h2>📘 افهم</h2><div class="rule"><b>prendre</b> مع الوجبات: je prends · tu prends · il/elle prend<br><b>manger</b>: je mange · tu manges · il/elle mange<br><b>boire</b>: je bois · tu bois · il/elle boit<br><br><b>Articles partitifs:</b> du + مذكر مفرد · de la + مؤنث مفرد · de l’ + حرف متحرك · des + جمع.</div><div class="model">Je mange du poulet et de la salade. Je bois de l’eau.</div></section>`;if(i===3)h=`<section class="card"><h2>🎯 طبّق</h2><p class="muted">اختر الإجابة. مكان الإجابة الصحيحة يتغير، ولا تُحسب الإجابة قبل الاختيار.</p>${Q.map((q,n)=>`<div class="q"><b>${n+1}. ${q[0]}</b><div class="opts">${q[1].map((x,j)=>`<button class="opt" data-q="${n}" data-a="${j}">${x}</button>`).join('')}</div><div id="f${n}" class="feedback"></div></div>`).join('')}</section>`;if(i===4)h=`<section class="card"><h2>🏆 الإتقان</h2><div class="grid"><div class="v"><b>النتيجة</b><span>${score} / ${Q.length}</span></div><div class="v"><b>الإجابة</b><span>${done} / ${Q.length}</span></div><div class="v"><b>الحالة</b><span>${done===Q.length?(score>=5?'متقن':'يحتاج مراجعة'):'أكمل التدريب أولًا'}</span></div></div><div class="dialogue"><b>مهمة ختامية:</b> اكتب ثلاث جمل: وجبة صباحية، وجبة منتصف اليوم، وجبة المساء، مع ذكر مشروب واحد على الأقل.</div></section>`;document.getElementById('view').innerHTML=h}document.addEventListener('click',e=>{if(e.target.classList.contains('tab')){i=+e.target.dataset.i;render()}if(e.target.id==='next'){i=Math.min(S.length-1,i+1);render()}if(e.target.id==='prev'){i=Math.max(0,i-1);render()}if(e.target.classList.contains('opt')){let n=+e.target.dataset.q,a=+e.target.dataset.a,q=Q[n],f=document.getElementById('f'+n);if(e.target.parentElement.dataset.done==='1')return;e.target.parentElement.dataset.done='1';done++;if(a===q[2]){score++;e.target.classList.add('ok');f.textContent='✓ صحيح — '+q[3]}else{e.target.classList.add('bad');f.textContent='✗ ليس صحيحًا — '+q[3]}}});render();</script></body></html>
