<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="hm-build" content="20260914-bac2-u1-l1-polished"><title>HM Academy | Bonjour ! Je me présente</title><link rel="stylesheet" href="css/premium-shell.css"><style>body{background:linear-gradient(135deg,#f7f9ff,#eef4ff);color:#14213d}.wrap{max-width:1120px;margin:auto}.card{background:#fff;border:1px solid #dce5f2;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 12px 30px rgba(20,33,61,.07)}.hero{display:flex;justify-content:space-between;gap:15px}.pill,.tag{background:#edf3ff;color:#245bd7;padding:7px 12px;border-radius:99px;font-weight:900}.muted{color:#66758d;line-height:1.9}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0}.tab{border:1px solid #dce5f2;background:#fff;border-radius:14px;padding:11px;font-weight:900;cursor:pointer}.tab.on{background:#245bd7;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.v{border:1px solid #dce5f2;border-radius:16px;padding:14px;background:#fbfcff}.v b{display:block;font-size:20px;direction:ltr}.v span{color:#66758d}.speak,.btn,.opt{border:0;border-radius:11px;padding:9px 12px;font-weight:900;cursor:pointer}.speak,.opt{background:#edf3ff;color:#245bd7}.btn{background:#245bd7;color:#fff;text-decoration:none}.alt{background:#edf3ff;color:#245bd7}.model{direction:ltr;text-align:left;background:#f7f9fd;border-right:4px solid #245bd7;border-radius:13px;padding:13px;margin:10px 0;font-size:18px}.rule,.dialogue,.reading,.project{background:#f7f9fd;border:1px solid #e4eaf3;border-radius:16px;padding:16px;line-height:2}.q{border:1px solid #dce5f2;border-radius:16px;padding:15px;margin:11px 0}.opts{display:grid;gap:8px;margin-top:9px}.opt{border:1px solid #dce5f2;background:#fff;color:#14213d;text-align:right}.opt.ok{background:#eaf9f2!important;border-color:#2d9b70}.opt.bad{background:#fff0f0!important;border-color:#d35b5b}.feedback{font-weight:800;margin-top:8px;line-height:1.8}.progress{height:9px;background:#e8edf6;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#245bd7;transition:.25s}.actions,.audio{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.write{width:100%;min-height:60px;border:1px solid #dce5f2;border-radius:14px;padding:12px;font:inherit;box-sizing:border-box}.small{min-height:42px}.hidden{display:none!important}@media(max-width:700px){.tabs{grid-template-columns:repeat(2,1fr)}.hero{flex-direction:column}.card{padding:15px}.match{grid-template-columns:1fr}}</style></head><body><main class="hm-main wrap"><section class="hm-hero card"><div class="hero"><div><div class="eyebrow">HM ACADEMY · BACCALAURÉAT 2 · UNITÉ 1</div><h1>Bonjour ! Je me présente</h1><p class="muted">Leçon 1 · Dire bonjour · أقدّم نفسي</p></div><span class="pill">Leçon 1</span></div><div class="progress"><i id="bar"></i></div></section><div id="tabs" class="tabs"></div><section id="view"></section><section class="card actions"><a class="btn alt" href="baccalaureat-2.html">← العودة للمنهج</a><button class="btn alt" id="prev">السابق</button><button class="btn" id="next">التالي</button></section></main><script>const S=['Dire bonjour','Vocabulaire','Écoute et parle','Grammaire','Lecture','Écris','Jeux et activités','Projet','Révision et Test'];const V=[['Bonjour','مرحبًا','Bonjour !'],['Salut','أهلًا','Salut !'],['Au revoir','إلى اللقاء','Au revoir !'],['Merci','شكرًا','Merci !'],['Enchanté (m.)','سعيد بلقائك','Enchanté !'],['Enchantée (f.)','سعيدة بلقائك','Enchantée !'],['Comment tu t’appelles ?','ما اسمك؟','Comment tu t’appelles ?'],['Je m’appelle…','اسمي…','Je m’appelle Adam.'],['J’ai … ans.','عمري … سنة','J’ai onze ans.'],['Je suis en …','أنا في الصف …','Je suis en sixième.'],['Je suis …','أنا …','Je suis égyptien.']];const Q=[['Qui dit « Bonjour » ?',['Adam','Sara'],0],['Comment s’appelle le garçon ?',['Ali','Adam'],1],['Que dit Sara à la fin ?',['Merci','Au revoir'],0],['« Comment tu t’appelles ? » demande…',['le nom','l’âge'],0],['Je ___ Adam.',['m’appelle','suis'],0],['J’___ 11 ans.',['ai','suis'],0],['Je suis en ___.',['sixième','nationalité'],0],['« Au revoir » signifie…',['مرحبًا','إلى اللقاء','شكرًا'],1],['Je suis ___ .',['égyptien','appelle'],0]];let i=0,score=0;function speak(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.9;speechSynthesis.speak(u)}function quiz(q,n){return `<div class="q"><b>${n+1}. ${q[0]}</b><div class="opts">${q[1].map((x,j)=>`<button class="opt" data-q="${n}" data-a="${j}">${x}</button>`).join('')}</div><div id="f${n}" class="feedback"></div></div>`}function tf(text,correct,n){return `<div class="q"><b>${n+1}. ${text}</b><div class="opts"><button class="opt" data-tf="${correct}" data-a="true">Vrai</button><button class="opt" data-tf="${correct}" data-a="false">Faux</button></div><div id="tf${n}" class="feedback"></div></div>`}function render(){document.getElementById('tabs').innerHTML=S.map((x,n)=>`<button class="tab ${n===i?'on':''}" data-i="${n}">${n+1}. ${x}</button>`).join('');document.getElementById('bar').style.width=((i+1)/S.length*100)+'%';let h='';if(i===0)h=`<section class="card"><h2>👋 Dire bonjour</h2><p class="muted">Observe le dialogue ثم استمع وكرر.</p><div class="dialogue"><div class="model">Bonjour !</div><div class="model">Bonjour !</div><div class="model">Comment tu t’appelles ?</div><div class="model">Je m’appelle Adam.</div><div class="model">Enchantée.</div><div class="model">Merci.</div></div><div class="audio"><span class="tag">Piste 01</span><button class="speak" onclick="speak('Bonjour ! Bonjour ! Comment tu t’appelles ? Je m’appelle Adam. Enchantée. Merci.')">🔊 استمع للحوار</button></div><p class="muted"><b>Astuce :</b> Quand tu rencontres quelqu’un, regarde-le, souris et dis « Bonjour ! » 😊</p></section>`;if(i===1)h=`<section class="card"><h2>🗂️ Vocabulaire</h2><div class="grid">${V.map((v,n)=>`<article class="v"><b>${v[0]}</b><span>${v[1]}</span><p><button class="speak" onclick="speak('${v[2].replaceAll("'","\\'")}')">🔊 الكلمة</button> <button class="speak" onclick="speak('${(v[2]).replaceAll("'","\\'")}')">🔊 المثال</button></p></article>`).join('')}</div><div class="rule"><b>À retenir :</b><br>Bonjour ! = مرحبًا · Au revoir ! = إلى اللقاء · Merci ! = شكرًا</div></section>`;if(i===2)h=`<section class="card"><h2>🎧 Écoute et parle</h2><p class="muted">استمع ثم اختر الإجابة الصحيحة، وبعدها مارس الحوار.</p>${Q.slice(0,3).map(quiz).join('')}<div class="dialogue"><div class="model">Bonjour !</div><div class="model">Comment tu t’appelles ?</div><div class="model">Je m’appelle …</div><div class="model">Enchanté(e) !</div></div><button class="speak" onclick="speak('Bonjour ! Comment tu t’appelles ? Je m’appelle Adam. Enchantée. Merci.')">🔊 استمع للنموذج</button></section>`;if(i===3)h=`<section class="card"><h2>📘 Grammaire — Je m’appelle</h2><div class="rule"><b>On utilise « Je m’appelle » pour dire son nom.</b><div class="model">Je m’appelle Adam.</div><div class="model">Je m’appelle Sara.</div><b>Attention :</b> ✓ Je m’appelle Adam. &nbsp; ✗ Je suis Adam. (لذكر الاسم)</div><h3>Complète</h3>${[['Ali'],['Nour'],['Yasmine']].map((x,n)=>`<div class="q">${n+1}. <input class="write small" data-answer="Je m’appelle ${x[0]}." placeholder="اكتب الجملة كاملة..."></div>`).join('')}<button class="btn" id="checkGrammar">تصحيح</button><div id="grammarFeedback" class="feedback"></div></section>`;if(i===4)h=`<section class="card"><h2>📖 Lecture</h2><div class="reading"><b>Bonjour !</b><br>Je m’appelle Karim.<br>J’ai 11 ans.<br>Je suis en sixième.<br>Je suis égyptien.<br>Et toi, comment tu t’appelles ?</div><h3>Réponds aux questions</h3>${['Qui parle dans le texte ?','Comment il s’appelle ?','Quel âge a-t-il ?','Quelle est sa classe ?','Quelle est sa nationalité ?'].map((x,n)=>`<div class="q">${n+1}. ${x}<input class="write" placeholder="اكتب الإجابة..."></div>`).join('')}</section>`;if(i===5)h=`<section class="card"><h2>✍️ Écris</h2><div class="grid"><div class="v"><b>Je m’appelle</b><input class="write"></div><div class="v"><b>J’ai</b><span>_____ ans.</span><input class="write"></div><div class="v"><b>Je suis en</b><input class="write"></div><div class="v"><b>Je suis</b><input class="write"></div></div><h3>Écris 4 phrases sur toi</h3><textarea class="write" placeholder="Je m’appelle…\nJ’ai… ans.\nJe suis en…\nJe suis…"></textarea><h3>Présente-toi</h3><div class="model">Je m’appelle… → Enchanté(e) !</div></section>`;if(i===6)h=`<section class="card"><h2>🎮 Jeux et activités</h2><h3>A. Fais parler les cartes</h3><div class="match"><button class="opt" onclick="speak('Je m’appelle Adam.')">Je · m’appelle · Adam · .</button><button class="opt" onclick="speak('Je m’appelle Sara.')">Je · m’appelle · Sara · .</button></div><h3>B. Vrai ou faux ?</h3>${tf('Adam dit « Bonjour ».',true,0)}${tf('Sara demande le nom d’Adam.',true,1)}${tf('Adam dit « Au revoir ».',false,2)}${tf('Adam s’appelle Ali.',false,3)}<h3>C. Relie</h3><div class="grid"><div class="v">Bonjour<br>Au revoir<br>Merci<br>Enchanté</div><div class="v">مرحبًا<br>إلى اللقاء<br>شكرًا<br>سعيد بلقائك</div></div></section>`;if(i===7)h=`<section class="card"><h2>🪪 Projet — Ma carte d’identité</h2><div class="project"><p>Crée ta carte et présente-la à tes camarades.</p><div class="grid"><div class="v"><b>Je m’appelle :</b><input class="write"></div><div class="v"><b>J’ai :</b><input class="write"></div><div class="v"><b>Je suis en :</b><input class="write"></div><div class="v"><b>Je suis :</b><input class="write"></div></div></div><p class="muted">صمّم بطاقة شخصية ثم قدّم نفسك شفهيًا.</p></section>`;if(i===8)h=`<section class="card"><h2>🎯 Révision et Test</h2>${Q.map(quiz).join('')}<h3>B. Complète</h3><div class="grid"><div class="v">Je m’appelle <input class="write small"></div><div class="v">J’ai <input class="write small"> ans.</div><div class="v">Je suis en <input class="write small"></div></div><h3>C. Présentation</h3><textarea class="write" placeholder="Présente-toi en 4 phrases..."></textarea><div class="rule"><b>Ma note interactive :</b> <span id="score">${score} / ${Q.length}</span> ⭐</div></section>`;document.getElementById('view').innerHTML=h}document.addEventListener('click',e=>{if(e.target.classList.contains('tab')){i=+e.target.dataset.i;render()}if(e.target.id==='next'){i=Math.min(S.length-1,i+1);render()}if(e.target.id==='prev'){i=Math.max(0,i-1);render()}if(e.target.dataset.q!==undefined){const n=+e.target.dataset.q,a=+e.target.dataset.a,q=Q[n],f=document.getElementById('f'+n),box=e.target.parentElement;if(box.dataset.done)return;box.dataset.done='1';if(a===q[2]){score++;e.target.classList.add('ok');f.textContent='✓ إجابة صحيحة'}else{e.target.classList.add('bad');f.textContent='✗ الإجابة الصحيحة: '+q[1][q[2]]}const sc=document.getElementById('score');if(sc)sc.textContent=score+' / '+Q.length}if(e.target.dataset.tf!==undefined){const n=e.target.closest('.q').querySelector('.feedback'),ok=String(e.target.dataset.tf)===e.target.dataset.a;if(e.target.closest('.q').dataset.done)return;e.target.closest('.q').dataset.done='1';e.target.classList.add(ok?'ok':'bad');n.textContent=ok?'✓ إجابة صحيحة':'✗ راجع العبارة ثم أعد المحاولة'}if(e.target.id==='checkGrammar'){let a=[...document.querySelectorAll('[data-answer]')],ok=a.filter(x=>x.value.trim().toLowerCase()===x.dataset.answer.toLowerCase()).length;document.getElementById('grammarFeedback').textContent=`${ok} / ${a.length} إجابات صحيحة ✓`}});render();</script></body></html>
