<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="hm-build" content="20260914-bac2-u1-l1-merci-source"><title>HM Academy | Bonjour ! Je me présente</title><link rel="stylesheet" href="css/premium-shell.css"><style>body{background:linear-gradient(135deg,#f7f9ff,#eef4ff);color:#14213d}.wrap{max-width:1120px;margin:auto}.card{background:#fff;border:1px solid #dce5f2;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 12px 30px rgba(20,33,61,.07)}.hero{display:flex;justify-content:space-between;gap:15px}.pill{background:#edf3ff;color:#245bd7;padding:8px 13px;border-radius:99px;font-weight:900}.muted{color:#66758d;line-height:1.9}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0}.tab{border:1px solid #dce5f2;background:#fff;border-radius:14px;padding:11px;font-weight:900;cursor:pointer}.tab.on{background:#245bd7;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.v{border:1px solid #dce5f2;border-radius:16px;padding:14px;background:#fbfcff}.v b{display:block;font-size:20px;direction:ltr}.v span{color:#66758d}.speak,.btn,.opt{border:0;border-radius:11px;padding:9px 12px;font-weight:900;cursor:pointer}.speak,.opt{background:#edf3ff;color:#245bd7}.btn{background:#245bd7;color:#fff;text-decoration:none}.alt{background:#edf3ff;color:#245bd7}.model{direction:ltr;text-align:left;background:#f7f9fd;border-right:4px solid #245bd7;border-radius:13px;padding:13px;margin:10px 0;font-size:18px}.rule,.dialogue,.reading,.project{background:#f7f9fd;border:1px solid #e4eaf3;border-radius:16px;padding:16px;line-height:2}.q{border:1px solid #dce5f2;border-radius:16px;padding:15px;margin:11px 0}.opts{display:grid;gap:8px;margin-top:9px}.opt{border:1px solid #dce5f2;background:#fff;color:#14213d;text-align:right}.opt.ok{background:#eaf9f2!important;border-color:#2d9b70}.opt.bad{background:#fff0f0!important;border-color:#d35b5b}.feedback{font-weight:800;margin-top:8px;line-height:1.8}.progress{height:9px;background:#e8edf6;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#245bd7;transition:.25s}.actions{display:flex;gap:8px;flex-wrap:wrap}.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.match button{text-align:right}.write{width:100%;min-height:110px;border:1px solid #dce5f2;border-radius:14px;padding:12px;font:inherit;box-sizing:border-box}@media(max-width:700px){.tabs{grid-template-columns:repeat(2,1fr)}.hero{flex-direction:column}.card{padding:15px}.match{grid-template-columns:1fr}}</style></head><body><main class="hm-main wrap"><section class="hm-hero card"><div class="hero"><div><div class="eyebrow">HM ACADEMY · BACCALAURÉAT 2 · UNITÉ 1</div><h1>Bonjour ! Je me présente</h1><p class="muted">Leçon 1 · Dire bonjour · أقدّم نفسي</p></div><span class="pill">Leçon 1</span></div><div class="progress"><i id="bar"></i></div></section><div id="tabs" class="tabs"></div><section id="view"></section><section class="card actions"><a class="btn alt" href="baccalaureat-2.html">← العودة للمنهج</a><button class="btn alt" id="prev">السابق</button><button class="btn" id="next">التالي</button></section></main><script>const S=['Dire bonjour','Vocabulaire','Écoute et parle','Grammaire','Lecture','Écris','Jeux et activités','Projet','Révision et Test'];const V=[['Bonjour','مرحبًا'],['Salut','أهلًا'],['Au revoir','إلى اللقاء'],['Merci','شكرًا'],['Enchanté (m.)','سعيد بلقائك'],['Enchantée (f.)','سعيدة بلقائك'],['Comment tu t’appelles ?','ما اسمك؟'],['Je m’appelle…','اسمي…'],['J’ai … ans.','عمري … سنة'],['Je suis en …','أنا في الصف …'],['Je suis …','أنا …']];const Q=[['Qui dit « Bonjour » ?',['Adam','Sara'],0],['Comment s’appelle le garçon ?',['Ali','Adam'],1],['Que dit Sara à la fin ?',['Merci','Au revoir'],0],['« Comment tu t’appelles ? » demande…',['le nom','l’âge'],0],['Je ___ Adam.',['m’appelle','suis'],0],['J’___ 11 ans.',['ai','suis'],0],['Je suis en ___.',['sixième','nationalité'],0],['« Au revoir » signifie…',['مرحبًا','إلى اللقاء','شكرًا'],1],['Je suis ___ .',['égyptien','appelle'],0]];let i=0,score=0,done=0;function speak(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';speechSynthesis.speak(u)}function quiz(q,n){return `<div class="q"><b>${n+1}. ${q[0]}</b><div class="opts">${q[1].map((x,j)=>`<button class="opt" data-q="${n}" data-a="${j}">${x}</button>`).join('')}</div><div id="f${n}" class="feedback"></div></div>`}function render(){document.getElementById('tabs').innerHTML=S.map((x,n)=>`<button class="tab ${n===i?'on':''}" data-i="${n}">${n+1}. ${x}</button>`).join('');document.getElementById('bar').style.width=((i+1)/S.length*100)+'%';let h='';if(i===0)h=`<section class="card"><h2>👋 Dire bonjour</h2><p class="muted">Observe le dialogue. شاهد الحوار ثم استمع للجمل وكررها.</p><div class="dialogue"><div class="model">Bonjour !</div><div class="model">Bonjour !</div><div class="model">Comment tu t’appelles ?</div><div class="model">Je m’appelle Adam.</div><div class="model">Enchantée.</div><div class="model">Merci.</div></div><p class="muted"><b>Astuce :</b> Quand tu rencontres quelqu’un, regarde-le, souris et dis « Bonjour ! » 😊</p></section>`;if(i===1)h=`<section class="card"><h2>🗂️ Vocabulaire</h2><div class="grid">${V.map(v=>`<article class="v"><b>${v[0]}</b><span>${v[1]}</span><button class="speak" onclick="speak('${v[0].replaceAll("'","\\'")}')">🔊 نطق</button></article>`).join('')}</div><div class="rule"><b>À retenir :</b><br>Bonjour ! = مرحبًا · Au revoir ! = إلى اللقاء · Merci ! = شكرًا</div></section>`;if(i===2)h=`<section class="card"><h2>🎧 Écoute et parle</h2><p class="muted">استمع إلى الجملة ثم اختر الإجابة الصحيحة. ثم مارس الحوار مع زميلك.</p>${Q.slice(0,3).map(quiz).join('')}<div class="dialogue"><div class="model">Bonjour !</div><div class="model">Comment tu t’appelles ?</div><div class="model">Je m’appelle …</div><div class="model">Enchanté(e) !</div></div><button class="speak" onclick="speak('Bonjour ! Comment tu t’appelles ? Je m’appelle Adam. Enchantée. Merci.')">🔊 استمع للنموذج</button></section>`;if(i===3)h=`<section class="card"><h2>📘 Grammaire — Je m’appelle</h2><div class="rule"><b>On utilise « Je m’appelle » pour dire son nom.</b><br><br><span class="model">Je m’appelle Adam.</span><span class="model">Je m’appelle Sara.</span><br><b>Attention !</b><br>✗ Je suis Adam. (لذكر الاسم)<br>✓ Je m’appelle Adam.</div><h3>A. Complète avec « Je m’appelle ».</h3><div class="grid"><div class="v">1. ______ Ali.</div><div class="v">2. ______ Nour.</div><div class="v">3. ______ Yasmine.</div></div><h3>B. Remets les mots dans l’ordre.</h3><div class="q">1. m’appelle / Je / Omar / .</div><div class="q">2. m’appelle / Je / Leila / .</div></section>`;if(i===4)h=`<section class="card"><h2>📖 Lecture</h2><div class="reading"><b>Bonjour !</b><br>Je m’appelle Karim.<br>J’ai 11 ans.<br>Je suis en sixième.<br>Je suis égyptien.<br>Et toi, comment tu t’appelles ?</div><h3>Réponds aux questions.</h3>${['Qui parle dans le texte ?','Comment il s’appelle ?','Quel âge a-t-il ?','Quelle est sa classe ?','Quelle est sa nationalité ?'].map((x,n)=>`<div class="q">${n+1}. ${x}<input class="write" placeholder="اكتب الإجابة..."></div>`).join('')}<div class="rule"><b>Le savais-tu ?</b><br>En France, les élèves vont à l’école du lundi au vendredi.</div></section>`;if(i===5)h=`<section class="card"><h2>✍️ Écris</h2><h3>A. Complète le tableau.</h3><div class="grid"><div class="v"><b>Je m’appelle</b><input class="write"></div><div class="v"><b>J’ai</b><span>_____ ans.</span><input class="write"></div><div class="v"><b>Je suis en</b><input class="write"></div><div class="v"><b>Je suis</b><input class="write"></div></div><h3>B. Écris 4 phrases sur toi.</h3><textarea class="write" placeholder="Je m’appelle…\nJ’ai… ans.\nJe suis en…\nJe suis…"></textarea><h3>C. Présente-toi à ton/ta camarade.</h3><div class="model">Je m’appelle… → Enchanté(e) !</div></section>`;if(i===6)h=`<section class="card"><h2>🎮 Jeux et activités</h2><h3>A. Le jeu des cartes</h3><p class="muted">Forme des phrases avec les cartes.</p><div class="match"><button class="opt" onclick="speak('Je m’appelle Adam.')">Je · m’appelle · Adam · .</button><button class="opt" onclick="speak('Je m’appelle Sara.')">Je · m’appelle · Sara · .</button></div><h3>B. Vrai ou faux ?</h3>${[['Adam dit « Bonjour ».','Vrai'],['Sara demande le nom d’Adam.','Vrai'],['Adam dit « Au revoir ».','Faux'],['Adam s’appelle Ali.','Faux']].map((x,n)=>`<div class="q">${n+1}. ${x[0]} <button class="opt" data-v="${x[1]}">Vrai</button> <button class="opt" data-v="${x[1]}">Faux</button></div>`).join('')}<h3>C. Relie</h3><div class="grid"><div class="v">Bonjour<br>Au revoir<br>Merci<br>Enchanté</div><div class="v">مرحبًا<br>إلى اللقاء<br>شكرًا<br>سعيد بلقائك</div></div></section>`;if(i===7)h=`<section class="card"><h2>🪪 Projet — Ma carte d’identité</h2><div class="project"><p>Crée ta carte et présente-la à tes camarades.</p><div class="grid"><div class="v"><b>Je m’appelle :</b><input class="write"></div><div class="v"><b>J’ai :</b><input class="write"></div><div class="v"><b>Je suis en :</b><input class="write"></div><div class="v"><b>Je suis :</b><input class="write"></div></div></div><p class="muted">استخدم ألوانًا جميلة وصمّم بطاقة شخصية أصلية ثم قدّم نفسك شفهيًا.</p></section>`;if(i===8)h=`<section class="card"><h2>🎯 Révision et Test</h2>${Q.map(quiz).join('')}<h3>B. Complète.</h3><div class="q">1. Je m’appelle ______ Ali.</div><div class="q">2. J’ai ______ ans.</div><div class="q">3. Je suis en ______.</div><h3>C. Écris ton nom complet.</h3><input class="write"><div class="rule"><b>Ma note :</b> ${score} / ${Q.length} ⭐</div></section>`;document.getElementById('view').innerHTML=h}document.addEventListener('click',e=>{if(e.target.classList.contains('tab')){i=+e.target.dataset.i;render()}if(e.target.id==='next'){i=Math.min(S.length-1,i+1);render()}if(e.target.id==='prev'){i=Math.max(0,i-1);render()}if(e.target.classList.contains('opt')&&e.target.dataset.q!==undefined){let n=+e.target.dataset.q,a=+e.target.dataset.a,q=Q[n],f=document.getElementById('f'+n);if(e.target.parentElement.dataset.done==='1')return;e.target.parentElement.dataset.done='1';done++;if(a===q[2]){score++;e.target.classList.add('ok');f.textContent='✓ صحيح'}else{e.target.classList.add('bad');f.textContent='✗ الإجابة الصحيحة: '+q[1][q[2]]}}});render();</script></body></html>
