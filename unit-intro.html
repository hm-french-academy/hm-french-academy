<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | ضربة البداية</title><link rel="stylesheet" href="css/premium-shell.css"><style>body{background:#f5f7fb}.wrap{max-width:1000px;margin:auto;padding:28px 16px 60px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff;border-radius:30px;padding:30px}.hero h1{font-size:clamp(28px,5vw,46px);margin:0 0 10px}.hero p{line-height:1.9;font-size:17px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;margin-top:18px}.card{background:#fff;border:1px solid #e1e7f0;border-radius:22px;padding:20px;box-shadow:0 10px 28px #14264a10}.icon{font-size:38px}.card h3{margin:8px 0}.card p{color:#68758a;line-height:1.7}.go{display:inline-block;background:#fff;color:#173a82;text-decoration:none;padding:13px 18px;border-radius:14px;font-weight:900;margin-top:12px}.back{display:inline-block;margin-bottom:15px;color:#173a82;text-decoration:none;font-weight:800}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="index.html">الرئيسية</a><a href="academy-map.html">خريطة المنصة</a><a href="course.html">المناهج</a><a href="dashboard.html">الطالب</a></nav></header><main class="wrap"><a class="back" id="back" href="unit-map.html">← العودة إلى خريطة الوحدة</a><section class="hero"><div style="font-size:54px">🚀</div><h1 id="title">ضربة البداية</h1><p id="desc"></p><a class="go" id="start" href="#">ابدأ رحلة الوحدة</a></section><section class="grid" id="goals"></section></main><script>const data={"unit-1":{name:"الوحدة 1: À l'école",desc:"استكشف عالم المدرسة وتعلم كيف تتحدث عن أماكنها وأدواتها ومواقفك اليومية باللغة الفرنسية.",goals:[['📚','ماذا ستتعلم؟','مفردات المدرسة والأدوات والتعبيرات الأساسية.'],['📘','قاعدة الوحدة','استخدام تراكيب بسيطة لوصف ما يوجد وما نستخدمه.'],['💬','تواصل','فهم محادثة قصيرة والتعبير عن نفسك في موقف مدرسي.'],['🎮','تدرب والعب','تثبيت المفردات والقواعد من خلال أنشطة تفاعلية.'],['🏆','هدفك النهائي','إكمال الدروس ثم اجتياز تحدي واختبار الوحدة.']]},"unit-2":{name:"الوحدة 2: La maison",desc:"اكتشف المنزل وغرفه وتعلم كيف تصف المكان والأشياء الموجودة فيه بطريقة بسيطة.",goals:[['🏠','مفردات جديدة','غرف المنزل والأشياء المرتبطة بها.'],['📘','قاعدة الوحدة','تراكيب تساعدك على الوصف والتعبير عن المكان.'],['💬','تواصل','محادثة قصيرة عن المنزل وما يوجد فيه.'],['🎮','تدرب والعب','أنشطة صور واختيار واستماع لتثبيت التعلم.'],['🏆','هدفك النهائي','إكمال الرحلة واجتياز تقييم الوحدة.']]},"unit-3":{name:"الوحدة 3: Le voyage",desc:"انطلق في رحلة فرنسية ممتعة وتعلم مفردات السفر ووسائل النقل والتواصل في الرحلات.",goals:[['🧳','مفردات جديدة','السفر والأماكن ووسائل النقل.'],['📘','قاعدة الوحدة','تراكيب وتعبيرات مرتبطة بمواقف السفر.'],['💬','تواصل','محادثات قصيرة في مواقف واقعية.'],['🎮','تدرب والعب','ألعاب وتحديات لاستعمال المفردات عملياً.'],['🏆','هدفك النهائي','إكمال الدروس واجتياز الاختبار النهائي.']]}};const q=new URLSearchParams(location.search),id=q.get('unit')||'unit-1',u=data[id]||data['unit-1'];document.getElementById('title').textContent='🚀 '+u.name+' | ضربة البداية';document.getElementById('desc').textContent=u.desc;document.getElementById('start').href='unit-map.html?unit='+id;document.getElementById('back').href='unit-map.html?unit='+id;document.getElementById('goals').innerHTML=u.goals.map(g=>`<article class="card"><div class="icon">${g[0]}</div><h3>${g[1]}</h3><p>${g[2]}</p></article>`).join('');</script></body></html>
