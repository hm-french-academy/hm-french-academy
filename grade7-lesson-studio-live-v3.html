<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a56"><title>HM Academy | الصف الأول الإعدادي</title><style>:root{--n:#102a56;--b:#2563eb;--t:#0f9f91;--ink:#14213d;--muted:#667085;--line:#e1e7f0;--ok:#087443;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef4ff,#fff);color:var(--ink);font-family:Arial,"Noto Sans Arabic",sans-serif;line-height:1.7}.wrap{max-width:1180px;margin:auto;padding:10px}.hero{background:linear-gradient(135deg,#102a56,#2455a6,#0f9f91);color:#fff;border-radius:24px;padding:22px;box-shadow:0 15px 40px #102a5620}.hero h1{margin:6px 0;font-size:clamp(24px,4vw,40px)}.fr{direction:ltr;text-align:right;font-weight:900}.bar{display:flex;gap:7px;overflow:auto;background:#fff;padding:10px;border:1px solid var(--line);border-radius:18px;margin-top:12px}.bar a{white-space:nowrap;text-decoration:none;background:#eef3fb;color:var(--n);padding:8px 12px;border-radius:999px;font-weight:800}.bar a.on{background:var(--b);color:#fff}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:18px}.panel{padding:16px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}.card{padding:14px}.visual{font-size:42px;text-align:center}.ar{text-align:center;color:#315aa4;font-weight:800}.note{padding:12px;border-radius:12px;background:#f8fafc;border-right:4px solid #94a3b8;margin:10px 0}.enriched{background:#effbf8;border-right-color:var(--t)}button,.cta{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer;background:var(--b);color:#fff}.cta{display:inline-block;text-decoration:none;margin:4px}.secondary{background:#eef3fb;color:var(--n)}.options{display:grid;gap:7px;margin-top:8px}.options button{text-align:right;background:#fff;color:var(--ink);border:1px solid var(--line)}.feedback{min-height:24px;margin-top:7px}.ok{color:var(--ok);font-weight:900}.bad{color:var(--bad);font-weight:900}.score{font-size:22px;font-weight:900}.progress{height:10px;background:#e8edf5;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--t))}.muted{color:var(--muted)}.footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}@media(max-width:650px){.wrap{padding:7px}.panel{padding:12px}.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header class="hero"><b>🇫🇷 HM Academy · الصف الأول الإعدادي</b><h1 id="title">جاري التحميل…</h1><div id="fr" class="fr"></div><p id="goal"></p></header><nav class="bar" id="nav"></nav><main class="panel" id="app">جاري تجهيز الدرس…</main><footer class="footer">HM Academy · تعلّم الفرنسية بطريقة أبسط وأذكى.</footer></div><script>
const p=new URLSearchParams(location.search),id=p.get('id')||'grade7-u1-l2',sec=p.get('section')||'introduction';
const paths={'grade7-u1-l2':'unit-1/lesson-2.json','grade7-u1-l3':'unit-1/lesson-3.json','grade7-u1-l4':'unit-1/lesson-4.json','grade7-u1-l5':'unit-1/lesson-5.json','grade7-u1-l6':'unit-1/lesson-6.json','grade7-u2-l1':'unit-2/lesson-1.json','grade7-u2-l2':'unit-2/lesson-2.json','grade7-u3-l1':'unit-3/lesson-1.json','grade7-u3-l2':'unit-3/lesson-2.json','grade7-u3-l3':'unit-3/lesson-3.json'};
const stages=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];
let D={};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const shuffle=a=>[...a].sort(()=>Math.random()-.5);function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}
function nav(){document.getElementById('nav').innerHTML=stages.map(x=>`<a class="${x[0]===sec?'on':''}" href="?id=${encodeURIComponent(id)}&section=${x[0]}">${x[1]}</a>`).join('')}
function vals(){const v=D.journeyContent?.vocabulary?.items;return Array.isArray(v)?v.filter(x=>Array.isArray(x)&&x[0]&&x[1]):[]}
function vocabulary(){const v=vals();return `<h2>🖼️ المفردات</h2><p class="note enriched">المفردات المعروضة مأخوذة من بيانات هذا الدرس، مع استماع مباشر للنطق.</p><div class="grid">${v.map(x=>`<article class="card"><b dir="ltr">${esc(x[0])}</b><p class="ar">${esc(x[1])}</p>${x[2]?`<p dir="ltr">${esc(x[2])}</p>`:''}<button onclick='speak(${JSON.stringify(x[0])})'>🔊 استمع</button></article>`).join('')||'<p class="note">لا توجد مفردات منظمة في بيانات هذا الدرس.</p>'}</div>`}
function introduction(){const j=D.journeyContent?.introduction||{};return `<h2>🚀 البداية</h2><div class="note enriched"><b>هدف الدرس</b><br>${esc(j.goal||'اكتشف محتوى الدرس ثم طبّقه خطوة بخطوة.')}</div><p>هذه الصفحة تعرض المحتوى المرتبط ببيانات الدرس الأصلي، وتضيف تفاعلًا وتصحيحًا فوريًا دون استبدال المصدر.</p><a class="cta" href="?id=${encodeURIComponent(id)}&section=vocabulary">ابدأ الاكتشاف ←</a>`}
function pronunciation(){const j=D.journeyContent?.pronunciation||{};const a=Array.isArray(j.items)?j.items:[];return `<h2>🎧 النطق</h2><p class="note">استمع إلى عناصر النطق المرتبطة بالدرس وكررها بصوت مرتفع.</p><div class="grid">${a.map(x=>`<article class="card"><b dir="ltr">${esc(x)}</b><br><button onclick='speak(${JSON.stringify(x)})'>🔊 استمع</button></article>`).join('')||'<p class="note">لا توجد قائمة نطق منظمة في بيانات هذا الدرس.</p>'}</div>`}
function grammar(){const j=D.journeyContent?.grammar||{};return `<h2>📘 القواعد</h2>${j.sourceBoundary?`<p class="note enriched">${esc(j.sourceBoundary)}</p>`:''}<div class="grid">${(j.notes||[]).map((n,i)=>`<article class="card"><b>${i+1}. القاعدة</b><p>${esc(n)}</p></article>`).join('')||'<p class="note">راجع القاعدة من الأمثلة والأنشطة الأصلية لهذا الدرس.</p>'}</div>`}
function conversation(){const j=D.journeyContent?.conversation||{};const a=Array.isArray(j.sourcePreserved)?j.sourcePreserved:[];return `<h2>💬 المحادثة</h2><p class="note">النصوص المحفوظة في المصدر تظهر هنا دون استبدالها.</p><div class="grid">${a.map((x,i)=>`<article class="card"><b>${i+1}</b><p dir="ltr">${esc(x)}</p><button onclick='speak(${JSON.stringify(x)})'>🔊 استمع</button></article>`).join('')||'<p class="note">لا يوجد حوار نصي منظم في بيانات هذا الدرس.</p>'}</div>`}
function buildQuestions(count){const v=vals();let q=[];for(const x of v){q.push({q:`ما معنى «${x[0]}»؟`,a:x[1],o:[x[1],...shuffle(v.filter(y=>y!==x)).slice(0,3).map(y=>y[1])]});q.push({q:`أي تعبير يطابق «${x[1]}»؟`,a:x[0],o:[x[0],...shuffle(v.filter(y=>y!==x)).slice(0,3).map(y=>y[0])]})}let g=Array.isArray(D.journeyContent?.grammar?.notes)?D.journeyContent.grammar.notes:[];for(const n of g)q.push({q:`ما الفكرة التي تشرحها هذه القاعدة؟`,a:n,o:[n,...shuffle(g.filter(y=>y!==n)).slice(0,3)]});q=shuffle(q);while(q.length<count&&q.length>0)q=q.concat(q.slice(0,Math.min(count-q.length,q.length)).map((x,i)=>({...x,q:x.q+' · مراجعة '+(i+1)})));return q.slice(0,count)}
function quiz(qs,prefix){let answered=0,correct=0;const key=prefix+Date.now();window.__quizState=window.__quizState||{};window.__quizState[key]={answered:0,correct:0,total:qs.length};return `<div id="score-${key}" class="score">0 / ${qs.length}</div><div class="grid">${qs.map((q,i)=>{const opts=shuffle(q.o);return `<article class="card"><b>${i+1}. ${esc(q.q)}</b><div class="options">${opts.map(o=>`<button onclick='answer(${JSON.stringify(key)},${JSON.stringify(o)},${JSON.stringify(q.a)},this,${JSON.stringify(q.q)})'>${esc(o)}</button>`).join('')}</div><div class="feedback" id="f-${key}-${i}"></div></article>`}).join('')}</div>`}
function answer(k,v,c,b,q){const s=window.__quizState[k];if(!s||b.disabled)return;const i=s.answered;const f=document.querySelectorAll(`[id^="f-${k}-"]`)[Math.min(i,s.total-1)];b.disabled=true;s.answered++;if(v===c){s.correct++;f.innerHTML='<span class="ok">✅ صحيح — أحسنت!</span>'}else f.innerHTML=`<span class="bad">❌ غير صحيح.</span><br><span class="muted">الإجابة الصحيحة: ${esc(c)}</span>`;document.getElementById('score-'+k).textContent=`${s.correct} / ${s.total}`}
function practice(){const qs=buildQuestions(6);return `<h2>✍️ التدريب التفاعلي</h2><p class="note">6 أسئلة قصيرة مع تصحيح فوري، مبنية على مفردات وقواعد الدرس.</p>${quiz(qs,'p')}`}
function assessment(){const qs=buildQuestions(20);return `<h2>🏆 التقييم</h2><p class="note enriched">التقييم الختامي يحتوي على 20 عنصرًا فعلية. يتم تصحيح كل إجابة فورًا، مع إعادة استخدام عناصر المصدر فقط عند الحاجة لتغطية العدد الكامل.</p>${quiz(qs,'a')}`}
function games(){const g=D.journeyContent?.games;return `<h2>🎮 الألعاب</h2><div class="grid">${(Array.isArray(g)?g:[]).map((x,i)=>`<article class="card"><div class="visual">🎮</div><b>${i+1}. ${esc(x)}</b><p class="muted">تحدٍ مرتبط بمحتوى الدرس.</p></article>`).join('')||'<p class="note">لا توجد ألعاب منظمة في بيانات هذا الدرس حاليًا.</p>'}</div>`}
function video(){const source=D.sourceAssets?.video||D.videoUrl||D.video;return `<h2>🎬 الفيديو</h2><p class="note">لا يتم استبدال فيديو المصدر بفيديو آخر.</p>${source?`<div class="card"><video controls playsinline preload="metadata" style="width:100%" src="${esc(source)}"></video></div>`:'<div class="card"><p>لا يوجد رابط فيديو محفوظ في بيانات هذا الدرس حاليًا.</p></div>'}`}
function progress(){const k='hm_g7_'+id+'_progress',v=Number(localStorage.getItem(k)||0);return `<h2>📈 التقدم</h2><div class="card"><b>تقدم هذا الدرس</b><div class="progress" style="margin:12px 0"><i style="width:${Math.min(100,v)}%"></i></div><p>${Math.min(100,v)}%</p><button onclick='localStorage.setItem(${JSON.stringify(k)},"100");location.reload()'>تسجيل إتمام الدرس</button></div>`}
function render(){const map={introduction,vocabulary,pronunciation,grammar,conversation,practice,video,games,assessment,progress};document.getElementById('app').innerHTML=(map[sec]||introduction)();nav()}
async function load(){try{if(!paths[id])throw new Error('unsupported');let r=await fetch(`data/lessons/grade-7/${paths[id]}?v=20260908-v3`,{cache:'no-store'});if(!r.ok)throw new Error('load');let x=await r.json();for(let i=0;i<8&&typeof x.content==='string';i++)x=JSON.parse(x.content);D=x;document.getElementById('title').textContent=D.titleAr||id;document.getElementById('fr').textContent=D.titleFr||'';document.getElementById('goal').textContent=D.journeyContent?.introduction?.goal||'مسار تعليمي تفاعلي مرتبط بالمصدر.';render()}catch(e){document.getElementById('app').innerHTML='<div class="note">تعذر تحميل محتوى هذا الدرس. تحقق من الاتصال ثم أعد المحاولة.</div>';}}
load();</script></body></html>
