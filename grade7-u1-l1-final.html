<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | الدرس الأول</title><style>:root{--n:#102a56;--b:#2563eb;--t:#0f9f91;--g:#c18a2b;--ink:#14213d;--muted:#667085;--line:#e1e7f0;--ok:#087443;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef4ff,#fff);color:var(--ink);font-family:Arial,"Noto Sans Arabic",sans-serif;line-height:1.7}.wrap{max-width:1180px;margin:auto;padding:10px}.hero{background:linear-gradient(135deg,#102a56,#2455a6,#0f9f91);color:#fff;border-radius:24px;padding:22px;box-shadow:0 15px 40px #102a5620}.hero h1{margin:6px 0;font-size:clamp(24px,4vw,40px)}.fr{direction:ltr;text-align:center;font-weight:900}.hero .fr{text-align:right}.bar{display:flex;gap:7px;overflow:auto;background:#fff;padding:10px;border:1px solid var(--line);border-radius:18px;margin-top:12px}.bar a{white-space:nowrap;text-decoration:none;background:#eef3fb;color:var(--n);padding:8px 12px;border-radius:999px;font-weight:800}.bar a.on{background:var(--b);color:#fff}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:18px}.panel{padding:16px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}.card{padding:14px}.visual{font-size:42px;text-align:center}.ar{text-align:center;color:#315aa4;font-weight:800}.muted{color:var(--muted)}.note{padding:12px;border-radius:12px;background:#f8fafc;border-right:4px solid #94a3b8;margin:10px 0}.enriched{background:#effbf8;border-right-color:var(--t)}.gold{background:#fffaf0;border-right-color:var(--g)}button{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer;background:var(--b);color:#fff}.secondary{background:#edf2fb;color:var(--n)}.options{display:grid;gap:7px;margin-top:8px}.options button{text-align:right;background:#fff;color:var(--ink);border:1px solid var(--line)}.feedback{min-height:24px;margin-top:7px}.ok{color:var(--ok);font-weight:900}.bad{color:var(--bad);font-weight:900}.mini{font-size:12px}.score{font-size:22px;font-weight:900}.progress{height:10px;background:#e8edf5;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--t))}.video{width:100%;aspect-ratio:16/9;border:0;border-radius:15px;background:#101828}.gameWord{font-size:30px;font-weight:900;direction:ltr;text-align:center}.footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}@media(max-width:650px){.wrap{padding:7px}.panel{padding:12px}.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="hero"><b>🇫🇷 HM Academy · الصف الأول الإعدادي · الوحدة الأولى · الدرس الأول</b><h1>الأبجدية والحروف المتحركة والكلمات الشفافة</h1><div class="fr">L'alphabet, les voyelles et les mots transparents</div><p>تعلّم خطوة بخطوة: اكتشف، استمع، طبّق، ثم راجع ما تعلّمته.</p></header><nav class="bar" id="nav"></nav><main class="panel" id="app">جاري التحميل…</main><footer class="footer">HM Academy · تعلّم الفرنسية بطريقة أبسط وأذكى.</footer></div><script>
const S=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']],p=new URLSearchParams(location.search),sec=p.get('section')||'introduction',store='hm_g7_l1_v4';let state=JSON.parse(localStorage.getItem(store)||'{"wrong":[],"done":{},"score":0}');
const practice=[['كيف تُكتب «شكرًا» بالفرنسية؟',['Merci','Bonjour','Salut'],'Merci','هذه هي الكلمة الفرنسية الصحيحة للشكر.'],['ما الحرف المتحرك الذي تبدأ به éléphant؟',['A','E','O'],'E','éléphant تبدأ بالحرف E.'],['ما الكلمة الشفافة لـ «تليفون»؟',['Un taxi','Un téléphone','Un piano'],'Un téléphone','التشابه في الشكل والمعنى يساعد على التعرف إليها.'],['ما معنى Un autobus؟',['أوتوبيس','تاكسي','دراجة'],'أوتوبيس','autobus كلمة شفافة.'],['أي حرف يُنطق «إيغريك» في الفرنسية؟',['W','Y','H'],'Y','اسم الحرف Y في الفرنسية هو i grec.'],['ما الكلمة الشفافة لـ «جيتار»؟',['Une radio','Une guitare','Un vase'],'Une guitare','guitare تشبه جيتار في الشكل والمعنى.']];
const assess=[['اختر الحرف المتحرك في orange',['O','B','C'],'O'],['ما الكلمة الشفافة التي تعني تليفون؟',['Un téléphone','Un pantalon','Un vase'],'Un téléphone'],['أكمل ph__to',['o','i','a'],'o'],['أي مقطع في moi؟',['oi','ou','ph'],'oi'],['rouge تعني؟',['أحمر','أزرق','أخضر'],'أحمر'],['أي كلمة تبدأ بـ U؟',['uniforme','orange','arbre'],'uniforme'],['ما معنى Un autobus؟',['أوتوبيس','كاميرا','راديو'],'أوتوبيس'],['اختر كلمة تحتوي eau',['beau','moi','photo'],'beau'],['أي كلمة تحتوي ch؟',['chat','moi','beau'],'chat'],['ما معنى Un bouquet؟',['باقة ورد','جراج','بيجاما'],'باقة ورد'],['ما أول حرف في éléphant؟',['E','I','O'],'E'],['Une guitare تعني؟',['جيتار','تليفزيون','لمبة'],'جيتار'],['أي كلمة تحتوي ou؟',['rouge','photo','moi'],'rouge'],['ما معنى Un cinéma؟',['سينما','صحيفة','مضرب'],'سينما'],['أي حرف متحرك في image؟',['I','M','G'],'I'],['Je prends un ___.',['taxi','guitare','lampe'],'taxi'],['أي كلمة تبدأ بـ P؟',['piano','orange','radio'],'piano'],['ما معنى Un journal؟',['جريدة','فازة','أسانسير'],'جريدة'],['أي مقطع في deux؟',['eu','oi','an'],'eu'],['الكلمة الشفافة لكاميرا؟',['Une caméra','Un canapé','Un vase'],'Une caméra']];
const review=[['أي مقطع في moi؟',['oi','ph','eau'],'oi'],['ما الحرف المتحرك في arbre؟',['A','B','R'],'A'],['ما معنى Un taxi؟',['تاكسي','جيتار','فازة'],'تاكسي'],['أي مقطع في photo؟',['ph','oi','ou'],'ph'],['أي كلمة تحتوي eau؟',['beau','moi','chat'],'beau'],['ما معنى Une guitare؟',['جيتار','كاميرا','راديو'],'جيتار']];
const vocab=[['Un pyjama','بيجاما','🩳'],['Un pantalon','بنطلون','👖'],['Un taxi','تاكسي','🚕'],['Un domino','دومينو','🎲'],['Un canapé','كنبة','🛋️'],['Un téléphone','تليفون','📱'],['Un biscuit','بسكويت','🍪'],['Un balcon','بلكونة','🏠'],['Un vase','فازة','🏺'],['Un ascenseur','أسانسير','🛗'],['Une caméra','كاميرا','📷'],['Un autobus','أوتوبيس','🚌'],['Un gilet','جيلية','🦺'],['Une écharpe','إيشارب','🧣'],['Un bouquet','باقة ورد','💐'],['Une guitare','جيتار','🎸'],['Une télévision','تليفزيون','📺'],['Une plage','شاطئ','🏖️'],['Une lampe','لمبة','💡'],['Une raquette','مضرب','🏸'],['Une radio','راديو','📻'],['Un piano','بيانو','🎹'],['Un garage','جراج','🚗'],['Un cinéma','سينما','🎬'],['Un journal','جورنال','📰']];
const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map((x,i)=>[x,['arbre','banane','cinéma','domino','éléphant','photo','guitare','hôtel','image','journal','kilo','lampe','moto','nez','orange','piano','question','radio','salut','taxi','uniforme','vélo','wagon','taxi','yoyo','zéro'][i]]);const patterns=[['ph','photo'],['oi','moi'],['ou','rouge'],['ch','chat'],['eau','beau'],['ai','lait'],['eu','deux'],['an','enfant'],['on','bon'],['in','cinq']];
function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.85;speechSynthesis.speak(u)}function save(){localStorage.setItem(store,JSON.stringify(state))}function nav(){document.getElementById('nav').innerHTML=S.map(x=>`<a class="${x[0]===sec?'on':''}" href="?id=grade7-u1-l1&section=${x[0]}">${x[1]}</a>`).join('')}function qbox(arr,key){return arr.map((q,i)=>`<article class="card"><b>${i+1}. ${q[0]}</b><div class="options">${q[1].map(o=>`<button onclick='answer(${JSON.stringify(key+i)},${JSON.stringify(o)},${JSON.stringify(q[2])},this)'>${o}</button>`).join('')}</div><div class="feedback" id="f-${key+i}"></div></article>`).join('')}function answer(k,v,c,b){let f=document.getElementById('f-'+k);if(v===c){f.innerHTML='<span class="ok">✅ صحيح — أحسنت!</span>';state.done[k]=1;b.disabled=true}else{f.innerHTML='<span class="bad">❌ ليست الإجابة الصحيحة.</span><br>الإجابة الصحيحة: <b>'+c+'</b>';state.wrong.push(k)}save()}
function render(){nav();let h='';if(sec==='introduction')h=`<h2>🚀 البداية</h2><p>هدف الدرس: التعرف إلى الأبجدية، الحروف المتحركة، الكلمات الشفافة، ثم استخدامها في الاستماع والقراءة والتدريب.</p><div class="grid">${['26 حرفًا مع مثال لكل حرف','A E I O U والحروف ذات الصلة','10 مجموعات صوتية: ph وoi وou وch وeau وغيرها','25 مفردة شفافة','6 أسئلة تدريبية','4 ألعاب تفاعلية','6 أسئلة مراجعة ذكية','تقييم إلكتروني كامل من 20 سؤالًا'].map((x,i)=>`<article class="card"><b>${i+1}. ${x}</b></article>`).join('')}</div><div class="note gold">ابدأ باكتشاف الحروف والأصوات، ثم انتقل إلى التدريب والمراجعة والتقييم.</div>`;else if(sec==='vocabulary')h=`<h2>🖼️ المفردات</h2><p>كل مفردة لها عنصر بصري، معنى، ونطق.</p><div class="grid">${vocab.map(x=>`<article class="card"><div class="visual">${x[2]}</div><div class="fr">${x[0]}</div><div class="ar">${x[1]}</div><button onclick='speak(${JSON.stringify(x[0])})'>🔊 استمع</button></article>`).join('')}</div>`;else if(sec==='pronunciation')h=`<h2>🎧 النطق</h2><h3>الحروف A–Z مع مثال</h3><div class="grid">${letters.map(x=>`<article class="card"><div class="pattern"><b style="font-size:28px">${x[0]}</b><span class="fr">${x[1]}</span></div><button onclick='speak(${JSON.stringify(x[1])})'>🔊 اسمع</button></article>`).join('')}</div><h3>المقاطع الصوتية</h3><div class="grid">${patterns.map(x=>`<article class="card"><div class="pattern"><b style="font-size:25px">${x[0]}</b><span class="fr">${x[1]}</span></div><button onclick='speak(${JSON.stringify(x[1])})'>🔊 استمع</button></article>`).join('')}</div>`;else if(sec==='grammar')h=`<h2>📘 القواعد والأساسيات</h2><div class="grid"><article class="card"><h3>الأبجدية</h3><p>الفرنسية تستخدم 26 حرفًا من A إلى Z.</p></article><article class="card"><h3>الحروف المتحركة</h3><p><b>A · E · I · O · U</b> هي الأساس، وY قد يؤدي وظيفة حرف متحرك بحسب الكلمة.</p></article><article class="card"><h3>الكلمات الشفافة</h3><p>تشبه كلمات نعرفها، مثل <b dir="ltr">taxi · téléphone · cinéma · guitare</b>. التشابه يساعد على التخمين، لكن الاستماع والسياق للتأكد.</p></article><article class="card"><h3>الحرف ≠ الصوت دائمًا</h3><p>لهذا ندرس وحدات مثل <b dir="ltr">ph · oi · ou · ch · eau</b>.</p></article></div><div class="note enriched">تذكّر: معرفة الحرف تساعدك على القراءة، أما معرفة الصوت فتساعدك على النطق الصحيح.</div>`;else if(sec==='conversation')h=`<h2>💬 المحادثة</h2><div class="note enriched">تدرّب على العبارات التالية بصوت مرتفع، ثم جرّب استخدامها في موقف مشابه.</div><div class="grid">${[['Bonjour !','Bonjour ! Ça va ?'],['Ça va bien, merci.','Et toi ?'],["Comment tu t'appelles ?","Je m'appelle Adam."],["C'est quoi ?","C'est un téléphone."],['Quelle lettre ?','C’est la lettre A.'],['Tu connais ce mot ?','Oui, c’est un taxi.'],['Au revoir !','À bientôt !']].map((x,i)=>`<article class="card"><span class="pill">موقف ${i+1}</span><p class="fr">${x[0]}</p><p class="fr">${x[1]}</p><button onclick='speak(${JSON.stringify(x[0]+' '+x[1])})'>🔊 استمع للحوار</button></article>`).join('')}</div>`;else if(sec==='practice')h=`<h2>✍️ التدريب</h2><div class="note gold"><b>تدريب قصير ومركّز</b> — أجب عن الأسئلة ثم راجع التغذية الراجعة بعد كل محاولة.</div>${qbox(practice,'p')}`;else if(sec==='video')h=`<h2>🎬 الفيديو</h2><div class="card"><h3>الفيديو التكميلي</h3><p>شاهد الفيديو ثم عد إلى الأنشطة لتثبيت النطق والمفردات.</p><video class="video" controls preload="metadata"><source src="assets/videos/grade7-u1-l1.mp4" type="video/mp4"></video><div class="note gold">إذا لم يظهر الفيديو، يمكنك متابعة بقية أنشطة الدرس ثم العودة إليه لاحقًا.</div></div>`;else if(sec==='games')h=`<h2>🎮 الألعاب</h2><p>أربع ألعاب تفاعلية لتثبيت الحروف والأصوات والكلمات.</p><div class="grid"><article class="card"><h3>🎧 اسمع واختر</h3><p>استمع إلى <b dir="ltr">photo</b> ثم اختر المقطع.</p><button onclick="speak('photo')">🔊 استمع</button><div class="options"><button onclick="game(this,'ph')">ph</button><button onclick="game(this,'oi')">oi</button><button onclick="game(this,'ou')">ou</button></div><div id="g1" class="feedback"></div></article><article class="card"><h3>🔤 فرز الحروف</h3><p>هل الحرف متحرك؟</p><div class="gameWord">A</div><div class="options"><button onclick="game2(this,true)">متحرك</button><button onclick="game2(this,false)">ساكن</button></div><div id="g2" class="feedback"></div></article><article class="card"><h3>🃏 كلمة ومعنى</h3><p class="fr">Un téléphone</p><div class="options"><button onclick="game3(this,true)">تليفون</button><button onclick="game3(this,false)">جيتار</button></div><div id="g3" class="feedback"></div></article><article class="card"><h3>🎯 صيد المقطع</h3><p class="fr">rouge</p><div class="options"><button onclick="game4(this,false)">ph</button><button onclick="game4(this,true)">ou</button><button onclick="game4(this,false)">oi</button></div><div id="g4" class="feedback"></div></article></div>`;else if(sec==='smart-review')h=`<h2>🧠 المراجعة الذكية</h2><div class="note enriched">راجع المهارات التي تحتاج إلى مزيد من التدريب، ثم أعد المحاولة.</div><p>عدد الأخطاء المسجلة حتى الآن: <b>${state.wrong.length}</b></p>${qbox(review,'r')}`;else if(sec==='assessment')h=`<h2>🏆 التقييم النهائي</h2><div class="note gold"><b>20 سؤالًا</b> لقياس فهمك لمهارات الدرس. خذ وقتك وأجب عن كل سؤال.</div><div id="assessment">${qbox(assess,'a')}</div><button onclick="finishAssessment()">📊 احسب النتيجة</button><div id="result" class="feedback"></div>`;else{let done=Object.keys(state.done).length,total=6+6+20,pct=Math.min(100,Math.round(done/total*100));h=`<h2>📈 التقدم</h2><div class="card"><div class="score">${pct}%</div><div class="progress"><i style="width:${pct}%"></i></div><p>تم تسجيل ${done} تفاعلات صحيحة من أنشطة الدرس.</p><p>التدريب: 6 · المراجعة: 6 · التقييم: 20</p></div>`}document.getElementById('app').innerHTML=h}function game(b,c){document.getElementById('g1').innerHTML=b.textContent===c?'<span class="ok">✅ ممتاز</span>':'<span class="bad">❌ حاول مرة أخرى</span>'}function game2(b,v){document.getElementById('g2').innerHTML=v?'<span class="ok">✅ صحيح</span>':'<span class="bad">❌ A حرف متحرك</span>'}function game3(b,v){document.getElementById('g3').innerHTML=v?'<span class="ok">✅ صحيح</span>':'<span class="bad">❌ الإجابة: تليفون</span>'}function game4(b,v){document.getElementById('g4').innerHTML=v?'<span class="ok">✅ صحيح</span>':'<span class="bad">❌ rouge تحتوي ou</span>'}function finishAssessment(){let n=Object.keys(state.done).filter(x=>x[0]==='a').length;document.getElementById('result').innerHTML='<span class="score">نتيجتك المسجلة: '+n+' / 20</span>';state.score=n;save()}render();</script></body></html>
