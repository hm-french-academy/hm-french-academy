<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | الدرس الأول</title><style>:root{--n:#102a56;--b:#2563eb;--t:#0f9f91;--g:#c18a2b;--ink:#14213d;--muted:#667085;--line:#e1e7f0;--ok:#087443;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef4ff,#fff);color:var(--ink);font-family:Arial,"Noto Sans Arabic",sans-serif;line-height:1.7}.wrap{max-width:1180px;margin:auto;padding:10px}.hero{background:linear-gradient(135deg,#102a56,#2455a6,#0f9f91);color:#fff;border-radius:24px;padding:22px;box-shadow:0 15px 40px #102a5620}.hero h1{margin:6px 0;font-size:clamp(24px,4vw,40px)}.fr{direction:ltr;text-align:center;font-weight:900}.hero .fr{text-align:right}.bar{display:flex;gap:7px;overflow:auto;background:#fff;padding:10px;border:1px solid var(--line);border-radius:18px;margin-top:12px}.bar a{white-space:nowrap;text-decoration:none;background:#eef3fb;color:var(--n);padding:8px 12px;border-radius:999px;font-weight:800}.bar a.on{background:var(--b);color:#fff}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:18px}.panel{padding:16px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}.card{padding:14px}.visual{font-size:42px;text-align:center}.ar{text-align:center;color:#315aa4;font-weight:800}.note{padding:12px;border-radius:12px;background:#f8fafc;border-right:4px solid #94a3b8;margin:10px 0}.enriched{background:#effbf8;border-right-color:var(--t)}.gold{background:#fffaf0;border-right-color:var(--g)}button{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer;background:var(--b);color:#fff}.options{display:grid;gap:7px;margin-top:8px}.options button{text-align:right;background:#fff;color:var(--ink);border:1px solid var(--line)}.feedback{min-height:24px;margin-top:7px}.ok{color:var(--ok);font-weight:900}.bad{color:var(--bad);font-weight:900}.score{font-size:22px;font-weight:900}.progress{height:10px;background:#e8edf5;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--t))}.video-box{background:#0f172a;border-radius:18px;padding:12px;color:#fff}.video-box video{display:block;width:100%;aspect-ratio:16/9;border-radius:12px;background:#020617}.video-fallback{display:inline-block;margin-top:10px;color:#fff;text-decoration:none;background:#2563eb;padding:9px 13px;border-radius:10px}.letter-strip,.pattern-strip{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding:8px 2px 14px;scroll-snap-type:x proximity}.letter-card,.pattern-card{flex:0 0 172px;scroll-snap-align:start}.letter-card{padding:13px}.letter-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.letter{font-size:38px;font-weight:900;color:var(--n);line-height:1}.example-img{width:82px;height:82px;border-radius:16px;display:grid;place-items:center;background:#f2f6ff;font-size:52px;margin:10px auto}.pronounce-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.pronounce-row button{font-size:12px;padding:8px 5px}.letter-example{font-size:18px;font-weight:900}.letter-ar{font-size:13px;color:var(--muted);min-height:22px}.pattern-card{flex-basis:190px}.pattern-mark{font-size:32px;font-weight:900;color:var(--t);text-align:center}.pattern-card .example-img{height:74px;width:74px}.video-missing{display:none}.footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}@media(max-width:650px){.wrap{padding:7px}.panel{padding:12px}.grid{grid-template-columns:1fr}.letter-card{flex-basis:155px}.pattern-card{flex-basis:175px}}
</style></head><body><div class="wrap"><header class="hero"><b>🇫🇷 HM Academy · الصف الأول الإعدادي · الوحدة الأولى · الدرس الأول</b><h1>الأبجدية والحروف المتحركة والكلمات الشفافة</h1><div class="fr">L'alphabet, les voyelles et les mots transparents</div><p>اكتشف الحروف والأصوات، استمع إلى النطق، ثم طبّق ما تعلمته.</p></header><nav class="bar" id="nav"></nav><main class="panel" id="app">جاري التحميل…</main><footer class="footer">HM Academy · تعلّم الفرنسية بطريقة أبسط وأذكى.</footer></div><script>
const S=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']],p=new URLSearchParams(location.search),sec=p.get('section')||'introduction',store='hm_g7_l1_v5';let state=JSON.parse(localStorage.getItem(store)||'{"wrong":[],"done":{},"score":0}');
const practice=[['كيف تُكتب «شكرًا» بالفرنسية؟',['Merci','Bonjour','Salut'],'Merci','هذه هي الكلمة الفرنسية الصحيحة للشكر.'],['ما الحرف المتحرك الذي تبدأ به éléphant؟',['A','E','O'],'E','éléphant تبدأ بالحرف E.'],['ما الكلمة الشفافة لـ «تليفون»؟',['Un taxi','Un téléphone','Un piano'],'Un téléphone','التشابه في الشكل والمعنى يساعد على التعرف إليها.'],['ما معنى Un autobus؟',['أوتوبيس','تاكسي','دراجة'],'أوتوبيس','autobus كلمة شفافة.'],['أي حرف يُنطق «إيغريك» في الفرنسية؟',['W','Y','H'],'Y','اسم الحرف Y في الفرنسية هو i grec.'],['ما الكلمة الشفافة لـ «جيتار»؟',['Une radio','Une guitare','Un vase'],'Une guitare','guitare تشبه جيتار في الشكل والمعنى.']];
const assess=[['اختر الحرف المتحرك في orange',['O','B','C'],'O'],['ما الكلمة الشفافة التي تعني تليفون؟',['Un téléphone','Un pantalon','Un vase'],'Un téléphone'],['أكمل ph__to',['o','i','a'],'o'],['أي مقطع في moi؟',['oi','ou','ph'],'oi'],['rouge تعني؟',['أحمر','أزرق','أخضر'],'أحمر'],['أي كلمة تبدأ بـ U؟',['uniforme','orange','arbre'],'uniforme'],['ما معنى Un autobus؟',['أوتوبيس','كاميرا','راديو'],'أوتوبيس'],['اختر كلمة تحتوي eau',['beau','moi','photo'],'beau'],['أي كلمة تحتوي ch؟',['chat','moi','beau'],'chat'],['ما معنى Un bouquet؟',['باقة ورد','جراج','بيجاما'],'باقة ورد'],['ما أول حرف في éléphant؟',['E','I','O'],'E'],['Une guitare تعني؟',['جيتار','تليفزيون','لمبة'],'جيتار'],['أي كلمة تحتوي ou؟',['rouge','photo','moi'],'rouge'],['ما معنى Un cinéma؟',['سينما','صحيفة','مضرب'],'سينما'],['أي حرف متحرك في image؟',['I','M','G'],'I'],['Je prends un ___.',['taxi','guitare','lampe'],'taxi'],['أي كلمة تبدأ بـ P؟',['piano','orange','radio'],'piano'],['ما معنى Un journal؟',['جريدة','فازة','أسانسير'],'جريدة'],['أي مقطع في deux؟',['eu','oi','an'],'eu'],['الكلمة الشفافة لكاميرا؟',['Une caméra','Un canapé','Un vase'],'Une caméra']];
const review=[['أي مقطع في moi؟',['oi','ph','eau'],'oi'],['ما الحرف المتحرك في arbre؟',['A','B','R'],'A'],['ما معنى Un taxi؟',['تاكسي','جيتار','فازة'],'تاكسي'],['أي مقطع في photo؟',['ph','oi','ou'],'ph'],['أي كلمة تحتوي eau؟',['beau','moi','chat'],'beau'],['ما معنى Une guitare؟',['جيتار','كاميرا','راديو'],'جيتار']];
const vocab=[['Un pyjama','بيجاما','🩳'],['Un pantalon','بنطلون','👖'],['Un taxi','تاكسي','🚕'],['Un domino','دومينو','🎲'],['Un canapé','كنبة','🛋️'],['Un téléphone','تليفون','📱'],['Un biscuit','بسكويت','🍪'],['Un balcon','بلكونة','🏠'],['Un vase','فازة','🏺'],['Un ascenseur','أسانسير','🛗'],['Une caméra','كاميرا','📷'],['Un autobus','أوتوبيس','🚌'],['Un gilet','جيلية','🦺'],['Une écharpe','إيشارب','🧣'],['Un bouquet','باقة ورد','💐'],['Une guitare','جيتار','🎸'],['Une télévision','تليفزيون','📺'],['Une plage','شاطئ','🏖️'],['Une lampe','لمبة','💡'],['Une raquette','مضرب','🏸'],['Une radio','راديو','📻'],['Un piano','بيانو','🎹'],['Un garage','جراج','🚗'],['Un cinéma','سينما','🎬'],['Un journal','جورنال','📰']];
const letters=[['A','arbre','شجرة','🌳'],['B','banane','موزة','🍌'],['C','cinéma','سينما','🎬'],['D','domino','دومينو','🎲'],['E','éléphant','فيل','🐘'],['F','photo','صورة','🖼️'],['G','guitare','جيتار','🎸'],['H','hôpital','مستشفى','🏥'],['I','image','صورة','🖼️'],['J','journal','جريدة','📰'],['K','kilo','كيلو','⚖️'],['L','lampe','لمبة','💡'],['M','moto','دراجة نارية','🏍️'],['N','nez','أنف','👃'],['O','orange','برتقالة','🍊'],['P','piano','بيانو','🎹'],['Q','question','سؤال','❓'],['R','radio','راديو','📻'],['S','salut','تحية','👋'],['T','taxi','تاكسي','🚕'],['U','uniforme','زي مدرسي','👔'],['V','vélo','دراجة','🚲'],['W','wagon','عربة قطار','🚋'],['X','taxi','تاكسي','🚕'],['Y','yoyo','يويو','🪀'],['Z','zéro','صفر','0️⃣']];
const patterns=[['ph','photo','صورة','🖼️'],['oi','moi','أنا','🙋'],['ou','rouge','أحمر','🔴'],['ch','chat','قطة','🐱'],['eau','beau','جميل','✨'],['ai','lait','حليب','🥛'],['eu','deux','اثنان','2️⃣'],['an','enfant','طفل','🧒'],['on','bon','جيد','👍'],['in','cinq','خمسة','5️⃣']];
const letterName={A:'a',B:'bé',C:'cé',D:'dé',E:'e',F:'effe',G:'gé',H:'ache',I:'i',J:'ji',K:'ka',L:'elle',M:'emme',N:'enne',O:'o',P:'pé',Q:'ku',R:'erre',S:'esse',T:'té',U:'u',V:'vé',W:'double vé',X:'ix',Y:'i grec',Z:'zède'};
function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}function save(){localStorage.setItem(store,JSON.stringify(state))}function nav(){document.getElementById('nav').innerHTML=S.map(x=>`<a class="${x[0]===sec?'on':''}" href="?id=grade7-u1-l1&section=${x[0]}">${x[1]}</a>`).join('')}
function shuffled(a){return [...a].sort(()=>Math.random()-.5)}
function qbox(arr,key){return arr.map((q,i)=>{const opts=shuffled(q[1]);return `<article class="card"><b>${i+1}. ${q[0]}</b><div class="options">${opts.map(o=>`<button onclick='answer(${JSON.stringify(key+i)},${JSON.stringify(o)},${JSON.stringify(q[2])},this)'>${o}</button>`).join('')}</div><div class="feedback" id="f-${key+i}"></div></article>`}).join('')}
function answer(k,v,c,b){const f=document.getElementById('f-'+k);if(v===c){f.innerHTML='<span class="ok">✅ صحيح — أحسنت!</span>';state.done[k]=1;b.disabled=true}else{f.innerHTML='<span class="bad">❌ ليست الإجابة الصحيحة.</span><br>الإجابة الصحيحة: <b>'+c+'</b>';state.wrong=[...new Set([...state.wrong,k])]}save()}
function pronunciation(){return `<h2>🎧 النطق</h2><p>كل حرف له <b>زر مستقل لنطق الحرف</b> وزر آخر لنطق المثال، مع صورة تساعدك على ربط الكلمة بالمعنى.</p><h3>الأبجدية الفرنسية — A à Z</h3><div class="letter-strip">${letters.map(x=>`<article class="card letter-card"><div class="letter-top"><span class="letter">${x[0]}</span><span class="letter-example fr">${x[1]}</span></div><div class="example-img" role="img" aria-label="${x[2]}">${x[3]}</div><div class="letter-ar">${x[2]}</div><div class="pronounce-row"><button onclick='speak(${JSON.stringify(letterName[x[0]])})'>🔊 الحرف</button><button onclick='speak(${JSON.stringify(x[1])})'>🔊 المثال</button></div></article>`).join('')}</div><h3>المقاطع الصوتية</h3><p>نفس الطريقة: المقطع، مثال واضح، صورة للمعنى، وزرا نطق.</p><div class="pattern-strip">${patterns.map(x=>`<article class="card pattern-card"><div class="pattern-mark">${x[0]}</div><div class="example-img" role="img" aria-label="${x[2]}">${x[3]}</div><div class="letter-example fr">${x[1]}</div><div class="letter-ar">${x[2]}</div><div class="pronounce-row"><button onclick='speak(${JSON.stringify(x[0])})'>🔊 المقطع</button><button onclick='speak(${JSON.stringify(x[1])})'>🔊 المثال</button></div></article>`).join('')}</div>`}
function render(){nav();let h='';if(sec==='introduction')h=`<h2>🚀 البداية</h2><p>في هذا الدرس ستتعرف إلى الأبجدية الفرنسية، الحروف المتحركة، المقاطع الصوتية والكلمات الشفافة.</p><div class="grid">${['26 حرفًا من A إلى Z','الحروف المتحركة A · E · I · O · U مع Y وH ضمن أمثلة المصدر','10 مجموعات صوتية أساسية','25 كلمة شفافة من المصدر','6 أسئلة تدريبية','4 أنشطة تفاعلية','6 أسئلة مراجعة ذكية','تقييم إلكتروني من 20 سؤالًا'].map((x,i)=>`<article class="card"><b>${i+1}. ${x}</b></article>`).join('')}</div><div class="note gold">ابدأ بالنطق، ثم المفردات، ثم التدريب والمراجعة والتقييم.</div>`;else if(sec==='vocabulary')h=`<h2>🖼️ المفردات</h2><p>بطاقات بصرية تساعدك على فهم الكلمة وتذكرها والاستماع إلى نطقها.</p><div class="grid">${vocab.map(x=>`<article class="card"><div class="visual">${x[2]}</div><div class="fr">${x[0]}</div><div class="ar">${x[1]}</div><button onclick='speak(${JSON.stringify(x[0])})'>🔊 استمع للنطق</button></article>`).join('')}</div>`;else if(sec==='pronunciation')h=pronunciation();else if(sec==='grammar')h=`<h2>📘 القواعد</h2><div class="grid"><article class="card"><h3>الأبجدية</h3><p>الفرنسية تستخدم 26 حرفًا من A إلى Z.</p></article><article class="card"><h3>الحروف المتحركة</h3><p><b>A · E · I · O · U</b> هي الحروف المتحركة الأساسية.</p></article><article class="card"><h3>الكلمات الشفافة</h3><p>كلمات تشبه معناها أو شكلها في العربية أو لغات أخرى، مثل <b dir="ltr">taxi · téléphone · cinéma · guitare</b>.</p></article><article class="card"><h3>الحرف والمقطع</h3><p>قد تمثل مجموعة حروف صوتًا واحدًا، لذلك نتدرب على <b dir="ltr">ph · oi · ou · ch · eau</b>.</p></article></div>`;else if(sec==='conversation')h=`<h2>💬 المحادثة</h2><div class="note enriched">تطبيقات قصيرة باستخدام كلمات الدرس فقط.</div><div class="grid">${[['Bonjour !','Bonjour !'],['Comment tu t’appelles ?','Je m’appelle Adam.'],['C’est quoi ?','C’est un téléphone.'],['Quelle lettre ?','C’est la lettre A.']].map((x,i)=>`<article class="card"><b>موقف ${i+1}</b><p class="fr">${x[0]}</p><p class="fr">${x[1]}</p><button onclick='speak(${JSON.stringify(x[0]+' '+x[1])})'>🔊 استمع</button></article>`).join('')}</div>`;else if(sec==='practice')h=`<h2>✍️ التدريب</h2><div class="note gold"><b>6 أسئلة</b> — أجب، ثم راجع الإجابة فورًا.</div>${qbox(practice,'p')}`;else if(sec==='video')h=`<h2>🎬 الفيديو التكميلي</h2><div class="video-box"><p>الفيديو الأصلي للدرس.</p><div style="position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:12px;background:#020617"><iframe src="https://www.youtube-nocookie.com/embed/akKplmnr01M?rel=0" title="Vidéo complémentaire" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe></div><a class="video-fallback" href="https://www.youtube.com/watch?v=akKplmnr01M" target="_blank" rel="noopener">↗️ مشاهدة الفيديو مباشرة على YouTube</a></div>`;else if(sec==='games')h=`<h2>🎮 الألعاب</h2><div class="grid"><article class="card"><h3>🎧 اسمع واختر</h3><p>استمع إلى كلمة <b dir="ltr">photo</b>.</p><button onclick="speak('photo')">🔊 استمع</button><div class="options"><button onclick="game(this,'ph','g1')">ph</button><button onclick="game(this,'oi','g1')">oi</button><button onclick="game(this,'ou','g1')">ou</button></div><div id="g1" class="feedback"></div></article><article class="card"><h3>🔤 فرز الحرف</h3><p class="gameWord">A</p><div class="options"><button onclick="setF('g2',true)">متحرك</button><button onclick="setF('g2',false)">ساكن</button></div><div id="g2" class="feedback"></div></article><article class="card"><h3>🃏 كلمة ومعنى</h3><p class="fr">Un téléphone</p><div class="options"><button onclick="setF('g3',true)">تليفون</button><button onclick="setF('g3',false)">جيتار</button></div><div id="g3" class="feedback"></div></article><article class="card"><h3>🎯 صيد المقطع</h3><p class="fr">rouge</p><div class="options"><button onclick="setF('g4',false)">ph</button><button onclick="setF('g4',true)">ou</button><button onclick="setF('g4',false)">oi</button></div><div id="g4" class="feedback"></div></article></div>`;else if(sec==='smart-review')h=`<h2>🧠 المراجعة الذكية</h2><div class="note enriched">الأسئلة تتغير ترتيب خياراتها في كل مرة، وتستند إلى مهارات الدرس نفسه.</div>${qbox(shuffled(review),'r')}`;else if(sec==='assessment')h=`<h2>🏆 التقييم</h2><div class="note gold"><b>20 سؤالًا</b> لقياس فهمك للدرس. ترتيب الاختيارات متغير، فلا يوجد نمط ثابت للإجابة الصحيحة.</div><div id="assessment">${qbox(assess,'a')}</div><button onclick="finishAssessment()">📊 احسب النتيجة</button><div id="result" class="feedback"></div>`;else{let done=Object.keys(state.done).length,pct=Math.min(100,Math.round(done/32*100));h=`<h2>📈 التقدم</h2><div class="card"><div class="score">${pct}%</div><div class="progress"><i style="width:${pct}%"></i></div><p>تم تسجيل ${done} إجابة صحيحة في أنشطة الدرس.</p></div>`}document.getElementById('app').innerHTML=h;if(sec==='video'){const v=document.querySelector('video');if(v)v.addEventListener('error',()=>{document.getElementById('videoMissing').style.display='block'})}}
function game(b,c,id){document.getElementById(id).innerHTML=b.textContent===c?'<span class="ok">✅ ممتاز</span>':'<span class="bad">❌ حاول مرة أخرى</span>'}function setF(id,v){document.getElementById(id).innerHTML=v?'<span class="ok">✅ صحيح</span>':'<span class="bad">❌ حاول مرة أخرى</span>'}function finishAssessment(){const n=Object.keys(state.done).filter(x=>x.startsWith('a')).length;document.getElementById('result').innerHTML='<span class="score">نتيجتك الحالية: '+n+' / 20</span>';state.score=n;save()}render();</script></body></html>
