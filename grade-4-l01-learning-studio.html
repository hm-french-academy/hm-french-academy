<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><title>HM Academy · 4ème · Les 4 saisons · Premium Lesson Book Studio</title><style>body{margin:0;padding:12px 14px 50px;font-family:Arial,Cairo,sans-serif;color:#2e2a25;background:#f3f8fb}.wrap{max-width:1060px;margin:auto}.top{position:sticky;top:0;z-index:50;background:#ffffffee;border-radius:0 0 20px 20px;padding:10px 14px;display:flex;justify-content:space-between}.top a{color:#2e2a25;text-decoration:none;font-weight:900}.hero{margin-top:12px;background:linear-gradient(120deg,#c9f1ff,#ffe1ee 55%,#fff0b4);border-radius:30px;padding:28px 24px}.hero h1{font-size:clamp(30px,6vw,50px);margin:8px 0}.eyebrow,.tag{display:inline-block;background:#c96a2e;color:#fff;padding:6px 12px;border-radius:999px;font-weight:900}.journey{position:sticky;top:53px;z-index:45;background:#fffffff2;display:flex;gap:7px;overflow:auto;padding:11px 3px}.step{border:0;background:#f1f5f8;border-radius:999px;padding:9px 13px;font-weight:900;white-space:nowrap;cursor:pointer}.step.active{background:#2e2a25;color:#fff}.step i{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#dfe8ef;font-style:normal;margin-left:4px}.page{margin-top:12px;background:#fff;border-radius:27px;padding:22px;min-height:610px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{background:#fff;border:2px solid #edf1f4;border-radius:21px;padding:17px}.muted{color:#5b5750;font-weight:800}.fr{direction:ltr;text-align:left;font-size:20px;font-weight:900}.btn{display:inline-block;border:0;border-radius:14px;padding:11px 15px;background:#2e2a25;color:#fff;text-decoration:none;font-weight:900;margin:4px;cursor:pointer}.btn.light{background:#edf4f8;color:#2e2a25}.seasonGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.season{border:0;border-radius:22px;padding:13px;cursor:pointer;text-align:center;min-height:235px}.spring{background:#e4f3e1}.summer{background:#fcefd6}.autumn{background:#f7e4d5}.winter{background:#deebf5}.season.selected{outline:3px solid #2e2a25}.art{height:115px;border-radius:17px;background:#ffffffaa;display:grid;place-items:center;font-size:58px}.season b{display:block;font-size:19px;margin-top:7px}.detail,.rule,.after{margin-top:15px;padding:18px;border-radius:21px;background:#f8fbfd;border:1px solid #e5edf3}.months{display:flex;flex-wrap:wrap;gap:7px}.month{background:#fff;border-radius:999px;padding:6px 11px;font-weight:900}.phrase{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;border:1px solid #edf1f4;margin:7px 0}.phraseText{direction:ltr;text-align:left;font-weight:900}.speak{border:0;background:#2e2a25;color:#fff;width:35px;height:35px;border-radius:50%;cursor:pointer;display:inline-grid;place-items:center}.choice{border:2px solid #e5edf3;background:#fff;border-radius:13px;padding:10px 14px;margin:4px;cursor:pointer;font-weight:900}.choice.correct{border-color:#5ea85b;background:#e4f3e1}.choice.wrong{border-color:#c9503b;background:#fbe0dc}.feedback{font-weight:900;min-height:25px}.video{position:relative;width:100%;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:#111}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.videoCover{position:absolute;inset:0;background:linear-gradient(135deg,#8ed7f5,#ffe0a5);display:grid;place-items:center;cursor:pointer}.play{width:76px;height:76px;border-radius:50%;background:#c96a2e;color:#fff;display:grid;place-items:center;font-size:30px}.gameTabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.gameTab{border:2px solid #e5edf3;background:#fff;border-radius:999px;padding:10px 14px;font-weight:900;cursor:pointer}.gameTab.active{background:#2e2a25;color:#fff}.gamePanel{background:#f8fbfd;border:1px solid #e5edf3;border-radius:22px;padding:18px}.gameScore{text-align:center;font-size:22px;font-weight:900}.gamePrompt{text-align:center;font-size:24px;font-weight:900;margin:16px}.memoryGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.memoryCard{border:2px solid #e5edf3;border-radius:16px;background:#fff;min-height:80px;font-weight:900;cursor:pointer}.memoryCard.open{background:#eef7f3;border-color:#5ea85b}.orderList{display:grid;gap:9px;max-width:620px;margin:12px auto}.orderItem{background:#fff;border:2px solid #e5edf3;border-radius:15px;padding:13px;font-weight:900;cursor:grab;text-align:center}.assessmentBox{background:linear-gradient(135deg,#eef8ff,#fff5e6);border:2px solid #e2ebf3;border-radius:23px;padding:20px;text-align:center}.sourceNote{font-size:12px;color:#6b7280;font-weight:800}@media(max-width:760px){.seasonGrid{grid-template-columns:1fr 1fr}.memoryGrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:500px){.seasonGrid{grid-template-columns:1fr}.page{padding:15px}.memoryGrid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><header class="top"><a href="grade-4.html">← الصف الرابع</a><a href="index.html">HM Academy</a></header><section class="hero"><span class="eyebrow">Le français pour vous · 4e année · Unité 1</span><h1>🍂 Les 4 saisons</h1><p>Premium Lesson Book Studio · الدرس الأول فقط</p></section><nav class="journey" id="journey"></nav><main id="page" class="page"></main></div><script>const SRC='data/lessons/grade-4/source/4eme_Complet/01_Les_saisons/';const EXAM='grade-4-l01-official-exam.html';const steps=[['start','🚀','البداية'],['vocab','🖼️','المفردات'],['understand','🧠','افهم'],['interact','🤝','تفاعل'],['listen','🎧','اسمع وتحدث'],['practice','✍️','التدريب'],['media','🎬','الوسائط'],['games','🎮','الألعاب'],['assessment','🏆','التقييم'],['after','📚','بعد الرحلة']];const seasons=[{k:'spring',fr:'Le printemps',ar:'الربيع',pic:'🌷🌱',months:['Mars','Avril','Mai'],main:'Il fait beau.',all:['Il fait beau.','Le ciel est bleu.','Les feuilles sont vertes.','Il y a des fleurs.']},{k:'summer',fr:"L'été",ar:'الصيف',pic:'☀️🏖️',months:['Juin','Juillet','Août'],main:'Il fait chaud.',all:['Il fait chaud.','Le ciel est bleu.','Le soleil brille.','Les arbres ont des fruits.']},{k:'autumn',fr:"L'automne",ar:'الخريف',pic:'🍂🌰',months:['Septembre','Octobre','Novembre'],main:'Il fait mauvais.',all:['Il fait mauvais.','Le ciel est gris.','Les feuilles sont jaunes.',"Les feuilles d'arbres tombent."]},{k:'winter',fr:"L'hiver",ar:'الشتاء',pic:'❄️⛄',months:['Décembre','Janvier','Février'],main:'Il fait froid.',all:['Il fait froid.','Il pleut.','Les vents soufflent.','La neige tombe.']}];const nav=document.getElementById('journey');nav.innerHTML=steps.map((s,i)=>`<button class="step" data-step="${s[0]}"><i>${s[1]}</i>${i+1}. ${s[2]}</button>`).join('');nav.onclick=e=>{const b=e.target.closest('[data-step]');if(b)render(b.dataset.step)};function speak(t,b){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;u.onend=()=>b&&b.classList.remove('playing');if(b)b.classList.add('playing');speechSynthesis.speak(u)}function sp(t){return `<button class="speak" data-say=${JSON.stringify(t)}>🔊</button>`}document.addEventListener('click',e=>{const b=e.target.closest('.speak');if(b)speak(b.dataset.say,b)});function cards(){return `<div class="seasonGrid">${seasons.map((s,i)=>`<button class="season ${s.k}" data-season="${i}"><div class="art">${s.pic}</div><b>${s.fr}</b><span class="muted">${s.ar}</span><br><small>${s.months.join(' · ')}</small></button>`).join('')}</div><div id="detail" class="detail">اضغط على فصل لعرض الجملة الرئيسية والنطق.</div>`}function bind(){document.querySelectorAll('[data-season]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-season]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');const s=seasons[+b.dataset.season];document.getElementById('detail').innerHTML=`<div class="cards"><div><div style="font-size:70px;text-align:center">${s.pic}</div><p class="fr">${s.fr} ${sp(s.fr)}</p><p class="muted">${s.ar}</p></div><div><div class="months">${s.months.map(m=>`<span class="month">${m}</span>`).join('')}</div><div class="phrase"><span class="phraseText">${s.main}</span>${sp(s.main)}</div></div></div>`})}function answer(btn){const g=btn.parentElement;g.querySelectorAll('.choice').forEach(x=>x.classList.remove('correct','wrong'));const ok=btn.dataset.val===btn.dataset.correct;btn.classList.add(ok?'correct':'wrong');const f=g.parentElement.querySelector('.feedback')||g.nextElementSibling;if(f)f.textContent=ok?'✅ إجابة صحيحة!':'❌ ليست الإجابة الصحيحة، حاول مرة أخرى.'}function interact(){const qs=[['🕵️ محقق الشهور','Nous sommes en Juillet. Quelle saison ?',['Le printemps','L’été','L’automne','L’hiver'],'L’été'],['🌨️ موقف الطقس','Il fait froid et la neige tombe. Quelle saison ?',['Le printemps','L’été','L’automne','L’hiver'],'L’hiver'],['🍂 دليل الفصل','Les feuilles sont jaunes et tombent. Quelle saison ?',['Le printemps','L’été','L’automne','L’hiver'],'L’automne'],['🌷 أكمل المعنى','Il y a des fleurs. Nous sommes…',['au printemps','en été','en automne','en hiver'],'au printemps']];return `<span class="tag">04 · تفاعل</span><h2>🤝 تفاعل ذكي — أربع مهام مختلفة</h2><p class="muted">لا توجد إجابة وهمية مثل «فصل آخر». كل مهمة تقيس مهارة مختلفة.</p><div class="cards">${qs.map(x=>`<article class="card"><h3>${x[0]}</h3><p class="fr">${x[1]}</p><div>${x[2].map(o=>`<button class="choice" data-val="${o}" data-correct="${x[3]}" onclick="answer(this)">${o}</button>`).join('')}</div><p class="feedback"></p></article>`).join('')}</div>`}let game={tab:'race',score:0,round:0,memory:[],open:[],matched:[],order:[]};const prompts=[['Quel mois appartient à l’été ?',['Juillet','Janvier','Mars','Octobre'],'Juillet'],['En hiver, il fait…',['froid','chaud','beau','mauvais'],'froid'],['Quelle saison vient après le printemps ?',['L’été','L’hiver','L’automne','Le printemps'],'L’été'],['On dit…',['en été','au été','en printemps','au automne'],'en été'],['Quel mois appartient à l’automne ?',['Octobre','Juin','Février','Avril'],'Octobre'],['La neige tombe en…',['hiver','été','printemps','automne'],'hiver'],['On dit…',['au printemps','en printemps','au été','en printemps'],'au printemps'],['Quel mois appartient au printemps ?',['Avril','Août','Décembre','Novembre'],'Avril']];function games(){return `<span class="tag">08 · الألعاب</span><h2>🎮 مركز الألعاب — 4 ألعاب مختلفة</h2><p class="muted">كل لعبة لها فكرة وقاعدة وهدف مختلف.</p><div class="gameTabs">${[['race','🏁 سباق الفصول'],['memory','🧠 ذاكرة الشهور'],['clues','🔎 من أنا؟'],['order','🔢 رتّب الفصول']].map(x=>`<button class="gameTab ${game.tab===x[0]?'active':''}" onclick="setGame('${x[0]}')">${x[1]}</button>`).join('')}</div><div class="gamePanel" id="gamePanel"></div>`}function setGame(t){game={tab:t,score:0,round:0,memory:[],open:[],matched:[],order:[]};renderGame()}function renderGame(){const p=document.getElementById('gamePanel');if(!p)return;if(game.tab==='race'){const x=prompts[game.round%prompts.length];p.innerHTML=`<div class="gameScore">النقاط: ${game.score} / ${game.round}</div><div class="gamePrompt fr">${x[0]}</div><div class="cards">${x[1].map(o=>`<button class="choice" onclick="race('${o}','${x[2]}')">${o}</button>`).join('')}</div><p class="feedback" id="gf"></p>`}else if(game.tab==='memory'){if(!game.memory.length){const a=seasons.flatMap(s=>s.months.map(m=>({m,s:s.fr}))).slice(0,8);game.memory=[...a.map(x=>({t:x.m,p:x.s,k:'m'+x.m})),...a.map(x=>({t:x.s,p:x.s,k:'s'+x.m}))].sort(()=>Math.random()-.5)}p.innerHTML=`<div class="gameScore">مطابقات صحيحة: ${game.matched.length/2} / 8</div><div class="memoryGrid">${game.memory.map((c,i)=>`<button class="memoryCard ${game.open.includes(i)||game.matched.includes(i)?'open':''}" onclick="mem(${i})">${game.open.includes(i)||game.matched.includes(i)?c.t:'❓'}</button>`).join('')}</div><p class="feedback">افتح بطاقتين وابحث عن الشهر والفصل المرتبط به.</p>`}else if(game.tab==='clues'){const c=[['Je suis en juin, juillet et août. Qui suis-je ?','L’été'],['Je suis en septembre, octobre et novembre. Qui suis-je ?','L’automne'],['Je suis en décembre, janvier et février. Qui suis-je ?','L’hiver'],['Je suis en mars, avril et mai. Qui suis-je ?','Le printemps']][game.round%4];p.innerHTML=`<div class="gameScore">النقاط: ${game.score} / ${game.round}</div><div class="gamePrompt fr">${c[0]}</div><div class="cards">${seasons.map(s=>`<button class="choice" onclick="clue('${s.fr}','${c[1]}')">${s.pic} ${s.ar}</button>`).join('')}</div><p class="feedback" id="gf"></p>`}else{if(!game.order.length)game.order=seasons.map(s=>s.k).sort(()=>Math.random()-.5);p.innerHTML=`<div class="gameScore">اسحب البطاقات ورتب الفصول من بداية السنة إلى نهايتها.</div><div class="orderList" id="ol">${game.order.map(k=>{const s=seasons.find(x=>x.k===k);return `<button class="orderItem" draggable="true" data-k="${k}">${s.pic} ${s.fr}</button>`}).join('')}</div><button class="btn" onclick="checkOrder()">تحقق من الترتيب</button><p class="feedback" id="gf"></p>`;document.querySelectorAll('.orderItem').forEach(el=>{el.ondragstart=e=>e.dataTransfer.setData('text',el.dataset.k);el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();const k=e.dataTransfer.getData('text'),from=[...document.querySelectorAll('.orderItem')].find(x=>x.dataset.k===k);el.parentNode.insertBefore(from,el);game.order=[...document.querySelectorAll('.orderItem')].map(x=>x.dataset.k)}})}}function race(v,a){if(v===a)game.score++;game.round++;renderGame()}function clue(v,a){if(v===a)game.score++;game.round++;renderGame()}function mem(i){if(game.open.includes(i)||game.open.length===2||game.matched.includes(i))return;game.open.push(i);renderGame();if(game.open.length===2){const a=game.memory[game.open[0]],b=game.memory[game.open[1]];setTimeout(()=>{if(a.p===b.p&&a.k[0]!==b.k[0])game.matched.push(game.open[0],game.open[1]);game.open=[];renderGame()},600)}}function checkOrder(){document.getElementById('gf').textContent=JSON.stringify(game.order)===JSON.stringify(['spring','summer','autumn','winter'])?'🏆 ترتيب صحيح!':'❌ ليس هذا الترتيب، حاول مرة أخرى.'}function playVideo(){document.getElementById('video').innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/TKpQVLU81DA?autoplay=1&rel=0" title="Les saisons" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>'}function render(k){document.querySelectorAll('.step').forEach(b=>b.classList.toggle('active',b.dataset.step===k));const p=document.getElementById('page');if(k==='start')p.innerHTML=`<span class="tag">01 · البداية</span><h2>Bienvenue dans Les 4 saisons 🌍</h2><div class="cards"><article class="card"><h3>🎯 الهدف</h3><p>التعرف على الفصول الأربعة وأشهرها ومظاهر الطقس واستعمال au / en.</p></article><article class="card"><h3>🧭 خريطة الرحلة</h3><p>اكتشف → افهم → تفاعل → اسمع وتحدث → تدرب → شاهد → العب → قيّم → راجع.</p></article><article class="card"><h3>📚 المصدر</h3><p>تمت مراجعة الملف الأصلي ومصادر الدرس مع عزل Studio الدرس الأول عن باقي الصفوف.</p><a class="btn light" target="_blank" href="${SRC}01_interactif_les_saisons.html">فتح المصدر الأصلي</a></article></div>`;else if(k==='vocab')p.innerHTML=`<span class="tag">02 · المفردات</span><h2>🖼️ الفصل + الصورة + جملة Il fait…</h2><p class="muted">لكل فصل جملة رئيسية واحدة هنا فقط؛ الجمل الأربع الكاملة تنتقل إلى صفحة «افهم».</p>${cards()}`;else if(k==='understand')p.innerHTML=`<span class="tag">03 · افهم</span><h2>🧠 أربع جمل لكل فصل</h2><div class="cards">${seasons.map(s=>`<article class="card"><div style="font-size:52px">${s.pic}</div><h3>${s.fr} · ${s.ar}</h3><div class="months">${s.months.map(m=>`<span class="month">${m}</span>`).join('')}</div>${s.all.map(t=>`<div class="phrase"><span class="phraseText">${t}</span>${sp(t)}</div>`).join('')}</article>`).join('')}</div>`;else if(k==='interact')p.innerHTML=interact();else if(k==='listen')p.innerHTML=`<span class="tag">05 · اسمع وتحدث</span><h2>🎧 استماع وتحدث — اسم ثم جملة</h2><div class="cards">${seasons.map(s=>`<article class="card"><h3 class="fr">${s.fr} ${sp(s.fr)}</h3><p class="muted">استمع، كرر، ثم قل:</p><div class="phrase"><span class="phraseText">${s.main}</span>${sp(s.main)}</div></article>`).join('')}</div>`;else if(k==='practice')p.innerHTML=`<span class="tag">06 · التدريب</span><h2>✍️ تدريب الاختيار والتطبيق</h2><div class="cards"><article class="card"><h3>au / en</h3>${[['printemps','au'],['été','en'],['automne','en'],['hiver','en']].map(q=>`<div><p class="fr">___ ${q[0]}</p><button class="choice" data-val="au" data-correct="${q[1]}" onclick="answer(this)">au</button><button class="choice" data-val="en" data-correct="${q[1]}" onclick="answer(this)">en</button><p class="feedback"></p></div>`).join('')}</article><article class="card"><h3>اختَر الفصل من الجملة</h3>${[['Il fait froid.','winter'],['Il y a des fleurs.','spring'],['Le soleil brille.','summer'],['Les feuilles sont jaunes.','autumn']].map(q=>`<div><p class="fr">${q[0]}</p>${seasons.map(s=>`<button class="choice" data-val="${s.k}" data-correct="${q[1]}" onclick="answer(this)">${s.pic} ${s.ar}</button>`).join('')}<p class="feedback"></p></div>`).join('')}</article></div>`;else if(k==='media')p.innerHTML=`<span class="tag">07 · الوسائط</span><h2>🎬 فيديو الدرس</h2><p class="muted">فيديو الوسائط المرتبط بدرس Les saisons.</p><div class="video" id="video"><div class="videoCover" onclick="playVideo()"><div class="play">▶</div></div></div><p class="sourceNote">Les saisons — Chanson pour enfants (Les Titounis)</p><a class="btn light" target="_blank" href="https://www.youtube.com/watch?v=TKpQVLU81DA">فتح الفيديو مباشرة</a>`;else if(k==='games'){p.innerHTML=games();renderGame()}else if(k==='assessment')p.innerHTML=`<span class="tag">09 · التقييم</span><div class="assessmentBox"><h2>🏆 التقييم الرسمي — <span class="fr">Les 4 saisons</span></h2><p>واجهة مستقلة ومنظمة داخل مسار الدرس. محتوى الأسئلة مأخوذ من ملف الاختبار الإلكتروني الأصلي دون اختراع أسئلة جديدة.</p><a class="btn" href="${EXAM}">ابدأ التقييم الرسمي →</a><p class="sourceNote">المصدر المعتمد للأسئلة: 04_examen_electronique_les_saisons.html</p><a class="btn light" target="_blank" href="${SRC}04_examen_electronique_les_saisons.html">فتح المصدر الأصلي فقط</a></div>`;else p.innerHTML=`<span class="tag">10 · بعد الرحلة</span><h2>📚 بعد الرحلة — Premium Review Card</h2><div class="after"><div class="cards">${seasons.map(s=>`<article class="card"><div style="font-size:44px">${s.pic}</div><h3>${s.fr}</h3><p class="muted">${s.months.join(' · ')}</p><p class="fr">${s.main}</p>${sp(s.main)}</article>`).join('')}</div><div class="rule"><h3>📘 القاعدة</h3><p class="fr">au printemps · en été · en automne · en hiver</p><p>au مع printemps، وen مع été وautomne وhiver.</p></div><p class="sourceNote">المرجع الأصلي محفوظ كما هو، وهذه الصفحة مخصصة للمراجعة السريعة.</p><a class="btn light" target="_blank" href="${SRC}02_reference_les_saisons.docx">فتح المرجع الأصلي</a></div>`;if(k==='vocab')bind()}render('start');</script></body></html>
