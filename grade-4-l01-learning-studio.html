<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy · الصف الرابع · Les 4 saisons</title><style>body{margin:0;background:#f3f8fb;color:#292725;font-family:Arial,Cairo,sans-serif}.wrap{max-width:1100px;margin:auto;padding:14px}.top{position:sticky;top:0;z-index:5;background:#fffffff2;padding:12px 16px;border-radius:0 0 18px 18px;display:flex;justify-content:space-between;font-weight:900}.top a{color:inherit;text-decoration:none}.hero{margin-top:12px;padding:28px 22px;border-radius:28px;background:linear-gradient(120deg,#dff5ff,#fff1d6 55%,#e9f6e5)}h1{font-size:clamp(30px,6vw,52px);margin:8px 0}.tag{display:inline-block;background:#c96a2e;color:#fff;padding:6px 12px;border-radius:999px;font-weight:900}.journey{position:sticky;top:53px;z-index:4;background:#fffffff2;padding:10px 2px;display:flex;gap:7px;overflow:auto}.step{border:0;background:#edf2f5;border-radius:999px;padding:10px 14px;font-weight:900;white-space:nowrap;cursor:pointer}.step.active{background:#292725;color:#fff}.page{background:#fff;border-radius:26px;padding:22px;margin-top:12px;min-height:620px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{border:2px solid #edf1f4;border-radius:20px;padding:17px;background:#fff}.muted{color:#5b5750;font-weight:800}.fr{direction:ltr;text-align:left;font-weight:900}.seasonGrid,.year{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.season{border:0;border-radius:22px;padding:12px;cursor:pointer;font:inherit;min-height:240px}.spring{background:#e4f3e1}.summer{background:#fcefd6}.autumn{background:#f7e4d5}.winter{background:#deebf5}.season.selected{outline:3px solid #292725}.season img,.word img{width:100%;height:135px;object-fit:cover;border-radius:16px}.season b{display:block;font-size:19px;margin-top:8px}.detail,.rule{margin-top:16px;padding:18px;border-radius:20px;background:#f8fbfd;border:1px solid #e5edf3}.months{display:flex;flex-wrap:wrap;gap:7px}.month{background:#fff;border-radius:999px;padding:7px 11px;font-weight:900}.phrase{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid #edf1f4;border-radius:14px;padding:10px;margin:7px 0}.speak{border:0;background:#292725;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer}.vocabGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.word{display:flex;flex-direction:column;gap:9px}.word .term{font-size:21px;font-weight:900;display:flex;align-items:center;justify-content:space-between;direction:ltr}.word .example{background:#f8fbfd;border-radius:14px;padding:10px;direction:ltr;text-align:left;font-weight:900}.note{font-size:13px;color:#6b7280;font-weight:800}.year .seasonYear{border-radius:20px;padding:16px}.springY{background:#e4f3e1}.summerY{background:#fcefd6}.autumnY{background:#f7e4d5}.winterY{background:#deebf5}.yearMonth{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:12px;padding:8px 10px;margin:6px 0;font-weight:900}.choice{border:2px solid #e5edf3;background:#fff;border-radius:13px;padding:10px 14px;margin:4px;cursor:pointer;font-weight:900}.choice.correct{border-color:#5ea85b;background:#e4f3e1}.choice.wrong{border-color:#c9503b;background:#fbe0dc}.feedback{font-weight:900;min-height:24px}.btn{border:0;border-radius:13px;padding:11px 15px;background:#292725;color:#fff;font-weight:900;cursor:pointer}.source{font-size:12px;color:#6b7280;font-weight:800}@media(max-width:760px){.seasonGrid,.year{grid-template-columns:1fr 1fr}}@media(max-width:500px){.seasonGrid,.year{grid-template-columns:1fr}.page{padding:15px}}</style><link rel="stylesheet" href="css/hm-academy-grade-themes.css?v=20260909-grade-themes-v2"></head><body data-hm-grade-theme="primary-4"><div class="wrap"><header class="top"><a href="grade-4.html">← الصف الرابع</a><a href="index.html">HM Academy</a></header><section class="hero"><span class="tag">Le français pour vous · 4e année · Unité 1</span><h1>🍂 Les 4 saisons</h1><p>الدرس الأول · g4-l01 · Learning Studio</p></section><nav class="journey" id="nav"></nav><main class="page" id="page"></main></div><script>const seasons=[{k:'spring',fr:'Le printemps',ar:'الربيع',img:'https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=900&q=80',months:['Mars','Avril','Mai'],sentences:['Il fait beau.','Le ciel est bleu.','Les feuilles sont vertes.','Il y a des fleurs.']},{k:'summer',fr:"L'été",ar:'الصيف',img:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80',months:['Juin','Juillet','Août'],sentences:['Il fait chaud.','Le ciel est bleu.','Le soleil brille.','Les arbres ont des fruits.']},{k:'autumn',fr:"L'automne",ar:'الخريف',img:'https://images.unsplash.com/photo-1507371341162-763b5e419408?auto=format&fit=crop&w=900&q=80',months:['Septembre','Octobre','Novembre'],sentences:['Il fait mauvais.','Le ciel est gris.','Les feuilles sont jaunes.',"Les feuilles d'arbres tombent."]},{k:'winter',fr:"L'hiver",ar:'الشتاء',img:'https://images.unsplash.com/photo-1483664852095-d6cc6870702d?auto=format&fit=crop&w=900&q=80',months:['Décembre','Janvier','Février'],sentences:['Il fait froid.','Il pleut.','Les vents soufflent.','La neige tombe.']}];const steps=[['discover','🚀','اكتشف'],['vocab','🖼️','تعلم · المفردات'],['pronounce','🎧','انطق'],['understand','📘','افهم'],['year','🗓️','Une année'],['practice','🤝','تواصل · تدريب']];const nav=document.getElementById('nav');nav.innerHTML=steps.map((s,i)=>`<button class="step" data-step="${s[0]}">${s[1]} ${i+1}. ${s[2]}</button>`).join('');nav.onclick=e=>{const b=e.target.closest('.step');if(b)render(b.dataset.step)};window.speak=function(t){if(!('speechSynthesis'in window)||!window.SpeechSynthesisUtterance)return;const synth=window.speechSynthesis;synth.cancel();const u=new window.SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;synth.speak(u)}function sp(t){return `<button class="speak" onclick="window.speak(${JSON.stringify(t)})">🔊</button>`}const vocab=[['Le printemps','الفصل: الربيع','https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=900&q=80','Le printemps'],['beau','جميل / طقس جميل','https://images.unsplash.com/photo-1499346030926-9a72daac6c63?auto=format&fit=crop&w=900&q=80','Il fait beau.'],['ciel','السماء','https://images.unsplash.com/photo-1534088568595-a066f410bcda?auto=format&fit=crop&w=900&q=80','Le ciel est bleu.'],['bleu','أزرق','https://images.unsplash.com/photo-1499346030926-9a72daac6c63?auto=format&fit=crop&w=900&q=80','Le ciel est bleu.'],['feuilles','الأوراق','https://images.unsplash.com/photo-1507371341162-763b5e419408?auto=format&fit=crop&w=900&q=80','Les feuilles sont vertes. / Les feuilles sont jaunes.'],['vertes','خضراء','https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80','Les feuilles sont vertes.'],['fleurs','الزهور','https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=900&q=80','Il y a des fleurs.'],["L'été",'الفصل: الصيف','https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80',"L'été"],['chaud','حار','https://images.unsplash.com/photo-1500534623283-312aadeb485b7?auto=format&fit=crop&w=900&q=80','Il fait chaud.'],['soleil','الشمس','https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80','Le soleil brille.'],['brille','يشرق / يلمع','https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80','Le soleil brille.'],['arbres','الأشجار','https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80','Les arbres ont des fruits.'],['fruits','الفواكه','https://images.unsplash.com/photo-1610832958506-aa56368176cf?auto=format&fit=crop&w=900&q=80','Les arbres ont des fruits.'],["L'automne",'الفصل: الخريف','https://images.unsplash.com/photo-1507371341162-763b5e419408?auto=format&fit=crop&w=900&q=80',"L'automne"],['mauvais','سيئ','https://images.unsplash.com/photo-1519692933481-e162a57d6721?auto=format&fit=crop&w=900&q=80','Il fait mauvais.'],['gris','رمادي','https://images.unsplash.com/photo-1534274988757-a28bf1a57c17?auto=format&fit=crop&w=900&q=80','Le ciel est gris.'],['jaunes','صفراء','https://images.unsplash.com/photo-1507371341162-763b5e419408?auto=format&fit=crop&w=900&q=80','Les feuilles sont jaunes.'],['tombent','تسقط','https://images.unsplash.com/photo-1507371341162-763b5e419408?auto=format&fit=crop&w=900&q=80',"Les feuilles d'arbres tombent. / La neige tombe."],["L'hiver",'الفصل: الشتاء','https://images.unsplash.com/photo-1483664852095-d6cc6870702d?auto=format&fit=crop&w=900&q=80',"L'hiver"],['froid','بارد','https://images.unsplash.com/photo-1483664852095-d6cc6870702d?auto=format&fit=crop&w=900&q=80','Il fait froid.'],['pleut','تمطر','https://images.unsplash.com/photo-1519692933481-e162a57d6721?auto=format&fit=crop&w=900&q=80','Il pleut.'],['vents','الرياح','https://images.unsplash.com/photo-1482192596544-9eb780fc7f66?auto=format&fit=crop&w=900&q=80','Les vents soufflent.'],['soufflent','تهب / تهب الرياح','https://images.unsplash.com/photo-1482192596544-9eb780fc7f66?auto=format&fit=crop&w=900&q=80','Les vents soufflent.'],['neige','الثلج','https://images.unsplash.com/photo-1483664852095-d6cc6870702d?auto=format&fit=crop&w=900&q=80','La neige tombe.']];const notes={beau:'eau = /o/؛ الحروف الأخيرة لا تُنطق.',ciel:'الصوت النهائي قريب من /j/؛ كلمة قصيرة متصلة.',bleu:'eu صوت فرنسي واحد مع تدوير الشفتين.',feuilles:'feuill يعطي صوت /œj/ تقريبًا؛ s النهائية لا تُنطق.',vertes:'الـs النهائية لا تُنطق.',fleurs:'eu صوت فرنسي واحد؛ s النهائية لا تُنطق.',chaud:'ch = /ʃ/ وau = /o/؛ d النهائية لا تُنطق.',soleil:'-eil يعطي صوتًا قريبًا من /ɛj/.',brille:'ill يعطي صوت /j/ تقريبًا.',arbres:'r فرنسية؛ s النهائية لا تُنطق.',fruits:'ui صوت فرنسي مركب؛ s النهائية لا تُنطق.',mauvais:'s النهائية لا تُنطق.',gris:'g هنا /g/؛ s النهائية لا تُنطق.',jaunes:'j = /ʒ/ وau = /o/.',tombent:'ent في نهاية الفعل لا تُنطق.',froid:'oi = /wa/؛ d النهائية لا تُنطق.',pleut:'eu صوت فرنسي واحد؛ t النهائية لا تُنطق.',vents:'s النهائية لا تُنطق.',soufflent:'ent في نهاية الفعل لا تُنطق.',neige:'g قبل e تعطي /ʒ/.'};function seasonCards(){return `<div class="seasonGrid">${seasons.map((s,i)=>`<button class="season ${s.k}" data-i="${i}"><img src="${s.img}" alt="${s.ar}"><b>${s.fr}</b><span class="muted">${s.ar}</span><div class="months">${s.months.map(m=>`<span class="month">${m}</span>`).join('')}</div></button>`).join('')}</div><div class="detail" id="detail">اختر فصلًا لعرض الجملة الأساسية.</div>`}function bindSeasons(){document.querySelectorAll('.season').forEach(b=>b.onclick=()=>{document.querySelectorAll('.season').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');const s=seasons[+b.dataset.i];document.getElementById('detail').innerHTML=`<div class="cards"><div><h3 class="fr">${s.fr} ${sp(s.fr)}</h3><p>${s.ar}</p></div><div><div class="phrase"><span class="fr">${s.sentences[0]}</span>${sp(s.sentences[0])}</div><div class="months">${s.months.map(m=>`<span class="month">${m} ${sp(m)}</span>`).join('')}</div></div></div>`})}function render(k){document.querySelectorAll('.step').forEach(b=>b.classList.toggle('active',b.dataset.step===k));const p=document.getElementById('page');if(k==='discover')p.innerHTML=`<span class="tag">01 · اكتشف</span><h2>اكتشف الفصول قبل أن تحفظ</h2><p class="muted">ابدأ بالصورة، اسم الفصل، الأشهر، ثم استمع إلى الجملة الأساسية.</p>${seasonCards()}<div class="rule"><h3>ما الذي سنكتشفه؟</h3><p>الفصول الأربعة: <span class="fr">Le printemps · L'été · L'automne · L'hiver</span></p><p>كل فصل مرتبط بثلاثة أشهر وبجمل حقيقية من درس Les saisons.</p></div>`;else if(k==='vocab')p.innerHTML=`<span class="tag">02 · تعلم</span><h2>🖼️ المفردات الأصلية في الدرس</h2><p class="muted">كل كلمة هنا مأخوذة من كلمات الفصول والجمل الموجودة في الدرس، مع صورة تعليمية وجملة أصلية.</p><div class="vocabGrid">${vocab.map(v=>`<article class="card word"><img src="${v[2]}" alt="${v[0]}"><div class="term"><span>${v[0]}</span>${sp(v[0])}</div><div class="muted">${v[1]}</div><div class="example">${v[3]} ${sp(v[3])}</div></article>`).join('')}</div>`;else if(k==='pronounce')p.innerHTML=`<span class="tag">03 · انطق</span><h2>🎧 النطق وملاحظات النطق</h2><p class="muted">نطق الكلمة أولًا، ثم ملاحظة قصيرة تساعدك على النطق الصحيح. الأمثلة لا تتكرر هنا.</p><div class="vocabGrid">${vocab.map(v=>`<article class="card"><div class="term fr">${v[0]} ${sp(v[0])}</div><p class="note">${notes[v[0]]||'استمع إلى الكلمة، ثم كررها ببطء.'}</p></article>`).join('')}</div>`;else if(k==='understand')p.innerHTML=`<span class="tag">04 · افهم</span><h2>📘 افهم كل فصل من خلال جمله الأصلية</h2><div class="cards">${seasons.map(s=>`<article class="card"><img src="${s.img}" style="width:100%;height:150px;object-fit:cover;border-radius:16px"><h3>${s.fr} · ${s.ar}</h3><div class="months">${s.months.map(m=>`<span class="month">${m} ${sp(m)}</span>`).join('')}</div>${s.sentences.map(t=>`<div class="phrase"><span class="fr">${t}</span>${sp(t)}</div>`).join('')}</article>`).join('')}</div>`;else if(k==='year')p.innerHTML=`<span class="tag">05 · Une année</span><h2>🗓️ Une année — السنة كاملة في صورة واحدة</h2><p class="muted">12 شهرًا مرتبطة بالفصول الأربعة، وكل شهر قابل للنطق.</p><div class="year">${seasons.map(s=>`<section class="seasonYear ${s.k}Y"><h3>${s.fr} · ${s.ar}</h3>${s.months.map(m=>`<div class="yearMonth"><span>${m}</span>${sp(m)}</div>`).join('')}</section>`).join('')}</div><div class="rule"><h3>ترتيب السنة</h3><p class="fr">Mars → Avril → Mai → Juin → Juillet → Août → Septembre → Octobre → Novembre → Décembre → Janvier → Février</p></div>`;else p.innerHTML=`<span class="tag">06 · تواصل وتدريب</span><h2>🤝 تواصل · تدريب</h2><div class="cards"><article class="card"><h3>اختَر الفصل</h3>${[['Il fait beau.','spring'],['Le soleil brille.','summer'],['Les feuilles sont jaunes.','autumn'],['La neige tombe.','winter']].map(q=>`<div><p class="fr">${q[0]}</p>${seasons.map(s=>`<button class="choice" data-v="${s.k}" data-c="${q[1]}">${s.ar}</button>`).join('')}<p class="feedback"></p></div>`).join('')}</article><article class="card"><h3>أكمل الاستعمال الصحيح</h3>${[['printemps','au'],['été','en'],['automne','en'],['hiver','en']].map(q=>`<div><p class="fr">___ ${q[0]}</p><button class="choice" data-v="au" data-c="${q[1]}">au</button><button class="choice" data-v="en" data-c="${q[1]}">en</button><p class="feedback"></p></div>`).join('')}</article></div><div class="rule"><h3>أمثلة التدريب الأصلية من الدرس</h3><p class="fr">Au printemps, le ciel est ___</p><p class="fr">En été, le soleil ___</p><p class="fr">Les mois de l'automne: Septembre - Octobre - ___</p><p class="fr">Les mois de l'hiver: Décembre - Janvier - ___</p><p class="fr">Les mois du printemps: Mars - Avril - ___</p><p class="fr">Les mois de l'été: Juin - Juillet - ___</p><p class="fr">On dit « ___ printemps »</p><p class="fr">Nous sommes en Juillet. Quelle saison ?</p></div>`;if(k==='discover')bindSeasons();if(k==='practice')bindChoices()}function bindChoices(){document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const box=b.parentElement;box.querySelectorAll('.choice').forEach(x=>x.classList.remove('correct','wrong'));const ok=b.dataset.v===b.dataset.c;b.classList.add(ok?'correct':'wrong');box.querySelector('.feedback').textContent=ok?'✅ إجابة صحيحة':'❌ حاول مرة أخرى'})}render('discover');</script></body></html>
