<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Les saisons · Learning Studio</title><style>:root{--ink:#17324d;--muted:#64748b;--line:#e5edf5;--paper:#fffdf8;--spring:#4e9b55;--summer:#e9a52b;--autumn:#c96a2e;--winter:#4a7fb0}*{box-sizing:border-box}body{margin:0;font-family:Arial,Cairo,sans-serif;color:var(--ink);background:linear-gradient(135deg,#eaf8ff,#fff3df 55%,#effbea);min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:10px 14px 40px}.top{display:flex;justify-content:space-between;padding:12px 15px;background:#ffffffef;border-radius:0 0 22px 22px;position:sticky;top:0;z-index:10}.top a{color:var(--ink);font-weight:900;text-decoration:none}.hero{margin-top:14px;padding:30px;border-radius:30px;background:linear-gradient(135deg,#b8ebff,#ffe2c0 55%,#e2f6cf);box-shadow:0 16px 45px #17324d18}.hero h1{margin:7px 0;font-size:clamp(28px,6vw,46px)}.hero p{margin:0;font-weight:800}.journey{display:flex;gap:7px;overflow:auto;padding:12px 2px;position:sticky;top:55px;z-index:9;background:#ffffffed}.step{border:0;border-radius:999px;padding:10px 14px;background:#f2f6fa;color:#536078;font-weight:900;white-space:nowrap;cursor:pointer}.step.active{background:var(--ink);color:#fff}.page{margin-top:8px;background:var(--paper);border-radius:28px;padding:22px;min-height:600px;box-shadow:0 18px 55px #17324d18}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{background:#fff;border:2px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 9px 25px #17324d0c;line-height:1.85}.card h3{margin-top:5px}.tag{display:inline-block;padding:6px 11px;border-radius:999px;background:#e7f4ff;color:#1260a8;font-weight:900}.fr{direction:ltr;text-align:left;font-size:22px;font-weight:900}.ar{font-weight:800;color:var(--muted)}.btn{display:inline-block;border:0;border-radius:13px;padding:11px 15px;margin:5px 3px;text-decoration:none;font-weight:900;background:var(--ink);color:#fff;cursor:pointer}.btn.light{background:#eef4f8;color:var(--ink)}.seasons{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.season{border:0;border-radius:24px;padding:15px;cursor:pointer;text-align:center;transition:.25s;min-height:210px;box-shadow:0 10px 25px #17324d14}.season:hover{transform:translateY(-5px) scale(1.02)}.season.active{outline:4px solid #fff;box-shadow:0 0 0 4px var(--ink),0 15px 30px #17324d25}.season .art{height:115px;border-radius:18px;display:grid;place-items:center;font-size:62px;background:#ffffff99}.spring{background:#e4f3e1}.summer{background:#fcefd6}.autumn{background:#f7e4d5}.winter{background:#deebf5}.season b{display:block;font-size:20px;margin-top:8px}.season small{color:#56616d;font-weight:800}.sound{border:0;border-radius:50%;width:38px;height:38px;background:var(--ink);color:#fff;cursor:pointer;font-size:17px}.phrase{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f8fbfd;border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0}.choice{border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px;text-align:center;font-weight:900;cursor:pointer}.choice:hover{border-color:#2563eb}.result{font-weight:900;margin-top:10px}.exam{width:100%;height:760px;border:1px solid var(--line);border-radius:18px}.reference{margin-top:18px;border-top:2px dashed var(--line);padding-top:18px}.months{display:flex;flex-wrap:wrap;gap:8px}.month{padding:7px 11px;background:#f1f6fa;border-radius:999px;font-weight:900}.footer{text-align:center;margin-top:18px}@media(max-width:800px){.seasons{grid-template-columns:1fr 1fr}}@media(max-width:500px){.seasons{grid-template-columns:1fr}.hero{padding:23px 18px}.page{padding:15px}}</style></head><body><div class="wrap"><header class="top"><a href="grade-4.html">← الصف الرابع</a><a href="index.html">HM Academy · الرئيسية</a></header><section class="hero"><div>Le français pour vous · 4e année · PREMIUM</div><h1>🍂 Les saisons</h1><p>فصول السنة · Learning Studio · الدرس الأول فقط · مصدر الصف الرابع الأصلي</p></section><nav id="journey" class="journey"></nav><main id="viewer" class="page"></main><div class="footer"><button class="btn light" onclick="render('reference')">📚 المرجع المحسن</button></div></div><script>const S=[['lesson','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['media','🎬 الوسائط'],['games','🎮 الألعاب'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];const seasons=[{key:'spring',fr:'Le printemps',ar:'الربيع',art:'🌷🌱☀️',months:'mars · avril · mai',phrase:'Au printemps, il fait doux.'},{key:'summer',fr:"L'été",ar:'الصيف',art:'☀️🏖️🍉',months:'juin · juillet · août',phrase:'En été, il fait chaud.'},{key:'autumn',fr:"L'automne",ar:'الخريف',art:'🍂🌰🌦️',months:'septembre · octobre · novembre',phrase:'En automne, il fait frais.'},{key:'winter',fr:"L'hiver",ar:'الشتاء',art:'❄️⛄🧣',months:'décembre · janvier · février',phrase:'En hiver, il fait froid.'}];journey.innerHTML=S.map((x,i)=>`<button class="step" data-s="${x[0]}">${i+1}. ${x[1]}</button>`).join('');journey.onclick=e=>{const b=e.target.closest('[data-s]');if(b)render(b.dataset.s)};function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}function seasonCards(){return `<div class="seasons">${seasons.map((s,i)=>`<button class="season ${s.key}" onclick="selectSeason(${i})"><div class="art">${s.art}</div><b>${s.fr}</b><small>${s.ar}</small><br><small>${s.months}</small></button>`).join('')}</div><div id="seasonDetail" class="card" style="margin-top:16px">اختر فصلًا لتشاهد صورته وتسمع اسمه والجملة المرتبطة به.</div>`}function selectSeason(i){const s=seasons[i];document.getElementById('seasonDetail').innerHTML=`<div style="font-size:58px;text-align:center">${s.art}</div><h2 class="fr">${s.fr} <button class="sound" onclick="speak('${s.fr.replaceAll("'","\\'")}')">🔊</button></h2><p class="ar">${s.ar} · ${s.months}</p><div class="phrase"><span class="fr">${s.phrase}</span><button class="sound" onclick="speak('${s.phrase.replaceAll("'","\\'")}')">🔊</button></div>`}function render(s){document.querySelectorAll('.step').forEach(b=>b.classList.toggle('active',b.dataset.s===s));const v=document.getElementById('viewer');if(s==='lesson')v.innerHTML=`<span class="tag">01 · البداية</span><h2>رحلة الدرس: Les saisons</h2><div class="grid"><article class="card"><h3>🎯 الهدف</h3><p>التعرّف على الفصول الأربعة، ربط كل فصل بصورته ومفرداته، ثم استعمال <b>au / en</b> في عبارات بسيطة عن الفصول.</p></article><article class="card"><h3>📚 المصدر</h3><p>المحتوى مبني على الملف الأصلي <b>01_interactif_les_saisons.html</b> في مجلد الدرس الأول، مع إبقاء المصدر الرسمي منفصلًا.</p><a class="btn" target="_blank" href="data/lessons/grade-4/source/4eme_Complet/01_Les_saisons/01_interactif_les_saisons.html">فتح المصدر الأصلي</a></article></div>`;else if(s==='vocabulary')v.innerHTML=`<span class="tag">02 · المفردات</span><h2>🖼️ اكتشف الفصول بالصور</h2><p>اضغط على أي بطاقة: الصورة تتغير في لوحة التفاصيل ويمكنك سماع اسم الفصل والجملة الفرنسية.</p>${seasonCards()}`;else if(s==='pronunciation')v.innerHTML=`<span class="tag">03 · النطق</span><h2>🎧 اسمع وكرر</h2><div class="grid">${seasons.map(s=>`<article class="card"><div class="fr">${s.fr}</div><p class="ar">${s.ar}</p><button class="sound" onclick="speak('${s.fr.replaceAll("'","\\'")}')">🔊 اسمع</button><p>قل الكلمة بعد الصوت ثم اضغط مرة أخرى للتحقق من النطق.</p></article>`).join('')}</div>`;else if(s==='grammar')v.innerHTML=`<span class="tag">04 · القواعد</span><h2>📘 Au / En مع الفصول</h2><div class="grid"><article class="card"><h3 class="fr">au printemps</h3><p>نستعمل <b>au</b> مع <b>printemps</b>.</p><button class="sound" onclick="speak('Au printemps')">🔊</button></article><article class="card"><h3 class="fr">en été · en automne · en hiver</h3><p>نستعمل <b>en</b> مع été, automne, hiver.</p><button class="sound" onclick="speak('En été. En automne. En hiver.')">🔊</button></article></div>`;else if(s==='conversation')v.innerHTML=`<span class="tag">05 · المحادثة</span><h2>💬 حوار قصير — لا تكرر قائمة المفردات</h2><div class="card"><div class="phrase"><span><b>A :</b> Quelle saison préfères-tu ?</span><button class="sound" onclick="speak('Quelle saison préfères-tu ?')">🔊</button></div><div class="phrase"><span><b>B :</b> Je préfère l'été.</span><button class="sound" onclick="speak("Je préfère l'été.")">🔊</button></div><div class="phrase"><span><b>A :</b> Pourquoi ?</span><button class="sound" onclick="speak('Pourquoi ?')">🔊</button></div><div class="phrase"><span><b>B :</b> Parce qu'il fait chaud.</span><button class="sound" onclick="speak("Parce qu'il fait chaud.")">🔊</button></div><p class="ar">🎙️ اقرأ دور A ثم دور B، وبعدها بدّل الأدوار.</p></div>`;else if(s==='practice')v.innerHTML=`<span class="tag">06 · التدريب</span><h2>✍️ تدريب مختلف — اختر الإجابة</h2><div class="card"><p class="fr">1. ___ printemps, il fait doux.</p><button class="choice" onclick="answer(this,true)">Au</button><button class="choice" onclick="answer(this,false)">En</button><p class="fr">2. ___ hiver, il fait froid.</p><button class="choice" onclick="answer(this,false)">Au</button><button class="choice" onclick="answer(this,true)">En</button><p class="fr">3. Quelle saison vient après l'été ?</p><button class="choice" onclick="answer(this,true)">L'automne</button><button class="choice" onclick="answer(this,false)">Le printemps</button><div id="res" class="result"></div></div>`;else if(s==='media')v.innerHTML=`<span class="tag">07 · الوسائط</span><h2>🎬 تعلّم بصري</h2><div class="seasons">${seasons.map(s=>`<article class="season ${s.key}"><div class="art">${s.art}</div><b>${s.fr}</b><small>${s.phrase}</small></article>`).join('')}</div><p class="ar">استخدم الصور كمدخل للمحادثة: صف الفصل بجملة واحدة ثم اسمع النموذج الفرنسي.</p>`;else if(s==='games')v.innerHTML=`<span class="tag">08 · الألعاب</span><h2>🎮 لعبة طابق الفصل</h2><div class="card"><p>اختر الجملة التي تناسب الفصل:</p><div class="grid"><button class="choice" onclick="game(this,true)">❄️ En hiver, il fait froid.</button><button class="choice" onclick="game(this,false)">❄️ En hiver, il fait chaud.</button><button class="choice" onclick="game(this,true)">☀️ En été, il fait chaud.</button><button class="choice" onclick="game(this,false)">☀️ En été, il fait froid.</button></div><p id="gameRes" class="result"></p></div>`;else if(s==='assessment')v.innerHTML=`<span class="tag">09 · التقييم الرسمي</span><h2>🏆 التقييم الإلكتروني الرسمي</h2><p>هذا هو ملف التقييم الرسمي المرتبط بالدرس الأول، وليس أسئلة مخترعة.</p><iframe class="exam" src="data/lessons/grade-4/source/4eme_Complet/01_Les_saisons/04_examen_electronique_les_saisons.html" title="التقييم الرسمي Les saisons"></iframe><a class="btn" target="_blank" href="data/lessons/grade-4/source/4eme_Complet/01_Les_saisons/04_examen_electronique_les_saisons.html">فتح التقييم في صفحة مستقلة</a>`;else if(s==='progress')v.innerHTML=`<span class="tag">10 · التقدم</span><h2>📈 أكملت رحلة Les saisons؟</h2><div class="card"><p>سجّل إتمامك للدرس على هذا الجهاز.</p><button class="btn" onclick="localStorage.setItem('g4-l01-done','1');this.textContent='✅ تم تسجيل الإكمال'">تم إكمال الدرس</button></div>`;else v.innerHTML=`<span class="tag">📚 المرجع المحسن</span><h2>مرجع الدرس — Les saisons</h2><div class="grid"><article class="card"><h3>فصول السنة</h3>${seasons.map(s=>`<div class="phrase"><span class="fr">${s.fr} — ${s.ar}</span><button class="sound" onclick="speak('${s.fr.replaceAll("'","\\'")}')">🔊</button></div>`).join('')}</article><article class="card"><h3>قاعدة الاستخدام</h3><p class="fr">au printemps</p><p class="fr">en été · en automne · en hiver</p><p>مرجع بصري مختصر للمراجعة السريعة، مع الاحتفاظ بالملف المرجعي الأصلي للدرس في مستودع الصف الرابع.</p><a class="btn light" target="_blank" href="data/lessons/grade-4/source/4eme_Complet/01_Les_saisons/02_reference_les_saisons.docx">فتح الملف المرجعي الأصلي</a></article></div>`}function answer(el,ok){document.getElementById('res').textContent=ok?'✅ إجابة صحيحة — أحسنت!':'❌ حاول مرة أخرى.'}function game(el,ok){document.getElementById('gameRes').textContent=ok?'🎉 ممتاز! طابقْت الفصل مع الجملة.':'🔎 راجع الطقس المرتبط بالفصل ثم حاول.'}render('lesson');</script></body></html>
