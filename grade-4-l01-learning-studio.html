<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy · الصف الرابع · Les 4 saisons</title><style>body{margin:0;background:#f3f8fb;color:#292725;font-family:Arial,Cairo,sans-serif}.wrap{max-width:1100px;margin:auto;padding:14px}.top{position:sticky;top:0;z-index:5;background:#fffffff2;padding:12px 16px;border-radius:0 0 18px 18px;display:flex;justify-content:space-between;font-weight:900}.top a{color:inherit;text-decoration:none}.hero{margin-top:12px;padding:28px 22px;border-radius:28px;background:linear-gradient(120deg,#dff5ff,#fff1d6 55%,#e9f6e5)}h1{font-size:clamp(30px,6vw,52px);margin:8px 0}.tag{display:inline-block;background:#c96a2e;color:#fff;padding:6px 12px;border-radius:999px;font-weight:900}.journey{position:sticky;top:53px;z-index:4;background:#fffffff2;padding:10px 2px;display:flex;gap:7px;overflow:auto}.step{border:0;background:#edf2f5;border-radius:999px;padding:10px 14px;font-weight:900;white-space:nowrap;cursor:pointer}.step.active{background:#292725;color:#fff}.page{background:#fff;border-radius:26px;padding:22px;margin-top:12px;min-height:620px}.cards,.vocabGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{border:2px solid #edf1f4;border-radius:20px;padding:17px;background:#fff}.muted{color:#5b5750;font-weight:800}.fr{direction:ltr;text-align:left;font-weight:900}.seasonGrid,.year{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.season{border:0;border-radius:22px;padding:12px;cursor:pointer;font:inherit;min-height:240px}.spring{background:#e4f3e1}.summer{background:#fcefd6}.autumn{background:#f7e4d5}.winter{background:#deebf5}.season.selected{outline:3px solid #292725}.season img,.word img,.videoScene img{width:100%;height:135px;object-fit:cover;border-radius:16px}.season b{display:block;font-size:19px;margin-top:8px}.detail,.rule{margin-top:16px;padding:18px;border-radius:20px;background:#f8fbfd;border:1px solid #e5edf3}.months{display:flex;flex-wrap:wrap;gap:7px}.month{background:#fff;border-radius:999px;padding:7px 11px;font-weight:900}.phrase{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid #edf1f4;border-radius:14px;padding:10px;margin:7px 0}.speak{border:0;background:#292725;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;flex:none}.word{display:flex;flex-direction:column;gap:9px}.word .term{font-size:21px;font-weight:900;display:flex;align-items:center;justify-content:space-between;direction:ltr}.word .example{background:#f8fbfd;border-radius:14px;padding:10px;direction:ltr;text-align:left;font-weight:900}.note{font-size:13px;color:#6b7280;font-weight:800}.year .seasonYear{border-radius:20px;padding:16px}.springY{background:#e4f3e1}.summerY{background:#fcefd6}.autumnY{background:#f7e4d5}.winterY{background:#deebf5}.yearMonth{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:12px;padding:8px 10px;margin:6px 0;font-weight:900}.choice{border:2px solid #e5edf3;background:#fff;border-radius:13px;padding:10px 14px;margin:4px;cursor:pointer;font-weight:900}.choice.correct{border-color:#5ea85b;background:#e4f3e1}.choice.wrong{border-color:#c9503b;background:#fbe0dc}.feedback{font-weight:900;min-height:24px}.btn{border:0;border-radius:13px;padding:11px 15px;background:#292725;color:#fff;font-weight:900;cursor:pointer}.gamebox{border:2px solid #edf1f4;border-radius:20px;padding:18px;margin-top:14px}.score{font-size:24px;font-weight:900}.videoScene{border-radius:24px;padding:18px;background:linear-gradient(135deg,#eef8ff,#fff8e9)}.videoTrack{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.assessmentQ{padding:15px;border:1px solid #e5edf3;border-radius:16px;margin:10px 0}.result{padding:18px;border-radius:18px;background:#f0f8f2;font-weight:900;margin-top:14px}.source{font-size:12px;color:#6b7280;font-weight:800}@media(max-width:760px){.seasonGrid,.year,.videoTrack{grid-template-columns:1fr 1fr}}@media(max-width:500px){.seasonGrid,.year,.videoTrack{grid-template-columns:1fr}.page{padding:15px}}</style><link rel="stylesheet" href="css/hm-academy-grade-themes.css?v=20260909-grade-themes-v2"></head><body data-hm-grade-theme="primary-4"><div class="wrap"><header class="top"><a href="grade-4.html">← الصف الرابع</a><a href="index.html">HM Academy</a></header><section class="hero"><span class="tag">Le français pour vous · 4e année · Unité 1</span><h1>🍂 Les 4 saisons</h1><p>الدرس الأول · g4-l01 · Learning Studio</p></section><nav class="journey" id="nav"></nav><main class="page" id="page"></main></div><script>const seasons=[{k:'spring',fr:'Le printemps',ar:'الربيع',img:'https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=900&q=80',months:['Mars','Avril','Mai'],sentences:['Il fait beau.','Le ciel est bleu.','Les feuilles sont vertes.','Il y a des fleurs.']},{k:'summer',fr:"L'été",ar:'الصيف',img:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80',months:['Juin','Juillet','Août'],sentences:['Il fait chaud.','Le ciel est bleu.','Le soleil brille.','Les arbres ont des fruits.']},{k:'autumn',fr:"L'automne",ar:'الخريف',img:'https://images.unsplash.com/photo-1507371341162-763b5e419408?auto=format&fit=crop&w=900&q=80',months:['Septembre','Octobre','Novembre'],sentences:['Il fait mauvais.','Le ciel est gris.','Les feuilles sont jaunes.',"Les feuilles d'arbres tombent."]},{k:'winter',fr:"L'hiver",ar:'الشتاء',img:'https://images.unsplash.com/photo-1483664852095-d6cc6870702d?auto=format&fit=crop&w=900&q=80',months:['Décembre','Janvier','Février'],sentences:['Il fait froid.','Il pleut.','Les vents soufflent.','La neige tombe.']}];const steps=[['discover','🚀','اكتشف'],['vocab','🖼️','تعلم · المفردات'],['pronounce','🎧','انطق'],['understand','📘','افهم'],['year','🗓️','Une année'],['practice','🤝','تواصل · تدريب'],['games','🎮','الألعاب'],['video','🎬','شاهد'],['assessment','📝','التقييم']];const meanings={ 'Le printemps':'الربيع',beau:'جميل / الطقس جميل',ciel:'السماء',bleu:'أزرق',feuilles:'أوراق الشجر',vertes:'خضراء',fleurs:'زهور',"L'été":'الصيف',chaud:'حار',soleil:'الشمس',brille:'يسطع',arbres:'الأشجار',fruits:'ثمار',"L'automne":'الخريف',mauvais:'سيئ / الطقس سيئ',gris:'رمادي',jaunes:'صفراء',tombent:'تسقط',"L'hiver":'الشتاء',froid:'بارد / الطقس بارد',pleut:'تمطر',vents:'الرياح',soufflent:'تهب',neige:'الثلج',tombe:'يسقط'};const notes={beau:'eau = /o/؛ الحروف الأخيرة لا تُنطق.',ciel:'الصوت النهائي قريب من /j/.',bleu:'eu صوت فرنسي واحد مع تدوير الشفتين.',feuilles:'feuill يعطي صوت /œj/ تقريبًا؛ s النهائية لا تُنطق.',vertes:'الـs النهائية لا تُنطق.',fleurs:'eu صوت فرنسي واحد؛ s النهائية لا تُنطق.',chaud:'ch = /ʃ/ وau = /o/؛ d النهائية لا تُنطق.',soleil:'-eil يعطي صوتًا قريبًا من /ɛj/.',brille:'ill يعطي صوت /j/ تقريبًا.',arbres:'r فرنسية؛ s النهائية لا تُنطق.',fruits:'ui صوت فرنسي مركب؛ s النهائية لا تُنطق.',mauvais:'s النهائية لا تُنطق.',gris:'g هنا /g/؛ s النهائية لا تُنطق.',jaunes:'j = /ʒ/ وau = /o/.',tombent:'ent في نهاية الفعل لا تُنطق.',froid:'oi = /wa/؛ d النهائية لا تُنطق.',pleut:'eu صوت فرنسي واحد؛ t النهائية لا تُنطق.',vents:'s النهائية لا تُنطق.',soufflent:'ent في نهاية الفعل لا تُنطق.',neige:'g قبل e تعطي /ʒ/.'};const vocabBySeason=[{...seasons[0],words:[['Le printemps','Le printemps'],['beau','Il fait beau.'],['ciel','Le ciel est bleu.'],['bleu','Le ciel est bleu.'],['feuilles','Les feuilles sont vertes.'],['vertes','Les feuilles sont vertes.'],['fleurs','Il y a des fleurs.']]},{...seasons[1],words:[["L'été","L'été"],['chaud','Il fait chaud.'],['ciel','Le ciel est bleu.'],['bleu','Le ciel est bleu.'],['soleil','Le soleil brille.'],['brille','Le soleil brille.'],['arbres','Les arbres ont des fruits.'],['fruits','Les arbres ont des fruits.']]},{...seasons[2],words:[["L'automne","L'automne"],['mauvais','Il fait mauvais.'],['ciel','Le ciel est gris.'],['gris','Le ciel est gris.'],['feuilles','Les feuilles sont jaunes.'],['jaunes','Les feuilles sont jaunes.'],['tombent',"Les feuilles d'arbres tombent."]]},{...seasons[3],words:[["L'hiver","L'hiver"],['froid','Il fait froid.'],['pleut','Il pleut.'],['vents','Les vents soufflent.'],['soufflent','Les vents soufflent.'],['neige','La neige tombe.'],['tombe','La neige tombe.']]}];const nav=document.getElementById('nav');nav.innerHTML=steps.map((s,i)=>`<button class="step" data-step="${s[0]}">${s[1]} ${i+1}. ${s[2]}</button>`).join('');nav.onclick=e=>{const b=e.target.closest('.step');if(b)render(b.dataset.step)};function speak(t){if(!window.speechSynthesis||!window.SpeechSynthesisUtterance)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;u.pitch=1;const voices=window.speechSynthesis.getVoices();const v=voices.find(x=>/^fr(-|_)/i.test(x.lang));if(v)u.voice=v;window.speechSynthesis.speak(u)}function sp(t){return `<button type="button" class="speak" data-speak="${encodeURIComponent(t)}" aria-label="نطق">🔊</button>`}document.addEventListener('click',e=>{const b=e.target.closest('[data-speak]');if(b){e.preventDefault();speak(decodeURIComponent(b.dataset.speak))}});function seasonCards(){return `<div class="seasonGrid">${seasons.map((s,i)=>`<button class="season ${s.k}" data-i="${i}"><img src="${s.img}" alt="${s.ar}"><b>${s.fr}</b><span class="muted">${s.ar}</span><div class="months">${s.months.map(m=>`<span class="month">${m}</span>`).join('')}</div></button>`).join('')}</div><div class="detail" id="detail">اختر فصلًا لعرض الجمل والأشهر.</div>`}function bindSeasons(){document.querySelectorAll('.season').forEach(b=>b.onclick=()=>{document.querySelectorAll('.season').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');const s=seasons[+b.dataset.i];document.getElementById('detail').innerHTML=`<h3>${s.fr} · ${s.ar} ${sp(s.fr)}</h3><div class="months">${s.months.map(m=>`<span class="month">${m} ${sp(m)}</span>`).join('')}</div>${s.sentences.map(t=>`<div class="phrase"><span class="fr">${t}</span>${sp(t)}</div>`).join('')}`})}function renderVocab(){return `<span class="tag">02 · تعلم</span><h2>🖼️ المفردات — كل فصل في سياقه</h2><p class="muted">لا توجد قائمة مسطحة: كل كلمة مرتبطة بالفصل والجملة الأصلية التي ظهرت فيها.</p>${vocabBySeason.map(s=>`<section class="card ${s.k}"><h3>${s.fr} · ${s.ar}</h3><div class="vocabGrid">${s.words.map(w=>`<article class="word"><div class="term"><span>${w[0]}</span>${sp(w[0])}</div><div class="muted">${meanings[w[0]]||''}</div><div class="example">${w[1]} ${sp(w[1])}</div></article>`).join('')}</div></section>`).join('')}`}function renderPronounce(){return `<span class="tag">03 · انطق</span><h2>🎧 انطق وافهم معنى الكلمة</h2><p class="muted">اضغط 🔊 لسماع الكلمة، واقرأ معناها بجانبها، ثم راجع ملاحظة النطق.</p>${vocabBySeason.map(s=>`<section class="card"><h3>${s.fr} · ${s.ar}</h3>${s.words.map(w=>`<div class="phrase"><div><div class="fr">${w[0]}</div><div class="muted">${meanings[w[0]]||''}</div><div class="note">${notes[w[0]]||'استمع ثم كرر ببطء.'}</div></div>${sp(w[0])}</div>`).join('')}</section>`).join('')}`}function renderUnderstand(){return `<span class="tag">04 · افهم</span><h2>📘 افهم كل فصل من خلال جمله الأصلية</h2><div class="cards">${seasons.map(s=>`<article class="card"><img src="${s.img}" style="width:100%;height:150px;object-fit:cover;border-radius:16px"><h3>${s.fr} · ${s.ar}</h3><div class="months">${s.months.map(m=>`<span class="month">${m} ${sp(m)}</span>`).join('')}</div>${s.sentences.map(t=>`<div class="phrase"><div><div class="fr">${t}</div><div class="muted">${translate(t)}</div></div>${sp(t)}</div>`).join('')}</article>`).join('')}</div>`}function translate(t){return {'Il fait beau.':'الطقس جميل.','Le ciel est bleu.':'السماء زرقاء.','Les feuilles sont vertes.':'أوراق الشجر خضراء.','Il y a des fleurs.':'توجد زهور.','Il fait chaud.':'الطقس حار.','Le soleil brille.':'الشمس تسطع.','Les arbres ont des fruits.':'الأشجار بها ثمار.','Il fait mauvais.':'الطقس سيئ.','Le ciel est gris.':'السماء رمادية.','Les feuilles sont jaunes.':'أوراق الشجر صفراء.',"Les feuilles d'arbres tombent.":'أوراق الأشجار تتساقط.','Il fait froid.':'الطقس بارد.','Il pleut.':'تمطر.','Les vents soufflent.':'تهب الرياح.','La neige tombe.':'الثلج يتساقط.'}[t]||''}function renderYear(){return `<span class="tag">05 · Une année</span><h2>🗓️ Une année — السنة كاملة</h2><p class="muted">12 شهرًا مرتبطة بالفصول الأربعة، وكل شهر قابل للنطق.</p><div class="year">${seasons.map(s=>`<section class="seasonYear ${s.k}Y"><h3>${s.fr} · ${s.ar}</h3>${s.months.map(m=>`<div class="yearMonth"><span>${m}</span>${sp(m)}</div>`).join('')}</section>`).join('')}</div>`}function renderPractice(){const qs=[['Il fait beau.','spring'],['Le soleil brille.','summer'],['Les feuilles sont jaunes.','autumn'],['La neige tombe.','winter']];return `<span class="tag">06 · تواصل وتدريب</span><h2>🤝 تواصل · تدريب</h2><div class="cards"><article class="card"><h3>اختَر الفصل الصحيح</h3>${qs.map(q=>`<div><p class="fr">${q[0]}</p>${seasons.map(s=>`<button class="choice" data-v="${s.k}" data-c="${q[1]}">${s.ar}</button>`).join('')}<p class="feedback"></p></div>`).join('')}</article><article class="card"><h3>أكمل الاستعمال الصحيح</h3>${[['printemps','au'],['été','en'],['automne','en'],['hiver','en']].map(q=>`<div><p class="fr">___ ${q[0]}</p><button class="choice" data-v="au" data-c="${q[1]}">au</button><button class="choice" data-v="en" data-c="${q[1]}">en</button><p class="feedback"></p></div>`).join('')}</article></div>`}function bindChoices(){document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const box=b.parentElement;box.querySelectorAll('.choice').forEach(x=>x.classList.remove('correct','wrong'));const ok=b.dataset.v===b.dataset.c;b.classList.add(ok?'correct':'wrong');box.querySelector('.feedback').textContent=ok?'✅ إجابة صحيحة':'❌ حاول مرة أخرى'})}let gameScore=0;function renderGames(){gameScore=0;return `<span class="tag">07 · الألعاب</span><h2>🎮 العب وتعلّم</h2><p class="muted">ألعاب قصيرة مبنية على نفس محتوى Les saisons.</p><div class="gamebox"><div class="score">النقاط: <span id="gameScore">0</span></div><h3>🏁 سباق الفصول</h3><p id="raceQ"></p><div id="raceChoices"></div><button class="btn" id="nextRace">سؤال جديد</button></div><div class="gamebox"><h3>🧩 طابق الفصل مع أشهره</h3><div id="matchGame"></div></div>`}function initGames(){let i=0;const race=[['Au printemps, le ciel est ___',['bleu','gris'],'bleu'],['En été, le soleil ___',['brille','tombe'],'brille'],['Les mois de l’automne: Septembre - Octobre - ___',['Novembre','Décembre'],'Novembre'],['Les mois de l’hiver: Décembre - Janvier - ___',['Février','Mars'],'Février'],['Les mois du printemps: Mars - Avril - ___',['Mai','Juin'],'Mai'],['Les mois de l’été: Juin - Juillet - ___',['Août','Septembre'],'Août']];function show(){const q=race[i%race.length];document.getElementById('raceQ').innerHTML=`<span class="fr">${q[0]}</span>`;document.getElementById('raceChoices').innerHTML=q[1].map(o=>`<button class="choice" data-answer="${o}">${o}</button>`).join('')}document.getElementById('nextRace').onclick=()=>{i++;show()};document.getElementById('raceChoices').onclick=e=>{const b=e.target.closest('[data-answer]');if(!b)return;const q=race[i%race.length];if(b.dataset.answer===q[2]){gameScore++;document.getElementById('gameScore').textContent=gameScore;b.classList.add('correct')}else b.classList.add('wrong')};const mg=document.getElementById('matchGame');mg.innerHTML=seasons.map(s=>`<div class="phrase"><b>${s.fr}</b><div>${s.months.map(m=>`<button class="choice" data-m="${m}" data-s="${s.k}">${m}</button>`).join('')}</div></div>`).join('');show()}function renderVideo(){return `<span class="tag">08 · شاهد</span><h2>🎬 شاهد — رحلة الفصول الأربعة</h2><p class="muted">صفحة مشاهدة تعليمية داخل الدرس: كل مشهد يركّز على فصل واحد، ثم استمع إلى الجمل الأصلية.</p><div class="videoScene"><div class="videoTrack">${seasons.map(s=>`<button class="season ${s.k}" data-video="${s.k}"><img src="${s.img}" alt="${s.ar}"><b>${s.fr}</b></button>`).join('')}</div><div id="videoText" class="detail"><h3>اختر فصلًا لبدء المشاهدة التعليمية</h3><p>هذه الصفحة لا تستخدم رابط فيديو خارجي غير موثّق؛ المشاهد مرتبطة مباشرة بمحتوى الدرس.</p></div></div>`}function initVideo(){document.querySelectorAll('[data-video]').forEach(b=>b.onclick=()=>{const s=seasons.find(x=>x.k===b.dataset.video);document.getElementById('videoText').innerHTML=`<h3>${s.fr} · ${s.ar}</h3><p class="fr">${s.sentences.join(' · ')}</p><button class="btn" id="playScene">▶ تشغيل المشهد الصوتي</button>`;document.getElementById('playScene').onclick=()=>s.sentences.forEach((t,j)=>setTimeout(()=>speak(t),j*2200))})}const exam=[['Le printemps تعني:',['الربيع','الصيف','الخريف'],'الربيع'],['L’hiver تعني:',['الشتاء','الربيع','الصيف'],'الشتاء'],["L'automne تعني:",['الخريف','الشتاء','الصيف'],'الخريف'],["L'été تعني:",['الصيف','الربيع','الشتاء'],'الصيف'],['En automne, le ciel est ___',['gris','bleu'],'gris'],['En hiver, il fait ___',['froid','chaud'],'froid'],['Au printemps, le ciel est ___',['bleu','gris'],'bleu'],['En été, le soleil ___',['brille','tombe'],'brille'],["Les mois de l'automne: Septembre - Octobre - ___",['Novembre','Décembre'],'Novembre'],['Les mois de l’hiver: Décembre - Janvier - ___',['Février','Mars'],'Février'],['Les mois du printemps: Mars - Avril - ___',['Mai','Juin'],'Mai'],['Les mois de l’été: Juin - Juillet - ___',['Août','Septembre'],'Août'],['On dit « ___ printemps »',['au','en'],'au'],['On dit « ___ été »',['en','au'],'en'],['Nous sommes en Juillet. Quelle saison ?',['L’été','L’hiver'],'L’été']];function renderAssessment(){return `<span class="tag">09 · التقييم</span><h2>📝 التقييم النهائي</h2><p class="muted">اختبار مستقل عن التدريب، ويقيس فهم الفصول والأشهر والمفردات والجمل.</p><div id="assessmentBox">${exam.map((q,i)=>`<div class="assessmentQ"><b>${i+1}. <span class="fr">${q[0]}</span></b><div>${q[1].map(o=>`<button class="choice" data-q="${i}" data-a="${o}">${o}</button>`).join('')}</div></div>`).join('')}<button class="btn" id="finishExam">إنهاء التقييم</button></div>`}function initAssessment(){document.getElementById('finishExam').onclick=()=>{let score=0;exam.forEach((q,i)=>{const b=document.querySelector(`.choice[data-q="${i}"].correct`);if(b&&b.dataset.a===q[2])score++});document.querySelectorAll('.assessmentQ').forEach((box,i)=>{const chosen=box.querySelector('.choice.correct');if(!chosen){box.querySelectorAll('.choice').forEach(x=>x.classList.remove('wrong'));const correct=[...box.querySelectorAll('.choice')].find(x=>x.dataset.a===exam[i][2]);if(correct)correct.classList.add('correct')}});document.getElementById('assessmentBox').insertAdjacentHTML('beforeend',`<div class="result">النتيجة: ${score} / ${exam.length} — ${score>=12?'ممتاز، استمر!':'راجع الفصول والجمل ثم أعد المحاولة.'}</div>`)}}document.addEventListener('click',e=>{const b=e.target.closest('.assessmentQ .choice');if(b){const box=b.closest('.assessmentQ');box.querySelectorAll('.choice').forEach(x=>x.classList.remove('correct','wrong'));b.classList.add('correct')}});function render(k){document.querySelectorAll('.step').forEach(b=>b.classList.toggle('active',b.dataset.step===k));const p=document.getElementById('page');if(k==='discover')p.innerHTML=`<span class="tag">01 · اكتشف</span><h2>اكتشف الفصول قبل أن تحفظ</h2><p class="muted">ابدأ بالصورة، اسم الفصل، الأشهر، ثم استمع إلى الجمل الأصلية.</p>${seasonCards()}<div class="rule"><h3>الفصول الأربعة</h3><p class="fr">Le printemps · L'été · L'automne · L'hiver</p></div>`;else if(k==='vocab')p.innerHTML=renderVocab();else if(k==='pronounce')p.innerHTML=renderPronounce();else if(k==='understand')p.innerHTML=renderUnderstand();else if(k==='year')p.innerHTML=renderYear();else if(k==='practice')p.innerHTML=renderPractice();else if(k==='games'){p.innerHTML=renderGames();initGames()}else if(k==='video'){p.innerHTML=renderVideo();initVideo()}else {p.innerHTML=renderAssessment();initAssessment()}if(k==='discover')bindSeasons();if(k==='practice')bindChoices()}render('discover');</script></body></html>
