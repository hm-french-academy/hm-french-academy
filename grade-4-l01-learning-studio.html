:none;font-weight:900;margin:4px;cursor:pointer}.btn.light{background:#edf4f8;color:#2e2a25}.seasonGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.season{border:0;border-radius:22px;padding:13px;cursor:pointer;text-align:center;min-height:235px}.spring{background:#e4f3e1}.summer{background:#fcefd6}.autumn{background:#f7e4d5}.winter{background:#deebf5}.season.selected{outline:3px solid #2e2a25}.art{height:115px;border-radius:17px;background:#ffffffaa;display:grid;place-items:center;font-size:58px}.season b{display:block;font-size:19px;margin-top:7px}.detail,.rule,.after{margin-top:15px;padding:18px;border-radius:21px;background:#f8fbfd;border:1px solid #e5edf3}.months{display:flex;flex-wrap:wrap;gap:7px}.month{background:#fff;border-radius:999px;padding:6px 11px;font-weight:900}.phrase{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;border:1px solid #edf1f4;margin:7px 0}.phraseText{direction:ltr;text-align:left;font-weight:900}.speak{border:0;background:#2e2a25;color:#fff;width:35px;height:35px;border-radius:50%;cursor:pointer;display:inline-grid;place-items:center}.choice{border:2px solid #e5edf3;background:#fff;border-radius:13px;padding:10px 14px;margin:4px;cursor:pointer;font-weight:900}.choice.correct{border-color:#5ea85b;background:#e4f3e1}.choice.wrong{border-color:#c9503b;background:#fbe0dc}.feedback{font-weight:900;min-height:25px}.video{position:relative;width:100%;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:#111}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.videoCover{position:absolute;inset:0;background:linear-gradient(135deg,#8ed7f5,#ffe0a5);display:grid;place-items:center;cursor:pointer}.play{width:76px;height:76px;border-radius:50%;background:#c96a2e;color:#fff;display:grid;place-items:center;font-size:30px}.gameTabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.gameTab{border:2px solid #e5edf3;background:#fff;border-radius:999px;padding:10px 14px;font-weight:900;cursor:pointer}.gameTab.active{background:#2e2a25;color:#fff}.gamePanel{background:#f8fbfd;border:1px solid #e5edf3;border-radius:22px;padding:18px}.gameScore{text-align:center;font-size:22px;font-weight:900}.gamePrompt{text-align:center;font-size:24px;font-weight:900;margin:16px}.memoryGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.memoryCard{border:2px solid #e5edf3;border-radius:16px;background:#fff;min-height:80px;font-weight:900;cursor:pointer}.memoryCard.open{background:#eef7f3;border-color:#5ea85b}.orderList{display:grid;gap:9px;max-width:620px;margin:12px auto}.orderItem{background:#fff;border:2px solid #e5edf3;border-radius:15px;padding:13px;font-weight:900;cursor:grab;text-align:center}.orderItem.selected{outline:3px solid #2e2a25}.assessmentBox{background:linear-gradient(135deg,#eef8ff,#fff5e6);border:2px solid #e2ebf3;border-radius:23px;padding:20px;text-align:center}.sourceNote{font-size:12px;color:#6b7280;font-weight:800}.wordImage{height:125px;border-radius:17px;background:#f7fbfd;display:grid;place-items:center;font-size:64px;margin-bottom:10px}.wordCard .fr{text-align:center}.wordCard .ar{text-align:center;color:#315aa4;font-weight:800;margin:5px 0}.exampleBox{background:#f7f9fd;border-radius:13px;padding:10px;margin-top:9px;direction:ltr;text-align:center;line-height:1.6;font-weight:800}.pronNote{background:#fff8e8;border:1px solid #f1dfb0;border-radius:13px;padding:10px;margin-top:9px;line-height:1.7;font-weight:800}.yearGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.yearCard{background:#fff;border:2px solid #edf1f4;border-radius:18px;padding:14px;text-align:center}.yearCard .monthName{font-weight:900;font-size:18px}.yearCard .seasonName{font-size:13px;color:#6b7280;font-weight:800;margin-top:4px}.yearCard .speak{margin-top:7px}@media(max-width:760px){.seasonGrid{grid-template-columns:1fr 1fr}.memoryGrid{grid-template-columns:repeat(3,1fr)}.yearGrid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.seasonGrid{grid-template-columns:1fr}.page{padding:15px}.memoryGrid{grid-template-columns:repeat(2,1fr)}.yearGrid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="css/hm-academy-grade-themes.css?v=20260909-grade-themes-v2"></head><body data-hm-grade-theme="primary-4"><div class="wrap"><header class="top"><a href="grade-4.html">← الصف الرابع</a><a href="index.html">HM Academy</a></header><section class="hero"><span class="eyebrow">Le français pour vous · 4e année · Unité 1</span><h1>🍂 Les 4 saisons</h1><p>Premium Lesson Book Studio · الدرس الأول فقط</p></section><nav class="journey" id="journey"></nav><main id="page" class="page"></main></div><script>const SRC='data/lessons/grade-4/source/4eme_Complet/01_Les_saisons/';const EXAM='grade-4-l01-official-exam.html';const steps=[['start','🚀','البداية'],['vocab','🖼️','المفردات'],['pronunciation','🎧','انطق'],['understand','🧠','افهم'],['interact','🤝','تفاعل'],['listen','🎧','اسمع وتحدث'],['practice','✍️','التدريب'],['media','🎬','الوسائط'],['games','🎮','الألعاب'],['assessment','🏆','التقييم'],['after','📚','بعد الرحلة']];const seasons=[{k:'spring',fr:'Le printemps',ar:'الربيع',pic:'🌷🌱',months:['Mars','Avril','Mai'],main:'Il fait beau.',all:['Il fait beau.','Le ciel est bleu.','Les feuilles sont vertes.','Il y a des fleurs.']},{k:'summer',fr:"L'été",ar:'الصيف',pic:'☀️🏖️',months:['Juin','Juillet','Août'],main:'Il fait chaud.',all:['Il fait chaud.','Le ciel est bleu.','Le soleil brille.','Les arbres ont des fruits.']},{k:'autumn',fr:"L'automne",ar:'الخريف',pic:'🍂🌰',months:['Septembre','Octobre','Novembre'],main:'Il fait mauvais.',all:['Il fait mauvais.','Le ciel est gris.','Les feuilles sont jaunes.',"Les feuilles d'arbres tombent."]},{k:'winter',fr:"L'hiver",ar:'الشتاء',pic:'❄️⛄',months:['Décembre','Janvier','Février'],main:'Il fait froid.',all:['Il fait froid.','Il pleut.','Les vents soufflent.','La neige tombe.']}];const lexicon=[{w:'Le printemps',a:'الربيع',i:'🌷🌱',e:'Il fait beau.',n:'Le حرف e الأخير لا يُنطق؛ صوت «emps» أنفي في نهاية الكلمة.'},{w:'beau',a:'جميل / الطقس جميل',i:'☀️',e:'Il fait beau.',n:'eau تُنطق صوتًا واحدًا قريبًا من «o».'},{w:'le ciel',a:'السماء',i:'🌤️',e:'Le ciel est bleu.',n:'ciel تُنطق بمقطع واحد؛ لا تُنطق l الأخيرة منفردة.'},{w:'bleu',a:'أزرق',i:'🔵',e:'Le ciel est bleu.',n:'eu صوت فرنسي؛ لا تُنطق u كـ «يو» عربية.'},{w:'les feuilles',a:'الأوراق',i:'🍃',e:'Les feuilles sont vertes.',n:'feuilles تبدأ بصوت f، وill تُعطي صوت «ي» في النطق الفرنسي.'},{w:'vertes',a:'خضراء',i:'🌿',e:'Les feuilles sont vertes.',n:'الحرف الأخير e هو الذي يُسمع، أما s النهائية فلا تُنطق.'},{w:'les fleurs',a:'الزهور',i:'🌸',e:'Il y a des fleurs.',n:'fleurs تبدأ بصوت f، وeu صوت فرنسي واحد.'},{w:"L'été",a:'الصيف',i:'☀️🏖️',e:'Il fait chaud.',n:'é صوت مغلق واضح، وt النهائي لا يُنطق.'},{w:'chaud',a:'حار',i:'🔥',e:'Il fait chaud.',n:'ch تُنطق «ش»، وau تُنطق صوتًا قريبًا من «o».'},{w:'le soleil',a:'الشمس',i:'☀️',e:'Le soleil brille.',n:'sol- تُنطق بوضوح، وeil في نهاية soleil له نطق فرنسي مركب.'},{w:'brille',a:'يُشرق / يلمع',i:'✨',e:'Le soleil brille.',n:'ill بعد الحرف المتحرك تعطي صوت «ي»، وe الأخيرة خفيفة.'},{w:'les arbres',a:'الأشجار',i:'🌳',e:'Les arbres ont des fruits.',n:'ar- واضحة، وs النهائية لا تُنطق.'},{w:'des fruits',a:'ثمار',i:'🍎',e:'Les arbres ont des fruits.',n:'fruits تبدأ بتجمع fr، وts في النهاية لا تُنطق.'},{w:"L'automne",a:'الخريف',i:'🍂🌰',e:'Il fait mauvais.',n:'au تُنطق صوتًا قريبًا من «o»، وne الأخيرة خفيفة.'},{w:'mauvais',a:'سيئ',i:'🌧️',e:'Il fait mauvais.',n:'mau تُنطق قريبًا من «mo»، وs الأخيرة لا تُنطق.'},{w:'gris',a:'رمادي',i:'☁️',e:'Le ciel est gris.',n:'gr تُنطق متصلة، وs النهائية لا تُنطق.'},{w:'jaunes',a:'صفراء',i:'💛',e:'Les feuilles sont jaunes.',n:'j تُنطق مثل «ژ»، وs النهائية لا تُنطق.'},{w:"tombent",a:'تسقط',i:'🍂⬇️',e:"Les feuilles d'arbres tombent.",n:'mb في الوسط واضحة، أما ent في نهاية الفعل فلا تُنطق.'},{w:"L'hiver",a:'الشتاء',i:'❄️⛄',e:'Il fait froid.',n:'h في الفرنسية لا تُنطق.'},{w:'froid',a:'بارد',i:'🥶',e:'Il fait froid.',n:'oi تُنطق صوتًا قريبًا من «وا»، وd النهائية لا تُنطق.'},{w:'pleut',a:'تمطر',i:'🌧️',e:'Il pleut.',n:'eu صوت فرنسي واحد، وt النهائية لا تُنطق.'},{w:'les vents',a:'الرياح',i:'💨',e:'Les vents soufflent.',n:'v في بداية الكلمة واضحة، وs النهائية لا تُنطق.'},{w:'soufflent',a:'تهب',i:'💨🌬️',e:'Les vents soufflent.',n:'souff- فيها صوت f واضح، وent النهائية لا تُنطق.'},{w:'la neige',a:'الثلج',i:'❄️',e:'La neige tombe.',n:'neige فيها صوت «ژ» في الوسط، وe النهائية لا تُسمع.'},{w:'tombe',a:'يسقط',i:'⬇️',e:'La neige tombe.',n:'tom- واضحة، وe النهائية خفيفة.'}];const months=[['Mars','الربيع','🌷'],['Avril','الربيع','🌷'],['Mai','الربيع','🌷'],['Juin','الصيف','☀️'],['Juillet','الصيف','☀️'],['Août','الصيف','☀️'],['Septembre','الخريف','🍂'],['Octobre','الخريف','🍂'],['Novembre','الخريف','🍂'],['Décembre','الشتاء','❄️'],['Janvier','الشتاء','❄️'],['Février','الشتاء','❄️']];const nav=document.getElementById('journey');nav.innerHTML=steps.map((s,i)=>`<button class="step" data-step="${s[0]}"><i>${s[1]}</i>${i+1}. ${s[2]}</button>`).join('');nav.onclick=e=>{const b=e.target.closest('[data-step]');if(b)render(b.dataset.step)};function speak(t,b){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;u.onend=()=>b&&b.classList.remove('playing');if(b)b.classList.add('playing');speechSynthesis.speak(u)}function sp(t){return `<button class="speak" data-say=${JSON.stringify(t)}>🔊</button>`}document.addEventListener('click',e=>{const b=e.target.closest('.speak');if(b)speak(b.dataset.say,b)});function cards(){return `<div class="seasonGrid">${seasons.map((s,i)=>`<button class="season ${s.k}" data-season="${i}"><div class="art">${s.pic}</div><b>${s.fr}</b><span class="muted">${s.ar}</span><br><small>${s.months.join(' · ')}</small></button>`).join('')}</div><div id="detail" class="detail">اضغط على فصل لعرض الجملة الرئيسية والنطق.</div>`}function bind(){document.querySelectorAll('[data-season]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-season]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');const s=seasons[+b.dataset.season];document.getElementById('detail').innerHTML=`<div class="cards"><div><div style="font-size:70px;text-align:center">${s.pic}</div><p class="fr">${s.fr} ${sp(s.fr)}</p><p class="muted">${s.ar}</p></div><div><div class="months">${s.months.map(m=>`<span class="month">${m} ${sp(m)}</span>`).join('')}</div><div class="phrase"><span class="phraseText">${s.main}</span>${sp(s.main)}</div></div></div>`})}function vocabulary(){return `<span class="tag">02 · المفردات</span><h2>🖼️ مفردات Les 4 saisons</h2><p class="muted">الكلمات مستخلصة من أسماء الفصول والجمل الموجودة فعليًا في الدرس. لكل كلمة صورة توضح معناها، زر نطق، ومثال من نفس محتوى الدرس.</p><div class="cards">${lexicon.map(x=>`<article class="card wordCard"><div class="wordImage">${x.i}</div><div class="fr">${x.w} ${sp(x.w)}</div><div class="ar">${x.a}</div><div class="exampleBox">${x.e} ${sp(x.e)}</div></article>`).join('')}</div><h3>📅 شهور السنة</h3><div class="yearGrid">${months.map(m=>`<div class="yearCard"><div>${m[2]}</div><div class="monthName">${m[0]}</div><div class="seasonName">${m[1]}</div>${sp(m[0])}</div>`).join('')}</div>`}function pronunciation(){return `<span class="tag">03 · انطق</span><h2>🎧 صفحة النطق — كلمات الدرس</h2><p class="muted">هنا نركز على الكلمة وملاحظة النطق فقط، بدون أمثلة، بنفس فكرة صفحة النطق المرجعية.</p><div class="cards">${lexicon.map(x=>`<article class="card wordCard"><div class="wordImage">${x.i}</div><div class="fr">${x.w}</div><div class="pronNote">🔎 ${x.n}</div><button class="btn" onclick="speak(this.dataset.text)" data-text="${x.w}">🔊 استمع إلى الكلمة</button></article>`).join('')}</div><h3>📅 نطق شهور السنة</h3><div class="yearGrid">${months.map(m=>`<div class="yearCard"><div>${m[2]}</div><div class="monthName">${m[0]}</div>${sp(m[0])}</div>`).join('')}</div>`}function answer(btn){const g=btn.parentElement;g.querySelectorAll('.choice').forEach(x=>x.classList.remove('correct','wrong'));const ok=btn.dataset.val===btn.dataset.correct;btn.classList.add(ok?'correct':'wrong');const f=g.parentElement.querySelector('.feedback')||g.nextElementSibling;if(f)f.textContent=ok?'✅ إجابة صحيحة!':'❌ ليست الإجابة الصحيحة، حاول مرة أخرى.'}function interact(){const qs=[['🕵️ محقق الشهور','Nous sommes en Juillet. Quelle saison ?',['Le printemps','L’été','L’automne','L’hiver'],'L’été'],['🌨️ موقف الطقس','Il fait froid et la neige tombe. Quelle saison ?',['Le printemps','L’été','L’automne','L’hiver'],'L’hiver'],['🍂 دليل الفصل','Les feuilles sont jaunes et tombent. Quelle saison ?',['Le printemps','L’été','L’automne','L’hiver'],'L’automne'],['🌷 أكمل المعنى','Il y a des fleurs. Nous sommes…',['au printemps','en été','en automne','en hiver'],'au printemps']];return `<span class="tag">05 · تفاعل</span><h2>🤝 تفاعل ذكي — أربع مهام مختلفة</h2><p class="muted">لا توجد إجابة وهمية مثل «فصل آخر». كل مهمة تقيس مهارة مختلفة.</p><div class="cards">${qs.map(x=>`<article class="card"><h3>${x[0]}</h3><p class="fr">${x[1]}</p><div>${x[2].map(o=>`<button class="choice" data-val="${o}" data-correct="${x[3]}" onclick="answer(this)">${o}</button>`).join('')}</div><p class="feedback"></p></article>`).join('')}</div>`}let game={tab:'race',score:0,round:0,memory:[],open:[],matched:[],order:[],orderSelected:null};const prompts=[['Quel mois appartient à l’été ?',['Juillet','Janvier','Mars','Octobre'],'Juillet'],['En hiver, il fait…',['froid','chaud','beau','mauvais'],'froid'],['Quelle saison vient après le printemps ?',['L’été','L’hiver','L’automne','Le printemps'],'L’été'],['On dit…',['en été','au été','en printemps','au automne'],'en été'],['Quel mois appartient à l’automne ?',['Octobre','Juin','Février','Avril'],'Octobre'],['La neige tombe en…',['hiver','été','printemps','automne'],'hiver'],['On dit…',['au printemps','en printemps','au été','en printemps'],'au printemps'],['Quel mois appartient au printemps ?',['Avril','Août','Décembre','Novembre'],'Avril']];function games(){return `<span class="tag">09 · الألعاب</span><h2>🎮 مركز الألعاب — 4 ألعاب مختلفة</h2><p class="muted">كل لعبة لها فكرة وقاعدة وهدف مختلف.</p><div class="gameTabs">${[['race','🏁 سباق الفصول'],['memory','🧠 ذاكرة الشهور'],['clues','🔎 من أنا؟'],['order','🔢 رتّب الفصول']].map(x=>`<button class="gameTab ${game.tab===x[0]?'active':''}" onclick="setGame('${x[0]}')">${x[1]}</button>`).join('')}</div><div class="gamePanel" id="gamePanel"></div>`}function setGame(t){game={tab:t,score:0,round:0,memory:[],open:[],matched:[],order:[],orderSelected:null};document.querySelectorAll('.gameTab').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick')===`setGame('${t}')`));renderGame()}function renderGame(){const p=document.getElementById('gamePanel');if(!p)return;if(game.tab==='race'){const x=prompts[game.round%prompts.length],opts=x[1].slice().sort(()=>Math.random()-.5);p.innerHTML=`<div class="gameScore">النقاط: ${game.score} / ${game.round}</div><div class="gamePrompt fr">${x[0]}</div><div class="cards">${opts.map(o=>`<button class="choice" onclick="race('${o}','${x[2]}')">${o}</button>`).join('')}</div><p class="feedback" id="gf"></p>`}else if(game.tab==='memory'){if(!game.memory.length){const a=seasons.flatMap(s=>s.months.map(m=>({m,s:s.fr}))).slice(0,8);game.memory=[...a.map(x=>({t:x.m,p:x.s,k:'m'+x.m})),...a.map(x=>({t:x.s,p:x.s,k:'s'+x.m}))].sort(()=>Math.random()-.5)}p.innerHTML=`<div class="gameScore">مطابقات صحيحة: ${game.matched.length/2} / 8</div><div class="memoryGrid">${game.memory.map((c,i)=>`<button class="memoryCard ${game.open.includes(i)||game.matched.includes(i)?'open':''}" onclick="mem(${i})">${game.open.includes(i)||game.matched.includes(i)?c.t:'❓'}</button>`).join('')}</div><p class="feedback">افتح بطاقتين وابحث عن الشهر والفصل المرتبط به.</p>`}else if(game.tab==='clues'){const c=[['Je suis en juin, juillet et août. Qui suis-je ?','L’été'],['Je suis en septembre, octobre et novembre. Qui suis-je ?','L’automne'],['Je suis en décembre, janvier et février. Qui suis-je ?','L’hiver'],['Je suis en mars, avril et mai. Qui suis-je ?','Le printemps']][game.round%4];p.innerHTML=`<div class="gameScore">النقاط: ${game.score} / ${game.round}</div><div class="gamePrompt fr">${c[0]}</div><div class="cards">${seasons.map(s=>`<button class="choice" onclick="clue('${s.fr}','${c[1]}')">${s.pic} ${s.ar}</button>`).join('')}</div><p class="feedback" id="gf"></p>`}else{if(!game.order.length)game.order=seasons.map(s=>s.k).sort(()=>Math.random()-.5);p.innerHTML=`<div class="gameScore">اضغط على بطاقتين لتبديل مكانهما، ورتب الفصول من بداية السنة إلى نهايتها.</div><div class="orderList" id="ol">${game.order.map(k=>{const s=seasons.find(x=>x.k===k);return `<button class="orderItem ${game.orderSelected===k?'selected':''}" draggable="true" data-k="${k}" onclick="selectOrder(this)">${s.pic} ${s.fr}</button>`}).join('')}</div><button class="btn" onclick="checkOrder()">تحقق من الترتيب</button><p class="feedback" id="gf"></p>`;document.querySelectorAll('.orderItem').forEach(el=>{el.ondragstart=e=>e.dataTransfer.setData('text',el.dataset.k);el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();const k=e.dataTransfer.getData('text'),from=[...document.querySelectorAll('.orderItem')].find(x=>x.dataset.k===k);el.parentNode.insertBefore(from,el);game.order=[...document.querySelectorAll('.orderItem')].map(x=>x.dataset.k);game.orderSelected=null;document.querySelectorAll('.orderItem').forEach(x=>x.classList.remove('selected'))}})}}function selectOrder(el){if(!game.orderSelected){game.orderSelected=el.dataset.k;el.classList.add('selected');return}if(game.orderSelected===el.dataset.k){game.orderSelected=null;el.classList.remove('selected');return}const all=[...document.querySelectorAll('.orderItem')],from=all.find(x=>x.dataset.k===game.orderSelected);el.parentNode.insertBefore(from,el);game.order=[...document.querySelectorAll('.orderItem')].map(x=>x.dataset.k);game.orderSelected=null;document.querySelectorAll('.orderItem').forEach(x=>x.classList.remove('selected'))}function race(v,a){if(v===a)game.score++;game.round++;renderGame()}function clue(v,a){if(v===a)game.score++;game.round++;renderGame()}function mem(i){if(game.open.includes(i)||game.open.length===2||game.matched.includes(i))return;game.open.push(i);renderGame();if(game.open.length===2){const a=game.memory[game.open[0]],b=game.memory[game.open[1]];setTimeout(()=>{if(a.p===b.p&&a.k[0]!==b.k[0])game.matched.push(game.open[0],game.open[1]);game.open=[];renderGame()},600)}}function checkOrder(){document.getElementById('gf').textContent=JSON.stringify(game.order)===JSON.stringify(['spring','summer','autumn','winter'])?'🏆 ترتيب صحيح!':'❌ ليس هذا الترتيب، حاول مرة أخرى.'}function playVideo(){document.getElementById('video').innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/TKpQVLU81DA?autoplay=1&rel=0" title="Les saisons" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>'}const sentenceAr={spring:['الطقس جميل.','السماء زرقاء.','الأوراق خضراء.','توجد زهور.'],summer:['الطقس حار.','السماء زرقاء.','الشمس تشرق.','الأشجار بها ثمار.'],autumn:['الطقس سيئ.','السماء رمادية.','الأوراق صفراء.','أوراق الأشجار تسقط.'],winter:['الطقس بارد.','إنها تمطر.','الرياح تهب.','الثلج يسقط.']};function render(k){document.querySelectorAll('.step').forEach(b=>b.classList.toggle('active',b.dataset.step===k));const p=document.getElementById('page');if(k==='start')p.innerHTML=`<span class="tag">01 · البداية</span><h2>Bienvenue dans Les 4 saisons 🌍</h2><div class="cards"><article class="card"><h3>🎯 الهدف</h3><p>التعرف على الفصول الأربعة وأشهرها ومظاهر الطقس واستعمال au / en.</p></article><article class="card"><h3>🧭 خريطة الرحلة</h3><p>اكتشف → المفردات → انطق → افهم → تفاعل → اسمع وتحدث → تدرب → شاهد → العب → قيّم → راجع.</p></article><article class="card"><h3>📚 المصدر</h3><p>تمت مراجعة الملف الأصلي ومصادر الدرس مع عزل Studio الدرس الأول عن باقي الصفوف.</p><a class="btn light" target="_blank" href="${SRC}01_interactif_les_saisons.html">فتح المصدر الأصلي</a></article></div>`;else if(k==='vocab')p.innerHTML=vocabulary();else if(k==='pronunciation')p.innerHTML=pronunciation();else if(k==='understand')p.innerHTML=`<span class="tag">04 · افهم</span><h2>🧠 افهم الفصول والجمل</h2><p class="muted">نستخدم هنا المحتوى الحالي الذي يقدّم كل فصل بالشهور الثلاثة والجمل الأربع الخاصة به، مع نطق وترجمة كل جملة.</p><div class="cards">${seasons.map(s=>`<article class="card"><div style="font-size:52px">${s.pic}</div><h3>${s.fr} ${sp(s.fr)} · ${s.ar}</h3><div class="months">${s.months.map(m=>`<span class="month">${m} ${sp(m)}</span>`).join('')}</div>${s.all.map((q,i)=>`<div class="phrase"><span class="phraseText">${q}</span>${sp(q)}</div><div class="muted" style="text-align:right;margin:-3px 0 7px">${sentenceAr[s.k][i]}</div>`).join('')}</article>`).join('')}</div><h3>📅 شهور السنة كاملة</h3><div class="yearGrid">${months.map(m=>`<div class="yearCard"><div>${m[2]}</div><div class="monthName">${m[0]}</div><div class="seasonName">${m[1]}</div>${sp(m[0])}</div>`).join('')}</div>`;else if(k==='interact')p.innerHTML=interact();else if(k==='listen')p.innerHTML=`<span class="tag">06 · اسمع وتحدث</span><h2>🎧 استماع وتحدث — اسم ثم جملة</h2><div class="cards">${seasons.map(s=>`<article class="card"><h3 class="fr">${s.fr} ${sp(s.fr)}</h3><p class="muted">استمع، كرر، ثم قل:</p><div class="phrase"><span class="phraseText">${s.main}</span>${sp(s.main)}</div></article>`).join('')}</div>`;else if(k==='practice')p.innerHTML=`<span class="tag">07 · التدريب</span><h2>✍️ تدريب الاختيار والتطبيق</h2><div class="cards"><article class="card"><h3>au / en</h3>${[['printemps','au'],['été','en'],['automne','en'],['hiver','en']].map(q=>`<div><p class="fr">___ ${q[0]}</p><button class="choice" data-val="au" data-correct="${q[1]}" onclick="answer(this)">au</button><button class="choice" data-val="en" data-correct="${q[1]}" onclick="answer(this)">en</button><p class="feedback"></p></div>`).join('')}</article><article class="card"><h3>اختَر الفصل من الجملة</h3>${[['Il fait froid.','winter'],['Il y a des fleurs.','spring'],['Le soleil brille.','summer'],['Les feuilles sont jaunes.','autumn']].map(q=>`<div><p class="fr">${q[0]}</p>${seasons.map(s=>`<button class="choice" data-val="${s.k}" data-correct="${q[1]}" onclick="answer(this)">${s.pic} ${s.ar}</button>`).join('')}<p class="feedback"></p></div>`).join('')}</article></div>`;else if(k==='media')p.innerHTML=`<span class="tag">08 · الوسائط</span><h2>🎬 فيديو الدرس</h2><p class="muted">فيديو الوسائط المرتبط بدرس Les saisons.</p><div class="video" id="video"><div class="videoCover" onclick="playVideo()"><div class="play">▶</div></div></div><p class="sourceNote">Les saisons — Chanson pour enfants (Les Titounis)</p><a class="btn light" target="_blank" href="https://www.youtube.com/watch?v=TKpQVLU81DA">فتح الفيديو مباشرة</a>`;else if(k==='games')p.innerHTML=games(),renderGame();else if(k==='assessment')p.innerHTML=`<span class="tag">10 · التقييم</span><div class="assessmentBox"><h2>🏆 التقييم الرسمي — <span class="fr">Les 4 saisons</span></h2><p>واجهة مستقلة ومنظمة داخل مسار الدرس. محتوى الأسئلة مأخوذ من ملف الاختبار الإلكتروني الأصلي دون اختراع أسئلة جديدة.</p><a class="btn" href="${EXAM}">ابدأ التقييم الرسمي →</a><p class="sourceNote">المصدر المعتمد للأسئلة: 04_examen_electronique_les_saisons.html</p><a class="btn light" target="_blank" href="${SRC}04_examen_electronique_les_saisons.html">فتح المصدر الأصلي فقط</a></div>`;else p.innerHTML=`<span class="tag">11 · بعد الرحلة</span><h2>📚 بعد الرحلة — Premium Review Card</h2><div class="after"><div class="cards">${seasons.map(s=>`<article class="card"><div style="font-size:44px">${s.pic}</div><h3>${s.fr}</h3><p class="muted">${s.months.join(' · ')}</p><p class="fr">${s.main}</p>${sp(s.main)}</article>`).join('')}</div><div class="rule"><h3>📘 القاعدة</h3><p class="fr">au printemps · en été · en automne · en hiver</p><p>au مع printemps، وen مع été وautomne وhiver.</p></div><p class="sourceNote">المرجع الأصلي محفوظ كما هو، وهذه الصفحة مخصصة للمراجعة السريعة.</p><a class="btn light" target="_blank" href="${SRC}02_reference_les_saisons.docx">فتح المرجع الأصلي</a></div>`;if(k==='vocab')bind()}render('start');</script></body></html>
