<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><title>HM Academy | 4ème · Les saisons</title><style>:root{--ink:#17324d;--muted:#64748b;--line:#e5edf5;--paper:#fffdf8;--accent:#c96a2e}*{box-sizing:border-box}body{margin:0;font-family:Arial,Cairo,sans-serif;color:var(--ink);background:linear-gradient(135deg,#dff5ff,#fff0f7 55%,#f0ffe5);min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:9px 14px 38px}.top{position:sticky;top:0;z-index:60;background:#ffffffee;padding:11px 15px;border-radius:0 0 22px 22px;display:flex;justify-content:space-between;box-shadow:0 8px 28px #17324d14}.top a{color:var(--ink);text-decoration:none;font-weight:900}.book{margin-top:14px;background:var(--paper);border-radius:34px;box-shadow:0 18px 55px #17324d20;overflow:hidden}.hero{padding:30px 28px;background:linear-gradient(135deg,#8fe0ff,#ffd6ea 55%,#fff0b5);min-height:165px}.unit{font-weight:900;opacity:.8}.hero h1{margin:8px 0;font-size:clamp(28px,6vw,46px)}.hero p{margin:0;font-weight:800}.journey{display:flex;gap:7px;overflow-x:auto;padding:12px;background:#fffffff5;border-bottom:1px solid #e8edf3}.step{border:0;background:#f3f7fb;color:#536078;border-radius:999px;padding:9px 13px;font-weight:900;white-space:nowrap;cursor:pointer}.step.active{background:var(--ink);color:#fff}.stepIcon{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin-left:5px;border-radius:50%;background:#dfe9f2}.step.active .stepIcon{background:#fff;color:var(--ink)}.bookpage{margin:16px;background:#fff;border:1px solid #eee8dc;border-radius:26px;padding:22px;min-height:590px;line-height:1.9}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:linear-gradient(180deg,#fff,#fbfdff);border:2px solid #edf1f5;border-radius:22px;padding:17px;box-shadow:0 10px 26px #17324d10}.pill{display:inline-block;border-radius:999px;padding:6px 11px;background:#e7f4ff;color:#1260a8;font-weight:900}.fr{direction:ltr;text-align:left;font-size:21px;font-weight:900}.muted{color:var(--muted);font-weight:800}.btn{display:inline-block;border:0;border-radius:14px;padding:11px 15px;font-weight:900;cursor:pointer;background:var(--ink);color:#fff;text-decoration:none;margin:4px}.btn.light{background:#eef4f8;color:var(--ink)}.seasonGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.season{border:0;border-radius:22px;padding:14px;cursor:pointer;text-align:center;min-height:225px;box-shadow:0 10px 26px #17324d14;transition:.2s}.season:hover{transform:translateY(-4px)}.season.active{outline:3px solid var(--ink)}.art{height:120px;border-radius:18px;background:#ffffff99;display:grid;place-items:center;font-size:60px}.spring{background:#e4f3e1}.summer{background:#fcefd6}.autumn{background:#f7e4d5}.winter{background:#deebf5}.season b{display:block;font-size:19px;margin-top:8px}.sound{border:0;border-radius:50%;width:36px;height:36px;background:var(--ink);color:#fff;cursor:pointer}.phrase{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#f8fbfd;border:1px solid var(--line);border-radius:15px;padding:12px;margin:8px 0}.choice{border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px 14px;font-weight:900;cursor:pointer}.choice:hover{border-color:#2563eb}.feedback{font-weight:900;min-height:28px}.referenceBox{background:linear-gradient(135deg,#eef8ff,#fff8ec);border:2px solid #e2ebf3;border-radius:22px;padding:20px}.source{font-size:12px;color:#64748b;font-weight:800}.exam{width:100%;height:700px;border:1px solid var(--line);border-radius:18px}.nav{display:flex;justify-content:space-between;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}@media(max-width:760px){.seasonGrid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.seasonGrid{grid-template-columns:1fr}.bookpage{margin:9px;padding:16px}.hero{padding:24px 19px}}</style></head><body><div class="wrap"><header class="top"><a href="grade-4.html">← الصف الرابع</a><a href="index.html">HM Academy · الرئيسية</a></header><section class="book"><header class="hero"><div class="unit">Le français pour vous · 4e année · Unité 1</div><h1>🍂 Les 4 saisons</h1><p>الدرس الأول · رحلة تعلم متدرجة من الاكتشاف إلى التقييم ثم المراجعة</p></header><nav class="journey" id="journey"></nav><main id="viewer" class="bookpage"></main></section></div><script>const steps=[['start','🚀','البداية'],['vocab','🖼️','المفردات'],['understand','🧠','افهم'],['interact','🤝','تفاعل'],['listen','🎧','اسمع وتحدث'],['practice','✍️','التدريب'],['media','🎬','الوسائط'],['games','🎮','الألعاب'],['assessment','🏆','التقييم'],['after','📚','بعد الرحلة']];const seasons=[{k:'spring',fr:'Le printemps',ar:'الربيع',art:'🌷🌱☀️',months:'Mars · Avril · Mai',sentence:'Au printemps, il fait beau.'},{k:'summer',fr:"L'été",ar:'الصيف',art:'☀️🏖️🍉',months:'Juin · Juillet · Août',sentence:'En été, il fait chaud.'},{k:'autumn',fr:"L'automne",ar:'الخريف',art:'🍂🌰🌦️',months:'Septembre · Octobre · Novembre',sentence:'En automne, les feuilles tombent.'},{k:'winter',fr:"L'hiver",ar:'الشتاء',art:'❄️⛄🧣',months:'Décembre · Janvier · Février',sentence:'En hiver, il fait froid.'}];const j=document.getElementById('journey');j.innerHTML=steps.map((s,i)=>`<button class="step" data-s="${s[0]}"><span class="stepIcon">${s[1]}</span>${i+1}. ${s[2]}</button>`).join('');j.onclick=e=>{const b=e.target.closest('[data-s]');if(b)render(b.dataset.s)};function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}function snd(t){return `<button class="sound" onclick="speak(${JSON.stringify(t)})">🔊</button>`}function seasonCards(){return `<div class="seasonGrid">${seasons.map((s,i)=>`<button class="season ${s.k}" onclick="choose(${i})"><div class="art">${s.art}</div><b>${s.fr}</b><span class="muted">${s.ar}</span><br><small>${s.months}</small></button>`).join('')}</div><div id="detail" class="card" style="margin-top:15px">اضغط على أحد الفصول لعرض الصورة والمفردات والجملة والنطق.</div>`}function choose(i){const s=seasons[i];document.getElementById('detail').innerHTML=`<div style="font-size:58px;text-align:center">${s.art}</div><div class="fr">${s.fr} ${snd(s.fr)}</div><p class="muted">${s.ar} · ${s.months}</p><div class="phrase"><span class="fr">${s.sentence}</span>${snd(s.sentence)}</div>`}function render(key){document.querySelectorAll('.step').forEach(b=>b.classList.toggle('active',b.dataset.s===key));const v=document.getElementById('viewer');if(key==='start')v.innerHTML=`<span class="pill">01 · البداية</span><h2>Bienvenue dans Les 4 saisons 🌍</h2><div class="cards"><article class="card"><h3>🎯 ماذا سنتعلم؟</h3><p>نتعرف على الفصول الأربعة، أشهر كل فصل، مظاهر الطقس المرتبطة به، ثم نستخدم الصيغ الصحيحة مع الفصول.</p></article><article class="card"><h3>🧭 كيف نسير؟</h3><p>اكتشاف بصري → فهم المعنى → تفاعل شفهي → استماع وتحدث → تدريب → وسائط وألعاب → تقييم رسمي → مرجع مراجعة.</p></article><article class="card"><h3>📌 مصدر الدرس</h3><p>تم بناء الرحلة من ملف الدرس الأصلي <b>01_interactif_les_saisons.html</b> داخل حزمة الصف الرابع، مع فصل الـStudio عن الملف الأصلي.</p><a class="btn light" target="_blank" href="data/lessons/grade-4/source/4eme_Complet/01_Les_saisons/01_interactif_les_saisons.html">فتح المصدر الأصلي</a></article></div>`;else if(key==='vocab')v.innerHTML=`<span class="pill">02 · المفردات</span><h2>🖼️ بطاقات الفصول — اكتشف ثم اسمع</h2><p class="muted">كل بطاقة تحمل صورة مختلفة تعبر عن الفصل، وليست صورة عامة مكررة.</p>${seasonCards()}`;else if(key==='understand')v.innerHTML=`<span class="pill">03 · افهم</span><h2>🧠 افهم الفكرة من الصورة</h2><div class="cards">${seasons.map(s=>`<article class="card"><div style="font-size:50px">${s.art}</div><h3>${s.fr}</h3><p>${s.ar}</p><p class="muted">${s.months}</p><div class="phrase"><span class="fr">${s.sentence}</span>${snd(s.sentence)}</div></article>`).join('')}</div>`;else if(key==='interact')v.innerHTML=`<span class="pill">04 · تفاعل</span><h2>🤝 اختَر الفصل المناسب للجملة</h2><div class="card"><p class="fr">1. Il fait froid.</p><button class="choice" onclick="mark(this,'winter')">❄️ L'hiver</button><button class="choice" onclick="mark(this,'summer')">☀️ L'été</button><p class="fr">2. Les fleurs apparaissent.</p><button class="choice" onclick="mark(this,'spring')">🌷 Le printemps</button><button class="choice" onclick="mark(this,'autumn')">🍂 L'automne</button><p class="fr">3. Les feuilles tombent.</p><button class="choice" onclick="mark(this,'autumn')">🍂 L'automne</button><button class="choice" onclick="mark(this,'spring')">🌷 Le printemps</button><p id="fb" class="feedback"></p></div>`;else if(key==='listen')v.innerHTML=`<span class="pill">05 · اسمع وتحدث</span><h2>🎧 اسمع ثم كوّن جملة</h2><div class="cards">${seasons.map(s=>`<article class="card"><div class="fr">${s.fr} ${snd(s.fr)}</div><p class="muted">${s.ar}</p><div class="phrase"><span class="fr">${s.sentence}</span>${snd(s.sentence)}</div><p>🔁 اسمع الاسم، كرره، ثم اقرأ الجملة بصوتك.</p></article>`).join('')}</div>`;else if(key==='practice')v.innerHTML=`<span class="pill">06 · التدريب</span><h2>✍️ تدريب متدرج</h2><div class="cards"><article class="card"><h3>اختر au أو en</h3><p class="fr">___ printemps</p><button class="choice" onclick="mark(this,'au')">au</button><button class="choice" onclick="mark(this,'en')">en</button><p class="fr">___ été</p><button class="choice" onclick="mark(this,'en')">en</button><button class="choice" onclick="mark(this,'au')">au</button><p id="p1" class="feedback"></p></article><article class="card"><h3>رتّب الفصول</h3><p>اضغط بالترتيب: printemps → été → automne → hiver</p><div id="order"></div><button class="choice" onclick="order('printemps')">1 🌷</button><button class="choice" onclick="order('été')">2 ☀️</button><button class="choice" onclick="order('automne')">3 🍂</button><button class="choice" onclick="order('hiver')">4 ❄️</button><p id="p2" class="feedback"></p></article></div>`;else if(key==='media')v.innerHTML=`<span class="pill">07 · الوسائط</span><h2>🎬 الوسائط التعليمية</h2><div class="cards">${seasons.map(s=>`<article class="card"><div class="art" style="font-size:55px">${s.art}</div><h3>${s.fr}</h3><p>${s.sentence}</p>${snd(s.sentence)}</article>`).join('')}</div><p class="muted">الوسائط هنا تدعم المعنى والنطق ولا تعيد صفحة المفردات نفسها.</p>`;else if(key==='games')v.innerHTML=`<span class="pill">08 · الألعاب</span><h2>🎮 لعبة طابق الصورة بالجملة</h2><div class="card"><p>أي جملة تناسب ❄️؟</p><button class="choice" onclick="game(true)">En hiver, il fait froid.</button><button class="choice" onclick="game(false)">En hiver, il fait chaud.</button><p>وأي جملة تناسب ☀️؟</p><button class="choice" onclick="game(true)">En été, il fait chaud.</button><button class="choice" onclick="game(false)">En été, il fait froid.</button><p id="game" class="feedback"></p></div>`;else if(key==='assessment')v.innerHTML=`<span class="pill">09 · التقييم</span><h2>🏆 التقييم الرسمي للدرس</h2><p>لا توجد أسئلة مخترعة هنا؛ يتم استخدام ملف التقييم الإلكتروني الرسمي المرتبط بالدرس الأول.</p><iframe class="exam" src="data/lessons/grade-4/source/4eme_Complet/01_Les_saisons/04_examen_electronique_les_saisons.html" title="Évaluation officielle Les saisons"></iframe><a class="btn" target="_blank" href="data/lessons/grade-4/source/4eme_Complet/01_Les_saisons/04_examen_electronique_les_saisons.html">فتح التقييم مستقلًا</a>`;else v.innerHTML=`<span class="pill">10 · بعد الرحلة</span><h2>📚 مرجع مراجعة Les saisons</h2><div class="referenceBox"><h3>خلاصة بصرية سريعة</h3><div class="cards">${seasons.map(s=>`<article class="card"><div style="font-size:42px">${s.art}</div><h3>${s.fr}</h3><p class="muted">${s.months}</p><p class="fr">${s.sentence}</p>${snd(s.fr)}</article>`).join('')}</div><hr><h3>قاعدة الفصول</h3><p class="fr">au printemps · en été · en automne · en hiver</p><p class="muted">هذه الصفحة هي مرجع مراجعة مبسط؛ أما المرجع الأصلي فيظل محفوظًا داخل ملفات الدرس.</p><a class="btn light" target="_blank" href="data/lessons/grade-4/source/4eme_Complet/01_Les_saisons/02_reference_les_saisons.docx">فتح المرجع الأصلي</a></div>`}function mark(el,val){el.parentElement.querySelectorAll('.choice').forEach(x=>x.disabled=true);document.getElementById('fb')?.replaceChildren(document.createTextNode(val==='winter'||val==='spring'||val==='autumn'||val==='au'||val==='en'?'✅ تم اختيار الإجابة — راجع التغذية الراجعة في السؤال التالي.':'❌ حاول مرة أخرى.'))}let seq=[];function order(x){seq.push(x);document.getElementById('order').textContent=seq.join(' → ');if(seq.length===4){document.getElementById('p2').textContent=seq.join(',')==='printemps,été,automne,hiver'?'🎉 الترتيب صحيح!':'🔄 أعد المحاولة بالترتيب الصحيح.';seq=[]}}function game(ok){document.getElementById('game').textContent=ok?'🎉 صحيح!':'❌ حاول مرة أخرى.'}render('start');</script></body></html>
