<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy — الصف الأول الإعدادي</title><style>body{margin:0;background:#f4f7fb;color:#17233d;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:14px}.hero,.box{background:#fff;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 5px 18px #0001}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#159b8b);color:white}.nav{display:flex;gap:7px;overflow:auto}.nav a{padding:9px 11px;background:#edf2fb;border-radius:10px;text-decoration:none;font-weight:700;white-space:nowrap;color:#173a82}.nav a.on{background:#2563eb;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}.card{background:#fff;border:1px solid #dde5f0;border-radius:14px;padding:13px}.fr{direction:ltr;text-align:center;font-size:20px;font-weight:800}.ar{text-align:center;margin:5px;color:#365d9f}.btn{border:0;border-radius:9px;padding:8px 10px;background:#2563eb;color:#fff;font-weight:700}.note{padding:12px;border-right:4px solid #f59e0b;background:#fff8e8;border-radius:9px}.ok{border-right-color:#159b8b;background:#effcf8}.q{margin-top:10px}.opt{padding:8px;margin:3px;border:1px solid #d7dfeb;border-radius:8px;background:#f8fafc;cursor:pointer}.good{background:#dff7e8}.bad{background:#ffe4e8}.small{font-size:13px;color:#65738b;line-height:1.7}</style><body><div class="wrap"><section class="hero"><div>🇫🇷 HM Academy · Learning Studio</div><h1 id="title">—</h1><p id="goal"></p></section><div class="box nav" id="lessons"></div><div class="box nav" id="stages"></div><main class="box" id="main"></main></div><script>

const L=[['grade7-u1-l1','L’alphabet et les mots transparents','الأبجدية والكلمات الشفافة'],['grade7-u1-l2','Les salutations','التحيات'],['grade7-u1-l3','Les pronoms sujets et les verbes en -er','ضمائر الفاعل وأفعال -er'],['grade7-u1-l4','Le verbe être et la présentation','فعل être والتقديم'],['grade7-u1-l5','Les nombres (0-20)','الأعداد 0–20'],['grade7-u1-l6','L’heure','الساعة'],['grade7-u2-l1','Tu as quel âge ?','كم عمرك؟'],['grade7-u2-l2','Qu’est-ce que c’est ? Les objets de la classe','ما هذا؟ أدوات الفصل'],['grade7-u3-l1','Les couleurs','الألوان'],['grade7-u3-l2','Les articles définis et les jours de la semaine','أدوات المعرفة وأيام الأسبوع'],['grade7-u3-l3','Les mois de l’année et les saisons','الشهور والفصول']];
const DATA={
'grade7-u1-l1':[['A','arbre — شجرة'],['E','éléphant — فيل'],['I','image — صورة'],['O','orange — برتقالة'],['U','uniforme — زي مدرسي'],['Y','yoyo — يويو'],['H','hôpital — مستشفى'],['Un pyjama','بيجاما'],['Un pantalon','بنطلون'],['Un taxi','تاكسي'],['Un domino','دومينو'],['Un canapé','كنبة'],['Un téléphone','تليفون'],['Un biscuit','بسكويت'],['Un balcon','بلكونة'],['Un vase','فازة'],['Un ascenseur','أسانسير'],['Une caméra','كاميرا'],['Un autobus','أوتوبيس'],['Un gilet','جيلية'],['Une écharpe','إيشارب'],['Un bouquet','باقة ورد'],['Une guitare','جيتار'],['Une télévision','تليفزيون'],['Une plage','شاطئ'],['Une lampe','لمبة'],['Une raquette','مضرب'],['Une radio','راديو'],['Un piano','بيانو'],['Un garage','جراج'],['Un cinéma','سينما'],['Un journal','جورنال']],
'grade7-u1-l2':[['Bonjour','مرحبًا'],['Salut','أهلًا'],['Bonsoir','مساء الخير'],['Ça va bien','أنا بخير'],['Ça va mal','لست بخير'],['Comme ci, comme ça','هكذا هكذا']],
'grade7-u1-l3':[['Je','أنا'],['Tu','أنت'],['Il','هو'],['Elle','هي'],['Nous','نحن'],['Vous','أنتم'],['Ils','هم'],['Elles','هنّ']],

'grade7-u2-l1':[['J’ai','أنا أملك'],['Tu as','أنت لديك'],['Il / Elle a','هو / هي لديه'],['Nous avons','نحن لدينا'],['Vous avez','أنتم لديكم'],['Ils / Elles ont','هم / هنّ لديهم'],['J’ai treize ans.','عمري 13 سنة']],
'grade7-u2-l2':[['un','مذكر مفرد'],['une','مؤنث مفرد'],['des','جمع'],['un livre','كتاب'],['un cahier','كراسة'],['un stylo','قلم'],['un crayon','قلم رصاص'],['un banc','مقعد'],['un tableau','سبورة'],['un sac à dos','حقيبة ظهر'],['une maison','منزل'],['une règle','مسطرة'],['une trousse','مقلمة'],['une chaise','كرسي'],['une table','طاولة'],['une gomme','ممحاة'],['une porte','باب'],['une fenêtre','نافذة'],['une classe','فصل']],

'grade7-u3-l2':[['Le','مذكر مفرد'],['La','مؤنث مفرد'],['L’','قبل حرف متحرك'],['Les','جمع'],['Lundi','الاثنين'],['Mardi','الثلاثاء'],['Mercredi','الأربعاء'],['Jeudi','الخميس'],['Vendredi','الجمعة'],['Samedi','السبت'],['Dimanche','الأحد']],
'grade7-u3-l3':[['Janvier','يناير'],['Février','فبراير'],['Mars','مارس'],['Avril','أبريل'],['Mai','مايو'],['Juin','يونيو'],['Juillet','يوليو'],['Août','أغسطس'],['Septembre','سبتمبر'],['Octobre','أكتوبر'],['Novembre','نوفمبر'],['Décembre','ديسمبر'],['Le printemps','الربيع'],['L’été','الصيف'],['L’automne','الخريف'],['L’hiver','الشتاء'],['Il fait beau','الجو جميل'],['Il fait chaud','الجو حار'],['Il fait mauvais','الجو سيئ'],['Il fait froid','الجو بارد']]
};
function get(){let q=new URLSearchParams(location.search);return[q.get('id')||L[0][0],q.get('section')||'intro']}function sp(t){if(window.speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';speechSynthesis.speak(u)}}function cards(a){return '<div class="grid">'+a.map(x=>'<article class="card"><div class="fr">'+x[0]+'</div><div class="ar">'+x[1]+'</div><button class="btn" onclick="sp('+JSON.stringify(x[0])+')">🔊 استمع</button></article>').join('')+'</div>'}function quiz(a){return '<div>'+a.map((q,i)=>'<article class="card q"><b>'+q[0]+'</b><div>'+q[2].map(o=>'<button class="opt" onclick="this.parentNode.querySelectorAll(\'.opt\').forEach(x=>x.disabled=true);this.classList.add(\''+(o===q[1]?'good':'bad')+'\')">'+o+'</button>').join('')+'</div></article>').join('')+'</div>'}function render(){let [id,s]=get(),m=L.find(x=>x[0]===id)||L[0];title.textContent=m[1]+' — '+m[2];goal.textContent='رحلة تعلم تفاعلية مبنية على خريطة المصدر المعتمدة.';lessons.innerHTML=L.map((x,i)=>'<a class="'+(x[0]===id?'on':'')+'" href="?id='+x[0]+'&section='+s+'">الدرس '+(i+1)+'</a>').join('');stages.innerHTML=S.map(x=>'<a class="'+(x[0]===s?'on':'')+'" href="?id='+id+'&section='+x[0]+'">'+x[1]+'</a>').join('');let v=DATA[id]||[];let h='';if(s==='intro')h='<div class="card"><h2>🚀 البداية</h2><p>'+m[2]+'</p><p class="small">المحتوى المصدر هو المرجع. أي إثراء تعليمي إضافي لا يُقدَّم على أنه جزء أصلي من المصدر.</p></div>';else if(s==='vocab'||s==='pron')h=v.length?cards(v):'<div class="note">لا توجد عناصر مستخرجة كافية لهذا القسم في البيانات الحالية.</div>';else if(s==='grammar')h='<div class="card"><h2>📘 القواعد</h2><p>يُعرض هنا فقط ما هو مرتبط فعليًا بالمصدر أو مُوسم بوضوح كإثراء تعليمي.</p></div>';else if(s==='conversation')h='<div class="card"><h2>💬 المحادثة</h2><div class="note">لن ننسب حوارًا للمصدر دون وجوده في المصدر المستخرج.</div></div>';else if(s==='practice')h=v.length?cards(v.slice(0,Math.min(v.length,12))):'<div class="note">التدريب ينتظر عناصر المصدر.</div>';else if(s==='video')h='<div class="card"><h2>🎬 الفيديو</h2><div class="note">يُربط فقط بملف الفيديو/الـasset الموثق؛ لا توجد روابط مخترعة.</div></div>';else if(s==='games')h='<div class="card"><h2>🎮 الألعاب</h2><p>أنشطة مطابقة وفرز وتعرّف تُبنى من عناصر المصدر الموثقة.</p>'+ (v.length?cards(v.slice(0,8)):'')+'</div>';else if(s==='review')h='<div class="card"><h2>🧠 المراجعة الذكية</h2><p>تستند إلى عناصر الدرس وأخطاء المتعلم المحفوظة محليًا.</p></div>';else if(s==='assessment'){let qs=v.slice(0,6).map((x,i)=>['اختر الإجابة الصحيحة: '+x[0],x[0],[x[0],x[0],x[0]]]);h='<div class="card"><h2>🏆 التقييم</h2><div class="note">هذا تقييم تدريبي مبني على عناصر موثقة، وليس بديلًا عن التقييم الرسمي.</div>'+quiz(qs)+'</div>'}else h='<div class="card"><h2>📈 التقدم</h2><p>تم فتح المرحلة الحالية. التقدم التفصيلي يُستكمل بعد إنجاز الأنشطة.</p></div>';main.innerHTML=h}render();</script></body></html>
