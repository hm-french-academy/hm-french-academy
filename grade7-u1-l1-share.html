<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>HM Academy | الدرس الأول</title>
<style>
html,body{margin:0;padding:0;background:#eef4ff;font-family:Arial,"Noto Sans Arabic",sans-serif}
#lesson{width:100%;min-height:100vh;border:0;display:block}
.loading{padding:30px;text-align:center;color:#667085}
</style>
</head>
<body>
<div id="loading" class="loading">جاري فتح الدرس…</div>
<iframe id="lesson" title="الدرس الأول"></iframe>
<script>
(function(){
  const p=new URLSearchParams(location.search);
  const section=p.get('section')||'introduction';
  if(section==='smart-review'){
    location.replace('grade7-smart-review.html?lesson=grade7-u1-l1');
    return;
  }
  const q=new URLSearchParams();
  q.set('id','grade7-u1-l1');
  q.set('section',section);
  const frame=document.getElementById('lesson');
  frame.src='grade7-u1-l1-final.html?'+q.toString();
  frame.addEventListener('load',function(){
    document.getElementById('loading').style.display='none';
    try{
      const d=this.contentDocument;
      const s=d.createElement('style');
      s.textContent=[
        'a[href*="index.html"]{display:none!important}',
        'a[href*="home"]{display:none!important}',
        'a[href*="homepage"]{display:none!important}',
        'a[href*="main"]{display:none!important}',
        'a[href*="grade7.html"]{display:none!important}',
        'a[href*="grades"]{display:none!important}',
        'a[href*="grade7-home"]{display:none!important}'
      ].join('');
      d.head.appendChild(s);
    }catch(e){}
  });
})();
</script>
</body>
</html>
