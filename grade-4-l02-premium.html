<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HM Academy | Les chiffres — الدرس الثاني</title><style>body{margin:0;background:#f4f7fb;color:#20354d;font-family:Arial,Cairo,sans-serif}.wrap{max-width:1120px;margin:auto;padding:14px}.top,.hero,.page{background:#fff;border-radius:22px;padding:20px;margin-bottom:12px;box-shadow:0 8px 28px #20354d12}.hero{background:linear-gradient(135deg,#e4f6ff,#fff0f3)}.nav{display:flex;gap:7px;overflow:auto;background:#fff;padding:10px;border-radius:18px;position:sticky;top:0;z-index:5}.tab,.btn,.choice{border:0;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer}.tab{background:#edf2f7;white-space:nowrap}.tab.on,.btn{background:#4169e1;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{border:1px solid #dce5ee;border-radius:18px;padding:17px;background:#fff}.icon{height:120px;border-radius:15px;background:linear-gradient(135deg,#edf7ff,#fff3f4);display:grid;place-items:center;font-size:58px}.fr{direction:ltr;text-align:left;font-size:22px;font-weight:900}.muted{color:#65778a;line-height:1.8}.choice{display:block;width:100%;margin:7px 0;background:#fff;border:1px solid #dce5ee;text-align:right}.choice.ok{background:#eaf7ee}.choice.no{background:#fff0f0}.feedback{min-height:22px;font-weight:900}.rule{background:#f7faff;border-right:5px solid #4169e1;border-radius:14px;padding:14px;margin:10px 0;line-height:1.8}.video{width:100%;aspect-ratio:16/9;border:0;border-radius:18px;background:#111}@media(max-width:600px){.wrap{padding:8px}.hero,.page{padding:15px}}</style></head><body><main class="wrap"><header class="top"><a href="grade-4.html">← الصف الرابع</a><span>HM Academy · Premium Learning Studio</span></header><section class="hero"><b>Le français · 4e année · Leçon 02</b><h1>Les chiffres · الأرقام</h1><p>من التعرف على الأرقام إلى فهمها واستخدامها في مواقف حقيقية، بنفس بنية الدرس الثالث.</p></section><nav id="nav" class="nav"></nav><section id="page" class="page"></section></main><script>(function(){const N=[['0','zéro'],['1','un'],['2','deux'],['3','trois'],['4','quatre'],['5','cinq'],['6','six'],['7','sept'],['8','huit'],['9','neuf'],['10','dix'],['11','onze'],['12','douze'],['13','treize'],['14','quatorze'],['15','quinze'],['16','seize'],['17','dix-sept'],['18','dix-huit'],['19','dix-neuf'],['20','vingt'],['21','vingt et un'],['22','vingt-deux'],['23','vingt-trois'],['24','vingt-quatre'],['25','vingt-cinq'],['26','vingt-six'],['27','vingt-sept'],['28','vingt-huit'],['29','vingt-neuf'],['30','trente']],root='data/lessons/grade-4/source/4eme_Complet/02_Les_chiffres/',tabs=[['start','🚀 البداية'],['vocab','🖼️ المفردات'],['under','🧠 افهم'],['rules','📘 القواعد'],['interact','🤝 تفاعل'],['talk','💬 المحادثة'],['practice','✍️ التدريب'],['media','🎬 الفيديو'],['games','🎮 مركز الألعاب'],['test','🏆 التقييم'],['after','📚 بعد الرحلة']],nav=document.getElementById('nav'),page=document.getElementById('page');nav.innerHTML=tabs.map(x=>`<button class="tab" data-s="${x[0]}">${x[1]}</button>`).join('');function speak(t){if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}function head(a,b,c){return `<span>${a}</span><h2>${b}</h2><p class="muted">${c}</p>`}function opts(a){return a.map(x=>`<button class="choice" data-ok="${x[1]}">${x[0]}</button>`).join('')}function bind(){page.querySelectorAll('[data-speak]').forEach(x=>x.onclick=()=>speak(x.dataset.speak));page.querySelectorAll('.choice').forEach(x=>x.onclick=()=>{const c=x.closest('.card'),ok=x.dataset.ok==='true';c.querySelectorAll('.choice').forEach(y=>y.disabled=true);x.classList.add(ok?'ok':'no');c.querySelector('.feedback').textContent=ok?'✅ صحيح!':'❌ ليست الإجابة المناسبة.'})}function render(s){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.s===s));let h='';if(s==='start')h=head('01','ابدأ الرحلة','مسار متدرج: مفردات → فهم → قواعد → تطبيق → محادثة → تدريب → فيديو → ألعاب → تقييم → بعد الرحلة.')+`<div class="grid"><article class="card"><div class="icon">🔢</div><h3>هدف الدرس</h3><p>قراءة وسماع وتمييز وترتيب الأرقام من 0 إلى 30.</p><button class="btn" data-go="vocab">ابدأ</button></article><article class="card"><div class="icon">🧭</div><h3>المصدر الأصلي</h3><p>تم تحليل ملف الدرس الأصلي والمرجع والتقييم والاختبار الإلكتروني داخليًا، ثم إعادة تقديم المحتوى داخل هذا الاستوديو.</p></article></div>`;if(s==='vocab')h=head('02','المفردات','في التعلم المباشر يمكن رؤية الرقم وكلمته معًا. هذا الربط لا يظهر في أسئلة الاختبار.')+`<div class="grid">${N.map(x=>`<article class="card"><div class="icon"><b>${x[0]}</b></div><h3 class="fr">${x[1]}</h3><button class="btn" data-speak="${x[1]}">🔊 اسمع</button></article>`).join('')}</div>`;if(s==='under')h=head('03','افهم','افهم التسلسل وبناء الأعداد قبل أن تبدأ الأسئلة.')+`<div class="grid"><article class="card"><h3>0–10</h3><p class="fr">zéro · un · deux · trois · quatre · cinq · six · sept · huit · neuf · dix</p></article><article class="card"><h3>11–20</h3><p class="fr">onze · douze · treize · quatorze · quinze · seize · dix-sept · dix-huit · dix-neuf · vingt</p></article><article class="card"><h3>21–30</h3><p class="fr">vingt et un · vingt-deux · vingt-trois · vingt-quatre · vingt-cinq · vingt-six · vingt-sept · vingt-huit · vingt-neuf · trente</p></article></div>`;if(s==='rules')h=head('04','القواعد','ملاحظة مهمة: الأرقام هنا لا تتغير بحسب الجنس؛ الهدف هو قراءة الشكل الفرنسي والربط بين الرقم والنطق والكتابة.')+`<div class="rule"><b>الأعداد المركبة</b><br><span class="fr">21 = vingt et un</span><br><span class="fr">22 = vingt-deux</span><br><span class="fr">27 = vingt-sept</span></div><div class="rule"><b>من 17 إلى 19</b><br><span class="fr">dix-sept · dix-huit · dix-neuf</span></div><div class="rule"><b>من 20 إلى 30</b><br><span class="fr">vingt · vingt et un · ... · trente</span></div>`;if(s==='interact')h=head('05','تفاعل وتطبيق','السؤال لا يكشف الكلمة التي نريد من الطالب استنتاجها.')+`<div class="grid"><article class="card"><h3>🔎 أكبر من 7 وأصغر من 9؟</h3>${opts([['sept',false],['huit',true],['neuf',false]])}<p class="feedback"></p></article><article class="card"><h3>ما العدد الذي يأتي بعد dix-neuf؟</h3>${opts([['18',false],['20',true],['21',false]])}<p class="feedback"></p></article><article class="card"><h3>ما العدد الذي يأتي قبل vingt-cinq؟</h3>${opts([['23',false],['24',true],['26',false]])}<p class="feedback"></p></article><article class="card"><h3>أي كلمة تعني 18؟</h3>${opts([['dix-sept',false],['dix-huit',true],['dix-neuf',false]])}<p class="feedback"></p></article><article class="card"><h3>ما العدد بين 28 و30؟</h3>${opts([['27',false],['29',true],['30',false]])}<p class="feedback"></p></article><article class="card"><h3>أي كلمة تعني 21؟</h3>${opts([['vingt et un',true],['vingt-deux',false],['vingt-trois',false]])}<p class="feedback"></p></article></div>`;if(s==='talk')h=head('06','المحادثة','مواقف قصيرة تستخدم الأرقام بدل إعادة قائمة المفردات.')+`<article class="card">${[['Quel âge as-tu ?','J’ai quinze ans.'],['Quel est le numéro ?','C’est le sept.'],['Quel est le numéro ?','Dix-huit.'],['Tu as vingt ans ?','Non, j’ai quinze ans.']].map(x=>`<p><b>${x[0]}</b><br><span class="fr">${x[1]}</span> <button class="btn" data-speak="${x[1]}">🔊</button></p>`).join('')}</article>`;if(s==='practice')h=head('07','التدريب','تطبيق مستقل؛ لا توجد الإجابة في نص السؤال.')+`<div class="grid">${[['ما كتابة 7 بالفرنسية؟',['six','sept','huit'],'sept'],['ما كتابة 12؟',['douze','deux','treize'],'douze'],['ما كتابة 15؟',['seize','quinze','cinq'],'quinze'],['ما كتابة 18؟',['dix-neuf','dix-huit','huit'],'dix-huit'],['ما الرقم بين 24 و26؟',['23','25','27'],'25'],['ما كتابة 29؟',['vingt-huit','vingt-neuf','trente'],'vingt-neuf']].map(x=>`<article class="card"><h3>${x[0]}</h3>${opts(x[1].map(o=>[o,o===x[2]]))}<p class="feedback"></p></article>`).join('')}</div>`;if(s==='media')h=head('08','الفيديو','الفيديو الأصلي للدرس، داخل الصفحة وليس كملف منفصل.')+`<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/zjinmuX25_E?rel=0" title="Les chiffres" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe></div>`;if(s==='games')h=head('09','مركز الألعاب','أربع ألعاب، وكل لعبة تحتوي على عدة جولات فعلية ومهارة مختلفة.')+`<div class="grid"><article class="card"><h3>🔎 محقق الرقم</h3>${[['أكبر من 7 وأصغر من 9؟',['sept','huit','neuf'],'huit'],['بين 14 و16؟',['13','15','17'],'15'],['بين 28 و30؟',['27','29','30'],'29']].map(x=>`<p><b>${x[0]}</b>${opts(x[1].map(o=>[o,o===x[2]]))}</p>`).join('')}<p class="feedback"></p></article><article class="card"><h3>➡️ السابق والتالي</h3>${[['بعد 19؟',['18','20','21'],'20'],['قبل 25؟',['23','24','26'],'24'],['بعد 29؟',['28','30','27'],'30']].map(x=>`<p><b>${x[0]}</b>${opts(x[1].map(o=>[o,o===x[2]]))}</p>`).join('')}<p class="feedback"></p></article><article class="card"><h3>🎧 اسمع واختر</h3>${[['huit',['7','8','9'],'8'],['quinze',['14','15','16'],'15'],['vingt-deux',['21','22','23'],'22']].map(x=>`<p><button class="btn" data-speak="${x[0]}">🔊 استمع</button>${opts(x[1].map(o=>[o,o===x[2]]))}</p>`).join('')}<p class="feedback"></p></article><article class="card"><h3>🧠 تحدي المطابقة</h3>${[['13',['treize','quatorze','douze'],'treize'],['26',['vingt-cinq','vingt-six','vingt-sept'],'vingt-six'],['30',['vingt-neuf','trente','vingt-huit'],'trente']].map(x=>`<p><b>${x[0]}</b>${opts(x[1].map(o=>[o,o===x[2]]))}</p>`).join('')}<p class="feedback"></p></article></div>`;if(s==='test')h=head('10','التقييم الرسمي','لا نعرض ملفًا للتحميل. التقييم الإلكتروني الأصلي يُعرض داخل HM Academy، ومحتواه لا يُعاد اختراعه هنا.')+`<article class="card"><h3>🏆 التقييم الإلكتروني الرسمي</h3><iframe src="${root}04_examen_electronique_les_chiffres.html" style="width:100%;height:700px;border:1px solid #dce5ee;border-radius:18px" title="التقييم الرسمي"></iframe></article>`;if(s==='after')h=head('11','بعد الرحلة','خاتمة مثل الدرس الثالث: استدعاء ذاتي، تحدٍ أخير، ثم تحقق من الإتقان. لا يوجد زر لتحميل المرجع.')+`<div class="grid"><article class="card"><h3>🎯 ماذا أتقنت؟</h3><p>□ أميز الأرقام من 0 إلى 30.<br>□ أرتب الأرقام.<br>□ أتعرف على الرقم عند سماعه.<br>□ أربط الرقم بكلمته.</p></article><article class="card"><h3>🔁 تحدٍ أخير</h3><p>أكبر من 7 وأصغر من 9؟</p>${opts([['sept',false],['huit',true],['neuf',false]])}<p class="feedback"></p></article><article class="card"><h3>🧭 الخطوة التالية</h3><p>إذا أخطأت، ارجع إلى «افهم» ثم أعد «التدريب» قبل الانتقال إلى الدرس التالي.</p><button class="btn" data-go="under">العودة إلى افهم</button></article></div>`;page.innerHTML=h;bind();page.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>render(x.dataset.go))}render('start');nav.onclick=e=>{if(e.target.dataset.s)render(e.target.dataset.s)};})();</script></body></html>
