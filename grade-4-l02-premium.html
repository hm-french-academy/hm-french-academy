<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy · Les chiffres</title><style>body{margin:0;background:#f4f7fb;color:#17324d;font-family:Arial,Cairo,sans-serif}.w{max-width:1100px;margin:auto;padding:14px}.b{background:#fff;border-radius:22px;padding:20px;margin:10px 0}.hero{background:linear-gradient(135deg,#e8f3ff,#fff0f4)}.nav{display:flex;gap:7px;overflow:auto;position:sticky;top:0;background:#fff;padding:9px;z-index:5}.nav button,.btn,.c{border:0;border-radius:12px;padding:10px 13px;font-weight:900;cursor:pointer}.nav button{background:#edf2f7;white-space:nowrap}.on,.btn{background:#4169e1!important;color:#fff}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.card{border:1px solid #dce5ee;border-radius:17px;padding:15px}.pic{height:110px;border-radius:14px;background:#eef7ff;display:grid;place-items:center;font-size:48px}.fr{direction:ltr;text-align:left;font-size:20px;font-weight:900}.tag{display:inline-block;background:#e7f3ff;color:#1260a8;padding:5px 10px;border-radius:99px;font-weight:900}.muted{color:#65778a;line-height:1.8}.c{display:block;width:100%;margin:6px 0;background:#fff;border:2px solid #dce5ee;text-align:right}.ok{background:#eaf7ee!important}.no{background:#fff0f0!important}.fb{min-height:22px;font-weight:900}.video{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#111}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.game{padding:15px;background:#f8fbfd;border:1px solid #dce5ee;border-radius:18px}.game h3{margin-top:0}.score{font-weight:900;color:#1260a8}.step{padding:12px;border-radius:14px;background:#f7faff;margin:8px 0}.official{border-right:5px solid #4169e1}.check{display:flex;gap:8px;align-items:center;margin:8px 0}@media(max-width:600px){.nav{font-size:12px}}</style><body><main class="w"><header class="b"><a href="grade-4.html">← الصف الرابع</a> · HM Academy</header><section class="b hero"><span class="tag">Leçon 02 · Les chiffres</span><h1>🔢 الأرقام 0–30</h1><p>تعلم وفهم وتطبيق ثم تقييم مستقل ومراجعة ذكية.</p></section><nav id="nav" class="nav"></nav><section id="page" class="b"></section></main><script>(function(){const N=[['0','zéro','صفر'],['1','un','واحد'],['2','deux','اثنان'],['3','trois','ثلاثة'],['4','quatre','أربعة'],['5','cinq','خمسة'],['6','six','ستة'],['7','sept','سبعة'],['8','huit','ثمانية'],['9','neuf','تسعة'],['10','dix','عشرة'],['11','onze','أحد عشر'],['12','douze','اثنا عشر'],['13','treize','ثلاثة عشر'],['14','quatorze','أربعة عشر'],['15','quinze','خمسة عشر'],['16','seize','ستة عشر'],['17','dix-sept','سبعة عشر'],['18','dix-huit','ثمانية عشر'],['19','dix-neuf','تسعة عشر'],['20','vingt','عشرون'],['21','vingt et un','واحد وعشرون'],['22','vingt-deux','اثنان وعشرون'],['23','vingt-trois','ثلاثة وعشرون'],['24','vingt-quatre','أربعة وعشرون'],['25','vingt-cinq','خمسة وعشرون'],['26','vingt-six','ستة وعشرون'],['27','vingt-sept','سبعة وعشرون'],['28','vingt-huit','ثمانية وعشرون'],['29','vingt-neuf','تسعة وعشرون'],['30','trente','ثلاثون']],R='data/lessons/grade-4/source/4eme_Complet/02_Les_chiffres/',S=[['home','🚀 البداية'],['vocab','🔢 المفردات'],['under','🧠 افهم'],['inter','🤝 تفاعل'],['talk','💬 المحادثة'],['practice','✍️ التدريب'],['media','🎬 الفيديو'],['games','🎮 مركز الألعاب'],['assessment','🏆 التقييم'],['smart','🧠 المراجعة الذكية'],['after','📚 بعد الرحلة']],nav=document.getElementById('nav'),page=document.getElementById('page');nav.innerHTML=S.map(x=>`<button data-s="${x[0]}">${x[1]}</button>`).join('');function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.8;speechSynthesis.speak(u)}function head(a,b,c){return `<span class="tag">${a}</span><h2>${b}</h2><p class="muted">${c}</p>`}function q(t,o,c){return `<article class="card"><h3>${t}</h3>${o.map(v=>`<button class="c" data-o="${v}" data-c="${c}">${v}</button>`).join('')}<p class="fb"></p></article>`}function render(s){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));let h='';if(s==='home')h=head('01','ابدأ رحلة الأرقام','المفردات → الفهم → التفاعل → المحادثة → التدريب → الفيديو → الألعاب → التقييم → المراجعة')+`<div class="g"><article class="card"><div class="pic">🔢</div><h3>هدف الدرس</h3><p>قراءة وسماع وتمييز وترتيب الأرقام من 0 إلى 30.</p></article><article class="card"><h3>مصادر المرحلة</h3><p>01_interactif_les_chiffres.html</p><p>02_reference_les_chiffres.docx</p><p>03_evaluation_les_chiffres.docx</p><p>04_examen_electronique_les_chiffres.html</p></article></div>`;if(s==='vocab')h=head('02','المفردات','الأرقام كاملة مع النطق.')+`<div class="g">${N.map(x=>`<article class="card"><div class="pic"><b>${x[0]}</b></div><h3 class="fr">${x[1]}</h3><p>${x[2]}</p><button class="btn" data-say="${x[1]}">🔊 اسمع</button></article>`).join('')}</div>`;if(s==='under')h=head('03','افهم','اربط الرقم بالكلمة وبالتسلسل.')+`<div class="g"><article class="card"><h3>0–10</h3><p class="fr">zéro · un · deux · trois · quatre · cinq · six · sept · huit · neuf · dix</p></article><article class="card"><h3>11–20</h3><p class="fr">onze · douze · treize · quatorze · quinze · seize · dix-sept · dix-huit · dix-neuf · vingt</p></article><article class="card"><h3>21–30</h3><p class="fr">vingt et un · vingt-deux · vingt-trois · vingt-quatre · vingt-cinq · vingt-six · vingt-sept · vingt-huit · vingt-neuf · trente</p></article></div>`;if(s==='inter')h=head('04','تفاعل','مواقف قصيرة تقيس الفهم، وليست نسخة من التدريب.')+`<div class="g">${q('رقم مكتوب: douze',['10','12','20'],'12')}${q('أي كلمة تعني 18؟',['dix-sept','dix-huit','dix-neuf'],'dix-huit')}${q('ما العدد الذي يأتي قبل vingt؟',['18','19','21'],'19')}${q('ما العدد الذي يأتي بعد vingt-neuf؟',['28','30','27'],'30')}${q('اختر الكلمة المطابقة للرقم 25',['vingt-cinq','vingt-six','quinze'],'vingt-cinq')}${q('أي زوج صحيح؟',['14 = quatorze','16 = quinze','17 = dix-huit'],'14 = quatorze')}</div>`;if(s==='talk')h=head('05','المحادثة','حوار وظيفي عن الأرقام والعمر والأرقام التعريفية.')+`<div class="g"><article class="card"><p>Quel est ton numéro ?</p><p class="fr">C’est le sept.</p><button class="btn" data-say="C’est le sept.">🔊</button></article><article class="card"><p>Quel âge as-tu ?</p><p class="fr">J’ai quinze ans.</p><button class="btn" data-say="J’ai quinze ans.">🔊</button></article><article class="card"><p>Quel est le numéro de la salle ?</p><p class="fr">Dix-huit.</p><button class="btn" data-say="Dix-huit.">🔊</button></article></div>`;if(s==='practice')h=head('06','التدريب','تدريب متعدد البنود؛ الإجابة لا تظهر مسبقًا.')+`<div class="g">${q('7 = ?',['six','sept','huit'],'sept')}${q('12 = ?',['douze','deux','treize'],'douze')}${q('15 = ?',['seize','quinze','cinq'],'quinze')}${q('18 = ?',['dix-neuf','dix-huit','huit'],'dix-huit')}${q('بين 24 و26؟',['23','25','27'],'25')}</div>`;if(s==='media')h=head('07','الفيديو الأصلي','الفيديو المثبت في manifest للدرس الثاني.')+`<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/zjinmuX25_E?rel=0" title="Les chiffres" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe></div>`;if(s==='games')h=head('08','مركز الألعاب','أربع ألعاب، وكل لعبة تحتوي على عدة جولات؛ لا نستخدم مثالًا واحدًا فقط.')+`<div class="g"><article class="game"><h3>🔎 محقق الرقم</h3><p>حدد العدد الذي تنطبق عليه القرائن.</p><div id="detect"></div></article><article class="game"><h3>➡️ الرقم التالي والسابق</h3><p>حدد العدد المطلوب من التسلسل.</p><div id="sequence"></div></article><article class="game"><h3>🎧 اسمع واختر</h3><p>استمع إلى الكلمة ثم اختر الرقم.</p><div id="listen"></div></article><article class="game"><h3>🧠 تحدي الذاكرة</h3><p>طابق الرقم مع كلمته الفرنسية.</p><div id="memory"></div></article></div>`;if(s==='assessment')h=head('09','التقييم الرسمي','هذه المحطة ليست بنك تدريب. نعرض الاختبار الرسمي في مسار مستقل، مع تعريف واضح للمصدر وتعليمات قبل البدء.')+`<article class="card official"><h3>🏆 الاختبار الإلكتروني الرسمي</h3><p>الملف المعتمد: <b>04_examen_electronique_les_chiffres.html</b></p><div class="step">1️⃣ راجع المفردات أولًا.<br>2️⃣ ابدأ الاختبار الرسمي دون الرجوع إلى التدريب.<br>3️⃣ النتيجة تخص التقييم الرسمي فقط.</div><a class="btn" target="_blank" href="${R}04_examen_electronique_les_chiffres.html">بدء التقييم الرسمي</a></article><article class="card"><h3>📚 المرجع المعتمد</h3><p>03_evaluation_les_chiffres.docx — مرجع التقييم وليس بديلًا عن الاختبار الإلكتروني.</p><a class="btn" target="_blank" href="${R}03_evaluation_les_chiffres.docx">فتح مرجع التقييم</a></article>`;if(s==='smart')h=head('10','المراجعة الذكية','مراجعة علاجية متعددة المهارات: قراءة، ترتيب، سماع، وتمييز. ليست نسخًا من التدريب.')+`<div class="g">${q('قراءة: 17 = ?',['dix-sept','dix-huit','dix-neuf'],'dix-sept')}${q('ترتيب: بين 19 و21؟',['18','20','22'],'20')}${q('تمييز: 23 = ?',['vingt-deux','vingt-trois','vingt-quatre'],'vingt-trois')}${q('اختيار الكلمة الصحيحة لـ 29',['vingt-huit','vingt-neuf','trente'],'vingt-neuf')}${q('أي عبارة صحيحة؟',['15 = quinze','16 = quinze','18 = dix-neuf'],'15 = quinze')}${q('أي عدد يسبق trente؟',['28','29','30'],'29')}</div>`;if(s==='after')h=head('11','بعد الرحلة','إغلاق تعليمي للدرس: استرجاع، إنتاج، تحقق ذاتي، ثم الرجوع للمصدر عند الحاجة.')+`<div class="g"><article class="card"><h3>🧠 1 — استرجع</h3><p>قل بصوت مرتفع: 8، 13، 17، 24، 29.</p><button class="btn" data-say="huit, treize, dix-sept, vingt-quatre, vingt-neuf">🔊 اسمع النموذج</button></article><article class="card"><h3>✍️ 2 — أنتج</h3><p>اكتب بالفرنسية: 6، 11، 20، 25، 30.</p></article><article class="card"><h3>🔍 3 — تحقق</h3><div class="check">☐ أستطيع قراءة 0–30.</div><div class="check">☐ أستطيع تمييز الرقم عند سماع الكلمة.</div><div class="check">☐ أستطيع تحديد العدد السابق والتالي.</div></article><article class="card"><h3>📖 4 — ارجع للمصدر</h3><p>إذا احتجت مراجعة إضافية، افتح المرجع الأصلي.</p><a class="btn" target="_blank" href="${R}02_reference_les_chiffres.docx">فتح المرجع الأصلي</a></article></div>`;page.innerHTML=h;bind();if(s==='games')games()}function bind(){page.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say));page.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{let z=b.closest('.card'),ok=b.dataset.o===b.dataset.c;z.querySelectorAll('[data-o]').forEach(x=>x.disabled=true);b.classList.add(ok?'ok':'no');z.querySelector('.fb').textContent=ok?'✅ صحيح':'❌ ليست الإجابة الصحيحة — حاول مرة أخرى.'})}function games(){let sets={detect:[['أكبر من 7 وأصغر من 9؟',['7','8','9'],'8'],['أكبر من 14 وأصغر من 16؟',['13','15','16'],'15'],['أكبر من 21 وأصغر من 23؟',['20','22','24'],'22'],['أكبر من 27 وأصغر من 29؟',['26','28','30'],'28']],sequence:[['بعد douze؟',['11','13','14'],'13'],['قبل vingt؟',['18','19','21'],'19'],['بعد vingt-quatre؟',['23','25','26'],'25'],['قبل trente؟',['28','29','30'],'29']],listen:[['sept',['7','17','27'],'7'],['douze',['2','12','20'],'12'],['dix-huit',['8','18','28'],'18'],['vingt-cinq',['15','25','26'],'25']],memory:[[['3','trois'],['12','douze'],['18','dix-huit'],['27','vingt-sept']]]};function run(type,idx=0){let box=document.getElementById(type),set=sets[type],item=set[idx%set.length];if(type==='memory'){let pairs=set[0],deck=pairs.flatMap(p=>[{v:p[0],k:p[0]},{v:p[1],k:p[0]}]).sort(()=>Math.random()-.5),first=null,matched=0;box.innerHTML=`<div class="g">${deck.map((d,i)=>`<button class="c mem" data-i="${i}" data-v="${d.k}">❓</button>`).join('')}</div><p class="fb"></p>`;let cards=[...box.querySelectorAll('.mem')];cards.forEach(c=>c.onclick=()=>{if(c.disabled||c.classList.contains('open'))return;c.textContent=deck[+c.dataset.i].v;c.classList.add('open');if(!first)first=c;else{if(first.dataset.v===c.dataset.v){first.disabled=c.disabled=true;matched++;first=null;if(matched===pairs.length)box.querySelector('.fb').textContent='🏆 أحسنت! أكملت جولة الذاكرة.'}else setTimeout(()=>{first.textContent=c.textContent='❓';first.classList.remove('open');c.classList.remove('open');first=null},600)}});return}box.innerHTML=`<p><b>جولة ${idx%set.length+1} من ${set.length}</b></p><p>${type==='listen'?'استمع إلى: ':''}${item[0]}</p>${type==='listen'?`<button class="btn" data-say="${item[0]}">🔊 اسمع</button>`:''}${item[1].map(v=>`<button class="c" data-go="${v}" data-c="${item[2]}">${v}${type==='detect'||type==='sequence'?' — '+N[+v][1]:''}</button>`).join('')}<p class="fb"></p><button class="btn" data-next>الجولة التالية ↻</button>`;box.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{let ok=b.dataset.go===b.dataset.c;box.querySelectorAll('[data-go]').forEach(x=>x.disabled=true);b.classList.add(ok?'ok':'no');box.querySelector('.fb').textContent=ok?'✅ صحيح':'❌ حاول من جديد'});box.querySelector('[data-next]').onclick=()=>run(type,idx+1);box.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say))}run('detect');run('sequence');run('listen');run('memory')}render('home');nav.addEventListener('click',e=>{if(e.target.dataset.s)render(e.target.dataset.s)});})();</script></body></html>
