<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy · Les chiffres</title><style>body{margin:0;background:#f4f7fb;color:#17324d;font-family:Arial,Cairo,sans-serif}.w{max-width:1100px;margin:auto;padding:14px}.b{background:#fff;border-radius:22px;padding:20px;margin:10px 0}.hero{background:linear-gradient(135deg,#e8f3ff,#fff0f4)}.nav{display:flex;gap:7px;overflow:auto;position:sticky;top:0;background:#fff;padding:9px;z-index:5}.nav button,.btn,.c{border:0;border-radius:12px;padding:10px 13px;font-weight:900;cursor:pointer}.nav button{background:#edf2f7;white-space:nowrap}.on,.btn{background:#4169e1!important;color:#fff}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.card{border:1px solid #dce5ee;border-radius:17px;padding:15px}.pic{height:110px;border-radius:14px;background:#eef7ff;display:grid;place-items:center;font-size:48px}.fr{direction:ltr;text-align:left;font-size:20px;font-weight:900}.tag{display:inline-block;background:#e7f3ff;color:#1260a8;padding:5px 10px;border-radius:99px;font-weight:900}.muted{color:#65778a}.c{display:block;width:100%;margin:6px 0;background:#fff;border:2px solid #dce5ee;text-align:right}.ok{background:#eaf7ee!important}.no{background:#fff0f0!important}.fb{min-height:22px;font-weight:900}.video{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#111}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.game{padding:15px;background:#f8fbfd;border:1px solid #dce5ee;border-radius:18px}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.memory button{min-height:70px;border:2px solid #dce5ee;border-radius:12px;background:#fff;font-weight:900}@media(max-width:600px){.memory{grid-template-columns:repeat(2,1fr)}}</style><body><main class="w"><header class="b"><a href="grade-4.html">← الصف الرابع</a> · HM Academy</header><section class="b hero"><span class="tag">Leçon 02 · Les chiffres</span><h1>🔢 الأرقام 0–30</h1><p>المصدر الأصلي للدرس الثاني داخل قالب مستقل.</p></section><nav id="nav" class="nav"></nav><section id="page" class="b"></section></main><script>(function(){const N=[['0','zéro','صفر'],['1','un','واحد'],['2','deux','اثنان'],['3','trois','ثلاثة'],['4','quatre','أربعة'],['5','cinq','خمسة'],['6','six','ستة'],['7','sept','سبعة'],['8','huit','ثمانية'],['9','neuf','تسعة'],['10','dix','عشرة'],['11','onze','أحد عشر'],['12','douze','اثنا عشر'],['13','treize','ثلاثة عشر'],['14','quatorze','أربعة عشر'],['15','quinze','خمسة عشر'],['16','seize','ستة عشر'],['17','dix-sept','سبعة عشر'],['18','dix-huit','ثمانية عشر'],['19','dix-neuf','تسعة عشر'],['20','vingt','عشرون'],['21','vingt et un','واحد وعشرون'],['22','vingt-deux','اثنان وعشرون'],['23','vingt-trois','ثلاثة وعشرون'],['24','vingt-quatre','أربعة وعشرون'],['25','vingt-cinq','خمسة وعشرون'],['26','vingt-six','ستة وعشرون'],['27','vingt-sept','سبعة وعشرون'],['28','vingt-huit','ثمانية وعشرون'],['29','vingt-neuf','تسعة وعشرون'],['30','trente','ثلاثون']],R='data/lessons/grade-4/source/4eme_Complet/02_Les_chiffres/',S=[['home','🚀 البداية'],['vocab','🔢 المفردات'],['under','🧠 افهم'],['inter','🤝 تفاعل'],['talk','💬 المحادثة'],['practice','✍️ التدريب'],['media','🎬 الفيديو'],['games','🎮 الألعاب'],['assessment','🏆 التقييم'],['smart','🧠 المراجعة الذكية'],['after','📚 بعد الرحلة']],nav=document.getElementById('nav'),page=document.getElementById('page');nav.innerHTML=S.map(x=>`<button data-s="${x[0]}">${x[1]}</button>`).join('');function say(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.8;speechSynthesis.speak(u)}function head(a,b,c){return `<span class="tag">${a}</span><h2>${b}</h2><p class="muted">${c}</p>`}function q(t,o,a){return `<article class="card"><h3>${t}</h3>${o.map(v=>`<button class="c" data-a="${v}" data-c="${a}">${v}</button>`).join('')}<p class="fb"></p></article>`}function render(s){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));let h='';if(s==='home')h=head('01','ابدأ رحلة الأرقام','كل محطة لها وظيفة مختلفة.')+`<div class="g"><article class="card"><div class="pic">🔢</div><h3>هدف الدرس</h3><p>قراءة وسماع وتمييز وترتيب الأرقام 0–30.</p><button class="btn" data-go="vocab">ابدأ الآن</button></article><article class="card"><h3>المصادر الأصلية</h3><p>01_interactif_les_chiffres.html</p><p>02_reference_les_chiffres.docx</p><p>03_evaluation_les_chiffres.docx</p><p>04_examen_electronique_les_chiffres.html</p></article></div>`;if(s==='vocab')h=head('02','المفردات','الأرقام كاملة من 0 إلى 30.')+`<div class="g">${N.map(x=>`<article class="card"><div class="pic"><b>${x[0]}</b></div><h3 class="fr">${x[1]}</h3><p>${x[2]}</p><button class="btn" data-say="${x[1]}">🔊</button></article>`).join('')}</div>`;if(s==='under')h=head('03','افهم','لاحظ الفرق بين الرقم والكلمة وبناء الأعداد المركبة.')+`<div class="g"><article class="card"><h3>0–10</h3><p class="fr">zéro · un · deux · trois · quatre · cinq · six · sept · huit · neuf · dix</p></article><article class="card"><h3>11–20</h3><p class="fr">onze · douze · treize · quatorze · quinze · seize · dix-sept · dix-huit · dix-neuf · vingt</p></article><article class="card"><h3>21–30</h3><p class="fr">vingt et un · vingt-deux · vingt-trois · vingt-quatre · vingt-cinq · vingt-six · vingt-sept · vingt-huit · vingt-neuf · trente</p></article></div>`;if(s==='inter')h=head('04','تفاعل','اختيارات موزعة وليست الإجابة الأولى دائمًا.')+`<div class="g">${q('تذكرة رقم 12',['treize','douze','deux'],'douze')}${q('العمر 15',['cinq','seize','quinze'],'quinze')}${q('dix-huit = ?',['8','19','18'],'18')}${q('بعد 29؟',['28','30','29'],'30')}</div>`;if(s==='talk')h=head('05','المحادثة','حوار متسق مع الأرقام، بلا خلط مع درس الساعة.')+`<article class="card"><p>👧 Quel est ton numéro ?<br><span class="fr">C’est le sept.</span> <button class="btn" data-say="C’est le sept.">🔊</button></p><p>👦 Quel âge as-tu ?<br><span class="fr">J’ai quinze ans.</span> <button class="btn" data-say="J’ai quinze ans.">🔊</button></p><p>👧 Quel est le numéro de la salle ?<br><span class="fr">Dix-huit.</span> <button class="btn" data-say="Dix-huit.">🔊</button></p></article>`;if(s==='practice')h=head('06','التدريب','تطبيق مستقل؛ لا توجد الإجابة مكتوبة تحت الصورة.')+`<div class="g">${q('7 = ?',['six','sept','huit'],'sept')}${q('12 = ?',['douze','deux','treize'],'douze')}${q('15 = ?',['seize','quinze','cinq'],'quinze')}${q('18 = ?',['dix-neuf','dix-huit','huit'],'dix-huit')}${q('بين 24 و26؟',['23','25','27'],'25')}</div>`;if(s==='media')h=head('07','الفيديو الأصلي','الفيديو الموجود في مصدر المرحلة للدرس الثاني.')+`<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/zjinmuX25_E?rel=0" title="Les chiffres" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe></div><p><a class="btn" target="_blank" href="https://www.youtube.com/watch?v=zjinmuX25_E">فتح الفيديو مباشرة</a></p>`;if(s==='games')h=head('08','مركز الألعاب','ألعاب مختلفة عن التدريب.')+`<div class="g"><article class="card"><button class="btn" data-g="detect">🔎 محقق الرقم</button></article><article class="card"><button class="btn" data-g="next">➡️ الرقم التالي</button></article><article class="card"><button class="btn" data-g="listen">🎧 اسمع واختر</button></article><article class="card"><button class="btn" data-g="memory">🧠 ذاكرة</button></article></div><div id="game" class="game">اختر لعبة.</div>`;if(s==='assessment')h=head('09','التقييم الرسمي','الاختبار الرسمي مستقل عن التدريب.')+`<div class="g"><article class="card"><h3>🏆 الاختبار الإلكتروني</h3><a class="btn" target="_blank" href="${R}04_examen_electronique_les_chiffres.html">فتح الاختبار الرسمي</a></article><article class="card"><h3>🧪 المصدر التفاعلي</h3><a class="btn" target="_blank" href="${R}01_interactif_les_chiffres.html">فتح المصدر الأصلي</a></article></div>`;if(s==='smart')h=head('10','المراجعة الذكية','تشخيص مختلف عن التدريب: كتابة، ترتيب، سماع، وتحدي.')+`<div class="g">${q('17 = ?',['dix-sept','dix-huit','dix-neuf'],'dix-sept')}${q('بين 19 و21؟',['18','20','22'],'20')}${q('العبارة الصحيحة؟',['15 = quinze','16 = quinze','18 = dix-neuf'],'15 = quinze')}${q('استمع ثم اختر <button class="btn" data-say="vingt-neuf">🔊</button>',['27','29','30'],'29')}</div>`;if(s==='after')h=head('11','بعد الرحلة','خلاصة ومصدر المرجع.')+`<div class="g"><article class="card"><h3>🎯 تحقق ذاتي</h3><p>هل تستطيع كتابة 23 و27 و30 بالفرنسية؟</p></article><article class="card"><a class="btn" target="_blank" href="${R}02_reference_les_chiffres.docx">فتح المرجع الأصلي</a></article></div>`;page.innerHTML=h;bind();if(s==='games')games()}function bind(){page.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>render(b.dataset.go));page.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say));page.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{let ok=b.dataset.a===b.dataset.c,z=b.closest('.card');z.querySelectorAll('.c').forEach(x=>x.disabled=true);b.classList.add(ok?'ok':'no');z.querySelector('.fb').textContent=ok?'✅ صحيح':'❌ حاول مرة أخرى'})}function games(){let box=document.getElementById('game'),mode='detect',r=0,score=0,pairs=[],open=[];function draw(){if(mode==='detect'){let i=[4,9,13,18,22,27][r%6];box.innerHTML='<p>النقاط: '+score+'</p><p>أنا أكبر من '+(i-1)+' وأصغر من '+(i+1)+'. من أنا؟</p>'+[i-1,i,i+1].map(v=>`<button class="c" data-ga="${v}" data-gc="${i}">${v} — ${N[v][1]}</button>`).join('')}else if(mode==='next'){let i=[3,7,12,18,24][r%5],n=i+1;box.innerHTML='<p>ما العدد بعد <b>'+N[i][1]+'</b>؟</p>'+[i-1,n,i+2].map(v=>`<button class="c" data-ga="${v}" data-gc="${n}">${v} — ${N[v][1]}</button>`).join('')}else if(mode==='listen'){let i=[2,6,11,17,20,29][r%6];box.innerHTML='<button class="btn" data-say="'+N[i][1]+'">🔊 اسمع</button><p>اختر الرقم:</p>'+[i,(i+1)%31,(i+3)%31].map(v=>`<button class="c" data-ga="${v}" data-gc="${i}">${v}</button>`).join('')}else{if(!pairs.length){let a=[1,5,10,15,20,25,30];pairs=[...a.map(v=>({t:String(v),k:v})),...a.map(v=>({t:N[v][1],k:v}))].sort(()=>Math.random()-.5)}box.innerHTML='<div class="memory">'+pairs.map((v,i)=>`<button data-mi="${i}">${open.includes(i)?v.t:'؟'}</button>`).join('')+'</div>'}}draw();document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{mode=b.dataset.g;r=0;score=0;pairs=[];open=[];draw()});box.onclick=e=>{let a=e.target.closest('[data-ga]');if(a){if(a.dataset.ga===a.dataset.gc)score++;r++;draw()}let m=e.target.closest('[data-mi]');if(m){let i=+m.dataset.mi;if(open.includes(i))return;open.push(i);draw();if(open.length===2){let [a,b]=open;if(pairs[a].k===pairs[b].k){open=[]}else setTimeout(()=>{open=[];draw()},500)}}}}nav.onclick=e=>{let b=e.target.closest('[data-s]');if(b)render(b.dataset.s)};render('home')})();</script></body></html>
