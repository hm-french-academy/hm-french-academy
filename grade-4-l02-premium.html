<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy · Les chiffres</title><style>body{margin:0;background:#f4f7fb;color:#17324d;font-family:Arial,Cairo,sans-serif}.w{max-width:1100px;margin:auto;padding:14px}.b{background:#fff;border-radius:22px;padding:20px;margin:10px 0}.nav{display:flex;gap:7px;overflow:auto;position:sticky;top:0;background:#fff;padding:9px;z-index:5}.nav button,.btn,.c{border:0;border-radius:12px;padding:10px 13px;font-weight:900;cursor:pointer}.nav button{background:#edf2f7;white-space:nowrap}.on,.btn{background:#4169e1!important;color:#fff}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.card,.game{border:1px solid #dce5ee;border-radius:17px;padding:15px}.pic{height:110px;border-radius:14px;background:#eef7ff;display:grid;place-items:center;font-size:48px}.fr{direction:ltr;text-align:left;font-size:20px;font-weight:900}.tag{display:inline-block;background:#e7f3ff;color:#1260a8;padding:5px 10px;border-radius:99px;font-weight:900}.muted{color:#65778a;line-height:1.8}.c{display:block;width:100%;margin:6px 0;background:#fff;border:2px solid #dce5ee;text-align:right}.ok{background:#eaf7ee!important}.no{background:#fff0f0!important}.fb{min-height:22px;font-weight:900}.video{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#111}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.step{padding:12px;border-radius:14px;background:#f7faff;margin:8px 0}.official{border-right:5px solid #4169e1}</style><body><main class="w"><header class="b"><a href="grade-4.html">← الصف الرابع</a> · HM Academy</header><section class="b"><span class="tag">Leçon 02</span><h1>🔢 Les chiffres · الأرقام 0–30</h1><p>المحتوى الأصلي يُعاد تقديمه داخل واجهة تفاعلية؛ لا تظهر الإجابة داخل السؤال.</p></section><nav id="nav" class="nav"></nav><section id="page" class="b"></section></main><script>(function(){const N=[['0','zéro'],['1','un'],['2','deux'],['3','trois'],['4','quatre'],['5','cinq'],['6','six'],['7','sept'],['8','huit'],['9','neuf'],['10','dix'],['11','onze'],['12','douze'],['13','treize'],['14','quatorze'],['15','quinze'],['16','seize'],['17','dix-sept'],['18','dix-huit'],['19','dix-neuf'],['20','vingt'],['21','vingt et un'],['22','vingt-deux'],['23','vingt-trois'],['24','vingt-quatre'],['25','vingt-cinq'],['26','vingt-six'],['27','vingt-sept'],['28','vingt-huit'],['29','vingt-neuf'],['30','trente']],R='data/lessons/grade-4/source/4eme_Complet/02_Les_chiffres/',S=[['home','🚀 البداية'],['vocab','🔢 المفردات'],['under','🧠 افهم'],['inter','🤝 تفاعل'],['talk','💬 المحادثة'],['practice','✍️ التدريب'],['media','🎬 الفيديو'],['games','🎮 مركز الألعاب'],['assessment','🏆 التقييم'],['smart','🧠 المراجعة الذكية'],['after','📚 بعد الرحلة']],nav=document.getElementById('nav'),page=document.getElementById('page');nav.innerHTML=S.map(x=>`<button data-s="${x[0]}">${x[1]}</button>`).join('');function say(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.8;speechSynthesis.speak(u)}function q(t,o,c){return `<article class="card"><h3>${t}</h3>${o.map(v=>`<button class="c" data-o="${v}" data-c="${c}">${v}</button>`).join('')}<p class="fb"></p></article>`}function head(n,t,d){return `<span class="tag">${n}</span><h2>${t}</h2><p class="muted">${d}</p>`}function render(s){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));let h='';if(s==='home')h=head('01','ابدأ رحلة الأرقام','تعرف → افهم → تفاعل → تحدث → تدرب → شاهد → العب → قيّم → راجع')+`<div class="g"><article class="card"><h3>🎯 هدف الدرس</h3><p>قراءة وسماع وتمييز وترتيب الأرقام من 0 إلى 30.</p></article><article class="card"><h3>📚 مصادر الدرس الأصلية</h3><p>01_interactif_les_chiffres.html</p><p>02_reference_les_chiffres.docx</p><p>03_evaluation_les_chiffres.docx</p><p>04_examen_electronique_les_chiffres.html</p></article></div>`;if(s==='vocab')h=head('02','المفردات','هنا التعلم المباشر؛ لذلك يظهر الرقم مع كلمته. في الأسئلة لا تظهر المطابقة.')+`<div class="g">${N.map(x=>`<article class="card"><div class="pic"><b>${x[0]}</b></div><h3 class="fr">${x[1]}</h3><button class="btn" data-say="${x[1]}">🔊 اسمع</button></article>`).join('')}</div>`;if(s==='under')h=head('03','افهم','استخدم التسلسل كمرجع للفهم قبل الانتقال إلى الأسئلة.')+`<div class="g"><article class="card"><h3>0–10</h3><p class="fr">zéro · un · deux · trois · quatre · cinq · six · sept · huit · neuf · dix</p></article><article class="card"><h3>11–20</h3><p class="fr">onze · douze · treize · quatorze · quinze · seize · dix-sept · dix-huit · dix-neuf · vingt</p></article><article class="card"><h3>21–30</h3><p class="fr">vingt et un · vingt-deux · vingt-trois · vingt-quatre · vingt-cinq · vingt-six · vingt-sept · vingt-huit · vingt-neuf · trente</p></article></div>`;if(s==='inter')h=head('04','تفاعل','أسئلة تستدعي التفكير ولا تعرض الرقم بجوار الكلمة المطلوبة.')+`<div class="g">${q('أكبر من 7 وأصغر من 9؟',['sept','huit','neuf'],'huit')}${q('ما العدد الذي يأتي بعد dix-neuf؟',['18','20','21'],'20')}${q('ما العدد الذي يأتي قبل vingt-cinq؟',['23','24','26'],'24')}${q('أي كلمة تعني 18؟',['dix-sept','dix-huit','dix-neuf'],'dix-huit')}${q('ما العدد بين 28 و30؟',['27','29','30'],'29')}${q('أي كلمة تعني 21؟',['vingt et un','vingt-deux','vingt-trois'],'vingt et un')}</div>`;if(s==='talk')h=head('05','المحادثة','حوار وظيفي حول الأرقام والعمر والرقم.')+`<div class="g"><article class="card"><p>Quel âge as-tu ?</p><p class="fr">J’ai quinze ans.</p><button class="btn" data-say="J’ai quinze ans.">🔊</button></article><article class="card"><p>Quel est ton numéro ?</p><p class="fr">C’est le sept.</p><button class="btn" data-say="C’est le sept.">🔊</button></article><article class="card"><p>Quel est le numéro ?</p><p class="fr">Dix-huit.</p><button class="btn" data-say="Dix-huit.">🔊</button></article></div>`;if(s==='practice')h=head('06','التدريب','تطبيق متعدد البنود؛ لا تظهر الإجابة في السؤال.')+`<div class="g">${q('ما كتابة 7 بالفرنسية؟',['six','sept','huit'],'sept')}${q('ما كتابة 12؟',['douze','deux','treize'],'douze')}${q('ما كتابة 15؟',['seize','quinze','cinq'],'quinze')}${q('ما كتابة 18؟',['dix-neuf','dix-huit','huit'],'dix-huit')}${q('ما الرقم بين 24 و26؟',['23','25','27'],'25')}${q('ما كتابة 29؟',['vingt-huit','vingt-neuf','trente'],'vingt-neuf')}</div>`;if(s==='media')h=head('07','الفيديو الأصلي','الفيديو المرتبط بمصدر الدرس الثاني.')+`<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/zjinmuX25_E?rel=0" title="Les chiffres" allowfullscreen></iframe></div>`;if(s==='games')h=head('08','مركز الألعاب','أربع ألعاب حقيقية، ولكل لعبة عدة جولات.')+`<div class="g"><article class="game"><h3>🔎 محقق الرقم</h3>${q('أكبر من 7 وأصغر من 9؟',['sept','huit','neuf'],'huit')}${q('بين 14 و16؟',['13','15','17'],'15')}${q('بين 28 و30؟',['27','29','30'],'29')}</article><article class="game"><h3>➡️ السابق والتالي</h3>${q('بعد 19؟',['18','20','21'],'20')}${q('قبل 25؟',['23','24','26'],'24')}${q('بعد 29؟',['28','30','27'],'30')}</article><article class="game"><h3>🎧 اسمع واختر</h3>${q('استمع: huit',['7','8','9'],'8')}${q('استمع: quinze',['14','15','16'],'15')}${q('استمع: vingt-deux',['21','22','23'],'22')}</article><article class="game"><h3>🧠 تحدي المطابقة</h3>${q('13',['treize','quatorze','douze'],'treize')}${q('26',['vingt-cinq','vingt-six','vingt-sept'],'vingt-six')}${q('30',['vingt-neuf','trente','vingt-huit'],'trente')}</article></div>`;if(s==='assessment')h=head('09','التقييم الرسمي','التقييم الرسمي منفصل عن التدريب والمراجعة ولا نعيد أسئلته هنا.')+`<article class="card official"><h3>🏆 الاختبار الإلكتروني الرسمي</h3><div class="step">04_examen_electronique_les_chiffres.html</div><a class="btn" target="_blank" href="${R}04_examen_electronique_les_chiffres.html">بدء التقييم الرسمي</a></article><article class="card"><h3>مرجع التقييم</h3><a class="btn" target="_blank" href="${R}03_evaluation_les_chiffres.docx">فتح المرجع المعتمد</a></article>`;if(s==='smart')h=head('10','المراجعة الذكية','مراجعة علاجية مختلفة: استدلال وترتيب وتمييز وقراءة.')+`<div class="g">${q('أكبر من 17 وأصغر من 19؟',['16','18','20'],'18')}${q('العدد الذي يسبق 22؟',['20','21','23'],'21')}${q('العدد الذي يلي 27؟',['26','28','29'],'28')}${q('أي كلمة تعني 24؟',['vingt-trois','vingt-quatre','vingt-cinq'],'vingt-quatre')}${q('أي زوج صحيح؟',['16 = seize','17 = dix-huit','19 = dix-huit'],'16 = seize')}${q('بين 29 و31 يوجد؟',['28','30','32'],'30')}</div>`;if(s==='after')h=head('11','بعد الرحلة','إغلاق تعليمي: استدعاء ذاتي ثم تحقق ثم رجوع للمصدر عند الحاجة.')+`<div class="g"><article class="card"><h3>🎯 ماذا أتقنت؟</h3><p>□ أميز 0–30<br>□ أرتب الأرقام<br>□ أتعرف على الرقم عند سماعه<br>□ أربط الرقم بكلمته</p></article><article class="card"><h3>🔁 تحدي أخير</h3>${q('أكبر من 7 وأصغر من 9؟',['sept','huit','neuf'],'huit')}</article><article class="card"><h3>📚 المصدر الأصلي</h3><a class="btn" target="_blank" href="${R}02_reference_les_chiffres.docx">فتح المرجع</a></article></div>`;page.innerHTML=h;page.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say));page.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const z=b.closest('.card'),ok=b.dataset.o===b.dataset.c;z.querySelectorAll('[data-o]').forEach(x=>x.disabled=true);b.classList.add(ok?'ok':'no');z.querySelector('.fb').textContent=ok?'✅ صحيح':'❌ حاول مرة أخرى.'})}render('home');nav.onclick=e=>{if(e.target.dataset.s)render(e.target.dataset.s)}})();</script></body></html>
