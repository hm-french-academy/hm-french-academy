(function(x){return '<article class="card"><h3>'+x[0]+'</h3>'+opts([x[1],x[2]])+'<p class="feedback"></p></article>'}).join('')+'</div>';page.innerHTML=h;bind();page.querySelectorAll('[data-game]').forEach(function(a){a.onclick=function(e){e.preventDefault();var n=+a.dataset.game;var q=n===0?['18','dix-huit','dix-neuf']:n===1?['dix-huit','18','19']:['17','dix-sept','dix-huit'];document.getElementById('game').innerHTML='<h3>'+a.innerText+'</h3><p>🎯 التحدي: '+q[0]+'</p>'+opts([q[1],q[2]])+'<p class="feedback"></p>';bind()}})}nav.onclick=function(e){var b=e.target.closest('.tab');if(b)render(b.dataset.s)};render('home')})();</script></body></html>
