<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy · Les chiffres</title><style>body{margin:0;background:#f4f7fb;color:#17324d;font-family:Arial,Cairo,sans-serif}.w{max-width:1100px;margin:auto;padding:14px}.b{background:#fff;border-radius:22px;padding:20px;margin:10px 0}.hero{background:linear-gradient(135deg,#e8f3ff,#fff0f4)}.nav{display:flex;gap:7px;overflow:auto;position:sticky;top:0;background:#fff;padding:9px;z-index:5}.nav button,.btn,.c{border:0;border-radius:12px;padding:10px 13px;font-weight:900;cursor:pointer}.nav button{background:#edf2f7;white-space:nowrap}.on,.btn{background:#4169e1!important;color:#fff}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.card{border:1px solid #dce5ee;border-radius:17px;padding:15px}.pic{height:110px;border-radius:14px;background:#eef7ff;display:grid;place-items:center;font-size:48px}.fr{direction:ltr;text-align:left;font-size:20px;font-weight:900}.tag{display:inline-block;background:#e7f3ff;color:#1260a8;padding:5px 10px;border-radius:99px;font-weight:900}.muted{color:#65778a;line-height:1.8}.c{display:block;width:100%;margin:6px 0;background:#fff;border:2px solid #dce5ee;text-align:right}.ok{background:#eaf7ee!important}.no{background:#fff0f0!important}.fb{min-height:22px;font-weight:900}.video{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#111}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.game{padding:15px;background:#f8fbfd;border:1px solid #dce5ee;border-radius:18px}</style><body><main class="w"><header class="b"><a href="grade-4.html">← الصف الرابع</a> · HM Academy</header><section class="b hero"><span class="tag">Leçon 02 · Les chiffres</span><h1>🔢 الأرقام 0–30</h1><p>مصدر الصف الرابع الأصلي، مع محطات مستقلة للتعلم والتدريب والتقييم والمراجعة.</p></section><nav id="nav" class="nav"></nav><section id="page" class="b"></section></main><script>(function(){const N=[['0','zéro','صفر'],['1','un','واحد'],['2','deux','اثنان'],['3','trois','ثلاثة'],['4','quatre','أربعة'],['5','cinq','خمسة'],['6','six','ستة'],['7','sept','سبعة'],['8','huit','ثمانية'],['9','neuf','تسعة'],['10','dix','عشرة'],['11','onze','أحد عشر'],['12','douze','اثنا عشر'],['13','treize','ثلاثة عشر'],['14','quatorze','أربعة عشر'],['15','quinze','خمسة عشر'],['16','seize','ستة عشر'],['17','dix-sept','سبعة عشر'],['18','dix-huit','ثمانية عشر'],['19','dix-neuf','تسعة عشر'],['20','vingt','عشرون'],['21','vingt et un','واحد وعشرون'],['22','vingt-deux','اثنان وعشرون'],['23','vingt-trois','ثلاثة وعشرون'],['24','vingt-quatre','أربعة وعشرون'],['25','vingt-cinq','خمسة وعشرون'],['26','vingt-six','ستة وعشرون'],['27','vingt-sept','سبعة وعشرون'],['28','vingt-huit','ثمانية وعشرون'],['29','vingt-neuf','تسعة وعشرون'],['30','trente','ثلاثون']],R='data/lessons/grade-4/source/4eme_Complet/02_Les_chiffres/',S=[['home','🚀 البداية'],['vocab','🔢 المفردات'],['under','🧠 افهم'],['inter','🤝 تفاعل'],['talk','💬 المحادثة'],['practice','✍️ التدريب'],['media','🎬 الفيديو'],['games','🎮 الألعاب'],['assessment','🏆 التقييم'],['smart','🧠 المراجعة الذكية'],['after','📚 بعد الرحلة']],nav=document.getElementById('nav'),page=document.getElementById('page');nav.innerHTML=S.map(x=>`<button data-s="${x[0]}">${x[1]}</button>`).join('');function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.8;speechSynthesis.speak(u)}function head(a,b,c){return `<span class="tag">${a}</span><h2>${b}</h2><p class="muted">${c}</p>`}function q(s){let a=s.split('|'),o=a.slice(1,4),c=a[4];return `<article class="card"><h3>${a[0]}</h3>${o.map(v=>`<button class="c" data-o="${v}" data-c="${c}">${v}</button>`).join('')}<p class="fb"></p></article>`}function render(s){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));let h='';if(s==='home')h=head('01','ابدأ رحلة الأرقام','قراءة → فهم → تفاعل → محادثة → تدريب → فيديو → ألعاب → تقييم → مراجعة')+`<div class="g"><article class="card"><div class="pic">🔢</div><h3>المحتوى</h3><p>الأرقام من 0 إلى 30 مع النطق والتمييز والترتيب.</p></article><article class="card"><h3>المصادر الأصلية</h3><p>01_interactif_les_chiffres.html</p><p>02_reference_les_chiffres.docx</p><p>03_evaluation_les_chiffres.docx</p><p>04_examen_electronique_les_chiffres.html</p></article></div>`;if(s==='vocab')h=head('02','المفردات','الأرقام كاملة من 0 إلى 30، مع النطق.')+`<div class="g">${N.map(x=>`<article class="card"><div class="pic"><b>${x[0]}</b></div><h3 class="fr">${x[1]}</h3><p>${x[2]}</p><button class="btn" data-say="${x[1]}">🔊 اسمع</button></article>`).join('')}</div>`;if(s==='under')h=head('03','افهم','لا تحفظ الشكل فقط؛ اربط الرقم بالكلمة وبالتسلسل.')+`<div class="g"><article class="card"><h3>0–10</h3><p class="fr">zéro · un · deux · trois · quatre · cinq · six · sept · huit · neuf · dix</p></article><article class="card"><h3>11–20</h3><p class="fr">onze · douze · treize · quatorze · quinze · seize · dix-sept · dix-huit · dix-neuf · vingt</p></article><article class="card"><h3>21–30</h3><p class="fr">vingt et un · vingt-deux · vingt-trois · vingt-quatre · vingt-cinq · vingt-six · vingt-sept · vingt-huit · vingt-neuf · trente</p></article></div>`;if(s==='inter')h=head('04','تفاعل','مواقف جديدة، والاختيارات موزعة.')+['الرقم 12|treize|douze|deux|douze','العمر 15|cinq|seize|quinze|quinze','dix-huit = ?|8|19|18|18','بعد 29؟|28|30|29|30'].map(q).join('');if(s==='talk')h=head('05','المحادثة','الحوار هنا عن الأرقام فقط.')+`<div class="g"><article class="card"><p>Quel est ton numéro ?</p><p class="fr">C’est le sept.</p><button class="btn" data-say="C’est le sept.">🔊</button></article><article class="card"><p>Quel âge as-tu ?</p><p class="fr">J’ai quinze ans.</p><button class="btn" data-say="J’ai quinze ans.">🔊</button></article><article class="card"><p>Quel est le numéro de la salle ?</p><p class="fr">Dix-huit.</p><button class="btn" data-say="Dix-huit.">🔊</button></article></div>`;if(s==='practice')h=head('06','التدريب','التطبيق لا يكشف الإجابة في السؤال.')+['7 = ?|six|sept|huit|sept','12 = ?|douze|deux|treize|douze','15 = ?|seize|quinze|cinq|quinze','18 = ?|dix-neuf|dix-huit|huit|dix-huit','بين 24 و26؟|23|25|27|25'].map(q).join('');if(s==='media')h=head('07','الفيديو الأصلي','هذا هو الفيديو المثبت في manifest للدرس الثاني.')+`<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/zjinmuX25_E?rel=0" title="Les chiffres" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe></div><p><a class="btn" target="_blank" href="https://www.youtube.com/watch?v=zjinmuX25_E">فتح الفيديو مباشرة</a></p>`;if(s==='games')h=head('08','مركز الألعاب','ليست أسئلة تدريب مكررة: كل لعبة تقيس مهارة مختلفة.')+`<div class="g"><article class="card"><h3>🔎 محقق الرقم</h3><p>أنا أكبر من 17 وأصغر من 19. من أنا؟</p>${['17','18','19'].map(v=>`<button class="c" data-o="${v}" data-c="18">${v} — ${N[+v][1]}</button>`).join('')}</article><article class="card"><h3>➡️ الرقم التالي</h3><p>ما العدد بعد vingt-neuf؟</p>${['28','30','29'].map(v=>`<button class="c" data-o="${v}" data-c="30">${v} — ${N[+v][1]}</button>`).join('')}</article><article class="card"><h3>🎧 اسمع واختر</h3><button class="btn" data-say="vingt-sept">🔊 اسمع</button>${['27','17','29'].map(v=>`<button class="c" data-o="${v}" data-c="27">${v}</button>`).join('')}</article></div>`;if(s==='assessment')h=head('09','التقييم الرسمي','لا نعيد أسئلة التدريب داخل التقييم الرسمي.')+`<article class="card"><h3>🏆 04_examen_electronique_les_chiffres.html</h3><a class="btn" target="_blank" href="${R}04_examen_electronique_les_chiffres.html">فتح الاختبار الرسمي</a></article>`;if(s==='smart')h=head('10','المراجعة الذكية','مراجعة تشخيصية مختلفة عن التدريب، وليست نسخًا منه.')+['17 = ?|dix-sept|dix-huit|dix-neuf|dix-sept','بين 19 و21؟|18|20|22|20','العبارة الصحيحة؟|15 = quinze|16 = quinze|18 = dix-neuf|15 = quinze','اسمع ثم اختر: vingt-neuf|27|29|30|29'].map(q).join('');if(s==='after')h=head('11','بعد الرحلة','تحقق ذاتيًا ثم ارجع إلى المرجع الأصلي.')+`<div class="g"><article class="card"><h3>🎯 تحدي ختامي</h3><p>اكتب 23 و27 و30 بالفرنسية دون مساعدة.</p></article><article class="card"><a class="btn" target="_blank" href="${R}02_reference_les_chiffres.docx">فتح المرجع الأصلي</a></article></div>`;page.innerHTML=h;bind()}function bind(){page.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say));page.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{let z=b.closest('.card'),ok=b.dataset.o===b.dataset.c;z.querySelectorAll('[data-o]').forEach(x=>x.disabled=true);b.classList.add(ok?'ok':'no');z.querySelector('.fb').textContent=ok?'✅ صحيح':'❌ ليست الإجابة الصحيحة — راجع الرقم ثم حاول.'})}render('home');nav.addEventListener('click',e=>{if(e.target.dataset.s)render(e.target.dataset.s)});})();</script></body></html>
