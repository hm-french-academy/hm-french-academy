<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Learning Studio</title><style>body{margin:0;background:#f5f7fb;color:#17223b;font-family:Arial,"Cairo",sans-serif}.wrap{max-width:1120px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff;border-radius:28px;padding:24px}.hero h1{margin:0}.hero p{line-height:1.8}.journey{display:flex;gap:7px;overflow:auto;margin-top:15px}.journey span{background:#ffffff22;border:1px solid #ffffff44;border-radius:999px;padding:8px 12px;white-space:nowrap;font-weight:800}.nav{display:flex;gap:7px;overflow:auto;background:#fff;padding:8px;border-radius:18px;margin:14px 0}.nav button{border:0;background:#eef3ff;color:#173a82;border-radius:12px;padding:10px 13px;font-weight:900;white-space:nowrap}.nav button.active{background:#e92d83;color:#fff}.panel{background:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 30px #14264a12}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.card{border:1px solid #e1e6ef;border-radius:18px;padding:15px}.icon{text-align:center;font-size:50px;padding:10px}.fr{font-weight:900;direction:ltr;text-align:center;font-size:20px}.ar{color:#315aa4;font-weight:800;text-align:center}.example{background:#f7f9fd;border-radius:12px;padding:10px;margin-top:8px;direction:ltr}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;margin:5px 3px 0 0}.primary{background:#2563eb;color:#fff}.secondary{background:#edf3ff;color:#173a82}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}.option{padding:12px;border:1px solid #dbe1eb;border-radius:11px;background:#fff;font-weight:800;cursor:pointer}.option:disabled{opacity:.7}.feedback{min-height:24px;font-weight:800;margin-top:10px}.dialogue{border-right:4px solid #e92d83;padding:12px;margin:8px 0;background:#fff7fb;border-radius:12px}.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.file{padding:18px;border:1px solid #e1e6ef;border-radius:16px;font-weight:900}.file a{color:#2563eb;text-decoration:none}.complete{margin-top:14px;background:#fff;border-radius:20px;padding:17px;display:flex;justify-content:space-between;gap:12px;align-items:center}.goal{background:#f7f9fd;border-radius:16px;padding:15px;line-height:2}.road{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.road a{display:block;text-decoration:none;color:#173a82;background:#f7f9fd;border-radius:15px;padding:14px;font-weight:900}@media(max-width:650px){.complete{display:block}}</style></head><body><div class="wrap"><section class="hero"><h1 id="title">Learning Studio</h1><p id="subtitle">HM Academy</p><div class="journey"><span>🚀 استكشف</span><span>🖼️ تعلم</span><span>💬 تواصل</span><span>📘 افهم</span><span>🎮 تدرب</span><span>🏆 قيّم نفسك</span></div></section><nav class="nav" id="nav"></nav><section class="panel" id="panel"></section><section class="complete"><div><b>🏁 رحلة التعلم</b><div id="status">تقدمك محفوظ على هذا الجهاز.</div></div><button class="btn primary" id="complete">إكمال الدرس</button></section></div><script>const qs=new URLSearchParams(location.search),id=qs.get('id')||'grade8-u1-l1',requested=qs.get('section')||'introduction';const map={'grade8-u1-l1':'data/lessons/grade-8/unit-1/lesson-1.json','grade8-u1-l2':'data/lessons/grade-8/unit-1/lesson-2.json','grade8-u1-l3':'data/lessons/grade-8/unit-1/lesson-3.json','grade8-u1-l4':'data/lessons/grade-8/unit-1/lesson-4.json','grade8-u2-l1':'data/lessons/grade-8/unit-2/lesson-1.json','grade8-u2-l2':'data/lessons/grade-8/unit-2/lesson-2.json','grade8-u2-l3':'data/lessons/grade-8/unit-2/lesson-3.json','grade8-u2-l4':'data/lessons/grade-8/unit-2/lesson-4.json','grade8-u3-l1':'data/lessons/grade-8/unit-3/lesson-1.json','grade8-u3-l2':'data/lessons/grade-8/unit-3/lesson-2.json','grade8-u3-l3':'data/lessons/grade-8/unit-3/lesson-3.json','grade8-u3-l4':'data/lessons/grade-8/unit-3/lesson-4.json'};let d={};function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.86;speechSynthesis.speak(u)}function check(btn){let c=btn.closest('.card'),bs=c.querySelectorAll('.option');bs.forEach(b=>b.disabled=true);let ok=btn.dataset.answer==='true';c.querySelector('.feedback').textContent=ok?'✅ صحيح! أحسنت.':'❌ حاول مرة أخرى بعد مراجعة السؤال.'}function qcard(x,i){let opts=x.options||[],ans=x.answer??x.correct;return `<article class="card"><b>${i+1}. ${x.question||''}</b><div class="options">${opts.map((o,j)=>`<button class="option" data-answer="${j===ans}" onclick="check(this)">${o}</button>`).join('')}</div><div class="feedback"></div></article>`}function intro(){let unit=d.unit||'هذه الوحدة';let vocab=(d.vocabulary||[]).length;return `<h2>🚀 اكتشف الدرس قبل أن تبدأ</h2><p>${d.title||'هذا الدرس'} جزء من <b>${unit}</b>. خذ نظرة سريعة على رحلة التعلم ثم ابدأ من المفردات.</p><div class="goal"><b>🎯 ماذا ستتعلم؟</b><br>🖼️ مفردات مرتبطة بموضوع الدرس (${vocab} كلمات عند توفرها)<br>📘 قاعدة مستخدمة داخل أمثلة الدرس<br>💬 محادثة قصيرة مرتبطة بالموضوع<br>🎮 تدريب وألعاب ثم تقييم نهائي</div><h3>🧭 خريطة الرحلة</h3><div class="road"><a href="?id=${id}&section=vocabulary">🖼️ 1. تعلم المفردات</a><a href="?id=${id}&section=grammar">📘 2. افهم القاعدة</a><a href="?id=${id}&section=conversation">💬 3. استمع للمحادثة</a><a href="?id=${id}&section=practice">🎯 4. تدرب بنفسك</a><a href="?id=${id}&section=games">🎮 5. تحدَّ نفسك</a><a href="?id=${id}&section=assessment">🏆 6. قيّم نفسك</a></div><p><b>💡 ضربة البداية:</b> لا توجد هنا رسائل تقنية أو تعليمات للمطور؛ هذه الصفحة مخصصة للطالب فقط.</p>`}function section(n){if(n==='introduction')return intro();if(n==='vocabulary')return `<h2>🖼️ مفردات الدرس</h2><p>صورة → كلمة → معنى → مثال → نطق الكلمة والمثال.</p><div class="cards">${(d.vocabulary||[]).map(v=>`<article class="card"><div class="icon">${v.image||'🖼️'}</div><div class="fr">${v.word||''}</div><div class="ar">${v.translation||''}</div><div class="example">${v.example||''}</div><button class="btn primary" onclick='speak(${JSON.stringify(v.word||'')})'>🔊 نطق الكلمة</button><button class="btn secondary" onclick='speak(${JSON.stringify(v.example||'')})'>▶ نطق المثال</button></article>`).join('')}</div>`;if(n==='grammar')return `<h2>📘 ${d.grammar?.title||'قاعدة الدرس'}</h2><div class="goal">${d.grammar?.explanation||'افهم القاعدة من خلال أمثلة الدرس.'}</div>${(d.grammar?.steps||[]).map((s,i)=>`<p><b>${i+1}.</b> ${s}</p>`).join('')}<h3>أمثلة مع النطق</h3><div class="cards">${(d.grammar?.examples||[]).map(e=>`<article class="card"><div class="example">${e.fr||''}</div><p>${e.ar||''}</p><button class="btn" onclick='speak(${JSON.stringify(e.fr||'')})'>🔊 استمع</button></article>`).join('')}</div>`;if(n==='conversation')return `<h2>💬 محادثة الدرس</h2><p>استمع إلى كل جملة، ثم حاول تمثيل الدور.</p>${(d.conversation?.lines||[]).map(x=>`<div class="dialogue"><b>${x.speaker||''}</b><span dir="ltr">${x.fr||''}</span><br>${x.ar||''}<br><button class="btn" onclick='speak(${JSON.stringify(x.fr||'')})'>🔊 استمع</button></div>`).join('')}`;if(n==='practice'||n==='assessment'){let a=n==='practice'?(d.practice||[]):(d.assessment?.questions||[]);return `<h2>${n==='practice'?'🎯 تدرّب بنفسك':'🏆 التقييم'}</h2><p>أسئلة مرتبطة بالمحتوى الفعلي لهذا الدرس.</p><div class="cards">${a.map(qcard).join('')}</div>`}if(n==='games'){let v=d.vocabulary||[],first=v[0]||{image:'🖼️',word:'',translation:''},pool=[first,...v.slice(1,4)].sort(()=>Math.random()-.5);return `<h2>🎮 الألعاب التعليمية</h2><div class="cards"><article class="card"><div class="icon">🧩</div><h3>الصورة → المعنى</h3><div class="icon">${first.image}</div><div class="options">${pool.map(x=>`<button class="option" data-answer="${x.word===first.word}" onclick="check(this)">${x.translation}</button>`).join('')}</div><div class="feedback"></div></article><article class="card"><div class="icon">🎯</div><h3>التقاط الكلمات</h3><p>اختر الكلمة الفرنسية المناسبة للصورة. الإجابة لا تظهر مسبقًا.</p><div class="icon">${first.image}</div><div class="options">${pool.map(x=>`<button class="option" data-answer="${x.word===first.word}" onclick="check(this)">${x.word}</button>`).join('')}</div><div class="feedback"></div></article></div>`}if(n==='files'){let f=d.files||{};return `<h2>📁 ملفات الدرس</h2><p>مواد التعلم والمراجعة الخاصة بهذا الدرس فقط.</p><div class="files">${[['🧠','الشرح التفاعلي',f.interactive],['📖','المرجع',f.reference],['📝','التقييم',f.assessment],['💻','الاختبار',f.quiz],['🎮','الألعاب',f.games]].filter(x=>x[2]).map(x=>`<div class="file">${x[0]} <a href="${x[2]}">${x[1]}</a></div>`).join('')}</div>`}return intro()}function render(){document.getElementById('title').textContent=d.title||'Learning Studio';document.getElementById('subtitle').textContent=(d.unit||'HM Academy')+' • رحلة تعلم متكاملة';let items=[['introduction','🚀 الاستكشاف'],['vocabulary','🖼️ المفردات'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','🎯 التدريب'],['games','🎮 الألعاب'],['assessment','🏆 التقييم'],['files','📁 الملفات']];let nav=document.getElementById('nav');nav.innerHTML=items.map(x=>`<button data-k="${x[0]}">${x[1]}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{nav.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('panel').innerHTML=section(b.dataset.k)});(nav.querySelector(`[data-k="${requested}"]`)||nav.firstElementChild).click()}fetch(map[id]||map['grade8-u1-l1']).then(r=>r.json()).then(x=>{d=x;render()}).catch(()=>{d={title:'تعذر تحميل الدرس',unit:'HM Academy'};render()});let key='hm_completed_'+id;if(localStorage.getItem(key)){document.getElementById('status').textContent='✅ أكملت هذا الدرس سابقًا.';document.getElementById('complete').disabled=true}document.getElementById('complete').onclick=()=>{localStorage.setItem(key,'1');document.getElementById('status').textContent='🏆 تم حفظ إكمال الدرس.';document.getElementById('complete').disabled=true};</script></body></html>
