<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Learning Studio</title><style>body{margin:0;background:#f5f7fb;color:#17223b;font-family:Arial,"Cairo",sans-serif}.wrap{max-width:1120px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff;border-radius:28px;padding:25px}.hero h1{margin:0;font-size:34px}.hero p{opacity:.9}.nav{display:flex;gap:8px;overflow:auto;background:#fff;padding:8px;border-radius:18px;margin:15px 0}.nav button{border:0;background:#eef3ff;border-radius:12px;padding:11px 14px;font-weight:800;white-space:nowrap}.nav button.active{background:#e92d83;color:#fff}.panel{background:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 30px #14264a12}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{border:1px solid #e1e6ef;border-radius:18px;padding:15px}.icon{font-size:48px;text-align:center;padding:12px}.fr{font-weight:900;direction:ltr;text-align:center}.ar{text-align:center;color:#315aa4;font-weight:800}.example{background:#f7f9fd;border-radius:12px;padding:10px;margin-top:8px;direction:ltr}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;margin-top:8px}.primary{background:#2563eb;color:#fff}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.option{padding:12px;border:1px solid #dbe1eb;border-radius:11px;background:#fff;font-weight:800}.feedback{min-height:22px;font-weight:800;margin-top:8px}.dialogue{border-right:4px solid #e92d83;padding:10px 14px;margin:8px 0;background:#fff7fb;border-radius:12px}.dialogue b{display:block}.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.file{padding:18px;border:1px solid #e1e6ef;border-radius:16px;font-weight:900}.file a{color:#2563eb;text-decoration:none}.complete{margin-top:16px;padding:18px;background:#fff;border-radius:18px;display:flex;justify-content:space-between;gap:10px;align-items:center}@media(max-width:650px){.hero h1{font-size:26px}.wrap{padding:10px}.panel{padding:14px}.complete{display:block}}</style></head><body><div class="wrap"><section class="hero"><h1 id="title">Learning Studio</h1><p id="subtitle">HM Academy — درس متكامل</p></section><nav class="nav" id="nav"></nav><section class="panel" id="panel"></section><section class="complete"><div><b>🏁 تقدم الدرس</b><div id="status">يمكنك العودة لاحقًا وسيُحفظ تقدمك.</div></div><button class="btn primary" id="complete">إكمال الدرس</button></section></div><script>const q=new URLSearchParams(location.search),id=q.get('id')||'grade8-u1-l1',requested=q.get('section')||'introduction';const map={'grade8-u1-l1':'data/lessons/grade-8/unit-1/lesson-1.json','grade8-u1-l2':'data/lessons/grade-8/unit-1/lesson-2.json','grade8-u1-l3':'data/lessons/grade-8/unit-1/lesson-3.json','grade8-u1-l4':'data/lessons/grade-8/unit-1/lesson-4.json','grade8-u2-l1':'data/lessons/grade-8/unit-2/lesson-1.json','grade8-u2-l2':'data/lessons/grade-8/unit-2/lesson-2.json','grade8-u2-l3':'data/lessons/grade-8/unit-2/lesson-3.json','grade8-u2-l4':'data/lessons/grade-8/unit-2/lesson-4.json','grade8-u3-l1':'data/lessons/grade-8/unit-3/lesson-1.json','grade8-u3-l2':'data/lessons/grade-8/unit-3/lesson-2.json','grade8-u3-l3':'data/lessons/grade-8/unit-3/lesson-3.json','grade8-u3-l4':'data/lessons/grade-8/unit-3/lesson-4.json'};let data={};const fallback={title:id,language:'fr'};function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.86;speechSynthesis.speak(u)}function section(name){const d=data;if(name==='vocabulary')return `<h2>🖼️ المفردات</h2><p>الصورة والكلمة والمعنى والمثال والنطق — وكلها من محتوى هذا الدرس فقط.</p><div class="cards">${(d.vocabulary||[]).map(v=>`<article class="card"><div class="icon">${v.image||'🖼️'}</div><div class="fr">${v.word||''}</div><div class="ar">${v.translation||''}</div><div class="example">${v.example||''}</div><button class="btn primary" onclick='speak(${JSON.stringify(v.word||'')})'>🔊 نطق الكلمة</button><button class="btn" onclick='speak(${JSON.stringify(v.example||'')})'>▶ نطق المثال</button></article>`).join('')}</div>`;if(name==='grammar')return `<h2>📘 القواعد</h2><p>${d.grammar?.explanation||''}</p><div class="cards">${(d.grammar?.examples||[]).map(e=>`<article class="card"><div class="example">${e.fr||''}</div><div>${e.ar||''}</div><button class="btn" onclick='speak(${JSON.stringify(e.fr||'')})'>🔊 نطق المثال</button></article>`).join('')}</div>`;if(name==='conversation')return `<h2>💬 المحادثة</h2><p>حوار مرتبط مباشرة بموضوع الدرس.</p>${(d.conversation?.lines||[]).map(x=>`<div class="dialogue"><b>${x.speaker||''}</b>${x.fr||''}<br>${x.ar||''}<br><button class="btn" onclick='speak(${JSON.stringify(x.fr||'')})'>🔊 استمع</button></div>`).join('')}`;if(name==='practice'||name==='assessment'){const arr=name==='practice'?(d.practice||[]):(d.assessment?.questions||[]);return `<h2>${name==='practice'?'🎯 تدرّب بنفسك':'🏆 التقييم'}</h2><div class="cards">${arr.map((x,i)=>`<article class="card"><b>${i+1}. ${x.question||''}</b><div class="options">${(x.options||[]).map((o,j)=>`<button class="option" data-correct="${j===(x.answer??x.correct)}" onclick="const bs=this.parentElement.querySelectorAll('button');bs.forEach(b=>b.disabled=true);this.closest('.card').querySelector('.feedback').textContent=this.dataset.correct==='true'?'✅ إجابة صحيحة':'❌ حاول مرة أخرى';">${o}</button>`).join('')}</div><div class="feedback"></div></article>`).join('')}</div>`}if(name==='games')return `<h2>🎮 الألعاب التعليمية</h2><div class="cards"><article class="card"><div class="icon">🧩</div><b>الصورة → المعنى</b><p>تعرف على الصورة ثم اختر معناها الصحيح.</p></article><article class="card"><div class="icon">🎯</div><b>التقاط الكلمات</b><p>تظهر المهمة أولًا، ولا تُكشف الإجابة المطلوبة مسبقًا.</p></article><article class="card"><div class="icon">🧲</div><b>التصنيف</b><p>صنّف العناصر ثم اضغط للتحقق والانتقال.</p></article></div>`;if(name==='files'){const f=d.files||{};return `<h2>📁 ملفات الدرس</h2><p>مواد مخصصة للطالب فقط.</p><div class="files"><div class="file">🧠 <a href="${f.interactive||'#'}">الشرح التفاعلي</a></div><div class="file">📖 <a href="${f.reference||'#'}">المرجع</a></div><div class="file">📝 <a href="${f.assessment||'#'}">التقييم</a></div><div class="file">💻 <a href="${f.quiz||'#'}">الاختبار</a></div><div class="file">🎮 <a href="${f.games||'#'}">الألعاب</a></div></div>`}return `<h2>🚀 بداية الدرس</h2><p>تعلم المفردات، افهم القاعدة، استمع إلى المحادثة، ثم تدرب والعب وأكمل التقييم.</p>`}function render(){document.getElementById('title').textContent=data.title||id;document.getElementById('subtitle').textContent=(data.unit||'')+' • Français';const items=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','🎯 التدريب'],['games','🎮 الألعاب'],['assessment','🏆 التقييم'],['files','📁 الملفات']];const nav=document.getElementById('nav');nav.innerHTML=items.map(([k,t])=>`<button data-k="${k}">${t}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{nav.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('panel').innerHTML=section(b.dataset.k)});const first=nav.querySelector(`[data-k="${requested}"]`)||nav.querySelector('[data-k="introduction"]');first.click()}fetch(map[id]||map['grade8-u1-l1']).then(r=>r.ok?r.json():fallback).then(x=>{data=x;render()}).catch(()=>{data=fallback;render()});document.getElementById('complete').onclick=()=>{localStorage.setItem('hm_completed_'+id,'1');document.getElementById('status').textContent='✅ تم حفظ إكمال هذا الدرس على هذا الجهاز.';document.getElementById('complete').disabled=true};</script></body></html>
