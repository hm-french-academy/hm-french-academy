<!doctype html>
<html lang="ar" dir="rtl">
<head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HM Academy | Learning Studio</title>
<style>
body{margin:0;background:#f5f7fb;color:#17223b;font-family:Arial,"Cairo",sans-serif}.wrap{max-width:1120px;margin:auto;padding:16px}.student-header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0f1b33;color:#fff;padding:10px 12px;border-radius:18px;margin-bottom:14px;box-shadow:0 8px 22px #0f1b3325}.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:#fff;font-weight:900}.brand-logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#e92d83);font-weight:1000}.brand-text{font-size:16px}.header-actions{display:flex;gap:7px;align-items:center}.home-btn,.unit-btn{display:inline-flex;align-items:center;gap:5px;text-decoration:none;border-radius:12px;padding:10px 12px;font-weight:900;white-space:nowrap}.home-btn{background:#2563eb;color:#fff}.unit-btn{background:#eef3ff;color:#173a82}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff;border-radius:28px;padding:24px}.hero h1{margin:0;font-size:clamp(28px,6vw,42px)}.hero p{line-height:1.8}.journey{display:flex;gap:7px;overflow:auto;margin-top:15px}.journey span{background:#ffffff22;border:1px solid #ffffff44;border-radius:999px;padding:8px 12px;white-space:nowrap;font-weight:800}.nav{display:flex;gap:7px;overflow:auto;background:#fff;padding:8px;border-radius:18px;margin:14px 0}.nav button{border:0;background:#eef3ff;color:#173a82;border-radius:12px;padding:10px 13px;font-weight:900;white-space:nowrap}.nav button.active{background:#e92d83;color:#fff}.panel{background:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 30px #14264a12}.group{margin-bottom:24px}.group:last-child{margin-bottom:0}.group-head{background:linear-gradient(135deg,#f4f7ff,#fff7fb);border:1px solid #dfe6f2;border-radius:18px;padding:16px;margin-bottom:12px}.group-head h3{margin:0;color:#173a82;font-size:24px}.group-head p{margin:6px 0 0;color:#66738a;line-height:1.7}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.card{border:1px solid #e1e6ef;border-radius:18px;padding:15px;background:#fff}.icon{text-align:center;font-size:50px;padding:10px}.fr{font-weight:900;direction:ltr;text-align:center;font-size:20px}.ar{color:#315aa4;font-weight:800;text-align:center}.example{background:#f7f9fd;border-radius:12px;padding:10px;margin-top:8px;direction:ltr;text-align:center;line-height:1.6}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;margin:5px 3px 0 0}.primary{background:#2563eb;color:#fff}.secondary{background:#edf3ff;color:#173a82}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}.option{padding:12px;border:1px solid #dbe1eb;border-radius:11px;background:#fff;font-weight:800;cursor:pointer}.option.selected{border-color:#2563eb;background:#eef4ff}.option.correct{border-color:#20a45a;background:#ecfdf3}.option.wrong{border-color:#e92d83;background:#fff2f8}.feedback{min-height:24px;font-weight:800;margin-top:10px}.dialogue{border-right:4px solid #e92d83;padding:12px;margin:8px 0;background:#fff7fb;border-radius:12px;line-height:1.8}.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.file{padding:18px;border:1px solid #e1e6ef;border-radius:16px;font-weight:900}.file a{color:#2563eb;text-decoration:none}.complete{margin-top:14px;background:#fff;border-radius:20px;padding:17px;display:flex;justify-content:space-between;gap:12px;align-items:center}.goal{background:#f7f9fd;border-radius:16px;padding:15px;line-height:2}.road{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.road a{display:block;text-decoration:none;color:#173a82;background:#f7f9fd;border-radius:15px;padding:14px;font-weight:900}.empty{padding:20px;background:#f8fafc;border-radius:16px;color:#66738a}.student-note{font-size:12px;color:#718096;margin:7px 2px 0;text-align:right}@media(max-width:650px){.complete{display:block}.student-header{border-radius:14px;padding:8px}.brand-text{font-size:14px}.unit-btn{display:none}.home-btn{padding:9px 11px}.wrap{padding:10px}}
</style>
</head>
<body>
<div class="wrap">
<header class="student-header" aria-label="تنقل الطالب">
<a class="brand" href="index.html" aria-label="العودة إلى الصفحة الرئيسية"><span class="brand-logo">HM</span><span class="brand-text">🇫🇷 HM Academy</span></a>
<div class="header-actions"><a class="unit-btn" id="unitLink" href="unit-map.html">🧭 خريطة الوحدة</a><a class="home-btn" href="index.html">⌂ الرئيسية</a></div>
</header>
<div class="student-note">يمكنك العودة إلى الرئيسية أو خريطة الوحدة من أي جزء من الدرس.</div>
<section class="hero"><h1 id="title">Learning Studio</h1><p id="subtitle">HM Academy</p><div class="journey"><span>🚀 استكشف</span><span>🖼️ تعلم</span><span>💬 تواصل</span><span>📘 افهم</span><span>🎮 تدرب</span><span>🏆 قيّم نفسك</span></div></section>
<nav class="nav" id="nav" aria-label="رحلة الدرس"></nav>
<section class="panel" id="panel"></section>
<section class="complete"><div><b>🏁 رحلة التعلم</b><div id="status">تقدمك محفوظ على هذا الجهاز.</div></div><button class="btn primary" id="complete">إكمال الدرس</button></section>
</div>
<script>
const qs=new URLSearchParams(location.search),id=qs.get('id')||'grade8-u1-l1',requested=qs.get('section')||'introduction';
const unitMatch=id.match(/u(\d+)/);if(unitMatch)document.getElementById('unitLink').href='unit-map.html?unit=unit-'+unitMatch[1];
const map={
'grade8-u1-l1':'data/lessons/grade-8/unit-1/lesson-1.json','grade8-u1-l2':'data/lessons/grade-8/unit-1/lesson-2.json','grade8-u1-l3':'data/lessons/grade-8/unit-1/lesson-3.json','grade8-u1-l4':'data/lessons/grade-8/unit-1/lesson-4.json',
'grade8-u2-l1':'data/lessons/grade-8/unit-2/lesson-1.json','grade8-u2-l2':'data/lessons/grade-8/unit-2/lesson-2.json','grade8-u2-l3':'data/lessons/grade-8/unit-2/lesson-3.json','grade8-u2-l4':'data/lessons/grade-8/unit-2/lesson-4.json',
'grade8-u3-l1':'data/lessons/grade-8/unit-3/lesson-1.json','grade8-u3-l2':'data/lessons/grade-8/unit-3/lesson-2.json','grade8-u3-l3':'data/lessons/grade-8/unit-3/lesson-3.json','grade8-u3-l4':'data/lessons/grade-8/unit-3/lesson-4.json'};
let d={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function speak(t){if(!t||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.86;speechSynthesis.speak(u)}
function check(btn){const c=btn.closest('.card'),all=[...c.querySelectorAll('.option')];const ok=btn.dataset.answer==='true';all.forEach(b=>b.classList.remove('selected','wrong','correct'));btn.classList.add(ok?'correct':'wrong');const f=c.querySelector('.feedback');if(ok){all.forEach(b=>b.disabled=true);f.textContent='✅ صحيح! أحسنت.'}else{f.textContent='🔁 ليست الإجابة الصحيحة. حاول مرة أخرى.'}}
function intro(){const groups=d.vocabularyGroups||[],v=(d.vocabulary||[]).length;return `<h2>🚀 ضربة البداية</h2><p>${esc(d.title||'هذا الدرس')} جزء من رحلة الوحدة. خذ نظرة سريعة على ما ستتعلمه ثم ابدأ.</p><div class="goal"><b>🎯 في هذا الدرس ستتعلم:</b><br>🖼️ مفردات مرتبطة بموضوع الدرس (${v} كلمات)<br>📘 قاعدة مستخدمة داخل أمثلة الدرس<br>💬 محادثة قصيرة مرتبطة بالموضوع<br>🎮 تدريب وألعاب ثم تقييم نهائي</div><h3>🧭 خريطة الرحلة</h3><div class="road"><a href="?id=${id}&section=vocabulary">🖼️ 1. تعلم المفردات</a><a href="?id=${id}&section=grammar">📘 2. افهم القاعدة</a><a href="?id=${id}&section=conversation">💬 3. استمع للمحادثة</a><a href="?id=${id}&section=practice">🎯 4. تدرب بنفسك</a><a href="?id=${id}&section=games">🎮 5. تحدَّ نفسك</a><a href="?id=${id}&section=assessment">🏆 6. قيّم نفسك</a></div>${groups.length?`<p><b>💡 نصيحة:</b> ستجد المفردات مرتبة في مجموعات واضحة حتى تتعلمها خطوة بخطوة.</p>`:''}`}
function vocab(){const words=d.vocabulary||[],groups=d.vocabularyGroups||[];if(!words.length)return '<div class="empty">لا توجد مفردات مضافة لهذا الدرس بعد.</div>';const renderGroup=(g,items)=>`<section class="group"><div class="group-head"><h3>${esc(g.title||g.name||'مفردات الدرس')}</h3><p>${esc(g.description||'مجموعة من مفردات الدرس المرتبطة بالموضوع.')}</p></div><div class="cards">${items.map(v=>`<article class="card"><div class="icon">${esc(v.image||'🖼️')}</div><div class="fr">${esc(v.word||'')}</div><div class="ar">${esc(v.translation||'')}</div>${v.example?`<div class="example">${esc(v.example)}</div>`:''}<button class="btn primary" onclick='speak(${JSON.stringify(v.word||'')})'>🔊 نطق الكلمة</button>${v.example?`<button class="btn secondary" onclick='speak(${JSON.stringify(v.example)})'>▶ نطق المثال</button>`:''}</article>`).join('')}</div></section>`;if(groups.length){const used=new Set();const html=groups.map(g=>{const items=words.filter(v=>v.category===g.id);items.forEach(v=>used.add(v));return items.length?renderGroup(g,items):''}).join('');const rest=words.filter(v=>!used.has(v));return `<h2>🖼️ مفردات الدرس</h2><p>كل مجموعة تجمع الكلمات التي تنتمي إلى نفس الجزء من موضوع الدرس.</p>${html}${rest.length?renderGroup({title:'📚 مفردات إضافية',description:'كلمات مرتبطة بالدرس ولم تُصنَّف ضمن مجموعة محددة.'},rest):''}`}const cats=[...new Set(words.map(v=>v.category).filter(Boolean))];if(cats.length>1)return `<h2>🖼️ مفردات الدرس</h2>${cats.map(c=>renderGroup({title:c==='facilities'?'🏫 مرافق المدرسة':c==='classroom'?'🪑 في الفصل':c,description:'كلمات مرتبطة بهذا الجزء من الدرس.'},words.filter(v=>v.category===c))).join('')}`;return `<h2>🖼️ مفردات الدرس</h2><div class="cards">${words.map(v=>`<article class="card"><div class="icon">${esc(v.image||'🖼️')}</div><div class="fr">${esc(v.word||'')}</div><div class="ar">${esc(v.translation||'')}</div>${v.example?`<div class="example">${esc(v.example)}</div>`:''}<button class="btn primary" onclick='speak(${JSON.stringify(v.word||'')})'>🔊 نطق الكلمة</button></article>`).join('')}</div>`}
function grammar(){const g=d.grammar||{};return `<h2>📘 ${esc(g.title||'قاعدة الدرس')}</h2><div class="goal">${esc(g.explanation||'افهم القاعدة من خلال أمثلة الدرس.')}</div>${(g.steps||[]).map((s,i)=>`<p><b>${i+1}.</b> ${esc(s)}</p>`).join('')}<h3>أمثلة مع النطق</h3><div class="cards">${(g.examples||[]).map(e=>`<article class="card"><div class="example">${esc(e.fr||'')}</div><p>${esc(e.ar||'')}</p><button class="btn" onclick='speak(${JSON.stringify(e.fr||'')})'>🔊 استمع</button></article>`).join('')}</div>`}
function conversation(){return `<h2>💬 محادثة الدرس</h2><p>استمع إلى كل جملة، ثم حاول تمثيل الدور.</p>${(d.conversation?.lines||[]).map(x=>`<div class="dialogue"><b>${esc(x.speaker||'')}</b> <span dir="ltr">${esc(x.fr||'')}</span><br>${esc(x.ar||'')}<br><button class="btn" onclick='speak(${JSON.stringify(x.fr||'')})'>🔊 استمع</button></div>`).join('')||'<div class="empty">لا توجد محادثة مضافة لهذا الدرس.</div>'}`}
function qcard(x,i){const opts=x.options||[],ans=x.answer??x.correct;return `<article class="card"><b>${i+1}. ${esc(x.question||'')}</b><div class="options">${opts.map((o,j)=>`<button class="option" data-answer="${j===ans}" onclick="check(this)">${esc(o)}</button>`).join('')}</div><div class="feedback"></div></article>`}
function practice(){const a=d.practice||[];return `<h2>🎯 تدرّب بنفسك</h2><p>تدريبات قصيرة مرتبطة مباشرة بمحتوى هذا الدرس.</p><div class="cards">${a.map(qcard).join('')||'<div class="empty">لا توجد تدريبات مضافة لهذا الدرس بعد.</div>'}</div>`}
function assessment(){const a=d.assessment?.questions||[];return `<h2>🏆 التقييم</h2><p>اختبر فهمك بعد إنهاء المفردات والقواعد والتدريب.</p><div class="cards">${a.map(qcard).join('')||'<div class="empty">لا توجد أسئلة تقييم مضافة لهذا الدرس بعد.</div>'}</div>`}
function games(){const v=d.vocabulary||[];if(!v.length)return '<div class="empty">لا توجد لعبة مرتبطة بهذا الدرس بعد.</div>';const first=v[0],pool=[first,...v.slice(1,4)].sort(()=>Math.random()-.5);return `<h2>🎮 الألعاب التعليمية</h2><div class="cards"><article class="card"><div class="icon">🧩</div><h3>الصورة → المعنى</h3><div class="icon">${esc(first.image||'🖼️')}</div><div class="options">${pool.map(x=>`<button class="option" data-answer="${x.word===first.word}" onclick="check(this)">${esc(x.translation||'')}</button>`).join('')}</div><div class="feedback"></div></article><article class="card"><div class="icon">🎯</div><h3>التقاط الكلمات</h3><p>اختر الكلمة الفرنسية المناسبة للصورة.</p><div class="icon">${esc(first.image||'🖼️')}</div><div class="options">${pool.map(x=>`<button class="option" data-answer="${x.word===first.word}" onclick="check(this)">${esc(x.word||'')}</button>`).join('')}</div><div class="feedback"></div></article></div>`}
function files(){const f=d.files||{};return `<h2>📁 ملفات الدرس</h2><p>مواد التعلم والمراجعة الخاصة بهذا الدرس فقط.</p><div class="files">${[['🧠','الشرح التفاعلي',f.interactive],['📖','المرجع',f.reference],['📝','التقييم',f.assessment],['💻','الاختبار',f.quiz],['🎮','الألعاب',f.games]].filter(x=>x[2]).map(x=>`<div class="file">${x[0]} <a target="_blank" rel="noopener" href="${esc(x[2])}">${esc(x[1])} ↗</a></div>`).join('')}</div>`}
function section(n){if(n==='introduction')return intro();if(n==='vocabulary')return vocab();if(n==='grammar')return grammar();if(n==='conversation')return conversation();if(n==='practice')return practice();if(n==='games')return games();if(n==='assessment')return assessment();if(n==='files')return files();return intro()}
function setProgressSection(name){if(window.HMProgress)window.HMProgress.setSection(name)}
function render(){document.getElementById('title').textContent=d.title||'Learning Studio';document.getElementById('subtitle').textContent=(d.unit||'HM Academy')+' • رحلة تعلم متكاملة';const items=[['introduction','🚀 ضربة البداية'],['vocabulary','🖼️ المفردات'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','🎯 التدريب'],['games','🎮 الألعاب'],['assessment','🏆 التقييم'],['files','📁 الملفات']];const nav=document.getElementById('nav');nav.innerHTML=items.map(x=>`<button data-k="${x[0]}">${x[1]}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{nav.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');setProgressSection(b.dataset.k);document.getElementById('panel').innerHTML=section(b.dataset.k)});(nav.querySelector(`[data-k="${requested}"]`)||nav.firstElementChild).click()}
function syncLessonProgress(){if(!window.HMProgress)return;HMProgress.startLesson(id);const p=HMProgress.get();if(p.completedLessons.includes(id)){document.getElementById('status').textContent='✅ أكملت هذا الدرس سابقًا.';document.getElementById('complete').disabled=true;document.getElementById('complete').textContent='✅ تم إكمال الدرس'}}
fetch(map[id]||map['grade8-u1-l1'],{cache:'no-store'}).then(r=>r.json()).then(x=>{d=x;render();syncLessonProgress()}).catch(()=>{d={title:'تعذر تحميل الدرس',unit:'HM Academy'};render();syncLessonProgress()});
const completeButton=document.getElementById('complete');completeButton.onclick=()=>{if(window.markLessonComplete){window.markLessonComplete(id)}else{localStorage.setItem('hm_completed_'+id,'1');document.getElementById('status').textContent='🏆 تم حفظ إكمال الدرس.';completeButton.disabled=true}};
</script>
<script src="scripts/supabase-client.js?v=20260903"></script>
<script src="scripts/learning-progress.js?v=20260903"></script>
<script src="scripts/lesson-complete.js?v=20260903"></script>
</body>
</html>
