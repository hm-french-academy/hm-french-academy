<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Learning Studio</title><style>body{margin:0;background:#f5f7fb;color:#17223b;font-family:Arial,"Cairo",sans-serif}.wrap{max-width:1120px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff;border-radius:28px;padding:25px}.hero h1{margin:0;font-size:32px}.nav{display:flex;gap:8px;overflow:auto;background:#fff;padding:8px;border-radius:18px;margin:15px 0}.nav button{border:0;background:#eef3ff;border-radius:12px;padding:11px 14px;font-weight:800;white-space:nowrap;cursor:pointer}.nav button.active{background:#e92d83;color:#fff}.panel{background:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 30px #14264a12}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{border:1px solid #e1e6ef;border-radius:18px;padding:15px}.icon{font-size:50px;text-align:center;padding:12px}.fr{font-weight:900;direction:ltr;text-align:center;font-size:20px}.ar{text-align:center;color:#315aa4;font-weight:800}.example{background:#f7f9fd;border-radius:12px;padding:10px;margin-top:8px;direction:ltr}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;margin:5px 3px 0 0}.primary{background:#2563eb;color:#fff}.secondary{background:#edf3ff;color:#173a82}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:12px}.option{padding:12px;border:1px solid #dbe1eb;border-radius:11px;background:#fff;font-weight:800;cursor:pointer}.option:disabled{opacity:.75;cursor:default}.feedback{min-height:24px;font-weight:800;margin-top:10px}.dialogue{border-right:4px solid #e92d83;padding:12px 14px;margin:8px 0;background:#fff7fb;border-radius:12px}.dialogue b{display:block;margin-bottom:4px}.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.file{padding:18px;border:1px solid #e1e6ef;border-radius:16px;font-weight:900}.file a{color:#2563eb;text-decoration:none}.steps{counter-reset:step}.step{padding:12px;margin:8px 0;background:#f7f9fd;border-radius:12px}.game{min-height:150px;text-align:center}.game .target{font-size:70px;margin:8px}.progress{font-weight:800;color:#315aa4}.complete{margin-top:16px;padding:18px;background:#fff;border-radius:18px;display:flex;justify-content:space-between;gap:10px;align-items:center}@media(max-width:650px){.hero h1{font-size:25px}.wrap{padding:10px}.panel{padding:14px}.complete{display:block}}</style></head><body><div class="wrap"><section class="hero"><h1 id="title">Learning Studio</h1><p id="subtitle">HM Academy — درس متكامل</p></section><nav class="nav" id="nav"></nav><section class="panel" id="panel"></section><section class="complete"><div><b>🏁 تقدم الدرس</b><div id="status">يمكنك العودة لاحقًا وسيُحفظ تقدمك.</div></div><button class="btn primary" id="complete">إكمال الدرس</button></section></div><script>const q=new URLSearchParams(location.search),id=q.get('id')||'grade8-u1-l1',requested=q.get('section')||'introduction';const map={'grade8-u1-l1':'data/lessons/grade-8/unit-1/lesson-1.json','grade8-u1-l2':'data/lessons/grade-8/unit-1/lesson-2.json','grade8-u1-l3':'data/lessons/grade-8/unit-1/lesson-3.json','grade8-u1-l4':'data/lessons/grade-8/unit-1/lesson-4.json','grade8-u2-l1':'data/lessons/grade-8/unit-2/lesson-1.json','grade8-u2-l2':'data/lessons/grade-8/unit-2/lesson-2.json','grade8-u2-l3':'data/lessons/grade-8/unit-2/lesson-3.json','grade8-u2-l4':'data/lessons/grade-8/unit-2/lesson-4.json','grade8-u3-l1':'data/lessons/grade-8/unit-3/lesson-1.json','grade8-u3-l2':'data/lessons/grade-8/unit-3/lesson-2.json','grade8-u3-l3':'data/lessons/grade-8/unit-3/lesson-3.json','grade8-u3-l4':'data/lessons/grade-8/unit-3/lesson-4.json'};let data={};function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.86;speechSynthesis.speak(u)}function quizCard(x,i,mode){const opts=x.options||[],ans=x.answer??x.correct;return `<article class="card"><b>${i+1}. ${x.question||''}</b><div class="options">${opts.map((o,j)=>`<button class="option" data-answer="${j===ans}" onclick="checkQ(this)">${o}</button>`).join('')}</div><div class="feedback"></div></article>`}function checkQ(btn){const card=btn.closest('.card'),all=card.querySelectorAll('.option');all.forEach(b=>b.disabled=true);const ok=btn.dataset.answer==='true';card.querySelector('.feedback').textContent=ok?'✅ إجابة صحيحة — أحسنت!':'❌ ليست صحيحة. راجع الإجابة ثم جرّب السؤال مرة أخرى من جديد.';if(ok)card.dataset.done='1'}function section(name){const d=data;if(name==='vocabulary')return `<h2>🖼️ مفردات الدرس</h2><p>تعلم الكلمة من الصورة، ثم استمع إليها واستمع إلى مثالها.</p><div class="cards">${(d.vocabulary||[]).map(v=>`<article class="card"><div class="icon">${v.image||'🖼️'}</div><div class="fr">${v.word||''}</div><div class="ar">${v.translation||''}</div><div class="example">${v.example||''}</div><button class="btn primary" onclick='speak(${JSON.stringify(v.word||'')})'>🔊 نطق الكلمة</button><button class="btn secondary" onclick='speak(${JSON.stringify(v.example||'')})'>▶ نطق المثال</button><button class="btn" onclick="this.textContent='✓ تم التعلم';this.disabled=true">☆ تعلمت هذه الكلمة</button></article>`).join('')}</div>`;if(name==='grammar')return `<h2>📘 ${d.grammar?.title||'قواعد الدرس'}</h2><p>${d.grammar?.explanation||''}</p><div class="steps">${(d.grammar?.steps||[]).map((s,i)=>`<div class="step"><b>${i+1}.</b> ${s}</div>`).join('')}</div><h3>أمثلة من الدرس</h3><div class="cards">${(d.grammar?.examples||[]).map(e=>`<article class="card"><div class="example">${e.fr||''}</div><div>${e.ar||''}</div><button class="btn" onclick='speak(${JSON.stringify(e.fr||'')})'>🔊 استمع للمثال</button></article>`).join('')}</div>`;if(name==='conversation')return `<h2>💬 ${d.conversation?.title||'محادثة الدرس'}</h2><p>استمع إلى كل جملة أو أعد الاستماع لتدربك على النطق والفهم.</p>${(d.conversation?.lines||[]).map(x=>`<div class="dialogue"><b>${x.speaker||''}</b><span dir="ltr">${x.fr||''}</span><br>${x.ar||''}<br><button class="btn" onclick='speak(${JSON.stringify(x.fr||'')})'>🔊 استمع</button></div>`).join('')}`;if(name==='practice'||name==='assessment'){const arr=name==='practice'?(d.practice||[]):(d.assessment?.questions||[]);return `<h2>${name==='practice'?'🎯 تدرّب بنفسك':'🏆 التقييم'}</h2><p class="progress">${arr.length} أسئلة مرتبطة بمحتوى هذا الدرس فقط.</p><div class="cards">${arr.map((x,i)=>quizCard(x,i,name)).join('')}</div>`}if(name==='games'){const vocab=d.vocabulary||[];const first=vocab[0]||{image:'🖼️',word:'',translation:''};const choices=[first,...vocab.slice(1,4)].sort(()=>Math.random()-.5);return `<h2>🎮 الألعاب التعليمية</h2><div class="cards"><article class="card game"><div class="icon">🧩</div><b>الصورة → المعنى</b><div class="target">${first.image}</div><p>ما معنى هذه الصورة؟</p><div class="options">${choices.map(v=>`<button class="option" data-answer="${v.word===first.word}" onclick="checkQ(this)">${v.translation}</button>`).join('')}</div><div class="feedback"></div></article><article class="card game"><div class="icon">🎯</div><b>التقاط الكلمات</b><p>المطلوب: اختر الكلمة الفرنسية التي تناسب الصورة.</p><div class="target">${first.image}</div><div class="options">${choices.map(v=>`<button class="option" data-answer="${v.word===first.word}" onclick="checkQ(this)">${v.word}</button>`).join('')}</div><div class="feedback"></div></article><article class="card game"><div class="icon">🧲</div><b>التصنيف</b><p>اختر الإجابة المناسبة ثم تحقق. لا تُكشف الإجابة قبل اختيارك.</p><div class="options">${choices.map(v=>`<button class="option" data-answer="${v.word===first.word}" onclick="checkQ(this)">${v.word}</button>`).join('')}</div><div class="feedback"></div></article></div>`}if(name==='files'){const f=d.files||{};return `<h2>📁 ملفات الدرس</h2><p>كل ملف هنا مخصص للتعلم والمراجعة والتقييم.</p><div class="files"><div class="file">🧠 <a href="${f.interactive||'#'}">الشرح التفاعلي</a></div><div class="file">📖 <a href="${f.reference||'#'}">المرجع</a></div><div class="file">📝 <a href="${f.assessment||'#'}">التقييم</a></div><div class="file">💻 <a href="${f.quiz||'#'}">الاختبار الإلكتروني</a></div><div class="file">🎮 <a href="${f.games||'#'}">الألعاب</a></div></div>`}return `<h2>🚀 بداية الدرس</h2><p>تعلم مفردات الدرس، افهم القاعدة، استمع إلى المحادثة، ثم تدرب والعب وأكمل التقييم.</p>`}function render(){document.getElementById('title').textContent=data.title||id;document.getElementById('subtitle').textContent=(data.unit||'')+' • Français';const items=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','🎯 التدريب'],['games','🎮 الألعاب'],['assessment','🏆 التقييم'],['files','📁 الملفات']];const nav=document.getElementById('nav');nav.innerHTML=items.map(([k,t])=>`<button data-k="${k}">${t}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{nav.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('panel').innerHTML=section(b.dataset.k)});(nav.querySelector(`[data-k="${requested}"]`)||nav.firstElementChild).click()}fetch(map[id]||map['grade8-u1-l1']).then(r=>r.ok?r.json():Promise.reject()).then(x=>{data=x;render()}).catch(()=>{data={title:'تعذر تحميل الدرس'};render()});const key='hm_completed_'+id;if(localStorage.getItem(key)){document.getElementById('status').textContent='✅ تم إكمال هذا الدرس سابقًا على هذا الجهاز.';document.getElementById('complete').disabled=true}document.getElementById('complete').onclick=()=>{localStorage.setItem(key,'1');document.getElementById('status').textContent='✅ تم حفظ إكمال هذا الدرس على هذا الجهاز.';document.getElementById('complete').disabled=true};</script></body></html>
