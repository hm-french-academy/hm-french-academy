<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy — معاينة كورس الصوتيات</title><style>body{margin:0;font-family:Cairo,system-ui,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:24px}.hero,.panel{background:#fff;border:1px solid #e6eaf0;border-radius:18px;padding:20px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#0d47a1,#1565c0);color:#fff}.btn{border:0;border-radius:10px;padding:10px 14px;background:#0d47a1;color:#fff;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{padding:14px;border:1px solid #e6eaf0;border-radius:14px;background:#fbfcfe}.muted{color:#667085}.hero .muted{color:#e6eefc}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef4ff;color:#0d47a1;font-size:13px}.hero .pill{background:#fff}.status{font-weight:700}.ok{color:#16846f}.warn{color:#b26a00}.bar{height:10px;background:#e8edf5;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#2563eb}.summary{display:flex;gap:12px;flex-wrap:wrap}.summary div{flex:1;min-width:150px;padding:14px;border:1px solid #e6eaf0;border-radius:12px}.lesson{display:none}.lesson.active{display:block}.back{background:#eef4ff;color:#0d47a1}.ph-block{margin:18px 0;padding:14px;border:1px solid #e6eaf0;border-radius:12px}.ph-examples,.ph-symbols{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.ph-examples article,.ph-symbols article{padding:12px;background:#fbfcfe;border-radius:10px}.ph-speak{border:0;background:transparent;font-size:20px;cursor:pointer}code{direction:ltr;display:inline-block;margin:0 8px}</style></head><body><main class="wrap"><section class="hero"><span class="pill">PREVIEW · DRAFT FOR LECTURER REVIEW</span><h1>🎙️ معاينة كورس الصوتيات الفرنسية</h1><p class="muted">نسخة مخصصة لمراجعة المحتوى قبل الاعتماد والنشر.</p><div class="bar"><i id="bar"></i></div><p id="pct">جاري الفحص...</p></section><section class="panel"><h2>حالة المعاينة</h2><div id="summary" class="summary"></div></section><section class="panel"><h2>الوحدات المتاحة</h2><div id="units" class="grid"></div></section><section id="lesson" class="panel lesson"></section></main><script src="scripts/phonetics-course-runtime.js"></script><script src="scripts/phonetics-progress.js"></script><script>const files=['data/specialized/phonetics-lessons-u01.json','data/specialized/phonetics-lessons-u02-u04.json','data/specialized/phonetics-lessons-u05-u08.json','data/specialized/phonetics-lessons-u09-u12.json'];let units=[];async function init(){for(const f of files){try{const d=await HMPhonetics.loadLessons(f);units.push(...(d.units||[]))}catch(e){console.error(e)}}const lessons=units.reduce((n,u)=>n+(u.lessons||[]).length,0),qs=await loadQuizCount(),summary=document.getElementById('summary');summary.innerHTML='<div><b>'+units.length+'</b><br>وحدة</div><div><b>'+lessons+'</b><br>درس</div><div><b>'+qs+'</b><br>سؤال مرتبط</div><div><b class="ok">DRAFT</b><br>مراجعة المحاضر</div>';document.getElementById('bar').style.width='100%';document.getElementById('pct').textContent='تم تحميل ملفات المحتوى والاختبارات: جاهز للمراجعة';document.getElementById('units').innerHTML=units.map((u,i)=>'<article class="card"><span class="pill">U'+String(i+1).padStart(2,'0')+'</span><h3>'+((u.title?.ar)||u.title||'')+'</h3><p class="muted">'+(u.lessons?.length||0)+' دروس</p><button class="btn" onclick="openUnit(\''+u.id+'\')">معاينة الدروس</button></article>').join('')}async function loadQuizCount(){try{return ((await (await fetch('data/specialized/phonetics-quiz-bank.json?v='+Date.now(),{cache:'no-store'})).json()).questions||[]).length}catch(e){return 0}}async function openUnit(uid){const u=units.find(x=>x.id===uid),b=document.getElementById('lesson');b.className='panel lesson active';b.innerHTML='<button class="btn back" onclick="closeUnit()">← العودة</button><h2>'+((u.title?.ar)||u.title||'')+'</h2><div id="content"></div>';const content=document.getElementById('content');for(const l of u.lessons||[]){const box=document.createElement('div');box.className='ph-block';box.innerHTML='<h3>'+((l.title?.ar)||l.title||'')+'</h3><p class="muted">'+(l.level||'')+'</p><div id="c-'+l.id+'"></div>';content.appendChild(box);try{HMPhonetics.render(box.querySelector('#c-'+l.id),{lessons:[l]},l.id)}catch(e){box.innerHTML+='<p class="warn">تعذر عرض هذا الدرس في المعاينة: '+e.message+'</p>'}}b.scrollIntoView({behavior:'smooth'})}function closeUnit(){const b=document.getElementById('lesson');b.className='panel lesson';b.innerHTML=''}init()</script></body></html>
