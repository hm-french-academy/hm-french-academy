<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy — معاينة كورس الصوتيات</title><style>body{margin:0;font-family:Cairo,system-ui,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:24px}.hero,.panel{background:#fff;border:1px solid #e6eaf0;border-radius:18px;padding:20px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#0d47a1,#1565c0);color:#fff}.btn{border:0;border-radius:10px;padding:10px 14px;background:#0d47a1;color:#fff;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{padding:14px;border:1px solid #e6eaf0;border-radius:14px;background:#fbfcfe}.muted{color:#667085}.hero .muted{color:#e6eefc}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef4ff;color:#0d47a1;font-size:13px}.hero .pill{background:#fff}.status{font-weight:700}.ok{color:#16846f}.warn{color:#b26a00}.bar{height:10px;background:#e8edf5;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#2563eb}.summary{display:flex;gap:12px;flex-wrap:wrap}.summary div{flex:1;min-width:150px;padding:14px;border:1px solid #e6eaf0;border-radius:12px}.lesson{display:none}.lesson.active{display:block}.back{background:#eef4ff;color:#0d47a1}.ph-block{margin:18px 0;padding:14px;border:1px solid #e6eaf0;border-radius:12px}.error{padding:12px;border-radius:10px;background:#fff0ef;color:#9f2d26}.success{padding:12px;border-radius:10px;background:#eaf8f2;color:#176b59}</style></head><body><main class="wrap"><section class="hero"><span class="pill">PREVIEW · DRAFT FOR LECTURER REVIEW</span><h1>🎙️ معاينة كورس الصوتيات الفرنسية</h1><p class="muted">نسخة مخصصة لمراجعة المحتوى قبل الاعتماد والنشر.</p><div class="bar"><i id="bar"></i></div><p id="pct">جاري الفحص...</p></section><section class="panel"><h2>حالة المعاينة</h2><div id="summary" class="summary"></div></section><section class="panel"><h2>الوحدات المتاحة</h2><div id="units" class="grid"></div></section><section id="lesson" class="panel lesson"></section></main><script src="scripts/phonetics-course-runtime.js"></script><script src="scripts/phonetics-progress.js"></script><script>const files=['data/specialized/phonetics-lessons-u01.json','data/specialized/phonetics-lessons-u02-u04.json','data/specialized/phonetics-lessons-u05-u08.json','data/specialized/phonetics-lessons-u09-u12.json'];let units=[];let diagnostics=[];function normId(v){return String(v||'').trim().toLowerCase()}function validUnit(u){return u&&u.id&&Array.isArray(u.lessons)&&u.lessons.length}function addUnits(d,f){(d.units||[]).forEach(u=>{if(validUnit(u)){u.id=normId(u.id);units.push(u)}else diagnostics.push(f+': وحدة غير مكتملة')})}async function init(){for(const f of files){try{const d=await HMPhonetics.loadLessons(f);addUnits(d,f)}catch(e){diagnostics.push(f+': '+e.message)}}const lessons=units.reduce((n,u)=>n+u.lessons.length,0),qs=await loadQuizCount();const bad=units.reduce((n,u)=>n+u.lessons.filter(l=>!l||!l.id||!l.title).length,0),summary=document.getElementById('summary');summary.innerHTML='<div><b>'+units.length+'</b><br>وحدة محملة</div><div><b>'+lessons+'</b><br>درس محمل</div><div><b>'+qs+'</b><br>سؤال في بنك الاختبار</div><div><b class="'+(bad?'warn':'ok')+'">'+(bad?'يحتاج فحص':'سليم')+'</b><br>بنية الدروس</div>';document.getElementById('bar').style.width='100%';document.getElementById('pct').textContent=diagnostics.length?'تم التحميل مع '+diagnostics.length+' تنبيه':'تم تحميل جميع ملفات المحتوى بنجاح';document.getElementById('units').innerHTML=units.map((u,i)=>'<article class="card"><span class="pill">'+escText(u.id||('U'+String(i+1).padStart(2,'0')))+'</span><h3>'+escText(u.title?.ar||u.title||'')+'</h3><p class="muted">'+u.lessons.length+' دروس</p><button class="btn" onclick="openUnit(\''+escAttr(u.id)+'\')">معاينة الدروس</button></article>').join('')+(diagnostics.length?'<div class="error">'+diagnostics.map(escText).join('<br>')+'</div>':'<div class="success">✓ لا توجد أخطاء تحميل في الملفات الأربعة.</div>')}function escText(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function escAttr(v){return escText(v)}async function loadQuizCount(){try{const r=await fetch('data/specialized/phonetics-quiz-bank.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)return 0;const d=await r.json();return Array.isArray(d.questions)?d.questions.length:0}catch(e){return 0}}async function openUnit(uid){const u=units.find(x=>normId(x.id)===normId(uid)),b=document.getElementById('lesson');if(!u){b.className='panel lesson active';b.innerHTML='<div class="error">تعذر العثور على الوحدة المطلوبة.</div>';return}b.className='panel lesson active';b.innerHTML='<button class="btn back" onclick="closeUnit()">← العودة</button><h2>'+escText(u.title?.ar||u.title||'')+'</h2><div id="content"></div>';const content=document.getElementById('content');for(const l of u.lessons){const box=document.createElement('div');box.className='ph-block';box.innerHTML='<h3>'+escText(l.title?.ar||l.title||'')+'</h3><p class="muted">'+escText(l.level||'')+'</p><div class="lesson-runtime"></div>';content.appendChild(box);try{HMPhonetics.render(box.querySelector('.lesson-runtime'),{lessons:[l]},l.id)}catch(e){box.insertAdjacentHTML('beforeend','<div class="error">تعذر عرض هذا الدرس في المعاينة: '+escText(e.message)+'</div>')}}b.scrollIntoView({behavior:'smooth'})}function closeUnit(){const b=document.getElementById('lesson');b.className='panel lesson';b.innerHTML=''}init()</script></body></html>
