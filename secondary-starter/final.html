<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الاختبار الختامي | HM Academy</title><link rel="stylesheet" href="course.css"></head><body><header><a href="module-8.html">← الدرس الأخير</a><strong>🎓 HM Academy</strong></header><main><section class="hero"><span>المحطة الأخيرة</span><h1>اختبار الجاهزية 🏁</h1><p>هذا الاختبار يقيس الأساسيات التي تدربت عليها، وليس حفظ معلومات إضافية.</p></section><section class="lesson"><form id="finalQuiz"><div class="question"><h2>1. «اسمي علي»</h2><label><input type="radio" name="q1" value="0"> Je suis Ali.</label><label><input type="radio" name="q1" value="1"> Je m'appelle Ali.</label><label><input type="radio" name="q1" value="0"> J'ai Ali.</label></div><div class="question"><h2>2. اختر معنى Merci</h2><label><input type="radio" name="q2" value="1"> شكرًا</label><label><input type="radio" name="q2" value="0"> وداعًا</label><label><input type="radio" name="q2" value="0"> صباح الخير</label></div><div class="question"><h2>3. التعبير الصحيح عن العمر</h2><label><input type="radio" name="q3" value="0"> Je suis quinze ans.</label><label><input type="radio" name="q3" value="1"> J'ai quinze ans.</label><label><input type="radio" name="q3" value="0"> Je quinze ans.</label></div><div class="question"><h2>4. أي ضمير يعني «نحن»؟</h2><label><input type="radio" name="q4" value="0"> vous</label><label><input type="radio" name="q4" value="1"> nous</label><label><input type="radio" name="q4" value="0"> ils</label></div><div class="question"><h2>5. ماذا تقول عند المغادرة؟</h2><label><input type="radio" name="q5" value="0"> Bonjour</label><label><input type="radio" name="q5" value="0"> Merci</label><label><input type="radio" name="q5" value="1"> Au revoir</label></div><button class="primary" type="submit">احسب نتيجتي</button></form><section id="result" class="result" hidden></section><nav class="pager"><a href="module-8.html">← مراجعة المواقف</a><a href="index.html">العودة إلى بداية الكورس</a></nav></section></main><script src="course.js"></script><script>document.getElementById('finalQuiz').addEventListener('submit',e=>{e.preventDefault();let s=0;for(let i=1;i<=5;i++){let x=document.querySelector(`input[name=q${i}]:checked`);if(x)s+=Number(x.value)}let r=document.getElementById('result');r.hidden=false;r.innerHTML=`<h2>نتيجتك: ${s} / 5</h2><p>${s>=4?'ممتاز! لديك أساس جيد للانطلاق في منهج الصف الأول الثانوي.':s>=3?'بداية جيدة. راجع الدروس التي أخطأت فيها قبل بدء المنهج.':'لا بأس. أعد الرحلة التمهيدية بهدوء وركز على النطق والجملة الأولى.'}</p><div class="score">${'★'.repeat(s)}${'☆'.repeat(5-s)}</div>`;r.scrollIntoView({behavior:'smooth'})});</script></body></html>
