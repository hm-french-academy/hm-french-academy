<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | خريطة الوحدة</title><link rel="stylesheet" href="css/premium-shell.css?v=20260814-unit2"><style>body{background:#f5f7fb}.wrap{max-width:1100px;margin:auto;padding:25px 16px 60px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff;border-radius:28px;padding:26px}.hero h1{margin:0}.hero p{line-height:1.8}.road{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:20px}.node{background:#fff;border:1px solid #e1e7f0;border-radius:22px;padding:18px;box-shadow:0 10px 28px #14264a10}.node .icon{font-size:40px}.node h3{margin:8px 0}.node p{color:#69758a;line-height:1.7}.btn{display:inline-block;background:#2563eb;color:#fff;text-decoration:none;padding:10px 14px;border-radius:12px;font-weight:900}.bar{height:8px;background:#e9eef6;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#14b8a6}.meta{display:flex;justify-content:space-between;font-size:13px;color:#718096;margin:10px 0}.note{margin-top:18px;background:#fff;border-radius:20px;padding:18px;border:1px solid #e1e7f0}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="index.html">الرئيسية</a><a href="academy-map.html">خريطة المنصة</a><a href="dashboard.html">الطالب</a><a href="course.html">المناهج</a><a href="levels.html">المستويات</a><a href="library.html">المكتبة</a><a href="settings.html">الإعدادات</a></nav></header><main class="wrap"><section class="hero"><h1 id="title">🧭 اكتشف الوحدة</h1><p id="desc"></p><div class="meta"><span id="count"></span><span id="progressText">0% مكتمل</span></div><div class="bar"><i id="progress"></i></div></section><section class="road" id="road"></section><div class="note">💡 <b>رحلة الوحدة:</b> ابدأ بضربة البداية، ثم تعلم الدروس، أكمل أنشطة التعلم، وبعدها تحدي واختبار الوحدة. يتم حساب التقدم من الأنشطة والدروس المكتملة.</div></main><script src="scripts/learning-progress.js?v=20260814-unitmap"></script><script>const units={"unit-1":{name:"الوحدة 1: À l'école",desc:"في هذه الوحدة نكتشف عالم المدرسة ومرافقها وأدواتها ونتدرب على التواصل في مواقف مدرسية بسيطة.",lessons:[['grade8-u1-l1','📖','الدرس الأول'],['grade8-u1-l2','📖','الدرس الثاني'],['grade8-u1-l3','📖','الدرس الثالث'],['grade8-u1-l4','📖','الدرس الرابع']]},"unit-2":{name:"الوحدة 2: La maison",desc:"اكتشف المنزل وغرفه ومفرداته وتعلم كيف تصف المكان والملكية باللغة الفرنسية.",lessons:[['grade8-u2-l1','🛏️','الدرس الأول'],['grade8-u2-l2','🏠','الدرس الثاني'],['grade8-u2-l3','📘','الدرس الثالث'],['grade8-u2-l4','📍','الدرس الرابع']]},"unit-3":{name:"الوحدة 3: Le voyage",desc:"اكتشف عالم السفر ووسائل النقل والأماكن والتعبيرات الأساسية للتواصل في الرحلات.",lessons:[['grade8-u3-l1','🚆','الدرس الأول'],['grade8-u3-l2','🧳','الدرس الثاني'],['grade8-u3-l3','🗣️','الدرس الثالث'],['grade8-u3-l4','❓','الدرس الرابع']]}};const p=new URLSearchParams(location.search),uid=p.get('unit')||'unit-1',u=units[uid]||units['unit-1'],d=window.HMProgress?.get?.()||{};const done=new Set(d.completedLessons||[]),activities=new Set(d.completedActivities||[]);const lessonDone=u.lessons.filter(x=>done.has(x[0])).length;const unitActs=[...activities].filter(x=>String(x).includes(uid)).length;const pct=Math.min(100,Math.round(((lessonDone*4+unitActs)/(u.lessons.length*4+8))*100));document.getElementById('title').textContent='🧭 '+u.name;document.getElementById('desc').textContent=u.desc;document.getElementById('count').textContent=u.lessons.length+' دروس · '+unitActs+' أنشطة';document.getElementById('progress').style.width=pct+'%';document.getElementById('progressText').textContent=pct+'% مكتمل';document.getElementById('road').innerHTML='<article class="node"><div class="icon">🚀</div><h3>ضربة البداية</h3><p>تعرف على أهداف الوحدة وخريطة رحلتك.</p><a class="btn" href="unit-intro.html?unit='+uid+'">استكشف الوحدة</a></article>'+u.lessons.map((x,i)=>{const ok=done.has(x[0]);return '<article class="node"><div class="icon">'+x[1]+'</div><h3>'+x[2]+'</h3><p>مفردات + قواعد + محادثة + تدريب + ألعاب + تقييم.</p><div class="meta"><span>'+(ok?'✅ مكتمل':'🔵 متاح')+'</span><span>المرحلة '+(i+1)+'</span></div><a class="btn" href="lesson-studio-standard.html?id='+x[0]+'">'+(ok?'مراجعة الدرس':'ابدأ الدرس')+'</a></article>'}).join('')+'<article class="node"><div class="icon">🎮</div><h3>تحدي الوحدة</h3><p>مراجعة تفاعلية لما تعلمته.</p><a class="btn" href="lesson-studio-standard.html?id=unit-challenge-'+uid+'">ابدأ التحدي</a></article><article class="node"><div class="icon">🏆</div><h3>اختبار الوحدة</h3><p>تحقق من استعدادك للانتقال.</p><a class="btn" href="unit-assessment.html?unit='+uid+'">ابدأ الاختبار</a></article>';window.addEventListener('hm:progress-updated',()=>location.reload());</script></body></html>
