<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HM Academy - الاختبار</title>
<link rel="stylesheet" href="css/style.css?v=20260807">
<link rel="stylesheet" href="css/theme-refresh.css?v=20260809">
</head>
<body>
<header><h2>🇫🇷 HM Academy</h2><p>اختبار ذكي مبني على البيانات</p></header>
<main>
<section class="hero">
<h1>📝 اختبار الدرس</h1>
<div id="exam-container"></div>
<button class="btn" id="submit-exam">تصحيح الاختبار</button>
<h2 id="result"></h2>
<div id="exam-feedback"></div>
</section>
</main>
<script src="scripts/learning-progress.js"></script>
<script>
let exam;
(async function(){
 const data=await (await fetch('data/exam-schema.json')).json();
 exam=data.exams?.[0];
 document.getElementById('exam-container').innerHTML=(exam.questions||[]).map((q,i)=>`<div class="course"><h3>${i+1}- ${q.question}</h3>${q.choices.map(c=>`<label style="display:block"><input type="radio" name="q${i}" value="${c}"> ${c}</label>`).join('')}</div>`).join('');
})();

document.getElementById('submit-exam').onclick=()=>{
 if(!exam) return;
 let score=0;
 exam.questions.forEach((q,i)=>{
  const answer=document.querySelector(`input[name=q${i}]:checked`);
  if(answer && answer.value===q.answer) score++;
 });
 const percent=Math.round(score/exam.questions.length*100);
 document.getElementById('result').textContent=`النتيجة ${score}/${exam.questions.length} (${percent}%)`;
 document.getElementById('exam-feedback').textContent=percent>=80?'🎉 أداء ممتاز':'📚 راجع الدرس وحاول مرة أخرى';
 if(percent>=80){
  HMProgress.completeLesson(exam.lessonId,50);
  HMProgress.addAchievement('first-step');
 }
};
</script>
<footer>HM Academy © 2026</footer>
</body>
</html>
