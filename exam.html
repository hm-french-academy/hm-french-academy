<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam | HM Academy</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
<div class="logo">🇫🇷 HM Academy</div>
<p>اختبار المستوى A1</p>
</header>

<main>
<section class="hero">
<h1>📝 تقييم الدرس الأول</h1>
<p>اختبر فهمك قبل الانتقال إلى الدرس التالي.</p>
</section>

<section class="course">
<h2>السؤال 1</h2>
<p>Bonjour تعني:</p>
<label><input type="radio" name="q1" value="0"> مساء الخير</label><br>
<label><input type="radio" name="q1" value="1"> صباح الخير</label><br>
<label><input type="radio" name="q1" value="0"> شكراً</label>

<br><br>
<button class="btn" onclick="checkExam()">تصحيح الاختبار</button>

<h2>النتيجة</h2>
<p id="result">لم يتم التصحيح بعد</p>
</section>

<section class="hero">
<h2>بعد النجاح</h2>
<p>سيتم لاحقاً فتح الدرس التالي وتحديث نسبة الإنجاز تلقائياً.</p>
<a class="btn" href="dashboard.html">لوحة الطالب</a>
</section>
</main>

<script>
function checkExam(){
let answer=document.querySelector('input[name="q1"]:checked');
let result=document.getElementById('result');
if(!answer){
result.innerHTML='⚠️ اختر إجابة أولاً';
return;
}
if(answer.value==='1'){
result.innerHTML='✅ إجابة صحيحة - حصلت على 100% في هذا السؤال';
}else{
result.innerHTML='❌ حاول مرة أخرى';
}
}
</script>

<footer>HM Academy © 2026</footer>
</body>
</html>
