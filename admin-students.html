<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>HM Academy - إدارة المتعلمين</title><link rel="stylesheet" href="css/style.css?v=20260812"><style>.wrap{padding:24px}.nav{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}.nav a{padding:10px 14px;background:#f1f5f9;border-radius:12px;text-decoration:none;color:inherit}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #ddd;text-align:right}.search{padding:12px;width:100%;max-width:400px;border-radius:12px;border:1px solid #ccc;margin-bottom:20px}.card{background:#fff;padding:20px;border-radius:18px;box-shadow:0 5px 20px #0001}.link{padding:6px 10px;background:#eef7ff;border-radius:10px;text-decoration:none}.notice{padding:14px;border-radius:14px;background:#eef5ff;margin-bottom:16px}</style></head><body><header><h2>🇫🇷 HM Academy</h2><p>إدارة المتعلمين</p></header><main class="wrap"><nav class="nav"><a href="admin-dashboard.html">مركز الإدارة</a><a href="admin-assessments.html">التقييمات</a><a href="admin-analytics.html">التحليلات</a><a href="admin-notifications.html">الإشعارات</a><a href="admin-settings.html">الإعدادات</a></nav><div id="notice" class="notice">جاري تحميل بيانات المتعلمين…</div><div class="card"><h1>👨‍🎓 قائمة المتعلمين</h1><input class="search" id="search" placeholder="بحث باسم الطالب"><table class="table"><thead><tr><th>الاسم</th><th>المستوى</th><th>XP</th><th>الدروس المكتملة</th><th>متوسط التقدم</th><th>آخر نشاط</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></main><footer>HM Academy © 2026</footer><script src="data/production-config.js"></script><script src="scripts/hm-production.js"></script><script>let students=[];const notice=document.getElementById('notice');function render(list){document.getElementById('rows').innerHTML=list.map(s=>`<tr><td>${String(s.full_name||'').replace(/[<>]/g,'')}</td><td>${s.level_code||'—'}</td><td>${s.xp||0}</td><td>${s.completed_lessons||0}</td><td>${Number(s.average_lesson_progress||0).toFixed(1)}%</td><td>${s.last_active_at?new Date(s.last_active_at).toLocaleString('ar-EG'):'—'}</td><td><a class="link" href="admin-student-profile.html?id=${encodeURIComponent(s.id)}">الملف</a></td></tr>`).join('')||'<tr><td colspan="7">لا توجد بيانات</td></tr>'}async function load(){if(!HMProduction.isConfigured()){notice.textContent='قاعدة الإنتاج غير مفعلة؛ لن نعرض بيانات تجريبية على أنها بيانات حقيقية.';render([]);return}try{if(!await HMProduction.user())throw new Error('تسجيل الدخول مطلوب');students=await HMProduction.adminStudents();notice.textContent=`تم تحميل ${students.length} ملفًا من قاعدة الإنتاج.`;render(students)}catch(e){notice.textContent='تعذر تحميل المتعلمين: '+e.message;render([])}}document.getElementById('search').oninput=e=>render(students.filter(s=>String(s.full_name||'').includes(e.target.value)));load();</script></body></html>
