<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HM Academy - Lesson 2</title>
<link rel="stylesheet" href="css/style.css?v=20260807">
</head>
<body>
<header>
<h2>🇫🇷 HM Academy</h2>
<p id="level-label">المستوى A1 - الدرس الثاني</p>
<nav>
<a href="index.html">الرئيسية</a><a href="dashboard.html">لوحة الطالب</a><a href="course.html">المنهج</a><a href="lesson.html?id=lesson-hello">الدرس 1</a><a href="lesson2.html">الدرس 2</a><a href="lesson3.html">الدرس 3</a><a href="library.html">المكتبة</a><a href="settings.html">الإعدادات</a>
</nav>
</header>
<main>
<section class="hero"><h1 id="lesson-title">📖 Lesson 2: Se présenter</h1><p id="lesson-description">تعلم كيفية تقديم نفسك باللغة الفرنسية.</p></section>
<section class="cards">
<div class="course"><h2>🎯 أهداف الدرس</h2><div id="objectives"></div></div>
<div class="course"><h2>🗣 المفردات</h2><div id="vocabulary"></div></div>
<div class="course"><h2>💬 محادثة تطبيقية</h2><div id="conversation"></div></div>
<div class="course"><h2>✍️ تمرين سريع</h2><p id="question"></p><button class="btn" type="button" onclick="showAnswer()">إظهار الإجابة</button><p id="answer" class="small"></p></div>
</section>
<div class="topbar" style="justify-content:center;"><a class="btn" href="exam.html">اختبار المستوى</a><a class="btn secondary" href="lesson3.html">الدرس التالي</a></div>
</main>
<script>
let currentLesson;
function esc(value){return String(value ?? '').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}
function showAnswer(){document.getElementById('answer').textContent=currentLesson?.activity?.answer ? '✅ '+currentLesson.activity.answer : 'لا توجد إجابة مسجلة بعد.';}
(async function(){
 try{
  const res=await fetch('data/lesson-schema.json'); if(!res.ok) throw new Error('data unavailable');
  const data=await res.json(); currentLesson=data.lessons.find(l=>l.id==='lesson-present'); if(!currentLesson) return;
  document.title='HM Academy - '+currentLesson.titleFr;
  document.getElementById('level-label').textContent='المستوى '+currentLesson.level+' - الدرس '+currentLesson.number;
  document.getElementById('lesson-title').textContent='📖 Lesson '+currentLesson.number+': '+currentLesson.titleFr;
  document.getElementById('lesson-description').textContent=currentLesson.descriptionAr;
  document.getElementById('objectives').innerHTML=currentLesson.objectives.map(x=>'<p>• '+esc(x)+'</p>').join('');
  document.getElementById('vocabulary').innerHTML=currentLesson.vocabulary.map(x=>'<p><strong>🇫🇷 '+esc(x.fr)+'</strong><br>'+esc(x.ar)+'<br><span class="small">النطق: '+esc(x.pronunciation)+'</span></p>').join('<hr>');
  document.getElementById('conversation').innerHTML=currentLesson.conversation.map(x=>'<p><strong>'+esc(x.speaker)+':</strong> '+esc(x.fr)+'<br><span class="small">'+esc(x.ar)+'</span></p>').join('');
  document.getElementById('question').textContent=currentLesson.activity.question;
 }catch(e){console.warn('Lesson 2 JSON load skipped:',e);}
})();
</script>
<script src="scripts/app.js"></script>
<footer>HM Academy © 2026</footer>
</body>
</html>
