<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HM Academy - Lesson 2</title>
<link rel="stylesheet" href="css/style.css?v=20260807">
</head>
<body>
<header><h2>🇫🇷 HM Academy</h2><p id="level-label">المستوى A1 - الدرس الثاني</p><nav><a href="index.html">الرئيسية</a> <a href="dashboard.html">لوحة الطالب</a> <a href="library.html">المكتبة</a></nav></header>
<main>
<section class="hero"><h1 id="lesson-title">📖 Lesson 2</h1><p id="lesson-description"></p></section>
<section class="cards">
<div class="course"><h2>🎯 الأهداف</h2><div id="objectives"></div></div>
<div class="course"><h2>🗣 المفردات</h2><div id="vocabulary"></div></div>
<div class="course"><h2>💬 المحادثة</h2><div id="conversation"></div></div>
<div class="course"><h2>✍️ النشاط</h2><p id="question"></p><button class="btn" onclick="showAnswer()">إظهار الإجابة</button><p id="answer"></p></div>
</section>
<section class="hero"><h2>🎧🎥 الوسائط التعليمية</h2><div id="lesson-media"></div></section>
<section class="hero"><h2>✅ إكمال الدرس</h2><button class="btn" onclick="markLessonComplete('lesson-present','first-step')">تم إكمال الدرس</button><p id="completion-message"></p></section>
</main>
<script src="scripts/learning-progress.js"></script>
<script src="scripts/lesson-complete.js"></script>
<script>
let currentLesson;
function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}
function showAnswer(){document.getElementById('answer').textContent=currentLesson?.activity?.answer||'لا توجد إجابة';}
(async()=>{try{let data=await (await fetch('data/lesson-schema.json')).json();currentLesson=data.lessons.find(l=>l.id==='lesson-present');if(!currentLesson)return;document.getElementById('lesson-title').textContent='📖 Lesson '+currentLesson.number+': '+currentLesson.titleFr;document.getElementById('lesson-description').textContent=currentLesson.descriptionAr;document.getElementById('objectives').innerHTML=currentLesson.objectives.map(x=>'<p>• '+esc(x)+'</p>').join('');document.getElementById('vocabulary').innerHTML=currentLesson.vocabulary.map(x=>'<p>🇫🇷 '+esc(x.fr)+'<br>'+esc(x.ar)+'<br>النطق: '+esc(x.pronunciation)+'</p>').join('<hr>');document.getElementById('conversation').innerHTML=(currentLesson.conversation||[]).map(x=>'<p>'+esc(x.speaker)+': '+esc(x.fr)+'<br>'+esc(x.ar)+'</p>').join('');document.getElementById('question').textContent=currentLesson.activity?.question||'';}catch(e){console.log(e);}})();
</script>
<script src="scripts/media-loader.js"></script><script>loadLessonMedia('lesson-present');</script>
<script src="scripts/app.js"></script>
<footer>HM Academy © 2026</footer>
</body>
</html>
