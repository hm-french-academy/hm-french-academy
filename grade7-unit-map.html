<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | الصف الأول الإعدادي — الوحدات</title><style>body{margin:0;background:#f5f7fb;color:#17223b;font-family:Arial,"Cairo",sans-serif}.wrap{max-width:1120px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff;border-radius:28px;padding:24px}.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:16px}.unit{background:#fff;border-radius:20px;padding:18px;box-shadow:0 10px 28px #14264a12}.unit h2{margin:0;color:#173a82}.lesson{display:block;text-decoration:none;color:#173a82;background:#f7f9fd;border-radius:12px;padding:11px;margin-top:8px;font-weight:900}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.top a{background:#2563eb;color:#fff;text-decoration:none;padding:10px 13px;border-radius:12px;font-weight:900}</style></head><body><div class="wrap"><div class="top"><b>🇫🇷 HM Academy · الصف الأول الإعدادي</b><a href="grade-7.html">المرحلة</a></div><section class="hero"><h1>خريطة الوحدات</h1><p>الوحدات والدروس المعتمدة من حزمة المنهج الأصلية المرفوعة، مع Learning Studio مستقل للصف الأول الإعدادي.</p></section><main id="app"></main></div><script>fetch('data/lessons/grade-7/grade7-source-content.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{const units=[...new Set(x.lessons.map(l=>l.unit))];document.getElementById('app').innerHTML='<div class="units">'+units.map((u,ui)=>`<section class="unit"><h2>Unité ${ui+1}</h2><p>الوحدة ${ui+1}</p>${x.lessons.filter(l=>l.unit===u).map((l,i)=>`<a class="lesson" href="grade7-lesson-studio-source.html?id=${encodeURIComponent(l.id)}&section=introduction">الدرس ${i+1} · ${l.titleAr}</a>`).join('')}</section>`).join('')+'</div>'}).catch(()=>document.getElementById('app').innerHTML='<p>تعذر تحميل خريطة الوحدات.</p>')</script></body></html>
