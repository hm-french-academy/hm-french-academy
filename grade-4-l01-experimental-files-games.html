<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>HM Academy · G4 L01 · Experimental Files & Games</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f8fb;color:#2e2a25;font-family:Arial,Cairo,sans-serif;padding:14px}.wrap{max-width:1100px;margin:auto}.top{background:#fff;border-radius:18px;padding:12px 16px;display:flex;justify-content:space-between;gap:10px}.top a{color:#2e2a25;text-decoration:none;font-weight:900}.hero{margin-top:12px;background:linear-gradient(120deg,#c9f1ff,#ffe1ee 55%,#fff0b4);border-radius:28px;padding:26px}.hero h1{margin:6px 0;font-size:clamp(28px,6vw,46px)}.notice{background:#fff8e8;border:1px solid #f1dfb0;border-radius:16px;padding:13px;margin-top:12px;font-weight:800}.nav{display:flex;gap:8px;overflow:auto;background:#fff;border-radius:18px;padding:9px;margin:12px 0}.nav button,.tab{border:0;background:#eef4f8;border-radius:999px;padding:10px 14px;font-weight:900;white-space:nowrap;cursor:pointer}.nav button.active,.tab.active{background:#2e2a25;color:#fff}.panel{background:#fff;border-radius:24px;padding:20px;min-height:500px}.head{margin-bottom:16px}.head h2{margin:0;font-size:27px}.head p{margin:7px 0;color:#5b5750;font-weight:700;line-height:1.7}.fileGrid,.gameGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.fileCard,.gameCard{border:2px solid #edf1f4;border-radius:19px;padding:16px;background:linear-gradient(135deg,#fff,#f8fbfd)}.fileCard h3,.gameCard h3{margin:0 0 7px}.fileCard p,.gameCard p{color:#5b5750;line-height:1.65;font-weight:700}.fileFrame{margin-top:15px;border:2px solid #e5edf3;border-radius:18px;overflow:hidden;background:#fff}.fileFrame iframe{display:block;width:100%;height:560px;border:0}.frameTools{display:flex;gap:7px;flex-wrap:wrap;padding:9px;background:#f8fbfd;border-bottom:1px solid #e5edf3}.btn{border:0;border-radius:12px;padding:10px 14px;background:#2e2a25;color:#fff;font-weight:900;cursor:pointer}.btn.light{background:#edf4f8;color:#2e2a25}.gameTabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.gamePanel{background:#f8fbfd;border:1px solid #e5edf3;border-radius:20px;padding:18px}.score{text-align:center;font-size:21px;font-weight:900}.prompt{text-align:center;font-size:24px;font-weight:900;margin:15px}.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.choice{border:2px solid #e0e8ee;background:#fff;border-radius:13px;padding:11px 14px;font-weight:900;cursor:pointer}.choice.good{background:#e4f3e1;border-color:#5ea85b}.choice.bad{background:#fbe0dc;border-color:#c9503b}.feedback{text-align:center;min-height:28px;font-weight:900;margin-top:12px}.memoryGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:720px;margin:auto}.memory{min-height:82px;border:2px solid #e5edf3;background:#fff;border-radius:15px;font-weight:900;cursor:pointer}.memory.open{background:#eef7f3;border-color:#5ea85b}.order{display:grid;gap:8px;max-width:560px;margin:12px auto}.orderItem{background:#fff;border:2px solid #e5edf3;border-radius:14px;padding:12px;text-align:center;font-weight:900;cursor:pointer}.orderItem.sel{outline:3px solid #2e2a25}.small{font-size:12px;color:#6b7280;font-weight:800}@media(max-width:600px){.memoryGrid{grid-template-columns:repeat(2,1fr)}.panel{padding:14px}.fileFrame iframe{height:460px}}</style></head><body><div class="wrap"><header class="top"><a href="grade-4-l01-learning-studio.html?id=g4-l01">← النسخة الحالية</a><strong>🧪 نسخة تجريبية مستقلة</strong></header><section class="hero"><div>HM Academy · الصف الرابع الابتدائي · الدرس الأول</div><h1>Les 4 saisons</h1><p>اختبار معزول لعرض ملفات الدرس + مركز ألعاب موسّع.</p><div class="notice">هذه الصفحة تجريبية فقط ولا تعدّل صفحة الدرس الحالية.</div></section><nav class="nav" id="nav"></nav><main class="panel" id="panel"></main></div><script>const SRC='data/lessons/grade-4/source/4eme_Complet/01_Les_saisons/';const seasons=[{fr:'Le printemps',ar:'الربيع',months:['Mars','Avril','Mai'],sentences:['Il fait beau.','Le ciel est bleu.','Les feuilles sont vertes.','Il y a des fleurs.']},{fr:"L'été",ar:'الصيف',months:['Juin','Juillet','Août'],sentences:['Il fait chaud.','Le ciel est bleu.','Le soleil brille.','Les arbres ont des fruits.']},{fr:"L'automne",ar:'الخريف',months:['Septembre','Octobre','Novembre'],sentences:['Il fait mauvais.','Le ciel est gris.','Les feuilles sont jaunes.',"Les feuilles d'arbres tombent."]},{fr:"L'hiver",ar:'الشتاء',months:['Décembre','Janvier','Février'],sentences:['Il fait froid.','Il pleut.','Les vents soufflent.','La neige tombe.']}];const files=[{name:'01 · الملف التفاعلي',type:'HTML',path:SRC+'01_interactif_les_saisons.html',desc:'عرض مباشر داخل الصفحة، بدون فتح صفحة مستقلة.'},{name:'04 · الاختبار الإلكتروني الأصلي',type:'HTML',path:SRC+'04_examen_electronique_les_saisons.html',desc:'عرض مباشر داخل الصفحة كجزء من التجربة.'},{name:'02 · المرجع الأصلي',type:'DOCX',path:SRC+'02_reference_les_saisons.docx',desc:'الملف المرجعي الأصلي موجود في المصدر، لكن المتصفح لا يعرض DOCX مباشرة؛ لذلك لا يتم تقديمه كتحميل في هذا الاختبار.'},{name:'03 · التقييم الأصلي',type:'DOCX',path:SRC+'03_evaluation_les_saisons.docx',desc:'ملف التقييم الأصلي موجود في المصدر، وسيحتاج لاحقًا إلى تحويل محتواه لعرض HTML منسق.'}];const nav=document.getElementById('nav'),panel=document.getElementById('panel');const sections=[['files','📁 ملفات الدرس'],['games','🎮 مركز الألعاب']];let section='files',game='race',score=0,state={};function renderNav(){nav.innerHTML=sections.map(([k,t])=>`<button class="${section===k?'active':''}" onclick="show('${k}')">${t}</button>`).join('')}function show(k){section=k;renderNav();k==='files'?renderFiles():renderGames()}function renderFiles(){panel.innerHTML=`<div class="head"><h2>📁 ملفات الدرس داخل الصفحة</h2><p>في هذه النسخة نختبر فكرة العرض الداخلي للملفات بدل تقديمها كروابط تحميل.</p></div><div class="fileGrid">${files.map((f,i)=>`<article class="fileCard"><h3>${f.name}</h3><div class="small">${f.type}</div><p>${f.desc}</p>${f.type==='HTML'?`<button class="btn" onclick="openFile(${i})">عرض الملف</button>`:`<span class="small">عرض DOCX منسق: مرحلة تالية بعد تحويل المحتوى.</span>`}</article>`).join('')}</div><div id="viewer"></div>`}function openFile(i){const f=files[i];document.getElementById('viewer').innerHTML=`<div class="fileFrame"><div class="frameTools"><button class="btn light" onclick="document.getElementById('viewer').innerHTML=''">إغلاق</button><span class="small">${f.name}</span></div><iframe title="${f.name}" src="${f.path}"></iframe></div>`;document.getElementById('viewer').scrollIntoView({behavior:'smooth',block:'start'})}function renderGames(){panel.innerHTML=`<div class="head"><h2>🎮 مركز الألعاب التجريبي</h2><p>ألعاب مبنية فقط على مواسم الدرس وشهوره والجمل الواردة فيه، مع تنويع الوظيفة وعدم إعادة شكل التدريب الحالي.</p></div><div class="gameTabs">${[['race','🏁 سباق الفصول'],['memory','🧠 ذاكرة الشهور'],['clues','🔎 من أنا؟'],['order','🔢 رتّب الفصول'],['weather','☁️ طقس الموسم'],['month','📅 شهر وموسم']].map(([k,t])=>`<button class="tab ${game===k?'active':''}" onclick="setGame('${k}')">${t}</button>`).join('')}</div><div class="gamePanel" id="gamePanel"></div>`;renderGame()}function setGame(k){game=k;state={};renderGames()}function renderGame(){const el=document.getElementById('gamePanel');score=state.score||0;if(game==='race')race(el);if(game==='memory')memory(el);if(game==='clues')clues(el);if(game==='order')order(el);if(game==='weather')weather(el);if(game==='month')month(el)}function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}function base(content){return `<div class="score">النقاط: ${score}</div>${content}<div class="feedback" id="fb">${state.fb||''}</div>`}function answer(ok,msg,next){state.fb=ok?'✅ '+msg:'❌ '+msg;if(ok)state.score=(state.score||0)+1;renderGame()}function race(el){const q=state.q??Math.floor(Math.random()*4),s=seasons[q],opts=shuffle(seasons).map(x=>x.fr);el.innerHTML=base(`<div class="prompt">أي فصل يرتبط بهذه الشهور؟<br><span class="small">${s.months.join(' · ')}</span></div><div class="choices">${opts.map(x=>`<button class="choice" onclick="pickRace('${x}',${q})">${x}</button>`).join('')}</div>`)}function pickRace(x,q){const ok=x===seasons[q].fr;state.q=Math.floor(Math.random()*4);answer(ok,ok?'إجابة صحيحة.':'حاول مرة أخرى.',true)}function memory(el){if(!state.deck){const d=[];seasons.forEach((s,i)=>s.months.forEach(m=>d.push({v:m,s:i})));state.deck=shuffle(d).slice(0,12);state.open=[];state.matched=[]}el.innerHTML=base(`<div class="prompt">طابق الشهر مع الموسم الصحيح</div><div class="memoryGrid">${state.deck.map((c,i)=>`<button class="memory ${state.open.includes(i)||state.matched.includes(i)?'open':''}" onclick="flip(${i})">${state.open.includes(i)||state.matched.includes(i)?c.v:'؟'}</button>`).join('')}</div>`)}function flip(i){if(state.open.includes(i)||state.matched.includes(i))return;state.open.push(i);if(state.open.length===2){const[a,b]=state.open;if(state.deck[a].s===state.deck[b].s){state.matched.push(a,b);state.fb='✅ تطابق صحيح';state.score=(state.score||0)+1}else{state.fb='❌ ليسا من الموسم نفسه'}setTimeout(()=>{state.open=[];renderGame()},650)}renderGame()}function clues(el){const q=state.q??Math.floor(Math.random()*4),s=seasons[q],clue=s.sentences[Math.floor(Math.random()*s.sentences.length)];el.innerHTML=base(`<div class="prompt">من أنا؟<br><span class="small">${clue}</span></div><div class="choices">${shuffle(seasons).map(x=>`<button class="choice" onclick="pickClue('${x.fr}',${q})">${x.fr}</button>`).join('')}</div>`)}function pickClue(x,q){const ok=x===seasons[q].fr;state.q=Math.floor(Math.random()*4);answer(ok,ok?'أحسنت.':'إجابة غير صحيحة.',true)}function order(el){if(!state.list)state.list=shuffle(seasons).map(s=>s.fr);el.innerHTML=base(`<div class="prompt">رتّب الفصول بالترتيب الطبيعي</div><div class="order">${state.list.map((x,i)=>`<button class="orderItem ${state.sel===i?'sel':''}" onclick="orderPick(${i})">${i+1}. ${x}</button>`).join('')}</div><div style="text-align:center"><button class="btn" onclick="checkOrder()">تحقق</button><button class="btn light" onclick="state.list=shuffle(seasons).map(s=>s.fr);state.sel=null;renderGame()">إعادة</button></div>`)}function orderPick(i){if(state.sel==null){state.sel=i}else{[state.list[state.sel],state.list[i]]=[state.list[i],state.list[state.sel]];state.sel=null}renderGame()}function checkOrder(){const good=seasons.map(s=>s.fr).join('|')===state.list.join('|');answer(good,good?'ترتيب صحيح.':'الترتيب يحتاج مراجعة.',true)}function weather(el){const q=state.q??Math.floor(Math.random()*4),s=seasons[q],sent=shuffle(s.sentences)[0],opts=shuffle(seasons.map(x=>x.ar));el.innerHTML=base(`<div class="prompt">أي موسم يصفه هذا؟<br><span class="small">${sent}</span></div><div class="choices">${opts.map(x=>`<button class="choice" onclick="pickWeather('${x}',${q})">${x}</button>`).join('')}</div>`)}function pickWeather(x,q){const ok=x===seasons[q].ar;state.q=Math.floor(Math.random()*4);answer(ok,ok?'ممتاز.':'جرب مرة أخرى.',true)}function month(el){const q=state.q??Math.floor(Math.random()*12),all=seasons.flatMap(s=>s.months.map(m=>({m,s:s.fr,a:s.ar}))),x=all[q];el.innerHTML=base(`<div class="prompt">إلى أي موسم ينتمي هذا الشهر؟<br><span class="small">${x.m}</span></div><div class="choices">${shuffle(seasons).map(s=>`<button class="choice" onclick="pickMonth('${s.fr}',${q})">${s.fr}</button>`).join('')}</div>`)}function pickMonth(x,q){const all=seasons.flatMap(s=>s.months.map(m=>({m,s:s.fr,a:s.ar}))),ok=x===all[q].s;state.q=Math.floor(Math.random()*12);answer(ok,ok?'صحيح.':'ليست الإجابة الصحيحة.',true)}show('files');</script></body></html>
