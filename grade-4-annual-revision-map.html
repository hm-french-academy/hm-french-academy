<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | خريطة مراجعة الصف الرابع</title><style>body{font-family:Arial,Cairo,sans-serif;background:#f5f7fb;margin:0;color:#17223b}.wrap{max-width:1000px;margin:auto;padding:24px 15px}.hero,.unit{background:#fff;border:1px solid #e1e7f0;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 8px 25px #17223b0d}.hero{background:linear-gradient(135deg,#173a82,#2563eb);color:#fff}.unit h2{margin:0 0 5px}.unit .fr{font-weight:900}.unit p{line-height:1.8;color:#65728a}.unit ul{line-height:2}.sem{display:inline-block;padding:5px 9px;border-radius:99px;background:#edf3ff;color:#2563eb;font-weight:900;font-size:12px}</style></head><body><main class="wrap"><section class="hero"><h1>🗺️ خريطة المراجعة السنوية</h1><p>الصف الرابع الابتدائي → الصف الخامس · الترمين كاملين</p></section><div id="units"></div></main><script>fetch('data/reviews/grade-5/review-content.json').then(r=>r.json()).then(d=>{document.getElementById('units').innerHTML=d.units.map((u,i)=>`<article class="unit"><span class="sem">الترم ${u.semester}</span><h2>${i+1}. ${u.titleAr}</h2><div class="fr">${u.titleFr}</div><p>${u.focus.join(' · ')}</p><ul>${u.activities.map(a=>`<li>${a}</li>`).join('')}</ul></article>`).join('')}).catch(()=>document.getElementById('units').innerHTML='<section class="unit">تعذر تحميل خريطة المراجعة.</section>');</script></body></html>
