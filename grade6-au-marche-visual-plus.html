<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Au marché · الصف السادس</title><style>html,body{margin:0;padding:0;background:#f3f6ff;overflow-x:hidden}#lesson{display:block;width:100%;border:0;height:0;min-height:0;background:#fff;overflow:hidden}</style></head><body><iframe id="lesson" src="grade6-au-marche-premium.html" title="Au marché"></iframe><script>

function styles(d){const s=d.createElement('style');s.textContent=`.extraPage{background:#fff;border:1px solid #dfe5ef;border-radius:25px;padding:22px;box-shadow:0 10px 34px #17213b0b;min-height:420px}.extraPage h2{font-size:29px;margin:4px 0 8px}.extraIntro{color:#64708a;line-height:1.8}.extraGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.extraCard{border:1px solid #dfe5ef;background:#f5f8ff;border-radius:18px;padding:14px}.extraCard h3{margin:0 0 7px;color:#173a82}.extraBtn{border:0;border-radius:11px;padding:10px 13px;background:#2556d8;color:#fff;font-weight:900;cursor:pointer;margin-top:8px}.extraBtn.secondary{background:#eaf0ff;color:#1746b8}.gameArea{margin-top:10px}.gameOpt{display:block;width:100%;margin:7px 0;border:1px solid #d6dfec;border-radius:11px;padding:10px;background:#fff;text-align:right;font-weight:800;cursor:pointer}.gameOpt.ok{background:#eafff2;border-color:#27a35c}.gameOpt.bad{background:#fff0f6;border-color:#e72b82}.gameFeedback{font-weight:900;min-height:22px;margin-top:7px}.memoryGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.memory{height:58px;border:1px solid #d6dfec;border-radius:10px;background:#fff;font-weight:900;cursor:pointer}.videoBox{background:#101827;color:#fff;border-radius:20px;padding:18px}.videoFrame{width:100%;aspect-ratio:16/9;border:0;border-radius:15px;display:block;background:#000}.refGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.refLine{background:#fff;border:1px solid #dfe5ef;border-radius:14px;padding:12px;line-height:1.8}.scoreBox{margin-top:14px;padding:13px;border-radius:14px;background:#eef8f7;color:#0b7f78;font-weight:900}.filesNav{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.filesNav button{white-space:nowrap;border:0;border-radius:11px;padding:9px 12px;background:#eef3ff;color:#1746b8;font-weight:900;cursor:pointer}.filesNav button.active{background:#2556d8;color:#fff}@media(max-width:700px){.extraGrid,.refGrid{grid-template-columns:1fr}.memoryGrid{grid-template-columns:repeat(3,1fr)}.extraPage{padding:15px;border-radius:21px}}`;d.head.appendChild(s)}
function addPage(d,title,kicker,body){const sc=d.querySelector('.lessonPages');if(!sc)return null;const sec=d.createElement('section');sec.className='section extraPage';sec.id='extra-'+kicker;sec.innerHTML='<div class="k">'+kicker+'</div><h2>'+title+'</h2>'+body;sc.appendChild(sec);return sec}
function build(d){if(d.getElementById('extra-video'))return;styles(d);addPage(d,'فيديو الدرس','07 · VIDÉO','<div class="videoBox"><p>الفيديو الأصلي المرتبط بالدرس — <b>Les fruits en français</b>.</p><iframe class="videoFrame" src="https://www.youtube.com/embed/'+videoId+'?rel=0" title="Les fruits en français" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>');
addPage(d,'مركز الألعاب','08 · JEUX','<p class="extraIntro">ست ألعاب قصيرة تعيد تدوير مفردات السوق كلها، مع تركيز خاص على الكلمات الكثيرة في هذا الدرس.</p><div class="extraGrid"><article class="extraCard"><h3>1. خَمّن الكلمة</h3><p id="gx1q">اضغط لبدء جولة.</p><div id="gx1a" class="gameArea"></div><button class="extraBtn" type="button" onclick="window.parent.gx1()">ابدأ الجولة</button></article><article class="extraCard"><h3>2. طابق المعنى</h3><p>اختر الكلمة الفرنسية المطابقة للمعنى.</p><div id="gx2" class="gameArea"></div><button class="extraBtn" type="button" onclick="window.parent.gx2()">جولة جديدة</button></article><article class="extraCard"><h3>3. تحدي السرعة</h3><p id="gx3t">30 ثانية</p><div id="gx3" class="gameArea"></div><button class="extraBtn" type="button" onclick="window.parent.gx3()">ابدأ التحدي</button></article><article class="extraCard"><h3>4. صنّف الكلمة</h3><p>إلى أي مجموعة تنتمي الكلمة؟</p><div id="gx4" class="gameArea"></div><button class="extraBtn" type="button" onclick="window.parent.gx4()">جولة جديدة</button></article><article class="extraCard"><h3>5. الذاكرة</h3><p>طابق الكلمة الفرنسية مع معناها.</p><div id="gx5" class="gameArea"><button class="extraBtn" type="button" onclick="window.parent.gx5()">ابدأ لعبة الذاكرة</button></div></article><article class="extraCard"><h3>6. صح أم لا؟</h3><p id="gx6q">اضغط لبدء الجولة.</p><div id="gx6" class="gameArea"></div><button class="extraBtn" type="button" onclick="window.parent.gx6()">ابدأ الجولة</button></article></div>');
addPage(d,'ملفات الدرس','09 · FICHIERS DU COURS','<p class="extraIntro">كل ما يحتاجه الطالب بعد الدرس في صفحة واحدة: التقييم، مركز الألعاب، المراجعة الذكية، ومرجع الدرس بصياغة تعليمية منظمة — بدون عرض الملف الأصلي كما هو وبدون زر تحميل.</p><div class="filesNav"><button class="active" onclick="window.parent.fileTab(\'assessment\',this)">🏆 التقييم</button><button onclick="window.parent.fileTab(\'games\',this)">🎮 مركز الألعاب</button><button onclick="window.parent.fileTab(\'review\',this)">🧠 المراجعة الذكية</button><button onclick="window.parent.fileTab(\'reference\',this)">📘 مرجع الدرس</button></div><div id="fileContent"></div>');
renderFiles(d,'assessment');}
function renderFiles(d,tab){const el=d.getElementById('fileContent');if(!el)return;if(tab==='assessment'){el.innerHTML='<div class="extraGrid">'+assessment.map((q,i)=>'<article class="extraCard"><h3>'+(i+1)+'. '+q[0]+'</h3>'+q[1].map(o=>'<button class="gameOpt" type="button" onclick="window.parent.assessPick(this,'+JSON.stringify(o===q[2])+','+JSON.stringify(q[2])+')">'+o+'</button>').join('')+'<div class="gameFeedback"></div></article>').join('')+'</div><div class="scoreBox" id="assessmentScore">التقييم جاهز — أجب عن الأسئلة الخمسة.</div>'}else if(tab==='games'){el.innerHTML='<div class="extraGrid"><article class="extraCard"><h3>مركز الألعاب</h3><p>انتقل إلى صفحة الألعاب الكاملة، حيث توجد 6 ألعاب للمفردات والتصنيف والذاكرة والسرعة.</p><button class="extraBtn" onclick="window.parent.scrollExtra()">فتح مركز الألعاب</button></article><article class="extraCard"><h3>التدريب الذكي</h3><p>المراجعة تعيد خلط أسئلة الدرس وتستهدف الكلمات والقاعدة.</p><button class="extraBtn secondary" onclick="window.parent.fileTab(\'review\',this)">ابدأ المراجعة</button></article></div>'}else if(tab==='review'){let qs=[['اختر أداة التبعيض: Je voudrais ___ fromage.',['du','de la','des'],'du'],['ما المجموعة التي تنتمي إليها La carotte؟',categories,'الخضروات'],['ما معنى Le panier؟',['السلة','الميزان','الخبز'],'السلة'],['أي كلمة تعني الكرواسون؟',['Le croissant','Le poisson','Le chou'],'Le croissant']];el.innerHTML='<div class="extraGrid">'+qs.map(q=>'<article class="extraCard"><h3>'+q[0]+'</h3>'+q[1].map(o=>'<button class="gameOpt" onclick="window.parent.assessPick(this,'+JSON.stringify(o===q[2])+','+JSON.stringify(q[2])+')">'+o+'</button>').join('')+'<div class="gameFeedback"></div></article>').join('')+'</div>'}else{el.innerHTML='<div class="refGrid"><div class="refLine"><b>موضوع الدرس</b><br>Au marché — في السوق</div><div class="refLine"><b>الهدف</b><br>التعرف على مفردات السوق والأطعمة والفواكه والخضروات، ثم استخدامها في جمل وحوار.</div><div class="refLine"><b>أدوات التبعيض</b><br><b>du</b> للمذكر المفرد · <b>de la</b> للمؤنث المفرد · <b>de l\'</b> قبل حرف متحرك · <b>des</b> للجمع.</div><div class="refLine"><b>الحوار الأساسي</b><br>Bonjour monsieur, vous désirez quoi ?<br>Je voudrais des pommes et des bananes, s\'il vous plaît.</div><div class="refLine"><b>المفردات</b><br>'+vocab.map(x=>x[0]).join(' · ')+'</div><div class="refLine"><b>مسار التعلم</b><br>اكتشف → المفردات → اسمع وانطق → القاعدة → تحدث → التحدي النهائي → الفيديو → الألعاب → ملفات الدرس.</div></div>'}}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}function opts(correct,all){let a=[correct];while(a.length<Math.min(4,all.length)){let x=pick(all);if(!a.includes(x))a.push(x)}return a.sort(()=>Math.random()-.5)}
window.gx1=()=>{const w=pick(vocab);const d=outer.contentDocument.querySelector('iframe').contentDocument;d.getElementById('gx1q').textContent='المعنى: '+w[1];d.getElementById('gx1a').innerHTML='<button class="extraBtn secondary" onclick="this.textContent='+JSON.stringify(w[0])+'">أظهر الإجابة</button>'};window.gx2=()=>{const w=pick(vocab),a=opts(w[0],vocab.map(x=>x[0])),d=outer.contentDocument.querySelector('iframe').contentDocument;d.getElementById('gx2').innerHTML='<b>'+w[1]+'</b>'+a.map(x=>'<button class="gameOpt" onclick="window.parent.gamePick(this,'+JSON.stringify(x===w[0])+','+JSON.stringify(w[0])+')">'+x+'</button>').join('')};let timer;window.gx3=()=>{clearInterval(timer);let left=30;const d=outer.contentDocument.querySelector('iframe').contentDocument;d.getElementById('gx3t').textContent=left+' ثانية';const w=pick(vocab),a=opts(w[0],vocab.map(x=>x[0]));d.getElementById('gx3').innerHTML='<b>'+w[1]+'</b>'+a.map(x=>'<button class="gameOpt" onclick="window.parent.gamePick(this,'+JSON.stringify(x===w[0])+','+JSON.stringify(w[0])+')">'+x+'</button>').join('');timer=setInterval(()=>{left--;d.getElementById('gx3t').textContent=left+' ثانية';if(left<=0)clearInterval(timer)},1000)};window.gx4=()=>{const w=pick(vocab),d=outer.contentDocument.querySelector('iframe').contentDocument;d.getElementById('gx4').innerHTML='<b>'+w[0]+'</b>'+categories.map(x=>'<button class="gameOpt" onclick="window.parent.gamePick(this,'+JSON.stringify(x===w[2])+','+JSON.stringify(w[2])+')">'+x+'</button>').join('')};let mem=[];window.gx5=()=>{const d=outer.contentDocument.querySelector('iframe').contentDocument,chosen=[];while(chosen.length<5){let w=pick(vocab);if(!chosen.find(x=>x[0]===w[0]))chosen.push(w)}let cards=chosen.flatMap(x=>[['w',x[0],x[0]],['a',x[1],x[0]]]).sort(()=>Math.random()-.5);mem=[];d.getElementById('gx5').innerHTML='<div class="memoryGrid">'+cards.map((c,i)=>'<button class="memory" data-i="'+i+'" data-key="'+c[2]+'" onclick="window.parent.memPick(this)">?</button>').join('')+'</div><div id="memStatus" class="gameFeedback"></div>'};window.memPick=b=>{if(b.disabled)return;const d=outer.contentDocument.querySelector('iframe').contentDocument;b.classList.add('open');b.textContent=b.dataset.key;mem.push(b);if(mem.length===2){const[a,c]=mem,ok=a.dataset.key===c.dataset.key&&a!==c;[a,c].forEach(x=>{x.classList.add(ok?'ok':'bad');x.disabled=true});d.getElementById('memStatus').textContent=ok?'أحسنت! زوج صحيح.':'حاول مرة أخرى في الجولة التالية.';mem=[]}};window.gx6=()=>{const d=outer.contentDocument.querySelector('iframe').contentDocument,w=pick(vocab),truth=Math.random()>.5,other=pick(vocab.filter(x=>x[0]!==w[0])),statement=truth?w[0]+' = '+w[1]:w[0]+' = '+other[1];d.getElementById('gx6q').textContent=statement;d.getElementById('gx6').innerHTML='<button class="gameOpt" onclick="window.parent.gamePick(this,'+truth+',\'الحقيقة: '+w[0]+' = '+w[1]+'\')">صح</button><button class="gameOpt" onclick="window.parent.gamePick(this,'+(!truth)+',\'الحقيقة: '+w[0]+' = '+w[1]+'\')">خطأ</button>'};window.gamePick=(b,ok,correct)=>{if(!b||b.parentElement.dataset.done)return;b.parentElement.dataset.done='1';b.classList.add(ok?'ok':'bad');b.parentElement.querySelectorAll('.gameOpt').forEach(x=>x.disabled=true);const f=b.ownerDocument.createElement('div');f.className='gameFeedback';f.textContent=ok?'✅ إجابة صحيحة':'❌ الإجابة الصحيحة: '+correct;b.parentElement.appendChild(f)};let ascore=0,acount=0;window.assessPick=(b,ok,correct)=>{if(b.parentElement.dataset.done)return;b.parentElement.dataset.done='1';acount++;if(ok)ascore++;b.classList.add(ok?'ok':'bad');b.parentElement.querySelectorAll('.gameOpt').forEach(x=>x.disabled=true);const f=b.parentElement.querySelector('.gameFeedback');if(f)f.textContent=ok?'✅ صحيح':'❌ الإجابة الصحيحة: '+correct;const s=outer.contentDocument.querySelector('iframe').contentDocument.getElementById('assessmentScore');if(s)s.textContent='النتيجة: '+ascore+' / '+acount+' — '+(acount===assessment.length?'اكتمل التقييم.':'تابع الإجابة عن باقي الأسئلة.')};window.fileTab=(tab,b)=>{const d=outer.contentDocument.querySelector('iframe').contentDocument;if(!d)return;d.querySelectorAll('.filesNav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');renderFiles(d,tab)};window.scrollExtra=()=>{const d=outer.contentDocument.querySelector('iframe').contentDocument;const el=[...d.querySelectorAll('.extraPage')].find(x=>x.id==='extra-08 · JEUX');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})};
outer.addEventListener('load',()=>{try{const inner=outer.contentDocument,frame=inner.getElementById('lesson');const ready=()=>{try{const d=frame.contentDocument;if(!d?.querySelector('.lessonPages')){const wrap=d?.querySelector('.wrap');const sections=wrap?[...wrap.children].filter(x=>x.classList.contains('section')):[];if(wrap&&sections.length){const sc=d.createElement('div');sc.className='lessonPages';sc.style.cssText='display:flex;gap:18px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 18px;margin-top:18px;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch';sections.forEach(x=>{x.style.marginTop='0';x.style.flex='0 0 min(92vw,1040px)';x.style.width='min(92vw,1040px)';x.style.scrollSnapAlign='start';sc.appendChild(x)});wrap.appendChild(sc);build(d)}else{setTimeout(ready,100);return}}else build(d);const resize=()=>{try{outer.style.height=Math.max(inner.documentElement.scrollHeight,inner.body?.scrollHeight||0,frame.scrollHeight)+'px'}catch(e){}};resize();if(window.ResizeObserver)new ResizeObserver(resize).observe(inner.documentElement);else setInterval(resize,700)}catch(e){setTimeout(ready,150)}};ready()}catch(e){console.error(e)}});
</script></body></html>
