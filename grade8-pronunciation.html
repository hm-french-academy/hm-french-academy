<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | النطق · الصف الثاني الإعدادي</title><style>:root{--n:#102a56;--b:#245bd7;--a:#1686a8;--bg:#f4f7fc;--line:#dfe6f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#14264a;font-family:Arial,Tahoma,sans-serif}.wrap{width:min(1120px,calc(100% - 24px));margin:auto;padding:18px 0 40px}.head{background:#fff;border:1px solid var(--line);border-radius:20px;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center;position:sticky;top:10px;z-index:5}.brand{font-weight:900;color:var(--n);text-decoration:none}.links{display:flex;gap:7px;flex-wrap:wrap}.links a,.btn{border:0;border-radius:12px;padding:9px 12px;font-weight:800;text-decoration:none;background:#edf3ff;color:#173a82;cursor:pointer}.hero{margin-top:14px;background:linear-gradient(135deg,#15566b,#1686a8,#3eb4c6);color:#fff;border-radius:28px;padding:26px}.hero h1{margin:0 0 6px;font-size:clamp(28px,5vw,42px)}.hero p{margin:0;line-height:1.8}.tools{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}.tools input{flex:1;min-width:190px;border:0;border-radius:12px;padding:12px;font-weight:700}.panel{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px}.note{background:#f7f9fd;border-right:4px solid var(--a);border-radius:14px;padding:13px;line-height:1.8;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:18px;padding:15px;background:#fff}.word{direction:ltr;text-align:left;font-size:21px;font-weight:900;color:#173a82}.meaning{color:#52627a;font-weight:800;margin-top:5px}.pronote{margin-top:11px;background:#f7f9fd;border-radius:13px;padding:11px;line-height:1.8;font-size:14px}.listen{margin-top:10px;background:#245bd7;color:#fff;border:0;border-radius:11px;padding:10px 14px;font-weight:900;cursor:pointer}.empty{text-align:center;padding:30px;color:#66758d}.count{font-weight:900;color:#66758d;margin-bottom:12px}@media(max-width:600px){.head{position:static}.wrap{width:min(100% - 16px,1120px)}.hero{padding:21px;border-radius:22px}.panel{padding:13px}}</style></head><body><main class="wrap"><header class="head"><a class="brand" href="index.html">🇫🇷 HM Academy</a><div class="links"><a id="back" href="lesson-studio-standard.html">↩ العودة للدرس</a><a id="video" href="grade8-video.html">🎬 الفيديو</a></div></header><section class="hero"><h1>🎧 النطق</h1><p id="subtitle">ملاحظات النطق الخاصة بكلمات الدرس — الصف الثاني الإعدادي</p><div class="tools"><input id="search" placeholder="ابحث عن كلمة…"><button class="btn" onclick="document.getElementById('search').value='';render()">مسح</button></div></section><section class="panel"><div class="note"><b>كيف تتعلم؟</b><br>استمع أولًا، ثم اقرأ ملاحظة النطق، وبعدها كرر الكلمة بصوتك. الملاحظات هنا مرتبطة بالكلمات المسجلة للدرس وليست شرحًا عامًا منفصلًا.</div><div class="count" id="count"></div><div class="grid" id="grid"></div></section></main><script>const q=new URLSearchParams(location.search),id=q.get('id')||'grade8-u1-l1';const paths={'grade8-u1-l1':'data/lessons/grade-8/unit-1/lesson-1.json','grade8-u1-l2':'data/lessons/grade-8/unit-1/lesson-2.json','grade8-u1-l3':'data/lessons/grade-8/unit-1/lesson-3.json','grade8-u1-l4':'data/lessons/grade-8/unit-1/lesson-4.json','grade8-u2-l1':'data/lessons/grade-8/unit-2/lesson-1.json','grade8-u2-l2':'data/lessons/grade-8/unit-2/lesson-2.json','grade8-u2-l3':'data/lessons/grade-8/unit-2/lesson-3.json','grade8-u2-l4':'data/lessons/grade-8/unit-2/lesson-4.json','grade8-u3-l1':'data/lessons/grade-8/unit-3/lesson-1.json','grade8-u3-l2':'data/lessons/grade-8/unit-3/lesson-2.json','grade8-u3-l3':'data/lessons/grade-8/unit-3/lesson-3.json','grade8-u3-l4':'data/lessons/grade-8/unit-3/lesson-4.json'};let d={},notes={};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}function render(){const term=(document.getElementById('search').value||'').toLowerCase();const words=(d.vocabulary||[]).filter(x=>(x.word||'').toLowerCase().includes(term));const map=notes[id]||{};document.getElementById('count').textContent=`${words.length} كلمة معروضة`;document.getElementById('grid').innerHTML=words.map(x=>{const n=map[x.word]||map[(x.word||'').replace(/^Une |^Un |^Des |^Le |^La |^L'/,'')]||'استمع إلى الكلمة وركز على الأصوات المميزة والحروف النهائية.';return `<article class="card"><div class="word">${esc(x.word)}</div><div class="meaning">${esc(x.translation||'')}</div><div class="pronote"><b>💡 ملاحظة النطق:</b><br>${esc(n)}</div><button class="listen" onclick='speak(${JSON.stringify(x.word||'')})'>🔊 استمع للنطق</button></article>`}).join('')||'<div class="empty">لا توجد كلمات مطابقة.</div>'}async function load(){try{const [a,b]=await Promise.all([fetch(paths[id]||paths['grade8-u1-l1']+'?v=20260908-media',{cache:'no-store'}),fetch('data/lessons/grade-8/pronunciation-notes.json?v=20260908-media',{cache:'no-store'})]);d=JSON.parse(await a.text());if(typeof d.content==='string')d=JSON.parse(d.content);notes=JSON.parse(await b.text());if(typeof notes.content==='string')notes=JSON.parse(notes.content);document.getElementById('subtitle').textContent=`${d.titleAr||''} · ${d.titleFr||''}`;document.getElementById('back').href=`lesson-studio-standard.html?id=${encodeURIComponent(id)}&section=lesson`;document.getElementById('video').href=`grade8-video.html?id=${encodeURIComponent(id)}`;render()}catch(e){document.getElementById('grid').innerHTML='<div class="empty">تعذر تحميل بيانات النطق.</div>'}}document.getElementById('search').addEventListener('input',render);load();</script></body></html>
