<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14264a"><title>HM Academy | Ensemble</title><link rel="stylesheet" href="css/premium-shell.css?v=20260908-ensemble-grade"><style>body{background:#f6f8fc}.wrap{max-width:1180px;margin:auto;padding:18px 12px 60px}.hero{background:linear-gradient(120deg,#14264a,#1f5599 60%,#9d2940);color:#fff;border-radius:28px;padding:30px 24px;box-shadow:0 20px 50px #14264a20}.hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,48px)}.hero p{margin:0;line-height:1.9}.back{display:inline-block;color:#fff;text-decoration:none;font-weight:900;margin-bottom:15px}.module{background:#fff;border:1px solid #e0e7f1;border-radius:24px;margin-top:16px;overflow:hidden;box-shadow:0 12px 30px #14264a08}.mhead{padding:20px;background:linear-gradient(135deg,#f4f7ff,#fff);border-bottom:1px solid #e6ebf2}.mhead h2{margin:0;color:#14264a}.mhead p{margin:6px 0;color:#64748b}.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px}.box{border:1px solid #e4eaf2;border-radius:16px;padding:14px}.box strong{display:block;color:#14264a;margin-bottom:7px}.box span{display:block;color:#68758b;line-height:1.8}.actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 18px}.btn{border:1px solid #dce5f2;background:#f8faff;color:#2457a5;text-decoration:none;border-radius:12px;padding:9px 12px;font-weight:900;font-size:13px}.btn.primary{background:#2563eb;color:#fff;border-color:#2563eb}.enrich{margin:0 16px 18px;padding:14px;border-radius:16px;background:#f5f0ff;border:1px solid #e4d8fb;color:#5d3ca1;line-height:1.8}.lesson-panel{display:none;padding:20px;border-top:1px solid #e6ebf2;background:#fbfcff}.lesson-panel.active{display:block}.lesson-panel h3{color:#14264a}.lesson-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.lesson-step{padding:12px;border:1px solid #e0e7f1;border-radius:14px;background:#fff}.lesson-step b{display:block;margin-bottom:5px;color:#2563eb}.lesson-step small{color:#66758b;line-height:1.7}@media(max-width:800px){.cols{grid-template-columns:1fr}.lesson-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.lesson-grid{grid-template-columns:1fr}}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="index.html">🏠 الرئيسية</a><a href="course.html">📚 المناهج</a><a href="ensemble.html">🇫🇷 Ensemble</a><a href="student-profile.html">👨‍🎓 الطالب</a></nav><div class="hm-tools"><select class="hm-lang" data-lang-select><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select></div></header><main class="wrap"><section class="hero"><a class="back" href="ensemble.html">← العودة إلى Ensemble</a><h1 id="title">Ensemble</h1><p id="sub">هيكل المنهج</p></section><section id="modules"></section></main><script src="scripts/i18n.js?v=20260908-ensemble-grade"></script><script>const grade=new URLSearchParams(location.search).get('grade')||'1';let data=null;function render(){const g=data.grades.find(x=>x.id==='ensemble-'+grade)||data.grades[0];title.textContent='🇫🇷 Ensemble — '+g.label;sub.textContent=g.fr+' · 6 Modules · مسار تعلّم متكامل';modules.innerHTML=g.modules.map((m,i)=>`<article class="module"><div class="mhead"><h2>Module ${i+1} — ${m.title}</h2><p>${m.ar}${m.pages?' · صفحات الكتاب: '+m.pages:''}</p></div><div class="cols"><div class="box"><strong>🎯 أهداف التعلم</strong><span>${m.objectives.join(' · ')}</span></div><div class="box"><strong>📚 Vocabulaire</strong><span>${m.vocab.join(' · ')}</span></div><div class="box"><strong>🧩 Grammaire</strong><span>${m.grammar.join(' · ')}</span></div><div class="box"><strong>🔊 Phonétique</strong><span>${m.phonetics.join(' · ')}</span></div><div class="box"><strong>🌍 Culture</strong><span>${m.culture}</span></div><div class="box"><strong>🏆 Tâche finale</strong><span>${m.task}</span></div></div><div class="enrich">✨ <b>إثراء HM Academy:</b> شرح مبسط + أمثلة إضافية + بطاقات مفردات مصورة + نطق وتكرار + استماع تفاعلي + قراءة + محادثة + كتابة + تدريب متدرج + ألعاب + اختبار جاهزية + تشخيص + مراجعة ذكية.</div><div class="actions"><button class="btn primary" onclick="toggle(${i})">📖 فتح بنية الدرس</button><a class="btn" href="smart-review.html?lesson=ensemble-${grade}-${i+1}">🧠 مراجعة ذكية</a></div><div class="lesson-panel" id="p${i}"><h3>بنية الدرس الكاملة — من البداية إلى الإتقان</h3><div class="lesson-grid"><div class="lesson-step"><b>01 · Introduction</b><small>مدخل بصري، موقف تواصلي، أهداف الدرس وما الذي ستتعلمه.</small></div><div class="lesson-step"><b>02 · Découverte</b><small>اكتشاف المحتوى من خلال صورة/حوار/سياق قبل القاعدة.</small></div><div class="lesson-step"><b>03 · Vocabulaire</b><small>مفردات أساسية، صور، نطق، معنى، أمثلة، استرجاع متباعد.</small></div><div class="lesson-step"><b>04 · Grammaire</b><small>شرح القاعدة بالعربية والفرنسية، نمط، أمثلة، أخطاء شائعة.</small></div><div class="lesson-step"><b>05 · Phonétique</b><small>تمييز الصوت، الاستماع، الترديد، التسجيل الذاتي والتصحيح.</small></div><div class="lesson-step"><b>06 · Compréhension</b><small>استماع وقراءة بأسئلة تدرج من الفهم المباشر إلى الاستنتاج.</small></div><div class="lesson-step"><b>07 · Production</b><small>تحدث وكتابة بمهمات قصيرة ثم مهمة تواصلية كاملة.</small></div><div class="lesson-step"><b>08 · Culture</b><small>نافذة ثقافية مرتبطة بموضوع الوحدة ومقارنة مناسبة للسياق المصري.</small></div><div class="lesson-step"><b>09 · Entraînement</b><small>تدريبات تفاعلية مع تصحيح فوري وشرح سبب الإجابة الصحيحة.</small></div><div class="lesson-step"><b>10 · Défi</b><small>تحدٍ قصير أو لعبة تثبت استخدام اللغة في موقف حقيقي.</small></div><div class="lesson-step"><b>11 · Évaluation</b><small>اختبار تكويني، جاهزية، ثم تشخيص منفصل لقياس نقطة البداية.</small></div><div class="lesson-step"><b>12 · Maîtrise</b><small>مهمة ختامية + تقييم ذاتي + مراجعة ذكية تعتمد على أخطاء الطالب.</small></div></div></div></article>`).join('')}function toggle(i){document.getElementById('p'+i).classList.toggle('active')}fetch('data/ensemble-curriculum.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(x=>{data=x;render()}).catch(()=>modules.innerHTML='<article class="module"><div class="mhead">تعذر تحميل محتوى Ensemble.</div></article>');</script></body></html>
