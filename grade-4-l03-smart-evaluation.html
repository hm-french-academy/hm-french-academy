<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | التقييم التفاعلي — L'heure</title><style>body{margin:0;background:#f4f7fb;color:#20354d;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:16px}.head,.card,.result{background:#fff;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 7px 25px #20354d12}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.q{border:1px solid #dce5ee;border-radius:17px;padding:16px}.choice{display:block;width:100%;text-align:right;background:#fff;border:1px solid #dce5ee;border-radius:11px;padding:11px;margin:7px 0;cursor:pointer}.choice.ok{background:#eaf8ef;border-color:#57a675}.choice.no{background:#fff0f0;border-color:#d66}.fr{direction:ltr;text-align:left;font-size:20px;font-weight:900}.muted{color:#66788b;line-height:1.8}.result{display:none;background:linear-gradient(135deg,#e8f7ff,#fff1f5)}.btn{border:0;border-radius:12px;padding:12px 16px;background:#4169e1;color:#fff;font-weight:900;cursor:pointer}.score{font-size:38px;font-weight:900;color:#4169e1}</style></head><body><main class="wrap"><section class="head"><a href="grade-4-l03-learning-studio-v2.html">← العودة إلى الدرس</a><h1>✨ التقييم التفاعلي — L'heure</h1><p class="muted">هذا اختبار خاص بالمنصة، وليس نسخة من التدريب ولا بديلًا عن التقييم الرسمي. يقيس الفهم في أكثر من مهارة.</p></section><section id="quiz" class="grid"></section><section id="result" class="result"></section></main><script>(function(){const qs=[{t:'قراءة الساعة',q:'3:15',a:['Il est trois heures et quart.','Il est trois heures et demie.','Il est quatre heures moins le quart.'],ok:0},{t:'الساعة والنصف',q:'1:30',a:['Il est une heure et quart.','Il est une heure et demie.','Il est deux heures et demie.'],ok:1},{t:'إلا ربعًا',q:'9:45',a:['Il est neuf heures et quart.','Il est neuf heures et demie.','Il est dix heures moins le quart.'],ok:2},{t:'heure أم heures؟',q:'اختر الجملة الصحيحة.',a:['Il est une heures.','Il est une heure.','Il est un heures.'],ok:1},{t:'midi أم minuit؟',q:'12:00 ظهرًا',a:['Il est midi.','Il est minuit.','Il est midi et quart.'],ok:0},{t:'طريقة السؤال',q:'تريد أن تسأل شخصًا: كم الساعة؟',a:['Quelle heure est-il ?','À quelle heure commence le cours ?','Quelle heures est-il ?'],ok:0},{t:'سؤال عن موعد',q:'تسأل عن موعد بداية الحصة.',a:['Quelle heure est-il ?','À quelle heure commence le cours ?','À quelles heure commence le cours ?'],ok:1},{t:'موقف حياتي',q:'الحافلة تصل 8:30.',a:['Elle arrive à huit heures et quart.','Elle arrive à huit heures et demie.','Elle arrive à neuf heures et demie.'],ok:1}];let score=0,done=0;const root=document.getElementById('quiz');root.innerHTML=qs.map((x,i)=>'<article class="q" data-i="'+i+'"><b>'+x.t+'</b><h3 class="fr">'+x.q+'</h3>'+x.a.map((a,j)=>'<button class="choice" data-j="'+j+'">'+a+'</button>').join('')+'<p class="feedback muted"></p></article>').join('');root.querySelectorAll('.q').forEach(card=>card.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{if(card.dataset.done)return;card.dataset.done='1';const q=qs[+card.dataset.i],j=+btn.dataset.j;card.querySelectorAll('.choice').forEach(b=>b.disabled=true);if(j===q.ok){score++;btn.classList.add('ok');card.querySelector('.feedback').textContent='✅ صحيح';}else{btn.classList.add('no');card.querySelectorAll('.choice')[q.ok].classList.add('ok');card.querySelector('.feedback').textContent='❌ راجع القاعدة المرتبطة بهذا السؤال.'}done++;if(done===qs.length)finish() }));function finish(){const pct=Math.round(score/qs.length*100),msg=pct>=90?'ممتاز — أتقنت أهم مهارات الدرس.':pct>=70?'جيد جدًا — بقيت نقاط بسيطة للمراجعة.':'تحتاج مراجعة — راجع القواعد ثم أعد المحاولة.';const r=document.getElementById('result');r.style.display='block';r.innerHTML='<div class="score">'+score+' / '+qs.length+'</div><h2>'+pct+'% — '+msg+'</h2><p class="muted">للمراجعة: heure/heures · et quart · et demie · moins le quart · midi/minuit · طرق السؤال.</p><a class="btn" href="grade-4-l03-learning-studio-v2.html">العودة إلى الدرس</a> <a class="btn" href="grade-4-l03-official-evaluation.html">التقييم الرسمي</a>'}})();</script></body></html>
