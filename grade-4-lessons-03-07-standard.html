title.textContent=D.fr+" · "+D.ar;subtitle.textContent="Learning Studio · المحتوى الأصلي للدرس فقط · الصف الرابع الابتدائي";

function speak(t){if("speechSynthesis"in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.78;speechSynthesis.speak(u)}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function shell(tag,h,p){return '<span class="tag">'+tag+"</span><h2>"+h+'</h2><p class="muted">'+p+"</p>"}
function vocabulary(){return shell("02 · المفردات","المفردات — اكتشف الصورة ثم اسمع الكلمة","كل بطاقة مرتبطة مباشرة بمفردات هذا الدرس. اضغط على البطاقة لسماع الفرنسية.")+'<div class="grid">'+D.v.map(x=>'<article class="card click" onclick="speak('+JSON.stringify(x[1])+')"><div class="visual">'+x[0]+'</div><div class="fr">'+esc(x[1])+'</div><p>'+esc(x[2])+'</p><button class="sound" onclick="event.stopPropagation();speak('+JSON.stringify(x[1])+')">🔊 اسمع</button></article>').join("")+"</div>"}

function conversation(){let lines=D.q.map(x=>[x[0],x[2]]);return shell("05 · المحادثة","محادثة قصيرة — استخدم اللغة في موقف","المحادثة هنا مبنية على جمل وظيفية وليست إعادة نطق قائمة المفردات.")+'<div class="dialogue">'+lines.map((x,i)=>'<div class="line"><b>'+(i%2?'👧':'👦')+" "+esc(x[0])+"</b><br><span class="fr">"+esc(x[1])+'</span> <button class="sound" onclick="speak('+JSON.stringify(x[1])+')">🔊</button></div>').join("")+"</div>"}
function practice(){return shell("06 · التدريب","تدريب متدرج","أنشطة اختيار وربط وتصحيح فوري حتى لا تبقى الصفحة فارغة.")+'<div class="grid">'+D.practice.map((x,i)=>'<article class="card"><div class="visual">'+x[0]+'</div><h3 class="fr">'+esc(x[1])+'</h3><button class="choice" data-practice="'+i+'">هل هذه الإجابة مناسبة؟</button><div class="feedback"></div></article>').join("")+"</div>"}

function games(){let pairs=D.v.slice(0,6);return shell("08 · الألعاب","الألعاب — تحدي المطابقة","لعبة مطابقة الصورة بالعبارة الفرنسية الخاصة بهذا الدرس.")+'<div class="grid">'+pairs.map((x,i)=>'<article class="card click" data-game="'+i+'"><div class="visual">'+x[0]+'</div><h3 class="fr">'+esc(x[1])+'</h3><button class="choice" onclick="gameCheck(this,'+i+')">🎯 اختر</button><div class="feedback"></div></article>').join("")+"</div>"}
function assessment(){return shell("09 · التقييم","التقييم الرسمي","الاختبار الإلكتروني الرسمي المرتبط بهذا الدرس فقط. لا يتم اختراع أسئلة رسمية بديلة.")+'<article class="card"><h3>📝 التقييم الرسمي</h3><p>المصدر: '+esc(D.eval)+' · الاختبار الإلكتروني: '+esc(D.exam)+'</p><a class="btn" href="'+root+D.exam+'" target="_blank">فتح الاختبار الرسمي</a><a class="btn light" href="'+root+D.eval+'" target="_blank">فتح ملف التقييم المرجعي</a></article>'}
function progress(){let k="g4-"+id+"-done",done=localStorage.getItem(k)==="1";return shell("10 · بعد الرحلة","بعد الرحلة — ماذا تعلمت؟","ملخص ختامي خاص بالدرس، مع روابط المصدر المرجعي والتقييم.")+'<div class="grid"><article class="card"><h3>🎯 أهداف الدرس</h3><ul><li>تمييز مفردات الدرس وفهم معناها.</li><li>استخدامها في جمل ومواقف قصيرة.</li><li>تطبيق القاعدة/النمط الخاص بهذا الدرس.</li><li>الاستماع والنطق ثم التدريب والتقييم.</li></ul></article><article class="card"><h3>📄 المرجع الأصلي</h3><p>'+esc(D.ref)+'</p><a class="btn" href="'+root+D.ref+'" target="_blank">فتح المرجع</a></article><article class="card"><h3>🏁 حالة الدرس</h3><div class="progress"><i style="width:'+(done?100:70)+'%"></i></div><p>'+ (done?"✅ اكتمل الدرس":"⏳ لم يتم اعتماد الإكمال بعد")+'</p><button class="btn" id="doneBtn">'+(done?"إلغاء الإكمال":"اعتماد إكمال الدرس")+"</button></article></div>"}
