;document.getElementById('ey').textContent='Le français · 4e année · '+id.replace('g4-l','Leçon ');document.getElementById('title').textContent=x.fr+' · '+x.ar;document.getElementById('sub').textContent='Premium Learning Studio — هذا الدرس فقط';nav.innerHTML=ST.map(s=>`<button data-s="${s[0]}">${s[1]}</button>`).join('');function say(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.8;speechSynthesis.speak(u)}function head(a,b,c){return `<span class="tag">${a}</span><h2>${b}</h2><p class="muted">${c}</p>`}function q(qv){return `<article class="card"><h3>${qv[0]}</h3>${qv[1].map(v=>`<button class="c" data-a="${v}" data-c="${qv[2]}">${v}</button>`).join('')}<p class="fb"></p></article>`}function render(s){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));let h='';if(s==='home')h=head('01','ابدأ الرحلة','كل محطة لها وظيفة مختلفة.')+`<div class="g"><article class="card"><div class="pic">${x.v[0][0]}</div><h3>هدف الدرس</h3><p>مفردات ثم فهم وقاعدة وتفاعل ومحادثة وتدريب وفيديو وألعاب وتقييم ومراجعة.</p><button class="btn" data-go="vocab">ابدأ الآن</button></article><article class="card"><h3>المصادر الأصلية</h3><p>${x.folder}/${x.ref}</p><p>${x.folder}/${x.exam}</p></article></div>`;if(s==='vocab')h=head('02','المفردات','الصورة توضح المعنى فقط، ولا توجد إجابة مخفية تحتها.')+`<div class="g">${x.v.map(v=>`<article class="card"><div class="pic">${v[0]}</div><h3 class="fr">${v[1]}</h3><p>${v[2]}</p><button class="btn" data-say="${v[1]}">🔊</button></article>`).join('')}</div>`;if(s==='under')h=head('03','افهم','أمثلة استعمالية من نفس موضوع الدرس.')+`<div class="g">${x.v.slice(0,6).map(v=>`<article class="card"><div class="pic">${v[0]}</div><p class="fr">${v[1]}</p><p>${v[2]}</p></article>`).join('')}</div>`;if(s==='rules')h=head('04','القاعدة','شرح قبل التطبيق، دون كشف حلول التدريب.')+x.r.map(v=>`<div class="rule"><b>${v[0]}</b> — <span class="fr">${v[1]}</span><br>${v[2]}</div>`).join('');if(s==='inter')h= ,...a.map((v,i)=>({t:v[2],k:i}))].sort(()=>Math.random()-.5)}box.innerHTML='<p>طابق الفرنسية بالمعنى.</p><div class="memory">'+pairs.map((v,i)=>`<button data-mi="${i}">${open.includes(i)||matched.includes(i)?v.t:'؟'}</button>`).join('')+'</div><p>مطابقات: '+matched.length/2+'</p>'}}draw();document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{mode=b.dataset.g;r=0;score=0;pairs=[];open=[];matched=[];draw()});box.onclick=e=>{let a=e.target.closest('[data-ga]');if(a){if(a.dataset.ga===a.dataset.gc)score++;r++;draw()}let m=e.target.closest('[data-mi]');if(m&&!matched.includes(+m.dataset.mi)){let i=+m.dataset.mi;if(open.includes(i))return;open.push(i);draw();if(open.length===2){let[a,b]=open;if(pairs[a].k===pairs[b].k){matched.push(a,b);open=[];draw()}else setTimeout(()=>{open=[];draw()},600)}}}}nav.onclick=e=>{let b=e.target.closest('[data-s]');if(b)render(b.dataset.s)};render('home')})();</script></body></html>
