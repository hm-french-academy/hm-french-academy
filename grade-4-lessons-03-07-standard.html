[1]}">🔊 اسمع</button></article>`).join('')}</div>`;if(s==='under')h=head('03','افهم','شاهد، انطق، ثم استخدم العبارة في سياقها.')+`<div class="grid">${x.v.slice(0,6).map(v=>`<article class="card"><div class="pic">${v[0]}</div><p class="fr">${v[1]}</p><p>${v[2]}</p><button class="btn" data-say="${v[1]}">🔊 اسمع</button></article>`).join('')}</div>`;if(s==='rules')h=head('04','القاعدة','شرح القاعدة قبل التطبيق، بدون كشف إجابات التدريب.')+x.r.map(r=>`<div class="rule"><b>${r[0]}</b> — <span class="fr">${r[1]}</span><br>${r[2]}</div>`).join('');if(s==='inter')h=head('05','تفاعل','أسئلة مختلفة والاختيارات موزعة؛ لا توجد قاعدة أن الإجابة الأولى صحيحة.')+`<div class="grid">${qs(x.i)}</div>`;if(s==='talk')h=head('06','المحادثة','الحوار هنا من نفس موضوع الدرس؛ السؤال والإجابة متوافقان.')+x.t.map(t=>`<div class="reviewBox"><b>👦 ${t[0]}</b><br><span class="fr">${t[1]}</span><br><b>👧 ${t[1]}</b><br><span class="fr">${t[1]}</span> <button class="btn" data-say="${t[1]}">🔊 السؤال</button> <button class="btn" data-say="${t[1]}">🔊 الحوار</button></div>`).join('');if(s==='practice')h=head('07','التدريب','لا نضع الإجابة تحت الصورة ثم نسأل عنها؛ المطلوب هو الاستدلال والاختيار.')+`<div class="grid">${x.p.map(q=>`<article class="card"><div class="pic">${q[0]}</div><h3>${q[1]}</h3>${q[2].map(o=>`<button class="choice" data-a="${o}" data-c="${q[3]}">${o}</button>`).join('')}<p class="feedback"></p></article>`).join('')}</div>`;if(s==='media')h=head('08','الفيديو الأصلي','الفيديو الموجود في المصدر الأصلي للدرس، مضمّن داخل الصفحة.')+`<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${x.video}?rel=0" title="${x.fr}" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe></div><p class="muted"><a target="_blank" href="https://www.youtube.com/watch?v=${x.video}">فتح الفيديو مباشرة</a></p>`;if(s==='games')h=head('09','مركز الألعاب','ألعاب لها أهداف مختلفة: تصنيف، موقف، تصحيح، وذاكرة.')+`<div class="tabs"><button class="gameTab" data-g="class">🧩 تصنيف</button><button class="gameTab" data-g="scene">🎬 موقف</button><button class="gameTab" data-g="fix">⚡ صحّح</button><button class="gameTab" data-g="memory">🧠 ذاكرة</button></div><div id="game" class="game">اختر لعبة.</div>`;if(s==='assessment')h=head('10','التقييم الرسمي','لا ننسخ أسئلة التدريب هنا. التقييم مرتبط بملف الاختبار الرسمي للدرس.')+`<div class="card"><h3>🏆 الاختبار الإلكتروني الرسمي</h3><p>${x.exam}</p><a class="btn" target="_blank" href="${root}${x.exam}">فتح الاختبار الرسمي</a></div>`;if(s==='smart')h=head('11','المراجعة الذكية','تشخيص سريع لأربع مهارات: مفردات، قاعدة، استخدام، وتحدي. الأسئلة مختلفة عن التدريب.')+`<div class="grid">${qs(x.s)}</div>`;if(s==='after')h=head('12','بعد الرحلة','ماذا تعلمت؟ ثم ارجع إلى المصدر الأصلي عند الحاجة.')+`<div class="grid"><article class="card"><h3>🎯 تحقق ذاتي</h3><p>هل تستطيع قراءة المفردات، اختيار القاعدة الصحيحة، واستخدامها في حوار قصير دون مساعدة؟</p></article><article class="card"><a class="btn" target="_blank" href="${root}${x.ref}">فتح المرجع الأصلي</a></article></div>`;page.innerHTML=h;bind();if(s==='games')games()}
function bind(){page.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>render(b.dataset.go));page.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say));page.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{let c=b.dataset.a===b.dataset.c,box=b.closest('.card');box.querySelectorAll('.choice').forEach(z=>z.disabled=true);b.classList.add(c?'ok':'no');box.querySelector('.feedback').textContent=c?'✅ صحيح':'❌ حاول مرة أخرى'});}
function games(){const box=document.getElementById('game');let game='class',round=0,score=0,pairs=[];function draw(){if(game==='class'){let possess=x.fr.includes('possessifs'),items=possess?(x.fr.includes('visage')?['mon nez','ma bouche','mes yeux','mon oreille']:['mon bras','ma main','mes jambes','mon pied']):['le nez','la bouche','les yeux','une oreille'];box.innerHTML='<div class="score">النقاط: '+score+'</div><p>اختر العبارة التي تنتمي إلى الفئة المطلوبة:</p>'+items.map((v,i)=>`<button class="choice" data-game-answer="${i}" data-game-correct="${possess?(v.startsWith('mon')?0:v.startsWith('ma')?1:2):(v.startsWith('le')?0:v.startsWith('la')?1:2)}">${v}</button>`).join('')}else if(game==='scene'){let t=x.t[round%x.t.length];box.innerHTML='<div class="score">النقاط: '+score+'</div><p class="fr">'+t[0]+'</p><p>أي إجابة تناسب السؤال؟</p>'+[t[1],x.t[(round+1)%x.t.length][1],x.t[(round+2)%x.t.length][1]].map((v,i)=>`<button class="choice" data-game-answer="${i}" data-game-correct="0">${v}</button>`).join('')}else if(game==='fix'){let q=x.p[round%x.p.length];box.innerHTML='<div class="score">النقاط: '+score+'</div><p>'+q[0]+' — '+q[1]+'</p>'+q[2].map((v,i)=>`<button class="choice" data-game-answer="${i}" data-game-correct="${q[2].indexOf(q[3])}">${v}</button>`).join('')}else{if(!pairs.length){let a=x.v.slice(0,6);pairs=[...a.map((v,i)=>({t:v[1],k:i})),...a.map((v,i)=>({t:v[2],k:i}))].sort(()=>Math.random()-.5)}box.innerHTML='<div class="score">مطابقات: 0 / 6</div><div class="memory">'+pairs.map((v,i)=>`<button data-mi="${i}">${v.t}</button>`).join('')+'</div>'}}box.parentNode.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{game=b.dataset.g;round=0;score=0;pairs=[];draw()});box.onclick=e=>{let a=e.target.closest('[data-game-answer]');if(a){if(a.dataset.gameAnswer===a.dataset.gameCorrect)score++;round++;draw()}};draw()}nav.onclick=e=>{let b=e.target.closest('[data-s]');if(b)render(b.dataset.s)};render('home')})();</script></body></html>
