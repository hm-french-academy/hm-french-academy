<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy · الصف الرابع · الدروس 4–7</title><style>body{margin:0;background:#f4f7fb;color:#17324d;font-family:Arial,Cairo,sans-serif}.w{max-width:1100px;margin:auto;padding:14px}.b{background:#fff;border-radius:22px;padding:20px;margin:10px 0}.nav{display:flex;gap:7px;overflow:auto;position:sticky;top:0;background:#fff;padding:9px;z-index:5}.nav button,.btn,.c{border:0;border-radius:12px;padding:10px 13px;font-weight:900;cursor:pointer}.nav button{background:#edf2f7;white-space:nowrap}.on,.btn{background:#4169e1!important;color:#fff}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.card,.game{border:1px solid #dce5ee;border-radius:17px;padding:15px}.pic{height:120px;border-radius:14px;background:#eef7ff;display:grid;place-items:center;font-size:55px}.fr{direction:ltr;text-align:left;font-size:20px;font-weight:900}.tag{display:inline-block;background:#e7f3ff;color:#1260a8;padding:5px 10px;border-radius:99px;font-weight:900}.muted{color:#65778a;line-height:1.8}.c{display:block;width:100%;margin:6px 0;background:#fff;border:2px solid #dce5ee;text-align:right}.ok{background:#eaf7ee!important}.no{background:#fff0f0!important}.fb{min-height:22px;font-weight:900}.video{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#111}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.step{padding:13px;border-radius:14px;background:#f7faff;margin:8px 0}</style><body><main class="w"><header class="b"><a href="grade-4.html">← الصف الرابع</a> · HM Academy</header><section class="b"><span id="tag" class="tag"></span><h1 id="title"></h1><p>مصادر الدروس الأصلية هي المرجع؛ الواجهة هنا إعادة تقديم تفاعلية فقط.</p></section><nav id="nav" class="nav"></nav><section id="page" class="b"></section></main><script>(function(){const A={

=='under')h=head('03','افهم','تعرّف المعنى من الصورة والسياق قبل الاختبار.')+`<div class="g">${x.v.map(v=>`<article class="card"><div class="pic">${v[0]}</div><h3 class="fr">${v[1]}</h3></article>`).join('')}</div>`;if(s==='rules')h=head('04','القاعدة','استنتاج القاعدة من محتوى الدرس.')+`<article class="card"><p>${id==='g4-l05'||id==='g4-l07'?'<b>mon</b> مفرد مذكر · <b>ma</b> مفرد مؤنث · <b>mes</b> جمع.':'<b>le</b> مذكر · <b>la</b> مؤنث · <b>les</b> جمع.'}</p></article>`;if(s==='inter')h=head('05','تفاعل','أسئلة متنوعة؛ لا تظهر الإجابة بجوار السؤال.')+cards(x.q,'جولة');if(s==='talk')h=head('06','المحادثة','الحوار والإجابة من نفس موضوع الدرس.')+`<div class="g">${x.v.slice(0,3).map((v,i)=>`<article class="card"><p class="fr">${id==='g4-l04'?['Montre-moi le nez.','Montre-moi les yeux.','Qu’est-ce que c’est ?'][i]:id==='g4-l05'?['C’est ton nez ?','Et tes yeux ?','Où est ta bouche ?'][i]:id==='g4-l06'?['Montre ton bras.','Et ta main ?','Qu’est-ce que c’est ?'][i]:['C’est ton bras ?','Et ta main ?','Tes jambes ?'][i]}</p><p class="fr">${v[1]}</p><button class="btn" data-say="${v[1]}">🔊</button></article>`).join('')}</div>`;if(s==='practice')h=head('07','التدريب','تطبيق متعدد البنود ولا توجد الإجابة مكتوبة في السؤال.')+cards(x.q,'تدريب');if(s==='media')h=x.video?head('08','الفيديو الأصلي','المصدر المثبت للدرس.')+`<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${x.video}?rel=0" title="${x.fr}" allowfullscreen></iframe></div>`:head('08','الفيديو','لا يوجد فيديو مثبت لهذا الدرس؛ لا نستبدله بفيديو من درس آخر.')+`<article class="card"><p>تم الحفاظ على المصدر الأصلي دون اختراع رابط.</p></article>`;if(s==='games')h=head('09','مركز الألعاب','ثلاث ألعاب مختلفة، وكل لعبة تبدأ بعدة جولات قابلة لإعادة اللعب.')+`<div class="g"><article class="game"><h3>🔎 محقق المفردة</h3>${cards(x.q,'تحقيق')}</article><article class="game"><h3>🧩 صحح الخطأ</h3>${cards(x.q.map(q=>[q[0],q[1],q[2]]),'تصحيح')}</article><article class="game"><h3>🎧 اسمع واختر</h3>${cards(x.q,'استماع')}</article></div>`;if(s==='assessment')h=head('10','التقييم الرسمي','ملف التقييم الرسمي منفصل عن التدريب والمراجعة.')+`<article class="card"><h3>🏆 ${x.exam}</h3><div class="step">لا نعيد أسئلة التدريب هنا.</div><a class="btn" target="_blank" href="${R}${x.exam}">بدء التقييم الرسمي</a></article><article class="card"><a class="btn" target="_blank" href="${R}${x.ev}">فتح مرجع التقييم</a></article>`;if(s==='smart')h=head('11','المراجعة الذكية','استرجاع وتصحيح وتمييز، وليست نسخة من التدريب.')+cards(x.q,'مراجعة');if(s==='after')h=head('12','بعد الرحلة','استدعاء ذاتي ثم إنتاج ثم تحقق ثم الرجوع للمصدر.')+`<div class="g"><article class="card"><h3>🧠 استرجع</h3><p>اذكر كلمات الدرس دون النظر للمفردات.</p></article><article class="card"><h3>✍️ أنتج</h3><p>كوّن جملة قصيرة من مفردات الدرس.</p></article><article class="card"><h3>🔍 تحقق</h3><p>☐ أعرف المفردات<br>☐ أطبق القاعدة<br>☐ أستطيع النطق</p></article><article class="card"><h3>📚 المصدر</h3><a class="btn" target="_blank" href="${R}${x.ref}">فتح المرجع الأصلي</a></article></div>`;page.innerHTML=h;page.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say));page.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{let z=b.closest('.card'),ok=b.dataset.o===b.dataset.c;z.querySelectorAll('[data-o]').forEach(q=>q.disabled=true);b.classList.add(ok?'ok':'no');z.querySelector('.fb').textContent=ok?'✅ صحيح':'❌ حاول مرة أخرى.'})}render('home');nav.onclick=e=>{if(e.target.dataset.s)render(e.target.dataset.s)})();</script></body></html>
