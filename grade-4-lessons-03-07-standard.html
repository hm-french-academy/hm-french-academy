n('')}</div>`}function render(s){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));let h='';if(s==='home')h=head('01','ابدأ الرحلة','المفردات → الفهم → القاعدة → التفاعل → المحادثة → التدريب → الفيديو → الألعاب → التقييم → المراجعة')+`<div class="g"><article class="card"><div class="pic">${x.v[0][0]}</div><h3>مصادر الدرس</h3><p>${x.folder}/${x.ref}</p><p>${x.folder}/${x.exam}</p></article><article class="card"><h3>قاعدة الجودة</h3><p>التدريب ليس هو التقييم، والمراجعة ليست نسخًا من التدريب، ولا تظهر الإجابة مسبقًا.</p></article></div>`;if(s==='vocab')h=head('02','المفردات','كل صورة مرتبطة بالكلمة المقصودة فقط.')+`<div class="g">${x.v.map(v=>`<article class="card"><div class="pic">${v[0]}</div><h3 class="fr">${v[1]}</h3><p>${v[2]}</p><button class="btn" data-say="${v[1]}">🔊 اسمع</button></article>`).join('')}</div>`;if(s==='under')h=head('03','افهم','أسئلة فهم مستقلة عن أسئلة التدريب.')+cards(x.under);if(s==='rules')h=head('04','القاعدة','نستنتج أداة التعريف أو صفة الملكية من جنس وعدد الاسم.')+`<div class="rule">${id==='g4-l05'||id==='g4-l07'?'<b>MON</b> مع المفرد المذكر، <b>MA</b> مع المفرد المؤنث، <b>MES</b> مع الجمع.':'<b>LE</b> للمذكر، <b>LA</b> للمؤنث، <b>LES</b> للجمع.'}</div>`;if(s==='inter')h=head('05','تفاعل','مواقف جديدة؛ لا نكرر بنك التدريب.')+cards(x.review);if(s==='talk')h=head('06','المحادثة','حوار مرتبط بموضوع الدرس نفسه.')+`<div class="g">${x.talk.map(t=>`<article class="card"><p class="fr">${t[0]}</p><p>${t[1]} <button class="btn" data-say="${t[1]}">🔊</button></p></article>`).join('')}</div>`;if(s==='practice')h=head('07','التدريب','تطبيق بعد الفهم؛ لا توجد الإجابة مكتوبة في السؤال.')+cards(x.practice);if(s==='media')h=head('08','الفيديو','المصدر الأصلي فقط. إذا لم يوجد فيديو مثبت في manifest لا نخترع رابطًا.')+(x.video?`<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${x.video}?rel=0" title="${x.fr}" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe></div>`:`<article
