>'+D.questions.map((q,i)=>'<article class="card"><b>تحدي '+(i+1)+': '+q[0]+'</b>'+q[1].sort(()=>Math.random()-.5).map(a=>'<button class="choice" onclick="this.classList.add(\''+(a===q[2]?'ok':'no')+'\')">'+a+'</button>').join('')+'</article>').join('');if(s==='after')h='<h2>🌟 بعد الرحلة</h2><div class="after">'+D.after.map(x=>'<div>✓ '+x+'</div>').join('')+'</div>';page.innerHTML=h}nav.querySelectorAll('button').forEach(b=>b.onclick=()=>render(b.dataset.s));render('start')})()</script></body></html>
