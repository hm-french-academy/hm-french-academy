<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>HM Academy | الصف الرابع</title><style>:root{--b:#2563eb;--ink:#172033;--soft:#64748b;--bg:#f4f7fb;--card:#fff;--line:#dfe6f0;--ok:#e9f7ee;--bad:#fff0f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Cairo,sans-serif;color:var(--ink);padding:14px}.wrap{max-width:1100px;margin:auto}.top,.hero,.page{background:#fff;border-radius:22px;box-shadow:0 8px 26px #14264a14;margin-bottom:14px;padding:18px}.top{display:flex;justify-content:space-between}.top a{color:var(--b);font-weight:900;text-decoration:none}.hero{background:linear-gradient(135deg,#eaf5ff,#fff3f7)}h1{margin:8px 0}.muted{color:var(--soft);line-height:1.8}.nav{display:flex;gap:7px;overflow:auto;position:sticky;top:0;z-index:5;padding:8px;background:#f4f7fbf5}.nav button,.btn,.choice{border:0;border-radius:12px;padding:10px 13px;font-weight:900;cursor:pointer}.nav button{background:#fff;white-space:nowrap}.nav button.active,.btn{background:var(--b);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--card)}.visual{height:110px;border-radius:15px;background:#eef6ff;display:grid;place-items:center;font-size:54px}.fr{direction:ltr;text-align:left;font-size:20px;font-weight:900}.ar{color:var(--soft)}.rule,.passage,.gamebox{background:#eef4f9;border-radius:16px;padding:16px;line-height:2;margin:10px 0}.choice{display:block;width:100%;background:#fff;border:2px solid var(--line);margin:8px 0;text-align:right}.choice.ok{background:var(--ok)}.choice.no{background:var(--bad)}.feedback{min-height:24px;font-weight:900}.games{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.gamebtn{background:#fff;border:2px solid var(--line);border-radius:12px;padding:9px 12px;font-weig st un garçon. Il s’appelle Samy.','Sa tête est ronde.','Son cou est court.','Ses bras sont solides.','Il a deux pieds, un dos droit et une poitrine.'],after:['Je peux nommer les principales parties du corps.','Je peux reconnaître épaules, dos et genoux.','Je peux comprendre le court texte sur Samy.'],questions:[['Quel article avec « épaules » ?',['le','la','les'],'les'],['Quel article avec « dos » ?',['le','la','les'],'le'],['Quel article avec « main » ?',['le','la','les'],'la'],['Quel article avec « genoux » ?',['le','la','les'],'les']]},'g4-l07':{fr:'Les adjectifs possessifs',ar:'صفات الملكية — الجسم',unit:'الدرس السابع · Unité 4',focus:'صفات الملكية مع مفردات الجسم',parts:[['ma tête','رأسي','🧑'],['ton cou','رقبتك','🧣'],['mes épaules','كتفاي','💪'],['sa poitrine','صدره/صدرها','🫁'],['mon ventre','بطني','🫃'],['son dos','ظهره/ظهرها','🔙'],['tes bras','ذراعاك','💪'],['ma main','يدي','✋'],['ton doigt','إصبعك','☝️'],['sa jambe','ساقه/ساقها','🦵'],['mon genou','ركبتي','🦵'],['tes genoux','ركبتاك','🦵'],['son pied','قدمه/قدمها','🦶']],rules:[['mon / ma / mes','للمتكلم','mon ventre · ma main · mes épaules'],['ton / ta / tes','للمخاطب','ton cou · tes bras'],['son / sa / ses','للغائب','son dos · sa jambe · ses pieds']],talk:['Tu as un cou. C’est ton cou.','J’ai des épaules. Ce sont mes épaules.','Elle a une poitrine. C’est sa poitrine.','Il a un dos. C’est son dos.'],after:['Je peux choisir mon / ma / mes avec le corps.','Je peux choisir ton / ta / tes.','Je peux choisir son / sa / ses.','Je peux relier chaque possessif au nom possédé.'],questions:[['J’ai des épaules → Ce sont ___ épaules.',['mon','ma','mes'],'mes'],['Il a un dos → C’est ___ dos.',['son','sa','ses'],'son'],['Tu as des genoux → Ce sont ___ genoux.',['ton','ta','tes'],'tes'],['Elle a une poitrine → C’est ___ poitrine.',['son','sa','ses'],'sa']]}};const D=DATA[id];if(!D){location.replace('grade-4.html');return}unit.textContent=D.unit;title.textContent=D.fr+' · '+D.ar;focus.textContent=D.focus;const steps=[['start','🚀 ML=`<p><b>السؤال ${current%D.questions.length+1}:</b> ${q[0]}</p>${q[1].map(a=>`<button class="choice" onclick="answerGame(this,'${a.replace(/'/g,"\\'")}','${q[2].replace(/'/g,"\\'")}')">${a}</button>`).join('')}<div id="gf" class="feedback"></div>`}function game(type){if(type==='match'){const a=D.parts.slice(0,Math.min(8,D.parts.length)).sort(()=>Math.random()-.5);gamebox.innerHTML=`<p><b>طابق المفردة مع معناها:</b></p><div class="grid">${a.map(x=>`<button class="choice" onclick="this.textContent='${x[1].replace(/'/g,"\\'")}'">${x[0]}</button>`).join('')}</div>`}else renderGame()}window.game=game;window.answerGame=function(el,a,ok){const f=document.getElementById('gf');if(a===ok){el.classList.add('ok');f.textContent='✅ إجابة صحيحة';current++;setTimeout(renderGame,450)}else{el.classList.add('no');f.textContent='❌ حاول مرة أخرى — الاختيارات تتغير مع كل سؤال'}};function test(){return `<h2>التقييم</h2>${D.questions.map((q,i)=>`<article class="card"><b>${i+1}. ${q[0]}</b>${q[1].map(a=>`<button class="choice" data-q="${i}" data-a="${a.replace(/"/g,'&quot;')}">${a}</button>`).join('')}</article>`).join('')}<p class="score">يتم احتساب النتيجة بعد الإجابة.</p>`}function after(){return `<h2>بعد الرحلة</h2><div class="after">${D.after.map(x=>`<div>🌟 ${x}</div>`).join('')}</div>`}function show(s){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.s===s));const map={start:`<h2>بداية الدرس</h2><p class="muted">مرحباً بك في درس <b>${D.fr}</b>. اختر أي محطة من الشريط للبدء.</p>`,vocab:vocab,under:()=>`<h2>افهم</h2><div class="passage"><p>لاحظ الكلمات والأدوات في المفردات، ثم جرّبها في القاعدة والمحادثة.</p></div>`,rules:rules,interact:practice,talk:talk,practice:practice,media:()=>D.video?`<h2>الفيديو</h2><div class="video"><iframe src="https://www.youtube.com/embed/${D.video}" allowfullscreen></iframe></div>`:`<h2>الفيديو</h2><p>المحتوى المرئي غير متاح لهذا الدرس.</p>`,games:games,test:test,after:after};page.innerHTML=typeof map[s]==='function'?map[s]():map[s];if(s==='games')renderGame()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.s));page.addEventListener('click',e=>{const b=e.target.closest('.choice');if(!b)return;const i=+b.dataset.q,a=b.dataset.a,q=D.questions[i];const f=document.getElementById('f'+i);if(!f)return;if(a===q[2]){b.classList.add('ok');f.textContent='✅ إجابة صحيحة'}else{b.classList.add('no');f.textContent='❌ إجابة غير صحيحة — جرّب اختياراً آخر'}});show('start')})()</script></body></html>
