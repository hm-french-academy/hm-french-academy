<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="cache-control" content="no-store"><title>HM Academy | التقييم الرسمي</title><style>body{margin:0;background:#f4f7fc;color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:950px;margin:auto;padding:16px}.hero,.q,.final{background:#fff;border:1px solid #dfe6f2;border-radius:22px;padding:20px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#173a82,#2563eb 58%,#713bd1);color:#fff}.q b{display:block;font-size:18px;line-height:1.8;margin-bottom:10px}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.option{padding:12px;border:1px solid #d5ddea;border-radius:12px;background:#fff;font-weight:800;text-align:right;cursor:pointer}.option.selected{border:2px solid #2563eb;background:#eef4ff}.btn{padding:12px 16px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:900;cursor:pointer;text-decoration:none}.result{text-align:center}@media(max-width:650px){.options{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><h1 id="title">📝 التقييم الرسمي</h1><p>10 مهام مبنية على أهداف ومحتوى الدرس الحالي فقط.</p></section><div id="test">جاري تحميل بيانات الدرس…</div><button class="btn" id="submit">إنهاء التقييم</button><section class="final" id="result"></section></main><script>(async()=>{const id=new URLSearchParams(location.search).get('id');if(!id)return;const data=await fetch('data/lessons/grade-5/lesson-studio-content.json?v=assessment-v2').then(r=>r.json());const root=data.content?JSON.parse(data.content):data,L=root.lessons?.[id];if(!L){document.getElementById('test').textContent='بيانات هذا الدرس غير موجودة.';return}document.title='HM Academy | التقييم · '+L.titleFr;document.getElementById('title').textContent='📝 التقييم الرسمي · '+L.titleFr;const qs=[...(L.practice||[])];const ex=L.grammar?.examples||[];while(qs.length<10&&ex.length)qs.push({q:'أي مثال صحيح من أمثلة هذا الدرس؟',options:ex.map(x=>x.fr),answer:ex[0].fr});const v=L.vocabulary||[];while(qs.length<10&&v.length)qs.push({q:'اختر الكلمة الصحيحة من مفردات الدرس.',options:[v[0].word,'خيار غير صحيح','خيار آخر'],answer:v[0].word});while(qs.length<10)qs.push({q:'ما العنصر الأساسي الذي ركز عليه الدرس؟',options:[L.titleFr,'درس آخر','خيار غير صحيح'],answer:L.titleFr});const Q=qs.slice(0,10);const test=document.getElementById('test');test.innerHTML=Q.map((q,i)=>'<section class="q"><b>'+String(i+1)+'. '+q.q+'</b><div class="options">'+q.options.slice(0,3).map(o=>'<button class="option" data-i="'+i+'" data-v="'+o.replace(/"/g,'&quot;')+'">'+o+'</button>').join('')+'</div></section>').join('');const ans={};test.querySelectorAll('.option').forEach(b=>b.onclick=()=>{const i=b.dataset.i;ans[i]=b.dataset.v;test.querySelectorAll('.option[data-i="'+i+'"]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});document.getElementById('submit').onclick=()=>{let score=0;Q.forEach((q,i)=>{if(ans[i]===q.answer)score++});const pct=Math.round(score/Q.length*100);document.getElementById('result').innerHTML='<div class="result"><h2>النتيجة: '+score+' / '+Q.length+'</h2><p>'+pct+'%</p><a class="btn" href="grade-5-games-v2.html?id='+encodeURIComponent(id)+'">🎮 مركز الألعاب</a> <a class="btn" href="grade-5-lesson-v3.html?id='+encodeURIComponent(id)+'&section=overview">← العودة للدرس</a></div>';document.getElementById('submit').disabled=true}})().catch(()=>document.getElementById('test').textContent='تعذر تحميل بيانات الدرس.');</script></body></html>
