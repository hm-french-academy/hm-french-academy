name: Wire diagnostic persistence module

on:
  push:
    branches: [secure-content-integration]
    paths:
      - 'js/diagnostic-persistence.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: secure-content-integration
      - name: Inject module without changing the existing UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('annual-revision-stage.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script type="module" src="js/diagnostic-persistence.js?v=20260903"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('Could not find </body> in annual-revision-stage.html')
              s = s.replace(marker, tag + marker, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit wiring change
        run: |
          git config user.name 'HM Academy Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add annual-revision-stage.html
          if git diff --cached --quiet; then
            echo 'No wiring change needed.'
          else
            git commit -m 'feat(auth): wire diagnostic persistence module'
            git push origin HEAD:secure-content-integration
          fi
