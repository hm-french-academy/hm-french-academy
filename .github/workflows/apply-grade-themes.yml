name: Apply HM Academy Grade Themes
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply centralized theme across grade portals and lesson runtimes
        shell: python
        run: |
          from pathlib import Path
          import re
          targets = {
            # Primary portals
            'grade-3.html':'primary-3',
            'grade-4.html':'primary-4',
            'grade-5.html':'primary-5',
            'grade-6.html':'primary-6',
            # Primary lesson runtimes
            'grade-3-lesson-journey.html':'primary-3',
            'grade-4-lesson-journey.html':'primary-4',
            'grade-4-l01-learning-studio.html':'primary-4',
            'grade-4-l02-learning-studio.html':'primary-4',
            'grade-4-lesson-studio-v2.html':'primary-4',
            'grade-4-lessons-03-07-live.html':'primary-4',
            'grade-5-lesson-v3.html':'primary-5',
            'grade6-lesson-v2.html':'primary-6',
            # Preparatory
            'grade7-lesson-studio-final.html':'prep-1',
            'lesson-studio-standard.html':'prep-2',
            'grade-9-lesson-studio.html':'prep-3',
            # Secondary
            'secondary-1-lesson-studio.html':'secondary-1',
            'baccalaureat-2-lesson-studio-v3.html':'secondary-2',
          }
          css='css/hm-academy-grade-themes.css'
          marker='hm-academy-grade-themes.css'
          for name, grade in targets.items():
            p=Path(name)
            if not p.exists():
              print('SKIP missing', name); continue
            s=p.read_text(encoding='utf-8')
            if marker not in s:
              if '</head>' in s:
                s=s.replace('</head>', f'<link rel="stylesheet" href="{css}?v=20260909-grade-themes-v2"></head>', 1)
              else:
                print('SKIP no head', name); continue
            pat=r'<body([^>]*)>'
            m=re.search(pat,s,re.I)
            if m:
              attrs=m.group(1)
              attrs=re.sub(r'\sdata-hm-grade-theme="[^"]*"','',attrs,flags=re.I)
              repl=f'<body{attrs} data-hm-grade-theme="{grade}">'
              s=s[:m.start()]+repl+s[m.end():]
            p.write_text(s,encoding='utf-8')
            print('UPDATED',name,grade)
      - name: Harden Grade 8 pronunciation playback only
        shell: python
        run: |
          from pathlib import Path

          robust = """function speak(t){const text=String(t??'').trim();if(!text||!('speechSynthesis'in window)||typeof SpeechSynthesisUtterance==='undefined')return;const synth=window.speechSynthesis;let attempts=0;const play=()=>{attempts++;try{synth.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=.84;u.pitch=1;const voices=synth.getVoices();const voice=voices.find(v=>String(v.lang).toLowerCase()==='fr-fr')||voices.find(v=>String(v.lang).toLowerCase().startsWith('fr'));if(voice)u.voice=voice;u.onerror=()=>{if(attempts<3)setTimeout(play,140)};try{synth.resume()}catch(_){}synth.speak(u)}catch(_){if(attempts<3)setTimeout(play,140)}};play()}"""
          standard=Path('lesson-studio-standard.html')
          if standard.exists():
            s=standard.read_text(encoding='utf-8')
            old="function speak(t){if(!t||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.86;speechSynthesis.speak(u)}"
            if old in s:
              s=s.replace(old,robust,1)
              standard.write_text(s,encoding='utf-8')
              print('UPDATED pronunciation runtime: lesson-studio-standard.html')
            elif robust in s:
              print('ALREADY hardened: lesson-studio-standard.html')
            else:
              raise SystemExit('Expected Grade 8 pronunciation function not found')
          independent=Path('grade8-pronunciation.html')
          if independent.exists():
            s=independent.read_text(encoding='utf-8')
            old="function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}"
            if old in s:
              s=s.replace(old,robust,1)
              independent.write_text(s,encoding='utf-8')
              print('UPDATED pronunciation runtime: grade8-pronunciation.html')
            elif robust in s:
              print('ALREADY hardened: grade8-pronunciation.html')
            else:
              raise SystemExit('Expected independent Grade 8 pronunciation function not found')
      - name: Commit theme rollout
        run: |
          git config user.name "HM Academy Theme Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/hm-academy-grade-themes.css .github/workflows/apply-grade-themes.yml *.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Apply premium grade themes across portals and lesson runtimes"
          git push
