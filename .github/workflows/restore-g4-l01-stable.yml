name: Restore Grade 4 Lesson 1 Stable
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: "!contains(github.event.head_commit.message, '[restore-g4-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore stable lesson file
        run: |
          git checkout ecd7964c31ddeca00f479cc8f3f987498b498f00 -- grade-4-l01-learning-studio.html
          rm -f scripts/fix-grade4-l01-games.js
          rm -f .github/workflows/restore-g4-l01-stable.yml
          git config user.name 'HM Academy Restore Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grade-4-l01-learning-studio.html scripts/fix-grade4-l01-games.js .github/workflows/restore-g4-l01-stable.yml
          git commit -m 'Restore Grade 4 Lesson 1 stable state [restore-g4-done]'
          git push origin HEAD:main
