name: Emergency restore Grade 6 lesson
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good Grade 6 file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin cc3513b2b69a4c3ce28b851f65f8894628e2f2fd
          git show cc3513b2b69a4c3ce28b851f65f8894628e2f2fd:grade6-lesson-v2.html > grade6-lesson-v2.html
          git checkout -b emergency-restore-g6-${GITHUB_RUN_ID}
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add grade6-lesson-v2.html
          git commit -m "Restore Grade 6 lesson page"
          git push -u origin HEAD
          gh pr create --base main --head emergency-restore-g6-${GITHUB_RUN_ID} --title "Emergency restore Grade 6 lesson" --body "Restore grade6-lesson-v2.html from known-good merged commit cc3513b2b69a4c3ce28b851f65f8894628e2f2fd."