name: Grade 9 QA

on:
  push:
    paths:
      - 'data/lessons/grade-9/**'
      - 'data/curricula/grade-9/**'
      - 'scripts/grade9-qa.mjs'
      - 'grade-9-lesson-studio.html'
      - '.github/workflows/grade9-qa.yml'
  pull_request:
    paths:
      - 'data/lessons/grade-9/**'
      - 'data/curricula/grade-9/**'
      - 'scripts/grade9-qa.mjs'
      - 'grade-9-lesson-studio.html'
      - '.github/workflows/grade9-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grade9-content-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main revision
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true
          fetch-depth: 1
      - name: Show revision and lesson inventory
        run: |
          git rev-parse HEAD
          printf '\nTracked Grade 9 semester-1 JSON files:\n'
          git ls-files 'data/lessons/grade-9/semester-1/*.json'
          printf '\nQA harness fingerprint:\n'
          sha256sum scripts/grade9-qa.mjs
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate QA harness syntax
        run: node --check scripts/grade9-qa.mjs
      - name: Run Grade 9 QA
        run: node scripts/grade9-qa.mjs
