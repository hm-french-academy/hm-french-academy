name: Repair Grade 9 Lesson 1 runtime
on:
  push:
    paths:
      - '.github/workflows/grade9-speech-fix.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair lesson runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('grade9-u1-l1-standard.html')
          s=p.read_text(encoding='utf-8')
          marker="function speechText(text){"
          if "const nav=document.getElementById('nav');" not in s:
              s=s.replace(marker, "const nav=document.getElementById('nav');\nconst panel=document.getElementById('panel');\n"+marker, 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q "const nav=document.getElementById('nav')" grade9-u1-l1-standard.html
          grep -q "const panel=document.getElementById('panel')" grade9-u1-l1-standard.html
      - name: Commit repair and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/grade9-speech-fix.yml
          git add grade9-u1-l1-standard.html .github/workflows/grade9-speech-fix.yml
          git commit -m 'Fix Grade 9 Lesson 1 data rendering' || exit 0
          git push