name: Persist Grade 9 Lesson Audio Fix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[GRADE9-AUDIO]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Grade 4 Lesson 1 stable version
        run: |
          set -euo pipefail
          git checkout ecd7964c31ddeca00f479cc8f3f987498b498f00 -- grade-4-l01-learning-studio.html
          rm -f scripts/fix-grade4-l01-games.js
          rm -f .github/workflows/restore-g4-l01-stable.yml

      - name: Make Grade 9 lesson audio self-contained
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('grade9-u1-l1-standard.html')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'\s*<script\s+src=["\']scripts/grade9-u1-l1-recovery\.js\?v=[^"\']+["\']\s+defer></script>', '', s, count=0)
          old=re.search(r'function speechText\(t\)\{.*?\nwindow\.speak=speak;', s, flags=re.S)
          if not old:
              raise SystemExit('Inline speech block not found')
          new="""function speechText(t){return String(t||'').trim();}
function speak(t){
  try{
    if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)) return;
    const text=speechText(t);
    if(!text) return;
    const synth=window.speechSynthesis;
    synth.cancel();
    const play=()=>{
      const u=new SpeechSynthesisUtterance(text);
      u.lang='fr-FR';u.rate=.78;u.pitch=1;u.volume=1;
      const voices=synth.getVoices();
      const v=voices.find(x=>/^fr[-_]FR$/i.test(x.lang))||voices.find(x=>/^fr[-_]/i.test(x.lang));
      if(v) u.voice=v;
      synth.speak(u);
    };
    const voices=synth.getVoices();
    if(voices.length) play(); else {
      const once=()=>{synth.removeEventListener('voiceschanged',once);play();};
      synth.addEventListener('voiceschanged',once,{once:true});
      setTimeout(()=>{synth.removeEventListener('voiceschanged',once);if(!synth.speaking)play();},250);
    }
  }catch(e){}
}
window.speak=speak;"""
          s=s[:old.start()]+new+s[old.end():]
          p.write_text(s,encoding='utf-8')
          assert 'grade9-u1-l1-recovery.js' not in s
          assert 'function speechText(t){return String(t||' in s
          assert "u.lang='fr-FR'" in s
          assert 'window.speak=speak' in s
          PY

      - name: Validate Grade 9 lesson audio
        run: |
          set -euo pipefail
          grep -Fq 'id="nav"' grade9-u1-l1-standard.html
          grep -Fq 'id="panel"' grade9-u1-l1-standard.html
          grep -Fq "u.lang='fr-FR'" grade9-u1-l1-standard.html
          grep -Fq 'window.speak=speak' grade9-u1-l1-standard.html
          ! grep -Fq 'grade9-u1-l1-recovery.js' grade9-u1-l1-standard.html

      - name: Commit restored Grade 4 and source audio fix
        run: |
          set -euo pipefail
          git config user.name 'hm-french-academy'
          git config user.email 'hf.toma@gmail.com'
          git add grade-4-l01-learning-studio.html grade9-u1-l1-standard.html scripts/fix-grade4-l01-games.js .github/workflows/restore-g4-l01-stable.yml
          if git diff --cached --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git commit -m '[GRADE9-AUDIO] Restore Grade 4 Lesson 1 stable version'
          git push origin HEAD:main
