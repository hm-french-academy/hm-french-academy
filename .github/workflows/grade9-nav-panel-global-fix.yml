name: Fix Grade 9 Lesson 1 nav panel globals
on:
  push:
    branches: [main]
    paths:
      - 'grade9-u1-l1-standard.html'
      - '.github/workflows/grade9-nav-panel-global-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch DOM variable names
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('grade9-u1-l1-standard.html')
          s=p.read_text(encoding='utf-8')
          original=s
          s=s.replace("const nav=document.getElementById('nav');", "const navEl=document.getElementById('nav');", 1)
          s=s.replace("const panel=document.getElementById('panel');", "const panelEl=document.getElementById('panel');", 1)
          s=s.replace("function renderNav(){nav.innerHTML=", "function renderNav(){navEl.innerHTML=", 1)
          s=s.replace("panel.innerHTML=h}", "panelEl.innerHTML=h}", 1)
          if s==original:
              raise SystemExit('No patch applied; expected source markers were not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit page fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grade9-u1-l1-standard.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Grade 9 lesson DOM global collision'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/grade9-nav-panel-global-fix.yml
          git commit -m 'Remove temporary Grade 9 fix workflow'
          git push
