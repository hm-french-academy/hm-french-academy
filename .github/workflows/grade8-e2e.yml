name: Grade 8 E2E Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BASE_URL: https://hm-french-academy.github.io/hm-french-academy/

jobs:
  grade8-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Grade 8 manifests, JSON and local references
        run: node tests/grade8-smoke.mjs

      - name: Install Playwright
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Run Grade 8 browser smoke test against deployed site
        run: npx --yes playwright@1.55.0 test tests/grade8.e2e.spec.mjs --reporter=line
