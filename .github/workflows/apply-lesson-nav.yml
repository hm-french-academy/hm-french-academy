name: Apply lesson contextual navigation

on:
  push:
    paths:
      - 'scripts/lesson-context-nav.js'
      - '.github/workflows/apply-lesson-nav.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-lesson:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject contextual navigation loader
        shell: python
        run: |
          from pathlib import Path
          path = Path('data/lessons/grade-8/unit-1/lesson-1-interactive-v2.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="../../../../scripts/lesson-context-nav.js?v=20260814-context-nav"></script>'
          if tag not in text:
              marker = '</body></html>'
              if marker not in text:
                  raise SystemExit('lesson file marker not found')
              text = text.replace(marker, tag + marker, 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'HM Academy Bot'
          git config user.email 'actions@github.com'
          git add data/lessons/grade-8/unit-1/lesson-1-interactive-v2.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'feat: add contextual navigation to lesson 1'
          git push
