name: Apply lesson contextual navigation

on:
  push:
    paths:
      - 'scripts/lesson-context-nav.js'
      - '.github/workflows/apply-lesson-nav.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-lesson:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix contextual menu event handling and cache busting
        shell: python
        run: |
          from pathlib import Path

          script = Path('scripts/lesson-context-nav.js')
          text = script.read_text(encoding='utf-8')
          old = "document.addEventListener('click',e=>{if(!menu.contains(e.target)&&!home.contains(e.target))setMenuOpen(false)},true);"
          new = "document.addEventListener('click',e=>{if(!menu.contains(e.target)&&!home.contains(e.target))setMenuOpen(false)});"
          if old in text:
              text = text.replace(old, new, 1)
          script.write_text(text, encoding='utf-8')

          lesson = Path('data/lessons/grade-8/unit-1/lesson-1-interactive-v2.html')
          text = lesson.read_text(encoding='utf-8')
          import re
          text, count = re.subn(
              r'scripts/lesson-context-nav\\.js\\?v=[^"\\']+',
              'scripts/lesson-context-nav.js?v=20260904-context-nav3',
              text,
              count=1,
          )
          if count == 0:
              raise SystemExit('context navigation script tag not found in lesson file')
          lesson.write_text(text, encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'HM Academy Bot'
          git config user.email 'actions@github.com'
          git add scripts/lesson-context-nav.js data/lessons/grade-8/unit-1/lesson-1-interactive-v2.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'fix: make contextual menu toggle close reliably'
          git push
