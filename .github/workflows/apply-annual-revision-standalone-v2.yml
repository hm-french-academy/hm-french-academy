name: Apply annual revision standalone mode v2

on:
  push:
    paths:
      - '.github/workflows/apply-annual-revision-standalone-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply standalone mode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('annual-revision-stage.html')
          s = p.read_text(encoding='utf-8')
          css_anchor = '.resume .btn{margin-top:10px}'
          css_add = '.revision-standalone .hm-header{display:none!important}.revision-standalone main>.section:last-child{display:none!important}'
          if 'revision-standalone .hm-header' not in s:
              if css_anchor not in s:
                  raise SystemExit('annual-revision-stage.html CSS anchor not found')
              s = s.replace(css_anchor, css_anchor + css_add, 1)
          if 'class="revision-standalone"' not in s:
              s = s.replace('<body>', '<body class="revision-standalone" style="">', 1)
          marker = "const $=id=>document.getElementById(id),g=Number(new URLSearchParams(location.search).get('target'));"
          replacement = "const params=new URLSearchParams(location.search),$=id=>document.getElementById(id),g=Number(params.get('target'));if(params.get('standalone')==='1')document.body.classList.add('revision-standalone');"
          if marker in s and "params.get('standalone')" not in s:
              s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')

          wrappers = {
            'revision/4/index.html': ('4', 'مراجعة الصف الرابع الابتدائي'),
            'revision/5/index.html': ('5', 'مراجعة الصف الخامس الابتدائي'),
            'revision/6/index.html': ('6', 'مراجعة الصف السادس الابتدائي'),
            'revision/prep2/index.html': ('8', 'مراجعة الصف الثاني الإعدادي'),
            'revision/prep3/index.html': ('9', 'مراجعة الصف الثالث الإعدادي'),
          }
          for path, (target, title) in wrappers.items():
              p = Path(path)
              content = f'''<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14264a"><title>{title}</title><meta http-equiv="refresh" content="0;url=../../annual-revision-stage.html?target={target}&standalone=1"><script>location.replace('../../annual-revision-stage.html?target={target}&standalone=1')</script></head><body><p>جارٍ فتح {title}…</p></body></html>'''
              p.write_text(content, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add annual-revision-stage.html revision/4/index.html revision/5/index.html revision/6/index.html revision/prep2/index.html revision/prep3/index.html
          git rm .github/workflows/apply-annual-revision-standalone-v2.yml
          git commit -m 'Fix standalone annual revision links for WhatsApp visitors'
          git push
