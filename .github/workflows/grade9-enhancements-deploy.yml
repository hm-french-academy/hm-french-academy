name: Deploy Grade 9 Lesson Enhancements

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-grade9-enhancements
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject safe enhancement layer
        run: |
          set -euo pipefail
          test -f grade9-u1-l1-standard.html
          test -f scripts/grade9-u1-l1-enhancements.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('grade9-u1-l1-standard.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="scripts/grade9-u1-l1-enhancements.js?v=20260911-2" defer></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          assert tag in s
          PY
      - name: Validate
        run: |
          set -euo pipefail
          grep -Fq 'id="nav"' grade9-u1-l1-standard.html
          grep -Fq 'id="panel"' grade9-u1-l1-standard.html
          grep -Fq 'grade9-u1-l1-enhancements.js' grade9-u1-l1-standard.html
          grep -Fq 'renderPractice' scripts/grade9-u1-l1-enhancements.js
          grep -Fq 'renderAssessment' scripts/grade9-u1-l1-enhancements.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        uses: actions/deploy-pages@v4
