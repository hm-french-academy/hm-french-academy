name: Apply annual revision standalone mode

on:
  push:
    paths:
      - '.github/workflows/apply-annual-revision-standalone.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch shared annual revision page
        shell: python
        run: |
          from pathlib import Path
          p = Path('annual-revision-stage.html')
          s = p.read_text(encoding='utf-8')
          old = '.resume .btn{margin-top:10px}'
          new = old + '.revision-standalone .hm-header{display:none!important}.revision-standalone main>.section:last-child{display:none!important}'
          if old not in s:
              raise SystemExit('Expected CSS anchor not found')
          if 'revision-standalone .hm-header' not in s:
              s = s.replace(old, new, 1)
          if '<body class="revision-standalone">' not in s:
              if '<body>\n' in s:
                  s = s.replace('<body>\n', '<body class="revision-standalone">\n', 1)
              elif '<body>' in s:
                  s = s.replace('<body>', '<body class="revision-standalone">', 1)
              else:
                  raise SystemExit('Body tag not found')
          p.write_text(s, encoding='utf-8')
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-annual-revision-standalone.yml
          git add annual-revision-stage.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Make annual revision links open standalone review pages'
          git push