name: Republish g4-l01
on:
  push:
    paths:
      - '.github/workflows/republish-g4-l01.yml'
permissions:
  contents: write
jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch only g4-l01 to force a fresh Pages deployment
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('grade-4-l01-learning-studio.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- g4-l01-pages-refresh-20260913 -->'
          if marker not in s:
              p.write_text(s + marker, encoding='utf-8')
          PY
      - name: Commit refresh and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grade-4-l01-learning-studio.html .github/workflows/republish-g4-l01.yml
          git rm .github/workflows/republish-g4-l01.yml
          git commit -m 'chore(g4-l01): republish stable lesson page'
          git push
