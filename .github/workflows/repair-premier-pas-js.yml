name: Repair Premier Pas JavaScript

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'hm-french-academy' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair malformed Premiers sons render fragment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('preparatory-french-starter-final.html')
          s = p.read_text(encoding='utf-8')
          bad = 'direction:ltr">\'+x[0]+\'</b><div>\'+x[1]+\'</div><button class="speak" data-speak="\'+x[0]+\'">🔊 استمع</button></div>\').join(\'\')+\'</div><div class="tip">'
          good = '<div class="sounds">\'+sounds.map(x=>\'<div class="sound"><div style="direction:ltr;font-size:34px;font-weight:900">\'+x[0]+\'</div><div>\'+x[1]+\'</div><button class="speak" data-speak="\'+x[0]+\'">🔊 استمع</button></div>\').join(\'\')+\'</div><div class="tip">'
          if bad in s:
              s = s.replace(bad, good, 1)
              p.write_text(s, encoding='utf-8')
              print('REPAIRED')
          else:
              print('NO_MALFORMED_FRAGMENT_FOUND')
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('preparatory-french-starter-final.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.S)
          Path('/tmp/premier-pas.js').write_text('\n'.join(scripts), encoding='utf-8')
          print('script chars:', len(Path('/tmp/premier-pas.js').read_text(encoding='utf-8')))
          PY
          node --check /tmp/premier-pas.js

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preparatory-french-starter-final.html
          if git diff --cached --quiet; then
            echo 'NO_CHANGE'
          else
            git commit -m 'Fix Premier Pas runtime syntax error'
            git push
          fi
