name: Deploy HM Academy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enrich Grade 1 Lesson 1 learning sections
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/enrich-grade7-lesson1-pages.py

      - name: Apply Premier Pas interactive vocabulary visuals
        shell: bash
        run: |
          set -euo pipefail
          node scripts/fix-premier-pas-vocab-visuals.js

      - name: Repair Grade 4 Lesson 1 game interactions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/fix-grade4-l01-games.js

      - name: Verify lesson pages
        shell: bash
        run: |
          set -euo pipefail
          test -f grade7-lesson-studio.html
          grep -q "نطق الحرف" grade7-lesson-studio.html
          grep -q "نطق المثال" grade7-lesson-studio.html
          grep -q "Les mots transparents" grade7-lesson-studio.html
          grep -q "embeddedPractice" data/lessons/grade-7/unit-1/lesson-1.json

      - name: Verify Grade 4 lesson entry
        shell: bash
        run: |
          set -euo pipefail
          test -f lesson.html
          grep -Fq "g4-l01" lesson.html
          grep -Fq "grade-4-l01-learning-studio.html" lesson.html
          test -f grade-4-l01-learning-studio.html

      - name: Verify Grade 4 release state
        shell: bash
        run: |
          set -euo pipefail
          test -f data/lessons/grade-4/implementation-status.json
          test -f data/lessons/grade-4/premium-runtime-manifest.json
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('data/lessons/grade-4/implementation-status.json','utf8'));
          const r=JSON.parse(fs.readFileSync('data/lessons/grade-4/premium-runtime-manifest.json','utf8'));
          if(!(s.completed||[]).includes('final-qa')) throw new Error('Grade 4 final QA is not recorded');
          if(r.releaseGate!=='released' && r.releaseGate!=='browser-smoke-required') throw new Error('Unexpected Grade 4 release gate: '+r.releaseGate);
          NODE

      - name: Verify Grade 4 game repair
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Grade 4 Lesson 1 games repaired' grade-4-l01-learning-studio.html
          grep -Fq 'window.renderGame=function' grade-4-l01-learning-studio.html
          grep -Fq 'window.setGame=function' grade-4-l01-learning-studio.html
          grep -Fq 'orderRow' grade-4-l01-learning-studio.html
          grep -Fq 'Math.random' grade-4-l01-learning-studio.html

      - name: Write deployment fingerprint
        shell: bash
        run: |
          set -euo pipefail
          cat > deployment-version.txt <<EOF
          HM Academy Published Deployment
          commit=$GITHUB_SHA
          ref=$GITHUB_REF
          workflow=Deploy HM Academy
          deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Verify Premier Pas visuals
        shell: bash
        run: |
          set -euo pipefail
          test -f preparatory-french-starter-v2.html
          grep -q "vocab-visual" preparatory-french-starter-v2.html
          grep -q "function visualFor(term)" preparatory-french-starter-v2.html
          grep -q "has-visual" preparatory-french-starter-v2.html
          grep -q "<img src=\"" preparatory-french-starter-v2.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy site
        uses: actions/deploy-pages@v4

      # Deployment fingerprint is intentionally embedded in every Pages artifact.
