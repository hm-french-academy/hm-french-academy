name: Deploy HM Academy

# Production Pages build. Grade 7 is intentionally isolated from this workflow.
# Force production publication after scoped page fixes.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[BAC2-DEPLOY]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply Premier Pas interactive vocabulary visuals
        run: node scripts/fix-premier-pas-vocab-visuals.js
      - name: Repair Grade 4 Lesson 1 game interactions
        run: node scripts/fix-grade4-l01-games.js
      - name: Patch annual revision feedback by stable question ID
        run: python3 scripts/fix-annual-revision-feedback.py
      - name: Add source-specific feedback to Grade 4 readiness review
        run: python3 scripts/enrich-grade4-readiness-feedback.py
      - name: Add source-specific feedback to Grade 9 readiness review
        run: python3 scripts/enrich-grade9-readiness-feedback.py
      - name: Prefer enriched production-local annual revision data
        run: python3 scripts/fix-annual-revision-source-order.py
      - name: Add question-specific feedback to Secondary 1 annual review
        run: python3 scripts/fix-secondary-1-review-feedback.py
      - name: Verify annual revision question-specific feedback for all mapped stages
        run: |
          set -euo pipefail
          test -f annual-revision-stage.html
          grep -Fq "function grade(arr,id,resultId)" annual-revision-stage.html
          grep -Fq "function questionForBox" annual-revision-stage.html
          grep -Fq "function explainQuestion" annual-revision-stage.html
          grep -Fq "answer-feedback" annual-revision-stage.html
          grep -Fq "لماذا؟" annual-revision-stage.html
          grep -Fq "arr.find(q=>String(q?.id||'')===questionId)" annual-revision-stage.html
          grep -Fq "grade(practice,'practiceQuiz','practiceResult')" annual-revision-stage.html
          grep -Fq "grade(fin,'finalQuiz','finalResult')" annual-revision-stage.html
          python3 - <<'PY'
          import json
          files = {4:'data/reviews/grade-3/review-content-normalized.json',5:'data/reviews/grade-5/review-content.json',6:'data/reviews/grade-6/review-content.json',8:'data/reviews/grade-8/review-content.json',9:'data/reviews/grade-9/review-content.json'}
          for grade,path in files.items():
            raw=json.load(open(path,encoding='utf-8'))
            d=json.loads(raw['content']) if 'content' in raw else raw
            diag=d.get('diagnostic',{}).get('questions',[]); practice=d.get('practiceQuestions',[]); final=d.get('finalReadiness',{}).get('questions',d.get('finalAssessment',{}).get('questions',[])); qs=diag+practice+final
            ids=[str(q.get('id','')) for q in qs]
            assert qs, f'Grade {grade}: empty annual revision bank'
            assert all(ids), f'Grade {grade}: missing question ID'
            assert len(ids)==len(set(ids)), f'Grade {grade}: duplicate question ID'
            choice_qs=[q for q in qs if isinstance(q.get('options'),list) and len(q.get('options',[]))>=2]
            assert all(q.get('answer') is not None and 0 <= int(q['answer']) < len(q['options']) for q in choice_qs), f'Grade {grade}: invalid answer/options mapping'
            if grade in (4,9):
              missing=[q.get('id') for q in qs if not str(q.get('explanation','')).strip()]
              assert not missing, f'Grade {grade}: missing question-specific explanations: {missing}'
          g5raw=json.load(open(files[5],encoding='utf-8')); g5=json.loads(g5raw['content']) if 'content' in g5raw else g5raw
          p04=next(q for q in g5['practiceQuestions'] if q['id']=='P04')
          assert p04['q']=='Elle ___ petite.' and p04['options'][p04['answer']]=='est'
          PY
      - name: Verify Secondary 1 review question-specific feedback
        run: |
          set -euo pipefail
          test -f secondary-1-review.html
          grep -Fq "const hmQuestionFeedback=" secondary-1-review.html
          grep -Fq "answer-feedback" secondary-1-review.html
          grep -Fq "💡 لماذا؟" secondary-1-review.html
      - name: Verify isolated Grade 7 lesson page and source data
        run: |
          set -euo pipefail
          test -f grade7-lesson-studio.html
          grep -Fq "مسار مستقل · مصدر أصلي + إثراء" grade7-lesson-studio.html
          grep -Fq "data/lessons/grade-7" grade7-lesson-studio.html
          ! grep -Fq "currentSection" grade7-lesson-studio.html
          test -f data/lessons/grade-7/unit-1/lesson-1.json
          test -f data/lessons/grade-7/unit-1/lessons-7-11-source-extracted.json
          grep -Fq "grade7-u1-l1" data/lessons/grade-7/unit-1/lesson-1.json
          grep -Fq "verified-from-original-interactive-html" data/lessons/grade-7/unit-1/lessons-7-11-source-extracted.json
      - name: Verify Grade 4 lesson entry
        run: |
          set -euo pipefail
          test -f lesson.html
          grep -Fq "g4-l01" lesson.html
          grep -Fq "grade-4-l01-learning-studio.html" lesson.html
          test -f grade-4-l01-learning-studio.html
      - name: Verify Grade 4 release state
        run: |
          set -euo pipefail
          test -f data/lessons/grade-4/implementation-status.json
          test -f data/lessons/grade-4/premium-runtime-manifest.json
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('data/lessons/grade-4/implementation-status.json','utf8'));
          const r=JSON.parse(fs.readFileSync('data/lessons/grade-4/premium-runtime-manifest.json','utf8'));
          if(!(s.completed||[]).includes('final-qa')) throw new Error('Grade 4 final QA is not recorded');
          if(r.releaseGate!=='released' && r.releaseGate!=='browser-smoke-required') throw new Error('Unexpected Grade 4 release gate: '+r.releaseGate);
          NODE
      - name: Verify Grade 4 game repair
        run: |
          set -euo pipefail
          grep -Fq 'gameTabs' grade-4-l01-learning-studio.html
          grep -Fq 'function setGame' grade-4-l01-learning-studio.html
          grep -Fq 'function renderGame' grade-4-l01-learning-studio.html
          grep -Fq 'Math.random' grade-4-l01-learning-studio.html
      - name: Isolate Premier Pas navigation in production artifact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('preparatory-french-starter-final.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<a class="hm-brand" href="index.html">','<div class="hm-brand">',1)
          s=s.replace('</a><nav class="hm-nav">','</div><nav class="hm-nav">',1)
          s=re.sub(r'<nav class="hm-nav">.*?</nav>','',s,count=1,flags=re.S)
          s=re.sub(r'<div class="actions"><a class="btn" href="course\.html">🚀 ابدأ منهج الصف الأول الإعدادي</a></div>','<div class="actions"><span class="btn" aria-label="تمهيد إلى المنهج">🎓 تمهيد إلى منهج الصف الأول الإعدادي</span></div>',s,count=1)
          p.write_text(s,encoding='utf-8')
          assert '<nav class="hm-nav">' not in s
          assert '<a class="hm-brand" href="index.html">' not in s
          assert 'href="course.html">🚀 ابدأ منهج الصف الأول الإعدادي' not in s
          PY
      - name: Write deployment fingerprint
        run: echo "$GITHUB_SHA" > deployment-version.txt
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site — production
        id: deployment
        uses: actions/deploy-pages@v4