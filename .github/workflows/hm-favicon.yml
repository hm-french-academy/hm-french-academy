name: Apply HM Academy favicon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  favicon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Premier Pas vocabulary visuals
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'vocab-visual' preparatory-french-starter-v2.html; then
            node scripts/fix-premier-pas-vocab-visuals.js
          else
            echo 'Premier Pas visuals already embedded; no rebuild needed.'
          fi

      - name: Add favicon links to HTML pages
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          while IFS= read -r -d '' file; do
            if grep -q 'hm-academy-favicon.svg' "$file"; then
              continue
            fi
            if grep -q '<head>' "$file"; then
              sed -i 's#<head>#<head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2">#' "$file"
            elif grep -q '<head ' "$file"; then
              sed -i '0,/<head /s#<head #<head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"> #' "$file"
            else
              continue
            fi
            changed=1
          done < <(find . -type f -name '*.html' -not -path './.git/*' -print0)

          git config user.name 'HM Academy Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No HTML changes to commit.'
            exit 0
          fi
          git commit -m 'fix: publish Premier Pas vocabulary visuals'
          git push
