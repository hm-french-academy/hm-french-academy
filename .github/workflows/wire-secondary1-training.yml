name: Wire secondary-1 training

on:
  push:
    branches: [main]
    paths:
      - 'js/secondary-1-training.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inject training module
        shell: python
        run: |
          from pathlib import Path
          p = Path('secondary-1-review.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="js/secondary-1-training.js?v=20260904"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('Could not find </body>')
              s = s.replace(marker, tag + marker, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit wiring change
        run: |
          git config user.name 'HM Academy Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add secondary-1-review.html
          if git diff --cached --quiet; then
            echo 'No wiring change needed.'
          else
            git commit -m 'fix(secondary1): restore repeatable training tab'
            git push origin HEAD:main
          fi
