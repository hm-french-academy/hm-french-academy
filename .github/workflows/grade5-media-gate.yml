name: Grade 5 Media Gate
on:
  push:
    branches: [main]
    paths:
      - 'data/lessons/grade-5/lesson-media-manifest.json'
      - 'scripts/grade5-media-indexer.mjs'
  workflow_dispatch:
jobs:
  validate-grade5-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate all Grade 5 lesson videos
        run: node scripts/grade5-media-indexer.mjs
      - name: Verify complete 11/11 media release
        run: node -e "const x=require('./data/lessons/grade-5/media-index.json'); if(!x.complete || x.readyVideos!==11) process.exit(1); console.log('Grade 5 media release gate passed: 11/11')"
