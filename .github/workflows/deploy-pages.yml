name: Deploy HM Academy Preview

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair annual revision before deployment
        shell: bash
        run: |
          set -euo pipefail
          git show 65cf65f586c1da9d4111dfd893fdb7eaa00a4230:annual-revision-stage.html > annual-revision-stage.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('annual-revision-stage.html')
          s=p.read_text(encoding='utf-8')
          old="const key='hmAnnualRevisionAttempt:v1:'+g;\nconst saved=(()=>{try{return JSON.parse(localStorage.getItem(key)||'null')}catch{return null}})();"
          new="""let authUser=null,supabase=null,accountAttempts={};
try{const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2');const cfg=await import('./js/supabase-config.js');supabase=createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY);const session=await supabase.auth.getSession();authUser=session.data?.session?.user||null;accountAttempts=authUser?.user_metadata?.hmAnnualRevisionAttempts||{}}catch(e){}
const key='hmAnnualRevisionAttempt:v2:'+g;
const saved=authUser?(accountAttempts[String(g)]||null):(()=>{try{return JSON.parse(localStorage.getItem(key)||'null')}catch{return null}})();"""
          if old not in s: raise SystemExit('auth block not found')
          s=s.replace(old,new,1)
          old2="localStorage.setItem(key,JSON.stringify(record));location.reload()"
          new2="""if(authUser&&supabase){const attempts={...(authUser.user_metadata?.hmAnnualRevisionAttempts||{})};attempts[String(g)]=record;const {error}=await supabase.auth.updateUser({data:{hmAnnualRevisionAttempts:attempts}});if(error){$('diagResult').innerHTML='<div class=\"result\">⚠️ تعذر حفظ النتيجة في الحساب. حاول مرة أخرى.</div>';return}}else{localStorage.setItem(key,JSON.stringify(record))}location.reload()"""
          if old2 not in s: raise SystemExit('save block not found')
          s=s.replace(old2,new2,1)
          marker="if(!lockScreen()){renderQuiz(diag,'diag');$('diagLock').insertAdjacentHTML('beforeend','<div class=\"tip\">👤 يمكنك إجراء التشخيص كزائر دون إنشاء حساب. التشخيص محاولة واحدة فقط لهذا الصف على هذا الجهاز، بينما التدريب والجاهزية متاحان للتكرار.</div>')}"
          replacement="if(!lockScreen()){renderQuiz(diag,'diag');$('diagLock').insertAdjacentHTML('beforeend',authUser?'<div class=\"tip\">☁️ أنت مسجل الدخول. بعد إنهاء التشخيص سيتم حفظ نتيجتك في حسابك لتظهر معك من أي جهاز.</div>':'<div class=\"tip\">👤 يمكنك إجراء التشخيص كزائر دون إنشاء حساب. التشخيص محاولة واحدة فقط لهذا الصف على هذا الجهاز، بينما التدريب والجاهزية متاحان للتكرار. <a href=\"login.html\">تسجيل الدخول</a> يحفظ النتيجة على حسابك.</div>')}"
          if marker not in s: raise SystemExit('notice block not found')
          s=s.replace(marker,replacement,1)
          access_marker="const paths={"
          access_pos=s.find(access_marker)
          access_end=s.find(";\nconst titles=",access_pos)
          if access_pos<0 or access_end<0: raise SystemExit('paths marker not found')
          access_end+=2
          gate="""const accessPrivate=new URLSearchParams(location.search).get('private')==='1';
if(accessPrivate){
  const access=authUser?.user_metadata?.hmAcademyAccess||{};
  const grades=Array.isArray(access.grades)?access.grades.map(Number):[];
  const allowed=access.all===true||grades.includes(g);
  if(!authUser||!allowed){
    document.querySelector('main').innerHTML='<section class=\"section locked\"><h2>🔒 هذا المحتوى مخصص للطلاب المصرح لهم</h2><p class=\"muted\">الرابط وحده لا يمنح صلاحية الدخول. سجّل الدخول بالحساب المخصص لك، ثم افتح الرابط مرة أخرى.</p><a class=\"btn\" href=\"login.html?next='+encodeURIComponent(location.href)+'\">تسجيل الدخول</a></section>';
    return;
  }
}
"""
          s=s[:access_end]+gate+s[access_end:]
          p.write_text(s,encoding='utf-8')
          PY
          grep -q "hmAnnualRevisionAttempts" annual-revision-stage.html
          grep -q "accessPrivate" annual-revision-stage.html
          ! grep -q "\.\.\. (truncated)" annual-revision-stage.html
          grep -q "function openReview" annual-revision-stage.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
