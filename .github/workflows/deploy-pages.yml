name: Deploy HM Academy Preview

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply targeted Grade 1 vocabulary visual fix
        shell: bash
        run: |
          set -euo pipefail
          node scripts/fix-grade7-lesson1-vocab-images.js
      - name: Verify source files before deployment
        shell: bash
        run: |
          set -euo pipefail
          test -f grade7-lesson-studio.html
          test -f data/lessons/grade-7/grade7-source-content.json
          test -f data/lessons/grade-7/unit-1/lesson-1.json
          test -f data/lessons/grade-7/unit-2/lesson-1.json
          test -f data/lessons/grade-7/unit-3/lesson-1.json
          grep -q "const PATH=id=>" grade7-lesson-studio.html
          grep -q 'unit-${Number(m\[1\])}/lesson-${Number(m\[2\])}.json' grade7-lesson-studio.html
          grep -q "صورة مطابقة للكلمة" grade7-lesson-studio.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
