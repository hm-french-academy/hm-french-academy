name: Wire secondary-1 review fixes

on:
  push:
    branches: [secure-content-integration]
    paths:
      - 'js/secondary-1-review-fix.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: secure-content-integration
      - name: Inject review fix module
        shell: python
        run: |
          from pathlib import Path
          p = Path('secondary-1-review.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script type="module" src="js/secondary-1-review-fix.js?v=20260903"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('Could not find </body>')
              s = s.replace(marker, tag + marker, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit wiring change
        run: |
          git config user.name 'HM Academy Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add secondary-1-review.html
          if git diff --cached --quiet; then
            echo 'No wiring change needed.'
          else
            git commit -m 'fix(secondary1): wire diagnostic review fixes'
            git push origin HEAD:secure-content-integration
          fi
