name: Repair Premier Pas syntax
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.actor == 'hm-french-academy' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove malformed JavaScript fragment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('preparatory-french-starter-final.html')
          s = p.read_text(encoding='utf-8')
          pattern = r';direction:ltr">.*?;if\(step===6\)'
          fixed, n = re.subn(pattern, ';if(step===6)', s, count=1, flags=re.S)
          if n:
              p.write_text(fixed, encoding='utf-8')
              print('Removed malformed fragment.')
          else:
              print('Malformed fragment not found; leaving file unchanged.')
          PY
      - name: Validate page JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('preparatory-french-starter-final.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', s, flags=re.S)
          assert scripts, 'No inline script found'
          Path('/tmp/premier-pas.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/premier-pas.js
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preparatory-french-starter-final.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'fix: repair Premier Pas JavaScript syntax'
            git push origin main
          fi
