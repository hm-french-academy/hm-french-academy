name: Grade 4 Final QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/lessons/grade-4/**'
      - 'scripts/grade4-*.mjs'
      - 'scripts/lesson-audio-bind.js'
      - 'scripts/lesson-complete.js'
      - '.github/workflows/grade4-final-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Grade 4 source, binding and integration gates
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const base='data/lessons/grade-4/';
          const required=['release-manifest.json','source-package-manifest.json','source-content-audit.json','content-adapter-manifest.json','premium-runtime-manifest.json','premium-route-map.json','media-plan.json','games-plan.json','progress-plan.json','qa-matrix.json','validation-report.json','source-binding-manifest.json','media-binding-manifest.json','games-binding-manifest.json','progress-binding-manifest.json'];
          for(const f of required) if(!fs.existsSync(base+f)) throw new Error('Missing '+f);
          const audit=JSON.parse(fs.readFileSync(base+'source-content-audit.json','utf8'));
          if(audit.lessonCount!==7||audit.fileCount!==28) throw new Error('Invalid audit counts');
          const binding=JSON.parse(fs.readFileSync(base+'source-binding-manifest.json','utf8'));
          if(binding.bindings.length!==7||binding.assetContract.totalFiles!==28) throw new Error('Invalid source binding');
          for(const b of binding.bindings){if(!/^lesson\.html\?id=g4-l0[1-7]$/.test(b.route))throw new Error('Bad route '+b.route);}
          const media=JSON.parse(fs.readFileSync(base+'media-binding-manifest.json','utf8'));
          const games=JSON.parse(fs.readFileSync(base+'games-binding-manifest.json','utf8'));
          const progress=JSON.parse(fs.readFileSync(base+'progress-binding-manifest.json','utf8'));
          if(media.lessons.length!==7||games.lessons.length!==7||progress.lessonIds.length!==7)throw new Error('Integration lesson count mismatch');
          if(!fs.existsSync('scripts/lesson-audio-bind.js'))throw new Error('Audio runtime missing');
          if(!fs.existsSync('scripts/lesson-complete.js'))throw new Error('Progress runtime missing');
          let count=0,html=0,docx=0;
          function walk(dir){for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=dir+'/'+e.name;if(e.isDirectory())walk(p);else{count++;if(p.endsWith('.html'))html++;if(p.endsWith('.docx'))docx++;}}}
          walk(base+'source/4eme_Complet');
          if(count!==28||html!==14||docx!==14)throw new Error(`Invalid repository source tree: ${count}/${html}/${docx}`);
          console.log('Grade 4 Final QA static gate passed: source 28/28, canonical binding 7/7, media 7/7, games 7/7, progress 7/7.');
          NODE
      - name: Generate final QA report and release marker
        run: |
          node - <<'NODE'
          const fs=require('fs'); const base='data/lessons/grade-4/';
          const report={grade:'primary-4',semester:'term-1',status:'PASS',source:{lessons:7,files:28,html:14,docx:14},binding:{lessons:7,files:28},integration:{media:7,games:7,progress:7},releaseGate:'closed',generatedAt:new Date().toISOString()};
          fs.writeFileSync(base+'qa-report.json',JSON.stringify(report,null,2)+'\n');
          const p='data/programs-catalog.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); const g=j.programs.flatMap(p=>p.grades).find(g=>g.id==='primary-4'); if(!g) throw new Error('primary-4 missing'); g.status='available'; if(g.terms?.[0]) g.terms[0].status='available'; fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE
      - name: Commit final release state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lessons/grade-4/qa-report.json data/programs-catalog.json
          git diff --cached --quiet && exit 0
          git commit -m 'release(grade4): close final QA gate and publish term one'
          git push
