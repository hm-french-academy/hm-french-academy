name: Fix Grade 6 pronunciation

on:
  push:
    paths:
      - '.github/workflows/fix-g6-pronunciation.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Grade 6 lesson from known-good commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cc3513b2b69a4c3ce28b851f65f8894628e2f2fd
          git show cc3513b2b69a4c3ce28b851f65f8894628e2f2fd:grade6-lesson-v2.html > grade6-lesson-v2.html
      - name: Patch pronunciation handler
        shell: python
        run: |
          from pathlib import Path
          p = Path('grade6-lesson-v2.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('function say(t){')
          if start < 0:
              raise SystemExit('say() not found')
          depth = 0
          end = None
          for i in range(start, len(s)):
              if s[i] == '{': depth += 1
              elif s[i] == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit('say() end not found')
          new = r'''function say(t){
  if(!t)return;
  const text=String(t).trim(),status=document.getElementById('pronStatus');
  if(!text)return;
  if(status)status.textContent='🔊 جاري تشغيل النطق الفرنسي…';
  try{
    const audio=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&tl=fr&client=gtx&q='+encodeURIComponent(text));
    audio.preload='auto';
    audio.volume=1;
    const playNow=audio.play();
    if(playNow&&playNow.catch)playNow.catch(()=>{});
    audio.onended=()=>{if(status)status.textContent='اضغط على زر الاستماع لتشغيل النطق الفرنسي.'};
    audio.onerror=()=>{
      try{
        if('speechSynthesis' in window&&'SpeechSynthesisUtterance' in window){
          const synth=window.speechSynthesis;synth.cancel();
          const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=.82;u.pitch=1;u.volume=1;synth.speak(u);
          u.onend=()=>{if(status)status.textContent='اضغط على زر الاستماع لتشغيل النطق الفرنسي.'};
          return;
        }
      }catch(e){}
      if(status)status.textContent='⚠️ تعذر تشغيل النطق.';
    };
  }catch(e){if(status)status.textContent='⚠️ تعذر تشغيل النطق.'}
}'''
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-g6-pronunciation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grade6-lesson-v2.html .github/workflows/fix-g6-pronunciation.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Restore Grade 6 lesson and fix pronunciation [skip ci]'
          git push
