name: Fix g4-l01 speech
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-g4-l01-speech.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch speech function
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('grade-4-l01-learning-studio.html')
          s=p.read_text(encoding='utf-8')
          old="function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}"
          new="window.speak=function(t){if(!('speechSynthesis'in window)||!window.SpeechSynthesisUtterance)return;const synth=window.speechSynthesis;synth.cancel();const u=new window.SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;synth.speak(u)}"
          if old not in s: raise SystemExit('speech function not found')
          s=s.replace(old,new,1)
          s=s.replace('onclick=\"speak(${JSON.stringify(t)})\"','onclick=\"window.speak(${JSON.stringify(t)})\"')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grade-4-l01-learning-studio.html
          git commit -m 'fix(g4-l01): restore speech icon playback'
          git rm .github/workflows/fix-g4-l01-speech.yml
          git commit -m 'chore: remove temporary g4-l01 speech workflow'
          git push