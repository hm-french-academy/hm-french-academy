name: Temporary Grade 4 title fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix only lesson 04 and 06 hero labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('grade-4-lessons-03-07-live-v2.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("unit:'Unité 3 · الدرس الأول'", "unit:'Le français · 4e année · Leçon 04'")
          s=s.replace("unit:'Unité 4 · الدرس الأول'", "unit:'Le français · 4e année · Leçon 06'")
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'HM Academy'
          git config user.email 'hm-academy@users.noreply.github.com'
          git add grade-4-lessons-03-07-live-v2.html .github/workflows/_temp_fix_g4_titles.yml
          git commit -m "fix(grade4): restore lesson 04 and 06 title labels" || exit 0
          git rm .github/workflows/_temp_fix_g4_titles.yml
          git commit --amend --no-edit
          git push
