name: Repair Grade 6 pronunciation

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact known-good file and patch speech only
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          p = Path('grade6-lesson-v2.html')
          subprocess.run(['git','checkout','2f075c7619a71a583373523d511199f99aa14bd6','--','grade6-lesson-v2.html'], check=True)
          s = p.read_text(encoding='utf-8')
          old = """function say(t){if(!t)return;let status=document.getElementById('pronStatus');try{if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){if(status)status.textContent='⚠️ النطق الصوتي غير مدعوم في هذا المتصفح.';return}const synth=window.speechSynthesis;const speakNow=()=>{synth.cancel();synth.resume();const u=new SpeechSynthesisUtterance(String(t));u.lang='fr-FR';u.rate=.82;u.pitch=1;u.volume=1;const voices=synth.getVoices();const v=voices.find(x=>/^fr(-|_)/i.test(x.lang))||voices.find(x=>/french|français/i.test(x.name));if(v)u.voice=v;u.onstart=()=>{if(status)status.textContent='🔊 جارٍ تشغيل النطق الفرنسي…'};u.onend=()=>{if(status)status.textContent='اضغط على زر الاستماع لتشغيل النطق الفرنسي.'};u.onerror=()=>{if(status)status.textContent='⚠️ تعذر تشغيل النطق. جرّب الضغط مرة أخرى أو استخدم متصفحًا يدعم النطق الصوتي.'};synth.speak(u)};if(synth.getVoices().length){speakNow()}else{let once=()=>{synth.removeEventListener('voiceschanged',once);speakNow()};synth.addEventListener('voiceschanged',once);setTimeout(()=>{synth.removeEventListener('voiceschanged',once);speakNow()},800)}}catch(e){if(status)status.textContent='⚠️ تعذر تشغيل النطق الصوتي.'}}"""
          new = """function say(t){if(!t)return;let status=document.getElementById('pronStatus');try{if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){if(status)status.textContent='⚠️ النطق الصوتي غير مدعوم في هذا المتصفح.';return}const synth=window.speechSynthesis;synth.cancel();synth.resume();const u=new SpeechSynthesisUtterance(String(t));u.lang='fr-FR';u.rate=.82;u.pitch=1;u.volume=1;const voices=synth.getVoices();const v=voices.find(x=>/^fr(-|_)/i.test(x.lang))||voices.find(x=>/french|français/i.test(x.name));if(v)u.voice=v;u.onstart=()=>{if(status)status.textContent='🔊 جارٍ تشغيل النطق الفرنسي…'};u.onend=()=>{if(status)status.textContent='اضغط على زر الاستماع لتشغيل النطق الفرنسي.'};u.onerror=()=>{if(status)status.textContent='⚠️ تعذر تشغيل النطق. جرّب الضغط مرة أخرى أو استخدم متصفحًا يدعم النطق الصوتي.'};synth.speak(u)}catch(e){if(status)status.textContent='⚠️ تعذر تشغيل النطق الصوتي.'}}"""
          if old not in s:
              raise SystemExit('Expected original say() function was not found; refusing to modify the file.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Create repair branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="repair-grade6-pronunciation-${GITHUB_RUN_ID}"
          git config user.name "hm-french-academy"
          git config user.email "hf.toma@gmail.com"
          git checkout -b "$branch"
          git add grade6-lesson-v2.html
          git commit -m "fix: restore grade 6 lesson and repair pronunciation"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Fix Grade 6 pronunciation buttons" --body "Restore grade6-lesson-v2.html from the known-good commit and change only the speechSynthesis click path so Android browsers do not wait for voiceschanged before speaking."
