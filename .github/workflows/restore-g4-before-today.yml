name: Restore g4-l01 before today
on:
  push:
    paths:
      - .github/workflows/restore-g4-before-today.yml
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore only Grade 4 Lesson 1 file
        run: |
          git checkout ecd7964c31ddeca00f479cc8f3f987498b498f00 -- grade-4-l01-learning-studio.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grade-4-l01-learning-studio.html
          git commit -m "restore g4-l01 to pre-today state" || true
          git push
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/restore-g4-before-today.yml
          git add .github/workflows/restore-g4-before-today.yml
          git commit -m "chore: remove temporary g4 restore workflow" || true
          git push
