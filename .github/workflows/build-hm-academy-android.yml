name: Build HM Academy Android APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-hm-academy-android.yml'
      - '**.html'
      - '**.js'
      - '**.css'
      - '**.json'
      - '**.svg'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.webp'
      - '**.mp3'
      - '**.wav'
      - '**.mp4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HM Academy
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          else
            echo "Android sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p android-app/app/src/main/java/com/hmacademy/student
          mkdir -p android-app/app/src/main/res/values

          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "HMAcademyStudent"
          include(":app")
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.6.1' apply false }
          EOF

          cat > android-app/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > android-app/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.hmacademy.student'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.hmacademy.student'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
          EOF

          cat > android-app/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">HM Academy</string></resources>
          EOF

          cat > android-app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:colorAccent">#1f5d9b</item>
              </style>
          </resources>
          EOF

          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:theme="@style/AppTheme" android:label="@string/app_name"
                  android:hardwareAccelerated="true" android:usesCleartextTraffic="false"
                  android:resizeableActivity="true">
                  <activity android:name=".MainActivity" android:screenOrientation="unspecified"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android-app/app/src/main/java/com/hmacademy/student/MainActivity.java <<'EOF'
          package com.hmacademy.student;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.view.inputmethod.InputMethodManager;
          import android.content.Context;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.util.HashMap;
          import java.util.Map;

          public class MainActivity extends Activity {
              private static final String HOST = "hm-french-academy.github.io";
              private static final String PREFS = "hm_student_access";
              private static final String PREF_CODE = "student_code";
              private static final Map<String, AccessProfile> ACCESS = new HashMap<>();

              static {
                  ACCESS.put("HM-DEMO-G8L1", new AccessProfile(
                      "الصف الثاني الإعدادي — الدرس الأول",
                      "https://hm-french-academy.github.io/hm-french-academy/lesson-studio-standard.html?id=grade8-u1-l1&v=20260831-content-polish&section=lesson"
                  ));
              }

              private WebView webView;
              private AccessProfile activeProfile;

              @Override protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  String saved = getSharedPreferences(PREFS, MODE_PRIVATE).getString(PREF_CODE, null);
                  AccessProfile profile = saved == null ? null : ACCESS.get(saved);
                  if (profile == null) showLogin();
                  else { activeProfile = profile; showLesson(); }
              }

              private void showLogin() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setPadding(dp(28), dp(28), dp(28), dp(28));
                  root.setBackgroundColor(Color.WHITE);

                  TextView brand = new TextView(this);
                  brand.setText("HM Academy");
                  brand.setTextSize(30);
                  brand.setTextColor(Color.rgb(31,93,155));
                  brand.setGravity(Gravity.CENTER);
                  brand.setTypeface(null, android.graphics.Typeface.BOLD);

                  TextView title = new TextView(this);
                  title.setText("دخول الطالب");
                  title.setTextSize(22);
                  title.setTextColor(Color.DKGRAY);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, dp(18), 0, dp(8));

                  TextView hint = new TextView(this);
                  hint.setText("أدخل كود الطالب المخصص لك");
                  hint.setTextSize(16);
                  hint.setTextColor(Color.GRAY);
                  hint.setGravity(Gravity.CENTER);
                  hint.setPadding(0, 0, 0, dp(18));

                  EditText code = new EditText(this);
                  code.setSingleLine(true);
                  code.setHint("كود الطالب");
                  code.setTextSize(18);
                  code.setGravity(Gravity.CENTER);
                  code.setAllCaps(true);
                  code.setPadding(dp(14), dp(12), dp(14), dp(12));

                  Button enter = new Button(this);
                  enter.setText("دخول");
                  enter.setAllCaps(false);
                  enter.setTextSize(17);

                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  p.setMargins(0, dp(8), 0, dp(8));
                  root.addView(brand, p);
                  root.addView(title, p);
                  root.addView(hint, p);
                  root.addView(code, p);
                  root.addView(enter, p);
                  setContentView(root);

                  enter.setOnClickListener(v -> {
                      String value = code.getText().toString().trim().toUpperCase();
                      AccessProfile profile = ACCESS.get(value);
                      if (profile == null) {
                          Toast.makeText(this, "كود الطالب غير صحيح أو غير مفعل.", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      activeProfile = profile;
                      getSharedPreferences(PREFS, MODE_PRIVATE).edit().putString(PREF_CODE, value).apply();
                      InputMethodManager imm = (InputMethodManager)getSystemService(INPUT_METHOD_SERVICE);
                      if (imm != null) imm.hideSoftInputFromWindow(code.getWindowToken(), 0);
                      showLesson();
                  });
              }

              @SuppressLint("SetJavaScriptEnabled")
              private void showLesson() {
                  webView = new WebView(this);
                  setContentView(webView);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setMediaPlaybackRequiresUserGesture(false);
                  webView.getSettings().setAllowFileAccess(false);
                  webView.getSettings().setAllowContentAccess(false);
                  webView.getSettings().setCacheMode(android.webkit.WebSettings.LOAD_NO_CACHE);
                  webView.getSettings().setSupportMultipleWindows(false);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          if (!request.isForMainFrame()) return false;
                          if (isAllowed(request.getUrl())) return false;
                          Toast.makeText(MainActivity.this, "هذا الرابط غير متاح لهذا الطالب.", Toast.LENGTH_SHORT).show();
                          return true;
                      }
                      @SuppressWarnings("deprecation")
                      @Override public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (isAllowed(Uri.parse(url))) return false;
                          Toast.makeText(MainActivity.this, "هذا الرابط غير متاح لهذا الطالب.", Toast.LENGTH_SHORT).show();
                          return true;
                      }
                  });

                  String url = activeProfile.url + "&hmapp=" + System.currentTimeMillis();
                  webView.loadUrl(url);
              }

              private boolean isAllowed(Uri uri) {
                  if (activeProfile == null || uri == null) return false;
                  if (!"https".equalsIgnoreCase(uri.getScheme())) return false;
                  if (!HOST.equalsIgnoreCase(uri.getHost())) return false;
                  Uri allowed = Uri.parse(activeProfile.url);
                  if (!allowed.getPath().equals(uri.getPath())) return false;
                  String id = allowed.getQueryParameter("id");
                  return id != null && id.equals(uri.getQueryParameter("id"));
              }

              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              @Override protected void onDestroy() {
                  if (webView != null) {
                      if (webView.getParent() instanceof ViewGroup) ((ViewGroup)webView.getParent()).removeView(webView);
                      webView.stopLoading();
                      webView.clearHistory();
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }

              private int dp(int v) {
                  return Math.round(v * getResources().getDisplayMetrics().density);
              }

              private static class AccessProfile {
                  final String name;
                  final String url;
                  AccessProfile(String name, String url) { this.name = name; this.url = url; }
              }
          }
          EOF

      - name: Build APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HM-Academy-Android
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
