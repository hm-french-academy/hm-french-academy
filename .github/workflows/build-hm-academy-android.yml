name: Build HM Academy Android APK
# final-build-v1.2

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-hm-academy-android.yml'
      - '**.html'
      - '**.js'
      - '**.css'
      - '**.json'
      - '**.svg'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.webp'
      - '**.mp3'
      - '**.wav'
      - '**.mp4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HM Academy
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          else
            echo "Android sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare HM Academy launcher icon
        shell: bash
        run: |
          set -e
          mkdir -p android-app/app/src/main/res/drawable
          cat > android-app/app/src/main/res/drawable/hm_academy_logo.svg <<'EOF'
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><defs><linearGradient id="b" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1264e8"/><stop offset="1" stop-color="#08d9d6"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/></filter></defs><rect x="34" y="34" width="956" height="956" rx="170" fill="#061b4f"/><g filter="url(#s)"><path fill="#fff" d="M238 265c91 13 165 39 221 89v408c-66-51-140-73-221-76V265Z"/><path fill="#f8fbff" d="M786 265c-91 13-165 39-221 89v408c66-51 140-73 221-76V265Z"/><path fill="none" stroke="#061b4f" stroke-width="22" stroke-linecap="round" d="M512 354v409M238 265c91 13 165 39 221 89M786 265c-91 13-165 39-221 89"/><path fill="none" stroke="url(#b)" stroke-width="34" stroke-linecap="round" d="M168 728c128-20 250 4 344 77 94-73 216-97 344-77"/><path fill="none" stroke="#1467ee" stroke-width="42" stroke-linecap="round" d="M160 792c138-29 255-4 352 69 97-73 214-98 352-69"/><path fill="none" stroke="url(#b)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round" d="M278 612c112-79 205-66 282 8l292-293"/><path fill="none" stroke="#fff" stroke-width="82" stroke-linecap="round" stroke-linejoin="round" d="M278 612c112-79 205-66 282 8l292-293"/><path fill="none" stroke="url(#b)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" d="M278 612c112-79 205-66 282 8l292-293"/><path fill="url(#b)" d="m846 214 18 178-64-49-66 22 112-151Z"/></g></svg>
EOF
          if command -v rsvg-convert >/dev/null 2>&1; then
            rsvg-convert -w 1024 -h 1024 android-app/app/src/main/res/drawable/hm_academy_logo.svg -o android-app/app/src/main/res/drawable/hm_academy_logo_png.png
          elif command -v convert >/dev/null 2>&1; then
            convert -background none android-app/app/src/main/res/drawable/hm_academy_logo.svg -resize 1024x1024 android-app/app/src/main/res/drawable/hm_academy_logo_png.png
          else
            echo "No SVG rasterizer available"; exit 1
          fi

      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p android-app/app/src/main/java/com/hmacademy/student
          mkdir -p android-app/app/src/main/res/values android-app/app/src/main/res/mipmap-hdpi android-app/app/src/main/res/mipmap-mdpi android-app/app/src/main/res/mipmap-xhdpi android-app/app/src/main/res/mipmap-xxhdpi android-app/app/src/main/res/mipmap-xxxhdpi

          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "HMAcademyStudent"
          include(":app")
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.6.1' apply false }
          EOF

          cat > android-app/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > android-app/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.hmacademy.student'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.hmacademy.student'
                  minSdk 23
                  targetSdk 35
                  versionCode 4
                  versionName '1.3'
              }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
          EOF

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android-app/app/src/main/res/mipmap-$d
            cp android-app/app/src/main/res/drawable/hm_academy_logo_png.png android-app/app/src/main/res/mipmap-$d/ic_launcher.png
          done

          cat > android-app/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">HM Academy</string></resources>
          EOF

          cat > android-app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:colorAccent">#1f5d9b</item>
              </style>
          </resources>
          EOF

          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:theme="@style/AppTheme" android:label="@string/app_name" android:icon="@drawable/hm_academy_logo_png" android:roundIcon="@drawable/hm_academy_logo_png"
                  android:hardwareAccelerated="true" android:usesCleartextTraffic="false"
                  android:resizeableActivity="true">
                  <activity android:name=".MainActivity" android:screenOrientation="unspecified"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android-app/app/src/main/java/com/hmacademy/student/MainActivity.java <<'EOF'
          package com.hmacademy.student;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.view.inputmethod.InputMethodManager;
          import android.content.Context;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import android.provider.Settings;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends Activity {
              private static final String HOST = "hm-french-academy.github.io";
              private static final String ACCESS_API = "https://yvoprtjyxmurvcsaqsny.supabase.co/functions/v1/student-code-login";
              private static final String PREFS = "hm_student_access";
              private static final String PREF_CODE = "student_code";
              private WebView webView;
              private AccessProfile activeProfile;

              @Override protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  String saved = getSharedPreferences(PREFS, MODE_PRIVATE).getString(PREF_CODE, null);
                  if (saved == null) showLogin(); else validateCodeOnline(saved, null, null, true);
              }

              private void showLogin() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL); root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setPadding(dp(28), dp(28), dp(28), dp(28)); root.setBackgroundColor(Color.WHITE);
                  TextView brand=new TextView(this); brand.setText("HM Academy"); brand.setTextSize(30); brand.setTextColor(Color.rgb(31,93,155)); brand.setGravity(Gravity.CENTER); brand.setTypeface(null,android.graphics.Typeface.BOLD);
                  TextView title=new TextView(this); title.setText("دخول الطالب"); title.setTextSize(22); title.setGravity(Gravity.CENTER); title.setTextColor(Color.DKGRAY); title.setPadding(0,dp(18),0,dp(8));
                  TextView hint=new TextView(this); hint.setText("أدخل كود الطالب المخصص لك"); hint.setTextSize(16); hint.setGravity(Gravity.CENTER); hint.setTextColor(Color.GRAY); hint.setPadding(0,0,0,dp(18));
                  EditText code=new EditText(this); code.setSingleLine(true); code.setHint("كود الطالب"); code.setTextSize(18); code.setGravity(Gravity.CENTER); code.setAllCaps(true); code.setPadding(dp(14),dp(12),dp(14),dp(12));
                  Button enter=new Button(this); enter.setText("دخول"); enter.setAllCaps(false); enter.setTextSize(17);
                  LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,ViewGroup.LayoutParams.WRAP_CONTENT); p.setMargins(0,dp(8),0,dp(8));
                  root.addView(brand,p); root.addView(title,p); root.addView(hint,p); root.addView(code,p); root.addView(enter,p); setContentView(root);
                  enter.setOnClickListener(v->{String value=code.getText().toString().trim().toUpperCase(); if(value.isEmpty()){Toast.makeText(this,"اكتب كود الطالب أولاً.",Toast.LENGTH_SHORT).show();return;} enter.setEnabled(false); validateCodeOnline(value,enter,code,false);});
              }

              private void validateCodeOnline(String code, Button enter, EditText field, boolean silent) {
                  new Thread(() -> {
                      HttpURLConnection c=null;
                      try {
                          URL u=new URL(ACCESS_API); c=(HttpURLConnection)u.openConnection(); c.setRequestMethod("POST"); c.setConnectTimeout(12000); c.setReadTimeout(12000); c.setDoOutput(true); c.setRequestProperty("Content-Type","application/json");
                          JSONObject body=new JSONObject(); body.put("code",code); body.put("device_id",Settings.Secure.getString(getContentResolver(),Settings.Secure.ANDROID_ID));
                          try(OutputStream os=c.getOutputStream()){os.write(body.toString().getBytes("UTF-8"));}
                          int status=c.getResponseCode(); BufferedReader br=new BufferedReader(new InputStreamReader(status>=400?c.getErrorStream():c.getInputStream(),"UTF-8"));
                          StringBuilder out=new StringBuilder(); String line; while((line=br.readLine())!=null)out.append(line);
                          JSONObject result=new JSONObject(out.toString());
                          runOnUiThread(()->{
                              if(enter!=null)enter.setEnabled(true);
                              if(!result.optBoolean("ok",false)){ if(enter!=null)Toast.makeText(this,result.optString("error","invalid_code").equals("expired")?"انتهت صلاحية الكود.":result.optString("error","").equals("device_mismatch")?"هذا الكود مرتبط بجهاز آخر.":"كود الطالب غير صحيح أو غير مفعل.",Toast.LENGTH_LONG).show(); getSharedPreferences(PREFS,MODE_PRIVATE).edit().remove(PREF_CODE).apply(); if(silent)showLogin(); return; }
                              JSONArray lessons=result.optJSONArray("allowed_lessons"); String lesson=lessons==null?"":lessons.optString(0,"");
                              if(lesson.isEmpty()){if(!silent)Toast.makeText(this,"الكود صحيح ولكن لا توجد دروس مسموحة.",Toast.LENGTH_LONG).show();if(silent)showLogin();return;}
                              activeProfile=new AccessProfile(result.optString("student_name","طالب"),"https://"+HOST+"/hm-french-academy/lesson-studio-standard.html?id="+Uri.encode(lesson)+"&v=20260831-content-polish&section=lesson");
                              getSharedPreferences(PREFS,MODE_PRIVATE).edit().putString(PREF_CODE,code).apply();
                              if(field!=null){InputMethodManager imm=(InputMethodManager)getSystemService(INPUT_METHOD_SERVICE);if(imm!=null)imm.hideSoftInputFromWindow(field.getWindowToken(),0);}
                              showLesson();
                          });
                      }catch(Exception ex){runOnUiThread(()->{if(enter!=null)enter.setEnabled(true);if(silent)showLogin();else Toast.makeText(this,"تعذر الاتصال بالخدمة. تحقق من الإنترنت ثم حاول مرة أخرى.",Toast.LENGTH_LONG).show();});}
                      finally{if(c!=null)c.disconnect();}
                  }).start();
              }

              @SuppressLint("SetJavaScriptEnabled")
              private void showLesson(){
                  webView=new WebView(this); setContentView(webView);
                  webView.getSettings().setJavaScriptEnabled(true); webView.getSettings().setDomStorageEnabled(true); webView.getSettings().setMediaPlaybackRequiresUserGesture(false); webView.getSettings().setAllowFileAccess(false); webView.getSettings().setAllowContentAccess(false); webView.getSettings().setCacheMode(android.webkit.WebSettings.LOAD_NO_CACHE); webView.getSettings().setSupportMultipleWindows(false);
                  webView.setWebViewClient(new WebViewClient(){
                      @Override public boolean shouldOverrideUrlLoading(WebView view,WebResourceRequest request){if(!request.isForMainFrame())return false;if(isAllowed(request.getUrl()))return false;Toast.makeText(MainActivity.this,"هذا الرابط غير متاح لهذا الطالب.",Toast.LENGTH_SHORT).show();return true;}
                      @SuppressWarnings("deprecation") @Override public boolean shouldOverrideUrlLoading(WebView view,String url){if(isAllowed(Uri.parse(url)))return false;Toast.makeText(MainActivity.this,"هذا الرابط غير متاح لهذا الطالب.",Toast.LENGTH_SHORT).show();return true;}
                  });
                  webView.loadUrl(activeProfile.url+"&hmapp="+System.currentTimeMillis());
              }

              private boolean isAllowed(Uri uri){
                  if(activeProfile==null||uri==null||!"https".equalsIgnoreCase(uri.getScheme())||!HOST.equalsIgnoreCase(uri.getHost()))return false;
                  Uri allowed=Uri.parse(activeProfile.url); if(!allowed.getPath().equals(uri.getPath()))return false;
                  String id=allowed.getQueryParameter("id"); return id!=null&&id.equals(uri.getQueryParameter("id"));
              }
              @Override public void onBackPressed(){if(webView!=null&&webView.canGoBack())webView.goBack();else super.onBackPressed();}
              @Override protected void onDestroy(){if(webView!=null){if(webView.getParent() instanceof ViewGroup)((ViewGroup)webView.getParent()).removeView(webView);webView.stopLoading();webView.clearHistory();webView.destroy();webView=null;}super.onDestroy();}
              private int dp(int v){return Math.round(v*getResources().getDisplayMetrics().density);}
              private static class AccessProfile{final String name;final String url;AccessProfile(String name,String url){this.name=name;this.url=url;}}
          }
          EOF
      - name: Build APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HM-Academy-Android-v1.2
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
