name: Repair accidental Grade 4 asset changes
on:
  push:
    branches:
      - repair-accidental-grade4-assets
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: repair-accidental-grade4-assets
      - name: Revert accidental source-asset commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-edit 9f4c179f7110c2933320dfcf7bd3ef6d03ff2fd2
          git push origin HEAD:main
