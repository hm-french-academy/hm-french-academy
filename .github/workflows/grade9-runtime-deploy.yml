name: Deploy Grade 9 Runtime Recovery

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-grade9-runtime
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject isolated Grade 9 recovery runtime
        run: |
          set -euo pipefail
          test -f grade9-u1-l1-standard.html
          test -f scripts/grade9-u1-l1-recovery.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('grade9-u1-l1-standard.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="scripts/grade9-u1-l1-recovery.js?v=20260911" defer></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          assert tag in s
          PY

      - name: Validate Grade 9 lesson and recovery runtime
        run: |
          set -euo pipefail
          grep -Fq 'id="nav"' grade9-u1-l1-standard.html
          grep -Fq 'id="panel"' grade9-u1-l1-standard.html
          grep -Fq 'grade9-u1-l1-recovery.js' grade9-u1-l1-standard.html
          grep -Fq 'function boot()' scripts/grade9-u1-l1-recovery.js
          grep -Fq "document.getElementById('nav')" scripts/grade9-u1-l1-recovery.js
          grep -Fq "document.getElementById('panel')" scripts/grade9-u1-l1-recovery.js
          grep -Fq 'render();' scripts/grade9-u1-l1-recovery.js

      - name: Write deployment fingerprint
        run: echo "$GITHUB_SHA" > deployment-version-grade9.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Grade 9 runtime recovery
        id: deployment
        uses: actions/deploy-pages@v4
