name: Deploy Grade 9 Lesson Runtime

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-grade9-runtime
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate isolated Grade 9 lesson
        run: |
          set -euo pipefail
          test -f grade9-u1-l1-standard.html
          grep -Fq 'id="nav"' grade9-u1-l1-standard.html
          grep -Fq 'id="panel"' grade9-u1-l1-standard.html
          grep -Fq "u.lang='fr-FR'" grade9-u1-l1-standard.html
          grep -Fq 'window.speak=speak' grade9-u1-l1-standard.html
          ! grep -Fq 'grade9-u1-l1-recovery.js' grade9-u1-l1-standard.html

      - name: Write deployment fingerprint
        run: echo "$GITHUB_SHA" > deployment-version-grade9.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Grade 9 lesson runtime
        id: deployment
        uses: actions/deploy-pages@v4
