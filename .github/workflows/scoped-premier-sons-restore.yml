name: Scoped lesson runtime repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'hm-french-academy' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Grade 6 lesson from known-good commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cc3513b2b69a4c3ce28b851f65f8894628e2f2fd
          git show cc3513b2b69a4c3ce28b851f65f8894628e2f2fd:grade6-lesson-v2.html > grade6-lesson-v2.html
          git add grade6-lesson-v2.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'GRADE6_ALREADY_RESTORED'
          else
            git commit -m 'restore: Grade 6 lesson page'
            git push origin main
          fi

      - name: Fix Grade 9 standard lesson runtime only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('grade9-u1-l1-standard.html')
          s = p.read_text(encoding='utf-8')
          needle = "let idx=0,assessmentScore=0,assessmentDone=0,reviewScore=0,reviewDone=0;"
          declaration = "const nav=document.getElementById('nav');\nconst panel=document.getElementById('panel');"
          if declaration not in s:
              if needle not in s:
                  raise SystemExit('Grade 9 runtime insertion point not found')
              s = s.replace(needle, needle + "\n" + declaration, 1)
              p.write_text(s, encoding='utf-8')
              print('PATCHED_GRADE9_RUNTIME')
          else:
              print('GRADE9_RUNTIME_ALREADY_FIXED')
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('grade9-u1-l1-standard.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S))
          Path('/tmp/grade9-standard.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/grade9-standard.js
          grep -Fq "const nav=document.getElementById('nav');" grade9-u1-l1-standard.html
          grep -Fq "const panel=document.getElementById('panel');" grade9-u1-l1-standard.html

          if git diff --quiet -- grade9-u1-l1-standard.html; then
            echo 'NO_GRADE9_SOURCE_CHANGE'
            exit 0
          fi
          git add grade9-u1-l1-standard.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: define Grade 9 lesson DOM elements explicitly'
          git push origin main
