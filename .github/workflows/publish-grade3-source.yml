name: Publish Grade 3 Source

on:
  push:
    paths:
      - 'data/lessons/grade-3/3eme prim.zip'
      - '.github/workflows/publish-grade3-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract Grade 3 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data/lessons/grade-3/web
          mkdir -p data/lessons/grade-3/web
          unzip -q 'data/lessons/grade-3/3eme prim.zip' -d data/lessons/grade-3/web
          count=$(find data/lessons/grade-3/web -type f | wc -l)
          echo "Published ${count} source files"
          echo "Grade 3 source publish: validating canonical interactive pages"
          test "$count" -eq 32
          test "$(find data/lessons/grade-3/web -type f -name '*.html' | wc -l)" -eq 12
          test "$(find data/lessons/grade-3/web -type f -name '*.docx' | wc -l)" -eq 20
      - name: Verify canonical lesson assets
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            'data/lessons/grade-3/web/3eme prim/01_Introduction/01_interactif_introduction.html' \
            'data/lessons/grade-3/web/3eme prim/02_En_classe/01_interactif_enclasse.html' \
            'data/lessons/grade-3/web/3eme prim/03_Actes_et_verbes/01_interactif_actesverbes.html' \
            'data/lessons/grade-3/web/3eme prim/04_Unite1_Cest_ma_classe/01_interactif_maclasse.html' \
            'data/lessons/grade-3/web/3eme prim/05_Unite2_Cest_ma_maison/01_interactif_maison.html' \
            'data/lessons/grade-3/web/3eme prim/06_Unite3_Fruits_et_legumes/01_interactif_fruits.html'; do
            test -f "$f"
          done
      - name: Commit published assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lessons/grade-3/web
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: publish grade 3 source assets'
          git push
