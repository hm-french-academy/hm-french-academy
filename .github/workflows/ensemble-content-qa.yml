name: Ensemble Content QA

on:
  push:
    branches: [main]
    paths:
      - 'data/ensemble-curriculum.json'
      - 'data/ensemble-lesson-bank.json'
      - 'data/ensemble-content-manifest.json'
      - 'ensemble-grade.html'
      - 'ensemble-lesson.html'
      - '.github/workflows/ensemble-content-qa.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Ensemble structure, curriculum coverage and enriched runtime
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          curriculum = json.loads(Path('data/ensemble-curriculum.json').read_text(encoding='utf-8'))
          bank = json.loads(Path('data/ensemble-lesson-bank.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('data/ensemble-content-manifest.json').read_text(encoding='utf-8'))

          grades = curriculum.get('grades', [])
          if len(grades) != manifest['expectedGrades']:
              raise SystemExit(f"Expected {manifest['expectedGrades']} grades, found {len(grades)}")

          expected = set(manifest['lessons'])
          actual = set()
          errors = []

          if len(expected) != manifest['expectedLessonCount']:
              errors.append('Manifest lesson count is inconsistent')

          for grade_no, grade in enumerate(grades, 1):
              if grade.get('id') != f'ensemble-{grade_no}':
                  errors.append(f'Unexpected grade id: {grade.get("id")}')
              modules = grade.get('modules', [])
              if len(modules) != manifest['modulesPerGrade']:
                  errors.append(f'{grade.get("id")}: expected {manifest["modulesPerGrade"]} modules, found {len(modules)}')
              for module_no, module in enumerate(modules, 1):
                  key = f'ensemble-{grade_no}-m{module_no}'
                  if module.get('id') != f'm{module_no}':
                      errors.append(f'{key}: curriculum module id mismatch')
                  for field in ['title','objectives','vocab','grammar','phonetics','culture','task']:
                      if not module.get(field):
                          errors.append(f'{key}: missing curriculum coverage field {field}')
                  lessons = bank.get('modules', {}).get(key, {}).get('l', [])
                  if len(lessons) != manifest['lessonsPerModule']:
                      errors.append(f'{key}: expected {manifest["lessonsPerModule"]} lessons, found {len(lessons)}')
                  for lesson_no, lesson in enumerate(lessons, 1):
                      lesson_id = f'{key}-l{lesson_no}'
                      actual.add(lesson_id)
                      required = ['title','target','vocab','model','dialogue','grammar','practice','oral','writing','challenge']
                      missing = [k for k in required if not lesson.get(k)]
                      if missing:
                          errors.append(f'{lesson_id}: missing {", ".join(missing)}')
                      vocab = lesson.get('vocab')
                      if not isinstance(vocab, list) or not vocab:
                          errors.append(f'{lesson_id}: vocabulary is empty')
                      elif len(vocab) < 2 and not any(any(ch.isdigit() for ch in str(x)) or ' à ' in str(x) for x in vocab):
                          errors.append(f'{lesson_id}: vocabulary should contain at least 2 entries unless a range/sequence entry is used')

          missing_ids = sorted(expected - actual)
          extra_ids = sorted(actual - expected)
          if missing_ids:
              errors.append('Missing lesson IDs: ' + ', '.join(missing_ids))
          if extra_ids:
              errors.append('Unexpected lesson IDs: ' + ', '.join(extra_ids))

          lesson_html = Path('ensemble-lesson.html').read_text(encoding='utf-8')
          for marker in ['ensemble-lesson-bank.json', 'bank.modules', 'Interactive Book', 'Video Lab', 'speechText', 'Math.random', 'Maîtrise']:
              if marker not in lesson_html:
                  errors.append(f'ensemble-lesson.html missing enriched runtime marker: {marker}')
          if 'replace(/[—–]/g' not in lesson_html:
              errors.append('Speech cleanup for dash punctuation is missing')
          if 'speechSynthesis' not in lesson_html:
              errors.append('Speech synthesis runtime is missing')
          if 'localStorage' not in lesson_html:
              errors.append('Progress persistence runtime is missing')
          if 'feedback' not in lesson_html or 'reason' not in lesson_html:
              errors.append('Answer feedback/reason runtime is missing')

          if errors:
              print('\n'.join('ERROR: ' + e for e in errors))
              sys.exit(1)

          print(f'PASS: {len(actual)} Ensemble lessons validated across 3 grades × 6 modules × 3 lessons.')
          print('PASS: official curriculum coverage fields are present for every module.')
          print('PASS: every lesson has the required content package.')
          print('PASS: range/sequence vocabulary entries are accepted where pedagogically valid.')
          print('PASS: interactive book, video lab, speech, feedback and persistence runtime markers are present.')
          print('PASS: interactive answer position is randomized.')
          PY

# Release gate: every Ensemble content/runtime change must pass this check before production.
