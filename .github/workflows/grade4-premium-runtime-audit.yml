name: Grade 4 Premium Runtime Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/lessons/grade-4/**'
      - 'scripts/grade4-premium-runtime-audit.mjs'
      - '.github/workflows/grade4-premium-runtime-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Grade 4 Premium runtime audit
        run: node scripts/grade4-premium-runtime-audit.mjs
