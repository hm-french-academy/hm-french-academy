<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="cache-control" content="no-cache,no-store,must-revalidate"><title>HM Academy | مركز الألعاب · الجملة البسيطة</title><style>:root{--navy:#14264a;--blue:#2563eb;--purple:#713bd1;--green:#20a45a;--red:#d14b4b;--line:#e1e7f0;--muted:#68758c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f6f9ff,#edf3fb);font-family:Arial,Cairo,sans-serif;color:#17223b}.wrap{max-width:1050px;margin:auto;padding:18px 14px 60px}.top{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 16px;display:flex;justify-content:space-between;gap:10px}.brand{font-weight:900;color:var(--navy);text-decoration:none}.hero{margin-top:16px;padding:28px;border-radius:30px;background:linear-gradient(135deg,#173a82,#2563eb 58%,#713bd1);color:#fff}.hero h1{margin:0 0 8px;font-size:clamp(28px,6vw,42px)}.hero p{line-height:1.8;margin:5px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.stat{background:#ffffff18;border:1px solid #ffffff30;border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:25px}.panel{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 12px 30px #14264a0d}.mode{display:none}.mode.active{display:block}.q{font-size:21px;font-weight:900;line-height:1.8}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}.opt{padding:14px;border:1px solid #d5ddea;border-radius:14px;background:#fff;text-align:right;font-weight:900;cursor:pointer}.opt:hover{border-color:var(--blue)}.opt.correct{border-color:var(--green);background:#eaf8f0}.opt.wrong{border-color:var(--red);background:#fff0f0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--blue);color:#fff;font-weight:900;cursor:pointer;text-decoration:none}.btn.alt{background:#eef3ff;color:#2451a0}.feedback{min-height:28px;margin-top:12px;font-weight:900}.progress{height:8px;background:#e9eef6;border-radius:99px;overflow:hidden;margin:15px 0}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--purple))}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:9px 12px;border-radius:12px;background:#f5f8ff;border:1px solid var(--line);font-weight:900}.result{font-size:28px;font-weight:900;text-align:center;color:var(--navy)}@media(max-width:650px){.stats,.opts{grid-template-columns:1fr}.top{display:block}.hero{padding:22px}.panel{padding:16px}}</style></head><body><main class="wrap"><header class="top"><a class="brand" href="grade-5-lesson-v3.html?id=g5-t1-l01">HM 🇫🇷 ACADEMY</a><a class="btn alt" href="grade-5-lesson-v3.html?id=g5-t1-l01&section=overview">← العودة للدرس</a></header><section class="hero"><h1>🎮 مركز الألعاب · La phrase simple</h1><p>مركز ألعاب مستقل للدرس الأول فقط. كل سؤال هنا مولّد من بيانات <b>La phrase simple</b> ولا يوجد أي fallback إلى درس آخر.</p><div class="stats"><div class="stat"><b id="points">0</b>XP</div><div class="stat"><b id="done">0</b>إجابات صحيحة</div><div class="stat"><b>6</b>تحديات</div></div></section><section class="panel"><div class="chips"><span class="chip">👤 Sujet</span><span class="chip">⚡ Verbe</span><span class="chip">🎯 Complément</span><span class="chip">🧩 ترتيب الجملة</span><span class="chip">🧠 اختيار المثال</span><span class="chip">📘 قاعدة الدرس</span></div><div class="progress"><i id="bar"></i></div><div id="game"></div></section></main><script>(function(){const E=[{fr:'Mona parle français.',ar:'مونا تتحدث الفرنسية.',p:['Mona','parle','français']},{fr:'Je parle anglais.',ar:'أنا أتحدث الإنجليزية.',p:['Je','parle','anglais']},{fr:'Ali aime le français.',ar:'علي يحب اللغة الفرنسية.',p:['Ali','aime','le français']}],rule='Sujet + Verbe + Complément';const modes=[['Sujet','👤',x=>({q:`في «${x.fr}» من هو Sujet؟`,a:x.p[0],o:[x.p[0],x.p[1],x.p[2]]})],['Verbe','⚡',x=>({q:`في «${x.fr}» ما هو Verbe؟`,a:x.p[1],o:[x.p[1],x.p[0],x.p[2]]})],['Complément','🎯',x=>({q:`في «${x.fr}» ما هو Complément؟`,a:x.p[2],o:[x.p[2],x.p[0],x.p[1]]})],['الترتيب','🧩',x=>({q:'ما ترتيب الجملة البسيطة في هذا الدرس؟',a:rule,o:[rule,'Verbe + Sujet + Complément','Complément + Sujet + Verbe']})],['اختيار المثال','🧠',x=>({q:'أي جملة صحيحة وفق أمثلة الدرس؟',a:x.fr,o:E.map(y=>y.fr)})],['القاعدة','📘',x=>({q:'ما النموذج الأساسي الذي نطبقه؟',a:rule,o:[rule,'Verbe + Sujet + Complément','Sujet + Complément + Verbe']})]];let mi=0,qi=0,score=0,answered=0;const $=s=>document.querySelector(s);function render(){const m=modes[mi],x=E[qi%E.length],d=m[2](x);$('#game').innerHTML=`<div class="q">${m[1]} ${m[0]}<br>${d.q}</div><div class="opts">${d.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div><div class="feedback" id="fb"></div><div class="actions"><button class="btn" id="next">التحدي التالي →</button><a class="btn alt" href="grade-5-lesson1-assessment-v1.html">📝 التقييم الرسمي</a></div>`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>check(d,b));$('#next').onclick=()=>{mi=(mi+1)%modes.length;qi++;render()};$('#bar').style.width=((mi+1)/modes.length*100)+'%'}function check(d,b){if($('#fb').dataset.done)return;const ok=d.o[+b.dataset.i]===d.a;$('#fb').dataset.done='1';b.classList.add(ok?'correct':'wrong');if(ok){score+=10;answered++;$('#points').textContent=score;$('#done').textContent=answered;$('#fb').textContent='✓ إجابة صحيحة. أحسنت!';$('#fb').style.color='var(--green)'}else{$('#fb').textContent='✗ ليست الإجابة الصحيحة. راجع القاعدة وحاول في التحدي التالي.';$('#fb').style.color='var(--red)'}try{localStorage.setItem('hm-g5-l01-games-score',String(score))}catch(e){}}try{score=+(localStorage.getItem('hm-g5-l01-games-score')||0);$('#points').textContent=score}catch(e){}render()})();</script></body></html>
