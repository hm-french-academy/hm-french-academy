<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | المراجعة الذكية · الصف الخامس</title><link rel="stylesheet" href="css/premium-shell.css"><style>body{background:#101216}.wrap{max-width:900px;margin:auto;padding:20px}.hero,.card{border:1px solid #2b3444;border-radius:24px;padding:20px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#152a55,#7041e8 55%,#2563eb);color:#fff}.card{background:#191b1f;color:#eee}.word{font-size:38px;font-weight:900}.meaning{font-size:19px;color:#9aa5b5}.example{margin:14px 0;padding:14px;border-radius:16px;background:#202329;line-height:1.8}.options{display:grid;gap:10px}.option{border:2px solid #2b3444;background:#191b1f;color:#eee;border-radius:14px;padding:14px;text-align:right;cursor:pointer;font-weight:900}.option.correct{border-color:#45aa73;background:#effaf3;color:#176b3a}.option.wrong{border-color:#d66b6b;background:#fff2f2;color:#9d2d2d}.btn{border:0;background:#d51b78;color:#fff;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block;margin:4px}.result{text-align:center}.progress{height:8px;background:#2b3444;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#d51b78;width:0}</style></head><body><main class="wrap"><section class="hero"><div>🧠 HM Academy · 5e année</div><h1 id="title">المراجعة الذكية</h1><p>مراجعة مخصصة لهذا الدرس فقط، مع أولوية للكلمات التي تحتاج إلى تثبيت.</p><div class="progress"><i id="bar"></i></div></section><section class="card" id="app">جارٍ تحميل مراجعة الدرس…</section></main><script>(async()=>{const p=new URLSearchParams(location.search),id=p.get('lesson')||'g5-t1-l01',app=document.getElementById('app');let D;try{let r=await fetch('data/lessons/grade-5/lesson-studio-content.json?v=20260819-41',{cache:'no-store'});let x=await r.json();for(let i=0;i<5&&typeof x.content==='string';i++)x=JSON.parse(x.content);D=x.lessons?.[id]}catch(e){}if(!D){app.textContent='تعذر تحميل مراجعة الدرس.';return}document.getElementById('title').textContent='🧠 المراجعة الذكية · '+D.titleFr;const v=(D.vocabulary||[]).filter(x=>x.word&&(x.meaning||x.translation));const pool=v.map(x=>({word:x.word,translation:x.meaning||x.translation,example:x.example||''}));let i=0,score=0,chosen=pool.slice(0,Math.min(8,pool.length));function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}}function render(){document.getElementById('bar').style.width=(i/Math.max(chosen.length,1)*100)+'%';if(i>=chosen.length){app.innerHTML='<div class="result"><h2>🎉 انتهت المراجعة</h2><p>نتيجتك: '+score+' / '+chosen.length+'</p><a class="btn" href="grade-5-lesson-v3.html?id='+encodeURIComponent(id)+'&section=vocabulary">📚 العودة إلى مفردات الدرس</a><a class="btn" href="grade-5.html">← الصف الخامس</a></div>';return}const c=chosen[i],others=pool.filter(x=>x.word!==c.word).slice(0,3),opts=[c,...others].sort(()=>Math.random()-.5);app.innerHTML='<div class="word">'+c.word+' <button class="btn" id="sp">🔊</button></div><div class="meaning">اختر المعنى الصحيح · '+(i+1)+' / '+chosen.length+'</div><div class="example"><b>مثال:</b> '+(c.example||'لا يوجد مثال مسجل.')+' <button class="btn" id="spe">🔊 نطق المثال</button></div><div class="options">'+opts.map(o=>'<button class="option" data-ok="'+(o.word===c.word)+'">'+o.translation+'</button>').join('')+'</div><div id="fb" style="min-height:35px;margin-top:12px;font-weight:900"></div>';document.getElementById('sp').onclick=()=>speak(c.word);document.getElementById('spe').onclick=()=>speak(c.example);app.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(b.dataset.done)return;b.dataset.done='1';const ok=b.dataset.ok==='true';b.classList.add(ok?'correct':'wrong');document.getElementById('fb').textContent=ok?'✅ صحيح':'❌ سنعيد هذه الكلمة في مراجعة لاحقة';if(ok)score++;setTimeout(()=>{i++;render()},650)})}render()})();</script></body></html>
