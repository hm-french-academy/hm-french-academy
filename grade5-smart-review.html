<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | المراجعة الذكية · الصف الخامس</title><link rel="stylesheet" href="css/premium-shell.css"><style>body{background:#101216}.wrap{max-width:900px;margin:auto;padding:20px}.hero,.card{border:1px solid #2b3444;border-radius:24px;padding:20px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#152a55,#7041e8 55%,#2563eb);color:#fff}.card{background:#191b1f;color:#eee}.type{display:inline-block;padding:6px 10px;border-radius:99px;background:#2b3444;font-size:13px;font-weight:900}.prompt{font-size:25px;font-weight:900;line-height:1.7;margin:14px 0}.sub{color:#aeb8c7;line-height:1.8}.options{display:grid;gap:10px}.option{border:2px solid #2b3444;background:#191b1f;color:#eee;border-radius:14px;padding:14px;text-align:right;cursor:pointer;font-weight:900}.option.correct{border-color:#45aa73;background:#effaf3;color:#176b3a}.option.wrong{border-color:#d66b6b;background:#fff2f2;color:#9d2d2d}.btn{border:0;background:#d51b78;color:#fff;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block;margin:4px}.result{text-align:center}.progress{height:8px;background:#2b3444;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#d51b78;width:0}.fr{font-size:30px;font-weight:900}.example{margin:14px 0;padding:14px;border-radius:16px;background:#202329;line-height:1.8}</style></head><body><main class="wrap"><section class="hero"><div>🧠 HM Academy · 5e année</div><h1 id="title">المراجعة الذكية</h1><p>مراجعة متعددة المهارات مرتبطة بالدرس المختار فقط: مفردات، سياق، استماع، قواعد وتطبيق.</p><div class="progress"><i id="bar"></i></div></section><section class="card" id="app">جارٍ تحميل مراجعة الدرس…</section></main><script>(async()=>{const p=new URLSearchParams(location.search),id=p.get('lesson')||'g5-t1-l01',app=document.getElementById('app'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let D;try{let r=await fetch('data/lessons/grade-5/lesson-studio-content.json?v=20260822-smartreview1',{cache:'no-store'}),x=await r.json();for(let n=0;n<8&&typeof x.content==='string';n++)x=JSON.parse(x.content);D=x.lessons?.[id]}catch(e){}if(!D){app.textContent='تعذر تحميل مراجعة هذا الدرس.';return}document.getElementById('title').textContent='🧠 المراجعة الذكية · '+D.titleFr;const v=(D.vocabulary||[]).filter(x=>x.word&&(x.meaning||x.translation)),g=D.grammar||{},examples=(g.examples||[]).filter(x=>x.fr),pool=v.map(x=>({word:x.word,meaning:x.meaning||x.translation,example:x.example||''}));const questions=[];const take=(a,n=3)=>a.slice(0,n);pool.slice(0,5).forEach(c=>{const others=pool.filter(x=>x.word!==c.word).map(x=>x.meaning);questions.push({type:'المفردات · المعنى',q:'اختر المعنى الصحيح لـ «'+c.word+'».',answer:c.meaning,options:[c.meaning,...take(others)],speech:c.word,example:c.example})});pool.slice(0,3).forEach(c=>{const others=pool.filter(x=>x.word!==c.word).map(x=>x.word);questions.push({type:'المفردات · الكلمة',q:'أي كلمة فرنسية تعبّر عن «'+c.meaning+'»؟',answer:c.word,options:[c.word,...take(others)],speech:c.word,example:c.example})});examples.slice(0,3).forEach(c=>{const z=c.parts||String(c.fr).replace(/[.!?]/g,'').split(' ');const subject=z[0],verb=z[1]||z[0],comp=z[2]||z[z.length-1];questions.push({type:'القواعد · تحليل الجملة',q:'في «'+c.fr+'» ما هو الفعل Verbe؟',answer:verb,options:[verb,subject,comp].filter(Boolean),speech:c.fr,example:c.ar||''});questions.push({type:'القواعد · ترتيب الجملة',q:'ما ترتيب أجزاء «'+c.fr+'» في هذا الدرس؟',answer:z.join(' + '),options:[z.join(' + '),z.slice().reverse().join(' + '),[z[1],z[0],z[2]].filter(Boolean).join(' + ')],speech:c.fr,example:'Sujet + Verbe + Complément'});});if(g.miniRule)questions.push({type:'القاعدة · القاعدة الأساسية',q:'اختر القاعدة الأساسية التي تلخّص درس اليوم.',answer:g.miniRule,options:[g.miniRule,...take((g.steps||[]).filter(x=>x!==g.miniRule))],speech:g.miniRule,example:'تذكّر القاعدة ثم طبّقها في مثال جديد.'});if(examples[0])questions.push({type:'التطبيق · اختيار الجملة',q:'أي جملة من الآتي تمثل النموذج الصحيح الذي تدربنا عليه؟',answer:examples[0].fr,options:[examples[0].fr,...examples.slice(1,4).map(x=>x.fr)],speech:examples[0].fr,example:examples[0].ar||''});const seen=new Set(),chosen=questions.filter(q=>{const k=q.type+'|'+q.q+'|'+q.answer;if(seen.has(k))return false;seen.add(k);return true}).slice(0,12);let i=0,score=0;function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}}function render(){document.getElementById('bar').style.width=(i/Math.max(chosen.length,1)*100)+'%';if(i>=chosen.length){document.getElementById('bar').style.width='100%';app.innerHTML='<div class="result"><h2>🎉 انتهت المراجعة الذكية</h2><p>نتيجتك: '+score+' / '+chosen.length+'</p><p class="sub">تمت مراجعة أكثر من مهارة، وليس المعنى فقط.</p><a class="btn" href="grade-5-lesson-v3.html?id='+encodeURIComponent(id)+'&section=vocabulary">📚 العودة إلى الدرس</a><a class="btn" href="grade-5.html">← الصف الخامس</a></div>';return}const c=chosen[i],others=chosen.filter((x,j)=>j!==i&&x.answer!==c.answer).slice(0,3),opts=[c,...others].sort(()=>Math.random()-.5);app.innerHTML='<span class="type">'+esc(c.type)+'</span><div class="prompt">'+esc(c.q)+'</div>'+(c.speech?'<div class="fr">'+esc(c.speech)+' <button class="btn" id="sp">🔊 استمع</button></div>':'')+(c.example?'<div class="example"><b>تذكّر:</b> '+esc(c.example)+'</div>':'')+'<div class="sub">سؤال '+(i+1)+' من '+chosen.length+'</div><div class="options">'+opts.map(o=>'<button class="option" data-ok="'+(o.answer===c.answer)+'">'+esc(o.answer)+'</button>').join('')+'</div><div id="fb" style="min-height:35px;margin-top:12px;font-weight:900"></div>';if(document.getElementById('sp'))document.getElementById('sp').onclick=()=>speak(c.speech);app.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(b.dataset.done)return;b.dataset.done='1';const ok=b.dataset.ok==='true';b.classList.add(ok?'correct':'wrong');document.getElementById('fb').textContent=ok?'✅ صحيح':'❌ الإجابة الصحيحة: '+c.answer;if(ok)score++;setTimeout(()=>{i++;render()},750)})}if(!chosen.length){app.textContent='لا توجد أسئلة كافية لهذا الدرس بعد.';return}render()})()</script></body></html>
