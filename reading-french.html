<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | القراءة بالفرنسية</title><link rel="stylesheet" href="css/premium-shell.css"><link rel="stylesheet" href="css/hm-fonts.css"><style>main{max-width:1100px;margin:auto;padding:28px 16px}.hero,.unit{background:#fff;border:1px solid #e3e8f0;border-radius:20px;padding:22px;margin-bottom:16px}.unit h2{margin-top:0}.lesson{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid #edf0f5}.go{display:inline-block;background:#0d47a1;color:#fff;text-decoration:none;padding:8px 14px;border-radius:10px;font-weight:700}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="index.html">الرئيسية</a><a href="language-courses.html">الكورسات</a></nav></header><main><section class="hero"><div>A1 → A2 · HM Academy</div><h1>📖 تعلّم القراءة بالفرنسية</h1><p>من الحرف والصوت إلى قراءة الكلمات والجمل والنصوص تدريجيًا، مع قواعد فكّ الترميز والطلاقة.</p><p><strong>الحالة:</strong> مُعد للمراجعة الأكاديمية</p></section><div id="units">جاري تحميل وحدات الكورس...</div></main><script>(async()=>{const el=document.getElementById('units');try{const r=await fetch('data/specialized/reading-french-course.json?v=20260819',{cache:'no-store'});const d=await r.json();el.innerHTML=d.units.map(u=>'<section class="unit"><h2>'+u.title.ar+'</h2>'+u.lessons.map(l=>'<div class="lesson"><div><strong>'+l.title.ar+'</strong><div>'+u.level+' · '+l.id+'</div></div><a class="go" href="reading-french-lesson.html?unit='+encodeURIComponent(u.id)+'&lesson='+encodeURIComponent(l.id)+'">فتح الدرس</a></div>').join('')+'</section>').join('')}catch(e){el.textContent='تعذر تحميل الكورس.'}})();</script></body></html>
