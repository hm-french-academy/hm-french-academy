<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | اختبار الوحدة</title><link rel="stylesheet" href="css/premium-shell.css"><style>body{background:#f5f7fb}.wrap{max-width:900px;margin:auto;padding:28px 16px 60px}.hero{background:linear-gradient(135deg,#173a82,#2563eb);color:#fff;border-radius:28px;padding:28px}.q{background:#fff;border:1px solid #e1e7f0;border-radius:20px;padding:20px;margin:15px 0}.opt{display:block;width:100%;text-align:right;border:1px solid #dce3ee;background:#fff;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}.opt:hover{border-color:#2563eb}.btn{border:0;background:#14b8a6;color:#fff;padding:13px 18px;border-radius:13px;font-weight:900;cursor:pointer}.result{margin-top:15px;font-weight:900}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="index.html">الرئيسية</a><a href="academy-map.html">خريطة المنصة</a><a href="course.html">المناهج</a><a href="dashboard.html">الطالب</a></nav></header><main class="wrap"><section class="hero"><h1>🏆 اختبار الوحدة</h1><p id="intro">اختبر ما تعلمته في الوحدة. الأسئلة هنا مرتبطة بمحتوى الوحدة نفسها.</p></section><form id="quiz"></form><button class="btn" id="submit">تحقق من الإجابات</button><div class="result" id="result"></div></main><script>const qs=new URLSearchParams(location.search),unit=qs.get('unit')||'unit-1';const bank={"unit-1":[['أي كلمة تعني المدرسة؟',['école','maison','livre'],'école'],['أي تعبير يعني يوجد؟',['Il y a','Je suis','J’aime'],'Il y a'],['أي كلمة تعني المكتبة؟',['bibliothèque','trousse','chaise'],'bibliothèque'],['ما عكس Il y a؟',['Il n’y a pas','Bonjour','Merci'],'Il n’y a pas']],"unit-2":[['أي كلمة تعني المنزل؟',['maison','école','gare'],'maison'],['أي كلمة تعني غرفة؟',['chambre','livre','sac'],'chambre'],['اختر الكلمة المرتبطة بالمطبخ.',['cuisine','classe','gare'],'cuisine'],['ما الذي نستخدمه لوصف مكان؟',['Il y a','Je m’appelle','J’aime'],'Il y a']],"unit-3":[['أي كلمة تعني القطار؟',['train','maison','classe'],'train'],['أي كلمة ترتبط بالسفر؟',['voyage','trousse','tableau'],'voyage'],['أي كلمة تعني حقيبة سفر؟',['valise','chaise','école'],'valise'],['اختر وسيلة نقل.',['train','livre','crayon'],'train']]};const bankQ=bank[unit]||bank['unit-1'];document.getElementById('quiz').innerHTML=bankQ.map((q,i)=>`<section class="q"><h3>${i+1}. ${q[0]}</h3>${q[1].map(o=>`<label class="opt"><input type="radio" name="q${i}" value="${o}"> ${o}</label>`).join('')}</section>`).join('');document.getElementById('submit').onclick=e=>{e.preventDefault();let score=0;bankQ.forEach((q,i)=>{const a=document.querySelector(`input[name=q${i}]:checked`);if(a&&a.value===q[2])score++});const pct=Math.round(score/bankQ.length*100);document.getElementById('result').textContent=`نتيجتك: ${score}/${bankQ.length} — ${pct}%`;if(pct>=75)localStorage.setItem('hmUnitAssessment_'+unit,'passed');};</script></body></html>
