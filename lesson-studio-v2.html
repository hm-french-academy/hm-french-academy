<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Leçon</title><link rel="stylesheet" href="css/premium-shell.css?v=20260814"><style>body{margin:0;background:#f3f6fb;color:#17223b;font-family:Arial,Cairo,sans-serif}.w{max-width:1100px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff;border-radius:28px;padding:24px;display:flex;justify-content:space-between;align-items:center}.hero h1{font-size:clamp(28px,6vw,44px);margin:6px 0}.ico{font-size:70px;background:#ffffff22;padding:20px;border-radius:22px}.tabs,.journey{display:flex;gap:7px;overflow:auto;background:#fff;padding:7px;border-radius:16px;margin:12px 0;border:1px solid #e1e7f0}.tabs button,.journey span{border:0;background:#fff;padding:10px 13px;border-radius:11px;font-weight:900;white-space:nowrap}.tabs button.on,.journey span.on{background:#e92d83;color:#fff}.box{background:#fff;border:1px solid #e1e7f0;border-radius:22px;padding:20px}.head{display:flex;gap:12px;align-items:center;border-bottom:1px solid #e1e7f0;padding-bottom:16px;margin-bottom:16px}.head .big{font-size:38px;background:#f8f0f7;padding:10px 14px;border-radius:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid #e1e7f0;border-radius:18px;padding:12px;background:#fff}.art{height:120px;border-radius:15px;background:linear-gradient(145deg,#eef4ff,#fff2f8);display:grid;place-items:center;font-size:60px}.fr{direction:ltr;font-weight:900;margin-top:8px;font-size:18px}.ar{color:#315aa4;font-weight:900;margin:4px 0}.btn{border:0;background:#2563eb;color:#fff;border-radius:11px;padding:10px 13px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.light{background:#edf3ff;color:#2850a3}.pink{background:#e92d83}.ex{margin-top:8px;background:#f8faff;border-right:4px solid #e92d83;padding:8px;border-radius:9px;line-height:1.7}.rule,.dialogue{background:#faf8ff;border:1px solid #e1e7f0;border-radius:18px;padding:18px}.selects{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.selects button{border:1px solid #d9e0ec;background:#fff;border-radius:11px;padding:10px;font-weight:900}.selects .on{background:#e92d83;color:#fff}.formula{direction:ltr;text-align:left;background:#fff;border-radius:13px;padding:13px;font-weight:900;line-height:2}.rows{display:grid;gap:8px}.row{background:#fff;border:1px solid #e1e7f0;border-radius:12px;padding:11px;display:flex;justify-content:space-between;gap:10px}.speak{width:40px;height:40px;border:0;border-radius:50%;background:#e92d83;color:#fff}.note{margin-top:12px;color:#68758b;line-height:1.8;background:#f7f9fd;padding:12px;border-radius:12px}.media{background:#faf8ff;border:1px solid #e1e7f0;border-radius:18px;padding:16px;margin-top:12px}.video{aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#14264a}.video iframe{width:100%;height:100%;border:0}@media(max-width:700px){.hero{display:block}.ico{margin-top:12px;text-align:center}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}.w{padding:9px}}</style><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="index.html">الرئيسية</a><a href="dashboard.html">الطالب</a><a href="course.html">المناهج الدراسية</a><a href="library.html">المكتبة</a><a href="settings.html">الإعدادات</a></nav></header><main class="w"><section class="hero"><div><small id="unit"></small><h1 id="title"></h1><p id="sub"></p></div><div class="ico">🏫</div></section><div class="journey" id="journey"></div><nav class="tabs" id="tabs"></nav><section class="box" id="view"></section><div class="note">محتوى الدرس يُقرأ من ملفه الخاص، لذلك لا تُستخدم مفردات أو مواد من درس آخر.</div></main><script>const id=new URLSearchParams(location.search).get("id")||"grade8-u1-l1",wanted=new URLSearchParams(location.search).get("section")||"lesson";let lesson,data,rule=0;const V=document.getElementById("view"),icons={lesson:"📘",vocab:"🧠",pronunciation:"🎧",grammar:"📖",conversation:"💬",practice:"✍️",games:"🎮",assessment:"📝",files:"🗂️"},labels={lesson:"الدرس",vocab:"المفردات",pronunciation:"النطق",grammar:"القواعد",conversation:"المحادثة",practice:"التدريب",games:"الألعاب",assessment:"التقييم",files:"ملفات الدرس"};function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":'&#39;'}[c]))}function say(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.86;speechSynthesis.speak(u)}function head(v,t,d){return `<div class="head"><div class="big">${icons[v]}</div><div><h2>${t}</h2><p>${d}</p></div></div>`}function vocab(){let a=data.vocabulary||[];return head("vocab","مفردات الدرس","صورة + معنى + كلمة + مثال + نطق، وكلها من موضوع الدرس.")+`<div class="grid">${a.map(x=>`<article class="card"><div class="art" onclick='say(${JSON.stringify(x.fr)})'>${x.icon}</div><div class="fr">${esc(x.fr)}</div><div class="ar">${esc(x.ar)}</div><button class="speak" onclick='say(${JSON.stringify(x.fr)})'>🔊</button><div class="ex"><b>${esc(x.example)}</b><button class="btn light" onclick='say(${JSON.stringify(x.example)})'>🔊 المثال</button></div></article>`).join("")}</div>`}function pronunciation(){return head("pronunciation","معمل النطق","استمع للكلمة ثم للمثال.")+`<div class="grid">${(data.vocabulary||[]).slice(0,12).map(x=>`<article class="card"><div class="art">${x.icon}</div><div class="fr">${esc(x.fr)}</div><button class="btn" onclick='say(${JSON.stringify(x.fr)})'>🔊 الكلمة</button><button class="btn light" onclick='say(${JSON.stringify(x.example)})'>▶ المثال</button></article>`).join("")}</div>`}function grammar(){let a=data.grammar||[],r=a[rule]||a[0];return head("grammar","قواعد الدرس","اختر القاعدة المناسبة ثم استمع إلى شرحها وأمثلتها.")+`<div class="selects">${a.map((x,i)=>`<button class="${i===rule?"on":""}" onclick="rule=${i};open('grammar')">${esc(x.title)}</button>`).join("")}</div><article class="rule"><h3>${esc(r.arTitle)}</h3><p>${esc(r.explanation)}</p><div class="formula">${esc(r.formula)}</div><div class="rows">${r.examples.map(x=>`<div class="row"><div><b>${esc(x.fr)}</b><div class="ar">${esc(x.ar)}</div></div><button class="speak" onclick='say(${JSON.stringify(x.fr)})'>🔊</button></div>`).join("")}</div><button class="btn pink" onclick='say(${JSON.stringify(r.explanation+" "+r.formula+" "+r.examples.map(x=>x.fr).join(". "))})'>🎧 استمع إلى القاعدة</button></article>`}function conversation(){let d=data.dialogue;return head("conversation",d.title+" · "+d.arTitle,d.context)+`<button class="btn pink" onclick='say(${JSON.stringify(d.lines.map(x=>x.fr).join(". "))})'>▶ المحادثة كاملة</button><div class="rows">${d.lines.map(x=>`<div class="row"><div><b>${esc(x.speaker)} · ${esc(x.fr)}</b><div class="ar">${esc(x.ar)}</div></div><button class="speak" onclick='say(${JSON.stringify(x.fr)})'>🔊</button></div>`).join("")}</div>`}function practice(){return head("practice","تدرّب بنفسك","حل أولًا، ثم شاهد التغذية الراجعة.")+`<div class="grid"><article class="card"><h3>التفضيل</h3><p>أي جملة تعني «أنا أفضل المكتبة»؟</p><button class="btn light" onclick="this.parentNode.querySelector('.fb').textContent='✓ صحيح'">Je préfère la bibliothèque.</button><button class="btn light" onclick="this.parentNode.querySelector('.fb').textContent='✗ حاول مرة أخرى'">Il y a une bibliothèque.</button><p class="fb"></p></article><article class="card"><h3>الوجود</h3><p>______ une cantine dans l'école.</p><button class="btn light" onclick="this.parentNode.querySelector('.fb').textContent='✓ صحيح'">Il y a</button><button class="btn light" onclick="this.parentNode.querySelector('.fb').textContent='✗ حاول مرة أخرى'">Je préfère</button><p class="fb"></p></article><article class="card"><h3>المفردات</h3><p>اختر كلمة «مكتبة».</p><button class="btn light" onclick="this.parentNode.querySelector('.fb').textContent='✓ صحيح'">Une bibliothèque</button><button class="btn light" onclick="this.parentNode.querySelector('.fb').textContent='✗ حاول مرة أخرى'">Un gymnase</button><p class="fb"></p></article></div>`}function games(){let b="data/lessons/grade-8/unit-1/",a=data.activities||[],m={"memory-game":["🧩","Memory Game"],"drag-drop":["🎯","Drag & Drop"],"pronunciation":["🎤","Pronunciation Challenge"],"vocabulary":["🖼️","Vocabulary Challenge"],"word-catch":["🎯","Word Catch"],"quiz-express":["⚡","Quiz express"]};return head("games","الألعاب التعليمية","كل لعبة لها أيقونة ووظيفة مختلفة.")+`<div class="grid">${a.map(x=>`<article class="card"><div class="art">${m[x.id]?.[0]||"🎮"}</div><h3>${m[x.id]?.[1]||x.id}</h3><a class="btn" href="${b+x.file}">ابدأ النشاط ↗</a></article>`).join("")}</div>`}function assessment(){return head("assessment","التقييم","التقييم الرسمي مستقل عن الألعاب.")+`<a class="btn pink" target="_blank" href="${lesson.assessment||lesson.quiz}">فتح التقييم ↗</a>`}function files(){let b="data/lessons/grade-8/unit-1/",a=[["📘","الشرح التفاعلي",lesson.sourceInteractive||lesson.interactive],["📄","المرجع التعليمي",lesson.reference],["📝","التقييم الرسمي",lesson.assessment],["🎯","الاختبار الإلكتروني",lesson.quiz],["🎮","الألعاب التعليمية",lesson.games],["💬","محادثة الدرس",b+data.files.conversation]];return head("files","ملفات الدرس","موارد الدرس الفعلية فقط، منظمة حسب الوظيفة.")+`<div class="grid">${a.filter(x=>x[2]).map(x=>`<article class="card"><div class="art">${x[0]}</div><h3>${x[1]}</h3><a class="btn" target="_blank" href="${x[2]}">فتح الملف ↗</a></article>`).join("")}</div>`}function lessonView(){return head("lesson","رحلة الدرس","الصورة والمعنى → النطق → القاعدة → المحادثة → التدريب → الألعاب → التقييم.")+(data.media?.videoUrl?`<div class="media"><h3>🎬 فيديو الدرس</h3><div class="video"><iframe src="${data.media.videoUrl.replace("watch?v=","embed/")}" allowfullscreen></iframe></div></div>`:"")}function open(v){document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.v===v));journey.innerHTML=Object.keys(labels).slice(0,8).map(x=>`<span class="${x===v?"on":""}">${icons[x]}<br>${labels[x]}</span>`).join("");V.innerHTML=v==="vocab"?vocab():v==="pronunciation"?pronunciation():v==="grammar"?grammar():v==="conversation"?conversation():v==="practice"?practice():v==="games"?games():v==="assessment"?assessment():v==="files"?files():lessonView()}document.querySelectorAll(".tab").forEach(x=>x.onclick=()=>open(x.dataset.v));(async()=>{let r=await fetch("data/lessons/grade-8/lesson-registry.json");let reg=await r.json();for(const u of reg.includedUnits||[])for(const l of u.lessons||[])if(l.id===id)lesson={...l,ua:u.titleAr,uf:u.titleFr};let p=id.match(/^grade8-u(\d+)-l(\d+)$/);if(p){let d=await fetch(`data/lessons/grade-8/unit-${p[1]}/lesson-${p[2]}.json`);if(d.ok)data=await d.json()}unit.textContent=lesson.ua;title.textContent=lesson.titleAr;sub.textContent="الصف الثاني الإعدادي · الترم الأول";open(["lesson","vocab","pronunciation","grammar","conversation","practice","games","assessment","files"].includes(wanted)?wanted:"lesson")})()</script></body></html>
