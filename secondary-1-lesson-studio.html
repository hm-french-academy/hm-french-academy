<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HM Academy | Secondary 1 — Leçon 1</title>
<link rel="icon" href="assets/images/hm-academy-favicon.svg?v=2">
<style>
:root{--navy:#111b35;--blue:#3156a6;--gold:#c8a15a;--paper:#f6f3ec;--ink:#17213a;--muted:#657089;--line:#ddd8cc;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,"Cairo",sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:radial-gradient(#8e826d .55px,transparent .55px);background-size:8px 8px}
.shell{max-width:1180px;margin:auto;padding:18px 16px 48px;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0 14px;margin-bottom:24px}
.brand{font-weight:900;letter-spacing:.03em;color:var(--navy);text-decoration:none}.brand span{color:var(--gold)}
.back{color:var(--blue);font-weight:800;text-decoration:none}
.cover{background:var(--navy);color:#fff;border-radius:28px;padding:34px 32px;position:relative;overflow:hidden;box-shadow:0 18px 45px #0c173022}
.cover:after{content:"01";position:absolute;left:-10px;bottom:-35px;font:900 170px/1 Arial;color:#fff08;opacity:.06}
.kicker{font-size:13px;letter-spacing:.13em;text-transform:uppercase;color:#d9c18d;font-weight:900}
.cover h1{font:800 clamp(38px,7vw,76px)/.98 Georgia,serif;margin:12px 0 8px;direction:ltr;text-align:left}
.cover .ar{font-size:21px;color:#e9edf5;font-weight:800}.meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.pill{border:1px solid #ffffff2b;border-radius:999px;padding:8px 12px;font-weight:800;font-size:12px}
.objective{margin-top:20px;background:#ffffff0d;border:1px solid #ffffff16;border-radius:17px;padding:14px 16px;line-height:1.9}
.rail{position:sticky;top:8px;z-index:5;background:#f6f3ecf2;backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:18px;padding:8px;margin:14px 0;display:flex;gap:7px;overflow:auto}
.rail button{border:1px solid transparent;background:transparent;color:var(--muted);padding:10px 13px;border-radius:12px;white-space:nowrap;font-weight:900;cursor:pointer}.rail button.active{background:var(--navy);color:#fff}
.section{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;margin-top:16px;box-shadow:0 9px 28px #17213a0a}
.section-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:18px}
.section-head h2{font:800 31px/1.1 Georgia,serif;margin:0;direction:ltr;text-align:left}.section-head p{margin:4px 0 0;color:var(--muted);line-height:1.7}
.label{font-size:11px;color:var(--gold);font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.grid4{grid-template-columns:repeat(4,1fr)}
.card{border:1px solid var(--line);border-radius:18px;padding:16px;background:linear-gradient(180deg,#fff,#fbfaf6)}.card h3{margin:0 0 8px}.fr{direction:ltr;text-align:left;font-weight:900;font-size:20px}.artext{color:var(--muted);font-weight:700;line-height:1.8}
.cover-card{min-height:150px;display:flex;flex-direction:column;justify-content:space-between}.num{font:900 38px Georgia;color:var(--gold)}
.listen{border:0;background:var(--navy);color:#fff;border-radius:10px;padding:8px 11px;font-weight:900;cursor:pointer}.listen.playing{background:var(--gold);color:var(--navy)}
.dialogue{display:grid;grid-template-columns:100px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.speaker{font-weight:900;color:var(--blue)}
.vocab-tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{border:1px solid #cfd3da;background:#fff;border-radius:999px;padding:8px 11px;font-weight:800;cursor:pointer}.chip:hover{border-color:var(--gold)}
.rule{display:grid;grid-template-columns:1fr 1fr;gap:15px}.rule-main{background:var(--navy);color:#fff;border-radius:18px;padding:22px}.rule-main h3{font:800 29px Georgia;margin:0 0 10px;direction:ltr;text-align:left}.formula{font:900 23px/1.5 Georgia;direction:ltr;text-align:left;color:#ead29b}.example{border:1px solid var(--line);border-radius:16px;padding:15px;margin:9px 0;background:#faf9f5}.example .fr{font-size:19px}
.exercise{border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0}.opts{display:grid;gap:7px;margin-top:10px}.opt{border:1px solid #d6d9df;background:#fff;border-radius:11px;padding:11px;text-align:right;font-weight:800;cursor:pointer}.opt.correct{background:#edf8f1;border-color:#51a56f}.opt.wrong{background:#fff0f0;border-color:#d26a6a}
.scene{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;align-items:stretch}.identity{background:linear-gradient(145deg,#101a34,#283e72);color:#fff;border-radius:22px;padding:24px;min-height:280px}.identity .name{font:800 44px Georgia;direction:ltr;text-align:left}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.field{border:1px solid #ffffff24;border-radius:12px;padding:10px}.field small{color:#cdd5e5}.field b{display:block;margin-top:3px;direction:ltr;text-align:left}.reading{border:1px solid var(--line);border-radius:22px;padding:22px;background:#fffdf8}.reading-text{font:700 22px/2.1 Georgia;direction:ltr;text-align:left}.reading-qs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.numbers{display:flex;flex-wrap:wrap;gap:7px}.number{min-width:42px;text-align:center;border:1px solid var(--line);padding:9px;border-radius:10px;font-weight:900;direction:ltr;background:#fff}
.color-dot{display:inline-flex;align-items:center;gap:7px}.dot{width:18px;height:18px;border-radius:50%;border:1px solid #aaa;display:inline-block}
.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.step{border-top:3px solid var(--gold);padding-top:10px}.step b{display:block}
.footer-note{text-align:center;color:var(--muted);margin-top:28px;font-size:12px}
.progress{height:8px;background:#e8e4db;border-radius:99px;overflow:hidden;margin-top:10px}.bar{height:100%;width:0;background:var(--gold);transition:.3s}
@media(max-width:850px){.grid,.grid4{grid-template-columns:repeat(2,1fr)}.scene,.rule{grid-template-columns:1fr}.timeline{grid-template-columns:1fr 1fr}.dialogue{grid-template-columns:75px 1fr}.dialogue .listen{grid-column:2;justify-self:start}}
@media(max-width:560px){.shell{padding:10px}.cover{padding:24px 18px;border-radius:20px}.section{padding:17px;border-radius:18px}.grid,.grid4,.reading-qs{grid-template-columns:1fr}.cover h1{font-size:46px}.section-head{display:block}.section-head h2{margin-top:6px}.fields{grid-template-columns:1fr}.rail{top:0}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><a class="brand" href="index.html">HM <span>ACADEMY</span></a><a class="back" href="baccalaureat-1.html">خريطة الصف ←</a></header>
<section class="cover">
<div class="kicker">SECONDARY 1 · SEMESTER 1 · UNITÉ 1</div>
<h1 id="titleFr">Les retrouvailles &amp; se présenter</h1>
<div class="ar" id="titleAr">اللقاء والتعارف وتقديم النفس</div>
<div class="meta"><span class="pill">Leçon 1 · Se présenter</span><span class="pill">Bravo 2027 · المرجع الأساسي</span><span class="pill">Club @dos Plus 1 · pp.15–19</span></div>
<div class="objective" id="objective"></div>
</section>
<nav class="rail" id="rail"></nav>
<main id="app"></main>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="footer-note">HM Academy · Secondary 1 · تجربة تعلم مستقلة عن تصميم الابتدائي والإعدادي</div>
</div>
<script>
const id=new URLSearchParams(location.search).get('id')||'s1-u1-01';
const sec=new URLSearchParams(location.search).get('section')||'intro';
const file='data/lessons/secondary-1/semester-1/'+id+'.json';
let d={}, done=JSON.parse(localStorage.getItem('hm-s1-pro-'+id)||'{}');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function speak(t,b){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;if(b){b.classList.add('playing');u.onend=()=>b.classList.remove('playing');u.onerror=()=>b.classList.remove('playing')}speechSynthesis.speak(u)}
function listen(t){return '<button class="listen" onclick=\'speak('+JSON.stringify(t)+',this)\'>🔊 écouter</button>'}
const sections=[['intro','01','Ouverture'],['document','02','Document'],['vocab','03','Vocabulaire'],['pronunciation','04','Prononciation'],['grammar','05','Grammaire'],['conversation','06','Conversation'],['practice','07','Entraînement'],['games','08','Ateliers'],['assessment','09','Évaluation']];
function nav(){document.getElementById('rail').innerHTML=sections.map(x=>'<button class="'+(sec===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+' · '+x[2]+(done[x[0]]?' ✓':'')+'</button>').join('')}
function go(s){location.href='?id='+encodeURIComponent(id)+'&section='+s}
function complete(s){done[s]=true;localStorage.setItem('hm-s1-pro-'+id,JSON.stringify(done));nav();progress()}
function progress(){const n=sections.filter(x=>done[x[0]]).length;document.getElementById('bar').style.width=Math.round(n/sections.length*100)+'%'}
function head(label,title,sub){return '<div class="section-head"><div><div class="label">'+label+'</div><h2>'+title+'</h2><p>'+sub+'</p></div></div>'}
function intro(){
const comm=d.communication||[];
return '<section class="section">'+head('LEÇON 1','Se présenter','من هنا يبدأ الدرس: موقف، نص، لغة، ثم إنتاج — وليس مجرد بطاقات منفصلة.')
+'<div class="scene"><div class="identity"><div class="label">La mission</div><div class="name">Je me présente.</div><p>تعلم كيف تبدأ لقاءً، تسأل عن الاسم والعمر والمدينة، تقدم شخصًا آخر، ثم تنهي الحوار بشكل طبيعي.</p><div class="fields"><div class="field"><small>OBJECTIF</small><b>Communiquer</b></div><div class="field"><small>NIVEAU</small><b>1ère secondaire</b></div><div class="field"><small>SOURCE</small><b>Bravo 2027</b></div><div class="field"><small>UNITÉ</small><b>Unité 1</b></div></div></div><div class="card"><div class="label">Ce que tu vas savoir faire</div><h3>À la fin de la leçon…</h3><div class="timeline">'+comm.slice(0,10).map((x,i)=>'<div class="step"><b>'+esc(x)+'</b><span class="artext">تطبيق عملي داخل موقف تعارف.</span></div>').join('')+'</div></div></div><button class="listen" style="margin-top:18px" onclick="complete(\'intro\');go(\'document\')">ابدأ رحلة الدرس ←</button></section>'
}
function documentSection(){
const r=d.reading||{};const q=r.questions||[];
return '<section class="section">'+head('DOCUMENT AUTHENTIQUE','Les retrouvailles','النص في قلب الدرس؛ اقرأ، استمع، ثم استخرج المعلومات قبل الانتقال للقواعد.')
+'<div class="reading"><div class="label">Lecture</div><div class="reading-text">'+esc(r.text||'')+'</div><div style="margin-top:14px">'+listen(r.text||'')+'</div></div><div class="reading-qs" style="margin-top:14px">'+q.map((x,i)=>'<div class="exercise"><b>'+String(i+1).padStart(2,'0')+' · '+esc(x)+'</b><textarea style="width:100%;min-height:70px;margin-top:9px;border:1px solid #d8d6ce;border-radius:10px;padding:9px"></textarea></div>').join('')+'</div><button class="listen" style="margin-top:12px" onclick="complete(\'document\')">✓ أكملت فهم الوثيقة</button></section>'
}
function vocab(){
const groups={};(d.vocabulary||[]).forEach(x=>(groups[x.category]??=[]).push(x));
let html='<section class="section">'+head('VOCABULAIRE','Le lexique de la rencontre','المفردات كاملة، مصنفة كما يحتاجها طالب الثانوي: أسماء، أفعال، صفات وتعبيرات.');
Object.entries(groups).forEach(([g,a])=>{html+='<h3 style="margin-top:22px">'+esc(g)+'</h3><div class="grid">'+a.map(x=>'<article class="card"><div class="fr">'+esc(x.word)+'</div><div class="artext">'+esc(x.translation)+'</div><div class="vocab-tools">'+listen(x.word) +(x.example?'<span class="chip">'+esc(x.example)+'</span>':'')+'</div></article>').join('')+'</div>'});
html+='<div class="card" style="margin-top:18px"><h3>🎨 Les couleurs</h3><div class="vocab-tools">'+(d.colors||[]).map(x=>'<button class="chip" onclick=\'speak('+JSON.stringify(x)+',this)\'>'+esc(x)+'</button>').join('')+'</div></div>';
html+='<div class="card" style="margin-top:14px"><h3>🔢 Les nombres · 0 → 50</h3><div class="numbers">'+((d.numbers||{}).core||[]).map(x=>'<button class="number" onclick=\'speak('+JSON.stringify(x)+',this)\'>'+esc(x)+'</button>').join('')+'</div></div><button class="listen" style="margin-top:18px" onclick="complete(\'vocab\')">✓ إتمام المفردات</button></section>';return html
}
function pronunciation(){
const a=d.phonetics||[];
return '<section class="section">'+head('PRONONCIATION','Atelier de prononciation','النطق مرتبط مباشرة بمحتوى الدرس: صوت r، التهجئة، والتنغيم.')+
'<div class="grid">'+a.map((x,i)=>'<article class="card cover-card"><div><div class="num">0'+(i+1)+'</div><h3>'+esc(x.focus||'')+'</h3><p class="artext">'+esc(x.ar||'')+'</p><div class="vocab-tools">'+(x.examples||[]).map(e=>'<button class="chip" onclick=\\'speak('+JSON.stringify(e)+',this)\\'>'+esc(e)+'</button>').join('')+'</div></div>'+listen((x.examples||[]).join('. '))+'</article>').join('')+'</div>'+
'<div class="card" style="margin-top:16px"><h3>🔤 Épelle ton prénom</h3><p class="artext">اكتب اسمك بالفرنسية، ثم انطقه حرفًا حرفًا. الهدف هو الربط بين صوت الحرف والاسم، لا حفظ قائمة حروف فقط.</p><input class="chip" style="width:100%;border-radius:10px" placeholder="Ex. Hatem"></div>'+
'<button class="listen" style="margin-top:15px" onclick="complete(\\'pronunciation\\')">✓ إتمام النطق</button></section>'
}function grammar(){
const g=d.grammar||{};return '<section class="section">'+head('GRAMMAIRE','s’appeler · être · avoir','ثلاثة أفعال أساسية، لكن استخدامها مختلف — افهم الوظيفة قبل الحفظ.')
+'<div class="rule"><div class="rule-main"><div class="label">La règle</div><h3>s’appeler · être · avoir</h3><div class="formula">Je m’appelle…<br>Je suis…<br>J’ai … ans.</div><p>'+esc(g.explanationAr||'')+'</p></div><div>'+((g.examples||[]).map(x=>'<div class="example"><div class="fr">'+esc(x.fr)+'</div><div class="artext">'+esc(x.ar)+'</div>'+listen(x.fr)+'</div>').join(''))+'</div></div><div class="grid" style="margin-top:15px">'+((g.microDrills||[]).map(x=>'<div class="exercise"><b>'+esc(x.prompt)+'</b><input style="width:100%;margin-top:10px;padding:10px;border:1px solid #ddd;border-radius:9px" placeholder="Réponse"></div>').join(''))+'</div><button class="listen" style="margin-top:15px" onclick="complete(\'grammar\')">✓ إتمام القواعد</button></section>'
}
function conversation(){
const c=d.conversation||{};return '<section class="section">'+head('CONVERSATION','Théo arrive — Se présenter','الحوار كاملًا، مع المتحدث والسياق والترجمة والاستماع لكل جملة.')
+'<div>'+((c.lines||[]).map((x,i)=>'<div class="dialogue"><div class="speaker">'+esc(x.speaker)+'</div><div><div class="fr">'+esc(x.fr)+'</div><div class="artext">'+esc(x.ar)+'</div></div>'+listen(x.fr)+'</div>').join(''))+'</div><div class="card" style="margin-top:16px"><b>🎤 Mission orale</b><p class="artext">قدّم زميلًا في 8–10 جمل: الاسم، العمر، المدينة، الاهتمامات، ثم اختم الحوار.</p></div><button class="listen" style="margin-top:15px" onclick="complete(\'conversation\')">✓ إتمام المحادثة</button></section>'
}
function practice(){
const a=d.practice||[];return '<section class="section">'+head('ENTRAÎNEMENT','Entraînement intensif','تدريب متعدد الاختيارات مبني على أهداف الدرس، وليس تكرارًا للمعلومة فقط.')
+a.map((q,i)=>'<div class="exercise"><b>'+String(i+1).padStart(2,'0')+' · '+esc(q.question)+'</b><div class="opts">'+(q.options||[]).map((o,j)=>'<button class="opt" onclick="ans(this,'+j+','+q.answer+')">'+esc(o)+'</button>').join('')+'</div><div class="artext result"></div></div>').join('')
+'<button class="listen" style="margin-top:15px" onclick="complete(\'practice\')">✓ إنهاء التدريب</button></section>'
}
function ans(b,j,a){const box=b.parentElement.parentElement;box.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add(j===a?'correct':'wrong');box.querySelector('.result').textContent=j===a?'✓ صحيح — أحسنت.':'✕ غير صحيح — راجع الفكرة ثم حاول في السؤال التالي.'}
function games(){
const acts=d.visualActivities||[];return '<section class="section">'+head('ATELIERS','Laboratoire de langue','أنشطة ثانوية حقيقية: بطاقة شخصية، فرز تحية/وداع، سباق أعداد، تهجئة، وبناء حوار.')
+'<div class="grid">'+acts.map((x,i)=>'<article class="card cover-card"><div><div class="num">0'+(i+1)+'</div><h3>'+esc(x.title)+'</h3><p class="artext">'+esc(x.instructionAr)+'</p></div><button class="listen" onclick="speak('+JSON.stringify(x.title)+',this)">🔊 ابدأ</button></article>').join('')+'</div><div class="card" style="margin-top:16px"><h3>🪪 Ma carte d’identité</h3><div class="grid"><input class="chip" placeholder="Prénom"><input class="chip" placeholder="Âge"><input class="chip" placeholder="Ville"><input class="chip" placeholder="Couleur préférée"></div></div><button class="listen" style="margin-top:15px" onclick="complete(\'games\')">✓ إتمام الورش</button></section>'
}
function assessment(){
const a=(d.assessment||{}).questions||[];return '<section class="section">'+head('ÉVALUATION','Bilan de la leçon','التقييم النهائي يجمع الفهم، اللغة، الأعداد، التهجئة والإنتاج.')
+a.map((q,i)=>'<div class="exercise"><b>'+String(i+1).padStart(2,'0')+' · '+esc(q.question)+'</b>'+(q.options?'<div class="opts">'+q.options.map((o,j)=>'<button class="opt" onclick="ans(this,'+j+','+q.answer+')">'+esc(o)+'</button>').join('')+'</div>':'<textarea style="width:100%;min-height:90px;margin-top:10px;border:1px solid #d8d6ce;border-radius:10px;padding:10px"></textarea>')+'</div>').join('')
+'<button class="listen" style="margin-top:15px" onclick="complete(\'assessment\')">✓ إنهاء التقييم</button></section>'
}
function render(){
document.getElementById('titleFr').textContent=d.title||'Les retrouvailles & se présenter';document.getElementById('titleAr').textContent=d.titleAr||'';document.getElementById('objective').textContent=d.objectiveAr||'';nav();progress();
let out=sec==='intro'?intro():sec==='document'?documentSection():sec==='vocab'?vocab():sec==='pronunciation'?pronunciation():sec==='grammar'?grammar():sec==='conversation'?conversation():sec==='practice'?practice():sec==='games'?games():assessment();document.getElementById('app').innerHTML=out
}
fetch(file).then(r=>r.json()).then(x=>{d=x;render()}).catch(()=>document.getElementById('app').innerHTML='<section class="section"><h2>تعذر تحميل الدرس</h2><p>تحقق من ملف الدرس.</p></section>');
</script>
</body></html>
