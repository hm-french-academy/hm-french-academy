<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Secondary 1 Learning Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f9;color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:1160px;margin:auto;padding:10px}.head,.hero,.panel,.complete{border-radius:24px;padding:18px;margin-bottom:12px}.head{background:#0f1b33;color:#fff;display:flex;justify-content:space-between}.head a{color:#fff;text-decoration:none;font-weight:900}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff}.hero h1{font-size:clamp(27px,6vw,43px);margin:8px 0}.journey,.tabs{display:flex;gap:7px;overflow:auto;margin-top:12px}.journey span,.tabs button{border:0;border-radius:999px;padding:9px 12px;white-space:nowrap;font-weight:900}.journey span{background:#ffffff20}.tabs button{background:#fff;color:#173a82;cursor:pointer}.tabs button.active{background:#173a82;color:#fff}.panel,.complete{background:#fff;box-shadow:0 8px 25px #14264a12}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}.card,.activity,.q{border:1px solid #dfe6f0;border-radius:19px;padding:15px;background:linear-gradient(180deg,#fff,#f8faff)}.visual{font-size:48px;text-align:center;padding:8px}.fr{direction:ltr;text-align:center;font-size:20px;font-weight:900}.ar{text-align:center;color:#315a8f;font-weight:800;line-height:1.7}.ex{background:#f3f7fc;border-radius:13px;padding:10px;margin-top:8px;direction:ltr;text-align:center}.btn{border:0;border-radius:11px;padding:10px 13px;margin-top:9px;font-weight:900;cursor:pointer;background:#2563eb;color:#fff}.muted{color:#66738a;line-height:1.8}.progress{height:10px;background:#e8edf5;border-radius:99px;overflow:hidden;margin-top:12px}.bar{height:100%;background:#2563eb;width:0;transition:.25s}.status,.badge{display:inline-block;border-radius:999px;padding:7px 11px;font-weight:900}.status{margin-top:9px;background:#ffffff22}.badge{background:#e8f7f5;color:#087f76;font-size:12px}.q{margin:12px 0}.opt{display:block;width:100%;text-align:right;background:#f7f9fd;border:1px solid #dce3ee;border-radius:11px;padding:11px;margin:7px 0;font-weight:800;cursor:pointer}.correct{background:#ecfdf3!important;border-color:#20a45a!important}.wrong{background:#fff2f8!important;border-color:#e92d83!important}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #cfd9e8;background:#fff;border-radius:999px;padding:9px 12px;font-weight:800;cursor:pointer}.chip.selected{background:#eaf1ff;border-color:#2563eb}.memory{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:9px}.memory button{min-height:90px;border:0;border-radius:17px;background:#edf3ff;color:#173a82;font-size:16px;font-weight:900;cursor:pointer}.dropzone{border:2px dashed #b8c9df;border-radius:17px;padding:18px;text-align:center;margin-top:10px}.dropzone .chip{margin:4px}.next{display:flex;gap:8px;flex-wrap:wrap}.next a{background:#edf3ff;color:#173a82;text-decoration:none;padding:10px 13px;border-radius:11px;font-weight:900}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.card{padding:11px}.head{border-radius:14px}}</style></head><body><div class="wrap"><header class="head"><a href="index.html">🇫🇷 HM Academy</a><a href="baccalaureat-1.html">خريطة الصف</a></header><section class="hero"><span class="badge">الترم الأول 2026/2027 · المحتوى الأساسي + الإثراء والتدريب</span><h1 id="title">Learning Studio</h1><p id="subtitle"></p><div class="journey"><span>🚀 البداية</span><span>🖼️ المفردات</span><span>🎧 النطق</span><span>📘 القواعد</span><span>💬 المحادثة</span><span>✍️ التدريب</span><span>🎮 الألعاب</span><span>🧠 Smart Review</span><span>🏆 التقييم</span><span>📈 التقدم</span></div><div class="progress"><div class="bar" id="bar"></div></div><div id="status" class="status"></div></section><div class="tabs" id="tabs"></div><main class="panel" id="panel"></main><section class="complete"><b>🏁 تقدم الدرس</b><div class="muted" id="progressText"></div></section></div><script>const p=new URLSearchParams(location.search),id=p.get('id')||'s1-u1-01',sec=p.get('section')||'intro';const files={"s1-u1-01":"data/lessons/secondary-1/semester-1/s1-u1-01.json","s1-u1-02":"data/lessons/secondary-1/semester-1/s1-u1-02.json","s1-u1-03":"data/lessons/secondary-1/semester-1/s1-u1-03.json","s1-u1-04":"data/lessons/secondary-1/semester-1/s1-u1-04.json","s1-u2-01":"data/lessons/secondary-1/semester-1/s1-u2-01.json","s1-u2-02":"data/lessons/secondary-1/semester-1/s1-u2-02.json","s1-u2-03":"data/lessons/secondary-1/semester-1/s1-u2-03.json","s1-u2-04":"data/lessons/secondary-1/semester-1/s1-u2-04.json"};let d={};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key='hm-s1-progress-'+id;let done=JSON.parse(localStorage.getItem(key)||'{}');function save(s){done[s]=true;localStorage.setItem(key,JSON.stringify(done));renderProgress();tabs()}function renderProgress(){let st=['intro','vocab','pronunciation','grammar','conversation','practice','games','assessment'],n=st.filter(x=>done[x]).length,pc=Math.round(n/st.length*100);bar.style.width=pc+'%';status.textContent=pc===100?'🏆 مكتمل':`التقدم ${pc}%`;progressText.textContent=`تم إنجاز ${n} من ${st.length} مراحل في هذا الدرس.`}function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.8;speechSynthesis.speak(u)}function tabs(){let a=[['intro','🚀 البداية'],['vocab','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['games','🎮 الألعاب'],['assessment','🏆 التقييم']];tabsEl.innerHTML=a.map(x=>`<button class="${sec==x[0]?'active':''}" onclick="location.href='?id=${id}&section=${x[0]}'">${x[1]}${done[x[0]]?' ✓':''}</button>`).join('')}const tabsEl=document.getElementById('tabs'),bar=document.getElementById('bar'),status=document.getElementById('status'),progressText=document.getElementById('progressText');function icon(i){return ['👋','🧑','🎒','📚','✏️','🎨','🎵','⚽','🎬','💻','🗓️','🎂'][i%12]}function vocab(){let w=Array.isArray(d.vocabulary)?d.vocabulary:[];return `<h2>🖼️ Galerie des mots</h2><p class="muted">مرر بصريًا على الكلمات: شاهد الرمز، اقرأ الكلمة، اسمعها، ثم راجع المثال.</p><div class="grid">${w.map((x,i)=>`<article class="card"><div class="visual">${icon(i)}</div><div class="fr">${esc(x.word)}</div><div class="ar">${esc(x.translation||'')}</div>${x.example?`<div class="ex">${esc(x.example)}</div>`:''}<button class="btn" onclick='speak(${JSON.stringify(x.word)})'>🔊 استمع</button></article>`).join('')}</div><button class="btn" onclick="save('vocab')">✓ إتمام المفردات</button>`}function pronunciation(){let a=d.phonetics||[];if(!Array.isArray(a))a=[a];return `<h2>🎧 Atelier de prononciation</h2>${a.map((x,i)=>`<article class="activity"><div class="visual">🗣️</div><h3>${esc(x)}</h3><p class="muted">استمع ثم كرر 3 مرات، ثم حاول استخدام الصوت في كلمة أو جملة.</p><button class="btn" onclick='speak(${JSON.stringify(x)})'>🔊 استمع</button></article>`).join('')}<button class="btn" onclick="save('pronunciation')">✓ إتمام النطق</button>`}function grammar(){let g=d.grammar||[];let a=Array.isArray(g)?g:[g];return `<h2>📘 Atelier de grammaire</h2>${a.map(x=>typeof x==='string'?`<article class="card"><p>${esc(x)}</p></article>`:`<article class="activity"><h3>${esc(x.title||'Point de langue')}</h3><p class="muted">${esc(x.explanationAr||x.note||x.explanation||'')}</p>${x.conjugationExample?`<div class="ex">${Object.entries(x.conjugationExample).map(([k,v])=>`<b>${esc(k)}</b>: ${Array.isArray(v)?v.map(esc).join(' · '):esc(v)}`).join('<hr>')}</div>`:''}${(x.examples||[]).map(e=>`<div class="ex">${esc(typeof e==='string'?e:e.fr||'')}<br><span dir="rtl">${esc(typeof e==='string'?'':e.ar||'')}</span></div>`).join('')}</article>`).join('')}<button class="btn" onclick="save('grammar')">✓ إتمام القواعد</button>`}function conv(){let c=d.conversation||{},lines=c.lines||[];return `<h2>💬 Conversation Studio</h2><p class="muted">استمع لكل جملة ثم أعد الحوار بصوتك.</p><div class="grid">${lines.map(x=>`<article class="card"><div class="visual">${x.speaker==='A'?'🧑':'👩'}</div><b>${esc(x.speaker||'')}</b><div class="fr">${esc(x.fr||'')}</div><div class="ar">${esc(x.ar||'')}</div><button class="btn" onclick='speak(${JSON.stringify(x.fr||'')})'>🔊 استمع</button></article>`).join('')}</div><button class="btn" onclick="save('conversation')">✓ إتمام المحادثة</button>`}function practice(){let a=d.practice||[];return `<h2>✍️ Entraînement intensif</h2><p class="muted">أسئلة متدرجة مع تصحيح فوري.</p>${a.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.question)}</b>${(q.options||[]).map((o,j)=>`<button class="opt" onclick="answer(this,${j},${q.answer})">${esc(o)}</button>`).join('')}<div class="muted result"></div></div>`).join('')}<button class="btn" onclick="save('practice')">✓ إنهاء التدريب</button>`}function answer(b,j,a){let box=b.parentElement;box.querySelectorAll('.opt').forEach(x=>x.disabled=true);box.querySelector('.result').textContent=j===a?'✅ إجابة صحيحة — ممتاز!':'❌ إجابة غير صحيحة — راجع القاعدة.';b.classList.add(j===a?'correct':'wrong')}function games(){let w=(d.vocabulary||[]).slice(0,12);return `<h2>🎮 Learning Games</h2><div class="activity"><h3>🧠 Memory Flash</h3><div class="memory">${w.map(x=>`<button onclick="this.textContent='${esc(x.translation||'').replaceAll("'","\\'")}';setTimeout(()=>this.textContent='${esc(x.word).replaceAll("'","\\'")}',1300)">${esc(x.word)}</button>`).join('')}</div></div><div class="activity"><h3>🧩 Sentence Builder</h3><p class="muted">اختر الكلمات ثم اكتب جملة صحيحة بها في المساحة.</p><div class="chips">${w.map(x=>`<button class="chip" onclick="this.classList.toggle('selected')">${esc(x.word)}</button>`).join('')}</div><div class="dropzone">📝 اكتب جملتك هنا بعد اختيار الكلمات.</div></div><button class="btn" onclick="save('games')">✓ إتمام الألعاب</button>`}function assessment(){let a=(d.assessment||{}).questions||[];return `<h2>🏆 Évaluation finale</h2>${a.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.question)}</b>${q.type==='open'||q.type==='oral'?`<textarea style="width:100%;min-height:90px;margin-top:10px;border:1px solid #dce3ee;border-radius:12px;padding:10px" placeholder="اكتب أو حضّر إجابتك هنا..."></textarea>`:(q.options||[]).map((o,j)=>`<button class="opt" onclick="answer(this,${j},${q.answer})">${esc(o)}</button>`).join('')}</div>`).join('')}<button class="btn" onclick="save('assessment')">✓ إنهاء التقييم</button>`}function intro(){return `<h2>🚀 ابدأ رحلتك</h2><div class="grid"><article class="card"><div class="visual">📚</div><b>المحتوى الأساسي</b><p class="muted">المحتوى الأساسي الذي يبنى عليه الدرس.</p></article><article class="card"><div class="visual">✨</div><b>الإثراء والتدريب</b><p class="muted">طبقة إثراء موسعة للمفردات والتدريب والتقييم.</p></article><article class="card"><div class="visual">🎯</div><b>هدف الدرس</b><p class="muted">${esc(d.objectiveAr||'')}</p></article></div><button class="btn" onclick="save('intro')">🚀 ابدأ الدرس</button>`}function render(){tabs();document.getElementById('title').textContent=d.titleAr||d.title||'الدرس';document.getElementById('subtitle').textContent=d.title||'';panel.innerHTML=sec==='vocab'?vocab():sec==='pronunciation'?pronunciation():sec==='grammar'?grammar():sec==='conversation'?conv():sec==='practice'?practice():sec==='games'?games():sec==='assessment'?assessment():intro();renderProgress()}fetch(files[id]).then(r=>r.json()).then(x=>{d=x;render()}).catch(()=>panel.innerHTML='<h2>تعذر تحميل الدرس</h2><p class="muted">تحقق من ملف الدرس.</p>');</script></body></html>
