<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Secondary 1 Learning Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f9;color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:1160px;margin:auto;padding:12px}.head,.hero,.panel,.complete{border-radius:24px;padding:18px;margin-bottom:12px}.head{background:#0f1b33;color:#fff;display:flex;justify-content:space-between;align-items:center}.head a{color:#fff;text-decoration:none;font-weight:900}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff;box-shadow:0 16px 38px #14264a20}.hero h1{margin:0 0 8px;font-size:clamp(26px,6vw,42px)}.hero p{line-height:1.8}.journey,.tabs{display:flex;gap:7px;overflow:auto;margin-top:12px}.journey span,.tabs button{border:0;border-radius:999px;padding:9px 12px;white-space:nowrap;font-weight:900}.journey span{background:#ffffff20}.tabs button{background:#fff;color:#173a82;cursor:pointer}.tabs button.active{background:#173a82;color:#fff}.panel{background:#fff;box-shadow:0 8px 25px #14264a12}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{border:1px solid #dfe6f0;border-radius:19px;padding:15px;background:linear-gradient(180deg,#fff,#f8faff);box-shadow:0 5px 16px #14264a08}.fr{direction:ltr;text-align:center;font-size:20px;font-weight:900}.ar{text-align:center;color:#315a8f;font-weight:800;line-height:1.7}.ex{background:#f3f7fc;border-radius:13px;padding:11px;margin-top:9px;direction:ltr;text-align:center}.btn{border:0;border-radius:11px;padding:9px 12px;margin-top:9px;font-weight:900;cursor:pointer;background:#2563eb;color:#fff}.soft{background:#eaf1ff;color:#173a82}.q{border:1px solid #dfe6f0;border-radius:17px;padding:15px;margin:12px 0}.opt{display:block;width:100%;text-align:right;background:#f7f9fd;border:1px solid #dce3ee;border-radius:11px;padding:11px;margin:7px 0;font-weight:800;cursor:pointer}.correct{background:#ecfdf3!important;border-color:#20a45a!important}.wrong{background:#fff2f8!important;border-color:#e92d83!important}.muted{color:#66738a;line-height:1.8}.progress{height:10px;background:#e8edf5;border-radius:99px;overflow:hidden;margin-top:13px}.bar{height:100%;background:#2563eb;width:0;transition:.25s}.status{display:inline-block;margin-top:9px;padding:7px 11px;border-radius:999px;background:#ffffff22;font-weight:900}.activity{border:2px dashed #cad8ea;border-radius:19px;padding:18px;margin:12px 0}.activity h3{margin-top:0}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #cfd9e8;background:#fff;border-radius:999px;padding:9px 12px;font-weight:800;cursor:pointer}.chip.selected{background:#eaf1ff;border-color:#2563eb}.memory{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.memory button{min-height:85px;border:0;border-radius:17px;background:#edf3ff;color:#173a82;font-size:17px;font-weight:900;cursor:pointer}.next{display:flex;gap:8px;flex-wrap:wrap}.next a{background:#edf3ff;color:#173a82;text-decoration:none;padding:10px 13px;border-radius:11px;font-weight:900}.complete{background:#fff}.badge{display:inline-block;background:#e8f7f5;color:#087f76;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:900}@media(max-width:650px){.wrap{padding:8px}.head{border-radius:14px}.grid{grid-template-columns:repeat(2,1fr)}.card{padding:12px}}</style></head><body><div class="wrap"><header class="head"><a href="index.html">🇫🇷 HM Academy</a><a href="baccalaureat-1.html">خريطة الصف</a></header><section class="hero"><span class="badge">Content Fusion · Club @dos + Merci + Bravo</span><h1 id="title">Learning Studio</h1><p id="subtitle"></p><div class="journey"><span>🚀 البداية</span><span>🖼️ المفردات</span><span>🎧 النطق</span><span>📘 القواعد</span><span>💬 المحادثة</span><span>✍️ التدريب</span><span>🎬 الفيديو</span><span>🎮 الألعاب</span><span>🧠 Smart Review</span><span>🏆 التقييم</span><span>📈 التقدم</span></div><div class="progress"><div class="bar" id="bar"></div></div><div id="status" class="status"></div></section><div class="tabs" id="tabs"></div><main class="panel" id="panel"></main><section class="complete"><b>🏁 تقدم الدرس</b><div class="muted" id="progressText"></div></section></div><script>const p=new URLSearchParams(location.search),id=p.get('id')||'s1-u1-01',sec=p.get('section')||'intro';const files={"s1-u1-01":"data/lessons/secondary-1/semester-1/s1-u1-01.json","s1-u1-02":"data/lessons/secondary-1/semester-1/s1-u1-02.json","s1-u1-03":"data/lessons/secondary-1/semester-1/s1-u1-03.json","s1-u1-04":"data/lessons/secondary-1/semester-1/s1-u1-04.json","s1-u2-01":"data/lessons/secondary-1/semester-1/s1-u2-01.json","s1-u2-02":"data/lessons/secondary-1/semester-1/s1-u2-02.json","s1-u2-03":"data/lessons/secondary-1/semester-1/s1-u2-03.json","s1-u2-04":"data/lessons/secondary-1/semester-1/s1-u2-04.json"};let d={};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key='hm-s1-progress-'+id;let done=JSON.parse(localStorage.getItem(key)||'{}');function save(s){done[s]=true;localStorage.setItem(key,JSON.stringify(done));renderProgress();tabs()}function renderProgress(){let stages=['intro','vocab','pronunciation','grammar','conversation','practice','games','assessment'],n=stages.filter(x=>done[x]).length,p=Math.round(n/stages.length*100);document.getElementById('bar').style.width=p+'%';document.getElementById('status').textContent=p===100?'🏆 مكتمل':`التقدم ${p}%`;document.getElementById('progressText').textContent=`تم إنجاز ${n} من ${stages.length} مراحل في هذا الدرس.`}function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}function tabs(){let arr=[['intro','🚀 البداية'],['vocab','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['games','🎮 الألعاب'],['assessment','🏆 التقييم']];document.getElementById('tabs').innerHTML=arr.map(x=>`<button class="${sec==x[0]?'active':''}" onclick="location.href='?id=${id}&section=${x[0]}'">${x[1]}${done[x[0]]?' ✓':''}</button>`).join('')}function vocab(){let w=Array.isArray(d.vocabulary)?d.vocabulary:[];return `<h2>🖼️ Banque de mots</h2><p class="muted">اضغط على 🔊 لسماع الكلمة، ثم اقرأ المثال إن وُجد.</p><div class="grid">${w.map(x=>`<article class="card"><div class="fr">${esc(x.word)}</div><div class="ar">${esc(x.translation||'')}</div>${x.example?`<div class="ex">${esc(x.example)}</div>`:''}<button class="btn" onclick='speak(${JSON.stringify(x.word)})'>🔊 نطق</button></article>`).join('')}</div><button class="btn" onclick="save('vocab')">✓ إتمام المفردات</button>`}function pronunciation(){let a=d.phonetics||[];if(!Array.isArray(a))a=[a];return `<h2>🎧 Phonétique</h2><p class="muted">تدريب النطق أصبح جزءًا مرئيًا مستقلًا داخل الدرس.</p>${a.map(x=>`<article class="activity"><b>🔊 ${esc(x)}</b><p class="muted">استمع إلى أمثلة الكلمات المرتبطة بهذه القاعدة الصوتية.</p><button class="btn" onclick='speak(${JSON.stringify(x)})'>استمع</button></article>`).join('')}<button class="btn" onclick="save('pronunciation')">✓ إتمام النطق</button>`}function grammar(){let g=d.grammar||[];let arr=Array.isArray(g)?g:[g];return `<h2>📘 Grammaire</h2>${arr.map(x=>typeof x==='string'?`<article class="card"><p>${esc(x)}</p></article>`:`<article class="activity"><h3>${esc(x.title||'Point de langue')}</h3><p class="muted">${esc(x.explanationAr||x.note||x.explanation||'')}</p>${x.conjugationExample?`<div class="ex">${Object.entries(x.conjugationExample).map(([k,v])=>`<b>${esc(k)}</b>: ${Array.isArray(v)?v.map(esc).join(' · '):esc(v)}`).join('<hr>')}</div>`:''}${(x.examples||[]).map(e=>`<div class="ex">${esc(typeof e==='string'?e:e.fr||'')}<br><span dir="rtl">${esc(typeof e==='string'?'':e.ar||'')}</span></div>`).join('')}</article>`).join('')}<button class="btn" onclick="save('grammar')">✓ إتمام القواعد</button>`}function conv(){let c=d.conversation||{};let lines=c.lines||[];return `<h2>💬 Conversation</h2><p class="muted">استمع لكل جملة ثم حاول إعادة الحوار دون النظر.</p><div class="grid">${lines.map(x=>`<article class="card"><b>${esc(x.speaker||'')}</b><div class="fr">${esc(x.fr||'')}</div><div class="ar">${esc(x.ar||'')}</div><button class="btn" onclick='speak(${JSON.stringify(x.fr||'')})'>🔊 استمع</button></article>`).join('')}</div><button class="btn" onclick="save('conversation')">✓ إتمام المحادثة</button>`}function practice(){let a=d.practice||[];return `<h2>✍️ Entraînement</h2><p class="muted">تدريب متدرج يجمع المفردات والقواعد والفهم.</p>${a.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.question)}</b>${(q.options||[]).map((o,j)=>`<button class="opt" onclick="answer(this,${j},${q.answer})">${esc(o)}</button>`).join('')}<div class="muted result"></div></div>`).join('')}<button class="btn" onclick="save('practice')">✓ إنهاء التدريب</button>`}function answer(b,j,a){let r=b.parentElement.querySelector('.result');[...b.parentElement.querySelectorAll('.opt')].forEach(x=>x.disabled=true);if(j===a){b.classList.add('correct');r.textContent='✅ صحيح — ممتاز!'}else{b.classList.add('wrong');r.textContent='❌ راجع القاعدة وحاول في السؤال التالي.'}}function games(){let words=(d.vocabulary||[]).slice(0,12);return `<h2>🎮 Mini Games</h2><div class="activity"><h3>🧠 Memory Flash</h3><p class="muted">اضغط على البطاقات، اقرأ الفرنسية، ثم حاول تذكر معناها.</p><div class="memory">${words.map(x=>`<button onclick="this.textContent='${esc(x.translation||'').replaceAll("'","\\'")}';setTimeout(()=>this.textContent='${esc(x.word).replaceAll("'","\\'")}',1200)">${esc(x.word)}</button>`).join('')}</div></div><div class="activity"><h3>🎯 My Challenge</h3><p class="muted">اختر خمس كلمات ثم كوّن جملة واحدة على الأقل بكل كلمتين.</p><div class="chips">${words.map(x=>`<button class="chip" onclick="this.classList.toggle('selected')">${esc(x.word)}</button>`).join('')}</div></div><button class="btn" onclick="save('games')">✓ إتمام الألعاب</button>`}function assessment(){let a=(d.assessment||{}).questions||[];return `<h2>🏆 Évaluation finale</h2><p class="muted">اختبار ختامي متعدد الأنماط، مع مهام إنتاجية عند وجودها.</p>${a.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.question)}</b>${q.type==='open'||q.type==='oral'?`<textarea style="width:100%;min-height:90px;margin-top:10px;border:1px solid #dce3ee;border-radius:12px;padding:10px" placeholder="اكتب إجابتك هنا..."></textarea>`:(q.options||[]).map((o,j)=>`<button class="opt" onclick="answer(this,${j},${q.answer})">${esc(o)}</button>`).join('')}</div>`).join('')}<button class="btn" onclick="save('assessment')">✓ إنهاء التقييم</button>`}function render(){tabs();document.getElementById('title').textContent=d.titleAr||d.title||'الدرس';document.getElementById('subtitle').textContent=d.title||'';let h=sec==='vocab'?vocab():sec==='pronunciation'?pronunciation():sec==='grammar'?grammar():sec==='conversation'?conv():sec==='practice'?practice():sec==='games'?games():sec==='assessment'?assessment():`<h2>🚀 البداية</h2><p class="muted">${esc(d.objectiveAr||'')}</p><div class="grid"><div class="card"><b>📚 المصدر الأساسي</b><p>${esc(d.source||'Club @dos Plus 1')}</p></div><div class="card"><b>✨ طبقة الإثراء</b><p>Merci 2027 + Bravo 2027</p></div><div class="card"><b>🎯 أهداف التواصل</b><p>${(d.communication||d.focus||[]).map(x=>'• '+esc(x)).join('<br>')}</p></div></div><div class="activity"><h3>🌟 طريقة الدراسة</h3><p class="muted">تعلم المفردات → استمع للنطق → افهم القاعدة → مارس المحادثة → حل التدريبات → العب → اختبر نفسك.</p></div><div class="next"><a href="?id=${id}&section=vocab">🖼️ المفردات</a><a href="?id=${id}&section=pronunciation">🎧 النطق</a><a href="?id=${id}&section=grammar">📘 القواعد</a><a href="?id=${id}&section=conversation">💬 المحادثة</a><a href="?id=${id}&section=practice">✍️ التدريب</a><a href="?id=${id}&section=games">🎮 الألعاب</a><a href="?id=${id}&section=assessment">🏆 التقييم</a></div><button class="btn" onclick="save('intro')">✓ إتمام البداية</button>`;document.getElementById('panel').innerHTML=h;renderProgress()}fetch(files[id]).then(r=>r.json()).then(x=>{d=x;render()}).catch(()=>document.getElementById('panel').innerHTML='<p>تعذر تحميل محتوى الدرس.</p>');</script></body></html>
