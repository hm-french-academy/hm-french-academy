<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Secondary 1 Learning Studio</title><style>body{margin:0;background:#f5f7fb;color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:1120px;margin:auto;padding:12px}.head,.hero,.panel,.complete{border-radius:22px;padding:16px;margin-bottom:12px}.head{background:#0f1b33;color:#fff;display:flex;justify-content:space-between;align-items:center}.head a{color:#fff;text-decoration:none;font-weight:900}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff}.hero h1{margin:0 0 8px;font-size:clamp(25px,6vw,40px)}.journey,.tabs{display:flex;gap:7px;overflow:auto;margin-top:12px}.journey span,.tabs button{border:0;border-radius:999px;padding:8px 11px;white-space:nowrap;font-weight:900}.journey span{background:#ffffff22}.tabs button{background:#eef3ff;color:#173a82}.tabs button.active{background:#e92d83;color:#fff}.panel{background:#fff;box-shadow:0 8px 25px #14264a12}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{border:1px solid #e1e6ef;border-radius:17px;padding:14px}.fr{direction:ltr;text-align:center;font-size:19px;font-weight:900}.ar{text-align:center;color:#315aa4;font-weight:800}.ex{background:#f7f9fd;border-radius:12px;padding:10px;margin-top:8px;direction:ltr;text-align:center}.btn{border:0;border-radius:10px;padding:9px 12px;margin-top:8px;font-weight:900;cursor:pointer;background:#2563eb;color:#fff}.q{border:1px solid #e1e6ef;border-radius:16px;padding:14px;margin:10px 0}.opt{display:block;width:100%;text-align:right;background:#f7f9fd;border:1px solid #dce3ee;border-radius:10px;padding:10px;margin:7px 0;font-weight:800}.correct{background:#ecfdf3!important;border-color:#20a45a!important}.wrong{background:#fff2f8!important;border-color:#e92d83!important}.muted{color:#66738a;line-height:1.8}.complete{background:#fff}.next{display:flex;gap:8px;flex-wrap:wrap}.next a{background:#edf3ff;color:#173a82;text-decoration:none;padding:10px 13px;border-radius:11px;font-weight:900}.progress{height:9px;background:#e8edf5;border-radius:99px;overflow:hidden;margin-top:10px}.bar{height:100%;background:#2563eb;width:0}.status{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:999px;background:#eef3ff;color:#173a82;font-weight:900}@media(max-width:650px){.wrap{padding:8px}.head{border-radius:14px}}</style></head><body><div class="wrap"><header class="head"><a href="index.html">🇫🇷 HM Academy</a><a href="baccalaureat-1.html">خريطة الصف</a></header><section class="hero"><h1 id="title">Learning Studio</h1><div id="subtitle"></div><div class="journey"><span>🚀 البداية</span><span>🖼️ المفردات</span><span>🎧 النطق</span><span>📘 القواعد</span><span>💬 المحادثة</span><span>✍️ التدريب</span><span>🎬 الفيديو</span><span>🎮 الألعاب</span><span>🧠 المراجعة الذكية</span><span>🏆 التقييم</span><span>📈 التقدم</span></div><div class="progress"><div class="bar" id="bar"></div></div><div id="status" class="status"></div></section><div class="tabs" id="tabs"></div><main class="panel" id="panel"></main><section class="complete"><b>🏁 تقدم الدرس</b><div class="muted" id="progressText"></div></section></div><script>const p=new URLSearchParams(location.search),id=p.get('id')||'s1-u1-01',sec=p.get('section')||'intro';const files={"s1-u1-01":"data/lessons/secondary-1/semester-1/s1-u1-01.json","s1-u1-02":"data/lessons/secondary-1/semester-1/s1-u1-02.json","s1-u1-03":"data/lessons/secondary-1/semester-1/s1-u1-03.json","s1-u1-04":"data/lessons/secondary-1/semester-1/s1-u1-04.json","s1-u2-01":"data/lessons/secondary-1/semester-1/s1-u2-01.json","s1-u2-02":"data/lessons/secondary-1/semester-1/s1-u2-02.json","s1-u2-03":"data/lessons/secondary-1/semester-1/s1-u2-03.json","s1-u2-04":"data/lessons/secondary-1/semester-1/s1-u2-04.json"};let d={};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key='hm-s1-progress-'+id;let done=JSON.parse(localStorage.getItem(key)||'{}');function save(s){done[s]=true;localStorage.setItem(key,JSON.stringify(done));renderProgress();tabs()}function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.85;speechSynthesis.speak(u)}function renderProgress(){let stages=['intro','vocab','pronunciation','grammar','conversation','practice','assessment'],n=stages.filter(x=>done[x]).length,p=Math.round(n/stages.length*100);document.getElementById('bar').style.width=p+'%';document.getElementById('status').textContent=p===100?'🏆 مكتمل':`التقدم ${p}%`;document.getElementById('progressText').textContent=`تم إنجاز ${n} من ${stages.length} مراحل في هذا الدرس.`}function tabs(){let arr=[['intro','🚀 البداية'],['vocab','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['assessment','🏆 التقييم']];document.getElementById('tabs').innerHTML=arr.map(x=>`<button class="${sec==x[0]?'active':''}" onclick="location.href='?id=${id}&section=${x[0]}'">${x[1]}${done[x[0]]?' ✓':''}</button>`).join('')}function vocab(){let w=Array.isArray(d.vocabulary)?d.vocabulary:[];return `<h2>🖼️ المفردات</h2><div class="grid">${w.map(x=>`<article class="card"><div class="fr">${esc(x.word)}</div><div class="ar">${esc(x.translation||'')}</div>${x.example?`<div class="ex">${esc(x.example)}</div>`:''}<button class="btn" onclick='speak(${JSON.stringify(x.word)})'>🔊 نطق</button></article>`).join('')}</div><button class="btn" onclick="save('vocab')">✓ إتمام المفردات</button>`}function pronunciation(){let a=d.phonetics||[];if(!Array.isArray(a))a=[a];return `<h2>🎧 النطق</h2>${a.length?a.map(x=>typeof x==='string'?`<article class="card"><p>${esc(x)}</p></article>`:`<article class="card"><h3>${esc(x.focus||'Phonétique')}</h3><p class="muted">${esc(x.ar||x.note||'')}</p>${(x.examples||[]).map(e=>`<button class="btn" onclick='speak(${JSON.stringify(e)})'>🔊 ${esc(e)}</button>`).join(' ')}</article>`).join(''):'<p class="muted">لا توجد مادة نطق مستقلة مسجلة في مصدر هذا الدرس.</p>'}<button class="btn" onclick="save('pronunciation')">✓ إتمام النطق</button>`}function grammar(){let g=d.grammar||[];let arr=Array.isArray(g)?g:[g];return `<h2>📘 القواعد</h2>${arr.map(x=>typeof x==='string'?`<article class="card"><p>${esc(x)}</p></article>`:`<article class="card"><h3>${esc(x.title||'Grammaire')}</h3><p class="muted">${esc(x.explanationAr||x.note||x.explanation||'')}</p>${x.conjugationExample?`<div class="ex">${Object.entries(x.conjugationExample).map(([k,v])=>`<b>${esc(k)}</b>: ${v.map(esc).join(' · ')}`).join('<hr>')}</div>`:''}${(x.examples||[]).map(e=>`<div class="ex">${esc(typeof e==='string'?e:e.fr||'')}<br><span dir="rtl">${esc(typeof e==='string'?'':e.ar||'')}</span></div>`).join('')}</article>`).join('')}<button class="btn" onclick="save('grammar')">✓ إتمام القواعد</button>`}function conv(){let c=d.conversation||{};return `<h2>💬 المحادثة</h2>${c.note?`<p class="muted">${esc(c.note)}</p>`:''}${(c.lines||[]).map(x=>`<div class="card"><b>${esc(x.speaker||'')}</b> <span dir="ltr">${esc(x.fr)}</span><div class="ar">${esc(x.ar)}</div><button class="btn" onclick='speak(${JSON.stringify(x.fr)})'>🔊 استمع</button></div>`).join('')}<button class="btn" onclick="save('conversation')">✓ إتمام المحادثة</button>`}function questions(arr,stage){return `${(arr||[]).map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.question)}</b>${(q.options||[]).map((o,j)=>`<button class="opt" onclick="answer(this,${j},${q.answer})">${esc(o)}</button>`).join('')}<div class="muted result"></div></div>`).join('')}<button class="btn" onclick="save('${stage}')">✓ إنهاء ${stage==='assessment'?'التقييم':'التدريب'}</button>`}function answer(b,j,a){let r=b.parentElement.querySelector('.result');[...b.parentElement.querySelectorAll('.opt')].forEach(x=>x.disabled=true);if(j===a){b.classList.add('correct');r.textContent='✅ صحيح!'}else{b.classList.add('wrong');r.textContent='❌ إجابة غير صحيحة — راجع القاعدة ثم حاول مرة أخرى.'}}function render(){tabs();document.getElementById('title').textContent=d.titleAr||d.title||'الدرس';document.getElementById('subtitle').textContent=d.title||'';let h=sec==='vocab'?vocab():sec==='pronunciation'?pronunciation():sec==='grammar'?grammar():sec==='conversation'?conv():sec==='practice'?`<h2>✍️ التدريب</h2>${questions(d.practice,'practice')}`:sec==='assessment'?`<h2>🏆 التقييم</h2>${questions((d.assessment||{}).questions,'assessment')}`:`<h2>🚀 البداية</h2><p class="muted">${esc(d.objectiveAr||'')}</p><div class="grid"><div class="card"><b>📚 المصدر</b><p>${esc(d.source||'Club @dos Plus 1')}</p></div><div class="card"><b>🎯 أهداف التواصل</b><p>${(d.communication||d.focus||[]).map(x=>'• '+esc(x)).join('<br>')}</p></div></div><h3>🧭 ابدأ الرحلة</h3><div class="next"><a href="?id=${id}&section=vocab">المفردات</a><a href="?id=${id}&section=pronunciation">النطق</a><a href="?id=${id}&section=grammar">القواعد</a><a href="?id=${id}&section=conversation">المحادثة</a><a href="?id=${id}&section=practice">التدريب</a><a href="?id=${id}&section=assessment">التقييم</a></div><button class="btn" onclick="save('intro')">✓ إتمام البداية</button>`;document.getElementById('panel').innerHTML=h;renderProgress()}fetch(files[id]).then(r=>r.json()).then(x=>{d=x;render()}).catch(()=>{document.getElementById('panel').innerHTML='<p>تعذر تحميل محتوى الدرس.</p>'});</script></body></html>
