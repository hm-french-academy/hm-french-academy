<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Secondary 1 Learning Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f9;color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:1160px;margin:auto;padding:12px}.hero,.panel{border-radius:26px;padding:20px;margin-bottom:14px}.hero{background:linear-gradient(135deg,#12295f,#2563eb,#0f9f93);color:#fff;box-shadow:0 18px 45px #14264a20}.hero h1{font-size:clamp(28px,6vw,46px);margin:10px 0}.journey,.tabs,.chips{display:flex;gap:8px;overflow:auto;margin-top:12px}.journey span,.tabs button,.chip{border:0;border-radius:999px;padding:9px 13px;white-space:nowrap;font-weight:900}.journey span{background:#ffffff22}.tabs button{background:#fff;color:#173a82;cursor:pointer}.tabs button.active{background:#173a82;color:#fff}.panel{background:#fff;box-shadow:0 10px 30px #14264a12}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}.card,.activity,.q{border:1px solid #dce5f0;border-radius:20px;padding:16px;background:linear-gradient(180deg,#fff,#f8faff);box-shadow:0 7px 18px #14264a09}.visual{font-size:46px;text-align:center;padding:8px}.fr{direction:ltr;text-align:center;font-size:21px;font-weight:900}.ar{text-align:center;color:#315a8f;font-weight:800;line-height:1.7}.ex{background:#f1f5fb;border-radius:13px;padding:11px;margin-top:9px;direction:ltr;text-align:center}.btn{border:0;border-radius:12px;padding:10px 14px;margin-top:10px;font-weight:900;cursor:pointer;background:#2563eb;color:#fff}.muted{color:#66738a;line-height:1.8}.progress{height:10px;background:#e8edf5;border-radius:99px;overflow:hidden;margin-top:13px}.bar{height:100%;background:#2563eb;width:0;transition:.25s}.status{display:inline-block;margin-top:10px;padding:7px 11px;border-radius:999px;background:#ffffff22;font-weight:900}.opt{display:block;width:100%;text-align:right;background:#f7f9fd;border:1px solid #dce3ee;border-radius:12px;padding:11px;margin:7px 0;font-weight:800;cursor:pointer}.correct{background:#ecfdf3!important;border-color:#20a45a!important}.wrong{background:#fff2f8!important;border-color:#e92d83!important}.memory{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.memory button{min-height:100px;border:0;border-radius:18px;background:#edf3ff;color:#173a82;font-size:17px;font-weight:900;cursor:pointer}.chip{background:#fff;border:1px solid #cfd9e8;cursor:pointer}.chip.selected{background:#eaf1ff;border-color:#2563eb}.badge{display:inline-block;background:#e8f7f5;color:#087f76;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:900}@media(max-width:650px){.wrap{padding:8px}.grid{grid-template-columns:repeat(2,1fr)}} </style></head><body><div class="wrap"><section class="hero"><span class="badge">Content Fusion · Club @dos + Merci 2027 + Bravo 2027</span><h1 id="title">Learning Studio</h1><p id="subtitle"></p><div class="journey"><span>🚀 البداية</span><span>🖼️ المفردات</span><span>🎧 النطق</span><span>📘 القواعد</span><span>💬 المحادثة</span><span>✍️ التدريب</span><span>🎮 الألعاب</span><span>🧠 Smart Review</span><span>🏆 التقييم</span></div><div class="progress"><div class="bar" id="bar"></div></div><div id="status" class="status"></div></section><div class="tabs" id="tabs"></div><main class="panel" id="panel"></main></div><script>const p=new URLSearchParams(location.search),id=p.get('id')||'s1-u1-01',sec=p.get('section')||'intro';const files={"s1-u1-01":"data/lessons/secondary-1/semester-1/s1-u1-01.json","s1-u1-02":"data/lessons/secondary-1/semester-1/s1-u1-02.json","s1-u1-03":"data/lessons/secondary-1/semester-1/s1-u1-03.json","s1-u1-04":"data/lessons/secondary-1/semester-1/s1-u1-04.json","s1-u2-01":"data/lessons/secondary-1/semester-1/s1-u2-01.json","s1-u2-02":"data/lessons/secondary-1/semester-1/s1-u2-02.json","s1-u2-03":"data/lessons/secondary-1/semester-1/s1-u2-03.json","s1-u2-04":"data/lessons/secondary-1/semester-1/s1-u2-04.json"};let d={};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let done=JSON.parse(localStorage.getItem('hm-s1-progress-'+id)||'{}');const tabsEl=document.getElementById('tabs'),bar=document.getElementById('bar'),status=document.getElementById('status'),panel=document.getElementById('panel');function save(s){done[s]=true;localStorage.setItem('hm-s1-progress-'+id,JSON.stringify(done));renderProgress();tabs()}function renderProgress(){let a=['intro','vocab','pronunciation','grammar','conversation','practice','games','assessment'],n=a.filter(x=>done[x]).length,p=Math.round(n/a.length*100);bar.style.width=p+'%';status.textContent=p===100?'🏆 مكتمل':`التقدم ${p}%`}function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.8;speechSynthesis.speak(u)}function tabs(){let a=[['intro','🚀 البداية'],['vocab','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['games','🎮 الألعاب'],['assessment','🏆 التقييم']];tabsEl.innerHTML=a.map(x=>`<button class="${sec==x[0]?'active':''}" onclick="location.href='?id=${id}&section=${x[0]}'">${x[1]}${done[x[0]]?' ✓':''}</button>`).join('')}function vocab(){let w=Array.isArray(d.vocabulary)?d.vocabulary:[];let icons=['👤','🎒','📚','✏️','🎨','🏫','🎵','⚽','🎬','💻','📅','🧢'];return `<h2>🖼️ Galerie des mots</h2><p class="muted">بطاقات بصرية قابلة للاستماع؛ كل بطاقة تمثل وحدة تعلم صغيرة.</p><div class="grid">${w.map((x,i)=>`<article class="card"><div class="visual">${icons[i%icons.length]}</div><div class="fr">${esc(x.word)}</div><div class="ar">${esc(x.translation||'')}</div>${x.example?`<div class="ex">${esc(x.example)}</div>`:''}<button class="btn" onclick='speak(${JSON.stringify(x.word)})'>🔊 اسمع</button></article>`).join('')}</div><button class="btn" onclick="save('vocab')">✓ إتمام المفردات</button>`}function pronunciation(){let a=d.phonetics||[];if(!Array.isArray(a))a=[a];return `<h2>🎧 Atelier de prononciation</h2>${a.map(x=>`<article class="activity"><div class="visual">🗣️</div><h3>${esc(x)}</h3><p class="muted">استمع ثم كرر العبارة ثلاث مرات، مع التركيز على الصوت المستهدف.</p><button class="btn" onclick='speak(${JSON.stringify(x)})'>🔊 استمع</button></article>`).join('')}<button class="btn" onclick="save('pronunciation')">✓ إتمام النطق</button>`}function grammar(){let g=d.grammar||{};let a=Array.isArray(g)?g:[g];return `<h2>📘 Atelier de grammaire</h2>${a.map(x=>typeof x==='string'?`<article class="activity">${esc(x)}</article>`:`<article class="activity"><h3>${esc(x.title||'Point de langue')}</h3><p class="muted">${esc(x.explanationAr||x.note||x.explanation||'')}</p>${x.conjugationExample?`<div class="ex">${Object.entries(x.conjugationExample).map(([k,v])=>`<b>${esc(k)}</b>: ${Array.isArray(v)?v.map(esc).join(' · '):esc(v)}`).join('<hr>')}</div>`:''}${(x.examples||[]).map(e=>`<div class="ex">${esc(e.fr||e)}<br><span dir="rtl">${esc(e.ar||'')}</span></div>`).join('')}</article>`).join('')}<button class="btn" onclick="save('grammar')">✓ إتمام القواعد</button>`}function conv(){let c=d.conversation||{},a=c.lines||[];return `<h2>💬 Studio de conversation</h2><div class="grid">${a.map(x=>`<article class="card"><div class="visual">${x.speaker==='A'?'🧑':'👩'}</div><b>${esc(x.speaker||'')}</b><div class="fr">${esc(x.fr||'')}</div><div class="ar">${esc(x.ar||'')}</div><button class="btn" onclick='speak(${JSON.stringify(x.fr||'')})'>🔊 استمع</button></article>`).join('')}</div><div class="activity"><h3>🎭 تحدي الحوار</h3><p class="muted">أعد تمثيل الحوار كاملًا بصوتك، ثم بدّل بعض الكلمات وحافظ على نفس البنية.</p><button class="btn" onclick="save('conversation')">✓ إتمام المحادثة</button></div>`}function practice(){let a=d.practice||[];return `<h2>✍️ Entraînement intensif</h2><p class="muted">أسئلة متدرجة من التعرف إلى التطبيق.</p>${a.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.question)}</b>${(q.options||[]).map((o,j)=>`<button class="opt" onclick="answer(this,${j},${q.answer})">${esc(o)}</button>`).join('')}<div class="muted result"></div></div>`).join('')}<button class="btn" onclick="save('practice')">✓ إنهاء التدريب</button>`}function answer(b,j,a){let box=b.parentElement;box.querySelectorAll('.opt').forEach(x=>x.disabled=true);let r=box.querySelector('.result');if(j===a){b.classList.add('correct');r.textContent='✅ صحيح — أحسنت'}else{b.classList.add('wrong');r.textContent='❌ غير صحيح — راجع القاعدة ثم واصل.'}}function games(){let w=(d.vocabulary||[]).slice(0,12);return `<h2>🎮 Learning Games</h2><div class="activity"><h3>🧠 Flashcard Memory</h3><p class="muted">اضغط البطاقة لرؤية المعنى ثم حاول استرجاع الكلمة الفرنسية.</p><div class="memory">${w.map(x=>`<button onclick="this.textContent='${esc(x.translation||'')}';setTimeout(()=>this.textContent='${esc(x.word)}',1300)">${esc(x.word)}</button>`).join('')}</div></div><div class="activity"><h3>🧩 Word Builder</h3><p class="muted">اختر كلمات مناسبة للدرس ثم كوّن بها جملًا من إنشائك.</p><div class="chips">${w.map(x=>`<button class="chip" onclick="this.classList.toggle('selected')">${esc(x.word)}</button>`).join('')}</div></div><button class="btn" onclick="save('games')">✓ إتمام الألعاب</button>`}function assessment(){let a=(d.assessment||{}).questions||[];return `<h2>🏆 Évaluation finale</h2><p class="muted">اختبار ختامي يجمع المعرفة والتطبيق والإنتاج.</p>${a.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.question)}</b>${q.type==='open'||q.type==='oral'?`<textarea style="width:100%;min-height:90px;margin-top:10px;border:1px solid #dce3ee;border-radius:12px;padding:10px" placeholder="اكتب إجابتك أو حضّر إجابتك الشفهية..."></textarea>`:(q.options||[]).map((o,j)=>`<button class="opt" onclick="answer(this,${j},${q.answer})">${esc(o)}</button>`).join('')}</div>`).join('')}<button class="btn" onclick="save('assessment')">✓ إنهاء التقييم</button>`}function intro(){return `<h2>🚀 ابدأ رحلتك</h2><div class="grid"><article class="card"><div class="visual">📚</div><b>Club @dos Plus 1</b><p class="muted">المصدر الأساسي الذي يحدد أهداف الدرس ومحتواه.</p></article><article class="card"><div class="visual">✨</div><b>Merci 2027 + Bravo 2027</b><p class="muted">طبقة إثراء موسعة تضيف المفردات والتطبيقات والتدريبات والمراجعة.</p></article><article class="card"><div class="visual">🎯</div><b>هدف الدرس</b><p class="muted">${esc(d.objectiveAr||'')}</p></article></div><button class="btn" onclick="save('intro')">🚀 ابدأ الدرس</button>`}function render(){tabs();document.getElementById('title').textContent=d.titleAr||d.title||'الدرس';document.getElementById('subtitle').textContent=d.title||'';panel.innerHTML=sec==='vocab'?vocab():sec==='pronunciation'?pronunciation():sec==='grammar'?grammar():sec==='conversation'?conv():sec==='practice'?practice():sec==='games'?games():sec==='assessment'?assessment():intro();renderProgress()}fetch(files[id]).then(r=>r.json()).then(x=>{d=x;render()}).catch(()=>panel.innerHTML='<h2>تعذر تحميل الدرس</h2>')} </script></body></html>
