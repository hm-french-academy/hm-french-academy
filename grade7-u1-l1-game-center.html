<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | مركز الألعاب</title><style>:root{--ink:#17223b;--muted:#68758b;--blue:#2563eb;--navy:#173a82;--cyan:#0f9f91;--line:#dfe6f2;--soft:#f7f9fd}*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:var(--ink);font-family:Arial,"Noto Sans Arabic",sans-serif}.wrap{max-width:1050px;margin:auto;padding:22px 14px 50px}.hero,.panel,.game{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:0 10px 28px #14264a0d}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#0f9f91);color:#fff}.hero h1{margin:0 0 5px;font-size:clamp(28px,6vw,42px)}.hero p{line-height:1.8;margin:6px 0}.muted{color:#68758b}.hero .muted{color:#eef5ff}.games{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.game{margin:0}.game h2{margin:5px 0 8px}.game p{color:var(--muted);line-height:1.75}.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--blue);color:#fff;font-weight:900;cursor:pointer}.back{background:#eef4ff;color:var(--navy);margin-right:6px}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}.opt{border:1px solid #dbe3ef;background:#fff;border-radius:14px;padding:13px;font-weight:800;cursor:pointer;text-align:right}.good{background:#eaf8f0!important;border-color:#20a45a!important;color:#087443}.bad{background:#fff0f0!important;border-color:#d14b4b!important;color:#b42318}.q{font-size:21px;font-weight:900;line-height:1.7;margin:14px 0}.tag{display:inline-block;background:#eef4ff;color:#173a82;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:900}.round{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.hint{padding:12px;border-radius:14px;background:var(--soft);border-right:4px solid var(--cyan);line-height:1.8;margin-top:12px}.result{font-size:20px;font-weight:900;margin-top:14px}.ok{color:#087443;font-weight:900}.no{color:#b42318;font-weight:900}@media(max-width:650px){.games,.opts{grid-template-columns:1fr}.wrap{padding:10px 8px 35px}.hero,.panel,.game{padding:16px;border-radius:20px}}</style></head><body><main class="wrap"><section class="hero"><h1>🎮 مركز الألعاب</h1><p>الدرس الأول · <b dir="ltr">Découverte du français</b></p><p class="muted">أربع ألعاب مختلفة الوظيفة، مبنية على مهارات الدرس نفسه. اختر لعبة وابدأ الجولة.</p></section><section id="hub" class="games"></section><section id="play" class="panel" style="display:none"></section></main><script>(function(){const pools={sounds:[['ما المقطع الموجود في <b dir="ltr">photo</b>؟',['ph','oi','ou'],0],['أي مقطع يظهر في <b dir="ltr">moi</b>؟',['oi','ou','ph'],0],['أي كلمة تحتوي <b dir="ltr">ch</b>؟',['chat','moi','beau'],0],['أي كلمة تحتوي <b dir="ltr">eau</b>؟',['beau','photo','moi'],0],['ما المقطع في <b dir="ltr">rouge</b>؟',['ou','oi','ph'],0],['أكمل <b dir="ltr">ph__to</b>',['o','i','a'],0],['أي كلمة تبدأ بالصوت/الحرف <b dir="ltr">U</b>؟',['uniforme','orange','arbre'],0],['أي مقطع يساعدك على التعرف إلى <b dir="ltr">guitare</b>؟',['gui','oi','eau'],0]],letters:[['ما نوع الحرف <b dir="ltr">A</b>؟',['متحرك','ساكن','صامت'],0],['أي حرف متحرك يبدأ به <b dir="ltr">éléphant</b>؟',['E','A','O'],0],['أي حرف متحرك تبدأ به <b dir="ltr">orange</b>؟',['O','B','C'],0],['أي كلمة تبدأ بحرف <b dir="ltr">U</b>؟',['uniforme','orange','arbre'],0],['أي مجموعة تحتوي حروفًا متحركة فقط؟',['A – E – O','B – C – D','F – G – H'],0],['أي حرف اسمه بالفرنسية <b dir="ltr">i grec</b>؟',['Y','W','H'],0],['أي حرف ليس من حروف العلة الأساسية؟',['B','A','E'],0],['ما الحرف الموجود في بداية <b dir="ltr">autobus</b>؟',['A','U','O'],0]],meaning:[['ما معنى <b dir="ltr">Merci</b>؟',['شكرًا','مرحبًا','إلى اللقاء'],0],['ما معنى <b dir="ltr">Un autobus</b>؟',['أوتوبيس','تاكسي','دراجة'],0],['ما الكلمة الشفافة لـ «تليفون»؟',['Un téléphone','Un piano','Un taxi'],0],['ما الكلمة الشفافة لـ «جيتار»؟',['Une guitare','Une radio','Un vase'],0],['ما معنى <b dir="ltr">rouge</b>؟',['أحمر','أزرق','أخضر'],0],['ما معنى <b dir="ltr">Un bouquet</b>؟',['باقة ورد','مدرسة','هاتف'],0],['أي كلمة تشبه معناها العربي وتساعدك على اكتشافها؟',['Un téléphone','Bonjour','Merci'],0],['أي كلمة تعني «صورة»؟',['photo','chat','beau'],0]],discover:[['أي استراتيجية تساعدك على فهم كلمة فرنسية جديدة؟',['ابحث عن التشابه والمقطع المألوف','احفظها دون ملاحظة','تجاهل شكل الكلمة'],0],['في <b dir="ltr">téléphone</b>، ما الذي يساعدك؟',['التشابه مع «تليفون»','أنها كلمة عربية','لا شيء'],0],['في <b dir="ltr">guitare</b>، ما الميزة؟',['تشبه «جيتار» في الشكل والمعنى','تُكتب مثل الإنجليزية تمامًا','لا يمكن تخمينها'],0],['عند رؤية كلمة جديدة، ما أول خطوة ذكية؟',['لاحظ الحروف والمقاطع المألوفة','اختر عشوائيًا','تجاهل النطق'],0],['أي زوج يوضح كلمة شفافة؟',['téléphone ↔ تليفون','rouge ↔ مدرسة','Merci ↔ أوتوبيس'],0],['ما الهدف من ملاحظة <b dir="ltr">ph</b> و< b dir="ltr">oi</b> و< b dir="ltr">ou</b>؟',['التعرف إلى أنماط تساعد في القراءة','حفظ أرقام','تحديد زمن الفعل'],0],['إذا عرفت معنى كلمة من التشابه، ماذا تفعل بعدها؟',['تتحقق من نطقها واستعمالها','تتوقف عن التعلم','تغير الكلمة'],0],['ما المهارة الأساسية التي يبنيها الدرس؟',['اكتشاف الفرنسية قبل الحفظ','حفظ تصريفات كثيرة','ترجمة كل كلمة حرفيًا'],0]]};const titles={sounds:['🎧 صائد الأصوات','اكتشف المقاطع والأنماط الصوتية داخل الكلمات.'],letters:['🔤 مختبر الحروف','ميّز الحروف المتحركة والساكنة واستخدمها في الاكتشاف.'],meaning:['🃏 كلمة ومعنى','اختبر قدرتك على فهم الكلمات الشفافة والمفردات الأساسية.'],discover:['🔎 محقق الفرنسية','طبّق استراتيجية «اكتشف قبل أن تحفظ» على كلمات ومواقف جديدة.']};const hub=document.getElementById('hub'),play=document.getElementById('play');hub.innerHTML=Object.entries(titles).map(([k,v],i)=>'<article class="game"><span class="tag">اللعبة '+(i+1)+'</span><h2>'+v[0]+'</h2><p>'+v[1]+'</p><button class="btn" data-game="'+k+'">ابدأ اللعبة</button></article>').join('');let type='',n=0,score=0,current=[];const sh=a=>[...a].sort(()=>Math.random()-.5);function start(t){type=t;n=0;score=0;current=sh(pools[t]);hub.style.display='none';play.style.display='block';next()}function next(){if(n>=10){play.innerHTML='<div class="result">🏆 انتهت الجولة — نتيجتك: '+score+' / 10</div><p class="muted">يمكنك إعادة الجولة أو العودة إلى مركز الألعاب.</p><button class="btn" id="again">جولة جديدة</button><button class="btn back" id="hubbtn">← مركز الألعاب</button>';again.onclick=()=>start(type);hubbtn.onclick=showHub;return}const x=current[n%current.length],opts=sh(x[1].map((o,i)=>({o,i})));n++;play.innerHTML='<div class="round"><span class="tag">'+titles[type][0]+'</span><span class="muted">السؤال '+n+' / 10 · النقاط '+score+'</span></div><div class="q">'+x[0]+'</div><div class="opts">'+opts.map(p=>'<button class="opt" data-i="'+p.i+'">'+p.o+'</button>').join('')+'</div><div id="fb" class="hint">فكّر أولًا ثم اختر.</div>';document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.opt').forEach(z=>z.disabled=true);const ok=+b.dataset.i===x[2];b.classList.add(ok?'good':'bad');if(ok){score++;fb.innerHTML='<span class="ok">✓ إجابة صحيحة</span>'}else{const r=[...document.querySelectorAll('.opt')].find(z=>+z.dataset.i===x[2]);if(r)r.classList.add('good');fb.innerHTML='<span class="no">✗ الإجابة الصحيحة: '+x[1][x[2]]+'</span>'}setTimeout(next,650)})}function showHub(){play.style.display='none';hub.style.display='grid'}document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>start(b.dataset.game));})();</script></body></html>
