<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Baccalauréat 2 · Lesson Studio</title><link rel="stylesheet" href="css/premium-shell.css"><style>body{background:linear-gradient(135deg,#f7f9ff,#edf4ff);color:#14213d}.wrap{max-width:1100px;margin:auto}.card{background:#fff;border:1px solid #dce5f2;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 12px 30px #14213d0c}.hero{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.pill{background:#edf3ff;color:#245bd7;padding:8px 12px;border-radius:99px;font-weight:900}.muted{color:#66758d;line-height:1.9}.bar{height:10px;background:#e8edf6;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#245bd7;width:0}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.tab{border:1px solid #dce5f2;background:#fff;border-radius:14px;padding:10px;font-weight:900;cursor:pointer}.tab.on{background:#245bd7;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.v{border:1px solid #dce5f2;border-radius:15px;padding:13px;background:#fbfcff}.v span{display:block;color:#66758d;margin-top:5px}.rule,.reading,.dialogue{background:#f8fafc;border:1px solid #e5ebf3;border-radius:15px;padding:15px;line-height:1.95;margin-top:10px}.q{border:1px solid #dce5f2;border-radius:16px;padding:15px;margin:10px 0}.opts{display:grid;gap:8px;margin-top:9px}.opt{border:1px solid #dce5f2;background:#fff;border-radius:12px;padding:11px;text-align:right;cursor:pointer}.ok{background:#eaf9f2;border-color:#2d9b70}.bad{background:#fff0f0;border-color:#d35b5b}.btn{border:0;border-radius:13px;padding:11px 15px;background:#245bd7;color:#fff;text-decoration:none;font-weight:900;cursor:pointer}.btn.alt{background:#edf3ff;color:#245bd7}.actions{display:flex;gap:8px;flex-wrap:wrap}.write{width:100%;min-height:130px;border:1px solid #dce5f2;border-radius:14px;padding:12px;font:inherit}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{border:1px solid #dce5f2;border-radius:15px;padding:14px;text-align:center}.metric b{display:block;font-size:24px}@media(max-width:700px){.tabs{grid-template-columns:repeat(2,1fr)}.hero{flex-direction:column}.metrics{grid-template-columns:1fr}.card{padding:15px}.wrap{width:min(100% - 14px,1100px)}} </style></head><body><main class="hm-main wrap"><section class="hm-hero card"><div class="hero"><div><div class="eyebrow">HM ACADEMY · BACCALAURÉAT 2 · LESSON STUDIO</div><h1 id="title">الدرس</h1><p id="objective" class="muted"></p></div><span id="unit" class="pill"></span></div><div class="bar"><i id="progress"></i></div></section><div id="tabs" class="tabs"></div><section id="view"></section><section class="card actions"><a class="btn alt" href="baccalaureat-2.html">← العودة للمنهج</a><button class="btn alt" id="prev">السابق</button><button class="btn" id="next">التالي</button></section></main><script>
const U=[['Les repas et les habitudes alimentaires',['Les repas de la journée','Les aliments et les boissons','Au supermarché','Au restaurant']],['Le look quotidien',['Au magasin de vêtements','Mon style préféré','Les vêtements et les saisons','Les vêtements et la fête']],['Mon temps libre',['Mes loisirs préférés','Mes sports préférés','Les vacances et les voyages','Ma routine quotidienne']],['À la découverte de mon pays',['Bienvenue en Égypte','À l’hôtel','Dans ma ville','À la découverte de nos villes']],['À la rencontre des saisons',['Bonjour, la météo','Salut, les quatre saisons','Les saisons et les activités','Ensemble, protégeons notre planète']],['La technologie dans notre vie',['Ma vie numérique','Les dangers de la technologie','Les bonnes pratiques sur Internet','Mon futur métier']]];
const D={

'Au supermarché':['في السوبر ماركت',['le rayon|القسم','la caisse|الصندوق','un kilo|كيلوجرام','une bouteille|زجاجة','acheter|يشتري','combien|كم','le prix|السعر','un panier|سلة'],'combien de / quel prix','Demander un produit et une quantité.'],
'Au restaurant':['في المطعم',['la carte|قائمة الطعام','commander|يطلب','le serveur|النادل','l’addition|الحساب','un plat|طبق','une entrée|مقبلات','un dessert|حلوى','s’il vous plaît|من فضلك'],'je voudrais / impératif de politesse','Commander poliment au restaurant.'],
'Au magasin de vêtements':['في متجر الملابس',['un pantalon|بنطال','une robe|فستان','une chemise|قميص','une veste|سترة','une taille|مقاس','essayer|يجرّب','acheter|يشتري','la couleur|اللون'],'ce, cet, cette, ces','Demander une taille et une couleur.'],
'Mon style préféré':['أسلوبي المفضل',['élégant|أنيق','sportif|رياضي','confortable|مريح','simple|بسيط','préférer|يفضل','aimer|يحب','porter|يرتدي','le style|الأسلوب'],'aimer / préférer + infinitif','Exprimer ses goûts.'],
'Les vêtements et les saisons':['الملابس والفصول',['le printemps|الربيع','l’été|الصيف','l’automne|الخريف','l’hiver|الشتاء','un manteau|معطف','un short|شورت','une écharpe|وشاح','porter|يرتدي'],'en + saison / parce que','Choisir une tenue selon la saison.'],
'Les vêtements et la fête':['الملابس والمناسبات',['une fête|حفلة','s’habiller|يرتدي ملابس','une jupe|تنورة','un costume|بدلة','une chemise|قميص','élégamment|بأناقة','choisir|يختار','mettre|يرتدي'],'verbes pronominaux au présent','Décrire une tenue de fête.'],
'Mes loisirs préférés':['هواياتي المفضلة',['le loisir|الهواية','lire|يقرأ','dessiner|يرسم','chanter|يغني','écouter|يستمع','jouer|يلعب','regarder|يشاهد','se détendre|يسترخي'],'aimer / adorer / détester + infinitif','Parler de ses loisirs.'],
'Mes sports préférés':['رياضاتي المفضلة',['le football|كرة القدم','la natation|السباحة','le tennis|التنس','courir|يجري','nager|يسبح','faire du sport|يمارس الرياضة','s’entraîner|يتدرب','une équipe|فريق'],'faire du / de la / de l’','Dire quel sport on pratique.'],
'Les vacances et les voyages':['العطلات والسفر',['les vacances|العطلات','voyager|يسافر','un billet|تذكرة','une valise|حقيبة','un hôtel|فندق','réserver|يحجز','partir|يغادر','arriver|يصل'],'futur proche','Parler d’un projet de voyage.'],
'Ma routine quotidienne':['روتيني اليومي',['se lever|يستيقظ','se préparer|يستعد','commencer|يبدأ','finir|ينهي','aller|يذهب','rentrer|يعود','faire les devoirs|يؤدي الواجب','se coucher|ينام'],'verbes pronominaux + l’heure','Raconter sa journée.'],
'Bienvenue en Égypte':['مرحبًا بكم في مصر',['l’Égypte|مصر','bienvenue|مرحبًا','Le Caire|القاهرة','le Nil|النيل','visiter|يزور','un monument|أثر','touriste|سائح','célèbre|مشهور'],'aller + infinitif','Présenter des lieux d’Égypte.'],
'À l’hôtel':['في الفندق',['une chambre|غرفة','réserver|يحجز','la réception|الاستقبال','une clé|مفتاح','un passeport|جواز سفر','une nuit|ليلة','disponible|متاح','le petit déjeuner|الإفطار'],'pour + durée','Réserver une chambre.'],
'Dans ma ville':['في مدينتي',['la rue|الشارع','la pharmacie|الصيدلية','la gare|المحطة','la banque|البنك','près de|بالقرب من','loin de|بعيد عن','à côté de|بجوار','chercher|يبحث'],'prépositions de lieu','Indiquer un lieu et donner une direction.'],
'À la découverte de nos villes':['اكتشاف مدننا',['une ville|مدينة','un musée|متحف','un quartier|حي','ancien|قديم','moderne|حديث','grand|كبير','célèbre|مشهور','découvrir|يكتشف'],'être + adjectif et accord','Décrire une ville.'],
'Bonjour, la météo':['مرحبًا، الطقس',['la météo|الطقس','il fait chaud|الجو حار','il fait froid|الجو بارد','il pleut|تمطر','il neige|تثلج','le soleil|الشمس','le vent|الرياح','un parapluie|مظلة'],'il fait / il y a','Décrire la météo.'],
'Salut, les quatre saisons':['الفصول الأربعة',['le printemps|الربيع','l’été|الصيف','l’automne|الخريف','l’hiver|الشتاء','doux|معتدل','froid|بارد','chaud|حار','préférer|يفضل'],'parce que','Exprimer sa saison préférée.'],
'Les saisons et les activités':['الفصول والأنشطة',['faire du vélo|يركب الدراجة','nager|يسبح','skier|يتزلج','se promener|يتنزه','jouer|يلعب','la plage|الشاطئ','la montagne|الجبل','une activité|نشاط'],'quand + présent','Associer saison et activité.'],
'Ensemble, protégeons notre planète':['حماية الكوكب',['la planète|الكوكب','protéger|يحمي','recycler|يعيد التدوير','les déchets|النفايات','économiser|يوفر','l’eau|الماء','l’énergie|الطاقة','polluer|يلوث'],'il faut / impératif','Donner des conseils écologiques.'],
'Ma vie numérique':['حياتي الرقمية',['un ordinateur|حاسوب','un téléphone|هاتف','Internet|الإنترنت','une application|تطبيق','un message|رسالة','cliquer|ينقر','télécharger|ينزّل','communiquer|يتواصل'],'pour + infinitif','Décrire ses usages numériques.'],
'Les dangers de la technologie':['مخاطر التكنولوجيا',['un danger|خطر','un mot de passe|كلمة مرور','une donnée|بيان','la vie privée|الخصوصية','un virus|فيروس','protéger|يحمي','partager|يشارك','attention|انتباه'],'il faut / il ne faut pas','Identifier les risques et les éviter.'],
'Les bonnes pratiques sur Internet':['الممارسات الصحيحة على الإنترنت',['un site|موقع','vérifier|يتحقق','une source|مصدر','sécuriser|يؤمّن','un compte|حساب','respecter|يحترم','signaler|يبلّغ','fiable|موثوق'],'impératif / il faut','Appliquer les bonnes pratiques.'],
'Mon futur métier':['مهنتي المستقبلية',['un métier|مهنة','un ingénieur|مهندس','un médecin|طبيب','un professeur|مدرس','choisir|يختار','travailler|يعمل','réussir|ينجح','rêver|يحلم'],'futur proche / futur simple','Parler de son projet professionnel.']};
const stages=[['Comprendre','فهم'],['Écouter','استماع'],['Lire','قراءة'],['Vocabulaire','مفردات'],['Grammaire','قواعد'],['Phonétique','نطق'],['Parler','تحدث'],['Interagir','تفاعل'],['Écrire','كتابة'],['Tâche','مهمة'],['Auto-évaluation','تقييم ذاتي'],['Entraînement','تدريب']];
let id=new URLSearchParams(location.search).get('lesson')||'u1-l1';let m=id.match(/u(\d+)-l(\d+)/);let ui=Math.max(1,Math.min(6,+m[1]||1)),li=Math.max(1,Math.min(4,+m[2]||1));let title=U[ui-1][1][li-1],data=D[title]||D['Les repas de la journée'],stage=0,score=0,answered=false;
function set(){document.getElementById('title').textContent=data[0]+' · '+title;document.getElementById('unit').textContent='Unité '+ui+' · Leçon '+li;document.getElementById('objective').textContent=data[3];document.getElementById('progress').style.width=((stage+1)/stages.length*100)+'%';document.getElementById('tabs').innerHTML=stages.map((s,i)=>`<button class="tab ${i===stage?'on':''}" onclick="stage=${i};render()">${i+1}. ${s[1]}</button>`).join('');render()}
function render(){document.getElementById('progress').style.width=((stage+1)/stages.length*100)+'%';document.querySelectorAll('.tab').forEach((x,i)=>x.classList.toggle('on',i===stage));let v=document.getElementById('view');let words=data[1].map(x=>{let [fr,ar]=x.split('|');return `<div class="v"><b>${fr}</b><span>${ar}</span><button class="btn alt" onclick="speak('${fr.replace(/'/g,"\\'")}')">🔊 اسمع</button></div>`}).join('');if(stage===0)v.innerHTML=`<section class="card"><h2>الفكرة الأساسية</h2><p class="muted">${data[3]}</p><div class="reading">اقرأ عنوان الدرس والكلمات الأساسية، ثم انتقل للاستماع والقراءة قبل التدريب.</div></section>`;else if(stage===1)v.innerHTML=`<section class="card"><h2>استمع وانطق</h2><p class="muted">استمع إلى الكلمات ثم كررها بصوت واضح.</p><div class="grid">${words}</div></section>`;else if(stage===2)v.innerHTML=`<section class="card"><h2>Lire · اقرأ</h2><div class="reading">Aujourd’hui, je parle de « ${title} ». Je présente mes habitudes, mes goûts et mes choix avec des phrases simples et correctes.</div><p class="muted">لاحظ الكلمات المرتبطة بموضوع الدرس ثم أجب عن التدريب.</p></section>`;else if(stage===3)v.innerHTML=`<section class="card"><h2>Vocabulaire · المفردات</h2><div class="grid">${words}</div></section>`;else if(stage===4)v.innerHTML=`<section class="card"><h2>Grammaire · القاعدة</h2><div class="rule"><b>${data[2]}</b><br>استعمل القاعدة داخل جملة مرتبطة بموضوع الدرس، ثم طبّقها في التدريب.</div><div class="ex">Exemple : Je parle de « ${title} » avec une phrase correcte.</div></section>`;else if(stage===5)v.innerHTML=`<section class="card"><h2>Phonétique · النطق</h2><div class="rule">استمع للكلمات وركز على الأصوات الفرنسية، ثم كررها. اضغط 🔊 بجوار المفردات للتدريب السمعي.</div><div class="grid">${words}</div></section>`;else if(stage===6)v.innerHTML=`<section class="card"><h2>Parler · تحدث</h2><p>تحدث لمدة 30 ثانية عن: <b>${title}</b>.</p><div class="dialogue">Je parle de ce sujet et je donne au moins deux informations personnelles.</div></section>`;else if(stage===7)v.innerHTML=`<section class="card"><h2>Interagir · تفاعل</h2><div class="dialogue"><b>A :</b> Tu peux parler de ${title} ?<br><b>B :</b> Oui, bien sûr. Je peux donner des informations et poser une question.</div></section>`;else if(stage===8)v.innerHTML=`<section class="card"><h2>Écrire · اكتب</h2><p>اكتب 3 إلى 5 جمل عن <b>${title}</b>.</p><textarea class="write" placeholder="Écris ici..."></textarea></section>`;else if(stage===9)v.innerHTML=`<section class="card"><h2>Tâche · المهمة</h2><p>أنجز مهمة قصيرة توظف مفردات الدرس وقاعدته.</p><div class="rule">${data[3]}<br>Utilise au moins 4 mots du vocabulaire.</div></section>`;else if(stage===10)v.innerHTML=`<section class="card"><h2>Auto-évaluation</h2><div class="metrics"><div class="metric"><b>${Math.round((stage+1)/stages.length*100)}%</b>المسار</div><div class="metric"><b>${score}</b>إجابات صحيحة</div><div class="metric"><b>${score>=4?'جاهز':'واصل التدريب'}</b>الحالة</div></div></section>`;else training(v)}
function training(v){let qs=[['اختر الإجابة الصحيحة',data[1][0].split('|')[0],0],['اختر المعنى الصحيح للكلمة',data[1][1].split('|')[1],1],['اختر الكلمة المناسبة',data[1][2].split('|')[0],2],['اختر كلمة من مفردات الدرس',data[1][3].split('|')[0],3],['اختر القاعدة المرتبطة بالدرس',data[2],4]];v.innerHTML=`<section class="card"><h2>Entraînement · تدريب نهائي</h2><p class="muted">أجب عن الأسئلة. تحصل على تصحيح فوري ويمكنك المحاولة مرة أخرى.</p>${qs.map((q,i)=>`<div class="q"><b>${i+1}. ${q[0]}</b><div class="opts"><button class="opt" onclick="answer(this,${i},0)">${q[1]}</button><button class="opt" onclick="answer(this,${i},1)">${i%2?'réponse incorrecte':'réponse correcte'}</button></div><small id="fb${i}" class="muted"></small></div>`).join('')}<div id="result" class="rule">الحد الأدنى للإتقان: 80%</div></section>`}
function answer(el,i,c){let ok=c===0;el.classList.add(ok?'ok':'bad');document.getElementById('fb'+i).textContent=ok?'✓ إجابة صحيحة — أحسنت.':'✗ حاول مرة أخرى، وراجع القاعدة والمفردات.';if(ok){score++;el.parentElement.querySelectorAll('.opt').forEach(x=>x.disabled=true)}document.getElementById('result').textContent=`نتيجتك الحالية: ${score}/5 — ${score>=4?'تم تحقيق الإتقان ✓':'أكمل التدريب للوصول إلى 80%.'}`}
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';speechSynthesis.speak(u)}}
document.getElementById('prev').onclick=()=>{if(li>1)li--;else if(ui>1){ui--;li=4}else return;title=U[ui-1][1][li-1];data=D[title]||data;stage=0;score=0;set()};document.getElementById('next').onclick=()=>{if(li<4)li++;else if(ui<6){ui++;li=1}else return;title=U[ui-1][1][li-1];data=D[title]||data;stage=0;score=0;set()};set();</script></body></html>
