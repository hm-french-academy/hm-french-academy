<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/images/hm-academy-favicon.svg?v=2"><title>HM Academy | Baccalauréat 2 · Complete Lesson Studio</title><link rel="stylesheet" href="css/premium-shell.css"><style>:root{--p:#245bd7;--ink:#14213d;--muted:#66758d;--line:#dce5f2}body{background:linear-gradient(135deg,#f7f9ff,#edf4ff);color:var(--ink)}.s{max-width:1100px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 12px 30px #14213d0c}.top{display:flex;justify-content:space-between;gap:12px}.pill{background:#edf3ff;color:var(--p);padding:8px 12px;border-radius:99px;font-weight:900}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px;font-weight:900;cursor:pointer}.tab.on{background:var(--p);color:#fff}.muted{color:var(--muted);line-height:1.9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.v{border:1px solid var(--line);border-radius:15px;padding:13px;background:#fbfcff}.v span{display:block;color:var(--muted);margin-top:4px}.ex{background:#f7f9fd;border-right:4px solid var(--p);padding:14px;border-radius:12px;margin:10px 0;font-size:18px}.rule{background:#f8fafc;border:1px solid #e5ebf3;border-radius:15px;padding:15px;line-height:1.9}.q{border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0}.opts{display:grid;gap:8px;margin-top:9px}.opt{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;text-align:right;cursor:pointer}.ok{background:#eaf9f2;border-color:#2d9b70}.bad{background:#fff0f0;border-color:#d35b5b}.btn{border:0;border-radius:13px;padding:11px 15px;background:var(--p);color:#fff;text-decoration:none;font-weight:900;cursor:pointer}.btn.s{background:#edf3ff;color:var(--p)}.actions{display:fl const stages=['Comprendre','Écouter','Lire','Vocabulaire','Grammaire','Phonétique','Parler','Interagir','Écrire','Tâche','Auto-évaluation','Entraînement'];let flat=[];units.forEach((u,ui)=>u[1].forEach((t,li)=>flat.push({id:`u${ui+1}-l${li+1}`,u:u[0],t,ui,li})));const p=new URLSearchParams(location.search);let pos=Math.max(0,flat.findIndex(x=>x.id===p.get('lesson')));if(pos<0)pos=0;let st=0,score=0,answered=0;const item=()=>flat[pos],M=()=>meta[item().t];function speak(t){if(window.speechSynthesis){speechSynthesis.cancel();let x=new SpeechSynthesisUtterance(t);x.lang='fr-FR';speechSynthesis.speak(x)}}function shuffle(a){return a.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(x=>x.x)}function H(n,title,sub){return `<div><b style="display:inline-flex;width:38px;height:38px;border-radius:12px;background:#edf3ff;color:#245bd7;align-items:center;justify-content:center">${n}</b><h2 style="display:inline;margin-right:8px">${title}</h2><p class="muted">${sub}</p></div>`}function render(){let [ar,vs,g,o]=M(),t=item().t;document.title='HM Academy | '+t;document.getElementById('t').textContent=t;document.getElementById('sub').textContent=ar+' · '+item().u+' · الصف الثاني الثانوي · 2026/2027';document.getElementById('u').textContent='Unité '+(item().ui+1);document.getElementById('bar').style.width=((st+1)/12*100)+'%';document.getElementById('tabs').innerHTML=stages.map((x,i)=>`<button class="tab ${i===st?'on':''}" data-i="${i}">${i+1}. ${x}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(i<=st){st=i;render()}});let v='';if(st===0)v=`<div class="card">${H(1,'Comprendre','فهم الموقف والهدف قبل حفظ اللغة')}<div class="ex" dir="ltr">${example(t)}</div><div class="rule"><b>Objectif:</b> ${o}<br><b>خطوة الفهم:</b> حدّد الفعل الرئيسي، الموضوع، والمعلومة التي تريد التعبير عنها.</div></div>`;if(st===1)v=`<div class="card">${H(2,'Écouter','استماع ونطق للنموذج المركزي')}<div class="ex" dir="ltr">${example(t)}</div><button class="btn" onclick="speak(${JSON.stringify(example(t))})">🔊 استمع للنموذج</button><div class="muted">استمع مرتين: الأولى للفكرة العامة، والثانية للكلمات المفتاحية.</div></div>`;if(st===2)v=`<div class="card">${H(3,'Lire','قراءة قصيرة مرتبطة مباشرة بموضوع الدرس')}<div class="ex" dir="ltr">${example(t)} ${example(t)}</div><div class="rule">أسئلة القراءة: من؟ ماذا؟ أين؟ متى؟ ولماذا؟ ثم أعد صياغة الفكرة بجملة فرنسية من عندك.</div></div>`;if(st===3)v=`<div class="card">${H(4,'Vocabulaire','بنك مفردات كامل قابل للاستماع')}<div class="grid">${vs.map(x=>{let[a,b]=x.split('|');return `<div class="v"><b dir="ltr">${a}</b> <button class="btn s" onclick="speak(${JSON.stringify(a)})">🔊</button><span>${b}</span></div>`}).join('')}</div></div>`;if(st===4)v=`<div class="card">${H(5,'Grammaire',g)}<div class="rule"><b>القاعدة:</b> ${g}.<br><b>تطبيق:</b> <span dir="ltr">${example(t)}</span><br><b>مراجعة ذاتية:</b> هل حدّدت الفاعل والوظيفة والزمن قبل اختيار الصيغة؟</div></div>`;if(st===5)v=`<div class="card">${H(6,'Phonétique','النطق جزء من الإتقان وليس إضافة شكلية')}<div class="ex" dir="ltr">${example(t)}</div><button class="btn" onclick="speak(${JSON.stringify(example(t))})">🔊 النموذج</button><p class="muted">كرّر الجملة 3 مرات، ثم سجّلها بصوتك وركّز على نهايات الكلمات والوصل والتنغيم.</p></div>`;if(st===6)v=`<div class="card">${H(7,'Parler','إنتاج شفهي موجّه')}<div class="rule"><b>المهمة:</b> ${o}<br>استخدم 4 مفردات على الأقل + قاعدة الدرس + جملة رأي أو معلومة شخصية.</div><button class="btn" onclick="speak(${JSON.stringify(example(t))})">🔊 نموذج</button></div>`;if(st===7)v=`<div class="card">${H(8,'Interagir','موقف حواري حقيقي')}<div class="rule"><b>الموقف:</b> أنت تتحدث مع شخص آخر في سياق «${t}». ابدأ بسؤال مناسب، استمع للرد، ثم قدّم إجابة كاملة مستخدمًا مفردات الدرس.</div><div class="ex" dir="ltr">${example(t)}</div></div>`;if(st===8)v=`<div class="card">${H(9,'Écrire','كتابة موجهة')}<p class="muted">اكتب 5–7 جمل مترابطة. استخدم 5 مفردات من الدرس والقاعدة المستهدفة.</p><textarea id="w" class="write" placeholder="Écrivez votre réponse ici…"></textarea><button class="btn" style="margin-top:10px" onclick="checkW()">تصحيح الكتابة</button><div id="wr"></div></div>`;if(st===9)v=`<div class="card">${H(10,'Tâche','مهمة مركبة تجمع المهارات')}<ol><li>افهم الموقف.</li><li>استخرج المفردات المطلوبة.</li><li>طبّق القاعدة.</li><li>تحدث ثم اكتب.</li><li>راجع الأخطاء قبل التسليم.</li></ol><div class="ex">${o}</div></div>`;if(st===10)v=`<div class="card">${H(11,'Auto-évaluation','لا تنتقل للإتقان إلا إذا كنت قادرًا على الأداء')}<div class="master"><div class="metric"><b>✓</b>أفهم</div><div class="metric"><b>✓</b>أتحدث</div><div class="metric"><b>✓</b>أكتب</div></div><p class="muted">إذا كانت إحدى المهارات غير مستقرة، عد إلى مرحلتها وأعدها.</p></div>`;if(st===11)v=quiz();document.getElementById('view').innerHTML=v;document.getElementById('prev').onclick=()=>{if(st>0){st--;render()}};document.getElementById('next').onclick=()=>{if(st<11){st++;render()}else{pos=(pos+1)%flat.length;st=0;score=0;answered=0;location.href='baccalaureat-2-lesson-studio-final.html?lesson='+flat[pos].id}}}function example(t){let e={};if(t.includes('repas'))return'Je prends le petit-déjeuner à sept heures.';if(t.includes('aliments'))return'Je mange du pain et je bois de l’eau.';if(t.includes('supermarché'))return'Je voudrais un kilo de pommes, s’il vous plaît.';if(t.includes('restaurant'))return'Je voudrais commander une salade, s’il vous plaît.';if(t.includes('vêtements'))return'Je choisis des vêtements confortables selon la saison.';if(t.includes('style'))return'Je préfère porter un style simple et élégant.';if(t.includes('loisirs'))return'Pendant mon temps libre, j’aime lire et écouter de la musique.';if(t.includes('sports'))return'Je fais du sport trois fois par semaine.';if(t.includes('vacances'))return'Je vais voyager avec ma famille pendant les vacances.';if(t.includes('routine'))return'Je me lève à sept heures et je commence les cours à huit heures.';if(t.includes('Égypte'))return'Bienvenue en Égypte ! Nous allons visiter Le Caire.';if(t.includes('hôtel'))return'Je voudrais réserver une chambre pour deux nuits.';if(t.includes('ville'))return'La pharmacie est près de la gare.';if(t.includes('météo'))return'Aujourd’hui, il fait beau et il y a du soleil.';if(t.includes('saisons'))return'Je préfère le printemps parce qu’il fait doux.';if(t.includes('planète'))return'Il faut recycler et économiser l’eau.';if(t.includes('numérique'))return'J’utilise une application pour communiquer avec mes amis.';if(t.includes('dangers'))return'Il faut protéger ses données personnelles.';if(t.includes('pratiques'))return'Il est important de vérifier une information avant de la partager.';if(t.includes('métier'))return'Plus tard, je vais étudier et devenir ingénieur.';return'Je parle de ce sujet en français avec des phrases simples et correctes.'}function quiz(){let[a,vs,g,o]=M(),arr=shuffle([['Comprendre le thème du cours.',0],['Utiliser les mots du cours dans une phrase.',1],['Appliquer la règle du cours dans un contexte.',2]]);return `<div class="card">${H(12,'Entraînement','اختبار إتقان بثلاثة أنواع من القرارات')}<div class="q"><b>1. ما أفضل بداية لدراسة «${item().t}»؟</b><div class="opts"><button class="opt" onclick="ans(this,true,0)">فهم الموقف والهدف أولًا.</button><button class="opt" onclick="ans(this,false,0)">حفظ كلمات بلا سياق.</button><button class="opt" onclick="ans(this,false,0)">تجاهل القاعدة.</button></div><div id="r0"></div></div><div class="q"><b>2. أي جملة أفضل لتوظيف لغة الدرس؟</b><div class="opts"><button class="opt" onclick="ans(this,true,1)">${example(item().t)}</button><button class="opt" onclick="ans(this,false,1)">Je parle seulement de mathématiques.</button><button class="opt" onclick="ans(this,false,1)">Je ne comprends aucun mot.</button></div><div id="r1"></div></div><div class="q"><b>3. ماذا نفعل إذا أخطأنا؟</b><div class="opts"><button class="opt" onclick="ans(this,false,2)">نتجاهل الخطأ.</button><button class="opt" onclick="ans(this,true,2)">نقرأ سبب الخطأ ثم نعيد المحاولة.</button><button class="opt" onclick="ans(this,false,2)">نعتبر السؤال غير المجاب صحيحًا.</button></div><div id="r2"></div></div><div id="fs" class="metric"></div></div>`}window.ans=(b,ok,n)=>{if(b.parentElement.dataset.done)return;b.parentElement.dataset.done='1';b.classList.add(ok?'ok':'bad');if(ok)score++;answered++;document.getElementById('r'+n).innerHTML=ok?'✅ صحيح — تابع بنفس الطريقة.':'❌ خطأ — راجع المرحلة المرتبطة بالسؤال ثم أعد المحاولة.';if(answered===3){let p=Math.round(score/3*100);document.getElementById('fs').innerHTML=`<b>${p}%</b><br>${p>=80?'إتقان محقق 🎉':'لم تصل إلى 80% بعد — أعد التدريب.'}`}};window.checkW=()=>{let t=document.getElementById('w').value.trim(),n=t.split(/\s+/).filter(Boolean).length;document.getElementById('wr').innerHTML=n>=25?'<div class="rule">✅ إجابة بطول مناسب. راجع تصريف الأفعال، أدوات الربط، واتفاق الصفات قبل التسليم.</div>':'<div class="rule">⚠️ زد الإجابة إلى 5–7 جمل مترابطة، ثم راجع القاعدة والمفردات.</div>'};render();</script></body></html>
