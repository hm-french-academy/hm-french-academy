<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | الصف الأول الإعدادي — Source Aligned Studio</title><style>:root{--n:#173a82;--b:#2563eb;--t:#0f9f91;--p:#e92d83;--bg:#f3f6fb;--ink:#16213e;--mut:#6b7890}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans Arabic",sans-serif}.wrap{max-width:1180px;margin:auto;padding:14px}.hero,.box,.panel{background:#fff;border-radius:20px;padding:16px;margin:11px 0;box-shadow:0 5px 20px #0001}.hero{background:linear-gradient(135deg,var(--n),var(--b),var(--t));color:#fff}.hero h1{margin:8px 0}.nav{display:flex;gap:7px;overflow:auto}.nav a{padding:10px 12px;border-radius:11px;background:#edf2fb;color:var(--n);text-decoration:none;font-weight:800;white-space:nowrap}.nav a.on{background:var(--b);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.card{border:1px solid #e0e6f0;border-radius:15px;padding:14px}.fr{direction:ltr;text-align:center;font-size:21px;font-weight:900}.ar{text-align:center;color:#315aa4;margin-top:5px}.btn{border:0;border-radius:10px;padding:9px 12px;background:var(--b);color:#fff;font-weight:800;cursor:pointer}.source{border-right:5px solid var(--t)}.enrich{border-right:5px solid var(--p)}.notice{padding:12px;background:#fff8e8;border-right:4px solid #f59e0b;border-radius:10px}.small{font-size:13px;color:var(--mut);line-height:1.8}.q{margin-top:10px}.opt{margin:4px;border:1px solid #dbe2ee;border-radius:9px;padding:9px;background:#f7f9fd;cursor:pointer}.good{background:#e9f9ef}.bad{background:#fff0f2}.tabs{margin-top:11px}.stage{padding:9px;border:1px solid #e1e7f0;border-radius:10px}.done{background:#eefbf3;border-color:#21a366}</style></head><body><div class="wrap"><section class="hero"><div>🇫🇷 HM Academy · Learning Studio · الصف الأول الإعدادي</div><h1 id="title">جاري التحميل…</h1><p id="goal"></p></section><div class="box nav" id="lessons"></div><div class="box nav tabs" id="tabs"></div><main class="panel" id="panel"></main><div class="box"><b>📈 تقدم الرحلة</b><div class="small" id="state"></div></div></div><script>
const STAGES=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];
const lessons=[
['grade7-u1-l1','L’alphabet et les mots transparents','الأبجدية والكلمات الشفافة','التعرف على الأبجدية والحروف المتحركة والكلمات الشفافة.'],
['grade7-u1-l2','Les salutations','التحيات','التعرف على التحيات والتعبير عن الحالة.'],
['grade7-u1-l3','Les pronoms sujets et les verbes du 1er groupe','ضمائر الفاعل وأفعال المجموعة الأولى','استخدام الضمائر وتصريف أفعال المجموعة الأولى.'],
['grade7-u1-l4','Le verbe être et la présentation','فعل être والتقديم','استخدام être والتعريف بالنفس والآخرين.'],
['grade7-u1-l5','Les nombres (0-20)','الأعداد من 0 إلى 20','قراءة وكتابة الأعداد من 0 إلى 20.'],
['grade7-u1-l6','L’heure','الساعة','قراءة الوقت والتعبير عنه بالفرنسية.'],
['grade7-u2-l1','Tu as quel âge ?','كم عمرك؟','السؤال عن العمر والإجابة عنه باستخدام avoir.'],
['grade7-u2-l2','Qu’est-ce que c’est ? Les objets de la classe','ما هذا؟ أدوات الفصل','استخدام أدوات النكرة والتحدث عن أدوات الفصل والحقيبة.'],
['grade7-u3-l1','Les couleurs','الألوان','التعرف على الألوان واستخدام صفة اللون مع الاسم.'],
['grade7-u3-l2','Les articles définis et les jours de la semaine','أدوات المعرفة وأيام الأسبوع','اختيار أداة المعرفة المناسبة والتعرف على أيام الأسبوع.'],
['grade7-u3-l3','Les mois de l’année et les saisons','شهور السنة والفصول','التعرف على الشهور والفصول والطقس وربط الشهر بالفصل.']
];
const l1V=[['A','arbre — شجرة'],['E','éléphant — فيل'],['I','image — صورة'],['O','orange — برتقالة'],['U','uniforme — زي مدرسي'],['Y','yoyo — يويو'],['H','hôpital — مستشفى'],['Un pyjama','بيجاما'],['Un pantalon','بنطلون'],['Un taxi','تاكسي'],['Un domino','دومينو'],['Un canapé','كنبة'],['Un téléphone','تليفون'],['Un biscuit','بسكويت'],['Un balcon','بلكونة'],['Un vase','فازة'],['Un ascenseur','أسانسير'],['Une caméra','كاميرا'],['Un autobus','أوتوبيس'],['Un gilet','جيلية'],['Une écharpe','إيشارب'],['Un bouquet','باقة ورد'],['Une guitare','جيتار'],['Une télévision','تليفزيون'],['Une plage','شاطئ'],['Une lampe','لمبة'],['Une raquette','مضرب'],['Une radio','راديو'],['Un piano','بيانو'],['Un garage','جراج'],['Un cinéma','سينما'],['Un journal','جورنال']];
const l1Q=[['ما الحرف الذي تبدأ به كلمة éléphant؟','E',['A','E','O']],['اختر الكلمة الشفافة لـ تليفون','Un téléphone',['Un taxi','Un téléphone','Un piano']],['ما معنى Un autobus؟','أوتوبيس',['أوتوبيس','تاكسي','دراجة']],['أي حرف يُنطق /igʁɛk/؟','Y',['W','Y','H']],['اختر الكلمة الشفافة لـ جيتار','Une guitare',['Une radio','Une guitare','Un vase']]];
const generic={
'grade7-u1-l2':[['Salut !','مرحبًا'],['Bonjour','مرحبًا / صباح الخير'],['Bonsoir','مساء الخير'],['Ça va bien.','أنا بخير'],['Ça va mal.','أنا لست بخير'],['Comme ci, comme ça.','هكذا هكذا']],
'grade7-u1-l3':[['Je','أنا'],['Tu','أنت'],['Il','هو'],['Elle','هي'],['Nous','نحن'],['Vous','أنتم'],['Ils','هم'],['Elles','هنّ']],
'grade7-u1-l4':[['Je suis','أنا'],['Tu es','أنت'],['Il / Elle est','هو / هي'],['Nous sommes','نحن'],['Vous êtes','أنتم'],['Ils / Elles sont','هم / هنّ']],
'grade7-u1-l5':[['zéro','0'],['un','1'],['deux','2'],['trois','3'],['quatre','4'],['cinq','5'],['six','6'],['sept','7'],['huit','8'],['neuf','9'],['dix','10'],['onze','11'],['douze','12'],['treize','13'],['quatorze','14'],['quinze','15'],['seize','16'],['dix-sept','17'],['dix-huit','18'],['dix-neuf','19'],['vingt','20']],
'grade7-u1-l6':[['Il est une heure','1:00'],['Il est deux heures cinq','2:05'],['Il est deux heures dix','2:10'],['Il est deux heures et quart','2:15'],['Il est deux heures vingt','2:20'],['Il est deux heures et demie','2:30'],['Il est trois heures moins vingt','2:40'],['Il est trois heures moins le quart','2:45'],['Il est trois heures moins cinq','2:55'],['Il est midi','12:00'],['Il est minuit','00:00']]
};
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';speechSynthesis.speak(u)}}function p(){const q=new URLSearchParams(location.search);return[q.get('id')||'grade7-u1-l1',q.get('section')||'introduction']}function storage(id,s){return 'hm-g7-aligned:'+id+':'+s}function done(id,s){return localStorage.getItem(storage(id,s))==='1'}function mark(id,s){localStorage.setItem(storage(id,s),'1')}function nav(id,s){lessonsEl.innerHTML=lessons.map(x=>`<a class="${x[0]===id?'on':''}" href="?id=${x[0]}&section=${s}">${esc('الدرس '+(lessons.indexOf(x)+1))}</a>`).join('');tabsEl.innerHTML=STAGES.map(x=>`<a class="${x[0]===s?'on':''}" href="?id=${id}&section=${x[0]}">${x[1]}</a>`).join('')}function cards(a){return `<div class="grid">${a.map(x=>`<article class="card"><div class="fr">${esc(x[0])}</div><div class="ar">${esc(x[1])}</div><button class="btn" onclick='speak(${JSON.stringify(String(x[0]))})'>🔊 استمع</button></article>`).join('')}</div>`}function quiz(a){return `<div>${a.map((q,i)=>`<article class="card q"><b>${i+1}. ${esc(q[0])}</b><div>${q[2].map(o=>`<button class="opt" onclick="this.parentElement.querySelectorAll('.opt').forEach(x=>x.disabled=true);this.classList.add(${JSON.stringify(o===q[1]?'good':'bad')})">${esc(o)}</button>`).join('')}</div></article>`).join('')}</div>`}
const lessonsEl=document.getElementById('lessons'),tabsEl=document.getElementById('tabs');function render(){const [id,s]=p();const meta=lessons.find(x=>x[0]===id)||lessons[0];document.getElementById('title').textContent=meta[1]+' — '+meta[2];document.getElementById('goal').textContent=meta[3];nav(meta[0],s);let h='';if(s==='introduction'){h=`<div class="card source"><h2>🚀 بداية الدرس</h2><p>${esc(meta[3])}</p><p class="small">هذه الصفحة تستخدم معرف الدرس المعتمد في المنهج، ولا تستبدل محتوى المصدر بمحتوى من درس آخر.</p></div>`}else if(s==='vocabulary'){let v=id==='grade7-u1-l1'?l1V:(generic[id]||[]);h=v.length?cards(v):`<div class="notice">محتوى المصدر التفصيلي لهذا الدرس غير قابل للاسترجاع من ملفات المستودع حاليًا. لن يتم اختلاق مفردات بديلة.</div>`}else if(s==='pronunciation'){let v=id==='grade7-u1-l1'?l1V:(generic[id]||[]);h=v.length?cards(v):`<div class="notice">مصدر النطق الأصلي غير متاح للاسترجاع حاليًا؛ لم يتم اختلاق مادة بديلة.</div>`}else if(s==='grammar'){h=`<div class="card enrich"><h2>📘 ملاحظات لغوية</h2><p>${esc(meta[3])}</p><div class="notice">أي إثراء هنا تعليمي فقط ولا يُنسب إلى المصدر الرسمي ما لم تتم مراجعته مقابل المصدر.</div></div>`}else if(s==='conversation'){h=`<div class="card enrich"><h2>💬 المحادثة</h2><div class="notice">لا يتم إنشاء حوار منسوب للمصدر قبل التحقق من قسم الحوار في الملف الأصلي.</div></div>`}else if(s==='practice'){h=id==='grade7-u1-l1'?quiz(l1Q):`<div class="notice">التدريبات الأصلية لهذا الدرس تحتاج مصدرها القابل للاسترجاع قبل اعتمادها نهائيًا.</div>`}else if(s==='video'){h=`<div class="card"><h2>🎬 الفيديو</h2><div class="notice">يتم تشغيل أصل الفيديو فقط عند توفر الـasset الموثق؛ لا يوجد رابط مختلق.</div></div>`}else if(s==='games'){h=`<div class="card enrich"><h2>🎮 لعبة تعليمية</h2><div class="notice">الألعاب النهائية لا تُعتمد قبل ربط كل سؤال بعنصر موثق من المصدر.</div></div>`}else if(s==='smart-review'){h=`<div class="card enrich"><h2>🧠 المراجعة الذكية</h2><p>تُبنى من عناصر الدرس الموثقة وأخطاء المتعلم فقط.</p></div>`}else if(s==='assessment'){h=id==='grade7-u1-l1'?`<div class="card source"><h2>🏆 التقييم</h2><p>الاختبار التمهيدي المنظم المتاح للدرس الأول:</p>${quiz(l1Q)}</div>`:`<div class="notice">التقييم الرسمي الكامل لهذا الدرس لا يُعرض كمكتمل قبل استرجاع ملف التقييم الأصلي والتحقق منه.</div>`}else{h=`<div class="card"><h2>📈 التقدم</h2><div class="grid">${STAGES.map(x=>`<div class="stage ${done(id,x[0])?'done':''}">${x[1]} — ${done(id,x[0])?'✓':'○'}</div>`).join('')}</div></div>`}document.getElementById('panel').innerHTML=h;mark(id,s);const n=STAGES.filter(x=>done(id,x[0])).length;document.getElementById('state').textContent=`${n} / ${STAGES.length} مراحل مكتملة`;}
render();</script></body></html>
