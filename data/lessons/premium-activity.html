<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Premium Activity</title><style>body{margin:0;background:#f3f6fb;color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:950px;margin:auto;padding:18px 10px}.hero,.card{background:#fff;border:1px solid #e1e7f0;border-radius:22px;box-shadow:0 12px 32px #14264a0b}.hero{padding:25px;background:linear-gradient(135deg,#17357a,#2563eb,#12a594);color:#fff}.hero h1{margin:8px 0;font-size:clamp(27px,6vw,42px)}.hero p{line-height:1.8}.card{padding:20px;margin-top:14px}.q{padding:17px;border:1px solid #e1e7f0;border-radius:17px;margin-top:10px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.choice{border:1px solid #d4ddeb;background:#fff;border-radius:12px;padding:11px;font-weight:900;cursor:pointer}.choice.correct{background:#eaf8f1;border-color:#6fc79a}.choice.wrong{background:#fff0f3;border-color:#ef9aaa}.feedback{min-height:20px;margin-top:7px;font-weight:900}.result{font-size:22px;font-weight:900;color:#2452a4}.action{border:0;border-radius:13px;padding:12px 15px;background:#e92d83;color:#fff;font-weight:900}@media(max-width:600px){.choices{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><b id="unit"></b><h1 id="title"></h1><p id="sub"></p></section><section class="card"><h2 id="heading"></h2><p>هذا النشاط مستقل عن الدرس الرئيسي ويستخدم للتدريب أو التقييم دون خلط النتيجة مع إكمال الدرس.</p><div id="items"></div><div id="result" class="result"></div></section></main><script>const p=new URLSearchParams(location.search),id=p.get('lesson')||'grade8-u2-l1',mode=p.get('mode')||'games';let R,L,U,score=0,answered=0;const $=s=>document.querySelector(s);function questions(){if(U.id==='unit-2'&&L.number===3)return[['اختر: Je … une chambre.',['ai','suis','ont'],0],['اختر: Nous … à la maison.',['avons','sommes','êtes'],1],['اختر: Ils … un canapé.',['ont','sont','êtes'],0]];if(U.id==='unit-2'&&L.number===4)return[['Le livre est … la table.',['sur','entre','chez'],0],['اختر الملكية الصحيحة: … armoire',['mon','ma','mes'],0],['Le sac est … la chaise.',['sous','cette','mes'],0]];if(U.id==='unit-3'&&L.number===3)return[['… valise',['ce','cette','ces'],1],['Je … à Paris.',['vais','va','allez'],0],['Nous … le train.',['prenons','prend','prenez'],0]];if(U.id==='unit-3'&&L.number===4)return[['Je vais … Maroc.',['à','au','en'],1],['Je vais … Égypte.',['au','en','aux'],1],['Je vais … Paris.',['à','au','aux'],0]];return[['اختر الكلمة الصحيحة لموضوع الدرس.',['La chambre','Les sciences','La musique'],0],['اختر الكلمة المناسبة للسفر.',['Une valise','Un tableau','Une gomme'],0],['اختر الإجابة المرتبطة بموضوع الدرس.',['حسب محتوى الدرس','موضوع آخر','لا شيء'],0]]}function render(){const qs=questions();$('#unit').textContent=U.titleAr+' · HM Academy Premium';$('#title').textContent=L.titleAr;$('#sub').textContent=L.titleFr+' · '+(mode==='assessment'?'تقييم مستقل':'لعبة تدريبية مستقلة');$('#heading').textContent=mode==='assessment'?'📝 التقييم الإلكتروني':'🎮 اللعبة التعليمية';$('#items').innerHTML=qs.map((q,i)=>`<article class="q"><b>${i+1}. ${q[0]}</b><div class="choices">${q[1].map((o,k)=>`<button class="choice" onclick="ans(${i},${k},this)">${o}</button>`).join('')}</div><div id="f${i}" class="feedback"></div></article>`).join('')}function ans(i,k,b){const q=questions()[i],box=$('#f'+i);if(box.dataset.done)return;box.dataset.done='1';answered++;if(k===q[2]){score++;b.classList.add('correct');box.textContent='✓ إجابة صحيحة'}else{b.classList.add('wrong');box.textContent='✗ إجابة غير صحيحة'}if(answered===questions().length){$('#result').textContent=`النتيجة: ${score} / ${questions().length}`}}fetch('grade-8/lesson-registry.json').then(r=>r.json()).then(x=>{R=x;for(const u of R.includedUnits)for(const l of u.lessons||[])if(l.id===id){U=u;L=l}if(L)render()});</script></body></html>
