<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="HM Academy Premium independent assessment and games"><title>HM Academy | Premium Activity</title><style>:root{--b:#2563eb;--p:#e92d83;--t:#12a594;--line:#dfe6f0;--m:#68758b;--bg:#f3f6fb}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8faff,var(--bg));color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:1000px;margin:auto;padding:18px 10px 50px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 34px #14264a0b}.hero{padding:26px;color:#fff;background:linear-gradient(135deg,#17357a,#2563eb 55%,#12a594)}.hero h1{margin:8px 0;font-size:clamp(28px,6vw,44px)}.hero p{line-height:1.8}.badges{display:flex;gap:8px;flex-wrap:wrap}.badge{padding:7px 10px;border-radius:99px;background:#ffffff18;border:1px solid #ffffff30;font-weight:900}.card{padding:20px;margin-top:14px}.q{padding:16px;border:1px solid var(--line);border-radius:17px;margin-top:10px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.choice{border:1px solid #d4ddeb;background:#fff;border-radius:12px;padding:11px;font-weight:900;cursor:pointer}.choice:disabled{cursor:default}.choice.correct{background:#eaf8f1;border-color:#6fc79a}.choice.wrong{background:#fff0f3;border-color:#ef9aaa}.feedback{min-height:20px;margin-top:8px;font-weight:900}.result{font-size:23px;font-weight:900;color:#2452a4;margin-top:16px}.bar{height:10px;background:#e9eef6;border-radius:99px;overflow:hidden;margin-top:14px}.bar span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--b),var(--t));transition:.25s}.muted{color:var(--m);line-height:1.8}@media(max-width:650px){.choices{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><div id="unit"></div><h1 id="title">جارٍ التحميل…</h1><p id="sub"></p><div class="badges"><span class="badge">✨ Premium</span><span class="badge">🎯 مستقل</span><span class="badge">🏆 30 نقطة</span><span class="badge">💾 لا يغيّر إكمال الدرس</span></div></section><section class="card"><h2 id="heading"></h2><p class="muted" id="intro"></p><div id="items"></div><div class="bar"><span id="bar"></span></div><div id="result" class="result"></div></section></main><script>const p=new URLSearchParams(location.search),id=p.get('lesson')||'grade8-u2-l1',mode=p.get('mode')||'games';let L,U,C,score=0,answered=0;const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));function buildQuestions(c){const out=c.practice.map(q=>({text:q[0],choices:q[1],correct:q[2]}));c.vocab.slice(0,6).forEach((x,i)=>{const wrong=c.vocab.filter(y=>y[0]!==x[0]).slice(i+1,i+3).map(y=>y[1]);if(wrong.length===2)out.push({text:'ما معنى «'+x[0]+'»؟',choices:[x[1],...wrong],correct:0})});return out.slice(0,10)}function render(){C=buildQuestions(C);if(mode==='games')C=C.sort(()=>Math.random()-.5);$('#unit').textContent=U.titleAr+' · HM Academy Premium';$('#title').textContent=L.titleAr;$('#sub').textContent=L.titleFr+' · '+(mode==='assessment'?'تقييم مستقل — 10 أسئلة × 3 نقاط':'لعبة تعليمية مستقلة — 10 جولات');$('#heading').textContent=mode==='assessment'?'📝 التقييم المستقل':'🎮 اللعبة التعليمية';$('#intro').textContent=mode==='assessment'?'هذا التقييم منفصل عن التدريب الفوري داخل الدرس. الدرجة الكاملة 30 نقطة، ولا يُسجّل إكمال الدرس تلقائيًا.':'هذه اللعبة مستقلة عن التقييم الرسمي وعن إكمال الدرس. الهدف تثبيت المفردات والقواعد بطريقة سريعة.';$('#items').innerHTML=C.map((q,i)=>`<article class="q"><b>${i+1}. ${esc(q.text)}</b><div class="choices">${q.choices.map((o,k)=>`<button class="choice" onclick="ans(${i},${k},this)">${esc(o)}</button>`).join('')}</div><div id="f${i}" class="feedback"></div></article>`).join('')}function ans(i,k,b){const q=C[i],box=$('#f'+i);if(box.dataset.done)return;box.dataset.done='1';answered++;document.querySelectorAll('.q')[i].querySelectorAll('.choice').forEach(x=>x.disabled=true);if(k===q.correct){score++;b.classList.add('correct');box.textContent='✓ إجابة صحيحة'}else{b.classList.add('wrong');document.querySelectorAll('.q')[i].querySelectorAll('.choice')[q.correct].classList.add('correct');box.textContent='✗ إجابة غير صحيحة — راجع الشرح في الدرس'}$('#bar').style.width=(answered/C.length*100)+'%';if(answered===C.length)$('#result').textContent=(mode==='assessment'?'النتيجة: ':'نتيجة اللعبة: ')+score+' / '+C.length+' · '+(score*3)+' نقطة'}Promise.all([fetch('premium-course-map.json?v=20260812-2',{cache:'no-store'}),fetch('lesson-registry.json?v=20260812-2',{cache:'no-store'})]).then(async r=>{const map=await r[0].json(),reg=await r[1].json();for(const u of reg.includedUnits)for(const l of u.lessons||[])if(l.id===id){U=u;L=l;C=map.units[u.id].lessons[String(l.number)]}if(L&&C)render();else throw Error('lesson not found')}).catch(e=>{$('#title').textContent='تعذر تحميل النشاط';$('#sub').textContent='أعد فتح الصفحة بعد اكتمال تحديث المنصة.';console.error(e)});</script></body></html>
