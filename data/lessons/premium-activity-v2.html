<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Premium Activity</title><style>body{margin:0;background:#f3f6fb;color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:1000px;margin:auto;padding:18px 10px 50px}.hero,.card{background:#fff;border:1px solid #dfe6f0;border-radius:24px;box-shadow:0 12px 34px #14264a0b}.hero{padding:26px;color:#fff;background:linear-gradient(135deg,#17357a,#2563eb 55%,#12a594)}.hero h1{font-size:clamp(28px,6vw,44px);margin:8px 0}.hero p{line-height:1.8}.badges{display:flex;gap:8px;flex-wrap:wrap}.badge{padding:7px 10px;border-radius:99px;background:#ffffff18;border:1px solid #ffffff30;font-weight:900}.card{padding:20px;margin-top:14px}.q{padding:16px;border:1px solid #dfe6f0;border-radius:17px;margin-top:10px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.choice{border:1px solid #d4ddeb;background:#fff;border-radius:12px;padding:11px;font-weight:900;cursor:pointer}.choice:disabled{cursor:default}.correct{background:#eaf8f1!important;border-color:#70c99d!important}.wrong{background:#fff0f3!important;border-color:#ef9bad!important}.feedback{min-height:20px;margin-top:8px;font-weight:900}.muted{color:#68758b;line-height:1.8}.bar{height:10px;background:#e9eef6;border-radius:99px;overflow:hidden}.bar span{display:block;width:0;height:100%;background:linear-gradient(90deg,#2563eb,#12a594);transition:.25s}.result{font-size:23px;font-weight:900;color:#2452a4;margin-top:16px}@media(max-width:650px){.choices{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><div id="unit"></div><h1 id="title">جارٍ التحميل…</h1><p id="sub"></p><div class="badges"><span class="badge">✨ Premium</span><span class="badge">🎯 مستقل</span><span class="badge">🏆 30 نقطة</span></div></section><section class="card"><h2 id="heading"></h2><p id="intro" class="muted"></p><div id="items"></div><div class="bar"><span id="bar"></span></div><div id="result" class="result"></div></section></main><script>const p=new URLSearchParams(location.search),id=p.get('lesson')||'grade8-u1-l1',mode=p.get('mode')||'games';let C,L,U,score=0,answered=0;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));function build(c){const q=(c.practice||[]).map(x=>({text:x[0],choices:x[1],correct:x[2]}));(c.vocab||[]).slice(0,6).forEach((x,i)=>{const wrong=(c.vocab||[]).filter(y=>y[0]!==x[0]).slice(i+1,i+3).map(y=>y[1]);if(wrong.length===2)q.push({text:'ما معنى «'+x[0]+'»؟',choices:[x[1],...wrong],correct:0})});return q.slice(0,10)}async function boot(){try{const [m,r]=await Promise.all([fetch('premium-course-map.json?v=20260812-4',{cache:'no-store'}),fetch('grade-8/lesson-registry.json?v=20260812-4',{cache:'no-store'})]);const map=await m.json(),reg=await r.json();for(const u of reg.includedUnits)for(const l of u.lessons||[])if(l.id===id){U=u;L=l;C=map.units[u.id].lessons[String(l.number)]}if(!C)throw Error('lesson not found');render()}catch(e){title.textContent='تعذر تحميل النشاط';sub.textContent='أعد تحميل الصفحة بعد اكتمال تحديث المنصة.';console.error(e)}}function render(){const qs=build(C);if(mode==='games')qs.sort(()=>Math.random()-.5);unit.textContent=U.titleAr+' · HM Academy Premium';title.textContent=C.titleAr;sub.textContent=C.titleFr+' · '+(mode==='assessment'?'تقييم مستقل — 10 أسئلة × 3 نقاط':'لعبة تعليمية مستقلة — 10 جولات');heading.textContent=mode==='assessment'?'📝 التقييم المستقل':'🎮 اللعبة التعليمية';intro.textContent=mode==='assessment'?'هذا التقييم منفصل عن التدريب الفوري ولا يغيّر إكمال الدرس.':'هذه اللعبة مستقلة عن التقييم الرسمي وتهدف إلى تثبيت المهارة.';items.innerHTML=qs.map((q,i)=>`<article class="q"><b>${i+1}. ${esc(q.text)}</b><div class="choices">${q.choices.map((o,k)=>`<button class="choice" onclick="ans(${i},${k},this)">${esc(o)}</button>`).join('')}</div><div id="f${i}" class="feedback"></div></article>`).join('');window.Q=qs;window.total=qs.length}function ans(i,k,b){const q=Q[i],f=$('#f'+i);if(f.dataset.done)return;f.dataset.done='1';document.querySelectorAll('.q')[i].querySelectorAll('.choice').forEach(x=>x.disabled=true);if(k===q.correct){score++;b.classList.add('correct');f.textContent='✓ إجابة صحيحة'}else{b.classList.add('wrong');document.querySelectorAll('.q')[i].querySelectorAll('.choice')[q.correct].classList.add('correct');f.textContent='✗ إجابة غير صحيحة — راجع الشرح'}answered++;bar.style.width=answered/total*100+'%';if(answered===total)result.textContent=(mode==='assessment'?'النتيجة: ':'نتيجة اللعبة: ')+score+' / '+total+' · '+score*3+' نقطة'}boot();</script></body></html>
