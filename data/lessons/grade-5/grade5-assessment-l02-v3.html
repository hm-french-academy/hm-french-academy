<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="cache-control" content="no-cache,no-store,must-revalidate"><title>HM Academy | تقييم الدرس الثاني</title><style>body{margin:0;font-family:Arial,Cairo,sans-serif;background:#f4f7fb;color:#17223b}.wrap{max-width:850px;margin:auto;padding:24px 14px 60px}.hero,.card{background:#fff;border:1px solid #e0e7f0;border-radius:24px;padding:22px;margin-top:16px}.hero{background:linear-gradient(135deg,#173a82,#2563eb);color:#fff}.q{font-size:20px;font-weight:900;line-height:1.7}.opts{display:grid;gap:10px;margin-top:14px}.opts button{padding:14px;border:1px solid #d8e0eb;background:#f8fafc;border-radius:13px;text-align:right;font-weight:800;cursor:pointer}.opts button.correct{border-color:#16834b;background:#eaf8f0}.opts button.wrong{border-color:#b42318;background:#fff0ef}.opts button:disabled{cursor:default;opacity:.8}.fb{min-height:28px;margin-top:12px;font-weight:900;line-height:1.7}.next{margin-top:12px;padding:10px 15px;border:0;border-radius:11px;background:#2563eb;color:#fff;font-weight:900;cursor:pointer}.result{text-align:center}.score{font-size:42px;font-weight:900}.back{display:inline-block;margin-top:18px;color:#315fc8;font-weight:900;text-decoration:none}</style></head><body><main class="wrap"><section class="hero"><h1>🏆 تقييم الدرس الثاني</h1><p>Les déterminants — un, une, des, le, la, l’ et les</p><p>11 سؤالًا مستقلاً خاصًا بالدرس الثاني.</p></section><section id="quiz"></section><section id="result" class="card result" hidden><div class="score" id="score"></div><h2>انتهى التقييم</h2><p id="resultText"></p><button class="next" type="button" id="retry">إعادة التقييم</button></section><a class="back" href="../../../grade-5-lesson-v3.html?id=g5-t1-l02&section=overview&build=20260822-final1">← العودة إلى الدرس الثاني</a></main><script>(()=>{'use strict';const qs=[['اختر الأداة الصحيحة: ___ stylo',['un','une','des'],'un','stylo مذكر مفرد.'],['اختر الأداة الصحيحة: ___ gomme',['un','une','des'],'une','gomme مؤنث مفرد.'],['اختر الأداة الصحيحة: ___ stylos (غير محدد)',['un','une','des'],'des','des للجمع غير المحدد.'],['اختر أداة التعريف: ___ stylos (محدد)',['le','la','les'],'les','les للجمع المحدد.'],['اختر أداة التعريف: ___ animal',['le','la','l’'],'l’','animal مفرد ويبدأ بحرف متحرك.'],['ما أداة التعريف للمذكر المفرد؟',['le','la','les'],'le','le للمذكر المفرد.'],['ما أداة التعريف للمؤنث المفرد؟',['le','la','les'],'la','la للمؤنث المفرد.'],['ما أداة التنكير للمؤنث المفرد؟',['un','une','des'],'une','une للمؤنث المفرد.'],['ما أداة التنكير للجمع؟',['un','une','des'],'des','des للجمع.'],['ما أداة التعريف للجمع؟',['le','la','les'],'les','les للجمع.'],['متى نستخدم l’؟',['قبل الاسم المفرد الذي يبدأ بحرف متحرك','قبل كل جمع','قبل المذكر فقط'],'قبل الاسم المفرد الذي يبدأ بحرف متحرك','l’ تستخدم قبل الاسم المفرد الذي يبدأ بحرف متحرك.']];let i=0,score=0,locked=false;const quiz=document.getElementById('quiz'),result=document.getElementById('result'),scoreEl=document.getElementById('score'),resultText=document.getElementById('resultText');function render(){locked=false;const x=qs[i];quiz.innerHTML=`<section class="card"><div class="q">${i+1} / ${qs.length}. ${x[0]}</div><div class="opts">${x[1].map(o=>`<button type="button" data-answer="${o.replace(/"/g,'&quot;')}">${o}</button>`).join('')}</div><div class="fb" aria-live="polite"></div><button class="next" type="button" id="next" hidden>${i===qs.length-1?'إنهاء التقييم':'السؤال التالي'}</button></section>`}quiz.addEventListener('click',e=>{const b=e.target.closest('[data-answer]');if(b&&!locked){locked=true;const x=qs[i],ok=b.dataset.answer===x[2];if(ok)score++;quiz.querySelectorAll('[data-answer]').forEach(btn=>{btn.disabled=true;if(btn.dataset.answer===x[2])btn.classList.add('correct')});if(!ok)b.classList.add('wrong');quiz.querySelector('.fb').textContent=ok?'✅ صحيح! '+x[3]:'❌ غير صحيح. الإجابة الصحيحة: '+x[2]+' — '+x[3];quiz.querySelector('#next').hidden=false;return}if(e.target.id==='next'&&locked){i++;if(i>=qs.length){quiz.hidden=true;result.hidden=false;scoreEl.textContent=score+' / '+qs.length;const pct=Math.round(score/qs.length*100);resultText.textContent=pct>=80?'ممتاز! أهداف الدرس واضحة ومتحققة.':pct>=60?'جيد، راجع الأخطاء ثم أعد المحاولة.':'راجع شرح الأدوات ثم أعد التقييم.'}else render()}});document.getElementById('retry').addEventListener('click',()=>{i=0;score=0;result.hidden=true;quiz.hidden=false;render()});render()})();</script></body></html>
