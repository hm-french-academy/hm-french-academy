<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="cache-control" content="no-cache,no-store,must-revalidate"><title>HM Academy | التقييم التفاعلي — الدرس الثاني</title><style>body{margin:0;font-family:Arial,Cairo,sans-serif;background:#f4f7fb;color:#17223b}.wrap{max-width:900px;margin:auto;padding:24px}.hero,.card{border-radius:22px;padding:22px;margin-top:16px}.hero{background:linear-gradient(135deg,#173a82,#16a394);color:#fff}.card{background:#fff;border:1px solid #dfe6ef}.q{font-size:21px;font-weight:900;line-height:1.8}.opts{display:grid;gap:10px;margin-top:16px}.opts button{padding:14px;border:2px solid #d8e0eb;background:#f8fafc;border-radius:13px;text-align:right;font-weight:800;font-size:17px}.correct{border-color:#16834b!important;background:#eaf8f0!important}.wrong{border-color:#b42318!important;background:#fff0ef!important}.fb{min-height:45px;margin-top:14px;font-weight:900;line-height:1.8}.next{margin-top:12px;padding:11px 18px;border:0;border-radius:11px;background:#173a82;color:#fff;font-weight:900}.result{text-align:center}.score{font-size:42px;font-weight:900}</style></head><body><main class="wrap"><section class="hero"><h1>🎯 التقييم التفاعلي</h1><p>الدرس الثاني — Les déterminants</p><p>هذا تقييم مهاري مستقل؛ لا يكرر الاختبار الإلكتروني الرسمي.</p></section><section id="quiz"></section><section id="result" class="card result" hidden><div class="score" id="score"></div><h2>انتهى التقييم التفاعلي</h2><p>هذه النتيجة خاصة بالتقييم التفاعلي فقط.</p><button class="next" id="retry">إعادة التقييم</button><br><a href="grade5-assessment-l02.html">الانتقال إلى الاختبار الإلكتروني الرسمي</a></section></main><script>(()=>{const Q=[['لديك: «___ stylo est bleu.» اختر الأداة التي تجعل الاسم محددًا.',['Le','Un','Des'],'Le','لأننا نتحدث عن قلم محدد.'],['أي جملة صحيحة؟',['Une gomme est sur la table.','Un gomme est sur la table.','Des gomme est sur la table.'],'Une gomme est sur la table.','gomme مؤنث مفرد.'],['اختر العبارة التي تعبّر عن جمع محدد.',['les stylos','des stylo','une stylos'],'les stylos','les أداة تعريف للجمع.'],['أي عبارة تعبّر عن جمع غير محدد؟',['des stylos','les stylos','le stylo'],'des stylos','des أداة تنكير للجمع.'],['اختر الصيغة الصحيحة قبل «animal» عندما يكون الاسم مفردًا محددًا.',['l’animal','la animal','le animal'],'l’animal','نستخدم l’ قبل الاسم المفرد الذي يبدأ بحرف متحرك.'],['إذا كان الاسم مذكرًا مفردًا وغير محدد، ماذا نختار؟',['un','une','des'],'un','un للمذكر المفرد.'],['إذا كان الاسم مؤنثًا مفردًا وغير محدد، ماذا نختار؟',['une','un','des'],'une','une للمؤنث المفرد.'],['أي مجموعة تمثل التعريف حسب الجنس والعدد؟',['le · la · l’ · les','un · une · des','un · la · des'],'le · la · l’ · les','هذه أدوات التعريف.'],['أي مجموعة تمثل التنكير؟',['un · une · des','le · la · l’ · les','le · une · les'],'un · une · des','هذه أدوات التنكير.'],['في «Les stylos sont sur la table»، لماذا استُخدمت «Les»؟',['لأن الاسم جمع ومحدد','لأن الاسم مؤنث مفرد','لأن الاسم مذكر مفرد'],'لأن الاسم جمع ومحدد','Les للتعريف مع الجمع.']];let i=0,s=0,locked=false;const quiz=document.getElementById('quiz'),res=document.getElementById('result');function render(){locked=false;const x=Q[i];quiz.innerHTML='<section class="card"><div class="q">سؤال '+(i+1)+' من '+Q.length+'<br>'+x[0]+'</div><div class="opts">'+x[1].map(o=>'<button data-v="'+o.replaceAll('"','&quot;')+'">'+o+'</button>').join('')+'</div><div class="fb" id="fb"></div><button class="next" id="next" hidden>'+((i===Q.length-1)?'إنهاء':'التالي')+'</button></section>'}quiz.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b||locked)return;locked=true;const x=Q[i],ok=b.dataset.v===x[2];if(ok)s++;quiz.querySelectorAll('[data-v]').forEach(z=>{z.disabled=true;if(z.dataset.v===x[2])z.classList.add('correct')});if(!ok)b.classList.add('wrong');document.getElementById('fb').textContent=(ok?'✅ صحيح! ':'❌ غير صحيح. الإجابة الصحيحة: '+x[2]+' — ')+x[3];document.getElementById('next').hidden=false});quiz.addEventListener('click',e=>{if(e.target.id!=='next'||!locked)return;i++;if(i<Q.length)render();else{quiz.hidden=true;res.hidden=false;document.getElementById('score').textContent=s+' / '+Q.length;try{localStorage.setItem('hm-g5-l02-interactive-score',String(Math.round(s/Q.length*100)))}catch(e){}}});document.getElementById('retry').onclick=()=>{i=0;s=0;res.hidden=true;quiz.hidden=false;render()};render()})();</script></body></html>
