<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | تقييم الدرس الثاني</title><style>body{margin:0;font-family:Arial,Cairo,sans-serif;background:#f4f7fb;color:#17223b}.wrap{max-width:850px;margin:auto;padding:24px 14px 60px}.hero{background:linear-gradient(135deg,#173a82,#2563eb);color:#fff;border-radius:28px;padding:26px}.card{background:#fff;border:1px solid #e0e7f0;border-radius:22px;padding:22px;margin-top:16px}.q{font-size:20px;font-weight:900;line-height:1.7}.opts{display:grid;gap:10px;margin-top:14px}.opts button{padding:13px;border:1px solid #d8e0eb;background:#f8fafc;border-radius:13px;text-align:right;font-weight:800}.opts button:disabled{opacity:.8}.fb{min-height:28px;margin-top:12px;font-weight:900}.next{margin-top:12px;padding:10px 15px;border:0;border-radius:11px;background:#2563eb;color:#fff;font-weight:900}.result{display:none;text-align:center}.score{font-size:42px;font-weight:900}.back{display:inline-block;margin-top:18px;color:#315fc8;font-weight:900;text-decoration:none}</style></head><body><main class="wrap"><section class="hero"><h1>🏆 تقييم الدرس الثاني</h1><p>Les déterminants — un, une, des, le, la, l’ et les</p><p>التقييم يقيس أهداف الدرس الثاني فقط.</p></section><section id="quiz"></section><section id="result" class="card result"><div class="score" id="score"></div><h2>انتهى التقييم</h2><p>راجع القاعدة أو أعد المحاولة لتحسين نتيجتك.</p><button class="next" onclick="location.reload()">إعادة التقييم</button></section><a class="back" href="../../../grade-5-lesson-v3.html?id=g5-t1-l02&section=overview">← العودة إلى الدرس الثاني</a></main><script>const qs=[['اختر الأداة الصحيحة: ___ stylo',['un','une','des'],'un','stylo مذكر مفرد.'],['اختر الأداة الصحيحة: ___ gomme',['un','une','des'],'une','gomme مؤنث مفرد.'],['اختر الأداة الصحيحة: ___ stylos',['le','la','les'],'les','stylos جمع محدد.'],['اختر الأداة الصحيحة: ___ stylos',['un','une','des'],'des','stylos جمع غير محدد.'],['اختر الأداة الصحيحة: ___ animal',['le','la','l’'],'l’','animal مفرد ويبدأ بحرف متحرك.'],['ما أداة التعريف للمذكر المفرد؟',['le','la','les'],'le','le للمذكر المفرد.'],['ما أداة التعريف للمؤنث المفرد؟',['le','la','les'],'la','la للمؤنث المفرد.'],['ما أداة التنكير للمؤنث المفرد؟',['un','une','des'],'une','une للمؤنث المفرد.'],['ما أداة التنكير للجمع؟',['un','une','des'],'des','des للجمع.'],['ما أداة التعريف للجمع؟',['le','la','les'],'les','les للجمع.'],['متى نستخدم l’؟',['قبل حرف متحرك','قبل كل جمع','قبل المذكر فقط'],'قبل حرف متحرك','نستخدم l’ قبل الاسم المفرد الذي يبدأ بحرف متحرك.']];let i=0,score=0;function render(){const x=qs[i];quiz.innerHTML=`<section class="card"><div class="q">${i+1}. ${x[0]}</div><div class="opts">${x[1].map(o=>`<button onclick="answer(this,${JSON.stringify(o)})">${o}</button>`).join('')}</div><div class="fb" id="fb"></div><button class="next" id="next" style="display:none" onclick="nextQ()">${i===qs.length-1?'إنهاء التقييم':'السؤال التالي'}</button></section>`}function answer(btn,o){const x=qs[i],ok=o===x[2];if(ok)score++;fb.textContent=ok?'✅ صحيح! '+x[3]:'❌ غير صحيح. '+x[3];fb.style.color=ok?'#16834b':'#b42318';document.querySelectorAll('.opts button').forEach(b=>b.disabled=true);document.getElementById('next').style.display='inline-block'}function nextQ(){i++;if(i>=qs.length){quiz.style.display='none';result.style.display='block';scoreEl=document.getElementById('score');scoreEl.textContent=score+' / '+qs.length}else render()}render()</script></body></html>
