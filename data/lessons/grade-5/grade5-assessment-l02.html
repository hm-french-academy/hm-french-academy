<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="cache-control" content="no-cache,no-store,must-revalidate"><meta http-equiv="pragma" content="no-cache"><title>HM Academy | تقييم الدرس الثاني</title><style>body{margin:0;font-family:Arial,Cairo,sans-serif;background:#f4f7fb;color:#17223b}.wrap{max-width:850px;margin:auto;padding:24px}.hero,.card{border-radius:22px;padding:22px;margin-top:16px}.hero{background:linear-gradient(135deg,#173a82,#2563eb);color:#fff}.card{background:#fff;border:1px solid #dfe6ef}.q{font-size:21px;font-weight:900;line-height:1.8}.opts{display:grid;gap:10px;margin-top:16px}.opts button{padding:14px;border:2px solid #d8e0eb;background:#f8fafc;border-radius:13px;text-align:right;font-weight:800;font-size:17px}.correct{border-color:#16834b!important;background:#eaf8f0!important}.wrong{border-color:#b42318!important;background:#fff0ef!important}.fb{min-height:45px;margin-top:14px;font-weight:900;line-height:1.8}.next{margin-top:12px;padding:11px 18px;border:0;border-radius:11px;background:#2563eb;color:#fff;font-weight:900}.result{text-align:center}.score{font-size:42px;font-weight:900}</style></head><body><main class="wrap"><section class="hero"><h1>🏆 تقييم الدرس الثاني</h1><p>Les déterminants — تقييم مستقل للدرس الثاني فقط.</p><p>un · une · des · le · la · l’ · les</p></section><section id="quiz"></section><section id="result" class="card result" hidden><div class="score" id="score"></div><h2>انتهى التقييم</h2><p id="msg"></p><button class="next" id="retry">إعادة التقييم</button><br><a href="../../../grade-5-lesson-v3.html?id=g5-t1-l02&section=overview">← العودة إلى الدرس الثاني</a></section></main><script>(()=>{const Q=[['اختر الأداة الصحيحة: ___ stylo',['un','une','des'],'un','stylo مذكر مفرد.'],['اختر الأداة الصحيحة: ___ gomme',['un','une','des'],'une','gomme مؤنث مفرد.'],['اختر الأداة الصحيحة: ___ stylos',['un','une','des'],'des','des للتنكير مع الجمع.'],['اختر أداة التعريف: ___ stylo',['le','la','les'],'le','le للمذكر المفرد.'],['اختر أداة التعريف: ___ gomme',['le','la','les'],'la','la للمؤنث المفرد.'],['اختر أداة التعريف: ___ stylos',['le','la','les'],'les','les للجمع المحدد.'],['اختر الأداة المناسبة: ___ animal',['le','la','l’],'l’','نستخدم l’ قبل الاسم المفرد الذي يبدأ بحرف متحرك.'],['أي مجموعة تحتوي أدوات التنكير فقط؟',['un · une · des','le · la · les','le · une · les'],'un · une · des','هذه هي أدوات التنكير.'],['أي مجموعة تحتوي أدوات التعريف فقط؟',['un · une · des','le · la · l’ · les','un · le · des'],'le · la · l’ · les','هذه هي أدوات التعريف.'],['اختر العبارة الصحيحة.',['un gomme','une gomme','des gomme'],'une gomme','gomme مؤنث مفرد.'],['اختر العبارة الصحيحة للجمع غير المحدد.',['des stylos','les stylo','une stylos'],'des stylos','stylos جمع، ومع التنكير نستخدم des.'],['متى نستخدم l’؟',['مع الاسم المفرد الذي يبدأ بحرف متحرك','مع كل اسم جمع','مع المذكر فقط'],'مع الاسم المفرد الذي يبدأ بحرف متحرك','مثل l’animal.']];let i=0,s=0,locked=false;const quiz=document.getElementById('quiz'),res=document.getElementById('result');function render(){locked=false;const x=Q[i];quiz.innerHTML='<section class="card"><div class="q">سؤال '+(i+1)+' من '+Q.length+'<br>'+x[0]+'</div><div class="opts">'+x[1].map(o=>'<button data-v="'+o.replaceAll('"','&quot;')+'">'+o+'</button>').join('')+'</div><div class="fb" id="fb"></div><button class="next" id="next" hidden>'+((i===Q.length-1)?'إنهاء التقييم':'السؤال التالي')+'</button></section>'}quiz.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b||locked)return;locked=true;const x=Q[i],ok=b.dataset.v===x[2];if(ok)s++;quiz.querySelectorAll('[data-v]').forEach(z=>{z.disabled=true;if(z.dataset.v===x[2])z.classList.add('correct')});if(!ok)b.classList.add('wrong');document.getElementById('fb').textContent=(ok?'✅ صحيح! ':'❌ غير صحيح. الإجابة الصحيحة: '+x[2]+' — ')+x[3];document.getElementById('next').hidden=false});quiz.addEventListener('click',e=>{if(e.target.id!=='next'||!locked)return;i++;if(i<Q.length)render();else{quiz.hidden=true;res.hidden=false;document.getElementById('score').textContent=s+' / '+Q.length;document.getElementById('msg').textContent='نتيجتك '+Math.round(s/Q.length*100)+'%. راجع الأخطاء ثم أعد التقييم عند الحاجة.';try{localStorage.setItem('hm-g5-l02-assessment-score',String(Math.round(s/Q.length*100)))}catch(e){}}});document.getElementById('retry').onclick=()=>{i=0;s=0;res.hidden=true;quiz.hidden=false;render()};render()})();</script></body></html>
