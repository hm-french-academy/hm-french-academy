<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Les déterminants — Game Center v2</title><style>body{font-family:Arial,sans-serif;background:#f5f8fd;color:#17223b;margin:0}.wrap{max-width:960px;margin:auto;padding:20px}.hero,.card{background:#fff;border:1px solid #e1e8f2;border-radius:22px;padding:20px;margin-bottom:14px}.hero{background:linear-gradient(135deg,#173a82,#2563eb);color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.grid button,.opts button,.next{padding:12px;border-radius:12px;border:1px solid #d8e1ee;background:#fff;font-weight:800;cursor:pointer}.grid button,.next{background:#2563eb;color:#fff;border:0}.opts{display:grid;gap:10px;margin-top:14px}.opts button:disabled{opacity:.55}.q{font-size:21px;font-weight:900}.fb{min-height:28px;margin-top:12px;font-weight:900}.next{display:none;margin-top:12px}.score{font-size:28px;font-weight:900}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><main class="wrap"><section class="hero"><h1>🎮 Game Center — Les déterminants</h1><p>الدرس الثاني فقط: un · une · des · le · la · l’ · les</p></section><section class="grid"><article class="card"><h2>🖼️ الصورة والأداة</h2><button data-type="picture">ابدأ</button></article><article class="card"><h2>🎯 تعريف أم تنكير؟</h2><button data-type="def">ابدأ</button></article><article class="card"><h2>⚖️ الجنس والعدد</h2><button data-type="gender">ابدأ</button></article><article class="card"><h2>⚡ التحدي المختلط</h2><button data-type="mix">ابدأ</button></article></section><section class="card" id="game" hidden><div class="q" id="q"></div><div class="opts" id="opts"></div><div class="fb" id="fb"></div><button class="next" id="next">السؤال التالي</button><div class="score" id="score"></div></section></main><script>const data={picture:[['___ stylo','un'],['___ gomme','une'],['___ stylos','des'],['___ animal','un']],def:[['le livre','défini'],['une pomme','indéfini'],['les élèves','défini'],['des stylos','indéfini']],gender:[['___ livre','un'],['___ table','une'],['___ livres','des'],['___ école','l’']],mix:[['___ animal','l’'],['___ gomme','la'],['___ stylos','les'],['___ stylo','un'],['___ pomme','une']]};let rows=[],i=0,s=0,locked=false;const game=document.querySelector('#game'),q=document.querySelector('#q'),opts=document.querySelector('#opts'),fb=document.querySelector('#fb'),next=document.querySelector('#next'),score=document.querySelector('#score');function start(t){rows=data[t].map(r=>({q:r[0],a:r[1]}));i=0;s=0;score.textContent='';game.hidden=false;render();game.scrollIntoView({behavior:'smooth'})}function render(){locked=false;const r=rows[i];q.textContent=`${i+1} / ${rows.length} — ${r.q}`;const choices=[...new Set(rows.flatMap(x=>x.a==='un'||x.a==='une'||x.a==='des'?['un','une','des']:x.a==='le'||x.a==='la'||x.a==='l’'||x.a==='les'?['le','la','l’','les']:['défini','indéfini']))].sort(()=>Math.random()-.5);opts.innerHTML=choices.map(c=>`<button>${c}</button>`).join('');opts.querySelectorAll('button').forEach(b=>b.onclick=()=>answer(b,b.textContent));fb.textContent='';next.style.display='none'}function answer(btn,v){if(locked)return;locked=true;const ok=v===rows[i].a;if(ok)s++;opts.querySelectorAll('button').forEach(b=>b.disabled=true);fb.textContent=ok?'✅ صحيح':'❌ غير صحيح — الصحيح: '+rows[i].a;fb.style.color=ok?'#16834b':'#b42318';next.style.display='inline-block'}next.onclick=()=>{i++;if(i<rows.length)render();else{q.textContent='🎉 انتهت اللعبة';opts.innerHTML='';fb.textContent='اختر لعبة أخرى من الأعلى.';next.style.display='none';score.textContent=`النتيجة: ${s} / ${rows.length}`}};document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>start(b.dataset.type));</script></html>
