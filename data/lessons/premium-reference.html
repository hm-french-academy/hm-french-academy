<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="HM Academy Premium lesson reference"><title>HM Academy | مرجع الدرس</title><style>:root{--b:#2563eb;--t:#12a594;--line:#dfe6f0;--m:#68758b;--bg:#f3f6fb}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8faff,var(--bg));color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:1000px;margin:auto;padding:18px 10px 50px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 34px #14264a0b}.hero{padding:26px;color:#fff;background:linear-gradient(135deg,#17357a,#2563eb 55%,#12a594)}.hero h1{margin:8px 0;font-size:clamp(28px,6vw,44px)}.hero p{line-height:1.8}.card{padding:20px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item,.rule,.example{border:1px solid var(--line);border-radius:16px;padding:14px}.item{text-align:center}.fr{direction:ltr;font-weight:900;font-size:18px}.ar{color:#315aa4;font-weight:800;margin-top:6px}.rule{line-height:2;background:#f8faff}.example{direction:ltr;text-align:left;margin-top:8px;border-right:4px solid #e92d83}.muted{color:var(--m);line-height:1.8}.btn{display:inline-block;text-decoration:none;border-radius:12px;padding:11px 14px;background:var(--b);color:#fff;font-weight:900}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><div id="unit"></div><h1 id="title">جارٍ التحميل…</h1><p id="sub"></p></section><section class="card"><h2>📚 قاموس الدرس</h2><p class="muted">مرجع سريع للمفردات الأساسية ومعانيها.</p><div id="vocab" class="grid"></div></section><section class="card"><h2>📘 القواعد</h2><div id="grammar"></div></section><section class="card"><h2>🧩 أمثلة أساسية</h2><div id="examples"></div></section><section class="card"><a id="back" class="btn">← العودة إلى الدرس Premium</a></section><footer style="text-align:center;padding:24px;color:#68758b">HM Academy · Fondateur : Hatem ElMorsi · © 2026</footer></main><script>const id=new URLSearchParams(location.search).get('lesson')||'grade8-u1-l1',$=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));Promise.all([fetch('premium-course-map.json?v=20260812-6',{cache:'no-store'}),fetch('grade-8/lesson-registry.json?v=20260812-6',{cache:'no-store'})]).then(async r=>{const m=await r[0].json(),reg=await r[1].json();for(const u of reg.includedUnits)for(const l of u.lessons||[])if(l.id===id){const c=m.units[u.id].lessons[String(l.number)];$('#unit').textContent=u.titleAr+' · Français simple 2';$('#title').textContent=c.titleAr;$('#sub').textContent=c.titleFr+' · مرجع Premium';$('#vocab').innerHTML=c.vocab.map(x=>`<article class="item"><div class="fr">${esc(x[0])}</div><div class="ar">${esc(x[1])}</div></article>`).join('');$('#grammar').innerHTML=c.grammar.map(x=>`<div class="rule"><b>${esc(x[0])}</b><br>${esc(x[1])}</div>`).join('');$('#examples').innerHTML=c.examples.map(x=>`<div class="example">${esc(x)}</div>`).join('');$('#back').href='premium-v3.html?lesson='+encodeURIComponent(id);return}}).catch(()=>{$('#title').textContent='تعذر تحميل المرجع';$('#sub').textContent='أعد فتح الصفحة بعد اكتمال تحديث المنصة.'})</script></body></html>
