<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ألعاب · Prépositions et possessifs</title><style>body{margin:0;background:#f4f7fc;color:#17223b;font-family:Arial,Cairo,sans-serif}main{max-width:1000px;margin:auto;padding:24px}.hero,.game{background:#fff;border-radius:22px;padding:22px;margin-top:16px;box-shadow:0 10px 28px #14264a12}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff}.opts{display:flex;flex-wrap:wrap;gap:10px}.opts button{padding:12px 16px;border:1px solid #ccd6e5;background:#fff;border-radius:13px;font-weight:800}.ok{color:#148a4d;font-weight:900}.bad{color:#c33;font-weight:900}</style></head><body><main><section class="hero"><h1>🎮 ألعاب الدرس · Prépositions et possessifs</h1><p>ألعاب مختلفة عن التقييم مع خلط الاختيارات.</p></section><section class="game"><h2>📍 1) Où est l'objet ?</h2><p id="q"></p><div id="o" class="opts"></div><div id="r"></div><button onclick="round()">🔀 جولة جديدة</button></section><section class="game"><h2>👤 2) À qui appartient-il ?</h2><p>اختر الصفة الصحيحة: «___ chambre» لشخص يتحدث عن غرفته.</p><div class="opts"><button onclick="p(true)">Ma</button><button onclick="p(false)">Mon</button><button onclick="p(false)">Mes</button></div><div id="pr"></div></section><section class="game"><h2>🧠 3) Intrus</h2><p>اختر الكلمة المختلفة.</p><div class="opts"><button onclick="i(false)">sur</button><button onclick="i(false)">sous</button><button onclick="i(true)">chambre</button><button onclick="i(false)">devant</button></div><div id="ir"></div></section></main><script src="../../../../scripts/learning-progress.js"></script><script>const d=[['على','sur'],['تحت','sous'],['أمام','devant'],['خلف','derrière'],['بين','entre']];let c;function sh(a){return [...a].sort(()=>Math.random()-.5)}function round(){c=sh(d)[0];q.textContent='اختر الفرنسية لـ «'+c[0]+'»';o.innerHTML=sh([c[1],...sh(d.filter(x=>x!==c)).slice(0,2).map(x=>x[1])]).map(x=>`<button onclick="a('${x}')">${x}</button>`).join('');r.textContent=''}function a(x){const ok=x===c[1];r.textContent=ok?'✓ صحيح':'✗ حاول';r.className=ok?'ok':'bad';if(ok)HMProgress.completeActivity('grade8-u2-l4-game-prep',10)}function p(ok){pr.textContent=ok?'✓ ممتاز':'✗ الصحيح Ma';pr.className=ok?'ok':'bad';if(ok)HMProgress.completeActivity('grade8-u2-l4-game-possessive',10)}function i(ok){ir.textContent=ok?'✓ الكلمة المختلفة هي chambre':'✗ حاول';ir.className=ok?'ok':'bad';if(ok)HMProgress.completeActivity('grade8-u2-l4-game-intrus',10)}round();</script></body></html>
