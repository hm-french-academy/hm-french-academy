<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Game Studio · Leçon 4</title><style>body{margin:0;background:#f4f7fc;color:#17223b;font-family:Arial,Cairo,sans-serif}.w{max-width:1000px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#173a82,#7c3aed,#2563eb);color:#fff;border-radius:28px;padding:28px}.game{background:#fff;border:1px solid #e1e7f0;border-radius:22px;padding:20px;margin-top:15px}.top{display:flex;gap:12px;align-items:center}.icon{font-size:32px}.opts{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.opts button{padding:11px 15px;border:1px solid #ccd6e5;background:#fff;border-radius:12px;font-weight:900;cursor:pointer}.res{margin-top:10px;font-weight:900;min-height:24px}.ok{color:#159447}.bad{color:#c43b3b}.btn{border:0;border-radius:12px;padding:12px 16px;background:#2563eb;color:#fff;font-weight:900;cursor:pointer}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.link{padding:11px 14px;border-radius:12px;background:#edf3ff;color:#2855a3;text-decoration:none;font-weight:900}.score{font-weight:900}@media(max-width:600px){.opts button{flex:1 1 42%}}</style><main class="w"><section class="hero"><h1>🎮 HM Game Studio · Leçon 4</h1><p>6 أنماط لعب قصيرة ومتنوعة لتثبيت حروف المكان وصفات الملكية. كل جولة تولّد تحديًا جديدًا.</p></section><div id="games"></div><section class="game"><div class="score" id="score">⭐ نقاط الجولة: 0</div><button class="btn" onclick="newRound()">🔀 إعادة توليد التحديات</button></section><div class="actions"><a class="link" href="../../../../lesson.html?id=grade8-u2-l4">← العودة إلى الدرس</a><a class="link" href="reference_lecon4_unite2.html">📄 المرجع</a><a class="link" href="formal_assessment_lecon4_unite2.html">📝 التقييم الرسمي</a></div></main><script src="../../../../scripts/learning-progress.js"></script><script>const DATA={location:[['«فوق» بالفرنسية؟','sur','sous','entre'],['«خلف» بالفرنسية؟','derrière','devant','dans'],['الكتاب داخل الحقيبة.','dans','sur','entre']],poss:[['___ chambre (je)','ma','mon','mes'],['___ livres (tu)','tes','ta','ton'],['___ téléphone (il)','son','sa','ses'],['___ amie (je)','mon','ma','mes']],sentence:[['Le livre est ___ la table.','sur','ma','mes'],['La chaise est ___ la table.','devant','tes','son'],['Ce sont ___ photos.','mes','ma','mon'],['C’est ___ chambre.','sa','ses','son']],intrus:[['sur','sous','entre','chambre'],['mon','ma','mes','derrière'],['dans','devant','son','sous']],sequence:[['اختر الكلمة التي تكمل: Je → ___ livre','mon','ma','mes'],['اختر الكلمة التي تكمل: Nous?','mon','ma','mes'],['اختر المكان: sac ___ table = الحقيبة تحت الطاولة','sous','sur','entre']],detective:[['خطأ: «mon chambre» — التصحيح؟','ma chambre','mes chambre','mon chambres'],['خطأ: «mes livre» — التصحيح؟','mon livre','mes livres','ma livre'],['خطأ: «ma amie» — التصحيح؟','mon amie','mes amie','ma amies']]};const titles=[['location','📍 Où est l’objet ?','حدّد العلاقة المكانية.'],['poss','👤 Possessive Match','طابق صفة الملكية مع الاسم.'],['sentence','🧩 Sentence Builder','اختر القطعة التي تكمل الجملة.'],['intrus','🔎 Intrus','اكتشف الكلمة التي لا تنتمي إلى المجموعة.'],['sequence','⚡ Speed Choice','حل بسرعة بناءً على القاعدة.'],['detective','🕵️ Error Detective','اكتشف الخطأ وصححه مع الحفاظ على المعنى.']];let points=0;function esc(s){return s.replaceAll("'","\\'")}function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}function renderMode(key,title,desc,items){const host=document.createElement('section');host.className='game';host.innerHTML=`<div class="top"><div class="icon">${title.split(' ')[0]}</div><div><h2>${title.substring(title.indexOf(' ')+1)}</h2><p>${desc}</p></div></div><div id="q-${key}"></div><div class="res" id="r-${key}"></div><button class="btn" onclick="next('${key}')">🔄 تحدٍ جديد</button>`;games.appendChild(host);host._items=items;next(key,host)}function next(key,host){host=host||[...document.querySelectorAll('.game')].find(x=>x.querySelector('#q-'+key)) ;const item=pick(host._items);const opts=[item[1],item[2],item[3]].sort(()=>Math.random()-.5);host.querySelector('#q-'+key).innerHTML=`<b>${item[0]}</b><div class="opts">${opts.map(o=>`<button onclick="play(this,'${esc(o)}','${esc(item[1])}','${key}')">${o}</button>`).join('')}</div>`;host.querySelector('#r-'+key).textContent=''}function play(b,x,ans,key){const host=b.closest('.game'),r=host.querySelector('#r-'+key);const ok=x===ans;r.textContent=ok?'✓ ممتاز! إجابة دقيقة.':'✗ ليس هذا الاختيار. الإجابة الصحيحة: '+ans;r.className='res '+(ok?'ok':'bad');host.querySelectorAll('.opts button').forEach(x=>x.disabled=true);if(ok){points+=10;score.textContent='⭐ نقاط الجولة: '+points;try{HMProgress.completeActivity('grade8-u2-l4-game-'+key,10)}catch(e){}}}function newRound(){points=0;score.textContent='⭐ نقاط الجولة: 0';document.getElementById('games').innerHTML='';titles.forEach(([k,t,d])=>renderMode(k,t,d,DATA[k]))}newRound();</script></main></html>
