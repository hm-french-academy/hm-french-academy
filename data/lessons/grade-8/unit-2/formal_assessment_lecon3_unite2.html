iv><div class="step"><b>📝</b>التقييم</div><div class="step"><b>🎮</b>الألعاب</div></section><section class="q"><b>1. Nous ___ une maison.</b><label><input type="radio" name="q1" value="1"> avons</label><label><input type="radio" name="q1" value="0"> sommes</label></section><section class="q"><b>2. Elle ___ dans le salon.</b><label><input type="radio" name="q2" value="1"> est</label><label><input type="radio" name="q2" value="0"> a</label></section><section class="q"><b>3. Vous ___ une grande chambre.</b><label><input type="radio" name="q3" value="1"> avez</label><label><input type="radio" name="q3" value="0"> êtes</label></section><button class="btn" onclick="grade()">✓ تصحيح التقييم</button><h2 id="r" class="result"></h2><div class="actions"><a class="link" href="../../../lesson.html?id=grade8-u2-l3">← العودة إلى الدرس</a><a class="link" href="reference_lecon3_unite2.html">📄 المرجع</a><a class="link" href="lesson-3-games.html">🎮 الألعاب</a></div></main><script>function grade(){let s=0;for(let i=1;i<=3;i++)s+=Number(document.querySelector('input[name=q'+i+']:checked')?.value||0);document.getElementById('r').textContent='النتيجة: '+s+' / 3';}</script></body></html>
