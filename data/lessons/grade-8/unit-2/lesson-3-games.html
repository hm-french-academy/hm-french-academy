<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ألعاب · Être / Avoir</title><style>body{margin:0;background:#f4f7fc;color:#17223b;font-family:Arial,Cairo,sans-serif}main{max-width:1000px;margin:auto;padding:24px}.hero,.game{background:#fff;border-radius:22px;padding:22px;margin-top:16px;box-shadow:0 10px 28px #14264a12}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff}.opts{display:flex;flex-wrap:wrap;gap:10px}.opts button{padding:12px 16px;border:1px solid #ccd6e5;background:#fff;border-radius:13px;font-weight:800}.ok{color:#148a4d;font-weight:900}.bad{color:#c33;font-weight:900}.word{display:inline-block;padding:10px 14px;background:#2563eb;color:#fff;border-radius:12px;margin:5px;cursor:pointer}</style></head><body><main><section class="hero"><h1>🎮 ألعاب الدرس · Être / Avoir</h1><p>التدريب هنا يركز على سرعة التمييز بين الفعلين، وليس تكرار التقييم الرسمي.</p></section><section class="game"><h2>⚡ 1) Être ou Avoir ?</h2><p id="q"></p><div class="opts"><button onclick="a('être')">Être</button><button onclick="a('avoir')">Avoir</button></div><div id="r"></div></section><section class="game"><h2>🔀 2) Remets les pronoms</h2><p>اضغط الضمائر بترتيب عشوائي لتكوين السلسلة الصحيحة.</p><div id="p"></div><div id="pr"></div></section><section class="game"><h2>🏁 3) Sprint</h2><p>أكمل الجملة بسرعة.</p><div class="opts"><button onclick="s(true)">Nous avons une maison.</button><button onclick="s(false)">Nous êtes une maison.</button></div><div id="sr"></div></section></main><script src="../../../../scripts/learning-progress.js"></script><script>const qs=[['Je ___ une chambre.','avoir'],['Nous ___ dans le salon.','être'],['Ils ___ une grande maison.','avoir'],['Elle ___ contente.','être']];let c;function sh(a){return [...a].sort(()=>Math.random()-.5)}function next(){c=sh(qs)[0];q.textContent=c[0];r.textContent=''}function a(x){const ok=x===c[1];r.textContent=ok?'✓ صحيح':'✗ حاول';r.className=ok?'ok':'bad';if(ok)HMProgress.completeActivity('grade8-u2-l3-game-verb',10);next()}function pron(){const xs=sh(['Je','Tu','Il / Elle','Nous','Vous','Ils / Elles']);p.innerHTML=xs.map(x=>`<span class="word" onclick="pick(this,'${x}')">${x}</span>`).join('');let picked=[];window.pick=(el,x)=>{picked.push(x);el.remove();pr.textContent=picked.join(' → ');if(picked.length===6){const ok=picked.join('|')==='Je|Tu|Il / Elle|Nous|Vous|Ils / Elles';pr.textContent=ok?'✓ ترتيب صحيح':'✗ اضغط إعادة';if(ok)HMProgress.completeActivity('grade8-u2-l3-game-order',10)}}}function s(ok){sr.textContent=ok?'✓ ممتاز':'✗ ليست صحيحة';sr.className=ok?'ok':'bad';if(ok)HMProgress.completeActivity('grade8-u2-l3-game-sprint',10)}next();pron();</script></body></html>
