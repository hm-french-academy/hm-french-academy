<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Game Studio · Leçon 3</title><style>:root{--n:#14264a;--b:#2563eb;--p:#7c3aed;--pk:#e92d83;--g:#20a45a;--r:#d14b4b;--l:#dfe6f0;--m:#68758b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f6f8fd,#edf3fb);color:var(--n);font-family:Arial,Cairo,sans-serif}.w{max-width:1100px;margin:auto;padding:18px 14px 60px}.hero{padding:28px;border-radius:30px;background:linear-gradient(135deg,#173a82,#7c3aed,#2563eb);color:#fff;box-shadow:0 18px 45px #14264a22}.hero h1{margin:0 0 7px;font-size:clamp(28px,6vw,43px)}.hero p{margin:5px 0;line-height:1.8}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}.card,.play{background:#fff;border:1px solid var(--l);border-radius:24px;padding:18px;box-shadow:0 10px 28px #14264a0d}.ico{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#edf3ff,#fff0f7);display:grid;place-items:center;font-size:31px}.card h2{font-size:18px;margin:12px 0 6px}.card p{font-size:13px;color:var(--m);line-height:1.7;min-height:44px}.start,.next,.restart{border:0;border-radius:12px;padding:11px 15px;background:var(--b);color:#fff;font-weight:900;cursor:pointer}.play{display:none;margin-top:16px;padding:20px}.head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.badge{background:#edf3ff;color:#315aa4;padding:8px 11px;border-radius:11px;font-weight:900}.progress{height:8px;background:#edf1f7;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#7c3aed);transition:.25s}.q{font-size:22px;font-weight:900;line-height:1.7;margin:14px 0}.hint{color:var(--m);font-size:13px;margin-bottom:10px}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.opt{border:1px solid #d7e0ee;background:#fff;border-radius:15px;padding:14px;font-weight:900;cursor:pointer;min-height:52px;text-align:right}.opt.good{background:#eaf8f0;border-color:var(--g)}.opt.bad{background:#fff0f0;border-color:var(--r)}.listen{border:0;border-radius:12px;background:#edf3ff;color:#2454aa;padding:10px 14px;font-weight:900;cursor:pointer;margin-bottom:12px}.fb{min-height:27px;margin-top:12px;font-weight:900}.next{display:none;margin-top:8px;background:var(--pk)}.result{text-align:center;padding:22px}.result strong{font-size:24px}.back{display:inline-block;margin-top:14px;padding:10px 13px;border-radius:11px;background:#f5f8ff;color:#315aa4;text-decoration:none;font-weight:900}@media(max-width:800px){.modes{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.modes,.opts{grid-template-columns:1fr}.play{padding:15px}.q{font-size:20px}}</style></head><body><main class="w"><section class="hero"><h1>🎮 HM Game Studio · Leçon 3</h1><p>مركز ألعاب احترافي متنوع لمفردات المنزل وقواعد <b>Avoir / Être</b> و<b>Il y a</b>.</p><p>6 أنماط × 10 أسئلة = 60 سؤالًا محتملًا، مع توليد مختلف في كل جولة.</p></section><section id="modes" class="modes"></section><section id="play" class="play"><div class="head"><b id="title">التحدي</b><span class="badge">⭐ <span id="score">0</span></span><span class="badge">السؤال <span id="num">0</span>/10</span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="q" class="q"></div><div id="hint" class="hint"></div><div id="listen"></div><div id="opts" class="opts"></div><div id="fb" class="fb"></div><button id="next" class="next">السؤال التالي ←</button></section><div style="text-align:center"><a class="back" href="../../../../lesson.html?id=grade8-u2-l3&section=games">← العودة إلى الدرس</a></div></main><script>const V=[['un mur','حائط'],['un repas','وجبة'],['une maison','منزل'],['une pièce','غرفة'],['une boîte','صندوق'],['une voiture','سيارة'],['un balcon','شرفة'],['un téléphone','تليفون'],['des meubles','أثاث'],['une banque','بنك'],['un musée','متحف'],['une photo','صورة'],['un bus','أتوبيس'],['un parc','حديقة عامة'],['une poste','مكتب بريد'],['une gare','محطة قطار'],['un cinéma','سينما'],['un hôpital','مستشفى'],['une école','مدرسة'],['un lycée','مدرسة ثانوية'],['un théâtre','مسرح'],['une clé','مفتاح'],['une chambre','غرفة نوم'],['un salon','غرفة معيشة'],['une cuisine','مطبخ']];const G=[['Je ___ une clé.','ai'],['Tu ___ dans le salon.','es'],['Nous ___ une maison.','avons'],['Vous ___ dans la maison.','êtes'],['Ils ___ une photo.','ont'],['Elle ___ dans sa chambre.','est'],['La maison ___ grande.','est'],['Nous ___ dans le salon.','sommes'],['Tu ___ une voiture.','as'],['Je ___ un téléphone.','ai'],['Vous ___ une clé.','avez'],['Elles ___ dans la maison.','sont'],['Il ___ une photo.','a'],['Nous ___ une chambre.','avons'],['Je ___ dans la cuisine.','suis']];const J=[['J\'ai une chambre.','لدي غرفة.'],['Je suis dans ma chambre.','أنا في غرفتي.'],['Nous avons une maison.','لدينا منزل.'],['Ils sont dans la maison.','هم في المنزل.'],['Il y a des meubles dans la maison.','يوجد أثاث في المنزل.'],['La maison est grande.','المنزل كبير.'],['Tu as une clé.','لديك مفتاح.'],['Vous êtes dans le salon.','أنتم في غرفة المعيشة.'],['Il y a une voiture devant la maison.','توجد سيارة أمام المنزل.'],['J\'ai un téléphone.','لدي هاتف.']];const E=[['J\'ai dans le salon.','Je suis dans le salon.','لأن الجملة تعبّر عن المكان.'],['Je suis une clé.','J\'ai une clé.','لأن الجملة تعبّر عن الامتلاك.'],['Il a des meubles dans la maison.','Il y a des meubles dans la maison.','لأن المعنى هو وجود أثاث.'],['Nous est dans la maison.','Nous sommes dans la maison.','لأن nous مع être = sommes.'],['Vous avons une maison.','Vous avez une maison.','لأن vous مع avoir = avez.'],['Tu est dans la cuisine.','Tu es dans la cuisine.','لأن tu مع être = es.'],['Ils a une photo.','Ils ont une photo.','لأن ils مع avoir = ont.'],['Je sont dans ma chambre.','Je suis dans ma chambre.','لأن je مع être = suis.'],['Elle ont une clé.','Elle a une clé.','لأن elle مع avoir = a.'],['Ils est dans le salon.','Ils sont dans le salon.','لأن ils مع être = sont.']];const modes=[['vocab','🧩','Vocabulary Match','المفردات والمعنى والتمييز بين الكلمات.'],['grammar','🎯','Grammar Duel','اختيار Avoir / Être والتصريف الصحيح.'],['listen','🎤','Listen & Choose','استماع ونطق فرنسي ثم فهم المعنى.'],['sentence','🧠','Sentence Builder','اختيار الجملة الصحيحة من السياق.'],['error','🔎','Error Detective','اقرأ الجملة الخاطئة ثم اختر التصحيح الصحيح.'],['mixed','⚡','Mastery Mix','جولة شاملة بمستويات مختلفة.']];const $=x=>document.getElementById(x),sh=a=>[...a].sort(()=>Math.random()-.5),R=a=>a[Math.floor(Math.random()*a.length)];let game='',i=0,s=0,answer='',explain='';$('modes').innerHTML=modes.map(m=>'<article class="card"><div class="ico">'+m[1]+'</div><h2>'+m[2]+'</h2><p>'+m[3]+'</p><button class="start" data-game="'+m[0]+'">ابدأ الجولة</button></article>').join('');document.querySelectorAll('.start').forEach(b=>b.onclick=()=>start(b.dataset.game));function speak(t){if(window.speechSynthesis){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.84;speechSynthesis.speak(u)}}function start(g){game=g;i=0;s=0;$('modes').style.display='none';$('play').style.display='block';$('title').textContent=modes.find(m=>m[0]===g)[2];next()}function optsFrom(arr,correct,map){return sh([correct,...sh(arr.filter(x=>map(x)!==correct)).slice(0,3).map(map)])}function next(){if(i>=10)return finish();i++;$('num').textContent=i;$('score').textContent=s;$('bar').style.width=(i-1)*10+'%';$('fb').textContent='';$('next').style.display='none';$('listen').innerHTML='';$('hint').textContent='';let q='',ops=[];if(game==='vocab'){const x=R(V);q='ما معنى «'+x[0]+'»؟';answer=x[1];ops=optsFrom(V,answer,x=>x[1])}else if(game==='grammar'){const x=R(G);q=x[0];answer=x[1];ops=sh([answer,...sh(['ai','as','a','avons','avez','ont','suis','es','est','sommes','êtes','sont'].filter(y=>y!==answer)).slice(0,3)])}else if(game==='listen'){const x=R(V);q='استمع جيدًا ثم اختر المعنى الصحيح.';answer=x[1];ops=optsFrom(V,answer,x=>x[1]);$('listen').innerHTML='<button class="listen" id="sp">🔊 استمع إلى النطق</button>';$('sp').onclick=()=>speak(x[0]);setTimeout(()=>speak(x[0]),150)}else if(game==='sentence'){const x=R(J);q='أي جملة تعبّر عن «'+x[1]+'»؟';answer=x[0];ops=optsFrom(J,answer,x=>x[0])}else if(game==='error'){const x=R(E);q='🔎 الجملة التالية بها خطأ: «'+x[0]+'»<br>اختر التصحيح الصحيح:';answer=x[1];explain=x[2];const pool=sh(E.filter(z=>z[1]!==answer).map(z=>z[1]));ops=sh([answer,...pool.slice(0,3)]);$('hint').textContent='بعد الإجابة ستظهر لك القاعدة التي تفسّر التصحيح.'}else{const mode=Math.floor(Math.random()*5);if(mode===0){const x=R(V);q='أي كلمة تعني «'+x[1]+'»؟';answer=x[0];ops=optsFrom(V,answer,x=>x[0])}else if(mode===1){const x=R(G);q=x[0];answer=x[1];ops=sh([answer,...sh(['ai','as','a','avons','avez','ont','suis','es','est','sommes','êtes','sont'].filter(y=>y!==answer)).slice(0,3)])}else if(mode===2){const x=R(J);q='اختر الترجمة الصحيحة للجملة: '+x[0];answer=x[1];ops=optsFrom(J,answer,x=>x[1])}else if(mode===3){const x=R(E);q='اختر تصحيح الجملة الخاطئة: «'+x[0]+'»';answer=x[1];explain=x[2];ops=sh([answer,...sh(E.filter(z=>z[1]!==answer).map(z=>z[1])).slice(0,3)])}else{const x=R(V);q='استمع إلى الكلمة ثم اخترها.';answer=x[0];ops=optsFrom(V,answer,x=>x[0]);$('listen').innerHTML='<button class="listen" id="sp">🔊 استمع</button>';$('sp').onclick=()=>speak(x[0]);setTimeout(()=>speak(x[0]),150)}}$('q').innerHTML=q;$('opts').innerHTML=ops.map(x=>'<button class="opt">'+x+'</button>').join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b))}function choose(b){document.querySelectorAll('.opt').forEach(x=>x.disabled=true);const ok=b.textContent===answer;b.classList.add(ok?'good':'bad');if(ok){s++;$('fb').textContent='✓ ممتاز! '+(explain||'إجابة صحيحة.')}else{document.querySelectorAll('.opt').forEach(x=>{if(x.textContent===answer)x.classList.add('good')});$('fb').textContent='✗ الإجابة الصحيحة: '+answer+(explain?' — '+explain:'')}$('fb').style.color=ok?'#20a45a':'#d14b4b';$('score').textContent=s;$('bar').style.width=i*10+'%';$('next').style.display='inline-block'}$('next').onclick=next;function finish(){if(s>=7&&window.HMProgress&&typeof HMProgress.completeActivity==='function')HMProgress.completeActivity('u2-l3-games',20);$('q').innerHTML='<div class="result"><h2>🏆 الجولة مكتملة</h2><strong>'+s+' / 10</strong><p>'+(s>=9?'إتقان ممتاز!':s>=7?'أداء جيد جدًا!':'راجع الدرس ثم أعد التحدي.')+'</p><button class="restart" onclick="start(game)">🔄 جولة جديدة</button></div>';$('opts').innerHTML='';$('listen').innerHTML='';$('fb').textContent='';$('hint').textContent='';$('bar').style.width='100%';$('num').textContent='10'}</script></body></html>
