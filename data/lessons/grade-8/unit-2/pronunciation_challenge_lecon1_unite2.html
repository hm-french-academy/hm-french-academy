<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HM Academy | تحدي النطق — الوحدة الثانية الدرس الأول</title>
<style>
:root{--nav:#14264a;--blue:#2563eb;--teal:#16a394;--line:#dfe6f0;--muted:#68758b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Cairo,sans-serif;background:linear-gradient(180deg,#f7f9fd,#eef3fb);color:var(--nav);padding:18px}.box{max-width:920px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 15px 38px #14264a12}.hero{background:linear-gradient(135deg,#075e54,#129b8b,#4caf8f);color:#fff;border-radius:22px;padding:22px;margin-bottom:16px}.hero h1{margin:6px 0;font-size:clamp(25px,6vw,40px)}.hero p{margin:0;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.word{border:1px solid var(--line);border-radius:18px;padding:15px;background:#fff}.top{display:flex;align-items:center;gap:10px}.icon{font-size:30px}.fr{font-size:20px;font-weight:900;direction:ltr;text-align:left;flex:1}.ar{color:var(--muted);margin-top:5px}.ex{margin-top:8px;padding:9px 10px;background:#f7f9fd;border-radius:10px;color:#536078;direction:ltr;text-align:left;font-size:14px}.btn{padding:11px 14px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:900;cursor:pointer}.btn.playing{background:var(--teal)}.status{margin:15px 0;padding:12px;border-radius:13px;background:#f5f8ff;color:#315aa4;font-weight:800;min-height:24px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.link{display:inline-block;text-decoration:none;padding:12px 15px;border-radius:12px;background:#edf3ff;color:#2850a3;font-weight:900}@media(max-width:650px){.grid{grid-template-columns:1fr}.word{padding:13px}.fr{font-size:18px}}
</style>
</head>
<body>
<section class="box">
<header class="hero"><div>HM ACADEMY · UNITÉ 2 · LEÇON 1</div><h1>🎤 تحدّي النطق</h1><p>استمع إلى كلمات درس <b>Les pièces de la maison et la chambre</b> ثم كررها بصوتك. هذا المسار مستقل عن محرّك الدرس لتجنب تجمّد الصفحة.</p></header>
<div id="status" class="status">اضغط 🔊 أمام أي كلمة لبدء التدريب.</div>
<div id="words" class="grid"></div>
<div class="actions"><a class="link" href="../../../../lesson.html?id=grade8-u2-l1">← العودة إلى الدرس</a><a class="link" href="lesson-1-games.html">🎮 الألعاب</a><a class="link" href="reference_lecon1_unite2.html">📄 المرجع</a><a class="link" href="formal_assessment_lecon1_unite2.html">📝 التقييم الرسمي</a></div>
</section>
<script src="../../../../scripts/speech-runtime.js?v=20260816-u2pron1"></script>
<script src="../../../../scripts/activity-complete.js?v=20260816-u2pron1"></script>
<script>
(function(){
const words=[
['la maison','المنزل','🏠','Ma maison est grande.'],['la chambre','غرفة النوم','🛏️','Ma chambre est petite.'],['la porte','الباب','🚪','La porte est fermée.'],['la fenêtre','النافذة','🪟','La fenêtre est ouverte.'],['le lit','السرير','🛏️','Le lit est dans la chambre.'],["l'armoire",'خزانة الملابس','🗄️',"L'armoire est dans la chambre."],['un oreiller','وسادة','🛌',"L'oreiller est sur le lit."],['un bureau','مكتب','🖥️','Le bureau est dans la chambre.'],['une chaise','كرسي','🪑','La chaise est dans la chambre.'],['une table de chevet','منضدة بجوار السرير','🛏️','La table de chevet est près du lit.'],['un abat-jour','غطاء المصباح','💡',"L'abat-jour est sur la table de chevet."],['un tapis','سجادة','🧶','Le tapis est sur le sol.'],['un matelas','مرتبة','🛏️','Le matelas est sur le lit.'],['un réveil','منبه','⏰','Le réveil est sur la table de chevet.'],['un tableau','لوحة','🖼️','Le tableau est sur le mur.'],['un miroir','مرآة','🪞','Le miroir est dans la chambre.'],['un lustre','نجفة','💡','Le lustre est au plafond.'],['un rideau','ستارة','🪟','Le rideau est devant la fenêtre.'],['le salon','غرفة المعيشة','🛋️','Dans le salon, il y a un canapé.'],['la cuisine','المطبخ','🍳','Dans la cuisine, il y a un repas.'],['la salle de bains','الحمام','🛁','La salle de bains est petite.']
];
const root=document.getElementById('words'),status=document.getElementById('status');let done=new Set();
words.forEach((x,i)=>{const card=document.createElement('article');card.className='word';const top=document.createElement('div');top.className='top';const icon=document.createElement('span');icon.className='icon';icon.textContent=x[2];const fr=document.createElement('div');fr.className='fr';fr.textContent=x[0];const b=document.createElement('button');b.className='btn';b.type='button';b.textContent='🔊';b.setAttribute('aria-label','استمع إلى '+x[0]);b.addEventListener('click',async()=>{status.textContent='⏸️ جاري نطق: '+x[0];const ok=window.HMSpeech?await HMSpeech.speak(x[0],{button:b,lang:'fr-FR',rate:.82}):false;status.textContent=ok?'✅ استمع ثم كرر: '+x[0]:'⚠️ النطق غير متاح على هذا الجهاز';done.add(i);if(done.size===words.length){status.textContent='🎉 أحسنت! أكملت جميع كلمات تحدي النطق.';if(window.HMActivityComplete)HMActivityComplete.complete('grade8-u2-l1','pronunciation',20)}});top.append(icon,fr,b);const ar=document.createElement('div');ar.className='ar';ar.textContent=x[1];const ex=document.createElement('div');ex.className='ex';ex.textContent=x[3];card.append(top,ar,ex);root.append(card)});
})();
</script>
</body></html>
