<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | تحدي النطق — الوحدة الثانية الدرس الثالث</title><style>:root{--nav:#14264a;--blue:#2563eb;--teal:#16a394;--line:#dfe6f0;--muted:#68758b}*{box-sizing:border-box}body{margin:0;padding:18px;background:#eef3fb;color:var(--nav);font-family:Arial,Cairo,sans-serif}.box{max-width:1000px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px}.hero{padding:22px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#075e54,#129b8b,#4caf8f)}.hero h1{margin:7px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.word{border:1px solid var(--line);border-radius:18px;padding:15px}.fr{font-size:20px;font-weight:900;direction:ltr;text-align:left}.ar{margin-top:6px;color:var(--muted)}.ex{margin-top:9px;padding:10px;background:#f7f9fd;border-radius:10px;direction:ltr;text-align:left}.buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.btn{padding:9px 12px;border:0;border-radius:11px;background:var(--blue);color:#fff;font-weight:900;cursor:pointer}.example{background:var(--teal)}.pron{margin-top:9px;padding:10px;border-radius:11px;background:#f0f7f6;color:#176b61;font-size:13px;line-height:1.7}.status{margin-top:15px;padding:12px;border-radius:13px;background:#f5f8ff;color:#315aa4;font-weight:800}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.link{padding:11px 14px;border-radius:12px;background:#edf3ff;color:#2850a3;font-weight:900;text-decoration:none}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><section class="box"><header class="hero"><div>HM ACADEMY · UNITÉ 2 · LEÇON 3</div><h1>🎤 تحدي النطق</h1><p>الكلمة + المثال + ملاحظة النطق، مع نطق تلقائي عبر الإنترنت.</p></header><div id="status" class="status">🔊 اختر الكلمة أو المثال للاستماع.</div><div id="words" class="grid"></div><div class="actions"><a class="link" href="../../../../lesson.html?id=grade8-u2-l3">← العودة إلى الدرس</a><a class="link" href="lesson-3-games.html">🎮 الألعاب</a><a class="link" href="formal_assessment_lecon3_unite2.html">📝 التقييم الرسمي</a></div></section><script src="../../../../scripts/speech-runtime.js?v=20260817-u2l3pron1"></script><script src="../../../../scripts/activity-complete.js?v=20260817-u2l3pron1"></script><script>(function(){const W=[['grand','كبير','Le salon est grand.','gr تُنطق /ɡʁ/، و d النهائية لا تُنطق.'],['petit','صغير','La chambre est petite.','t النهائية في petit لا تُنطق.'],['propre','نظيف','La cuisine est propre.','pr تُنطق متصلة، و e النهائية لا تُنطق.'],['beau','جميل',"C'est une belle maison.",'eau تُنطق /o/.'],['une maison','منزل',"J'ai une maison.",'ai في J’ai تُنطق /e/ تقريبًا، و on في maison صوت أنفي /ɔ̃/.'],['une chambre','غرفة',"J'ai une chambre.",'ch تُنطق /ʃ/ مثل «ش»، و e النهائية لا تُنطق.']];const root=document.getElementById('words'),status=document.getElementById('status');let heard=new Set();function speak(text,button,label){status.textContent='⏸️ '+label;return window.HMSpeech?HMSpeech.speak(text,{button:button,lang:'fr-FR',rate:.82}):Promise.resolve(false)}W.forEach((x,i)=>{const c=document.createElement('article');c.className='word';c.innerHTML='<div class="fr"></div><div class="ar"></div><div class="ex"></div><div class="buttons"><button class="btn">🔊 الكلمة</button><button class="btn example">🗣️ المثال</button></div><div class="pron"><b>💡 ملاحظة النطق:</b> '+x[3]+'</div>';c.querySelector('.fr').textContent=x[0];c.querySelector('.ar').textContent=x[1];c.querySelector('.ex').textContent=x[2];const b=c.querySelector('.btn'),e=c.querySelector('.example');b.onclick=async()=>{const ok=await speak(x[0],b,'جاري نطق الكلمة: '+x[0]);status.textContent=ok?'✅ استمع ثم كرر الكلمة.':'⚠️ النطق غير متاح على هذا الجهاز';heard.add(i);if(heard.size===W.length&&window.HMActivityComplete)HMActivityComplete.complete('grade8-u2-l3','pronunciation',20)};e.onclick=async()=>{const ok=await speak(x[2],e,'جاري نطق المثال: '+x[2]);status.textContent=ok?'✅ استمع إلى المثال ثم كرر الجملة.':'⚠️ النطق غير متاح على هذا الجهاز'};root.append(c)})})();</script></body></html>
