<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy · التقييم التفاعلي · Leçon 3</title><style>body{margin:0;background:#f4f7fc;color:#14264a;font-family:Arial,Cairo,sans-serif}.w{max-width:900px;margin:auto;padding:18px}.hero,.q,.result{background:#fff;border:1px solid #dfe6f0;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 8px 25px #14264a0b}.hero{color:#fff;background:linear-gradient(135deg,#173a82,#7c3aed,#2563eb)}.hero h1{margin:0 0 8px}.meta{display:flex;gap:8px;flex-wrap:wrap}.badge{background:#edf3ff;color:#315aa4;border-radius:11px;padding:8px;font-weight:900}.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.opt{border:1px solid #d7e0ee;background:#fff;border-radius:13px;padding:13px;font-weight:900;cursor:pointer;text-align:right}.opt.sel{border:2px solid #2563eb;background:#edf3ff}.next,.submit,.back{border:0;border-radius:11px;padding:11px 15px;font-weight:900;cursor:pointer}.next{display:none;background:#2563eb;color:#fff}.submit{background:#7c3aed;color:#fff}.back{display:inline-block;background:#edf3ff;color:#2850a3;text-decoration:none;margin-top:8px}.bar{height:8px;background:#edf1f7;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#2563eb}.score{font-size:23px;font-weight:900}@media(max-width:600px){.opts{grid-template-columns:1fr}}</style><main class="w"><header class="hero"><h1>🎯 التقييم التفاعلي · Leçon 3</h1><p>20 سؤالًا في المفردات والقواعد وفهم السياق والتطبيق.</p><div class="meta"><span class="badge">20 سؤالًا</span><span class="badge">النجاح 14/20</span></div></header><section class="q"><b id="p"></b><div class="bar"><i id="bar"></i></div></section><div id="app"></div><section class="result"><div id="score" class="score">النتيجة: 0 / 20</div><button id="submit" class="submit">إظهار النتيجة النهائية</button><div id="final"></div><br><a class="back" href="../../../../lesson.html?id=grade8-u2-l3&section=assessment">← العودة إلى الدرس</a></section></main><script>const Q=[['ما معنى un balcon؟',['شرفة','مفتاح','أثاث','متحف'],0],['ما معنى des meubles؟',['أثاث','منزل','هاتف','محطة'],0],['ما معنى une clé؟',['مفتاح','شرفة','مسرح','بنك'],0],['ما معنى une gare؟',['محطة قطار','مكتب بريد','سينما','مستشفى'],0],['J’___ une chambre.',['ai','suis','es','ont'],0],['Tu ___ une clé.',['as','es','ai','est'],0],['Il ___ une photo.',['a','est','ont','sont'],0],['Nous ___ une maison.',['avons','sommes','avez','ont'],0],['Vous ___ une clé.',['avez','êtes','avons','ont'],0],['Ils ___ une photo.',['ont','sont','avez','êtes'],0],['Je ___ dans le salon.',['suis','ai','es','est'],0],['Tu ___ dans la cuisine.',['es','est','suis','as'],0],['Nous ___ dans le salon.',['sommes','avons','êtes','sont'],0],['La maison ___ grande.',['est','a','sont','es'],0],['Elles ___ dans la maison.',['sont','ont','êtes','avez'],0],['أي جملة تعني: يوجد أثاث في المنزل؟',['Il y a des meubles dans la maison.','J’ai des meubles dans la maison.','Je suis des meubles dans la maison.','La maison est des meubles.'],0],['أي جملة تعني: أنا في غرفتي؟',['Je suis dans ma chambre.','J’ai ma chambre.','Il y a ma chambre.','Je ai dans ma chambre.'],0],['أي جملة تعني: لدي هاتف؟',['J’ai un téléphone.','Je suis un téléphone.','Il y a un téléphone.','Je ai un téléphone.'],0],['أي جملة تعبّر عن وجود شيء؟',['Il y a une voiture devant la maison.','J’ai une voiture.','Je suis dans la voiture.','La voiture est grande.'],0],['أي جملة تعبّر عن الامتلاك؟',['J’ai une clé.','Je suis dans la maison.','Il y a une clé.','La maison est grande.'],0]];let i=0,a=Array(20).fill(null);const app=document.getElementById('app');function draw(){const q=Q[i];document.getElementById('p').textContent='السؤال '+(i+1)+' / 20';document.getElementById('bar').style.width=i/20*100+'%';app.innerHTML='<article class="q"><h2>'+(i+1)+'. '+q[0]+'</h2><div class="opts">'+q[1].map((x,j)=>'<button class="opt '+(a[i]===j?'sel':'')+'" data-j="'+j+'">'+x+'</button>').join('')+'</div><button id="next" class="next">السؤال التالي ←</button></article>';document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{a[i]=+b.dataset.j;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');document.getElementById('next').style.display='inline-block'});document.getElementById('next').onclick=()=>{if(i<19){i++;draw()}else document.getElementById('submit').click()}}document.getElementById('submit').onclick=()=>{let s=a.reduce((n,v,k)=>n+(v===Q[k][2]?1:0),0);document.getElementById('score').textContent='النتيجة: '+s+' / 20';document.getElementById('final').innerHTML='<p><b>'+(s>=14?'🏆 اجتياز — أحسنت!':'📘 راجع الدرس وأعد المحاولة.')+'</b></p><p>'+Math.round(s*5)+'%</p>';};draw();</script></html>
