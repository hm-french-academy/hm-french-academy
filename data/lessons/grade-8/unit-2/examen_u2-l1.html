<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار إلكتروني · U2-L1</title><style>body{font-family:Arial,Cairo,sans-serif;background:#f4f7fc;padding:22px;color:#17223b}main{max-width:850px;margin:auto;background:#fff;border-radius:22px;padding:24px}.q{padding:16px;border-bottom:1px solid #e5eaf2}.btn{background:#743bd1;color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:900}</style><main><h1>اختبار إلكتروني · Les pièces de la maison</h1><div class="q">1) «Une armoire» = <select><option>اختر</option><option>دولاب</option><option>وسادة</option><option>مطبخ</option></select></div><div class="q">2) اختر الجملة الصحيحة: <select><option>اختر</option><option>Dans ma chambre, il y a un lit.</option><option>Dans ma chambre, il y a une douche.</option></select></div><div class="q">3) «Le salon» = <select><option>اختر</option><option>غرفة المعيشة</option><option>الحمام</option></select></div><button class="btn" onclick="grade()">إظهار النتيجة</button><h2 id="r"></h2></main><script>function grade(){let s=0;document.querySelectorAll('select').forEach((x,i)=>{if((i===0&&x.value==='دولاب')||(i===1&&x.value.includes('lit'))||(i===2&&x.value==='غرفة المعيشة'))s++});r.textContent='النتيجة: '+s+' / 3';}</script></html>
