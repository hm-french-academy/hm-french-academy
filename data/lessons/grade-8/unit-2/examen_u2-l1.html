<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy · اختبار تفاعلي U2-L1</title><style>body{margin:0;background:#f4f7fc;color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:850px;margin:auto;padding:18px 10px 55px}.hero{padding:24px;border-radius:24px;background:linear-gradient(135deg,#713bd1,#2563eb,#16a394);color:#fff}.hero h1{margin:5px 0;font-size:32px}.hero p{line-height:1.8}.q{background:#fff;border:1px solid #dfe6f0;border-radius:18px;padding:18px;margin-top:12px}.q h2{font-size:18px;margin:0 0 10px}.select{width:100%;padding:13px;border:1px solid #ccd6e5;border-radius:12px;font-size:16px;background:#fff}.btn{margin-top:16px;background:#2563eb;color:#fff;border:0;border-radius:12px;padding:13px 20px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55}.result{margin-top:15px;padding:15px;border-radius:15px;background:#f7f9fd;font-weight:900;line-height:1.8}.success{color:#159447}.retry{color:#c43b3b}.progress{height:9px;background:#ffffff38;border-radius:99px;overflow:hidden;margin-top:14px}.progress i{display:block;height:100%;width:0;background:#fff;transition:.25s}.back{display:inline-block;margin-top:15px;color:#315fc8;font-weight:900;text-decoration:none}</style></head><body><main class="wrap"><section class="hero"><div>UNITÉ 2 · LEÇON 1</div><h1>⚡ الاختبار التفاعلي</h1><p>Les pièces de la maison · تدريب سريع قبل التقييم الرسمي</p><div id="p">0 / 3</div><div class="progress"><i id="bar"></i></div></section><section class="q"><h2>1) «Une armoire» =</h2><select class="select" id="q1"><option value="">اختر الإجابة</option><option value="دولاب">دولاب / خزانة ملابس</option><option value="وسادة">وسادة</option><option value="مطبخ">مطبخ</option></select></section><section class="q"><h2>2) اختر الجملة الصحيحة</h2><select class="select" id="q2"><option value="">اختر الإجابة</option><option value="lit">Dans ma chambre, il y a un lit.</option><option value="douche">Dans ma chambre, il y a une douche.</option></select></section><section class="q"><h2>3) «Le salon» =</h2><select class="select" id="q3"><option value="">اختر الإجابة</option><option value="living">غرفة المعيشة</option><option value="bath">الحمام</option></select></section><button class="btn" id="gradeBtn" onclick="grade()">إظهار النتيجة</button><div id="r" class="result" aria-live="polite"></div><a class="back" href="lesson-1-games.html">← العودة إلى مركز الألعاب</a></main><script src="../../../../scripts/learning-progress.js"></script><script>let locked=false;function grade(){if(locked)return;const answers=[q1,q2,q3],answered=answers.filter(x=>x.value).length;document.getElementById('p').textContent=answered+' / 3';document.getElementById('bar').style.width=(answered/3*100)+'%';if(answered<3){r.className='result retry';r.textContent='اختر إجابة لكل الأسئلة أولًا.';return}let s=0;if(q1.value==='دولاب')s++;if(q2.value==='lit')s++;if(q3.value==='living')s++;const passed=s>=2;r.className='result '+(passed?'success':'retry');r.textContent='النتيجة: '+s+' / 3 — '+(s===3?'🏆 ممتاز! أتقنت الاختبار التفاعلي.':s===2?'👏 جيد جدًا. يمكنك الانتقال للتقييم الرسمي.':'🔁 تحتاج إلى مراجعة الدرس ثم إعادة المحاولة.');if(passed){locked=true;try{HMProgress.completeActivity('grade8-u2-l1-interactive-assessment',s*10)}catch(e){}document.getElementById('gradeBtn').disabled=true;window.dispatchEvent(new Event('hm:activity-completed'))}}</script></body></html>
