<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ألعاب · Unité 2 Leçon 1</title><style>body{margin:0;background:#f4f7fc;color:#17223b;font-family:Arial,Cairo,sans-serif}main{max-width:1000px;margin:auto;padding:24px}.hero,.game{background:#fff;border-radius:22px;padding:22px;margin-top:16px;box-shadow:0 10px 28px #14264a12}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff}.opts{display:flex;flex-wrap:wrap;gap:10px}.opts button{padding:12px 16px;border:1px solid #ccd6e5;background:#fff;border-radius:13px;font-weight:800;cursor:pointer}.drop{min-height:70px;border:2px dashed #4b72d9;border-radius:16px;padding:16px;margin-top:12px}.chip{display:inline-block;background:#2563eb;color:#fff;padding:10px 14px;border-radius:12px;margin:5px;cursor:grab}.ok{color:#148a4d;font-weight:900}.bad{color:#c33;font-weight:900}</style></head><body><main><section class="hero"><h1>🎮 ألعاب الدرس · Les pièces de la maison</h1><p>ألعاب مستقلة عن التقييم الرسمي. الاختيارات تُخلط في كل جولة.</p></section><section class="game"><h2>🧠 1) Mot mystère</h2><p id="question"></p><div id="opts" class="opts"></div><div id="r"></div><button onclick="newRound()">🔀 جولة جديدة</button></section><section class="game"><h2>🎯 2) Classement rapide</h2><p>اسحب الكلمات إلى الصندوق المناسب.</p><div id="chips"></div><div class="drop" ondragover="event.preventDefault()" ondrop="drop(event)"><b>غرفة النوم 🛏️</b></div><div class="drop" ondragover="event.preventDefault()" ondrop="drop(event)"><b>غرفة المعيشة 🛋️</b></div><div id="dragR"></div></section><section class="game"><h2>⚡ 3) Intrus</h2><p>اختر الكلمة التي لا تنتمي للمجموعة.</p><div class="opts"><button onclick="intrus(this,false)">La chambre</button><button onclick="intrus(this,false)">Le salon</button><button onclick="intrus(this,true)">Un oreiller</button><button onclick="intrus(this,false)">La cuisine</button></div><div id="ir"></div></section></main><script src="../../../../scripts/learning-progress.js"></script><script>const data=[['غرفة النوم','La chambre'],['غرفة المعيشة','Le salon'],['المطبخ','La cuisine'],['الحمام','La salle de bains']];let current;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function newRound(){current=shuffle(data)[0];document.getElementById('question').textContent='اختر الفرنسية الصحيحة لـ «'+current[0]+'»';document.getElementById('opts').innerHTML=shuffle([current[1],...shuffle(data.filter(x=>x!==current)).slice(0,2).map(x=>x[1])]).map(x=>`<button onclick="answer(this,'${x.replace(/'/g,"\\'")}')">${x}</button>`).join('');document.getElementById('r').textContent=''}function answer(b,x){const ok=x===current[1];document.getElementById('r').textContent=ok?'✓ ممتاز':'✗ جرّب مرة أخرى';document.getElementById('r').className=ok?'ok':'bad';if(ok)HMProgress.completeActivity('grade8-u2-l1-game-mystery',10);window.dispatchEvent(new Event('hm:activity-completed'))}function makeChips(){document.getElementById('chips').innerHTML=shuffle(['La chambre','Le salon','Un lit','Un canapé']).map((x,i)=>`<span class="chip" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${x}')">${x}</span>`).join('')}function drop(e){const x=e.dataTransfer.getData('text/plain');e.currentTarget.innerHTML+='<span class="chip">'+x+'</span>';document.getElementById('dragR').textContent='تم التقاط الكلمة ووضعها ✓';HMProgress.completeActivity('grade8-u2-l1-game-drag',5);window.dispatchEvent(new Event('hm:activity-completed'))}function intrus(b,ok){document.getElementById('ir').textContent=ok?'✓ الكلمة المختلفة هي Un oreiller':'✗ ليست هي الكلمة المختلفة';document.getElementById('ir').className=ok?'ok':'bad';if(ok)HMProgress.completeActivity('grade8-u2-l1-game-intrus',10)}newRound();makeChips();</script></body></html>
