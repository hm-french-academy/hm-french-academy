<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ألعاب · Unité 2 Leçon 2</title><style>body{margin:0;background:#f4f7fc;color:#17223b;font-family:Arial,Cairo,sans-serif}main{max-width:1000px;margin:auto;padding:24px}.hero,.game{background:#fff;border-radius:22px;padding:22px;margin-top:16px;box-shadow:0 10px 28px #14264a12}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff}.opts{display:flex;flex-wrap:wrap;gap:10px}.opts button{padding:12px 16px;border:1px solid #ccd6e5;background:#fff;border-radius:13px;font-weight:800}.ok{color:#148a4d;font-weight:900}.bad{color:#c33;font-weight:900}.slot{display:inline-block;min-width:130px;padding:12px;border:2px dashed #4b72d9;border-radius:13px;margin:6px}</style></head><body><main><section class="hero"><h1>🎮 ألعاب الدرس · Le salon, la cuisine et la salle de bains</h1><p>جولات عشوائية وتدريبات مختلفة عن أسئلة التقييم.</p></section><section class="game"><h2>🔀 1) Choisis vite</h2><p id="q"></p><div id="o" class="opts"></div><div id="r"></div><button onclick="round()">جولة جديدة</button></section><section class="game"><h2>🧩 2) Memory rapide</h2><p>اكشف زوجًا من الكلمات المتطابقة المعنى.</p><div id="mem" class="opts"></div><div id="mr"></div></section><section class="game"><h2>⚡ 3) Intrus</h2><p>أي كلمة ليست من أدوات المنزل؟</p><div class="opts"><button onclick="i(false)">Le canapé</button><button onclick="i(false)">Le fauteuil</button><button onclick="i(true)">Un avion</button><button onclick="i(false)">Le tapis</button></div><div id="ir"></div></section></main><script src="../../../../scripts/learning-progress.js"></script><script>const d=[['الأريكة','Le canapé'],['كرسي بذراعين','Le fauteuil'],['السجادة','Le tapis'],['الثلاجة','Le réfrigérateur']];function sh(a){return [...a].sort(()=>Math.random()-.5)}let cur;function round(){cur=sh(d)[0];q.textContent='اختر الفرنسية لـ «'+cur[0]+'»';o.innerHTML=sh([cur[1],...sh(d.filter(x=>x!==cur)).slice(0,2).map(x=>x[1])]).map(x=>`<button onclick="ans(this,'${x}')">${x}</button>`).join('');r.textContent=''}function ans(b,x){const ok=x===cur[1];r.textContent=ok?'✓ صحيح':'✗ حاول';r.className=ok?'ok':'bad';if(ok)HMProgress.completeActivity('grade8-u2-l2-game-choose',10)}const pairs=[['Le canapé','أريكة'],['Le tapis','سجادة'],['La douche','دُش'],['L’évier','حوض']];let revealed=[];function memGame(){mem.innerHTML=sh(pairs.flat()).map(x=>`<button onclick="m(this,'${x}')">❓</button>`).join('')}function m(b,x){b.textContent=x;revealed.push({b,x});if(revealed.length===2){const ok=(revealed[0].x==='Le canapé'&&revealed[1].x==='أريكة')||(revealed[1].x==='Le canapé'&&revealed[0].x==='أريكة');mr.textContent=ok?'✓ زوج صحيح':'✗ جرب زوجًا آخر';if(ok)HMProgress.completeActivity('grade8-u2-l2-game-memory',10);revealed=[];setTimeout(memGame,500)}}function i(ok){ir.textContent=ok?'✓ ممتاز':'✗ ليست هي';ir.className=ok?'ok':'bad';if(ok)HMProgress.completeActivity('grade8-u2-l2-game-intrus',10)}round();memGame();</script></body></html>
