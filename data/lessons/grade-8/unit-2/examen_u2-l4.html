<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار إلكتروني · U2-L4</title><style>body{font-family:Arial,Cairo,sans-serif;background:#f4f7fc;padding:22px;color:#17223b}main{max-width:850px;margin:auto;background:#fff;border-radius:22px;padding:24px}.q{padding:16px;border-bottom:1px solid #e5eaf2}.btn{background:#743bd1;color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:900}</style><main><h1>اختبار إلكتروني · Prépositions et possessifs</h1><div class="q">1) Le livre est ___ la table. <select><option>اختر</option><option>sur</option><option>sous</option></select></div><div class="q">2) ___ chambre est petite. (أنا) <select><option>اختر</option><option>Ma</option><option>Mon</option></select></div><div class="q">3) Le sac est ___ le bureau. <select><option>اختر</option><option>sous</option><option>entre</option></select></div><button class="btn" onclick="grade()">إظهار النتيجة</button><h2 id="r"></h2></main><script>function grade(){const a=['sur','Ma','sous'];let s=0;document.querySelectorAll('select').forEach((x,i)=>{if(x.value===a[i])s++});document.getElementById('r').textContent='النتيجة: '+s+' / 3';}</script></html>
