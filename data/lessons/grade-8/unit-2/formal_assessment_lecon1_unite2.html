<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التقييم الرسمي · الدرس 1</title><style>body{font-family:Arial,Cairo,sans-serif;background:#f4f7fc;padding:22px;color:#17223b}main{max-width:850px;margin:auto}.q{background:#fff;border-radius:20px;padding:20px;margin:12px 0}.q label{display:block;margin:8px 0}.btn{background:#2563eb;color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:900}</style><main><h1>التقييم الرسمي · Leçon 1</h1><div class="q"><b>1. أين يوجد السرير؟</b><label><input type="radio" name="q1" value="1"> Dans la chambre</label><label><input type="radio" name="q1" value="0"> Dans la cuisine</label></div><div class="q"><b>2. «La cuisine» تعني:</b><label><input type="radio" name="q2" value="1"> المطبخ</label><label><input type="radio" name="q2" value="0"> غرفة النوم</label></div><div class="q"><b>3. أكمل: Dans le salon, il y a un ___.</b><label><input type="radio" name="q3" value="1"> canapé</label><label><input type="radio" name="q3" value="0"> oreiller</label></div><button class="btn" onclick="grade()">تصحيح التقييم</button><h2 id="r"></h2></main><script>function grade(){let s=0;for(let i=1;i<=3;i++)s+=Number(document.querySelector('input[name=q'+i+']:checked')?.value||0);document.getElementById('r').textContent='النتيجة: '+s+' / 3';}</script></html>
