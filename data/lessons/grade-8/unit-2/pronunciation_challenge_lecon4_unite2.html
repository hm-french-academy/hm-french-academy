actions"><a class="link" href="../../../../lesson.html?id=grade8-u2-l4">← العودة إلى الدرس</a><a class="link" href="lesson-4-games.html">🎮 الألعاب</a><a class="link" href="formal_assessment_lecon4_unite2.html">📝 التقييم الرسمي</a></div></section><script src="../../../../scripts/speech-runtime.js?v=20260817-u2l4pron1"></script><script src="../../../../scripts/activity-complete.js?v=20260817-u2l4pron1"></script><script>(function(){const W=[['sur','فوق','Le livre est sur la table.','ur تُنطق /yʁ/ تقريبًا، و r فرنسية حلقية.'],['sous','تحت','Le sac est sous la table.','ou تُنطق /u/.'],['dans','داخل','Le livre est dans le sac.','an صوت أنفي /ɑ̃/، و s النهائية لا تُنطق.'],['devant','أمام','La chaise est devant la table.','en في devant صوت أنفي /ɑ̃/، و t النهائية لا تُنطق.'],['derrière','خلف','La chaise est derrière la table.','è تُنطق /ɛ/، و re النهائية لا تُنطق.'],['entre','بين','La table est entre les chaises.','en في entre صوت أنفي /ɑ̃/، و e النهائية لا تُنطق.'],['mon','ـي (مذكر)','C’est mon livre.','on صوت أنفي /ɔ̃/.'],['ma','ـي (مؤنث)','C’est ma chambre.','a تُنطق /a/، و ch في chambre تُنطق /ʃ/.'],['mes','ـي (جمع)','Ce sont mes livres.','e تُنطق /e/ في mes، و s النهائية لا تُنطق.'],['ton','ـك (مذكر)','C’est ton livre.','on صوت أنفي /ɔ̃/.'],['ta','ـك (مؤنث)','C’est ta chambre.','a تُنطق /a/.'],['tes','ـك (جمع)','Ce sont tes livres.','e تُنطق /e/، و s النهائية لا تُنطق.'],['son','ـه / ـها (مذكر)','C’est son livre.','on صوت أنفي /ɔ̃/.'],['sa','ـه / ـها (مؤنث)','C’est sa chambre.','a تُنطق /a/.'],['ses','ـه / ـها (جمع)','Ce sont ses livres.','e تُنطق /e/، و s النهائية لا تُنطق.']];const root=document.getElementById('words'),status=document.getElementById('status');let heard=new Set();function speak(t,b,label){status.textContent='⏸️ '+label;return window.HMSpeech?HMSpeech.speak(t,{button:b,lang:'fr-FR',rate:.82}):Promise.resolve(false)}W.forEach((x,i)=>{const c=document.createElement('article');c.className='word';c.innerHTML='<div class="fr"></div><div class="ar"></div><div class="ex"></div><div class="buttons"><button class="btn">🔊 الكلمة</button><button class="btn example">🗣️ المثال</button></div><div class="pron"><b>💡 ملاحظة النطق:</b> '+x[3]+'</div>';c.querySelector('.fr').textContent=x[0];c.querySelector('.ar').textContent=x[1];c.querySelector('.ex').textContent=x[2];let b=c.querySelector('.btn'),e=c.querySelector('.example');b.onclick=async()=>{let ok=await speak(x[0],b,'جاري نطق الكلمة: '+x[0]);status.textContent=ok?'✅ استمع ثم كرر الكلمة.':'⚠️ النطق غير متاح على هذا الجهاز';heard.add(i);if(heard.size===W.length&&window.HMActivityComplete)HMActivityComplete.complete('grade8-u2-l4','pronunciation',20)};e.onclick=async()=>{let ok=await speak(x[2],e,'جاري نطق المثال: '+x[2]);status.textContent=ok?'✅ استمع إلى المثال ثم كرر الجملة.':'⚠️ النطق غير متاح على هذا الجهاز'};root.append(c)})})();</script></body></html>
