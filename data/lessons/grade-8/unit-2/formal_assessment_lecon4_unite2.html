<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy · التقييم الرسمي · Leçon 4</title><style>body{margin:0;background:#f4f7fc;color:#17223b;font-family:Arial,Cairo,sans-serif}.w{max-width:900px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff;border-radius:28px;padding:25px}.q{background:#fff;border:1px solid #dfe6f0;border-radius:20px;padding:18px;margin:13px 0}.q label{display:block;padding:11px;margin:7px 0;border:1px solid #e1e7f0;border-radius:12px;background:#f8faff;cursor:pointer}.btn{border:0;background:#2563eb;color:#fff;border-radius:13px;padding:13px 18px;font-weight:900;cursor:pointer}.res{display:none;background:#fff;border:1px solid #dfe6f0;border-radius:18px;padding:18px;margin-top:15px;font-weight:900;line-height:1.8}.show{display:block}.score{font-size:24px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.link{background:#edf3ff;color:#2850a3;padding:11px 14px;border-radius:12px;text-decoration:none;font-weight:900}</style><main class="w"><section class="hero"><h1>📝 التقييم الرسمي · Leçon 4</h1><p>Les prépositions de lieu et les adjectifs possessifs · 15 سؤالًا</p><p>معيار الاختيار: معنى الجملة + جنس وعدد الاسم المملوك + السياق.</p></section><form id="f"></form><button class="btn" onclick="grade()">✓ تصحيح التقييم</button><section id="res" class="res"><div id="score" class="score"></div><div id="fb"></div></section><div class="actions"><a class="link" href="../../../../lesson.html?id=grade8-u2-l4">← العودة إلى الدرس</a><a class="link" href="lesson-4-games.html">🎮 Game Studio</a><a class="link" href="reference_lecon4_unite2.html">📄 المرجع</a></div></main><script src="../../../../scripts/learning-progress.js"></script><script>const Q=[['Le livre est ___ la table.',['sur','sous','entre'],0],['Le sac est ___ la table.',['sous','sur','devant'],0],['Le livre est ___ le sac.',['dans','derrière','entre'],0],['La chaise est ___ la table.',['devant','sous','sur'],0],['La chaise est ___ la table.',['derrière','dans','entre'],0],['La table est ___ les chaises.',['entre','sur','sous'],0],['___ chambre est grande. (je)',['Ma','Mon','Mes'],0],['___ livres sont sur la table. (je)',['Mes','Ma','Mon'],0],['C’est ___ téléphone. (tu)',['ton','ta','tes'],0],['C’est ___ chambre. (tu)',['ta','ton','tes'],0],['Ce sont ___ photos. (il)',['ses','sa','son'],0],['C’est ___ livre. (elle)',['son','sa','ses'],0],['___ amie est dans la chambre. (je)',['Mon','Ma','Mes'],0],['اختر الجملة الصحيحة.',['Mon amie est devant la porte.','Ma amie est devant la porte.','Mes amie est devant la porte.'],0],['أي قاعدة تحدد الاختيار في mon/ma/mes؟',['جنس وعدد الاسم المملوك','جنس المالك فقط','مكان الشيء فقط'],0]];f.innerHTML=Q.map((q,i)=>`<section class="q"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}</section>`).join('');function grade(){let s=0,miss=0;Q.forEach((q,i)=>{const x=document.querySelector('input[name=q'+i+']:checked');if(!x)miss++;else if(+x.value===q[2])s++});res.className='res show';if(miss){score.textContent='⚠️ أكمل التقييم أولًا';fb.textContent='ما زالت هناك '+miss+' أسئلة بلا إجابة.';return}score.textContent='النتيجة: '+s+' / 15';fb.textContent=s>=13?'🏆 ممتاز — إتقان قوي للدرس.':s>=10?'👍 جيد جدًا — راجع النقاط التي أخطأت فيها.':'📘 تحتاج إلى مراجعة حروف المكان وصفات الملكية ثم إعادة التدريب.';try{HMProgress.completeActivity('grade8-u2-l4-formal-assessment',s>=13?30:s>=10?20:10)}catch(e){}} </script></main></html>
