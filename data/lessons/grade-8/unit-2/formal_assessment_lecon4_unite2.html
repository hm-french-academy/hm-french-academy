<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التقييم الرسمي · الدرس 4</title><style>body{font-family:Arial,Cairo,sans-serif;background:#f4f7fc;padding:22px;color:#17223b}main{max-width:850px;margin:auto}.q{background:#fff;border-radius:20px;padding:20px;margin:12px 0}.q label{display:block;margin:8px 0}.btn{background:#2563eb;color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:900}</style><main><h1>التقييم الرسمي · Leçon 4</h1><div class="q"><b>1. Le livre est ___ la table.</b><label><input type="radio" name="q1" value="1"> sur</label><label><input type="radio" name="q1" value="0"> sous</label></div><div class="q"><b>2. ___ chambre est grande. (أنا)</b><label><input type="radio" name="q2" value="1"> Ma</label><label><input type="radio" name="q2" value="0"> Mon</label></div><div class="q"><b>3. Le sac est ___ le bureau.</b><label><input type="radio" name="q3" value="1"> sous</label><label><input type="radio" name="q3" value="0"> entre</label></div><button class="btn" onclick="grade()">تصحيح التقييم</button><h2 id="r"></h2></main><script>function grade(){let s=0;for(let i=1;i<=3;i++)s+=Number(document.querySelector('input[name=q'+i+']:checked')?.value||0);document.getElementById('r').textContent='النتيجة: '+s+' / 3';}</script></html>
