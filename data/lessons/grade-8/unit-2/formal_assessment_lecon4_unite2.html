<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy · تقييم الدرس 4</title><style>:root{--nav:#14264a;--blue:#2563eb;--line:#dfe6f0;--muted:#68758b}*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:var(--nav);font-family:Arial,Cairo,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.hero{border-radius:28px;padding:25px;color:#fff;background:linear-gradient(135deg,#173a82,#2563eb,#16a394)}.eyebrow{font-size:12px;font-weight:900}.hero h1{margin:7px 0;font-size:clamp(28px,6vw,42px)}.hero p{line-height:1.8;margin:0}.path{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.step{background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px;text-align:center;font-weight:900;font-size:12px}.step b{display:block;font-size:20px}.q{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin:13px 0}.q label{display:block;padding:12px 13px;margin:9px 0;background:#f8faff;border:1px solid var(--line);border-radius:12px;cursor:pointer}.q input{margin-left:8px}.btn{border:0;background:var(--blue);color:#fff;border-radius:13px;padding:13px 18px;font-weight:900;cursor:pointer}.result{display:none;margin-top:16px;padding:16px;border-radius:15px;background:#fff;border:1px solid var(--line);font-weight:900;line-height:1.8}.result.show{display:block}.score{font-size:23px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.link{display:inline-block;text-decoration:none;background:#edf3ff;color:#2850a3;padding:12px 16px;border-radius:13px;font-weight:900}@media(max-width:620px){.path{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><section class="hero"><div class="eyebrow">HM ACADEMY · UNITÉ 2 · LEÇON 4</div><h1>📝 التقييم الرسمي · Leçon 4</h1><p>اختبر فهمك لحروف الجر وصفات الملكية في جمل قصيرة.</p></section><section class="path"><div class="step"><b>📘</b>التعلّم</div><div class="step"><b>📄</b>المرجع</div><div class="step"><b>📝</b>التقييم</div><div class="step"><b>🎮</b>الألعاب</div></section><form id="assessment"><section class="q"><b>1. Le livre est ___ la table.</b><label><input type="radio" name="q1" value="1"> sur</label><label><input type="radio" name="q1" value="0"> sous</label></section><section class="q"><b>2. ___ chambre est grande. (أنا)</b><label><input type="radio" name="q2" value="1"> Ma</label><label><input type="radio" name="q2" value="0"> Mon</label></section><section class="q"><b>3. Le sac est ___ le bureau.</b><label><input type="radio" name="q3" value="1"> sous</label><label><input type="radio" name="q3" value="0"> entre</label></section><button class="btn" type="submit">✓ تصحيح التقييم</button></form><section id="r" class="result"><div id="score" class="score"></div><div id="feedback"></div></section><div class="actions"><a class="link" href="../../../../lesson.html?id=grade8-u2-l4">← العودة إلى الدرس</a><a class="link" href="reference_lecon4_unite2.html">📄 المرجع</a><a class="link" href="lesson-4-games.html">🎮 الألعاب</a></div></main><script src="../../../../scripts/learning-progress.js"></script><script>(function(){const form=document.getElementById('assessment'),res=document.getElementById('r'),score=document.getElementById('score'),feedback=document.getElementById('feedback');let submitted=false;form.addEventListener('submit',function(e){e.preventDefault();if(submitted)return;const qs=['q1','q2','q3'];if(qs.some(q=>!form.querySelector('input[name="'+q+'"]:checked'))){res.className='result show';score.textContent='⚠️ أكمل الأسئلة الثلاثة أولًا';feedback.textContent='اختر إجابة لكل سؤال ثم اضغط التصحيح.';return}const s=qs.reduce((n,q)=>n+Number(form.querySelector('input[name="'+q+'"]:checked').value),0);submitted=true;form.querySelectorAll('input,button').forEach(x=>x.disabled=true);score.textContent='النتيجة: '+s+' / 3';feedback.textContent=s===3?'🏆 ممتاز! أتقنت الدرس.':s===2?'👍 جيد جدًا، راجع نقطة واحدة ثم أعد التدريب.':'📘 راجع حروف الجر وصفات الملكية ثم أعد التدريب.';res.className='result show';try{if(window.HMProgress&&typeof HMProgress.completeActivity==='function')HMProgress.completeActivity('grade8-u2-l4-formal-assessment',s===3?30:10)}catch(err){}})})();</script></body></html>
