<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#f4f7fc;color:#17223b;font-family:Arial,Cairo,sans-serif}.w{max-width:1000px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#173a82,#7c3aed,#2563eb);color:#fff;border-radius:28px;padding:28px}.g{background:#fff;border:1px solid #dfe6f0;border-radius:22px;padding:20px;margin-top:15px}.o{display:flex;flex-wrap:wrap;gap:9px}.o button{padding:12px 15px;border:1px solid #ccd6e5;border-radius:12px;background:#fff;font-weight:900;cursor:pointer}.r{min-height:28px;margin-top:10px;font-weight:900;line-height:1.7}.ok{color:#159447}.bad{color:#c43b3b}.btn{background:#2563eb;color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer}.score{font-weight:900;margin:14px 0}</style><main class="w"><section class="hero"><h1>🎮 HM Game Studio · Leçon 2</h1><p>Les objets du voyage · أدوات السفر</p><p>ألعاب متنوعة تعتمد على المعنى والسياق والتركيب، وليس الحفظ فقط.</p></section><div id="app"></div><div id="score" class="score">⭐ نقاط الجولة: 0 / 80</div><button class="btn" onclick="start()">🔀 جولة جديدة</button></main><script>const M=[['🧳 Visual Match','اختر الكلمة الفرنسية التي تعني «حقيبة سفر».','une valise',['une valise','un passeport','un billet'],'valise = حقيبة سفر.'],['🛂 Travel ID','اختر الوثيقة المطلوبة للسفر.','un passeport',['un passeport','un guide','un touriste'],'passeport = جواز سفر.'],['🎫 Ticket Match','ما معنى «un billet»؟','تذكرة',['تذكرة','مرشد','سائح'],'billet = تذكرة.'],['🧭 Guide or Tourist','من يساعد السائح؟','un guide',['un guide','un touriste','un billet'],'guide = مرشد.'],['👤 Role Match','من يقوم بالرحلة بصفته مسافرًا؟','un touriste',['un touriste','un passeport','une valise'],'touriste = سائح.'],['🧩 Sentence Builder','أكمل: J’ai mon ___.','passeport',['passeport','touriste','voyage'],'التركيب الصحيح: J’ai mon passeport.'],['🎯 Context Choice','شخص سيغادر الآن. ماذا تقول له؟','Bon voyage !',['Bon voyage !','Bon passeport !','Bon billet !'],'Bon voyage = أتمنى لك رحلة سعيدة.'],['🔎 Intrus','أي كلمة ليست أداة/شيئًا للسفر؟','un touriste',['un touriste','une valise','un billet'],'touriste شخص، بينما valise وbillet أشياء.']];let pts=0;function start(){pts=0;score.textContent='⭐ نقاط الجولة: 0 / 80';app.innerHTML=M.map(x=>`<section class="g"><h2>${x[0]}</h2><p><b>${x[1]}</b></p><div class="o">${[...x[3]].sort(()=>Math.random()-.5).map(o=>`<button onclick="ans(this,'${o.replaceAll("'","\\'")}','${x[2].replaceAll("'","\\'")}','${x[4].replaceAll("'","\\'")}')">${o}</button>`).join('')}</div><div class="r"></div></section>`).join('')}function ans(b,x,a,why){let box=b.parentElement,r=box.nextElementSibling;if(box.dataset.done)return;box.dataset.done=1;let ok=x===a;r.textContent=ok?'✓ صحيح — '+why:'✗ الإجابة الصحيحة: '+a+' — '+why;r.className='r '+(ok?'ok':'bad');box.querySelectorAll('button').forEach(x=>x.disabled=true);if(ok){pts+=10;score.textContent='⭐ نقاط الجولة: '+pts+' / 80'}}start();</script></html>
