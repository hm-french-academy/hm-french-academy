<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | التقييم الرسمي — الدرس الرابع</title><style>body{margin:0;background:#f4f7fc;color:#14264a;font-family:Arial,Cairo,sans-serif}.wrap{max-width:920px;margin:auto;padding:24px 14px}.back{display:inline-block;background:#fff;padding:10px 14px;border-radius:12px;text-decoration:none;font-weight:900;color:#2850a3}.hero{margin-top:14px;padding:28px;border-radius:26px;background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff}.card{background:#fff;border:1px solid #dfe6f0;border-radius:20px;padding:20px;margin:14px 0}.opt{display:block;width:100%;text-align:right;border:2px solid #dbe4f2;background:#f8faff;border-radius:13px;padding:14px;margin:9px 0;cursor:pointer;font-weight:700}.selected{border-color:#2563eb!important;background:#edf4ff!important}.submit{width:100%;border:0;border-radius:14px;padding:15px;background:#e62982;color:#fff;font-weight:900}.result{margin-top:15px}</style></head><body><main class="wrap"><a class="back" href="#" id="back">← العودة إلى الدرس</a><section class="hero"><h1>التقييم الرسمي</h1><p>الدرس الرابع — حروف الجر وأدوات السؤال</p><p>12 سؤالًا متنوعة على أهداف الدرس.</p></section><form id="exam"></form><section class="card"><button type="button" class="submit" id="submit">تسليم التقييم</button><div id="result" class="result"></div></section></main><script>(function(){document.getElementById('back').onclick=e=>{e.preventDefault();const p=location.pathname.split('/'),i=p.indexOf('data'),base=i>0?p.slice(0,i).join('/'):'/';location.href=(base.endsWith('/')?base:base+'/')+'lesson.html?id=grade8-u3-l4'}})();const qs=[['اختر الجملة الصحيحة.',['Je vais à Paris.','Je vais en Paris.','Je à Paris vais.'],0],['اختر الجملة الصحيحة.',['Je voyage en avion.','Je voyage à avion.','Je en avion voyage.'],0],['اختر أداة السؤال عن المكان: ___ est la gare ?',['Où','Quand','Pourquoi'],0],['اختر أداة السؤال عن الوقت: ___ pars-tu ?',['Quand','Où','Comment'],0],['اختر أداة السؤال عن الطريقة: ___ vas-tu à Paris ?',['Comment','Pourquoi','Où'],0],['اختر أداة السؤال عن السبب: ___ voyages-tu ?',['Pourquoi','Quand','Où'],0],['أكمل: Nous voyageons ___ train.',['en','à','où'],0],['أكمل: Je vais ___ la gare.',['à','en','quand'],0],['اختر الترجمة الصحيحة: Où est la gare ?',['أين محطة القطار؟','متى تغادر؟','لماذا تسافر؟'],0],['اختر الترجمة الصحيحة: Quand pars-tu ?',['متى ستغادر؟','كيف تسافر؟','أين المحطة؟'],0],['أي جملة تسأل عن السبب؟',['Pourquoi voyages-tu ?','Où voyages-tu ?','Quand voyages-tu ?'],0],['أي جملة تسأل عن الطريقة؟',['Comment vas-tu à Paris ?','Pourquoi vas-tu à Paris ?','Où vas-tu à Paris ?'],0]];const f=document.getElementById('exam');qs.forEach((q,i)=>{let c=document.createElement('section');c.className='card';c.innerHTML='<b>'+(i+1)+'. '+q[0]+'</b>'+q[1].map((x,j)=>'<button type="button" class="opt" data-q="'+i+'" data-a="'+j+'">'+String.fromCharCode(65+j)+'. '+x+'</button>').join('');f.appendChild(c)});document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.opt[data-q="'+b.dataset.q+'"]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});document.getElementById('submit').onclick=()=>{let score=0,missing=[];qs.forEach((q,i)=>{let b=document.querySelector('.opt[data-q="'+i+'"].selected');if(!b)missing.push(i+1);else if(+b.dataset.a===q[2])score++});const r=document.getElementById('result');r.innerHTML=missing.length?'لا يمكن تسليم التقييم قبل الإجابة عن: '+missing.join('، '):'<div style="background:#eef8f6;padding:18px;border-radius:16px"><h2>النتيجة: '+score+' / '+qs.length+'</h2><p>تم تسجيل النتيجة ويمكنك مراجعة الدرس عند الحاجة.</p></div>'}</script></body></html>
