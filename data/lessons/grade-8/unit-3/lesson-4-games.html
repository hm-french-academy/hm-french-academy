<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>HM Academy | ألعاب الدرس الرابع</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px 14px 50px}.hero{background:linear-gradient(130deg,#14264a,#315fc8,#0f766e);color:white;border-radius:26px;padding:24px}.hero h1{margin:0 0 8px;font-size:clamp(24px,4vw,34px)}.hero p{line-height:1.8;margin:7px 0}.progress{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.badge{background:#ffffff20;border:1px solid #ffffff40;border-radius:999px;padding:7px 11px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}.card,.play{background:white;border:1px solid #dce5f0;border-radius:20px;padding:18px}.card h2{margin:0 0 8px;font-size:20px}.card p{line-height:1.7;color:#64748b;min-height:48px}.btn{border:0;border-radius:12px;padding:12px 15px;background:#2563eb;color:white;font-weight:900;cursor:pointer;font-size:15px;min-height:44px}.btn.alt{background:#eaf0ff;color:#214b9a}.btn:disabled{opacity:.6;cursor:default}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.play{margin-top:16px}.play h2{margin-top:0}.prompt{font-size:21px;font-weight:900;line-height:1.6;margin:14px 0}.choices{display:flex;flex-wrap:wrap;gap:9px}.choices button{background:#fff;color:#17223b;border:1px solid #cbd5e1;border-radius:13px;padding:12px 14px;min-height:46px;font-weight:800;cursor:pointer}.choices button:focus-visible,.btn:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}.feedback{margin-top:13px;font-weight:900;min-height:25px;line-height:1.7}.good{color:#168044}.bad{color:#b42318}.scoreline{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid #e2e8f0;padding-top:12px;margin-top:14px;font-weight:900}.tiles{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.tile{border:1px solid #b8c7df;background:#edf3ff;color:#193b75;border-radius:12px;padding:12px 14px;font-weight:900;cursor:pointer;min-height:44px}.tile.selected{background:#d8f5e5;border-color:#16a34a}.tile:disabled{opacity:.5}.muted{color:#64748b;line-height:1.7}.end{background:#f0fdf4;border:1px solid #bbf7d0;padding:14px;border-radius:14px;margin-top:12px;font-weight:900}.back{display:inline-block;text-decoration:none;background:white;border:1px solid #dbe4f0;color:#234b98;border-radius:12px;padding:12px 15px;font-weight:900;margin-top:16px}@media(max-width:650px){.grid{grid-template-columns:1fr}.card p{min-height:0}.hero{padding:20px}.prompt{font-size:19px}}
</style></head><body><main class="wrap"><section class="hero"><h1>🚆 سباق حول العالم</h1><p><b>à / en + أدوات السؤال في مواقف السفر</b></p><p>خطط لرحلتك، طابق الأسئلة بالإجابات، ابنِ حوارًا في المحطة، واكتشف أخطاء المسافرين.</p><div class="progress"><span class="badge">⭐ النقاط: <span id="total">0</span></span><span class="badge">🏅 كل إجابة صحيحة = 10 نقاط</span><span class="badge">🎮 أربع تجارب مختلفة</span></div></section><section id="hub" class="grid"></section><section id="play"></section><a class="back" href="../../../../lesson.html?id=grade8-u3-l4">← العودة إلى الدرس</a></main><script>
const MODES=[{"id":"match","name":"🧠 ذاكرة المسافر","desc":"طابق أداة السؤال أو التعبير بمعناه.","type":"match","pairs":[["où","أين"],["quand","متى"],["comment","كيف"],["pourquoi","لماذا"],["à Paris","إلى باريس"],["en avion","بالطائرة"]]},{"id":"mission","name":"🧭 مخطط الرحلة","desc":"اختر العبارة التي تناسب موقف السفر.","type":"quiz","questions":[["أريد السؤال عن المكان.","Où est la gare ?",["Quand est la gare ?","Où est la gare ?","Pourquoi est la gare ?"]],["أسافر بالطائرة.","Je voyage en avion.",["Je voyage à avion.","Je voyage en avion.","Je voyage où avion."]],["أذهب إلى باريس.","Je vais à Paris.",["Je vais en Paris.","Je vais à Paris.","Je vais par Paris."]],["السؤال عن الوقت.","Quand pars-tu ?",["Où pars-tu ?","Quand pars-tu ?","Comment pars-tu ?"]],["السؤال عن السبب.","Pourquoi voyages-tu ?",["Comment voyages-tu ?","Où voyages-tu ?","Pourquoi voyages-tu ?"]],["السؤال عن وسيلة السفر.","Comment voyages-tu ?",["Comment voyages-tu ?","Quand voyages-tu ?","Pourquoi voyages-tu ?"]]]},{"id":"build","name":"🧩 ابنِ حوار المحطة","desc":"رتّب الكلمات لتكوين جمل سفر صحيحة.","type":"build","questions":[{"target":"Où est la gare ?","tokens":["gare","la","est","Où","?"]},{"target":"Je vais à Paris.","tokens":["Paris.","à","vais","Je"]},{"target":"Je voyage en train.","tokens":["train.","en","voyage","Je"]},{"target":"Quand pars-tu ?","tokens":["pars-tu","Quand","?"]}]},{"id":"detect","name":"🕵️ مراقب الرحلة","desc":"صحّح الخطأ قبل مغادرة القطار.","type":"quiz","questions":[["خطأ: Je vais en Paris.","Je vais à Paris.",["Je vais à Paris.","Je vais en Paris.","Je vais au Paris."]],["خطأ: Je voyage à avion.","Je voyage en avion.",["Je voyage à avion.","Je voyage en avion.","Je voyage sur avion."]],["السؤال عن المكان: Quand est la gare ?","Où est la gare ?",["Quand est la gare ?","Où est la gare ?","Pourquoi est la gare ?"]],["السؤال عن الزمن: Où pars-tu ? (المقصود: متى؟)","Quand pars-tu ?",["Où pars-tu ?","Quand pars-tu ?","Comment pars-tu ?"]]]}];let total=0,active=null,idx=0,roundScore=0,selected=[],matched=new Set(),items=[],locked=false;
const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function points(n=10){total+=n;$('total').textContent=total}
function renderHub(){$('hub').innerHTML=MODES.map(m=>'<article class="card"><h2>'+safe(m.name)+'</h2><p>'+safe(m.desc)+'</p><button class="btn" data-mode="'+m.id+'">ابدأ المغامرة ←</button></article>').join('');$('hub').querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>start(b.dataset.mode)))}
function start(id){active=MODES.find(m=>m.id===id);idx=0;roundScore=0;selected=[];matched=new Set();locked=false;$('hub').hidden=true;draw()}
function shell(sub){$('play').innerHTML='<section class="play"><h2>'+safe(active.name)+'</h2><p class="muted">'+safe(active.desc)+'</p><div id="stage"></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="scoreline"><span>نقاط اللعبة: <b id="roundScore">0</b></span><span id="counter"></span></div><div class="actions"><button class="btn alt" id="restart">إعادة اللعبة ↻</button><button class="btn alt" id="home">قائمة الألعاب</button></div></section>'; $('restart').onclick=()=>start(active.id);$('home').onclick=()=>{$('play').innerHTML='';$('hub').hidden=false;active=null}}
function update(){if($('roundScore'))$('roundScore').textContent=roundScore}
function draw(){shell();if(active.type==='match')drawMatch();else if(active.type==='build')drawBuild();else drawQuiz()}
function finish(msg){$('stage').innerHTML='<div class="end">🏆 '+safe(msg)+'<br>نتيجتك: '+roundScore+' نقطة من '+(items.length*10)+' نقطة.</div><button class="btn" id="again" style="margin-top:12px">العب مرة أخرى</button>';$('again').onclick=()=>start(active.id);$('feedback').textContent='أحسنت! جرّب لعبة مختلفة لتحصل على شارة جديدة.';$('counter').textContent='اكتملت اللعبة'}
function drawMatch(){items=shuffle(active.pairs.flatMap((p,i)=>[{v:p[0],pair:i},{v:p[1],pair:i}]));selected=[];matched=new Set();$('counter').textContent='طابق كل الأزواج';$('stage').innerHTML='<p class="prompt">اكشف بطاقتين في كل محاولة وابحث عن الزوج الصحيح.</p><div class="choices" id="cards"></div><p class="muted">الأزواج المتبقية: <b id="left">'+active.pairs.length+'</b></p>';const host=$('cards');items.forEach((it,i)=>{const b=document.createElement('button');b.className='tile';b.textContent='❔ بطاقة';b.dataset.i=i;b.onclick=()=>flip(b,i);host.appendChild(b)})}
function flip(b,i){if(locked||matched.has(i)||selected.some(x=>x.i===i))return;b.textContent=items[i].v;b.classList.add('selected');selected.push({i,pair:items[i].pair});if(selected.length===2){locked=true;const [a,z]=selected;if(a.pair===z.pair){matched.add(a.i);matched.add(z.i);roundScore+=10;points();update();$('feedback').textContent='✨ تطابق صحيح! +10 نقاط';$('feedback').className='feedback good';$('left').textContent=active.pairs.length-matched.size/2;selected=[];locked=false;if(matched.size===items.length)setTimeout(()=>finish('أنهيت ذاكرة المهن بنجاح'),550)}else{$('feedback').textContent='ليستا زوجًا واحدًا؛ جرّب تذكر مكان البطاقتين.';$('feedback').className='feedback bad';setTimeout(()=>{[a.i,z.i].forEach(n=>{if(!matched.has(n)){const x=$('cards').querySelector('[data-i="'+n+'"]');if(x){x.textContent='❔ بطاقة';x.classList.remove('selected')}}});selected=[];locked=false},850)}}}
function drawQuiz(){items=shuffle(active.questions);idx=0;showQuiz()}
function showQuiz(){if(idx>=items.length){finish('أنهيت التحدي');return}const q=items[idx];$('counter').textContent='التحدي '+(idx+1)+' / '+items.length;$('stage').innerHTML='<div class="prompt">'+safe(q[0])+'</div><div class="choices" id="opts"></div>';shuffle(q[2]).forEach(v=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(locked)return;locked=true;const ok=v===q[1];if(ok){roundScore+=10;points();$('feedback').textContent='✅ صحيح! +10 نقاط';$('feedback').className='feedback good'}else{$('feedback').textContent='💡 الإجابة الأنسب: '+q[1];$('feedback').className='feedback bad'}update();$('opts').querySelectorAll('button').forEach(x=>x.disabled=true);const n=document.createElement('button');n.className='btn';n.style.marginTop='12px';n.textContent=idx===items.length-1?'عرض النتيجة':'التحدي التالي ←';n.onclick=()=>{idx++;locked=false;showQuiz()};$('stage').appendChild(n)};$('opts').appendChild(b)})}
function drawBuild(){items=shuffle(active.questions);idx=0;showBuild()}
function showBuild(){if(idx>=items.length){finish('أتممت ورشة بناء الجمل');return}const q=items[idx];selected=[];const tokens=shuffle(q.tokens);$('counter').textContent='الجملة '+(idx+1)+' / '+items.length;$('stage').innerHTML='<div class="prompt">رتّب الكلمات لتكوين الجملة الصحيحة.</div><div class="muted">استخدم الكلمات المتاحة مرة واحدة لتكوين جملة صحيحة، ثم اضغط «تحقق».</div><div class="tiles" id="bank"></div><h3>جملتك:</h3><div class="tiles" id="answer"></div><div class="actions"><button class="btn" id="check">تحقق من الجملة</button><button class="btn alt" id="clear">إعادة الترتيب</button></div>';const bank=$('bank');tokens.forEach((t,i)=>{const b=document.createElement('button');b.className='tile';b.textContent=t;b.dataset.i=i;b.onclick=()=>{if(b.disabled)return;selected.push(t);b.disabled=true;const a=document.createElement('button');a.className='tile selected';a.textContent=t;a.onclick=()=>{selected.splice(selected.indexOf(t),1);b.disabled=false;a.remove()};$('answer').appendChild(a)};bank.appendChild(b)});$('clear').onclick=()=>showBuildQuestionAgain(q);$('check').onclick=()=>{const got=selected.join(' ').replace(/s+([.!?])/g,'$1');if(got===q.target){roundScore+=10;points();$('feedback').textContent='🎉 جملة سليمة! +10 نقاط';$('feedback').className='feedback good'}else{$('feedback').textContent='قريب! راجع ترتيب الفاعل والفعل وبقية الكلمات ثم أعد المحاولة.';$('feedback').className='feedback bad';return}update();$('check').disabled=true;const n=document.createElement('button');n.className='btn';n.textContent=idx===items.length-1?'عرض النتيجة':'الجملة التالية ←';n.onclick=()=>{idx++;showBuild()};$('stage').appendChild(n)}}
function showBuildQuestionAgain(q){showBuild();}renderHub();
</script></body></html>
