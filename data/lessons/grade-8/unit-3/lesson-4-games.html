<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | مركز ألعاب الدرس الرابع</title><style>body{margin:0;background:#f4f7fc;color:#14264a;font-family:Arial,Cairo,sans-serif}.wrap{max-width:980px;margin:auto;padding:22px 14px}.hero{background:linear-gradient(135deg,#173a82,#6b3fa0,#e62982);color:#fff;border-radius:28px;padding:28px}.back{color:#fff;text-decoration:none;font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:18px}.game{background:#fff;border:1px solid #dce5f0;border-radius:22px;padding:20px}.game button{display:block;width:100%;text-align:right;border:0;border-radius:13px;padding:13px;margin-top:9px;background:#eef4ff;cursor:pointer;font-weight:800}.score{font-weight:900;margin-top:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><a class="back" href="#" id="back">← العودة إلى الدرس</a><h1>🎮 مركز ألعاب الدرس الرابع</h1><p>تدرب على à / en وأدوات السؤال في سياق السفر.</p></section><section class="grid"><article class="game"><h2>⚡ اختر الصحيح</h2><p>اختر حرف الجر المناسب.</p><div id="g1"></div><div class="score" id="s1"></div></article><article class="game"><h2>🧭 أين أم متى؟</h2><p>حدد أداة السؤال المناسبة.</p><div id="g2"></div><div class="score" id="s2"></div></article><article class="game"><h2>🚆 تحدي السفر</h2><p>جولة مختلطة في مواقف السفر.</p><div id="g3"></div><div class="score" id="s3"></div></article><article class="game"><h2>🎯 صح أم خطأ</h2><p>تحقق من صحة الجمل.</p><div id="g4"></div><div class="score" id="s4"></div></article></section></main><script>(function(){document.getElementById('back').onclick=e=>{e.preventDefault();const p=location.pathname.split('/'),i=p.indexOf('data'),base=i>0?p.slice(0,i).join('/'):'/';location.href=(base.endsWith('/')?base:base+'/')+'lesson.html?id=grade8-u3-l4'}})();function game(id,score,items){let i=0,n=0,r=document.getElementById(id),s=document.getElementById(score);function next(){if(i===items.length){r.innerHTML='<b>انتهت الجولة: '+n+'/'+items.length+'</b>';return}let q=items[i];r.innerHTML='<b>'+q[0]+'</b>'+q[1].map((x,j)=>'<button data-a="'+j+'">'+x+'</button>').join('');r.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(+b.dataset.a===q[2])n++;i++;next()});s.textContent='السؤال '+(i+1)+' من '+items.length}next()}game('g1','s1',[["Je vais ___ Paris.",["à","en","où"],0],["Je voyage ___ avion.",["en","à","quand"],0],["Nous voyageons ___ train.",["en","à","où"],0],["Je vais ___ la gare.",["à","en","quand"],0]]);game('g2','s2',[["___ est la gare ?",["Où","Quand","Pourquoi"],0],["___ pars-tu ?",["Quand","Où","Comment"],0],["___ vas-tu ?",["Comment","Quand","Où"],0],["___ voyages-tu ?",["Pourquoi","Où","Quand"],0]]);game('g3','s3',[["أريد معرفة المكان.",["Où ?","Quand ?","Pourquoi ?"],0],["أريد معرفة السبب.",["Comment ?","Pourquoi ?","Où ?"],1],["أريد معرفة الوقت.",["Quand ?","Où ?","Pourquoi ?"],0],["أسافر بالطائرة.",["en avion","à avion","où avion"],0]]);game('g4','s4',[["Je vais en Paris.",["صح","خطأ"],1],["Je voyage en train.",["صح","خطأ"],0],["Où est la gare ?",["صح","خطأ"],0],["Pourquoi voyages-tu ? سؤال عن السبب.",["صح","خطأ"],0]])</script></body></html>
