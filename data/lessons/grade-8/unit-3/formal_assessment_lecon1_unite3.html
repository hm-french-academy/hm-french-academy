<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#f4f7fc;color:#17223b;font-family:Arial,Cairo,sans-serif}.w{max-width:900px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff;border-radius:28px;padding:25px}.q{background:#fff;border:1px solid #dfe6f0;border-radius:20px;padding:18px;margin:13px 0}.q label{display:block;padding:11px;margin:7px 0;border:1px solid #e1e7f0;border-radius:12px;background:#f8faff;cursor:pointer}.btn{border:0;background:#2563eb;color:#fff;border-radius:13px;padding:13px 18px;font-weight:900;cursor:pointer}.res{display:none;background:#fff;border:1px solid #dfe6f0;border-radius:18px;padding:18px;margin-top:15px;font-weight:900;line-height:1.8}.show{display:block}.score{font-size:24px}.note{color:#315aa4}</style><main class="w"><section class="hero"><h1>📝 التقييم الرسمي · Leçon 1</h1><p>Les moyens de transport et les lieux · 15 سؤالًا</p><p>المعيار: <b>وسيلة النقل أم الوجهة؟</b> ثم اختيار prendre / aller وحرف المكان المناسب.</p></section><form id="f"></form><button class="btn" onclick="grade()">✓ تصحيح التقييم</button><section id="r" class="res"><div id="s" class="score"></div><div id="m"></div><div class="note">نصيحة: إذا كان الخطأ في وسيلة النقل، راجع prendre. إذا كان في الوجهة، راجع aller + à la/au/à l'/aux.</div></section></main><script>const Q=[['ما معنى le train؟',['القطار','المطار','المحطة'],0,'train = القطار.'],['ما معنى l’avion؟',['الطائرة','الحافلة','التذكرة'],0,'avion = الطائرة.'],['اختر: أستقل الحافلة.',['Je prends le bus.','Je vais le bus.','Je prends la gare.'],0,'وسيلة النقل → prendre.'],['اختر: أذهب إلى المحطة.',['Je vais à la gare.','Je prends la gare.','Je gare vais.'],0,'الوجهة → aller، وgare مؤنث مفرد → à la.'],['أكمل: Je ___ le train.',['prends','vais','va'],0,'je + prendre = prends.'],['أكمل: Je ___ à l’aéroport.',['vais','prends','suis'],0,'je + aller = vais.'],['اختر: Je vais ___ gare.',['à la','au','aux'],0,'gare مؤنث مفرد → à la.'],['اختر: Je vais ___ musée.',['au','à la','aux'],0,'musée مذكر مفرد → au.'],['اختر: Je vais ___ aéroport.',['à l’','au','aux'],0,'aéroport يبدأ بحرف متحرك → à l’.'],['اختر: Nous ___ le bus.',['prenons','allons','prend'],0,'nous + prendre = prenons.'],['اختر: Ils ___ à la gare.',['vont','allez','vais'],0,'ils + aller = vont.'],['ما معنى le billet؟',['تذكرة','رحلة','محطة'],0,'billet = تذكرة.'],['ما معنى l’arrêt؟',['موقف/محطة توقف','مطار','قطار'],0,'arrêt = موقف/محطة توقف.'],['أي سؤال يطلب وسيلة النقل؟',['Comment vas-tu ?','Où vas-tu ?','Où est la gare ?'],0,'Comment يسأل عن الكيفية.'],['أي قاعدة تساعدك في الاختيار؟',['prendre = وسيلة النقل، aller = الوجهة','prendre = الوجهة دائمًا','aller = وسيلة النقل دائمًا'],0,'هذه هي قاعدة الفصل الأساسية في الدرس.']];f.innerHTML=Q.map((q,i)=>`<section class="q"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}</section>`).join('');function grade(){let score=0,miss=0;Q.forEach((q,i)=>{let x=document.querySelector('input[name=q'+i+']:checked');if(!x)miss++;else if(+x.value===q[2])score++});r.className='res show';if(miss){s.textContent='⚠️ أكمل التقييم';m.textContent='هناك '+miss+' أسئلة بلا إجابة.';return}s.textContent='النتيجة: '+score+' / 15';m.textContent=score>=13?'🏆 ممتاز — إتقان قوي.':score>=10?'👍 جيد جدًا — راجع النقاط التي أخطأت فيها ثم أعد المحاولة.':'📘 تحتاج إلى مراجعة القاعدة والألعاب قبل إعادة التقييم.'}</script></main></html>
