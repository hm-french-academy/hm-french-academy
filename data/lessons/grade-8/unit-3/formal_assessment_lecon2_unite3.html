<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#f4f7fc;color:#17223b;font-family:Arial,Cairo,sans-serif}.w{max-width:900px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff;border-radius:28px;padding:25px}.q{background:#fff;border:1px solid #dfe6f0;border-radius:20px;padding:18px;margin:13px 0}.q label{display:block;padding:11px;margin:7px 0;border:1px solid #e1e7f0;border-radius:12px;background:#f8faff;cursor:pointer}.btn{border:0;background:#2563eb;color:#fff;border-radius:13px;padding:13px 18px;font-weight:900;cursor:pointer}.res{display:none;background:#fff;border:1px solid #dfe6f0;border-radius:18px;padding:18px;margin-top:15px;font-weight:900;line-height:1.8}.show{display:block}.score{font-size:24px}</style><main class="w"><section class="hero"><h1>📝 التقييم الرسمي · Leçon 2</h1><p>Les objets du voyage · 15 سؤالًا</p><p>المعيار: معنى المفردة + تركيب الجملة + سياق السفر.</p></section><form id="f"></form><button class="btn" onclick="grade()">✓ تصحيح التقييم</button><section id="r" class="res"><div id="s" class="score"></div><div id="m"></div></section></main><script>const Q=[['ما معنى une valise؟',['حقيبة سفر','جواز سفر','تذكرة'],0],['ما معنى un passeport؟',['جواز سفر','حقيبة','مرشد'],0],['ما معنى un billet؟',['تذكرة','سائح','رحلة'],0],['ما معنى un touriste؟',['سائح','مرشد','جواز سفر'],0],['ما معنى un guide؟',['مرشد','تذكرة','حقيبة'],0],['ما معنى bon voyage؟',['رحلة سعيدة','إلى اللقاء','صباح الخير'],0],['اختر الترتيب الصحيح.',['J’ai mon passeport.','Je mon passeport ai.','Mon j’ai passeport.'],0],['أكمل: J’ai mon ___.',['passeport','touriste','guide'],0],['أكمل: J’ai un ___.',['billet','voyage','touriste'],0],['ما الشيء الذي تحمله في السفر؟',['une valise','un touriste','bon voyage'],0],['من يساعد السائح في التعرف على المكان؟',['un guide','un billet','une valise'],0],['من يقوم بالرحلة؟',['un touriste','un passeport','un billet'],0],['اختر العبارة المناسبة عند تمني رحلة جيدة.',['Bon voyage !','Bon passeport !','Bon billet !'],0],['أي مجموعة تنتمي إلى أدوات السفر؟',['valise / passeport / billet','guide / touriste / chambre','bus / gare / table'],0],['ما القاعدة العملية لفهم السؤال؟',['حدّد الشيء المقصود ثم اختر المفردة التي تطابق معناه وسياقه','اختر أطول إجابة دائمًا','اختر أول كلمة في الجملة'],0]];f.innerHTML=Q.map((q,i)=>`<section class="q"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}</section>`).join('');function grade(){let score=0,miss=0;Q.forEach((q,i)=>{let x=document.querySelector('input[name=q'+i+']:checked');if(!x)miss++;else if(+x.value===q[2])score++});r.className='res show';if(miss){s.textContent='⚠️ أكمل التقييم';m.textContent='هناك '+miss+' أسئلة بلا إجابة.';return}s.textContent='النتيجة: '+score+' / 15';m.textContent=score>=13?'🏆 ممتاز — إتقان قوي.':score>=10?'👍 جيد جدًا — راجع المفردات والسياق.':'📘 راجع مفردات السفر ثم أعد المحاولة.'}</script></main></html>
