<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy · Évaluation officielle · Leçon 2</title><style>:root{--nav:#17284b;--pink:#e62982;--blue:#2563eb;--purple:#7041e8;--line:#dfe6f0;--soft:#f4f7ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef3fb,#f8fafc);color:var(--nav);font-family:Arial,"Noto Sans Arabic",sans-serif}.w{max-width:920px;margin:auto;padding:12px}.hero{background:linear-gradient(135deg,#173b82,#7041e8 55%,#2563eb);color:#fff;border-radius:26px;padding:22px}.hero h1{margin:8px 0;font-size:clamp(28px,6vw,44px)}.hero p{line-height:1.8}.q{background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px;margin:12px 0}.head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.tag{background:var(--soft);border-radius:10px;padding:7px 10px;font-weight:900;color:#315a93}.text{font-size:19px;font-weight:900;line-height:1.8;margin:12px 0}.opts{display:grid;gap:8px}.opt{width:100%;display:flex;gap:10px;align-items:center;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:right;font:inherit;font-weight:800;color:var(--nav);cursor:pointer}.opt.selected{border-color:var(--pink);background:#fff1f8}.letter{display:grid;place-items:center;min-width:34px;height:34px;border-radius:10px;background:var(--soft);color:#315a93;font-weight:900}.selected .letter{background:var(--pink);color:#fff}.actions{position:sticky;bottom:8px;display:flex;gap:8px;justify-content:center;margin:16px 0;z-index:3}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:900;cursor:pointer}.primary{background:var(--pink);color:#fff}.secondary{background:#edf3ff;color:#315a93}.result{display:none;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:15px;text-align:center}.show{display:block}.warning{background:#fff8e8}.score{font-size:42px;color:var(--purple);font-weight:900}.review{text-align:right;margin-top:12px}.review div{padding:9px;border-radius:10px;margin:6px 0}.right{background:#effaf3;color:#146c38}.wrong{background:#fff1f1;color:#9b1c1c}@media(max-width:600px){.w{padding:9px}.hero,.q{border-radius:18px;padding:15px}.actions{display:grid}.actions .btn{width:100%}}</style></head><body><main class="w"><section class="hero"><div>📝 HM ACADEMY · ÉVALUATION OFFICIELLE</div><h1>Leçon 2 · Le voyage</h1><p>تقييم ختامي مستقل لقياس إتقان مفردات السفر، الأشخاص، المواعيد، واستخدام <b dir="ltr">avoir</b> في السياق.</p></section><form id="f"></form><div class="actions"><button class="btn primary" id="submit" type="button">تسليم التقييم</button><button class="btn secondary" type="button" onclick="location.href='examen_u3-l2.html'">🎯 التدريب التفاعلي</button><button class="btn secondary" type="button" onclick="location.href='reference_lecon2_unite3.html'">📖 المرجع</button></div><section id="message" class="result"></section><section id="result" class="result"></section></main><script>const Q=[
['معنى المفردة','ما معنى «un guichetier»؟',['سائح','موظف الشباك','راكب'],1],
['تمييز المفردات','أي كلمة تعني «راكبة»؟',['une touriste','une passagère','un passager'],1],
['مفردات السفر','أي كلمة تدل على تذكرة المترو أو الأوتوبيس؟',['un ticket','un billet','une valise'],0],
['مفردات السفر','أي كلمة تدل على مواعيد الرحلات؟',['un pharmacien','des horaires','un touriste'],1],
['السياق','من يزور مدينة أو مكانًا أثناء السفر؟',['un touriste','un guichetier','un pharmacien'],0],
['التمييز الدلالي','أي زوج يعبّر عن مذكر ومؤنث «سائح»؟',['un passager / une passagère','un touriste / une touriste','un billet / une valise'],1],
['القاعدة · avoir','اختر الصياغة الصحيحة.',['Nous avons nos valises.','Nous avons nos valise.','Nous sommes nos valises.'],0],
['القاعدة · avoir','أكمل: Elle ___ son ticket.',['ai','as','a'],2],
['القاعدة · avoir','أكمل: Vous ___ vos billets.',['avez','avons','ont'],0],
['السياق','ماذا يفعل المسافر قبل ركوب القطار؟',['Il regarde les horaires.','Il est un billet.','Il a un guichetier.'],0],
['السياق','أي جملة مناسبة لشخص يحمل تذكرة قطار؟',['J’ai un ticket de bus.','J’ai un billet de train.','Je suis un billet de train.'],1],
['التعبير','ماذا تقول لشخص على وشك السفر؟',['Bon voyage !','Bon billet !','Bon pharmacien !'],0],
['اختيار المفردة','أي كلمة تعني «صيدلي»؟',['un pharmacien','un passager','un guichetier'],0],
['الفهم','أين يمكن أن يعمل un pharmacien في سياق السفر؟',['في الصيدلية','في شباك التذاكر','في القطار فقط'],0],
['التطبيق','اختر الجملة الصحيحة.',['La passagère attend le bus.','La passagère attends le bus.','La passagère attendre le bus.'],0]
];let A=Array(Q.length).fill(null),locked=false;const f=document.getElementById('f');f.innerHTML=Q.map((q,i)=>`<article class="q" data-q="${i}"><div class="head"><span class="tag">السؤال ${i+1}</span><span class="tag">${q[0]}</span></div><div class="text">${q[1]}</div><div class="opts">${q[2].map((o,j)=>`<button class="opt" type="button" data-q="${i}" data-o="${j}"><span class="letter">${String.fromCharCode(65+j)}</span><span>${o}</span></button>`).join('')}</div></article>`).join('');f.addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b||locked)return;const i=Number(b.dataset.q),o=Number(b.dataset.o);A[i]=o;b.closest('.q').querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});document.getElementById('submit').onclick=()=>{if(locked)return;const miss=A.map((x,i)=>x===null?i+1:null).filter(Boolean);const msg=document.getElementById('message');if(miss.length){msg.className='result show warning';msg.innerHTML='<strong>لم يكتمل التقييم.</strong><br>يرجى الإجابة عن جميع الأسئلة قبل التسليم.';msg.scrollIntoView({behavior:'smooth',block:'center'});return}locked=true;let score=0;const rev=Q.map((q,i)=>{const ok=A[i]===q[3];if(ok)score++;return ok});const pct=Math.round(score/Q.length*100);document.querySelectorAll('.opt').forEach(b=>b.disabled=true);document.getElementById('submit').disabled=true;const result=document.getElementById('result');result.className='result show';result.innerHTML='<div>🏆 النتيجة الرسمية</div><div class="score">'+score+' / '+Q.length+'</div><p>النسبة: <b>'+pct+'%</b></p><p>'+(pct>=90?'ممتاز — إتقان قوي للدرس.':pct>=75?'جيد جدًا — راجع بعض النقاط.':pct>=60?'جيد — تحتاج إلى مراجعة موجّهة.':'راجع الدرس ثم أعد التقييم.')+'</p><div class="review">'+rev.map((ok,i)=>'<div class="'+(ok?'right':'wrong')+'">'+(ok?'✅':'❌')+' السؤال '+(i+1)+' — '+(ok?'صحيح':'غير صحيح · الإجابة الصحيحة: '+Q[i][2][Q[i][3]])+'</div>').join('')+'</div>';localStorage.setItem('hm_formal_grade8_u3_l2',JSON.stringify({score,total:Q.length,pct,at:new Date().toISOString()}));result.scrollIntoView({behavior:'smooth',block:'start'})}</script></body></html>
