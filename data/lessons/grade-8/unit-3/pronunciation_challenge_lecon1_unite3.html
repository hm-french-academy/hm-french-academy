<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HM Academy · النطق · Leçon 1</title>
<style>
:root{--nav:#17284b;--blue:#2563eb;--purple:#7041e8;--pink:#e62982;--line:#dfe6f0;--soft:#eef4ff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef3fb,#f8fafc);color:var(--nav);font-family:Arial,"Noto Sans Arabic",sans-serif}.wrap{max-width:980px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#173b82,#7041e8 55%,#2563eb);color:#fff;border-radius:28px;padding:24px}.hero h1{margin:8px 0;font-size:clamp(28px,6vw,44px)}.hero p{line-height:1.9}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.btn{border:0;border-radius:13px;padding:12px 16px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--pink);color:#fff}.secondary{background:#edf3ff;color:#315a93}.status{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 24px #17284b0a}.icon{text-align:center;font-size:48px}.fr{direction:ltr;text-align:center;font-size:25px;font-weight:900;margin:6px 0}.ar{text-align:center;color:#315aa4;font-weight:900}.example{direction:ltr;text-align:left;background:#f7f9fd;border-radius:12px;padding:10px;margin-top:10px}.hint{margin-top:9px;background:#fff8e8;border:1px solid #efd9a0;border-radius:11px;padding:9px;line-height:1.7;color:#735615}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.empty{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center}
@media(max-width:500px){.wrap{padding:10px}.hero,.card{border-radius:19px;padding:15px}.fr{font-size:22px}}
</style></head>
<body><main class="wrap">
<section class="hero"><div>🔊 HM ACADEMY · PRONONCIATION STUDIO</div><h1>Leçon 1 · Le voyage</h1><p>صفحة نطق مستقلة للكلمة والمثال. تستخدم محرك النطق الفرنسي في المتصفح، وتبقى منفصلة عن مركز الألعاب والتقييم.</p></section>
<div class="toolbar"><a class="btn secondary" href="../../../../lesson.html?id=grade8-u3-l1">← العودة إلى الدرس</a><button class="btn primary" id="speakAll">🔊 تشغيل الكلمات</button><button class="btn secondary" id="stop">⏹ إيقاف</button><span class="status" id="status">جاهز للنطق</span></div>
<section class="grid" id="grid"><div class="empty">جارٍ تحميل المفردات…</div></section>
</main>
<script>
const fallback=[["le bus","الحافلة","🚌","Je prends le bus."],["le train","القطار","🚆","Je prends le train."],["l’avion","الطائرة","✈️","Je prends l’avion."],["la voiture","السيارة","🚗","Je prends la voiture."],["le métro","مترو الأنفاق","🚇","Je prends le métro."],["le taxi","سيارة أجرة","🚕","Je prends un taxi."],["la gare","محطة القطار","🚉","Je vais à la gare."],["l’aéroport","المطار","🛫","Je vais à l’aéroport."],["la station","المحطة","🚏","La station est près d’ici."],["l’arrêt","موقف/محطة توقف","🛑","L’arrêt de bus est ici."],["le billet","تذكرة","🎫","J’ai un billet de train."],["le voyage","الرحلة/السفر","🧳","Le voyage commence demain."],["un guichet","شباك التذاكر","🎟️","Je vais au guichet pour acheter un billet."],["une plage","شاطئ","🏖️","Nous allons à la plage."],["un zoo","حديقة حيوان","🦁","Nous visitons un zoo."],["un cirque","سيرك","🎪","Nous allons au cirque."],["un stade","استاد","🏟️","Ils vont au stade."],["un club","نادي","🏢","Il va au club."],["une pharmacie","صيدلية","💊","Je vais à la pharmacie."],["un pays","بلد","🌍","La France est un pays."],["une ville","مدينة","🏙️","Paris est une ville."],["un lieu","مكان","📍","C’est un lieu célèbre."]];
let words=fallback;const grid=document.getElementById('grid'),status=document.getElementById('status');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c))}
function speak(text){if(!('speechSynthesis'in window)){status.textContent='⚠️ متصفحك لا يدعم النطق الصوتي.';return false}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=.82;u.pitch=1;u.onstart=()=>status.textContent='🔊 يتم نطق: '+text;u.onend=()=>status.textContent='✅ تم النطق';u.onerror=()=>status.textContent='⚠️ تعذر تشغيل النطق؛ اضغط مرة أخرى.';speechSynthesis.speak(u);return true}
function render(){grid.innerHTML=words.map((w,i)=>`<article class="card"><div class="icon">${esc(w[2])}</div><div class="fr">${esc(w[0])}</div><div class="ar">${esc(w[1])}</div><div class="example">${esc(w[3])}</div><div class="hint">💡 استمع للكلمة ثم استمع للمثال وكرر بصوتك.</div><div class="actions"><button class="btn primary" onclick="speak(words[${i}][0])">🔊 الكلمة</button><button class="btn secondary" onclick="speak(words[${i}][3])">▶ المثال</button></div></article>`).join('')}
document.getElementById('stop').onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();status.textContent='⏹ تم الإيقاف'};
document.getElementById('speakAll').onclick=async()=>{if(!('speechSynthesis'in window)){status.textContent='⚠️ متصفحك لا يدعم النطق الصوتي.';return}speechSynthesis.cancel();for(const w of words){await new Promise(resolve=>{const u=new SpeechSynthesisUtterance(w[0]);u.lang='fr-FR';u.rate=.82;u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u)})}status.textContent='✅ انتهى تشغيل الكلمات'};
fetch('lesson-1.json?v=20260817-pron4',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{if(d?.vocabulary?.length)words=d.vocabulary.map(v=>[v.word,v.translation,v.image||'🔊',v.example||v.word]);render()}).catch(render);
</script></body></html>
