<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | مركز الألعاب — الدرس الثالث</title><style>body{margin:0;background:#f4f7fc;color:#14264a;font-family:Arial,Cairo,sans-serif}.wrap{max-width:1000px;margin:auto;padding:24px 14px}.hero{background:linear-gradient(135deg,#4b287f,#e62982,#2563eb);color:#fff;border-radius:28px;padding:28px}.games{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.game{background:#fff;border:1px solid #dfe6f0;border-radius:20px;padding:20px}.choice{display:block;width:100%;border:1px solid #dbe4f2;background:#f8faff;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;font-weight:800}.ok{background:#e9f8f1!important;border-color:#2fa77b!important}.no{background:#fff0f0!important;border-color:#d95353!important}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tile{height:70px;border:0;border-radius:12px;background:#edf3ff;font-size:20px;font-weight:900;cursor:pointer}.result{font-weight:900;margin-top:10px}@media(max-width:750px){.games{grid-template-columns:1fr}.memory{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><section class="hero"><h1>🎮 مركز الألعاب</h1><p>أنشطة قصيرة ومتنوعة لتثبيت أدوات الإشارة دون تكرار التقييم الرسمي.</p></section><section class="games"><article class="game"><h2>⚡ اختر بسرعة</h2><p>___ avion</p><button class="choice" data-ok="1">cet</button><button class="choice">cette</button><button class="choice">ces</button><div class="result"></div></article><article class="game"><h2>🧠 صح أم خطأ</h2><p>«Cette train est rapide.» جملة صحيحة؟</p><button class="choice" data-ok="0">صح</button><button class="choice" data-ok="1">خطأ</button><div class="result"></div></article><article class="game"><h2>🃏 طابق الأزواج</h2><p>اضغط بطاقتين للعثور على الأداة والاسم المناسب.</p><div class="memory" id="memory"></div><div class="result" id="memResult"></div></article></section></main><script>document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const box=b.parentElement;box.querySelectorAll('.choice').forEach(x=>x.classList.remove('ok','no'));b.classList.add(b.dataset.ok==='1'?'ok':'no');box.querySelector('.result').textContent=b.dataset.ok==='1'?'✓ ممتاز':'راجع القاعدة ثم حاول مرة أخرى'});const pairs=[['ce','train'],['cet','avion'],['cette','valise'],['ces','billets']];let cards=pairs.flatMap((p,i)=>[{v:p[0],p:i},{v:p[1],p:i}]).sort(()=>Math.random()-.5),first=null,lock=false,matched=0;const m=document.getElementById('memory');cards.forEach((c,i)=>{const b=document.createElement('button');b.className='tile';b.textContent='?';b.onclick=()=>{if(lock||b.dataset.open||b.dataset.done)return;b.textContent=c.v;b.dataset.open='1';if(!first){first={b,c};return}if(first.c.p===c.p){first.b.dataset.done='1';b.dataset.done='1';matched++;first=null;if(matched===4)document.getElementById('memResult').textContent='🏆 أكملت اللعبة!'}else{lock=true;setTimeout(()=>{first.b.textContent='?';b.textContent='?';delete first.b.dataset.open;delete b.dataset.open;first=null;lock=false},650)}};m.appendChild(b)});</script></body></html>
