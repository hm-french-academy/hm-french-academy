<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HM Academy | تحدي النطق — الدرس الرابع</title>
<style>
body{margin:0;background:#f4f7fc;color:#14264a;font-family:Arial,Cairo,sans-serif}.wrap{max-width:980px;margin:auto;padding:20px 14px}.back{display:inline-block;background:#fff;border:1px solid #dfe6f0;padding:11px 15px;border-radius:13px;text-decoration:none;color:#2850a3;font-weight:900}.hero{margin-top:14px;padding:26px;border-radius:26px;background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff}.hero h1{margin:8px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}.card{background:#fff;border:1px solid #dfe6f0;border-radius:20px;padding:18px;box-shadow:0 8px 22px #14264a0b}.word{font-size:26px;font-weight:900}.meaning{color:#52627d;font-weight:800;margin:5px 0 12px}.note{background:#f5f8ff;border-right:4px solid #2563eb;padding:10px 12px;border-radius:10px;line-height:1.8}.speak{border:0;border-radius:12px;padding:11px 14px;background:#e62982;color:#fff;font-weight:900;cursor:pointer;margin-top:10px}.example{margin-top:12px;padding-top:12px;border-top:1px solid #e5eaf2;line-height:1.8}.example b{display:block}.footer{margin-top:18px;background:#fff;border:1px solid #dfe6f0;border-radius:18px;padding:15px;line-height:1.8}@media(max-width:680px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<a class="back" href="../../../../lesson.html?id=grade8-u3-l4">← العودة إلى الدرس</a>
<section class="hero"><div>🔊 HM Academy · Pronunciation Studio</div><h1>تحدي النطق — الدرس الرابع</h1><p>استمع إلى الكلمة ثم اقرأ ملاحظة النطق وطبّقها على المثال.</p></section>
<section class="grid" id="cards"></section>
<section class="footer"><b>💡 طريقة التدريب</b><br>اضغط «نطق الكلمة»، ثم اقرأ المثال بصوت مرتفع. ركّز على الأصوات الأنفية في <b>en / quand / comment / avion</b> وعلى صوت <b>/ʁ/</b> في <b>gare</b>.</section>
</main>
<script>
const items=[
['à','إلى / في','/a/ بصوت قصير وواضح.','Je vais à Paris.'],
['en','بـ / في','/ɑ̃/؛ النهاية صوت أنفي.','Je voyage en avion.'],
['où','أين','/u/؛ حرف où هنا صوت /u/ وليس /wa/.','Où est la gare ?'],
['quand','متى','/kɑ̃/؛ النهاية صوت أنفي.','Quand pars-tu ?'],
['comment','كيف','/kɔmɑ̃/؛ النهاية صوت أنفي.','Comment vas-tu ?'],
['pourquoi','لماذا','/puʁkwa/؛ ركّز على r الفرنسية.','Pourquoi voyages-tu ?'],
['gare','محطة قطار','/ɡaʁ/؛ r فرنسية /ʁ/ والنهاية e لا تُنطق.','La gare est près d’ici.'],
['avion','طائرة','/avjɔ̃/؛ النهاية صوت أنفي.','Je voyage en avion.']
];
const root=document.getElementById('cards');items.forEach((x,i)=>{const c=document.createElement('article');c.className='card';c.innerHTML='<div class="word">'+x[0]+'</div><div class="meaning">'+x[1]+'</div><div class="note">💡 <b>ملاحظة النطق:</b> '+x[2]+'</div><button class="speak" data-text="'+x[0]+'">🔊 نطق الكلمة</button><div class="example"><b>مثال:</b> '+x[3]+'<br><button class="speak" data-text="'+x[3]+'">🔊 نطق المثال</button></div>';root.appendChild(c)});document.querySelectorAll('.speak').forEach(b=>b.onclick=()=>{if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(b.dataset.text);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}});
</script></body></html>
