<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | تدريب تفاعلي | الدرس الرابع</title><style>body{margin:0;background:#f5f8fc;color:#17284b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:920px;margin:auto;padding:20px 14px}.back{display:inline-block;background:#fff;border:1px solid #dce5f1;border-radius:13px;padding:11px 15px;color:#2850a3;text-decoration:none;font-weight:900}.hero{margin-top:14px;padding:27px;border-radius:26px;background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff}.hero h1{margin:8px 0}.hero p{line-height:1.9}.progress{margin-top:14px;background:#ffffff30;border-radius:999px;height:9px;overflow:hidden}.bar{height:100%;width:0;background:#fff;transition:.2s}.card{background:#fff;border:1px solid #dce5f1;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 8px 24px rgba(20,38,74,.07)}.q{font-size:19px;font-weight:900;line-height:1.8}.opt{display:block;width:100%;text-align:right;border:2px solid #dbe4f2;background:#f9fbff;border-radius:13px;padding:13px;margin:9px 0;cursor:pointer;font-weight:800}.opt.selected{border-color:#2563eb;background:#edf4ff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.finish{flex:1;min-width:180px;border:0;border-radius:14px;padding:15px;background:#2563eb;color:#fff;font-weight:900;cursor:pointer}.result{display:none;margin-top:16px;padding:20px;border-radius:18px;background:#eef8f6;border:1px solid #cce9e3}.score{font-size:30px;font-weight:900}.review{margin-top:10px;padding:10px;border-radius:10px;background:#fff;border-right:4px solid #16a394}@media(max-width:600px){.wrap{padding:14px 10px}}</style></head><body><main class="wrap"><a class="back" href="../../../../lesson.html?id=grade8-u3-l4">← العودة إلى الدرس الرابع</a><section class="hero"><span>⚡ HM Academy · تدريب تفاعلي</span><h1>تطبيق القواعد في مواقف السفر</h1><p>اختر إجابة واحدة لكل سؤال. هذا التدريب مختلف عن التقييم الرسمي، ويجمع بين حروف الجر وأدوات الاستفهام.</p><div class="progress"><div class="bar" id="bar"></div></div></section><div id="quiz"></div><div class="actions"><button class="finish" id="finish">تسليم التدريب</button></div><section class="result" id="result"></section></main><script>(function(){const qs=[['أكمل الجملة: Je vais ___ Paris.',['à','en','où','quand'],0],['أكمل الجملة: Je voyage ___ avion.',['à','en','où','pourquoi'],1],['اختر السؤال الذي يطلب مكانًا.',['Où est la gare ?','Quand pars-tu ?','Comment voyages-tu ?','Pourquoi voyages-tu ?'],0],['اختر السؤال الذي يطلب وقتًا.',['Où vas-tu ?','Quand pars-tu ?','Comment voyages-tu ?','Pourquoi voyages-tu ?'],1],['الإجابة هي: En train. أي سؤال يناسبها؟',['Où voyages-tu ?','Quand voyages-tu ?','Comment voyages-tu ?','Pourquoi voyages-tu ?'],2],['الإجابة هي: Parce que j’aime voyager. أي سؤال يناسبها؟',['Où voyages-tu ?','Quand voyages-tu ?','Comment voyages-tu ?','Pourquoi voyages-tu ?'],3],['اختر الجملة الصحيحة.',['Je vais en Paris.','Je vais à Paris.','Je vais où Paris.','Je vais pour Paris.'],1],['اختر الجملة الصحيحة.',['Nous voyageons à train.','Nous voyageons où train.','Nous voyageons en train.','Nous voyageons pour train.'],2],['أكمل: ___ est la gare ?',['Où','Quand','Comment','Pourquoi'],0],['أكمل: ___ pars-tu ? — Demain.',['Où','Quand','Comment','Pourquoi'],1]];const root=document.getElementById('quiz'),bar=document.getElementById('bar'),answers={};qs.forEach((q,i)=>{const c=document.createElement('section');c.className='card';c.innerHTML='<div class="q">'+(i+1)+'. '+q[0]+'</div>'+q[1].map((x,j)=>'<button type="button" class="opt" data-q="'+i+'" data-a="'+j+'">'+String.fromCharCode(65+j)+'. '+x+'</button>').join('');root.appendChild(c)});function update(){bar.style.width=(Object.keys(answers).length/qs.length*100)+'%'}root.addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b)return;const q=b.dataset.q;answers[q]=+b.dataset.a;root.querySelectorAll('.opt[data-q="'+q+'"]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');update()});document.getElementById('finish').onclick=()=>{const missing=qs.map((_,i)=>i).filter(i=>answers[i]===undefined),r=document.getElementById('result');r.style.display='block';if(missing.length){r.innerHTML='<b>ما زالت هناك أسئلة بدون إجابة:</b> '+missing.map(i=>i+1).join('، ');return}let score=0;qs.forEach((q,i)=>{if(answers[i]===q[2])score++});const msg=score>=9?'ممتاز جدًا.':score>=7?'جيد جدًا. راجع الأخطاء ثم أعد المحاولة.':'راجع القواعد ثم أعد التدريب.';r.innerHTML='<div class="score">'+score+' / '+qs.length+'</div><p>'+msg+'</p><div class="review">تذكّر: المدينة مع <b>à</b>، ووسيلة النقل في أمثلة الدرس مع <b>en</b>، والمكان <b>Où</b>، والزمن <b>Quand</b>، والطريقة <b>Comment</b>، والسبب <b>Pourquoi</b>.</div>'}})();</script></body></html>
