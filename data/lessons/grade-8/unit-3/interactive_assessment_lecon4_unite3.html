<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | التقييم التفاعلي — الدرس الرابع</title><style>body{margin:0;background:#f4f7fc;color:#14264a;font-family:Arial,Cairo,sans-serif}.wrap{max-width:900px;margin:auto;padding:22px 14px}.back{display:inline-block;background:#fff;padding:10px 14px;border-radius:12px;text-decoration:none;font-weight:900;color:#2850a3}.hero{margin-top:14px;padding:26px;border-radius:26px;background:linear-gradient(135deg,#6b3fa0,#e62982);color:#fff}.card{background:#fff;border:1px solid #dfe6f0;border-radius:20px;padding:20px;margin:14px 0}.opt{display:block;width:100%;text-align:right;border:2px solid #dbe4f2;background:#f8faff;border-radius:13px;padding:13px;margin:8px 0;cursor:pointer;font-weight:700}.selected{border-color:#2563eb!important;background:#edf4ff!important}.finish{width:100%;border:0;border-radius:14px;padding:15px;background:#2563eb;color:#fff;font-weight:900}.result{display:none;margin-top:16px;padding:18px;border-radius:16px;background:#eef8f6}</style></head><body><main class="wrap"><a class="back" href="#" id="back">← العودة إلى الدرس</a><section class="hero"><h1>التقييم التفاعلي</h1><p>تدريب تطبيقي على à / en و Où / Quand / Comment / Pourquoi.</p></section><div id="quiz"></div><button class="finish" id="finish">إنهاء التقييم</button><section class="result" id="result"></section></main><script>(function(){document.getElementById('back').onclick=e=>{e.preventDefault();const p=location.pathname.split('/'),i=p.indexOf('data'),base=i>0?p.slice(0,i).join('/'):'/';location.href=(base.endsWith('/')?base:base+'/')+'lesson.html?id=grade8-u3-l4'}})();const qs=[['Je vais ___ Paris.',['à','en','où'],0],['Je voyage ___ avion.',['en','à','quand'],0],['___ est la gare ?',['Où','Quand','Pourquoi'],0],['___ pars-tu ?',['Quand','Où','Comment'],0],['___ vas-tu à Paris ?',['Comment','Pourquoi','Où'],0],['___ voyages-tu ?',['Pourquoi','Quand','Où'],0],['Nous voyageons ___ train.',['en','à','où'],0],['Je vais ___ la gare.',['à','en','quand'],0],['أي سؤال يطلب المكان؟',['Où','Quand','Comment'],0],['أي سؤال يطلب السبب؟',['Pourquoi','Où','Quand'],0]];const root=document.getElementById('quiz');qs.forEach((q,i)=>{let c=document.createElement('section');c.className='card';c.innerHTML='<b>'+(i+1)+'. '+q[0]+'</b>'+q[1].map((x,j)=>'<button class="opt" data-q="'+i+'" data-a="'+j+'">'+String.fromCharCode(65+j)+'. '+x+'</button>').join('');root.appendChild(c)});document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.opt[data-q="'+b.dataset.q+'"]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});document.getElementById('finish').onclick=()=>{let score=0,missing=[];qs.forEach((q,i)=>{let b=document.querySelector('.opt[data-q="'+i+'"].selected');if(!b)missing.push(i+1);else if(+b.dataset.a===q[2])score++});let r=document.getElementById('result');r.style.display='block';r.innerHTML=missing.length?'أكمل الأسئلة: '+missing.join('، '):'<h2>نتيجتك: '+score+' / '+qs.length+'</h2><p>'+(score>=8?'أداء ممتاز!':'راجع المرجع ثم أعد المحاولة.')+'</p>'}}</script></body></html>
