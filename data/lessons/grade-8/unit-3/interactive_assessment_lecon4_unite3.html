<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | التقييم التفاعلي — الدرس الرابع</title><style>body{margin:0;background:#f4f7fc;color:#14264a;font-family:Arial,Cairo,sans-serif}.wrap{max-width:920px;margin:auto;padding:22px 14px}.back{display:inline-block;background:#fff;border:1px solid #dfe6f0;padding:11px 15px;border-radius:13px;text-decoration:none;color:#2850a3;font-weight:900}.hero{margin-top:14px;padding:28px;border-radius:26px;background:linear-gradient(135deg,#173a82,#7041e8,#e62982);color:#fff}.hero h1{margin:8px 0}.hero p{line-height:1.9}.progress{margin-top:14px;background:#ffffff2b;border-radius:999px;height:9px;overflow:hidden}.bar{height:100%;width:0;background:#fff;transition:.2s}.card{background:#fff;border:1px solid #dfe6f0;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 8px 22px #14264a0b}.q{font-size:18px;font-weight:900;line-height:1.8}.hint{font-size:13px;color:#68758b;margin:6px 0 12px}.opt{display:block;width:100%;text-align:right;border:2px solid #dbe4f2;background:#f8faff;border-radius:13px;padding:13px;margin:8px 0;cursor:pointer;font-weight:800}.opt.selected{border-color:#2563eb;background:#edf4ff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.finish{flex:1;min-width:180px;border:0;border-radius:14px;padding:15px;background:#2563eb;color:#fff;font-weight:900;cursor:pointer}.result{display:none;margin-top:16px;padding:20px;border-radius:18px;background:#eef8f6;border:1px solid #cce9e3}.score{font-size:28px;font-weight:900}@media(max-width:600px){.wrap{padding:14px 10px}}
</style></head><body><main class="wrap"><a class="back" href="../../../../lesson.html?id=grade8-u3-l4">← العودة إلى الدرس</a><section class="hero"><span>⚡ HM Academy · Interactive Practice</span><h1>التقييم التفاعلي</h1><p>طبّق القاعدة في مواقف سفر قصيرة. الأسئلة هنا مختلفة عن التقييم الرسمي.</p><div class="progress"><div class="bar" id="bar"></div></div></section><div id="quiz"></div><div class="actions"><button class="finish" id="finish">تسليم التقييم</button></div><section class="result" id="result"></section></main><script>(function(){const qs=[['أكمل: Je vais ___ Paris.',['à','en','où','quand'],0,'الهدف: المدينة.'],['أكمل: Je voyage ___ avion.',['à','en','où','pourquoi'],1,'الهدف: وسيلة النقل.'],['أي سؤال عن المكان؟',['Quand','Où','Comment','Pourquoi'],1,'المكان = Où.'],['أي سؤال عن الزمن؟',['Où','Quand','Comment','Pourquoi'],1,'الزمن = Quand.'],['اختر السؤال المناسب للإجابة: En train.',['Où voyages-tu ?','Quand voyages-tu ?','Comment voyages-tu ?','Pourquoi voyages-tu ?'],2,'الطريقة = Comment.'],['اختر السؤال المناسب للإجابة: Parce que j’aime voyager.',['Où voyages-tu ?','Quand voyages-tu ?','Comment voyages-tu ?','Pourquoi voyages-tu ?'],3,'السبب = Pourquoi.'],['أي جملة صحيحة؟',['Je vais en Paris.','Je vais à Paris.','Je vais où Paris.','Je vais pour Paris.'],1,'مدينة Paris تأخذ à.'],['أي جملة صحيحة؟',['Nous voyageons à train.','Nous voyageons où train.','Nous voyageons en train.','Nous voyageons pour train.'],2,'وسيلة النقل في أمثلة الدرس تأخذ en.'],['أكمل: ___ est la gare ?',['Où','Quand','Comment','Pourquoi'],0,'السؤال عن المكان.'],['أكمل: ___ pars-tu ? Demain.',['Où','Quand','Comment','Pourquoi'],1,'Demain يجيب عن الزمن.']];const root=document.getElementById('quiz'),bar=document.getElementById('bar'),answers={};qs.forEach((q,i)=>{const c=document.createElement('section');c.className='card';c.innerHTML='<div class="q">'+(i+1)+'. '+q[0]+'</div><div class="hint">'+q[3]+'</div>'+q[1].map((x,j)=>'<button class="opt" data-q="'+i+'" data-a="'+j+'">'+String.fromCharCode(65+j)+'. '+x+'</button>').join('');root.appendChild(c)});function update(){const n=Object.keys(answers).length;bar.style.width=(n/qs.length*100)+'%'}document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const q=b.dataset.q;document.querySelectorAll('.opt[data-q="'+q+'"]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');answers[q]=+b.dataset.a;update()});document.getElementById('finish').onclick=()=>{const missing=qs.map((_,i)=>i+1).filter(i=>answers[i-1]===undefined);const r=document.getElementById('result');r.style.display='block';if(missing.length){r.innerHTML='<b>أكمل أولًا:</b> السؤال '+missing.join('، ');return}let score=0;qs.forEach((q,i)=>{if(answers[i]===q[2])score++});r.innerHTML='<div class="score">نتيجتك: '+score+' / '+qs.length+'</div><p>'+(score>=9?'ممتاز جدًا — أنت تطبق القاعدة بثبات.':score>=7?'جيد جدًا — راجع نقطتين أو ثلاث ثم أعد المحاولة.':'ارجع إلى المرجع التعليمي وراجع الفرق بين à و en وأدوات السؤال ثم أعد المحاولة.')+'</p>'}})();</script></body></html>
