<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#f4f7fc;color:#17223b;font-family:Arial,Cairo,sans-serif}.w{max-width:1000px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#173a82,#7c3aed,#2563eb);color:#fff;border-radius:28px;padding:28px}.g{background:#fff;border:1px solid #dfe6f0;border-radius:22px;padding:20px;margin-top:15px}.o{display:flex;flex-wrap:wrap;gap:9px}.o button{padding:12px 15px;border:1px solid #ccd6e5;border-radius:12px;background:#fff;font-weight:900}.r{min-height:25px;margin-top:10px;font-weight:900}.ok{color:#159447}.bad{color:#c43b3b}.btn{background:#2563eb;color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:900}</style><main class="w"><section class="hero"><h1>🎮 HM Game Studio · Leçon 1</h1><p>Le voyage · وسائل النقل والأماكن</p><p>6 أنماط تدريبية، مع تحديات جديدة في كل جولة.</p></section><div id="app"></div><button class="btn" onclick="start()">🔀 جولة جديدة</button></main><script>const M=[['🚌 Transport Match','اختر: أستقل الحافلة','Je prends le bus',['Je prends le bus','Je vais à la gare','Je prends la gare']],['🚆 Transport Match','اختر: أستقل القطار','Je prends le train',['Je prends le train','Je vais le train','Je prends la gare']],['✈️ Transport Match','السفر جوًا يحتاج إلى...','l’avion',['l’avion','la gare','la station']],['📍 Destination','أذهب إلى محطة القطار','à la gare',['à la gare','au gare','aux gare']],['🏷️ Ticket Detective','ما الشيء الذي أحتاجه للسفر؟','le billet',['le billet','la gare','le bus']],['🧩 Grammar Builder','أكمل: Je ___ à l’aéroport.','vais',['vais','prends','suis']],['🧠 Intrus','اختر الكلمة المختلفة: bus / train / gare / avion','gare',['gare','bus','train','avion']],['⚡ Speed Choice','اختر: Nous ___ le train.','prenons',['prenons','allons','prend']]];let score=0;function start(){score=0;app.innerHTML=M.map((x,i)=>`<section class="g"><h2>${x[0]}</h2><p>${x[1]}</p><div class="o">${x[3].sort(()=>Math.random()-.5).map(o=>`<button onclick="ans(this,'${o.replaceAll("'","\\'")}','${x[2].replaceAll("'","\\'")}')">${o}</button>`).join('')}</div><div class="r"></div></section>`).join('')}function ans(b,x,a){let r=b.parentElement.nextElementSibling;let ok=x===a;r.textContent=ok?'✓ صحيح!':'✗ الإجابة الصحيحة: '+a;r.className='r '+(ok?'ok':'bad');b.parentElement.querySelectorAll('button').forEach(x=>x.disabled=true);if(ok)score+=10}start();</script></html>
