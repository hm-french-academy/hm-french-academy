<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#f4f7fc;color:#17223b;font-family:Arial,Cairo,sans-serif}.w{max-width:1000px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#173a82,#7c3aed,#2563eb);color:#fff;border-radius:28px;padding:28px;box-shadow:0 12px 30px #203c7a22}.hero h1{margin:0 0 10px}.g{background:#fff;border:1px solid #dfe6f0;border-radius:22px;padding:20px;margin-top:15px;box-shadow:0 8px 20px #1e3a5f10}.tag{display:inline-block;background:#eef3ff;color:#315aa4;border-radius:999px;padding:6px 10px;font-weight:900;font-size:13px}.o{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.o button{padding:14px 15px;border:1px solid #ccd6e5;border-radius:14px;background:#fff;font-weight:900;text-align:right;cursor:pointer}.o button:hover{transform:translateY(-1px)}.o button:disabled{cursor:default}.r{min-height:25px;margin-top:12px;font-weight:900;line-height:1.7}.ok{color:#159447}.bad{color:#c43b3b}.btn{background:#2563eb;color:#fff;border:0;border-radius:14px;padding:13px 18px;font-weight:900;cursor:pointer;margin-top:16px}.score{font-weight:900;margin:16px 0;font-size:18px}@media(max-width:620px){.o{grid-template-columns:1fr}.w{padding:12px}.hero{padding:22px}}
</style><main class="w"><section class="hero"><h1>🎮 HM Game Studio · Leçon 1</h1><p>Le voyage · وسائل النقل والأماكن</p><p>🎯 بنك من <b>20 تحديًا متنوعًا</b> — تُختار منه 10 أسئلة في كل جولة.</p><p>كل سؤال يحدد المطلوب بوضوح: معنى، سياق، وسيلة نقل، وجهة، أو قاعدة.</p></section><div id="app"></div><div class="score" id="score">⭐ نقاط الجولة: 0 / 100</div><button class="btn" id="newRound">🔀 جولة جديدة</button></main><script>
const BANK=[
 {type:'🧠 معنى',q:'ما معنى «un guichet»؟',a:'شباك التذاكر',o:['شباك التذاكر','شاطئ','مدينة','استاد'],why:'guichet = شباك التذاكر.'},
 {type:'🧠 معنى',q:'ما معنى «une plage»؟',a:'شاطئ',o:['صيدلية','شاطئ','تذكرة','نادي'],why:'plage = شاطئ.'},
 {type:'🧠 معنى',q:'ما معنى «un zoo»؟',a:'حديقة حيوان',o:['سيرك','حديقة حيوان','مطار','محطة'],why:'zoo = حديقة حيوان.'},
 {type:'🧠 معنى',q:'ما معنى «une pharmacie»؟',a:'صيدلية',o:['مدينة','صيدلية','استاد','مكان'],why:'pharmacie = صيدلية.'},
 {type:'🧠 معنى',q:'ما معنى «un lieu»؟',a:'مكان',o:['مكان','بلد','قطار','تذكرة'],why:'lieu = مكان.'},
 {type:'🚆 وسيلة نقل',q:'اختر الجملة الصحيحة للتعبير عن «أستقل القطار».',a:'Je prends le train.',o:['Je prends le train.','Je vais le train.','Je prends la gare.','Je vais au train.'],why:'وسيلة النقل تأتي مع prendre.'},
 {type:'✈️ وسيلة نقل',q:'أي كلمة هي وسيلة نقل للسفر جوًا؟',a:"l'avion",o:["l'avion",'la gare','le guichet','le stade'],why:'l’avion = الطائرة.'},
 {type:'🚕 وسيلة نقل',q:'اختر التعبير الصحيح: «أستقل سيارة أجرة».',a:'Je prends un taxi.',o:['Je prends un taxi.','Je vais un taxi.','Je prends la pharmacie.','Je vais à taxi.'],why:'taxi وسيلة نقل، لذلك نستخدم prendre.'},
 {type:'📍 وجهة',q:'اختر الجملة الصحيحة: «أذهب إلى الشاطئ».',a:'Je vais à la plage.',o:['Je vais à la plage.','Je vais au plage.','Je prends à la plage.','Je prends la plage.'],why:'plage مؤنث مفرد → à la مع aller.'},
 {type:'📍 وجهة',q:'اختر الجملة الصحيحة: «يذهب إلى الاستاد».',a:'Il va au stade.',o:['Il va au stade.','Il va à la stade.','Il prend au stade.','Il va aux stade.'],why:'stade مذكر مفرد → au.'},
 {type:'📍 وجهة',q:'اختر الجملة الصحيحة: «نذهب إلى حديقة الحيوان».',a:'Nous allons au zoo.',o:['Nous allons au zoo.','Nous allons à la zoo.','Nous prenons au zoo.','Nous allons aux zoo.'],why:'zoo مذكر مفرد → au.'},
 {type:'📍 وجهة',q:'اختر الجملة الصحيحة: «أذهب إلى الصيدلية».',a:'Je vais à la pharmacie.',o:['Je vais à la pharmacie.','Je vais au pharmacie.','Je prends à la pharmacie.','Je vais aux pharmacie.'],why:'pharmacie مؤنث مفرد → à la.'},
 {type:'📘 قاعدة',q:'إذا كان السؤال عن وسيلة النقل، ما الفعل الأساسي؟',a:'prendre',o:['prendre','aller','être','avoir'],why:'وسيلة النقل → prendre.'},
 {type:'📘 قاعدة',q:'إذا كان السؤال عن الوجهة، ما الفعل الأساسي؟',a:'aller',o:['avoir','être','aller','prendre'],why:'الوجهة → aller.'},
 {type:'📘 قاعدة',q:'اختر الأداة الصحيحة: Je vais ___ aéroport.',a:"à l'",o:["à l'",'au','à la','aux'],why:'aéroport يبدأ بحرف متحرك → à l’.'},
 {type:'📘 قاعدة',q:'اختر الأداة الصحيحة: Nous allons ___ plage.',a:'à la',o:['au','aux','à la',"à l'"],why:'plage مؤنث مفرد → à la.'},
 {type:'🔎 اكتشف الخطأ',q:'أي جملة خاطئة لأننا استخدمنا aller مع وسيلة نقل؟',a:'Je vais le train.',o:['Je vais le train.','Je prends le train.','Je vais à la gare.','Nous prenons le bus.'],why:'train وسيلة نقل، والصحيح: Je prends le train.'},
 {type:'🔎 تصنيف',q:'أي كلمة ليست مكانًا؟',a:'le bus',o:['la gare','un zoo','le bus','une ville'],why:'le bus وسيلة نقل، أما البقية أماكن.'},
 {type:'🔎 تصنيف',q:'أي كلمة ليست وسيلة نقل؟',a:'un guichet',o:['le métro','le taxi','le train','un guichet'],why:'guichet مكان/شباك، وليس وسيلة نقل.'},
 {type:'⚡ سرعة',q:'أكمل: Ils ___ à la gare.',a:'vont',o:['vont','prennent','allez','vas'],why:'ils + aller = vont.'}
];
let scoreValue=0,round=[];const app=document.getElementById('app'),score=document.getElementById('score');
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(){scoreValue=0;score.textContent='⭐ نقاط الجولة: 0 / 100';round=shuffle(BANK).slice(0,10);app.innerHTML=round.map((x,i)=>`<section class="g"><span class="tag">${x.type} · ${i+1}/10</span><h2>${x.q}</h2><div class="o">${shuffle(x.o).map(o=>`<button data-q="${i}" data-a="${encodeURIComponent(o)}">${o}</button>`).join('')}</div><div class="r"></div></section>`).join('');app.querySelectorAll('.o button').forEach(b=>b.addEventListener('click',()=>answer(b)))}
function answer(b){const box=b.parentElement;if(box.dataset.done)return;box.dataset.done='1';const i=+b.dataset.q,x=round[i],chosen=decodeURIComponent(b.dataset.a),ok=chosen===x.a;const r=box.nextElementSibling;r.textContent=ok?'✓ صحيح — '+x.why:'✗ غير صحيح. الإجابة الصحيحة: '+x.a+' — '+x.why;r.className='r '+(ok?'ok':'bad');box.querySelectorAll('button').forEach(z=>z.disabled=true);if(ok){scoreValue+=10;score.textContent='⭐ نقاط الجولة: '+scoreValue+' / 100'}}
document.getElementById('newRound').addEventListener('click',start);start();
</script></html>
