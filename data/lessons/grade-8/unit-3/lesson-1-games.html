<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#f4f7fc;color:#17223b;font-family:Arial,Cairo,sans-serif}.w{max-width:1000px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#173a82,#7c3aed,#2563eb);color:#fff;border-radius:28px;padding:28px}.g{background:#fff;border:1px solid #dfe6f0;border-radius:22px;padding:20px;margin-top:15px}.o{display:flex;flex-wrap:wrap;gap:9px}.o button{padding:12px 15px;border:1px solid #ccd6e5;border-radius:12px;background:#fff;font-weight:900}.r{min-height:25px;margin-top:10px;font-weight:900;line-height:1.7}.ok{color:#159447}.bad{color:#c43b3b}.btn{background:#2563eb;color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer}.score{font-weight:900;margin:14px 0}</style><main class="w"><section class="hero"><h1>🎮 HM Game Studio · Leçon 1</h1><p>Le voyage · وسائل النقل والأماكن</p><p>اختبر المعنى والسياق والقاعدة، وليس الحفظ فقط.</p></section><div id="app"></div><div class="score" id="score">⭐ نقاط الجولة: 0 / 80</div><button class="btn" onclick="start()">🔀 جولة جديدة</button></main><script>const M=[['🚌 Transport Match','ما وسيلة النقل المقصودة: «أستقل الحافلة»؟','Je prends le bus',['Je prends le bus','Je vais à la gare','Je prends la gare'],'التركيب المطلوب: prendre + وسيلة النقل.'],['🚆 Transport Match','ما وسيلة النقل المقصودة: «أستقل القطار»؟','Je prends le train',['Je prends le train','Je vais le train','Je prends la gare'],'train وسيلة نقل، لذلك نستخدم prendre.'],['✈️ Transport Match','السفر جوًا يحتاج إلى أي وسيلة؟','l’avion',['l’avion','la gare','la station'],'avion = الطائرة.'],['📍 Destination','الوجهة هي «محطة القطار». اختر التركيب الصحيح.','à la gare',['à la gare','au gare','aux gare'],'gare مؤنث مفرد، لذلك à la gare.'],['🏷️ Ticket Detective','ما العنصر الذي يثبت أن لديك تذكرة للسفر؟','le billet',['le billet','la gare','le bus'],'billet = تذكرة.'],['🧩 Grammar Builder','أكمل حسب معيار «وجهة»: Je ___ à l’aéroport.','vais',['vais','prends','suis'],'الوجهة → aller؛ مع je: vais.'],['🧠 Intrus','أي كلمة ليست وسيلة نقل؟ bus / train / gare / avion','gare',['gare','bus','train','avion'],'gare مكان، أما البقية وسائل نقل.'],['⚡ Speed Choice','أكمل: Nous ___ le train.','prenons',['prenons','allons','prend'],'nous + prendre = prenons.']];let score=0;function start(){score=0;scoreEl();app.innerHTML=M.map((x,i)=>`<section class="g"><h2>${x[0]}</h2><p><b>${x[1]}</b></p><div class="o">${[...x[3]].sort(()=>Math.random()-.5).map(o=>`<button onclick="ans(this,'${o.replaceAll("'","\\'")}','${x[2].replaceAll("'","\\'")}','${x[4].replaceAll("'","\\'")}')">${o}</button>`).join('')}</div><div class="r"></div></section>`).join('')}function scoreEl(){score.textContent='⭐ نقاط الجولة: '+score+' / 80'}function ans(b,x,a,why){let r=b.parentElement.nextElementSibling;if(b.parentElement.dataset.done)return;b.parentElement.dataset.done='1';let ok=x===a;r.textContent=ok?'✓ صحيح — '+why:'✗ غير صحيح. الإجابة الصحيحة: '+a+' — '+why;r.className='r '+(ok?'ok':'bad');b.parentElement.querySelectorAll('button').forEach(x=>x.disabled=true);if(ok){score+=10;scoreEl()}}start();</script></html>
