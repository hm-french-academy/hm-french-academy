<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Game Studio · Unité 3</title><style>:root{--n:#14264a;--b:#2563eb;--p:#e92d83;--g:#20a45a;--r:#c43b3b;--l:#dfe6f0}*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:var(--n);font-family:Arial,Cairo,sans-serif}.w{max-width:980px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#173a82,#7c3aed,#2563eb);color:#fff;border-radius:28px;padding:24px;box-shadow:0 18px 45px #203c7a22}.hero h1{margin:7px 0;font-size:clamp(28px,6vw,44px)}.hero p{line-height:1.8}.tag,.pill{display:inline-block;border-radius:12px;padding:8px 11px;font-weight:900}.tag{background:#ffffff20}.pill{background:#eef3ff;color:#315aa4}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.mode,.opt,.btn{border:1px solid var(--l);background:#fff;border-radius:16px;padding:14px;font-weight:900;cursor:pointer;color:var(--n)}.mode{text-align:right}.mode.active{background:var(--p);border-color:var(--p);color:#fff}.mode small{display:block;margin-top:5px;opacity:.75}.game{background:#fff;border:1px solid var(--l);border-radius:24px;padding:20px}.top{display:flex;justify-content:space-between;gap:10px}.bar{height:9px;background:#e9eef7;border-radius:99px;overflow:hidden;margin:14px 0}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--b),#7c3aed)}.q{font-size:clamp(21px,4vw,30px);font-weight:900;line-height:1.7;margin:18px 0}.opts{display:grid;gap:10px}.opt{text-align:right;font-size:17px;border-width:2px}.opt.correct{border-color:var(--g);background:#effaf3}.opt.wrong{border-color:var(--r);background:#fff3f3}.fb{min-height:26px;margin-top:13px;font-weight:900;line-height:1.7}.ok{color:#159447}.bad{color:var(--r)}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:14px}.btn{background:#eef3ff;color:#315aa4}.primary{background:var(--p);color:#fff;border-color:var(--p)}.btn:disabled{opacity:.45}.rule{margin-top:13px;padding:14px;border-radius:15px;background:#fff8e8;color:#795d13;line-height:1.8}.result{text-align:center;padding:25px}.result strong{display:block;font-size:60px;margin:15px}@media(max-width:700px){.modes{grid-template-columns:1fr 1fr}}@media(max-width:480px){.modes{grid-template-columns:1fr}.game{padding:15px}.actions{display:grid}.actions .btn{width:100%}}</style></head><body><main class="w"><section class="hero"><span class="tag">🎮 HM Game Studio · Unité 3 · Leçon 1</span><h1>Le voyage</h1><p>6 أنماط × 10 أسئلة = <b>60 تحديًا</b> في وسائل النقل والأماكن و <b>prendre / aller</b>.</p><p>كل سؤال يحدد المطلوب بوضوح، وفي Error Detective توجد جملة خاطئة واحدة فقط.</p></section><div id="modes" class="modes"></div><section id="game" class="game"></section></main><script>
const modes=[['🧠 معنى سريع','ترجمة المفردة','m'],['🚆 وسيلة أم مكان؟','تصنيف المفردات','c'],['✍️ أكمل الجملة','prendre / aller','f'],['📍 اختر الوجهة',"à la / au / à l'",'p'],['🔎 Error Detective','جملة خاطئة واحدة فقط','e'],['⚡ تحدي السرعة','اختيار سريع','s']];
const words=[['le bus','الحافلة'],['le train','القطار'],["l'avion",'الطائرة'],['la voiture','السيارة'],['le métro','مترو الأنفاق'],['le taxi','سيارة أجرة'],['la gare','محطة القطار'],["l'aéroport",'المطار'],['un guichet','شباك التذاكر'],['une plage','شاطئ']];
const fill=[['Je ___ le bus.','prends',['prends','vais','allez','vont']],['Nous ___ le train.','prenons',['prenons','prend','allez','vont']],['Ils ___ à la gare.','vont',['vont','vas','allez','prennent']],['Elle ___ au stade.','va',['va','vont','vas','prenez']],['Tu ___ un taxi.','prends',['prends','prend','allons','vont']],['Nous ___ à la plage.','allons',['allons','prenons','allez','vont']],['Je ___ à l\'aéroport.','vais',['vais','prends','vas','allons']],['Vous ___ le métro.','prenez',['prenez','prends','allez','vont']],['Ils ___ au zoo.','vont',['vont','va','vas','prenons']],['Je ___ à la pharmacie.','vais',['vais','prends','va','allez']]];
const places=[['gare','à la'],['zoo','au'],["aéroport","à l'"],['pharmacie','à la'],['stade','au'],['plage','à la'],['club','au'],['ville','à la'],['gare','à la'],['zoo','au']];
const errors=[['Je prends le train.','Je vais le train.','Nous prenons le bus.','Je vais à la gare.'],['Je vais à la plage.','Nous allons au zoo.','Elle va à la pharmacie.','Je prends à la gare.'],['Tu prends un taxi.','Ils vont au stade.','Nous allons à la gare.','Je vais le métro.'],["Je prends l'avion.","Je vais à l'aéroport.",'Nous prenons le train.',"Je vais l'avion."],['Il va au club.','Elle va à la pharmacie.','Nous allons à la plage.','Ils prennent à la gare.'],['Tu prends le bus.','Vous prenez le métro.','Ils vont au zoo.','Vous allez le taxi.'],['Je vais au stade.','Je prends un taxi.','Nous allons à la ville.','Nous prenons à la plage.'],['Ils vont à la gare.','Elle prend le train.',"Je vais à l'aéroport.",'Je prends à la pharmacie.'],['Nous prenons le bus.','Tu vas au club.','Je vais au zoo.','Ils vont le train.'],['Je prends le métro.','Elle va à la gare.','Nous allons au stade.','Je vais le bus.']];
const speed=[['أي فعل مع وسيلة النقل؟','prendre',['prendre','aller','être','avoir']],['أي فعل مع الوجهة؟','aller',['avoir','aller','être','prendre']],['«le train» يعني؟','القطار',['القطار','المطار','الشاطئ','النادي']],['«un guichet» يعني؟','شباك التذاكر',['شباك التذاكر','مدينة','قطار','صيدلية']],['«une plage» يعني؟','شاطئ',['شاطئ','محطة','مطار','استاد']],['«un zoo» يعني؟','حديقة حيوان',['حديقة حيوان','نادي','بلد','تذكرة']],['مع gare نستخدم؟','à la',['à la','au','aux',"à l'"]],['مع zoo نستخدم؟','au',['au','à la','aux',"à l'"]],["مع aéroport نستخدم؟","à l'",["à l'",'au','à la','aux']],['nous + prendre = ؟','prenons',['prenons','prend','prenez','prennent']]];
let mode=0,round=[],pos=0,score=0,answered=false;const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sh=a=>[...a].sort(()=>Math.random()-.5);
function bank(k){if(k==='m')return words.map(x=>({q:'ما معنى «'+x[0]+'»؟',a:x[1],o:[x[1],...sh(words.filter(y=>y[1]!==x[1]).map(y=>y[1])).slice(0,3)],why:x[0]+' = '+x[1]+'.'}));if(k==='c')return words.map((x,i)=>{const a=i<6?'وسيلة نقل':'مكان';return{q:'صنّف «'+x[0]+'»: هل هي وسيلة نقل أم مكان؟',a,o:['وسيلة نقل','مكان'],why:x[0]+' = '+a+'.'}});if(k==='f')return fill.map(x=>({q:x[0],a:x[1],o:x[2],why:/^(prend|prenons|prenez)$/.test(x[1])?'وسيلة نقل → prendre.':'وجهة/مكان → aller.'}));if(k==='p')return places.map(x=>({q:'أكمل: Je vais ___ '+x[0]+'.',a:x[1],o:[x[1],x[1]==='au'?'à la':'au',x[1]==='aux'?'au':'aux',x[1]==="à l'"?'à la':'à l\''],why:x[0]+' يحتاج '+x[1]+'.'}));if(k==='e')return errors.map(o=>({q:'اختر الجملة الخاطئة — توجد جملة خاطئة واحدة فقط.',a:o[3],o,why:'هذه الجملة تخالف قاعدة الدرس؛ نستخدم prendre مع وسيلة النقل وaller مع الوجهة.'}));return speed.map(x=>({q:x[0],a:x[1],o:x[2],why:'إجابة مباشرة من مفردات وقاعدة الدرس.'}))}
function modesUI(){modes.forEach((m,i)=>{});$('#modes').innerHTML=modes.map((m,i)=>'<button class="mode '+(i===mode?'active':'')+'" data-m="'+i+'">'+m[0]+'<small>'+m[1]+'</small></button>').join('');document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=+b.dataset.m;start()})}
function start(){modesUI();round=sh(bank(modes[mode][2])).slice(0,10);pos=0;score=0;answered=false;draw()}
function draw(){const x=round[pos],opts=sh(x.o);$('#game').innerHTML='<div class="top"><span class="pill">'+modes[mode][0]+' · '+(pos+1)+'/10</span><span class="pill">⭐ '+score+' / 100</span></div><div class="bar"><span style="width:'+((pos+1)*10)+'%"></span></div><div class="q">'+esc(x.q)+'</div><div class="opts">'+opts.map(o=>'<button class="opt" data-v="'+encodeURIComponent(o)+'">'+esc(o)+'</button>').join('')+'</div><div id="fb" class="fb"></div><div class="actions"><button id="next" class="btn primary" disabled>'+(pos===9?'إنهاء الجولة ✓':'السؤال التالي ←')+'</button><button id="new" class="btn">🔄 جولة جديدة</button></div><div class="rule"><b>طريقة الحل:</b> اقرأ المطلوب أولًا ثم اختر إجابة واحدة. في <b>Error Detective</b> لا يوجد إلا اختيار خاطئ واحد.</div>';document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b,x));$('#next').onclick=()=>{if(pos<9){pos++;answered=false;draw()}else{result()}};$('#new').onclick=start}
function answer(b,x){if(answered)return;answered=true;const ok=decodeURIComponent(b.dataset.v)===x.a;document.querySelectorAll('.opt').forEach(z=>{z.disabled=true;if(z.textContent===x.a)z.classList.add('correct');else if(z===b)z.classList.add('wrong')});$('#fb').className='fb '+(ok?'ok':'bad');$('#fb').textContent=ok?'✓ صحيح — '+x.why:'✗ ليست الإجابة المطلوبة. الإجابة الصحيحة: '+x.a+' — '+x.why;if(ok)score+=10;document.querySelectorAll('.pill')[1].textContent='⭐ '+score+' / 100';$('#next').disabled=false}
function result(){$('#game').innerHTML='<div class="result"><span class="tag">نتيجة الجولة</span><h2>🎉 أحسنت!</h2><strong>'+score+'</strong><p>من 100 نقطة · '+modes[mode][0]+'</p><button class="btn primary" onclick="start()">🔄 جولة جديدة</button></div>'}start();</script></body></html>
