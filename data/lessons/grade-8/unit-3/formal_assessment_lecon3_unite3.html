<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | التقييم الرسمي — الدرس الثالث</title><style>body{margin:0;background:#f4f7fc;color:#14264a;font-family:Arial,Cairo,sans-serif}.wrap{max-width:920px;margin:auto;padding:24px 14px}.back{display:inline-block;margin-bottom:14px;color:#2850a3;background:#fff;border-radius:12px;padding:9px 14px;text-decoration:none;font-weight:900}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff;border-radius:28px;padding:28px;margin-bottom:18px}.card{background:#fff;border:1px solid #dfe6f0;border-radius:20px;padding:20px;margin:14px 0}.q{font-size:18px;font-weight:900;margin-bottom:14px}.opt{display:block;width:100%;text-align:right;background:#f8faff;border:2px solid #dbe4f2;border-radius:13px;padding:14px;margin:9px 0;cursor:pointer;font-weight:700}.opt.selected{border-color:#2563eb;background:#edf4ff}.tag{display:inline-block;background:#eaf1ff;color:#2850a3;border-radius:20px;padding:6px 10px;font-size:13px;font-weight:900;margin:4px}.note{font-size:14px;line-height:1.8;color:#eaf1ff}</style></head><body><main class="wrap"><a class="back" href="#" id="backLesson">← العودة إلى الدرس</a><section class="hero"><h1>التقييم الرسمي</h1><p>الدرس الثالث — أدوات الإشارة وتصريف أفعال السفر</p><span class="tag">12 سؤالًا</span><span class="tag">prendre</span><span class="tag">aller</span><span class="tag">voyager</span><p class="note">اختر إجابة واحدة لكل سؤال. لا تظهر الإجابة الصحيحة أثناء الحل. بعد إكمال التقييم تُحسب النتيجة وتظهر المراجعة.</p></section><form id="exam"></form><section class="card"><button type="button" style="width:100%;border:0;border-radius:14px;padding:15px;background:#e62982;color:#fff;font-weight:900;cursor:pointer" id="submit">تسليم التقييم</button><div id="result" style="margin-top:15px"></div></section></main><script>(function(){const b=document.getElementById('backLesson');b.addEventListener('click',function(e){e.preventDefault();const parts=location.pathname.split('/');const idx=parts.indexOf('data');const base=idx>0?parts.slice(0,idx).join('/'):'/';location.href=(base.endsWith('/')?base:base+'/')+'lesson.html?id=grade8-u3-l3';});})();const qs=[['أي صيغة صحيحة مع train؟',['ce train','cette train','ces train','cet train'],0],['أي صيغة صحيحة مع avion؟',['cet avion','ce avion','cette avion','ces avion'],0],['أي صيغة صحيحة مع valise؟',['cette valise','ce valise','cet valise','ces valise'],0],['أي صيغة صحيحة مع billets؟',['ces billets','ce billets','cette billets','cet billets'],0],['اختر تصريف prendre مع nous.',['prenons','prenez','prennent','prend'],0],['اختر تصريف aller مع vous.',['allez','allons','vont','vais'],0],['اختر تصريف voyager مع ils.',['voyagent','voyageons','voyagez','voyage'],0],['أكمل: Je ___ à Paris.',['vais','vas','va','allons'],0],['أكمل: Nous ___ en France.',['voyageons','voyagez','voyagent','voyage'],0],['أكمل: Ils ___ le train.',['prennent','prenons','prenez','prend'],0],['لماذا نستخدم cet مع hôtel؟',['مذكر مفرد ويبدأ بـ h صامت','مؤنث مفرد','جمع','لأنه فعل'],0],['أي جملة صحيحة؟',['Nous allons à la gare.','Nous allez à la gare.','Nous vont à la gare.','Nous vais à la gare.'],0]];const f=document.getElementById('exam');qs.forEach((q,i)=>{const c=document.createElement('section');c.className='card';c.innerHTML='<div class="q">'+(i+1)+'. '+q[0]+'</div>'+q[1].map((o,j)=>'<button type="button" class="opt" data-q="'+i+'" data-a="'+j+'">'+String.fromCharCode(65+j)+'. '+o+'</button>').join('');f.appendChild(c)});document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.opt[data-q="'+b.dataset.q+'"]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});document.getElementById('submit').onclick=()=>{let score=0,missing=[];qs.forEach((q,i)=>{const s=document.querySelector('.opt[data-q="'+i+'"].selected');if(!s)missing.push(i+1);else if(+s.dataset.a===q[2])score++});const r=document.getElementById('result');if(missing.length){r.innerHTML='<div style="background:#fff7ed;border:1px solid #f2c38b;border-radius:14px;padding:14px"><b>لم يكتمل التقييم بعد.</b><br>الأسئلة غير المجابة: '+missing.join('، ')+'</div>';return}r.innerHTML='<div style="background:#eef8f6;border:1px solid #a8d8cf;border-radius:16px;padding:18px"><h2>نتيجتك: '+score+' / '+qs.length+'</h2><p>'+(score>=10?'أداء ممتاز.':'راجع القاعدة وتصريف الأفعال ثم أعد المحاولة.')+'</p></div>';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}</script></body></html>
