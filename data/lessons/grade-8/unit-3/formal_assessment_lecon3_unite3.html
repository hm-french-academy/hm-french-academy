<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | التقييم الرسمي — الدرس الثالث</title><style>body{margin:0;background:#f4f7fc;color:#14264a;font-family:Arial,Cairo,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 14px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff;border-radius:28px;padding:26px;margin-bottom:18px}.card{background:#fff;border:1px solid #dfe6f0;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 8px 24px rgba(20,38,74,.06)}.q{font-size:18px;font-weight:900;margin-bottom:14px}.opt{display:block;width:100%;text-align:right;background:#f8faff;border:1px solid #dbe4f2;border-radius:13px;padding:13px;margin:8px 0;cursor:pointer;font-weight:700}.opt.selected{border-color:#2563eb;background:#edf4ff}.submit{width:100%;border:0;border-radius:14px;padding:15px;background:#e62982;color:#fff;font-weight:900;font-size:17px;cursor:pointer}.result{display:none;background:#eef8f6;border:1px solid #a8d8cf;border-radius:18px;padding:20px;margin-top:18px}.note{font-size:13px;color:#5f6d83}.back{display:inline-block;margin-bottom:12px;text-decoration:none;color:#2850a3;font-weight:900}</style></head><body><main class="wrap"><a class="back" href="lesson.html?id=grade8-u3-l3">← العودة إلى الدرس</a><section class="hero"><h1>التقييم الرسمي</h1><p>الدرس الثالث — أدوات الإشارة والتصريف</p><div class="note" style="color:#eaf1ff">اختر إجابة واحدة لكل سؤال. لا تظهر الإجابة الصحيحة أثناء الحل. بعد التسليم تظهر النتيجة والمراجعة.</div></section><form id="exam"></form><button class="submit" id="submit">تسليم التقييم</button><section class="result" id="result"></section></main><script>const qs=[['أي صيغة صحيحة مع train؟',['ce train','cette train','ces train','cet train'],0],['أي صيغة صحيحة مع avion؟',['cet avion','ce avion','cette avion','ces avion'],0],['أي صيغة صحيحة مع valise؟',['cette valise','ce valise','cet valise','ces valise'],0],['أي صيغة صحيحة مع billets؟',['ces billets','ce billets','cette billets','cet billets'],0],['لماذا نستخدم cet مع avion؟',['لأنه مذكر مفرد ويبدأ بصوت متحرك','لأنه مؤنث','لأنه جمع','لأنه صفة'],0],['اختر الجملة الصحيحة.',['Cette valise est lourde.','Ce valise est lourde.','Cet valise est lourde.','Ces valise est lourde.'],0],['اختر الجملة الصحيحة.',['Ces billets sont importants.','Cette billets sont importants.','Ce billets sont importants.','Cet billets sont importants.'],0],['إذا كان الاسم مذكرًا مفردًا ويبدأ بصوت ساكن، نستخدم...',['ce','cet','cette','ces'],0],['إذا كان الاسم مؤنثًا مفردًا، نستخدم...',['cette','ce','cet','ces'],0],['أي مجموعة تحتوي على أدوات الإشارة الأربع؟',['ce, cet, cette, ces','le, la, les, un','je, tu, il, nous','être, avoir, aller, faire'],0]];const f=document.getElementById('exam');qs.forEach((q,i)=>{const c=document.createElement('section');c.className='card';c.innerHTML='<div class="q">'+(i+1)+'. '+q[0]+'</div>'+q[1].map((o,j)=>'<button type="button" class="opt" data-q="'+i+'" data-a="'+j+'">'+String.fromCharCode(65+j)+'. '+o+'</button>').join('');f.appendChild(c)});document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.opt[data-q="'+b.dataset.q+'"]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});document.getElementById('submit').onclick=()=>{const r=document.getElementById('result');let score=0,missing=[];qs.forEach((q,i)=>{const s=document.querySelector('.opt[data-q="'+i+'"].selected');if(!s)missing.push(i+1);else if(+s.dataset.a===q[2])score++});if(missing.length){r.style.display='block';r.style.background='#fff7ed';r.style.borderColor='#f2c38b';r.innerHTML='<b>أكمل الأسئلة أولًا.</b><br>الأسئلة غير المجابة: '+missing.join('، ');return}r.style.display='block';r.innerHTML='<h2>نتيجتك: '+score+' / '+qs.length+'</h2><p>'+(score>=8?'أداء ممتاز.':'راجع القاعدة ثم أعد المحاولة.')+'</p>';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}</script></body></html>
