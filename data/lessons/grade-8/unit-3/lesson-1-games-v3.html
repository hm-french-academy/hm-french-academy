<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Game Studio · Le voyage · Leçon 1</title><style>:root{--nav:#17284b;--pink:#e62982;--purple:#7041e8;--blue:#2563eb;--green:#159447;--red:#c43b3b;--line:#dfe6f0;--soft:#eef4ff;--bg:#f3f6fc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef3fb,#f8fafc);color:var(--nav);font-family:Arial,"Noto Sans Arabic",sans-serif}.wrap{max-width:960px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#173b82,#7041e8 55%,#2563eb);color:#fff;border-radius:26px;padding:22px;box-shadow:0 18px 45px #203c7a22}.hero h1{margin:8px 0;font-size:clamp(28px,6vw,44px)}.hero p{line-height:1.85;margin:6px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.stat{background:#ffffff16;border:1px solid #ffffff2c;border-radius:14px;padding:10px}.stat b{display:block;font-size:21px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.mode{border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px;text-align:right;cursor:pointer;font-weight:900;color:var(--nav)}.mode.active{background:var(--pink);border-color:var(--pink);color:#fff}.mode small{display:block;margin-top:4px;opacity:.75}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 10px 28px #17284b0d}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.pill{background:var(--soft);color:#315a93;border-radius:12px;padding:9px 12px;font-weight:900}.progress{height:9px;background:#e8edf5;border-radius:99px;overflow:hidden;margin:14px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));transition:.25s}.instruction{background:#f7f9fd;border:1px solid var(--line);border-radius:15px;padding:12px 14px;line-height:1.9;color:#59687f;margin-bottom:14px}.criterion{background:#fff8e8;border:1px solid #efd9a0;border-radius:15px;padding:12px 14px;line-height:1.9;color:#735615;margin-bottom:14px}.q{font-size:clamp(22px,4vw,30px);font-weight:900;line-height:1.7;margin:15px 0}.opts{display:grid;gap:10px}.opt{width:100%;border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px;text-align:right;font-size:17px;font-weight:900;color:var(--nav);cursor:pointer;display:flex;gap:10px;align-items:center}.opt:hover:not(:disabled){border-color:#9db5e9;transform:translateY(-1px)}.opt:disabled{cursor:default}.letter{display:grid;place-items:center;width:30px;height:30px;background:var(--soft);border-radius:9px;color:#315a93;flex:none}.correct{border-color:#45aa73!important;background:#effaf3!important}.wrong{border-color:#d66b6b!important;background:#fff2f2!important}.fb{min-height:44px;margin-top:13px;padding:10px 12px;border-radius:14px;font-weight:900;line-height:1.8}.ok{background:#effaf3;color:#157b3e}.bad{background:#fff2f2;color:#a52b2b}.actions{display:flex;justify-content:space-between;gap:9px;margin-top:14px}.btn{border:0;border-radius:13px;padding:12px 17px;background:#edf3ff;color:#315a93;font-weight:900;cursor:pointer}.primary{background:var(--pink);color:#fff}.btn:disabled{opacity:.45}.result{text-align:center;padding:20px}.ring{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;margin:10px auto 14px;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff}.ring strong{font-size:34px}.result p{line-height:1.9;color:#5d6b82}.back{display:inline-block;margin-top:12px;text-decoration:none;background:#edf3ff;color:#315a93;border-radius:12px;padding:10px 14px;font-weight:900}@media(max-width:720px){.modes{grid-template-columns:1fr 1fr}}@media(max-width:480px){.wrap{padding:10px}.hero,.card{border-radius:20px;padding:15px}.stats{grid-template-columns:1fr}.modes{grid-template-columns:1fr}.actions{display:grid}.actions .btn{width:100%}.q{font-size:21px}}</style></head><body><main class="wrap"><section class="hero"><div>🎮 HM Game Studio · Unité 3 · Leçon 1</div><h1>Le voyage</h1><p>تدريب احترافي على وسائل النقل والأماكن وقاعدتي <b dir="ltr">prendre / aller</b>.</p><div class="stats"><div class="stat"><b>60</b><span>تحديًا</span></div><div class="stat"><b>6</b><span>أنماط</span></div><div class="stat"><b>1</b><span>إجابة صحيحة لكل سؤال</span></div></div></section><div id="modes" class="modes"></div><section id="game" class="card"></section></main><script>
const DATA={
meaning:{name:'🧠 معنى سريع',desc:'اختر المعنى العربي',criterion:'المطلوب: ترجمة الكلمة الفرنسية إلى العربية.',items:[['le bus','الحافلة',['الحافلة','القطار','المطار','المحطة']],['le train','القطار',['القطار','الحافلة','سيارة أجرة','المطار']],['l\'avion','الطائرة',['الطائرة','المترو','المحطة','التذكرة']],['la voiture','السيارة',['السيارة','القطار','المطار','الاستاد']],['le métro','مترو الأنفاق',['مترو الأنفاق','شباك التذاكر','الاستاد','المدينة']],['le taxi','سيارة أجرة',['سيارة أجرة','صيدلية','محطة','بلد']],['la gare','محطة القطار',['محطة القطار','شاطئ','نادي','مكان']],['l\'aéroport','المطار',['المطار','المحطة','المدينة','القطار']],['un guichet','شباك التذاكر',['شباك التذاكر','مطار','شاطئ','حديقة حيوان']],['une plage','شاطئ',['شاطئ','صيدلية','استاد','محطة']]]},
classify:{name:'🚆 وسيلة أم مكان؟',desc:'صنّف الكلمة',criterion:'المطلوب: هل الكلمة وسيلة نقل أم مكان؟',items:[['le bus','وسيلة نقل',['وسيلة نقل','مكان','صفة','شخص']],['la gare','مكان',['مكان','وسيلة نقل','صفة','شخص']],['le taxi','وسيلة نقل',['وسيلة نقل','مكان','طعام','شخص']],['un zoo','مكان',['مكان','وسيلة نقل','صفة','مهنة']],['l\'avion','وسيلة نقل',['وسيلة نقل','مكان','مهنة','صفة']],['une plage','مكان',['مكان','وسيلة نقل','مهنة','صفة']],['le métro','وسيلة نقل',['وسيلة نقل','مكان','مبنى','شخص']],['un stade','مكان',['مكان','وسيلة نقل','شخص','فعل']],['le train','وسيلة نقل',['وسيلة نقل','مكان','مدينة','شخص']],['une pharmacie','مكان',['مكان','وسيلة نقل','طعام','فعل']]]},
fill:{name:'✍️ أكمل الجملة',desc:'prendre / aller',criterion:'المطلوب: وسيلة النقل → prendre، والوجهة/المكان → aller.',items:[['Je ___ le bus.','prends',['prends','vais','allez','vont']],['Nous ___ le train.','prenons',['prenons','prend','allez','vont']],['Ils ___ à la gare.','vont',['vont','vas','allez','prennent']],['Elle ___ au stade.','va',['va','vont','vas','prenez']],['Tu ___ un taxi.','prends',['prends','prend','allons','vont']],['Nous ___ à la plage.','allons',['allons','prenons','allez','vont']],['Je ___ à l\'aéroport.','vais',['vais','prends','vas','allons']],['Vous ___ le métro.','prenez',['prenez','allez','prend','vont']],['Ils ___ au zoo.','vont',['vont','va','vas','prenons']],['Je ___ à la pharmacie.','vais',['vais','prends','va','allez']]]},
place:{name:'📍 أداة المكان',desc:'à la / au / à l\' / aux',criterion:'المطلوب: بعد aller اختر الأداة حسب الجنس والعدد: مؤنث مفرد = à la، مذكر مفرد = au، حرف متحرك = à l\'، جمع = aux.',items:[['Je vais ___ gare.','à la',['à la','au','aux',"à l'"]],['Nous allons ___ zoo.','au',['au','à la','aux',"à l'"]],['Je vais ___ aéroport.',"à l'",["à l'",'au','à la','aux']],['Elle va ___ pharmacie.','à la',['à la','au','aux',"à l'"]],['Il va ___ club.','au',['au','à la','aux',"à l'"]],['Nous allons ___ plage.','à la',['à la','au','aux',"à l'"]],['Ils vont ___ stade.','au',['au','à la','aux',"à l'"]],['Je vais ___ arrêt.',"à l'",["à l'",'au','à la','aux']],['Nous allons ___ lieux.','aux',['aux','au','à la',"à l'"]],['Ils vont ___ pharmacies.','aux',['aux','au','à la',"à l'"]]]},
error:{name:'🔎 Error Detective',desc:'اكتشف الجملة الخاطئة',criterion:'المطلوب دائمًا: اختر الجملة الخاطئة. توجد جملة خاطئة واحدة فقط.',items:[['اختر الجملة الخاطئة.',['Je prends le train.','Je vais à la gare.','Nous allons à la plage.','Je vais le train.'],3],['اختر الجملة الخاطئة.',['Tu prends un taxi.','Ils vont au stade.','Je prends le métro.','Je prends à la pharmacie.'],3],['اختر الجملة الخاطئة.',['Je vais à l\'aéroport.','Nous prenons le bus.','Elle va au zoo.','Nous allons le bus.'],3],['اختر الجملة الخاطئة.',['Je prends l\'avion.','Elle va à la gare.','Ils prennent le train.','Elle va le train.'],3],['اختر الجملة الخاطئة.',['Nous allons à la plage.','Tu prends le taxi.','Il va au club.','Ils prennent au zoo.'],3],['اختر الجملة الخاطئة.',['Je vais à la pharmacie.','Vous prenez le métro.','Nous allons au stade.','Vous allez le taxi.'],3],['اختر الجملة الخاطئة.',['Ils vont au zoo.','Je prends le bus.','Elle va à la ville.','Je prends à la gare.'],3],['اختر الجملة الخاطئة.',['Nous prenons le train.','Tu vas à la plage.','Il prend un taxi.','Tu vas le métro.'],3],['اختر الجملة الخاطئة.',['Je vais au cirque.','Nous prenons la voiture.','Elle va à la pharmacie.','Nous prenons à la pharmacie.'],3],['اختر الجملة الخاطئة.',['Je prends le bus.','Ils vont à la gare.','Vous allez au club.','Vous prenez au stade.'],3]]},
speed:{name:'⚡ تحدي سريع',desc:'مراجعة شاملة',criterion:'المطلوب: اختر الإجابة التي تحقق معنى الجملة وقاعدة الدرس معًا.',items:[['أي فعل مع وسيلة النقل؟','prendre',['prendre','aller','être','avoir']],['أي فعل مع الوجهة؟','aller',['aller','prendre','être','avoir']],['«un guichet» يعني؟','شباك التذاكر',['شباك التذاكر','شاطئ','استاد','بلد']],['«une ville» تعني؟','مدينة',['مدينة','محطة','سيرك','قطار']],['أستقل القطار.','Je prends le train.',['Je prends le train.','Je vais le train.','Je prends la gare.','Je vais à le train.']],['نذهب إلى الشاطئ.','Nous allons à la plage.',['Nous allons à la plage.','Nous prenons à la plage.','Nous allons au plage.','Nous allons aux plage.']],['المطار مع aller؟',"Je vais à l'aéroport.",["Je vais à l'aéroport.","Je prends à l'aéroport.","Je vais au aéroport.","Je prends l'aéroport."]],['المترو مع prendre؟','Je prends le métro.',['Je prends le métro.','Je vais le métro.','Je prends à la métro.','Je vais au métro.']],['zoo مع aller؟','Ils vont au zoo.',['Ils vont au zoo.','Ils vont à la zoo.','Ils prennent au zoo.','Ils vont le zoo.']],['pharmacie مع aller؟','Je vais à la pharmacie.',['Je vais à la pharmacie.','Je vais au pharmacie.','Je prends à la pharmacie.','Je vais la pharmacie.']]}};
const keys=Object.keys(DATA);let mode='meaning',index=0,score=0,answered=false,order=[];
const shuffle=a=>a.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.x);
function setMode(k){mode=k;index=0;score=0;answered=false;order=shuffle(DATA[k].items.map((_,i)=>i));renderModes();render()}
function renderModes(){document.getElementById('modes').innerHTML=keys.map(k=>`<button class="mode ${k===mode?'active':''}" data-mode="${k}">${DATA[k].name}<small>${DATA[k].desc}</small></button>`).join('');document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode))}
function render(){const d=DATA[mode],item=d.items[order[index]];let prompt,answer,opts;if(mode==='error'){prompt=item[0];answer=item[1][item[2]];opts=item[1]}else{prompt=item[0];answer=item[1];opts=item[2]};const options=shuffle(opts.map((text,i)=>({text,correct:text===answer})));document.getElementById('game').innerHTML=`<div class="top"><span class="pill">${d.name}</span><span class="pill">السؤال ${index+1} / 10 · ⭐ ${score}</span></div><div class="progress"><span style="width:${((index+1)/10)*100}%"></span></div><div class="instruction"><b>تعليمات:</b> ${d.criterion}</div><div class="q">${prompt}</div><div class="opts">${options.map((o,k)=>`<button class="opt" data-c="${o.correct?'1':'0'}"><span class="letter">${String.fromCharCode(65+k)}</span>${o.text}</button>`).join('')}</div><div id="fb" class="fb"></div><div class="actions"><button id="next" class="btn primary" disabled>${index===9?'عرض النتيجة':'السؤال التالي ←'}</button><button id="restart" class="btn">🔄 إعادة الجولة</button></div>`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answerQ(b));document.getElementById('next').onclick=next;document.getElementById('restart').onclick=()=>setMode(mode)}
function answerQ(btn){if(answered)return;answered=true;const ok=btn.dataset.c==='1';if(ok)score++;document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.c==='1')b.classList.add('correct');else if(b===btn)b.classList.add('wrong')});const fb=document.getElementById('fb');fb.className='fb '+(ok?'ok':'bad');fb.textContent=ok?'✓ إجابة صحيحة.':'✗ ليست الإجابة المطلوبة. الإجابة الصحيحة موضحة بالأخضر.';document.getElementById('next').disabled=false}
function next(){if(!answered)return;if(index<9){index++;answered=false;render()}else{const pct=score*10;document.getElementById('game').innerHTML=`<div class="result"><div class="ring"><strong>${score}/10</strong></div><h2>${DATA[mode].name}</h2><p><b>${pct}%</b> — ${pct>=90?'ممتاز، إتقان قوي.':pct>=70?'جيد جدًا، راجع الأخطاء فقط.':'راجع القاعدة ثم أعد الجولة.'}</p><button id="again" class="btn primary">🔄 إعادة الجولة</button><a class="back" href="../../../../../../lesson.html?id=grade8-u3-l1">← العودة إلى الدرس</a></div>`;document.getElementById('again').onclick=()=>setMode(mode)}}
renderModes();order=shuffle(DATA[mode].items.map((_,i)=>i));render();
</script></body></html>
