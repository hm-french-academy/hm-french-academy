*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef3fb,#f8fafc);color:var(--nav);font-family:Arial,"Noto Sans Arabic",sans-serif}.wrap{max-width:930px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#173b82,#7041e8 55%,#2563eb);color:#fff;border-radius:26px;padding:22px}.hero h1{margin:8px 0;font-size:clamp(28px,6vw,44px)}.hero p{line-height:1.9}.criteria{background:#ffffff18;border:1px solid #ffffff2b;border-radius:15px;padding:12px;line-height:1.9}.bar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:13px 0 7px;flex-wrap:wrap}.pill{background:#fff;color:#315a93;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:900}.progress{height:9px;background:#e8edf5;border-radius:99px;overflow:hidden;margin-bottom:13px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--purple));transition:.25s}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:21px;box-shadow:0 10px 28px #17284b0d}.meta{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.cat{background:var(--soft);color:#315a93;border-radius:999px;padding:7px 10px;font-weight:900}.prompt{margin-top:12px;background:#f7f9fd;border:1px solid var(--line);border-radius:15px;padding:12px;line-height:1.9;color:#59687f}.q{font-size:clamp(22px,4vw,31px);font-weight:900;line-height:1.75;margin:18px 0}.opts{display:grid;gap:10px}.opt{width:100%;border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px;text-align:right;font-size:17px;font-weight:900;color:var(--nav);cursor:pointer;display:flex;gap:10px;align-items:center}.opt:disabled{cursor:default}.letter{display:grid;place-items:center;width:30px;height:30px;background:var(--soft);border-radius:9px;color:#315a93;flex:none}.correct{border-color:#45aa73!important;background:#effaf3!important}.wrong{border-color:#d66b6b!important;background:#fff2f2!important}.fb{min-height:4 <section class="hero"><div>🎯 HM ACADEMY · ÉVALUATION INTERACTIVE</div><h1>Leçon 1 · Le voyage</h1><p>40 سؤالًا قصيرًا بتغذية راجعة فورية حول المفردات، <b dir="ltr">prendre / aller</b>، أدوات المكان والسياق.</p><div class="criteria"><b>قاعدة اللعب:</b> اقرأ «المطلوب» أولًا. كل سؤال يحدد معيار الإجابة بوضوح، ولا يوجد أكثر من خيار صحيح.</div></section>

<script>
const Q=[["مفردات","ما معنى «le bus»؟","الحافلة",["الحافلة","القطار","المطار","المحطة"],"bus = الحافلة."],["مفردات","ما معنى «le train»؟","القطار",["القطار","الحافلة","سيارة أجرة","المطار"],"train = القطار."],["مفردات","ما معنى «l’avion»؟","الطائرة",["الطائرة","المترو","المحطة","التذكرة"],"avion = الطائرة."],["مفردات","ما معنى «la voiture»؟","السيارة",["السيارة","القطار","المطار","الاستاد"],"voiture = السيارة."],["مفردات","ما معنى «le métro»؟","مترو الأنفاق",["مترو الأنفاق","شباك التذاكر","الاستاد","المدينة"],"métro = مترو الأنفاق."],["مفردات","ما معنى «le taxi»؟","سيارة أجرة",["سيارة أجرة","صيدلية","محطة","بلد"],"taxi = سيارة أجرة."],["مفردات","ما معنى «la gare»؟","محطة القطار",["محطة القطار","شاطئ","نادي","مكان"],"gare = محطة القطار."],["مفردات","ما معنى «l’aéroport»؟","المطار",["المطار","المحطة","المدينة","القطار"],"aéroport = المطار."],["مفردات","ما معنى «un guichet»؟","شباك التذاكر",["شباك التذاكر","مطار","شاطئ","حديقة حيوان"],"guichet = شباك التذاكر."],["مفردات","ما معنى «une plage»؟","شاطئ",["شاطئ","صيدلية","استاد","محطة"],"plage = شاطئ."],["prendre","أكمل: Je ___ le train.","prends",["prends","vais","va","allons"],"وسيلة نقل → prendre؛ مع je: prends."],["prendre","أكمل: Nous ___ le bus.","prenons",["prenons","allons","prend","vont"],"وسيلة نقل → prendre؛ مع nous: prenons."],["prendre","أكمل: Tu ___ un taxi.","prends",["prends","vas","prend","allons"],"taxi وسيلة نقل؛ tu + prendre = prends."],["prendre","أكمل: Vous ___ le métro.","prenez",["prenez","allez","prend","vont"],"métro وسيلة نقل؛ vous + prendre = prenez."],["aller","أكمل: Je ___ à la gare.","vais",["vais","prends","va","allez"],"gare وجهة؛ je + aller = vais."],["aller","أكمل: Ils ___ au stade.","vont",["vont","vas","allez","prennent"],"stade وجهة؛ ils + aller = vont."],["aller","أكمل: Elle ___ au zoo.","va",["va","vont","vas","prenez"],"zoo وجهة؛ elle + aller = va."],["aller","أكمل: Nous ___ à la plage.","allons",["allons","prenons","allez","vont"],"plage وجهة؛ nous + aller = allons."],["aller","أكمل: Vous ___ au club.","allez",["allez","prenez","vont","vas"],"club وجهة؛ vous + aller = allez."],["aller","أكمل: Je ___ à l’aéroport.","vais",["vais","prends","vas","allons"],"aéroport وجهة؛ je + aller = vais."],["أدوات المكان","Je vais ___ gare.","à la",["à la","au","aux","à l'"],"gare مؤنث مفرد → à la."],["أدوات المكان","Nous allons ___ zoo.","au",["au","à la","aux","à l'"],"zoo مذكر مفرد → au."],["أدوات المكان","Je vais ___ aéroport.","à l'",["à l'","au","à la","aux"],"aéroport يبدأ بحرف متحرك → à l'."],["أدوات المكان","Elle va ___ pharmacie.","à la",["à la","au","aux","à l'"],"pharmacie مؤنث مفرد → à la."],["أدوات المكان","Il va ___ club.","au",["au","à la","aux","à l'"],"club مذكر مفرد → au."],["أدوات المكان","Nous allons ___ plage.","à la",["à la","au","aux","à l'"],"plage مؤنث مفرد → à la."],["أدوات المكان","Ils vont ___ lieux.","aux",["aux","au","à la","à l'"],"lieux جمع → aux."],["أدوات المكان","Je vais ___ arrêt.","à l'",["à l'","au","à la","aux"],"arrêt يبدأ بحرف متحرك → à l'."],["أدوات المكان","Nous allons ___ gares.","aux",["aux","au","à la","à l'"],"gares جمع → aux."],["أدوات المكان","Ils vont ___ pharmacies.","aux",["aux","au","à la","à l'"],"pharmacies جمع → aux."],["قاعدة","ما الفعل المستخدم أساسًا مع وسيلة النقل؟","prendre",["prendre","aller","être","avoir"],"وسيلة النقل → prendre."],["قاعدة","ما الفعل المستخدم مع الوجهة أو المكان؟","aller",["aller","prendre","être","avoir"],"الوجهة/المكان → aller."],["سياق","أي جملة تعني «أستقل القطار»؟","Je prends le train.",["Je prends le train.","Je vais le train.","Je prends la gare.","Je vais à le train."],"train وسيلة نقل → prendre."],["سياق","أي جملة تعني «نذهب إلى الشاطئ»؟","Nous allons à la plage.",["Nous allons à la plage.","Nous prenons à la plage.","Nous allons au plage.","Nous allons aux plage."],"plage مؤنث مفرد؛ الوجهة → aller + à la."],["سياق","أي جملة صحيحة؟","Je vais à l’aéroport.",["Je vais à l’aéroport.","Je vais au aéroport.","Je prends à l’aéroport.","Je vais l’aéroport."],"aéroport يبدأ بحرف متحرك؛ aller + à l’."],["سياق","أي جملة صحيحة؟","Nous prenons le bus.",["Nous prenons le bus.","Nous allons le bus.","Nous prenons à le bus.","Nous allons au bus."],"bus وسيلة نقل؛ nous + prendre = prenons."],["سياق","اختر الجملة التي تصف وجهة.","Ils vont au zoo.",["Ils vont au zoo.","Ils prennent le train.","Je prends un taxi.","Vous prenez le métro."],"au zoo وجهة؛ لذلك نستخدم aller."],["سياق","اختر الجملة التي تصف وسيلة نقل.","Je prends le métro.",["Je prends le métro.","Je vais à la gare.","Elle va au club.","Nous allons à la plage."],"le métro وسيلة نقل؛ لذلك نستخدم prendre."],["مراجعة","ما الترتيب الصحيح لحل سؤال عن وجهة؟","aller ثم أداة المكان",["aller ثم أداة المكان","prendre ثم أداة المكان","être ثم prendre","prendre فقط"],"حدّد الوجهة، ثم aller، ثم أداة المكان المناسبة."]];
let i=0,score=0,answered=false;const shuffle=a=>a.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.x);
function speak(text){if(!('speechSynthesis'in window)){alert('النطق الصوتي غير مدعوم في هذا المتصفح.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=.84;speechSynthesis.speak(u)}
function render(){const q=Q[i],opts=shuffle(q[3]);document.getElementById('counter').textContent='السؤال '+(i+1)+' / '+Q.length;document.getElementById('score').textContent='⭐ '+score;document.getElementById('bar').style.width=((i)/Q.length*100)+'%';document.getElementById('card').innerHTML=`<div class="meta"><span class="cat">${q[0]}</span><span class="cat">إجابة واحدة فقط</span></div><div class="prompt"><b>المطلوب:</b> ${q[1]}</div><div class="q">${q[1]}</div><div class="opts">${opts.map((o,j)=>`<button class="opt" onclick="answer(this,'${encodeURIComponent(o)}')"><span class="letter">${String.fromCharCode(65+j)}</span><span>${o}</span></button>`).join('')}</div><div id="fb" class="fb"></div><div class="actions"><button class="btn primary" id="next" disabled onclick="next()">السؤال التالي ←</button><button class="btn" onclick="speak('${encodeURIComponent(q[2])}')">🔊 استمع للإجابة</button></div>`}
function answer(btn,encoded){if(answered)return;answered=true;const val=decodeURIComponent(encoded),q=Q[i];document.querySelectorAll('.opt').forEach(b=>b.disabled=true);const ok=val===q[2];if(ok){score++;btn.classList.add('correct');document.getElementById('fb').className='fb ok';document.getElementById('fb').innerHTML='✅ ممتاز! إجابة صحيحة.'}else{btn.classList.add('wrong');document.getElementById('fb').className='fb bad';document.getElementById('fb').innerHTML='❌ ليست الإجابة الصحيحة.<div>'+q[4]+'</div>'}document.getElementById('next').disabled=false;document.getElementById('score').textContent='⭐ '+score}
function next(){if(!answered)return;if(i<Q.length-1){i++;answered=false;render()}else{document.getElementById('bar').style.width='100%';document.getElementById('card').innerHTML=`<div class="result"><div class="ring"><strong>${score}/${Q.length}</strong></div><h2>🎉 انتهى التقييم التفاعلي</h2><p>نسبتك: <b>${Math.round(score/Q.length*100)}%</b></p><p>${score/Q.length>=.9?'ممتاز!':score/Q.length>=.75?'جيد جدًا!':'راجع المرجع ثم أعد التدريب.'}</p><div class="nav"><a href="formal_assessment_lecon1_unite3.html">📝 التقييم الرسمي</a><a href="pronunciation_challenge_lecon1_unite3.html">🔊 النطق</a></div></div>`;localStorage.setItem('hm_interactive_grade8_u3_l1',JSON.stringify({score,total:Q.length,pct:Math.round(score/Q.length*100),at:new Date().toISOString()}))}}
render();
</script></body></html>
