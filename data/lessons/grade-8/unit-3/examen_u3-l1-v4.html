<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy · Évaluation interactive · Leçon 1</title><style>:root{--nav:#17284b;--pink:#e62982;--purple:#7041e8;--blue:#2563eb;--line:#dfe6f0;--soft:#eef4ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef3fb,#f8fafc);color:var(--nav);font-family:Arial,"Noto Sans Arabic",sans-serif}.wrap{max-width:930px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#173b82,#7041e8 55%,#2563eb);color:#fff;border-radius:26px;padding:22px}.hero h1{margin:8px 0;font-size:clamp(28px,6vw,44px)}.hero p{line-height:1.9}.criteria,.prompt{background:#ffffff18;border:1px solid #ffffff2b;border-radius:15px;padding:12px;line-height:1.9}.bar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:13px 0 7px;flex-wrap:wrap}.pill{background:#fff;color:#315a93;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:900}.progress{height:9px;background:#e8edf5;border-radius:99px;overflow:hidden;margin-bottom:13px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--purple));transition:.25s}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:21px;box-shadow:0 10px 28px #17284b0d}.meta{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.cat{background:var(--soft);color:#315a93;border-radius:999px;padding:7px 10px;font-weight:900}.prompt{margin-top:12px;background:#f7f9fd;border-color:var(--line);color:#59687f}.q{font-size:clamp(22px,4vw,31px);font-weight:900;line-height:1.75;margin:18px 0}.opts{display:grid;gap:10px}.opt{width:100%;border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px;text-align:right;font-size:17px;font-weight:900;color:var(--nav);cursor:pointer;display:flex;gap:10px;align-items:center}.opt:disabled{cursor:default}.letter{display:grid;place-items:center;width:30px;height:30px;background:var(--soft);border-radius:9px;color:#315a93;flex:none}.correct{border-color:#45aa73!important;background:#effaf3!important}.wrong{border-color:#d66b6b!important;background:#fff2f2!important}.fb{min-height:45px;margin-top:13px;padding:11px 13px;border-radius:14px;font-weight:900;line-height:1.8}.ok{background:#effaf3;color:#157b3e}.bad{background:#fff2f2;color:#a52b2b}.actions{display:flex;justify-content:space-between;gap:9px;margin-top:14px}.btn{border:0;border-radius:13px;padding:12px 17px;background:#edf3ff;color:#315a93;font-weight:900;cursor:pointer}.primary{background:var(--pink);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.result{text-align:center;padding:20px}.ring{width:135px;height:135px;border-radius:50%;display:grid;place-items:center;margin:10px auto 14px;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff}.ring strong{font-size:35px}.result p{line-height:1.9;color:#5d6b82}.nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:13px}.nav a{text-decoration:none;background:#edf3ff;color:#315a93;border-radius:12px;padding:10px 13px;font-weight:900}@media(max-width:560px){.wrap{padding:10px}.hero,.card{border-radius:20px;padding:15px}.actions{display:grid}.actions .btn{width:100%}.q{font-size:22px}}</style></head><body><main class="wrap"><section class="hero"><div>🎯 HM ACADEMY · ÉVALUATION INTERACTIVE</div><h1>Leçon 1 · Le voyage</h1><p>40 سؤالًا قصيرًا بتغذية راجعة فورية حول المفردات، <b dir="ltr">prendre / aller</b>، أدوات المكان والسياق.</p><div class="criteria"><b>قاعدة التقييم:</b> اقرأ المطلوب أولًا. كل سؤال له إجابة صحيحة واحدة فقط.</div></section><div class="nav"><a href="formal_assessment_lecon1_unite3.html">📝 التقييم الرسمي</a><a href="reference_lecon1_unite3.html">📖 المرجع</a><a href="lesson-1-games-v4.html">🎮 الألعاب</a><a href="pronunciation_challenge_lecon1_unite3.html">🔊 النطق</a></div><div class="bar"><span class="pill" id="counter"></span><span class="pill" id="score">⭐ 0</span></div><div class="progress"><span id="bar"></span></div><section class="card" id="card"></section></main><script>
const vocab=[['le bus','الحافلة'],['le train','القطار'],["l’avion",'الطائرة'],['la voiture','السيارة'],['le métro','مترو الأنفاق'],['le taxi','سيارة أجرة'],['la gare','محطة القطار'],["l’aéroport",'المطار'],['un guichet','شباك التذاكر'],['une plage','شاطئ']];
const Q=[...vocab.map((x,i)=>['مفردات','ما معنى «'+x[0]+'»؟',x[1],vocab.filter(y=>y[1]!==x[1]).slice(0,3).map(y=>y[1]),x[0]+' = '+x[1]+'.']),['prendre','أكمل: Je ___ le train.','prends',['prends','vais','va','allons'],'وسيلة نقل → prendre؛ مع je: prends.'],['prendre','أكمل: Nous ___ le bus.','prenons',['prenons','allons','prend','vont'],'وسيلة نقل → prendre؛ مع nous: prenons.'],['prendre','أكمل: Tu ___ un taxi.','prends',['prends','vas','prend','allons'],'وسيلة نقل → prendre؛ مع tu: prends.'],['prendre','أكمل: Vous ___ le métro.','prenez',['prenez','allez','prend','vont'],'وسيلة نقل → prendre؛ مع vous: prenez.'],['prendre','أكمل: Ils ___ le train.','prennent',['prennent','vont','prend','allez'],'وسيلة نقل → prendre؛ مع ils: prennent.'],['aller','أكمل: Je ___ à la gare.','vais',['vais','prends','va','allez'],'وجهة → aller؛ مع je: vais.'],['aller','أكمل: Ils ___ au stade.','vont',['vont','vas','allez','prennent'],'وجهة → aller؛ مع ils: vont.'],['aller','أكمل: Elle ___ au zoo.','va',['va','vont','vas','prenez'],'وجهة → aller؛ مع elle: va.'],['aller','أكمل: Nous ___ à la plage.','allons',['allons','prenons','allez','vont'],'وجهة → aller؛ مع nous: allons.'],['aller','أكمل: Vous ___ au club.','allez',['allez','prenez','vont','vas'],'وجهة → aller؛ مع vous: allez.'],['أدوات المكان','Je vais ___ gare.','à la',["à la",'au','aux',"à l'"],'gare مؤنث مفرد → à la.'],['أدوات المكان','Nous allons ___ zoo.','au',['au','à la','aux',"à l'"],'zoo مذكر مفرد → au.'],['أدوات المكان',"Je vais ___ aéroport.","à l'",["à l'",'au','à la','aux'],"aéroport يبدأ بحرف متحرك → à l’ ."],['أدوات المكان','Elle va ___ pharmacie.','à la',["à la",'au','aux',"à l'"],'pharmacie مؤنث مفرد → à la.'],['أدوات المكان','Il va ___ club.','au',['au','à la','aux',"à l'"],'club مذكر مفرد → au.'],['أدوات المكان','Nous allons ___ plage.','à la',["à la",'au','aux',"à l'"],'plage مؤنث مفرد → à la.'],['أدوات المكان','Ils vont ___ lieux.','aux',['aux','au','à la',"à l'"],'lieux جمع → aux.'],['أدوات المكان',"Je vais ___ arrêt.","à l'",["à l'",'au','à la','aux'],"arrêt يبدأ بحرف متحرك → à l’ ."],['أدوات المكان','Nous allons ___ gares.','aux',['aux','au','à la',"à l'"],'gares جمع → aux.'],['أدوات المكان','Ils vont ___ pharmacies.','aux',['aux','au','à la',"à l'"],'pharmacies جمع → aux.'],['سياق','أي جملة تعني «أستقل القطار»؟','Je prends le train.',['Je prends le train.','Je vais le train.','Je prends la gare.','Je vais à le train.'],'train وسيلة نقل → prendre.'],['سياق','أي جملة تعني «نذهب إلى الشاطئ»؟','Nous allons à la plage.',['Nous allons à la plage.','Nous prenons à la plage.','Nous allons au plage.','Nous allons aux plage.'],'plage مؤنث مفرد؛ الوجهة → aller + à la.'],['سياق','أي جملة صحيحة؟','Je vais à l’aéroport.',['Je vais à l’aéroport.','Je vais au aéroport.','Je prends à l’aéroport.','Je vais l’aéroport.'],'aéroport يبدأ بحرف متحرك؛ aller + à l’.'],['سياق','أي جملة صحيحة؟','Nous prenons le bus.',['Nous prenons le bus.','Nous allons le bus.','Nous prenons à le bus.','Nous allons au bus.'],'bus وسيلة نقل؛ prendre.'],['سياق','اختر الجملة التي تصف وجهة.','Ils vont au zoo.',['Ils vont au zoo.','Ils prennent le train.','Je prends un taxi.','Vous prenez le métro.'],'au zoo وجهة؛ aller.'],['سياق','اختر الجملة التي تصف وسيلة نقل.','Je prends le métro.',['Je prends le métro.','Je vais à la gare.','Elle va au club.','Nous allons à la plage.'],'le métro وسيلة نقل؛ prendre.'],['مراجعة','ما الفعل المستخدم أساسًا مع وسيلة النقل؟','prendre',['prendre','aller','être','avoir'],'وسيلة النقل → prendre.'],['مراجعة','ما الفعل المستخدم مع الوجهة أو المكان؟','aller',['aller','prendre','être','avoir'],'الوجهة/المكان → aller.'],['مراجعة','ما الترتيب الصحيح لحل سؤال عن وجهة؟','aller ثم أداة المكان',['aller ثم أداة المكان','prendre ثم أداة المكان','être ثم prendre','prendre فقط'],'حدّد الوجهة، ثم aller، ثم أداة المكان المناسبة.'],['مراجعة','أي عبارة صحيحة مع «le train»؟','Je prends le train.',['Je prends le train.','Je vais le train.','Je prends au train.','Je vais à le train.'],'وسيلة النقل تأخذ prendre.'],['مراجعة','أي عبارة صحيحة مع «la gare»؟','Je vais à la gare.',['Je vais à la gare.','Je vais au gare.','Je prends la gare.','Je vais à l’gare.'],'gare مؤنث مفرد → à la gare.'],['مراجعة','أي عبارة صحيحة مع «l’aéroport»؟','Je vais à l’aéroport.',['Je vais à l’aéroport.','Je vais au aéroport.','Je prends l’aéroport.','Je vais à la aéroport.'],'aéroport يبدأ بحرف متحرك → à l’aéroport.'],['مراجعة','أي عبارة صحيحة مع «les lieux»؟','Ils vont aux lieux.',['Ils vont aux lieux.','Ils vont au lieux.','Ils prennent aux lieux.','Ils vont à la lieux.'],'جمع → aux.'],['مراجعة','أي عبارة تصف وسيلة نقل؟','Nous prenons le bus.',['Nous prenons le bus.','Nous allons au zoo.','Elle va à la gare.','Ils vont à la plage.'],'bus وسيلة نقل → prendre.'],['مراجعة','أي عبارة تصف وجهة؟','Elle va au zoo.',['Elle va au zoo.','Elle prend le taxi.','Je prends le métro.','Nous prenons le train.'],'zoo وجهة → aller.'],['مراجعة','أي اختيار يجمع القاعدة الصحيحة؟','prendre + transport / aller + destination',['prendre + transport / aller + destination','aller + transport / prendre + destination','être + transport / avoir + destination','prendre فقط'],'هذه هي خريطة الدرس الأساسية.'],['مراجعة','ما الصيغة الصحيحة مع «vous» و«aller»؟','Vous allez.',['Vous allez.','Vous vas.','Vous vont.','Vous prenez.'],'vous + aller = allez.']];
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}let i=0,score=0,answered=false;function speak(t){if(!('speechSynthesis'in window)){alert('النطق الصوتي غير مدعوم.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.84;speechSynthesis.speak(u)}function render(){const q=Q[i],opts=shuffle([q[2],...q[3].filter(x=>x!==q[2]).slice(0,3)]);document.getElementById('counter').textContent='السؤال '+(i+1)+' / '+Q.length;document.getElementById('score').textContent='⭐ '+score;document.getElementById('bar').style.width=(i/Q.length*100)+'%';document.getElementById('card').innerHTML='<div class="meta"><span class="cat">'+q[0]+'</span><span class="cat">إجابة واحدة فقط</span></div><div class="prompt"><b>المطلوب:</b> '+q[1]+'</div><div class="q">'+q[1]+'</div><div class="opts">'+opts.map((o,j)=>'<button class="opt" onclick="answer(this,'+JSON.stringify(o)+')"><span class="letter">'+String.fromCharCode(65+j)+'</span><span>'+o+'</span></button>').join('')+'</div><div id="fb" class="fb"></div><div class="actions"><button class="btn primary" id="next" disabled onclick="next()">السؤال التالي ←</button><button class="btn" onclick="speak('+JSON.stringify(q[2])+')">🔊 استمع للإجابة</button></div>'}function answer(btn,val){if(answered)return;answered=true;document.querySelectorAll('.opt').forEach(b=>b.disabled=true);const q=Q[i],ok=val===q[2];if(ok){score++;btn.classList.add('correct');document.getElementById('fb').className='fb ok';document.getElementById('fb').innerHTML='✅ ممتاز! إجابة صحيحة.'}else{btn.classList.add('wrong');document.getElementById('fb').className='fb bad';document.getElementById('fb').innerHTML='❌ ليست الإجابة الصحيحة.<div>'+q[4]+'</div>'}document.getElementById('next').disabled=false;document.getElementById('score').textContent='⭐ '+score}function next(){if(!answered)return;if(i<Q.length-1){i++;answered=false;render()}else{document.getElementById('bar').style.width='100%';const pct=Math.round(score/Q.length*100);document.getElementById('card').innerHTML='<div class="result"><div class="ring"><strong>'+score+'/'+Q.length+'</strong></div><h2>🎉 انتهى التقييم التفاعلي</h2><p>نسبتك: <b>'+pct+'%</b></p><p>'+(pct>=90?'ممتاز!':pct>=75?'جيد جدًا!':'راجع المرجع ثم أعد التدريب.')+'</p><div class="nav"><a href="formal_assessment_lecon1_unite3.html">📝 التقييم الرسمي</a><a href="lesson-1-games-v4.html">🎮 الألعاب</a><a href="pronunciation_challenge_lecon1_unite3.html">🔊 النطق</a></div></div>';localStorage.setItem('hm_interactive_grade8_u3_l1',JSON.stringify({score,total:Q.length,pct,at:new Date().toISOString()}))}}render();</script></body></html>
