<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy · Entraînement interactif · Leçon 2</title><style>:root{--nav:#17284b;--pink:#e62982;--blue:#2563eb;--purple:#7041e8;--line:#dfe6f0;--soft:#f4f7ff;--bg:#eef3fb;--good:#15803d;--bad:#b91c1c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef3fb,#f8fafc);color:var(--nav);font-family:Arial,"Noto Sans Arabic",sans-serif}.wrap{max-width:920px;margin:auto;padding:12px}.hero{background:linear-gradient(135deg,#173b82,#7041e8 55%,#2563eb);color:#fff;border-radius:26px;padding:22px;box-shadow:0 14px 35px #17284b20}.hero h1{margin:8px 0;font-size:clamp(28px,6vw,44px)}.hero p{line-height:1.8;margin:4px 0}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:900;color:#315a93}.q{background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px;margin:12px 0}.qhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.tag{background:var(--soft);border-radius:10px;padding:7px 10px;font-weight:900;color:#315a93}.text{font-size:20px;font-weight:900;line-height:1.8;margin:12px 0}.opts{display:grid;gap:8px}.opt{width:100%;display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:right;font:inherit;font-weight:800;color:var(--nav);cursor:pointer}.opt.selected{border-color:var(--pink);background:#fff1f8}.letter{display:grid;place-items:center;min-width:34px;height:34px;background:var(--soft);border-radius:10px;font-weight:900;color:#315a93}.selected .letter{background:var(--pink);color:#fff}.actions{position:sticky;bottom:8px;display:flex;justify-content:center;gap:8px;margin:16px 0;z-index:3}.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:900;cursor:pointer}.primary{background:var(--pink);color:#fff}.secondary{background:#edf3ff;color:#315a93}.btn:disabled{opacity:.5}.result{display:none;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:15px;text-align:center}.result.show{display:block}.warning{background:#fff8e8;border-color:#efd9a0;color:#735615}.score{font-size:42px;font-weight:900;color:var(--purple)}.review{text-align:right;margin-top:12px}.review div{padding:9px;border-radius:10px;margin:6px 0}.right{background:#effaf3;color:#146c38}.wrong{background:#fff1f1;color:#9b1c1c}@media(max-width:600px){.wrap{padding:9px}.hero,.q{border-radius:18px;padding:15px}.actions{display:grid}.actions .btn{width:100%}}</style></head><body><main class="wrap"><section class="hero"><div>🎯 HM ACADEMY · ENTRAÎNEMENT INTERACTIF</div><h1>Leçon 2 · Le voyage</h1><p>تدريب قصير متنوع لبناء الفهم والتطبيق قبل التقييم الرسمي.</p></section><div class="meta"><span class="pill">🧠 10 أسئلة تدريبية</span><span class="pill">⚡ تصحيح فوري بعد الجولة</span><span class="pill">🎯 أسئلة مختلفة عن التقييم الرسمي</span></div><section id="message" class="result" aria-live="polite"></section><form id="form"></form><div class="actions"><button class="btn primary" id="submit" type="button">إظهار النتيجة</button><button class="btn secondary" type="button" onclick="location.href='formal_assessment_lecon2_unite3.html'">📝 التقييم الرسمي</button><button class="btn secondary" type="button" onclick="location.href='lesson.html?id=grade8-u3-l2'">← العودة إلى الدرس</button></div><section id="result" class="result"></section></main><script>const Q=[
['تمييز سريع','أي كلمة تعني «راكب»؟',['un guichetier','un passager','un pharmacien'],1],
['مفردات','اختر الكلمة التي تعني «تذكرة مترو أو أوتوبيس».',['une valise','un billet','un ticket'],2],
['معنى في السياق','ما معنى «des horaires»؟',['مواعيد الرحلات','حقيبة سفر','سائحة'],0],
['تمييز المذكر والمؤنث','اختر صيغة المؤنث الصحيحة لـ un passager.',['une passagère','une passager','un passagère'],0],
['السياق','من يبيع التذاكر في الشباك؟',['un touriste','un guichetier','un passager'],1],
['إكمال الجملة','J’ai une ... اختر الكلمة المناسبة.',['horaires','valise','pharmacien'],1],
['التطبيق','اختر الجملة الصحيحة.',['Elle a son ticket.','Elle ai son ticket.','Elle est son ticket.'],0],
['التعبير','ماذا تقول لشخص سيبدأ رحلة؟',['Bon billet !','Bon voyage !','Bon ticket !'],1],
['اختيار حسب المعنى','أي كلمة تعني «صيدلي»؟',['un touriste','un pharmacien','un passager'],1],
['المفردات في السياق','أي جملة مناسبة لشخص يراجع مواعيد القطار؟',['Je regarde les horaires du train.','Je suis les horaires du train.','J’ai les horaires être train.'],0]
];let answers=Array(Q.length).fill(null),done=false;const form=document.getElementById('form');form.innerHTML=Q.map((q,i)=>`<article class="q" data-q="${i}"><div class="qhead"><span class="tag">السؤال ${i+1}</span><span class="tag">${q[0]}</span></div><div class="text">${q[1]}</div><div class="opts">${q[2].map((o,j)=>`<button type="button" class="opt" data-q="${i}" data-o="${j}"><span class="letter">${String.fromCharCode(65+j)}</span><span>${o}</span></button>`).join('')}</div></article>`).join('');form.addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b||done)return;const i=Number(b.dataset.q),o=Number(b.dataset.o);answers[i]=o;b.closest('.q').querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});document.getElementById('submit').onclick=()=>{if(done)return;const missing=answers.map((x,i)=>x===null?i+1:null).filter(Boolean);const msg=document.getElementById('message');if(missing.length){msg.className='result show warning';msg.innerHTML='<strong>أكمل الجولة أولًا.</strong><br>تبقى '+missing.length+' أسئلة دون إجابة.';msg.scrollIntoView({behavior:'smooth',block:'center'});return}done=true;let score=0;const review=Q.map((q,i)=>{const ok=answers[i]===q[3];if(ok)score++;return ok});const pct=Math.round(score/Q.length*100);document.querySelectorAll('.opt').forEach(b=>b.disabled=true);document.getElementById('submit').disabled=true;const r=document.getElementById('result');r.className='result show';r.innerHTML='<div>🏆 نتيجة الجولة</div><div class="score">'+score+' / '+Q.length+'</div><p>النسبة: <b>'+pct+'%</b></p><p>'+(pct>=90?'ممتاز — أنت جاهز للتقييم الرسمي.':pct>=70?'جيد جدًا — ثبّت بعض المفردات ثم انتقل للتقييم.':'راجع المفردات والقاعدة ثم أعد الجولة.')+'</p><div class="review">'+review.map((ok,i)=>'<div class="'+(ok?'right':'wrong')+'">'+(ok?'✅':'❌')+' السؤال '+(i+1)+' — '+(ok?'صحيح':'الإجابة الصحيحة: '+Q[i][2][Q[i][3]])+'</div>').join('')+'</div>';localStorage.setItem('hm_interactive_grade8_u3_l2',JSON.stringify({score,total:Q.length,pct,at:new Date().toISOString()}));r.scrollIntoView({behavior:'smooth',block:'start'})};</script></body></html>
