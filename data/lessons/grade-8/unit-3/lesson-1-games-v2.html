<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Game Studio · Unité 3</title><style>:root{--nav:#14264a;--blue:#2563eb;--pink:#e92d83;--purple:#7c3aed;--green:#20a45a;--red:#c43b3b;--line:#dfe6f0;--soft:#f7f9fd}*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:var(--nav);font-family:Arial,Cairo,sans-serif}.w{max-width:980px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#173a82,#7c3aed,#2563eb);color:#fff;border-radius:28px;padding:24px;box-shadow:0 18px 45px #203c7a22}.hero h1{margin:6px 0;font-size:clamp(28px,6vw,44px)}.hero p{line-height:1.8;margin:7px 0}.tag{display:inline-block;background:#eef3ff;color:#315aa4;border-radius:999px;padding:7px 11px;font-weight:900}.hero .tag{background:#ffffff20;color:#fff}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.mode{border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px;text-align:right;cursor:pointer;font-weight:900;color:var(--nav)}.mode.active{background:var(--pink);border-color:var(--pink);color:#fff}.mode small{display:block;font-weight:700;opacity:.75;margin-top:5px;line-height:1.5}.game{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 10px 28px #14264a0d}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{background:#eef3ff;color:#315aa4;border-radius:12px;padding:9px 12px;font-weight:900}.progress{height:9px;background:#e9eef7;border-radius:99px;overflow:hidden;margin:14px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:99px}.q{font-size:clamp(21px,4vw,30px);font-weight:900;line-height:1.7;margin:18px 0}.opts{display:grid;gap:10px}.opt{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px;text-align:right;font-size:17px;font-weight:900;cursor:pointer}.opt.correct{border-color:var(--green);background:#effaf3}.opt.wrong{border-color:var(--red);background:#fff3f3}.fb{min-height:25px;margin-top:13px;font-weight:900;line-height:1.7}.ok{color:#159447}.bad{color:var(--red)}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:14px}.btn{border:0;border-radius:13px;padding:12px 17px;background:#eef3ff;color:#315aa4;font-weight:900;cursor:pointer}.primary{background:var(--pink);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.rule{margin-top:13px;padding:14px;border-radius:15px;background:#fff8e8;color:#795d13;line-height:1.8}.result{text-align:center;padding:25px}.result strong{font-size:60px}@media(max-width:700px){.modes{grid-template-columns:1fr 1fr}}@media(max-width:480px){.modes{grid-template-columns:1fr}.w{padding:11px}.game{padding:15px}.actions{display:grid}.actions .btn{width:100%}}</style></head><body><main class="w"><section class="hero"><span class="tag">🎮 HM Game Studio · Unité 3 · Leçon 1</span><h1>Le voyage</h1><p>مركز ألعاب احترافي لمفردات وسائل النقل والأماكن وقاعدة <b>prendre / aller</b>.</p><p>6 أنماط × 10 أسئلة = <b>60 تحديًا</b>. كل سؤال يحدد المطلوب بوضوح، ولا توجد إجابات صحيحة متعارضة.</p></section><div class="modes" id="modes"></div><section class="game" id="game"></section></main><script>
const modes=[{name:'🧠 معنى سريع',desc:'ترجمة المفردة',kind:'meaning'},{name:'🚆 وسيلة أم مكان؟',desc:'تصنيف المفردات',kind:'classify'},{name:'✍️ أكمل الجملة',desc:'prendre / aller',kind:'fill'},{name:'📍 اختر الوجهة',desc:'à la / au / à l\'',kind:'place'},{name:'🔎 Error Detective',desc:'جملة خاطئة واحدة فقط',kind:'error'},{name:'⚡ تحدي السرعة',desc:'اختيار سريع',kind:'speed'}];
const words=[['le bus','الحافلة'],['le train','القطار'],["l'avion",'الطائرة'],['la voiture','السيارة'],['le métro','مترو الأنفاق'],['le taxi','سيارة أجرة'],['la gare','محطة القطار'],["l'aéroport",'المطار'],['un guichet','شباك التذاكر'],['une plage','شاطئ']];
const classify=[['le bus','وسيلة نقل'],['le train','وسيلة نقل'],["l'avion",'وسيلة نقل'],['le taxi','وسيلة نقل'],['la gare','مكان'],['un guichet','مكان'],['une plage','مكان'],['un zoo','مكان'],['une pharmacie','مكان'],['une ville','مكان']];
const fill=[['Je ___ le bus.','prends',['prends','vais','allez','vont']],['Nous ___ le train.','prenons',['prenons','prend','allez','vont']],['Ils ___ à la gare.','vont',['vont','vas','allez','prennent']],['Elle ___ au stade.','va',['va','vont','vas','prenez']],['Tu ___ un taxi.','prends',['prends','prend','allons','vont']],['Nous ___ à la plage.','allons',['allons','prenons','allez','vont']],['Je ___ à l\'aéroport.','vais',['vais','prends','vas','allons']],['Vous ___ le métro.','prenez',['prenez','prends','allez','vont']],['Ils ___ au zoo.','vont',['vont','va','vas','prenons']],['Je ___ à la pharmacie.','vais',['vais','prends','va','allez']]];
const places=[['gare','à la',['à la','au','aux',"à l'"]],['zoo','au',['au','à la','aux',"à l'"]],["aéroport","à l'",["à l'",'au','à la','aux']],['pharmacie','à la',['à la','au','aux',"à l'"]],['stade','au',['au','à la','aux',"à l'"]],['plage','à la',['à la','au','aux',"à l'"]],['club','au',['au','à la','aux',"à l'"]],['ville','à la',['à la','au','aux',"à l'"]],['gare','à la',['à la','au','aux',"à l'"]],['zoo','au',['au','à la','aux',"à l'"]]];
const errors=[['اختر الجملة الخاطئة.',['Je prends le train.','Je vais le train.','Nous prenons le bus.','Je vais à la gare.'],1],['اختر الجملة الخاطئة.',['Je vais à la plage.','Nous allons au zoo.','Elle va à la pharmacie.','Je prends à la gare.'],3],['اختر الجملة الخاطئة.',['Tu prends un taxi.','Ils vont au stade.','Nous allons à la gare.','Je vais le métro.'],3],['اختر الجملة الخاطئة.',["Je prends l'avion.","Je vais à l'aéroport.",'Nous prenons le train.',"Je vais l'avion."],3],['اختر الجملة الخاطئة.',['Il va au club.','Elle va à la pharmacie.','Nous allons à la plage.','Ils prennent à la gare.'],3],['اختر الجملة الخاطئة.',['Tu prends le bus.','Vous prenez le métro.','Ils vont au zoo.','Vous allez le taxi.'],3],['اختر الجملة الخاطئة.',['Je vais au stade.','Je prends un taxi.','Nous allons à la ville.','Nous prenons à la plage.'],3],['اختر الجملة الخاطئة.',['Ils vont à la gare.','Elle prend le train.',"Je vais à l'aéroport.",'Je prends à la pharmacie.'],3],['اختر الجملة الخاطئة.',['Nous prenons le bus.','Tu vas au club.','Je vais au zoo.','Ils vont le train.'],3],['اختر الجملة الخاطئة.',['Je prends le métro.','Elle va à la gare.','Nous allons au stade.','Je vais le bus.'],3]];
const speed=[['أي فعل مع وسيلة النقل؟','prendre',['prendre','aller','être','avoir']],['أي فعل مع الوجهة؟','aller',['avoir','aller','être','prendre']],['«le train» يعني؟','القطار',['القطار','المطار','الشاطئ','النادي']],['«un guichet» يعني؟','شباك التذاكر',['شباك التذاكر','مدينة','قطار','صيدلية']],['«une plage» يعني؟','شاطئ',['شاطئ','محطة','مطار','استاد']],['«un zoo» يعني؟','حديقة حيوان',['حديقة حيوان','نادي','بلد','تذكرة']],['مع gare نستخدم؟','à la',['à la','au','aux',"à l'"]],['مع zoo نستخدم؟','au',['au','à la','aux',"à l'"]],["مع aéroport نستخدم؟","à l'",["à l'",'au','à la','aux']],['nous + prendre = ؟','prenons',['prenons','prend','prenez','prennent']]];
let mode=0,round=[],pos=0,score=0,done=false;const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function build(kind){if(kind==='meaning')return words.map(x=>({q:'ما معنى «'+x[0]+'»؟',a:x[1],o:[x[1],...shuffle(words.filter(y=>y[1]!==x[1]).map(y=>y[1])).slice(0,3)],why:x[0]+' = '+x[1]+'.'}));if(kind==='classify')return classify.map(x=>({q:'صنّف «'+x[0]+'»: هل هي وسيلة نقل أم مكان؟',a:x[1],o:['وسيلة نقل','مكان'],why:x[0]+' = '+x[1]+'.'}));if(kind==='fill')return fill.map(x=>({q:x[0],a:x[1],o:x[2],why:/^(prend|prenons|prenez)$/.test(x[1])?'وسيلة نقل → prendre.':'وجهة/مكان → aller.'}));if(kind==='place')return places.map(x=>({q:'أكمل: Je vais ___ '+x[0]+'.',a:x[1],o:x[2],why:x[0]+' يحتاج '+x[1]+'.'}));if(kind==='error')return errors.map(x=>({q:x[0],a:x[2][x[2]],o:x[1],why:'هذه هي الجملة الوحيدة الخاطئة في هذا السؤال.'}));return speed.map(x=>({q:x[0],a:x[1],o:x[2],why:'إجابة مباشرة من مفردات وقاعدة الدرس.'}))}
function renderModes(){document.getElementById('modes').innerHTML=modes.map((m,i)=>'<button class="mode '+(i===mode?'active':'')+'" data-m="'+i+'">'+m.name+'<small>'+m.desc+'</small></button>').join('');document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=+b.dataset.m;start()})}
function start(){renderModes();round=shuffle(build(modes[mode].kind)).slice(0,10);pos=0;score=0;done=false;renderQ()}
function renderQ(){const x=round[pos],opts=shuffle(x.o);$('#game').innerHTML='<div class="topline"><span class="pill">'+modes[mode].name+' · السؤال '+(pos+1)+'/10</span><span class="pill">⭐ '+score+' / 100</span></div><div class="progress"><span style="width:'+((pos+1)*10)+'%"></span></div><div class="q">'+esc(x.q)+'</div><div class="opts">'+opts.map(o=>'<button class="opt" data-v="'+encodeURIComponent(o)+'">'+esc(o)+'</button>').join('')+'</div><div id="fb" class="fb"></div><div class="actions"><button id="next" class="btn primary" disabled>'+(pos===9?'إنهاء الجولة ✓':'السؤال التالي ←')+'</button><button id="restart" class="btn">🔄 جولة جديدة</button></div><div class="rule"><b>طريقة الحل:</b> اقرأ المطلوب أولًا، ثم اختر إجابة واحدة فقط. في <b>Error Detective</b> توجد جملة خاطئة واحدة فقط، وقد كُتب المطلوب صراحة.</div>';document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b,x));$('#next').onclick=()=>{if(pos<9){pos++;done=false;renderQ()}else{result()}};$('#restart').onclick=start}
function answer(b,x){if(done)return;done=true;const ok=decodeURIComponent(b.dataset.v)===x.a;document.querySelectorAll('.opt').forEach(z=>{z.disabled=true;if(z.textContent===x.a)z.classList.add('correct');else if(z===b)z.classList.add('wrong')});const fb=$('#fb');fb.className='fb '+(ok?'ok':'bad');fb.textContent=ok?'✓ صحيح — '+x.why:'✗ ليست الإجابة المطلوبة. الإجابة الصحيحة: '+x.a+' — '+x.why;if(ok)score+=10;$('.pill:nth-child(2)').textContent='⭐ '+score+' / 100';$('#next').disabled=false}
function result(){$('#game').innerHTML='<div class="result"><span class="tag">نتيجة الجولة</span><h2>🎉 أحسنت!</h2><strong>'+score+'</strong><p>من 100 نقطة · النمط: '+modes[mode].name+'</p><button class="btn primary" onclick="start()">🔄 جولة جديدة</button></div>';done=true}start();</script></body></html>
