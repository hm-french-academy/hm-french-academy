<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HM Game Studio · Unité 3 · Leçon 1</title>
<style>
:root{--nav:#17284b;--blue:#2563eb;--pink:#e62982;--purple:#7041e8;--green:#159447;--red:#c43b3b;--line:#dfe6f0;--soft:#eef4ff;--bg:#f3f6fc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef3fb,#f7f9fd);color:var(--nav);font-family:Arial,"Noto Sans Arabic",sans-serif}.wrap{max-width:980px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#173b82,#7041e8 55%,#2563eb);color:#fff;border-radius:28px;padding:24px;box-shadow:0 18px 45px #203c7a22}.eyebrow{display:inline-block;background:#ffffff1c;border:1px solid #ffffff2c;padding:7px 11px;border-radius:999px;font-weight:900}.hero h1{margin:10px 0 4px;font-size:clamp(29px,6vw,46px)}.hero p{line-height:1.85;margin:6px 0}.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.stat{background:#ffffff16;border:1px solid #ffffff2c;border-radius:15px;padding:10px}.stat b{display:block;font-size:20px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.mode{border:1px solid var(--line);background:#fff;border-radius:17px;padding:13px;text-align:right;cursor:pointer;font-weight:900;color:var(--nav);box-shadow:0 5px 15px #17284b0a}.mode.active{background:var(--pink);border-color:var(--pink);color:#fff}.mode small{display:block;font-weight:700;opacity:.75;margin-top:4px;line-height:1.5}.mode.active small{opacity:.9}.game{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 10px 28px #17284b0d}.topline{display:flex;justify-content:space-between;gap:8px;align-items:center}.pill{background:var(--soft);color:#315a93;border-radius:12px;padding:9px 12px;font-weight:900}.progress{height:9px;background:#e9eef7;border-radius:99px;overflow:hidden;margin:14px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:99px;transition:.25s}.mode-help{padding:12px 14px;border-radius:15px;background:#f7f9fd;color:#5c6b82;line-height:1.8;margin-bottom:13px}.q{font-size:clamp(22px,4vw,30px);font-weight:900;line-height:1.7;margin:16px 0}.q small{display:block;font-size:14px;color:#7a879a;margin-bottom:6px}.opts{display:grid;gap:10px}.opt{width:100%;border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px;text-align:right;font-size:17px;font-weight:900;cursor:pointer;color:var(--nav);transition:.15s}.opt:hover:not(:disabled){border-color:#9db5e9;transform:translateY(-1px)}.opt.correct{border-color:#45aa73;background:#effaf3}.opt.wrong{border-color:#d66b6b;background:#fff2f2}.opt:disabled{cursor:default}.fb{min-height:34px;margin-top:13px;font-weight:900;line-height:1.8}.ok{color:var(--green)}.bad{color:var(--red)}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:14px}.btn{border:0;border-radius:13px;padding:12px 17px;background:#eef3ff;color:#315a93;font-weight:900;cursor:pointer}.primary{background:var(--pink);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.rule{margin-top:13px;padding:13px 15px;border-radius:15px;background:#fff8e8;color:#745815;line-height:1.8}.result{text-align:center;padding:12px 4px}.score-ring{width:116px;height:116px;border-radius:50%;display:grid;place-items:center;margin:10px auto;background:linear-gradient(135deg,#e62982,#7041e8);color:#fff}.score-ring strong{font-size:32px}.result h2{margin:8px 0}.result p{line-height:1.8;color:#5d6b82}.result .actions{justify-content:center}.result .btn{min-width:150px}@media(max-width:720px){.modes{grid-template-columns:1fr 1fr}}@media(max-width:480px){.wrap{padding:10px}.hero,.game{border-radius:20px;padding:15px}.hero-stats{grid-template-columns:1fr}.modes{grid-template-columns:1fr}.actions{display:grid}.actions .btn{width:100%}.q{font-size:21px}}
</style>
</head>
<body><main class="wrap">
<section class="hero"><span class="eyebrow">🎮 HM Game Studio · Unité 3 · Leçon 1</span><h1>Le voyage</h1><p>تدريب تفاعلي على مفردات السفر والأماكن وقاعدتي <b dir="ltr">prendre / aller</b>.</p><p><b>6 أنماط × 10 أسئلة = 60 تحديًا</b>، مع سؤال واضح وإجابة واحدة صحيحة في كل تحدٍّ.</p><div class="hero-stats"><div class="stat"><b>60</b><span>تحديًا</span></div><div class="stat"><b>6</b><span>أنماط تدريب</span></div><div class="stat"><b>1</b><span>إجابة صحيحة فقط</span></div></div></section>
<div class="modes" id="modes"></div><section class="game" id="game"></section>
</main>
<script>
const modes=[
{name:'🧠 معنى سريع',desc:'ما معنى المفردة؟',kind:'meaning',help:'اقرأ المفردة الفرنسية ثم اختر معناها العربي.'},
{name:'🚆 وسيلة أم مكان؟',desc:'تصنيف واضح',kind:'classify',help:'صنّف الكلمة: هل هي وسيلة نقل أم مكان؟'},
{name:'✍️ أكمل الجملة',desc:'prendre / aller',kind:'fill',help:'اقرأ الجملة كاملة وحدد الفعل الذي يناسب وظيفتها.'},
{name:'📍 أداة المكان',desc:'à la / au / à l\' / aux',kind:'place',help:'حدّد جنس وعدد المكان ثم اختر أداة المكان المناسبة.'},
{name:'🔎 Error Detective',desc:'خطأ واحد فقط',kind:'error',help:'المطلوب دائمًا: اختر الجملة الخاطئة. توجد جملة خاطئة واحدة فقط في كل سؤال.'},
{name:'⚡ تحدي سريع',desc:'مراجعة شاملة',kind:'speed',help:'أسئلة قصيرة تجمع المفردات والتصريف والقاعدة.'}
];
const words=[['le bus','الحافلة'],['le train','القطار'],["l'avion",'الطائرة'],['la voiture','السيارة'],['le métro','مترو الأنفاق'],['le taxi','سيارة أجرة'],['la gare','محطة القطار'],["l'aéroport",'المطار'],['la station','المحطة'],["l'arrêt",'موقف/محطة توقف'],['le billet','تذكرة'],['le voyage','الرحلة/السفر'],['un guichet','شباك التذاكر'],['une plage','شاطئ'],['un zoo','حديقة حيوان'],['un cirque','سيرك'],['un stade','استاد'],['un club','نادي'],['une pharmacie','صيدلية'],['un pays','بلد'],['une ville','مدينة'],['un lieu','مكان']];
const classify=[['le bus','وسيلة نقل'],['le train','وسيلة نقل'],["l'avion",'وسيلة نقل'],['la voiture','وسيلة نقل'],['le métro','وسيلة نقل'],['le taxi','وسيلة نقل'],['la gare','مكان'],['un guichet','مكان'],['une plage','مكان'],['un zoo','مكان']];
const fill=[
['Je ___ le bus.','prends',['prends','vais','va','allons'],'le bus وسيلة نقل → prendre.'],
['Nous ___ le train.','prenons',['prenons','prend','allez','vont'],'le train وسيلة نقل → prendre.'],
['Ils ___ à la gare.','vont',['vont','vas','allez','prennent'],'à la gare وجهة → aller.'],
['Elle ___ au stade.','va',['va','vont','vas','prenez'],'au stade وجهة → aller.'],
['Tu ___ un taxi.','prends',['prends','prend','allons','vont'],'un taxi وسيلة نقل → prendre.'],
['Nous ___ à la plage.','allons',['allons','prenons','allez','vont'],'à la plage وجهة → aller.'],
["Je ___ à l'aéroport.",'vais',['vais','prends','vas','allons'],"à l'aéroport وجهة → aller."],
['Vous ___ le métro.','prenez',['prenez','prends','allez','vont'],'le métro وسيلة نقل → prendre.'],
['Ils ___ au zoo.','vont',['vont','va','vas','prenons'],'au zoo وجهة → aller.'],
['Je ___ à la pharmacie.','vais',['vais','prends','va','allez'],'à la pharmacie وجهة → aller.']];
const places=[
['gare','à la',['à la','au','aux',"à l'"],'gare مؤنث مفرد.'],['zoo','au',['au','à la','aux',"à l'"],'zoo مذكر مفرد.'],["aéroport","à l'",["à l'",'au','à la','aux'],"aéroport يبدأ بحرف متحرك."],['pharmacie','à la',['à la','au','aux',"à l'"],'pharmacie مؤنث مفرد.'],['stade','au',['au','à la','aux',"à l'"],'stade مذكر مفرد.'],['plage','à la',['à la','au','aux',"à l'"],'plage مؤنث مفرد.'],['club','au',['au','à la','aux',"à l'"],'club مذكر مفرد.'],['ville','à la',['à la','au','aux',"à l'"],'ville مؤنث مفرد.'],['guichet','au',['au','à la','aux',"à l'"],'guichet مذكر مفرد.'],['cirque','au',['au','à la','aux',"à l'"],'cirque مذكر مفرد.']];
const errors=[
['اختر الجملة الخاطئة.',['Je prends le train.','Je vais le train.','Nous prenons le bus.','Je vais à la gare.'],1,'وسيلة النقل تحتاج prendre؛ لذلك Je vais le train خاطئة.'],
['اختر الجملة الخاطئة.',['Je vais à la plage.','Nous allons au zoo.','Elle va à la pharmacie.','Je prends à la gare.'],3,'gare مكان، لذلك نستخدم aller معها لا prendre.'],
['اختر الجملة الخاطئة.',['Tu prends un taxi.','Ils vont au stade.','Nous allons à la gare.','Je vais le métro.'],3,'le métro وسيلة نقل؛ الصواب Je prends le métro.'],
['اختر الجملة الخاطئة.',["Je prends l'avion.","Je vais à l'aéroport.",'Nous prenons le train.',"Je vais l'avion."],3,"l'avion وسيلة نقل؛ الصواب Je prends l'avion."],
['اختر الجملة الخاطئة.',['Il va au club.','Elle va à la pharmacie.','Nous allons à la plage.','Ils prennent à la gare.'],3,'la gare مكان؛ الصواب Ils vont à la gare.'],
['اختر الجملة الخاطئة.',['Tu prends le bus.','Vous prenez le métro.','Ils vont au zoo.','Vous allez le taxi.'],3,'le taxi وسيلة نقل؛ الصواب Vous prenez le taxi.'],
['اختر الجملة الخاطئة.',['Je vais au stade.','Je prends un taxi.','Nous allons à la ville.','Nous prenons à la plage.'],3,'la plage مكان؛ الصواب Nous allons à la plage.'],
['اختر الجملة الخاطئة.',['Ils vont à la gare.','Elle prend le train.',"Je vais à l'aéroport.",'Je prends à la pharmacie.'],3,'la pharmacie مكان؛ الصواب Je vais à la pharmacie.'],
['اختر الجملة الخاطئة.',['Nous prenons le bus.','Tu vas au club.','Je vais au zoo.','Ils vont le train.'],3,'le train وسيلة نقل؛ الصواب Ils prennent le train.'],
['اختر الجملة الخاطئة.',['Je prends le métro.','Elle va à la gare.','Nous allons au stade.','Je vais le bus.'],3,'le bus وسيلة نقل؛ الصواب Je prends le bus.']];
const speed=[
['أي فعل نستخدم مع وسيلة النقل؟','prendre',['prendre','aller','être','avoir'],'وسيلة النقل → prendre.'],['أي فعل نستخدم مع الوجهة؟','aller',['avoir','aller','être','prendre'],'الوجهة/المكان → aller.'],['«le train» يعني؟','القطار',['القطار','المطار','الشاطئ','النادي'],'train = القطار.'],['«un guichet» يعني؟','شباك التذاكر',['شباك التذاكر','مدينة','قطار','صيدلية'],'guichet = شباك التذاكر.'],['«une plage» يعني؟','شاطئ',['شاطئ','محطة','مطار','استاد'],'plage = شاطئ.'],['«un zoo» يعني؟','حديقة حيوان',['حديقة حيوان','نادي','بلد','تذكرة'],'zoo = حديقة حيوان.'],['مع gare نستخدم؟','à la',['à la','au','aux',"à l'"],'gare مؤنث مفرد → à la.'],['مع zoo نستخدم؟','au',['au','à la','aux',"à l'"],'zoo مذكر مفرد → au.'],["مع aéroport نستخدم؟","à l'",["à l'",'au','à la','aux'],"aéroport يبدأ بحرف متحرك → à l'."],['nous + prendre = ؟','prenons',['prenons','prend','prenez','prennent'],'nous + prendre = prenons.']];
let mode=0,round=[],pos=0,score=0,answered=false;
const $=s=>document.querySelector(s);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function build(kind){
if(kind==='meaning')return words.map((x,i)=>({q:'ما معنى «'+x[0]+'»؟',a:x[1],o:[x[1],...shuffle(words.filter(y=>y[1]!==x[1]).map(y=>y[1])).slice(0,3)],why:x[0]+' = '+x[1]+'.'}));
if(kind==='classify')return classify.map(x=>({q:'صنّف «'+x[0]+'»: هل هي وسيلة نقل أم مكان؟',a:x[1],o:['وسيلة نقل','مكان'],why:x[0]+' = '+x[1]+'.'}));
if(kind==='fill')return fill.map(x=>({q:x[0],a:x[1],o:x[2],why:x[3]}));
if(kind==='place')return places.map(x=>({q:'أكمل: Je vais ___ '+x[0]+'.',a:x[1],o:x[2],why:x[3]}));
if(kind==='error')return errors.map(x=>({q:x[0],a:x[1][x[2]],o:x[1],why:x[3]}));
return speed.map(x=>({q:x[0],a:x[1],o:x[2],why:x[3]}));}
function renderModes(){document.getElementById('modes').innerHTML=modes.map((m,i)=>'<button class="mode '+(i===mode?'active':'')+'" data-mode="'+i+'">'+m.name+'<small>'+m.desc+'</small></button>').join('');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=+b.dataset.mode;start()})}
function start(){renderModes();round=shuffle(build(modes[mode].kind)).slice(0,10);pos=0;score=0;answered=false;renderQ()}
function renderQ(){const x=round[pos],opts=shuffle(x.o);$('#game').innerHTML='<div class="topline"><span class="pill">'+modes[mode].name+' · السؤال '+(pos+1)+' / 10</span><span class="pill">⭐ '+score+' / 100</span></div><div class="progress"><span style="width:'+((pos+1)*10)+'%"></span></div><div class="mode-help"><b>طريقة الحل:</b> '+modes[mode].help+'</div><div class="q">'+esc(x.q)+'</div><div class="opts">'+opts.map((o,i)=>'<button class="opt" data-value="'+encodeURIComponent(o)+'">'+esc(o)+'</button>').join('')+'</div><div id="fb" class="fb"></div><div class="actions"><button id="next" class="btn primary" disabled>'+(pos===9?'إنهاء الجولة ✓':'السؤال التالي ←')+'</button><button id="restart" class="btn">🔄 جولة جديدة</button></div><div class="rule"><b>مبدأ HM Academy:</b> السؤال يحدد المطلوب أولًا، ثم تُختار الإجابة وفق قاعدة الدرس. في <b>Error Detective</b> توجد جملة خاطئة واحدة فقط.</div>';document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b,x));$('#next').onclick=()=>{if(!answered)return;if(pos<9){pos++;answered=false;renderQ()}else{showResult()}};$('#restart').onclick=start}
function answer(btn,x){if(answered)return;answered=true;const chosen=decodeURIComponent(btn.dataset.value),ok=chosen===x.a;document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const v=decodeURIComponent(b.dataset.value);if(v===x.a)b.classList.add('correct');else if(b===btn)b.classList.add('wrong')});const fb=$('#fb');fb.className='fb '+(ok?'ok':'bad');fb.textContent=ok?'✓ صحيح — '+x.why:'✗ ليست الإجابة المطلوبة. الإجابة الصحيحة: '+x.a+' — '+x.why;if(ok)score+=10;document.querySelector('.topline .pill:last-child').textContent='⭐ '+score+' / 100';$('#next').disabled=false}
function showResult(){$('#game').innerHTML='<div class="result"><div class="score-ring"><strong>'+score+'%</strong></div><h2>'+ (score===100?'🏆 ممتاز جدًا!':score>=80?'🌟 أداء قوي!':score>=60?'👍 جيد، واصل التدريب.':'📘 راجع المرجع ثم أعد الجولة.') +'</h2><p>أنهيت نمط <b>'+modes[mode].name+'</b> بنتيجة <b>'+score+'/100</b>. أعد الجولة لتثبيت المهارة، أو انتقل إلى نمط آخر.</p><div class="actions"><button class="btn primary" id="again">🔄 إعادة الجولة</button><button class="btn" id="modesBtn">🎮 اختيار نمط آخر</button></div></div>';$('#again').onclick=start;$('#modesBtn').onclick=()=>{window.scrollTo({top:0,behavior:'smooth'});document.getElementById('modes').scrollIntoView({behavior:'smooth'})}}
start();
</script>
</body></html>
