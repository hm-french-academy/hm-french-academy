<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | التقييم التفاعلي — الدرس الثالث</title><style>body{margin:0;background:#f4f7fc;color:#14264a;font-family:Arial,Cairo,sans-serif}.wrap{max-width:900px;margin:auto;padding:22px 14px}.hero{background:linear-gradient(135deg,#5b2a86,#e62982);color:#fff;border-radius:28px;padding:26px}.back{display:inline-block;margin-bottom:12px;color:#2850a3;background:#fff;border-radius:12px;padding:9px 14px;text-decoration:none;font-weight:900}.card{background:#fff;border:1px solid #dfe6f0;border-radius:20px;padding:20px;margin:14px 0}.q{font-size:18px;font-weight:900;margin-bottom:14px}.opt{display:block;width:100%;border:1px solid #dbe4f2;background:#f8faff;border-radius:13px;padding:13px;margin:8px 0;text-align:right;cursor:pointer;font-weight:700}.opt.selected{border-color:#2563eb;background:#edf4ff}.finish{width:100%;border:0;border-radius:14px;padding:15px;background:#2563eb;color:#fff;font-weight:900;cursor:pointer}.result{display:none;background:#fff;border-radius:18px;padding:20px;margin-top:18px}</style></head><body><main class="wrap"><a class="back" href="../../../../lesson.html?id=grade8-u3-l3">← العودة إلى الدرس</a><section class="hero"><h1>التقييم التفاعلي</h1><p>تدريب فوري على أدوات الإشارة وتصريف prendre و aller و voyager.</p></section><div id="quiz"></div><button class="finish" id="finish">إنهاء التقييم</button><section class="result" id="result"></section></main><script>const qs=[['اختر: ___ train',['ce','cette','ces'],0],['اختر: ___ avion',['cet','ce','cette'],0],['اختر: ___ valise',['cette','ce','ces'],0],['اختر: ___ billets',['ces','ce','cet'],0],['Nous ___ le train.',['prenons','prenez','prennent'],0],['Vous ___ à Paris.',['allez','allons','vont'],0],['Ils ___ en France.',['voyagent','voyagez','voyageons'],0],['Je ___ ce billet.',['prends','prend','prenons'],0],['Nous ___ en été.',['voyageons','voyagez','voyagent'],0],['Ils ___ leurs billets.',['prennent','prenons','prenez'],0],['Elle ___ en France.',['voyage','voyages','voyagent'],0],['Nous ___ à la gare.',['allons','allez','vont'],0]];const root=document.getElementById('quiz');qs.forEach((q,i)=>{const c=document.createElement('section');c.className='card';c.innerHTML='<div class="q">'+(i+1)+'. '+q[0]+'</div>'+q[1].map((o,j)=>'<button type="button" class="opt" data-q="'+i+'" data-a="'+j+'">'+String.fromCharCode(65+j)+'. '+o+'</button>').join('');root.appendChild(c)});document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.opt[data-q="'+b.dataset.q+'"]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});document.getElementById('finish').onclick=()=>{let score=0,missing=[];qs.forEach((q,i)=>{const b=document.querySelector('.opt[data-q="'+i+'"].selected');if(!b)missing.push(i+1);else if(+b.dataset.a===q[2])score++});const r=document.getElementById('result');r.style.display='block';r.innerHTML=missing.length?'<h2>أكمل التقييم</h2><p>الأسئلة غير المجابة: '+missing.join('، ')+'</p>':'<h2>نتيجتك: '+score+' / '+qs.length+'</h2><p>'+(score>=10?'ممتاز، استمر!':'راجع القاعدة والتصريف ثم أعد المحاولة.')+'</p>';r.scrollIntoView({behavior:'smooth'})}</script></body></html>
