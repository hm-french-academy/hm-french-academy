<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | التقييم التفاعلي — الدرس الثالث</title><style>body{margin:0;background:#f4f7fc;color:#14264a;font-family:Arial,Cairo,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 14px}.hero{background:linear-gradient(135deg,#5b2a86,#e62982);color:#fff;border-radius:28px;padding:26px}.card{background:#fff;border:1px solid #dfe6f0;border-radius:20px;padding:20px;margin:14px 0}.q{font-size:18px;font-weight:900;margin-bottom:14px}.opt{display:block;width:100%;border:1px solid #dbe4f2;background:#f8faff;border-radius:13px;padding:13px;margin:8px 0;text-align:right;cursor:pointer;font-weight:700}.opt.correct{background:#e9f8f1;border-color:#2fa77b}.opt.wrong{background:#fff0f0;border-color:#d95353}.feedback{margin-top:10px;font-weight:800}.btn{width:100%;border:0;border-radius:14px;padding:15px;background:#2563eb;color:#fff;font-weight:900;cursor:pointer}.back{display:inline-block;margin-bottom:12px;color:#2850a3;font-weight:900;text-decoration:none}</style></head><body><main class="wrap"><a class="back" href="lesson.html?id=grade8-u3-l3">← العودة إلى الدرس</a><section class="hero"><h1>التقييم التفاعلي</h1><p>تدريب فوري على ce / cet / cette / ces</p></section><div id="quiz"></div></main><script>const qs=[['اختر أداة الإشارة المناسبة: ___ train',['ce','cette','ces'],0],['اختر أداة الإشارة المناسبة: ___ avion',['cet','ce','cette'],0],['اختر أداة الإشارة المناسبة: ___ valise',['cette','ce','ces'],0],['اختر أداة الإشارة المناسبة: ___ billets',['ces','ce','cet'],0],['أي جملة صحيحة؟',['Cet avion est grand.','Cette avion est grand.','Ce avion est grand.'],0],['أي أداة تناسب اسمًا مذكرًا مفردًا يبدأ بصوت ساكن؟',['ce','cet','ces'],0],['أي أداة تستخدم مع الجمع؟',['cette','ces','cet'],1],['أكمل: ___ valise est lourde.',['Cette','Ce','Cet'],0]];const root=document.getElementById('quiz');qs.forEach((q,i)=>{const c=document.createElement('section');c.className='card';c.innerHTML='<div class="q">'+(i+1)+'. '+q[0]+'</div>'+q[1].map((o,j)=>'<button class="opt" data-q="'+i+'" data-a="'+j+'">'+o+'</button>').join('')+'<div class="feedback" id="f'+i+'"></div>';root.appendChild(c)});document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const q=qs[+b.dataset.q],f=document.getElementById('f'+b.dataset.q);document.querySelectorAll('.opt[data-q="'+b.dataset.q+'"]').forEach(x=>x.classList.remove('correct','wrong'));if(+b.dataset.a===q[2]){b.classList.add('correct');f.textContent='✓ إجابة صحيحة';f.style.color='#23805f'}else{b.classList.add('wrong');f.textContent='راجع جنس الاسم وعدده وبدايته الصوتية ثم حاول مرة أخرى.';f.style.color='#b33b3b'}});</script></body></html>
