<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy · التقييم التفاعلي · الدرس 2</title><style>body{font-family:Arial,Cairo,sans-serif;background:#f4f7fc;color:#14264a;margin:0}.wrap{max-width:850px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#173b82,#7041e8,#2563eb);color:white;padding:22px;border-radius:24px}.q{background:#fff;border:1px solid #dfe6f0;border-radius:18px;padding:16px;margin:12px 0}.opt{display:block;width:100%;text-align:right;background:#fff;border:1px solid #d7deea;border-radius:12px;padding:12px;margin:7px 0;cursor:pointer;font-weight:700}.opt.selected{border-color:#2563eb;background:#edf4ff}.feedback{font-weight:800;margin-top:8px}.submit{border:0;border-radius:13px;padding:13px 20px;background:#e62982;color:#fff;font-weight:900;cursor:pointer}.result{background:#fff;border-radius:18px;padding:16px;margin-top:14px;font-weight:900}</style><main class="wrap"><section class="hero"><div>⚡ HM Academy · Unité 3 · Leçon 2</div><h1>التقييم التفاعلي</h1><p>أسئلة مختلفة عن التقييم الرسمي، مع تغذية راجعة فورية بعد اختيار الإجابة.</p></section><div id="quiz"></div><button class="submit" id="submit">إنهاء التقييم</button><div class="result" id="result"></div></main><script>const qs=[['اختر الكلمة التي تعني «راكب».',['un passager','un pharmacien','un guichetier'],0],['أي كلمة تعني «سائحة»؟',['une valise','une touriste','une passagère'],1],['أكمل: J’ai une ... rouge.',['valise','horaires','touriste'],0],['أي كلمة تعني مواعيد الرحلات؟',['des horaires','un ticket','un passeport'],0],['اختر الجملة الصحيحة.',['Nous avons nos valises.','Nous sommes nos valises.','Nous êtes nos valises.'],0],['من يعمل في شباك التذاكر؟',['un touriste','un passager','un guichetier'],2],['أكمل: Elle ... son ticket.',['as','a','avons'],1],['أي كلمة تعني «صيدلي»؟',['un pharmacien','un passeport','un billet'],0],['اختر العبارة المناسبة للسفر.',['J’ai mon passeport.','Je suis mon passeport.','J’ai ma gare.'],0],['أكمل: Je regarde les ... du train.',['horaires','valises','passagères'],0],['أي جملة صحيحة؟',['Le touriste visite la ville.','Le touriste visites la ville.','Le touriste visiter la ville.'],0],['ما الذي يمكن أن تحمله أثناء السفر؟',['une valise','un pharmacien','un guichetier'],0]];let ans={};const box=document.getElementById('quiz');qs.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.innerHTML='<b>'+((i+1)+'. '+q[0])+'</b>'+q[1].map((o,j)=>'<button class="opt" data-i="'+i+'" data-j="'+j+'">'+o+'</button>').join('')+'<div class="feedback" id="f'+i+'"></div>';box.appendChild(d)});box.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;const i=+b.dataset.i,j=+b.dataset.j;ans[i]=j;document.querySelectorAll('[data-i="'+i+'"]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('f'+i).textContent='✓ تم اختيار إجابتك. أكمل بقية الأسئلة ثم اضغط إنهاء التقييم.'};document.getElementById('submit').onclick=()=>{let score=0;qs.forEach((q,i)=>{const f=document.getElementById('f'+i);if(ans[i]===q[2]){score++;f.textContent='✓ إجابة صحيحة';f.style.color='#16824a'}else{f.textContent='✗ تحتاج مراجعة هذا السؤال';f.style.color='#a33'}});document.getElementById('result').textContent='نتيجتك: '+score+' / '+qs.length+' — '+(score>=10?'ممتاز!':score>=7?'جيد جدًا، راجع الأخطاء ثم أعد المحاولة.':'راجع المفردات والقاعدة ثم حاول مرة أخرى.')}};</script></html>
