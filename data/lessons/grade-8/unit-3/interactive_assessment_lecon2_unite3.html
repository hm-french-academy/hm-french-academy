<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy · التقييم التفاعلي · الدرس الثاني</title><style>body{font-family:Arial,Cairo,sans-serif;background:#f4f7fc;color:#14264a;margin:0}.wrap{max-width:900px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#173b82,#7041e8,#2563eb);color:#fff;padding:22px;border-radius:24px}.q{background:#fff;border:1px solid #dfe6f0;border-radius:18px;padding:16px;margin:12px 0}.opt{display:block;width:100%;text-align:right;background:#fff;border:2px solid #d7deea;border-radius:12px;padding:12px;margin:7px 0;cursor:pointer;font-weight:700}.opt.selected{border-color:#2563eb;background:#edf4ff}.opt.correct{border-color:#20a45a;background:#effaf3}.opt.wrong{border-color:#d14b4b;background:#fff3f3}.feedback{font-weight:800;margin-top:8px;line-height:1.7}.submit{border:0;border-radius:13px;padding:13px 20px;background:#e62982;color:#fff;font-weight:900;cursor:pointer}.result{background:#fff;border-radius:18px;padding:16px;margin-top:14px;font-weight:900}.back{display:inline-block;margin-bottom:12px;padding:10px;background:#edf3ff;color:#2850a3;border-radius:11px;text-decoration:none;font-weight:900}</style><main class="wrap"><a class="back" href="../../../../lesson.html?id=grade8-u3-l2">← العودة إلى الدرس</a><section class="hero"><div>⚡ HM Academy · Unité 3 · Leçon 2</div><h1>التقييم التفاعلي</h1><p>12 مهمة متنوعة للتدريب. اختر إجابتك، وستظهر التغذية الراجعة بعد الاختيار، ثم راجع النتيجة في النهاية.</p></section><div id="quiz"></div><button class="submit" id="submit">إنهاء التقييم</button><div class="result" id="result"></div></main><script>const qs=[['اختر الكلمة التي تعني «راكب».',['un passager','un pharmacien','un guichetier'],0],['أي كلمة تعني «سائحة»؟',['une valise','une touriste','une passagère'],1],['أكمل: J’ai une ... rouge.',['valise','horaires','touriste'],0],['أي كلمة تعني «مواعيد الرحلات»؟',['un pharmacien','des horaires','un touriste'],1],['اختر الجملة الصحيحة.',['Nous avons nos valises.','Nous sommes nos valises.','Nous avons nos valise.'],0],['من يعمل في شباك التذاكر؟',['un touriste','un passager','un guichetier'],2],['أكمل: Elle ... son ticket.',['as','a','avons'],1],['أي كلمة تعني «صيدلي»؟',['un pharmacien','un passeport','un billet'],0],['اختر العبارة المناسبة لجواز السفر.',['J’ai mon passeport.','Je suis mon passeport.','J’ai ma gare.'],0],['أكمل: Je regarde les ... du train.',['horaires','valises','passagères'],0],['أي جملة صحيحة؟',['Le touriste visite la ville.','Le touriste visites la ville.','Le touriste visiter la ville.'],0],['أي جملة تستخدم avoir بشكل صحيح؟',['Vous avez vos billets.','Vous avons vos billets.','Vous êtes vos billets.'],0]];let ans={};const box=document.getElementById('quiz');qs.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.innerHTML='<b>'+((i+1)+'. '+q[0])+'</b>'+q[1].map((o,j)=>'<button class="opt" data-i="'+i+'" data-j="'+j+'">'+o+'</button>').join('')+'<div class="feedback" id="f'+i+'"></div>';box.appendChild(d)});box.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;const i=+b.dataset.i,j=+b.dataset.j;ans[i]=j;document.querySelectorAll('[data-i="'+i+'"]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('f'+i).textContent='✓ تم اختيار إجابتك. يمكنك تغييرها قبل إنهاء التقييم.'};document.getElementById('submit').onclick=()=>{let score=0;qs.forEach((q,i)=>{document.querySelectorAll('[data-i="'+i+'"]').forEach((b,j)=>{b.disabled=true;b.classList.remove('selected');if(j===q[2])b.classList.add('correct');else if(j===ans[i]&&ans[i]!==q[2])b.classList.add('wrong')});const f=document.getElementById('f'+i);if(ans[i]===q[2]){score++;f.textContent='✓ إجابة صحيحة.';f.style.color='#16824a'}else f.textContent='✗ راجع الإجابة الصحيحة الموضحة.'});document.getElementById('result').textContent='نتيجتك: '+score+' / '+qs.length+' — '+(score>=10?'ممتاز!':score>=7?'جيد جدًا، راجع أخطاءك.':'راجع الدرس ثم أعد المحاولة.');localStorage.setItem('hm_interactive_grade8_u3_l2',JSON.stringify({score,total:qs.length,at:new Date().toISOString()}))};</script></html>
