<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy · Évaluation interactive · Leçon 1</title><style>:root{--n:#17284b;--p:#e62982;--v:#7041e8;--l:#dfe6f0;--s:#eef4ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef3fb,#f8fafc);color:var(--n);font-family:Arial,"Noto Sans Arabic",sans-serif}.wrap{max-width:930px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#173b82,#7041e8 55%,#2563eb);color:#fff;border-radius:26px;padding:22px}.hero h1{margin:8px 0;font-size:clamp(28px,6vw,44px)}.hero p{line-height:1.9}.criteria,.prompt{border-radius:15px;padding:12px;line-height:1.9}.criteria{background:#ffffff18;border:1px solid #ffffff2b}.prompt{margin-top:12px;background:#f7f9fd;border:1px solid var(--l);color:#59687f}.bar{display:flex;justify-content:space-between;gap:8px;margin:13px 0 7px;flex-wrap:wrap}.pill{background:#fff;color:#315a93;border:1px solid var(--l);border-radius:12px;padding:9px 12px;font-weight:900}.progress{height:9px;background:#e8edf5;border-radius:99px;overflow:hidden;margin-bottom:13px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--v));transition:.25s}.card{background:#fff;border:1px solid var(--l);border-radius:24px;padding:21px;box-shadow:0 10px 28px #17284b0d}.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.cat{background:var(--s);color:#315a93;border-radius:999px;padding:7px 10px;font-weight:900}.q{font-size:clamp(22px,4vw,31px);font-weight:900;line-height:1.75;margin:18px 0}.opts{display:grid;gap:10px}.opt{width:100%;border:2px solid var(--l);background:#fff;border-radius:16px;padding:14px;text-align:right;font-size:17px;font-weight:900;color:var(--n);cursor:pointer;display:flex;gap:10px;align-items:center}.opt:disabled{cursor:default}.letter{display:grid;place-items:center;width:30px;height:30px;background:var(--s);border-radius:9px;color:#315a93;flex:none}.correct{border-color:#45aa73!important;background:#effaf3!important}.wrong{border-color:#d66b6b!important;background:#fff2f2!important}.fb{min-height:45px;margin-top:13px;padding:11px 13px;border-radius:14px;font-weight:900;line-height:1.8}.ok{background:#effaf3;color:#157b3e}.bad{background:#fff2f2;color:#a52b2b}.actions{display:flex;justify-content:space-between;gap:9px;margin-top:14px}.btn{border:0;border-radius:13px;padding:12px 17px;background:#edf3ff;color:#315a93;font-weight:900;cursor:pointer}.primary{background:var(--p);color:#fff}.btn:disabled{opacity:.45}.result{text-align:center;padding:20px}.ring{width:135px;height:135px;border-radius:50%;display:grid;place-items:center;margin:10px auto 14px;background:linear-gradient(135deg,var(--p),var(--v));color:#fff}.ring strong{font-size:35px}.result p{line-height:1.9;color:#5d6b82}.nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:13px}.nav a{text-decoration:none;background:#edf3ff;color:#315a93;border-radius:12px;padding:10px 13px;font-weight:900}@media(max-width:560px){.wrap{padding:10px}.hero,.card{padding:15px}.actions{display:grid}.actions .btn{width:100%}}</style></head><body><main class="wrap"><section class="hero"><div>🎯 HM ACADEMY · ÉVALUATION INTERACTIVE</div><h1>Leçon 1 · Le voyage</h1><p>40 سؤالًا بالضبط حول المفردات، <b dir="ltr">prendre / aller</b>، أدوات المكان والسياق.</p><div class="criteria"><b>قاعدة التقييم:</b> إجابة واحدة صحيحة لكل سؤال مع تصحيح فوري.</div></section><div class="nav"><a href="formal_assessment_lecon1_unite3.html">📝 التقييم الرسمي</a><a href="reference_lecon1_unite3.html">📖 المرجع</a><a href="lesson-1-games-v5.html">🎮 الألعاب</a><a href="pronunciation_challenge_lecon1_unite3.html">🔊 النطق</a></div><div class="bar"><span class="pill" id="counter"></span><span class="pill" id="score">⭐ 0</span></div><div class="progress"><span id="bar"></span></div><section class="card" id="card"></section></main><script>
const V=[['le bus','الحافلة'],['le train','القطار'],["l’avion",'الطائرة'],['la voiture','السيارة'],['le métro','مترو الأنفاق'],['le taxi','سيارة أجرة'],['la gare','محطة القطار'],["l’aéroport",'المطار'],['un guichet','شباك التذاكر'],['une plage','شاطئ']];
const verbs=[['Je ___ le train.','prends',['prends','vais','va','allons']],['Nous ___ le bus.','prenons',['prenons','allons','prend','vont']],['Tu ___ un taxi.','prends',['prends','vas','prend','allons']],['Vous ___ le métro.','prenez',['prenez','allez','prend','vont']],['Ils ___ le train.','prennent',['prennent','vont','prend','allez']],['Je ___ à la gare.','vais',['vais','prends','va','allez']],['Ils ___ au stade.','vont',['vont','vas','allez','prennent']],['Elle ___ au zoo.','va',['va','vont','vas','prenez']],['Nous ___ à la plage.','allons',['allons','prenons','allez','vont']],['Vous ___ au club.','allez',['allez','prenez','vont','vas']]];
const prep=[['Je vais ___ gare.','à la'],['Nous allons ___ zoo.','au'],["Je vais ___ aéroport.","à l'"],['Elle va ___ pharmacie.','à la'],['Il va ___ club.','au'],['Nous allons ___ plage.','à la'],['Ils vont ___ lieux.','aux'],["Je vais ___ arrêt.","à l'"],['Nous allons ___ gares.','aux'],['Ils vont ___ pharmacies.','aux']];
const context=[['أي جملة تعني «أستقل القطار»؟','Je prends le train.',['Je prends le train.','Je vais le train.','Je prends la gare.','Je vais à le train.']],['أي جملة تعني «نذهب إلى الشاطئ»؟','Nous allons à la plage.',['Nous allons à la plage.','Nous prenons à la plage.','Nous allons au plage.','Nous allons aux plage.']],['أي جملة صحيحة؟','Je vais à l’aéroport.',['Je vais à l’aéroport.','Je vais au aéroport.','Je prends à l’aéroport.','Je vais l’aéroport.']],['أي جملة صحيحة؟','Nous prenons le bus.',['Nous prenons le bus.','Nous allons le bus.','Nous prenons à le bus.','Nous allons au bus.']],['اختر الجملة التي تصف وجهة.','Ils vont au zoo.',['Ils vont au zoo.','Ils prennent le train.','Je prends un taxi.','Vous prenez le métro.']],['اختر الجملة التي تصف وسيلة نقل.','Je prends le métro.',['Je prends le métro.','Je vais à la gare.','Elle va au club.','Nous allons à la plage.']],['ما الفعل المستخدم مع وسيلة النقل؟','prendre',['prendre','aller','être','avoir']],['ما الفعل المستخدم مع الوجهة؟','aller',['aller','prendre','être','avoir']],['ما الصيغة الصحيحة مع vous وaller؟','Vous allez.',['Vous allez.','Vous vas.','Vous vont.','Vous prenez.']],['ما القاعدة الجامعة للدرس؟','prendre + transport / aller + destination',['prendre + transport / aller + destination','aller + transport / prendre + destination','être + transport / avoir + destination','prendre فقط']]];
const Q=[];V.forEach(x=>Q.push(['مفردات','ما معنى «'+x[0]+'»؟',x[1],V.filter(y=>y[1]!==x[1]).slice(0,3).map(y=>y[1]),x[0]+' = '+x[1]+'.']));verbs.forEach(x=>Q.push(['prendre / aller','أكمل: '+x[0],x[1],x[2],x[0].includes('à')||x[0].includes('au')?'وجهة → aller.':'وسيلة نقل → prendre.']));prep.forEach(x=>Q.push(['أدوات المكان',x[0],x[1],["à la",'au','aux',"à l'"],'اختر أداة المكان حسب الجنس والعدد وبداية الكلمة.']));context.forEach(x=>Q.push(['سياق ومراجعة',x[0],x[1],x[3]||x[2],'طبّق قاعدة الدرس على السياق.']));
let i=0,score=0,answered=false;const shuffle=a=>a.slice().sort(()=>Math.random()-.5);function speak(t){if(!('speechSynthesis'in window)){alert('النطق الصوتي غير مدعوم.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.84;speechSynthesis.speak(u)}function render(){const q=Q[i],opts=shuffle([q[2],...q[3].filter(x=>x!==q[2]).slice(0,3)]);document.getElementById('counter').textContent='السؤال '+(i+1)+' / '+Q.length;document.getElementById('score').textContent='⭐ '+score;document.getElementById('bar').style.width=(i/Q.length*100)+'%';document.getElementById('card').innerHTML='<div class="meta"><span class="cat">'+q[0]+'</span><span class="cat">إجابة واحدة فقط</span></div><div class="prompt"><b>المطلوب:</b> '+q[1]+'</div><div class="q">'+q[1]+'</div><div class="opts">'+opts.map((o,j)=>'<button class="opt" onclick="answer(this,'+JSON.stringify(o)+')"><span class="letter">'+String.fromCharCode(65+j)+'</span><span>'+o+'</span></button>').join('')+'</div><div id="fb" class="fb"></div><div class="actions"><button class="btn primary" id="next" disabled onclick="next()">السؤال التالي ←</button><button class="btn" onclick="speak('+JSON.stringify(q[2])+')">🔊 استمع للإجابة</button></div>'}function answer(btn,val){if(answered)return;answered=true;document.querySelectorAll('.opt').forEach(b=>b.disabled=true);const q=Q[i],ok=val===q[2];if(ok){score++;btn.classList.add('correct');document.getElementById('fb').className='fb ok';document.getElementById('fb').innerHTML='✅ ممتاز! إجابة صحيحة.'}else{btn.classList.add('wrong');document.getElementById('fb').className='fb bad';document.getElementById('fb').innerHTML='❌ ليست الإجابة الصحيحة.<div>'+q[4]+'</div>'}document.getElementById('next').disabled=false;document.getElementById('score').textContent='⭐ '+score}function next(){if(!answered)return;if(i<Q.length-1){i++;answered=false;render()}else{document.getElementById('bar').style.width='100%';const pct=Math.round(score/Q.length*100);document.getElementById('card').innerHTML='<div class="result"><div class="ring"><strong>'+score+'/'+Q.length+'</strong></div><h2>🎉 انتهى التقييم التفاعلي</h2><p>نسبتك: <b>'+pct+'%</b></p><p>'+(pct>=90?'ممتاز!':pct>=75?'جيد جدًا!':'راجع المرجع ثم أعد التدريب.')+'</p><div class="nav"><a href="formal_assessment_lecon1_unite3.html">📝 التقييم الرسمي</a><a href="lesson-1-games-v5.html">🎮 الألعاب</a><a href="pronunciation_challenge_lecon1_unite3.html">🔊 النطق</a></div></div>';localStorage.setItem('hm_interactive_grade8_u3_l1',JSON.stringify({score,total:Q.length,pct,at:new Date().toISOString()}))}}render();</script></body></html>
