<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Game Studio · Unité 3 · Leçon 1</title><style>:root{--n:#17284b;--p:#e62982;--v:#7041e8;--b:#2563eb;--l:#dfe6f0;--s:#eef4ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef3fb,#f8fafc);color:var(--n);font-family:Arial,"Noto Sans Arabic",sans-serif}.wrap{max-width:980px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#173b82,#7041e8 55%,#2563eb);color:#fff;border-radius:26px;padding:22px}.hero h1{font-size:clamp(28px,6vw,46px);margin:8px 0}.hero p{line-height:1.9}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.stat{background:#ffffff18;border:1px solid #ffffff2b;border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:26px}.card{margin-top:14px;background:#fff;border:1px solid var(--l);border-radius:24px;padding:20px;box-shadow:0 10px 28px #17284b0d}.mode{display:inline-block;background:var(--s);color:#315a93;border-radius:999px;padding:7px 11px;font-weight:900}.q{font-size:clamp(21px,4vw,30px);font-weight:900;line-height:1.75;margin:16px 0}.opts{display:grid;gap:10px}.opt{width:100%;border:2px solid var(--l);background:#fff;border-radius:16px;padding:14px;text-align:right;font-size:17px;font-weight:900;color:var(--n);cursor:pointer;display:flex;gap:10px;align-items:center}.letter{display:grid;place-items:center;width:30px;height:30px;background:var(--s);border-radius:9px;color:#315a93;flex:none}.correct{border-color:#45aa73!important;background:#effaf3!important}.wrong{border-color:#d66b6b!important;background:#fff2f2!important}.fb{min-height:45px;margin-top:13px;padding:11px;border-radius:14px;font-weight:900;line-height:1.8}.ok{background:#effaf3;color:#157b3e}.bad{background:#fff2f2;color:#a52b2b}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:14px}.btn{border:0;border-radius:13px;padding:12px 17px;background:#edf3ff;color:#315a93;font-weight:900;cursor:pointer}.primary{background:var(--p);color:#fff}.btn:disabled{opacity:.45}.nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}.nav a{text-decoration:none;background:#edf3ff;color:#315a93;border-radius:12px;padding:10px 13px;font-weight:900}.result{text-align:center;padding:20px}.ring{width:135px;height:135px;border-radius:50%;display:grid;place-items:center;margin:10px auto 14px;background:linear-gradient(135deg,var(--p),var(--v));color:#fff}.ring strong{font-size:34px}@media(max-width:600px){.stats{grid-template-columns:1fr}.actions{display:grid}.actions .btn{width:100%}}</style></head><body><main class="wrap"><section class="hero"><div>🎮 HM Game Studio · Unité 3 · Leçon 1</div><h1>Le voyage</h1><p>مركز الألعاب التفاعلي — <b>60 تحديًا في 6 أنماط</b>، وكل تحدٍ له إجابة واحدة صحيحة وتصحيح فوري.</p><div class="stats"><div class="stat"><b>60</b>تحديًا</div><div class="stat"><b>6</b>أنماط</div><div class="stat"><b>1</b>إجابة صحيحة</div></div></section><div class="nav"><a href="lesson.html?id=grade8-u3-l1">← العودة إلى الدرس</a><a href="examen_u3-l1-v5.html">📝 التقييم التفاعلي</a><a href="pronunciation_challenge_lecon1_unite3.html">🔊 تحدي النطق</a></div><section class="card" id="card"></section></main><script>
const V=[['le bus','الحافلة'],['le train','القطار'],["l’avion",'الطائرة'],['la voiture','السيارة'],['le métro','مترو الأنفاق'],['le taxi','سيارة أجرة'],['la gare','محطة القطار'],["l’aéroport",'المطار'],['un guichet','شباك التذاكر'],['une plage','شاطئ']];
const verbs=[['Je ___ le train.','prends',['prends','vais','va','allons']],['Nous ___ le bus.','prenons',['prenons','allons','prend','vont']],['Tu ___ un taxi.','prends',['prends','vas','prend','allons']],['Vous ___ le métro.','prenez',['prenez','allez','prend','vont']],['Ils ___ le train.','prennent',['prennent','vont','prend','allez']],['Je ___ à la gare.','vais',['vais','prends','va','allez']],['Ils ___ au stade.','vont',['vont','vas','allez','prennent']],['Elle ___ au zoo.','va',['va','vont','vas','prenez']],['Nous ___ à la plage.','allons',['allons','prenons','allez','vont']],['Vous ___ au club.','allez',['allez','prenez','vont','vas']]];
const prep=[['Je vais ___ gare.','à la'],['Nous allons ___ zoo.','au'],["Je vais ___ aéroport.","à l'"],['Elle va ___ pharmacie.','à la'],['Il va ___ club.','au'],['Nous allons ___ plage.','à la'],['Ils vont ___ lieux.','aux'],["Je vais ___ arrêt.","à l'"],['Nous allons ___ gares.','aux'],['Ils vont ___ pharmacies.','aux']];
const modes=[{name:'🧠 معنى المفردة',make:i=>{const x=V[i];return [x[0]+' = ؟',x[1],V.filter(y=>y[1]!==x[1]).slice(0,3).map(y=>y[1]),'راجع المفردة.']}},{name:'⚡ prendre / aller',make:i=>{const x=verbs[i];return [x[0],x[1],x[2].filter(y=>y!==x[1]),x[0].includes('à')||x[0].includes('au')?'الوجهة → aller.':'وسيلة النقل → prendre.']}},{name:'📍 أدوات المكان',make:i=>{const x=prep[i];return [x[0],x[1],["à la",'au','aux',"à l'"].filter(y=>y!==x[1]),'اختر الأداة حسب الجنس والعدد وبداية الكلمة.']}},{name:'🧩 بناء الجملة',make:i=>{const data=[['اختر الجملة الصحيحة للقطار','Je prends le train.',['Je prends le train.','Je vais le train.','Je prends à le train.']],['اختر الجملة الصحيحة للشاطئ','Nous allons à la plage.',['Nous allons à la plage.','Nous allons au plage.','Nous prenons à la plage.']],['اختر الجملة الصحيحة للمطار','Je vais à l’aéroport.',['Je vais à l’aéroport.','Je vais au aéroport.','Je prends l’aéroport.']],['اختر الجملة الصحيحة للحافلة','Nous prenons le bus.',['Nous prenons le bus.','Nous allons le bus.','Nous allons au bus.']],['اختر الجملة الصحيحة للحيوان في الحديقة','Ils vont au zoo.',['Ils vont au zoo.','Ils vont à la zoo.','Ils prennent au zoo.']],['اختر الجملة الصحيحة للمترو','Je prends le métro.',['Je prends le métro.','Je vais le métro.','Je prends au métro.']],['اختر الجملة الصحيحة للمحطة','Je vais à la gare.',['Je vais à la gare.','Je vais au gare.','Je prends à la gare.']],['اختر الجملة الصحيحة للنادي','Il va au club.',['Il va au club.','Il va à la club.','Il prend au club.']],['اختر الجملة الصحيحة مع vous','Vous allez au club.',['Vous allez au club.','Vous vas au club.','Vous vont au club.']],['اختر الجملة الصحيحة مع nous','Nous prenons le train.',['Nous prenons le train.','Nous prend le train.','Nous allons le train.']]];const x=data[i];return [x[0],x[1],x[2], 'طبّق قاعدة الدرس.']}} ,{name:'🌍 ترجمة سريعة',make:i=>{const data=[['أنا أستقل الحافلة','Je prends le bus.'],['نحن نأخذ القطار','Nous prenons le train.'],['هي تذهب إلى المطار','Elle va à l’aéroport.'],['أنا أذهب إلى المحطة','Je vais à la gare.'],['هم يذهبون إلى الشاطئ','Ils vont à la plage.'],['نحن نذهب إلى الحديقة','Nous allons au zoo.'],['هو يأخذ سيارة أجرة','Il prend un taxi.'],['أنتم تذهبون إلى النادي','Vous allez au club.'],['أنا آخذ المترو','Je prends le métro.'],['نحن نذهب إلى المحطة','Nous allons à la gare.']];const x=data[i];return [x[0],x[1],['Je vais le train.','Je prends à la gare.','Nous allons le bus.'],'انتبه: وسيلة النقل مع prendre والوجهة مع aller.']}} ,{name:'🕵️ اكتشف الخطأ',make:i=>{const data=[['Je vais le train.','Je prends le train.'],['Nous allons au plage.','Nous allons à la plage.'],['Je vais au aéroport.','Je vais à l’aéroport.'],['Nous prenons à le bus.','Nous prenons le bus.'],['Ils vont à la zoo.','Ils vont au zoo.'],['Je vais le métro.','Je prends le métro.'],['Je vais au gare.','Je vais à la gare.'],['Il va à la club.','Il va au club.'],['Vous vas au club.','Vous allez au club.'],['Nous prend le train.','Nous prenons le train.']];const x=data[i];return ['أين الخطأ؟ «'+x[0]+'»',x[1],['الاختيار صحيح كما هو','نحتاج prendre مع الوجهة','نحتاج être مع المكان'],'التصحيح: '+x[1]]}}];
let m=0,i=0,score=0,answered=false;function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}function render(){const mode=modes[m],x=mode.make(i),opts=shuffle([x[1],...x[2].filter(y=>y!==x[1]).slice(0,3)]);document.getElementById('card').innerHTML='<span class="mode">'+mode.name+' · '+(i+1)+' / 10</span><div class="q">'+x[0]+'</div><div class="opts">'+opts.map((o,j)=>'<button class="opt" onclick="answer(this,'+JSON.stringify(o)+')"><span class="letter">'+String.fromCharCode(65+j)+'</span><span>'+o+'</span></button>').join('')+'</div><div id="fb" class="fb"></div><div class="actions"><button class="btn" onclick="back()" '+(m===0&&i===0?'disabled':'')+'>السابق</button><button class="btn primary" id="next" disabled onclick="next()">التالي ←</button></div><div style="margin-top:10px;color:#68758b;font-weight:900">النتيجة: '+score+' · إجمالي التقدم: '+(m*10+i)+' / 60</div>'}function answer(btn,val){if(answered)return;answered=true;document.querySelectorAll('.opt').forEach(b=>b.disabled=true);const x=modes[m].make(i),ok=val===x[1];if(ok){score++;btn.classList.add('correct');document.getElementById('fb').className='fb ok';document.getElementById('fb').innerHTML='✅ ممتاز! '+x[3]}else{btn.classList.add('wrong');document.getElementById('fb').className='fb bad';document.getElementById('fb').innerHTML='❌ ليست الإجابة الصحيحة.<div>'+x[3]+'</div>'}document.getElementById('next').disabled=false}function next(){if(!answered)return;if(i<9){i++;answered=false;render()}else if(m<5){m++;i=0;answered=false;render()}else{document.getElementById('card').innerHTML='<div class="result"><div class="ring"><strong>'+score+'/60</strong></div><h2>🎉 اكتملت كل الألعاب</h2><p>أنجزت 60 تحديًا عبر 6 أنماط.</p><div class="nav"><a href="lesson.html?id=grade8-u3-l1">← العودة إلى الدرس</a><a href="examen_u3-l1-v5.html">📝 التقييم</a><a href="pronunciation_challenge_lecon1_unite3.html">🔊 تحدي النطق</a></div></div>';localStorage.setItem('hm_games_grade8_u3_l1',JSON.stringify({score,total:60,at:new Date().toISOString()}))}}function back(){if(i>0){i--;answered=false;render()}else if(m>0){m--;i=9;answered=false;render()}}render();</script></body></html>
