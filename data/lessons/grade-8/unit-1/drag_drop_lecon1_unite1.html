<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Drag & Drop · Leçon 1</title><style>body{font-family:Arial,Cairo,sans-serif;background:#f4f7fc;padding:20px;color:#17223b}.box{background:#fff;padding:20px;border-radius:22px;max-width:900px;margin:auto}.items{display:flex;flex-wrap:wrap;gap:10px}.item{padding:12px 16px;background:#2563eb;color:#fff;border:0;border-radius:12px;cursor:pointer;font-weight:800;touch-action:manipulation}.item.selected{outline:3px solid #16a394;outline-offset:2px}.item.placed{opacity:.45;cursor:default}.zones{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.zone{padding:28px;border:2px dashed #2563eb;border-radius:20px;background:#f8faff;min-height:90px;text-align:center;cursor:pointer}.zone strong{display:block;margin-bottom:8px}.zone.active{background:#eef6ff;border-color:#16a394}@media(max-width:650px){.zones{grid-template-columns:1fr}.item{padding:14px 16px;font-size:16px}}</style></head><body><section class="box"><h1>🎯 Drag & Drop Challenge</h1><p>صنّف كلمات الدرس بين مرافق المدرسة وأدوات الفصل. على الهاتف: اضغط الكلمة ثم اضغط الفئة المناسبة.</p><div class="items" id="items"></div><div class="zones"><div class="zone" data-type="facility"><strong>🏫 مرافق المدرسة</strong><span>cantine · cour · CDI</span></div><div class="zone" data-type="object"><strong>🪑 أدوات الفصل</strong><span>tableau · chaise · stylo</span></div></div><p id="result"></p></section><script src="../../../../scripts/activity-complete.js?v=20260811-dnd2"></script><script>const words=[['cantine','facility'],['cour','facility'],['CDI','facility'],['tableau','object'],['chaise','object'],['stylo','object']];let count=0,selected=null;const items=document.getElementById('items'),result=document.getElementById('result');function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}shuffle(words).forEach(([word,type])=>{const e=document.createElement('button');e.type='button';e.className='item';e.dataset.type=type;e.dataset.word=word;e.textContent=word;e.draggable=true;e.addEventListener('click',()=>selectItem(e));e.addEventListener('dragstart',ev=>{ev.dataTransfer.setData('text/plain',word);selected=e});items.appendChild(e)});function selectItem(el){if(el.classList.contains('placed'))return;document.querySelectorAll('.item.selected').forEach(x=>x.classList.remove('selected'));selected=el;el.classList.add('selected');result.textContent='الآن اختر الفئة المناسبة.'}function place(zone,word){const source=words.find(x=>x[0]===word);if(!source)return;const el=[...document.querySelectorAll('.item')].find(x=>x.dataset.word===word&&!x.classList.contains('placed'));if(!el)return;if(source[1]!==zone.dataset.type){result.textContent='❌ التصنيف غير صحيح، حاول مرة أخرى.';return}el.classList.remove('selected');el.classList.add('placed');el.draggable=false;zone.appendChild(el);selected=null;count++;result.textContent='✓ صحيح!';if(count===words.length){result.textContent='🎉 أحسنت! اكتملت اللعبة +25 XP';if(window.HMActivityComplete)HMActivityComplete.complete('grade8-u1-l1','drag-drop',25)}}document.querySelectorAll('.zone').forEach(zone=>{zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('active')});zone.addEventListener('dragleave',()=>zone.classList.remove('active'));zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('active');place(zone,e.dataTransfer.getData('text/plain'))});zone.addEventListener('click',()=>{if(selected)place(zone,selected.dataset.word)})});</script></body></html>
