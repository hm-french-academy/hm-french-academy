<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Drag & Drop · Leçon 1</title><style>body{margin:0;font-family:Arial,Cairo,sans-serif;background:linear-gradient(180deg,#f5f8fd,#edf3fb);color:#17223b}.box{max-width:950px;margin:25px auto;background:#fff;padding:22px;border-radius:26px;border:1px solid #e2e8f2;box-shadow:0 14px 36px #14264a12}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff;padding:22px;border-radius:22px}.hero-art{height:150px;border-radius:18px;background:#ffffff20;display:grid;place-items:center;font-size:78px;margin-top:14px}.items{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.item{padding:15px;background:#fff;color:#17223b;border:1px solid #d9e1ee;border-radius:16px;cursor:pointer;font-weight:900;box-shadow:0 5px 14px #14264a0d;touch-action:manipulation}.item .emoji{display:block;font-size:38px;margin-bottom:5px}.item.selected{outline:3px solid #2563eb;outline-offset:2px;background:#eef4ff}.item.placed{opacity:.55;cursor:default}.zones{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.zone{padding:20px;border:2px dashed #2563eb;border-radius:22px;background:#f8faff;min-height:145px;text-align:center;cursor:pointer;transition:.15s}.zone .zone-icon{font-size:44px}.zone strong{display:block;margin:7px 0}.zone .zone-help{color:#66738a;font-size:13px}.zone.active{background:#eefcf9;border-color:#16a394}.zone .placed-list{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:12px}.zone .placed-list .item{display:inline-flex;align-items:center;gap:5px;padding:7px 10px;font-size:13px;box-shadow:none;cursor:default}.zone .placed-list .emoji{display:inline;font-size:20px;margin:0}.progress{margin-top:16px;font-weight:900;color:#315aa4}.result{margin-top:10px;min-height:28px;font-weight:900}.final{margin-top:18px;padding:18px;border-radius:18px;background:#f7f9fd;border:1px solid #dfe6f1;display:none}@media(max-width:700px){.items{grid-template-columns:repeat(2,1fr)}.zones{grid-template-columns:1fr}.item{padding:12px 8px}}</style></head><body><section class="box"><div class="hero"><h1>🧩 مركز الألعاب · التصنيف</h1><p>اسحب كل كلمة إلى الفئة التي تراها مناسبة. يمكنك وضعها في أي فئة، والنتيجة تظهر بعد إكمال جميع البطاقات.</p><div class="hero-art">🧩🏫🪑</div></div><div class="items" id="items"></div><div class="zones"><div class="zone" data-type="facility"><div class="zone-icon">🏫</div><strong>مرافق المدرسة</strong><span class="zone-help">أماكن أو مرافق المدرسة.</span><div class="placed-list"></div></div><div class="zone" data-type="object"><div class="zone-icon">🪑</div><strong>في الفصل</strong><span class="zone-help">أدوات أو أشياء في الفصل.</span><div class="placed-list"></div></div></div><div class="progress" id="progress">0 / 8 بطاقات مصنفة</div><p class="result" id="result">ابدأ باختيار بطاقة، ثم اختر الفئة التي تراها مناسبة.</p><div class="final" id="final"></div></section><script src="../../../../scripts/activity-complete.js?v=20260906-dnd5"></script><script>const words=[['cantine','facility','🍽️'],['cour','facility','🏫'],['CDI','facility','📚'],['bibliothèque','facility','📖'],['tableau','object','🖼️'],['chaise','object','🪑'],['fenêtre','object','🪟'],['bureau','object','🗄️']];let count=0,correct=0,selected=null;const items=document.getElementById('items'),result=document.getElementById('result'),progress=document.getElementById('progress'),final=document.getElementById('final');function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}function selectItem(el){if(el.classList.contains('placed'))return;document.querySelectorAll('.item.selected').forEach(x=>x.classList.remove('selected'));selected=el;el.classList.add('selected');result.textContent='اختر الآن الفئة التي تريد وضع «'+el.dataset.word+'» فيها.'}function place(zone,word){const source=words.find(x=>x[0]===word),el=[...document.querySelectorAll('#items .item')].find(x=>x.dataset.word===word&&!x.classList.contains('placed'));if(!source||!el)return;el.classList.remove('selected');el.classList.add('placed');el.draggable=false;zone.querySelector('.placed-list').appendChild(el);selected=null;count++;if(source[1]===zone.dataset.type)correct++;progress.textContent=count+' / '+words.length+' بطاقات مصنفة';result.textContent='تم تسجيل اختيارك. أكمل بقية البطاقات.';if(count===words.length)finish()}function finish(){const percent=Math.round(correct/words.length*100);final.style.display='block';final.innerHTML=`<strong>🎯 النتيجة النهائية</strong><br>الصحيح: <strong>${correct} من ${words.length}</strong> (${percent}%).`;result.textContent='انتهت اللعبة — النتيجة تظهر الآن.';if(window.HMActivityComplete)HMActivityComplete.complete('grade8-u1-l1','drag-drop',Math.round(25*correct/words.length))}shuffle(words).forEach(([word,type,emoji])=>{const e=document.createElement('button');e.type='button';e.className='item';e.dataset.type=type;e.dataset.word=word;e.innerHTML=`<span class="emoji">${emoji}</span>${word}`;e.draggable=true;e.addEventListener('click',()=>selectItem(e));e.addEventListener('dragstart',ev=>{selected=e;e.classList.add('selected');ev.dataTransfer.setData('text/plain',word)});items.appendChild(e)});document.querySelectorAll('.zone').forEach(zone=>{zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('active')});zone.addEventListener('dragleave',()=>zone.classList.remove('active'));zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('active');place(zone,e.dataTransfer.getData('text/plain'))});zone.addEventListener('click',()=>{if(selected)place(zone,selected.dataset.word)})});</script></body></html>
