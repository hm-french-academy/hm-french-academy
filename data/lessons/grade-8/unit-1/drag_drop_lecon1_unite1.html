<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>HM Academy | Drag Drop</title><style>body{font-family:Arial;background:#f4f7fc;padding:20px}.box{background:#fff;padding:20px;border-radius:20px;max-width:800px;margin:auto}.item{padding:12px;background:#2563eb;color:#fff;border-radius:12px;margin:8px;display:inline-block;cursor:grab}.zone{padding:30px;border:2px dashed #2563eb;border-radius:20px;margin-top:20px}</style></head><body><section class="box"><h1>🎯 Drag & Drop Challenge</h1><p>ضع الكلمات في المجموعة الصحيحة</p><div id="items"></div><div class="zone" id="zone">🏫 School Vocabulary</div><p id="result"></p></section><script src="../../../../scripts/activity-complete.js"></script><script>let words=['classe','cantine','bibliothèque'];let count=0;const items=document.getElementById('items');words.forEach(w=>{let e=document.createElement('div');e.className='item';e.draggable=true;e.textContent=w;e.ondragstart=x=>x.dataTransfer.setData('text',w);items.appendChild(e)});zone.ondragover=e=>e.preventDefault();zone.ondrop=e=>{count++;e.preventDefault();if(count===words.length){document.getElementById('result').textContent='Bravo!';if(window.HMActivityComplete)HMActivityComplete.complete('grade8-u1-l1','drag-drop',25)}};</script></section></body></html>
