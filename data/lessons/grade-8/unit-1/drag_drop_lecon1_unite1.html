<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Drag & Drop · Leçon 1</title><style>body{font-family:Arial,Cairo,sans-serif;background:#f4f7fc;padding:20px;color:#17223b}.box{background:#fff;padding:20px;border-radius:22px;max-width:900px;margin:auto}.items{display:flex;flex-wrap:wrap;gap:10px}.item{padding:12px 16px;background:#2563eb;color:#fff;border-radius:12px;cursor:grab;font-weight:800}.zones{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.zone{padding:28px;border:2px dashed #2563eb;border-radius:20px;background:#f8faff;min-height:70px;text-align:center}.zone strong{display:block;margin-bottom:8px}.placed{opacity:.45;cursor:default}@media(max-width:650px){.zones{grid-template-columns:1fr}}</style></head><body><section class="box"><h1>🎯 Drag & Drop Challenge</h1><p>صنّف كلمات الدرس بين مرافق المدرسة وأدوات الفصل.</p><div class="items" id="items"></div><div class="zones"><div class="zone" data-type="facility"><strong>🏫 مرافق المدرسة</strong><span>ضع هنا: cantine · cour · CDI</span></div><div class="zone" data-type="object"><strong>🪑 أدوات الفصل</strong><span>ضع هنا: tableau · chaise · stylo</span></div></div><p id="result"></p></section><script src="../../../../scripts/activity-complete.js?v=20260811-dnd1"></script><script>const words=[['cantine','facility'],['cour','facility'],['CDI','facility'],['tableau','object'],['chaise','object'],['stylo','object']];let count=0;const items=document.getElementById('items');words.forEach(([word,type])=>{const e=document.createElement('div');e.className='item';e.draggable=true;e.dataset.type=type;e.textContent=word;e.addEventListener('dragstart',ev=>ev.dataTransfer.setData('text/plain',word));items.appendChild(e)});document.querySelectorAll('.zone').forEach(zone=>{zone.addEventListener('dragover',e=>e.preventDefault());zone.addEventListener('drop',e=>{e.preventDefault();const word=e.dataTransfer.getData('text/plain');const source=words.find(x=>x[0]===word);if(!source||source[1]!==zone.dataset.type){document.getElementById('result').textContent='❌ التصنيف غير صحيح، حاول مرة أخرى.';return}const el=[...document.querySelectorAll('.item')].find(x=>x.textContent===word&&!x.classList.contains('placed'));if(!el)return;el.classList.add('placed');el.draggable=false;zone.appendChild(el);count++;document.getElementById('result').textContent='✓ صحيح!';if(count===words.length){document.getElementById('result').textContent='🎉 أحسنت! اكتملت اللعبة +25 XP';if(window.HMActivityComplete)HMActivityComplete.complete('grade8-u1-l1','drag-drop',25)}})});</script></body></html>
