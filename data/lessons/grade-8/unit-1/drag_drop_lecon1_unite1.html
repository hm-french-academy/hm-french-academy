<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Drag & Drop · Leçon 1</title><style>body{margin:0;font-family:Arial,Cairo,sans-serif;background:linear-gradient(180deg,#f5f8fd,#edf3fb);color:#17223b}.box{max-width:950px;margin:25px auto;background:#fff;padding:22px;border-radius:26px;border:1px solid #e2e8f2;box-shadow:0 14px 36px #14264a12}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff;padding:22px;border-radius:22px}.hero-art{height:150px;border-radius:18px;background:#ffffff20;display:grid;place-items:center;font-size:78px;margin-top:14px}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.item{padding:15px;background:#fff;color:#17223b;border:1px solid #d9e1ee;border-radius:16px;cursor:pointer;font-weight:900;box-shadow:0 5px 14px #14264a0d;touch-action:manipulation}.item .emoji{display:block;font-size:38px;margin-bottom:5px}.item.selected{outline:3px solid #16a394;outline-offset:2px}.item.placed{opacity:.45;cursor:default}.zones{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.zone{padding:24px;border:2px dashed #2563eb;border-radius:22px;background:#f8faff;min-height:120px;text-align:center;cursor:pointer}.zone .zone-icon{font-size:44px}.zone strong{display:block;margin:7px 0}.zone.active{background:#eefcf9;border-color:#16a394}.result{margin-top:14px;min-height:28px;font-weight:900}@media(max-width:650px){.items{grid-template-columns:repeat(2,1fr)}.zones{grid-template-columns:1fr}.item{padding:12px 8px}}</style></head><body><section class="box"><div class="hero"><h1>🧲 Drag & Drop Challenge</h1><p>صنّف الصورة أو الكلمة في المكان الصحيح. على الهاتف: اضغط البطاقة ثم الفئة.</p><div class="hero-art">🧩🏫🪑</div></div><div class="items" id="items"></div><div class="zones"><div class="zone" data-type="facility"><div class="zone-icon">🏫</div><strong>مرافق المدرسة</strong><span>cantine · cour · CDI · bibliothèque</span></div><div class="zone" data-type="object"><div class="zone-icon">🪑</div><strong>في الفصل</strong><span>tableau · chaise · fenêtre · bureau</span></div></div><p class="result" id="result">اختر بطاقة ثم اختر الفئة.</p></section><script src="../../../../scripts/activity-complete.js?v=20260814-dnd3"></script><script>const words=[['cantine','facility','🍽️'],['cour','facility','🏫'],['CDI','facility','📚'],['bibliothèque','facility','📖'],['tableau','object','🖼️'],['chaise','object','🪑'],['fenêtre','object','🪟'],['bureau','object','🗄️']];let count=0,selected=null;const items=document.getElementById('items'),result=document.getElementById('result');function shuffle(a){return [...a].sort(()=>Math.random()-.5)}shuffle(words).forEach(([word,type,emoji])=>{const e=document.createElement('button');e.type='button';e.className='item';e.dataset.type=type;e.dataset.word=word;e.innerHTML=`<span class="emoji">${emoji}</span>${word}`;e.draggable=true;e.addEventListener('click',()=>selectItem(e));e.addEventListener('dragstart',ev=>{ev.dataTransfer.setData('text/plain',word);selected=e});items.appendChild(e)});function selectItem(el){if(el.classList.contains('placed'))return;document.querySelectorAll('.item.selected').forEach(x=>x.classList.remove('selected'));selected=el;el.classList.add('selected');result.textContent='الآن اختر الفئة المناسبة.'}function place(zone,word){const source=words.find(x=>x[0]===word);const el=[...document.querySelectorAll('.item')].find(x=>x.dataset.word===word&&!x.classList.contains('placed'));if(!source||!el)return;if(source[1]!==zone.dataset.type){result.textContent='❌ تصنيف غير صحيح — فكر في وظيفة الكلمة.';return}el.classList.remove('selected');el.classList.add('placed');el.draggable=false;zone.appendChild(el);selected=null;count++;result.textContent='✓ صحيح!';if(count===words.length){result.textContent='🎉 أحسنت! اكتملت اللعبة +25 XP';if(window.HMActivityComplete)HMActivityComplete.complete('grade8-u1-l1','drag-drop',25)}}document.querySelectorAll('.zone').forEach(zone=>{zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('active')});zone.addEventListener('dragleave',()=>zone.classList.remove('active'));zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('active');place(zone,e.dataTransfer.getData('text/plain'))});zone.addEventListener('click',()=>{if(selected)place(zone,selected.dataset.word)})});</script></body></html>
