<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Pronunciation Challenge</title><style>body{font-family:Arial,Cairo,sans-serif;background:#f4f7fc;padding:20px}.box{max-width:760px;margin:auto;background:#fff;padding:25px;border-radius:22px;box-shadow:0 12px 30px #14264a12}.btn{padding:14px;border:0;border-radius:14px;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer;margin:5px}.btn:disabled{opacity:.55}.status{margin-top:14px;padding:12px;border-radius:12px;background:#f5f8ff;color:#315aa4;font-weight:800;min-height:24px}</style></head><body><section class="box"><h1>🎤 تحدّي النطق</h1><p>استمع إلى الكلمات الفرنسية ثم كررها بصوتك.</p><button class="btn" data-word="bibliothèque">🔊 bibliothèque</button><button class="btn" data-word="cantine">🔊 cantine</button><button class="btn" data-word="classe">🔊 classe</button><div id="msg" class="status">اضغط على أي كلمة لبدء النطق.</div></section><script src="../../../../scripts/speech-runtime.js?v=20260815-pronunciation1"></script><script src="../../../../scripts/activity-complete.js?v=20260815-pronunciation1"></script><script>(function(){let done=new Set();const msg=document.getElementById('msg');const buttons=[...document.querySelectorAll('[data-word]')];function speakWord(word,button){if(window.HMSpeech&&HMSpeech.speak){msg.textContent='⏸️ جاري نطق: '+word;HMSpeech.speak(word,{button,lang:'fr-FR',rate:.82}).then(ok=>{msg.textContent=ok?'✅ استمع ثم كرر: '+word:'⚠️ النطق غير متاح على هذا الجهاز';});return;}if(window.speechSynthesis&&window.SpeechSynthesisUtterance){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='fr-FR';u.rate=.82;u.onend=()=>msg.textContent='✅ استمع ثم كرر: '+word;u.onerror=()=>msg.textContent='⚠️ النطق غير متاح على هذا الجهاز';speechSynthesis.resume();speechSynthesis.speak(u);return;}msg.textContent='⚠️ متصفحك لا يدعم النطق الصوتي.'}buttons.forEach(button=>button.addEventListener('click',()=>{const word=button.dataset.word;speakWord(word,button);done.add(word);if(done.size===buttons.length){msg.textContent='🎉 أحسنت! أكملت كلمات تحدي النطق.';if(window.HMActivityComplete)HMActivityComplete.complete('grade8-u1-l1','pronunciation',20)}}));})();</script></body></html>
