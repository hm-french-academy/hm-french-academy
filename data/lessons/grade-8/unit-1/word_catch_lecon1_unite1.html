<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Word Catch · Leçon 1</title><style>body{margin:0;font-family:Arial,Cairo,sans-serif;background:#f4f7fc;color:#17223b}.wrap{max-width:900px;margin:auto;padding:20px}.hero,.game{background:#fff;border-radius:24px;padding:22px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff}.arena{position:relative;height:430px;overflow:hidden;border-radius:20px;background:linear-gradient(#edf4ff,#fff);border:1px solid #dbe5f4;touch-action:none}.target{font-size:22px;font-weight:900}.word{position:absolute;min-width:92px;padding:13px 16px;border:0;border-radius:14px;background:#2563eb;color:#fff;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 5px 12px #14264a22;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.word.bad{background:#d9534f}.word:active,.word.hit{transform:scale(.96);filter:brightness(.92)}.score{font-weight:900;font-size:18px}.restart{border:0;background:#713bd1;color:#fff;padding:12px 18px;border-radius:12px;font-weight:900;cursor:pointer}.status{margin-top:10px;min-height:26px;font-weight:800}.hint{margin-top:8px;color:#68758b;font-size:13px}@media(max-width:600px){.arena{height:360px}.word{min-width:88px;padding:14px 12px;font-size:15px}}</style></head><body><main class="wrap"><section class="hero"><h1>🎯 Word Catch · التقاط الكلمات</h1><p>اضغط على الكلمة الفرنسية المطلوبة. في كل جولة يتغير الهدف وترتيب الكلمات ومواقعها.</p><p class="target">الكلمة المطلوبة: <span id="target"></span></p></section><section class="game"><div class="score">النقاط: <span id="score">0</span> · الجولة: <span id="round">1</span>/10</div><div class="arena" id="arena"></div><p class="status" id="msg">اختر الكلمة الصحيحة.</p><p class="hint">📱 على الهاتف: اضغط ضغطة واحدة على الكلمة. 🖱️ على الكمبيوتر: انقر عليها.</p><button class="restart" type="button" id="restart">جولة جديدة</button></section></main><script src="../../../../scripts/activity-complete.js?v=20260811-wordcatch3"></script><script>const words=['cantine','cour','tableau','chaise','stylo','trousse','gomme','règle','classe','bibliothèque'];let target='',score=0,round=0,timer=null,nextTimer=null,locked=false;const arena=document.getElementById('arena'),t=document.getElementById('target'),s=document.getElementById('score'),r=document.getElementById('round'),m=document.getElementById('msg');function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}function clearTimers(){clearTimeout(timer);clearTimeout(nextTimer)}function next(){clearTimers();if(round>=10){finish();return}locked=false;round++;r.textContent=round;target=words[Math.floor(Math.random()*words.length)];t.textContent=target;arena.innerHTML='';const choices=shuffle([target,...shuffle(words.filter(x=>x!==target)).slice(0,3)]),used=[];choices.forEach(w=>{let left,top,tries=0;do{left=8+Math.random()*76;top=8+Math.random()*72;tries++}while(used.some(p=>Math.abs(p.left-left)<19&&Math.abs(p.top-top)<17)&&tries<40);used.push({left,top});const b=document.createElement('button');b.type='button';b.className='word'+(w===target?'':' bad');b.textContent=w;b.style.left=left+'%';b.style.top=top+'%';const hit=ev=>{ev.preventDefault();if(locked)return;choose(w,b)};b.addEventListener('pointerdown',hit,{passive:false});b.addEventListener('click',hit);arena.appendChild(b)});m.textContent='اضغط على الكلمة الصحيحة.';timer=setTimeout(()=>{if(locked)return;locked=true;m.textContent='⏱️ انتهى الوقت؛ الجولة التالية تبدأ الآن.';nextTimer=setTimeout(next,500)},3500)}function choose(w,b){if(locked)return;locked=true;clearTimers();if(w===target){score+=10;s.textContent=score;b.classList.add('hit');m.textContent='✓ ممتاز! الكلمة صحيحة.'}else{score=Math.max(0,score-3);s.textContent=score;b.classList.add('hit');m.textContent='✗ ليست الكلمة المطلوبة.'}nextTimer=setTimeout(next,w===target?450:750)}function finish(){arena.innerHTML='';m.textContent='🏆 أحسنت! انتهت الجولة · '+score+' نقطة · +25 XP';if(window.HMActivityComplete)HMActivityComplete.complete('grade8-u1-l1','word-catch',25)}function start(){clearTimers();score=0;round=0;s.textContent='0';m.textContent='اختر الكلمة الصحيحة.';next()}document.getElementById('restart').addEventListener('click',start);start();</script></body></html>
