<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Word Catch · Leçon 1</title><style>body{margin:0;font-family:Arial,Cairo,sans-serif;background:linear-gradient(180deg,#f5f8fd,#edf3fb);color:#17223b}.wrap{max-width:950px;margin:auto;padding:20px}.hero,.game{background:#fff;border-radius:24px;padding:22px;margin-bottom:16px;border:1px solid #e2e8f2;box-shadow:0 10px 28px #14264a0d}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff}.hero h1{margin:0 0 8px}.hero p{line-height:1.8;margin:6px 0}.target-card{display:flex;align-items:center;gap:16px;margin-top:14px;background:#ffffff20;border-radius:20px;padding:16px}.target-img{width:100px;height:100px;border-radius:20px;background:#fff;display:grid;place-items:center;font-size:58px}.target-title{font-size:14px;opacity:.9}.target-word{font-size:24px;font-weight:900}.arena{position:relative;height:430px;overflow:hidden;border-radius:20px;background:radial-gradient(circle at 20% 20%,#fff,#edf4ff);border:1px solid #dbe5f4;touch-action:none}.word{position:absolute;min-width:96px;padding:13px 16px;border:0;border-radius:15px;background:#2563eb;color:#fff;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 7px 16px #14264a22;touch-action:manipulation}.word.bad{background:#8a95a8}.word:active,.word.hit{transform:scale(.96)}.score{font-weight:900;font-size:18px}.restart{border:0;background:#713bd1;color:#fff;padding:12px 18px;border-radius:12px;font-weight:900;cursor:pointer}.status{margin-top:10px;min-height:26px;font-weight:800}.hint{margin-top:8px;color:#68758b;font-size:13px}@media(max-width:600px){.arena{height:360px}.word{min-width:88px;padding:14px 12px;font-size:15px}.target-img{width:78px;height:78px;font-size:45px}}</style></head><body><main class="wrap"><section class="hero"><h1>🎯 Word Catch · التقاط الكلمات</h1><p>انظر إلى الصورة، ثم التقط الكلمة الفرنسية التي تعبّر عنها من بين الكلمات المتحركة.</p><div class="target-card"><div class="target-img" id="targetImg">❓</div><div><div class="target-title">الصورة المطلوبة</div><div class="target-word">ما الكلمة الفرنسية المناسبة؟</div></div></div></section><section class="game"><div class="score">النقاط: <span id="score">0</span> · الجولة: <span id="round">1</span>/10</div><div class="arena" id="arena"></div><p class="status" id="msg">التقط الكلمة التي تمثل الصورة.</p><p class="hint">📱 اضغط مرة واحدة على الكلمة الصحيحة. لا تظهر الكلمة الهدف مكتوبة في السؤال.</p><button class="restart" type="button" id="restart">جولة جديدة</button></section></main><script src="../../../../scripts/activity-complete.js?v=20260814-wordcatch5"></script><script>const words=[['cantine','🍽️'],['cour','🏫'],['tableau','🖼️'],['chaise','🪑'],['bibliothèque','📖'],['gymnase','🤸'],['laboratoire','🧪'],['terrain de sport','⚽'],['fenêtre','🪟'],['porte','🚪']];let target=null,score=0,round=0,timer=null,nextTimer=null,locked=false;const arena=document.getElementById('arena'),img=document.getElementById('targetImg'),s=document.getElementById('score'),r=document.getElementById('round'),m=document.getElementById('msg');function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function clearTimers(){clearTimeout(timer);clearTimeout(nextTimer)}function next(){clearTimers();if(round>=10){finish();return}locked=false;round++;r.textContent=round;target=words[Math.floor(Math.random()*words.length)];img.textContent=target[1];arena.innerHTML='';const choices=shuffle([target,...shuffle(words.filter(x=>x[0]!==target[0])).slice(0,3)]),used=[];choices.forEach(([w])=>{let left,top,tries=0;do{left=8+Math.random()*76;top=8+Math.random()*72;tries++}while(used.some(p=>Math.abs(p.left-left)<19&&Math.abs(p.top-top)<17)&&tries<40);used.push({left,top});const b=document.createElement('button');b.type='button';b.className='word';b.textContent=w;b.style.left=left+'%';b.style.top=top+'%';b.onclick=()=>{if(locked)return;choose(w,b)};arena.appendChild(b)});m.textContent='التقط الكلمة الفرنسية المناسبة للصورة.';timer=setTimeout(()=>{if(locked)return;locked=true;m.textContent='⏱️ انتهى الوقت؛ الجولة التالية تبدأ الآن.';nextTimer=setTimeout(next,500)},3500)}function choose(w,b){if(locked)return;locked=true;clearTimers();if(w===target[0]){score+=10;s.textContent=score;b.classList.add('hit');m.textContent='✓ ممتاز! اختيار صحيح.'}else{score=Math.max(0,score-3);s.textContent=score;b.classList.add('hit');m.textContent='✗ ليست الكلمة المناسبة للصورة.'}nextTimer=setTimeout(next,w===target[0]?450:750)}function finish(){arena.innerHTML='';m.textContent='🏆 انتهت اللعبة · '+score+' نقطة · +25 XP';if(window.HMActivityComplete)HMActivityComplete.complete('grade8-u1-l1','word-catch',25)}function start(){clearTimers();score=0;round=0;s.textContent='0';m.textContent='التقط الكلمة التي تمثل الصورة.';next()}document.getElementById('restart').addEventListener('click',start);start();</script></body></html>
