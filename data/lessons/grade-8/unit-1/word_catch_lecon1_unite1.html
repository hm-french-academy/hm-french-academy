<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Word Catch · Leçon 1</title><style>body{margin:0;font-family:Arial,Cairo,sans-serif;background:#f4f7fc;color:#17223b}.wrap{max-width:900px;margin:auto;padding:20px}.hero,.game{background:#fff;border-radius:24px;padding:22px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff}.arena{position:relative;height:430px;overflow:hidden;border-radius:20px;background:linear-gradient(#edf4ff,#fff);border:1px solid #dbe5f4}.target{font-size:22px;font-weight:900}.word{position:absolute;padding:10px 14px;border:0;border-radius:14px;background:#2563eb;color:#fff;font-weight:900;cursor:pointer;box-shadow:0 5px 12px #14264a22}.word.bad{background:#d9534f}.score{font-weight:900;font-size:18px}.restart{border:0;background:#713bd1;color:#fff;padding:12px 18px;border-radius:12px;font-weight:900;cursor:pointer}@media(max-width:600px){.arena{height:360px}}</style></head><body><main class="wrap"><section class="hero"><h1>🎯 Word Catch · التقاط الكلمات</h1><p>التقط الكلمة الفرنسية المطلوبة قبل أن تختفي، وتجنب الكلمات الخاطئة.</p><p class="target">الكلمة المطلوبة: <span id="target"></span></p></section><section class="game"><div class="score">النقاط: <span id="score">0</span> · الجولة: <span id="round">1</span>/10</div><div class="arena" id="arena"></div><p id="msg">ابدأ بالتقاط الكلمات الصحيحة.</p><button class="restart" onclick="start()">جولة جديدة</button></section></main><script src="../../../../scripts/activity-complete.js?v=20260811-wordcatch1"></script><script>const words=['cantine','cour','tableau','chaise','stylo','trousse','gomme','règle','classe','bibliothèque'];let target='',score=0,round=0,timer=null;const arena=document.getElementById('arena'),t=document.getElementById('target'),s=document.getElementById('score'),r=document.getElementById('round'),m=document.getElementById('msg');function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function next(){if(round>=10){finish();return}round++;r.textContent=round;target=words[Math.floor(Math.random()*words.length)];t.textContent=target;arena.innerHTML='';const choices=shuffle([target,...shuffle(words.filter(x=>x!==target)).slice(0,3)]);choices.forEach((w,i)=>{const b=document.createElement('button');b.className='word'+(w===target?'':' bad');b.textContent=w;b.style.left=(8+Math.random()*78)+'%';b.style.top=(8+Math.random()*78)+'%';b.onclick=()=>hit(w,b);arena.appendChild(b)});clearTimeout(timer);timer=setTimeout(()=>{m.textContent='⏱️ انتهى الوقت؛ الجولة التالية.';next()},2200)}function hit(w,b){if(w===target){score+=10;s.textContent=score;b.remove();m.textContent='✓ ممتاز!'}else{score=Math.max(0,score-3);s.textContent=score;b.remove();m.textContent='✗ كلمة غير مطلوبة'}clearTimeout(timer);setTimeout(next,350)}function finish(){arena.innerHTML='';m.textContent='🏆 أحسنت! انتهت الجولة · '+score+' نقطة · +25 XP';if(window.HMActivityComplete)HMActivityComplete.complete('grade8-u1-l1','word-catch',25)}function start(){score=0;round=0;s.textContent=0;m.textContent='ابدأ بالتقاط الكلمات الصحيحة.';next()}start();</script></body></html>
