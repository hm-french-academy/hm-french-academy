<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | مختبر التحديات · Leçon 2</title><style>:root{--navy:#14264a;--blue:#2563eb;--pink:#e92d83;--line:#dfe6f1;--muted:#647189;--green:#20a45a;--red:#d9534f}*{box-sizing:border-box}body{font-family:Arial,Cairo,sans-serif;background:linear-gradient(180deg,#f7f9fd,#edf3fb);color:#17223b;margin:0}main{max-width:980px;margin:auto;padding:20px 14px 45px}.hero{background:linear-gradient(135deg,#173a82,#2563eb 58%,#14b8a6);color:#fff;border-radius:30px;padding:28px;box-shadow:0 20px 45px #173a8222}.hero h1{margin:0;font-size:34px}.hero p{line-height:1.8;opacity:.94}.meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.pill{background:#ffffff20;border:1px solid #ffffff35;padding:7px 11px;border-radius:99px;font-weight:900;font-size:12px}.game{background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px;margin-top:16px;box-shadow:0 12px 32px #14264a10}.progress{height:8px;background:#edf1f7;border-radius:99px;overflow:hidden;margin-bottom:18px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--blue));transition:.25s}.stage{text-align:center;color:var(--muted);font-weight:800;font-size:12px}.scene{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center;margin:15px 0;padding:15px;border-radius:20px;background:linear-gradient(135deg,#f7faff,#fff4f8);border:1px solid var(--line)}.scene-art{height:145px;border-radius:17px;background:linear-gradient(145deg,#e9f1ff,#fff);display:grid;place-items:center;font-size:72px}.scene h2{margin:0 0 7px;color:var(--navy)}.scene p{margin:0;color:var(--muted);line-height:1.8}.listen{border:0;border-radius:12px;background:#edf3ff;color:#214f9d;padding:9px 12px;font-weight:900;cursor:pointer;margin-top:10px}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:16px}.opt{padding:15px;border:1px solid #dbe4f2;border-radius:15px;background:#fff;font-weight:900;cursor:pointer;text-align:center;font-size:15px}.opt:hover{border-color:#8da9e3;transform:translateY(-1px)}.opt.good{background:#eaf8f0;border-color:var(--green)}.opt.bad{background:#fff0f0;border-color:var(--red)}.feedback{min-height:28px;text-align:center;font-weight:900;margin:14px 0}.result{display:none;text-align:center;padding:24px;border-radius:20px;background:#f7f9fd;border:1px solid var(--line)}.result h2{margin-top:0;color:var(--navy)}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.nav a{display:inline-block;padding:11px 13px;border-radius:12px;background:#fff;border:1px solid var(--line);color:#315fc8;text-decoration:none;font-weight:900}@media(max-width:650px){main{padding:12px 8px 35px}.hero{padding:20px;border-radius:22px}.hero h1{font-size:28px}.scene{grid-template-columns:1fr}.scene-art{height:110px}.opts{grid-template-columns:1fr}}</style></head><body><main><section class="hero"><h1>🎯 مختبر التحديات · Leçon 2</h1><p>تعرّف على الأداة من الصورة، استمع إلى الكلمة، ثم اختر الاسم الفرنسي الصحيح. هنا أنت تتعلّم من المعنى أولًا، لا من حفظ ترتيب الكلمات.</p><div class="meta"><span class="pill">⏱ 5–10 دقائق</span><span class="pill">⭐ +20 XP</span><span class="pill">🎯 مفردات · استماع · تعرّف</span></div></section><section class="game"><div class="progress"><div id="bar" class="bar"></div></div><div id="stage" class="stage"></div><div id="scene" class="scene"></div><div id="opts" class="opts"></div><div id="msg" class="feedback" aria-live="polite"></div><div id="result" class="result"></div></section><nav class="nav"><a href="lesson-2-interactive.html">← العودة إلى الشرح التفاعلي</a><a href="../../../../lesson-files-v2.html?lesson=grade8-u1-l2">📚 المواد التعليمية</a><a href="../../../../dashboard.html">📈 لوحة الطالب</a></nav></main><script src="../../../../scripts/learning-progress.js?v=20260812-progress3"></script><script src="../../../../scripts/activity-complete.js?v=20260812-activity3"></script><script>const P=[['Un stylo','قلم جاف','🖊️'],['Un crayon','قلم رصاص','✏️'],['Une gomme','ممحاة','◻️'],['Une règle','مسطرة','📏'],['Un livre','كتاب','📕'],['Un cahier','كراسة','📓'],['Un taille-crayon','براية','🔺'],['Une trousse','مقلمة','🧰'],['Une calculatrice','آلة حاسبة','🧮'],['Un sac à dos','حقيبة ظهر','🎒']];let round=0,score=0,cur;const $=id=>document.getElementById(id);function speak(t){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.86;window.speechSynthesis.speak(u)}function sh(a){return [...a].sort(()=>Math.random()-.5)}function next(){if(round>=10){$('scene').style.display='none';$('opts').style.display='none';$('msg').style.display='none';$('result').style.display='block';const pct=Math.round(score/10*100);$('result').innerHTML='<h2>'+(pct>=80?'🏆 أحسنت!':'💪 تجربة جيدة!')+'</h2><p>أجبت عن <b>'+score+' من 10</b> إجابات صحيحة.</p><p>'+ (pct>=80?'لقد أتقنت معظم المفردات.':'راجع بطاقات المفردات ثم أعد التحدي.') +'</p><strong>+'+(pct>=80?20:10)+' XP</strong>';if(window.HMActivityComplete)HMActivityComplete.complete('grade8-u1-l2','game',pct>=80?20:10);return}round++;$('stage').textContent='الجولة '+round+' من 10';$('bar').style.width=(round/10*100)+'%';cur=P[Math.floor(Math.random()*P.length)];$('scene').innerHTML='<div class="scene-art" role="img" aria-label="صورة '+cur[1]+'">'+cur[2]+'</div><div><h2>ما الأداة التي تراها؟</h2><p>انظر إلى الصورة أولًا، ثم اختر الاسم الفرنسي المناسب. يمكنك الاستماع إلى الكلمة قبل الاختيار.</p><button class="listen" type="button" onclick="speak('+JSON.stringify(cur[0])+')">🔊 استمع إلى الكلمة</button></div>';let o=sh([cur[0],...sh(P.filter(x=>x[0]!==cur[0])).slice(0,3).map(x=>x[0])]);$('opts').innerHTML=o.map(x=>'<button class="opt" type="button">'+x+'</button>').join('');$('msg').textContent='';[...$('opts').children].forEach(b=>b.onclick=()=>{if(b.disabled)return;[...$('opts').children].forEach(x=>x.disabled=true);if(b.textContent===cur[0]){score++;b.classList.add('good');$('msg').textContent='✓ أحسنت! اختيار صحيح.'}else{b.classList.add('bad');$('msg').textContent='اقتربت! راجع الصورة وحاول في الجولة التالية.'}setTimeout(next,650)})}next()</script></body></html>
