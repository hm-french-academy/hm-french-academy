<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Memory Cards</title><style>body{font-family:Arial,Cairo,sans-serif;background:#f3f6fc;color:#17223b;margin:0;padding:18px}.wrap{max-width:760px;margin:auto}.hero,.game{background:#fff;border:1px solid #e1e7f0;border-radius:24px;padding:20px;box-shadow:0 12px 30px #14264a12}.hero{background:linear-gradient(135deg,#173a82,#713bd1);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.card{aspect-ratio:1;border:0;border-radius:17px;background:#eef3ff;color:#173a82;font-size:24px;font-weight:900;cursor:pointer}.card.matched{background:#eaf8f0;color:#168449}.card.open{background:#fff;border:2px solid #2563eb}.stats{margin-top:12px;font-weight:900}@media(max-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><main class="wrap"><section class="hero"><h1>🧠 Memory Cards</h1><p>طابق الكلمة الفرنسية مع معناها العربي.</p></section><section class="game"><div class="stats" id="stats"></div><div class="grid" id="grid"></div><div id="result"></div></section></main><script src="../../../../scripts/game-scoring.js"></script><script src="../../../../scripts/game-runtime.js"></script><script src="../../../../scripts/activity-complete.js"></script><script>const lessonId='grade8-u1-l1',activityId='memory-cards',pairs=[['Une cantine','كانتين'],['Une bibliothèque','مكتبة'],['Un laboratoire','معمل'],['Une horloge','ساعة حائط']];let cards=[],open=[],moves=0,matched=0,reported=false,state=HMGameRuntime.start(120);for(const p of pairs){cards.push({t:p[0],id:p[0]},{t:p[1],id:p[0]})}cards.sort(()=>Math.random()-.5);function draw(){document.getElementById('grid').innerHTML=cards.map((c,i)=>`<button class="card ${c.matched?'matched':''} ${open.includes(i)?'open':''}" onclick="flip(${i})">${open.includes(i)||c.matched?c.t:'?'}</button>`).join('');document.getElementById('stats').textContent=`المحاولات: ${moves} · الأزواج: ${matched} / ${pairs.length}`}function flip(i){if(open.includes(i)||cards[i].matched||open.length===2)return;open.push(i);draw();if(open.length===2){moves++;const[a,b]=open;if(cards[a].id===cards[b].id){cards[a].matched=cards[b].matched=true;matched++;open=[];draw();if(matched===pairs.length){const r=HMGameRuntime.finish(state,Math.max(0,pairs.length-Math.max(0,moves-pairs.length)),pairs.length);document.getElementById('result').innerHTML=`<h2>🎉 Bravo!</h2><p>Score: ${r.score}% · Accuracy: ${r.accuracy}%</p><p>⭐ +${20+r.bonusXP} XP</p>`;if(!reported&&window.HMActivityComplete){HMActivityComplete.complete(lessonId,activityId,20+r.bonusXP);reported=true}}}else setTimeout(()=>{open=[];draw()},750)}}draw();</script></body></html>
