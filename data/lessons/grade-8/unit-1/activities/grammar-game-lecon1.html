<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Game - Leçon 1</title><style>body{font-family:Arial,Cairo;background:#f4f7fc;padding:20px}.box{max-width:700px;margin:auto;background:#fff;border-radius:24px;padding:24px}.opt{display:block;width:100%;padding:12px;margin:8px;border-radius:12px;border:1px solid #ddd;background:white;cursor:pointer}</style></head><body><div class="box"><h1>🧩 Grammar Game</h1><p>Il y a / Il n'y a pas de</p><h2>اختر الجملة الصحيحة</h2><div id="game"></div><div id="msg"></div></div><script>const q=[['يوجد سبورة','Il y a un tableau.'],['لا يوجد سبورة','Il n’y a pas de tableau.']];document.getElementById('game').innerHTML=q.map(x=>`<button class="opt" onclick="ok('${x[1]}')">${x[1]}</button>`).join('');function ok(x){document.getElementById('msg').textContent='✓ تدريب مكتمل: '+x}</script></body></html>
