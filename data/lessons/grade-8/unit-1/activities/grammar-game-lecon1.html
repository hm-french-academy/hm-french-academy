<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Game - Leçon 1</title><style>body{font-family:Arial,Cairo;background:#f4f7fc;padding:20px}.box{max-width:700px;margin:auto;background:#fff;border-radius:24px;padding:24px}.opt{display:block;width:100%;padding:12px;margin:8px;border-radius:12px;border:1px solid #ddd;background:white;cursor:pointer}.ok{color:#168449;font-weight:900}</style></head><body><div class="box"><h1>🧩 Grammar Game</h1><p>Il y a / Il n'y a pas de</p><h2>اختر الجملة الصحيحة</h2><div id="game"></div><div id="msg"></div><div id="result"></div></div><script src="../../../../scripts/game-scoring.js"></script><script src="../../../../scripts/game-runtime.js"></script><script src="../../../../scripts/activity-complete.js"></script><script>const lessonId='grade8-u1-l1',activityId='grammar-game',q=[['يوجد سبورة','Il y a un tableau.'],['لا يوجد سبورة','Il n’y a pas de tableau.']];let done=new Set(),correct=0,started=HMGameRuntime.start(60),reported=false;function render(){document.getElementById('game').innerHTML=q.map((x,i)=>`<div><strong>${x[0]}</strong>${[x[1],i===0?'Il n’y a pas de tableau.':'Il y a un tableau.'].map(v=>`<button class="opt" onclick="ok(${i},'${v.replace(/'/g,"\\'")}')">${v}</button>`).join('')}</div>`).join('')}function ok(i,x){if(done.has(i))return;const expected=q[i][1];if(x===expected){done.add(i);correct++;document.getElementById('msg').className='ok';document.getElementById('msg').textContent='✓ صحيح';if(correct===q.length){const r=HMGameRuntime.finish(started,correct,q.length);document.getElementById('result').innerHTML=`<h2>🎉 Bravo!</h2><p>Score: ${r.score}% · Accuracy: ${r.accuracy}%</p><p>⭐ +${20+r.bonusXP} XP</p>`;if(!reported&&window.HMActivityComplete){HMActivityComplete.complete(lessonId,activityId,20+r.bonusXP);reported=true}}}else document.getElementById('msg').textContent='حاول مرة أخرى'}render();</script></body></html>
