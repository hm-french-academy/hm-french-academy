<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy Vocabulary Challenge</title><style>body{font-family:Arial,Cairo,sans-serif;background:#f4f7fc;color:#17223b;padding:20px}.box{max-width:700px;margin:auto;background:white;border-radius:24px;padding:24px}.opt{display:block;width:100%;margin:8px 0;padding:12px;border-radius:12px;border:1px solid #ddd;background:white;text-align:right;cursor:pointer}.ok{color:#159447;font-weight:bold}.no{color:#c33;font-weight:bold}</style></head><body><div class="box"><h1>🏫 Vocabulary Challenge</h1><p>Leçon 1 : À l'école</p><div id="game"></div><h3 id="score"></h3></div><script src="../../../../scripts/activity-complete.js"></script><script>
const lessonId='grade8-u1-l1';const activityId='vocabulary-challenge';const q=[['Une bibliothèque',['مكتبة','معمل','فناء'],'مكتبة'],['Un laboratoire',['سبورة','معمل','كرسي'],'معمل'],['Une horloge',['ساعة حائط','باب','كمبيوتر'],'ساعة حائط']];let i=0;let completed=false;function render(){if(i===q.length){document.getElementById('game').innerHTML='<h2>🎉 Bravo!</h2><p>أكملت تحدي المفردات.</p>';document.getElementById('score').textContent='⭐ +20 XP';if(!completed&&window.HMActivityComplete){HMActivityComplete.complete(lessonId,activityId,20);completed=true}return}document.getElementById('game').innerHTML='<h2>'+q[i][0]+'</h2>'+q[i][1].map(x=>`<button class="opt" onclick="answer('${x}')">${x}</button>`).join('')+'<div id="m"></div>'}function answer(x){let m=document.getElementById('m');if(x===q[i][2]){m.className='ok';m.textContent='✓ صحيح';i++;setTimeout(render,500)}else{m.className='no';m.textContent='حاول مرة أخرى'}}render();</script></body></html>
