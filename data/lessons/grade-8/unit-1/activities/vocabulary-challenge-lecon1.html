<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy Vocabulary Challenge</title><style>body{font-family:Arial,Cairo;background:#f4f7fc;padding:20px;color:#17223b}.box{max-width:700px;margin:auto;background:#fff;border-radius:24px;padding:24px}.opt{display:block;width:100%;margin:8px 0;padding:12px;border-radius:12px;border:1px solid #ddd;background:#fff;cursor:pointer}.ok{color:#159447;font-weight:bold}.no{color:#c33;font-weight:bold}</style></head><body><div class="box"><h1>🏫 Vocabulary Challenge</h1><p>Leçon 1 : À l'école</p><div id="game"></div><h3 id="score"></h3></div><script src="../../../../scripts/game-scoring.js"></script><script src="../../../../scripts/game-runtime.js"></script><script src="../../../../scripts/activity-complete.js"></script><script>const lessonId='grade8-u1-l1',activityId='vocabulary-challenge';const q=[['Une bibliothèque',['مكتبة','معمل','فناء'],'مكتبة'],['Un laboratoire',['سبورة','معمل','كرسي'],'معمل'],['Une horloge',['ساعة حائط','باب','كمبيوتر'],'ساعة حائط']];let i=0,correct=0,completed=false,state=HMGameRuntime.start(60);function render(){if(i===q.length){const r=HMGameRuntime.finish(state,correct,q.length);document.getElementById('game').innerHTML='<h2>🎉 Bravo!</h2><p>Score: '+r.score+'%</p><p>Accuracy: '+r.accuracy+'%</p>';document.getElementById('score').textContent='⭐ +'+r.bonusXP+' XP';if(!completed&&window.HMActivityComplete){HMActivityComplete.complete(lessonId,activityId,20+r.bonusXP);completed=true}return}document.getElementById('game').innerHTML='<h2>'+q[i][0]+'</h2>'+q[i][1].map(x=>`<button class="opt" onclick="answer('${x}')">${x}</button>`).join('')+'<div id="m"></div>'}function answer(x){let m=document.getElementById('m');if(x===q[i][2]){correct++;m.className='ok';m.textContent='✓ صحيح';i++;setTimeout(render,500)}else{m.className='no';m.textContent='حاول مرة أخرى'}}render();</script></body></html>
