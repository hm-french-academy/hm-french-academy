<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listening Challenge - Leçon 1</title><style>body{font-family:Arial,Cairo;background:#f4f7fc;padding:20px;color:#17223b}.box{max-width:700px;margin:auto;background:#fff;border-radius:24px;padding:24px}.btn,.opt{padding:12px;border-radius:12px;border:1px solid #ddd;cursor:pointer;margin:6px}.btn{background:#2563eb;color:#fff}.opt{display:block;width:100%;text-align:right;background:#fff}</style></head><body><div class="box"><h1>🎧 Listening Challenge</h1><p>Leçon 1 : À l'école</p><p id="timer"></p><button class="btn" onclick="speak()">🔊 استمع</button><div id="q"></div><div id="msg"></div></div><script src="../../../../scripts/game-scoring.js"></script><script src="../../../../scripts/game-runtime.js"></script><script src="../../../../scripts/activity-complete.js"></script><script>const lessonId='grade8-u1-l1',activityId='listening-challenge',answer='Une bibliothèque';let reported=false,state=HMGameRuntime.start(60),correct=0;function speak(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(answer);u.lang='fr-FR';speechSynthesis.speak(u)}document.getElementById('q').innerHTML=['Une bibliothèque','Un laboratoire','Une piscine'].map(x=>`<button class="opt" onclick="check('${x}')">${x}</button>`).join('');function check(x){const m=document.getElementById('msg');if(x===answer){correct=1;const r=HMGameRuntime.finish(state,correct,1);m.innerHTML=`✓ Bravo! Score ${r.score}% · Accuracy ${r.accuracy}% · ⭐ +${20+r.bonusXP} XP`;if(!reported&&window.HMActivityComplete){HMActivityComplete.complete(lessonId,activityId,20+r.bonusXP);reported=true}}else m.textContent='حاول مرة أخرى'}setInterval(()=>{if(!reported){const s=Math.round((Date.now()-state.started)/1000);timer.textContent='⏱️ '+s+' ثانية'}},1000);</script></body></html>
