<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listening Challenge - Leçon 1</title><style>body{font-family:Arial,Cairo;background:#f4f7fc;padding:20px;color:#17223b}.box{max-width:700px;margin:auto;background:white;border-radius:24px;padding:24px}.btn,.opt{padding:12px;border-radius:12px;border:1px solid #ddd;cursor:pointer;margin:6px}.btn{background:#2563eb;color:#fff}.opt{display:block;width:100%;text-align:right;background:#fff}</style></head><body><div class="box"><h1>🎧 Listening Challenge</h1><p>Leçon 1 : À l'école</p><button class="btn" onclick="speak()">🔊 استمع</button><div id="q"></div><div id="msg"></div></div><script>const answer='Une bibliothèque';function speak(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(answer);u.lang='fr-FR';speechSynthesis.speak(u)}document.getElementById('q').innerHTML=['Une bibliothèque','Un laboratoire','Une piscine'].map(x=>`<button class="opt" onclick="check('${x}')">${x}</button>`).join('');function check(x){document.getElementById('msg').textContent=x===answer?'✓ Bravo! +20 XP':'حاول مرة أخرى'}</script></body></html>
