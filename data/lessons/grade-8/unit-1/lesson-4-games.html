<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | ألعاب Leçon 4</title><style>body{font-family:Arial,Cairo,sans-serif;background:#f4f7fc;color:#17223b;margin:0}main{max-width:900px;margin:auto;padding:20px}.hero,.game{background:#fff;border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:0 10px 30px #14264a12}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#713bd1);color:#fff}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.opt{padding:14px;border:1px solid #dbe4f2;border-radius:14px;background:#fff;font-weight:900}.good{background:#eaf8f0}.bad{background:#fff0f0}@media(max-width:600px){.opts{grid-template-columns:1fr}}</style></head><body><main><section class="hero"><h1>🎮 لعبة المهن والقواعد · Leçon 4</h1><p>اختر الإجابة الصحيحة. اللعبة لا تستخدم أسئلة التقييم الرسمي نفسها.</p></section><section class="game"><h2 id="q"></h2><div id="opts" class="opts"></div><p id="msg"></p><b>النقاط: <span id="s">0</span> · الجولة: <span id="r">0</span>/10</b></section></main><script>const P=[['Un boulanger','Une boulangère'],['Un infirmier','Une infirmière'],['Un acteur','Une actrice'],['Un pharmacien','Une pharmacienne'],['Un cuisinier','Une cuisinière'],['Un policier','Une policière'],['Un vendeur','Une vendeuse'],['Un coiffeur','Une coiffeuse'],['Un mécanicien','Une mécanicienne'],['Un chanteur','Une chanteuse']];let round=0,score=0,cur;function sh(a){return [...a].sort(()=>Math.random()-.5)}function next(){if(round>=10){q.textContent='🏆 انتهت اللعبة';opts.innerHTML='';msg.textContent='نتيجتك: '+score+' / 10';return}round++;r.textContent=round;cur=P[Math.floor(Math.random()*P.length)];q.textContent='ما مؤنث: '+cur[0]+' ؟';let o=sh([cur[1],...sh(P.filter(x=>x[0]!==cur[0])).slice(0,3).map(x=>x[1])]);opts.innerHTML=o.map(x=>'<button class="opt" type="button">'+x+'</button>').join('');[...opts.children].forEach(b=>b.onclick=()=>{[...opts.children].forEach(x=>x.disabled=true);if(b.textContent===cur[1]){score++;b.classList.add('good');msg.textContent='✓ صحيح'}else{b.classList.add('bad');msg.textContent='✗ حاول في الجولة التالية'}s.textContent=score;setTimeout(next,450)})}next()</script></body></html>
