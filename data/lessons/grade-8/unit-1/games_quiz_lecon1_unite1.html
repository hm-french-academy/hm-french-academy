<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Quiz express · Leçon 1</title><style>body{margin:0;background:#f4f7fc;color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:900px;margin:auto;padding:22px 14px 50px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff;border-radius:28px;padding:26px}.q,.score,.finish{background:#fff;border:1px solid #e1e7f0;border-radius:20px;padding:20px;margin-top:16px}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.opt{border:1px solid #d5ddea;border-radius:13px;background:#fff;padding:13px;text-align:right;font-weight:900;cursor:pointer}.opt.selected{border:2px solid #2563eb;background:#edf3ff}.opt.correct{border-color:#20a45a;background:#effaf3}.check{margin-top:12px;border:0;border-radius:13px;padding:12px 18px;background:#713bd1;color:#fff;font-weight:900;cursor:pointer}.answer{min-height:24px;margin-top:8px;font-weight:900}.bar{height:10px;background:#ffffff33;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff;transition:.25s}.finish{text-align:center;display:none}.back{display:block;margin-top:18px;color:#315fc8;font-weight:900;text-decoration:none}@media(max-width:600px){.options{grid-template-columns:1fr}}</style></head>
<body><main class="wrap"><header class="hero"><h1>🎮 Quiz express · Leçon 1</h1><p>تحدٍّ سريع مختلف عن التقييم الرسمي · À l'école</p><div class="bar"><i id="bar"></i></div></header><section id="quiz"></section><div class="score" id="score">النقاط: 0 / 8</div><div class="finish" id="finish"></div><a class="back" href="lesson-1-games.html">← العودة إلى مركز الألعاب</a></main>
<script src="../../../../scripts/game-scoring.js?v=20260811-gamesquiz1"></script><script src="../../../../scripts/game-runtime.js?v=20260811-gamesquiz1"></script><script src="../../../../scripts/activity-complete.js?v=20260811-gamesquiz1"></script>
<script>
const lessonId='grade8-u1-l1',activityId='games-quiz';
const qs=[
 ['أي مكان في المدرسة نتناول فيه الطعام؟',['La cantine','La cour','Le CDI','Le bureau'],'La cantine'],
 ['أي كلمة تعني «قلم»؟',['Une gomme','Un stylo','Une règle','Une chaise'],'Un stylo'],
 ['ما الأداة التي نستخدمها للمحو؟',['Une trousse','Un sac','Une gomme','Un tableau'],'Une gomme'],
 ['اختر الكلمة المناسبة: «Je ___ le français.»',['aime','aimes','aimer','aimons'],'aime'],
 ['أي جملة تعبّر عن عدم وجود شيء؟',['Il y a une cour.','Il n’y a pas de cour.','J’aime la cour.','Je préfère la cour.'],'Il n’y a pas de cour.'],
 ['ما معنى «une trousse»؟',['مقلمة','حقيبة مدرسية','سبورة','كرسي'],'مقلمة'],
 ['أي مادة دراسية وردت في الدرس؟',['Les mathématiques','La musique','La natation','Le théâtre'],'Les mathématiques'],
 ['اختر الجملة الصحيحة: «أنا أفضل الفرنسية.»',['Je préfère le français.','Je préfères le français.','Je préférer le français.','Je préférez le français.'],'Je préfère le français.']
];
let score=0,done=new Set(),selected={};const quiz=document.getElementById('quiz'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),finish=document.getElementById('finish');
function norm(s){return String(s).trim().toLowerCase().replace(/[’]/g,"'").replace(/\s+/g,' ').replace(/[.!؟?]+$/,'')}
function render(){quiz.innerHTML=qs.map((x,i)=>`<article class="q"><h2>${i+1}. اختر الإجابة الصحيحة</h2><p>${x[0]}</p><div class="options">${x[1].map(v=>`<button type="button" class="opt" data-q="${i}" data-value="${encodeURIComponent(v)}">${v}</button>`).join('')}</div><button type="button" class="check" data-check="${i}">تحقق</button><div class="answer" id="a${i}"></div></article>`).join('')}
function choose(i,v,b){if(done.has(i))return;selected[i]=v;document.querySelectorAll(`.opt[data-q="${i}"]`).forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}
function check(i){if(done.has(i))return;const v=selected[i],a=document.getElementById('a'+i);if(!v){a.textContent='اختر إجابة أولًا.';a.style.color='#b17800';return}if(norm(v)===norm(qs[i][2])){done.add(i);score++;a.textContent='✓ ممتاز!';a.style.color='#20a45a';document.querySelectorAll(`.opt[data-q="${i}"]`).forEach(b=>{b.disabled=true;if(decodeURIComponent(b.dataset.value)===qs[i][2])b.classList.add('correct')});document.querySelector(`[data-check="${i}"]`).disabled=true}else{a.textContent='✗ حاول مرة أخرى.';a.style.color='#d14b4b'}scoreEl.textContent=`النقاط: ${score} / ${qs.length}`;bar.style.width=(done.size/qs.length*100)+'%';if(done.size===qs.length)complete()}
function complete(){const r=window.HMGameRuntime?HMGameRuntime.finish({started:Date.now()-60000,limit:60},score,qs.length):{bonusXP:20};finish.style.display='block';finish.innerHTML=`🏆 أحسنت!<br>أكملت الـ Quiz express بنتيجة <strong>${Math.round(score/qs.length*100)}%</strong><br>⭐ +${r.bonusXP||20} XP`;if(window.HMActivityComplete)HMActivityComplete.complete(lessonId,activityId,r.bonusXP||20)}
quiz.addEventListener('click',e=>{const o=e.target.closest('.opt');if(o)choose(Number(o.dataset.q),decodeURIComponent(o.dataset.value),o);const c=e.target.closest('[data-check]');if(c)check(Number(c.dataset.check))});render();
</script></body></html>
