<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Memory Game</title><style>body{font-family:Arial,Cairo,sans-serif;background:#f4f7fc;color:#17223b}.wrap{max-width:900px;margin:auto;padding:20px}.hero,.card{background:white;border-radius:22px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tile{height:80px;border:0;border-radius:16px;background:#2563eb;color:white;font-size:18px;font-weight:bold;cursor:pointer}.open{background:white;color:#17223b;border:2px solid #2563eb}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><section class="hero"><h1>🧩 Memory Game</h1><p>Leçon 1 : À l'école · مطابقة المفردات</p><p id="status">ابحث عن الأزواج المتطابقة</p></section><section class="card"><div class="grid" id="game"></div></section><script src="../../../../scripts/memory-game-runtime.js"></script><script>const items=['cantine','🏫','bibliothèque','📚','classe','🪑','piscine','🏊'];let cards=[...items,...items].sort(()=>Math.random()-0.5);let first=null,second=null,lock=false,found=0,moves=0;const game=document.getElementById('game');function render(){game.innerHTML=cards.map((x,i)=>`<button class="tile" onclick="flip(${i})" id="c${i}">?</button>`).join('')}function flip(i){if(lock||document.getElementById('c'+i).classList.contains('open'))return;const b=document.getElementById('c'+i);b.textContent=cards[i];b.classList.add('open');if(first===null){first=i}else{second=i;moves++;lock=true;setTimeout(()=>{if(cards[first]===cards[second]){found+=2}else{document.getElementById('c'+first).textContent='?';document.getElementById('c'+second).textContent='?';document.getElementById('c'+first).classList.remove('open');document.getElementById('c'+second).classList.remove('open')}first=null;second=null;lock=false;if(found===cards.length){const r=HMMemoryGame.finish('grade8-u1-l1',moves,4);document.getElementById('status').textContent='🎉 اكتملت اللعبة +'+r.xp+' XP'}} ,700)}}render();</script></main></body></html>
