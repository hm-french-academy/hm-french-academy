<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Memory · Leçon 1</title><style>body{margin:0;background:linear-gradient(180deg,#f5f8fd,#edf3fb);font-family:Arial,Cairo,sans-serif;color:#17223b}.wrap{max-width:950px;margin:auto;padding:20px}.hero,.card{background:#fff;border-radius:24px;padding:20px;margin-bottom:18px;border:1px solid #e2e8f2;box-shadow:0 10px 28px #14264a0d}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#713bd1);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tile{min-height:105px;border:0;border-radius:18px;background:#2563eb;color:white;font-size:18px;font-weight:bold;cursor:pointer;padding:10px;display:flex;align-items:center;justify-content:center}.tile .face{font-size:42px;display:block}.tile .meaning{font-size:20px;line-height:1.35}.open{background:#fff;color:#17223b;border:2px solid #2563eb}.matched{background:#eaf8f5;color:#16796b;border:2px solid #20a45a}.restart{margin-top:14px;border:0;background:#713bd1;color:#fff;padding:12px 18px;border-radius:12px;font-weight:900;cursor:pointer}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.tile{min-height:105px}}</style></head><body><main class="wrap"><section class="hero"><h1>🧩 Memory · صورة ↔ معنى</h1><p>اقلب البطاقات وابحث عن الصورة والمعنى الفرنسي المتطابقين.</p><p id="status">تذكّر مكان الصور والمعاني ثم طابق كل صورة مع معناها.</p></section><section class="card"><div class="grid" id="game"></div><button class="restart" onclick="start()">جولة جديدة</button></section></main><script src="../../../../scripts/memory-game-runtime.js?v=20260906-memory5"></script><script>const lessonId='grade8-u1-l1',activityId='memory-game',items=[['cantine','🍽️','La cantine'],['cour','🏫','La cour'],['tableau','🖼️','Le tableau'],['chaise','🪑','La chaise'],['bibliothèque','📖','La bibliothèque'],['gymnase','🤸','Le gymnase'],['laboratoire','🧪','Le laboratoire'],['terrain','⚽','Le terrain']];let cards=[],first=null,second=null,lock=false,found=0,moves=0;const game=document.getElementById('game'),status=document.getElementById('status');function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}function start(){cards=[];items.forEach(x=>{cards.push({key:x[0],kind:'image',face:x[1]});cards.push({key:x[0],kind:'meaning',face:x[2]})});cards=shuffle(cards);first=null;second=null;lock=false;found=0;moves=0;render();status.textContent='تذكّر مكان الصور والمعاني ثم طابق كل صورة مع معناها.'}function render(){game.innerHTML=cards.map((x,i)=>`<button class="tile" onclick="flip(${i})" id="c${i}" aria-label="بطاقة ${i+1}"><span class="face">${x.matched?display(x):(first===i||second===i?display(x):'?')}</span></button>`).join('')}function display(x){return x.kind==='image'?x.face:`<span class="meaning">${x.face}</span>`}function flip(i){if(lock||cards[i].matched||first===i||second===i)return;const b=document.getElementById('c'+i),x=cards[i];b.innerHTML=display(x);b.classList.add('open');if(first===null){first=i;return}second=i;moves++;lock=true;setTimeout(()=>{const same=cards[first].key===cards[second].key&&cards[first].kind!==cards[second].kind;if(same){cards[first].matched=cards[second].matched=true;document.getElementById('c'+first).classList.add('matched');document.getElementById('c'+second).classList.add('matched');found+=2;status.textContent='✓ ممتاز! الصورة والمعنى متطابقان.'}else{document.getElementById('c'+first).innerHTML='<span class="face">?</span>';document.getElementById('c'+second).innerHTML='<span class="face">?</span>';document.getElementById('c'+first).classList.remove('open');document.getElementById('c'+second).classList.remove('open');status.textContent='ليستا زوجًا صحيحًا، جرّب مرة أخرى.'}first=second=null;lock=false;if(found===cards.length){const res=window.HMMemoryGame?.finish?.(lessonId,moves,items.length)||{xp:20};status.textContent='🎉 أحسنت! اكتملت اللعبة · +'+(res.xp||20)+' XP'}},650)}start();</script></body></html>
