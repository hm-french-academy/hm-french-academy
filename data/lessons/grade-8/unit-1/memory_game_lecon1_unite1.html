<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Memory · Leçon 1</title><style>body{margin:0;background:linear-gradient(180deg,#f5f8fd,#edf3fb);font-family:Arial,Cairo,sans-serif;color:#17223b}.wrap{max-width:950px;margin:auto;padding:20px}.hero,.card{background:#fff;border-radius:24px;padding:20px;margin-bottom:18px;border:1px solid #e2e8f2;box-shadow:0 10px 28px #14264a0d}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#713bd1);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tile{min-height:105px;border:0;border-radius:18px;background:#2563eb;color:white;font-size:18px;font-weight:bold;cursor:pointer;padding:10px}.tile .face{font-size:42px;display:block;margin-bottom:5px}.open{background:#fff;color:#17223b;border:2px solid #2563eb}.matched{background:#eaf8f5;color:#16796b;border:2px solid #20a45a}.meaning{font-size:14px;font-weight:900}.restart{margin-top:14px;border:0;background:#713bd1;color:#fff;padding:12px 18px;border-radius:12px;font-weight:900;cursor:pointer}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.tile{min-height:95px}}</style></head><body><main class="wrap"><section class="hero"><h1>🧩 Memory · صورة ↔ معنى</h1><p>بدل تكرار الكلمة نفسها، تعلّم من الصورة ثم ابحث عن المعنى العربي الصحيح.</p><p id="status">اقلب بطاقة صورة، ثم ابحث عن معناها.</p></section><section class="card"><div class="grid" id="game"></div><button class="restart" onclick="start()">جولة جديدة</button></section></main><script src="../../../../scripts/memory-game-runtime.js?v=20260814-memory2"></script><script>const items=[['cantine','مكان تناول الطعام','🍽️'],['cour','الفناء المدرسي','🏫'],['tableau','السبورة','🖼️'],['chaise','كرسي','🪑'],['bibliothèque','المكتبة','📖'],['gymnase','صالة الألعاب','🤸'],['laboratoire','المعمل','🧪'],['terrain','أرض الملعب','⚽']];let cards=[],first=null,second=null,lock=false,found=0,moves=0;const game=document.getElementById('game'),status=document.getElementById('status');function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(){cards=[];items.forEach(x=>{cards.push({key:x[0],type:'image',face:x[2]});cards.push({key:x[0],type:'meaning',face:x[1]})});cards=shuffle(cards);first=second=null;lock=false;found=0;moves=0;render();status.textContent='اقلب بطاقة صورة، ثم ابحث عن معناها.'}function render(){game.innerHTML=cards.map((x,i)=>`<button class="tile" onclick="flip(${i})" id="c${i}"><span class="face">?</span></button>`).join('')}function flip(i){const b=document.getElementById('c'+i);if(lock||b.classList.contains('open')||b.classList.contains('matched'))return;const x=cards[i];b.innerHTML=x.type==='image'?`<span class="face">${x.face}</span><span>صورة</span>`:`<span class="meaning">${x.face}</span>`;b.classList.add('open');if(first===null){first=i;return}second=i;moves++;lock=true;setTimeout(()=>{const same=cards[first].key===cards[second].key&&first!==second;if(same){document.getElementById('c'+first).classList.add('matched');document.getElementById('c'+second).classList.add('matched');found+=2;status.textContent='✓ ممتاز! صورة ومعنى متطابقان.'}else{document.getElementById('c'+first).innerHTML='<span class="face">?</span>';document.getElementById('c'+second).innerHTML='<span class="face">?</span>';document.getElementById('c'+first).classList.remove('open');document.getElementById('c'+second).classList.remove('open');status.textContent='حاول تذكر الصورة ومعناها.'}first=second=null;lock=false;if(found===cards.length){const r=window.HMMemoryGame?.finish?.('grade8-u1-l1',moves,4)||{xp:20};status.textContent='🎉 اكتملت اللعبة · +'+(r.xp||20)+' XP'}},600)}start();</script></body></html>
