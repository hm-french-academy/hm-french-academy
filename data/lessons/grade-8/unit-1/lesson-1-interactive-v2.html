<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Leçon 1 — À l'école</title><style>:root{--navy:#14264a;--blue:#2563eb;--pink:#e92d83;--purple:#713bd1;--green:#20a45a;--line:#e3e8f1;--muted:#6b7890;--ink:#17223b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7f9fd,#eef3fb);color:var(--ink);font-family:Arial,"Cairo",sans-serif}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 24px;position:sticky;top:0;z-index:20}.brand{font-weight:900;color:var(--navy);font-size:18px}.brand a{color:inherit;text-decoration:none}.mark{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;margin-left:8px}.topnav{display:flex;gap:18px;margin:auto}.topnav a{text-decoration:none;color:#536078;font-weight:800;font-size:13px}.xp{padding:8px 13px;border:1px solid #efd27d;border-radius:17px;background:#fffaf0;color:#886416;font-weight:800}.avatar{font-size:22px;text-decoration:none}.main{max-width:1120px;margin:auto;padding:22px 14px 50px}.crumb{font-size:12px;color:#77839a;margin-bottom:14px}.crumb a{color:#315aa4;text-decoration:none;font-weight:800}.hero{background:linear-gradient(135deg,#173a82,#2563eb 58%,#14b8a6);color:#fff;border-radius:30px;padding:28px;display:flex;align-items:center;justify-content:space-between;gap:18px;box-shadow:0 20px 50px #2563eb2b}.hero h1{margin:0;font-size:40px}.hero p{margin:8px 0;opacity:.92}.hero-art{width:210px;height:135px;border-radius:24px;background:#ffffff24;display:grid;place-items:center;font-size:76px}.tabs{display:flex;gap:7px;overflow:auto;margin:18px 0 14px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:18px}.tab{border:0;background:transparent;color:#58647b;padding:12px 16px;border-radius:14px;font-weight:900;white-space:nowrap;cursor:pointer}.tab.active{background:var(--pink);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 14px 40px #14264a14}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}.head h2{margin:0;color:var(--navy);font-size:30px}.head p{margin:6px 0;color:var(--muted);font-size:13px;line-height:1.7}.listen,.speak,.learn,.file-btn,.dialog-btn{border:0;border-radius:13px;padding:11px 14px;font-weight:900;cursor:pointer}.listen{background:#edf3ff;color:#2850a3}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.word{border:1px solid var(--line);border-radius:22px;padding:12px;text-align:center;background:#fff;box-shadow:0 8px 22px #14264a0f}.pic{height:180px;border-radius:18px;background:linear-gradient(145deg,#eef4ff,#fff2f8);display:grid;place-items:center;font-size:88px;cursor:pointer}.pic-hint{font-size:10px;color:#7a8497;margin-top:6px}.fr{font-weight:900;font-size:22px;margin-top:9px;direction:ltr}.ar{color:#2d59a5;font-weight:900;font-size:18px;margin:5px 0}.example{background:#f7f9fd;border-right:4px solid var(--pink);padding:11px 14px;border-radius:12px;margin:10px 0;line-height:1.7;direction:ltr;text-align:left}.example-ar{direction:rtl;text-align:right;color:#66738a;font-size:12px}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.speak{background:var(--pink);color:#fff}.learn{background:#edf8f1;color:#197441}.learn.done{background:#dff5e7}.section-note{padding:14px 16px;border-radius:16px;background:#f7f9fd;border:1px solid var(--line);color:#5d6a80;line-height:1.8;margin-bottom:16px}.grammar-grid,.dialogue,.files{display:grid;gap:16px}.rule-card,.dialog-card,.file-card{border:1px solid var(--line);border-radius:20px;padding:20px;background:#fff}.rule-card h3,.dialog-card h3,.file-card h3{margin-top:0;color:var(--navy)}.formula{direction:ltr;text-align:left;background:#f7f9fd;border-radius:16px;padding:16px;line-height:2;font-weight:800}.explain{line-height:1.9;color:#536078}.dialog-line{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;background:#f8faff;margin:8px 0}.dialog-line strong{min-width:85px;color:#2850a3}.dialog-btn{background:#edf3ff;color:#2850a3}.video-card{border-radius:22px;background:linear-gradient(135deg,#111d39,#263d72);color:#fff;padding:24px}.video-art{height:230px;border-radius:18px;background:linear-gradient(135deg,#314b82,#16a394);display:grid;place-items:center;font-size:92px;margin:14px 0}.primary{display:block;text-align:center;padding:13px;border-radius:13px;background:var(--purple);color:#fff;text-decoration:none;font-weight:900}.file-card{display:flex;gap:16px;align-items:center}.file-icon{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;font-size:28px;background:#edf3ff;flex:none}.file-btn{background:var(--blue);color:#fff;text-decoration:none;display:inline-block}.back-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.back-row a{display:inline-flex;text-decoration:none;padding:11px 15px;border-radius:13px;background:#fff;border:1px solid var(--line);color:#263a60;font-weight:900}@media(max-width:650px){.top{height:62px;padding:8px 12px}.topnav{display:none}.xp{margin-right:auto;font-size:11px}.main{padding:12px 8px 35px}.hero{display:block;padding:20px}.hero h1{font-size:30px}.hero-art{width:100%;height:105px;margin-top:14px}.panel{padding:14px;border-radius:19px}.grid{grid-template-columns:1fr}.pic{height:170px}.head{display:block}.listen{width:100%;margin-top:10px}.file-card{align-items:flex-start;flex-wrap:wrap}}</style></head><body><header class="top"><div class="brand"><a href="../../../../index.html"><span class="mark">HM</span>HM ACADEMY</a></div><nav class="topnav"><a href="../../../../index.html">الرئيسية</a><a href="../../../../course.html">المسارات</a><a href="../../../../library.html">المكتبة</a><a href="../../../../dashboard.html">التقدم</a><a href="../../../../settings.html">الإعدادات</a></nav><div class="xp">⭐ 0 XP</div><a class="avatar" href="../../../../student-profile.html">👨‍🎓</a></header><main class="main"><div class="crumb"><a href="../../../../index.html">الرئيسية</a> › <a href="../../../../grade-8.html">الصف الثاني الإعدادي</a> › الوحدة الأولى › <strong>الدرس الأول</strong></div><section class="hero"><div><h1>Leçon 1 : <span style="color:#ffd7e9">À l'école</span></h1><p>Français — 2e année préparatoire</p><p>مرافق المدرسة والفصل · نطق · قاعدة · محادثة · تدريب</p></div><div class="hero-art">🏫</div></section><nav class="tabs" id="tabs"></nav><section class="panel" id="panel"></section><div class="back-row"><a href="../../../../grade-8.html#unit-1">← العودة إلى الوحدة</a><a href="../../../../index.html">⌂ الرئيسية</a><a href="../../../../dashboard.html">📈 لوحة الطالب</a></div></main><script>const vocab={facilities:[["Une cantine","كانتين","🍽️","Je mange à la cantine.","أنا آكل في الكانتين."],["Une cour","فناء","🏫","Je joue dans la cour.","ألعب في الفناء."],["Des classes","فصول","🚪","Il y a des classes dans l'école.","توجد فصول في المدرسة."],["Un gymnase","صالة ألعاب مغطاة","🤸","Je fais du sport au gymnase.","أمارس الرياضة في صالة الألعاب."],["Un CDI","صالة الوسائط المتعددة","📚","Je vais au CDI.","أذهب إلى صالة الوسائط."],["Un laboratoire","معمل","🧪","Nous travaillons au laboratoire.","نعمل في المعمل."],["Un terrain de sport","أرض الملعب","⚽","Je joue sur le terrain de sport.","ألعب في الملعب."],["Une bibliothèque","مكتبة","📖","Je lis à la bibliothèque.","أقرأ في المكتبة."]],classroom:[["Un bureau","مكتب","🗄️","Le professeur est devant son bureau.","المعلم أمام مكتبه."],["Un tableau","سبورة","🖼️","Le tableau est dans la classe.","السبورة في الفصل."],["Une porte","باب","🚪","La porte est ouverte.","الباب مفتوح."],["Une fenêtre","شباك","🪟","La fenêtre est grande.","الشباك كبير."],["Un banc","مقعد","💺","Je m'assois sur un banc.","أجلس على مقعد."],["Un panneau","لوحة تعليمية","📌","Il y a un panneau dans la classe.","توجد لوحة تعليمية في الفصل."],["Un TNI","سبورة ذكية","🖥️","Le professeur utilise le TNI.","المعلم يستخدم السبورة الذكية."],["Une horloge","ساعة حائط","🕐","L'horloge est au mur.","الساعة على الحائط."]]};const tabs=document.getElementById('tabs'),panel=document.getElementById('panel');const sections=[['facilities','🏫','المرافق'],['classroom','🪑','في الفصل'],['grammar','📘','قاعدة الدرس'],['dialogue','💬','محادثة'],['video','🎬','الفيديو'],['files','📁','ملفات الدرس'],['games','🎮','الألعاب']];function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.86;speechSynthesis.speak(u)}function learned(id,i){return localStorage.getItem('hm_vocab_'+id+'_'+i)==='1'}function mark(id,i,b){localStorage.setItem('hm_vocab_'+id+'_'+i,'1');b.textContent='✓ تم التعلم';b.classList.add('done')}function vocabSection(id,title){const a=vocab[id];return `<div class="head"><div><h2>${title}</h2><p>هذه مفردات الدرس نفسه فقط. لا توجد هنا مواد دراسية؛ <b>Les matières scolaires</b> تخص الدرس الثالث.</p></div><button class="listen" onclick='speak(${JSON.stringify(a.map(x=>x[0]).join('. '))})'>🔊 استمع للمجموعة</button></div><div class="grid">${a.map((x,i)=>`<article class="word"><div class="pic" onclick='speak(${JSON.stringify(x[0])})'>${x[2]}</div><div class="pic-hint">اضغط الصورة لسماع الكلمة</div><div class="fr">${x[0]}</div><div class="ar">${x[1]}</div><div class="example">${x[3]}<div class="example-ar">${x[4]}</div></div><div class="actions"><button class="speak" onclick='speak(${JSON.stringify(x[0])})'>🔊 نطق الكلمة</button><button class="speak" onclick='speak(${JSON.stringify(x[3])})'>▶ نطق المثال</button><button class="learn ${learned(id,i)?'done':''}" onclick='mark(${JSON.stringify(id)},${i},this)'>${learned(id,i)?'✓ تم التعلم':'☆ حفظ كمكتسبة'}</button></div></article>`).join('')}</div>`}function grammar(){return `<div class="head"><div><h2>📘 قاعدة الدرس: Il y a / Il n'y a pas de</h2><p>قاعدة مرتبطة مباشرة بوصف مرافق المدرسة والفصل.</p></div><button class="listen" onclick='speak("Il y a une cantine. Il y a un tableau. Il n'y a pas de laboratoire.")'>🔊 نطق أمثلة القاعدة</button></div><div class="grammar-grid"><article class="rule-card"><h3>1. الإثبات</h3><p class="explain">نستخدم <b>Il y a</b> عندما نقول إن شيئًا موجود.</p><div class="formula">Il y a + un / une / des + nom</div><p>Il y a une cantine. — يوجد كانتين.</p><button class="speak" onclick='speak("Il y a une cantine.")'>🔊 اسمع الجملة</button></article><article class="rule-card"><h3>2. النفي</h3><p class="explain">نستخدم <b>Il n'y a pas de</b> عندما نقول إن الشيء غير موجود.</p><div class="formula">Il n'y a pas de + nom</div><p>Il n'y a pas de piscine. — لا يوجد حمام سباحة.</p><button class="speak" onclick='speak("Il n'y a pas de piscine.")'>🔊 اسمع الجملة</button></article><article class="rule-card"><h3>3. تدريب سريع</h3><p class="explain">اختر الصيغة المناسبة:</p><div class="actions"><button class="learn" onclick="this.textContent='✓ Il y a un tableau.'">صورة لسبورة →</button><button class="learn" onclick="this.textContent='✓ Il n\'y a pas de piscine.'">لا توجد حمام سباحة →</button></div></article></div>`}function dialogue(){const lines=[['👩 Sara','Bonjour ! Tu aimes ton école ?','مرحبًا! هل تحب مدرستك؟'],['👦 Adam','Oui, j\'aime mon école. Il y a une grande cour.','نعم، أحب مدرستي. يوجد فناء كبير.'],['👩 Sara','Et où est la cantine ?','وأين الكانتين؟'],['👦 Adam','La cantine est près des classes. Je mange avec mes amis.','الكانتِين بجوار الفصول. آكل مع أصدقائي.'],['👩 Sara','Super ! On va à la bibliothèque ?','رائع! هل نذهب إلى المكتبة؟'],['👦 Adam','Oui, allons-y !','نعم، هيا بنا!']];return `<div class="head"><div><h2>💬 Mission Dialogue</h2><p>محادثة قصيرة بين شخصين حول المدرسة. استمع لكل جملة ثم جرّب تقليد النطق.</p></div><button class="listen" onclick='speak(${JSON.stringify(lines.map(x=>x[1]).join(' '))})'>🔊 استمع للمحادثة كاملة</button></div><div class="dialogue"><article class="dialog-card"><h3>🎭 Sara & Adam</h3>${lines.map(x=>`<div class="dialog-line"><strong>${x[0]}</strong><div><div dir="ltr">${x[1]}</div><small>${x[2]}</small><br><button class="dialog-btn" onclick='speak(${JSON.stringify(x[1])})'>🔊 اسمع</button></div></div>`).join('')}</article></div>`}function video(){return `<div class="video-card"><h2>🎬 Lexique de l'école</h2><p>شاهد واستمع إلى المفردات في سياق الدرس.</p><div class="video-art">🏫▶️</div><a class="primary" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=ii5J7ZMT5EY">▶ مشاهدة الفيديو على YouTube</a></div>`}function files(){return `<div class="head"><div><h2>📁 ملفات الدرس</h2><p>تم فصل ملفات الدرس عن بعضها لتعرف وظيفة كل ملف قبل فتحه.</p></div></div><div class="files">${[['🧠','الملف التفاعلي','شرح + مفردات + قواعد + محادثة + تدريب','lesson-1-interactive-v2.html'],['📖','الملف المرجعي','مرجع للمراجعة والطباعة','reference_lecon1_unite1.html'],['📝','التقييم الرسمي','قياس أكاديمي مستقل','formal_assessment_lecon1_unite1.html'],['💻','الاختبار الإلكتروني','اختبار تفاعلي مستقل','examen_u1-l1.html'],['🎮','الألعاب التعليمية','ألعاب وتحديات بدون تكرار التقييم','lesson-1-games.html']].map(x=>`<article class="file-card"><div class="file-icon">${x[0]}</div><div><h3>${x[1]}</h3><p>${x[2]}</p><a class="file-btn" href="${x[3]}">فتح الملف</a></div></article>`).join('')}</div>`}function games(){return `<div class="head"><div><h2>🎮 مركز الألعاب</h2><p>كل لعبة لها هدف بصري مختلف حتى تعرف نوع النشاط فور رؤيتها.</p></div></div><div class="files"><article class="file-card"><div class="file-icon">🧩</div><div><h3>Memory — صورة ← معنى</h3><p>طابق صورة المفردة مع معناها، لا تكرر الكلمة نفسها.</p><a class="file-btn" href="memory_game_lecon1_unite1.html">ابدأ</a></div></article><article class="file-card"><div class="file-icon">🎯</div><div><h3>Word Catch — التقاط الصورة</h3><p>تظهر صورة، ثم تلتقط الكلمة الفرنسية الصحيحة.</p><a class="file-btn" href="word_catch_lecon1_unite1.html">ابدأ</a></div></article><article class="file-card"><div class="file-icon">🧲</div><div><h3>Drag & Drop — التصنيف</h3><p>صنّف الصور والكلمات في الفئة الصحيحة.</p><a class="file-btn" href="drag_drop_lecon1_unite1.html">ابدأ</a></div></article><article class="file-card"><div class="file-icon">📚</div><div><h3>Vocabulary Challenge</h3><p>صورة ثم اختر المعنى المناسب، مع مثال ونطق.</p><a class="file-btn" href="vocabulary_challenge_lecon1_unite1.html">ابدأ</a></div></article></div>`}function render(id){const s=sections.find(x=>x[0]===id)||sections[0];tabs.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.id===id));panel.innerHTML=id==='facilities'?vocabSection('facilities','🏫 مرافق المدرسة'):id==='classroom'?vocabSection('classroom','🪑 في الفصل'):id==='grammar'?grammar():id==='dialogue'?dialogue():id==='video'?video():id==='files'?files():games()}sections.forEach(([id,icon,label])=>{const b=document.createElement('button');b.className='tab';b.dataset.id=id;b.textContent=icon+' '+label;b.onclick=()=>render(id);tabs.appendChild(b)});render('facilities');</script></body></html>
