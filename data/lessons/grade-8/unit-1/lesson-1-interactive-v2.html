<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Leçon 1 — À l'école</title><style>:root{--navy:#14264a;--blue:#2563eb;--pink:#e92d83;--purple:#713bd1;--teal:#14b8a6;--green:#20a45a;--red:#d9534f;--line:#e2e8f2;--muted:#68758c;--ink:#17223b;--soft:#f7f9fd}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7f9fd,#edf3fb);color:var(--ink);font-family:Arial,"Cairo",sans-serif}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 24px;position:sticky;top:0;z-index:20}.brand{font-weight:900;color:var(--navy);font-size:18px}.brand a{color:inherit;text-decoration:none}.mark{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;margin-left:8px}.topnav{display:flex;gap:18px;margin:auto}.topnav a{text-decoration:none;color:#536078;font-weight:800;font-size:13px}.xp{padding:8px 13px;border:1px solid #efd27d;border-radius:17px;background:#fffaf0;color:#886416;font-weight:800}.avatar{font-size:22px;text-decoration:none}.main{max-width:1120px;margin:auto;padding:22px 14px 55px}.crumb{font-size:12px;color:#77839a;margin-bottom:14px}.crumb a{color:#315aa4;text-decoration:none;font-weight:800}.hero{background:linear-gradient(135deg,#173a82,#2563eb 55%,#14b8a6);color:#fff;border-radius:30px;padding:28px;display:flex;align-items:center;justify-content:space-between;gap:18px;box-shadow:0 20px 50px #2563eb2b}.hero h1{margin:0;font-size:40px}.hero p{margin:8px 0;opacity:.94;line-height:1.7}.hero-art{width:210px;height:135px;border-radius:24px;background:#ffffff24;display:grid;place-items:center;font-size:76px}.tabs{display:flex;gap:7px;overflow:auto;margin:18px 0 14px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:18px}.tab{border:0;background:transparent;color:#58647b;padding:12px 15px;border-radius:14px;font-weight:900;white-space:nowrap;cursor:pointer}.tab.active{background:var(--pink);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 14px 40px #14264a14}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}.head h2{margin:0;color:var(--navy);font-size:30px}.head p{margin:6px 0;color:var(--muted);font-size:13px;line-height:1.8}.listen,.speak,.learn,.file-btn,.dialog-btn,.check,.primary{border:0;border-radius:13px;padding:11px 14px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.listen{background:#edf3ff;color:#2850a3}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.word{border:1px solid var(--line);border-radius:22px;padding:12px;text-align:center;background:#fff;box-shadow:0 8px 22px #14264a0f}.pic{height:190px;border-radius:19px;background:linear-gradient(145deg,#eef4ff,#fff2f8);display:grid;place-items:center;font-size:88px;cursor:pointer;transition:.2s}.pic:hover{transform:translateY(-2px);box-shadow:0 10px 22px #14264a18}.pic-hint{font-size:10px;color:#7a8497;margin-top:6px}.fr{font-weight:900;font-size:22px;margin-top:9px;direction:ltr}.ar{color:#2d59a5;font-weight:900;font-size:18px;margin:5px 0}.example{background:var(--soft);border-right:4px solid var(--pink);padding:12px 14px;border-radius:12px;margin:10px 0;line-height:1.75;direction:ltr;text-align:left}.example-ar{direction:rtl;text-align:right;color:#66738a;font-size:12px;margin-top:4px}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.speak{background:var(--pink);color:#fff}.learn{background:#edf8f1;color:#197441}.learn.done{background:#dff5e7}.note{padding:15px 17px;border-radius:16px;background:var(--soft);border:1px solid var(--line);color:#5d6a80;line-height:1.85;margin-bottom:16px}.grammar-grid,.dialogue,.files,.practice-list{display:grid;gap:16px}.rule-card,.dialog-card,.file-card,.exercise{border:1px solid var(--line);border-radius:20px;padding:20px;background:#fff}.rule-card h3,.dialog-card h3,.file-card h3,.exercise h3{margin-top:0;color:var(--navy)}.formula{direction:ltr;text-align:left;background:var(--soft);border-radius:16px;padding:16px;line-height:2;font-weight:800}.explain{line-height:1.95;color:#536078}.rule-step{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;margin:12px 0}.rule-num{width:44px;height:44px;border-radius:14px;background:#edf3ff;color:#2850a3;display:grid;place-items:center;font-weight:900}.dialog-line{display:flex;gap:10px;align-items:flex-start;padding:13px;border-radius:14px;background:#f8faff;margin:8px 0}.dialog-line strong{min-width:85px;color:#2850a3}.dialog-btn{background:#edf3ff;color:#2850a3}.video-card{border-radius:22px;background:linear-gradient(135deg,#111d39,#263d72);color:#fff;padding:24px}.video-art{height:230px;border-radius:18px;background:linear-gradient(135deg,#314b82,#16a394);display:grid;place-items:center;font-size:92px;margin:14px 0}.primary{background:var(--purple);color:#fff;text-align:center}.file-card{display:flex;gap:16px;align-items:center}.file-icon{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:#edf3ff;flex:none}.file-btn{background:var(--blue);color:#fff}.question-meta{display:flex;justify-content:space-between;gap:10px;color:#68758c;font-weight:900;font-size:13px;margin-bottom:10px}.question-card{background:linear-gradient(145deg,#fbfcff,#f6f8fd);border:1px solid var(--line);border-radius:18px;padding:18px}.question-image{height:155px;border-radius:18px;background:linear-gradient(145deg,#eef4ff,#fff2f8);display:grid;place-items:center;font-size:72px;margin:12px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{border:1px solid #d7dfeb;background:#fff;border-radius:13px;padding:13px;font-weight:900;cursor:pointer}.option:hover{border-color:var(--blue);background:#f5f8ff}.option.correct{background:#eaf8f1;border-color:var(--green);color:#197441}.option.wrong{background:#fff3f3;border-color:var(--red);color:#a33b36}.feedback{min-height:25px;margin-top:10px;font-weight:900}.next{background:var(--blue);color:#fff}.score{padding:14px;border-radius:15px;background:var(--soft);text-align:center;font-weight:900;color:#59677e}.back-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.back-row a{display:inline-flex;text-decoration:none;padding:11px 15px;border-radius:13px;background:#fff;border:1px solid var(--line);color:#263a60;font-weight:900}@media(max-width:650px){.top{height:62px;padding:8px 12px}.topnav{display:none}.xp{margin-right:auto;font-size:11px}.main{padding:12px 8px 35px}.hero{display:block;padding:20px}.hero h1{font-size:30px}.hero-art{width:100%;height:105px;margin-top:14px}.panel{padding:14px;border-radius:19px}.grid{grid-template-columns:1fr}.pic{height:175px}.head{display:block}.listen{width:100%;margin-top:10px}.file-card{align-items:flex-start;flex-wrap:wrap}.options{grid-template-columns:1fr}.question-image{height:135px}}
</style></head><body><header class="top"><div class="brand"><a href="../../../../index.html"><span class="mark">HM</span>HM ACADEMY</a></div><nav class="topnav"><a href="../../../../index.html">الرئيسية</a><a href="../../../../course.html">المسارات</a><a href="../../../../library.html">المكتبة</a><a href="../../../../dashboard.html">التقدم</a><a href="../../../../settings.html">الإعدادات</a></nav><div class="xp">⭐ 0 XP</div><a class="avatar" href="../../../../student-profile.html">👨‍🎓</a></header><main class="main"><div class="crumb"><a href="../../../../index.html">الرئيسية</a> › <a href="../../../../grade-8.html">الصف الثاني الإعدادي</a> › الوحدة الأولى › <strong>الدرس الأول</strong></div><section class="hero"><div><h1>Leçon 1 : <span style="color:#ffd7e9">À l'école</span></h1><p>Français — 2e année préparatoire</p><p>🏫 مرافق المدرسة · 🪑 الفصل · 📘 القاعدة · 💬 المحادثة · 🎯 التدريب</p></div><div class="hero-art">🏫</div></section><nav class="tabs" id="tabs"></nav><section class="panel" id="panel"></section><div class="back-row"><a href="../../../../grade-8.html#unit-1">← العودة إلى الوحدة</a><a href="../../../../index.html">⌂ الرئيسية</a><a href="../../../../dashboard.html">📈 لوحة الطالب</a></div></main><script>const vocab={facilities:[["Une cantine","كانتين","🍽️","Je mange à la cantine.","أنا آكل في الكانتين."],["Une cour","فناء","🏫","Je joue dans la cour.","ألعب في الفناء."],["Des classes","فصول","🚪","Il y a des classes dans l'école.","توجد فصول في المدرسة."],["Un gymnase","صالة ألعاب مغطاة","🤸","Je fais du sport au gymnase.","أمارس الرياضة في صالة الألعاب."],["Un CDI","صالة الوسائط المتعددة","📚","Je vais au CDI.","أذهب إلى صالة الوسائط."],["Un laboratoire","معمل","🧪","Nous travaillons au laboratoire.","نعمل في المعمل."],["Un terrain de sport","أرض الملعب","⚽","Je joue sur le terrain de sport.","ألعب في الملعب."],["Une bibliothèque","مكتبة","📖","Je lis à la bibliothèque.","أقرأ في المكتبة."]],classroom:[["Un bureau","مكتب","🗄️","Le professeur est devant son bureau.","المعلم أمام مكتبه."],["Un tableau","سبورة","🖼️","Le tableau est dans la classe.","السبورة في الفصل."],["Une porte","باب","🚪","La porte est ouverte.","الباب مفتوح."],["Une fenêtre","شباك","🪟","La fenêtre est grande.","الشباك كبير."],["Un banc","مقعد","💺","Je m'assois sur un banc.","أجلس على مقعد."],["Un panneau","لوحة تعليمية","📌","Il y a un panneau dans la classe.","توجد لوحة تعليمية في الفصل."],["Un TNI","سبورة ذكية","🖥️","Le professeur utilise le TNI.","المعلم يستخدم السبورة الذكية."],["Une horloge","ساعة حائط","🕐","L'horloge est au mur.","الساعة على الحائط."]]};const tabs=document.getElementById('tabs'),panel=document.getElementById('panel');const sections=[['facilities','🏫','المرافق'],['classroom','🪑','في الفصل'],['grammar','📘','قاعدة الدرس'],['dialogue','💬','محادثة'],['video','🎬','الفيديو'],['practice','🎯','تدرّب بنفسك'],['files','📁','ملفات الدرس'],['games','🎮','الألعاب'],['assessment','📝','التقييم']];let practiceIndex=0,practiceScore=0,practiceLocked=false;function speak(t){if(!t||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.86;speechSynthesis.speak(u)}function learned(id,i){return localStorage.getItem('hm_vocab_'+id+'_'+i)==='1'}function mark(id,i,b){localStorage.setItem('hm_vocab_'+id+'_'+i,'1');b.textContent='✓ تم التعلم';b.classList.add('done')}function vocabSection(id,title){const a=vocab[id];return `<div class="head"><div><h2>${title}</h2><p>هذه مفردات <b>الدرس الأول فقط</b>. لا توجد هنا المواد الدراسية؛ Les matières scolaires خارج نطاق هذا الدرس.</p></div><button class="listen" onclick='speak(${JSON.stringify(a.map(x=>x[0]).join('. '))})'>🔊 استمع للمجموعة</button></div><div class="grid">${a.map((x,i)=>`<article class="word"><div class="pic" onclick='speak(${JSON.stringify(x[0])})'>${x[2]}</div><div class="pic-hint">اضغط الصورة لسماع الكلمة</div><div class="fr">${x[0]}</div><div class="ar">${x[1]}</div><div class="example">${x[3]}<div class="example-ar">${x[4]}</div></div><div class="actions"><button class="speak" onclick='speak(${JSON.stringify(x[0])})'>🔊 نطق الكلمة</button><button class="speak" onclick='speak(${JSON.stringify(x[3])})'>▶ نطق المثال</button><button class="learn ${learned(id,i)?'done':''}" onclick='mark(${JSON.stringify(id)},${i},this)'>${learned(id,i)?'✓ تم التعلم':'☆ حفظ كمكتسبة'}</button></div></article>`).join('')}</div>`}function grammar(){return `<div class="head"><div><h2>📘 قاعدة الدرس: Il y a / Il n'y a pas de</h2><p>القاعدة المختارة لهذا الدرس هي وصف وجود الأشياء في المدرسة والفصل. الشرح يبدأ من المعنى ثم الصيغة ثم التطبيق.</p></div><button class="listen" onclick='speak("Il y a une cantine. Il y a des classes. Il n'y a pas de piscine.")'>🔊 استمع للشرح والأمثلة</button></div><div class="grammar-grid"><article class="rule-card"><div class="rule-step"><div class="rule-num">1</div><div><h3>متى نستخدم Il y a؟</h3><p class="explain">نستخدمها عندما نريد أن نقول إن شيئًا موجود في مكان ما.</p><div class="formula">Il y a + un / une / des + nom</div><p><b dir="ltr">Il y a une cantine.</b> — يوجد كانتين.</p><button class="speak" onclick='speak("Il y a une cantine.")'>🔊 نطق المثال</button></div></div></article><article class="rule-card"><div class="rule-step"><div class="rule-num">2</div><div><h3>متى نستخدم Il n'y a pas de؟</h3><p class="explain">نستخدمها لنفي وجود شيء. بعد النفي نستخدم <b>de</b> قبل الاسم.</p><div class="formula">Il n'y a pas de + nom</div><p><b dir="ltr">Il n'y a pas de piscine.</b> — لا يوجد حمام سباحة.</p><button class="speak" onclick='speak("Il n'y a pas de piscine.")'>🔊 نطق المثال</button></div></div></article><article class="rule-card"><div class="rule-step"><div class="rule-num">3</div><div><h3>لاحظ الفرق</h3><p class="explain">في الإثبات نستخدم un / une / des، أما في النفي فتصبح de.</p><div class="formula">Il y a une porte.<br>Il n'y a pas de porte.</div><button class="speak" onclick='speak("Il y a une porte. Il n'y a pas de porte.")'>🔊 نطق المقارنة</button></div></div></article></div><div class="note">💡 <b>قاعدة ذهبية:</b> اسأل نفسك أولًا: «هل الشيء موجود؟» ثم اختر Il y a أو Il n'y a pas de.</div>`}function dialogue(){const lines=[['👩 Sara','Bonjour ! Tu aimes ton école ?','مرحبًا! هل تحب مدرستك؟'],['👦 Adam','Oui, j\'aime mon école. Il y a une grande cour.','نعم، أحب مدرستي. يوجد فناء كبير.'],['👩 Sara','Et où est la cantine ?','وأين الكانتين؟'],['👦 Adam','La cantine est près des classes. Je mange avec mes amis.','الكانتِين بجوار الفصول. آكل مع أصدقائي.'],['👩 Sara','On va à la bibliothèque ?','هل نذهب إلى المكتبة؟'],['👦 Adam','Oui, allons-y !','نعم، هيا بنا!']];return `<div class="head"><div><h2>💬 Mission Dialogue</h2><p>محادثة قصيرة بين شخصين في موضوع الدرس. استمع، اقرأ، ثم حاول تقليد كل جملة.</p></div><button class="listen" onclick='speak(${JSON.stringify(lines.map(x=>x[1]).join(' '))})'>🔊 استمع للمحادثة كاملة</button></div><div class="dialogue"><article class="dialog-card"><h3>🎭 Sara & Adam — À l'école</h3>${lines.map(x=>`<div class="dialog-line"><strong>${x[0]}</strong><div><div dir="ltr">${x[1]}</div><small>${x[2]}</small><br><button class="dialog-btn" onclick='speak(${JSON.stringify(x[1])})'>🔊 اسمع الجملة</button></div></div>`).join('')}</article></div>`}function video(){return `<div class="video-card"><h2>🎬 Lexique de l'école</h2><p>فيديو داعم لمراجعة مفردات المدرسة والاستماع إليها في سياق تعليمي.</p><div class="video-art">🏫▶️</div><a class="primary" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=ii5J7ZMT5EY">▶ مشاهدة الفيديو على YouTube</a></div>`}const qs=[['image','ما المعنى الصحيح للصورة؟','🍽️',['كانتين','مكتبة','معمل','فناء'],'كانتين'],['word','اختر الكلمة الفرنسية التي تعني «سبورة».','', ['un tableau','une cour','un bureau','une porte'],'un tableau'],['grammar','أكمل: ___ une bibliothèque dans l\'école.','',['Il y a','Il n\'y a pas de','Je suis','J\'aime'],'Il y a'],['grammar','اختر النفي الصحيح: «لا توجد سبورة.»','',['Il y a un tableau.','Il n\'y a pas de tableau.','Il aime le tableau.','Une tableau.'],"Il n'y a pas de tableau."],['article','أكمل: Il y a ___ porte.','',['un','une','des','de'],'une'],['image','ما الكلمة المناسبة للصورة؟','📖',['une bibliothèque','un laboratoire','un gymnase','une porte'],'une bibliothèque'],['sentence','اختر الجملة الصحيحة عن الفصل.','',['Il y a des classes.','Il n\'y a pas des classes.','Je classes une école.','Une classes.'],'Il y a des classes.'],['dialogue','Sara تسأل: Où est la cantine ? ما الرد المناسب؟','',['La cantine est près des classes.','Je préfère la cantine.','Il n\'y a pas de français.','Je suis une cantine.'],'La cantine est près des classes.'],['image','ما معنى الصورة؟','🧪',['معمل','سبورة','كرسي','فناء'],'معمل'],['article','أكمل: Il n\'y a pas ___ piscine.','',['un','une','des','de'],'de']];function practice(){const q=qs[practiceIndex];const done=practiceIndex>=qs.length;return `<div class="head"><div><h2>🎯 تدرّب بنفسك</h2><p>10 أسئلة متنوعة من محتوى الدرس. الإجابة لا تظهر قبل المحاولة، وبعد الاختيار تحصل على تغذية راجعة.</p></div><span class="section-badge">${done?'اكتمل':'سؤال '+(practiceIndex+1)+' / '+qs.length}</span></div><div class="practice-list"><article class="question-card"><div class="question-meta"><span>🧠 ${q?.[0]||'تدريب'}</span><span>النتيجة: ${practiceScore} / ${practiceIndex}</span></div><h3>${q?.[1]||'أحسنت! أكملت التدريب.'}</h3>${q?.[2]?`<div class="question-image">${q[2]}</div>`:''}<div class="options">${(q?.[3]||[]).map(o=>`<button class="option" onclick='answer(${JSON.stringify(o)},this)'>${o}</button>`).join('')}</div><div class="feedback" id="feedback"></div>${q?'<button class="check next" id="next" style="display:none;margin-top:12px" onclick="nextQuestion()">السؤال التالي →</button>':''}</article><div class="score">🏆 الدرجة الحالية: ${practiceScore} / ${practiceIndex} · الهدف: فهم الدرس وليس مجرد حفظ الإجابة.</div></div>`}function answer(value,b){if(practiceLocked)return;practiceLocked=true;const q=qs[practiceIndex],ok=value===q[4];document.querySelectorAll('.option').forEach(x=>x.disabled=true);b.classList.add(ok?'correct':'wrong');const f=document.getElementById('feedback');f.textContent=ok?'✓ ممتاز! إجابة صحيحة.':'✗ ليست الإجابة الصحيحة. راجع القاعدة أو المفردة ثم جرّب في السؤال التالي.';if(ok)practiceScore++;document.getElementById('next').style.display='inline-block'}function nextQuestion(){practiceIndex++;practiceLocked=false;if(practiceIndex>=qs.length){panel.innerHTML=`<div class="head"><div><h2>🎉 أحسنت! اكتمل تدريب الدرس</h2><p>أكملت ${qs.length} أسئلة. نتيجتك النهائية: <b>${practiceScore}/${qs.length}</b>.</p></div></div><div class="score">⭐ ${practiceScore} / ${qs.length} — عد إلى المفردات أو القاعدة لمراجعة أي نقطة تحتاجها.</div>`;return}panel.innerHTML=practice()}function files(){const files=[['🧠','الملف التفاعلي','شرح الدرس + المفردات + القاعدة + المحادثة + التدريب','lesson-1-interactive-v2.html'],['📖','المرجع التعليمي','مراجعة وطباعة محتوى الدرس الأول فقط','reference_lecon1_unite1.html'],['📝','التقييم الرسمي','تقييم أكاديمي مستقل','formal_assessment_lecon1_unite1.html'],['💻','الاختبار الإلكتروني','اختبار تفاعلي منفصل عن الألعاب','interactive_assessment_lecon1_unite1.html'],['🎮','الألعاب التعليمية','مركز ألعاب متعدد الأنشطة','lesson-1-games.html']];return `<div class="head"><div><h2>📁 ملفات الدرس</h2><p>تم توحيد الملفات حول محتوى الدرس الأول فقط. <b>المواد الدراسية ليست ضمن ملفات الدرس الأول.</b></p></div></div><div class="files">${files.map(x=>`<article class="file-card"><div class="file-icon">${x[0]}</div><div><h3>${x[1]}</h3><p>${x[2]}</p><a class="file-btn" href="${x[3]}">فتح الملف</a></div></article>`).join('')}</div>`}function games(){const games=[['🧩','Memory','صورة ↔ معنى','memory_game_lecon1_unite1.html'],['🎯','Word Catch','صورة → اختر الكلمة الفرنسية','word_catch_lecon1_unite1.html'],['🧲','Drag & Drop','صنّف الصورة أو الكلمة','drag_drop_lecon1_unite1.html'],['🎤','Pronunciation','استماع ونطق','pronunciation_challenge_lecon1_unite1.html'],['📚','Vocabulary Challenge','صورة → اختر المعنى → مثال ونطق','vocabulary_challenge_lecon1_unite1.html'],['⚡','Quiz Express','تحدٍ سريع متنوع','games_quiz_lecon1_unite1.html']];return `<div class="head"><div><h2>🎮 مركز الألعاب</h2><p>كل لعبة لها أيقونة وهوية بصرية وهدف مختلف؛ لا نكرر السؤال بنفس الصيغة.</p></div></div><div class="files">${games.map(x=>`<article class="file-card"><div class="file-icon">${x[0]}</div><div><h3>${x[1]}</h3><p>${x[2]}</p><a class="file-btn" href="${x[3]}">ابدأ اللعبة</a></div></article>`).join('')}</div>`}function assessment(){return `<div class="head"><div><h2>📝 تقييم الدرس</h2><p>التقييم الرسمي مستقل عن الألعاب والتدريب اليومي.</p></div></div><div class="file-card"><div class="file-icon">📝</div><div><h3>التقييم الرسمي — Leçon 1</h3><p>يُفتح بعد إنهاء المفردات والقاعدة والتدريب.</p><a class="file-btn" href="formal_assessment_lecon1_unite1.html">فتح التقييم</a></div></div>`}function render(id){tabs.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.id===id));if(id==='facilities')panel.innerHTML=vocabSection('facilities','🏫 مرافق المدرسة');else if(id==='classroom')panel.innerHTML=vocabSection('classroom','🪑 في الفصل');else if(id==='grammar')panel.innerHTML=grammar();else if(id==='dialogue')panel.innerHTML=dialogue();else if(id==='video')panel.innerHTML=video();else if(id==='practice')panel.innerHTML=practice();else if(id==='files')panel.innerHTML=files();else if(id==='games')panel.innerHTML=games();else panel.innerHTML=assessment()}sections.forEach(([id,icon,label])=>{const b=document.createElement('button');b.className='tab';b.dataset.id=id;b.textContent=icon+' '+label;b.onclick=()=>{if(id==='practice'&&practiceIndex>=qs.length){practiceIndex=0;practiceScore=0;practiceLocked=false}render(id)};tabs.appendChild(b)});render('facilities');</script><script src="../../../../scripts/lesson-context-nav.js?v=20260814-context-nav"></script></body></html>
