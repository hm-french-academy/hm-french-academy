<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Leçon 3 · التقييم الإلكتروني</title><style>body{font-family:Arial,Cairo,sans-serif;background:#f4f7fc;color:#17223b;margin:0}main{max-width:900px;margin:auto;padding:20px}.hero,.qcard,.result{background:#fff;border-radius:22px;padding:22px;margin-bottom:14px;box-shadow:0 10px 30px #14264a12}.hero{background:linear-gradient(135deg,#312e81,#7c3aed,#2563eb);color:#fff}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{padding:13px;border:1px solid #dbe3ef;border-radius:12px;background:#fff;font-weight:800}.sel{border-color:#7c3aed;background:#f3edff}.submit{border:0;background:#7c3aed;color:#fff;padding:14px 20px;border-radius:13px;font-weight:900}@media(max-width:600px){.opts{grid-template-columns:1fr}}</style></head><body><main><section class="hero"><h1>Leçon 3 · التقييم الإلكتروني</h1><p>اختبار مستقل عن الألعاب التعليمية، ومطابق لموضوع المواد الدراسية وتصريف aimer / préférer.</p></section><div id="form"></div><button class="submit" id="submit">إرسال التقييم</button><section class="result" id="result">اختر إجابة كل سؤال.</section></main><script src="../../../../scripts/activity-complete.js?v=20260815-assess3-fix"></script><script>const Q=[['Elle … les sciences.',['aime','aimons','aiment'],0],['Nous … le dessin.',['préfère','préférons','préfèrent'],1],['Vous … le français.',['aimez','aimons','aiment'],0],['J’aime … français.',['le','la','les'],0],['Je préfère … géographie.',['le','la','les'],1],['Tu préfères … arabe ou l’anglais ?',['le','la','l’'],2],['« Préférer » est un verbe du premier groupe (-er).',['Vrai','Faux'],0],['On dit « la histoire ».',['Vrai','Faux'],1]];let A={};const F=document.getElementById('form');Q.forEach((x,i)=>F.insertAdjacentHTML('beforeend','<section class="qcard"><h3>'+(i+1)+'. '+x[0]+'</h3><div class="opts">'+x[1].map((v,k)=>'<button class="opt" type="button" data-i="'+i+'" data-k="'+k+'">'+v+'</button>').join('')+'</div></section>'));F.onclick=e=>{if(!e.target.classList.contains('opt'))return;let i=e.target.dataset.i;A[i]=+e.target.dataset.k;F.querySelectorAll('.opt[data-i="'+i+'"]').forEach(b=>b.classList.remove('sel'));e.target.classList.add('sel')};submit.onclick=()=>{let s=Q.reduce((n,x,i)=>n+(A[i]===x[2]?1:0),0),p=Math.round(s/Q.length*100);result.textContent='النتيجة: '+s+' / '+Q.length+' ('+p+'%). '+(p>=70?'ممتاز!':'راجع الأخطاء وأعد المحاولة.');if(window.HMActivityComplete&&p>=70)HMActivityComplete.complete('grade8-u1-l3','electronic-assessment',50)};</script></body></html>
