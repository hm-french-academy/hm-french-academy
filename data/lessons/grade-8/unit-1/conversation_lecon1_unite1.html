<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | محادثة الدرس الأول</title><style>body{margin:0;background:linear-gradient(180deg,#f7f9fd,#eef3fb);color:#17223b;font-family:Arial,"Cairo",sans-serif}.wrap{max-width:900px;margin:auto;padding:18px 12px 50px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff;border-radius:28px;padding:26px}.icon{width:84px;height:84px;border-radius:24px;background:#ffffff22;display:grid;place-items:center;font-size:46px;margin-bottom:10px}.hero h1{margin:0;font-size:clamp(28px,6vw,44px)}.hero p{line-height:1.8}.toolbar{background:#fff;border:1px solid #e1e7f0;border-radius:18px;padding:14px;margin:14px 0;display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 15px;background:#edf3ff;color:#2850a3;font-weight:900;cursor:pointer;text-decoration:none}.primary{background:#e92d83;color:#fff}.dialogue{display:grid;gap:12px}.line{display:grid;grid-template-columns:130px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid #e1e7f0;border-radius:18px;padding:15px;box-shadow:0 8px 24px #14264a0a}.speaker{font-weight:900;color:#315aa4}.fr{direction:ltr;font-weight:900;font-size:18px}.ar{color:#68758b;margin-top:5px;line-height:1.7}.speak{border:0;background:#e92d83;color:#fff;width:44px;height:44px;border-radius:50%;cursor:pointer}.note{margin-top:14px;background:#f7f9fd;border:1px solid #e1e7f0;border-radius:15px;padding:13px;color:#68758b;line-height:1.8}@media(max-width:600px){.line{grid-template-columns:1fr auto}.speaker{grid-column:1/-1}.fr{font-size:16px}}</style></head><body><main class="wrap"><section class="hero"><div class="icon">💬</div><h1>À l'école · محادثة الدرس</h1><p>حوار قصير بين طالب ومعلمة للتعرّف إلى مرافق المدرسة واستخدام قواعد الدرس في موقف حقيقي.</p></section><div class="toolbar"><button class="btn primary" id="all">▶ استمع إلى المحادثة كاملة</button><a class="btn" href="../../../../lesson.html?id=grade8-u1-l1&section=conversation">↩ العودة إلى الدرس</a></div><section class="dialogue" id="dialogue"></section><div class="note">💡 استمع إلى الجملة، اقرأ معناها، ثم أعد نطقها بصوتك قبل الانتقال إلى الجملة التالية.</div></main><script>const lines=[["Élève","الطالب","Bonjour Madame. Où est la cantine ?","مرحبًا يا أستاذة. أين الكانتين؟"],["Professeure","المعلمة","Elle est près de la cour.","إنها بالقرب من الفناء."],["Élève","الطالب","Y a-t-il une bibliothèque ?","هل توجد مكتبة؟"],["Professeure","المعلمة","Oui, il y a une bibliothèque près des classes.","نعم، توجد مكتبة بالقرب من الفصول."],["Élève","الطالب","J'aime la bibliothèque. Je préfère lire au CDI.","أنا أحب المكتبة. أفضل القراءة في مركز التوثيق والمعلومات."],["Professeure","المعلمة","Très bien ! Découvre aussi le gymnase et le terrain de sport.","جيد جدًا! تعرّف أيضًا إلى صالة الألعاب والملعب الرياضي."]];function speak(t){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.86;speechSynthesis.speak(u)}document.getElementById("dialogue").innerHTML=lines.map(x=>`<article class="line"><div class="speaker">${x[0]}<br><small>${x[1]}</small></div><div><div class="fr">${x[2]}</div><div class="ar">${x[3]}</div></div><button class="speak" onclick='speak(${JSON.stringify(x[2])})'>🔊</button></article>`).join("");document.getElementById("all").onclick=()=>speak(lines.map(x=>x[2]).join(". "));</script></body></html>
