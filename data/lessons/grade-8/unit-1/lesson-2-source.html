<!DOCTYPE html>
<html lang="fr">
<head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2">
<meta charset="UTF-8">
<title>Leçon 2 — Unité 1 : À l'école | Hatem El-Morsi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1B2A4A;--navy2:#2F4468;--gold:#D4A94C;--gold-l:#F0CB79;--cream:#FAF6EC;--red:#C8382D;--teal:#2F7A6B;--ink:#222b3a}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Poppins,sans-serif;min-height:100vh}.ar{font-family:Cairo,sans-serif;direction:rtl}header{background:linear-gradient(160deg,var(--navy),var(--navy2));color:var(--cream);padding:22px 18px 60px;position:relative;overflow:hidden;text-align:center}header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:26px;background:var(--cream);border-radius:50% 50% 0 0/100% 100% 0 0;transform:scale(1.3)}.logo-wrap{width:100px;height:100px;margin:0 auto 8px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}.logo-tower{stroke-dasharray:620;stroke-dashoffset:620;animation:logoDraw 3.2s ease forwards infinite}@keyframes logoDraw{0%{stroke-dashoffset:620}55%{stroke-dashoffset:0}85%{stroke-dashoffset:0}100%{stroke-dashoffset:620}}.logo-star{transform-origin:200px 156px;animation:logoTwinkle 1.4s ease-in-out infinite}@keyframes logoTwinkle{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.25)}}h1{font-family:'Playfair Display',serif;font-size:24px;margin:6px 0 2px}.lesson-tag{display:inline-block;background:var(--red);color:#fff;font-family:Cairo,sans-serif;font-weight:700;font-size:13px;padding:4px 14px;border-radius:999px;margin-top:4px}header p.sub{font-family:Cairo,sans-serif;color:var(--gold-l);margin:6px 0 0;font-size:14px}nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:980px;margin:-34px auto 24px;padding:0 14px;position:relative;z-index:3}nav button{font-family:Cairo,sans-serif;font-size:14px;font-weight:600;cursor:pointer;border:none;padding:11px 16px;border-radius:999px;background:#fff;color:var(--navy);box-shadow:0 3px 8px rgba(27,42,74,.18);transition:.2s}nav button.active,nav button:hover{background:var(--red);color:#fff;transform:translateY(-2px)}main{max-width:980px;margin:0 auto;padding:0 16px 60px}section{display:none;animation:fade .4s ease}section.active{display:block}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.panel-title{display:flex;align-items:center;gap:10px;margin-bottom:16px}.panel-title h2{font-family:'Playfair Display',serif;color:var(--navy);font-size:22px;margin:0}.badge-num{background:var(--gold);color:var(--navy);font-weight:700;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 14px rgba(27,42,74,.09);border:1px solid #eee2c9;position:relative;transition:.25s}.card:hover{transform:translateY(-4px);box-shadow:0 10px 22px rgba(27,42,74,.16)}.card .icon{font-size:30px;text-align:center;margin-bottom:6px}.card .fr{font-weight:600;font-size:15.5px;color:var(--navy);text-align:center}.card .ar{display:block;text-align:center;color:var(--red);font-size:14.5px;margin-top:3px}.speak{position:absolute;top:8px;left:8px;background:var(--teal);color:#fff;border:none;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1}.speak:hover{background:var(--navy)}.practice{background:var(--navy);color:#fff;border-radius:16px;padding:20px;margin-top:26px}.practice h3{font-family:'Playfair Display',serif;color:var(--gold-l);margin-top:0}.q{margin-bottom:14px}.q input[type=text]{border-radius:8px;border:none;padding:7px 10px;font-family:Poppins;width:160px;margin-left:8px}.check-btn{background:var(--gold);color:var(--navy);border:none;padding:9px 20px;border-radius:999px;font-weight:700;cursor:pointer;margin-top:6px}#result{margin-top:10px;font-weight:600}.video-thumb{display:block;position:relative;border-radius:16px;overflow:hidden;box-shadow:0 4px 14px rgba(27,42,74,.15);margin-bottom:10px}.video-thumb img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}.play-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;background:rgba(200,56,45,.92);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 12px rgba(0,0,0,.35)}.video-note{background:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 3px 10px rgba(27,42,74,.08)}footer{text-align:center;color:#8a8a8a;font-size:12.5px;padding:20px;font-family:Cairo,sans-serif}.float-audio{position:fixed;bottom:16px;right:16px;background:var(--red);color:#fff;border:none;width:52px;height:52px;border-radius:50%;font-size:20px;box-shadow:0 6px 16px rgba(0,0,0,.3);cursor:pointer;z-index:10}
</style></head><body>
<header><div class="logo-wrap"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%"><circle cx="200" cy="200" r="192" fill="#1B2A4A" stroke="#D4A94C" stroke-width="4"/><circle cx="200" cy="200" r="178" fill="none" stroke="#F7E9C8" stroke-width="1.5" opacity=".5"/><path id="arcTop" d="M 65 150 A 150 150 0 0 1 335 150" fill="none"/><text font-family="Georgia, serif" font-size="28" letter-spacing="4" fill="#F7E9C8" font-weight="700"><textPath href="#arcTop" startOffset="50%" text-anchor="middle">HATEM EL-MORSI</textPath></text><path d="M -70 10 Q -35 -8 0 4 Q 35 -8 70 10 L 70 22 Q 35 8 0 18 Q -35 8 -70 22 Z" fill="#C8382D" transform="translate(200,300)"/><path class="logo-tower" d="M200,161 L206,195 L216,237 L226,277 L246,315 L154,315 L174,277 L184,237 L194,195 Z" fill="none" stroke="#F0CB79" stroke-width="3.5" stroke-linejoin="round"/><circle class="logo-star" cx="200" cy="156" r="4.5" fill="#fff"/><path id="arcBottom" d="M 65 250 A 150 150 0 0 0 335 250" fill="none"/><text font-family="Georgia, serif" font-size="16" letter-spacing="3" fill="#F0CB79"><textPath href="#arcBottom" startOffset="50%" text-anchor="middle">PROFESSEUR DE FRANÇAIS</textPath></text></svg></div><h1>Unité 1 — À l'école</h1><div class="lesson-tag ar">الدرس الثاني (Leçon 2)</div><p class="sub">الأدوات المدرسية والمقلمة والشنطة — 2ème année préparatoire (1er semestre)</p></header>
<nav id="tabs"></nav><main id="content"></main><button class="float-audio" onclick="stopAll()" title="إيقاف الصوت">⏹</button><footer>Conçu par Hatem El-Morsi — Le Français avec passion 🇫🇷</footer>
<script>
const speak=text=>{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=.9;window.speechSynthesis.speak(u)};function stopAll(){window.speechSynthesis.cancel()}
const sections=[{id:'video',label:'فيديو الدرس',ar:'شاهد واستمع',type:'video'},{id:'fournitures',label:'الأدوات المدرسية',ar:'المستلزمات المدرسية',num:3,type:'vocab',items:[['Un stylo','قلم جاف','🖊️'],['Un crayon','قلم رصاص','✏️'],['Une gomme','استيكة','🧼'],['Une règle','مسطرة','📏'],['Un livre','كتاب','📘'],['Un cahier','كراسة','📓'],['Un taille-crayon','برّاية','✂️'],['Un tube de colle','أنبوبة لاصق','🧴'],['Un surligneur','قلم تحديد فسفوري','🖍️'],['Un feutre','قلم فلوماستر','🖊️'],['Une feuille de papier','ورقة','📄'],['Un dossier','دوسيه','📁'],['Une trousse','مقلمة','🎒'],['Des ciseaux','مقص','✂️'],['Des crayons de couleur','أقلام ألوان','🎨']]},{id:'trousse',label:'المقلمة والشنطة',ar:'في المقلمة وفي الشنطة',num:'4-5',type:'vocab',items:[['Un crayon (des crayons)','قلم رصاص (أقلام)','✏️'],['Un stylo (des stylos)','قلم جاف (أقلام)','🖊️'],['Une gomme','استيكة','🧼'],['Une règle','مسطرة','📏'],['Un taille-crayon','برّاية','✂️'],['Un correcteur liquide','مزيل (تيبكس)','🧪'],['Un tube de colle','أنبوبة لاصق','🧴'],['Une calculatrice','آلة حاسبة','🧮'],['Un sac à dos','شنطة ظهر','🎒'],['Des livres','كتب','📚'],['Des cahiers','كراسات','📓'],['Un dossier','دوسيه','📁']]},{id:'practice',label:'تدرّب بنفسك',ar:'تمرين سريع',type:'practice'}];
const tabsEl=document.getElementById('tabs'),contentEl=document.getElementById('content');sections.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.label;b.className='ar';b.onclick=()=>showSection(i);b.id='tab-'+s.id;tabsEl.appendChild(b)});
function vocabGrid(items){return `<div class="grid">${items.map(([fr,ar,icon])=>`<div class="card"><button class="speak" onclick="speak('${fr.replace(/'/g,"\\'")}')">🔊</button><div class="icon">${icon}</div><div class="fr">${fr}</div><span class="ar">${ar}</span></div>`).join('')}</div>`}
function renderSection(s){let html=`<div class="panel-title">${s.num?`<div class="badge-num">${s.num}</div>`:''}<h2>${s.ar}</h2></div>`;if(s.type==='vocab')html+=vocabGrid(s.items);else if(s.type==='video')html+=`<a class="video-thumb" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=aGwKSZigXwE"><img src="https://img.youtube.com/vi/aGwKSZigXwE/hqdefault.jpg" alt="Les fournitures scolaires"><span class="play-badge">▶</span></a><div class="video-note ar">شاهد الفيديو للتعرف على مفردات الأدوات المدرسية والمقلمة والشنطة قبل التدريب عليها في البطاقات التالية.</div>`;else if(s.type==='practice')html+=`<div class="practice"><h3 class="ar">تحقق من فهمك — أكمل بالفرنسية</h3><div class="q ar">1) أداة نمحو بها الكتابة بالقلم الرصاص:<input type="text" id="q1" placeholder="Une ..."></div><div class="q ar">2) الأداة التي نضع فيها الأقلام والمسطرة:<input type="text" id="q2" placeholder="Une ..."></div><div class="q ar">3) الشنطة التي نحملها على ظهرنا للمدرسة:<input type="text" id="q3" placeholder="Un ..."></div><button class="check-btn" onclick="checkAnswers()">تحقّق من الإجابة</button><div id="result"></div></div>`;return html}
function showSection(i){document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));document.getElementById('tab-'+sections[i].id).classList.add('active');contentEl.innerHTML=`<section class="active">${renderSection(sections[i])}</section>`}function checkAnswers(){const answers={q1:['une gomme','gomme'],q2:['une trousse','trousse'],q3:['un sac a dos','un sac à dos','sac a dos','sac à dos']};let score=0;for(const k in answers){const v=document.getElementById(k).value.trim().toLowerCase();if(answers[k].some(a=>v.includes(a)))score++}document.getElementById('result').innerHTML=`النتيجة: ${score} / 3 ${score===3?'🎉 ممتاز!':'حاول مرة أخرى وراجع البطاقات أعلاه.'}`}showSection(0);
</script></body></html>
