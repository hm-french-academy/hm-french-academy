<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Leçon 2 · التقييم الإلكتروني</title><style>body{font-family:Arial,Cairo,sans-serif;background:#f4f7fc;color:#17223b;margin:0}main{max-width:900px;margin:auto;padding:20px}.hero,.qcard,.result{background:#fff;border-radius:22px;padding:22px;margin-bottom:14px;box-shadow:0 10px 30px #14264a12}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#713bd1);color:#fff}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{padding:13px;border:1px solid #dbe3ef;border-radius:12px;background:#fff;font-weight:800}.sel{border-color:#2563eb;background:#edf3ff}.submit{border:0;background:#713bd1;color:#fff;padding:14px 20px;border-radius:13px;font-weight:900}@media(max-width:600px){.opts{grid-template-columns:1fr}}</style></head><body><main><section class="hero"><h1>Leçon 2 · التقييم الإلكتروني</h1><p>اختبار مستقل عن الألعاب التعليمية.</p></section><div id="form"></div><button class="submit" id="submit">إرسال التقييم</button><section class="result" id="result">اختر إجابة كل سؤال.</section></main><script src="../../../../scripts/activity-complete.js?v=20260811-assess2"></script><script>const Q=[['Dans la trousse, il y a…',['un tableau','une gomme','une piscine'],1],['Pour effacer un crayon, on utilise…',['une règle','une gomme','un stylo'],1],['Pour porter les livres, on utilise…',['un sac à dos','une trousse','un dossier'],0],['Je mesure la longueur avec…',['une règle','un tableau','une gomme'],0],['J’écris avec…',['un stylo','une piscine','un dossier'],0],['Je colle mes feuilles avec…',['un tube de colle','une calculatrice','un cahier'],0],['L’intrus est : un stylo — un crayon — une gomme — …',['une piscine','une règle','un livre'],0],['L’intrus est : une trousse — un sac à dos — un dossier — …',['un tableau','une gomme','un crayon'],0]];let A={};const F=document.getElementById('form');Q.forEach((x,i)=>{F.insertAdjacentHTML('beforeend','<section class="qcard"><h3>'+(i+1)+'. '+x[0]+'</h3><div class="opts">'+x[1].map((v,k)=>'<button class="opt" type="button" data-i="'+i+'" data-k="'+k+'">'+v+'</button>').join('')+'</div></section>')});F.onclick=e=>{if(!e.target.classList.contains('opt'))return;let i=e.target.dataset.i;A[i]=+e.target.dataset.k;F.querySelectorAll('.opt[data-i="'+i+'"]').forEach(b=>b.classList.remove('sel'));e.target.classList.add('sel')};submit.onclick=()=>{let s=Q.reduce((n,x,i)=>n+(A[i]===x[2]?1:0),0),p=Math.round(s/Q.length*100);result.textContent='النتيجة: '+s+' / '+Q.length+' ('+p+'%). '+(p>=70?'ممتاز!':'راجع الأخطاء وأعد المحاولة.');if(window.HMActivityComplete&&p>=70)HMActivityComplete.complete('grade8-u1-l2','electronic-assessment',50)};</script></body></html>
