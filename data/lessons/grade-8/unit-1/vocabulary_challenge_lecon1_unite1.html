<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Vocabulary Challenge · Leçon 1</title><style>:root{--navy:#14264a;--blue:#2563eb;--pink:#e92b82;--teal:#12a596;--line:#dfe6ef;--muted:#68758b}*{box-sizing:border-box}body{margin:0;font-family:Arial,Cairo,sans-serif;background:radial-gradient(circle at 85% 0%,#fff0f7,#f4f7fc 42%,#eef3fb);color:#17223b}.wrap{max-width:920px;margin:auto;padding:18px}.hero,.challenge{background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 16px 42px #14264a0b}.hero{padding:26px;color:#fff;background:linear-gradient(135deg,#173a82,#2563eb 56%,#12a596);position:relative;overflow:hidden}.hero:after{content:'📚';position:absolute;left:20px;bottom:-22px;font-size:120px;opacity:.12}.hero h1{margin:0;font-size:clamp(30px,6vw,48px)}.hero p{line-height:1.8;max-width:700px}.challenge{padding:22px;margin-top:16px}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:900}.bar{height:9px;background:#e7edf6;border-radius:99px;overflow:hidden;margin:12px 0 20px}.bar i{display:block;width:20%;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--blue),var(--teal));transition:.25s}.prompt{display:grid;grid-template-columns:250px 1fr;gap:20px;align-items:center;padding:16px;border-radius:22px;background:linear-gradient(145deg,#f5f8ff,#fff);border:1px solid #e1e8f2}.prompt-art{height:190px;border-radius:19px;background:#fff;display:grid;place-items:center;border:1px solid #e3eaf3}.prompt-art img{width:140px;height:140px;object-fit:contain}.meaning{font-size:25px;font-weight:900;color:var(--navy)}.instruction{color:var(--muted);line-height:1.8;margin-top:7px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.answer{border:1px solid #d4deec;background:#fff;border-radius:17px;padding:15px;display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:900;font-size:18px;direction:ltr;transition:.16s}.answer:hover{transform:translateY(-2px);box-shadow:0 10px 24px #14264a12}.answer img{width:55px;height:45px;object-fit:contain}.answer.correct{background:#eaf8f1;border-color:#70c89b;color:#146b49}.answer.wrong{background:#fff0f3;border-color:#e996a5;color:#a12b42}.answer:disabled{cursor:default}.feedback{min-height:30px;margin-top:13px;font-weight:900}.speak{border:0;background:#edf3ff;color:#2052a8;border-radius:12px;padding:10px 13px;font-weight:900;cursor:pointer;margin-top:10px}.restart{border:0;background:linear-gradient(135deg,#713bd1,#2563eb);color:#fff;padding:12px 18px;border-radius:13px;font-weight:900;cursor:pointer;margin-top:12px}@media(max-width:650px){.wrap{padding:10px 8px}.prompt{grid-template-columns:1fr}.prompt-art{height:170px}.answers{grid-template-columns:1fr}.meaning{font-size:22px}}</style></head><body><main class="wrap"><section class="hero"><h1>📚 تحدي المفردات</h1><p>تدريب بصري سريع: تعرّف على الصورة، استمع عند الحاجة، ثم اختر الكلمة الفرنسية التي تعبّر عنها. هذا التدريب مختلف عن التقييم الرسمي.</p></section><section class="challenge"><div class="topline"><span>السؤال <span id="num">1</span>/6</span><span>⭐ <span id="score">0</span> نقطة</span></div><div class="bar"><i id="progress"></i></div><div class="prompt"><div class="prompt-art"><img id="promptImg" src="../../../../assets/lessons/grade8-u1-l1/pen.svg" alt="صورة"></div><div><div class="meaning" id="meaning">قلم جاف</div><div class="instruction">اختر الاسم الفرنسي المناسب للصورة والمعنى.</div><button class="speak" id="speak" type="button">🔊 استمع إلى الكلمة</button></div></div><div class="answers" id="answers"></div><p class="feedback" id="feedback"></p><button class="restart" id="restart" type="button">إعادة التحدي</button></section></main><script src="../../../../scripts/activity-complete.js?v=20260812-vocab3"></script><script>const data=[['stylo','قلم جاف','pen.svg'],['crayon','قلم رصاص','pencil.svg'],['gomme','ممحاة','eraser.svg'],['règle','مسطرة','ruler.svg'],['trousse','مقلمة','pencil-case.svg'],['cahier','كراسة','notebook.svg'],['livre','كتاب','book.svg'],['calculatrice','آلة حاسبة','calculator.svg']];let order=[],i=0,score=0,locked=false;const img=document.getElementById('promptImg'),meaning=document.getElementById('meaning'),answers=document.getElementById('answers'),feedback=document.getElementById('feedback'),num=document.getElementById('num'),sc=document.getElementById('score'),bar=document.getElementById('progress');function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function speak(){if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(order[i][0]);u.lang='fr-FR';u.rate=.86;window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}function render(){locked=false;if(i>=order.length){finish();return}const cur=order[i];num.textContent=i+1;bar.style.width=((i+1)/order.length*100)+'%';img.src='../../../../assets/lessons/grade8-u1-l1/'+cur[2];img.alt='صورة '+cur[1];meaning.textContent=cur[1];feedback.textContent='';const opts=shuffle([cur,...shuffle(data.filter(x=>x[0]!==cur[0])).slice(0,3)]);answers.innerHTML='';opts.forEach(x=>{const b=document.createElement('button');b.className='answer';b.type='button';b.innerHTML='<img src="../../../../assets/lessons/grade8-u1-l1/'+x[2]+'" alt=""><span>'+x[0]+'</span>';b.addEventListener('click',()=>answer(x,b));answers.appendChild(b)})}function answer(x,b){if(locked)return;locked=true;const ok=x[0]===order[i][0];if(ok){score++;b.classList.add('correct');feedback.textContent='✓ ممتاز! هذه هي الكلمة الفرنسية المناسبة.'}else{b.classList.add('wrong');feedback.textContent='✗ ليست الإجابة الصحيحة. شاهد الصورة مرة أخرى.'}sc.textContent=score;setTimeout(()=>{i++;render()},550)}function finish(){bar.style.width='100%';answers.innerHTML='';feedback.textContent='🎉 النتيجة '+score+'/'+order.length+' · +20 XP';meaning.textContent='أكملت تحدي المفردات بصريًا.';if(window.HMActivityComplete)HMActivityComplete.complete('grade8-u1-l1','vocabulary',20)}function start(){order=shuffle(data).slice(0,6);i=0;score=0;sc.textContent='0';render()}document.getElementById('speak').addEventListener('click',speak);document.getElementById('restart').addEventListener('click',start);start();</script></body></html>
