<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Vocabulary Challenge · Leçon 1</title><style>body{margin:0;font-family:Arial,Cairo,sans-serif;background:linear-gradient(180deg,#f5f8fd,#edf3fb);color:#17223b}.box{max-width:820px;margin:24px auto;background:#fff;padding:22px;border-radius:28px;border:1px solid #e2e8f2;box-shadow:0 14px 36px #14264a12}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#713bd1);color:#fff;padding:24px;border-radius:22px;margin-bottom:18px}.hero h1{margin:0 0 8px}.hero p{line-height:1.8;margin:6px 0}.progress{height:9px;background:#ffffff38;border-radius:9px;overflow:hidden;margin-top:14px}.progress i{display:block;height:100%;background:#fff;width:0;transition:.25s}.qcard{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:center;background:linear-gradient(145deg,#f7f9fd,#fff);border:1px solid #e2e8f2;border-radius:22px;padding:18px}.pic{height:185px;border-radius:20px;background:linear-gradient(145deg,#eef4ff,#fff2f8);display:grid;place-items:center;font-size:88px;box-shadow:inset 0 0 0 1px #ffffff}.q{font-size:24px;font-weight:900;line-height:1.5}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.btn{padding:14px;margin:0;border-radius:14px;border:1px solid #cfd8e7;background:#fff;cursor:pointer;font-weight:900;font-size:16px}.btn:hover{border-color:#2563eb;background:#f5f8ff}.btn.correct{background:#eaf8f5;border-color:#20a45a}.btn.wrong{background:#fff3f3;border-color:#d9534f}.after{margin-top:15px;padding:15px;border-radius:16px;background:#f8faff;line-height:1.9;min-height:58px}.listen{border:0;background:#e92d83;color:#fff;padding:10px 14px;border-radius:12px;font-weight:900;cursor:pointer;margin:4px 4px 0 0}.next{background:#2563eb}.score{margin-top:12px;text-align:center;color:#68758b;font-weight:900}@media(max-width:600px){.qcard{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.pic{height:155px;font-size:76px}}
</style></head><body><section class="box"><div class="hero"><h1>📚 Vocabulary Challenge</h1><p>تعلّم من الصورة: اختر المعنى العربي الصحيح، ثم تعرّف على الكلمة والمثال واستمع إليهما.</p><div class="progress"><i id="bar"></i></div></div><div class="qcard"><div class="pic" id="pic">❓</div><div><div class="q">ما المعنى المناسب لهذه الصورة؟</div><p id="count">السؤال 1 / 10</p></div></div><div class="choices" id="a"></div><div class="after" id="r">اختر الإجابة لعرض الكلمة والمثال.</div><div class="score" id="score">النتيجة: 0</div></section><script src="../../../../scripts/activity-complete.js?v=20260814-vocab4"></script><script>const data=[['cantine','كانتين','🍽️','Je mange à la cantine.'],['cour','الفناء المدرسي','🏫','Je joue dans la cour.'],['tableau','السبورة','🖼️','Le tableau est dans la classe.'],['chaise','كرسي','🪑','Je m\'assois sur une chaise.'],['bibliothèque','المكتبة','📖','Je lis à la bibliothèque.'],['gymnase','صالة الألعاب','🤸','Je fais du sport au gymnase.'],['laboratoire','المعمل','🧪','Nous travaillons au laboratoire.'],['terrain de sport','أرض الملعب','⚽','Je joue sur le terrain de sport.'],['fenêtre','الشباك','🪟','La fenêtre est grande.'],['bureau','المكتب','🗄️','Le professeur est devant son bureau.']];let i=0,score=0,locked=false;const pic=document.getElementById('pic'),count=document.getElementById('count'),a=document.getElementById('a'),r=document.getElementById('r'),bar=document.getElementById('bar'),scoreEl=document.getElementById('score');function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.86;speechSynthesis.speak(u)}function shuffle(x){return [...x].sort(()=>Math.random()-.5)}function render(){locked=false;const cur=data[i];pic.textContent=cur[2];count.textContent='السؤال '+(i+1)+' / '+data.length;bar.style.width=((i)/data.length*100)+'%';a.innerHTML=shuffle(data.map(x=>x[1])).map(v=>`<button class="btn" onclick="ans(${JSON.stringify(v)},this)">${v}</button>`).join('');r.textContent='اختر المعنى المناسب للصورة.'}function ans(v,b){if(locked)return;locked=true;const cur=data[i];const ok=v===cur[1];if(ok){score++;b.classList.add('correct');r.innerHTML=`✓ صحيح! <b dir="ltr">${cur[0]}</b><br>${cur[3]}<br><button class="listen" onclick='speak(${JSON.stringify(cur[0])})'>🔊 نطق الكلمة</button><button class="listen" onclick='speak(${JSON.stringify(cur[3])})'>▶ نطق المثال</button>`}else{b.classList.add('wrong');r.innerHTML=`✗ ليست الإجابة الصحيحة. الكلمة المرتبطة بالصورة هي <b dir="ltr">${cur[0]}</b>.<br>${cur[3]}<br><button class="listen" onclick='speak(${JSON.stringify(cur[3])})'>▶ نطق المثال</button>`}scoreEl.textContent='النتيجة: '+score;setTimeout(()=>{i++;if(i<data.length)render();else finish()},1200)}function finish(){bar.style.width='100%';a.innerHTML='';count.textContent='🎉 اكتمل التحدي';r.innerHTML=`النتيجة النهائية: <b>${score}/${data.length}</b><br>راجع الكلمات التي أخطأت فيها ثم أعد المحاولة.`;if(window.HMActivityComplete)HMActivityComplete.complete('grade8-u1-l1','vocabulary',20)}render();</script></body></html>
