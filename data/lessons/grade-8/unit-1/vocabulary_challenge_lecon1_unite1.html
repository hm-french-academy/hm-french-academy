<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Vocabulary Challenge · Leçon 1</title><style>body{margin:0;font-family:Arial,Cairo,sans-serif;background:linear-gradient(180deg,#f5f8fd,#edf3fb);color:#17223b}.box{max-width:820px;margin:24px auto;background:#fff;padding:22px;border-radius:28px;border:1px solid #e2e8f2;box-shadow:0 14px 36px #14264a12}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#713bd1);color:#fff;padding:24px;border-radius:22px;margin-bottom:18px}.hero h1{margin:0 0 8px}.hero p{line-height:1.8;margin:6px 0}.progress{height:9px;background:#ffffff38;border-radius:9px;overflow:hidden;margin-top:14px}.progress i{display:block;height:100%;background:#fff;width:0;transition:.25s}.qcard{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:center;background:linear-gradient(145deg,#f7f9fd,#fff);border:1px solid #e2e8f2;border-radius:22px;padding:18px}.pic{height:185px;border-radius:20px;background:linear-gradient(145deg,#eef4ff,#fff2f8);display:grid;place-items:center;font-size:88px;box-shadow:inset 0 0 0 1px #fff}.q{font-size:24px;font-weight:900;line-height:1.5}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.btn{padding:14px;margin:0;border-radius:14px;border:1px solid #cfd8e7;background:#fff;cursor:pointer;font-weight:900;font-size:16px}.btn.selected{border:2px solid #2563eb;background:#edf3ff}.btn.correct{background:#eaf8f5;border-color:#20a45a}.btn.wrong{background:#fff3f3;border-color:#d9534f}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.action{border:0;border-radius:13px;padding:12px 18px;font-weight:900;cursor:pointer}.check{background:#20a45a;color:#fff}.next{background:#2563eb;color:#fff}.next[disabled],.check[disabled]{opacity:.45;cursor:not-allowed}.after{margin-top:15px;padding:15px;border-radius:16px;background:#f8faff;line-height:1.9;min-height:58px}.listen{border:0;background:#e92d83;color:#fff;padding:10px 14px;border-radius:12px;font-weight:900;cursor:pointer;margin:4px 4px 0 0}.score{margin-top:12px;text-align:center;color:#68758b;font-weight:900}@media(max-width:600px){.qcard{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.pic{height:155px;font-size:76px}}</style></head><body><section class="box"><div class="hero"><h1>📚 Vocabulary Challenge</h1><p>انظر إلى الصورة، اختر المعنى العربي، ثم تحقّق من إجابتك وتعلّم الكلمة والمثال مع النطق.</p><div class="progress"><i id="bar"></i></div></div><div class="qcard"><div class="pic" id="pic">❓</div><div><div class="q">ما المعنى المناسب لهذه الصورة؟</div><p id="count">السؤال 1 / 10</p></div></div><div class="choices" id="a"></div><div class="controls"><button class="action check" id="check" disabled>✓ تحقّق من الإجابة</button><button class="action next" id="next" disabled>السؤال التالي →</button></div><div class="after" id="r">اختر إجابة أولاً، ثم اضغط «تحقّق».</div><div class="score" id="score">النتيجة: 0</div></section><script src="../../../../scripts/speech-runtime.js?v=20260815-vocab-audio"></script><script src="../../../../scripts/activity-complete.js?v=20260815-vocab-audio"></script><script>const data=[['cantine','كانتين','🍽️','Je mange à la cantine.'],['cour','الفناء المدرسي','🏫','Je joue dans la cour.'],['tableau','السبورة','🖼️','Le tableau est dans la classe.'],['chaise','كرسي','🪑',"Je m'assois sur une chaise."],['bibliothèque','المكتبة','📖','Je lis à la bibliothèque.'],['gymnase','صالة الألعاب','🤸','Je fais du sport au gymnase.'],['laboratoire','المعمل','🧪','Nous travaillons au laboratoire.'],['terrain de sport','أرض الملعب','⚽','Je joue sur le terrain de sport.'],['fenêtre','الشباك','🪟','La fenêtre est grande.'],['bureau','المكتب','🗄️','Le professeur est devant son bureau.']];let i=0,score=0,selected=null,checked=false;const pic=document.getElementById('pic'),count=document.getElementById('count'),a=document.getElementById('a'),r=document.getElementById('r'),bar=document.getElementById('bar'),scoreEl=document.getElementById('score'),check=document.getElementById('check'),next=document.getElementById('next');function speak(t,button){if(window.HMSpeech&&HMSpeech.speak){return HMSpeech.speak(t,{button,lang:'fr-FR',rate:.84})}if(window.speechSynthesis&&window.SpeechSynthesisUtterance){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.84;speechSynthesis.resume();speechSynthesis.speak(u);return Promise.resolve(true)}return Promise.resolve(false)}function shuffle(x){return [...x].sort(()=>Math.random()-.5)}function listenButton(text,label){const b=document.createElement('button');b.className='listen';b.type='button';b.textContent=label;b.addEventListener('click',()=>speak(text,b));return b}function render(){selected=null;checked=false;const cur=data[i];pic.textContent=cur[2];count.textContent='السؤال '+(i+1)+' / '+data.length;bar.style.width=(i/data.length*100)+'%';a.innerHTML=shuffle(data.map(x=>x[1])).map(v=>`<button class="btn" type="button">${v}</button>`).join('');a.querySelectorAll('.btn').forEach(b=>b.onclick=()=>{if(checked)return;a.querySelectorAll('.btn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=b.textContent;check.disabled=false;r.textContent='تم اختيار الإجابة. اضغط «تحقّق» لرؤية النتيجة.'});check.disabled=true;next.disabled=true;r.textContent='اختر إجابة أولاً، ثم اضغط «تحقّق».'}check.onclick=()=>{if(!selected||checked)return;checked=true;const cur=data[i],ok=selected===cur[1];const btns=[...a.querySelectorAll('.btn')];btns.forEach(b=>{b.disabled=true;if(b.textContent===cur[1])b.classList.add('correct');else if(b.textContent===selected)b.classList.add('wrong')});r.innerHTML='';const text=document.createElement('span');text.innerHTML=ok?`✓ أحسنت! <b dir="ltr">${cur[0]}</b><br>${cur[3]}<br>`:`✗ الإجابة الصحيحة هي: <b>${cur[1]}</b><br><b dir="ltr">${cur[0]}</b> — ${cur[3]}<br>`;r.appendChild(text);r.appendChild(listenButton(cur[0],'🔊 نطق الكلمة'));r.appendChild(listenButton(cur[3],'▶ نطق المثال'));score+=ok?1:0;scoreEl.textContent='النتيجة: '+score;next.disabled=false;if(i===data.length-1)next.textContent='إنهاء التحدي'};next.onclick=()=>{if(!checked)return;i++;if(i<data.length){next.textContent='السؤال التالي →';render()}else{bar.style.width='100%';a.innerHTML='';check.disabled=true;next.disabled=true;count.textContent='🎉 اكتمل التحدي';r.innerHTML=`النتيجة النهائية: <b>${score}/${data.length}</b><br>يمكنك العودة للمفردات ومراجعة الكلمات والأمثلة.`;if(window.HMActivityComplete)HMActivityComplete.complete('grade8-u1-l1','vocabulary',20)}};render();</script></body></html>
