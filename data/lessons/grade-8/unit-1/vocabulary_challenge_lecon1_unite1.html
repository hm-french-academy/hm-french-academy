<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Vocabulary Challenge · Leçon 1</title><style>body{margin:0;font-family:Arial,Cairo,sans-serif;background:linear-gradient(180deg,#f5f8fd,#edf3fb);color:#17223b}.box{max-width:760px;margin:30px auto;background:#fff;padding:25px;border-radius:26px;border:1px solid #e2e8f2;box-shadow:0 14px 36px #14264a12}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#713bd1);color:#fff;padding:22px;border-radius:20px;margin-bottom:18px}.qcard{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center;background:#f7f9fd;border-radius:20px;padding:18px}.pic{height:150px;border-radius:18px;background:linear-gradient(145deg,#eef4ff,#fff2f8);display:grid;place-items:center;font-size:76px}.q{font-size:22px;font-weight:900}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.btn{padding:13px;margin:0;border-radius:13px;border:1px solid #cfd8e7;background:#fff;cursor:pointer;font-weight:900}.btn.correct{background:#eaf8f5;border-color:#20a45a}.btn.wrong{background:#fff3f3;border-color:#d9534f}.after{margin-top:15px;padding:14px;border-radius:16px;background:#f8faff;line-height:1.8}.listen{border:0;background:#e92d83;color:#fff;padding:10px 14px;border-radius:12px;font-weight:900;cursor:pointer}@media(max-width:600px){.qcard{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.pic{height:135px}}</style></head><body><section class="box"><div class="hero"><h1>📚 Vocabulary Challenge</h1><p>تعلم من الصورة: اختر المعنى العربي الصحيح، ثم استمع للكلمة والمثال.</p></div><div class="qcard"><div class="pic" id="pic">❓</div><div><div class="q">ما المعنى المناسب لهذه الصورة؟</div><p id="fr" dir="ltr"></p></div></div><div class="choices" id="a"></div><div class="after" id="r">ابدأ بالاختيار.</div></section><script src="../../../../scripts/activity-complete.js?v=20260814-vocab3"></script><script>const data=[['cantine','كانتين','🍽️','Je mange à la cantine.'],['cour','الفناء المدرسي','🏫','Je joue dans la cour.'],['tableau','السبورة','🖼️','Le tableau est dans la classe.'],['chaise','كرسي','🪑','Je m\'assois sur une chaise.'],['bibliothèque','المكتبة','📖','Je lis à la bibliothèque.'],['gymnase','صالة الألعاب','🤸','Je fais du sport au gymnase.']];let i=0,score=0,locked=false;const pic=document.getElementById('pic'),fr=document.getElementById('fr'),a=document.getElementById('a'),r=document.getElementById('r');function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.86;speechSynthesis.speak(u)}function shuffle(x){return [...x].sort(()=>Math.random()-.5)}function render(){locked=false;const cur=data[i];pic.textContent=cur[2];fr.textContent='';a.innerHTML=shuffle(data.map(x=>x[1])).map(v=>`<button class="btn" onclick="ans(${JSON.stringify(v)},this)">${v}</button>`).join('');r.textContent='اختر المعنى المناسب للصورة.'}function ans(v,b){if(locked)return;locked=true;const cur=data[i];if(v===cur[1]){score++;b.classList.add('correct');r.innerHTML=`✓ صحيح: <b dir="ltr">${cur[0]}</b><br>${cur[3]}<br><button class="listen" onclick='speak(${JSON.stringify(cur[0])})'>🔊 نطق الكلمة</button> <button class="listen" onclick='speak(${JSON.stringify(cur[3])})'>▶ نطق المثال</button>`}else{b.classList.add('wrong');r.textContent='✗ إجابة غير صحيحة — راجع الصورة ثم انتقل للسؤال التالي.'}setTimeout(()=>{i++;if(i<data.length)render();else{r.textContent='🎉 النتيجة '+score+'/'+data.length+' · +20 XP';if(window.HMActivityComplete)HMActivityComplete.complete('grade8-u1-l1','vocabulary',20)}},900)}render();</script></body></html>
