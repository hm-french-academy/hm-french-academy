<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Vocabulary Challenge · Leçon 1</title><style>body{font-family:Arial,Cairo,sans-serif;background:#f4f7fc;color:#17223b}.box{max-width:700px;margin:auto;background:#fff;padding:25px;border-radius:22px}.q{font-size:22px;font-weight:bold}.btn{padding:12px;margin:5px;border-radius:12px;border:1px solid #2563eb;background:#fff;cursor:pointer}.btn:disabled{cursor:default}.correct{background:#eaf8f5;border-color:#20a45a}.wrong{background:#fff3f3;border-color:#d9534f}</style></head><body><section class="box"><h1>📚 Vocabulary Challenge</h1><p>اختبر مفردات المدرسة بطريقة سريعة ومختلفة عن التقييم الرسمي.</p><div class="q" id="q"></div><div id="a"></div><p id="r"></p></section><script src="../../../../scripts/activity-complete.js?v=20260811-vocab2"></script><script>const data=[['cantine','مكان تناول الطعام'],['cour','الفناء المدرسي'],['tableau','السبورة'],['trousse','المقلمة'],['stylo','القلم']];let i=0,score=0,locked=false;const q=document.getElementById('q'),a=document.getElementById('a'),r=document.getElementById('r');function shuffle(x){return [...x].sort(()=>Math.random()-.5)}function render(){locked=false;const current=data[i];q.textContent=current[1];const options=shuffle(data.map(x=>x[0]));a.innerHTML=options.map(v=>`<button class="btn" onclick="ans('${v}',this)">${v}</button>`).join('');r.textContent=''}function ans(x,b){if(locked)return;locked=true;if(x===data[i][0]){score++;b.classList.add('correct');r.textContent='✓ إجابة صحيحة'}else{b.classList.add('wrong');r.textContent='✗ إجابة غير صحيحة — حاول في السؤال التالي'}setTimeout(()=>{i++;if(i<data.length){render()}else{r.textContent='🎉 النتيجة '+score+'/'+data.length+' · +20 XP';if(window.HMActivityComplete)HMActivityComplete.complete('grade8-u1-l1','vocabulary',20)}},450)}render();</script></section></body></html>
