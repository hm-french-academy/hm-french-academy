<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>HM Academy | Vocabulary Challenge</title><style>body{font-family:Arial;background:#f4f7fc;padding:20px}.box{max-width:700px;margin:auto;background:#fff;padding:25px;border-radius:22px}.q{font-size:22px;font-weight:bold}.btn{padding:12px;margin:5px;border-radius:12px;border:1px solid #2563eb;background:#fff;cursor:pointer}</style></head><body><section class="box"><h1>📚 Vocabulary Challenge</h1><div class="q" id="q"></div><div id="a"></div><p id="r"></p></section><script src="../../../../scripts/activity-complete.js"></script><script>let data=[['cantine','مكان تناول الطعام'],['bibliothèque','مكان الكتب'],['classe','مكان الدراسة']],i=0,score=0;function render(){q.textContent=data[i][1];a.innerHTML=data.map(x=>`<button class="btn" onclick="ans('${x[0]}')">${x[0]}</button>`).join('')}function ans(x){if(x===data[i][0])score++;i++;if(i<data.length)render();else{r.textContent='النتيجة '+score+'/3 +20 XP';if(window.HMActivityComplete)HMActivityComplete.complete('grade8-u1-l1','vocabulary-challenge',20)}}render();</script></section></body></html>
