<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Vocabulary Challenge · Leçon 1</title><style>body{font-family:Arial,Cairo,sans-serif;background:#f4f7fc;color:#17223b}.box{max-width:700px;margin:auto;background:#fff;padding:25px;border-radius:22px}.q{font-size:22px;font-weight:bold}.btn{padding:12px;margin:5px;border-radius:12px;border:1px solid #2563eb;background:#fff;cursor:pointer}.btn:disabled{cursor:default}.correct{background:#eaf8f5;border-color:#20a45a}</style></head><body><section class="box"><h1>📚 Vocabulary Challenge</h1><p>اختبر مفردات المدرسة بطريقة سريعة ومختلفة عن التقييم الرسمي.</p><div class="q" id="q"></div><div id="a"></div><p id="r"></p></section><script src="../../../../scripts/activity-complete.js?v=20260811-vocab1"></script><script>const data=[['cantine','مكان تناول الطعام'],['cour','الفناء المدرسي'],['tableau','السبورة'],['trousse','المقلمة'],['stylo','القلم']];let i=0,score=0,locked=false;const q=document.getElementById('q'),a=document.getElementById('a'),r=document.getElementById('r');function render(){locked=false;q.textContent=data[i][1];a.innerHTML=data.map(x=>`<button class="btn" onclick="ans('${x[0]}',this)">${x[0]}</button>`).join('')}function ans(x,b){if(locked)return;locked=true;if(x===data[i][0]){score++;b.classList.add('correct');r.textContent='✓ إجابة صحيحة'}else{r.textContent='✗ حاول في السؤال التالي'}setTimeout(()=>{i++;if(i<data.length){render()}else{r.textContent='🎉 النتيجة '+score+'/'+data.length+' · +20 XP';if(window.HMActivityComplete)HMActivityComplete.complete('grade8-u1-l1','vocabulary',20)}},450)}render();</script></section></body></html>
