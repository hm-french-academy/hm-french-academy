<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Leçon 1 — À l'école</title><style>:root{--navy:#14264a;--blue:#2563eb;--pink:#e92d83;--purple:#713bd1;--green:#20a45a;--line:#e3e8f1;--muted:#6b7890;--ink:#17223b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7f9fd,#eef3fb);color:var(--ink);font-family:Arial,"Cairo",sans-serif}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 24px;position:sticky;top:0;z-index:20}.brand{font-weight:900;color:var(--navy);font-size:18px}.brand a{color:inherit;text-decoration:none}.mark{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;margin-left:8px}.topnav{display:flex;gap:18px;margin:auto}.topnav a{text-decoration:none;color:#536078;font-weight:800;font-size:13px}.xp{padding:8px 13px;border:1px solid #efd27d;border-radius:17px;background:#fffaf0;color:#886416;font-weight:800}.avatar{font-size:22px;text-decoration:none}.main{max-width:1120px;margin:auto;padding:22px 14px 50px}.crumb{font-size:12px;color:#77839a;margin-bottom:14px}.crumb a{color:#315aa4;text-decoration:none;font-weight:800}.hero{background:linear-gradient(135deg,#173a82,#2563eb 58%,#14b8a6);color:#fff;border-radius:30px;padding:28px;display:flex;align-items:center;justify-content:space-between;gap:18px;box-shadow:0 20px 50px rgba(37,99,235,.17)}.hero h1{margin:0;font-size:40px}.hero p{margin:8px 0;opacity:.92}.hero-art{width:210px;height:135px;border-radius:24px;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:76px}.tabs{display:flex;gap:7px;overflow:auto;margin:18px 0 14px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:18px}.tab{border:0;background:transparent;color:#58647b;padding:12px 16px;border-radius:14px;font-weight:900;white-space:nowrap;cursor:pointer}.tab.active{background:var(--pink);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 14px 40px rgba(20,38,74,.08)}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}.head h2{margin:0;color:var(--navy);font-size:30px}.head p{margin:6px 0;color:var(--muted);font-size:13px;line-height:1.7}.listen{border:0;background:#edf3ff;color:#2850a3;border-radius:13px;padding:11px 14px;font-weight:900;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.word{border:1px solid var(--line);border-radius:22px;padding:12px;text-align:center;background:#fff;box-shadow:0 8px 22px rgba(20,38,74,.06)}.pic{height:180px;border-radius:18px;background:linear-gradient(145deg,#eef4ff,#fff2f8);display:grid;place-items:center;font-size:88px;cursor:pointer}.pic-hint{font-size:10px;color:#7a8497;margin-top:6px}.fr{font-weight:900;font-size:22px;margin-top:9px;direction:ltr}.ar{color:#2d59a5;font-weight:900;font-size:18px;margin:5px 0}.example{background:#f7f9fd;border-right:4px solid var(--pink);padding:11px 14px;border-radius:12px;margin:10px 0;line-height:1.7;direction:ltr;text-align:left}.example-ar{direction:rtl;text-align:right;color:#66738a;font-size:12px}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.speak,.learn{border:0;border-radius:12px;padding:10px 13px;font-weight:900;cursor:pointer}.speak{background:var(--pink);color:#fff}.learn{background:#edf8f1;color:#197441}.learn.done{background:#dff5e7}.media,.grammar,.practice{display:grid;grid-template-columns:1fr;gap:16px}.card,.rule-card,.exercise{border:1px solid var(--line);border-radius:20px;padding:20px;background:#fff}.media-art{height:210px;border-radius:17px;background:#eaf0f8;display:grid;place-items:center;font-size:72px;margin:13px 0;cursor:pointer}.primary{display:block;text-align:center;padding:13px;border-radius:13px;background:var(--purple);color:#fff;text-decoration:none;font-weight:900}.formula{direction:ltr;text-align:left;background:#f7f9fd;border-radius:16px;padding:16px;line-height:2;font-weight:800}.explain{line-height:1.9;color:#536078}.exercise h3,.rule-card h3{margin-top:0;color:var(--navy)}.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.option{border:1px solid #d8deea;background:#fff;border-radius:12px;padding:10px;font-weight:800;cursor:pointer}.option.selected{border-color:var(--blue);background:#edf3ff;color:#1f4fae}.check{border:0;border-radius:12px;padding:12px;color:#fff;background:var(--green);font-weight:900;cursor:pointer}.feedback{margin-top:9px;font-weight:900;min-height:20px}.score{margin-top:17px;padding:14px;border-radius:15px;background:#f7f9fd;color:#59677e;text-align:center;font-weight:900}.back-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.back-row a{display:inline-flex;text-decoration:none;padding:11px 15px;border-radius:13px;background:#fff;border:1px solid var(--line);color:#263a60;font-weight:900}@media(max-width:650px){.top{height:62px;padding:8px 12px}.topnav{display:none}.xp{margin-right:auto;font-size:11px}.main{padding:12px 8px 35px}.hero{display:block;padding:20px}.hero h1{font-size:30px}.hero-art{width:100%;height:105px;margin-top:14px}.panel{padding:14px;border-radius:19px}.grid{grid-template-columns:1fr}.pic{height:170px}.head{display:block}.listen{width:100%;margin-top:10px}.options{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand"><a href="../../../../index.html"><span class="mark">HM</span>HM ACADEMY</a></div><nav class="topnav"><a href="../../../../index.html">الرئيسية</a><a href="../../../../course.html">المسارات</a><a href="../../../../library.html">المكتبة</a><a href="../../../../dashboard.html">التقدم</a><a href="../../../../settings.html">الإعدادات</a></nav><div class="xp">⭐ 0 XP</div><a class="avatar" href="../../../../student-profile.html">👨‍🎓</a></header><main class="main"><div class="crumb"><a href="../../../../index.html">الرئيسية</a> › <a href="../../../../grade-8.html">الصف الثاني الإعدادي</a> › الوحدة الأولى › <strong>الدرس الأول</strong></div><section class="hero"><div><h1>Leçon 1 : <span style="color:#ffd7e9">À l'école</span></h1><p>Français — 2e année préparatoire</p></div><div class="hero-art">🏫</div></section><nav class="tabs" id="tabs"></nav><section class="panel" id="panel"></section><div class="back-row"><a href="../../../../grade-8.html#unit-1">← العودة إلى الوحدة</a><a href="../../../../index.html">⌂ الرئيسية</a><a href="../../../../dashboard.html">📈 لوحة الطالب</a></div></main><script>
const vocabData={facilities:[["Une cantine","كانتين","🍽️","Je mange à la cantine.","أنا آكل في الكانتين."],["Une cour","فناء","🏫","Je joue dans la cour.","ألعب في الفناء."],["Des classes","فصول","🏫","Il y a des classes dans l'école.","توجد فصول في المدرسة."],["Un gymnase","صالة ألعاب مغطاة","🤸","Je fais du sport au gymnase.","أمارس الرياضة في صالة الألعاب."],["Un CDI","صالة الوسائط المتعددة","📚","Je vais au CDI.","أذهب إلى صالة الوسائط."],["Un laboratoire","معمل","🧪","Nous travaillons au laboratoire.","نعمل في المعمل."],["Un terrain de sport","أرض الملعب","⚽","Je joue sur le terrain de sport.","ألعب في الملعب."],["Une bibliothèque","مكتبة","📖","Je lis à la bibliothèque.","أقرأ في المكتبة."]],classroom:[["Un bureau","مكتب","🗄️","Le professeur est devant son bureau.","المعلم أمام مكتبه."],["Un tableau","سبورة","🖼️","Le tableau est dans la classe.","السبورة في الفصل."],["Une porte","باب","🚪","La porte est ouverte.","الباب مفتوح."],["Une fenêtre","شباك","🪟","La fenêtre est grande.","الشباك كبير."],["Un banc","مقعد","💺","Je m'assois sur un banc.","أجلس على مقعد."],["Un panneau","لوحة تعليمية","📌","Il y a un panneau dans la classe.","توجد لوحة تعليمية في الفصل."],["Un TNI","سبورة ذكية","🖥️","Le professeur utilise le TNI.","المعلم يستخدم السبورة الذكية."],["Une horloge","ساعة حائط","🕐","L'horloge est au mur.","الساعة على الحائط."]]};
const sections=[["facilities","🏫 المرافق"],["classroom","🪑 في الفصل"],["video","▶ الفيديو"],["grammar","📘 القواعد"],["practice","🎯 تدرّب بنفسك"]];const tabs=document.getElementById('tabs'),panel=document.getElementById('panel');let score=0,answered={};function speak(t){if(!('speechSynthesis'in window)){alert('النطق غير متاح في هذا المتصفح.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.86;speechSynthesis.speak(u)}function key(id,i){return 'hm_vocab_'+id+'_'+i}function learned(id,i){return localStorage.getItem(key(id,i))==='1'}function markLearned(id,i,b){localStorage.setItem(key(id,i),'1');b.textContent='✓ تم التعلم';b.classList.add('done')}function vocab(id,title){const a=vocabData[id];return `<div class="head"><div><h2>${title}</h2><p><b>Vocabulary System</b> — صورة + كلمة + معنى + مثال + نطق الكلمة والمثال.</p></div><button class="listen" onclick='speak(${JSON.stringify(a.map(x=>x[0]).join('. '))})'>🔊 استمع إلى المجموعة</button></div><div class="grid">${a.map((x,i)=>`<article class="word"><div class="pic" role="button" tabindex="0" onclick='speak(${JSON.stringify(x[0])})'>${x[2]}</div><div class="pic-hint">اضغط على الصورة لسماع النطق</div><div class="fr">${x[0]}</div><div class="ar">${x[1]}</div><div class="example">"${x[3]}"<div class="example-ar">${x[4]}</div></div><div class="actions"><button class="speak" onclick='speak(${JSON.stringify(x[0])})'>🔊 نطق الكلمة</button><button class="speak" onclick='speak(${JSON.stringify(x[3])})'>▶ نطق المثال</button><button class="learn ${learned(id,i)?'done':''}" onclick='markLearned(${JSON.stringify(id)},${i},this)'>${learned(id,i)?'✓ تم التعلم':'☆ حفظ كمكتسبة'}</button></div></article>`).join('')}</div>`}function grammar(){return `<div class="head"><div><h2>📘 قواعد الوحدة الأولى</h2><p>قواعد داعمة مرتبطة بالدرس.</p></div></div><div class="grammar"><article class="rule-card"><h3>Aimer / Préférer</h3><p class="explain"><b>Aimer</b> تعني يحب، و<b>Préférer</b> تعني يفضّل.</p><div class="formula">J'aime / je préfère<br>Tu aimes / tu préfères<br>Il / Elle aime / préfère<br>Nous aimons / préférons<br>Vous aimez / préférez</div><p>J'aime l'école. — أنا أحب المدرسة.</p></article><article class="rule-card"><h3>Il y a / Il n'y a pas de</h3><p class="explain">نستخدم <b>Il y a</b> للإثبات و<b>Il n'y a pas de</b> للنفي.</p><div class="formula">Il y a un tableau.<br>Il n'y a pas de tableau.</div></article></div>`}function video(){return `<div class="head"><div><h2>🎬 فيديو الدرس</h2><p>Lexique de l'école</p></div></div><div class="media"><article class="card"><div class="media-art">▶️</div><a class="primary" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=ii5J7ZMT5EY">▶ مشاهدة الفيديو على YouTube</a></article></div>`}function practice(){return `<div class="head"><div><h2>🎯 تدرّب بنفسك</h2><p>اختر الإجابة ثم تحقق.</p></div></div><div class="practice"><article class="exercise"><h3>1️⃣ معنى Une piscine</h3><div class="options"><button class="option" onclick="pick(this,'1','مكتبة')">مكتبة</button><button class="option" onclick="pick(this,'1','حمام سباحة')">حمام سباحة</button><button class="option" onclick="pick(this,'1','معمل')">معمل</button></div><button class="check" onclick="check('1','حمام سباحة')">تحقق</button><div id="f1" class="feedback"></div></article><article class="exercise"><h3>2️⃣ استمع واكتب</h3><button class="listen" onclick="speak('Une horloge')">🔊 استمع</button><input id="i2" style="width:100%;padding:12px;margin:10px 0;border:1px solid #d8deea;border-radius:12px" placeholder="اكتب الكلمة بالفرنسية"><button class="check" onclick="checkText()">تحقق</button><div id="f2" class="feedback"></div></article></div><div class="score">النتيجة: <span id="score">0</span> / 2</div>`}function pick(b,q,v){b.parentNode.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');b.dataset.value=v}function check(q,a){const b=document.querySelector('.option.selected');if(!b)return;const ok=b.dataset.value===a;document.getElementById('f'+q).textContent=ok?'✓ إجابة صحيحة، أحسنت!':'✗ حاول مرة أخرى.';if(ok&&!answered[q]){answered[q]=1;score++;document.getElementById('score').textContent=score}}function checkText(){const ok=(document.getElementById('i2').value||'').trim().toLowerCase()==='une horloge';document.getElementById('f2').textContent=ok?'✓ إجابة صحيحة!':'✗ أعد الاستماع وحاول مرة أخرى.';if(ok&&!answered[2]){answered[2]=1;score++;document.getElementById('score').textContent=score}}function render(k){if(k==='facilities')return vocab(k,'المرافق');if(k==='classroom')return vocab(k,'مفردات الفصل');if(k==='video')return video();if(k==='grammar')return grammar();return practice()}function activate(k){if(!sections.some(x=>x[0]===k))k='facilities';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.key===k));panel.innerHTML=render(k);history.replaceState(null,'','#'+k)}sections.forEach(s=>{const b=document.createElement('button');b.className='tab';b.dataset.key=s[0];b.textContent=s[1];b.onclick=()=>activate(s[0]);tabs.appendChild(b)});activate(location.hash.slice(1)||'facilities');
</script></body></html>
