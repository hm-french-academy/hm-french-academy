<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Leçon 1 — À l'école</title><style>:root{--navy:#14264a;--blue:#2563eb;--pink:#e92d83;--purple:#713bd1;--green:#20a45a;--orange:#f59b18;--bg:#f5f8fd;--line:#e4e9f2;--muted:#6b7890}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17223b;font-family:Arial,"Cairo",sans-serif}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 24px;position:sticky;top:0;z-index:10}.brand{font-weight:900;color:var(--navy)}.mark{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#e92d83,#713bd1);color:#fff;margin-left:8px}.topnav{display:flex;gap:18px;margin:auto}.topnav a{text-decoration:none;color:#536078;font-weight:700;font-size:13px}.xp{padding:8px 13px;border:1px solid #efd27d;border-radius:17px;background:#fffaf0;color:#886416;font-weight:800}.avatar{font-size:22px;text-decoration:none}.main{max-width:1100px;margin:auto;padding:22px 14px 45px}.crumb{font-size:12px;color:#77839a;margin-bottom:14px}.hero{background:linear-gradient(135deg,#173a82,#2563eb 58%,#14b8a6);color:#fff;border-radius:28px;padding:25px;display:flex;align-items:center;justify-content:space-between;gap:18px;box-shadow:0 20px 50px rgba(37,99,235,.16)}.hero h1{margin:0;font-size:38px}.hero p{margin:8px 0 0;opacity:.9}.hero-art{width:190px;height:125px;border-radius:22px;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:70px}.tabs{display:flex;gap:7px;overflow:auto;margin:18px 0 14px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:18px}.tab{border:0;background:transparent;color:#58647b;padding:11px 15px;border-radius:13px;font-weight:800;white-space:nowrap}.tab.active{background:var(--pink);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 12px 35px rgba(20,38,74,.08)}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}.head h2{margin:0;color:var(--navy);font-size:28px}.head p{margin:6px 0;color:var(--muted);font-size:12px}.listen{border:0;background:#edf3ff;color:#2850a3;border-radius:13px;padding:10px 14px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}.word{border:1px solid var(--line);border-radius:18px;padding:10px;text-align:center;background:#fff}.pic{height:115px;border-radius:14px;background:linear-gradient(145deg,#f1f6ff,#fff2f8);display:grid;place-items:center;font-size:58px}.fr{font-weight:900;font-size:16px;margin-top:9px;direction:ltr}.ar{color:#2d59a5;font-weight:800;margin:4px 0 8px}.speak{width:40px;height:40px;border:0;border-radius:50%;background:var(--pink);color:#fff}.media{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{border:1px solid var(--line);border-radius:20px;padding:20px;background:#faf7ff}.media-art{height:160px;border-radius:16px;background:#eaf0f8;display:grid;place-items:center;font-size:70px;margin:13px 0}.primary{display:block;text-align:center;padding:12px;border-radius:13px;background:var(--purple);color:#fff;text-decoration:none;font-weight:800}.rule{background:#fff;border-radius:15px;padding:16px;line-height:2}.practice{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.exercise{border:1px solid var(--line);border-radius:18px;padding:16px;min-height:170px;display:flex;flex-direction:column}.exercise h3{margin:0 0 8px;color:var(--navy)}.exercise p{font-size:12px;color:var(--muted);flex:1}.exercise button{border:0;border-radius:12px;padding:10px;color:#fff;font-weight:800}.e1 button{background:#2878dc}.e2 button{background:var(--green)}.e3 button{background:var(--orange)}.e4 button{background:var(--purple)}.feedback{margin-top:8px;font-size:12px;font-weight:800}.note{margin-top:18px;padding:13px;border-radius:14px;background:#f7f9fd;color:#6b7890;font-size:11px}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.practice{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.top{height:62px;padding:8px 12px}.topnav{display:none}.xp{margin-right:auto;font-size:11px}.main{padding:12px 8px 35px}.hero{display:block;padding:20px}.hero h1{font-size:30px}.hero-art{width:100%;height:105px;margin-top:14px}.panel{padding:14px;border-radius:19px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.pic{height:112px}.media,.practice{grid-template-columns:1fr}.head{display:block}.listen{width:100%;margin-top:10px}}</style></head><body><header class="top"><div class="brand"><span class="mark">HM</span>HM ACADEMY</div><nav class="topnav"><a href="../../../index.html">الرئيسية</a><a href="../../../course.html">المسارات</a><a href="../../../library.html">المكتبة</a><a href="../../../dashboard.html">التقدم</a><a href="../../../settings.html">الإعدادات</a></nav><div class="xp">⭐ 0 XP</div><a class="avatar" href="../../../student-profile.html">👨‍🎓</a></header><main class="main"><div class="crumb">الرئيسية › الصف الثاني الإعدادي › الوحدة الأولى: في المدرسة › الدرس الأول</div><section class="hero"><div><h1>Leçon 1 : <span style="color:#ffd7e9">À l'école</span></h1><p>Français — 2e année préparatoire</p></div><div class="hero-art">🏫</div></section><nav class="tabs" id="tabs"></nav><section class="panel" id="panel"></section></main><script>const data={facilities:[['Une cantine','كانتين','🍽️'],['Une cour','فناء','🏫'],['Des classes','فصول','🏫'],['Un gymnase','صالة ألعاب مغطاة','🤸'],['Un CDI','صالة الوسائط المتعددة','📚'],['Un laboratoire','معمل','🧪'],['Un terrain de sport','أرض الملعب','⚽'],['Un self-service','قاعة طعام بالمدرسة','🍴'],['Une piscine','حمام سباحة','🏊'],['Une bibliothèque','مكتبة','📖']],classroom:[['Un bureau','مكتب','🗄️'],['Un tableau','سبورة','🧑‍🏫'],['Une porte','باب','🚪'],['Une fenêtre','شباك','🪟'],['Des bancs / Un banc','مقاعد / مقعد','💺'],['Un panneau','لوحة تعليمية','📌'],['Un TNI','سبورة ذكية','🖥️'],['Une horloge','ساعة حائط','🕐'],['Une chaise','كرسي','🪑'],['Une table','منضدة','▰'],['Le globe terrestre','الكرة الأرضية','🌍'],['Un ordinateur','كمبيوتر','💻']]};const sections=[['facilities','🏫 المرافق'],['classroom','🪑 في الفصل'],['video','▶ الفيديو'],['grammar','📘 القواعد'],['practice','🎯 تدرّب بنفسك']];const tabs=document.getElementById('tabs'),panel=document.getElementById('panel');function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.86;speechSynthesis.speak(u)}function vocab(id,title){const a=data[id];return `<div class="head"><div><h2>${title}</h2><p>مفردات هذا القسم فقط، مع الحفاظ على الفصل الأكاديمي بين المجموعات.</p></div><button class="listen" onclick='speak(${JSON.stringify(a.map(x=>x[0]).join('. '))})'>🔊 استمع إلى المجموعة</button></div><div class="grid">${a.map(x=>`<article class="word"><div class="pic">${x[2]}</div><div class="fr">${x[0]}</div><div class="ar">${x[1]}</div><button class="speak" onclick='speak(${JSON.stringify(x[0])})'>🔊</button></article>`).join('')}</div>`}function render(t){if(t==='facilities')return vocab(t,'المرافق');if(t==='classroom')return vocab(t,'مفردات الفصل');if(t==='video')return `<div class="head"><div><h2>🎬 فيديو الدرس</h2><p>فيديو YouTube مرتبط بمحتوى الدرس ويعمل عند الضغط.</p></div></div><div class="media"><article class="card"><h3>Vidéo — Lexique de l'école</h3><div class="media-art">🎬</div><a class="primary" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=ii5J7ZMT5EY">▶ مشاهدة الفيديو</a></article></div>`;if(t==='grammar')return `<div class="head"><div><h2>📘 قواعد الوحدة الأولى</h2><p>القواعد المرتبطة مباشرة بالمحتوى المعتمد.</p></div></div><div class="media"><article class="card"><h3>Aimer / Préférer</h3><div class="rule">J'aime / préfère<br>Tu aimes / préfères<br>Il / Elle aime / préfère<br>Nous aimons / préférons<br>Vous aimez / préférez<br>Ils / Elles aiment / préfèrent</div></article><article class="card"><h3>Il y a / Il n'y a pas de</h3><div class="rule"><b>Il y a</b> un tableau.<br>→ <b>Il n'y a pas de</b> tableau.</div></article></div>`;return `<div class="head"><div><h2>🎯 تدرّب بنفسك</h2><p>تدريبات مرتبطة مباشرة بمفردات وقواعد الدرس.</p></div></div><div class="practice"><article class="exercise e1"><h3>1️⃣ اربط</h3><p>ما الكلمة الفرنسية التي تعني «مكتب»؟</p><button onclick="this.nextElementSibling.textContent='Un bureau ✓'">تحقق</button><div class="feedback"></div></article><article class="exercise e2"><h3>2️⃣ Écoute</h3><p>استمع: Une horloge.</p><button onclick="speak('Une horloge');this.nextElementSibling.textContent='ساعة حائط ✓'">🔊 استمع</button><div class="feedback"></div></article><article class="exercise e3"><h3>3️⃣ Complète</h3><p>Il y a ___ tableau.</p><button onclick="this.nextElementSibling.textContent='un ✓'">تحقق</button><div class="feedback"></div></article><article class="exercise e4"><h3>4️⃣ Quiz</h3><p>ما معنى Une piscine؟</p><button onclick="this.nextElementSibling.textContent='حمام سباحة ✓'">أجب</button><div class="feedback"></div></article></div><div class="note">قاعدة الدقة: لا يتم إدخال مفردات من ملخص الوحدة العامة داخل الدرس إلا إذا كانت موجودة في ملف الدرس نفسه.</div>`}sections.forEach((s,i)=>{const b=document.createElement('button');b.className='tab'+(i===0?' active':'');b.textContent=s[1];b.onclick=()=>{document.querySelectorAll('.tab').forEach((x,j)=>x.classList.toggle('active',j===i));panel.innerHTML=render(s[0]);window.scrollTo({top:0,behavior:'smooth'})};tabs.appendChild(b)});panel.innerHTML=render('facilities');</script></body></html>
