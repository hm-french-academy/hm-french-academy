.hero-art{width:210px;height:145px;border-radius:24px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:78px}.tabs{display:flex;gap:6px;overflow:auto;margin:18px 0 14px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.tab{border:0;background:transparent;color:#58647b;padding:11px 15px;border-radius:13px;font-weight:800;white-space:nowrap;cursor:pointer}.tab.active{background:var(--pink);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:22px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px}.head h2{margin:0;color:var(--navy);font:800 27px Nunito,Cairo,sans-serif}.head p{margin:5px 0 0;color:var(--muted);font-size:12px}.listen{border:0;background:#edf3ff;color:#2850a3;border-radius:13px;padding:10px 14px;font-weight:800;cursor:pointer}.category{margin:22px 0 10px;display:flex;align-items:center;gap:9px}.category h3{margin:0;color:var(--navy);font-size:18px}.category span{color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}.word{border:1px solid var(--line);border-radius:18px;padding:11px;text-align:center;background:#fff;box-shadow:0 5px 16px rgba(20,38,74,.05)}.pic{height:112px;border-radius:14px;background:linear-gradient(145deg,#f1f6ff,#fff2f8);display:grid;place-items:center;font-size:60px}.fr{font:800 16px Nunito,Cairo,sans-serif;margin-top:9px;direction:ltr}.ar{color:#2d59a5;font-weight:800;margin:3px 0 8px}.speak{width:38px;height:38px;border:0;border-radius:50%;background:var(--pink);color:#fff;cursor:pointer}.media{display:grid;grid-template-columns:1fr 1fr;gap:18px}.media-card{border:1px solid var(--line);border-radius:20px;padding:20px;background:linear-gradient(145deg,#f8f1ff,#fff)}.media-card.video{background:linear-gradient(145deg,#f5efff,#fff)}.media-card.grammar{background:linear-gradient(145deg,#fff8e8,#fff)}.media-art{height:165px;border-radius:16px;background:#eaf0f8;display:grid;place-items:center;font-size:70px;margin:13px 0}.primary{display:block;width:100%;padding:12px;border:0;border-radius:13px;background:var(--purple);color:#fff;text-align:center;text-decoration:none;font-weight:800}.rule{background:#fff;border-radius:15px;padding:15px;line-height:2;font-size:14px}.practice-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.exercise{border:1px solid var(--line);border-radius:18px;padding:16px;min-height:180px;display:flex;flex-direction:column}.exercise h3{margin:0 0 7px;color:var(--navy)}.exercise p{font-size:12px;color:var(--muted);flex:1}.exercise button{border:0;border-radius:12px;padding:10px;color:#fff;font-weight:800;cursor:pointer}.e1 button{background:#2878dc}.e2 button{background:var(--green)}.e3 button{background:var(--orange)}.e4 button{background:var(--purple)}.feedback{margin-top:9px;font-size:12px;font-weight:800}.note{margin-top:18px;padding:13px 15px;border-radius:15px;background:#f7f9fd;color:#6b7890;font-size:11px}.complete{margin-top:18px;padding:14px;border-radius:16px;background:linear-gradient(90deg,#fff0f7,#fff9e7);display:flex;justify-content:space-between;align-items:center;gap:12px}.complete a{background:var(--pink);color:#fff;text-decoration:none;padding:10px 15px;border-radius:12px;font-weight:800}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}.practice-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.top{height:62px;padding:9px 12px}.tagline,.topnav{display:none}.xp{margin-right:auto;font-size:11px}.main{padding:12px 9px 35px}.hero{padding:20px;border-radius:22px;display:block}.hero h1{font-size:30px}.hero-art{width:100%;height:115px;margin-top:15px;font-size:60px}.panel{padding:14px;border-radius:19px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.pic{height:115px}.media,.practice-grid{grid-template-columns:1fr}.head{display:block}.listen{width:100%;margin-top:12px}.complete{display:block}.complete a{display:block;text-align:center;margin-top:10px}}</style></head><body><header class="top"><div class="brand"><div class="brandmark">HM</div><div>HM ACADEMY<div class="tagline">Apprendre le français avec plaisir 🇫🇷</div></div></div><nav class="topnav"><a href="../../../index.html">Accueil</a><a href="../../../course.html">Mes Cours</a><a href="../../../library.html">Bibliothèque</a><a href="../../../dashboard.html">Progression</a><a href="../../../settings.html">Paramètres</a></nav><div class="xp">⭐ 0 XP</div><a class="avatar" href="../../../student-profile.html">👨‍🎓</a></header><main class="main"><div class="crumb">Accueil › 2ème année préparatoire › Unité 1 : À l'école › <b>Leçon 1</b></div><section class="hero"><div><h1>Leçon 1 : <span>À l'école</span></h1><p>Français — 2e année préparatoire</p></div><div class="hero-art">🏫</div></section><nav class="tabs" id="tabs"></nav><section class="panel" id="panel"></section></main><script>const source={facilities:[['Une cantine','كانتين','🍽️'],['Une cour','فناء','🏫'],['Des classes','فصول','🏫'],['Un gymnase','صالة ألعاب مغطاة','🤸'],['Un CDI','صالة الوسائط المتعددة','📚'],['Un laboratoire','معمل','🧪'],['Un terrain de sport','أرض الملعب','⚽'],['Un self-service','قاعة طعام بالمدرسة','🍴'],['Une piscine','حمام سباحة','🏊'],['Une bibliothèque','مكتبة','📖']],classroom:[['Un bureau','مكتب','🗄️'],['Un tableau','سبورة','🧑‍🏫'],['Une porte','باب','🚪'],['Une fenêtre','شباك','🪟'],['Des bancs / Un banc','مقاعد / مقعد','💺'],['Un panneau','لوحة تعليمية','📌'],['Un TNI','سبورة ذكية','🖥️'],['Une horloge','ساعة حائط','🕐'],['Une chaise','كرسي','🪑'],['Une table','منضدة','▰'],['Le globe terrestre','الكرة الأرضية','🌍'],['Un ordinateur','كمبيوتر','💻']],professions:[['Un boulanger','خباز','👨‍🍳'],['Une boulangère','خبازة','👩‍🍳']]};const sections=[['facilities','🏫 المرافق'],['classroom','🪑 في الفصل'],['professions','👨‍🍳 المهن'],['video','▶ الفيديو'],['grammar','📘 القواعد'],['practice','🎯 تدرّب بنفسك']];const tabs=document.getElementById('tabs'),panel=document.getElementById('panel');function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.86;speechSynthesis.speak(u)}function wordCard(x){return `<article class="word"><div class="pic">${x[2]}</div><div class="fr">${x[0]}</div><div class="ar">${x[1]}</div><button class="speak" onclick='speak(${JSON.stringify(x[0])})' aria-label="سماع النطق">🔊</button></article>`}function vocab(id,title){const items=source[id];return `<div class="head"><div><h2>${title}</h2><p>المحتوى محفوظ كما ورد في الملف الأصلي، مع فصل المجموعات حتى لا تختلط المفردات.</p></div><button class="listen" onclick='speak(${JSON.stringify(items.map(x=>x[0]).join('. '))})'>🔊 استمع إلى المجموعة</button></div><div class="grid">${items.map(wordCard).join('')}</div>`}function render(type){if(type==='facilities')return vocab(type,'المرافق');if(type==='classroom')return vocab(type,'مفردات الفصل');if(type==='professions')return vocab(type,'المهن المرتبطة بالمحتوى');if(type==='video')return `<div class="head"><div><h2>🎬 فيديو الدرس</h2><p>الفيديو الخارجي يعمل كرابط YouTube عند الضغط عليه.</p></div></div><div class="media"><article class="media-card video"><h3>Vidéo — Lexique de l'école</h3><div class="media-art">🎬</div><a class="primary" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=ii5J7ZMT5EY">▶ مشاهدة الفيديو</a></article></div>`;if(type==='grammar')return `<div class="head"><div><h2>📘 قواعد الوحدة الأولى</h2><p>القواعد هنا مرتبطة مباشرة بالمحتوى المصدر للمراجعة النهائية.</p></div></div><div class="media"><article class="media-card grammar"><h3>Aimer / Préférer</h3><div class="rule">J'aime / préfère<br>Tu aimes / préfères<br>Il / Elle aime / préfère<br>Nous aimons / préférons<br>Vous aimez / préférez<br>Ils / Elles aiment / préfèrent</div></article><article class="media-card grammar"><h3>Il y a / Il n'y a pas de</h3><div class="rule"><b>Il y a</b> un tableau.<br>→ <b>Il n'y a pas de</b> tableau.</div></article></div>`;return `<div class="head"><div><h2>🎯 Entraîne-toi !</h2><p>أنشطة قصيرة مرتبطة بمفردات وقواعد الوحدة، وليست جملة Bonjour فقط.</p></div></div><div class="practice-grid"><article class="exercise e1"><h3>1️⃣ اربط الكلمة بالصورة</h3><p>ما الكلمة الفرنسية التي تعني «مكتب»؟</p><button onclick="this.nextElementSibling.textContent='Un bureau ✓'">تحقق</button><div class="feedback"></div></article><article class="exercise e2"><h3>2️⃣ Écoute</h3><p>استمع ثم اختر المعنى: Une horloge.</p><button onclick="speak('Une horloge');this.nextElementSibling.textContent='ساعة حائط ✓'">🔊 استمع</button><div class="feedback"></div></article><article class="exercise e3"><h3>3️⃣ Complète</h3><p>Il y a ___ tableau.</p><button onclick="this.nextElementSibling.textContent='un tableau ✓'">تحقق</button><div class="feedback"></div></article><article class="exercise e4"><h3>4️⃣ Quiz</h3><p>ما معنى Une piscine؟</p><button onclick="this.nextElementSibling.textContent='حمام سباحة ✓'">أجب</button><div class="feedback"></div></article></div><div class="complete"><b>⭐ أكمل الأنشطة ثم انتقل إلى التقييم.</b><a href="examen_u1-l1.html">📝 فتح التقييم</a></div><div class="note">ملاحظة أكاديمية: تم فصل المرافق والفصل والمهن. ولم تتم إضافة حوار مستقل لأن الملف المصدر الذي نُبني عليه هذا الدرس لا يحتوي حوارًا مستقلًا.</div>`}sections.forEach((s,i)=>{const b=document.createElement('button');b.className='tab'+(i===0?' active':'');b.textContent=s[1];b.onclick=()=>{document.querySelectorAll('.tab').forEach((x,j)=>x.classList.toggle('active',j===i));panel.innerHTML=render(s[0]);window.scrollTo({top:0,behavior:'smooth'})};tabs.appendChild(b)});panel.innerHTML=render('facilities');</script></body></html>
