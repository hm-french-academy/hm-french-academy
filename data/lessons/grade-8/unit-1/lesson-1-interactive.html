<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>HM Academy | Leçon 1 — À l'école</title>
<style>
:root{--navy:#14264a;--blue:#2563eb;--cyan:#19b7b1;--pink:#e92d83;--purple:#713bd1;--green:#20a45a;--orange:#f59b18;--bg:#f4f7fc;--line:#e3e8f1;--muted:#6b7890;--ink:#17223b;--soft:#f8f9fd}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#f7f9fd,#eef3fb);color:var(--ink);font-family:Arial,"Cairo",sans-serif}.top{height:70px;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 24px;position:sticky;top:0;z-index:20;backdrop-filter:blur(10px)}.brand{font-weight:900;color:var(--navy);font-size:18px}.mark{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;margin-left:8px}.topnav{display:flex;gap:18px;margin:auto}.topnav a{text-decoration:none;color:#536078;font-weight:800;font-size:13px}.xp{padding:8px 13px;border:1px solid #efd27d;border-radius:17px;background:#fffaf0;color:#886416;font-weight:800}.avatar{font-size:22px;text-decoration:none}.main{max-width:1120px;margin:auto;padding:22px 14px 50px}.crumb{font-size:12px;color:#77839a;margin-bottom:14px}.hero{background:linear-gradient(135deg,#173a82,#2563eb 58%,#14b8a6);color:#fff;border-radius:30px;padding:28px;display:flex;align-items:center;justify-content:space-between;gap:18px;box-shadow:0 20px 50px rgba(37,99,235,.17)}.hero h1{margin:0;font-size:40px}.hero p{margin:8px 0 0;opacity:.92}.hero-art{width:210px;height:135px;border-radius:24px;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:76px}.tabs{display:flex;gap:7px;overflow:auto;margin:18px 0 14px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 22px rgba(20,38,74,.05)}.tab{border:0;background:transparent;color:#58647b;padding:12px 16px;border-radius:14px;font-weight:900;white-space:nowrap;cursor:pointer}.tab.active{background:var(--pink);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 14px 40px rgba(20,38,74,.08)}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}.head h2{margin:0;color:var(--navy);font-size:30px}.head p{margin:6px 0;color:var(--muted);font-size:13px;line-height:1.7}.listen{border:0;background:#edf3ff;color:#2850a3;border-radius:13px;padding:11px 14px;font-weight:900;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.word{border:1px solid var(--line);border-radius:20px;padding:11px;text-align:center;background:#fff;box-shadow:0 6px 18px rgba(20,38,74,.05);transition:.18s}.word:hover{transform:translateY(-2px);box-shadow:0 12px 25px rgba(20,38,74,.09)}.pic{height:155px;border:0;border-radius:17px;background:linear-gradient(145deg,#eef4ff,#fff2f8);display:grid;place-items:center;font-size:76px;cursor:pointer;user-select:none;outline:none}.pic:focus-visible{box-shadow:0 0 0 4px rgba(37,99,235,.2)}.pic-hint{font-size:10px;color:#7a8497;margin-top:6px}.fr{font-weight:900;font-size:18px;margin-top:9px;direction:ltr}.ar{color:#2d59a5;font-weight:900;margin:5px 0 9px}.speak{width:44px;height:44px;border:0;border-radius:50%;background:var(--pink);color:#fff;font-size:18px;cursor:pointer;box-shadow:0 7px 18px rgba(233,45,131,.2)}.media{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{border:1px solid var(--line);border-radius:20px;padding:20px;background:#faf7ff}.media-art{height:170px;border-radius:17px;background:#eaf0f8;display:grid;place-items:center;font-size:72px;margin:13px 0}.primary{display:block;text-align:center;padding:13px;border-radius:13px;background:var(--purple);color:#fff;text-decoration:none;font-weight:900}.grammar{display:grid;grid-template-columns:1fr 1fr;gap:16px}.rule-card{background:linear-gradient(145deg,#fbf8ff,#f4f7ff);border:1px solid var(--line);border-radius:20px;padding:20px}.rule-card h3{margin-top:0;color:var(--navy);font-size:22px}.formula{direction:ltr;text-align:left;background:#fff;border-radius:16px;padding:16px;line-height:2;font-weight:800}.explain{line-height:1.9;color:#536078}.example{background:#fff;border-right:4px solid var(--pink);padding:11px 14px;border-radius:12px;margin-top:10px}.practice{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.exercise{border:1px solid var(--line);border-radius:20px;padding:18px;min-height:220px;display:flex;flex-direction:column;background:#fff}.exercise h3{margin:0 0 8px;color:var(--navy);font-size:21px}.exercise .q{font-size:14px;color:#4d5b73;line-height:1.8;flex:1}.exercise input,.exercise select{width:100%;padding:12px;border:1px solid #d8deea;border-radius:12px;font-size:15px;background:#fff;margin:8px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.option{border:1px solid #d8deea;background:#fff;border-radius:12px;padding:10px;font-weight:800;cursor:pointer}.option.selected{border-color:var(--blue);background:#edf3ff;color:#1f4fae}.exercise button.check{border:0;border-radius:12px;padding:12px;color:#fff;font-weight:900;cursor:pointer}.e1 button.check{background:#2878dc}.e2 button.check{background:var(--green)}.e3 button.check{background:var(--orange)}.e4 button.check{background:var(--purple)}.feedback{margin-top:9px;font-size:13px;font-weight:900;min-height:20px}.score{margin-top:17px;padding:14px;border-radius:15px;background:#f7f9fd;color:#59677e;text-align:center;font-weight:900}.note{margin-top:18px;padding:14px;border-radius:15px;background:#f7f9fd;color:#6b7890;font-size:12px;line-height:1.8}.hidden{display:none!important}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.top{height:62px;padding:8px 12px}.topnav{display:none}.xp{margin-right:auto;font-size:11px}.main{padding:12px 8px 35px}.hero{display:block;padding:20px}.hero h1{font-size:30px}.hero-art{width:100%;height:105px;margin-top:14px}.panel{padding:14px;border-radius:19px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.pic{height:140px;font-size:68px}.media,.grammar,.practice{grid-template-columns:1fr}.head{display:block}.listen{width:100%;margin-top:10px}.options{grid-template-columns:1fr}.fr{font-size:17px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><span class="mark">HM</span>HM ACADEMY</div><nav class="topnav"><a href="../../../index.html">الرئيسية</a><a href="../../../course.html">المسارات</a><a href="../../../library.html">المكتبة</a><a href="../../../dashboard.html">التقدم</a><a href="../../../settings.html">الإعدادات</a></nav><div class="xp">⭐ 0 XP</div><a class="avatar" href="../../../student-profile.html" aria-label="ملف الطالب">👨‍🎓</a></header>
<main class="main">
<div class="crumb">الرئيسية › الصف الثاني الإعدادي › الوحدة الأولى: في المدرسة › الدرس الأول</div>
<section class="hero"><div><h1>Leçon 1 : <span style="color:#ffd7e9">À l'école</span></h1><p>Français — 2e année préparatoire</p></div><div class="hero-art">🏫</div></section>
<nav class="tabs" id="tabs" aria-label="أقسام الدرس"></nav>
<section class="panel" id="panel"></section>
</main>
<script>
const data={
 facilities:[['Une cantine','كانتين','🍽️'],['Une cour','فناء','🏫'],['Des classes','فصول','🏫'],['Un gymnase','صالة ألعاب مغطاة','🤸'],['Un CDI','صالة الوسائط المتعددة','📚'],['Un laboratoire','معمل','🧪'],['Un terrain de sport','أرض الملعب','⚽'],['Un self-service','قاعة طعام بالمدرسة','🍴'],['Une piscine','حمام سباحة','🏊'],['Une bibliothèque','مكتبة','📖']],
 classroom:[['Un bureau','مكتب','🗄️'],['Un tableau','سبورة','🖼️'],['Une porte','باب','🚪'],['Une fenêtre','شباك','🪟'],['Des bancs / Un banc','مقاعد / مقعد','💺'],['Un panneau','لوحة تعليمية','📌'],['Un TNI','سبورة ذكية','🖥️'],['Une horloge','ساعة حائط','🕐'],['Une chaise','كرسي','🪑'],['Une table','منضدة','▰'],['Le globe terrestre','الكرة الأرضية','🌍'],['Un ordinateur','كمبيوتر','💻']]
};
const sections=[['facilities','🏫 المرافق'],['classroom','🪑 في الفصل'],['video','▶ الفيديو'],['grammar','📘 القواعد'],['practice','🎯 تدرّب بنفسك']];
const tabs=document.getElementById('tabs'),panel=document.getElementById('panel');
let practiceState={score:0,answered:{}};
function speak(t){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.86;window.speechSynthesis.speak(u)}
function stopAll(){if('speechSynthesis' in window)window.speechSynthesis.cancel()}
function vocab(id,title){const a=data[id];return `<div class="head"><div><h2>${title}</h2><p>مفردات هذا القسم فقط. اضغط على الصورة أو زر النطق لسماع الكلمة الفرنسية.</p></div><button class="listen" onclick='speak(${JSON.stringify(a.map(x=>x[0]).join('. '))})'>🔊 استمع إلى المجموعة</button></div><div class="grid">${a.map((x,i)=>`<article class="word"><div class="pic" role="button" tabindex="0" aria-label="تشغيل نطق ${x[0]}" onclick='speak(${JSON.stringify(x[0])})' onkeydown='if(event.key==="Enter"||event.key===" "){event.preventDefault();speak(${JSON.stringify(x[0])})}'>${x[2]}</div><div class="pic-hint">اضغط على الصورة للنطق</div><div class="fr">${x[0]}</div><div class="ar">${x[1]}</div><button class="speak" aria-label="نطق ${x[0]}" onclick='speak(${JSON.stringify(x[0])})'>🔊</button></article>`).join('')}</div>`}
function renderGrammar(){return `<div class="head"><div><h2>📘 قواعد الوحدة الأولى</h2><p>شرح مبسّط مرتبط مباشرة بمحتوى الدرس، مع أمثلة تساعد الطالب على الفهم قبل الانتقال إلى التدريب.</p></div></div><div class="grammar"><article class="rule-card"><h3>Aimer / Préférer</h3><p class="explain"><b>Aimer</b> تعني «يحب»، و<b>Préférer</b> تعني «يفضّل». كلاهما من أفعال المجموعة الأولى وينتهيان في المصدر بـ <b>-er</b>.</p><div class="formula">J'aime / je préfère<br>Tu aimes / tu préfères<br>Il / Elle aime / préfère<br>Nous aimons / préférons<br>Vous aimez / préférez<br>Ils / Elles aiment / préfèrent</div><div class="example"><b>J'aime l'école.</b><br>أنا أحب المدرسة.</div><div class="example"><b>Je préfère la bibliothèque.</b><br>أنا أفضل المكتبة.</div></article><article class="rule-card"><h3>Il y a / Il n'y a pas de</h3><p class="explain"><b>Il y a</b> نستخدمها لقول «يوجد / هناك». وعند النفي نستخدم <b>Il n'y a pas de</b>.</p><div class="formula">Il y a un tableau.<br>Il y a une porte.<br>Il n'y a pas de tableau.<br>Il n'y a pas de porte.</div><p class="explain">لاحظ: بعد <b>pas</b> نستخدم غالبًا <b>de / d'</b> بدل أداة التنكير <b>un / une / des</b>.</p><div class="example"><b>Il y a une fenêtre.</b> → <b>Il n'y a pas de fenêtre.</b></div><div class="example"><b>Il y a des bancs.</b> → <b>Il n'y a pas de bancs.</b></div></article></div>`}
function renderPractice(){practiceState={score:0,answered:{}};return `<div class="head"><div><h2>🎯 تدرّب بنفسك</h2><p>لن تظهر الإجابة الصحيحة قبل أن يحاول الطالب بنفسه. اختر أو اكتب إجابتك ثم اضغط «تحقق».</p></div></div><div class="practice"><article class="exercise e1"><h3>1️⃣ اختيار من متعدد</h3><div class="q">ما الكلمة الفرنسية التي تعني «مكتب»؟</div><div class="options" data-q="1"><button class="option" onclick="selectOption(this,1,'Un bureau')">Un bureau</button><button class="option" onclick="selectOption(this,1,'Une table')">Une table</button><button class="option" onclick="selectOption(this,1,'Une porte')">Une porte</button><button class="option" onclick="selectOption(this,1,'Un tableau')">Un tableau</button></div><button class="check" onclick="checkOption(1,'Un bureau')">تحقق</button><div id="feedback-1" class="feedback"></div></article><article class="exercise e2"><h3>2️⃣ Écoute & écris</h3><div class="q">استمع إلى الكلمة ثم اكتب ما سمعته.</div><button class="listen" onclick="speak('Une horloge')">🔊 استمع</button><input id="input-2" autocomplete="off" placeholder="اكتب الكلمة بالفرنسية"><button class="check" style="background:var(--green)" onclick="checkText(2,'Une horloge')">تحقق</button><div id="feedback-2" class="feedback"></div></article><article class="exercise e3"><h3>3️⃣ Complète</h3><div class="q">Il y a ___ tableau.</div><select id="select-3"><option value="">اختر الإجابة</option><option value="un">un</option><option value="une">une</option><option value="de">de</option><option value="des">des</option></select><button class="check" style="background:var(--orange)" onclick="checkSelect(3,'un')">تحقق</button><div id="feedback-3" class="feedback"></div></article><article class="exercise e4"><h3>4️⃣ Quiz</h3><div class="q">ما معنى <b>Une piscine</b>؟</div><div class="options" data-q="4"><button class="option" onclick="selectOption(this,4,'مكتبة')">مكتبة</button><button class="option" onclick="selectOption(this,4,'حمام سباحة')">حمام سباحة</button><button class="option" onclick="selectOption(this,4,'معمل')">معمل</button><button class="option" onclick="selectOption(this,4,'فناء')">فناء</button></div><button class="check" style="background:var(--purple)" onclick="checkOption(4,'حمام سباحة')">أجب</button><div id="feedback-4" class="feedback"></div></article></div><div class="score" id="score-box">النتيجة: 0 / 4 — أجب عن التدريبات الأربعة لتظهر نتيجتك.</div><div class="note">التدريبات هنا تقيس المحاولة الفعلية للطالب، وليست مجرد زر لإظهار الإجابة.</div>`}
function selectOption(btn,q,value){document.querySelectorAll(`.options[data-q="${q}"] .option`).forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');btn.dataset.value=value}
function mark(q,correct,message){if(!practiceState.answered[q]){practiceState.answered[q]=true;if(correct)practiceState.score++}const n=document.getElementById('feedback-'+q);n.textContent=message; n.style.color=correct?'var(--green)':'#d14b4b';updateScore()}
function checkOption(q,answer){const selected=document.querySelector(`.options[data-q="${q}"] .option.selected`);if(!selected){document.getElementById('feedback-'+q).textContent='اختر إجابة أولًا ثم اضغط تحقق.';return}const correct=selected.dataset.value===answer;mark(q,correct,correct?'✓ إجابة صحيحة، أحسنت!':'✗ حاول مرة أخرى ثم راجع المفردات.')}
function checkText(q,answer){const v=(document.getElementById('input-'+q)?.value||'').trim().toLowerCase().replace(/\s+/g,' ');const correct=v===answer.toLowerCase();if(!v){document.getElementById('feedback-'+q).textContent='اكتب إجابتك أولًا.';return}mark(q,correct,correct?'✓ إجابة صحيحة، أحسنت!':'✗ ليست الإجابة الصحيحة. أعد الاستماع وحاول مرة أخرى.')}
function checkSelect(q,answer){const v=document.getElementById('select-'+q)?.value; if(!v){document.getElementById('feedback-'+q).textContent='اختر إجابة أولًا ثم اضغط تحقق.';return}const correct=v===answer;mark(q,correct,correct?'✓ صحيح.':'✗ غير صحيح. أعد قراءة القاعدة.')}
function updateScore(){const box=document.getElementById('score-box');if(!box)return;const done=Object.keys(practiceState.answered).length;box.textContent=`النتيجة: ${practiceState.score} / 4 — تمت الإجابة عن ${done} من 4.`}
function render(t){if(t==='facilities')return vocab(t,'المرافق');if(t==='classroom')return vocab(t,'مفردات الفصل');if(t==='video')return `<div class="head"><div><h2>🎬 فيديو الدرس</h2><p>فيديو YouTube مرتبط بمحتوى الدرس ويعمل عند الضغط.</p></div></div><div class="media"><article class="card"><h3>Vidéo — Lexique de l'école</h3><div class="media-art">🎬</div><a class="primary" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=ii5J7ZMT5EY">▶ مشاهدة الفيديو</a></article></div>`;if(t==='grammar')return renderGrammar();return renderPractice()}
sections.forEach((s,i)=>{const b=document.createElement('button');b.className='tab'+(i===0?' active':'');b.textContent=s[1];b.onclick=()=>{document.querySelectorAll('.tab').forEach((x,j)=>x.classList.toggle('active',j===i));panel.innerHTML=render(s[0]);window.scrollTo({top:0,behavior:'smooth'})};tabs.appendChild(b)});panel.innerHTML=render('facilities');
</script>
</body>
</html>
