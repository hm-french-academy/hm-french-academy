<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Leçon 1</title><style>:root{--n:#14264a;--b:#2563eb;--p:#e92d83;--g:#20a45a;--r:#d9534f;--l:#e2e8f2;--m:#68758b;--s:#f7f9fd}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7f9fd,#edf3fb);font-family:Arial,Cairo,sans-serif;color:#17223b}.top{height:64px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;padding:8px 14px;gap:14px;position:sticky;top:0;z-index:5}.brand{font-weight:900;color:var(--n);text-decoration:none}.logo{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--p),#713bd1);color:#fff;margin-left:7px}.nav{display:flex;gap:14px;margin:auto}.nav a{color:#536078;text-decoration:none;font-size:13px;font-weight:800}.xp{padding:7px 11px;border:1px solid #efd27d;border-radius:15px;background:#fffaf0;font-weight:900;color:#886416}.wrap{max-width:1100px;margin:auto;padding:18px 12px 50px}.hero{background:linear-gradient(135deg,#173a82,#2563eb 55%,#14b8a6);color:#fff;border-radius:28px;padding:24px;display:flex;justify-content:space-between;gap:16px;align-items:center}.hero h1{margin:0;font-size:38px}.hero p{line-height:1.7}.art{width:170px;height:115px;background:#ffffff22;border-radius:22px;display:grid;place-items:center;font-size:65px}.tabs{display:flex;gap:6px;overflow:auto;margin:14px 0;padding:5px;background:#fff;border:1px solid var(--l);border-radius:17px}.tab{border:0;background:transparent;padding:11px 14px;border-radius:13px;font-weight:900;white-space:nowrap;color:#536078}.tab.active{background:var(--p);color:#fff}.panel{background:#fff;border:1px solid var(--l);border-radius:24px;padding:18px;box-shadow:0 12px 35px #14264a12}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}.head h2{margin:0;color:var(--n);font-size:28px}.head p{color:var(--m);line-height:1.8;font-size:13px}.grid,.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card,.rule,.dialog,.exercise,.file{border:1px solid var(--l);border-radius:19px;background:#fff;padding:17px}.pic{height:175px;border-radius:17px;background:linear-gradient(145deg,#eef4ff,#fff2f8);display:grid;place-items:center;font-size:82px;cursor:pointer}.fr{font-weight:900;font-size:21px;direction:ltr;text-align:center;margin-top:8px}.ar{text-align:center;color:#2d59a5;font-weight:900;font-size:17px;margin:4px}.ex{background:var(--s);border-right:4px solid var(--p);padding:10px;border-radius:11px;margin-top:9px;line-height:1.7;direction:ltr;text-align:left}.ex small{display:block;direction:rtl;text-align:right;color:var(--m)}.speak,.primary,.next,.check{border:0;border-radius:12px;padding:10px 13px;font-weight:900;cursor:pointer}.speak{background:var(--p);color:#fff}.primary,.next{background:var(--b);color:#fff}.check{background:var(--g);color:#fff}.formula{direction:ltr;background:var(--s);border-radius:14px;padding:13px;font-weight:900;line-height:2}.muted{color:var(--m);line-height:1.9}.step{display:grid;grid-template-columns:40px 1fr;gap:10px}.num{width:40px;height:40px;border-radius:12px;background:#edf3ff;color:#2850a3;display:grid;place-items:center;font-weight:900}.dialog-line{display:flex;gap:10px;background:#f8faff;border-radius:13px;padding:11px;margin:7px 0}.dialog-line strong{min-width:75px;color:#2850a3}.file{display:flex;gap:13px;align-items:flex-start}.icon{width:58px;height:58px;border-radius:17px;background:#edf3ff;display:grid;place-items:center;font-size:28px;flex:none}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.option{border:1px solid #d7dfeb;background:#fff;border-radius:12px;padding:12px;font-weight:900;cursor:pointer}.option.correct{background:#eaf8f1;border-color:var(--g)}.option.wrong{background:#fff3f3;border-color:var(--r)}.feedback{min-height:24px;font-weight:900;margin-top:8px}.score{background:var(--s);padding:12px;border-radius:13px;text-align:center;font-weight:900;color:#59677e;margin-top:10px}.back{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.back a{background:#fff;border:1px solid var(--l);border-radius:12px;padding:10px 14px;text-decoration:none;color:#315fc8;font-weight:900}@media(max-width:650px){.nav{display:none}.hero{display:block}.art{width:100%;height:90px;margin-top:12px}.grid,.cards,.options{grid-template-columns:1fr}.head{display:block}.pic{height:165px}}</style></head><body><header class="top"><a class="brand" href="../../../../index.html"><span class="logo">HM</span>HM ACADEMY</a><nav class="nav"><a href="../../../../index.html">الرئيسية</a><a href="../../../../dashboard.html">التقدم</a><a href="../../../../library.html">المكتبة</a><a href="../../../../settings.html">الإعدادات</a></nav><span class="xp">⭐ 0 XP</span>👨‍🎓</header><main class="wrap"><div class="hero"><div><h1>Leçon 1 : <span style="color:#ffd7e9">À l'école</span></h1><p>Français — 2e année préparatoire</p><p>🏫 مرافق المدرسة · 🪑 الفصل · 📘 القاعدة · 💬 المحادثة · 🎯 التدريب</p></div><div class="art">🏫</div></div><nav class="tabs" id="tabs"></nav><section class="panel" id="panel"></section><div class="back"><a href="../../../../grade-8.html#unit-1">← العودة إلى الوحدة</a><a href="../../../../dashboard.html">📈 لوحة الطالب</a></div></main><script>const V={facilities:[["Une cantine","كانتين","🍽️","Je mange à la cantine.","أنا آكل في الكانتين."],["Une cour","الفناء المدرسي","🏫","Je joue dans la cour.","ألعب في الفناء."],["Des classes","فصول","🚪","Il y a des classes dans l'école.","توجد فصول في المدرسة."],["Un gymnase","صالة الألعاب","🤸","Je fais du sport au gymnase.","أمارس الرياضة في صالة الألعاب."],["Un CDI","صالة الوسائط المتعددة","📚","Je vais au CDI.","أذهب إلى صالة الوسائط."],["Un laboratoire","المعمل","🧪","Nous travaillons au laboratoire.","نعمل في المعمل."],["Un terrain de sport","أرض الملعب","⚽","Je joue sur le terrain de sport.","ألعب في الملعب."],["Une bibliothèque","المكتبة","📖","Je lis à la bibliothèque.","أقرأ في المكتبة."]],classroom:[["Un bureau","المكتب","🗄️","Le professeur est devant son bureau.","المعلم أمام مكتبه."],["Un tableau","السبورة","🖼️","Le tableau est dans la classe.","السبورة في الفصل."],["Une porte","الباب","🚪","La porte est ouverte.","الباب مفتوح."],["Une fenêtre","الشباك","🪟","La fenêtre est grande.","الشباك كبير."],["Un banc","مقعد","💺","Je m'assois sur un banc.","أجلس على مقعد."],["Un panneau","لوحة تعليمية","📌","Il y a un panneau dans la classe.","توجد لوحة تعليمية في الفصل."],["Un TNI","سبورة ذكية","🖥️","Le professeur utilise le TNI.","المعلم يستخدم السبورة الذكية."],["Une horloge","ساعة حائط","🕐","L'horloge est au mur.","الساعة على الحائط."]]};const sections=[['facilities','🏫','مرافق المدرسة'],['classroom','🪑','في الفصل'],['grammar','📘','قاعدة الدرس'],['dialogue','💬','محادثة'],['video','🎬','الفيديو'],['practice','🎯','تدرّب بنفسك'],['files','📁','ملفات الدرس'],['games','🎮','الألعاب'],['assessment','📝','التقييم']];const tabs=document.getElementById('tabs'),panel=document.getElementById('panel');function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.86;speechSynthesis.speak(u)}function vocab(id,title){return `<div class="head"><div><h2>${title}</h2><p>الصورة + الكلمة + المعنى + مثال + نطق الكلمة والمثال.</p></div><button class="primary" onclick='speak(${JSON.stringify(V[id].map(x=>x[0]).join('. '))})'>🔊 استمع للمجموعة</button></div><div class="grid">${V[id].map(x=>`<article class="card"><div class="pic" onclick='speak(${JSON.stringify(x[0])})'>${x[2]}</div><div class="fr">${x[0]}</div><div class="ar">${x[1]}</div><div class="ex">${x[3]}<small>${x[4]}</small></div><div style="display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:9px"><button class="speak" onclick='speak(${JSON.stringify(x[0])})'>🔊 الكلمة</button><button class="speak" onclick='speak(${JSON.stringify(x[3])})'>▶ المثال</button></div></article>`).join('')}</div>`}function grammar(){return `<div class="head"><div><h2>📘 Il y a / Il n'y a pas de</h2><p>نفهم المعنى أولًا، ثم نبني الجملة، ثم نقارن بين الإثبات والنفي.</p></div><button class="primary" onclick='speak("Il y a une cantine. Il n'y a pas de piscine. Il y a une porte. Il n'y a pas de porte.")'>🔊 استمع للأمثلة</button></div><div class="cards"><article class="rule"><div class="step"><span class="num">1</span><div><h3>عندما يوجد شيء</h3><p class="muted">نستخدم <b dir="ltr">Il y a</b> للحديث عن وجود شيء.</p><div class="formula">Il y a + un / une / des + nom</div><p><b dir="ltr">Il y a une cantine.</b> — يوجد كانتين.</p><button class="speak" onclick='speak("Il y a une cantine.")'>🔊 نطق المثال</button></div></div></article><article class="rule"><div class="step"><span class="num">2</span><div><h3>عندما لا يوجد شيء</h3><p class="muted">نستخدم <b dir="ltr">Il n'y a pas de</b> لنفي الوجود.</p><div class="formula">Il n'y a pas de + nom</div><p><b dir="ltr">Il n'y a pas de piscine.</b> — لا يوجد حمام سباحة.</p><button class="speak" onclick='speak("Il n'y a pas de piscine.")'>🔊 نطق المثال</button></div></div></article><article class="rule"><div class="step"><span class="num">3</span><div><h3>قارن</h3><div class="formula">Il y a une porte.<br>Il n'y a pas de porte.</div><p class="muted">تذكّر: بعد النفي نستخدم <b>de</b>.</p><button class="speak" onclick='speak("Il y a une porte. Il n'y a pas de porte.")'>🔊 نطق المقارنة</button></div></div></article></div>`}function dialogue(){const L=[['👩 Sara','Bonjour ! Tu aimes ton école ?','مرحبًا! هل تحب مدرستك؟'],['👦 Adam',"Oui, j'aime mon école. Il y a une grande cour.",'نعم، أحب مدرستي. يوجد فناء كبير.'],['👩 Sara','Et où est la cantine ?','وأين الكانتين؟'],['👦 Adam','La cantine est près des classes. Je mange avec mes amis.','الكانتِين بجوار الفصول. آكل مع أصدقائي.'],['👩 Sara','On va à la bibliothèque ?','هل نذهب إلى المكتبة؟'],['👦 Adam','Oui, allons-y !','نعم، هيا بنا!']];return `<div class="head"><div><h2>💬 Sara & Adam — À l'école</h2><p>محادثة قصيرة مرتبطة بالدرس. استمع، اقرأ المعنى، ثم حاول تقليد النطق.</p></div><button class="primary" onclick='speak(${JSON.stringify(L.map(x=>x[1]).join(' '))})'>🔊 المحادثة كاملة</button></div><article class="dialog">${L.map(x=>`<div class="dialog-line"><strong>${x[0]}</strong><div><div dir="ltr">${x[1]}</div><small>${x[2]}</small><br><button class="speak" onclick='speak(${JSON.stringify(x[1])})'>🔊 اسمع الجملة</button></div></div>`).join('')}</article>`}function video(){return `<div class="rule"><h2>🎬 Lexique de l'école</h2><p class="muted">مراجعة سمعية لمفردات المدرسة.</p><div style="height:210px;border-radius:18px;background:linear-gradient(135deg,#173a82,#14b8a6);display:grid;place-items:center;font-size:80px">🏫▶️</div><br><a class="primary" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=ii5J7ZMT5EY">▶ مشاهدة الفيديو</a></div>`}const Q=[['صورة','ما المعنى الصحيح للصورة؟','🍽️',['كانتين','مكتبة','معمل','فناء'],'كانتين'],['كلمة','اختر الكلمة الفرنسية التي تعني «سبورة».','',['un tableau','une cour','un bureau','une porte'],'un tableau'],['قاعدة','أكمل: ___ une bibliothèque dans l\'école.','',['Il y a','Il n\'y a pas de','Je suis','J\'aime'],'Il y a'],['قاعدة','اختر النفي الصحيح: «لا توجد سبورة.»','',['Il y a un tableau.','Il n\'y a pas de tableau.','Il aime le tableau.','Une tableau.'],"Il n'y a pas de tableau."],['قاعدة','أكمل: Il y a ___ porte.','',['un','une','des','de'],'une'],['صورة','ما الكلمة المناسبة للصورة؟','📖',['une bibliothèque','un laboratoire','un gymnase','une porte'],'une bibliothèque'],['جملة','اختر الجملة الصحيحة عن الفصل.','',['Il y a des classes.','Il n\'y a pas des classes.','Je classes une école.','Une classes.'],'Il y a des classes.'],['محادثة','ما الرد المناسب على: Où est la cantine ?','',['La cantine est près des classes.','Je préfère la cantine.','Il n\'y a pas de français.','Je suis une cantine.'],'La cantine est près des classes.'],['صورة','ما معنى الصورة؟','🧪',['معمل','سبورة','كرسي','فناء'],'معمل'],['قاعدة','أكمل: Il n\'y a pas ___ piscine.','',['un','une','des','de'],'de']];let qi=0,score=0,locked=false;function practice(){if(qi>=Q.length)return `<div class="head"><div><h2>🎉 اكتمل التدريب</h2><p>النتيجة النهائية: <b>${score}/${Q.length}</b>.</p></div></div><div class="score">⭐ ${score} / ${Q.length}</div>`;const q=Q[qi];return `<div class="head"><div><h2>🎯 تدرّب بنفسك</h2><p>10 أسئلة متنوعة. حاول أولًا، ثم تحقّق من الإجابة وانتقل للسؤال التالي.</p></div><b>سؤال ${qi+1} / ${Q.length}</b></div><article class="exercise"><div class="score">النتيجة: ${score} / ${qi}</div><h3>${q[1]}</h3>${q[2]?`<div class="pic">${q[2]}</div>`:''}<div class="options">${q[3].map(o=>`<button class="option" onclick='ans(${JSON.stringify(o)},this)'>${o}</button>`).join('')}</div><div class="feedback" id="fb"></div><button class="next" id="nxt" style="display:none" onclick="nextQ()">السؤال التالي →</button></article>`}function ans(v,b){if(locked)return;locked=true;const q=Q[qi],ok=v===q[4];document.querySelectorAll('.option').forEach(x=>x.disabled=true);b.classList.add(ok?'correct':'wrong');document.getElementById('fb').textContent=ok?'✓ ممتاز! إجابة صحيحة.':'✗ ليست الإجابة الصحيحة. راجع النقطة ثم انتقل للسؤال التالي.';if(ok)score++;document.getElementById('nxt').style.display='inline-block'}function nextQ(){qi++;locked=false;render('practice')}function files(){const F=[['🧠','الدرس التفاعلي','شرح ومفردات وقاعدة ومحادثة وتدريب','lesson-1-interactive-v3.html'],['📖','المرجع التعليمي','مراجعة وطباعة محتوى الدرس الأول','reference_lecon1_unite1.html'],['📝','التقييم الرسمي','تقييم أكاديمي مستقل','formal_assessment_lecon1_unite1.html'],['💻','الاختبار الإلكتروني','اختبار تفاعلي مستقل عن الألعاب','interactive_assessment_lecon1_unite1.html'],['🎮','الألعاب التعليمية','مركز ألعاب متنوع مرتبط بمحتوى الدرس','lesson-1-games.html']];return `<div class="head"><div><h2>📁 ملفات الدرس</h2><p>ملفات تساعدك على التعلم والمراجعة والتقييم.</p></div></div><div class="cards">${F.map(x=>`<article class="file"><span class="icon">${x[0]}</span><div><h3>${x[1]}</h3><p class="muted">${x[2]}</p><a class="primary" href="${x[3]}?v=20260814-l1">فتح الملف</a></div></article>`).join('')}</div>`}function games(){const G=[['🧩','Memory','صورة ↔ معنى','memory_game_lecon1_unite1.html'],['🎯','Word Catch','صورة → اختر الكلمة الفرنسية','word_catch_lecon1_unite1.html'],['🧲','Drag & Drop','تصنيف بصري للفئات','drag_drop_lecon1_unite1.html'],['🎤','Pronunciation','استماع ونطق','pronunciation_challenge_lecon1_unite1.html'],['📚','Vocabulary Challenge','صورة → معنى → تحقق → مثال ونطق','vocabulary_challenge_lecon1_unite1.html'],['⚡','Quiz Express','أسئلة متنوعة سريعة','games_quiz_lecon1_unite1.html']];return `<div class="head"><div><h2>🎮 مركز الألعاب</h2><p>كل لعبة لها هوية بصرية وطريقة لعب مختلفة.</p></div></div><div class="cards">${G.map(x=>`<article class="file"><span class="icon">${x[0]}</span><div><h3>${x[1]}</h3><p class="muted">${x[2]}</p><a class="primary" href="${x[3]}?v=20260814-games6">ابدأ اللعبة</a></div></article>`).join('')}</div>`}function assessment(){return `<div class="head"><div><h2>📝 تقييم الدرس</h2><p>تقييم رسمي مستقل عن الألعاب والتدريب اليومي.</p></div></div><article class="file"><span class="icon">📝</span><div><h3>التقييم الرسمي — Leçon 1</h3><p class="muted">يفضل إكمال المفردات والقاعدة والتدريب قبل التقييم.</p><a class="primary" href="formal_assessment_lecon1_unite1.html?v=20260814-assess6">فتح التقييم</a></div></article>`}function render(id){tabs.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.id===id));if(id==='facilities')panel.innerHTML=vocab('facilities','🏫 مرافق المدرسة');else if(id==='classroom')panel.innerHTML=vocab('classroom','🪑 في الفصل');else if(id==='grammar')panel.innerHTML=grammar();else if(id==='dialogue')panel.innerHTML=dialogue();else if(id==='video')panel.innerHTML=video();else if(id==='practice')panel.innerHTML=practice();else if(id==='files')panel.innerHTML=files();else if(id==='games')panel.innerHTML=games();else panel.innerHTML=assessment()}sections.forEach(([id,ic,label])=>{const b=document.createElement('button');b.className='tab';b.dataset.id=id;b.textContent=ic+' '+label;b.onclick=()=>render(id);tabs.appendChild(b)});render('facilities');</script></body></html>
