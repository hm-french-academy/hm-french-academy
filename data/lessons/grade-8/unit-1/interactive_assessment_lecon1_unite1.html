<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HM Academy | الاختبار التفاعلي · Leçon 1</title>
<style>
body{margin:0;background:#f3f6fc;color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:900px;margin:auto;padding:22px 14px 50px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#713bd1);color:#fff;border-radius:28px;padding:26px}.hero h1{margin:0 0 8px}.progress{height:10px;background:#ffffff33;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#fff;transition:width .25s ease}.q,.score,.reward{background:#fff;border:1px solid #e1e7f0;border-radius:20px;padding:20px;margin-top:16px}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.opt,input{padding:13px;border:1px solid #d5ddea;border-radius:13px}.opt{background:#fff;font-weight:900;cursor:pointer;text-align:right;transition:.15s}.opt:hover{border-color:#713bd1;transform:translateY(-1px)}.opt.selected{border:2px solid #2563eb!important;background:#edf3ff!important;box-shadow:0 0 0 3px #2563eb18}.opt.correct{border-color:#20a45a!important;background:#effaf3!important}.opt:disabled{cursor:default}.check{border:0;border-radius:13px;padding:12px 18px;background:#713bd1;color:#fff;font-weight:900;cursor:pointer;margin-top:12px}.check:hover{filter:brightness(1.05)}.answer{min-height:24px;font-weight:900;margin-top:9px}.score{font-weight:900}.reward{display:none;text-align:center}.back-links{margin-top:18px}.back-links a{color:#315fc8;font-weight:800;text-decoration:none}@media(max-width:600px){.options{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<header class="hero"><h1>Leçon 1 · الاختبار التفاعلي</h1><p>À l'école · الصف الثاني الإعدادي</p><div class="progress"><i id="bar"></i></div></header>
<section id="quiz"></section>
<div class="score" id="score">النتيجة: 0 / 8 — أُجيب عن 0 / 8</div>
<div class="reward" id="reward"></div>
<p class="back-links"><a href="lesson-1-interactive.html">← الدرس التفاعلي</a> · <a href="reference_lecon1_unite1.html">المرجع</a> · <a href="formal_assessment_lecon1_unite1.html">التقييم الرسمي</a></p>
</main>
<script src="../../../../scripts/game-scoring.js?v=20260811-assess2"></script>
<script src="../../../../scripts/game-runtime.js?v=20260811-assess2"></script>
<script src="../../../../scripts/activity-complete.js?v=20260811-assess2"></script>
<script src="../../../../scripts/interactive-assessment-runtime.js?v=20260811-assess2"></script>
<script>
const lessonId='grade8-u1-l1',activityId='interactive-assessment';
const qs=[
 ['ما معنى «Une cantine»؟',['كانتين','فناء','مكتبة','معمل'],'كانتين'],
 ['اختر: ___ porte',['un','une','des','de'],'une'],
 ['أي كلمة تعني «المكتبة»؟',['Une cour','Une bibliothèque','Une chaise','Un bureau'],'Une bibliothèque'],
 ['اكتب الكلمة: Une horloge',null,'Une horloge'],
 ['جملة وجود سبورة؟',['Il y a un tableau.','Il y a une tableau.','Il n’y a pas de tableau.','Il y a des tableau.'],'Il y a un tableau.'],
 ['اختر النفي الصحيح',['Il n’y a pas un tableau.','Il n’y a pas de tableau.','Il n’y a pas une tableau.','Il ne y a pas de tableau.'],'Il n’y a pas de tableau.'],
 ['مفردات الفصل؟',['Un bureau · Une chaise','Une piscine · Un gymnase','Une cantine · Une cour','Un terrain · Une bibliothèque'],'Un bureau · Une chaise'],
 ['اكتب: يوجد حمام سباحة',null,'Il y a une piscine.']
];
let score=0,done=new Set(),selected={};
const quiz=document.getElementById('quiz'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),reward=document.getElementById('reward');
function norm(s){return String(s).trim().toLowerCase().replace(/[’]/g,"'").replace(/\s+/g,' ').replace(/[.!؟?]+$/,'')}
function render(){quiz.innerHTML=qs.map((x,i)=>`<article class="q"><h2>${i+1}. ${x[1]?'اختر الإجابة الصحيحة':'اكتب إجابتك'}</h2><p>${x[0]}</p>${x[1]?`<div class="options">${x[1].map(v=>`<button type="button" class="opt" data-q="${i}" data-value="${encodeURIComponent(v)}">${v}</button>`).join('')}</div>`:`<input id="in${i}" placeholder="اكتب إجابتك بالفرنسية" autocomplete="off">`}<button type="button" class="check" data-check="${i}">تحقق</button><div class="answer" id="a${i}"></div></article>`).join('')}
function choose(i,v,b){if(done.has(i))return;selected[i]=v;document.querySelectorAll(`.opt[data-q="${i}"]`).forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}
function check(i){if(done.has(i))return;const x=qs[i],v=x[1]?selected[i]:(document.getElementById('in'+i)?.value||'');const a=document.getElementById('a'+i);if(!v||!v.trim()){a.textContent='اختر أو اكتب إجابتك أولًا.';a.style.color='#b17800';return}if(norm(v)===norm(x[2])){done.add(i);score++;a.textContent='✓ إجابة صحيحة، أحسنت!';a.style.color='#20a45a';document.querySelectorAll(`.opt[data-q="${i}"]`).forEach(b=>{b.disabled=true;if(decodeURIComponent(b.dataset.value)===x[2])b.classList.add('correct')});const input=document.getElementById('in'+i);if(input)input.disabled=true;document.querySelector(`[data-check="${i}"]`).disabled=true}else{a.textContent='✗ غير صحيحة. أعد المحاولة دون كشف الحل.';a.style.color='#d14b4b'}renderState();if(done.size===qs.length)finish()}
function renderState(){scoreEl.textContent=`النتيجة: ${score} / ${qs.length} — أُجيب عن ${done.size} / ${qs.length}`;bar.style.width=(done.size/qs.length*100)+'%'}
function finish(){const r=window.HMInteractiveAssessment?HMInteractiveAssessment.complete(score,qs.length):{score:Math.round(score/qs.length*100),xp:20};reward.style.display='block';reward.innerHTML=`🎉 Bravo!<br>النتيجة <strong>${r.score}%</strong><br>⭐ +${r.xp} XP`;if(window.HMActivityComplete)HMActivityComplete.complete(lessonId,activityId,r.xp)}
quiz.addEventListener('click',e=>{const opt=e.target.closest('.opt');if(opt)choose(Number(opt.dataset.q),decodeURIComponent(opt.dataset.value),opt);const checkBtn=e.target.closest('[data-check]');if(checkBtn)check(Number(checkBtn.dataset.check))});
render();renderState();
</script>
</body></html>
