<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | الاختبار التفاعلي · Leçon 1</title><style>:root{--navy:#14264a;--blue:#2563eb;--pink:#e92d83;--purple:#713bd1;--green:#20a45a;--orange:#f59b18;--bg:#f3f6fc;--line:#e1e7f0;--muted:#69768b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8faff,#eef3fb);color:#17223b;font-family:Arial,"Cairo",sans-serif}.wrap{max-width:900px;margin:auto;padding:22px 14px 50px}.hero{background:linear-gradient(135deg,#173a82,#2563eb 58%,#713bd1);color:#fff;border-radius:28px;padding:26px;box-shadow:0 20px 50px #2563eb22}.hero h1{margin:0;font-size:clamp(28px,6vw,42px)}.hero p{margin:8px 0 0;opacity:.9}.q{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:16px;box-shadow:0 12px 30px #14264a0d}.q h2{margin:0 0 8px;color:var(--navy);font-size:20px}.prompt{font-size:17px;font-weight:800;line-height:1.8}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.opt{border:1px solid #d5ddea;background:#fff;border-radius:14px;padding:13px;font-weight:900;cursor:pointer;text-align:right}.opt.selected{border:2px solid var(--blue);background:#edf3ff;color:#1d4ea6}.check{border:0;border-radius:13px;padding:12px 18px;background:linear-gradient(135deg,#743bd1,#2563eb);color:#fff;font-weight:900;cursor:pointer}.answer{margin-top:10px;min-height:22px;font-weight:900}.input{width:100%;padding:13px;border:1px solid #d5ddea;border-radius:13px;font-size:16px;margin:12px 0}.score{position:sticky;bottom:10px;margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center;font-weight:900;box-shadow:0 10px 25px #14264a18}.done{display:block;margin-top:12px;width:100%;border:0;border-radius:14px;padding:14px;background:#20a45a;color:#fff;font-weight:900}.hint{color:var(--muted);font-size:12px;line-height:1.8}@media(max-width:600px){.options{grid-template-columns:1fr}.wrap{padding:12px 9px 35px}.q{padding:15px}}</style></head><body><main class="wrap"><header class="hero"><h1>Leçon 1 · الاختبار التفاعلي</h1><p>À l'école · الصف الثاني الإعدادي</p><p class="hint" style="color:#fff">اختبار مستقل عن ملف التقييم: حاول أولًا، ثم اضغط «تحقق». لا تظهر الإجابة النموذجية قبل المحاولة.</p></header><section id="quiz"></section><div class="score" id="score">النتيجة: 0 / 8</div></main><script>const qs=[{type:'mc',q:'ما الكلمة الفرنسية التي تعني «مكتب»؟',o:['Un bureau','Une porte','Une chaise','Un tableau'],a:'Un bureau'},{type:'mc',q:'ما معنى Une piscine؟',o:['مكتبة','حمام سباحة','معمل','فناء'],a:'حمام سباحة'},{type:'mc',q:'اختر الأداة الصحيحة: ___ horloge',o:['un','une','des','de'],a:'une'},{type:'mc',q:'أي كلمة تعني «سبورة»؟',o:['Un tableau','Une fenêtre','Une cour','Un gymnase'],a:'Un tableau'},{type:'text',q:'اكتب بالفرنسية: «ساعة حائط».',a:'Une horloge'},{type:'mc',q:'أي مجموعة تمثل مفردات من «في الفصل»؟',o:['Un bureau · Une porte','Un avion · Une gare','Un lit · Une armoire','Un gâteau · Une bougie'],a:'Un bureau · Une porte'},{type:'mc',q:'اختر الجملة الصحيحة:',o:['Il y a un tableau.','Il y a une tableau.','Il y a des tableau.','Il y a de tableau.'],a:'Il y a un tableau.'},{type:'text',q:'اكتب جملة فرنسية صحيحة باستخدام «Il y a» و«Une piscine».',a:'Il y a une piscine.'}];let score=0,done=new Set(),selected={};function speak(t){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.86;window.speechSynthesis.speak(u)}function norm(s){return s.trim().toLowerCase().replace(/[’]/g,"'").replace(/\s+/g,' ')}function render(){document.getElementById('quiz').innerHTML=qs.map((x,i)=>`<article class="q"><h2>${i+1}. ${x.type==='mc'?'اختر الإجابة الصحيحة':'اكتب إجابتك'}</h2><div class="prompt">${x.q}</div>${x.type==='mc'?`<div class="options">${x.o.map(v=>`<button class="opt" data-i="${i}" onclick="choose(${i},${JSON.stringify(v)},this)">${v}</button>`).join('')}</div>`:`<input class="input" id="in-${i}" placeholder="اكتب إجابتك بالفرنسية" autocomplete="off">`}<button class="check" onclick="check(${i})">تحقق</button><div class="answer" id="a-${i}"></div></article>`).join('')}function choose(i,v,el){selected[i]=v;document.querySelectorAll(`.opt[data-i="${i}"]`).forEach(b=>b.classList.remove('selected'));el.classList.add('selected')}function check(i){if(done.has(i))return;const x=qs[i];let val=x.type==='mc'?selected[i]:(document.getElementById('in-'+i)?.value||'').trim();if(!val){document.getElementById('a-'+i).textContent='اختر أو اكتب إجابتك أولًا.';document.getElementById('a-'+i).style.color='#d14b4b';return}const ok=norm(val)===norm(x.a);if(ok){score++;done.add(i);document.getElementById('a-'+i).textContent='✓ إجابة صحيحة، أحسنت!';document.getElementById('a-'+i).style.color='var(--green)'}else{document.getElementById('a-'+i).textContent='✗ ليست صحيحة. أعد المحاولة دون كشف الإجابة.';document.getElementById('a-'+i).style.color='#d14b4b'}document.getElementById('score').textContent=`النتيجة: ${score} / 8 — أُجيب عن ${done.size} / 8`}render();</script></body></html>
