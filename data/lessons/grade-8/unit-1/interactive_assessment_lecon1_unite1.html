<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | الاختبار التفاعلي · Leçon 1</title><style>body{margin:0;background:#f3f6fc;color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:900px;margin:auto;padding:22px 14px 50px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#713bd1);color:#fff;border-radius:28px;padding:26px}.progress{height:10px;background:#ffffff33;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#fff}.q,.score,.reward{background:#fff;border:1px solid #e1e7f0;border-radius:20px;padding:20px;margin-top:16px}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.opt,input{padding:13px;border:1px solid #d5ddea;border-radius:13px}.opt{background:#fff;font-weight:900;cursor:pointer;text-align:right}.selected{border:2px solid #2563eb!important;background:#edf3ff!important}.check{border:0;border-radius:13px;padding:12px 18px;background:#713bd1;color:#fff;font-weight:900;cursor:pointer}.answer{min-height:24px;font-weight:900;margin-top:9px}.reward{display:none;text-align:center}@media(max-width:600px){.options{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="hero"><h1>Leçon 1 · الاختبار التفاعلي</h1><p>À l'école · الصف الثاني الإعدادي</p><div class="progress"><i id="bar"></i></div></header><section id="quiz"></section><div class="score" id="score">النتيجة: 0 / 8 — أُجيب عن 0 / 8</div><div class="reward" id="reward"></div><p><a href="lesson-1-interactive.html">← الدرس التفاعلي</a> · <a href="reference_lecon1_unite1.html">المرجع</a> · <a href="formal_assessment_lecon1_unite1.html">التقييم الرسمي</a></p></main><script src="../../../../scripts/game-scoring.js"></script><script src="../../../../scripts/game-runtime.js"></script><script src="../../../../scripts/activity-complete.js"></script><script src="../../../../scripts/interactive-assessment-runtime.js"></script><script>const lessonId='grade8-u1-l1',activityId='interactive-assessment';const qs=[['ما معنى «Une cantine»؟',['كانتين','فناء','مكتبة','معمل'],'كانتين'],['اختر: ___ porte',['un','une','des','de'],'une'],['أي كلمة جمع؟',['Une piscine','Un bureau','Des classes','Une chaise'],'Des classes'],['اكتب الكلمة: Une horloge',null,'Une horloge'],['جملة وجود سبورة؟',['Il y a un tableau.','Il y a une tableau.','Il n’y a pas de tableau.','Il y a des tableau.'],'Il y a un tableau.'],['اختر النفي الصحيح',['Il n’y a pas un tableau.','Il n’y a pas de tableau.','Il n’y a pas une tableau.','Il ne y a pas de tableau.'],'Il n’y a pas de tableau.'],['مفردات الفصل؟',['Un bureau · Une chaise','Une piscine · Un gymnase','Une cantine · Une cour','Un terrain · Une bibliothèque'],'Un bureau · Une chaise'],['اكتب: يوجد حمام سباحة',null,'Il y a une piscine.']];let score=0,done=new Set(),selected={},reported=false;function norm(s){return s.trim().toLowerCase().replace(/[’]/g,"'").replace(/\s+/g,' ').replace(/[.!؟?]+$/,'')}function choose(i,v,b){selected[i]=v;document.querySelectorAll('.o'+i).forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}function check(i){if(done.has(i))return;const x=qs[i],v=x[1]?selected[i]:(document.getElementById('in'+i)?.value||'');const a=document.getElementById('a'+i);if(!v.trim()){a.textContent='اختر أو اكتب إجابتك أولًا.';return}if(norm(v)===norm(x[2])){done.add(i);score++;a.textContent='✓ إجابة صحيحة، أحسنت!';a.style.color='#20a45a'}else{a.textContent='✗ غير صحيحة. أعد المحاولة دون كشف الحل.';a.style.color='#d14b4b'}renderState();if(done.size===qs.length)finish()}function renderState(){scoreEl.textContent=`النتيجة: ${score} / ${qs.length} — أُجيب عن ${done.size} / ${qs.length}`;bar.style.width=(done.size/qs.length*100)+'%'}function finish(){if(reported)return;const r=HMInteractiveAssessment.complete(score,qs.length);reward.style.display='block';reward.innerHTML=`🎉 Bravo!<br>النتيجة <strong>${r.score}%</strong><br>⭐ +${r.xp} XP`;if(window.HMActivityComplete)HMActivityComplete.complete(lessonId,activityId,r.xp);reported=true}function render(){quiz.innerHTML=qs.map((x,i)=>`<article class="q"><h2>${i+1}. ${x[1]?'اختر الإجابة الصحيحة':'اكتب إجابتك'}</h2><p>${x[0]}</p>${x[1]?`<div class="options">${x[1].map(v=>`<button class="opt o${i}" onclick="choose(${i},${JSON.stringify(v)},this)">${v}</button>`).join('')}</div>`:`<input id="in${i}" placeholder="اكتب إجابتك بالفرنسية" autocomplete="off">`}<button class="check" onclick="check(${i})">تحقق</button><div class="answer" id="a${i}"></div></article>`).join('')}const quiz=document.getElementById('quiz'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),reward=document.getElementById('reward');render();renderState();</script></body></html>
