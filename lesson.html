<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HM Academy | Learning Studio</title>
<link rel="stylesheet" href="css/premium-shell.css?v=20260812-studio3">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--navy:#102b57;--blue:#2364e8;--pink:#e92b82;--teal:#11a596;--gold:#f2b63f;--purple:#7955d6;--ink:#17243d;--muted:#68758a;--line:#dfe6ef;--bg:#f4f7fb;--good:#16885a}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 10% 0%,#eaf1ff 0,#f8faff 32%,var(--bg) 100%);color:var(--ink);font-family:Arial,Cairo,sans-serif}.wrap{max-width:1240px;margin:auto;padding:20px 16px 90px}.studio-hero{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;min-height:420px;padding:34px;border-radius:34px;overflow:hidden;color:#fff;background:linear-gradient(135deg,#0e2b65 0%,#2364e8 55%,#12a596 100%);box-shadow:0 25px 70px #183b8128;position:relative}.studio-hero:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:#ffffff0b;left:-160px;bottom:-230px}.unit{display:inline-block;padding:8px 12px;border-radius:99px;background:#ffffff18;border:1px solid #ffffff32;font-weight:900;letter-spacing:.4px}.eyebrow{font-weight:900;font-size:13px;letter-spacing:.5px;color:#52627b}.studio-hero .eyebrow{color:#dce8ff;margin-top:22px}.studio-hero h1{font-size:clamp(44px,7vw,76px);line-height:1;margin:8px 0}.fr-title{font-size:22px;font-weight:900;direction:ltr;text-align:right}.sub{max-width:720px;line-height:2;font-size:17px;color:#edf4ff}.hero-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}.primary,.ghost,.soft{border:0;border-radius:14px;padding:13px 17px;font-weight:900;cursor:pointer}.primary{background:var(--pink);color:#fff;box-shadow:0 10px 24px #b8175e32}.ghost{background:#ffffff16;color:#fff;border:1px solid #ffffff35}.soft{background:#edf3ff;color:#2052a8}.hero-scene{min-height:350px;border:1px solid #ffffff22;border-radius:28px;background:linear-gradient(145deg,#ffffff12,#ffffff08);position:relative;display:grid;place-items:center}.school-illustration{width:190px;height:190px;border-radius:46px;background:#ffffffee;color:#2260c5;display:grid;place-items:center;font-size:100px;box-shadow:0 25px 45px #081d4c35}.scene-bubble{position:absolute;top:20px;right:20px;padding:9px 13px;border-radius:99px;background:#fff;color:#204a92;font-weight:900}.floating{position:absolute;width:65px;height:65px;border-radius:20px;background:#fff;color:#2364e8;display:grid;place-items:center;font-size:28px;box-shadow:0 15px 30px #061b4430;animation:float 3.5s ease-in-out infinite}.f1{left:14%;top:25%}.f2{right:13%;top:34%;animation-delay:.7s}.f3{left:22%;bottom:16%;animation-delay:1.2s}@keyframes float{50%{transform:translateY(-9px) rotate(2deg)}}
.journey{position:sticky;top:5px;z-index:20;display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin:16px 0;padding:7px;border-radius:19px;background:#ffffffee;border:1px solid var(--line);box-shadow:0 12px 35px #102b5712;backdrop-filter:blur(12px)}.journey button{border:0;background:transparent;padding:12px 7px;border-radius:13px;color:#5c6a80;font-weight:900;cursor:pointer}.journey button.active{background:var(--pink);color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:24px;margin-top:16px;box-shadow:0 14px 38px #102b5709;scroll-margin-top:85px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:20px}.card h2{margin:4px 0 8px;font-size:29px;color:var(--navy)}.card p{color:var(--muted);line-height:1.9}.blue{color:#2460c8}.pink{color:var(--pink)}.gold{color:#b57900}.teal{color:#0b8d7f}.purple{color:var(--purple)}
.mission{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:center;background:linear-gradient(135deg,#fff,#f5f9ff)}.mission-score{padding:18px;border-radius:20px;background:#f0f5ff;text-align:center}.mission-score span{font-size:42px;font-weight:900;color:var(--blue)}.mission-score small{font-weight:900;color:var(--muted);margin-right:6px}.bar{height:10px;background:#dfe7f4;border-radius:99px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--teal));transition:.3s}
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.vcard{border:1px solid var(--line);border-radius:21px;padding:11px;background:linear-gradient(180deg,#fff,#fbfcff);transition:.2s;overflow:hidden}.vcard:hover,.vcard.played{transform:translateY(-4px);box-shadow:0 18px 35px #102b5715}.visual{width:100%;height:145px;border:0;border-radius:16px;background:linear-gradient(145deg,#edf4ff,#f8faff);color:#2560bd;font-size:62px;display:grid;place-items:center;cursor:pointer;position:relative}.visual .tap{position:absolute;bottom:8px;font:900 11px Arial;color:#63728a}.fr{direction:ltr;text-align:center;font-size:21px;font-weight:900;margin-top:12px}.ar{text-align:center;color:#315da3;font-weight:900;margin:5px}.mini{text-align:center;color:#8993a3;font-size:11px;min-height:28px}.vactions{display:flex;justify-content:center;gap:6px;margin-top:9px}.vactions button{border:0;border-radius:11px;padding:9px 10px;font-weight:900;cursor:pointer}.listen{background:var(--pink);color:#fff}.reveal{background:#edf3ff;color:#285aa7}.example{margin:9px 0 0;padding:9px;border-radius:12px;background:#f5f8fd;direction:ltr;text-align:left;font-weight:800}.hidden{display:none}
.dialogue-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}.dialogue-scene{min-height:380px;border-radius:24px;background:linear-gradient(145deg,#dbe9ff,#f9fbff);position:relative;overflow:hidden;padding:25px}.chalkboard{background:#153d66;color:#fff;border-radius:16px;padding:15px;text-align:center;font-weight:900;letter-spacing:2px}.characters{height:280px;display:flex;justify-content:center;align-items:end;gap:45px}.character{width:145px;height:180px;border-radius:35px 35px 22px 22px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;color:#2460bd;box-shadow:0 15px 35px #102b5715;font-size:65px}.character b{font-size:14px;color:var(--ink)}.teacher{transform:rotate(-2deg)}.student{transform:rotate(2deg)}.dialogue-list{display:flex;flex-direction:column;gap:8px}.line{border:1px solid var(--line);background:#fff;border-radius:15px;padding:14px;display:grid;grid-template-columns:110px 1fr 32px;gap:8px;text-align:right;align-items:center;cursor:pointer}.line span{color:var(--pink);font-weight:900}.line b{direction:ltr;text-align:left}.wide{width:100%;margin-top:8px}
.grammar-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}.rule-box,.builder{border:1px solid var(--line);border-radius:20px;padding:20px;background:linear-gradient(180deg,#fff,#f8fbff)}.rule-title{font-size:20px;font-weight:900;color:var(--navy)}.rule-box strong{color:var(--blue);font-size:21px}.rule-ar{margin-top:18px;padding:13px;border-radius:14px;background:#eef4ff;color:#315a9c;font-weight:800}.sentence{min-height:52px;border:2px dashed #cbd8eb;border-radius:14px;padding:9px;margin:12px 0;direction:ltr;text-align:left}.chosen{border:0;background:#eaf8f1;border-radius:9px;padding:8px;margin:3px;font-weight:900}.tokens{display:flex;gap:7px;flex-wrap:wrap;direction:ltr}.tokens button{border:1px solid #cbd8eb;background:#fff;border-radius:10px;padding:9px 11px;font-weight:900;cursor:pointer}.feedback{min-height:25px;margin-top:9px;font-weight:900}
.match{display:grid;grid-template-columns:1fr 1fr;gap:16px}.match-options{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.match-options button{border:1px solid var(--line);background:#fff;border-radius:15px;padding:16px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;cursor:pointer;min-height:70px}.match-options button i{font-size:28px;color:#2860bf}.match-options button.selected{outline:3px solid #2364e82a;background:#f0f5ff}.match-options button.matched{background:#eaf8f1;border-color:#6bc89b}
.quiz{display:grid;grid-template-columns:1fr 1fr;gap:12px}.q{border:1px solid var(--line);border-radius:19px;padding:17px;background:#fff}.qnum{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#edf3ff;color:#2458ad;margin-left:8px}.choices{display:grid;grid-template-columns:1fr;gap:7px;margin-top:13px}.choices button{border:1px solid #d5ddea;background:#fff;border-radius:12px;padding:11px;text-align:right;font-weight:800;cursor:pointer}.choices button.correct{background:#eaf8f1;border-color:#6bc89b}.choices button.wrong{background:#fff0f3;border-color:#ef9bab}.score{font-size:25px;font-weight:900;color:#2458ad}.result{display:grid;grid-template-columns:110px 1fr auto;gap:20px;align-items:center;background:linear-gradient(135deg,#fff,#f2fbfa)}.result-icon{width:95px;height:95px;border-radius:28px;background:#fff7df;display:grid;place-items:center;font-size:50px}.badges{display:flex;gap:8px;flex-wrap:wrap}.badges span{padding:8px 11px;border-radius:99px;background:#f0f4fa;color:#44536c;font-weight:800}.resources .resource-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.resource-grid article{border:1px solid var(--line);border-radius:19px;padding:17px;background:linear-gradient(180deg,#fff,#fbfcff)}.resource-grid b{font-size:18px;color:var(--navy)}.resource-grid p{font-size:13px;margin:8px 0}.resource-grid .soft{width:100%}#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,25px);background:#102b57;color:#fff;padding:12px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:100}.show{opacity:1!important;transform:translate(-50%,0)!important}
@media(max-width:950px){.studio-hero,.dialogue-layout,.grammar-layout,.mission{grid-template-columns:1fr}.vgrid{grid-template-columns:repeat(3,1fr)}.resources .resource-grid{grid-template-columns:repeat(2,1fr)}.quiz{grid-template-columns:1fr}.result{grid-template-columns:90px 1fr}.result .primary{grid-column:1/-1}}@media(max-width:650px){.wrap{padding:10px 9px 70px}.studio-hero{padding:22px;border-radius:25px}.hero-scene{min-height:230px}.journey{grid-template-columns:repeat(2,1fr)}.vgrid,.resources .resource-grid{grid-template-columns:repeat(2,1fr)}.section-head{display:block}.section-head>.soft{margin-top:8px}.characters{gap:12px}.character{width:115px;height:155px;font-size:52px}.match{grid-template-columns:1fr}.result{grid-template-columns:1fr;text-align:center}.result-icon{margin:auto}.result .badges{justify-content:center}.result .primary{width:100%}}
</style>
