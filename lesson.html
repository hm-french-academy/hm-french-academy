</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="index.html">الرئيسية</a><a href="dashboard.html">الطالب</a><a href="course.html">المناهج الدراسية</a><a href="levels.html">مستويات اللغة</a><a href="library.html">المكتبة</a><a href="settings.html">الإعدادات</a></nav><div class="hm-tools"><select class="hm-lang" data-lang-select><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select><a class="hm-student" href="student-profile.html">👨‍🎓</a></div></header><main class="wrap"><section class="hero"><div><span id="unit" style="font-weight:900;opacity:.9"></span><h1 id="title">Leçon</h1><p id="subtitle"></p></div><div class="hero-art" id="art">🏫</div></section><nav class="tabs" aria-label="Lesson sections"><button class="tab active" data-view="lesson">📘 الدرس</button><button class="tab" data-view="files">📚 ملفات الدرس</button><button class="tab" data-view="games">🎮 الألعاب</button><button class="tab" data-view="assessment">📝 التقييم</button></nav><section id="viewer" class="viewer"></section><section class="complete"><div><strong>🏁 إكمال الدرس</strong><div id="completionMessage" class="message">سيتم حفظ رحلتك وتقدمك على هذا الجهاز أثناء التعلم.</div></div><button id="completeBtn" type="button">تم الانتهاء من الدرس</button></section><div class="back"><a href="grade-8.html">← العودة إلى الصف</a><a href="course.html">📚 المناهج الدراسية</a><a href="dashboard.html">📈 لوحة الطالب</a></div></main><footer class="hm-footer"><div class="hm-footer-brand"><strong>HM Academy</strong><span>French Language Education</span><small>Fondateur : Hatem ElMorsi · © 2026</small></div></footer><script src="scripts/i18n.js?v=20260812-i18n4"></script><script src="scripts/brand.js?v=20260812-brand5"></script><script src="scripts/learning-progress.js?v=20260812-progress4"></script><script src="scripts/lesson-complete.js?v=20260812-complete4"></script><script>
const id=new URLSearchParams(location.search).get('id')||'grade8-u1-l1';const requested=new URLSearchParams(location.search).get('section')||'lesson';let registry=null,lesson=null;const lang=()=>window.HMLanguage?.get?.()||'ar';
function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function find(){for(const u of registry?.includedUnits||[])for(const l of u.lessons||[])if(l.id===id)return {...l,unitTitleAr:u.titleAr,unitTitleFr:u.titleFr};return null}
function resourceUrl(kind){if(!lesson)return null;if(kind==='games')return lesson.games||null;if(kind==='assessment')return lesson.assessment||lesson.quiz||null;if(kind==='interactive')return lesson.sourceInteractive||lesson.interactive||null;return null}
function injectFrameSkin(frame){try{const doc=frame.contentDocument;if(!doc)return;const style=doc.createElement('style');style.textContent='body{background:#f4f7fc!important;color:#17223b!important;font-family:Arial,Cairo,sans-serif!important}main{max-width:1120px!important;margin:0 auto!important;padding:22px 14px 45px!important}.hero{border-radius:28px!important;box-shadow:0 14px 35px rgba(20,38,74,.08)!important}.card,.panel,.section{border-radius:22px!important;box-shadow:0 10px 30px rgba(20,38,74,.07)!important}.top{position:static!important}';doc.head.appendChild(style);}catch(e){}}
function frame(url,title){viewer.innerHTML='<iframe title="'+esc(title)+'" src="'+esc(url)+'" loading="lazy"></iframe>';const f=viewer.querySelector('iframe');f.addEventListener('load',()=>{injectFrameSkin(f);try{HMProgress.setSection(requested)}catch(e){}})}
function filesView(){const items=[['interactive','📘','الدرس التفاعلي',lesson.sourceInteractive||lesson.interactive],['reference','📄','المرجع التعليمي',lesson.reference],['assessment','📝','التقييم الرسمي',lesson.assessment],['quiz','🎯','الاختبار الإلكتروني',lesson.quiz],['games','🎮','الألعاب التعليمية',lesson.games]].filter(x=>x[3]);viewer.innerHTML='<div class="resource"><h2>📚 ملفات الدرس</h2><p>كل موارد الدرس مرتبطة من نفس صفحة الدرس، ولا تحتاج للانتقال إلى صفحات متفرقة.</p><div class="resource-grid">'+items.map((x,i)=>'<a class="'+(i===0?'primary':'')+'" target="_blank" rel="noopener" href="'+esc(x[3])+'">'+x[1]+' '+esc(x[2])+' ↗</a>').join('')+'</div></div>';HMProgress.setSection('files')}
function fallback(){viewer.innerHTML='<div class="resource"><h2>محتوى الدرس</h2><p>تم تسجيل هذا الدرس في خريطة المنهج، وسيتم عرض حزمة المحتوى الخاصة به هنا فور ربط ملفاتها.</p></div>'}
function open(view){if(!lesson)return;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));HMProgress.setSection(view);if(view==='files'){filesView();return}if(view==='lesson'){const u=resourceUrl('interactive');u?frame(u,'محتوى الدرس التفاعلي'):fallback();return}if(view==='games'){const u=resourceUrl('games');u?frame(u,'الألعاب التعليمية'):fallback();return}if(view==='assessment'){const u=resourceUrl('assessment');u?frame(u,'التقييم'):fallback();return}}
function render(){lesson=find();if(!lesson){title.textContent='الدرس غير موجود';subtitle.textContent='';viewer.innerHTML='<div class="resource"><h2>الدرس غير موجود</h2></div>';return}const ar=lang()==='ar';unit.textContent=ar?lesson.unitTitleAr:lesson.unitTitleFr;title.textContent=ar?lesson.titleAr:lesson.titleFr;subtitle.textContent=ar?'الصف الثاني الإعدادي · الترم الأول':'2e année du collège · 1er semestre';art.textContent=lesson.id.includes('u2-')?'🏠':lesson.id.includes('u3-')?'✈️':'🏫';const p=HMProgress.get();const done=p.completedLessons.includes(id);completeBtn.disabled=done;completeBtn.textContent=done?'✅ تم إكمال الدرس':'تم الانتهاء من الدرس';completionMessage.textContent=done?'تم حفظ إكمال الدرس والتقدم على هذا الجهاز.':'رحلتك محفوظة تلقائيًا. عند إنهاء الدرس اضغط الزر لإضافة 50 XP.';HMProgress.startLesson(id);open(['lesson','files','games','assessment'].includes(requested)?requested:'lesson')}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>open(b.dataset.view)));completeBtn.addEventListener('click',()=>{if(window.markLessonComplete)window.markLessonComplete(id,'lesson-finish','grammar');render()});window.addEventListener('hm:languagechange',render);window.addEventListener('hm:progress-updated',()=>{if(lesson){const p=HMProgress.get();const done=p.completedLessons.includes(id);completeBtn.disabled=done;completeBtn.textContent=done?'✅ تم إكمال الدرس':'تم الانتهاء من الدرس';}});
async function load(){try{const r=await fetch('data/lessons/grade-8/lesson-registry.json?v=20260812-registry4',{cache:'no-store'});registry=await r.json();render()}catch(e){viewer.innerHTML='<div class="resource"><h2>تعذر تحميل بيانات الدرس</h2><p>أعد تحميل الصفحة.</p></div>'}}load();
</script></body></html>
