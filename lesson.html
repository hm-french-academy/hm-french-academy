<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Leçon</title><link rel="stylesheet" href="css/premium-shell.css?v=20260813-premium"><style>:root{--nav:#14264a;--blue:#2563eb;--pink:#e92d83;--green:#20a45a;--line:#e1e7f0;--muted:#68758b}.wrap{max-width:1180px;margin:auto;padding:20px 14px 55px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff;border-radius:30px;padding:28px;display:flex;justify-content:space-between;gap:20px;align-items:center;box-shadow:0 20px 50px #2563eb22}.hero h1{margin:6px 0;font-size:clamp(30px,6vw,46px)}.hero p{margin:8px 0;line-height:1.8}.hero-art{width:180px;height:125px;border-radius:24px;background:#ffffff22;display:grid;place-items:center;font-size:72px}.journey{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:16px 0}.step{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center;font-size:12px;font-weight:900;color:#657189}.step.active{border-color:var(--pink);background:#fff2f8;color:var(--pink)}.step.done{border-color:#b9e6ca;color:var(--green)}.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0;padding:6px;background:#fff;border:1px solid var(--line);border-radius:18px}.tab{border:0;background:transparent;color:#536078;padding:11px 15px;border-radius:13px;font-weight:900;white-space:nowrap;cursor:pointer}.tab.active{background:var(--pink);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 14px 40px #14264a10}.section-head{padding:24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.section-head h2{margin:0;color:var(--nav);font-size:28px}.section-head p{margin:7px 0 0;color:var(--muted);line-height:1.8}.section-badge{background:#fff2f8;color:var(--pink);padding:9px 12px;border-radius:13px;font-weight:900;white-space:nowrap}.content{padding:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.word{border:1px solid var(--line);border-radius:20px;padding:11px;text-align:center;background:#fff;box-shadow:0 7px 20px #14264a0b}.pic{height:145px;border-radius:17px;background:linear-gradient(145deg,#eef4ff,#fff2f8);display:grid;place-items:center;font-size:70px;cursor:pointer}.hint{font-size:10px;color:#7a8497;margin:6px}.fr{font-weight:900;font-size:19px;direction:ltr}.ar{color:#315aa4;font-weight:900;margin:5px}.speak{border:0;border-radius:50%;width:43px;height:43px;background:var(--pink);color:#fff;font-size:17px;cursor:pointer}.example{margin-top:10px;padding:10px;border-right:4px solid var(--pink);background:#f8faff;border-radius:11px;line-height:1.7;text-align:right}.listen,.example button,.primary{border:0;background:#edf3ff;color:#2850a3;border-radius:11px;padding:9px 12px;font-weight:900;cursor:pointer}.primary{background:var(--blue);color:#fff}.focus{border:0;background:#14264a;color:#fff;border-radius:12px;padding:10px 13px;font-weight:900;cursor:pointer}.resource-grid,.practice{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.resource{padding:22px}.resource h3{color:var(--nav)}.resource a{display:block;text-decoration:none;padding:16px;border:1px solid #dfe6f2;border-radius:14px;color:#315fc8;font-weight:900;background:#f8faff}.resource p,.rule p{color:var(--muted);line-height:1.9}.rule{background:linear-gradient(145deg,#fbf8ff,#f4f7ff);border:1px solid var(--line);border-radius:20px;padding:20px;line-height:2}.exercise{border:1px solid var(--line);border-radius:20px;padding:18px}.option{display:block;width:100%;padding:11px;margin:7px 0;border:1px solid #d8deea;border-radius:12px;background:#fff;text-align:right;font-weight:800;cursor:pointer}.feedback{font-weight:900;min-height:20px}.complete{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:14px}.complete button{border:0;border-radius:13px;padding:12px 16px;background:var(--pink);color:#fff;font-weight:900;cursor:pointer}.complete button:disabled{background:var(--green);cursor:default}.message{color:var(--muted);font-weight:800}.back{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.back a{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-decoration:none;color:#315fc8;font-weight:900}.focus-mode .hm-header,.focus-mode .back,.focus-mode .journey,.focus-mode .tabs{display:none}.focus-mode .wrap{max-width:900px;padding-top:20px}.focus-mode .hero{border-radius:20px}.focus-mode .panel{box-shadow:none}@media(max-width:800px){.journey{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.hero{display:block;padding:20px}.hero-art{width:100%;height:100px;margin-top:15px}.journey{grid-template-columns:repeat(2,1fr)}.grid,.resource-grid,.practice{grid-template-columns:1fr}.section-head{display:block}.section-badge{display:inline-block;margin-top:10px}.complete{display:block}.complete button{width:100%;margin-top:10px}}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="index.html">الرئيسية</a><a href="dashboard.html">الطالب</a><a href="course.html">المناهج الدراسية</a><a href="levels.html">مستويات اللغة</a><a href="library.html">المكتبة</a><a href="settings.html">الإعدادات</a></nav><div class="hm-tools"><select class="hm-lang" data-lang-select><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select><a class="hm-student" href="student-profile.html">👨‍🎓</a></div></header><main class="wrap"><section class="hero"><div><span id="unit" style="font-weight:900;opacity:.9"></span><h1 id="title">Leçon</h1><p id="subtitle"></p></div><div class="hero-art" id="art">🏫</div></section><section class="journey" id="journey"></section><nav class="tabs" aria-label="Lesson sections"><button class="tab active" data-view="lesson">📘 الدرس</button><button class="tab" data-view="vocab">📚 Vocabulaire</button><button class="tab" data-view="pronunciation">🎧 Prononciation</button><button class="tab" data-view="grammar">📖 Grammaire</button><button class="tab" data-view="practice">✍️ Pratique</button><button class="tab" data-view="games">🎮 Jeux</button><button class="tab" data-view="assessment">📝 Évaluation</button><button class="tab" data-view="files">📚 الملفات</button></nav><section id="viewer" class="panel"></section><section class="complete"><div><strong>🏁 إكمال الدرس</strong><div id="completionMessage" class="message">سيتم حفظ رحلتك وتقدمك على هذا الجهاز أثناء التعلم.</div></div><button id="completeBtn" type="button">تم الانتهاء من الدرس</button></section><div class="back"><a href="grade-8.html">← العودة إلى الصف</a><a href="course.html">📚 المناهج الدراسية</a><a href="dashboard.html">📈 لوحة الطالب</a></div></main><footer class="hm-footer"><div class="hm-footer-brand"><strong>HM Academy</strong><span>French Language Education</span><small>Fondateur : Hatem ElMorsi · © 2026</small></div></footer><script src="scripts/i18n.js?v=20260813-i18n"></script><script src="scripts/brand.js?v=20260813-brand"></script><script src="scripts/learning-progress.js?v=20260813-progress"></script><script src="scripts/lesson-complete.js?v=20260813-complete"></script><script>const id=new URLSearchParams(location.search).get('id')||'grade8-u1-l1';const requested=new URLSearchParams(location.search).get('section')||'lesson';let registry=null,lesson=null;const lang=()=>window.HMLanguage?.get?.()||'ar';function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function speak(t){if(!t||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.86;speechSynthesis.speak(u)}function find(){for(const u of registry?.includedUnits||[])for(const l of u.lessons||[])if(l.id===id)return {...l,unitTitleAr:u.titleAr,unitTitleFr:u.titleFr};return null}function mark(view){try{HMProgress.setSection(view)}catch(e){}}function header(icon,title,desc,badge='Premium'){return `<div class="section-head"><div><h2>${icon} ${title}</h2><p>${desc}</p></div><span class="section-badge">${badge}</span></div>`}function vocab(){const fallback=[['Le français','اللغة الفرنسية','🇫🇷','J’aime le français.'],["L'anglais",'اللغة الإنجليزية','🇬🇧',"J'aime l'anglais."],['Les mathématiques','الرياضيات','➗','J’aime les mathématiques.'],["L'arabe",'اللغة العربية','📝',"J'étudie l'arabe."],['Le dessin','الرسم','🎨','Je préfère le dessin.'],['Les sciences','العلوم','🔬','J’aime les sciences.']];const data=lesson.vocabulary||lesson.words||fallback;return header('📚','Vocabulaire • مختبر المفردات','الصورة تربط الكلمة بالمعنى. اضغط على الصورة أو زر النطق، ثم استمع إلى المثال.','المفردات')+`<div class="content"><div class="grid">${data.map((x,i)=>{const w=Array.isArray(x)?x[0]:x.fr||x.word||x.term||'';const ar=Array.isArray(x)?x[1]:x.ar||x.translation||'';const im=Array.isArray(x)?x[2]:x.image||x.icon||'🖼️';const ex=Array.isArray(x)?x[3]:x.example||'';return `<article class="word"><div class="pic" onclick='speak(${JSON.stringify(w)})'>${esc(im)}</div><div class="hint">اضغط على الصورة لسماع الكلمة</div><div class="fr">${esc(w)}</div><div class="ar">${esc(ar)}</div><button class="speak" onclick='speak(${JSON.stringify(w)})'>🔊</button>${ex?`<div class="example"><b>${esc(ex)}</b><br><button onclick='speak(${JSON.stringify(ex)})'>🔊 استمع إلى المثال</button></div>`:''}</article>`}).join('')}</div></div>`}function pronunciation(){const data=lesson.vocabulary||lesson.words||[];const text=data.map(x=>Array.isArray(x)?x[0]:x.fr||x.word||x.term||'').filter(Boolean).join('. ');return header('🎧','Prononciation • معمل النطق','استمع إلى النطق ثم كرر الكلمات والأمثلة بالسرعة المناسبة لك.','نطق')+`<div class="content"><div class="rule"><h3>🎙️ جلسة نطق مركزة</h3><p>ابدأ بالاستماع إلى مجموعة كلمات الدرس، ثم أعد النطق بنفسك.</p><button class="primary" onclick='speak(${JSON.stringify(text)})'>▶ تشغيل المفردات</button><button class="listen" style="margin-right:8px" onclick='speak(${JSON.stringify((data.map(x=>Array.isArray(x)?x[3]:x.example||'').filter(Boolean).join('. ')))})'>▶ تشغيل الأمثلة</button></div></div>`}function grammar(){return header('📖','Grammaire • القواعد','شرح القاعدة بطريقة مختصرة ثم تطبيقها مباشرة.','قواعد')+`<div class="content"><div class="rule"><h3>Aimer / Préférer / Détester</h3><p><b>J’aime le français.</b> — أنا أحب الفرنسية.</p><p><b>Je préfère la géographie.</b> — أنا أفضل الجغرافيا.</p><p><b>Je déteste les maths.</b> — أنا لا أحب الرياضيات.</p><p>ثم طبّق القاعدة في قسم <b>Pratique</b>.</p></div></div>`}function practice(){return header('✍️','Pratique • تدرّب بنفسك','تدريبات قصيرة مع تغذية راجعة فورية دون كشف الإجابة قبل المحاولة.','تدريب')+`<div class="content"><div class="practice"><article class="exercise"><h3>1. ما معنى «La musique»؟</h3><button class="option" onclick="this.parentElement.querySelector('.feedback').textContent='✓ إجابة صحيحة'">الموسيقى</button><button class="option" onclick="this.parentElement.querySelector('.feedback').textContent='✗ حاول مرة أخرى'">الرياضيات</button><div class="feedback"></div></article><article class="exercise"><h3>2. أكمل: Je préfère ___ géographie.</h3><button class="option" onclick="this.parentElement.querySelector('.feedback').textContent='✓ إجابة صحيحة'">la</button><button class="option" onclick="this.parentElement.querySelector('.feedback').textContent='✗ حاول مرة أخرى'">un</button><div class="feedback"></div></article></div></div>`}function games(){const url=lesson.games||null;return header('🎮','Jeux • الألعاب التعليمية','تحديات قصيرة مرتبطة بمفردات الدرس، مع الحفاظ على رحلة التعلم داخل الصفحة.','ألعاب')+`<div class="content"><div class="rule"><h3>🏆 تحدي الدرس</h3><p>ابدأ بتحدي سريع، ثم عد إلى الدرس لمراجعة الكلمات التي تحتاجها.</p>${url?`<a class="primary" target="_blank" rel="noopener" href="${esc(url)}">فتح اللعبة الأصلية ↗</a>`:`<button class="primary" onclick="open('practice')">ابدأ التحدي</button>`}</div></div>`}function assessment(){const url=lesson.assessment||lesson.quiz||null;return header('📝','Évaluation • التقييم','اختبر فهمك بعد إنهاء المفردات والقواعد والتدريب.','تقييم')+`<div class="content"><div class="rule"><h3>🎯 اختبار الإتقان</h3><p>أكمل أقسام الدرس أولًا ثم انتقل إلى التقييم.</p>${url?`<a class="primary" target="_blank" rel="noopener" href="${esc(url)}">فتح التقييم ↗</a>`:`<button class="primary" onclick="open('practice')">ابدأ بالتدريب قبل التقييم</button>`}</div></div>`}function filesView(){const items=[['interactive','📘','الدرس التفاعلي',lesson.sourceInteractive||lesson.interactive],['reference','📄','المرجع التعليمي',lesson.reference],['assessment','📝','التقييم الرسمي',lesson.assessment],['quiz','🎯','الاختبار الإلكتروني',lesson.quiz],['games','🎮','الألعاب التعليمية',lesson.games]].filter(x=>x[3]);viewer.innerHTML=header('📚','ملفات الدرس','موارد الدرس الرسمية متاحة دون تداخل صفحات داخل صفحة.')+`<div class="resource"><div class="resource-grid">${items.map((x,i)=>`<a class="${i===0?'primary':''}" target="_blank" rel="noopener" href="${esc(x[3])}">${x[1]} ${esc(x[2])} ↗</a>`).join('')}</div></div>`;mark('files')}function lessonView(){return header('📘','Leçon • شرح الدرس','ابدأ بالمفردات، ثم النطق والقواعد، وبعدها التدريب والتقييم.','رحلة الدرس')+`<div class="content"><div class="rule"><h3>✨ Daily Spark | كبسولة اليوم</h3><p>كلمة جديدة اليوم = خطوة جديدة نحو الطلاقة.</p><p><b>نصيحة:</b> لا تكتفِ برؤية الكلمة؛ اسمعها، انطقها، ثم استخدمها في جملة.</p></div><div class="rule" style="margin-top:14px"><h3>🧭 Learning Journey | رحلة التعلم</h3><p>اتبع الأقسام بالترتيب لتحصل على أفضل نتيجة.</p><button class="primary" onclick="open('vocab')">ابدأ بالمفردات →</button><button class="focus" style="margin-right:8px" onclick="document.body.classList.toggle('focus-mode')">🎯 وضع التركيز</button></div></div>`}function open(view){if(!lesson)return;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));mark(view);if(view==='vocab')viewer.innerHTML=vocab();else if(view==='pronunciation')viewer.innerHTML=pronunciation();else if(view==='grammar')viewer.innerHTML=grammar();else if(view==='practice')viewer.innerHTML=practice();else if(view==='games')viewer.innerHTML=games();else if(view==='assessment')viewer.innerHTML=assessment();else if(view==='files')filesView();else viewer.innerHTML=lessonView();}function journey(doneSection){const steps=[['lesson','📘','ابدأ'],['vocab','📚','المفردات'],['pronunciation','🎧','النطق'],['grammar','📖','القواعد'],['practice','✍️','التدريب'],['assessment','📝','التقييم']];journeyEl.innerHTML=steps.map((s,i)=>`<div class="step ${s[0]===doneSection?'active':''}">${s[1]}<br>${s[2]}</div>`).join('')}const journeyEl=document.getElementById('journey');function render(){lesson=find();if(!lesson){title.textContent='الدرس غير موجود';subtitle.textContent='';viewer.innerHTML='<div class="resource"><h2>محتوى الدرس</h2><p>تعذر العثور على بيانات هذا الدرس.</p></div>';return}const ar=lang()==='ar';unit.textContent=ar?lesson.unitTitleAr:lesson.unitTitleFr;title.textContent=ar?lesson.titleAr:lesson.titleFr;subtitle.textContent=ar?'الصف الثاني الإعدادي · الترم الأول':'2e année du collège · 1er semestre';art.textContent=lesson.id.includes('u2-')?'🏠':lesson.id.includes('u3-')?'✈️':'🏫';let p=HMProgress.get();const done=p.completedLessons.includes(id);completeBtn.disabled=done;completeBtn.textContent=done?'✅ تم إكمال الدرس':'تم الانتهاء من الدرس';completionMessage.textContent=done?'تم حفظ إكمال الدرس والتقدم على هذا الجهاز.':'رحلتك محفوظة تلقائيًا. عند إنهاء الدرس اضغط الزر لإضافة 50 XP.';HMProgress.startLesson(id);journey(requested);open(['lesson','vocab','pronunciation','grammar','practice','games','assessment','files'].includes(requested)?requested:'lesson')}document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>open(b.dataset.view)));completeBtn.addEventListener('click',()=>{if(window.markLessonComplete)window.markLessonComplete(id,'lesson-finish','premium-sections');render()});window.addEventListener('hm:languagechange',render);window.addEventListener('hm:progress-updated',()=>{if(lesson){const p=HMProgress.get();const done=p.completedLessons.includes(id);completeBtn.disabled=done;completeBtn.textContent=done?'✅ تم إكمال الدرس':'تم الانتهاء من الدرس'}});async function load(){try{const r=await fetch('data/lessons/grade-8/lesson-registry.json?v=20260813-premium-sections',{cache:'no-store'});registry=await r.json();render()}catch(e){viewer.innerHTML='<div class="resource"><h2>تعذر تحميل بيانات الدرس</h2><p>أعد تحميل الصفحة.</p></div>'}}load();</script></body></html>
