<style>
:root{--nav:#14264a;--blue:#2563eb;--pink:#e92d83;--green:#20a45a;--red:#d14b4b;--line:#e1e7f0;--muted:#68758b;--soft:#f7f9fd}
*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:var(--nav);font-family:Arial,Cairo,sans-serif}
.wrap{max-width:1180px;margin:auto;padding:18px 14px 55px}
.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff;border-radius:30px;padding:26px;display:flex;justify-content:space-between;gap:20px;align-items:center;box-shadow:0 20px 50px #2563eb22}
.hero h1{margin:6px 0;font-size:clamp(30px,6vw,46px)}.hero p{margin:7px 0;line-height:1.8}.hero-art{width:180px;height:120px;border-radius:24px;background:#ffffff22;display:grid;place-items:center;font-size:70px}
.journey{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:14px 0}.step{background:#fff;border:1px solid var(--line);border-radius:15px;padding:9px;text-align:center;font-size:12px;font-weight:900;color:#657189}.step.active{border-color:var(--pink);background:#fff2f8;color:var(--pink)}
.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0;padding:6px;background:#fff;border:1px solid var(--line);border-radius:18px}.tab{border:0;background:transparent;color:#536078;padding:11px 14px;border-radius:13px;font-weight:900;white-space:nowrap;cursor:pointer}.tab.active{background:var(--pink);color:#fff}
.panel{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 14px 40px #14264a10;min-height:220px}.head{padding:22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.head h2{margin:0;color:var(--nav);font-size:28px}.head p{margin:7px 0 0;color:var(--muted);line-height:1.8}.content{padding:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{border:1px solid var(--line);border-radius:19px;padding:13px;background:#fff;box-shadow:0 7px 20px #14264a0b}.pic{height:145px;border-radius:16px;background:linear-gradient(145deg,#eef4ff,#fff2f8);display:grid;place-items:center;font-size:68px;cursor:pointer}.fr{font-weight:900;font-size:19px;direction:ltr;margin-top:8px}.ar{color:#315aa4;font-weight:900;margin:4px 0}.example{padding:10px;background:var(--soft);border-right:4px solid var(--pink);border-radius:10px;line-height:1.7;margin-top:8px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.btn{border:0;border-radius:11px;padding:10px 12px;background:#edf3ff;color:#2850a3;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.btn.primary{background:var(--blue);color:#fff}.btn.pink{background:var(--pink);color:#fff}.btn.green{background:#eaf8f1;color:#197441}
.rule{border:1px solid var(--line);border-radius:19px;padding:19px;background:linear-gradient(145deg,#fbf8ff,#f4f7ff);line-height:1.9}.formula{direction:ltr;text-align:center;font-weight:900;font-size:22px;background:#fff;border-radius:15px;padding:15px;margin:12px 0}
.dialogue{display:grid;gap:10px}.dialog-line{padding:14px;border:1px solid var(--line);border-radius:15px;background:#f8faff}.speaker{font-weight:900;color:var(--pink)}.fr-line{direction:ltr;text-align:left;font-weight:900;margin:5px 0}.ar-line{color:#315aa4;font-weight:800}
.exercise{border:1px solid var(--line);border-radius:19px;padding:17px;background:#fff}.exercise h3{margin:0 0 9px}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.option{border:1px solid #d8deea;border-radius:12px;background:#fff;padding:11px;text-align:right;font-weight:800;cursor:pointer}.option:hover{border-color:var(--blue)}.option.correct{border-color:var(--green);background:#effaf3}.option.wrong{border-color:var(--red);background:#fff3f3}.feedback{min-height:22px;margin-top:8px;font-weight:900}.file-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.file-card{border:1px solid var(--line);border-radius:18px;padding:17px;background:#fff}.file-card h3{margin:0 0 7px}.file-card p{color:var(--muted);line-height:1.7;margin:0 0 10px}.note{padding:14px 16px;border-radius:15px;background:var(--soft);color:var(--muted);line-height:1.8;margin-bottom:14px}
.complete{margin-top:15px;background:#fff;border:1px solid var(--line);border-radius:21px;padding:17px;display:flex;justify-content:space-between;align-items:center;gap:14px}.complete button{border:0;border-radius:12px;padding:12px 16px;background:var(--pink);color:#fff;font-weight:900;cursor:pointer}.complete button:disabled{background:var(--green)}
.back{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.back a{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-decoration:none;color:#315fc8;font-weight:900}
.status{padding:28px;text-align:center;color:var(--muted);font-weight:800}.small{font-size:12px;color:var(--muted)}
@media(max-width:800px){.journey{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.hero{display:block;padding:20px}.hero-art{width:100%;height:95px;margin-top:13px}.journey{grid-template-columns:repeat(2,1fr)}.grid,.file-grid{grid-template-columns:1fr}.head{display:block}.options{grid-template-columns:1fr}.complete{display:block}.complete button{width:100%;margin-top:9px}}
</style>

<script>
(function(){
'use strict';
const params=new URLSearchParams(location.search);
const lessonId=params.get('id')||'grade8-u1-l1';
const initialSection=params.get('section')||'lesson';
const unitMatch=lessonId.match(/^grade8-u(\d+)-l(\d+)$/);
const unitNo=unitMatch?unitMatch[1]:'1', lessonNo=unitMatch?unitMatch[2]:'1';
const base=`data/lessons/grade-8/unit-${unitNo}/`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const speak=t=>{if(!t||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t));u.lang='fr-FR';u.rate=.86;speechSynthesis.speak(u)}catch(_){} };
const fallback={
 id:'grade8-u1-l1',titleAr:'في المدرسة',titleFr:"Leçon 1 : À l'école",unitTitleAr:'في المدرسة',unitTitleFr:"À l'école",
 files:{interactive:'lesson-1-interactive-v2.html',reference:'data/lessons/grade-8/unit-1/reference_lecon1_unite1.html',assessment:'data/lessons/grade-8/unit-1/formal_assessment_lecon1_unite1.html',quiz:'data/lessons/grade-8/unit-1/interactive_assessment_lecon1_unite1.html',games:'data/lessons/grade-8/unit-1/lesson-1-games.html'},
 vocabularyGroups:[{id:'facilities',title:'🏫 مرافق المدرسة',description:'أماكن ومرافق المدرسة.'},{id:'classroom',title:'🪑 في الفصل',description:'أدوات وأشياء داخل الفصل.'}],
 vocabulary:[
 {word:'une cantine',translation:'مقصف المدرسة',image:'🍽️',example:'Je mange à la cantine.',category:'facilities'},
 {word:'une cour',translation:'فناء المدرسة',image:'🏫',example:'La cour est grande.',category:'facilities'},
 {word:'des classes',translation:'فصول دراسية',image:'🏫',example:"Il y a des classes à l'école.",category:'facilities'},
 {word:'un gymnase',translation:'صالة الألعاب الرياضية',image:'🏟️',example:'Le gymnase est grand.',category:'facilities'},
 {word:'un CDI',translation:'مركز التوثيق والمعلومات',image:'📚',example:"Le CDI est à l'école.",category:'facilities'},
 {word:'un laboratoire',translation:'معمل',image:'🔬',example:"Le laboratoire est à l'école.",category:'facilities'},
 {word:'un terrain de sport',translation:'ملعب رياضي',image:'⚽',example:'Le terrain de sport est grand.',category:'facilities'},
 {word:'une bibliothèque',translation:'مكتبة',image:'📚',example:"La bibliothèque est à l'école.",category:'facilities'},
 {word:'un bureau',translation:'مكتب',image:'🗄️',example:'Il y a un bureau dans la classe.',category:'classroom'},
 {word:'un tableau',translation:'سبورة',image:'🧑‍🏫',example:'Il y a un tableau dans la classe.',category:'classroom'},
 {word:'une porte',translation:'باب',image:'🚪',example:'La porte est ouverte.',category:'classroom'},
 {word:'une fenêtre',translation:'نافذة',image:'🪟',example:'La fenêtre est ouverte.',category:'classroom'},
 {word:'une chaise',translation:'كرسي',image:'🪑',example:'Je suis sur une chaise.',category:'classroom'},
 {word:'une table',translation:'طاولة',image:'🪵',example:'Le livre est sur la table.',category:'classroom'},
 {word:'un ordinateur',translation:'حاسوب',image:'💻',example:"L'ordinateur est sur la table.",category:'classroom'}
 ],
 grammar:{title:"Il y a / Il n'y a pas de",explanationAr:'نستخدم « il y a » للتعبير عن وجود شخص أو شيء أو مكان، و« il n’y a pas de » للتعبير عن عدم وجود شيء.',explanationFr:"On utilise « il y a » pour exprimer l'existence et « il n'y a pas de » pour exprimer l'absence.",examples:[{fr:'Il y a un tableau dans la classe.',ar:'توجد سبورة في الفصل.'},{fr:"Il y a une bibliothèque à l'école.",ar:'توجد مكتبة في المدرسة.'},{fr:"Il n'y a pas de piscine dans l'école.",ar:'لا يوجد حمام سباحة في المدرسة.'}]},
 conversation:{lines:[{speaker:'Sara',fr:'Où est la bibliothèque ?',ar:'أين المكتبة؟'},{speaker:'Adam',fr:"Elle est à l'école.",ar:'إنها في المدرسة.'},{speaker:'Sara',fr:'Il y a une cantine ?',ar:'هل يوجد مقصف؟'},{speaker:'Adam',fr:'Oui, il y a une cantine.',ar:'نعم، يوجد مقصف.'}]},
 practice:[{question:'ما معنى une bibliothèque؟',options:['مكتبة','مقصف','فصل'],answer:0},{question:'أكمل: Il y a ___ tableau.',options:['un','une','des'],answer:0},{question:'أين تأكل في المدرسة؟',options:['à la cantine','à la bibliothèque','dans la cour'],answer:0},{question:'اختر النفي الصحيح.',options:["Il n'y a pas de piscine.","Il n'y a pas une piscine.",'Il ne y a pas piscine.'],answer:0}]
};
let lesson=fallback,current='lesson',practice=[],score=0,answered={};
const sections=[['lesson','🚀','البداية'],['vocab','📚','المفردات'],['pronunciation','🎧','النطق'],['grammar','📖','القواعد'],['conversation','💬','المحادثة'],['practice','✍️','التدريب'],['games','🎮','الألعاب'],['assessment','📝','التقييم'],['files','📁','الملفات']];
const tabs=document.getElementById('tabs'),viewer=document.getElementById('viewer');
function filePath(p){if(!p)return '';if(/^https?:\/\//i.test(p))return p;if(p.startsWith('lesson.html'))return p;if(p.startsWith('data/'))return p;return base+p}
function renderTabs(){tabs.innerHTML=sections.map(([id,icon,label])=>`<button type="button" class="tab ${current===id?'active':''}" data-view="${id}">${icon} ${label}</button>`).join('')}
function renderJourney(){document.getElementById('journey').innerHTML=sections.slice(1,8).map(([id,icon,label],i)=>`<div class="step ${current===id?'active':''}">${i+1}. ${icon}<br>${label}</div>`).join('')}
function header(title,desc,badge=''){return `<div class="head"><div><h2>${title}</h2><p>${desc}</p></div>${badge?`<span class="btn" style="cursor:default">${badge}</span>`:''}</div>`}
function renderLesson(){return `${header('🚀 ضربة البداية','افتح الدرس مباشرة ثم تحرك بحرية بين كل مكوّناته. لا توجد شاشة تحميل توقف الطالب.','مباشر')}<div class="content"><div class="note"><b>🎯 هدف الدرس:</b> ${esc(lesson.titleAr||'في المدرسة')} — مفردات المدرسة، قاعدة <b>Il y a / Il n'y a pas de</b>، محادثة قصيرة، تدريب، ألعاب وتقييم.</div><div class="grid"><div class="card"><h3>🏫 المفردات</h3><p class="small">تعلم الكلمات مع الصورة والنطق والمثال.</p><button class="btn primary" data-jump="vocab">ابدأ المفردات →</button></div><div class="card"><h3>📖 القواعد</h3><p class="small">شرح عربي وفرنسي مع أمثلة.</p><button class="btn primary" data-jump="grammar">افهم القاعدة →</button></div><div class="card"><h3>💬 المحادثة</h3><p class="small">استماع واحد للمحادثة كاملة ثم نطق كل جملة عند الحاجة.</p><button class="btn primary" data-jump="conversation">افتح المحادثة →</button></div><div class="card"><h3>✍️ التدريب</h3><p class="small">اختيارات متغيرة المكان، وليست الإجابة دائمًا الأولى.</p><button class="btn pink" data-jump="practice">ابدأ التدريب →</button></div><div class="card"><h3>🎮 الألعاب</h3><p class="small">مركز الألعاب مستقل عن التقييم الرسمي.</p><button class="btn primary" data-jump="games">افتح الألعاب →</button></div><div class="card"><h3>📁 الملفات</h3><p class="small">المرجع والتقييم والاختبار والألعاب والملف التفاعلي.</p><button class="btn primary" data-jump="files">افتح الملفات →</button></div></div></div>`}
function renderVocab(){const groups=lesson.vocabularyGroups||[];const vocab=lesson.vocabulary||[];return `${header('📚 المفردات','تعلم الكلمة بالصورة ثم اسمع النطق والمثال.',vocab.length+' مفردة')}<div class="content">${groups.map(g=>`<section style="margin-bottom:25px"><h3>${esc(g.title)}</h3><p class="small">${esc(g.description||'')}</p><div class="grid">${vocab.filter(v=>v.category===g.id).map(v=>`<article class="card"><div class="pic" data-speak="${esc(v.word)}">${esc(v.image||'📘')}</div><div class="fr">${esc(v.word)}</div><div class="ar">${esc(v.translation)}</div><div class="example">${esc(v.example||'')}</div><div class="actions"><button class="btn pink" data-speak="${esc(v.word)}">🔊 نطق</button><button class="btn" data-speak="${esc(v.example||'')}">▶ المثال</button></div></article>`).join('')}</div></section>`).join('')}</div>`}
function renderPronunciation(){const vocab=lesson.vocabulary||[];return `${header('🎧 النطق','تدريب نطق مستقل: اضغط الكلمة أو المثال لسماعه.','Français')}<div class="content"><div class="note">💡 الأفضل أن يسمع الطالب الكلمة أولًا، ثم يحاول نطقها بنفسه، ثم يعيد الاستماع.</div><div class="grid">${vocab.slice(0,12).map(v=>`<article class="card"><div class="fr">${esc(v.word)}</div><div class="ar">${esc(v.translation)}</div><div class="actions"><button class="btn pink" data-speak="${esc(v.word)}">🔊 الكلمة</button><button class="btn" data-speak="${esc(v.example||'')}">🎧 المثال</button></div></article>`).join('')}</div></div>`}
function renderGrammar(){const g=lesson.grammar||{};return `${header('📖 القواعد',esc(g.title||'قاعدة الدرس'),'شرح عربي + Français')}<div class="content"><div class="rule"><p>${esc(g.explanationAr||g.explanation||'')}</p><p dir="ltr">${esc(g.explanationFr||g.explanation||'')}</p><div class="formula">Il y a + nom<br>Il n'y a pas de + nom</div>${(g.examples||[]).map(e=>`<div class="card"><div class="fr">${esc(e.fr)}</div><div class="ar">${esc(e.ar)}</div><button class="btn" data-speak="${esc(e.fr)}">🔊 اسمع المثال</button></div>`).join('')}</div></div>`}
function renderConversation(){const lines=lesson.conversation?.lines||[];const full=lines.map(x=>x.fr).join(' ');return `${header('💬 المحادثة','استماع واحد للمحادثة كاملة، ثم نطق اختياري لكل جملة.','بدون تكرار')}<div class="content"><div class="note"><button class="btn primary" data-speak="${esc(full)}">🎧 استمع إلى المحادثة كاملة</button><span class="small" style="margin-right:8px">زر واحد فقط للمحادثة الكاملة.</span></div><div class="dialogue">${lines.map(x=>`<article class="dialog-line"><div class="speaker">${esc(x.speaker)}</div><div><div class="fr-line">${esc(x.fr)}</div><div class="ar-line">${esc(x.ar)}</div><button class="btn" data-speak="${esc(x.fr)}">🔊 نطق</button></div></article>`).join('')}</div></div>`}
function shuffled(q,index){const arr=(q.options||[]).map((text,i)=>({text,correct:i===Number(q.answer)}));let seed=(index+1)*17;for(let i=arr.length-1;i>0;i--){seed=(seed*9301+49297)%233280;const j=seed%(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function renderPractice(){practice=lesson.practice||[];score=0;answered={};return `${header('✍️ التدريب','أجب بنفسك. ترتيب الاختيارات يتغير لكل سؤال حتى لا تكون الإجابة الصحيحة دائمًا في المكان الأول.',practice.length+' أسئلة')}<div class="content"><div class="note">🔐 لا يوجد كشف مسبق للإجابة. بعد الاختيار فقط تظهر التغذية الراجعة.</div><div style="display:grid;gap:13px">${practice.map((q,i)=>{const opts=shuffled(q,i);return `<article class="exercise"><h3>${i+1}. ${esc(q.question)}</h3><div class="options">${opts.map(o=>`<button class="option" data-q="${i}" data-correct="${o.correct?'1':'0'}">${esc(o.text)}</button>`).join('')}</div><div class="feedback" id="fb-${i}"></div></article>`}).join('')}</div><div class="note" id="practice-score">النتيجة الحالية: 0 / ${practice.length}</div></div>`}
function renderGames(){const hub=filePath(lesson.files?.games||'data/lessons/grade-8/unit-1/lesson-1-games.html');return `${header('🎮 الألعاب','مركز ألعاب مستقل عن التقييم الرسمي.','Practice & Games')}<div class="content"><div class="note">مركز الألعاب الصحيح للدرس الأول موجود في مسار الوحدة، وليس في جذر الموقع.</div><div class="card"><h3>🎮 مركز الألعاب · Leçon 1</h3><p class="small">Memory · Word Catch · Drag & Drop · Pronunciation · Vocabulary · Quiz Express.</p><a class="btn primary" href="${esc(hub)}">فتح مركز الألعاب ↗</a></div></div>`}
function renderAssessment(){const a=filePath(lesson.files?.assessment||'');const q=filePath(lesson.files?.quiz||'');return `${header('📝 التقييم','تقييم مستقل عن التدريب، ولا يكشف الإجابات قبل المحاولة.','أكاديمي')}<div class="content"><div class="file-grid"><article class="file-card"><h3>📝 التقييم الرسمي</h3><p>تقييم أكاديمي مستقل للدرس.</p><a class="btn primary" href="${esc(a)}">فتح التقييم ↗</a></article><article class="file-card"><h3>🎯 التقييم التفاعلي</h3><p>اختبار إلكتروني منفصل عن التدريب.</p><a class="btn pink" href="${esc(q)}">فتح الاختبار ↗</a></article></div></div>`}
function renderFiles(){const f=lesson.files||{};const items=[['📘','الدرس التفاعلي',f.interactive],['📄','المرجع التعليمي',f.reference],['📝','التقييم الرسمي',f.assessment],['🎯','التقييم التفاعلي',f.quiz||f.interactiveAssessment],['🎮','الألعاب التعليمية',f.games]];return `${header('📁 ملفات الدرس','كل الملفات مرتبطة بالدرس ومساراتها مصححة.','5 ملفات')}<div class="content"><div class="file-grid">${items.filter(x=>x[2]).map(x=>`<article class="file-card"><h3>${x[0]} ${x[1]}</h3><p>ملف مستقل يمكن فتحه مباشرة.</p><a class="btn primary" href="${esc(filePath(x[2]))}">فتح الملف ↗</a></article>`).join('')}</div></div>`}
function render(){renderTabs();renderJourney();document.getElementById('title').textContent=lesson.titleFr||lesson.title||'Leçon';document.getElementById('unit').textContent=lesson.unitTitleFr||lesson.unitTitleAr||'';document.getElementById('subtitle').textContent=lesson.titleAr||'الدرس جاهز مباشرة';const map={lesson:renderLesson,vocab:renderVocab,pronunciation:renderPronunciation,grammar:renderGrammar,conversation:renderConversation,practice:renderPractice,games:renderGames,assessment:renderAssessment,files:renderFiles};viewer.innerHTML=(map[current]||renderLesson)();wire();localStorage.setItem('hm_last_lesson',lessonId)}
function wire(){tabs.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{current=b.dataset.view;render();history.replaceState(null,'',`lesson.html?id=${encodeURIComponent(lessonId)}&section=${encodeURIComponent(current)}`);window.scrollTo({top:document.getElementById('tabs').offsetTop-8,behavior:'smooth'})});viewer.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{current=b.dataset.jump;render()});viewer.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.getAttribute('data-speak')));viewer.querySelectorAll('.option').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.q);if(answered[i])return;const ok=b.dataset.correct==='1';answered[i]=true;if(ok)score++;viewer.querySelectorAll(`.option[data-q="${i}"]`).forEach(x=>{x.disabled=true;if(x.dataset.correct==='1')x.classList.add('correct')});b.classList.add(ok?'correct':'wrong');document.getElementById(`fb-${i}`).textContent=ok?'✓ إجابة صحيحة، أحسنت!':'✗ إجابة غير صحيحة. راجع ثم انتقل للسؤال التالي.';document.getElementById(`fb-${i}`).style.color=ok?'var(--green)':'var(--red)';document.getElementById('practice-score').textContent=`النتيجة الحالية: ${score} / ${practice.length}`;})}
document.getElementById('completeBtn').onclick=()=>{localStorage.setItem('hm_completed_'+lessonId,'1');document.getElementById('completionMessage').textContent='✓ تم حفظ إكمال الدرس على هذا الجهاز.';document.getElementById('completeBtn').disabled=true};
if(localStorage.getItem('hm_completed_'+lessonId)==='1'){document.getElementById('completionMessage').textContent='✓ هذا الدرس مكتمل ومحفوظ.';document.getElementById('completeBtn').disabled=true}
render();
fetch(`${base}lesson-${lessonNo}.json?v=20260815-lesson-studio-v11`,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{lesson=Object.assign({},fallback,data,{files:Object.assign({},fallback.files,data.files||{})});document.getElementById('loadNote').textContent='✓ تم تحديث بيانات الدرس من ملف المحتوى.';render()}).catch(()=>{document.getElementById('loadNote').textContent='✓ تم فتح النسخة المحلية للدرس دون انتظار تحميل خارجي.'});
if(initialSection!=='lesson'&&sections.some(s=>s[0]===initialSection)){current=initialSection;render()}
})();
</script>
