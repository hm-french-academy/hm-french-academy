<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HM Academy | Leçon</title>
<link rel="stylesheet" href="css/premium-shell.css?v=20260814-lesson">
<style>
:root{--nav:#14264a;--blue:#2563eb;--pink:#e92d83;--green:#20a45a;--line:#e1e7f0;--muted:#68758b}
.wrap{max-width:1180px;margin:auto;padding:20px 14px 55px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff;border-radius:30px;padding:28px;display:flex;justify-content:space-between;gap:20px;align-items:center;box-shadow:0 20px 50px #2563eb22}.hero h1{margin:6px 0;font-size:clamp(30px,6vw,46px)}.hero p{margin:8px 0;line-height:1.8}.hero-art{width:180px;height:125px;border-radius:24px;background:#ffffff22;display:grid;place-items:center;font-size:72px}
.journey{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:16px 0}.step{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center;font-size:12px;font-weight:900;color:#657189}.step.active{border-color:var(--pink);background:#fff2f8;color:var(--pink)}
.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0;padding:6px;background:#fff;border:1px solid var(--line);border-radius:18px}.tab{border:0;background:transparent;color:#536078;padding:11px 15px;border-radius:13px;font-weight:900;white-space:nowrap;cursor:pointer}.tab.active{background:var(--pink);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 14px 40px #14264a10}
.section-head{padding:24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.section-head h2{margin:0;color:var(--nav);font-size:28px}.section-head p{margin:7px 0 0;color:var(--muted);line-height:1.8}.section-badge{background:#fff2f8;color:var(--pink);padding:9px 12px;border-radius:13px;font-weight:900;white-space:nowrap}.content{padding:22px}
.group{margin-bottom:28px}.group:last-child{margin-bottom:0}.group-title{margin:0 0 6px;color:var(--nav);font-size:25px}.group-desc{margin:0 0 14px;color:var(--muted);line-height:1.8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.word{border:1px solid var(--line);border-radius:20px;padding:11px;text-align:center;background:#fff;box-shadow:0 7px 20px #14264a0b}.pic{height:145px;border-radius:17px;background:linear-gradient(145deg,#eef4ff,#fff2f8);display:grid;place-items:center;font-size:70px;cursor:pointer}.hint{font-size:10px;color:#7a8497;margin:6px}.fr{font-weight:900;font-size:19px;direction:ltr}.ar{color:#315aa4;font-weight:900;margin:5px}.speak{border:0;border-radius:50%;width:43px;height:43px;background:var(--pink);color:#fff;font-size:17px;cursor:pointer}.example{margin-top:10px;padding:10px;border-right:4px solid var(--pink);background:#f8faff;border-radius:11px;line-height:1.7;text-align:right}.listen,.example button,.primary{border:0;background:#edf3ff;color:#2850a3;border-radius:11px;padding:9px 12px;font-weight:900;cursor:pointer}.primary{background:var(--blue);color:#fff}.focus{border:0;background:#14264a;color:#fff;border-radius:12px;padding:10px 13px;font-weight:900;cursor:pointer}
.resource-grid,.practice{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.resource{padding:22px}.resource a{display:block;text-decoration:none;padding:16px;border:1px solid #dfe6f2;border-radius:14px;color:#315fc8;font-weight:900;background:#f8faff}.resource p,.rule p{color:var(--muted);line-height:1.9}.rule{background:linear-gradient(145deg,#fbf8ff,#f4f7ff);border:1px solid var(--line);border-radius:20px;padding:20px;line-height:2}.rule .fr-example{display:block;direction:ltr;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;font-weight:900;color:var(--nav)}
.exercise{border:1px solid var(--line);border-radius:20px;padding:18px}.option{display:block;width:100%;padding:11px;margin:7px 0;border:1px solid #d8deea;border-radius:12px;background:#fff;text-align:right;font-weight:800;cursor:pointer}.option.selected{border:2px solid var(--blue);background:#edf3ff}.option.correct{border-color:var(--green);background:#effaf3}.feedback{font-weight:900;min-height:20px}.check{border:0;border-radius:11px;padding:10px 14px;background:var(--pink);color:#fff;font-weight:900;cursor:pointer}.check:disabled{opacity:.6;cursor:default}
.complete{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:14px}.complete button{border:0;border-radius:13px;padding:12px 16px;background:var(--pink);color:#fff;font-weight:900;cursor:pointer}.complete button:disabled{background:var(--green);cursor:default}.message{color:var(--muted);font-weight:800}.back{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.back a{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-decoration:none;color:#315fc8;font-weight:900}.focus-mode .hm-header,.focus-mode .back,.focus-mode .journey,.focus-mode .tabs{display:none}.focus-mode .wrap{max-width:900px;padding-top:20px}.focus-mode .hero{border-radius:20px}
@media(max-width:800px){.journey{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.hero{display:block;padding:20px}.hero-art{width:100%;height:100px;margin-top:15px}.journey{grid-template-columns:repeat(2,1fr)}.grid,.resource-grid,.practice{grid-template-columns:1fr}.section-head{display:block}.section-badge{display:inline-block;margin-top:10px}.complete{display:block}.complete button{width:100%;margin-top:10px}}
</style>
</head>
<body>
<header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="index.html">الرئيسية</a><a href="dashboard.html">الطالب</a><a href="course.html">المناهج الدراسية</a><a href="levels.html">مستويات اللغة</a><a href="library.html">المكتبة</a><a href="settings.html">الإعدادات</a></nav><div class="hm-tools"><select class="hm-lang" data-lang-select><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select><a class="hm-student" href="student-profile.html">👨‍🎓</a></div></header>
<main class="wrap">
<section class="hero"><div><span id="unit" style="font-weight:900;opacity:.9"></span><h1 id="title">Leçon</h1><p id="subtitle"></p></div><div class="hero-art" id="art">🏫</div></section>
<section class="journey" id="journey"></section>
<nav class="tabs" aria-label="Lesson sections"><button class="tab active" data-view="lesson">📘 الدرس</button><button class="tab" data-view="vocab">📚 Vocabulaire</button><button class="tab" data-view="pronunciation">🎧 Prononciation</button><button class="tab" data-view="grammar">📖 Grammaire</button><button class="tab" data-view="practice">✍️ Pratique</button><button class="tab" data-view="games">🎮 Jeux</button><button class="tab" data-view="assessment">📝 Évaluation</button><button class="tab" data-view="files">📚 الملفات</button></nav>
<section id="viewer" class="panel"></section>
<section class="complete"><div><strong>🏁 إكمال الدرس</strong><div id="completionMessage" class="message">رحلتك محفوظة تلقائيًا أثناء التعلم.</div></div><button id="completeBtn" type="button">تم الانتهاء من الدرس</button></section>
<div class="back"><a href="grade-8.html">← العودة إلى الصف</a><a href="course.html">📚 المناهج الدراسية</a><a href="dashboard.html">📈 لوحة الطالب</a></div>
</main><footer class="hm-footer"><div class="hm-footer-brand"><strong>HM Academy</strong><span>French Language Education</span><small>Fondateur : Hatem ElMorsi · © 2026</small></div></footer>
<script src="scripts/i18n.js?v=20260814-lesson"></script><script src="scripts/brand.js?v=20260814-lesson"></script><script src="scripts/learning-progress.js?v=20260814-lesson"></script><script src="scripts/lesson-complete.js?v=20260814-lesson"></script>
<script>
const id=new URLSearchParams(location.search).get('id')||'grade8-u1-l1';
const requested=new URLSearchParams(location.search).get('section')||'lesson';
let registry=null,lesson=null,detail=null,practiceState={};
const lang=()=>window.HMLanguage?.get?.()||'ar';
function esc(s){return String(s??'').replace(/[&<>\\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[c]))}
function speak(t){if(!t||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.86;speechSynthesis.speak(u)}
function find(){for(const u of registry?.includedUnits||[])for(const l of u.lessons||[])if(l.id===id)return {...l,unitTitleAr:u.titleAr,unitTitleFr:u.titleFr};return null}
function mark(view){try{HMProgress.setSection(view)}catch(e){}}
function header(icon,title,desc,badge='Premium'){return `<div class="section-head"><div><h2>${icon} ${title}</h2><p>${desc}</p></div><span class="section-badge">${badge}</span></div>`}
function wordFields(x){return {w:Array.isArray(x)?x[0]:(x.fr||x.word||x.term||''),ar:Array.isArray(x)?x[1]:(x.ar||x.translation||''),im:Array.isArray(x)?x[2]:(x.image||x.icon||'🖼️'),ex:Array.isArray(x)?x[3]:(x.example||'')}}
function vocab(){const data=lesson?.vocabulary||[];if(!data.length)return header('📚','Vocabulaire','استكشف كلمات هذا الدرس واستمع إلى نطقها.','المفردات')+`<div class="resource"><p>ستظهر مفردات الدرس هنا عند توفر محتوى الدرس.</p></div>`;const groups=lesson.vocabularyGroups||[];const blocks=groups.length?groups.map(g=>{const items=data.filter(x=>x.category===g.id);return items.length?`<section class="group"><h3 class="group-title">${esc(g.title)}</h3><p class="group-desc">${esc(g.description||'')}</p><div class="grid">${items.map(card).join('')}</div></section>`:''}).join(''): `<div class="grid">${data.map(card).join('')}</div>`;return header('📚','Vocabulaire • المفردات','تعلّم الكلمة، معناها، ثم استمع إلى المثال واستخدمه.','المفردات')+`<div class="content">${blocks}</div>`}
function card(x){const {w,ar,im,ex}=wordFields(x);return `<article class="word"><div class="pic" onclick='speak(${JSON.stringify(w)})' aria-label="استمع إلى الكلمة">${esc(im)}</div><div class="hint">اضغط على الصورة لسماع الكلمة</div><div class="fr">${esc(w)}</div><div class="ar">${esc(ar)}</div><button class="speak" onclick='speak(${JSON.stringify(w)})'>🔊</button>${ex?`<div class="example"><b dir="ltr">${esc(ex)}</b><br><button onclick='speak(${JSON.stringify(ex)})'>🔊 استمع إلى المثال</button></div>`:''}</article>`}
function pronunciation(){const data=lesson?.vocabulary||[];const words=data.map(wordFields).map(x=>x.w).filter(Boolean).join('. ');const examples=data.map(wordFields).map(x=>x.ex).filter(Boolean).join('. ');return header('🎧','Prononciation • النطق','استمع إلى مفردات الدرس وأمثلتها، ثم كررها بصوتك.','نطق')+`<div class="content"><div class="rule"><h3>🎙️ جلسة نطق مركزة</h3><p>ابدأ بالكلمات، ثم انتقل إلى الأمثلة.</p><button class="primary" onclick='speak(${JSON.stringify(words)})'>▶ تشغيل المفردات</button><button class="listen" style="margin-right:8px" onclick='speak(${JSON.stringify(examples)})'>▶ تشغيل الأمثلة</button></div></div>`}
function grammar(){const g=lesson?.grammar||{};const examples=(g.examples||[]).map(e=>e.fr||e).filter(Boolean);return header('📖','Grammaire • القواعد','فهم القاعدة من خلال أمثلة فرنسية واضحة ثم تطبيقها.','قواعد')+`<div class="content"><div class="rule"><h3>${esc(g.title||'Grammaire')}</h3><p dir="ltr" style="text-align:left;font-weight:800">${esc(g.explanation||'')}</p>${examples.map(e=>`<span class="fr-example">${esc(e)} <button class="listen" onclick='speak(${JSON.stringify(e)})'>🔊</button></span>`).join('')}</div></div>`}
function practice(){const qs=lesson?.practice||[];practiceState={};if(!qs.length)return header('✍️','Pratique • التدريب','تدرّب على ما تعلمته في هذا الدرس.','تدريب')+`<div class="resource"><p>التدريبات ستظهر هنا عند توفرها.</p></div>`;return header('✍️','Pratique • التدريب','اختر إجابتك ثم اضغط «تحقق». لن تظهر الإجابة قبل المحاولة.','تدريب')+`<div class="content"><div class="practice">${qs.map((q,i)=>`<article class="exercise"><h3>${i+1}. ${esc(q.question)}</h3>${(q.options||[]).map((o,j)=>`<button class="option" data-pq="${i}" data-oi="${j}">${esc(o)}</button>`).join('')}<button class="check" data-check="${i}">تحقق</button><div class="feedback" id="pf${i}"></div></article>`).join('')}</div></div>`}
function games(){const url=lesson?.games||lesson?.files?.games;return header('🎮','Jeux • الألعاب التعليمية','تحديات مرتبطة بمفردات ومهارات الدرس.','ألعاب')+`<div class="content"><div class="rule"><h3>🏆 تحدي الدرس</h3><p>استمتع بالتدريب ثم عد إلى رحلة الدرس لمتابعة تقدمك.</p>${url?`<a class="primary" target="_blank" rel="noopener" href="${esc(url)}">فتح اللعبة ↗</a>`:`<button class="primary" onclick="open('practice')">ابدأ التدريب</button>`}</div></div>`}
function assessment(){const url=lesson?.assessment||lesson?.quiz||lesson?.files?.assessment||lesson?.files?.quiz;return header('📝','Évaluation • التقييم','اختبر إتقانك بعد إنهاء المفردات والقواعد والتدريب.','تقييم')+`<div class="content"><div class="rule"><h3>🎯 اختبار الإتقان</h3><p>اختر التقييم عندما تكون مستعدًا.</p>${url?`<a class="primary" target="_blank" rel="noopener" href="${esc(url)}">فتح التقييم ↗</a>`:`<button class="primary" onclick="open('practice')">مراجعة التدريب</button>`}</div></div>`}
function filesView(){const f=lesson?.files||{};const items=[['interactive','📘','الدرس التفاعلي',lesson.sourceInteractive||lesson.interactive||f.interactive],['reference','📄','المرجع التعليمي',lesson.reference||f.reference],['assessment','📝','التقييم الرسمي',lesson.assessment||f.assessment],['quiz','🎯','الاختبار الإلكتروني',lesson.quiz||f.quiz],['games','🎮','الألعاب التعليمية',lesson.games||f.games]].filter(x=>x[3]);return header('📚','ملفات الدرس','موارد الدرس المتاحة للطالب في مكان واحد.','الملفات')+`<div class="resource"><div class="resource-grid">${items.map((x,i)=>`<a class="${i===0?'primary':''}" target="_blank" rel="noopener" href="${esc(x[3])}">${x[1]} ${esc(x[2])} ↗</a>`).join('')}</div></div>`}
function lessonView(){return header('🚀','ضربة البداية • استكشاف الدرس','ابدأ بجولة قصيرة في موضوع الدرس، ثم انتقل إلى المفردات والنطق والقواعد والتدريب.','بداية')+`<div class="content"><div class="rule"><h3>✨ هدف اليوم</h3><p>اكتشف كلمات المدرسة، تعرّف إلى استخدامها في جمل بسيطة، وتدرّب على التعبير عن وجود الأشياء أو عدم وجودها.</p><button class="primary" onclick="open('vocab')">ابدأ الاستكشاف →</button><button class="focus" style="margin-right:8px" onclick="document.body.classList.toggle('focus-mode')">🎯 وضع التركيز</button></div><div class="rule" style="margin-top:14px"><h3>🧭 رحلتك في الدرس</h3><p>مفردات → نطق → قواعد → تدريب → تقييم</p></div></div>`}
function open(view){if(!lesson)return;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));mark(view);if(view==='vocab')viewer.innerHTML=vocab();else if(view==='pronunciation')viewer.innerHTML=pronunciation();else if(view==='grammar')viewer.innerHTML=grammar();else if(view==='practice')viewer.innerHTML=practice();else if(view==='games')viewer.innerHTML=games();else if(view==='assessment')viewer.innerHTML=assessment();else if(view==='files')viewer.innerHTML=filesView();else viewer.innerHTML=lessonView();}
function journey(active){const steps=[['lesson','📘','البداية'],['vocab','📚','المفردات'],['pronunciation','🎧','النطق'],['grammar','📖','القواعد'],['practice','✍️','التدريب'],['assessment','📝','التقييم']];journeyEl.innerHTML=steps.map(s=>`<div class="step ${s[0]===active?'active':''}">${s[1]}<br>${s[2]}</div>`).join('')}
const journeyEl=document.getElementById('journey');
function render(){const base=find();if(!base){title.textContent='الدرس غير موجود';subtitle.textContent='';viewer.innerHTML='<div class="resource"><h2>محتوى الدرس</h2><p>لا يمكن عرض هذا الدرس الآن.</p></div>';return}lesson={...base,...(detail||{})};lesson.files={...(base.files||{}),...(detail?.files||{})};const ar=lang()==='ar';unit.textContent=ar?(lesson.unitTitleAr||lesson.titleAr||base.unitTitleAr):(lesson.unitTitleFr||lesson.titleFr||base.unitTitleFr);title.textContent=ar?(lesson.titleAr||lesson.titleFr):(lesson.titleFr||lesson.titleAr);subtitle.textContent=ar?'الصف الثاني الإعدادي · الترم الأول':'2e année du collège · 1er semestre';art.textContent=id.includes('u2-')?'🏠':id.includes('u3-')?'✈️':'🏫';const p=HMProgress.get();const done=p.completedLessons.includes(id);completeBtn.disabled=done;completeBtn.textContent=done?'✅ تم إكمال الدرس':'تم الانتهاء من الدرس';completionMessage.textContent=done?'تم حفظ إكمال الدرس والتقدم على هذا الجهاز.':'رحلتك محفوظة تلقائيًا أثناء التعلم.';HMProgress.startLesson(id);journey(['lesson','vocab','pronunciation','grammar','practice','games','assessment','files'].includes(requested)?requested:'lesson');open(['lesson','vocab','pronunciation','grammar','practice','games','assessment','files'].includes(requested)?requested:'lesson')}
async function load(){try{const r=await fetch('data/lessons/grade-8/lesson-registry.json?v=20260814-lesson',{cache:'no-store'});registry=await r.json();const m=id.match(/^grade8-u(\d+)-l(\d+)$/);if(m){const path=`data/lessons/grade-8/unit-${m[1]}/lesson-${m[2]}.json`;try{const d=await fetch(path+'?v=20260814-lesson',{cache:'no-store'});if(d.ok)detail=await d.json()}catch(e){}}render()}catch(e){viewer.innerHTML='<div class="resource"><h2>تعذر فتح الدرس</h2><p>حاول تحديث الصفحة مرة أخرى.</p></div>'}}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>open(b.dataset.view)));
viewer.addEventListener('click',e=>{const opt=e.target.closest('.option');if(opt){const i=Number(opt.dataset.pq);practiceState[i]=Number(opt.dataset.oi);document.querySelectorAll(`.option[data-pq="${i}"]`).forEach(b=>b.classList.remove('selected'));opt.classList.add('selected');return}const check=e.target.closest('[data-check]');if(check){const i=Number(check.dataset.check),q=lesson?.practice?.[i],fb=document.getElementById('pf'+i);if(!q)return;if(practiceState[i]===undefined){fb.textContent='اختر إجابتك أولًا.';return}if(practiceState[i]===Number(q.answer)){fb.textContent='✓ إجابة صحيحة، أحسنت!';check.disabled=true;document.querySelectorAll(`.option[data-pq="${i}"]`).forEach(b=>{b.disabled=true;if(Number(b.dataset.oi)===Number(q.answer))b.classList.add('correct')})}else fb.textContent='✗ ليست الإجابة الصحيحة. حاول مرة أخرى.'}});
completeBtn.addEventListener('click',()=>{if(window.markLessonComplete)window.markLessonComplete(id,'lesson-finish','premium-sections');render()});window.addEventListener('hm:languagechange',render);window.addEventListener('hm:progress-updated',()=>{if(lesson){const p=HMProgress.get();const done=p.completedLessons.includes(id);completeBtn.disabled=done;completeBtn.textContent=done?'✅ تم إكمال الدرس':'تم الانتهاء من الدرس'}});load();
</script></body></html>
