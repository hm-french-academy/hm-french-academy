<script>
(function(){'use strict';
const p=new URLSearchParams(location.search),id=p.get('id')||'grade8-u1-l1',m=id.match(/^grade8-u(\d+)-l(\d+)$/),u=m?m[1]:'1',l=m?m[2]:'1',base='data/lessons/grade-8/unit-'+u+'/',requestedSection=p.get('section');
let data=null,active=requestedSection||'overview',pronunciationNotes={};
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sections=[['vocabulary','📚','المفردات'],['pronunciation','🎧','النطق'],['grammar','📖','القواعد'],['conversation','💬','المحادثة'],['practice','✍️','التدريب'],['files','📁','ملفات الدرس'],['games','🎮','الألعاب'],['assessment','📝','التقييم']];
const journey=[['overview','🚀','البداية'],['vocabulary','📚','المفردات'],['pronunciation','🎧','النطق'],['grammar','📖','القواعد'],['conversation','💬','المحادثة'],['practice','✍️','التدريب'],['games','🎮','الألعاب']];
const validSections=new Set(sections.map(x=>x[0]));if(!validSections.has(active))active='overview';
function audio(text,b){if(!text)return Promise.resolve(false);const fn=window.HMSpeech?.speak;if(fn)return fn(text,{button:b,lang:'fr-FR',rate:.84});if(window.speechSynthesis&&window.SpeechSynthesisUtterance){speechSynthesis.cancel();const x=new SpeechSynthesisUtterance(text);x.lang='fr-FR';x.rate=.84;speechSynthesis.resume();speechSynthesis.speak(x);return Promise.resolve(true)}return Promise.resolve(false)}
function A(text,title,extra){const b=document.createElement('button');b.type='button';b.className='audio'+(extra?' '+extra:'');b.textContent='🔊';b.title=title;b.setAttribute('aria-label',title);b.dataset.s=text;b.onclick=()=>audio(text,b);return b}
function resolveFile(path){if(!path)return'#';if(/^(https?:\/\/|\/|data\/|lesson\.html)/i.test(path))return path;return base+path}
function renderJourney(){$('journey').innerHTML=journey.map(x=>'<button class="step '+(active===x[0]?'active':'')+'" data-j="'+x[0]+'">'+x[1]+' '+x[2]+'</button>').join('');$('journey').querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{active=b.dataset.j;render()})}

function overview(){const scope=data.contentScope||{};const key='lesson'+l;const list=Array.isArray(scope[key])?scope[key]:(Object.values(scope).find(v=>Array.isArray(v))||[]);return '<div class="head"><div><h2>🚀 ضربة البداية</h2><p>ابدأ الدرس مباشرة ثم انتقل بين أقسامه. لا يوجد أكثر من قسم نشط في الوقت نفسه.</p></div></div><div class="content"><div class="note"><b>🎯 هدف الدرس</b><br>'+esc(data.objectiveAr||data.objective||'')+'</div><div class="note"><b>🧭 مسار التعلم</b><br>مفردات → نطق → قواعد → محادثة → تدريب → ملفات → ألعاب → تقييم</div><div class="note"><b>📌 محتوى الدرس</b><br>'+esc(list.join(' · '))+'</div></div>'}
function vocabCards(){const a=data.vocabulary||[];const box=document.createElement('div');box.innerHTML='<div class="head"><div><h2>📚 مفردات الدرس</h2><p>المفردات المعتمدة من ملف الدرس: <b>'+a.length+' كلمة/مدخل</b>.</p></div></div><div class="content"><div class="grid" id="vgrid"></div></div>';const g=box.querySelector('#vgrid');a.forEach(v=>{const c=document.createElement('article');c.className='card';c.innerHTML='<div class="pic">'+esc(v.image||'📘')+'</div><div class="fr">'+esc(v.word)+'</div><div class="ar">'+esc(v.translation||'')+'</div>'+(v.example?'<div class="example">'+esc(v.example)+'</div>':'');const pair=document.createElement('div');pair.className='audio-pair';pair.appendChild(A(v.word,'استمع إلى نطق الكلمة'));if(v.example)pair.appendChild(A(v.example,'استمع إلى نطق المثال','example-audio'));c.appendChild(pair);g.appendChild(c)});return box}
function vocab(){return vocabCards().innerHTML}
function pronunciation(){const notes=pronunciationNotes[id]||{},a=data.vocabulary||[];const rows=a.map((v,i)=>{const note=notes[v.word]||'استمع إلى النطق الفرنسي ثم كرر الكلمة ببطء مع التركيز على المقطع المميز.';return '<article class="pron-row"><div class="pron-num">'+(i+1)+'</div><div><div class="pron-word">'+esc(v.word)+'</div><div class="pron-example">'+esc(v.example||'')+'</div></div><button class="audio pron-audio" data-s="'+esc(v.word)+'" data-pron-word="1" title="استمع إلى نطق الكلمة" aria-label="استمع إلى نطق '+esc(v.word)+'">🔊</button><div><div class="pron-meaning">'+esc(v.translation||'')+'</div><div class="pron-note"><b>💡 ملاحظة النطق:</b> '+esc(note)+'</div></div></article>'}).join('');return '<div class="head"><div><h2>🎧 مختبر النطق</h2><p>صفحة النطق مخصصة لتدريب الأذن واللسان: كل كلمة في سطر مستقل، مع زر نطق وملاحظة خاصة بمفردات هذا الدرس.</p></div></div><div class="content"><div class="pron-wrap"><div class="pron-intro">🎯 <b>طريقة التدريب:</b> اسمع الكلمة، لاحظ المقطع أو الحرف المميز في الملاحظة، ثم كررها بصوتك. لا نعرض الصور هنا حتى تظل الصفحة مركزة على <b>الصوت والنطق</b>.</div><div class="pron-toolbar"><div><strong>🔊 '+a.length+' كلمة</strong><div class="small">يمكنك الاستماع لكل كلمة منفردة أو تشغيل قائمة النطق كاملة بالترتيب.</div></div><button class="pron-sequence" id="allPronunciation">🔊 استمع إلى الكلمات بالترتيب</button></div><div class="pron-list">'+rows+'</div><div class="pron-foot">💡 <b>نصيحة:</b> بعد الاستماع، حاول تقليد الإيقاع الفرنسي وليس الحروف فقط. كرر الكلمة مرتين ثم انتقل إلى التالية.</div></div></div>'}
function grammar(){const g=data.grammar||{},combined=[g.title,g.explanation,g.explanationAr,g.explanationFr,(g.steps||[]).join(' '),(g.examples||[]).map(e=>e.fr).join(' ')].filter(Boolean).join(' '),hasIlya=/\bIl\s+y\s+a\b|Il\s+n['’]y\s+a\s+pas/i.test(combined),title=g.title||'القواعد',exAr=g.explanationAr||g.explanation||'';return '<div class="head"><div><h2>📖 '+esc(title)+'</h2><p>'+esc(exAr)+'</p></div></div><div class="content"><div class="rule">'+(g.explanationFr?'<p dir="ltr">'+esc(g.explanationFr)+'</p>':'')+(hasIlya?'<div class="formula">Il y a + nom<br>Il n’y a pas de + nom</div>':'')+((g.steps||[]).map(s=>'<p>• '+esc(s)+'</p>').join(''))+'</div><div class="grid">'+((g.examples||[]).map(e=>'<article class="card"><div class="fr">'+esc(e.fr)+'</div><div class="ar">'+esc(e.ar)+'</div><div class="actions"><button class="audio" data-s="'+esc(e.fr)+'">🔊</button></div></article>').join(''))+'</div></div>'}
function conversation(){const lines=data.conversation?.lines||[];return '<div class="head"><div><h2>💬 المحادثة</h2><p>استمع إلى كل جملة منفردة أو إلى المحادثة كاملة.</p></div></div><div class="content"><div class="actions"><button class="btn primary" id="allDialogue">🔊 استمع للمحادثة كاملة</button></div><div class="dialogue">'+lines.map(x=>'<article class="dialog-line"><div class="speaker">'+esc(x.speaker)+'</div><div class="fr-line">'+esc(x.fr)+'</div><div class="ar-line">'+esc(x.ar)+'</div><div class="actions"><button class="audio" data-s="'+esc(x.fr)+'">🔊</button></div></article>').join('')+'</div></div>'}
function practice(){const q=data.practice||[];return '<div class="head"><div><h2>✍️ التدريب</h2><p>تدريب قصير مرتبط مباشرة بمحتوى الدرس.</p></div></div><div class="content">'+q.map((x,i)=>'<article class="exercise"><b>'+esc(x.question)+'</b><div class="options">'+(x.options||[]).map((o,j)=>'<button class="option" data-q="'+i+'" data-a="'+j+'">'+esc(o)+'</button>').join('')+'</div><div class="feedback" id="f'+i+'"></div></article>').join('')+'</div>'}
function files(){const f=data.files||{};const items=[['📘','الدرس التفاعلي',f.interactive],['📄','المرجع التعليمي',f.reference],['📝','التقييم الرسمي',f.assessment],['🎯','التقييم التفاعلي',f.quiz||f.interactiveAssessment],['🎮','الألعاب التعليمية',f.games]];return '<div class="head"><div><h2>📁 ملفات الدرس</h2><p>كل ملف يفتح من المسار الفعلي الموجود في المستودع.</p></div></div><div class="content"><div class="file-grid">'+items.filter(x=>x[2]).map(x=>'<article class="file-card"><h3>'+x[0]+' '+esc(x[1])+'</h3><p>ملف مستقل للدرس.</p><a class="btn primary" target="_blank" rel="noopener" href="'+esc(resolveFile(x[2]))+'">فتح الملف ↗</a></article>').join('')+'</div></div>'}
function games(){const acts=data.activities||[],hub=data.activityHub?.file||data.files?.games;return '<div class="head"><div><h2>🎮 الألعاب والتحديات</h2><p>أنشطة التدريب منفصلة عن التقييم الرسمي.</p></div></div><div class="content"><div class="file-grid">'+(hub?'<article class="file-card"><h3>🎮 مركز الألعاب</h3><p>مركز مستقل لألعاب الدرس وأنشطة التدريب.</p><a class="btn primary" target="_blank" rel="noopener" href="'+esc(resolveFile(hub))+'">فتح مركز الألعاب ↗</a></article>':'')+acts.filter(a=>a.file).map(a=>'<article class="file-card"><h3>🎯 '+esc(a.id||a.type)+'</h3><p>⭐ '+esc(a.xp||0)+' XP</p><a class="btn" target="_blank" rel="noopener" href="'+esc(resolveFile(a.file))+'">فتح النشاط ↗</a></article>').join('')+'</div></div>'}
function assessment(){const q=data.assessment?.questions||[];return '<div class="head"><div><h2>📝 التقييم</h2><p>تقييم منفصل عن ألعاب التدريب.</p></div></div><div class="content">'+q.map((x,i)=>'<article class="exercise"><b>'+esc(x.question)+'</b><div class="options">'+(x.options||[]).map((o,j)=>'<button class="option" data-aq="'+i+'" data-ans="'+j+'">'+esc(o)+'</button>').join('')+'</div><div class="feedback" id="af'+i+'"></div></article>').join('')+'</div>'}
function render(){renderJourney();renderTabs();let html=active==='overview'?overview():active==='vocabulary'?vocab():active==='pronunciation'?pronunciation():active==='grammar'?grammar():active==='conversation'?conversation():active==='practice'?practice():active==='files'?files():active==='games'?games():assessment();$('viewer').innerHTML=html;bind()}
function bind(){document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>audio(b.dataset.s,b));const all=$('allDialogue');if(all)all.onclick=()=>audio((data.conversation?.lines||[]).map(x=>x.fr).join('. '),all);const allPron=$('allPronunciation');if(allPron)allPron.onclick=async()=>{allPron.disabled=true;allPron.textContent='⏸️ جاري نطق الكلمات…';let ok=true;for(const row of document.querySelectorAll('[data-pron-word="1"]')){const text=row.dataset.s;if(!text)continue;const heard=await audio(text,row);if(!heard){ok=false;break}await new Promise(r=>setTimeout(r,140));}allPron.disabled=false;allPron.textContent=ok?'🔊 استمع إلى الكلمات بالترتيب':'⚠️ تعذر تشغيل النطق'};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const i=+b.dataset.q,j=+b.dataset.a,ok=(data.practice[i]?.answer===j);document.querySelectorAll('[data-q="'+i+'"]').forEach(x=>x.classList.remove('correct','wrong'));b.classList.add(ok?'correct':'wrong');$('f'+i).textContent=ok?'✓ إجابة صحيحة':'✗ حاول مرة أخرى'});document.querySelectorAll('[data-aq]').forEach(b=>b.onclick=()=>{const i=+b.dataset.aq,j=+b.dataset.ans,ok=(data.assessment?.questions?.[i]?.answer===j);document.querySelectorAll('[data-aq="'+i+'"]').forEach(x=>x.classList.remove('correct','wrong'));b.classList.add(ok?'correct':'wrong');$('af'+i).textContent=ok?'✓ إجابة صحيحة':'✗ راجع الإجابة'})}
function done(){localStorage.setItem('hm.lesson.'+id+'.complete','1');$('completeBtn').disabled=true;$('completionMessage').textContent='تم حفظ إكمال الدرس بنجاح.'}
function start(){const saved=localStorage.getItem('hm.lesson.'+id+'.complete');if(saved){$('completeBtn').disabled=true;$('completionMessage').textContent='هذا الدرس مكتمل ومحفوظ.'}$('completeBtn').onclick=done}
async function load(){try{$('loadNote').textContent='جاري فتح بيانات الدرس…';const [r,nr]=await Promise.all([fetch(base+'lesson-'+l+'.json?v=20260815-lesson-data-5',{cache:'no-store'}),fetch('data/lessons/grade-8/pronunciation-notes.json?v=20260815-pronunciation-2',{cache:'no-store'})]);if(!r.ok)throw new Error('HTTP '+r.status+' في ملف الدرس');if(!nr.ok)throw new Error('تعذر تحميل ملاحظات النطق');data=await r.json();pronunciationNotes=await nr.json();if(!data.vocabulary?.length)throw new Error('ملف الدرس لا يحتوي على مفردات');const lessonNotes=pronunciationNotes[id]||{};const missing=(data.vocabulary||[]).filter(v=>!lessonNotes[v.word]);if(missing.length)throw new Error('ملاحظات نطق ناقصة: '+missing.map(v=>v.word).join('، '));$('unit').textContent=data.unit||('الوحدة '+u);$('title').textContent=data.title||('Leçon '+l);$('subtitle').textContent=data.titleAr||data.objectiveAr||'';$('loadNote').textContent='✓ تم تحميل محتوى الدرس بالكامل · '+data.vocabulary.length+' كلمة/مدخل';render();start()}catch(e){$('subtitle').textContent='تعذر تحميل محتوى الدرس';$('loadNote').textContent='';$('viewer').innerHTML='<div class="error">حدث خطأ في تحميل بيانات الدرس. '+esc(e.message)+'<br>أعد تحميل الصفحة مرة واحدة.</div>';start()}}
load();
})();
</script>
</body>
