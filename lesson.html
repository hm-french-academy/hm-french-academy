<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HM Academy | الدرس</title><link rel="stylesheet" href="css/premium-shell.css?v=20260831-lesson-entry"><script>(function(){
const p=new URLSearchParams(location.search),id=p.get('id')||'',section=p.get('section')||'',student=p.get('student')==='1';
const q=new URLSearchParams({id:id,v:'20260831-content-polish'});if(section)q.set('section',section);if(student)q.set('student','1');
let target='';
if(/^g3-l\\d+$/.test(id))target='grade-3-lesson-journey.html';
else if(id==='g4-l01')target='grade-4-l01-learning-studio.html';
else if(id==='g4-l02')target='grade-4-l02-learning-studio.html';
else if(id==='g4-l03')target='grade-4-lesson-studio-v2.html';
else if(/^g4-l0[4-7]$/.test(id))target='grade-4-lessons-03-07-live.html';
else if(/^grade8-u[1-3]-l[1-4]$/.test(id))target='lesson-studio-standard.html';
else if(/^grade7-u[1-3]-l[1-6]$/.test(id)||/^grade7-u2-l[12]$/.test(id)||/^grade7-u3-l[1-3]$/.test(id))target='grade7-lesson-studio-live-v2.html';
else if(/^g6-l0[1-8]$/.test(id))target='grade6-lesson-v2.html';
else if(/^g9-u[1-3]-l[1-4]$/.test(id))target='grade-9-lesson-studio.html';

function goLogin(){location.replace('student-link.html?lesson='+encodeURIComponent(id));}
function goTarget(){if(!target)return false;location.replace(target+'?'+q.toString());return true;}

if(student){
  const code=localStorage.getItem('hm_student_code')||'';
  let device=localStorage.getItem('hm_student_browser_id');
  if(!device){device=(crypto.randomUUID?crypto.randomUUID():('web-'+Date.now()+'-'+Math.random().toString(36).slice(2)));localStorage.setItem('hm_student_browser_id',device);}
  if(!code||!id){goLogin();return;}
  const verifiedLesson=localStorage.getItem('hm_student_verified_lesson')||'';
  const verifiedAt=Number(localStorage.getItem('hm_student_verified_at')||0);
  if(verifiedLesson===id && Date.now()-verifiedAt < 30*60*1000){goTarget();return;}
  fetch('https://yvoprtjyxmurvcsaqsny.supabase.co/functions/v1/student-code-login',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({code,device_id:device,lesson_id:id}),cache:'no-store'
  }).then(r=>r.json().then(data=>({ok:r.ok,data}))).then(({ok,data})=>{
    if(!ok||!data.ok){localStorage.removeItem('hm_student_code');localStorage.removeItem('hm_student_verified_lesson');localStorage.removeItem('hm_student_verified_at');goLogin();return;}
    localStorage.setItem('hm_student_verified_lesson',id);
    localStorage.setItem('hm_student_verified_at',String(Date.now()));
    if(!goTarget()){document.addEventListener('DOMContentLoaded',()=>{document.body.innerHTML='<header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy</span></a></header><main class="hm-main" style="max-width:760px;margin:40px auto;padding:20px"><section class="hm-hero" style="text-align:center"><h1>الدرس غير متاح</h1><p>هذا الدرس غير مسجل في مسار المنصة الحالي.</p></section></main>';});}
  }).catch(()=>goLogin());
  return;
}
if(goTarget())return;
document.addEventListener('DOMContentLoaded',()=>{document.body.innerHTML='<header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="index.html">الرئيسية</a><a href="course.html">المناهج</a><a href="annual-revision.html">المراجعة السنوية</a><a href="dashboard.html">لوحة الطالب</a></nav></header><main class="hm-main" style="max-width:760px;margin:40px auto;padding:20px"><section class="hm-hero" style="text-align:center"><div style="font-size:52px;margin-bottom:10px">📚</div><h1>لم نتمكن من فتح هذا الدرس</h1><p>قد يكون الدرس غير متاح حاليًا أو أن الرابط يحتاج إلى تحديث.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px"><a class="hm-btn" href="course.html">استكشف المناهج</a><a class="hm-btn" href="dashboard.html">العودة إلى لوحة الطالب</a></div></section></main>'});
})();</script></head><body></body></html>
