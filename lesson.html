<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HM Academy | الدرس</title>
<style>
:root{--nav:#14264a;--blue:#2563eb;--pink:#e92d83;--green:#20a45a;--line:#e1e7f0;--muted:#68758b;--soft:#f7f9fd}
*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:var(--nav);font-family:Arial,Cairo,sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px 14px 55px}.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:5}.brand{font-weight:900;color:var(--nav);text-decoration:none}.brand span{display:inline-grid;place-items:center;background:linear-gradient(135deg,var(--pink),#713bd1);color:#fff;border-radius:12px;width:40px;height:40px;margin-left:8px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{color:#315aa4;text-decoration:none;font-weight:900;font-size:13px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff;border-radius:30px;padding:26px;display:flex;justify-content:space-between;gap:20px;align-items:center;box-shadow:0 20px 50px #2563eb22}.hero h1{margin:6px 0;font-size:clamp(30px,6vw,46px)}.hero p{margin:7px 0;line-height:1.8}.hero-art{width:170px;height:115px;border-radius:24px;background:#ffffff22;display:grid;place-items:center;font-size:68px}.journey{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:14px 0}.step{background:#fff;border:1px solid var(--line);border-radius:15px;padding:9px;text-align:center;font-size:12px;font-weight:900;color:#657189;cursor:pointer}.step.active{border-color:var(--pink);background:#fff2f8;color:var(--pink)}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0;padding:6px;background:#fff;border:1px solid var(--line);border-radius:18px}.tab{border:0;background:transparent;color:#536078;padding:11px 14px;border-radius:13px;font-weight:900;white-space:nowrap;cursor:pointer}.tab.active{background:var(--pink);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 14px 40px #14264a10;min-height:220px}.head{padding:22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.head h2{margin:0;color:var(--nav);font-size:28px}.head p{margin:7px 0 0;color:var(--muted);line-height:1.8}.content{padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card,.exercise,.file-card{border:1px solid var(--line);border-radius:19px;padding:14px;background:#fff;box-shadow:0 7px 20px #14264a0b}.pic{height:135px;border-radius:16px;background:linear-gradient(145deg,#eef4ff,#fff2f8);display:grid;place-items:center;font-size:64px;cursor:pointer}.fr{font-weight:900;font-size:19px;direction:ltr;margin-top:8px}.ar{color:#315aa4;font-weight:900;margin:4px 0}.example{padding:10px;background:var(--soft);border-right:4px solid var(--pink);border-radius:10px;line-height:1.7;margin-top:8px;direction:ltr;text-align:left}.example-ar{direction:rtl;text-align:right;color:var(--muted)}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.btn{border:0;border-radius:11px;padding:10px 12px;background:#edf3ff;color:#2850a3;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.btn.primary{background:var(--blue);color:#fff}.btn.pink{background:var(--pink);color:#fff}.btn.green{background:#eaf8f0;color:#197441}.rule{border:1px solid var(--line);border-radius:19px;padding:19px;background:linear-gradient(145deg,#fbf8ff,#f4f7ff);line-height:1.9}.formula{direction:ltr;text-align:center;font-weight:900;font-size:22px;background:#fff;border-radius:15px;padding:15px;margin:12px 0}.dialogue{display:grid;gap:10px}.dialog-line{padding:14px;border:1px solid var(--line);border-radius:15px;background:#f8faff}.speaker{font-weight:900;color:var(--pink)}.fr-line{direction:ltr;text-align:left;font-weight:900;margin:5px 0}.ar-line{color:#315aa4;font-weight:800}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.option{border:1px solid #d8deea;border-radius:12px;background:#fff;padding:11px;text-align:right;font-weight:800;cursor:pointer}.option.correct{border-color:var(--green);background:#effaf3}.option.wrong{border-color:#d14b4b;background:#fff3f3}.feedback{min-height:22px;margin-top:8px;font-weight:900}.file-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.file-card h3{margin:0 0 7px}.file-card p{color:var(--muted);line-height:1.7;margin:0 0 10px}.note{padding:14px 16px;border-radius:15px;background:var(--soft);color:var(--muted);line-height:1.8;margin-bottom:14px}.complete{margin-top:15px;background:#fff;border:1px solid var(--line);border-radius:21px;padding:17px;display:flex;justify-content:space-between;align-items:center;gap:14px}.complete button{border:0;border-radius:12px;padding:12px 16px;background:var(--pink);color:#fff;font-weight:900;cursor:pointer}.complete button:disabled{background:var(--green)}.small{font-size:12px;color:var(--muted)}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.journey{grid-template-columns:repeat(4,1fr)}.nav{display:none}}@media(max-width:560px){.hero{display:block;padding:20px}.hero-art{width:100%;height:95px;margin-top:13px}.journey{grid-template-columns:repeat(2,1fr)}.grid,.file-grid,.options{grid-template-columns:1fr}.head{display:block}.complete{display:block}.complete button{width:100%;margin-top:9px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="index.html"><span>HM</span>🇫🇷 HM Academy</a><nav class="nav"><a href="index.html">الرئيسية</a><a href="dashboard.html">الطالب</a><a href="course.html">المناهج</a><a href="levels.html">المستويات</a><a href="library.html">المكتبة</a><a href="settings.html">الإعدادات</a></nav><a href="student-profile.html" class="btn">👨‍🎓</a></header>
<main class="wrap"><section class="hero"><div><div id="unit" class="small" style="color:#eaf4ff"></div><h1 id="title">Leçon</h1><p id="subtitle">جارٍ تحميل محتوى الدرس…</p><div id="loadNote" class="small" style="color:#eaf4ff">جاري تجهيز الدرس</div></div><div class="hero-art">🏫</div></section><section class="journey" id="journey"></section><nav class="tabs" id="tabs"></nav><section id="viewer" class="panel"></section><section class="complete"><div><strong>🏁 إكمال الدرس</strong><div id="completionMessage" class="small">رحلتك محفوظة تلقائيًا أثناء التعلم.</div></div><button id="completeBtn" type="button">تم الانتهاء من الدرس</button></section><div class="actions" style="margin-top:16px"><a class="btn" href="grade-8.html">← الصف</a><a class="btn" href="course.html">📚 المناهج</a><a class="btn" href="dashboard.html">📈 لوحة الطالب</a></div></main>
<script>
(function(){'use strict';
const params=new URLSearchParams(location.search);const lessonId=params.get('id')||'grade8-u1-l1';const m=lessonId.match(/^grade8-u(\d+)-l(\d+)$/);const unitNo=m?m[1]:'1';const lessonNo=m?m[2]:'1';const base='data/lessons/grade-8/unit-'+unitNo+'/';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function speak(text){if(!text||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text));u.lang='fr-FR';u.rate=.86;speechSynthesis.speak(u)}catch(e){}}
const fallbackL1={id:'grade8-u1-l1',title:'Leçon 1 : À l’école',titleAr:'في المدرسة',titleFr:'Leçon 1 : À l’école',unit:'الوحدة الأولى',objectiveAr:'التعرّف على مرافق المدرسة وأدوات الفصل والأشخاص المرتبطين بالمدرسة واستخدام Il y a / Il n’y a pas de.',files:{interactive:'lesson.html?id=grade8-u1-l1',reference:'reference_lecon1_unite1.html',assessment:'formal_assessment_lecon1_unite1.html',quiz:'interactive_assessment_lecon1_unite1.html',games:'lesson-1-games.html'},vocabulary:[['Une cantine','كانتين','🍽️'],['Une cour','فناء','🏫'],['Des classes (une)','فصول','🚪'],['Un gymnase','صالة ألعاب مغطاة','🤸'],['Un CDI','صالة الوسائط المتعددة','📚'],['Un laboratoire','معمل','🧪'],['Un terrain de sport','أرض الملعب','⚽'],['Un self-service','قاعة طعام بالمدرسة','🍴'],['Une piscine','حمام سباحة','🏊'],['Une bibliothèque','مكتبة استعارية','📖'],['Des élèves','تلاميذ','🧑‍🎓'],['Des professeurs','مدرسون','👨‍🏫'],['Un drapeau','علم','🚩'],['Un jardin','حديقة','🌳'],['Un bureau','مكتب','🗄️'],['Un tableau','سبورة','🖼️'],['Une porte','باب','🚪'],['Une fenêtre','شباك','🪟'],['Des bancs / Un banc','مقاعد / مقعد','💺'],['Un panneau','لوحة تعليمية','📌'],['Un TNI','سبورة ذكية','🖥️'],['Une horloge','ساعة حائط','🕐'],['Une chaise','كرسي','🪑'],['Une table','منضدة','🛋️'],['Le globe terrestre','الكرة الأرضية','🌍'],['Un ordinateur','كمبيوتر','💻'],['Un squelette','هيكل عظمي','💀'],['Une carte','خريطة','🗺️'],['Une corbeille à papier','سلة مهملات','🗑️'],['Un dictionnaire','قاموس','📕']],grammar:{title:'Il y a / Il n’y a pas de',explanationAr:'نستخدم il y a للتعبير عن وجود شخص أو شيء أو مكان، و il n’y a pas de للتعبير عن عدم وجود شيء.',examples:[{fr:'Il y a un tableau dans la classe.',ar:'توجد سبورة في الفصل.'},{fr:'Il y a une bibliothèque à l’école.',ar:'توجد مكتبة في المدرسة.'},{fr:'Il n’y a pas de piscine dans l’école.',ar:'لا يوجد حمام سباحة في المدرسة.'}]},conversation:{lines:[{speaker:'Sara',fr:'Où est la bibliothèque ?',ar:'أين المكتبة؟'},{speaker:'Adam',fr:'Elle est à l’école.',ar:'إنها في المدرسة.'},{speaker:'Sara',fr:'Il y a une cantine ?',ar:'هل يوجد مقصف؟'},{speaker:'Adam',fr:'Oui, il y a une cantine.',ar:'نعم، يوجد مقصف.'}]},practice:[{question:'ما معنى une bibliothèque؟',options:['مقصف','مكتبة','فصل'],answer:1},{question:'أكمل: Il y a ___ tableau.',options:['une','des','un'],answer:2},{question:'اختر النفي الصحيح.',options:["Il n’y a pas une piscine.",'Il ne y a pas piscine.',"Il n’y a pas de piscine."],answer:2}]};
let data=null,active='vocabulary';
const sections=[['vocabulary','📚','المفردات'],['grammar','📖','القواعد'],['conversation','💬','المحادثة'],['practice','✍️','التدريب'],['files','📁','ملفات الدرس'],['games','🎮','الألعاب'],['assessment','📝','التقييم']];
function normalize(d){if(!d||!d.vocabulary)return d;d._vocab=d.vocabulary.map(v=>({word:v.word,ar:v.translation,image:v.image||'📘',example:v.example||'',category:v.category||'all'}));return d}
function showTabs(){ $('tabs').innerHTML=sections.map(([id,icon,label])=>'<button class="tab '+(active===id?'active':'')+'" data-tab="'+id+'">'+icon+' '+label+'</button>').join('');$('tabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;render()}) }
function vocab(){const a=data._vocab||[];const groups=[...new Set(a.map(x=>x.category))];return '<div class="head"><div><h2>📚 مفردات الدرس</h2><p>المفردات كاملة من المصدر: <b>'+a.length+' كلمة/مدخل</b>. تم استبعاد أي كلمات ليست ضمن الدرس.</p></div><button class="btn primary" onclick="speak('+JSON.stringify(a.map(x=>x.word).join('. '))+')">🔊 استمع للمجموعة</button></div><div class="content">'+groups.map(g=>'<h3>'+ (g==='facilities'?'🏫 في المدرسة':'🪑 في الفصل')+'</h3><div class="grid">'+a.filter(x=>x.category===g).map((x,i)=>'<article class="card"><div class="pic" onclick="speak('+JSON.stringify(x.word)+')">'+esc(x.image)+'</div><div class="fr">'+esc(x.word)+'</div><div class="ar">'+esc(x.ar)+'</div><div class="example">'+esc(x.example)+'<div class="example-ar">🔊 اضغط للنطق</div></div><div class="actions"><button class="btn" onclick="speak('+JSON.stringify(x.word)+')">🔊 الكلمة</button><button class="btn" onclick="speak('+JSON.stringify(x.example)+')">▶ المثال</button></div></article>').join('')+'</div>').join('')+'</div>'}
function grammar(){const g=data.grammar||{};return '<div class="head"><div><h2>📖 '+esc(g.title||'قاعدة الدرس')+'</h2><p>شرح القاعدة بالعربية والفرنسية مع أمثلة مرتبطة بمفردات الدرس.</p></div></div><div class="content"><div class="rule"><p>'+esc(g.explanationAr||'')+'</p><p dir="ltr">'+esc(g.explanationFr||g.explanation||'')+'</p><div class="formula">il y a + nom<br>il n’y a pas de + nom</div>'+(g.examples||[]).map(e=>'<div class="card"><div class="fr-line">'+esc(e.fr)+'</div><div class="ar-line">'+esc(e.ar)+'</div><button class="btn" onclick="speak('+JSON.stringify(e.fr)+')">🔊 نطق المثال</button></div>').join('')+'</div></div>'}
function conversation(){const lines=(data.conversation&&data.conversation.lines)||[];const full=lines.map(x=>x.fr).join(' ');return '<div class="head"><div><h2>💬 المحادثة</h2><p>حوار الدرس كاملًا، مع نطق كل جملة منفردة ونطق المحادثة مرة واحدة فقط.</p></div><button class="btn primary" onclick="speak('+JSON.stringify(full)+')">🔊 استمع للمحادثة كاملة</button></div><div class="content"><div class="dialogue">'+lines.map(x=>'<div class="dialog-line"><div class="speaker">'+esc(x.speaker)+'</div><div class="fr-line">'+esc(x.fr)+'</div><div class="ar-line">'+esc(x.ar)+'</div><button class="btn" onclick="speak('+JSON.stringify(x.fr)+')">🔊 نطق</button></div>').join('')+'</div></div>'}
function practice(){const qs=data.practice||[];return '<div class="head"><div><h2>✍️ تدرّب بنفسك</h2><p>تدريب قصير مرتبط مباشرة بمحتوى الدرس.</p></div></div><div class="content">'+qs.map((q,i)=>'<article class="exercise"><b>'+esc(q.question)+'</b><div class="options">'+q.options.map((o,j)=>'<button class="option" data-q="'+i+'" data-a="'+j+'">'+esc(o)+'</button>').join('')+'</div><div class="feedback" id="fb-'+i+'"></div></article>').join('')+'</div>'}
function files(){const f=data.files||{};const items=[['interactive','🎯 الملف التفاعلي','فتح تجربة الدرس التفاعلية.',f.interactive],['reference','📄 الملف المرجعي','فتح الملف المرجعي القابل للقراءة والطباعة.',f.reference],['assessment','📝 التقييم الرسمي','فتح التقييم الرسمي المستقل.',f.assessment],['quiz','🧠 التقييم التفاعلي','فتح التقييم التفاعلي.',f.quiz],['games','🎮 الألعاب','فتح مركز الألعاب والتدريب.',f.games]];return '<div class="head"><div><h2>📁 ملفات الدرس</h2><p>كل ملف مرتبط بمساره الحقيقي داخل المستودع، وليس مجرد زر شكلي.</p></div></div><div class="content"><div class="file-grid">'+items.map(x=>'<article class="file-card"><h3>'+x[1]+'</h3><p>'+x[2]+'</p><a class="btn primary" href="'+esc(x[3]||'#')+'">فتح الملف →</a></article>').join('')+'</div></div>'}
function games(){const f=data.files&&data.files.games;return '<div class="head"><div><h2>🎮 الألعاب والتدريب</h2><p>مركز الألعاب مستقل عن التقييم الرسمي.</p></div><a class="btn primary" href="'+esc(f||'#')+'">فتح الألعاب →</a></div><div class="content"><div class="note">إذا لم يفتح الملف، سيظهر الخطأ بدل بقاء الصفحة في حالة تحميل بلا نهاية.</div></div>'}
function assessment(){const qs=data.assessment&&data.assessment.questions||[];return '<div class="head"><div><h2>📝 التقييم</h2><p>تقييم الدرس مستقل عن الألعاب.</p></div></div><div class="content">'+qs.map((q,i)=>'<article class="exercise"><b>'+esc(q.question)+'</b><div class="options">'+q.options.map((o,j)=>'<button class="option" data-ass="'+i+'" data-a="'+j+'">'+esc(o)+'</button>').join('')+'</div><div class="feedback" id="afb-'+i+'"></div></article>').join('')+'</div>'}
function render(){showTabs();let html=active==='vocabulary'?vocab():active==='grammar'?grammar():active==='conversation'?conversation():active==='practice'?practice():active==='files'?files():active==='games'?games():assessment();$('viewer').innerHTML=html;bindQuestions();localStorage.setItem('hm_last_section_'+lessonId,active)}
function bindQuestions(){$('viewer').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const q=data.practice[+b.dataset.q],ok=+b.dataset.a===q.answer;$('viewer').querySelectorAll('[data-q="'+b.dataset.q+'"]').forEach(x=>x.classList.remove('correct','wrong'));b.classList.add(ok?'correct':'wrong');$('fb-'+b.dataset.q).textContent=ok?'✅ إجابة صحيحة':'❌ حاول مرة أخرى'});$('viewer').querySelectorAll('[data-ass]').forEach(b=>b.onclick=()=>{const q=data.assessment.questions[+b.dataset.ass],ok=+b.dataset.a===q.answer;$('viewer').querySelectorAll('[data-ass="'+b.dataset.ass+'"]').forEach(x=>x.classList.remove('correct','wrong'));b.classList.add(ok?'correct':'wrong');$('afb-'+b.dataset.ass).textContent=ok?'✅ إجابة صحيحة':'❌ حاول مرة أخرى'})}
function journey(){const labels=['🚀 البداية','📚 المفردات','🎧 النطق','📖 القواعد','💬 المحادثة','✍️ التدريب','🎮 الألعاب'];$('journey').innerHTML=labels.map((x,i)=>'<div class="step '+(i===0?'active':'')+'">'+x+'</div>').join('')}
function complete(){const key='hm_progress_'+lessonId;$('completeBtn').onclick=()=>{localStorage.setItem(key,'completed');$('completeBtn').disabled=true;$('completeBtn').textContent='✓ تم إكمال الدرس';$('completionMessage').textContent='تم حفظ إكمال الدرس على هذا الجهاز.'};if(localStorage.getItem(key)==='completed'){$('completeBtn').disabled=true;$('completeBtn').textContent='✓ تم إكمال الدرس'}}
async function load(){let loaded=false;try{const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),6000);const r=await fetch(base+'lesson-'+lessonNo+'.json?v=20260815-l1sourcefix',{cache:'no-store',signal:ctl.signal});clearTimeout(timer);if(!r.ok)throw new Error('HTTP '+r.status);data=normalize(await r.json());loaded=true}catch(e){if(lessonId==='grade8-u1-l1'){data=normalize({id:fallbackL1.id,title:fallbackL1.title,titleAr:fallbackL1.titleAr,titleFr:fallbackL1.titleFr,files:fallbackL1.files,vocabulary:fallbackL1.vocabulary.map(x=>({word:x[0],translation:x[1],image:x[2],example:'',category:'facilities'})),grammar:fallbackL1.grammar,conversation:fallbackL1.conversation,practice:fallbackL1.practice});data._vocab=fallbackL1.vocabulary.map((x,i)=>({word:x[0],ar:x[1],image:x[2],example:'',category:i<14?'facilities':'classroom'}))}else{data=null}}
if(!data){$('loadNote').textContent='تعذر تحميل بيانات الدرس. استخدم ملف الدرس أو أعد المحاولة.';$('viewer').innerHTML='<div class="content"><div class="note">حدث خطأ في بيانات هذا الدرس، ولم نترك الصفحة عالقة في «جاري التحميل».</div><button class="btn primary" onclick="location.reload()">إعادة المحاولة</button></div>';return}
$('title').textContent=data.titleAr?((data.titleFr||data.title)+' — '+data.titleAr):(data.title||'Leçon');$('subtitle').textContent=data.objectiveAr||data.titleAr||'';$('unit').textContent='الصف الثاني الإعدادي · الوحدة '+unitNo+' · الدرس '+lessonNo;$('loadNote').textContent=loaded?'تم تحميل محتوى الدرس بالكامل.':'تم تشغيل النسخة الآمنة الاحتياطية لمحتوى الدرس.';journey();complete();active=localStorage.getItem('hm_last_section_'+lessonId)||'vocabulary';render()}
load();
})();
</script>
