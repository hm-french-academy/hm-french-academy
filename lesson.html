const fallback={id:'grade8-u1-l1',titleAr:'في المدرسة',titleFr:"Leçon 1 : À l'école",unitTitleAr:'في المدرسة',unitTitleFr:"À l'école",interactive:'lesson.html?id=grade8-u1-l1',files:{interactive:'lesson-1-interactive-v2.html',reference:'data/lessons/grade-8/unit-1/reference_lecon1_unite1.html',assessment:'data/lessons/grade-8/unit-1/formal_assessment_lecon1_unite1.html',quiz:'data/lessons/grade-8/unit-1/interactive_assessment_lecon1_unite1.html',games:'data/lessons/grade-8/unit-1/lesson-1-games.html'},vocabularyGroups:[{id:'facilities',title:'🏫 مرافق المدرسة',description:'أماكن ومرافق المدرسة.'},{id:'classroom',title:'🪑 في الفصل',description:'أدوات وأشياء داخل الفصل.'}],vocabulary:[{word:'une cantine',translation:'مقصف المدرسة',image:'🍽️',example:'Je mange à la cantine.',category:'facilities'},{word:'une cour',translation:'فناء المدرسة',image:'🏫',example:'La cour est grande.',category:'facilities'},{word:'une bibliothèque',translation:'مكتبة',image:'📚',example:"La bibliothèque est à l'école.",category:'facilities'},{word:'un bureau',translation:'مكتب',image:'🗄️',example:'Il y a un bureau dans la classe.',category:'classroom'},{word:'un tableau',translation:'سبورة',image:'🧑‍🏫',example:'Il y a un tableau dans la classe.',category:'classroom'},{word:'une porte',translation:'باب',image:'🚪',example:'La porte est ouverte.',category:'classroom'},{word:'une fenêtre',translation:'نافذة',image:'🪟',example:'La fenêtre est ouverte.',category:'classroom'},{word:'une chaise',translation:'كرسي',image:'🪑',example:'Je suis sur une chaise.',category:'classroom'}],grammar:{title:"Il y a / Il n'y a pas de",explanationAr:'نستخدم il y a للتعبير عن الوجود، وil n’y a pas de للنفي.',explanationFr:"On utilise « il y a » pour exprimer l'existence et « il n'y a pas de » pour exprimer l'absence.",examples:[{fr:'Il y a un tableau dans la classe.',ar:'توجد سبورة في الفصل.'},{fr:"Il n'y a pas de piscine dans l'école.",ar:'لا يوجد حمام سباحة في المدرسة.'}]},conversation:{lines:[{speaker:'Sara',fr:'Où est la bibliothèque ?',ar:'أين المكتبة؟'},{speaker:'Adam',fr:"Elle est à l'école.",ar:'إنها في المدرسة.'},{speaker:'Sara',fr:'Il y a une cantine ?',ar:'هل يوجد مقصف؟'},{speaker:'Adam',fr:'Oui, il y a une cantine.',ar:'نعم، يوجد مقصف.'}]},practice:[{question:'ما معنى une bibliothèque؟',options:['مكتبة','مقصف','فصل'],answer:0},{question:'أكمل: Il y a ___ tableau.',options:['un','une','des'],answer:0},{question:'أين تأكل في المدرسة؟',options:['à la cantine','à la bibliothèque','dans la cour'],answer:0},{question:'اختر النفي الصحيح.',options:["Il n'y a pas de piscine.","Il n'y a pas une piscine.",'Il ne y a pas piscine.'],answer:0}]};
let voices=[];function refreshVoices(){voices=('speechSynthesis'in window?speechSynthesis.getVoices():[]).filter(v=>/^fr(-|_)?/i.test(v.lang))}if('speechSynthesis'in window){refreshVoices();speechSynthesis.onvoiceschanged=refreshVoices}
function speak(text){if(!text||!('speechSynthesis'in window))return false;const chunks=String(text).replace(/\s+/g,' ').trim().match(/.{1,180}(?:\s|$)/g)||[String(text)];speechSynthesis.cancel();let i=0;const next=()=>{if(i>=chunks.length)return;const u=new SpeechSynthesisUtterance(chunks[i++]);u.lang='fr-FR';u.rate=.84;refreshVoices();const v=voices.find(x=>/fr-FR/i.test(x.lang))||voices.find(x=>/^fr/i.test(x.lang));if(v)u.voice=v;u.onend=next;u.onerror=()=>{if(i<chunks.length)next()};speechSynthesis.speak(u)};setTimeout(next,50);return true}
function header(i,t,d,b='Premium'){return`<div class="section-head"><div><h2>${i} ${esc(t)}</h2><p>${esc(d)}</p></div><span class="section-badge">${esc(b)}</span></div>`}
function wf(x){return{w:x?.fr||x?.word||x?.term||'',ar:x?.ar||x?.translation||'',im:x?.image||x?.icon||'🖼️',ex:x?.example||''}}
function resolvePath(p){if(!p)return'';if(/^https?:\/\//i.test(p)||p.startsWith('lesson.html?')||p.startsWith('data/'))return p;const m=id.match(/^grade8-u(\d+)-l(\d+)$/);return m?`data/lessons/grade-8/unit-${m[1]}/${p}`:p}
function vocab(){const data=Array.isArray(lesson.vocabulary)?lesson.vocabulary:[],groups=Array.isArray(lesson.vocabularyGroups)?lesson.vocabularyGroups:[];const blocks=groups.length?groups.map(g=>{const items=data.filter(x=>x.category===g.id);return items.length?`<section class="group"><h3 class="group-title">${esc(g.title)}</h3><p class="group-desc">${esc(g.description||'')}</p><div class="grid">${items.map(card).join('')}</div></section>`:''}).join(''):`<div class="grid">${data.map(card).join('')}</div>`;return header('📚','المفردات','الكلمة + معناها + مثال + نطق الكلمة والمثال.','مفردات الدرس')+`<div class="content">${blocks||'<div class="resource"><p>لا توجد مفردات مرتبطة بهذا الدرس.</p></div>'}</div>`}
function card(x){const{w,ar,im,ex}=wf(x);return`<article class="word"><div class="pic" data-speak="${esc(w)}">${esc(im)}</div><div class="hint">اضغط لسماع النطق</div><div class="fr">${esc(w)}</div><div class="ar">${esc(ar)}</div><button class="speak" data-speak="${esc(w)}">🔊</button>${ex?`<div class="example"><b dir="ltr">${esc(ex)}</b><br><button class="listen" data-speak="${esc(ex)}">🔊 نطق المثال</button></div>`:''}</article>`}
function pronunciation(){const d=(lesson.vocabulary||[]).map(wf),w=d.map(x=>x.w).filter(Boolean),e=d.map(x=>x.ex).filter(Boolean);return header('🎧','النطق','استمع إلى كلمات الدرس وأمثلتها ثم كررها.','Prononciation')+`<div class="content"><div class="rule"><h3>🎙️ تدريب النطق</h3><p>ابدأ بالكلمات ثم انتقل إلى الجمل.</p><button class="primary" data-speak="${esc(w.join(' . '))}">▶ نطق الكلمات</button> <button class="listen" data-speak="${esc(e.join(' . '))}">▶ نطق الأمثلة</button></div></div>`}
function grammar(){const g=lesson.grammar||{},ex=g.examples||[],ar=g.explanationAr||'',fr=g.explanationFr||g.explanation||'',steps=g.steps||[];const all=[g.title,fr,...ex.map(e=>e.fr||e)];return header('📖','القواعد','شرح القاعدة بالعربية والفرنسية مع أمثلة قابلة للنطق.','Grammaire')+`<div class="content"><div class="rule"><h3>${esc(g.title||'قاعدة الدرس')}</h3><button class="primary" data-speak="${esc(all.join(' . '))}">🔊 استمع إلى شرح القاعدة</button>${ar?`<div class="grammar-language"><span class="grammar-label">🇪🇬 الشرح بالعربية</span>${esc(ar)}</div>`:''}<div class="grammar-language fr"><span class="grammar-label">🇫🇷 Explication en français</span>${esc(fr)}</div>${steps.length?`<div class="grammar-language"><span class="grammar-label">🧠 خطوات التطبيق</span>${steps.map(s=>`<div>• ${esc(String(s).replace(/^🇪🇬\s*/,'').replace(/^🇫🇷\s*/,''))}</div>`).join('')}</div>`:''}<h3>🔊 أمثلة القاعدة</h3>${ex.map(e=>`<div class="grammar-example"><div class="grammar-example-fr">${esc(e.fr||e)}</div>${e.ar?`<div class="grammar-example-ar">${esc(e.ar)}</div>`:''}<button class="listen" data-speak="${esc(e.fr||e)}">🔊 استمع</button></div>`).join('')}</div></div>`}
function conversation(){const lines=Array.isArray(lesson.conversation?.lines)?lesson.conversation.lines:[],full=lines.map(x=>x.fr||'').join(' . ');return header('💬','المحادثة','حوار مرتبط بموضوع الدرس مع ترجمة ونطق فردي ونطق كامل للحوار.','Conversation')+`<div class="content"><div class="rule"><h3>🎙️ النص الكامل للمحادثة</h3><button class="primary" data-speak="${esc(full)}">🔊 استمع إلى المحادثة كاملة</button></div><div class="dialogue">${lines.map(x=>`<article class="dialogue-card"><div class="speaker">${esc(x.speaker||'شخصية')}</div><div class="fr-line">${esc(x.fr||'')}</div><div class="ar-line">${esc(x.ar||'')}</div><button class="listen" data-speak="${esc(x.fr||'')}">🔊 نطق</button></article>`).join('')||'<div class="resource"><p>سيتم عرض الحوار الخاص بهذا الدرس هنا.</p></div>'}</div></div>`}
function shuffleQuestion(q){const pairs=(q.options||[]).map((text,i)=>({text,correct:i===+q.answer}));for(let i=pairs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pairs[i],pairs[j]]=[pairs[j],pairs[i]]}return{...q,options:pairs.map(x=>x.text),answer:pairs.findIndex(x=>x.correct)}}
function buildPractice(){let q=[...(lesson.practice||[])];const v=lesson.vocabulary||[];for(let i=0;q.length<8&&i<v.length;i++){const a=wf(v[i]);const opts=[a.ar,...v.slice(i+1,i+3).map(x=>wf(x).ar)].filter(Boolean);if(opts.length>=3)q.push({question:`ما معنى ${a.w}؟`,options:opts,answer:0})}return q.slice(0,12).map(shuffleQuestion)}
function practice(){practiceQuestions=buildPractice();practiceState={};return header('✍️','تدرب بنفسك','اختر إجابتك ثم اضغط «تحقق». ترتيب الاختيارات يتغير تلقائيًا لكل محاولة.','تدريب')+`<div class="content"><div class="practice">${practiceQuestions.map((q,i)=>`<article class="exercise"><h3>${i+1}. ${esc(q.question)}</h3>${(q.options||[]).map((o,j)=>`<button class="option" data-pq="${i}" data-oi="${j}">${esc(o)}</button>`).join('')}<button class="check" data-check="${i}">تحقق</button><div class="feedback" id="pf${i}"></div></article>`).join('')}</div></div>`}
function games(){const u=resolvePath(lesson.games||lesson.files?.games||'data/lessons/grade-8/unit-1/lesson-1-games.html');return header('🎮','الألعاب التعليمية','ألعاب مرتبطة بمفردات ومهارات هذا الدرس فقط.','Jeux')+`<div class="content"><div class="rule"><h3>🏆 مركز ألعاب الدرس</h3><p>الألعاب منفصلة عن التقييم الرسمي، وتفتح من ملف الألعاب الصحيح مباشرة.</p><a class="primary" target="_blank" rel="noopener" href="${esc(u)}">ابدأ الألعاب ↗</a></div></div>`}
function assessment(){const u=resolvePath(lesson.assessment||lesson.quiz||lesson.files?.assessment||lesson.files?.quiz);return header('📝','التقييم','اختبار ختامي مبني على محتوى هذا الدرس فقط.','Évaluation')+`<div class="content"><div class="rule"><h3>🎯 اختبار الإتقان</h3><p>بعد المفردات والقواعد والتدريب، انتقل إلى التقييم.</p>${u?`<a class="primary" target="_blank" rel="noopener" href="${esc(u)}">فتح التقييم ↗</a>`:''}</div></div>`}
function filesView(){const f=lesson.files||{},items=[['interactive','📘','الدرس التفاعلي',lesson.sourceInteractive||lesson.interactive||f.interactive],['reference','📄','المرجع التعليمي',lesson.reference||f.reference],['assessment','📝','التقييم الرسمي',lesson.assessment||f.assessment],['quiz','🎯','الاختبار الإلكتروني',lesson.quiz||f.quiz],['games','🎮','الألعاب التعليمية',lesson.games||f.games]].filter(x=>x[3]).map(x=>[x[0],x[1],x[2],resolvePath(x[3])]);return header('📁','ملفات الدرس','كل موارد الدرس في مكان واحد. لا نعتمد على فحص HEAD الذي كان يمنع بعض الملفات من الظهور.','Resources')+`<div class="resource"><div class="resource-grid">${items.map(x=>`<a target="_blank" rel="noopener" href="${esc(x[3])}">${x[1]} ${esc(x[2])} ↗</a>`).join('')}</div></div>`}
function lessonView(){const g=lesson.grammar||{},v=lesson.vocabulary||[],c=lesson.conversation?.lines?.length||0;return header('🚀','ضربة البداية','افتح الدرس مباشرة ثم انتقل عبر مسار التعلم.','بداية')+`<div class="content"><div class="rule"><h3>✨ هدف الدرس</h3><p>في هذا الدرس سنتعلم: <strong>${esc(lesson.titleAr||lesson.titleFr||'موضوع الدرس')}</strong>، من خلال ${v.length} مفردة${g.title?'، وقاعدة «'+esc(g.title)+'»':''}${c?'، ومحادثة قصيرة مرتبطة بالموضوع':''}.</p><button class="primary" onclick="openView('vocab')">ابدأ المفردات →</button></div><div class="rule" style="margin-top:14px"><h3>🧭 مسار التعلم</h3><p>مفردات → نطق → قواعد → محادثة → تدريب → ألعاب → تقييم → ملفات</p></div></div>`}
const views=['lesson','vocab','pronunciation','grammar','conversation','practice','games','assessment','files'];function journey(a){journeyEl.innerHTML=[['lesson','🚀','البداية'],['vocab','📚','المفردات'],['pronunciation','🎧','النطق'],['grammar','📖','القواعد'],['conversation','💬','المحادثة'],['practice','✍️','التدريب'],['assessment','📝','التقييم']].map(x=>`<div class="step ${x[0]===a?'active':''}">${x[1]}<br>${x[2]}</div>`).join('')}
function openView(v){if(!views.includes(v))v='lesson';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v));journey(v);const out={lesson:lessonView,vocab,pronunciation,grammar,conversation,practice,games,assessment,files:filesView};try{viewer.innerHTML=out[v]()}catch(e){viewer.innerHTML=`<div class="status">تعذر عرض هذا القسم: ${esc(e.message)}</div>`}try{HMProgress.setSection(v)}catch(e){}}
function cacheLesson(x){try{localStorage.setItem('hm:lesson:'+id,JSON.stringify(x))}catch(e){}}
function getCached(){try{return JSON.parse(localStorage.getItem('hm:lesson:'+id)||'null')}catch(e){return null}}
function paint(){const ar=(window.HMLanguage?.get?.()||'ar')==='ar';unit.textContent=ar?(lesson.unitTitleAr||''):(lesson.unitTitleFr||'');title.textContent=ar?(lesson.titleAr||lesson.titleFr):(lesson.titleFr||lesson.titleAr);subtitle.textContent=ar?'الصف الثاني الإعدادي · الترم الأول':'2e année du collège · 1er semestre';art.textContent=id.includes('u2-')?'🏠':id.includes('u3-')?'✈️':'🏫';openView(views.includes(requested)?requested:'lesson');try{HMProgress.startLesson(id)}catch(e){}}
async function fetchJson(url){const r=await fetch(url+'?v=20260815-lesson-framework-v10',{cache:'default'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function load(){const cached=getCached();if(cached){lesson=cached;paint()}else if(id==='grade8-u1-l1'){lesson={...fallback};paint()}else{lesson={id,titleAr:'الدرس',titleFr:'Leçon'};paint()}const m=id.match(/^grade8-u(\d+)-l(\d+)$/);try{const fresh=m?await fetchJson(`data/lessons/grade-8/unit-${m[1]}/lesson-${m[2]}.json`):null;if(fresh){lesson={...lesson,...fresh};cacheLesson(lesson);paint();loadNote.textContent='';}}catch(e){loadNote.textContent='تم فتح النسخة المحفوظة، وسيتم تحديث المحتوى تلقائيًا عند توفر الاتصال.'}try{registry=await fetchJson('data/lessons/grade-8/lesson-registry.json')}catch(e){registry=null}}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>openView(b.dataset.view)));viewer.addEventListener('click',e=>{const s=e.target.closest('[data-speak]');if(s){e.preventDefault();speak(s.dataset.speak);return}const o=e.target.closest('.option');if(o){const i=+o.dataset.pq;practiceState[i]=+o.dataset.oi;document.querySelectorAll(`.option[data-pq="${i}"]`).forEach(b=>b.classList.remove('selected'));o.classList.add('selected');return}const c=e.target.closest('[data-check]');if(c){const i=+c.dataset.check,q=practiceQuestions[i],fb=document.getElementById('pf'+i);if(practiceState[i]===undefined){fb.textContent='اختر إجابتك أولًا.';return}if(practiceState[i]===+q.answer){fb.textContent='✓ إجابة صحيحة، أحسنت!';c.disabled=true;document.querySelectorAll(`.option[data-pq="${i}"]`).forEach(b=>{b.disabled=true;if(+b.dataset.oi===+q.answer)b.classList.add('correct')})}else fb.textContent='✗ ليست الإجابة الصحيحة. حاول مرة أخرى.'}});completeBtn.addEventListener('click',()=>{if(window.markLessonComplete)window.markLessonComplete(id,'lesson-finish','premium-sections');cacheLesson(lesson);paint()});window.addEventListener('hm:languagechange',()=>paint());load();
</script>
