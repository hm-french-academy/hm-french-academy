<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Leçon</title><link rel="stylesheet" href="css/premium-shell.css?v=20260812-lesson15"><style>.wrap{max-width:1180px;margin:auto;padding:20px 14px 55px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff;border-radius:30px;padding:28px;display:flex;justify-content:space-between;gap:20px;align-items:center;box-shadow:0 20px 50px #2563eb22}.hero h1{margin:0;font-size:clamp(30px,6vw,46px)}.hero p{margin:8px 0 0;line-height:1.8}.hero-art{width:180px;height:125px;border-radius:24px;background:#ffffff22;display:grid;place-items:center;font-size:72px}.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0;padding:6px;background:#fff;border:1px solid #e1e7f0;border-radius:18px}.tab{border:0;background:transparent;color:#536078;padding:11px 15px;border-radius:13px;font-weight:900;white-space:nowrap;cursor:pointer}.tab.active{background:#e92d83;color:#fff}.viewer{background:#fff;border:1px solid #e1e7f0;border-radius:24px;overflow:hidden;box-shadow:0 14px 40px #14264a10}.viewer iframe{display:block;width:100%;height:900px;border:0;background:#f4f7fc}.resource{padding:24px}.resource h2{margin-top:0;color:#14264a}.resource-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.resource a{display:block;text-decoration:none;padding:14px;border:1px solid #dfe6f2;border-radius:14px;color:#315fc8;font-weight:900;background:#f8faff}.complete{margin-top:16px;background:#fff;border:1px solid #e1e7f0;border-radius:22px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:14px}.complete button{border:0;border-radius:13px;padding:12px 16px;background:#e92d83;color:#fff;font-weight:900;cursor:pointer}.complete button:disabled{background:#20a45a;cursor:default}.message{color:#68758b;font-weight:800}.back{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.back a{background:#fff;border:1px solid #e1e7f0;border-radius:12px;padding:10px 14px;text-decoration:none;color:#315fc8;font-weight:900}@media(max-width:700px){.hero{display:block}.hero-art{width:100%;height:100px;margin-top:15px}.viewer iframe{height:1100px}.resource-grid{grid-template-columns:1fr}.complete{display:block}.complete button{width:100%;margin-top:10px}}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="index.html">الرئيسية</a><a href="dashboard.html">الطالب</a><a href="course.html">المناهج الدراسية</a><a href="levels.html">مستويات اللغة</a><a href="library.html">المكتبة</a><a href="settings.html">الإعدادات</a></nav><div class="hm-tools"><select class="hm-lang" data-lang-select><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select><a class="hm-student" href="student-profile.html">👨‍🎓</a></div></header><main class="wrap"><section class="hero"><div><span id="unit" style="font-weight:900;opacity:.9"></span><h1 id="title">Leçon</h1><p id="subtitle"></p></div><div class="hero-art" id="art">🏫</div></section><nav class="tabs" aria-label="Lesson sections"><button class="tab active" data-view="lesson">📘 الدرس</button><button class="tab" data-view="files">📚 ملفات الدرس</button><button class="tab" data-view="games">🎮 الألعاب</button><button class="tab" data-view="assessment">📝 التقييم</button></nav><section id="viewer" class="viewer"></section><section class="complete"><div><strong>🏁 إكمال الدرس</strong><div id="completionMessage" class="message">عند إنهاء دراسة الدرس اضغط الزر لتسجيل الإنجاز وإضافة XP.</div></div><button id="completeBtn" type="button">تم الانتهاء من الدرس</button></section><div class="back"><a href="grade-8.html">← العودة إلى الصف</a><a href="index.html">⌂ الرئيسية</a><a href="dashboard.html">📈 لوحة الطالب</a></div></main><footer class="hm-footer"><div class="hm-footer-brand"><strong>HM Academy</strong><span>French Language Education</span><small>© 2026</small></div></footer><script src="scripts/i18n.js?v=20260812-i18n4"></script><script src="scripts/learning-progress.js?v=20260812-progress3"></script><script src="scripts/lesson-complete.js?v=20260812-complete3"></script><script>const id=new URLSearchParams(location.search).get('id')||'grade8-u1-l1';let registry=null,lesson=null;const lang=()=>window.HMLanguage?.get?.()||'ar';function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function find(){for(const u of registry.includedUnits||[])for(const l of u.lessons||[])if(l.id===id)return {...l,unitTitleAr:u.titleAr,unitTitleFr:u.titleFr};return null}function resourceView(kind){const x={files:lesson.files,games:lesson.games,assessment:lesson.assessment||lesson.quiz};const url=x[kind];if(!url){viewer.innerHTML='<div class="resource"><h2>هذا القسم غير متاح لهذا الدرس.</h2></div>';return}viewer.innerHTML='<div class="resource"><h2>'+esc(kind==='files'?'📚 ملفات الدرس':kind==='games'?'🎮 الألعاب التعليمية':'📝 التقييم')+'</h2><div class="resource-grid"><a href="'+esc(url)+'">فتح القسم</a></div></div>'}function render(){lesson=find();if(!lesson){title.textContent='الدرس غير موجود';return}const ar=lang()==='ar';unit.textContent=ar?lesson.unitTitleAr:lesson.unitTitleFr;title.textContent=ar?lesson.titleAr:lesson.titleFr;subtitle.textContent=ar?'الصف الثاني الإعدادي · الترم الأول':'2e année du collège · 1er semestre';art.textContent=lesson.id.includes('u2-')?'🏠':lesson.id.includes('u3-')?'✈️':'🏫';const p=window.HMProgress?.get?.()||{completedLessons:[],xp:0};const done=Array.isArray(p.completedLessons)&&p.completedLessons.includes(id);completeBtn.disabled=done;completeBtn.textContent=done?'✅ تم إكمال الدرس':'تم الانتهاء من الدرس';completionMessage.textContent=done?'تم حفظ إكمال الدرس والتقدم على هذا الجهاز.':'عند إنهاء دراسة الدرس اضغط الزر لتسجيل الإنجاز وإضافة 50 XP.';open('lesson')}function open(view){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='lesson'){if(lesson.sourceInteractive){viewer.innerHTML='<iframe title="محتوى الدرس التفاعلي" src="'+esc(lesson.sourceInteractive)+'"></iframe>'}else{viewer.innerHTML='<div class="resource"><h2>'+esc(lang()==='ar'?'محتوى الدرس':'Lesson content')+'</h2><p>سيظهر محتوى الدرس هنا عند ربط ملفه التعليمي.</p></div>'}}else resourceView(view)}document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>open(b.dataset.view)));completeBtn.addEventListener('click',()=>{if(window.markLessonComplete)window.markLessonComplete(id,'lesson-finish','grammar');render()});async function load(){const r=await fetch('data/lessons/grade-8/lesson-registry.json?v=20260812-registry3',{cache:'no-store'});registry=await r.json();render()}window.addEventListener('hm:languagechange',render);load();</script></body></html>
