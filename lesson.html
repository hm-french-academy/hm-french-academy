<style>
:root{--navy:#14264a;--blue:#2563eb;--pink:#e92d83;--teal:#12a594;--gold:#f5b83d;--line:#dfe6f0;--muted:#68758b;--bg:#f4f7fc;--good:#138a58;--bad:#c73c52}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fbfcff 0%,var(--bg) 100%);color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:1220px;margin:auto;padding:18px 14px 70px}.hero{position:relative;overflow:hidden;color:#fff;border-radius:30px;padding:30px;background:linear-gradient(135deg,#112f72 0%,#2563eb 55%,#12a594 100%);box-shadow:0 22px 55px #173a8226}.hero:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:#fff1;left:-100px;bottom:-150px}.eyebrow{font-weight:900;opacity:.9}.hero h1{margin:8px 0;font-size:clamp(32px,6vw,54px);line-height:1.2}.hero p{margin:8px 0;line-height:1.9}.hero-top{display:flex;justify-content:space-between;gap:22px;align-items:center;position:relative;z-index:1}.hero-copy{min-width:0}.hero-art{width:180px;height:150px;border-radius:28px;background:#ffffff18;border:1px solid #ffffff30;display:grid;place-items:center;font-size:72px;flex:0 0 auto}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.badge{padding:8px 12px;border-radius:99px;background:#ffffff18;border:1px solid #ffffff33;font-weight:900;backdrop-filter:blur(5px)}.journey{margin-top:18px;display:grid;grid-template-columns:repeat(7,1fr);gap:7px;position:relative;z-index:1}.journey-step{border:1px solid #ffffff2e;background:#ffffff12;border-radius:14px;padding:9px 6px;text-align:center;font-size:12px;font-weight:900}.journey-step.active{background:#fff;color:var(--blue)}
.tabs{display:flex;gap:8px;overflow:auto;padding:7px;margin:16px 0;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px #14264a0a;position:sticky;top:6px;z-index:20}.tab{border:0;background:transparent;color:#536078;padding:12px 16px;border-radius:13px;font-weight:900;white-space:nowrap;cursor:pointer}.tab.active{background:var(--pink);color:#fff}.view{display:none}.view.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;margin-top:14px;box-shadow:0 12px 35px #14264a0a}.card h2{margin:0 0 14px;color:var(--navy);font-size:24px}.muted{color:var(--muted);line-height:1.85}.goal-grid,.grammar-grid,.example-grid,.resource-grid,.game-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.goal,.grammar,.example,.resource,.game{border:1px solid var(--line);border-radius:18px;padding:16px;background:linear-gradient(180deg,#fff,#fbfcff)}.goal{font-weight:800;line-height:1.8}.goal i{color:var(--good);margin-left:7px}.vocab-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.word-card{border:1px solid var(--line);border-radius:20px;padding:12px;background:#fff;text-align:center;transition:.18s;position:relative;overflow:hidden}.word-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px #14264a12}.word-visual{height:118px;border-radius:15px;background:linear-gradient(145deg,#f5f8ff,#eef3ff);display:grid;place-items:center;color:#2454a6;font-size:58px}.word-fr{direction:ltr;font-size:20px;font-weight:900;margin-top:11px}.word-ar{color:#315aa4;font-weight:800;margin:6px 0 10px}.speak{border:0;border-radius:12px;padding:10px 13px;background:var(--pink);color:#fff;font-weight:900;cursor:pointer}.speak i{margin-right:5px}.word-card.playing{outline:3px solid #e92d8340}.word-card.playing .word-visual{background:#fff0f7;color:var(--pink)}
.media-lab{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.scene{min-height:300px;border-radius:22px;padding:24px;background:linear-gradient(145deg,#edf4ff,#f8fbff);border:1px solid #d8e4f7;position:relative;overflow:hidden}.scene-title{font-size:20px;font-weight:900;color:var(--navy)}.scene-items{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:end;margin-top:40px}.scene-object{width:125px;height:125px;border:2px solid #cddcf2;background:#fff;border-radius:20px;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 20px #14264a0b}.scene-object:hover{transform:scale(1.03)}.scene-object i{font-size:45px;color:#2860c0}.scene-object span{font-size:13px;font-weight:900}.media-panel{border:1px solid var(--line);border-radius:20px;padding:18px}.media-panel button{border:0;border-radius:13px;padding:12px 15px;background:var(--blue);color:#fff;font-weight:900;cursor:pointer;margin:4px}.rule{line-height:2}.rule strong{color:var(--blue)}.example{direction:ltr;text-align:left;border-right:4px solid var(--pink);font-size:18px;font-weight:800;line-height:1.9}.example small{display:block;direction:rtl;text-align:right;color:var(--muted);font-weight:700;margin-top:5px}.practice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.question{border:1px solid var(--line);border-radius:18px;padding:16px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.choice{border:1px solid #d2dceb;background:#fff;border-radius:12px;padding:11px;font-weight:900;cursor:pointer}.choice.correct{background:#eaf8f1;border-color:#6fc79a}.choice.wrong{background:#fff0f3;border-color:#ef9aaa}.choice:disabled{cursor:default}.feedback{min-height:22px;margin-top:8px;font-weight:900}.progress{height:11px;background:#e8edf5;border-radius:99px;overflow:hidden;margin-top:16px}.progress span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));transition:.25s}.resource{min-height:150px}.resource h3{margin:0 0 8px;color:var(--navy)}.resource-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.open-resource{border:0;border-radius:12px;padding:10px 13px;background:var(--blue);color:#fff;font-weight:900;cursor:pointer}.open-resource.secondary{background:#edf3ff;color:#2454a6}.mini-list{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:99px;background:#f1f5fb;color:#40516e;font-weight:800}.finish{display:flex;align-items:center;justify-content:space-between;gap:15px}.finish button{border:0;border-radius:14px;padding:14px 18px;background:var(--pink);color:#fff;font-weight:900;cursor:pointer}.finish button:disabled{background:var(--teal)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#14264a;color:#fff;padding:12px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:100}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.loading{padding:40px;text-align:center;color:var(--muted)}.score{font-size:22px;font-weight:900;color:#2454a6}.match-area{display:grid;grid-template-columns:1fr 1fr;gap:12px}.match-btn{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:15px;font-weight:900;cursor:pointer}.match-btn.selected{outline:3px solid #2563eb33;background:#f2f6ff}.match-btn.matched{background:#eaf8f1;border-color:#6fc79a}.resource-note{padding:14px;border-radius:16px;background:#f7f9fd;color:var(--muted);line-height:1.8;margin-top:12px}
@media(max-width:900px){.vocab-grid{grid-template-columns:repeat(3,1fr)}.media-lab{grid-template-columns:1fr}.journey{grid-template-columns:repeat(4,1fr)}}@media(max-width:650px){.hero-top{display:block}.hero-art{width:100%;height:95px;margin-top:15px}.vocab-grid{grid-template-columns:repeat(2,1fr)}.goal-grid,.grammar-grid,.example-grid,.resource-grid,.game-grid,.practice-grid,.match-area{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.journey{grid-template-columns:repeat(2,1fr)}.finish{display:block}.finish button{width:100%;margin-top:10px}}
</style>

<script>
'use strict';
const ID=new URLSearchParams(location.search).get('id')||'grade8-u1-l1';let REG=null,MAP=null,L=null,U=null,C=null,active='lesson',answers={},assessmentAnswers={},matchState={a:null,b:null,matched:[]};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iconMap={
'lycée':'fa-school','classe':'fa-school','professeur':'fa-chalkboard-user','élève':'fa-user-graduate','tableau':'fa-chalkboard','bureau':'fa-table','chaise':'fa-chair','livre':'fa-book','stylo':'fa-pen','crayon':'fa-pencil','gomme':'fa-eraser','règle':'fa-ruler','taille-crayon':'fa-scissors','colle':'fa-puzzle-piece','trousse':'fa-briefcase','ciseaux':'fa-scissors','calculatrice':'fa-calculator','sac à dos':'fa-backpack','français':'fa-language','anglais':'fa-language','mathématiques':'fa-calculator','arabe':'fa-language','dessin':'fa-paintbrush','sciences':'fa-flask','histoire':'fa-landmark','géographie':'fa-earth-europe','musique':'fa-music','gymnastique':'fa-person-running','technologie':'fa-microchip','médecin':'fa-user-doctor','infirmière':'fa-user-nurse','ingénieur':'fa-helmet-safety','policier':'fa-user-shield','journaliste':'fa-newspaper','boulanger':'fa-bread-slice','mécanicien':'fa-wrench','agriculteur':'fa-tractor','vétérinaire':'fa-user-doctor','maison':'fa-house','chambre':'fa-bed','cuisine':'fa-kitchen-set','salon':'fa-couch','bains':'fa-shower','lit':'fa-bed','armoire':'fa-box','oreiller':'fa-cloud','canapé':'fa-couch','fauteuil':'fa-chair','tapis':'fa-rug','évier':'fa-sink','réfrigérateur':'fa-refrigerator','douche':'fa-shower','baignoire':'fa-bath','miroir':'fa-mirror','porte':'fa-door-open','fenêtre':'fa-window-maximize','mur':'fa-border-all','jardin':'fa-tree','étage':'fa-stairs','escalier':'fa-stairs','lampe':'fa-lightbulb','table':'fa-table','sur':'fa-arrow-up','sous':'fa-arrow-down','devant':'fa-arrow-right','derrière':'fa-arrow-left','entre':'fa-arrows-left-right','avion':'fa-plane','train':'fa-train','bateau':'fa-ship','aéroport':'fa-plane-departure','gare':'fa-train-subway','port':'fa-anchor','hôtel':'fa-hotel','station':'fa-location-dot','guichet':'fa-ticket','passager':'fa-person-walking-luggage','valise':'fa-suitcase-rolling','billet':'fa-ticket','passeport':'fa-passport','voyageur':'fa-person-walking-luggage','départ':'fa-person-walking-arrow-right','arrivée':'fa-person-walking-arrow-loop-left','map':'fa-map','ville':'fa-city','pays':'fa-earth-europe'};
function iconFor(word){const w=word.toLowerCase();for(const k of Object.keys(iconMap))if(w.includes(k))return iconMap[k];return 'fa-circle-info'}
function speak(text,card){if(!('speechSynthesis'in window)){toast('النطق غير متاح في هذا المتصفح');return}document.querySelectorAll('.word-card.playing').forEach(x=>x.classList.remove('playing'));if(card)card.classList.add('playing');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=.82;u.pitch=1;speechSynthesis.speak(u);u.onend=()=>card?.classList.remove('playing')}
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove('show'),1800)}
function lessonData(){for(const u of REG.includedUnits||[])for(const l of u.lessons||[])if(l.id===ID){U=u;L=l;C=MAP.units[u.id].lessons[String(l.number)];return}throw Error('lesson not found')}
function setActive(view){active=view;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+view));try{HMProgress.setSection(view)}catch(e){}}
function wordCard(x,i){const word=x[0],meaning=x[1],ic=iconFor(word);return `<article class="word-card" data-word="${esc(word)}"><div class="word-visual"><i class="fa-solid ${ic}" aria-hidden="true"></i></div><div class="word-fr">${esc(word)}</div><div class="word-ar">${esc(meaning)}</div><button class="speak" type="button" onclick="speak(${JSON.stringify(word)},this.closest('.word-card'))"><i class="fa-solid fa-volume-high"></i> استمع وانطق</button></article>`}
function renderHero(){return `<section class="hero"><div class="hero-top"><div class="hero-copy"><div class="eyebrow">${esc(U.titleAr)} · Français simple 2</div><h1>${esc(C.titleAr)}</h1><p>${esc(C.titleFr)} · الصف الثاني الإعدادي · الترم الأول</p><div class="badges"><span class="badge">✨ تجربة Premium حقيقية</span><span class="badge">📘 شرح كامل</span><span class="badge">🖼️ صور مرتبطة بالمفردات</span><span class="badge">🔊 نطق بالضغط</span><span class="badge">🎯 تدريب تفاعلي</span><span class="badge">📝 تقييم مستقل</span><span class="badge">🎮 ألعاب</span><span class="badge">🏆 XP</span></div></div><div class="hero-art"><i class="fa-solid ${iconFor(C.vocab?.[0]?.[0]||'school')}"></i></div></div><div class="journey"><div class="journey-step active">1<br>الدرس</div><div class="journey-step">2<br>المفردات</div><div class="journey-step">3<br>القاعدة</div><div class="journey-step">4<br>التطبيق</div><div class="journey-step">5<br>التقييم</div><div class="journey-step">6<br>اللعبة</div><div class="journey-step">7<br>الإتقان</div></div></section>`}
function renderLesson(){const goals=['أتعرف المفردات وأستخدمها في سياق صحيح.','أفهم القاعدة المرتبطة بالدرس وأطبقها.','أستمع إلى الفرنسية وأنطق الكلمات بالضغط عليها.','أربط الصورة بالكلمة والمعنى بدل الحفظ المجرد.'];return `<div id="view-lesson" class="view active"><section class="card"><h2>🎯 أهداف التعلم</h2><div class="goal-grid">${goals.map(x=>`<div class="goal"><i class="fa-solid fa-circle-check"></i>${x}</div>`).join('')}</div></section><section class="card"><h2>📚 المفردات الأساسية</h2><p class="muted">كل بطاقة هنا تحمل صورة/رمزًا مطابقًا لمعنى الكلمة، والضغط على البطاقة الصوتية ينطق الكلمة بالفرنسية. لا توجد صور عشوائية مرتبطة بكلمات أخرى.</p><div class="vocab-grid">${(C.vocab||[]).map(wordCard).join('')}</div></section><section class="card"><h2>🎧 مختبر الصوت والوسائط</h2><div class="media-lab"><div class="scene"><div class="scene-title">🖱️ مشهد تفاعلي: اضغط على أي عنصر للاستماع إليه</div><p class="muted">المشهد يتغير حسب مفردات الدرس، ويُستخدم كمدخل بصري قبل التدريب.</p><div class="scene-items">${(C.vocab||[]).slice(0,5).map(x=>`<button class="scene-object" onclick="speak(${JSON.stringify(x[0])},this)"><i class="fa-solid ${iconFor(x[0])}"></i><span>${esc(x[0])}</span></button>`).join('')}</div></div><div class="media-panel"><h3>🔊 وضع الاستماع</h3><p class="muted">استمع إلى المفردات بالتتابع ثم كررها بصوتك. النطق يستخدم صوت الفرنسية fr-FR في جهاز الطالب.</p><button onclick="speakAll()"><i class="fa-solid fa-play"></i> تشغيل القائمة</button><button onclick="speechSynthesis?.cancel()" style="background:#e92d83"><i class="fa-solid fa-stop"></i> إيقاف</button><div class="resource-note">💡 <b>فكرة Premium:</b> بعد كل كلمة، يتوقف المشغل لحظة قصيرة ليمنح الطالب فرصة التقليد، ثم ينتقل للكلمة التالية.</div></div></div></section><section class="card"><h2>📘 الشرح والقواعد</h2><div class="grammar-grid">${(C.grammar||[]).map(x=>`<article class="grammar rule"><strong>${esc(x[0])}</strong><br><span dir="ltr">${esc(x[1])}</span></article>`).join('')}</div></section><section class="card"><h2>🧩 أمثلة تطبيقية</h2><div class="example-grid">${(C.examples||[]).map((x,i)=>`<article class="example">${esc(x)}<small>💡 حاول قراءتها بصوتك ثم اضغط على المفردات السابقة للاستماع.</small></article>`).join('')}</div></section><section class="card"><h2>🎯 تدريب فوري داخل الدرس</h2><p class="muted">هذا تدريب تعلمي فوري وليس التقييم الرسمي. تحصل على تغذية راجعة بعد كل اختيار.</p><div id="practice" class="practice-grid">${(C.practice||[]).map((q,i)=>questionCard(q,i,'practice')).join('')}</div><div class="progress"><span id="practiceBar"></span></div><p id="practiceScore" class="score">0 / ${(C.practice||[]).length}</p></section><section class="card"><h2>🧠 كبسولة الإتقان</h2><div class="goal-grid"><div class="goal">🔎 <b>استدعاء:</b> غطِّ الترجمة وحاول تذكر معنى الكلمة من الصورة.</div><div class="goal">🗣️ <b>تقليد:</b> استمع ثم كرر الكلمة الفرنسية مرتين.</div><div class="goal">✍️ <b>إنتاج:</b> استخدم كلمة من الدرس في جملة من إنشائك.</div><div class="goal">⚡ <b>تحدي الدقيقة:</b> حاول الإجابة عن أسئلة التدريب دون الرجوع للشرح.</div></div></section></div>`}
function questionCard(q,i,mode){return `<article class="question"><b>${i+1}. <span dir="ltr">${esc(q[0])}</span></b><div class="choices">${q[1].map((o,k)=>`<button class="choice" data-mode="${mode}" onclick="answer(${i},${k},this,'${mode}')">${esc(o)}</button>`).join('')}</div><div class="feedback" id="${mode}-f-${i}"></div></article>`}
function answer(i,k,b,mode){const key=mode+'-'+i;if(answers[key])return;answers[key]=true;const qs=mode==='practice'?C.practice:buildAssessment();const q=qs[i];const box=$('#'+mode+'-f-'+i);document.querySelectorAll(`[data-mode="${mode}"]`)[0]?.closest('.question');b.closest('.question').querySelectorAll('.choice').forEach(x=>x.disabled=true);if(k===q[2]){b.classList.add('correct');box.textContent='✓ إجابة صحيحة — أحسنت!'}else{b.classList.add('wrong');b.closest('.question').querySelectorAll('.choice')[q[2]].classList.add('correct');box.textContent='✗ ليست الإجابة الصحيحة — راجع القاعدة ثم حاول في الجولة التالية.'}const total=Object.keys(answers).filter(x=>x.startsWith(mode+'-')).length;const good=Object.entries(answers).filter(([x])=>x.startsWith(mode+'-')&&x.endsWith('-good')).length;const bar=mode==='practice'?$('#practiceBar'):$('#assessmentBar');if(bar)bar.style.width=(total/qs.length*100)+'%';if(mode==='practice')$('#practiceScore').textContent=good+' / '+total;}
function buildAssessment(){const out=[];(C.practice||[]).forEach(q=>out.push(q));(C.vocab||[]).slice(0,6).forEach((x,i)=>{const wrong=(C.vocab||[]).filter(y=>y[0]!==x[0]).slice(i+1,i+3).map(y=>y[1]);if(wrong.length===2)out.push(['ما معنى «'+x[0]+'»؟',[x[1],...wrong],0])});return out.slice(0,10)}
function renderReference(){return `<div id="view-reference" class="view"><section class="card"><h2>📖 المرجع التعليمي الكامل</h2><p class="muted">نسخة مرجعية منظمة للمراجعة السريعة، بدون صفحة داخل صفحة.</p><div class="vocab-grid">${(C.vocab||[]).map(wordCard).join('')}</div></section><section class="card"><h2>📘 القواعد في ورقة مراجعة</h2><div class="grammar-grid">${(C.grammar||[]).map(x=>`<div class="grammar"><b>${esc(x[0])}</b><br><span dir="ltr">${esc(x[1])}</span></div>`).join('')}</div></section><section class="card"><h2>🧩 أمثلة للحفظ والتطبيق</h2><div class="example-grid">${(C.examples||[]).map(x=>`<div class="example">${esc(x)}</div>`).join('')}</div></section></div>`}
function renderAssessment(){const qs=buildAssessment();return `<div id="view-assessment" class="view"><section class="card"><h2>📝 التقييم المستقل</h2><p class="muted">10 أسئلة متدرجة. هذا التقييم لا يغيّر حالة إكمال الدرس. الهدف قياس الإتقان بعد الشرح والتدريب.</p><div id="assessment">${qs.map((q,i)=>questionCard(q,i,'assessment')).join('')}</div><div class="progress"><span id="assessmentBar"></span></div><p class="score" id="assessmentScore">0 / ${qs.length}</p></section><section class="card"><h2>📊 كيف تقرأ نتيجتك؟</h2><div class="mini-list"><span class="pill">90–100% إتقان ممتاز</span><span class="pill">75–89% إتقان جيد جدًا</span><span class="pill">60–74% يحتاج مراجعة</span><span class="pill">أقل من 60% أعد الشرح والتدريب</span></div></section></div>`}
function renderGames(){return `<div id="view-games" class="view"><section class="card"><h2>🎮 الألعاب التعليمية</h2><p class="muted">ألعاب قصيرة مبنية على نفس محتوى الدرس، وليست صفحة خارجية أو إطارًا مضمنًا.</p><div class="game-grid"><article class="game"><h3>🔊 اسمع واختر</h3><p class="muted">استمع إلى كلمة ثم اختر معناها.</p><button class="open-resource" onclick="startAudioGame()">ابدأ الجولة</button><div id="audioGame" class="resource-note">اضغط «ابدأ الجولة».</div></article><article class="game"><h3>🧠 ذاكرة الكلمة</h3><p class="muted">اضغط كلمة ثم ابحث عن معناها المطابق.</p><button class="open-resource" onclick="startMatchGame()">ابدأ المطابقة</button><div id="matchGame" class="resource-note">ستظهر البطاقات هنا.</div></article><article class="game"><h3>⚡ تحدي السرعة</h3><p class="muted">10 أسئلة سريعة من مفردات وقواعد الدرس.</p><button class="open-resource" onclick="startSpeedGame()">ابدأ التحدي</button><div id="speedGame" class="resource-note">جاهز؟</div></article><article class="game"><h3>🗣️ مختبر النطق</h3><p class="muted">اختر كلمة، استمع إليها، ثم كررها بصوتك.</p><div class="mini-list">${(C.vocab||[]).slice(0,8).map(x=>`<button class="open-resource secondary" onclick="speak(${JSON.stringify(x[0])})">${esc(x[0])} 🔊</button>`).join('')}</div></article></div></section></div>`}
function startAudioGame(){const arr=C.vocab||[];const x=arr[Math.floor(Math.random()*arr.length)];const wrong=arr.filter(y=>y!==x).sort(()=>Math.random()-.5).slice(0,2);const opts=[x,...wrong].sort(()=>Math.random()-.5);$('#audioGame').innerHTML=`<button class="open-resource" onclick="speak(${JSON.stringify(x[0])})">🔊 استمع</button><div class="choices">${opts.map((o,i)=>`<button class="choice" onclick="this.disabled=true;this.classList.add(${o===x?'\'correct\'':'\'wrong\''});toast(${JSON.stringify(o===x?'أحسنت!':'حاول مرة أخرى')})">${esc(o[1])}</button>`).join('')}</div>`}
function startMatchGame(){const arr=(C.vocab||[]).slice(0,6).sort(()=>Math.random()-.5);matchState={a:null,b:null,matched:[]};$('#matchGame').innerHTML='<div class="match-area" id="matchBoard">'+arr.map((x,i)=>`<button class="match-btn" data-a="${i}" onclick="matchPick(this,${i},'a')">${esc(x[0])}</button>`).join('')+arr.map((x,i)=>`<button class="match-btn" data-b="${i}" onclick="matchPick(this,${i},'b')">${esc(x[1])}</button>`).join('')+'</div>'}
function matchPick(btn,i,type){if(btn.classList.contains('matched'))return;btn.classList.add('selected');matchState[type]=i;if(matchState.a!==null&&matchState.b!==null){const all=[...$('#matchBoard').querySelectorAll('.match-btn')];const ok=matchState.a===matchState.b;all.filter(x=>x.classList.contains('selected')).forEach(x=>x.classList.remove('selected'));if(ok){all.filter(x=>x.dataset.a==i||x.dataset.b==i).forEach(x=>x.classList.add('matched'));toast('مطابقة صحيحة ✓')}else toast('حاول مطابقة الكلمة بالمعنى الصحيح');matchState.a=matchState.b=null}}
function startSpeedGame(){const qs=buildAssessment().sort(()=>Math.random()-.5).slice(0,5);let i=0,score=0;function next(){if(i>=qs.length){$('#speedGame').innerHTML=`<b>انتهى التحدي: ${score}/${qs.length}</b><br><button class="open-resource" onclick="startSpeedGame()">جولة جديدة</button>`;return}const q=qs[i];$('#speedGame').innerHTML=`<b>${i+1}. ${esc(q[0])}</b><div class="choices">${q[1].map((o,k)=>`<button class="choice" onclick="${k===q[2]?'score++':''};i++;next()">${esc(o)}</button>`).join('')}</div>`}next()}
function speakAll(){let i=0;const arr=C.vocab||[];function next(){if(i>=arr.length)return;const u=new SpeechSynthesisUtterance(arr[i++][0]);u.lang='fr-FR';u.rate=.82;u.onend=()=>setTimeout(next,350);speechSynthesis.speak(u)}speechSynthesis.cancel();next()}
function renderFiles(){const files=[['lesson','📘','الشرح التفاعلي','كل محتوى الدرس في الصفحة نفسها: صور مرتبطة، نطق، شرح، أمثلة وتدريب.'],['reference','📄','المرجع التعليمي','مفردات + قواعد + أمثلة بصيغة مراجعة مركزة.'],['assessment','📝','التقييم المستقل','10 أسئلة لقياس الإتقان دون تغيير إكمال الدرس.'],['games','🎮','الألعاب التعليمية','استماع، مطابقة، تحدي سرعة ومختبر نطق.']];return `<div id="view-files" class="view"><section class="card"><h2>📚 مركز ملفات الدرس</h2><p class="muted">هذه الملفات ليست روابط فارغة ولا صفحات داخل صفحات. كل مورد يفتح داخل نفس تجربة Premium مع الحفاظ على سياق الدرس.</p><div class="resource-grid">${files.map(x=>`<article class="resource"><h3>${x[0]==='lesson'?'📘':x[0]==='reference'?'📄':x[0]==='assessment'?'📝':'🎮'} ${x[2]}</h3><p class="muted">${x[3]}</p><div class="resource-actions"><button class="open-resource" onclick="setActive('${x[0]}')">فتح داخل الدرس ↗</button><button class="open-resource secondary" onclick="toast('هذا المورد يعمل داخل الصفحة الحالية للحفاظ على تجربة Premium')">لماذا هكذا؟</button></div></article>`).join('')}</div></section><section class="card"><h2>✅ اكتمال حزمة الدرس</h2><div class="mini-list"><span class="pill">شرح تفاعلي ✓</span><span class="pill">مرجع تعليمي ✓</span><span class="pill">تقييم ✓</span><span class="pill">ألعاب ✓</span><span class="pill">نطق ✓</span><span class="pill">تقدم وXP ✓</span></div></section></div>`}
function render(){document.querySelector('#app').innerHTML=renderHero()+`<nav class="tabs" aria-label="أقسام الدرس"><button class="tab active" data-view="lesson">📘 الدرس</button><button class="tab" data-view="files">📚 ملفات الدرس</button><button class="tab" data-view="reference">📄 المرجع</button><button class="tab" data-view="games">🎮 الألعاب</button><button class="tab" data-view="assessment">📝 التقييم</button></nav>`+renderLesson()+renderFiles()+renderReference()+renderGames()+renderAssessment()+`<section class="card finish"><div><h3>🏁 إكمال الدرس</h3><div class="muted" id="completeMsg">بعد دراسة المحتوى، سجّل الإنجاز لحفظ رحلتك وإضافة XP.</div></div><button id="finishBtn" onclick="completeLesson()">تم الانتهاء من الدرس · +50 XP</button></section><div class="back" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><a href="grade-8.html">← العودة إلى الصف</a><a href="course.html">📚 المناهج الدراسية</a><a href="dashboard.html">📈 لوحة الطالب</a></div>`;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setActive(b.dataset.view));syncComplete();try{HMProgress.startLesson(ID)}catch(e){}}
function completeLesson(){if(window.markLessonComplete)window.markLessonComplete(ID,'lesson-finish','premium');else if(window.HMComplete?.complete)HMComplete.complete(ID,50);syncComplete();toast('تم حفظ إكمال الدرس وإضافة XP ✓')}
function syncComplete(){const done=(window.HMProgress?.get?.().completedLessons||[]).includes(ID);const b=$('#finishBtn');if(b){b.disabled=done;b.textContent=done?'✅ تم إكمال الدرس':'تم الانتهاء من الدرس · +50 XP'}if($('#completeMsg'))$('#completeMsg').textContent=done?'تم حفظ إنجاز هذا الدرس ضمن رحلة الطالب.':'بعد دراسة المحتوى، سجّل الإنجاز لحفظ رحلتك وإضافة XP.'}
async function boot(){try{const [m,r]=await Promise.all([fetch('data/lessons/premium-course-map.json?v=20260812-premiumlesson1',{cache:'no-store'}),fetch('data/lessons/grade-8/lesson-registry.json?v=20260812-premiumlesson1',{cache:'no-store'})]);MAP=await m.json();REG=await r.json();lessonData();render();const req=new URLSearchParams(location.search).get('section');if(['lesson','files','reference','games','assessment'].includes(req))setActive(req)}catch(e){console.error(e);document.querySelector('#app').innerHTML='<section class="card"><h2>تعذر تحميل الدرس</h2><p class="muted">لم يتم تغيير محتوى المنهج. أعد تحميل الصفحة بعد اكتمال تحديث GitHub Pages.</p></section>'}}
window.addEventListener('hm:languagechange',()=>{if(C)render()});window.addEventListener('hm:progress-updated',syncComplete);boot();
</script>
</body></html>
