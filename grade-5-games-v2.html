<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="cache-control" content="no-store"><title>HM Academy | مركز ألعاب الدرس</title><style>body{margin:0;background:#f4f7fc;color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:980px;margin:auto;padding:16px}.hero,.panel{background:#fff;border:1px solid #dfe6f2;border-radius:24px;padding:22px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#173a82,#2563eb 58%,#713bd1);color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:12px;border-radius:14px;background:#ffffff18;text-align:center}.stat b{display:block;font-size:24px}.game{display:none}.game.active{display:block}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.option,.btn{padding:13px;border-radius:13px;border:1px solid #d5ddea;background:#fff;font-weight:800;cursor:pointer}.btn{background:#2563eb;color:#fff;border:0}.feedback{min-height:28px;margin:12px 0;font-weight:900}.progress{height:9px;background:#e8edf5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#2563eb}.hidden{display:none}.tag{font-weight:900;color:#2451a0}.result{text-align:center}@media(max-width:650px){.stats,.options{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><h1 id="title">🎮 مركز الألعاب</h1><p id="desc">ألعاب مستقلة مرتبطة بهذا الدرس فقط.</p><div class="stats"><div class="stat"><b id="xp">0</b>XP</div><div class="stat"><b id="done">0</b> / 6</div><div class="stat"><b>6</b> ألعاب مختلفة</div></div></section><section class="panel"><div class="progress"><i id="bar"></i></div><div id="app">جاري تحميل بيانات الدرس…</div></section></main><script>(async()=>{const id=new URLSearchParams(location.search).get('id');if(!id){document.getElementById('app').textContent='معرّف الدرس غير موجود.';return}const data=await fetch('data/lessons/grade-5/lesson-studio-content.json?v=games-v2').then(r=>r.json());const root=data.content?JSON.parse(data.content):data;const L=root.lessons?.[id];if(!L){document.getElementById('app').textContent='بيانات هذا الدرس غير موجودة.';return}document.title='HM Academy | مركز الألعاب · '+L.titleFr;document.getElementById('title').textContent='🎮 مركز الألعاب · '+L.titleFr;document.getElementById('desc').textContent='6 ألعاب تطبيقية مستقلة مبنية على محتوى هذا الدرس فقط.';const vocab=L.vocabulary||[],examples=L.grammar?.examples||[],practice=L.practice||[];const pool=[...practice];while(pool.length<6&&examples.length)pool.push({q:'اختر المثال الصحيح من أمثلة الدرس.',options:examples.map(x=>x.fr),answer:examples[0].fr});while(pool.length<6&&vocab.length)pool.push({q:'ما معنى «'+vocab[0].word+'»؟',options:[vocab[0].meaning,'خيار غير صحيح','خيار آخر'],answer:vocab[0].meaning});const make=(i)=>{const p=pool[i%pool.length]||{q:'راجع قاعدة الدرس.',options:['الإجابة الصحيحة','إجابة أخرى','إجابة ثالثة'],answer:'الإجابة الصحيحة'};let opts=[...(p.options||[])];if(!opts.length)opts=[p.answer,'إجابة أخرى','إجابة ثالثة'];while(opts.length<3)opts.push('خيار إضافي');return {name:['🎯 صائد المفهوم','⚡ التحدي السريع','🧠 ذاكرة الدرس','🧩 بناء الإجابة','🔎 مكتشف المثال','🏆 سباق الإتقان'][i],q:p.q,o:opts.slice(0,3),a:p.answer}};const games=Array.from({length:6},(_,i)=>make(i));let i=0,xp=0,done=0;function draw(){const g=games[i];document.getElementById('app').innerHTML='<div class="tag">اللعبة '+(i+1)+' من 6 · '+g.name+'</div><h2>'+g.q+'</h2><div class="options">'+g.o.map(o=>'<button class="option" data-v="'+o.replace(/"/g,'&quot;')+'">'+o+'</button>').join('')+'</div><div class="feedback"></div><button class="btn hidden" id="next">'+(i===5?'إنهاء المركز':'اللعبة التالية ←')+'</button>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{document.querySelectorAll('.option').forEach(x=>x.disabled=true);const ok=b.dataset.v===g.a;if(ok)xp+=10;done++;document.getElementById('xp').textContent=xp;document.getElementById('done').textContent=done;document.getElementById('bar').style.width=(done/6*100)+'%';document.querySelector('.feedback').textContent=ok?'✓ إجابة صحيحة':'✗ إجابة غير صحيحة — انتقل للتحدي التالي.';document.getElementById('next').classList.remove('hidden')});document.getElementById('next').onclick=()=>{if(i<5){i++;draw()}else finish()}}function finish(){document.getElementById('bar').style.width='100%';document.getElementById('app').innerHTML='<div class="result"><div style="font-size:54px">🏆</div><h2>أكملت مركز ألعاب الدرس</h2><p>6 ألعاب مختلفة · '+xp+' XP</p><button class="btn" onclick="location.reload()">إعادة اللعب</button> <a class="btn" href="grade-5-assessment-v2.html?id='+encodeURIComponent(id)+'">📝 التقييم الرسمي</a> <a class="btn" href="grade-5-lesson-v3.html?id='+encodeURIComponent(id)+'&section=overview">← العودة للدرس</a></div>'}draw()})().catch(e=>document.getElementById('app').textContent='تعذر تحميل بيانات الدرس.');</script></body></html>
