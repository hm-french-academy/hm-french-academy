<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="cache-control" content="no-store"><title>HM Academy | مركز ألعاب الدرس</title><style>body{margin:0;background:#f4f7fc;color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:980px;margin:auto;padding:16px}.hero,.panel{background:#fff;border:1px solid #dfe6f2;border-radius:24px;padding:22px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#173a82,#2563eb 58%,#713bd1);color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:12px;border-radius:14px;background:#ffffff18;text-align:center}.stat b{display:block;font-size:24px}.options,.cards,.match{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.option,.btn,.card{padding:13px;border-radius:13px;border:1px solid #d5ddea;background:#fff;font-weight:800;cursor:pointer}.btn{background:#2563eb;color:#fff;border:0;text-decoration:none}.card{min-height:80px}.feedback{min-height:28px;margin:12px 0;font-weight:900}.progress{height:9px;background:#e8edf5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#2563eb}.hidden{display:none}.tag{font-weight:900;color:#2451a0}.result{text-align:center}.order{display:flex;gap:8px;flex-wrap:wrap;min-height:52px;border:2px dashed #cbd5e1;border-radius:15px;padding:10px;margin:12px 0}.chip{padding:9px 12px;border-radius:10px;background:#eef3ff;font-weight:900}.memory{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.memory .card{font-size:22px}.good{border-color:#20a45a!important;background:#eaf8f0!important}.bad{border-color:#d14b4b!important;background:#fff0f0!important}@media(max-width:650px){.stats,.options,.cards,.match{grid-template-columns:1fr}.memory{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><section class="hero"><h1 id="title">🎮 مركز الألعاب</h1><p>ست ألعاب مختلفة فعلًا، وكلها مرتبطة بالدرس الحالي فقط.</p><div class="stats"><div class="stat"><b id="xp">0</b>XP</div><div class="stat"><b id="done">0</b> / 6</div><div class="stat"><b>6</b> ألعاب</div></div></section><section class="panel"><div class="progress"><i id="bar"></i></div><div id="app">جاري تحميل بيانات الدرس…</div></section></main><script>(async()=>{const id=new URLSearchParams(location.search).get('id');const raw=await fetch('data/lessons/grade-5/lesson-studio-content.json?v=games-v3',{cache:'no-store'}).then(r=>r.json());const root=raw.content?JSON.parse(raw.content):raw,L=root.lessons?.[id];if(!L){app.textContent='بيانات هذا الدرس غير موجودة.';return}title.textContent='🎮 مركز الألعاب · '+L.titleFr;const V=L.vocabulary||[],E=L.grammar?.examples||[],P=L.practice||[],R=L.grammar?.miniRule||'';const base=E.length?E.map(x=>x.fr):V.map(x=>x.word);function q(i){return P[i%P.length]||{q:'اختر المثال الصحيح من أمثلة الدرس.',options:[...(base.slice(0,3))],answer:base[0]}}let game=0,xp=0,done=0;const modes=['🎯 صائد الإجابة','⚡ صح أم خطأ','🧠 ذاكرة المفردات','🧩 مهندس الجملة','🔎 مكتشف المثال','🏆 سباق القاعدة'];function score(ok){if(ok)xp+=10;done++;document.getElementById('xp').textContent=xp;document.getElementById('done').textContent=done;document.getElementById('bar').style.width=(done/6*100)+'%'}function next(){game++;if(game>=6)finish();else draw()}function shell(name,body){app.innerHTML='<div class="tag">اللعبة '+(game+1)+' من 6 · '+name+'</div>'+body+'<div class="feedback" id="fb"></div><button class="btn hidden" id="next">'+(game===5?'إنهاء المركز':'اللعبة التالية ←')+'</button>';next.onclick=next}function draw(){const p=q(game);if(game===0){shell(modes[0],'<h2>'+p.q+'</h2><div class="options">'+p.options.map(o=>'<button class="option">'+o+'</button>').join('')+'</div>');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(b.textContent===p.answer,b))}else if(game===1){const statement=p.q;const truth=Math.random()>.5;const shown=truth?statement:statement.replace(p.answer,p.options.find(x=>x!==p.answer)||'');shell(modes[1],'<h2>'+shown+'</h2><div class="options"><button class="option" data-v="true">صحيح</button><button class="option" data-v="false">خطأ</button></div>');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer((b.dataset.v==='true')===truth,b))}else if(game===2){const words=V.slice(0,3);shell(modes[2],'<h2>اضغط بطاقة الكلمة التي يطابق معناها التعريف المعروض.</h2><p>'+((words[0]&&words[0].meaning)||'راجع مفردات الدرس')+'</p><div class="memory">'+words.map(v=>'<button class="card" data-w="'+v.word+'">❓</button>').join('')+'</div>');document.querySelectorAll('.card').forEach((b,i)=>b.onclick=()=>{b.textContent=words[i].word;answer(i===0,b)})}else if(game===3){const ex=E[0],parts=ex?.parts||[];const target=parts.join('|');shell(modes[3],'<h2>رتّب عناصر الجملة حسب نموذج الدرس.</h2><div class="order" id="ord"></div><div class="cards">'+parts.map(x=>'<button class="card" data-x="'+x+'">'+x+'</button>').join('')+'</div>');let got=[];document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{got.push(b.dataset.x);b.disabled=true;ord.innerHTML=got.map(x=>'<span class="chip">'+x+'</span>').join('');if(got.length===parts.length)answer(got.join('|')===target,b)})}else if(game===4){const choices=E.slice(0,3);const correct=choices[0]?.fr||base[0]||'';shell(modes[4],'<h2>أي جملة صحيحة وفق أمثلة هذا الدرس؟</h2><div class="options">'+choices.map(x=>'<button class="option" data-x="'+x.fr+'">'+x.fr+'</button>').join('')+'</div>');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(b.dataset.x===correct,b))}else{shell(modes[5],'<h2>اختر القاعدة/النموذج الأساسي للدرس.</h2><div class="options"><button class="option" data-x="'+R+'">'+(R||L.titleFr)+'</button><button class="option">معلومة من درس آخر</button><button class="option">خيار غير مرتبط</button></div>');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(b.dataset.x===R,b))}}function answer(ok,b){document.querySelectorAll('.option,.card').forEach(x=>x.disabled=true);if(b)b.classList.add(ok?'good':'bad');fb.textContent=ok?'✓ صحيح':'✗ غير صحيح';score(ok);next.classList.remove('hidden')}function finish(){bar.style.width='100%';app.innerHTML='<div class="result"><div style="font-size:54px">🏆</div><h2>أكملت مركز ألعاب «'+L.titleFr+'»</h2><p>6 ألعاب مختلفة · '+xp+' XP</p><button class="btn" onclick="location.reload()">إعادة اللعب</button> <a class="btn" href="grade-5-assessment-v2.html?id='+encodeURIComponent(id)+'">📝 التقييم الرسمي</a> <a class="btn" href="grade-5-lesson-v3.html?id='+encodeURIComponent(id)+'&section=overview">← العودة للدرس</a></div>}draw()})().catch(()=>app.textContent='تعذر تحميل بيانات الدرس.');</script></body></html>
