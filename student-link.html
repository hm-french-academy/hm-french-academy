<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HM Academy — دخول الطالب</title>
<link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:linear-gradient(145deg,#f5f8fc,#fff);color:#172b4d}
main{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(520px,100%);background:#fff;border:1px solid #e5eaf1;border-radius:24px;padding:32px;box-shadow:0 18px 55px rgba(23,43,77,.10);text-align:center}
.logo{width:70px;height:70px;object-fit:contain;margin:0 auto 12px}
h1{margin:0 0 8px;font-size:26px}p{color:#667085;line-height:1.8;margin:8px 0 22px}
input{width:100%;padding:15px 16px;border:1px solid #ccd5e2;border-radius:13px;font-size:18px;text-align:center;direction:ltr;text-transform:uppercase;outline:none}
input:focus{border-color:#1f5d9b;box-shadow:0 0 0 3px rgba(31,93,155,.10)}
button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:13px;background:#1f5d9b;color:#fff;font-size:17px;font-weight:700;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}
.status{min-height:28px;margin-top:15px;font-size:14px;color:#b42318}
.status.ok{color:#087443}.hidden{display:none}
.lessons{display:grid;gap:10px;margin-top:18px}.lesson{padding:14px;border:1px solid #dce4ee;border-radius:13px;background:#f8fafc;cursor:pointer;font-size:16px}
.small{font-size:13px;color:#98a2b3;margin-top:18px}.actions{display:grid;gap:9px;margin-top:14px}.secondary{background:#fff!important;color:#1f5d9b!important;border:1px solid #ccd9e8!important}
</style>
</head>
<body>
<main><section class="card">
<img class="logo" src="assets/images/hm-academy-favicon.svg?v=2" alt="HM Academy">
<h1 id="title">دخول الطالب</h1>
<p id="hint">أدخل كود الطالب المخصص لك لفتح الدرس.</p>
<form id="form">
<input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="HM-XXXXXXXX" aria-label="كود الطالب">
<button id="enter" type="submit">دخول</button>
</form>
<div id="status" class="status" role="alert"></div>
<div id="lessons" class="lessons hidden"></div><div id="actions" class="actions hidden"><button id="resume" type="button" class="secondary">▶ متابعة الدرس الحالي</button><button id="logout" type="button" class="secondary">🚪 تسجيل الخروج</button></div>
<div class="small">HM Academy · الوصول المخصص للطلاب</div>
</section></main>
<script>
const API='https://yvoprtjyxmurvcsaqsny.supabase.co/functions/v1/student-code-login';
const params=new URLSearchParams(location.search);const target=params.get('lesson')||'';const switchMode=params.get('switch')==='1';const logoutMode=params.get('logout')==='1';
const $=id=>document.getElementById(id);
const status=$('status'), form=$('form'), input=$('code'), enter=$('enter'), lessonsBox=$('lessons');

function deviceId(){
  let id=localStorage.getItem('hm_student_browser_id');
  if(!id){
    id=(crypto.randomUUID?crypto.randomUUID():('web-'+Date.now()+'-'+Math.random().toString(36).slice(2)));
    localStorage.setItem('hm_student_browser_id',id);
  }
  return id;
}
function msg(t,ok=false){status.textContent=t;status.className='status'+(ok?' ok':'');}
function lessonUrl(id){
  localStorage.setItem('hm_student_current_lesson',id);
  // Route every student lesson through the canonical lesson router.
  // The router maps each lesson ID to its own grade-specific Learning Studio.
  return 'lesson.html?id='+encodeURIComponent(id)+'&v=20260831-content-polish&section=lesson&student=1';
}
function showLessons(name,list){
  form.classList.add('hidden'); $('hint').textContent='مرحبًا '+name+' — اختر الدرس المسموح لك.';
  lessonsBox.innerHTML='';
  list.forEach(id=>{
    const b=document.createElement('button'); b.type='button'; b.className='lesson'; b.textContent='فتح الدرس: '+id;
    b.onclick=()=>location.replace(lessonUrl(id)); lessonsBox.appendChild(b);
  });
  lessonsBox.classList.remove('hidden'); msg('',true);
}
function showResume(name=''){
  const current=localStorage.getItem('hm_student_current_lesson');
  const actions=document.getElementById('actions');
  if(name){
    $('title').textContent='مرحبًا بك، '+name+' 👋';
    $('hint').innerHTML='<b>HM Academy ترحب بك</b><br><span dir="ltr">Bienvenue à HM Academy</span><br><small style="color:#98a2b3">يسعدنا أن نكمل معك رحلة تعلّم الفرنسية · <span dir="ltr">Nous sommes heureux de poursuivre votre parcours en français.</span></small><br><span style="display:inline-block;margin-top:10px;color:#1f5d9b;font-weight:700;font-size:13px">— Monsieur Hatem ElMorsi</span>';
  }
  if(!current){actions.classList.remove('hidden');document.getElementById('resume').disabled=true;return;}
  actions.classList.remove('hidden');
  document.getElementById('resume').disabled=false;
  document.getElementById('resume').onclick=()=>location.replace(lessonUrl(current));
  document.getElementById('logout').onclick=()=>{localStorage.removeItem('hm_student_code');localStorage.removeItem('hm_student_current_lesson');localStorage.removeItem('hm_student_name');location.replace('student-link.html?logout=1')};
}
async function validate(code,silent=false,requestedLesson=''){
  enter.disabled=true;
  if(!silent) msg('جارٍ التحقق من الكود…');
  try{
    const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,device_id:deviceId(),lesson_id:requestedLesson||undefined})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok || !data.ok){
      const e=data.error;
      msg(e==='expired'?'انتهت صلاحية الكود.':e==='device_mismatch'?'هذا الكود مرتبط بجهاز آخر.':e==='lesson_not_allowed'?'هذا الدرس غير مسموح لهذا الطالب.':e==='no_lessons'?'الكود صحيح ولكن لا توجد دروس مسموحة.':'كود الطالب غير صحيح أو غير مفعل.');
      localStorage.removeItem('hm_student_code');
      enter.disabled=false; return;
    }
    localStorage.setItem('hm_student_code',code);
    if(data.student_name) localStorage.setItem('hm_student_name',data.student_name);
    if(requestedLesson){
      localStorage.setItem('hm_student_current_lesson',requestedLesson);
      form.classList.add('hidden');
      showResume(data.student_name||localStorage.getItem('hm_student_name')||'');
      msg('مرحبًا بك! تم التحقق من الكود بنجاح.',true);
      enter.disabled=false;
      return;
    }
    const current=localStorage.getItem('hm_student_current_lesson');
    if(!switchMode&&current&&Array.isArray(data.allowed_lessons)&&data.allowed_lessons.includes(current)){
      // لا تنتقل تلقائيًا: أعطِ الطالب فرصة للاختيار.
      form.classList.add('hidden');
      $('title').textContent='جلسة الطالب';
      $('hint').textContent='تم التحقق من الكود. اختر ما تريد فعله:';
      showResume(data.student_name||localStorage.getItem('hm_student_name')||'');
      msg('تم التحقق من الكود بنجاح.',true);
      enter.disabled=false;
      return;
    }
    if(data.allowed_lessons.length===1){
      localStorage.setItem('hm_student_current_lesson',data.allowed_lessons[0]);
      form.classList.add('hidden');
      showResume(data.student_name||localStorage.getItem('hm_student_name')||'');
      msg('مرحبًا بك! تم التحقق من الكود بنجاح.',true);
      enter.disabled=false;
      return;
    }
    showLessons(data.student_name||'الطالب',data.allowed_lessons);
    enter.disabled=false;
  }catch(e){
    msg('تعذر الاتصال بخدمة التحقق. تأكد من الإنترنت ثم حاول مرة أخرى.');
    enter.disabled=false;
  }
}
form.addEventListener('submit',e=>{e.preventDefault();const c=input.value.trim().toUpperCase();if(!c)return msg('اكتب كود الطالب أولًا.');localStorage.removeItem('hm_student_current_lesson');validate(c,false,target)});
if(logoutMode){$('title').textContent='تم تسجيل الخروج';$('hint').textContent='تم إنهاء جلسة الطالب على هذا الجهاز. يمكنك إدخال كود جديد.';msg('تم تسجيل الخروج بنجاح.',true)}
if(switchMode){$('title').textContent='دخول درس آخر';$('hint').textContent='أدخل كود الدرس الجديد. سيحل محل الدرس الحالي على هذا الجهاز.'}
if(switchMode||logoutMode)showResume(localStorage.getItem('hm_student_name')||'');
const saved=localStorage.getItem('hm_student_code');
if(saved&&!switchMode&&!logoutMode){
  // لا تفتح الدرس تلقائيًا. تحقق من الكود ثم اعرض خيارات الجلسة.
  validate(saved,true,'');
}
</script>
</body>
</html>
