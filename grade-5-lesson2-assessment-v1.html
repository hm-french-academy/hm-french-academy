<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="cache-control" content="no-cache,no-store,must-revalidate"><title>HM Academy | تقييم الدرس الثاني · Les déterminants</title><style>body{margin:0;background:#f5f8ff;font-family:Arial,Cairo,sans-serif;color:#17223b}.wrap{max-width:900px;margin:auto;padding:18px 14px 60px}.top{display:flex;justify-content:space-between;background:#fff;border:1px solid #dfe6f2;border-radius:18px;padding:12px 16px}.a,.btn{padding:11px 15px;border-radius:12px;text-decoration:none;font-weight:900}.a{color:#14264a}.btn{background:#2563eb;color:#fff;border:0;cursor:pointer}.hero{margin-top:16px;padding:28px;border-radius:28px;background:linear-gradient(135deg,#0f766e,#2563eb);color:#fff}.panel{margin-top:18px;background:#fff;border:1px solid #dfe6f2;border-radius:24px;padding:24px}.q{padding:18px 0;border-bottom:1px solid #e9eef5}.q b{display:block;font-size:18px;line-height:1.8;margin-bottom:10px}.opts{display:grid;gap:8px}.opt{padding:12px;border:1px solid #d5ddea;border-radius:12px;background:#fff;text-align:right;font-weight:800;cursor:pointer}.opt.selected{border-color:#2563eb;background:#eef4ff}.submit{margin-top:20px}.result{margin-top:20px;padding:22px;border-radius:18px;background:#ecfbf7;text-align:center;font-size:20px;font-weight:900}@media(max-width:650px){.top{display:block}}</style></head><body><main class="wrap"><header class="top"><a class="a" href="grade-5-lesson-v3.html?id=g5-t1-l02&section=overview">HM 🇫🇷 ACADEMY</a><a class="btn" href="grade-5-lesson-v3.html?id=g5-t1-l02&section=games">🎮 الألعاب</a></header><section class="hero"><h1>📝 التقييم الرسمي · Les déterminants</h1><p>تقييم مستقل للدرس الثاني فقط: أدوات التنكير والتعريف، الجنس والعدد.</p></section><section class="panel"><div id="test"></div><button class="btn submit" id="submit">إنهاء التقييم</button><div id="result"></div></section></main><script>(function(){const qs=[['اختر الأداة الصحيحة: ___ stylo',['un','une','des'],'un'],['اختر الأداة الصحيحة: ___ gomme',['un','une','des'],'une'],['اختر الأداة الصحيحة: ___ stylos',['un','une','des'],'des'],["اختر الأداة الصحيحة: ___ animal",['le','l’','les'],'l’'],['أي مثال صحيح؟',['un stylo','une stylo','des stylo'],'un stylo'],['أي مجموعة كلها أدوات تعريف؟',['le · la · les','un · une · des','une · des · un'],'le · la · les'],['أي مجموعة كلها أدوات تنكير؟',['un · une · des','le · la · les','l’ · les · la'],'un · une · des'],['ما الأداة المناسبة للاسم المذكر المفرد؟',['un','une','des'],'un'],['ما الأداة المناسبة للاسم المؤنث المفرد؟',['un','une','des'],'une'],['ما الأداة المناسبة للجمع في الأمثلة؟',['des','une','un'],'des']];const t=document.getElementById('test');t.innerHTML=qs.map((x,i)=>'<div class="q"><b>'+String(i+1)+'. '+x[0]+'</b><div class="opts">'+x[1].map(o=>'<button class="opt" data-i="'+i+'" data-v="'+o+'">'+o+'</button>').join('')+'</div></div>').join('');const ans={};t.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=b.dataset.i;ans[i]=b.dataset.v;t.querySelectorAll('.opt[data-i="'+i+'"]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});document.getElementById('submit').onclick=()=>{let score=0;qs.forEach((q,i)=>{if(ans[i]===q[2])score++});const pct=Math.round(score/qs.length*100);document.getElementById('result').innerHTML='<div class="result">النتيجة: '+score+' / '+qs.length+' ('+pct+'%)<br><small>هذا التقييم مرتبط بالدرس الثاني فقط ولا يستخدم بنك أسئلة الدرس الأول.</small></div>';document.getElementById('submit').disabled=true}})();</script></body></html>
