<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><title>HM Academy | المراجعة الذكية</title><link rel="stylesheet" href="css/premium-shell.css"><style>body{background:#f5f7fb}.wrap{max-width:900px;margin:auto;padding:28px 16px}.hero,.card{background:#fff;border:1px solid #e1e7f0;border-radius:24px;padding:22px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#173a82,#2563eb);color:#fff}.btn{border:0;background:#2563eb;color:#fff;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer;margin:5px;text-decoration:none}.options{display:grid;gap:10px}.option{border:1px solid #dce3ee;background:#fff;border-radius:14px;padding:13px;text-align:right;cursor:pointer;font-weight:800}.option.correct{border-color:#20a45a;background:#ecfdf3}.option.wrong{border-color:#e92d83;background:#fff2f8}.result{font-weight:900;margin-top:12px}.mode{display:inline-block;padding:8px 11px;border-radius:10px;background:#edf3ff;color:#315aa4;font-weight:900}.muted{color:#66738a;line-height:1.8}</style></head><body><main class="wrap"><section class="hero"><h1>🧠 المراجعة الذكية</h1><p>المراجعة المستقلة الخاصة بكل درس.</p></section><section class="card" id="app">جارٍ تحميل المراجعة…</section></main><script>(async function(){const p=new URLSearchParams(location.search),id=p.get('lesson')||'';if(id==='g4-l02'){location.replace('grade-4-l02-smart-review.html');return}if(id==='g4-l01'){location.replace('grade-4-l01-smart-review.html');return}if(!/^grade8-u[1-3]-l[1-4]$/.test(id)){document.getElementById('app').innerHTML='<p>جارٍ فتح المراجعة الذكية…</p><a class="btn" href="grade-8.html">العودة</a>';return}const m=id.match(/^grade8-u(\d+)-l(\d+)$/),u=m[1],l=m[2],url=`data/lessons/grade-8/unit-${u}/lesson-${l}.json?ts=${Date.now()}`;let d;try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw 0;d=await r.json()}catch(e){document.getElementById('app').innerHTML='<p>تعذر تحميل بيانات المراجعة لهذا الدرس.</p><a class="btn" href="grade8-premium-studio.html?id='+id+'">العودة إلى الدرس</a>';return}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const source=[...(d.practice||[]),...((d.assessment||{}).questions||[])];const questions=[];const seen=new Set();for(const q of source){const key=JSON.stringify([q.question,q.options,q.answer??q.correct]);if(!seen.has(key)&&q.options?.length){seen.add(key);questions.push(q)}}const qs=questions.slice(0,10);let score=0,answered=0;const app=document.getElementById('app');app.innerHTML=`<h2>${esc(d.title||'مراجعة الدرس')}</h2><div class="mode">الدرس: ${esc(d.unit||'HM Academy')}</div><p class="muted">مراجعة قصيرة مستقلة مبنية على محتوى هذا الدرس فقط. أجب عن الأسئلة ثم راجع نتيجتك.</p><div id="questions"></div><div class="result" id="result"></div><a class="btn" href="grade8-premium-studio.html?id=${id}">↩ العودة إلى واجهة الدرس</a>`;const box=document.getElementById('questions');if(!qs.length){box.innerHTML='<div class="muted">لا توجد أسئلة مراجعة مسجلة لهذا الدرس بعد.</div>';return}const check=(btn,q,answer)=>{if(btn.disabled)return;const correct=(q.answer??q.correct);[...btn.parentElement.children].forEach(x=>x.disabled=true);if(answer===correct){btn.classList.add('correct');score++}else{btn.classList.add('wrong');const all=[...btn.parentElement.children];all.forEach(x=>{if(Number(x.dataset.index)===Number(correct))x.classList.add('correct')})}answered++;if(answered===qs.length)document.getElementById('result').textContent=`🏆 نتيجتك: ${score} / ${qs.length} — ${score===qs.length?'ممتاز!':'راجع الإجابات ثم أعد المحاولة.'}`};box.innerHTML=qs.map((q,i)=>`<article class="card"><b>${i+1}. ${esc(q.question||'')}</b><div class="options">${(q.options||[]).map((o,j)=>`<button class="option" data-index="${j}">${esc(o)}</button>`).join('')}</div></article>`).join('');box.querySelectorAll('.card').forEach((card,i)=>card.querySelectorAll('.option').forEach((btn,j)=>btn.onclick=()=>check(btn,qs[i],j)));})()</script></body></html>
