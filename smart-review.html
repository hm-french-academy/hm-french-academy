<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | المراجعة الذكية</title><link rel="stylesheet" href="css/premium-shell.css"><style>body{background:#f5f7fb}.wrap{max-width:900px;margin:auto;padding:28px 16px}.hero,.card{background:#fff;border:1px solid #e1e7f0;border-radius:24px;padding:22px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#173a82,#2563eb);color:#fff}.word{font-size:30px;font-weight:900}.pic{display:flex;justify-content:center;align-items:center;min-height:150px;margin-bottom:14px;background:#f7f9fd;border-radius:18px}.pic img{display:block;width:min(320px,72vw);height:150px;object-fit:contain;border-radius:18px}.pic .emoji{font-size:76px}.example{margin:14px 0;padding:14px;border-radius:16px;background:#f7f9fc;line-height:1.8}.btn{border:0;background:#2563eb;color:#fff;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer;margin:5px}.options{display:grid;gap:10px}.option{border:1px solid #dce3ee;background:#fff;border-radius:14px;padding:13px;text-align:right;cursor:pointer}.result{font-weight:900;margin-top:12px}.mode{display:inline-block;padding:8px 11px;border-radius:10px;background:#edf3ff;color:#315aa4;font-weight:900}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="dashboard.html">الطالب</a><a href="student-vocabulary.html">قاموسي</a><a href="academy-map.html">خريطة المنصة</a></nav></header><main class="wrap"><section class="hero"><h1>🧠 المراجعة الذكية</h1><p id="intro">جارٍ تحليل مهارة الدرس…</p></section><section class="card" id="app">جارٍ تحميل المراجعة…</section></main><script src="scripts/smart-review.js?v=20260822-smart3"></script><script>(async function(){const p=new URLSearchParams(location.search);let lessonId=p.get('lesson')||'grade8-u1-l1';const short=lessonId.match(/^u(\d+)-l(\d+)$/);if(short)lessonId='grade8-u'+short[1]+'-l'+short[2];const gm=lessonId.match(/^grade8-u(\d+)-l(\d+)$/),app=document.getElementById('app');if(!gm){app.innerHTML='<p>معرف درس غير صالح للمراجعة الذكية.</p>';return}const u=gm[1],l=gm[2];let data;try{const r=await fetch('data/lessons/grade-8/unit-'+u+'/lesson-'+l+'.json?v=20260822-smart3',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);data=await r.json();for(let n=0;n<4&&data&&typeof data.content==='string';n++)data=JSON.parse(data.content);if(!data||data.id!==lessonId)throw new Error('Lesson ID mismatch: '+lessonId)}catch(e){app.innerHTML='<p>تعذر تحميل بيانات المراجعة.</p><small>'+String(e.message||e).replace(/[<>]/g,'')+'</small>';return}const grammar=Array.isArray(data.practice)?data.practice.filter(q=>q&&Array.isArray(q.options)&&typeof q.answer==='number'):[],assessment=Array.isArray(data.assessment?.questions)?data.assessment.questions.filter(q=>q&&Array.isArray(q.options)&&typeof q.answer==='number'):[],vocab=Array.isArray(data.vocabulary)?data.vocabulary.map(x=>({word:x.word||'',translation:x.translation||'',image:x.image||'',example:x.example||''})).filter(x=>x.word&&x.translation):[];const title=data.titleAr||data.title||lessonId;const grammarTitle=data.grammar?.title||'';const grammarHeavy=!!grammarTitle&&grammar.length>=3;document.getElementById('intro').innerHTML=String(title).replace(/[<>]/g,'')+' · <span class="mode">'+(grammarHeavy?'مراجعة القواعد والتدريب أولًا':'مراجعة مختلطة حسب نقاط الضعف')+'</span>';let pool,kind;if(grammarHeavy){pool=[...grammar,...assessment];kind='grammar'}else{pool=[...assessment,...grammar,...vocab.map(v=>({question:'ما معنى: '+v.word+' ؟',options:[v.translation,...vocab.filter(x=>x.word!==v.word).slice(0,2).map(x=>x.translation)],answer:0,word:v.word}))];kind='lesson'}if(!window.HMSmartReview){app.innerHTML='<p>تعذر تشغيل محرك المراجعة الذكية.</p>';return}const chosen=HMSmartReview.select(pool,Math.min(10,pool.length),lessonId,kind);let i=0,score=0;function speak(t){if('speechSynthesis'in window&&t){speechSynthesis.cancel();const z=new SpeechSynthesisUtterance(t);z.lang='fr-FR';z.rate=.84;speechSynthesis.speak(z)}}function render(){if(i>=chosen.length){app.innerHTML='<h2>🎉 انتهت المراجعة</h2><p>نتيجتك: '+score+' / '+chosen.length+'</p><a class="btn" href="lesson.html?id='+encodeURIComponent(lessonId)+'&section=overview">العودة إلى الدرس</a><a class="btn" href="grade-8.html">العودة إلى الصف</a>';return}const q=chosen[i];if(q.options){const opts=[...q.options].sort(()=>Math.random()-.5);app.innerHTML='<div class="mode">'+(grammarHeavy?'Grammar & Practice':'Lesson Review')+'</div><h2>'+String(q.question||'').replace(/[<>]/g,'')+'</h2><div class="options">'+opts.map(o=>'<button class="option">'+String(o).replace(/[<>]/g,'')+'</button>').join('')+'</div><div class="result" id="r"></div>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{const ok=b.textContent===String(q.options[q.answer]);HMSmartReview.mark(q.id||q.question,ok,lessonId,kind);if(ok)score++;document.getElementById('r').textContent=ok?'✅ إجابة صحيحة':'❌ سنعيد هذه المهارة إلى قائمة المراجعة';setTimeout(()=>{i++;render()},600)})}else{app.innerHTML='<div class="pic"><span class="emoji">'+(q.image||'🖼️')+'</span></div><div class="word">'+String(q.word||'').replace(/[<>]/g,'')+' <button class="btn" id="speakWord">🔊</button></div><div>اختر المعنى الصحيح</div><div class="example">'+String(q.example||'').replace(/[<>]/g,'')+'</div><div class="options">'+vocab.filter(x=>x.word!==q.word).slice(0,3).concat([q]).sort(()=>Math.random()-.5).map(o=>'<button class="option" data-v="'+String(o.word).replace(/"/g,'&quot;')+'">'+String(o.translation).replace(/[<>]/g,'')+'</button>').join('')+'</div><div class="result" id="r"></div>';document.getElementById('speakWord').onclick=()=>speak(q.word);document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{const ok=b.dataset.v===q.word;HMSmartReview.mark(q.word,ok,lessonId,'vocabulary');if(ok)score++;document.getElementById('r').textContent=ok?'✅ إجابة صحيحة':'❌ سنراجع هذه الكلمة مرة أخرى';setTimeout(()=>{i++;render()},600)})}}render()})().catch(e=>{document.getElementById('app').textContent='تعذر تشغيل المراجعة الذكية.'})</script></body></html>
