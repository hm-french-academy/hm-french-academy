<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | المراجعة الذكية</title><link rel="stylesheet" href="css/premium-shell.css"><style>body{background:#f5f7fb}.wrap{max-width:900px;margin:auto;padding:28px 16px}.hero,.card{background:#fff;border:1px solid #e1e7f0;border-radius:24px;padding:22px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#173a82,#2563eb);color:#fff}.word{font-size:38px;font-weight:900}.pic{display:flex;justify-content:center;align-items:center;min-height:190px;margin-bottom:14px}.pic img{display:block;width:min(320px,72vw);height:190px;object-fit:contain;border-radius:18px}.pic .emoji{font-size:82px}.meaning{font-size:19px;color:#66758a}.example{margin:14px 0;padding:14px;border-radius:16px;background:#f7f9fc;line-height:1.8}.btn{border:0;background:#2563eb;color:#fff;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer;margin:5px}.options{display:grid;gap:10px}.option{border:1px solid #dce3ee;background:#fff;border-radius:14px;padding:13px;text-align:right;cursor:pointer}.result{font-weight:900;margin-top:12px}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="dashboard.html">الطالب</a><a href="student-vocabulary.html">قاموسي</a><a href="academy-map.html">خريطة المنصة</a></nav></header><main class="wrap"><section class="hero"><h1>🧠 المراجعة الذكية</h1><p id="intro">مراجعة كلمات الدرس الذي اخترته، مع أولوية للكلمات التي تحتاج إلى تثبيت.</p></section><section class="card" id="app"></section></main><script src="scripts/smart-review.js"></script><script>const p=new URLSearchParams(location.search),lessonId=p.get('lesson')||'grade8-u1-l1';const fallback=[{word:'une cantine',translation:'مقصف المدرسة',image:'🍽️',example:'Je mange à la cantine.'},{word:'une bibliothèque',translation:'مكتبة',image:'📚',example:"La bibliothèque est à l'école."},{word:'une classe',translation:'فصل دراسي',image:'🏫',example:'Je suis dans la classe.'},{word:'un tableau',translation:'سبورة',image:'🧑‍🏫',example:'Il y a un tableau dans la classe.'},{word:'une cour',translation:'فناء المدرسة',image:'🏫',example:'La cour est grande.'},{word:'un professeur',translation:'معلم',image:'👨‍🏫',example:'Le professeur est dans la classe.'}];let pool=fallback;const path=lessonId.match(/^grade8-u(\d+)-l(\d+)$/)?`data/lessons/grade-8/unit-${RegExp.$1}/lesson-${RegExp.$2}.json`:'';function normalizeImage(value){if(!value||typeof value!=='string')return null;const s=value.trim();if(!s||s.indexOf('<')===0)return null;if(/^https?:\/\//i.test(s)||s.startsWith('/'))return s;if(s.startsWith('assets/'))return s;if(s.match(/\.(svg|png|jpe?g|webp|gif)(\?.*)?$/i))return s.replace(/^\.\//,'');return null}async function load(){if(path)try{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error('lesson fetch '+r.status);let j=await r.json();if(typeof j.content==='string'){try{j=JSON.parse(j.content)}catch(e){}}const v=j.vocabulary||j.lesson?.vocabulary||j.data?.vocabulary;if(Array.isArray(v)&&v.length)pool=v.map(x=>({word:x.word||x.french||x.term,translation:x.translation||x.meaning||x.arabic||'',image:x.image||x.icon||'',example:x.example||x.exampleFr||''})).filter(x=>x.word)}catch(e){console.warn('Smart Review lesson load failed',e)}const chosen=HMSmartReview.select(pool,Math.min(8,pool.length),lessonId);let i=0,score=0;function speak(t){if('speechSynthesis'in window&&t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';speechSynthesis.speak(u)}}function render(){if(i>=chosen.length){app.innerHTML='<h2>🎉 انتهت المراجعة</h2><p>نتيجتك: '+score+' / '+chosen.length+'</p><a class="btn" href="dashboard.html">العودة إلى لوحة الطالب</a>';return}const correct=chosen[i],others=pool.filter(x=>x.word!==correct.word).sort(()=>Math.random()-.5).slice(0,3),opts=[correct,...others].sort(()=>Math.random()-.5),img=normalizeImage(correct.image);app.innerHTML='<div class="pic">'+(img?'<img src="'+img.replace(/"/g,'&quot;')+'" alt="'+String(correct.word).replace(/"/g,'&quot;')+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'">':'')+'<span class="emoji" style="'+(img?'display:none':'')+'">🖼️</span></div><div class="word">'+correct.word+' <button class="btn" id="speakWord">🔊</button></div><div class="meaning">اختر المعنى الصحيح</div><div class="example"><b>مثال:</b> '+(correct.example||'لا يوجد مثال مسجل لهذا الدرس.')+' <button class="btn" id="speakExample">🔊 نطق المثال</button></div><div class="options">'+opts.map(o=>'<button class="option" data-v="'+String(o.word).replace(/"/g,'&quot;')+'">'+(o.translation||o.meaning||'')+'</button>').join('')+'</div><div class="result" id="r"></div>';document.getElementById('speakWord').onclick=()=>speak(correct.word);document.getElementById('speakExample').onclick=()=>speak(correct.example);document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{const ok=b.dataset.v===correct.word;HMSmartReview.mark(correct.word,ok,lessonId);if(ok)score++;document.getElementById('r').textContent=ok?'✅ إجابة صحيحة':'❌ سنراجع هذه الكلمة مرة أخرى';setTimeout(()=>{i++;render()},650)})}render()}load();</script></body></html>
