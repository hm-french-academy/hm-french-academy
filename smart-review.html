<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | المراجعة الذكية</title><link rel="stylesheet" href="css/premium-shell.css"><style>body{background:#f5f7fb}.wrap{max-width:900px;margin:auto;padding:28px 16px}.hero,.card{background:#fff;border:1px solid #e1e7f0;border-radius:24px;padding:22px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#173a82,#2563eb);color:#fff}.word{font-size:42px;font-weight:900}.meaning{font-size:19px;color:#66758a}.btn{border:0;background:#2563eb;color:#fff;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer;margin:5px}.options{display:grid;gap:10px}.option{border:1px solid #dce3ee;background:#fff;border-radius:14px;padding:13px;text-align:right;cursor:pointer}.result{font-weight:900;margin-top:12px}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="dashboard.html">الطالب</a><a href="student-vocabulary.html">قاموسي</a><a href="academy-map.html">خريطة المنصة</a></nav></header><main class="wrap"><section class="hero"><h1>🧠 المراجعة الذكية</h1><p>نراجع الكلمات التي تحتاجها أكثر، اعتمادًا على إجاباتك السابقة.</p></section><section class="card" id="app"></section></main><script src="scripts/smart-review.js"></script><script>const pool=[{word:'école',meaning:'مدرسة'},{word:'classe',meaning:'فصل'},{word:'bibliothèque',meaning:'مكتبة'},{word:'cantine',meaning:'مطعم المدرسة'},{word:'trousse',meaning:'مقلمة'},{word:'livre',meaning:'كتاب'},{word:'maison',meaning:'منزل'},{word:'chambre',meaning:'غرفة'},{word:'cuisine',meaning:'مطبخ'},{word:'train',meaning:'قطار'},{word:'voyage',meaning:'رحلة'},{word:'valise',meaning:'حقيبة سفر'}];const chosen=HMSmartReview.select(pool,6);let i=0,score=0;function render(){if(i>=chosen.length){app.innerHTML='<h2>🎉 انتهت المراجعة</h2><p>نتيجتك: '+score+' / '+chosen.length+'</p><a class="btn" href="dashboard.html">العودة إلى لوحة الطالب</a>';return}const w=chosen[i],correct=pool.find(x=>x.word===(w.word||w));const others=pool.filter(x=>x.word!==correct.word).sort(()=>Math.random()-.5).slice(0,3);const opts=[correct,...others].sort(()=>Math.random()-.5);app.innerHTML='<div class="word">'+correct.word+'</div><div class="meaning">اختر المعنى الصحيح</div><div class="options">'+opts.map(o=>'<button class="option" data-v="'+o.word+'">'+o.meaning+'</button>').join('')+'</div><div class="result" id="r"></div>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{const ok=b.dataset.v===correct.word;HMSmartReview.mark(correct.word,ok);if(ok)score++;document.getElementById('r').textContent=ok?'✅ إجابة صحيحة':'❌ سنراجع هذه الكلمة مرة أخرى';setTimeout(()=>{i++;render()},650)})}render();</script></body></html>
