<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14264a"><title>HM Academy | Le français pour vous | 5e année</title><link rel="stylesheet" href="styles/lesson-premium-visual-v1.css"><style>body{margin:0;background:#f4f7fc;color:#14264a;font-family:Arial,Cairo,sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px 14px}.top{background:#fff;padding:12px 16px;border-bottom:1px solid #dfe6f0;display:flex;justify-content:space-between;align-items:center;gap:14px;position:sticky;top:0;z-index:10}.brand{font-weight:900;text-decoration:none;color:#14264a}.brand span{background:#e62982;color:#fff;padding:10px;border-radius:12px}.nav{display:flex;gap:10px;flex-wrap:wrap}.nav a{color:#315aa4;text-decoration:none;font-weight:900;font-size:13px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff;border-radius:30px;padding:25px;box-shadow:0 18px 45px rgba(37,99,235,.18)}.hero h1{font-size:clamp(30px,6vw,46px);margin:7px 0}.journey,.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0;padding:6px;background:#fff;border:1px solid #dfe6f0;border-radius:18px}.step,.tab{border:1px solid #dfe6f0;background:#fff;color:#536078;padding:11px 14px;border-radius:13px;font-weight:900;white-space:nowrap;cursor:pointer}.step.active,.tab.active{background:#e62982;color:#fff;border-color:#e62982}.panel{background:#fff;border:1px solid #dfe6f0;border-radius:24px;min-height:220px;overflow:hidden}.head{padding:18px;border-bottom:1px solid #edf1f7}.head h2{margin:0}.content{padding:18px}.note{background:#f8faff;border:1px solid #e2e8f2;border-radius:16px;padding:14px;margin-bottom:10px;line-height:1.9}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.vcard{border:1px solid #e1e7f0;border-radius:18px;padding:14px;background:#fff}.vword{direction:ltr;text-align:center;font-size:21px;font-weight:900}.vmean{text-align:center;color:#68758b;font-size:12px;margin:7px}.speak{display:block;margin:8px auto 0;border:0;border-radius:10px;padding:8px 12px;background:#edf3ff;color:#2850a3;font-weight:900;cursor:pointer}.example{direction:ltr;text-align:center;background:#f7f9fc;border-radius:14px;padding:14px;margin:8px 0;font-size:18px}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 13px;background:#edf3ff;color:#2850a3;font-weight:900;text-decoration:none;cursor:pointer}.complete{margin-top:15px;background:#fff;border:1px solid #dfe6f0;border-radius:21px;padding:17px;display:flex;justify-content:space-between;align-items:center;gap:14px}.small{font-size:12px}.error{padding:16px;background:#fff4f4;color:#9b2525;border-radius:14px}@media(max-width:700px){.nav{display:none}.complete{display:block}.complete .btn{width:100%;margin-top:10px}.wrap{padding:12px 10px}}</style></head><body><header class="top"><a class="brand" href="grade-5.html"><span>HM</span> 🇫🇷 HM Academy</a><nav class="nav"><a href="index.html">الرئيسية</a><a href="course.html">المناهج</a><a href="dashboard.html">لوحة الطالب</a><a href="library.html">المكتبة</a></nav><a class="btn" href="student-profile.html">👨‍🎓</a></header><main class="wrap"><section class="hero"><div>Le français pour vous · 5e année · الصف الخامس الابتدائي</div><h1 id="title">جاري تحميل الدرس…</h1><p id="subtitle"></p></section><section class="journey" id="journey"></section><nav class="tabs" id="tabs"></nav><section id="viewer" class="panel"></section><section class="complete"><div><strong>إكمال الدرس</strong><div id="completionMessage" class="small">رحلتك محفوظة تلقائيًا على هذا الجهاز.</div></div><button id="completeBtn" class="btn">تم الانتهاء من الدرس</button></section><div class="actions"><a class="btn" href="grade-5.html">← Le français pour vous · 5e année</a><a class="btn" href="course.html">📚 المناهج</a><a class="btn" href="dashboard.html">📈 لوحة الطالب</a></div></main><script src="scripts/speech-runtime.js"></script><script>const P={'g5-t1-l01':{ar:'الجملة البسيطة',fr:'La phrase simple',o:'بناء الجملة من الفاعل والفعل والمكمل.',v:[['sujet','الفاعل'],['verbe','الفعل'],['complément','المكمل']],e:['Mona parle français.','Elle parle à sa mère.']},'g5-t1-l02':{ar:'أدوات التعريف والتنكير',fr:'Les déterminants',o:'التمييز بين أدوات التعريف والتنكير واستخدامها مع الاسم.',v:[['un / une / des','أدوات التنكير'],['le / la / l’ / les','أدوات التعريف']],e:['un livre','une trousse','des crayons','le cahier']},'g5-t1-l03':{ar:'صيغة الجمع',fr:'Le pluriel',o:'تكوين الجمع وتطبيق القواعد الأساسية.',v:[['un arbre → des arbres','القاعدة العامة'],['l’animal → les animaux','استثناء شائع']],e:['un livre → des livres','un animal → des animaux']},'g5-t1-l04':{ar:'الأرقام',fr:'Les nombres',o:'قراءة وكتابة الأعداد الأساسية بالفرنسية.',v:[['dix-sept','17'],['dix-huit','18'],['dix-neuf','19'],['vingt','20']],e:['J’ai vingt livres.']},'g5-t1-l05':{ar:'الساعة',fr:"L'heure",o:'السؤال عن الوقت والإجابة عنه.',v:[['Quelle heure est-il ?','كم الساعة؟'],['Il est onze heures.','إنها الساعة الحادية عشرة']],e:['Quelle heure est-il ?','Il est onze heures.']},'g5-t1-l06':{ar:'الفصول الأربعة',fr:'Les quatre saisons',o:'التعرف إلى الفصول واستخدام Au / En.',v:[['l’hiver','الشتاء'],['le printemps','الربيع'],['l’été','الصيف'],['l’automne','الخريف']],e:['En hiver, il pleut.','Au printemps, les feuilles sont vertes.']},'g5-t1-l07':{ar:'الضمائر والفعل في المضارع',fr:'Les pronoms et le présent',o:'استخدام ضمائر الفاعل وتصريف أفعال -ER في المضارع.',v:[['je / tu / il / elle','ضمائر المفرد'],['nous / vous / ils / elles','ضمائر الجمع']],e:['J’aime.','Nous jouons.','Ils parlent.']},'g5-t1-l08':{ar:'الصفات الملكية',fr:'Les adjectifs possessifs',o:'اختيار صفة الملكية المناسبة بحسب المالك والاسم.',v:[['mon / ma / mes','ملكي'],['ton / ta / tes','ملكك'],['son / sa / ses','ملكه / ملكها']],e:['mon stylo','ma gomme','mes oreilles']},'g5-t1-l09':{ar:'الوجه',fr:'Le visage',o:'اكتساب مفردات أجزاء الوجه وتوظيفها.',v:[['le nez','الأنف'],['les yeux','العينان'],['la bouche','الفم'],['les dents','الأسنان'],['les cheveux','الشعر']],e:['J’ai deux yeux.','Je me lave les dents.']},'g5-t1-l10':{ar:'اللوازم المدرسية والفواكه',fr:'Fournitures scolaires et fruits',o:'استخدام مفردات اللوازم المدرسية والفواكه مع أدواتها.',v:[['une trousse','مقلمة'],['un stylo','قلم'],['une orange','برتقالة'],['une pomme','تفاحة']],e:['J’ai une trousse.','Je mange une orange.']},'g5-t1-l11':{ar:'الجسم',fr:'Le corps',o:'اكتساب مفردات أجزاء الجسم واستخدام أدوات التعريف.',v:[['la main','اليد'],['le bras','الذراع'],['le coude','المرفق'],['la jambe','الساق'],['les pieds','القدمان']],e:['J’ai deux mains.','Je marche avec mes pieds.']}};const id=new URLSearchParams(location.search).get('id')||'g5-t1-l01',d=P[id];let active=new URLSearchParams(location.search).get('section')||'overview';const sections=[['vocabulary','📚','المفردات'],['pronunciation','🎧','النطق'],['grammar','📖','القواعد'],['practice','✍️','التدريب'],['files','📁','ملفات الدرس'],['games','🎮','الألعاب'],['assessment','📝','التقييم']];const journeySteps=[['overview','🚀','البداية'],['vocabulary','📚','المفردات'],['pronunciation','🎧','النطق'],['grammar','📖','القواعد'],['practice','✍️','التدريب']];function speak(t){if(window.HMSpeech?.speak)return HMSpeech.speak(t,{lang:'fr-FR',rate:.84});if(window.speechSynthesis){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.84;speechSynthesis.speak(u)}}function nav(){journey.innerHTML=journeySteps.map(x=>`<button class="step ${active===x[0]?'active':''}" data-x="${x[0]}">${x[1]} ${x[2]}</button>`).join('');tabs.innerHTML=sections.map(x=>`<button class="tab ${active===x[0]?'active':''}" data-x="${x[0]}">${x[1]} ${x[2]}</button>`).join('');document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{active=b.dataset.x;history.replaceState(null,'','grade-5-lesson.html?id='+encodeURIComponent(id)+'&section='+active);render()})}function vocab(){return `<div class="head"><h2>📚 المفردات</h2></div><div class="content"><div class="cards">${d.v.map(x=>`<article class="vcard"><div class="vword">${x[0]}</div><div class="vmean">${x[1]}</div><button class="speak" onclick="speak(${JSON.stringify(x[0])})">🔊 استمع</button></article>`).join('')}</div></div>`}function render(){if(!d){viewer.innerHTML='<div class="content error">لم يتم العثور على الدرس.</div>';return}title.textContent=d.ar;subtitle.textContent=d.fr+' · '+d.o;nav();let html;if(active==='overview')html=`<div class="head"><h2>🚀 بداية الدرس</h2></div><div class="content"><div class="note"><b>🎯 هدف الدرس</b><br>${d.o}</div><div class="note"><b>🧭 مسار التعلم</b><br>مفردات → نطق → قواعد → تدريب → ملفات → ألعاب → تقييم</div></div>`;else if(active==='vocabulary')html=vocab();else if(active==='pronunciation')html=`<div class="head"><h2>🎧 النطق</h2></div><div class="content"><div class="note">استمع إلى الكلمات والأمثلة بالنطق الفرنسي المباشر من المتصفح.</div>${d.v.map(x=>`<div class="example">${x[0]} <button class="speak" onclick="speak(${JSON.stringify(x[0])})">🔊</button></div>`).join('')}${d.e.map(x=>`<div class="example">${x}<button class="speak" onclick="speak(${JSON.stringify(x)})">🔊</button></div>`).join('')}</div>`;else if(active==='grammar')html=`<div class="head"><h2>📖 القواعد</h2></div><div class="content"><div class="note">${d.o}</div>${d.v.map(x=>`<div class="note"><b dir="ltr">${x[0]}</b><br>${x[1]}</div>`).join('')}</div>`;else if(active==='practice')html=`<div class="head"><h2>✍️ التدريب</h2></div><div class="content"><div class="note">اقرأ الأمثلة، استمع إليها، ثم انتقل إلى التقييم بعد مراجعة المادة.</div>${d.e.map(x=>`<div class="example">${x}<button class="speak" onclick="speak(${JSON.stringify(x)})">🔊</button></div>`).join('')}</div>`;else if(active==='files')html=`<div class="head"><h2>📁 ملفات الدرس</h2></div><div class="content"><div class="cards"><div class="vcard"><b>01-interactif.html</b><p>الدرس التفاعلي الأصلي</p></div><div class="vcard"><b>02-reference-imprimable.docx</b><p>المرجع القابل للطباعة</p></div><div class="vcard"><b>03-evaluation-a-imprimer.docx</b><p>التقييم القابل للطباعة</p></div><div class="vcard"><b>04-examen-electronique.html</b><p>الاختبار الإلكتروني</p></div></div></div>`;else if(active==='games')html=`<div class="head"><h2>🎮 الألعاب</h2></div><div class="content"><div class="note">واجهة الألعاب جاهزة للربط بالمادة التفاعلية الأصلية.</div></div>`;else html=`<div class="head"><h2>📝 التقييم</h2></div><div class="content"><div class="note">واجهة التقييم جاهزة لربط الاختبار الإلكتروني والتقييم القابل للطباعة.</div></div>`;viewer.innerHTML=html}completeBtn.onclick=()=>{localStorage.setItem('hm-g5-complete-'+id,'true');completionMessage.textContent='تم حفظ إكمال الدرس بنجاح.'};render();</script></body></html>
