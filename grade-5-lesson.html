<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Le français pour vous | 5e année</title><link rel="stylesheet" href="styles/lesson-premium-visual-v1.css"><style>body{margin:0;background:#f4f7fc;color:#14264a;font-family:Arial,Cairo,sans-serif}.wrap{max-width:1180px;margin:auto;padding:16px}.top{background:#fff;padding:12px 16px;border-bottom:1px solid #dfe6f0;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:5}.brand{font-weight:900;text-decoration:none;color:#14264a}.brand span{background:#e62982;color:#fff;padding:9px;border-radius:11px}.nav{display:flex;gap:12px}.nav a,.btn{font-weight:900;text-decoration:none;color:#315aa4}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff;border-radius:28px;padding:24px;margin-top:16px}.hero h1{margin:8px 0;font-size:clamp(28px,6vw,44px)}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0;padding:6px;background:#fff;border:1px solid #dfe6f0;border-radius:17px}.tab{border:1px solid #dfe6f0;background:#fff;color:#536078;padding:10px 13px;border-radius:12px;font-weight:900;white-space:nowrap;cursor:pointer}.tab.active{background:#e62982;color:#fff}.panel{background:#fff;border:1px solid #dfe6f0;border-radius:23px;overflow:hidden}.head{padding:18px;border-bottom:1px solid #edf1f7}.content{padding:18px}.source{border:1px solid #e2e8f2;border-radius:16px;padding:15px;margin-bottom:10px;line-height:1.9;background:#fbfcff}.source.fr{direction:ltr;text-align:left}.source strong{display:block;color:#2857b8}.speak{float:left;border:0;background:#edf3ff;color:#2453a5;border-radius:9px;padding:6px 10px;font-weight:900;cursor:pointer}.cardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.file{border:1px solid #dfe6f0;border-radius:16px;padding:14px;background:#fff}.complete{margin-top:14px;padding:16px;background:#fff;border:1px solid #dfe6f0;border-radius:20px;display:flex;justify-content:space-between;gap:10px;align-items:center}.button{border:0;border-radius:11px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:900;cursor:pointer}.error{padding:18px;background:#fff1f1;color:#9b2525;border-radius:15px}@media(max-width:700px){.nav{display:none}.complete{display:block}.complete .button{margin-top:10px;width:100%}}</style></head><body><header class="top"><a class="brand" href="grade-5.html"><span>HM</span> 🇫🇷 HM Academy</a><nav class="nav"><a href="index.html">الرئيسية</a><a href="course.html">المناهج</a><a href="dashboard.html">لوحة الطالب</a><a href="library.html">المكتبة</a></nav><a class="btn" href="student-profile.html">👨‍🎓</a></header><main class="wrap"><section class="hero"><div>Le français pour vous · 5e année · الصف الخامس الابتدائي</div><h1 id="title">جاري تحميل الدرس…</h1><div id="source"></div></section><nav class="tabs" id="tabs"></nav><section id="viewer" class="panel"></section><section class="complete"><div><b>إكمال الدرس</b><div id="msg" style="font-size:12px">يتم حفظ تقدمك على هذا الجهاز.</div></div><button class="button" id="complete">تم الانتهاء من الدرس</button></section></main><script src="scripts/speech-runtime.js"></script><script>const id=new URLSearchParams(location.search).get('id')||'g5-t1-l01';let active=new URLSearchParams(location.search).get('section')||'content';let lesson=null;const tabs=[['content','📘','المحتوى الكامل'],['pronunciation','🎧','النطق'],['practice','✍️','التدريب'],['files','📁','ملفات الدرس']];function speak(t){if(window.HMSpeech?.speak)return HMSpeech.speak(t,{lang:'fr-FR',rate:.82});if(window.speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}}function esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function render(){if(!lesson){viewer.innerHTML='<div class="content error">تعذر تحميل محتوى الدرس.</div>';return}title.textContent=lesson.content[2]||lesson.content[0];source.textContent=lesson.source+' · Le français pour vous';tabs.innerHTML=tabsData();let html='';if(active==='content')html='<div class="head"><h2>📘 المحتوى الكامل للدرس</h2></div><div class="content">'+lesson.content.map((x,i)=>{let fr=/[A-Za-zÀ-ÿ]/.test(x)&&!/[\u0600-\u06FF]/.test(x);return '<article class="source '+(fr?'fr':'')+'"><button class="speak" onclick="speak('+JSON.stringify(x)+')">🔊</button>'+esc(x)+'</article>'}).join('')+'</div>';else if(active==='pronunciation')html='<div class="head"><h2>🎧 النطق</h2></div><div class="content"><div class="source">اضغط 🔊 للاستماع إلى العبارات والكلمات الفرنسية الواردة في الدرس بالنطق الفرنسي.</div>'+lesson.content.filter(x=>/[A-Za-zÀ-ÿ]/.test(x)&&!/[\u0600-\u06FF]/.test(x)&&x.length<100).map(x=>'<article class="source fr"><button class="speak" onclick="speak('+JSON.stringify(x)+')">🔊</button>'+esc(x)+'</article>').join('')+'</div>';else if(active==='practice')html='<div class="head"><h2>✍️ التدريب والتطبيق</h2></div><div class="content"><div class="source">المادة الأصلية تتضمن أنشطة تفاعلية واختبارات قصيرة. ستتم مراجعة التمارين أكاديميًا قبل اعتمادها نهائيًا.</div><div class="cardgrid"><div class="file">🎯 أنشطة الاختيار والتصنيف</div><div class="file">🔤 إكمال الكلمات والجمل</div><div class="file">🧠 أسئلة الفهم</div><div class="file">🏁 Quiz Final</div></div></div>';else html='<div class="head"><h2>📁 ملفات الدرس الأصلية</h2></div><div class="content"><div class="cardgrid"><div class="file"><b>01-interactif.html</b><p>الدرس التفاعلي الأصلي</p></div><div class="file"><b>02-reference-imprimable.docx</b><p>المرجع القابل للطباعة</p></div><div class="file"><b>03-evaluation-a-imprimer.docx</b><p>التقييم القابل للطباعة</p></div><div class="file"><b>04-examen-electronique.html</b><p>الاختبار الإلكتروني</p></div></div></div>';viewer.innerHTML=html}function tabsData(){return tabs.map(x=>'<button class="tab '+(active===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+' '+x[2]+'</button>').join('')}function go(x){active=x;history.replaceState(null,'','grade-5-lesson.html?id='+encodeURIComponent(id)+'&section='+x);render()}fetch('data/lessons/grade-5/full-course-content.json').then(r=>{if(!r.ok)throw Error('load');return r.json()}).then(data=>{lesson=data.lessons.find(x=>x.id===id);render()}).catch(()=>{viewer.innerHTML='<div class="content error">تعذر قراءة ملف محتوى المنهج.</div>'});complete.onclick=()=>{localStorage.setItem('hm-g5-complete-'+id,'true');msg.textContent='تم حفظ إكمال الدرس بنجاح.'}</script></body></html>
