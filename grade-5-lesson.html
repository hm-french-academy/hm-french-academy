<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | درس الصف الخامس</title><link rel="stylesheet" href="css/premium-shell.css"><style>main{max-width:980px;margin:auto;padding:28px 16px}.panel{background:#fff;border:1px solid #e1e7f0;border-radius:22px;padding:24px}.hero{background:linear-gradient(135deg,#14264a,#2563eb);color:#fff;border-radius:22px;padding:22px}.section{margin-top:18px;padding:18px;border:1px solid #e5eaf2;border-radius:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.asset{padding:14px;border-radius:14px;background:#f7f9fc}.asset strong{display:block}.btn{display:inline-block;margin-top:12px;padding:10px 13px;border-radius:10px;text-decoration:none;background:#2563eb;color:#fff;font-weight:800}.example{font-size:20px;direction:ltr;text-align:center;padding:14px;background:#f7f9fc;border-radius:14px}.notice{background:#fff8e6;padding:14px;border-radius:14px;line-height:1.8}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy</span></a><nav class="hm-nav"><a href="grade-5.html">← الصف الخامس</a><a href="dashboard.html">لوحة الطالب</a></nav></header><main><div id="app" class="panel">جاري تحميل الدرس...</div></main><script>const lessons={
'g5-t1-l01':{ar:'الجملة البسيطة',fr:'La phrase simple',goal:'بناء الجملة من الفاعل والفعل والمكمل.',points:['Sujet — الفاعل','Verbe — الفعل','Complément — المكمل'],examples:['Mona parle l’anglais.','Elle parle à sa mère.']},
'g5-t1-l02':{ar:'أدوات التعريف والتنكير',fr:'Les déterminants',goal:'التمييز بين أدوات التنكير والتعريف واستخدامها مع الاسم.',points:['un / une / des — أدوات التنكير','le / la / l’ / les — أدوات التعريف'],examples:['un livre','une trousse','des crayons','le cahier']},
'g5-t1-l03':{ar:'صيغة الجمع',fr:'Le pluriel',goal:'تكوين الجمع وتطبيق القواعد والاستثناءات الأساسية.',points:['القاعدة العامة: إضافة s','un/une → des','le/la/l’ → les','استثناءات شائعة: eau/au و s/x/z و al'],examples:['un arbre → des arbres','l’animal → les animaux']},
'g5-t1-l04':{ar:'الأرقام',fr:'Les nombres',goal:'قراءة وكتابة الأعداد الأساسية بالفرنسية.',points:['0 إلى 20','العشرات'],examples:['vingt','dix-neuf','dix-huit','dix-sept']},
'g5-t1-l05':{ar:'الساعة',fr:"L'heure",goal:'السؤال عن الوقت والإجابة عنه واستخدام التعبيرات الأساسية.',points:['Quelle heure est-il ?','Il est …','heure / heures','التعبيرات الأساسية للوقت'],examples:["Quelle heure est-il ?","Il est onze heures."]},
'g5-t1-l06':{ar:'الفصول الأربعة',fr:'Les quatre saisons',goal:'التعرف إلى الفصول واستخدام au/en في التراكيب المستهدفة.',points:['hiver','printemps','été','automne','Au / En'],examples:['En hiver, il pleut.','Au printemps, les feuilles sont vertes.']},
'g5-t1-l07':{ar:'الضمائر والفعل في المضارع',fr:'Les pronoms et le présent',goal:'استخدام ضمائر الفاعل وتصريف أفعال المجموعة الأولى في المضارع.',points:['je / tu / il / elle / nous / vous / ils / elles','أفعال -ER','الآن واليوم وكل يوم'],examples:['J’aime.','Nous jouons.','Ils parlent.']},
'g5-t1-l08':{ar:'الصفات الملكية',fr:'Les adjectifs possessifs',goal:'اختيار صفة الملكية المناسبة بحسب المالك والاسم.',points:['mon / ma / mes','ton / ta / tes','son / sa / ses'],examples:['mon stylo','ma gomme','mes oreilles']},
'g5-t1-l09':{ar:'الوجه',fr:'Le visage',goal:'اكتساب مفردات أساسية لأجزاء الوجه وكتابتها.',points:['front','nez','menton','dents','bouche','cils','cheveux','yeux','sourcils','oreilles'],examples:['le nez','les yeux','les dents']},
'g5-t1-l10':{ar:'اللوازم المدرسية والفواكه',fr:'Fournitures scolaires et fruits',goal:'استخدام مفردات اللوازم المدرسية والفواكه مع أدواتها.',points:['fournitures scolaires','fruits','un / une / des'],examples:['une trousse','des règles','un stylo','une orange']},
'g5-t1-l11':{ar:'الجسم',fr:'Le corps',goal:'اكتساب مفردات أجزاء الجسم وتوظيف أدوات التعريف.',points:['jambe','doigt','main','coude','épaule','ventre','cou','pieds','bras','genou'],examples:['la jambe','la main','le coude','les pieds']}};
const id=new URLSearchParams(location.search).get('id'),d=lessons[id],app=document.getElementById('app');if(!d){app.innerHTML='<div class="notice">لم يتم العثور على الدرس.</div>'}else{app.innerHTML=`<section class="hero"><h1>الدرس ${id.split('l')[1]}: ${d.ar}</h1><p dir="ltr">${d.fr}</p><p>${d.goal}</p></section><section class="section"><h2>🎯 أهداف الدرس</h2><p>${d.goal}</p></section><section class="section"><h2>📚 المفاهيم الأساسية</h2><div class="grid">${d.points.map(x=>`<div class="asset">${x}</div>`).join('')}</div></section><section class="section"><h2>📝 أمثلة</h2>${d.examples.map(x=>`<div class="example">${x}</div>`).join('')}</section><section id="files" class="section"><h2>📦 ملفات الدرس الأربعة</h2><div class="grid"><div class="asset"><strong>01-interactif.html</strong>النسخة التفاعلية الأصلية</div><div class="asset"><strong>02-reference-imprimable.docx</strong>المرجع القابل للطباعة</div><div class="asset"><strong>03-evaluation-a-imprimer.docx</strong>التقييم القابل للطباعة</div><div class="asset"><strong>04-examen-electronique.html</strong>الاختبار الإلكتروني</div></div><p class="notice">تم الحفاظ على أسماء الملفات الأصلية في سجل المنهج. هذه الصفحة هي طبقة العرض داخل HM Academy للمراجعة الأكاديمية، ولا تُعد اعتمادًا نهائيًا للمادة.</p></section><button class="btn" id="complete">✓ إكمال الدرس</button><div id="saved"></div>`;document.getElementById('complete').onclick=()=>{localStorage.setItem('hm-g5-complete-'+id,'true');saved.className='notice';saved.textContent='تم حفظ إكمال الدرس على هذا الجهاز.'}}</script></body></html>
