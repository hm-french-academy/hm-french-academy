<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Le français pour vous | 5e année</title><style>body{margin:0;background:#f4f7fc;color:#14264a;font-family:Arial,Cairo,sans-serif}.wrap{max-width:1180px;margin:auto;padding:16px}.top{background:#fff;padding:12px 16px;border-bottom:1px solid #dfe6f0;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:5}.brand{font-weight:900;text-decoration:none;color:#14264a}.brand span{background:#e62982;color:#fff;padding:9px;border-radius:11px}.nav{display:flex;gap:12px}.nav a{font-weight:900;text-decoration:none;color:#315aa4}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff;border-radius:28px;padding:24px;margin-top:16px}.hero h1{margin:8px 0;font-size:clamp(28px,6vw,44px)}.meta{opacity:.9}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0;padding:6px;background:#fff;border:1px solid #dfe6f0;border-radius:17px}.tab{border:1px solid #dfe6f0;background:#fff;color:#536078;padding:10px 13px;border-radius:12px;font-weight:900;white-space:nowrap;cursor:pointer}.tab.active{background:#e62982;color:#fff}.panel{background:#fff;border:1px solid #dfe6f0;border-radius:23px;overflow:hidden}.head{padding:18px;border-bottom:1px solid #edf1f7}.content{padding:18px}.source,.exercise,.vocab{border:1px solid #e2e8f2;border-radius:16px;padding:15px;margin-bottom:10px;line-height:1.9;background:#fbfcff}.source.fr,.vocab.fr{direction:ltr;text-align:left}.speak{float:left;border:0;background:#edf3ff;color:#2453a5;border-radius:9px;padding:6px 10px;font-weight:900;cursor:pointer}.cardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.file,.choice{border:1px solid #dfe6f0;border-radius:16px;padding:14px;background:#fff}.choice,.vocab{cursor:pointer;text-align:center;font-weight:900}.choice.correct{background:#e9f8ef}.choice.wrong{background:#fff0f0}.button{border:0;border-radius:11px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:900;cursor:pointer}.secondary{background:#edf3ff;color:#2453a5}.result{padding:14px;border-radius:14px;margin-top:12px;font-weight:900}.ok{background:#e9f8ef;color:#17653a}.bad{background:#fff0f0;color:#9b2525}.complete{margin-top:14px;padding:16px;background:#fff;border:1px solid #dfe6f0;border-radius:20px;display:flex;justify-content:space-between;gap:10px;align-items:center}.pager{display:flex;justify-content:space-between;gap:10px;margin-top:14px}.pager .button{flex:1}.progress{height:8px;background:#e7edf7;border-radius:99px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:#16a394;width:0}.toast{padding:12px;border-radius:12px;background:#eef7ff;margin:10px 0;font-weight:800}@media(max-width:700px){.nav{display:none}.complete{display:block}.complete .button{margin-top:10px;width:100%}.pager{display:block}.pager .button{width:100%;margin-top:8px}}</style></head><body><header class="top"><a class="brand" href="grade-5.html"><span>HM</span> 🇫🇷 HM Academy</a><nav class="nav"><a href="index.html">الرئيسية</a><a href="course.html">المناهج</a><a href="dashboard.html">لوحة الطالب</a><a href="library.html">المكتبة</a></nav></header><main class="wrap"><section class="hero"><div>Le français pour vous · 5e année · الصف الخامس الابتدائي</div><h1 id="title">جاري تحميل الدرس…</h1><div id="source"></div><div class="progress"><i id="bar"></i></div></section><nav class="tabs" id="tabs"></nav><section id="viewer" class="panel"></section><div class="pager"><button class="button secondary" id="prev">← الدرس السابق</button><button class="button" id="next">الدرس التالي →</button></div><section class="complete"><div><b>إكمال الدرس</b><div id="msg" style="font-size:12px">يتم حفظ تقدمك على هذا الجهاز.</div></div><button class="button" id="complete">تم الانتهاء من الدرس</button></section></main><script>const id=new URLSearchParams(location.search).get('id')||'g5-t1-l01';let active=new URLSearchParams(location.search).get('section')||'content',lesson=null,allLessons=[];const tabs=[['content','📘','المحتوى الكامل'],['vocab','🧩','المفردات التفاعلية'],['pronunciation','🎧','النطق'],['practice','✍️','التدريب'],['quiz','🏁','التقييم'],['files','📁','ملفات الدرس']];function speak(t){if(window.HMSpeech?.speak)return HMSpeech.speak(t,{lang:'fr-FR',rate:.82});if(window.speechSynthesis){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}}function esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function go(x){active=x;history.replaceState(null,'','grade-5-lesson.html?id='+encodeURIComponent(id)+'&section='+x);render()}function tabsHtml(){return tabs.map(x=>'<button class="tab '+(active===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+' '+x[2]+'</button>').join('')}function words(){const stop=/^(les?|des?|une?|un|la|le|l'|et|ou|de|du|en|à|pour|avec|dans|sur|se|ce|qui|que|nous|vous|ils|elles|il|elle|je|tu|mon|ma|mes|ton|ta|tes|son|sa|ses)$/i;const set=new Set();lesson.content.filter(x=>/[A-Za-zÀ-ÿ]/.test(x)&&!/[\u0600-\u06FF]/.test(x)&&x.length<80).forEach(x=>x.replace(/[A-Za-zÀ-ÿÀ-ÿœŒ'-]{2,}/g,w=>{if(!stop.test(w))set.add(w)}));return [...set].slice(0,36)}function vocab(){const ws=words();return '<div class="head"><h2>🧩 مفردات الدرس</h2><div class="meta">اضغط على أي كلمة لسماع نطقها.</div></div><div class="content"><div class="cardgrid">'+ws.map(w=>'<button class="vocab fr" onclick="speak('+JSON.stringify(w)+')">🔊 '+esc(w)+'</button>').join('')+'</div><div class="toast">💡 النطق يستخدم الفرنسية الفرنسية (fr-FR) ويمكن للطالب إعادة الاستماع لأي كلمة.</div></div>'}const quizMap={"g5-t1-l01":[['اختر الفاعل في Mona parle français.',['Mona','parle','français'],'Mona'],['اختر الفعل في Mona parle français.',['Mona','parle','français'],'parle']],"g5-t1-l02":[['اختر الأداة الصحيحة: ___ stylo',['un','une','des'],'un'],['اختر الأداة الصحيحة: ___ gomme',['le','une','des'],'une']],"g5-t1-l03":[['جمع un livre هو:',['des livres','des livre','les livre'],'des livres'],['جمع un animal هو:',['des animals','des animaux','les animal'],'des animaux']],"g5-t1-l04":[['70 بالفرنسية:',['soixante-dix','quatre-vingts','quatre-vingt-dix'],'soixante-dix'],['80 بالفرنسية:',['quatre-vingts','soixante-dix','quatre-vingt-dix'],'quatre-vingts']],"g5-t1-l05":[['7:00 بالفرنسية:',['Il est sept heures.','Il est midi.','Il est minuit.'],'Il est sept heures.'],['15 دقيقة تعني:',['et quart','et demie','moins le quart'],'et quart']],"g5-t1-l06":[['الفصل الذي يأتي بعد l’hiver هو:',['le printemps','l’automne','l’été'],'le printemps'],['نقول:',['au printemps','en printemps','au été'],'au printemps']],"g5-t1-l07":[['Sara يمكن استبدالها بـ:',['Elle','Nous','Ils'],'Elle'],['Nous (parler) trois langues:',['parlons','parle','parlez'],'parlons']],"g5-t1-l08":[['J’ai des oreilles → Ce sont ___ oreilles.',['mes','ma','mon'],'mes'],['C’est ___ livre.',['mon','ma','mes'],'mon']],"g5-t1-l09":[['الأنف بالفرنسية:',['le nez','la bouche','le front'],'le nez'],['الأذن بالفرنسية:',['l’oreille','les yeux','les dents'],'l’oreille']],"g5-t1-l10":[['___ banane',['une','un','des'],'une'],['قلم بالفرنسية:',['un stylo','une trousse','une pomme'],'un stylo']],"g5-t1-l11":[['القدم بالفرنسية:',['le pied','la main','le coude'],'le pied'],['الذراع:',['le bras','la jambe','le genou'],'le bras']]};let score=0;function quiz(){const qs=quizMap[id]||[];return '<div class="head"><h2>🏁 تقييم الدرس</h2></div><div class="content">'+qs.map((q,i)=>'<div class="exercise"><b>'+((i+1)+'. '+q[0])+'</b><div class="cardgrid" style="margin-top:10px">'+q[1].map(o=>'<button class="choice" data-q="'+i+'" data-a="'+encodeURIComponent(o)+'" onclick="answer(this)">'+esc(o)+'</button>').join('')+'</div><div id="r'+i+'"></div></div>').join('')+'<button class="button" onclick="finishQuiz()">إنهاء التقييم</button><div id="score"></div></div>'}function answer(el){const i=+el.dataset.q;if(document.querySelector('.choice[data-q="'+i+'"].correct,.choice[data-q="'+i+'"].wrong'))return;const q=(quizMap[id]||[])[i],v=decodeURIComponent(el.dataset.a);if(v===q[2]){el.classList.add('correct');score++}else{el.classList.add('wrong');[...document.querySelectorAll('.choice[data-q="'+i+'"]')].find(x=>decodeURIComponent(x.dataset.a)===q[2])?.classList.add('correct')}document.getElementById('r'+i).innerHTML='<div class="result '+(v===q[2]?'ok':'bad')+'">'+(v===q[2]?'✅ إجابة صحيحة':'❌ الإجابة الصحيحة: '+esc(q[2]))+'</div>'}function finishQuiz(){const total=(quizMap[id]||[]).length,pct=total?Math.round(score/total*100):0;document.getElementById('score').innerHTML='<div class="result '+(pct>=70?'ok':'bad')+'">النتيجة: '+score+' / '+total+' — '+pct+'%</div>';if(pct>=70)localStorage.setItem('hm-g5-quiz-'+id,'passed')}function render(){if(!lesson){viewer.innerHTML='<div class="content">تعذر تحميل محتوى الدرس.</div>';return}title.textContent=lesson.content[2]||lesson.content[0];source.textContent=lesson.source+' · Le français pour vous';bar.style.width=(((allLessons.findIndex(x=>x.id===id)+1)/allLessons.length)*100)+'%';tabs.innerHTML=tabsHtml();let html='';if(active==='content')html='<div class="head"><h2>📘 المحتوى الكامل</h2></div><div class="content">'+lesson.content.map(x=>'<article class="source '+(/[A-Za-zÀ-ÿ]/.test(x)&&!/[\u0600-\u06FF]/.test(x)?'fr':'')+'"><button class="speak" onclick="speak('+JSON.stringify(x)+')">🔊</button>'+esc(x)+'</article>').join('')+'</div>';else if(active==='vocab')html=vocab();else if(active==='pronunciation')html='<div class="head"><h2>🎧 النطق</h2></div><div class="content"><div class="source">اضغط 🔊 للاستماع، ثم كرر النطق بصوتك.</div>'+lesson.content.filter(x=>/[A-Za-zÀ-ÿ]/.test(x)&&!/[\u0600-\u06FF]/.test(x)&&x.length<120).map(x=>'<article class="source fr"><button class="speak" onclick="speak('+JSON.stringify(x)+')">🔊</button>'+esc(x)+'</article>').join('')+'</div>';else if(active==='practice')html='<div class="head"><h2>✍️ التدريب</h2></div><div class="content"><div class="exercise"><b>1. استمع وتحدث</b><p>اختر مفردات الدرس، استمع إليها، ثم كررها.</p><button class="button secondary" onclick="go(\'vocab\')">🧩 تدريب المفردات</button></div><div class="exercise"><b>2. طبّق ما تعلمت</b><p>بعد إنهاء المراجعة، انتقل إلى التقييم.</p><button class="button" onclick="go(\'quiz\')">🏁 ابدأ التقييم</button></div></div>';else if(active==='quiz')html=quiz();else html='<div class="head"><h2>📁 ملفات الدرس</h2></div><div class="content"><div class="cardgrid"><div class="file"><b>01-interactif.html</b><p>الدرس التفاعلي الأصلي</p></div><div class="file"><b>02-reference-imprimable.docx</b><p>المرجع القابل للطباعة</p></div><div class="file"><b>03-evaluation-a-imprimer.docx</b><p>التقييم القابل للطباعة</p></div><div class="file"><b>04-examen-electronique.html</b><p>الاختبار الإلكتروني</p></div></div></div>';viewer.innerHTML=html}function move(d){const i=allLessons.findIndex(x=>x.id===id),n=allLessons[i+d];if(n)location.href='grade-5-lesson.html?id='+n.id}prev.onclick=()=>move(-1);next.onclick=()=>move(1);complete.onclick=()=>{localStorage.setItem('hm-g5-complete-'+id,'true');msg.textContent='تم حفظ إكمال الدرس بنجاح.'};fetch('data/lessons/grade-5/full-course-content.json').then(r=>r.json()).then(data=>{allLessons=data.lessons;lesson=allLessons.find(x=>x.id===id);prev.disabled=allLessons.findIndex(x=>x.id===id)<=0;next.disabled=allLessons.findIndex(x=>x.id===id)>=allLessons.length-1;render()}).catch(()=>viewer.innerHTML='<div class="content">تعذر قراءة ملف محتوى المنهج.</div>');</script></body></html>
