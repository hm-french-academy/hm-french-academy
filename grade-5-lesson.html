<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Lesson</title><link rel="stylesheet" href="styles/lesson-premium-visual-v1.css?v=20260818-visual1"><style>body{margin:0;background:#f4f7fc;color:#14264a;font-family:Arial,Cairo,sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px 14px}.top{background:#fff;padding:12px 16px;border-bottom:1px solid #dfe6f0;display:flex;justify-content:space-between;align-items:center;gap:14px;position:sticky;top:0;z-index:10}.brand{font-weight:900;text-decoration:none;color:#14264a}.brand span{background:#e62982;color:#fff;padding:10px;border-radius:12px}.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.nav a{color:#315aa4;text-decoration:none;font-weight:900;font-size:13px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#16a394);color:#fff;border-radius:30px;padding:25px;box-shadow:0 18px 45px rgba(37,99,235,.18)}.hero h1{font-size:clamp(30px,6vw,46px);margin:7px 0}.journey,.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0;padding:6px;background:#fff;border:1px solid #dfe6f0;border-radius:18px}.step,.tab{border:1px solid #dfe6f0;background:#fff;color:#536078;padding:11px 14px;border-radius:13px;font-weight:900;white-space:nowrap;cursor:pointer}.step.active,.tab.active{background:#e62982;color:#fff;border-color:#e62982}.panel{background:#fff;border:1px solid #dfe6f0;border-radius:24px;min-height:220px;overflow:hidden}.head{padding:18px;border-bottom:1px solid #edf1f7}.content{padding:18px}.note,.lesson-card,.vocab-card{background:#fbfcff;border:1px solid #e2e8f2;border-radius:16px;padding:15px;margin-bottom:10px;line-height:1.9}.lesson-card.fr,.vocab-card.fr{direction:ltr;text-align:left}.audio{border:0;background:#edf3ff;color:#2850a3;border-radius:10px;padding:7px 10px;font-weight:900;cursor:pointer;float:left}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.vocab-card{text-align:center;cursor:pointer;font-weight:900}.vocab-card small{display:block;color:#68758b;margin-top:4px}.choice{border:1px solid #dfe6f0;border-radius:13px;padding:12px;background:#fff;font-weight:900;cursor:pointer;width:100%}.choice.correct{background:#e9f8ef}.choice.wrong{background:#fff0f0}.result{padding:12px;border-radius:12px;margin-top:8px;font-weight:900}.ok{background:#e9f8ef;color:#17653a}.bad{background:#fff0f0;color:#9b2525}.complete{margin-top:15px;background:#fff;border:1px solid #dfe6f0;border-radius:21px;padding:17px;display:flex;justify-content:space-between;align-items:center;gap:14px}.btn{border:0;border-radius:11px;padding:10px 13px;background:#edf3ff;color:#2850a3;font-weight:900;text-decoration:none;cursor:pointer}.btn.primary{background:#2563eb;color:#fff}.small{font-size:12px}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.lang{border:1px solid #dfe6f0;border-radius:10px;padding:8px;background:#fff;font-weight:800}.progress{height:7px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden;margin-top:14px}.progress i{display:block;height:100%;background:#fff;width:0}.error{margin:18px;padding:16px;background:#fff4f4;border:1px solid #efb0b0;border-radius:14px;color:#9b2525}@media(max-width:900px){.nav{display:none}}@media(max-width:600px){.wrap{padding:12px 10px}.hero{padding:20px;border-radius:24px}.complete{display:block}.complete .btn{width:100%;margin-top:10px}}</style><script src="scripts/speech-runtime.js?v=20260816-speech5"></script></head><body><header class="top"><a class="brand" href="index.html"><span>HM</span> 🇫🇷 HM Academy</a><nav class="nav"><a href="index.html">الرئيسية</a><a href="dashboard.html">الطالب</a><a href="course.html">المناهج الدراسية</a><a href="levels.html">مستويات اللغة</a><a href="library.html">المكتبة</a><a href="settings.html">الإعدادات</a></nav><div style="display:flex;gap:8px;align-items:center"><select id="langSelect" class="lang"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select><a class="btn" href="student-profile.html">👨‍🎓</a></div></header><main class="wrap"><section class="hero"><div>Le français pour vous · 5e année · الفصل الدراسي الأول</div><h1 id="title">Leçon</h1><p id="subtitle">جارٍ تحميل محتوى الدرس…</p><div id="loadNote" class="small"></div><div class="progress"><i id="bar"></i></div></section><section class="journey" id="journey"></section><nav class="tabs" id="tabs"></nav><section id="viewer" class="panel"></section><section class="complete"><div><strong>إكمال الدرس</strong><div id="completionMessage" class="small">رحلتك محفوظة تلقائيًا أثناء التعلم.</div></div><button id="completeBtn" class="btn" type="button">تم الانتهاء من الدرس</button></section><div class="actions"><a class="btn" href="grade-5.html">← الصف الخامس</a><a class="btn" href="course.html">📚 المناهج</a><a class="btn" href="dashboard.html">📈 لوحة الطالب</a></div></main><script>const params=new URLSearchParams(location.search),id=params.get('id')||'g5-t1-l01';let data=null,active=params.get('section')||'overview',score=0,allLessons=[];const sections=[['vocabulary','📚','المفردات'],['pronunciation','🎧','النطق'],['grammar','📖','القواعد'],['conversation','💬','المحادثة'],['practice','✍️','التدريب'],['files','📁','ملفات الدرس'],['games','🎮','الألعاب'],['assessment','📝','التقييم']];const journey=[['overview','🚀','البداية'],['vocabulary','📚','المفردات'],['pronunciation','🎧','النطق'],['grammar','📖','القواعد'],['conversation','💬','المحادثة'],['practice','✍️','التدريب'],['games','🎮','الألعاب']];function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function speak(t,b){if(window.HMSpeech?.speak)return HMSpeech.speak(t,{button:b,lang:'fr-FR',rate:.84});if(window.speechSynthesis){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.84;speechSynthesis.speak(u)}}function audio(t){return '<button class="audio" onclick="speak('+JSON.stringify(t)+',this)" aria-label="استمع">🔊</button>'}function blocks(){return Array.isArray(data.content)?data.content.filter(x=>String(x).trim()):[]}function frBlocks(){return blocks().filter(x=>/[A-Za-zÀ-ÿ]/.test(x)&&!/[\u0600-\u06FF]/.test(x))}function words(){const stop=/^(les?|des?|une?|un|la|le|l'|et|ou|de|du|en|à|pour|avec|dans|sur|se|ce|qui|que|nous|vous|ils|elles|il|elle|je|tu|mon|ma|mes|ton|ta|tes|son|sa|ses|est|sont)$/i,seen=new Set(),out=[];frBlocks().forEach(x=>x.replace(/[A-Za-zÀ-ÿœŒ'-]{2,}/g,w=>{if(!stop.test(w)&&!seen.has(w.toLowerCase())){seen.add(w.toLowerCase());out.push(w)}}));return out.slice(0,40)}function nav(){journey.innerHTML=journeyData().map(x=>'<button class="step '+(active===x[0]?'active':'')+'" data-j="'+x[0]+'">'+x[1]+' '+x[2]+'</button>').join('');tabs.innerHTML=sections.map(x=>'<button class="tab '+(active===x[0]?'active':'')+'" data-t="'+x[0]+'">'+x[1]+' '+x[2]+'</button>').join('');document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>setSection(b.dataset.j));document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>setSection(b.dataset.t))}function journeyData(){return journey}function overview(){return '<div class="head"><h2>🚀 البداية</h2></div><div class="content"><div class="note"><b>🎯 هدف الدرس</b><br>فهم موضوع الدرس واكتساب المفردات والتراكيب الفرنسية الأساسية الواردة في المادة الأصلية.</div><div class="note"><b>🧭 مسار التعلم</b><br>مفردات → نطق → قواعد → محادثة → تدريب → ملفات → ألعاب → تقييم</div><div class="note"><b>📌 محتوى الدرس</b><br>'+esc(blocks().slice(0,6).join(' · '))+'</div></div>'}function vocabulary(){return '<div class="head"><h2>📚 المفردات</h2></div><div class="content"><div class="note">اضغط 🔊 لسماع النطق ثم كرر الكلمة بصوتك.</div><div class="grid">'+words().map(w=>'<button class="vocab-card fr" onclick="speak('+JSON.stringify(w)+',this)">'+audio(w)+'<span>'+esc(w)+'</span><small>استمع إلى النطق</small></button>').join('')+'</div></div>'}function pronunciation(){return '<div class="head"><h2>🎧 النطق</h2></div><div class="content"><div class="note">استمع إلى العبارات الفرنسية ثم كررها.</div>'+frBlocks().slice(0,30).map(x=>'<div class="lesson-card fr">'+audio(x)+esc(x)+'</div>').join('')+'</div>'}function grammar(){const a=blocks().filter(x=>/(phrase|verbe|sujet|grammaire|présent|pluriel|déterminant|conjug|mascul|fémin|singulier|partie)/i.test(x));return '<div class="head"><h2>📖 القواعد</h2></div><div class="content">'+(a.length?a.map(x=>'<div class="lesson-card '+(/[A-Za-zÀ-ÿ]/.test(x)?'fr':'')+'">'+audio(x)+esc(x)+'</div>').join(''):'<div class="note">سيتم تنظيم قاعدة الدرس من المادة الأصلية في المراجعة الأكاديمية.</div>')+'</div>'}function conversation(){const a=blocks().filter(x=>/[«»:“”]/.test(x)||/^(Bonjour|Salut|Je |Tu |Il |Elle |Nous |Vous |Comment|Ça |Oui|Non)/i.test(x));return '<div class="head"><h2>💬 المحادثة</h2></div><div class="content">'+(a.length?a.map(x=>'<div class="lesson-card fr">'+audio(x)+esc(x)+'</div>').join(''):'<div class="note">يتم عرض العبارات الحوارية الموجودة في المادة الأصلية هنا عند توفرها.</div>')+'</div>'}function practice(){return '<div class="head"><h2>✍️ التدريب</h2></div><div class="content"><div class="note"><b>تدريب الاستماع والتكرار</b><br>راجع المفردات والنطق ثم طبّق ما تعلمته.</div><button class="btn primary" onclick="setSection(\'assessment\')">📝 ابدأ التقييم</button></div>'}function files(){return '<div class="head"><h2>📁 ملفات الدرس</h2></div><div class="content"><div class="grid"><div class="note"><b>01-interactif.html</b><br>الدرس التفاعلي الأصلي</div><div class="note"><b>02-reference-imprimable.docx</b><br>المرجع التعليمي</div><div class="note"><b>03-evaluation-a-imprimer.docx</b><br>التقييم الرسمي</div><div class="note"><b>04-examen-electronique.html</b><br>الاختبار الإلكتروني</div></div></div>'}const quizMap={"g5-t1-l01":[['اختر الفاعل في Mona parle français.',['Mona','parle','français'],'Mona'],['اختر الفعل في Mona parle français.',['Mona','parle','français'],'parle']],"g5-t1-l02":[['اختر الأداة الصحيحة: ___ stylo',['un','une','des'],'un'],['اختر الأداة الصحيحة: ___ gomme',['le','une','des'],'une']],"g5-t1-l03":[['جمع un livre هو:',['des livres','des livre','les livre'],'des livres'],['جمع un animal هو:',['des animals','des animaux','les animal'],'des animaux']],"g5-t1-l04":[['70 بالفرنسية:',['soixante-dix','quatre-vingts','quatre-vingt-dix'],'soixante-dix'],['80 بالفرنسية:',['quatre-vingts','soixante-dix','quatre-vingt-dix'],'quatre-vingts']],"g5-t1-l05":[['7:00 بالفرنسية:',['Il est sept heures.','Il est midi.','Il est minuit.'],'Il est sept heures.'],['15 دقيقة تعني:',['et quart','et demie','moins le quart'],'et quart']],"g5-t1-l06":[['الفصل الذي يأتي بعد l’hiver هو:',['le printemps','l’automne','l’été'],'le printemps'],['نقول:',['au printemps','en printemps','au été'],'au printemps']],"g5-t1-l07":[['Sara يمكن استبدالها بـ:',['Elle','Nous','Ils'],'Elle'],['Nous (parler) trois langues:',['parlons','parle','parlez'],'parlons']],"g5-t1-l08":[['J’ai des oreilles → Ce sont ___ oreilles.',['mes','ma','mon'],'mes'],['C’est ___ livre.',['mon','ma','mes'],'mon']],"g5-t1-l09":[['الأنف بالفرنسية:',['le nez','la bouche','le front'],'le nez'],['الأذن بالفرنسية:',['l’oreille','les yeux','les dents'],'l’oreille']],"g5-t1-l10":[['___ banane',['une','un','des'],'une'],['قلم بالفرنسية:',['un stylo','une trousse','une pomme'],'un stylo']],"g5-t1-l11":[['القدم بالفرنسية:',['le pied','la main','le coude'],'le pied'],['الذراع:',['le bras','la jambe','le genou'],'le bras']]};function assessment(){const qs=quizMap[id]||[];return '<div class="head"><h2>📝 التقييم</h2></div><div class="content">'+qs.map((q,i)=>'<div class="lesson-card"><b>'+((i+1)+'. '+q[0])+'</b><div class="grid" style="margin-top:10px">'+q[1].map(o=>'<button class="choice" data-q="'+i+'" data-a="'+encodeURIComponent(o)+'" onclick="answer(this)">'+esc(o)+'</button>').join('')+'</div><div id="r'+i+'"></div></div>').join('')+'<button class="btn primary" onclick="finishQuiz()">إنهاء التقييم</button><div id="score"></div></div>'}function answer(el){const i=+el.dataset.q;if(document.querySelector('.choice[data-q="'+i+'"].correct,.choice[data-q="'+i+'"].wrong'))return;const q=quizMap[id][i],v=decodeURIComponent(el.dataset.a);if(v===q[2]){el.classList.add('correct');score++}else{el.classList.add('wrong');[...document.querySelectorAll('.choice[data-q="'+i+'"]')].find(x=>decodeURIComponent(x.dataset.a)===q[2])?.classList.add('correct')}document.getElementById('r'+i).innerHTML='<div class="result '+(v===q[2]?'ok':'bad')+'">'+(v===q[2]?'✅ إجابة صحيحة':'❌ الإجابة الصحيحة: '+esc(q[2]))+'</div>'}function finishQuiz(){const total=(quizMap[id]||[]).length,pct=total?Math.round(score/total*100):0;document.getElementById('score').innerHTML='<div class="result '+(pct>=70?'ok':'bad')+'">النتيجة: '+score+' / '+total+' — '+pct+'%</div>';if(pct>=70)localStorage.setItem('hm-g5-quiz-'+id,'passed')}function games(){return '<div class="head"><h2>🎮 الألعاب</h2></div><div class="content"><div class="note"><b>تحدي المفردات</b><br>استمع إلى كلمة ثم حاول تذكر معناها واستخدامها في جملة.</div><button class="btn primary" onclick="setSection(\'vocabulary\')">📚 ابدأ التحدي</button></div>'}function setSection(s){active=s;history.replaceState(null,'','grade-5-lesson.html?id='+encodeURIComponent(id)+'&section='+s);render()}function render(){if(!data)return;title.textContent=data.content?.[2]||data.content?.[0]||'Leçon';subtitle.textContent=(data.titleAr||'')+' · '+(data.titleFr||'');loadNote.textContent='تم تحميل محتوى الدرس بالكامل';bar.style.width=(((allLessons.findIndex(x=>x.id===id)+1)/allLessons.length)*100)+'%';nav();viewer.innerHTML=active==='overview'?overview():active==='vocabulary'?vocabulary():active==='pronunciation'?pronunciation():active==='grammar'?grammar():active==='conversation'?conversation():active==='practice'?practice():active==='files'?files():active==='games'?games():assessment()}completeBtn.onclick=()=>{localStorage.setItem('hm-g5-complete-'+id,'true');completionMessage.textContent='تم حفظ إكمال الدرس بنجاح.'};langSelect.onchange=e=>{document.documentElement.lang=e.target.value};fetch('data/lessons/grade-5/full-course-content.json').then(r=>r.json()).then(x=>{allLessons=x.lessons||[];data=allLessons.find(v=>v.id===id);if(!data)throw Error('lesson');render()}).catch(()=>viewer.innerHTML='<div class="error">حدث خطأ في تحميل بيانات الدرس.</div>');</script></body></html>
