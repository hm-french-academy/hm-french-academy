<!doctype html>
<html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14264a"><title>HM Academy | مراجعة رابعة ابتدائي</title><link rel="stylesheet" href="css/premium-shell.css?v=20260831"><style>
main{max-width:1050px;margin:auto;padding:24px 16px 60px}.hero{background:linear-gradient(135deg,#14264a,#315fc8);color:#fff;border-radius:26px;padding:25px;margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:25px}.hero p{margin:0;line-height:1.8;opacity:.93}.tabs{display:flex;gap:8px;overflow:auto;margin:0 0 16px}.tab{border:1px solid #dfe5ef;background:#fff;border-radius:999px;padding:10px 14px;font-weight:900;white-space:nowrap;cursor:pointer}.tab.active{background:#2563eb;color:#fff;border-color:#2563eb}.panel{background:#fff;border:1px solid #e4e9f2;border-radius:22px;padding:20px;box-shadow:0 10px 28px #14264a10}.hidden{display:none}.q{border:1px solid #e5e9f1;border-radius:18px;padding:16px;margin:12px 0}.q h3{margin:0 0 12px;font-size:16px;color:#14264a}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.opt{border:1px solid #dce3ee;background:#fbfcff;border-radius:13px;padding:12px;cursor:pointer;text-align:center;font-weight:800}.opt.selected{border-color:#2563eb;background:#eef4ff}.opt.correct{border-color:#178b73;background:#e9f8f4}.opt.wrong{border-color:#d94b4b;background:#fff0f0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:13px;padding:12px 18px;background:#2563eb;color:#fff;font-weight:900;cursor:pointer}.btn.secondary{background:#eef1f6;color:#33405a}.score{font-size:22px;font-weight:900;color:#14264a}.resultBox{margin:12px 0 16px;padding:14px 16px;border-radius:16px;background:#f7f9fc;border:1px solid #e1e7f0}.resultBox.good{background:#eefaf6;border-color:#bfe8da}.resultBox strong{color:#14264a}.feedback{margin-top:12px;padding:12px 14px;border-radius:14px;background:#fff8e8;border:1px solid #f0d99b;line-height:1.8}.feedback .answer{font-weight:900;color:#178b73}.feedback .reason{color:#475569}.progress{height:8px;background:#edf1f6;border-radius:99px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;width:0;background:#2563eb}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.mini{border:1px solid #e4e9f2;border-radius:18px;padding:16px}.mini strong{display:block;color:#14264a}.mini p{margin:6px 0;color:#69758b;line-height:1.6}@media(max-width:700px){.options,.cards{grid-template-columns:1fr}.hero{border-radius:21px}}
</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="index.html">الرئيسية</a><a href="dashboard.html">الطالب</a><a href="course.html">المناهج الدراسية</a><a href="library.html">المكتبة</a></nav></header><main>
<section class="hero"><h1>🧠 المراجعة السنوية — الصف الرابع الابتدائي</h1><p>مراجعة رقمية للترمين استعدادًا للانتقال إلى الصف الخامس. اختر المسار وابدأ مباشرة.</p></section>
<div class="tabs"><button class="tab active" data-tab="diagnostic">🎯 التشخيص</button><button class="tab" data-tab="review">📚 المراجعة</button><button class="tab" data-tab="practice">✍️ التدريب</button><button class="tab" data-tab="final">🏆 اختبار الجاهزية</button></div>
<section id="diagnostic" class="panel"></section>
<section id="review" class="panel hidden"><h2>المراجعة الذكية</h2><p>اختر محورًا للمراجعة السريعة.</p><div class="cards" id="reviewCards"></div></section>
<section id="practice" class="panel hidden"></section>
<section id="final" class="panel hidden"></section>
</main><script>
const diagnostics=[
['Au printemps, les feuilles sont…',['vertes','jaunes','noires'],0],['En hiver, il fait…',['chaud','froid','beau'],1],['Écris 16 en lettres.',['seize','six','dix-sept'],0],['19 en chiffres =',['9','19','90'],1],['8 + 2 =',['8','10','12'],1],['14 − 7 =',['5','7','9'],1],['4:30 =',['quatre heures et quart','quatre heures et demie','quatre heures moins le quart'],1],['11:45 =',['onze heures moins le quart','douze heures moins le quart','une heure moins le quart'],0],['… nez.',['la','les','le'],2],['… bouche.',['le','la','les'],1],['C’est … nez.',['ma','mon','mes'],1],['Ce sont … oreilles.',['mon','ma','mes'],2],['C’est … tête.',['ton','ta','tes'],1],['Ce sont … bras.',['ton','ta','tes'],2],['Ali … un pantalon.',['ai','as','a'],2],['Nous … des chaussures.',['avez','avons','ont'],1],['Elles … des gants.',['a','avons','ont'],2],['Je … grand.',['suis','es','est'],0],['Nous … grands.',['sommes','êtes','sont'],0],['La robe est …',['noir','noire','noirs'],1],['Mets au féminin: grand →',['grande','grands','grandes'],0],['Je suis grand. → négation',['Je ne suis pas grand.','Je n’est pas grand.','Je suis ne pas grand.'],0],['J’ai un pull. → négation',['Je n’ai pas un pull.','Je n’ai pas de pull.','Je ne ai pas de pull.'],1],['Ils ont des pantalons. → négation',['Ils ne sont pas de pantalons.','Ils n’ont pas des pantalons.','Ils n’ont pas de pantalons.'],2]
];
const practice=[
['Au …, il fait chaud.',['printemps','été','hiver'],1],['Les feuilles sont jaunes en…',['été','automne','printemps'],1],['20 en lettres =',['vingt','vingt-deux','douze'],0],['2:15 =',['deux heures et quart','deux heures et demie','deux heures moins le quart'],0],['… cheveux.',['le','la','les'],2],['C’est … front.',['mon','ma','mes'],0],['Ce sont … dents.',['mon','ma','mes'],2],['C’est … main.',['ton','ta','tes'],1],['Vous … des gants.',['avez','avons','ont'],0],['Elles … des chaussettes.',['a','avons','ont'],2],['Elle … grande.',['est','sont','es'],0],['Nous … gros.',['sommes','êtes','sont'],0],['Les chaussures sont…',['noire','noires','noir'],1],['Nous sommes gros. → négation',['Nous ne sommes pas gros.','Nous n’avons pas gros.','Nous sommes ne pas gros.'],0],['Nous avons des chemises. → négation',['Nous ne sommes pas de chemises.','Nous n’avons pas de chemises.','Nous n’avons pas des chemises.'],1]
];
const reviews=[['Les saisons','printemps · été · automne · hiver · au/en · météo'],['Les chiffres et l’heure','0–30 · lettres/chiffres · additions · soustractions · et quart · et demie · moins le quart · midi/minuit'],['Le visage et les articles','tête · front · cheveux · sourcils · yeux · nez · bouche · dents · oreilles · menton · le/la/l’/les · un/une/des'],['Le corps et les possessifs','cou · bras · poitrine · ventre · main · doigts · jambe · genou · pieds · mon/ma/mes · ton/ta/tes · son/sa/ses'],['Les vêtements et avoir','jupe · pantalon · pull · veste · cravate · costume · chaussettes · chemise · ceinture · chaussures · gants · robe · j’ai/tu as/il a/nous avons/vous avez/ils ont'],['Être et les adjectifs','grand/grande · petit/petite · court/courte · gros/grosse · long/longue · mince · maigre · être au présent'],['La famille et la négation','décrire la famille · être · avoir · ne…pas / n’…pas · pas de avec avoir']];
function explainQuestion(q){const t=q[0].toLowerCase();if(t.includes('feuilles'))return 'لأن مفردات الفصول والألوان مرتبطة بالسياق: في الربيع تكون الأوراق خضراء، وفي الخريف تصبح صفراء.';if(t.includes('hiver')||t.includes('chaud'))return 'لأن كلمة hiver تعني الشتاء، والطقس فيه يكون باردًا.';if(t.includes('printemps')&&t.includes('chaud'))return 'لأن عبارة Au printemps تعني في الربيع، بينما الطقس الحار يرتبط هنا بـ l’été.';if(t.includes('automne'))return 'لأن automne يعني الخريف، وهو الفصل الذي تصبح فيه الأوراق صفراء.';if(t.includes('lettres')||t.includes('chiffres'))return 'لأن المطلوب تحويل العدد بين صورته الرقمية وكتابته بالكلمات مع الحفاظ على قيمة العدد.';if(t.includes('+')||t.includes('−'))return 'لأن العملية الحسابية يجب أن تُجرى أولًا ثم نختار الناتج المطابق.';if(t.includes(':'))return 'لأن قراءة الساعة تعتمد على الدقائق: 15 = et quart، و30 = et demie، و45 = moins le quart.';if(t.includes('nez')||t.includes('bouche')||t.includes('cheveux')||t.includes('front')||t.includes('dents'))return 'لأن أداة التعريف في الفرنسية تتحدد حسب جنس الاسم وعدده: le للمذكر، la للمؤنث، وles للجمع.';if(t.includes('oreilles')||t.includes('bras'))return 'لأن الاسم هنا جمع، ولذلك نستخدم صيغة الجمع des/mes/tes بحسب نوع السؤال.';if(t.includes('tête')||t.includes('main'))return 'لأن الاسم مؤنث، لذلك نستخدم صيغة الملكية المؤنثة مثل ma أو ta.';if(t.includes('pantalon')||t.includes('gants')||t.includes('chaussettes')||t.includes('chemises'))return 'لأن تصريف avoir يتبع الفاعل، ومع النفي بعد avoir نستخدم عادة ne…pas de أمام الاسم الجمع أو غير المحدد.';if(t.includes('grand')||t.includes('gros')||t.includes('robe')||t.includes('chaussures'))return 'لأن الصفة يجب أن تتوافق مع الاسم أو الفاعل في الجنس والعدد؛ لذلك تتغير نهايتها عند المؤنث أو الجمع.';if(t.includes('négation'))return 'لأن النفي في الفرنسية يُبنى حول الفعل بـ ne…pas، ومع avoir تتحول أداة غير محددة غالبًا إلى de بعد النفي.';return 'لأن الإجابة الصحيحة هي الصيغة التي تتوافق مع قاعدة السؤال أو معنى المفردة في هذا السياق.';}
function renderQuiz(el, data, key){let answers=JSON.parse(localStorage.getItem(key)||'{}'); el.innerHTML=`<div class="score" id="${key}-score">لم يبدأ الاختبار بعد</div><div class="progress"><span id="${key}-bar"></span></div><div id="${key}-feedback"></div>`+data.map((q,i)=>`<article class="q" data-i="${i}"><h3>${i+1}. ${q[0]}</h3><div class="options">${q[1].map((o,j)=>`<button class="opt ${answers[i]===j?'selected':''}" data-j="${j}">${o}</button>`).join('')}</div></article>`).join('')+`<div class="actions"><button class="btn" id="${key}-check">تصحيح الاختبار</button><button class="btn secondary" id="${key}-reset">إعادة المحاولة</button></div>`;
 el.querySelectorAll('.q').forEach((q,i)=>q.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{answers[i]=+b.dataset.j;localStorage.setItem(key,JSON.stringify(answers));q.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');}));
 el.querySelector('#'+key+'-check').onclick=()=>{let score=0,wrong=[];data.forEach((q,i)=>{let art=el.querySelector(`.q[data-i="${i}"]`);art.querySelectorAll('.opt').forEach((b,j)=>{b.classList.remove('correct','wrong');if(j===q[2])b.classList.add('correct');if(answers[i]===j&&j!==q[2])b.classList.add('wrong')});if(answers[i]===q[2])score++;else if(answers[i]!==undefined)wrong.push({i,q});let old=art.querySelector('.feedback');if(old)old.remove();if(answers[i]!==undefined&&answers[i]!==q[2]){art.insertAdjacentHTML('beforeend',`<div class="feedback"><div class="answer">✅ الإجابة الصحيحة: ${q[1][q[2]]}</div><div class="reason">💡 السبب: ${explainQuestion(q)}</div></div>`);}});let unanswered=data.length-score-wrong.length;el.querySelector('#'+key+'-score').textContent=`الدرجة: ${score} / ${data.length}  •  الأخطاء: ${wrong.length}  •  غير مجاب: ${unanswered}`;el.querySelector('#'+key+'-bar').style.width=(score/data.length*100)+'%';el.querySelector('#'+key+'-feedback').innerHTML=wrong.length?`<div class="resultBox"><strong>📝 تصحيح الأخطاء</strong><div style="margin-top:6px">تم تمييز الإجابة الصحيحة وظهر سببها أسفل كل سؤال أخطأت فيه. راجع السبب قبل الانتقال للخطوة التالية.</div></div>`:`<div class="resultBox good"><strong>🎉 ممتاز!</strong><div style="margin-top:6px">كل الإجابات التي أجبت عنها صحيحة. لا توجد أخطاء تحتاج إلى تصحيح.</div></div>`;localStorage.setItem(key+'Score',score);};
 el.querySelector('#'+key+'-reset').onclick=()=>{localStorage.removeItem(key);location.reload();};}
renderQuiz(document.getElementById('diagnostic'),diagnostics,'r4Diagnostic');
renderQuiz(document.getElementById('practice'),practice,'r4Practice');
document.getElementById('reviewCards').innerHTML=reviews.map((x,i)=>`<div class="mini"><strong>${i+1}. ${x[0]}</strong><p>${x[1]}</p></div>`).join('');
const finalData=diagnostics.slice(0,12).concat(practice.slice(3,15));renderQuiz(document.getElementById('final'),finalData,'r4Final');
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.querySelectorAll('main>section:not(.hero)').forEach(x=>x.classList.add('hidden'));document.getElementById(t.dataset.tab).classList.remove('hidden');});
</script></body></html>
