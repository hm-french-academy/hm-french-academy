const p=new URLSearchParams(location.search),id=p.get('id')||'grade7-u1-l2',sec=p.get('section')||'introduction';const paths={'grade7-u1-l2':'unit-1/lesson-2.json','grade7-u1-l3':'unit-1/lesson-3.json','grade7-u1-l4':'unit-1/lesson-4.json','grade7-u1-l5':'unit-1/lesson-5.json','grade7-u1-l6':'unit-1/lesson-6.json','grade7-u2-l1':'unit-2/lesson-1.json','grade7-u2-l2':'unit-2/lesson-2.json','grade7-u3-l1':'unit-3/lesson-1.json','grade7-u3-l2':'unit-3/lesson-2.json','grade7-u3-l3':'unit-3/lesson-3.json'};const stages=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];let D={};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const sh=a=>[...a].sort(()=>Math.random()-.5);const speak=t=>{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)};function nav(){navEl.innerHTML=stages.map(x=>`<a class="${x[0]===sec?'on':''}" href="?id=${encodeURIComponent(id)}&section=${x[0]}">${x[1]}</a>`).join('')}const navEl=document.getElementById('nav');const titleEl=document.getElementById('title'),frEl=document.getElementById('fr'),goalEl=document.getElementById('goal'),appEl=document.getElementById('app');function intro(){let j=D.journeyContent?.introduction||{};return `<h2>🚀 البداية</h2><div class="note source"><b>هدف الدرس</b><br>${esc(j.goal||'اكتشف محتوى الدرس ثم طبّقه خطوة بخطوة.')}</div><p>محتوى الدرس مبني على المصدر المعتمد، مع تفاعل وتصحيح فوري.</p>`}function vals(){let v=D.journeyContent?.vocabulary?.items||D.interactiveExtraction?.vocabulary||D.sourceData?.vocabulary||[];return Array.isArray(v)?v:[]}function vocabulary(){return `<h2>🖼️ المفردات</h2><div class="grid">${vals().map(x=>`<article class="card return `<h2>🎧 النطق بالتفصيل: الأعداد من 0 إلى 20</h2><div class="note source"><b>طريقة المذاكرة:</b> اضغط 🔊، استمع مرتين، ثم كرر بصوت مرتفع. الكتابة العربية تقريبية للمساعدة فقط؛ النطق الفرنسي الصحيح هو الصوت الذي تسمعه.</div><h3>🔢 استمع إلى كل عدد</h3><div class="grid">${rows.map(([w,n,ar,ipa])=>`<article class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="font-size:24px" dir="ltr">${w}</b><b style="font-size:24px">${n}</b></div><p class="ar">${ar}</p><p dir="ltr" class="muted">IPA: ${ipa}</p><button onclick='speak(${JSON.stringify(w)})'>🔊 استمع وكرّر</button></article>`).join('')}</div><h3>👄 أسرار النطق التي تحتاج إلى الانتباه</h3><div class="card"><b>1. الصوت الأنفي</b><p>في <span dir="ltr">un, cinq, onze, quinze, vingt</span> يخرج جزء من الصوت من الأنف، ولا تضف نونًا عربية واضحة في النهاية. استمع ثم قلّد الصوت.</p></div><div class="card"><b>2. حرف R الفرنسي</b><p>في <span dir="ltr">trois, quatre, treize, quatorze</span> يخرج حرف R من مؤخرة الفم/الحلق، وليس راء عربية ملفوفة بطرف اللسان.</p></div><div class="card"><b>3. الفرق بين 6 و16</b><p><span dir="ltr">six</span> = 6، أما <span dir="ltr">seize</span> = 16. استمع إلى كل كلمة منفردة وكررهما بالتبادل.</p><button onclick="speak('six')">🔊 six</button> <button onclick="speak('seize')">🔊 seize</button></div><div class="card"><b>4. الأعداد المركبة 17 و18 و19</b><p>تتكوّن من <span dir="ltr">dix + sept / huit / neuf</span>. في <span dir="ltr">dix-huit</span> يتحول صوت x إلى /z/ قبل صوت العلة، فيسمع اتصال بين الجزأين.</p><button onclick="speak('dix-sept, dix-huit, dix-neuf')">🔊 استمع إلى 17–19</button></div><div class="card"><b>5. الحروف النهائية</b><p>لا تنطق كل حرف مكتوب. في <span dir="ltr">vingt</span> لا تُنطق g وt النهائيتان في النطق المعتاد للعدد وحده. وفي <span dir="ltr">six</span> و<span dir="ltr">dix</span> يكون النطق هنا /sis/ و/dis/.</p></div><div class="note"><b>تدريب سريع:</b> استمع إلى هذه السلسلة ثم حاول قولها دون النظر: <span dir="ltr">trois – treize – six – seize – dix-sept – dix-huit – vingt</span><br><button onclick="speak('trois, treize, six, seize, dix-sept, dix-huit, vingt')">🔊 شغّل سلسلة التدريب</button></div>`;

let a=D.journeyContent?.pronunciation?.items||vals().map(x=>x[0]);return `<h2>🎧 النطق</h2><div class="grid">${(Array.isArray(a)?a:[]).map(x=>`<article class="card"><b dir="ltr">${esc(x)}</b><br><button onclick='speak(${JSON.stringify(x)})'>🔊 استمع</button></article>`).join('')}</div>`}function grammar(){let a=D.journeyContent?.grammar?.notes||[];return `<h2>📘 القواعد</h2>${a.map((x,i)=>`<article class="card" style="margin:8px 0"><b>${i+1}</b> — ${esc(x)}</article>`).join('')||'<p class="note">القاعدة مرتبطة بأنشطة المصدر.</p>'}`}function conversation(){let a=D.journeyContent?.conversation?.sourcePreserved||[];return `<h2>💬 المحادثة</h2><div class="grid">${a.map(x=>`<article class="card"><p dir="ltr">${esc(x)}</p><button onclick='speak(${JSON.stringify(x)})'>🔊 استمع</button></article>`).join('')||'<p class="note">لا يوجد حوار نصي منظم.</p>'}</div>`}function normalize(a){return (Array.isArray(a)?a:[]).filter(x=>Array.isArray(x)&&x.length>=3).map(x=>({q:x[0],o:Array.isArray(x[1])?x[1]:[],a:x[2]})).filter(x=>x.o.length&&x.a!==undefined)}function sourcePractice(){let a=normalize(D.sourceData?.quizData);if(!a.length&&Array.isArray(D.interactiveExtraction?.assessment))a=normalize(D.interactiveExtraction.assessment.map(x=>[x.q,x.options,x.answer]));if(!a.length){let v=vals();a=v.slice(0,6).map(x=>({q:`ما معنى «${x[0]}»؟`,o:[x[1],...sh(v.filter(y=>y!==x)).slice(0,2).map(y=>y[1])],a:x[1]}))}return a.slice(0,6)}function fallbackAssessment(){let a=normalize(D.assessment?.items);if(a.length>=20)return a.slice(0,20);let base=[...a,...sourcePractice()];let v=vals();for(const x of v){if(base.length>=20)break;base.push({q:`اختر التعبير الصحيح المرتبط بـ «${x[0]}»`,o:[x[0],...sh(v.filter(y=>y!==x)).slice(0,2).map(y=>y[0])],a:x[0]})}let notes=D.journeyContent?.grammar?.notes||[];for(const n of notes){if(base.length>=20)break;base.push({q:'أي عبارة تمثل القاعدة الصحيحة؟',o:[n,...sh(notes.filter(x=>x!==n)).slice(0,2)],a:n})}if(!base.length&&D.interactiveExtraction?.vocabulary){let v=D.interactiveExtraction.vocabulary;for(const x of v){if(base.length>=20)break;base.push({q:`اختر التعبير الصحيح للوقت: ${x[1]}`,o:[x[0],...sh(v.filter(y=>y!==x)).slice(0,2).map(y=>y[0])],a:x[0]})}}while(base.length<20&&base.length>0)base.push({...base[base.length%Math.max(1,base.length)],q:base[base.length%Math.max(1,base.length)].q+' · مراجعة'});return base.slice(0,20)}let qid=0;function quiz(qs){let k='q'+(++qid);window.Q=window.Q||{};Q[k]={c:0};return `<div id="s-${k}" class="score">0 / ${qs.length}</div><div class="grid">${qs.map((q,i)=>`<article class="card"><b>${i+1}. ${esc(q.q)}</b><div class="options">${sh(q.o).map(o=>`<button data-q="${k}-${i}" onclick='ans(${JSON.stringify(k)},${i},${JSON.stringify(o)},${JSON.stringify(q.a)},this)'>${esc(o)}</button>`).join('')}</div><div id="f-${k}-${i}" class="feedback"></div></article>`).join('')}</div>`}function ans(k,i,v,c,b){if(b.disabled)return;document.querySelectorAll(`[data-q="${k}-${i}"]`).forEach(x=>x.disabled=true);Q[k].c+=v===c?1:0;document.getElementById(`f-${k}-${i}`).innerHTML=v===c?'<span class="ok">✅ صحيح — أحسنت!</span>':`<span class="bad">❌ غير صحيح.</span><br>الإجابة الصحيحة: ${esc(c)}`;document.getElementById('s-'+k).textContent=`${Q[k].c} / ${document.querySelectorAll(`[data-q^="${k}-"]`).length/Math.max(1,document.querySelectorAll(`[data-q="${k}-0"]`).length)}`;let total=document.querySelectorAll(`[data-q^="${k}-"]`).length;document.getElementById('s-'+k).textContent=`${Q[k].c} / ${total}`}function practice(){let a=id==='grade7-u1-l5'?[{q:'Quel nombre vient après onze ?',o:['douze','dix','treize'],a:'douze'},{q:'Complète la suite : 3, 4, __, 6',o:['cinq','sept','huit'],a:'cinq'},{q:'Deux + quatre = …',o:['cinq','six','sept'],a:'six'},{q:'Combien d’étoiles ? ⭐ ⭐ ⭐ ⭐ ⭐',o:['trois','cinq','six'],a:'cinq'},{q:'Écris en chiffres : dix-sept',o:['7','16','17'],a:'17'},{q:'Quel nombre est entre 14 et 16 ?',o:['quatorze','quinze','seize'],a:'quinze'}]:sourcePractice();return `<h2>✍️ التدريب التفاعلي</h2><p class="note source">6 تدريبات متنوعة: تسلسل الأعداد، العدّ، الحساب، والتحويل بين الكلمة والرقم. تختلف عن أسئلة التقييم.</p>${quiz(a)}`}function assessment(){let a=fallbackAssessment();return `<h2>🏆 التقييم</h2><p class="note source">20 عنصرًا في كل درس. عند نقص عناصر منظمة في ملف البيانات، يُستكمل من مفردات وأنشطة المصدر نفسها دون إدخال محتوى من مرحلة أخرى.</p>${quiz(a)}`}function games(){if(id==='grade7-u1-l5'){return `<h2>🎮 ألعاب الأعداد التفاعلية</h2><p class="note source">العب، اختر إجابتك، وشاهد النتيجة فورًا. استخدم زر السؤال الجديد للمتابعة.</p><section class="card"><h3>🎯 اللعبة 1: طابق الكلمة مع الرقم</h3><p>اختر الرقم الذي يطابق الكلمة الفرنسية.</p><div id="g1q" style="font-size:28px;font-weight:900" dir="ltr"></div><div id="g1opts" class="options"></div><div id="g1fb" class="feedback"></div><button onclick="newMatchGame()">سؤال جديد ↻</button><p class="muted" id="g1score">النقاط: 0</p></section><section class="card" style="margin-top:12px"><h3>🧩 اللعبة 2: أكمل خط الأعداد</h3><p>اختر العدد الناقص في التسلسل.</p><div id="g2q" style="font-size:28px;font-weight:900;direction:ltr"></div><div id="g2opts" class="options"></div><div id="g2fb" class="feedback"></div><button onclick="newSequenceGame()">تسلسل جديد ↻</button><p class="muted" id="g2score">النقاط: 0</p></section><section class="card" style="margin-top:12px"><h3>🎧 اللعبة 3: اسمع واختر</h3><p>استمع إلى العدد الفرنسي ثم اختر الرقم الصحيح.</p><button onclick="playListeningGame()">🔊 استمع إلى السؤال</button><div id="g3opts" class="options"></div><div id="g3fb" class="feedback"></div><button onclick="newListeningGame()">عدد جديد ↻</button><p class="muted" id="g3score">النقاط: 0</p></section>`; }let a=D.journeyContent?.games||[];return `<h2>🎮 الألعاب</h2><div class="grid">${(Array.isArray(a)?a:[]).map((x,i)=>`<article class="card"><div style="font-size:42px">🎮</div><b>${i+1}. ${esc(x)}</b><p class="muted">نشاط مرتبط بهدف الدرس.</p></article>`).join('')}</div>`}function video(){let v=id==='grade7-u1-l5'?'liP5GecvBQk':D.sourceVideoId;return `<h2>🎬 فيديو شرح الأعداد الفرنسية من 0 إلى 20</h2>${v?`<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v)}?rel=0" title="French numbers 0 to 20 with pronunciation" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div><p class="note source">شاهد الفيديو، وردّد الأعداد مع المتحدث، ثم انتقل إلى التدريب والألعاب.</p><p><a href="https://www.youtube.com/watch?v=${encodeURIComponent(v)}" target="_blank" rel="noopener">فتح الفيديو على YouTube ↗</a></p>`:'<p class="note">لا يوجد فيديو مصدر محفوظ.</p>'}`}function progress(){let k='hm_g7_'+id+'_progress',v=+localStorage.getItem(k)||0;return `<h2>📈 التقدم</h2><div class="card"><b>تقدم هذا الدرس</b><div class="progress"><i style="width:${Math.min(100,v)}%"></i></div><p>${Math.min(100,v)}%</p><button onclick='localStorage.setItem(${JSON.stringify(k)},"100");location.reload()'>تسجيل إتمام الدرس</button></div>`}const numberPairs=[['zéro','0'],['un','1'],['deux','2'],['trois','3'],['quatre','4'],['cinq','5'],['six','6'],['sept','7'],['huit','8'],['neuf','9'],['dix','10'],['onze','11'],['douze','12'],['treize','13'],['quatorze','14'],['quinze','15'],['seize','16'],['dix-sept','17'],['dix-huit','18'],['dix-neuf','19'],['vingt','20']];
const gameState={g1:{score:0,answer:''},g2:{score:0,answer:''},g3:{score:0,answer:'',word:''}};

function render(){let m={introduction:intro,vocabulary,pronunciation,grammar,conversation,practice,video,games,assessment,progress};appEl.innerHTML=(m[sec]||intro)();nav();if(sec==='games'&&id==='grade7-u1-l5'){newMatchGame();newSequenceGame();newListeningGame()}}async function load(){try{if(!paths[id])throw 0;const dataUrl=new URL(`/hm-french-academy/data/lessons/grade-7/${paths[id]}?v=20261011-runtime-fix3&t=${Date.now()}`,location.origin);const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),12000);let r;try{r=await fetch(dataUrl.href,{cache:'no-store',signal:controller.signal})}finally{clearTimeout(timeout)}if(!r.ok)throw new Error(`HTTP ${r.status} while loading ${dataUrl.pathname}`);let raw=await r.text();let x;try{x=JSON.parse(raw)}catch(parseError){throw new Error(`Invalid lesson JSON (${raw.length} chars): ${parseError.message}`)}for(let i=0;i<8&&typeof x.content==='string';i++){try{x=JSON.parse(x.content)}catch(parseError){throw new Error(`Nested lesson JSON is invalid: ${parseError.message}`)}}if(!x||typeof x!=='object')throw new Error('Lesson data is empty or invalid');D=x;titleEl.textContent=D.titleAr||id;frEl.textContent=D.titleFr||'';goalEl.textContent=D.journeyContent?.introduction?.goal||'';render()}catch(e){console.error('HM lesson load failed:',e);appEl.innerHTML='<div class="note"><b>تعذر تحميل محتوى هذا الدرس.</b><br>'+esc(e?.message||'تعذر الوصول لملف البيانات')+'<br><button onclick="location.reload()">إعادة المحاولة</button></div>'}}load();</script>
