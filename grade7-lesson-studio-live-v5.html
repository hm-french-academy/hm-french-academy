<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | الصف الأول الإعدادي</title><style>:root{--n:#102a56;--b:#2563eb;--t:#0f9f91;--ink:#14213d;--muted:#667085;--line:#e1e7f0;--ok:#087443;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef4ff,#fff);color:var(--ink);font-family:Arial,"Noto Sans Arabic",sans-serif;line-height:1.7}.wrap{max-width:1180px;margin:auto;padding:10px}.hero{background:linear-gradient(135deg,#102a56,#2455a6,#0f9f91);color:#fff;border-radius:24px;padding:22px}.hero h1{margin:6px 0;font-size:clamp(24px,4vw,40px)}.fr{direction:ltr;font-weight:900}.bar{display:flex;gap:7px;overflow:auto;background:#fff;padding:10px;border:1px solid var(--line);border-radius:18px;margin-top:12px}.bar a{white-space:nowrap;text-decoration:none;background:#eef3fb;color:var(--n);padding:8px 12px;border-radius:999px;font-weight:800}.bar a.on{background:var(--b);color:#fff}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:18px}.panel{padding:16px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}.card{padding:14px}.ar{text-align:center;color:#315aa4;font-weight:800}.note{padding:12px;border-radius:12px;background:#f8fafc;border-right:4px solid #94a3b8;margin:10px 0}.source{background:#effbf8;border-right-color:var(--t)}button{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer;background:var(--b);color:#fff}.options{display:grid;gap:7px;margin-top:8px}.options button{text-align:right;background:#fff;color:var(--ink);border:1px solid var(--line)}.feedback{min-height:25px;margin-top:7px}.ok{color:var(--ok);font-weight:900}.bad{color:var(--bad);font-weight:900}.score{font-size:22px;font-weight:900}.muted{color:var(--muted)}.progress{height:10px;background:#e8edf5;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--t))}.video{position:relative;width:100%;padding-top:56.25%;overflow:hidden;border-radius:16px;background:#111}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><body><div class="wrap"><header class="hero"><b>🇫🇷 HM Academy · الصف الأول الإعدادي</b><h1 id="title">جاري التحميل…</h1><div id="fr" class="fr"></div><p id="goal"></p></header><nav class="bar" id="nav"></nav><main class="panel" id="app">جاري تجهيز الدرس…</main></div><script>
const p=new URLSearchParams(location.search),id=p.get('id')||'grade7-u1-l2',sec=p.get('section')||'introduction';const paths={'grade7-u1-l2':'unit-1/lesson-2.json','grade7-u1-l3':'unit-1/lesson-3.json','grade7-u1-l4':'unit-1/lesson-4.json','grade7-u1-l5':'unit-1/lesson-5.json','grade7-u1-l6':'unit-1/lesson-6.json','grade7-u2-l1':'unit-2/lesson-1.json','grade7-u2-l2':'unit-2/lesson-2.json','grade7-u3-l1':'unit-3/lesson-1.json','grade7-u3-l2':'unit-3/lesson-2.json','grade7-u3-l3':'unit-3/lesson-3.json'};const stages=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];let D={};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const sh=a=>[...a].sort(()=>Math.random()-.5);const speak=t=>{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)};function nav(){navEl.innerHTML=stages.map(x=>`<a class="${x[0]===sec?'on':''}" href="?id=${encodeURIComponent(id)}&section=${x[0]}">${x[1]}</a>`).join('')}const navEl=document.getElementById('nav');function intro(){let j=D.journeyContent?.introduction||{};return `<h2>🚀 البداية</h2><div class="note source"><b>هدف الدرس</b><br>${esc(j.goal||'اكتشف محتوى الدرس ثم طبّقه خطوة بخطوة.')}</div><p>محتوى الدرس مبني على المصدر المعتمد، مع تفاعل وتصحيح فوري.</p>`}function vals(){let v=D.journeyContent?.vocabulary?.items||D.interactiveExtraction?.vocabulary||D.sourceData?.vocabulary||[];return Array.isArray(v)?v:[]}function vocabulary(){return `<h2>🖼️ المفردات</h2><div class="grid">${vals().map(x=>`<article class="card"><b dir="ltr">${esc(x[0])}</b><p class="ar">${esc(x[1]||'')}</p>${x[2]?`<p dir="ltr">${esc(x[2])}</p>`:''}<button onclick='speak(${JSON.stringify(x[0])})'>🔊 استمع</button></article>`).join('')||'<p class="note">لا توجد مفردات منظمة.</p>'}</div>`}function pronunciation(){let a=D.journeyContent?.pronunciation?.items||vals().map(x=>x[0]);return `<h2>🎧 النطق</h2><div class="grid">${(Array.isArray(a)?a:[]).map(x=>`<article class="card"><b dir="ltr">${esc(x)}</b><br><button onclick='speak(${JSON.stringify(x)})'>🔊 استمع</button></article>`).join('')}</div>`}function grammar(){let a=D.journeyContent?.grammar?.notes||[];return `<h2>📘 القواعد</h2>${a.map((x,i)=>`<article class="card" style="margin:8px 0"><b>${i+1}</b> — ${esc(x)}</article>`).join('')||'<p class="note">القاعدة مرتبطة بأنشطة المصدر.</p>'}`}function conversation(){let a=D.journeyContent?.conversation?.sourcePreserved||[];return `<h2>💬 المحادثة</h2><div class="grid">${a.map(x=>`<article class="card"><p dir="ltr">${esc(x)}</p><button onclick='speak(${JSON.stringify(x)})'>🔊 استمع</button></article>`).join('')||'<p class="note">لا يوجد حوار نصي منظم.</p>'}</div>`}function normalize(a){return (Array.isArray(a)?a:[]).filter(x=>Array.isArray(x)&&x.length>=3).map(x=>({q:x[0],o:Array.isArray(x[1])?x[1]:[],a:x[2]})).filter(x=>x.o.length&&x.a!==undefined)}function sourcePractice(){let a=normalize(D.sourceData?.quizData);if(!a.length&&Array.isArray(D.interactiveExtraction?.assessment))a=normalize(D.interactiveExtraction.assessment.map(x=>[x.q,x.options,x.answer]));if(!a.length){let v=vals();a=v.slice(0,6).map(x=>({q:`ما معنى «${x[0]}»؟`,o:[x[1],...sh(v.filter(y=>y!==x)).slice(0,2).map(y=>y[1])],a:x[1]}))}return a.slice(0,6)}function fallbackAssessment(){let a=normalize(D.assessment?.items);if(a.length>=20)return a.slice(0,20);let base=[...a,...sourcePractice()];let v=vals();for(const x of v){if(base.length>=20)break;base.push({q:`اختر التعبير الصحيح المرتبط بـ «${x[0]}»`,o:[x[0],...sh(v.filter(y=>y!==x)).slice(0,2).map(y=>y[0])],a:x[0]})}let notes=D.journeyContent?.grammar?.notes||[];for(const n of notes){if(base.length>=20)break;base.push({q:'أي عبارة تمثل القاعدة الصحيحة؟',o:[n,...sh(notes.filter(x=>x!==n)).slice(0,2)],a:n})}if(!base.length&&D.interactiveExtraction?.vocabulary){let v=D.interactiveExtraction.vocabulary;for(const x of v){if(base.length>=20)break;base.push({q:`اختر التعبير الصحيح للوقت: ${x[1]}`,o:[x[0],...sh(v.filter(y=>y!==x)).slice(0,2).map(y=>y[0])],a:x[0]})}}while(base.length<20&&base.length>0)base.push({...base[base.length%Math.max(1,base.length)],q:base[base.length%Math.max(1,base.length)].q+' · مراجعة'});return base.slice(0,20)}let qid=0;function quiz(qs){let k='q'+(++qid);window.Q=window.Q||{};Q[k]={c:0};return `<div id="s-${k}" class="score">0 / ${qs.length}</div><div class="grid">${qs.map((q,i)=>`<article class="card"><b>${i+1}. ${esc(q.q)}</b><div class="options">${sh(q.o).map(o=>`<button data-q="${k}-${i}" onclick='ans(${JSON.stringify(k)},${i},${JSON.stringify(o)},${JSON.stringify(q.a)},this)'>${esc(o)}</button>`).join('')}</div><div id="f-${k}-${i}" class="feedback"></div></article>`).join('')}</div>`}function ans(k,i,v,c,b){if(b.disabled)return;document.querySelectorAll(`[data-q="${k}-${i}"]`).forEach(x=>x.disabled=true);Q[k].c+=v===c?1:0;document.getElementById(`f-${k}-${i}`).innerHTML=v===c?'<span class="ok">✅ صحيح — أحسنت!</span>`:`<span class="bad">❌ غير صحيح.</span><br>الإجابة الصحيحة: ${esc(c)}`;document.getElementById('s-'+k).textContent=`${Q[k].c} / ${document.querySelectorAll(`[data-q^="${k}-"]`).length/Math.max(1,document.querySelectorAll(`[data-q="${k}-0"]`).length)}`;let total=document.querySelectorAll(`[data-q^="${k}-"]`).length;document.getElementById('s-'+k).textContent=`${Q[k].c} / ${total}`}function practice(){let a=sourcePractice();return `<h2>✍️ التدريب التفاعلي</h2><p class="note source">6 أسئلة مرتبطة بالمصدر مع تصحيح فوري.</p>${quiz(a)}`}function assessment(){let a=fallbackAssessment();return `<h2>🏆 التقييم</h2><p class="note source">20 عنصرًا في كل درس. عند نقص عناصر منظمة في ملف البيانات، يُستكمل من مفردات وأنشطة المصدر نفسها دون إدخال محتوى من مرحلة أخرى.</p>${quiz(a)}`}function games(){let a=D.journeyContent?.games||[];return `<h2>🎮 الألعاب</h2><div class="grid">${(Array.isArray(a)?a:[]).map((x,i)=>`<article class="card"><div style="font-size:42px">🎮</div><b>${i+1}. ${esc(x)}</b><p class="muted">نشاط مرتبط بهدف الدرس.</p></article>`).join('')}</div>`}function video(){let v=D.sourceVideoId;return `<h2>🎬 الفيديو</h2>${v?`<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v)}?rel=0" title="فيديو الدرس الأصلي" allowfullscreen></iframe></div><p class="note source">فيديو المصدر الأصلي.</p>`:'<p class="note">لا يوجد فيديو مصدر محفوظ.</p>'}`}function progress(){let k='hm_g7_'+id+'_progress',v=+localStorage.getItem(k)||0;return `<h2>📈 التقدم</h2><div class="card"><b>تقدم هذا الدرس</b><div class="progress"><i style="width:${Math.min(100,v)}%"></i></div><p>${Math.min(100,v)}%</p><button onclick='localStorage.setItem(${JSON.stringify(k)},"100");location.reload()'>تسجيل إتمام الدرس</button></div>`}function render(){let m={introduction:intro,vocabulary,pronunciation,grammar,conversation,practice,video,games,assessment,progress};app.innerHTML=(m[sec]||intro)();nav()}async function load(){try{if(!paths[id])throw 0;let r=await fetch(`data/lessons/grade-7/${paths[id]}?v=20260908-v5`,{cache:'no-store'});if(!r.ok)throw 0;let x=await r.json();for(let i=0;i<8&&typeof x.content==='string';i++)x=JSON.parse(x.content);D=x;title.textContent=D.titleAr||id;fr.textContent=D.titleFr||'';goal.textContent=D.journeyContent?.introduction?.goal||'';render()}catch(e){app.innerHTML='<div class="note"><b>تعذر تحميل محتوى هذا الدرس.</b><br>أعد المحاولة بعد لحظات.</div>'}}load();</script>
