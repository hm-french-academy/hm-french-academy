return `<h2>🎧 النطق بالتفصيل: الأعداد من 0 إلى 20</h2><div class="note source"><b>طريقة المذاكرة:</b> اضغط 🔊، استمع مرتين، ثم كرر بصوت مرتفع. الكتابة العربية تقريبية للمساعدة فقط؛ النطق الفرنسي الصحيح هو الصوت الذي تسمعه.</div><h3>🔢 استمع إلى كل عدد</h3><div class="grid">${rows.map(([w,n,ar,ipa])=>`<article class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="font-size:24px" dir="ltr">${w}</b><b style="font-size:24px">${n}</b></div><p class="ar">${ar}</p><p dir="ltr" class="muted">IPA: ${ipa}</p><button onclick='speak(${JSON.stringify(w)})'>🔊 استمع وكرّر</button></article>`).join('')}</div><h3>👄 أسرار النطق التي تحتاج إلى الانتباه</h3><div class="card"><b>1. الصوت الأنفي</b><p>في <span dir="ltr">un, cinq, onze, quinze, vingt</span> يخرج جزء من الصوت من الأنف، ولا تضف نونًا عربية واضحة في النهاية. استمع ثم قلّد الصوت.</p></div><div class="card"><b>2. حرف R الفرنسي</b><p>في <span dir="ltr">trois, quatre, treize, quatorze</span> يخرج حرف R من مؤخرة الفم/الحلق، وليس راء عربية ملفوفة بطرف اللسان.</p></div><div class="card"><b>3. الفرق بين 6 و16</b><p><span dir="ltr">six</span> = 6، أما <span dir="ltr">seize</span> = 16. استمع إلى كل كلمة منفردة وكررهما بالتبادل.</p><button onclick="speak('six')">🔊 six</button> <button onclick="speak('seize')">🔊 seize</button></div><div class="card"><b>4. الأعداد المركبة 17 و18 و19</b><p>تتكوّن من <span dir="ltr">dix + sept / huit / neuf</span>. في <span dir="ltr">dix-huit</span> يتحول صوت x إلى /z/ قبل صوت العلة، فيسمع اتصال بين الجزأين.</p><button onclick="speak('dix-sept, dix-huit, dix-neuf')">🔊 استمع إلى 17–19</button></div><div class="card"><b>5. الحروف النهائية</b><p>لا تنطق كل حرف مكتوب. في <span dir="ltr">vingt</span> لا تُنطق g وt النهائيتان في النطق المعتاد للعدد وحده. وفي <span dir="ltr">six</span> و<span dir="ltr">dix</span> يكون النطق هنا /sis/ و/dis/.</p></div><div class="note"><b>تدريب سريع:</b> استمع إلى هذه السلسلة ثم حاول قولها دون النظر: <span dir="ltr">trois – treize – six – seize – dix-sept – dix-huit – vingt</span><br><button onclick="speak('trois, treize, six, seize, dix-sept, dix-huit, vingt')">🔊 شغّل سلسلة التدريب</button></div>`;

function timeClock(time){
 const parts=String(time).match(/(\d{1,2}):(\d{2})/); if(!parts)return '<div class="clock-emoji">🕰️</div>';
 const h=Number(parts[1])%12, m=Number(parts[2]); const ha=(h*30+m*.5)-90, ma=m*6-90;
 const pt=(a,r)=>[60+Math.cos(a*Math.PI/180)*r,60+Math.sin(a*Math.PI/180)*r];
 const [hx,hy]=pt(ha,25),[mx,my]=pt(ma,36);
 return '<svg class="clock-face" viewBox="0 0 120 120" role="img" aria-label="clock '+time+'"><circle cx="60" cy="60" r="54" fill="#f8fbff" stroke="#2563eb" stroke-width="4"/>'+Array.from({length:12},(_,i)=>{let [x,y]=pt(i*30-90,43);return '<circle cx="'+x+'" cy="'+y+'" r="2.3" fill="#102a56"/>'}).join('')+'<line x1="60" y1="60" x2="'+hx+'" y2="'+hy+'" stroke="#102a56" stroke-width="5" stroke-linecap="round"/><line x1="60" y1="60" x2="'+mx+'" y2="'+my+'" stroke="#0f9f91" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="60" r="4" fill="#0f9f91"/></svg>';
}
