<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy — Internal Lesson Preview V2</title><style>:root{--b:#2563eb;--n:#173a82;--t:#0f9f91;--p:#e92d83;--bg:#f3f6fb;--ink:#15213d;--line:#dfe6f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans Arabic",sans-serif}.app{max-width:1200px;margin:auto;padding:10px}.hero{background:linear-gradient(135deg,var(--n),var(--b),var(--t));color:white;border-radius:22px;padding:20px}.hero h1{margin:7px 0;font-size:clamp(24px,4vw,38px)}.hero p{margin:0;line-height:1.8}.bar,.journey,.panel,.foot{background:#fff;border:1px solid var(--line);border-radius:18px;margin-top:10px;padding:10px}.bar{display:flex;gap:7px;overflow:auto}.bar button,.stage,.btn,.option{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.bar button,.stage{background:#edf2fb;color:var(--n);white-space:nowrap}.on{background:var(--b)!important;color:#fff!important}.journey{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.stage{white-space:normal;min-height:50px}.panel{min-height:600px;padding:18px}.head{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:15px}.k{color:var(--b);font-weight:900}.head h2{margin:4px 0;font-size:30px}.muted{color:#68758c;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px}.card,.exercise{border:1px solid var(--line);border-radius:16px;padding:15px;background:#fff}.card{box-shadow:0 5px 16px #00000008}.fr{direction:ltr;text-align:center;font-size:21px;font-weight:900}.ar{text-align:center;color:#315aa4;margin-top:6px}.icon{font-size:30px}.btn{background:var(--b);color:white}.secondary{background:#edf2fb;color:var(--n)}.audio{text-align:center;margin-top:10px}.rule{background:#f8faff;border-right:5px solid var(--t);padding:16px;border-radius:14px;line-height:2}.formula{direction:ltr;text-align:center;font-size:24px;font-weight:900}.bubble{padding:12px;border-radius:16px;background:#eef4ff;margin:8px 0;max-width:80%;line-height:2}.me{margin-right:auto;background:#fff1f8}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:12px}.option{background:#f8faff;border:1px solid var(--line)}.good{background:#e9f8f0!important}.bad{background:#fff0f2!important}.video{aspect-ratio:16/9;border-radius:17px;background:linear-gradient(135deg,#111c3b,#30477f);color:white;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px}.game{text-align:center;padding:30px;border:2px dashed #bfd0ef;border-radius:18px}.game .big{font-size:60px}.progress{height:10px;background:#e5eaf2;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--b);width:0}.note{font-size:12px;color:#68758c;line-height:1.8}@media(max-width:850px){.journey{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.journey{grid-template-columns:repeat(2,1fr)}.panel{padding:12px}.head h2{font-size:24px}}</style></head><body><div class="app"><section class="hero"><div>🇫🇷 HM Academy · Lesson Experience V2 · معاينة داخلية</div><h1 id="title"></h1><p id="goal"></p></section><div class="bar" id="lessons"></div><div class="journey" id="journey"></div><main class="panel" id="panel"></main><footer class="foot"><b>📈 تقدم الرحلة</b><div class="progress"><div id="fill" class="fill"></div></div><div class="note" id="pt"></div></footer></div><script>const ST=[['🚀','البداية'],['🖼️','المفردات'],['🎧','النطق'],['📘','القواعد'],['💬','المحادثة'],['✍️','التدريب'],['🎬','الفيديو'],['🎮','الألعاب'],['🧠','المراجعة الذكية'],['🏆','التقييم'],['📈','التقدم']];const D=[['الدرس 1','Bienvenue en français !','مرحبًا بك في الفرنسية',['Bonjour|مرحبًا','Salut|أهلًا','Au revoir|إلى اللقاء','Merci|شكرًا','S’il vous plaît|من فضلك']],['الدرس 2','Les salutations','التحيات',['Salut !|مرحبًا','Bonjour|صباح الخير','Bonsoir|مساء الخير','Ça va bien.|أنا بخير','Ça va mal.|لست بخير']],['الدرس 3','Les pronoms sujets et les verbes du 1er groupe','ضمائر الفاعل وأفعال المجموعة الأولى',['Je|أنا','Tu|أنت','Il|هو','Elle|هي','Nous|نحن','Vous|أنتم','Ils|هم','Elles|هنّ']],['الدرس 4','Le verbe être et la présentation','فعل être والتقديم',['Je suis|أنا','Tu es|أنت','Il / Elle est|هو / هي','Nous sommes|نحن','Vous êtes|أنتم']],['الدرس 5','Les nombres (0-20)','الأعداد من 0 إلى 20',['zéro|0','un|1','deux|2','trois|3','quatre|4','cinq|5','dix|10','vingt|20']],['الدرس 6','L’heure','الساعة',['Il est une heure|1:00','Il est deux heures et quart|2:15','Il est deux heures et demie|2:30','Il est midi|12:00']],['الدرس 7','Tu as quel âge ?','كم عمرك؟',['Quel âge as-tu ?|كم عمرك؟','J’ai treize ans.|عمري 13 سنة','Tu as quel âge ?|كم عمرك؟']],['الدرس 8','Qu’est-ce que c’est ?','ما هذا؟ أدوات الفصل',['un livre|كتاب','un cahier|كراسة','un stylo|قلم','une règle|مسطرة','une trousse|مقلمة']],['الدرس 9','Les couleurs','الألوان',['rouge|أحمر','bleu|أزرق','vert|أخضر','jaune|أصفر','noir|أسود']],['الدرس 10','Les articles définis et les jours','أدوات المعرفة وأيام الأسبوع',['Le|مذكر مفرد','La|مؤنث مفرد','L’|قبل حرف متحرك','Les|جمع','Lundi|الاثنين','Dimanche|الأحد']],['الدرس 11','Les mois de l’année et les saisons','الشهور والفصول',['Janvier|يناير','Mars|مارس','Juin|يونيو','Septembre|سبتمبر','Décembre|ديسمبر']]];let L=0,S=0,seen=new Set();function sp(t){if(speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';speechSynthesis.speak(u)}}function head(i,t,s){return `<div class="head"><div class="k">${ST[i][0]} ${ST[i][1]}</div><h2>${t}</h2><div class="muted">${s}</div></div>`}function cards(){return `<div class="grid">${D[L][3].map(x=>{let[a,b]=x.split('|');return `<div class="card"><div class="icon">🧩</div><div class="fr">${a}</div><div class="ar">${b}</div><div class="audio"><button class="btn" onclick="sp('${a.replaceAll("'","\\'")}')">🔊 اسمع</button></div></div>`}).join('')}</div>`}function ex(q,a,opts){return `<div class="exercise"><b>${q}</b><div class="options">${opts.map(o=>`<button class="option" onclick="ans(this,'${o}','${a}')">${o}</button>`).join('')}</div><div class="note"></div></div>`}function ans(b,v,a){let n=b.parentElement.nextElementSibling;b.parentElement.querySelectorAll('button').forEach(x=>x.disabled=true);if(v===a){b.classList.add('good');n.textContent='✓ إجابة صحيحة — أحسنت!'}else{b.classList.add('bad');n.textContent='✗ راجع المثال وحاول مرة أخرى.'}}function render(){let d=D[L];document.getElementById('title').textContent=d[0]+' — '+d[1];document.getElementById('goal').textContent=d[2];document.getElementById('lessons').innerHTML=D.map((x,i)=>`<button class="${i===L?'on':''}" onclick="L=${i};S=0;render()">${x[0]}</button>`).join('');document.getElementById('journey').innerHTML=ST.map((x,i)=>`<button class="stage ${i===S?'on':''}" onclick="S=${i};seen.add(i);render()">${x[0]} ${x[1]}</button>`).join('');seen.add(S);let h='';if(S===0)h=head(S,'استكشف هدف الدرس','تمهيد قصير يوضح للطالب ماذا سيتعلم وكيف سيستخدمه.')+`<div class="card"><div class="icon">🎯</div><h3>${d[1]}</h3><p>${d[2]}</p><p class="muted">تعلم → طبّق → استمع → تدرّب → قيّم نفسك.</p></div>`;if(S===1)h=head(S,'المفردات','بطاقات مرئية مع المعنى العربي وزر النطق.')+cards();if(S===2)h=head(S,'النطق','استمع إلى العبارة ثم كررها بصوتك.')+cards();if(S===3)h=head(S,'افهم القاعدة','شرح قصير مقسّم إلى قاعدة ثم أمثلة ثم تطبيق.')+`<div class="rule"><h3>${d[1]}</h3><p>القاعدة لا تظهر كفقرة طويلة؛ بل في وحدات صغيرة سهلة المراجعة.</p><div class="formula">Exemple → explication → pratique</div><p>مثال: <b>${d[3][0].split('|')[0]}</b> — ${d[3][0].split('|')[1]}</p></div>`;if(S===4)h=head(S,'المحادثة','الحوار في فقاعات واضحة مع نطق مستقل.')+`<div class="bubble">👦 <b>Amr:</b><br>${L===6?'Quel âge as-tu ?':'Bonjour ! Ça va ?'}<br><button class="btn" onclick="sp('${L===6?'Quel âge as-tu ?':'Bonjour ! Ça va ?'}')">🔊</button></div><div class="bubble me">👧 <b>Seif:</b><br>${L===6?'J’ai treize ans.':'Ça va bien, merci.'}<br><button class="btn" onclick="sp('${L===6?'J’ai treize ans.':'Ça va bien, merci.'}')">🔊</button></div>`;if(S===5)h=head(S,'تدرّب الآن','تفاعل مباشر وتصحيح فوري.')+ex(L===6?'Complète : J’___ treize ans.':'Choisis la bonne réponse.','Bonjour',['Bonjour','Bonsoir','Merci']);if(S===6)h=head(S,'الفيديو','منطقة الفيديو داخل الرحلة، ولا يتم اختلاق رابط فيديو.')+`<div class="video">▶️<br>الفيديو التعليمي<br><small>يُربط المصدر الحقيقي عند توفره</small></div>`;if(S===7)h=head(S,'لعبة تعليمية','تطبيق سريع للمعلومة بعد الشرح.')+`<div class="game"><div class="big">🎯</div><h3>اختر الإجابة الأسرع</h3><button class="btn" onclick="this.textContent='🎉 أحسنت! جرّب مرة أخرى'">ابدأ اللعبة</button></div>`;if(S===8)h=head(S,'المراجعة الذكية','مراجعة مستقلة تركّز على النقاط التي تحتاج تثبيتًا.')+`<div class="grid"><div class="card">🧠<h3>مراجعة سريعة</h3><p>${d[2]}</p><button class="btn" onclick="this.textContent='✓ تمت المراجعة'">راجع الآن</button></div></div>`;if(S===9)h=head(S,'التقييم','اختبار قصير مع تغذية راجعة فورية.')+ex('Choisis la bonne réponse.','Bonjour',['Bonjour','Bonsoir','Au revoir'])+ex('Choisis la bonne réponse.','Merci',['Merci','Salut','Lundi']);if(S===10)h=head(S,'تقدمك','ملخص بصري للرحلة داخل الدرس.')+`<div class="card"><h3>أنجزت ${seen.size} من ${ST.length} مراحل</h3><div class="progress"><div class="fill" style="width:${seen.size/ST.length*100}%"></div></div></div><div class="grid" style="margin-top:12px">${ST.map((x,i)=>`<div class="card">${seen.has(i)?'✓':'○'} ${x[0]} ${x[1]}</div>`).join('')}</div>`;document.getElementById('panel').innerHTML=h;document.getElementById('fill').style.width=(seen.size/ST.length*100)+'%';document.getElementById('pt').textContent=`الدرس ${L+1}: تمت زيارة ${seen.size} من ${ST.length} مراحل.`}render();</script></body></html>
