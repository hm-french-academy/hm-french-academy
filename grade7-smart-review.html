<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a56"><title>HM Academy | المراجعة الذكية</title><style>:root{--n:#102a56;--b:#2563eb;--t:#0f9f91;--ink:#14213d;--muted:#667085;--line:#e1e7f0;--ok:#087443;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef4ff,#fff);color:var(--ink);font-family:Arial,"Noto Sans Arabic",sans-serif;line-height:1.7}.wrap{max-width:1000px;margin:auto;padding:12px}.hero{background:linear-gradient(135deg,#102a56,#2455a6,#0f9f91);color:#fff;border-radius:24px;padding:22px;box-shadow:0 15px 40px #102a5620}.hero h1{margin:5px 0;font-size:clamp(25px,5vw,38px)}.fr{direction:ltr;text-align:right;font-weight:900}.back{display:inline-block;margin-top:10px;color:#fff;text-decoration:none;background:#ffffff22;border:1px solid #ffffff44;padding:7px 12px;border-radius:10px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px}.card{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}.options{display:grid;gap:7px;margin-top:9px}.options button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px;text-align:right;font-weight:800;cursor:pointer}.feedback{min-height:25px;margin-top:7px}.ok{color:var(--ok);font-weight:900}.bad{color:var(--bad);font-weight:900}.score{font-size:24px;font-weight:900}.muted{color:var(--muted)}ul{margin-top:7px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}.loading{text-align:center;padding:30px}@media(max-width:650px){.wrap{padding:8px}.panel{padding:12px}}
</style></head><body><div class="wrap"><header class="hero"><b>🇫🇷 HM Academy · الصف الأول الإعدادي</b><h1 id="title">المراجعة الذكية</h1><div id="fr" class="fr"></div><p>مراجعة قصيرة متكيفة مع محتوى الدرس، مع تصحيح فوري وتثبيت للنقاط التي تحتاج إلى مراجعة.</p><a id="back" class="back" href="grade7-lesson-studio.html">← العودة إلى الدرس</a></header><main id="app" class="panel"><div class="loading">جاري تجهيز المراجعة…</div></main><footer class="footer">HM Academy · مراجعة ذكية مرتبطة بمحتوى الدرس</footer></div><script>
const p=new URLSearchParams(location.search),id=p.get('lesson')||p.get('id')||'grade7-u1-l1';
const files={'grade7-u1-l1':'unit-1/lesson-1-gold-standard.json','grade7-u1-l2':'unit-1/lesson-2.json','grade7-u1-l3':'unit-1/lesson-3.json','grade7-u1-l4':'unit-1/lesson-4.json','grade7-u1-l5':'unit-1/lesson-5.json','grade7-u1-l6':'unit-1/lesson-6.json','grade7-u2-l1':'unit-2/lesson-1.json','grade7-u2-l2':'unit-2/lesson-2.json','grade7-u3-l1':'unit-3/lesson-1.json','grade7-u3-l2':'unit-3/lesson-2.json','grade7-u3-l3':'unit-3/lesson-3.json'};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function norm(s){return String(s??'').trim().toLowerCase().replace(/[.!؟?،,:;«»]/g,'').replace(/\s+/g,' ')}
function pick(arr,n){return [...arr].sort(()=>Math.random()-.5).slice(0,n)}
function makeQuestions(d){const out=[];const v=(d.journeyContent?.vocabulary?.items||[]).filter(x=>x&&x[0]&&x[1]);for(const x of pick(v,5)){out.push({q:`ما معنى «${x[0]}»؟`,opts:[x[1],...pick(v.filter(y=>y!==x),2).map(y=>y[1])],a:x[1],why:`المفردة الواردة في محتوى الدرس: ${x[0]}.`})}const g=d.journeyContent?.grammar||{};const notes=g.notes||[];for(const n of pick(notes,2)){out.push({q:`أي عبارة تلخّص هذه القاعدة؟`,opts:[n,...['اختر التعبير المناسب حسب المعنى والسياق.','نراجع الكلمة مع نطقها ثم نستخدمها في جملة.'].filter(x=>x!==n).slice(0,2)],a:n,why:'هذه الملاحظة مرتبطة بقاعدة/استعمال الدرس.'})}const targets=d.journeyContent?.smartReview?.targets||[];for(const t of pick(targets,3)){out.push({q:`ما الهدف الذي تراجعه هنا؟`,opts:[t,...['المفردات الأساسية','الاستماع والنطق','فهم الموقف واختيار التعبير المناسب'].filter(x=>x!==t).slice(0,2)],a:t,why:'هذا الهدف محدد في خطة المراجعة الذكية للدرس.'})}while(out.length<8){const x=v[out.length%Math.max(1,v.length)];if(!x)break;out.push({q:`اختر التعبير الصحيح من مفردات الدرس:`,opts:[x[0],...pick(v.filter(y=>y!==x),2).map(y=>y[0])],a:x[0],why:'الإجابة مأخوذة من مفردات الدرس.'})}return out.slice(0,8)}
async function load(){const path=files[id];if(!path){document.getElementById('app').innerHTML='<div class="loading">لا توجد مراجعة مرتبطة بهذا الدرس.</div>';return}try{let r=await fetch(`data/lessons/grade-7/${path}?v=20260908-smart-review`,{cache:'no-store'});let x=await r.json();for(let i=0;i<8&&typeof x.content==='string';i++)x=JSON.parse(x.content);const d=x;document.getElementById('title').textContent='🧠 المراجعة الذكية · '+(d.titleAr||id);document.getElementById('fr').textContent=d.titleFr||'';document.getElementById('back').href=`grade7-lesson-studio.html?id=${encodeURIComponent(id)}&section=smart-review`;const qs=makeQuestions(d);let score=0;document.getElementById('app').innerHTML=`<div class="panel"><b>🎯 هدف المراجعة</b><p>${esc((d.journeyContent?.introduction?.goal)||'ثبّت أهم عناصر الدرس ثم اختبر فهمك.')}</p><p class="muted">هذه المراجعة قصيرة ومركزة، وتصحح كل إجابة فورًا.</p></div><section class="grid" id="qs"></section><div class="panel" id="result"><div class="score">النتيجة: <span id="score">0</span> / ${qs.length}</div><p class="muted">أجب عن الأسئلة كلها لرؤية نتيجة المراجعة.</p></div>`;document.getElementById('qs').innerHTML=qs.map((q,i)=>`<article class="card"><b>${i+1}. ${esc(q.q)}</b><div class="options">${pick(q.opts, q.opts.length).map(o=>`<button type="button" data-i="${i}" data-v="${encodeURIComponent(o)}">${esc(o)}</button>`).join('')}</div><div class="feedback" id="f${i}"></div></article>`).join('');document.querySelectorAll('#qs button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,v=decodeURIComponent(b.dataset.v),q=qs[i],f=document.getElementById('f'+i);if(b.disabled)return;if(norm(v)===norm(q.a)){f.innerHTML='<span class="ok">✅ صحيح — أحسنت!</span>';score++;document.getElementById('score').textContent=score}else f.innerHTML=`<span class="bad">❌ ليست الإجابة الصحيحة.</span><br><span class="muted">💡 ${esc(q.why)}</span>`;document.querySelectorAll(`#qs button[data-i="${i}"]`).forEach(x=>x.disabled=true);if(document.querySelectorAll('#qs button:disabled').length===qs.length*1){document.getElementById('result').innerHTML+=`<p><b>${score===qs.length?'🏆 ممتاز! أتقنت المراجعة.':score>=Math.ceil(qs.length*.7)?'👏 أداء جيد! راجع النقاط التي أخطأت فيها.':'🔁 أعد المراجعة ثم جرّب مرة أخرى.'}</b></p>`}})}catch(e){document.getElementById('app').innerHTML='<div class="loading">تعذر تجهيز المراجعة الآن. حاول فتح الصفحة مرة أخرى.</div>'}}load();
</script></body></html>
