<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | وحدة المقاطع</title><link rel="stylesheet" href="css/premium-shell.css"><style>main{max-width:900px;margin:auto;padding:28px 16px}.panel,.box{background:#fff;border:1px solid #e1e7f0;border-radius:20px;padding:22px}.example{font-size:30px;font-weight:900;direction:ltr;text-align:center;padding:18px;background:#f7f9fc;border-radius:16px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.muted{color:#68758b;line-height:1.8}.result{margin-top:12px;padding:12px;border-radius:12px;background:#eef7ee;font-weight:800}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy</span></a><nav class="hm-nav"><a href="syllables.html">← خريطة الكورس</a><a href="dashboard.html">لوحة الطالب</a></nav></header><main><div id="app" class="panel">جاري تحميل الوحدة...</div></main><script>const DATA={"syllable-types":{title:'أنواع المقاطع',goal:'التعرف إلى المقطع كجزء من بنية الكلمة قبل الانتقال إلى التحليل التفصيلي.',examples:['pa','mi','lo','ta']},"open-closed-syllables":{title:'المقطع المفتوح والمغلق',goal:'التمييز بين أنماط البنية في أمثلة فرنسية مناسبة للمستوى.',examples:['pa','par','mi','mis']},"vowel-groups":{title:'مجموعات الحروف المتحركة',goal:'التعامل مع مجموعات الحروف المتحركة بوصفها أنماطًا كتابية تحتاج إلى قراءة صحيحة.',examples:['ai','ou','au','oi']},"consonant-groups":{title:'مجموعات الحروف الساكنة',goal:'قراءة التجمعات الساكنة الشائعة دون افتراض أن كل حرف يملك صوتًا مستقلًا.',examples:['tr','pr','ch','bl']},"word-segmentation":{title:'تقسيم الكلمات',goal:'تقسيم الكلمة إلى وحدات قابلة للقراءة ثم إعادة تركيبها.',examples:['pa-pa','ma-man','sa-lut','a-mi']},"stress-group":{title:'المجموعة الإيقاعية',goal:'ربط المقاطع بالإيقاع الطبيعي للكلام الفرنسي.',examples:['bonjour','petite maison','avec Marie']},"practice":{title:'تدريب شامل',goal:'تطبيق المهارة على كلمات جديدة ثم الانتقال تدريجيًا إلى الجمل.',examples:['salut','paris','maman','petite']}};function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();speechSynthesis.resume();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.8;speechSynthesis.speak(u)}const id=new URLSearchParams(location.search).get('unit'),d=DATA[id];const app=document.getElementById('app');if(!d){app.innerHTML='<p>الوحدة غير موجودة.</p>'}else{app.innerHTML=`<h1>🔤 ${d.title}</h1><p class="muted">${d.goal}</p><h2>أمثلة وتدريب</h2><div id="examples"></div><button class="btn" id="complete">✓ إكمال الوحدة</button><div id="result"></div>`;document.getElementById('examples').innerHTML=d.examples.map((x,i)=>`<div class="box" style="margin:10px 0"><div class="example">${x}</div><button class="btn" onclick="speak(${JSON.stringify(x.replaceAll('-',' '))})">🔊 استمع</button><label style="display:block;margin-top:10px"><input type="checkbox" class="ok"> قرأت المقطع/الكلمة بشكل صحيح</label></div>`).join('');document.getElementById('complete').onclick=()=>{const checks=[...document.querySelectorAll('.ok')],ok=checks.filter(x=>x.checked).length,pct=Math.round(ok/checks.length*100);localStorage.setItem('hm-syllables-progress-'+id,JSON.stringify({id,completed:ok===checks.length,score:pct,at:Date.now()}));document.getElementById('result').className='result';document.getElementById('result').textContent='نتيجة التدريب: '+pct+'% — '+(ok===checks.length?'تم إكمال الوحدة.':'أكمل كل الأمثلة ثم أعد المحاولة.')}}}</script></body></html>
