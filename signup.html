<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HM Academy | إنشاء حساب</title>
<link rel="stylesheet" href="css/style.css?v=20260807">
<style>.auth-box{max-width:540px;margin:auto}.auth-status{margin:12px 0;padding:11px 14px;border-radius:12px;display:none;font-weight:700}.auth-status.error{display:block;background:#fff1f2;color:#b42318;border:1px solid #fecdd3}.auth-status.success{display:block;background:#ecfdf3;color:#067647;border:1px solid #a7f3d0}.auth-box input{width:100%;padding:14px 16px;border:1px solid #d1d5db;border-radius:14px;margin:8px 0 16px;box-sizing:border-box}.auth-actions{display:flex;gap:10px;flex-wrap:wrap}.auth-actions a{text-decoration:none}</style>
</head>
<body><header><h2>🇫🇷 HM Academy</h2><p>بوابة الطالب</p><nav><a href="index.html">الرئيسية</a><a href="login.html">تسجيل الدخول</a></nav></header>
<main><section class="hero"><h1>🎓 إنشاء حساب طالب</h1><p>أنشئ حسابك لمتابعة رحلتك التعليمية وتقدمك على HM Academy.</p><div class="course auth-box"><label for="name">الاسم</label><input id="name" type="text" autocomplete="name" placeholder="اسم الطالب"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" placeholder="example@email.com"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="new-password" placeholder="6 أحرف على الأقل"><label for="confirm">تأكيد كلمة المرور</label><input id="confirm" type="password" autocomplete="new-password" placeholder="أعد كتابة كلمة المرور"><div id="status" class="auth-status" role="alert"></div><div class="auth-actions"><button id="signupBtn" class="btn" type="button">إنشاء الحساب</button><a class="btn secondary" href="login.html">لدي حساب بالفعل</a></div></div></section></main><footer>HM Academy © 2026</footer>
<script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY}from'./js/supabase-config.js';const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const $=id=>document.getElementById(id);function msg(t,type='error'){$('status').textContent=t;$('status').className='auth-status '+type}$('signupBtn').addEventListener('click',async()=>{const name=$('name').value.trim(),email=$('email').value.trim(),password=$('password').value,confirm=$('confirm').value;if(!name||!email||!password||!confirm)return msg('من فضلك أكمل جميع البيانات.');if(password.length<6)return msg('كلمة المرور يجب ألا تقل عن 6 أحرف.');if(password!==confirm)return msg('تأكيد كلمة المرور غير مطابق.');$('signupBtn').disabled=true;$('signupBtn').textContent='جارٍ إنشاء الحساب…';const emailRedirectTo=`${window.location.origin}${window.location.pathname.replace(/\/[^/]*$/,'/')}login.html`;const{data,error}=await supabase.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo}});if(error){msg(error.message.includes('already registered')?'هذا البريد مسجل بالفعل. جرّب تسجيل الدخول.':'تعذر إنشاء الحساب. تأكد من البيانات وحاول مرة أخرى.');$('signupBtn').disabled=false;$('signupBtn').textContent='إنشاء الحساب';return}if(data.session){msg('تم إنشاء الحساب وتسجيل الدخول بنجاح. جارٍ فتح منطقة الطالب…','success');setTimeout(()=>location.href='dashboard.html',700)}else{msg('تم إنشاء الحساب. افتح رسالة التأكيد في بريدك الإلكتروني ثم سجّل الدخول.','success');$('signupBtn').disabled=false;$('signupBtn').textContent='إنشاء الحساب'}});</script></body></html>
