<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HM Academy - لوحة الطالب</title>
<link rel="stylesheet" href="css/style.css?v=20260807">
</head>
<body>
<header><h2>🇫🇷 HM Academy</h2><p>لوحة الطالب الذكية</p></header>
<main>
<section class="hero">
<h1>👤 رحلتك التعليمية</h1>
<div class="stats-card">
<p>المستوى: <strong data-student-level>A1</strong></p>
<p>النقاط: <strong data-student-xp>0</strong> XP</p>
<p>الدروس المكتملة: <strong id="completed-lessons">0</strong></p>
</div>
</section>
<section class="hero">
<h2>📊 تقدم المستوى</h2>
<div id="level-description"></div>
<div style="background:#eee;border-radius:20px;height:18px;overflow:hidden"><div id="progress-bar" style="height:100%;width:0%"></div></div>
<p id="progress-text">0%</p>
</section>
</main>
<script src="scripts/learning-progress.js"></script>
<script src="scripts/level-engine.js"></script>
<script>
(async()=>{
 const data=HMProgress.get();
 document.querySelector('[data-student-xp]').textContent=data.xp||0;
 document.getElementById('completed-lessons').textContent=(data.completedLessons||[]).length;
 const level=await getStudentLevel(data.xp||0);
 const nextXP=level.maxXP+1;
 const percent=Math.min(100,Math.round(((data.xp-level.minXP)/(level.maxXP-level.minXP))*100));
 document.getElementById('progress-bar').style.width=percent+'%';
 document.getElementById('progress-text').textContent=percent+'% نحو المستوى التالي';
 document.getElementById('level-description').textContent=level.description;
})();
</script>
<footer>HM Academy © 2026</footer>
</body>
</html>
