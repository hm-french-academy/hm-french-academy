<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HM Academy - لوحة الطالب</title>
<link rel="stylesheet" href="css/style.css?v=20260807">
<link rel="stylesheet" href="css/theme-refresh.css?v=20260809">
</head>
<body>
<header><a href="index.html">🇫🇷 HM Academy</a><p>لوحة الطالب الذكية</p></header>
<main>
<section class="hero">
<h1>👤 رحلتك التعليمية</h1>
<div class="stats-card">
<p>المستوى: <strong data-student-level>A1 - Beginner</strong></p>
<p>النقاط: <strong data-student-xp>0</strong> XP</p>
<p>الدروس المكتملة: <strong id="completed-lessons">0</strong></p>
</div>
<a class="btn" href="student-profile.html">📝 ملف الطالب / تعديل البيانات</a>
</section>
<section class="hero">
<h2>📊 تقدم المستوى</h2>
<div id="level-description"></div>
<div style="background:#eee;border-radius:20px;height:18px;overflow:hidden"><div id="progress-bar" style="height:100%;width:0%"></div></div>
<p id="progress-text">0%</p>
<p id="next-level-text" class="small"></p>
</section>
<section class="hero">
<h2>🚀 متابعة التعلم</h2>
<a class="btn" href="lesson.html?id=lesson-hello">ابدأ / تابع الدرس الأول</a>
<a class="btn secondary" href="course.html">عرض المنهج</a>
</section>
</main>
<script src="scripts/api-client.js"></script>
<script src="scripts/learning-progress.js"></script>
<script src="scripts/level-engine.js"></script>
<script>
(async()=>{
  try {
    if(!window.HMProgress) throw new Error('Progress engine unavailable');
    const data = HMProgress.get() || {};
    const xp = Number(data.xp) || 0;
    const completed = Array.isArray(data.completedLessons) ? data.completedLessons : [];
    document.querySelector('[data-student-xp]').textContent = xp;
    document.getElementById('completed-lessons').textContent = completed.length;
    const level = await getStudentLevel(xp);
    document.querySelectorAll('[data-student-level]').forEach(el => el.textContent = `${level.id} - ${level.title}`);
    document.getElementById('level-description').textContent = level.description || '';
    const min = Number(level.minXP) || 0;
    const max = Number(level.maxXP) || min + 1;
    const percent = max > min ? Math.max(0, Math.min(100, Math.round(((xp-min)/(max-min))*100))) : 100;
    document.getElementById('progress-bar').style.width = percent+'%';
    document.getElementById('progress-text').textContent = percent+'% من المستوى الحالي';
    document.getElementById('next-level-text').textContent = xp < max ? `متبقي ${max-xp} XP للوصول إلى الحد التالي.` : '🎉 وصلت إلى الحد الأعلى لهذا المستوى.';
  } catch(error){
    console.warn('Dashboard progress fallback:', error);
    document.getElementById('level-description').textContent = 'تعذر تحميل بيانات التقدم الآن. يمكنك متابعة الدروس بشكل طبيعي.';
  }
})();
</script>
<footer>HM Academy © 2026</footer>
</body>
</html>
