<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>HM Academy · 4ème · Les chiffres · Learning Studio</title><style>:root{--ink:#2e2a25;--muted:#5b5750;--num:#5e6bb0;--soft:#e6e8f7;--accent:#c96a2e;--ok:#5ea85b;--paper:#f3f8fb}*{box-sizing:border-box}body{margin:0;padding:12px 14px 50px;font-family:Arial,Cairo,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 8%,#5e6bb018,transparent 40%),radial-gradient(circle at 92% 12%,#c9584c18,transparent 40%),var(--paper)}.wrap{max-width:1060px;margin:auto}.top{position:sticky;top:0;z-index:50;background:#ffffffeF;border-radius:0 0 20px 20px;padding:10px 14px;display:flex;justify-content:space-between}.top a{color:var(--ink);text-decoration:none;font-weight:900}.hero{margin-top:12px;background:linear-gradient(120deg,#dfe5ff,#ffe1ee 55%,#fff0b4);border-radius:30px;padding:28px 24px}.hero h1{font-size:clamp(30px,6vw,50px);margin:8px 0}.eyebrow,.tag{display:inline-block;background:var(--num);color:#fff;padding:6px 12px;border-radius:999px;font-weight:900}.journey{position:sticky;top:53px;z-index:45;background:#fffffff2;display:flex;gap:7px;overflow:auto;padding:11px 3px}.step{border:0;background:#f1f5f8;border-radius:999px;padding:9px 13px;font-weight:900;white-space:nowrap;cursor:pointer}.step.active{background:var(--ink);color:#fff}.step i{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#dfe8ef;font-style:normal;margin-left:4px}.page{margin-top:12px;background:#fff;border-radius:27px;padding:22px;min-height:610px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{background:#fff;border:2px solid #edf1f4;border-radius:21px;padding:17px;line-height:1.85}.muted{color:var(--muted);font-weight:800}.fr{direction:ltr;text-align:left;font-size:20px;font-weight:900}.btn{display:inline-block;border:0;border-radius:14px;padding:11px 15px;background:var(--ink);color:#fff;text-decoration:none;font-weight:900;margin:4px;cursor:pointer}.btn.light{background:#edf4f8;color:var(--ink)}.numGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.num{background:var(--soft);border:0;border-radius:15px;padding:12px 6px;cursor:pointer;text-align:center}.num strong{display:block;color:var(--num);font-size:25px}.num small{font-weight:800;color:var(--muted)}.detail,.rule{margin-top:15px;padding:18px;border-radius:21px;background:#f8fbfd;border:1px solid #e5edf3}.phrase{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;border:1px solid #edf1f4;margin:7px 0}.speak{border:0;background:var(--ink);color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer}.choice{border:2px solid #e5edf3;background:#fff;border-radius:13px;padding:10px 14px;margin:4px;cursor:pointer;font-weight:900}.choice.correct{border-color:var(--ok);background:#e4f3e1}.choice.wrong{border-color:#c9503b;background:#fbe0dc}.feedback{font-weight:900;min-height:25px}.video{position:relative;width:100%;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:#111}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.gameTabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.gameTab{border:2px solid #e5edf3;background:#fff;border-radius:999px;padding:10px 14px;font-weight:900;cursor:pointer}.gameTab.active{background:var(--ink);color:#fff}.gamePanel{background:#f8fbfd;border:1px solid #e5edf3;border-radius:22px;padding:18px}.gameScore{text-align:center;font-size:22px;font-weight:900}.memoryGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.memoryCard{border:2px solid #e5edf3;border-radius:16px;background:#fff;min-height:80px;font-weight:900;cursor:pointer}.memoryCard.open{background:#eef7f3;border-color:var(--ok)}.exam{width:100%;height:700px;border:1px solid #e5edf3;border-radius:16px}@media(max-width:720px){.numGrid{grid-template-columns:repeat(4,1fr)}}@media(max-width:500px){.numGrid{grid-template-columns:repeat(3,1fr)}.page{padding:15px}.memoryGrid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><header class="top"><a href="grade-4.html">← الصف الرابع</a><a href="index.html">HM Academy</a></header><section class="hero"><span class="eyebrow">Le français pour vous · 4e année · Unité 1</span><h1>🔢 Les chiffres</h1><p>Premium Lesson Book Studio · الدرس الثاني · مصدر الصف الرابع الأصلي</p></section><nav class="journey" id="journey"></nav><main id="page" class="page"></main></div><script>const SRC='data/lessons/grade-4/source/4eme_Complet/02_Les_chiffres/';const EXAM=SRC+'04_examen_electronique_les_chiffres.html';const VIDEO='https://www.youtube.com/embed/zjinmuX25_E?rel=0&modestbranding=1';const steps=[['start','🚀','البداية'],['vocab','🖼️','المفردات'],['understand','🧠','افهم'],['interact','🤝','تفاعل'],['listen','🎧','اسمع وتحدث'],['practice','✍️','التدريب'],['media','🎬','الوسائط'],['games','🎮','الألعاب'],['assessment','🏆','التقييم'],['after','📚','بعد الرحلة']];const nums=[['zéro','صفر'],['un','واحد'],['deux','اثنان'],['trois','ثلاثة'],['quatre','أربعة'],['cinq','خمسة'],['six','ستة'],['sept','سبعة'],['huit','ثمانية'],['neuf','تسعة'],['dix','عشرة'],['onze','أحد عشر'],['douze','اثنا عشر'],['treize','ثلاثة عشر'],['quatorze','أربعة عشر'],['quinze','خمسة عشر'],['seize','ستة عشر'],['dix-sept','سبعة عشر'],['dix-huit','ثمانية عشر'],['dix-neuf','تسعة عشر'],['vingt','عشرون'],['vingt et un','واحد وعشرون'],['vingt-deux','اثنان وعشرون'],['vingt-trois','ثلاثة وعشرون'],['vingt-quatre','أربعة وعشرون'],['vingt-cinq','خمسة وعشرون'],['vingt-six','ستة وعشرون'],['vingt-sept','سبعة وعشرون'],['vingt-huit','ثمانية وعشرون'],['vingt-neuf','تسعة وعشرون'],['trente','ثلاثون']];const nav=document.getElementById('journey'),page=document.getElementById('page');nav.innerHTML=steps.map((s,i)=>`<button class="step" data-step="${s[0]}"><i>${s[1]}</i>${i+1}. ${s[2]}</button>`).join('');nav.onclick=e=>{const b=e.target.closest('[data-step]');if(b)render(b.dataset.step)};function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.8;speechSynthesis.speak(u)}document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)speak(b.dataset.say)});function numberGrid(){return `<div class="numGrid">${nums.map((n,i)=>`<button class="num" data-num="${i}"><strong>${i}</strong><small>${n[0]}</small></button>`).join('')}</div><div id="numDetail" class="detail">اختر رقمًا لسماع نطقه ورؤية معناه.</div>`}function bindNums(){document.querySelectorAll('[data-num]').forEach(b=>b.onclick=()=>{const i=+b.dataset.num,n=nums[i];document.getElementById('numDetail').innerHTML=`<div class="cards"><div><div style="font-size:64px;text-align:center">${i}</div><p class="fr">${n[0]} <button class="speak" data-say="${n[0]}">🔊</button></p></div><div><h3>المعنى</h3><p>${n[1]}</p><p class="muted">العدد ${i} مكتوب بالفرنسية: ${n[0]}</p></div></div>`})}const qs=[['رقم → كلمة','Quel nombre est 7 ?',['sept','six','huit','dix'],'sept'],['كلمة → رقم','Quel nombre est « douze » ?',['10','11','12','13'],'12'],['استمع واختر','Quel nombre est « vingt » ?',['18','19','20','21'],'20'],['الترتيب','Quel nombre vient après 29 ?',['28','29','30','31'],'30']];function quizCards(list){return list.map(x=>`<article class="card"><h3>${x[0]}</h3><p class="fr">${x[1]}</p><div>${x[2].map(o=>`<button class="choice" data-val="${o}" data-correct="${x[3]}">${o}</button>`).join('')}</div><p class="feedback"></p></article>`).join('')}document.addEventListener('click',e=>{const b=e.target.closest('.choice[data-correct]');if(!b)return;const ok=b.dataset.val===b.dataset.correct;b.parentElement.querySelectorAll('.choice').forEach(x=>x.classList.remove('correct','wrong'));b.classList.add(ok?'correct':'wrong');b.parentElement.nextElementSibling.textContent=ok?'✅ إجابة صحيحة!':'❌ حاول مرة أخرى.'});let game='speed',round=0,score=0,memory=[],open=[],matched=[];function games(){return `<span class="tag">08 · الألعاب</span><h2>🎮 مركز الألعاب — أربع ألعاب مختلفة</h2><p class="muted">كل لعبة بفكرة ومهارة مختلفة.</p><div class="gameTabs"><button class="gameTab active" data-game="speed">⚡ سباق الأرقام</button><button class="gameTab" data-game="memory">🧠 ذاكرة الرقم</button><button class="gameTab" data-game="mystery">🔎 الرقم الغامض</button><button class="gameTab" data-game="order">🔢 الترتيب السريع</button></div><div class="gamePanel" id="gamePanel"></div>`}function renderGame(){const p=document.getElementById('gamePanel');if(!p)return;if(game==='speed'){const x=qs[round%qs.length];p.innerHTML=`<div class="gameScore">النقاط: ${score}</div><h3>${x[0]}</h3><p class="fr">${x[1]}</p>${x[2].map(o=>`<button class="choice" data-game-answer="${o}" data-correct="${x[3]}">${o}</button>`).join('')}`}else if(game==='mystery'){const i=(round*7+3)%31,n=nums[i];p.innerHTML=`<div class="gameScore">النقاط: ${score}</div><p>أنا رقم يأتي بعد ${i-1} وقبل ${i+1}.</p><p>Qui suis-je ?</p>${[i,(i+1)%31,(i+2)%31].map(v=>`<button class="choice" data-game-answer="${v}" data-correct="${i}">${v}</button>`).join('')}`}else if(game==='order'){p.innerHTML=`<div class="gameScore">رتّب من الأصغر إلى الأكبر</div>${[3,17,9,24].sort(()=>Math.random()-.5).map(v=>`<button class="choice" data-order="${v}">${v}</button>`).join('')}<p class="muted">الترتيب الصحيح: 3 → 9 → 17 → 24</p>`}else{if(!memory.length){const a=[0,3,7,10,15,20,25,30];memory=[...a.map(v=>({t:String(v),k:String(v)})),...a.map(v=>({t:nums[v][0],k:String(v)}))].sort(()=>Math.random()-.5)}p.innerHTML=`<div class="gameScore">مطابقات: ${matched.length/2} / 8</div><div class="memoryGrid">${memory.map((c,i)=>`<button class="memoryCard ${open.includes(i)||matched.includes(i)?'open':''}" data-mi="${i}">${open.includes(i)||matched.includes(i)?c.t:'؟'}</button>`).join('')}</div>`}}document.addEventListener('click',e=>{const g=e.target.closest('[data-game]');if(g){game=g.dataset.game;round=0;score=0;memory=[];open=[];matched=[];document.querySelectorAll('.gameTab').forEach(x=>x.classList.remove('active'));g.classList.add('active');renderGame()}const a=e.target.closest('[data-game-answer]');if(a){if(a.dataset.gameAnswer===a.dataset.correct)score++;round++;renderGame()}const mi=e.target.closest('[data-mi]');if(mi&&!matched.includes(+mi.dataset.mi)){const i=+mi.dataset.mi;if(open.includes(i))return;open.push(i);if(open.length===2){const [a,b]=open;if(memory[a].k===memory[b].k){matched.push(a,b);open=[]}else setTimeout(()=>{open=[];renderGame()},550)}renderGame()}const o=e.target.closest('[data-order]');if(o){const expected=[3,9,17,24],chosen=[...document.querySelectorAll('[data-order].chosen')].map(x=>+x.dataset.order);if(!o.classList.contains('chosen')){o.classList.add('chosen');const next=expected[chosen.length];o.classList.toggle('correct',+o.dataset.order===next);if(+o.dataset.order!==next){document.querySelectorAll('[data-order]').forEach(x=>x.classList.remove('chosen'));}}}});function render(s){nav.querySelectorAll('.step').forEach(b=>b.classList.toggle('active',b.dataset.step===s));if(s==='start')page.innerHTML=`<div class="cards"><article class="card"><span class="tag">01 · البداية</span><h2 class="fr">Les chiffres</h2><p>الدرس الثاني من الصف الرابع: الأرقام من 0 إلى 30، مع القراءة والنطق والتمييز والترتيب.</p><button class="btn" data-go="vocab">🚀 ابدأ</button></article><article class="card"><h3>المصادر الأصلية</h3><p>01_interactif_les_chiffres.html</p><p>02_reference_les_chiffres.docx</p><p>03_evaluation_les_chiffres.docx</p><p>04_examen_electronique_les_chiffres.html</p></article></div>`;if(s==='vocab')page.innerHTML=`<span class="tag">02 · المفردات</span><h2>🔢 الأرقام من 0 إلى 30</h2><p class="muted">اضغط على أي رقم لسماع النطق ومعرفة معناه.</p>${numberGrid()}`;if(s==='understand')page.innerHTML=`<span class="tag">03 · افهم</span><h2>🧠 افهم</h2><div class="rule"><h3>قاعدة الدرس</h3><p>تعرف على الرقم بصريًا، ثم اربطه بالكلمة الفرنسية، ثم استخدمه داخل سؤال أو جملة قصيرة.</p><p class="fr">Quel nombre est 7 ? — Sept.</p><p class="fr">Quel nombre vient après 29 ? — Trente.</p></div>${numberGrid()}`;if(s==='interact')page.innerHTML=`<span class="tag">04 · تفاعل</span><h2>🤝 تفاعل</h2><p class="muted">اختبر التمييز بين الرقم والكلمة دون تكرار صفحة المفردات.</p><div class="cards">${quizCards(qs.slice(0,3))}</div>`;if(s==='listen')page.innerHTML=`<span class="tag">05 · اسمع وتحدث</span><h2>🎧 اسمع وتحدث</h2><div class="cards">${[0,7,12,20,30].map(i=>`<article class="card"><p class="fr">${nums[i][0]}</p><button class="speak" data-say="${nums[i][0]}">🔊</button><p>استمع ثم كرر النطق بصوتك.</p></article>`).join('')}</div>`;if(s==='practice')page.innerHTML=`<span class="tag">06 · التدريب</span><h2>✍️ التدريب</h2><div class="cards">${quizCards(qs)}</div>`;if(s==='media')page.innerHTML=`<span class="tag">07 · الوسائط</span><h2>🎬 فيديو الدرس الأصلي</h2><p class="muted">الفيديو مأخوذ من المصدر الأصلي للمرحلة، وليس ملفًا بديلًا.</p><div class="video"><iframe src="${VIDEO}" title="Les chiffres - vidéo originale" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>`;if(s==='games'){page.innerHTML=games();renderGame()}if(s==='assessment')page.innerHTML=`<span class="tag">09 · التقييم</span><h2>🏆 التقييم الرسمي</h2><p class="muted">لا يتم اختراع أسئلة رسمية خارج مصدر الدرس.</p><div class="cards"><article class="card"><h3>التقييم الرسمي</h3><p>03_evaluation_les_chiffres.docx</p><a class="btn" target="_blank" href="${SRC}03_evaluation_les_chiffres.docx">فتح المصدر</a></article><article class="card"><h3>الاختبار الإلكتروني الرسمي</h3><p>04_examen_electronique_les_chiffres.html</p><a class="btn" target="_blank" href="${EXAM}">فتح الاختبار</a></article></div>`;if(s==='after')page.innerHTML=`<span class="tag">10 · بعد الرحلة</span><h2>📚 بعد الرحلة</h2><div class="cards"><article class="card"><h3>🎯 راجع بسرعة</h3><p>النطق، الربط بين الرقم والكلمة، الترتيب، ثم التطبيق.</p></article><article class="card"><h3>📄 المرجع</h3><a class="btn" target="_blank" href="${SRC}02_reference_les_chiffres.docx">فتح المرجع الأصلي</a></article></div>`;bindNums();page.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>render(b.dataset.go))}render('start');</script></body></html>
