<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy · 4e · Les chiffres</title><style>body{margin:0;background:#f3f8fb;color:#2e2a25;font-family:Arial,Cairo,sans-serif}.wrap{max-width:1050px;margin:auto;padding:12px}.top,.hero,.page{background:#fff;border-radius:22px;padding:20px;margin-bottom:12px}.hero{background:linear-gradient(120deg,#dfe5ff,#ffe1ee,#fff0b4)}.hero h1{font-size:clamp(30px,6vw,50px);margin:8px 0}.journey{display:flex;gap:7px;overflow:auto;position:sticky;top:0;background:#f3f8fb;padding:9px 2px;z-index:5}.step,.choice,.btn{border:0;border-radius:14px;padding:10px 14px;font-weight:900;cursor:pointer}.step{background:#e8eef4;white-space:nowrap}.step.active,.btn{background:#2e2a25;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{border:2px solid #edf1f4;border-radius:20px;padding:17px;background:#fff}.fr{direction:ltr;text-align:left;font-size:21px;font-weight:900}.muted{color:#5b5750;font-weight:800}.tag{display:inline-block;background:#5e6bb0;color:#fff;padding:6px 12px;border-radius:99px;font-weight:900}.choice{display:block;width:100%;margin:7px 0;background:#fff;border:2px solid #e1e7ec;text-align:right}.choice.correct{background:#e4f3e1;border-color:#5ea85b}.choice.wrong{background:#fbe0dc;border-color:#c9503b}.feedback{min-height:24px;font-weight:900}.numGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.num{border:0;border-radius:15px;padding:12px 5px;background:#e6e8f7;cursor:pointer}.num strong{display:block;font-size:24px;color:#5e6bb0}.num small{font-weight:800}.detail,.review{margin-top:14px;padding:17px;border-radius:18px;background:#f8fbfd;border:1px solid #e5edf3}.video{position:relative;width:100%;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:#111}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.gameTabs{display:flex;gap:8px;flex-wrap:wrap}.gameTab{border:2px solid #e1e7ec;background:#fff;border-radius:99px;padding:9px 13px;font-weight:900;cursor:pointer}.gameTab.active{background:#2e2a25;color:#fff}.memoryGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.memoryCard{min-height:72px;border:2px solid #e1e7ec;border-radius:14px;background:#fff;font-weight:900}.open{background:#e4f3e1}.score{text-align:center;font-size:21px;font-weight:900;margin:10px}.reviewItem{padding:12px;border-radius:14px;background:#fff;margin:8px 0;border:1px solid #e5edf3}@media(max-width:650px){.numGrid{grid-template-columns:repeat(4,1fr)}.memoryGrid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><header class="top"><a href="grade-4.html">← الصف الرابع</a></header><section class="hero"><span class="tag">Le français · 4e année · Unité 1</span><h1>🔢 Les chiffres</h1><p>الدرس الثاني — الأرقام من 0 إلى 30</p></section><nav id="nav" class="journey"></nav><section id="page" class="page"></section></main><script>(function(){const SRC='data/lessons/grade-4/source/4eme_Complet/02_Les_chiffres/';const VIDEO='https://www.youtube-nocookie.com/embed/zjinmuX25_E?rel=0';const nums=[['zéro','صفر'],['un','واحد'],['deux','اثنان'],['trois','ثلاثة'],['quatre','أربعة'],['cinq','خمسة'],['six','ستة'],['sept','سبعة'],['huit','ثمانية'],['neuf','تسعة'],['dix','عشرة'],['onze','أحد عشر'],['douze','اثنا عشر'],['treize','ثلاثة عشر'],['quatorze','أربعة عشر'],['quinze','خمسة عشر'],['seize','ستة عشر'],['dix-sept','سبعة عشر'],['dix-huit','ثمانية عشر'],['dix-neuf','تسعة عشر'],['vingt','عشرون'],['vingt et un','واحد وعشرون'],['vingt-deux','اثنان وعشرون'],['vingt-trois','ثلاثة وعشرون'],['vingt-quatre','أربعة وعشرون'],['vingt-cinq','خمسة وعشرون'],['vingt-six','ستة وعشرون'],['vingt-sept','سبعة وعشرون'],['vingt-huit','ثمانية وعشرون'],['vingt-neuf','تسعة وعشرون'],['trente','ثلاثون']];const steps=[['start','🚀 البداية'],['vocab','🖼️ المفردات'],['understand','🧠 افهم'],['interact','🤝 تفاعل'],['listen','🎧 اسمع وتحدث'],['practice','✍️ التدريب'],['media','🎬 الفيديو'],['games','🎮 الألعاب'],['assessment','🏆 التقييم'],['review','🧠 المراجعة الذكية'],['after','📚 بعد الرحلة']];const nav=document.getElementById('nav'),page=document.getElementById('page');nav.innerHTML=steps.map((s,i)=>`<button class="step" data-s="${s[0]}">${i+1}. ${s[1]}</button>`).join('');function speak(t){if(!speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.8;speechSynthesis.speak(u)}function head(a,b,c){return `<span class="tag">${a}</span><h2>${b}</h2><p class="muted">${c}</p>`}function choices(q,opts,ans){return `<article class="card"><h3>${q}</h3>${opts.map(o=>`<button class="choice" data-answer="${o}" data-correct="${ans}">${o}</button>`).join('')}<p class="feedback"></p></article>`}let game='detect',gscore=0,round=0,memory=[],open=[],matched=[];function games(){return head('08','مركز الألعاب','ألعاب مبنية على مهارات الأرقام، وليست إعادة لأسئلة التدريب.')+`<div class="gameTabs"><button class="gameTab active" data-game="detect">🔎 محقق الرقم</button><button class="gameTab" data-game="sequence">➡️ الرقم التالي</button><button class="gameTab" data-game="listen">🎧 اسمع واختر</button><button class="gameTab" data-game="memory">🧠 ذاكرة الرقم</button></div><div id="gamePanel" class="review"></div>`}function renderGame(){const p=document.getElementById('gamePanel');if(!p)return;if(game==='detect'){const i=[4,9,13,18,22,27][round%6];p.innerHTML=`<div class="score">النقاط: ${gscore}</div><p>أنا رقم أكبر من ${i-1} وأصغر من ${i+1}. من أنا؟</p>${[i-1,i,i+1].map(x=>`<button class="choice" data-game-answer="${x}" data-game-correct="${i}">${x} — ${nums[x][0]}</button>`).join('')}`}else if(game==='sequence'){const a=[3,7,12,18,24][round%5],b=a+1;p.innerHTML=`<div class="score">النقاط: ${gscore}</div><p>Quel nombre vient après <b>${a} — ${nums[a][0]}</b> ?</p>${[a-1,a+1,a+2].map(x=>`<button class="choice" data-game-answer="${x}" data-game-correct="${b}">${x} — ${nums[x][0]}</button>`).join('')}`}else if(game==='listen'){const i=[2,6,11,17,20,29][round%6];p.innerHTML=`<div class="score">النقاط: ${gscore}</div><button class="btn" data-say="${nums[i][0]}">🔊 اسمع</button><p>اختر الرقم الذي سمعته:</p>${[i,(i+1)%31,(i+3)%31].map(x=>`<button class="choice" data-game-answer="${x}" data-game-correct="${i}">${x}</button>`).join('')}`}else{if(!memory.length){const a=[1,5,10,15,20,25,30];memory=[...a.map(x=>({t:String(x),k:String(x)})),...a.map(x=>({t:nums[x][0],k:String(x)}))].sort(()=>Math.random()-.5)}p.innerHTML=`<div class="score">مطابقات: ${matched.length/2} / 7</div><div class="memoryGrid">${memory.map((c,i)=>`<button class="memoryCard ${open.includes(i)||matched.includes(i)?'open':''}" data-mi="${i}">${open.includes(i)||matched.includes(i)?c.t:'؟'}</button>`).join('')}</div>`}}function render(s){nav.querySelectorAll('.step').forEach(b=>b.classList.toggle('active',b.dataset.s===s));let h='';if(s==='start')h=head('01','ابدأ رحلة الأرقام','لن نكرر نفس السؤال في كل محطة: كل مرحلة لها هدف مختلف.')+`<div class="grid"><article class="card"><h3>🎯 هدف الدرس</h3><p>التعرّف على الأرقام من 0 إلى 30، قراءتها، سماعها، ترتيبها واستخدامها في مواقف بسيطة.</p><button class="btn" data-go="vocab">ابدأ</button></article><article class="card"><h3>📄 المصادر الأصلية</h3><p>01_interactif_les_chiffres.html</p><p>02_reference_les_chiffres.docx</p><p>03_evaluation_les_chiffres.docx</p><p>04_examen_electronique_les_chiffres.html</p></article></div>`;if(s==='vocab')h=head('02','المفردات','كل رقم بطاقة مستقلة: الرقم + الكلمة + النطق.')+`<div class="numGrid">${nums.map((n,i)=>`<button class="num" data-num="${i}"><strong>${i}</strong><small>${n[0]}</small></button>`).join('')}</div><div id="detail" class="detail">اختر رقمًا.</div>`;if(s==='understand')h=head('03','افهم','لاحظ كيف تتغير كتابة الأعداد، خصوصًا الأعداد المركبة.')+`<div class="grid"><article class="card"><h3>0 → 10</h3><p class="fr">zéro · un · deux · trois · quatre · cinq · six · sept · huit · neuf · dix</p></article><article class="card"><h3>11 → 20</h3><p class="fr">onze · douze · treize · quatorze · quinze · seize · dix-sept · dix-huit · dix-neuf · vingt</p></article><article class="card"><h3>21 → 30</h3><p class="fr">vingt et un · vingt-deux · vingt-trois · vingt-quatre · vingt-cinq · vingt-six · vingt-sept · vingt-huit · vingt-neuf · trente</p></article></div>`;if(s==='interact')h=head('04','تفاعل','اختر الإجابة الصحيحة؛ البدائل موزعة وليست الإجابة دائمًا الأولى.')+`<div class="grid">${choices('ما الرقم المكتوب « quatorze » ؟',['12','14','16','18'],'14')}${choices('كيف نكتب 21؟',['vingt et un','vingt-deux','vingt','trente'],'vingt et un')}${choices('ما الذي يأتي قبل trente؟',['vingt-huit','vingt-neuf','vingt-sept','vingt-six'],'vingt-neuf')}${choices('ما الرقم « dix-huit » ؟',['16','17','18','19'],'18')}</div>`;if(s==='listen')h=head('05','اسمع وتحدث','اسمع الكلمة ثم اختر معناها، أو اضغط على السماعة لتكرارها.')+`<div class="grid">${[6,11,20,27].map(i=>`<article class="card"><p class="fr">${nums[i][0]} <button class="btn" data-say="${nums[i][0]}">🔊</button></p><p>${nums[i][1]}</p></article>`).join('')}</div>`;if(s==='practice')h=head('06','التدريب','تدريبات تطبيقية لا تكشف الحل داخل السؤال.')+`<div class="grid">${choices('أكمل: 7 → 8 → …',['six','sept','huit','neuf'],'huit')}${choices('رتّب: 12، 9، 15 — ما الأصغر؟',['15','12','9','18'],'9')}${choices('اختر كتابة 30',['vingt','vingt-neuf','trente','treize'],'trente')}${choices('أي عدد بين 24 و26؟',['23','24','25','27'],'25')}</div>`;if(s==='media')h=head('07','الفيديو الأصلي','تم ربط الفيديو الموجود في مصدر المرحلة، وليس فيديوًّا مفترضًا.')+`<div class="video"><iframe src="${VIDEO}" title="Les chiffres" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div><p class="muted">إذا منع المتصفح التضمين، استخدم المصدر المباشر من YouTube.</p><a class="btn" target="_blank" href="https://www.youtube.com/watch?v=zjinmuX25_E">فتح الفيديو مباشرة</a>`;if(s==='games')h=games();if(s==='assessment')h=head('09','التقييم','لا نكرر أسئلة التدريب هنا. الاختبار الإلكتروني الرسمي هو المرجع المعتمد لهذا الدرس.')+`<div class="card"><h3>التقييم الإلكتروني الرسمي</h3><p>04_examen_electronique_les_chiffres.html</p><a class="btn" target="_blank" href="${SRC}04_examen_electronique_les_chiffres.html">فتح الاختبار الرسمي</a></div>`;if(s==='review')h=head('10','المراجعة الذكية','مراجعة تشخيصية: اختر نقطة ضعفك ثم خذ تحديًا مختلفًا.')+`<div class="grid"><article class="card"><h3>🔤 أحتاج مراجعة الكتابة</h3>${choices('كيف نكتب 17؟',['dix-sept','dix-huit','dix-neuf','seize'],'dix-sept')}</article><article class="card"><h3>🎧 أحتاج مراجعة السماع</h3><button class="btn" data-say="vingt-neuf">🔊 اسمع</button>${choices('ما الذي سمعتَه؟',['27','28','29','30'],'29')}</article><article class="card"><h3>🧩 أحتاج مراجعة الترتيب</h3>${choices('ما العدد الذي يأتي بين 19 و21؟',['18','19','20','22'],'20')}</article><article class="card"><h3>⚡ تحدي نهائي</h3>${choices('أي زوج صحيح؟',['15 = quinze','16 = quinze','18 = dix-neuf','20 = dix-huit'],'15 = quinze')}</article></div>`;if(s==='after')h=head('11','بعد الرحلة','أنت الآن قادر على قراءة وسماع وترتيب الأعداد حتى 30.')+`<div class="grid"><article class="card"><h3>🎯 تحقق من نفسك</h3><p>هل تستطيع كتابة 23 و27 و30 بالفرنسية دون مساعدة؟</p></article><article class="card"><h3>📚 المرجع</h3><a class="btn" target="_blank" href="${SRC}02_reference_les_chiffres.docx">فتح المرجع الأصلي</a></article></div>`;page.innerHTML=h;page.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>render(b.dataset.go));page.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));page.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const ok=b.dataset.answer===b.dataset.correct;b.parentElement.querySelectorAll('.choice').forEach(x=>x.classList.remove('correct','wrong'));b.classList.add(ok?'correct':'wrong');b.parentElement.querySelector('.feedback').textContent=ok?'✅ صحيح':'❌ جرّب مرة أخرى'});page.querySelectorAll('[data-num]').forEach(b=>b.onclick=()=>{const i=+b.dataset.num,n=nums[i];document.getElementById('detail').innerHTML=`<div class="fr">${i} — ${n[0]} <button class="btn" data-say="${n[0]}">🔊</button></div><p>${n[1]}</p>`;page.querySelectorAll('[data-say]').forEach(x=>x.onclick=()=>speak(x.dataset.say))});if(s==='games'){renderGame();document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{game=b.dataset.game;gscore=0;round=0;memory=[];open=[];matched=[];document.querySelectorAll('.gameTab').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderGame()});page.onclick=e=>{const a=e.target.closest('[data-game-answer]');if(a){if(a.dataset.gameAnswer===a.dataset.gameCorrect)gscore++;round++;renderGame()}const m=e.target.closest('[data-mi]');if(m&&!matched.includes(+m.dataset.mi)){const i=+m.dataset.mi;if(open.includes(i))return;open.push(i);if(open.length===2){const [x,y]=open;if(memory[x].k===memory[y].k){matched.push(x,y);open=[]}else setTimeout(()=>{open=[];renderGame()},500)}renderGame()}}}}nav.onclick=e=>{const b=e.target.closest('[data-s]');if(b)render(b.dataset.s)};render('start')})();</script></body></html>
