<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>HM Academy | الصف الثالث الإعدادي</title>
<style>
:root{--ink:#17223b;--muted:#66738a;--blue:#2563eb;--navy:#173a82;--pink:#e92d83;--line:#dfe6f2;--soft:#f7f9fd;--green:#16a34a;--gold:#d99a16}
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font-family:Arial,"Cairo",sans-serif}.wrap{max-width:1120px;margin:auto;padding:16px}
.student-header{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0f1b33;color:#fff;padding:10px 12px;border-radius:18px;margin-bottom:12px;box-shadow:0 8px 22px #0f1b3325}.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:#fff;font-weight:900}.brand-logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#e92d83);font-weight:1000}.header-actions{display:flex;gap:7px}.home-btn,.unit-btn{display:inline-flex;align-items:center;text-decoration:none;border-radius:12px;padding:10px 12px;font-weight:900;white-space:nowrap}.home-btn{background:var(--blue);color:#fff}.unit-btn{background:#eef3ff;color:var(--navy)}
.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff;border-radius:28px;padding:24px}.hero h1{margin:0;font-size:clamp(30px,6vw,44px)}.hero p{line-height:1.8;margin:8px 0 0}.journey{display:flex;gap:7px;overflow:auto;margin-top:16px}.journey span{background:#ffffff22;border:1px solid #ffffff44;border-radius:999px;padding:8px 12px;white-space:nowrap;font-weight:800}
.nav{display:flex;gap:7px;overflow:auto;background:#fff;padding:8px;border-radius:18px;margin:14px 0;box-shadow:0 6px 20px #14264a10}.nav button{border:0;background:#eef3ff;color:var(--navy);border-radius:12px;padding:10px 13px;font-weight:900;white-space:nowrap;cursor:pointer}.nav button.active{background:var(--pink);color:#fff}
.panel{background:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 30px #14264a12;min-height:420px}.section-head{background:linear-gradient(135deg,#f4f7ff,#fff7fb);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px}.section-head h2{margin:0;color:var(--navy);font-size:27px}.section-head p{margin:7px 0 0;color:var(--muted);line-height:1.8}
.cards,.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.card,.box{border:1px solid #e1e6ef;border-radius:18px;padding:15px;background:#fff}.visual{height:105px;border-radius:15px;background:linear-gradient(145deg,#eef4ff,#fff2f8);display:grid;place-items:center;font-size:54px;margin-bottom:10px}.fr{font-weight:900;direction:ltr;text-align:center;font-size:20px}.ar{text-align:center;color:#315aa4;font-weight:800;margin-top:5px}.example{background:var(--soft);border-radius:12px;padding:10px;margin-top:9px;direction:ltr;text-align:center;line-height:1.65}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;margin:5px 3px 0 0}.primary{background:var(--blue);color:#fff}.secondary{background:#edf3ff;color:var(--navy)}
.formula{background:var(--soft);border:1px solid #e2e8f0;border-radius:16px;padding:15px;margin:9px 0}.formula b{display:block;color:var(--navy);font-size:19px}.ltr{direction:ltr;text-align:left}.note{background:#fffaf0;border:1px solid #f2d58b;border-radius:15px;padding:14px;line-height:1.9}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}.option{padding:12px;border:1px solid #dbe1eb;border-radius:11px;background:#fff;font-weight:800;cursor:pointer}.option.correct{border-color:var(--green);background:#ecfdf3}.option.wrong{border-color:var(--pink);background:#fff2f8}.feedback{min-height:25px;font-weight:800;margin-top:10px}.dialogue{border:1px solid var(--line);border-radius:18px;padding:15px;background:#fff;margin:10px 0}.line-fr{direction:ltr;text-align:left;font-size:18px;font-weight:900;margin-top:5px}.line-ar{color:var(--muted);margin-top:6px;line-height:1.7}.game{background:linear-gradient(135deg,#f7f9ff,#fff7fb);border:1px solid var(--line);border-radius:20px;padding:20px}.progress{height:14px;background:#e8edf5;border-radius:999px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#14b8a6);width:0}.complete{margin-top:14px;background:#fff;border-radius:20px;padding:17px;display:flex;justify-content:space-between;gap:12px;align-items:center}.complete b{display:block}
@media(max-width:650px){.wrap{padding:10px}.complete{display:block}.unit-btn{display:none}.panel{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
<header class="student-header"><a class="brand" href="index.html"><span class="brand-logo">HM</span><span>🇫🇷 HM Academy</span></a><div class="header-actions"><a class="unit-btn" href="grade-9.html">📚 دروس الصف الثالث</a><a class="home-btn" href="index.html">⌂ الرئيسية</a></div></header>
<section class="hero"><h1 id="titleAr">جارٍ تحميل الدرس...</h1><p id="subtitle"></p><div class="journey"><span>🚀 استكشف</span><span>🖼️ تعلم</span><span>🎧 انطق</span><span>📘 افهم</span><span>💬 تواصل</span><span>🎯 تدرب</span><span>🎮 العب</span><span>🧠 راجع</span><span>🏆 قيّم</span><span>📈 تقدم</span></div></section>
<nav class="nav" id="nav"></nav><section class="panel" id="panel"></section>
<section class="complete"><div><b>🏁 رحلة التعلم</b><div id="status">تقدمك محفوظ على هذا الجهاز.</div></div><button class="btn primary" id="complete">إكمال الدرس</button></section>
</div>
<script>
'use strict';
const id=new URLSearchParams(location.search).get('id')||'g9-u1-l2';
const file=id.replace(/^g9-/,'')+'.json';
const iconMap={
'au club':'🏟️','à la piscine':'🏊','au stade':'🏟️','à l'école':'🏫',
'les supporters':'📣','l'arbitre':'🧑‍⚖️','les joueurs':'⚽','l'entraîneur':'🧑‍🏫',
'un maillot de bain':'🩱','des gants':'🧤','un maillot sportif':'👕','des chaussures de sport':'👟'
};
function vocabIcon(fr){return iconMap[String(fr||'').toLowerCase()]||'⚽'}
const icons=['⚽','🏟️','🏃','💬','🏥','🩺','💊','👕','🛍️','🎨','🎒','🏆'];
const steps=[['intro','🚀','استكشف'],['vocab','🖼️','تعلم'],['pron','🎧','انطق'],['grammar','📘','افهم'],['conv','💬','تواصل'],['practice','🎯','تدرب'],['games','🎮','العب'],['review','🧠','راجع'],['assessment','🏆','قيّم'],['progress','📈','تقدم']];
const nav=document.getElementById('nav'),panel=document.getElementById('panel'),status=document.getElementById('status');
let data=null,idx=0,scores=JSON.parse(localStorage.getItem('hm_'+id+'_scores')||'{}'),completed=JSON.parse(localStorage.getItem('hm_'+id+'_completed')||'false');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function speak(t){if(!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}catch(e){}}
function audio(t,label='🔊 استمع'){return '<button class="btn secondary" type="button" onclick="speak(this.dataset.text)" data-text="'+esc(t)+'">'+label+'</button>'}
function save(){localStorage.setItem('hm_'+id+'_scores',JSON.stringify(scores));localStorage.setItem('hm_'+id+'_completed',JSON.stringify(completed))}
function go(i){idx=i;render();scrollTo({top:0,behavior:'smooth'})}
function head(t,d){return '<div class="section-head"><h2>'+t+'</h2><p>'+d+'</p></div>'}
function listCards(arr,title){return '<div class="cards">'+(arr||[]).map((x,i)=>'<article class="card"><div class="visual">'+icons[i%icons.length]+'</div><h3>'+esc(title||('نشاط '+(i+1)))+'</h3><p>'+esc(x)+'</p></article>').join('')+'</div>'}
function answer(btn){const q=btn.closest('.quiz');const ok=btn.dataset.ok==='1';q.querySelectorAll('.option').forEach(x=>x.classList.remove('correct','wrong'));btn.classList.add(ok?'correct':'wrong');q.querySelector('.feedback').textContent=ok?'✅ صحيح! أحسنت.':'🔁 راجع العنصر ثم حاول مرة أخرى.';if(ok){q.querySelectorAll('.option').forEach(x=>x.disabled=true);scores[q.dataset.key]=1;save()}}
function render(){
nav.innerHTML=steps.map((s,i)=>'<button class="'+(i===idx?'active':'')+'" onclick="go('+i+')">'+s[1]+' '+s[2]+'</button>').join('');
const v=data.journey?.vocabulary||[],g=data.journey?.grammar||[],c=data.journey?.conversation||[],p=data.journey?.practice||[],pr=data.journey?.pronunciation||[],vis=data.journey?.visual||[],a=data.journey?.assessment||[];
let h='';
if(idx===0)h=head('🚀 ضربة البداية',data.titleAr+' · '+data.titleFr+' · الصف الثالث الإعدادي')+'<div class="grid2"><div class="box"><h3>🎯 أهداف الدرس</h3><ul><li>فهم المفردات والتعبيرات الأساسية للدرس.</li><li>استخدام القواعد المرتبطة بالموضوع في جمل حقيقية.</li><li>التدرب على النطق والتواصل والتطبيق.</li><li>الانتقال من الفهم إلى الإنتاج ثم التقييم.</li></ul></div><div class="box"><h3>🧭 خريطة الدرس</h3><p>استكشف ← تعلم ← انطق ← افهم ← تواصل ← تدرب ← العب ← راجع ← قيّم.</p><div class="note"><b>المصدر:</b> الصفحات '+esc(data.sourcePages||'')+' من منهج Français simple 3.</div></div></div>';
if(idx===1)h=head('🖼️ تعلم المفردات','مفردات هذا الدرس مرتبة في بطاقات مستقلة، مع المعنى والنطق.')+'<div class="cards">'+v.map((x,i)=>'<article class="card"><div class="visual">'+vocabIcon(x.fr)+'</div><div class="fr">'+esc(x.fr)+'</div><div class="ar">'+esc(x.ar)+'</div>'+audio(x.fr,'🔊 نطق الكلمة')+'</article>').join('')+'</div>';
if(idx===2)h=head('🎧 انطق','استمع إلى العناصر الأساسية وكررها بصوت واضح.')+listCards(pr,'تدريب النطق');
if(idx===3)h=head('📘 افهم القاعدة','القواعد الخاصة بهذا الدرس معروضة في وحدات قصيرة قابلة للمراجعة.')+'<div class="cards">'+g.map((x,i)=>'<article class="box"><div class="formula"><b>'+esc(x)+'</b></div><p>طبّق هذه القاعدة في جملة من موضوع الدرس، ثم راجعها بصوت مرتفع.</p></article>').join('')+'</div>';
if(idx===4)h=head('💬 تواصل','حوارات الدرس في صورة مواقف قصيرة للتكرار والإنتاج.')+'<div>'+c.map((x,i)=>{const parts=String(x).split('—');return '<article class="dialogue"><b>🗣️ موقف '+(i+1)+'</b><div class="line-fr">'+esc(parts[0]||x)+'</div>'+audio(parts[0]||x,'🔊 السؤال / الموقف')+(parts[1]?'<hr><div class="line-fr">'+esc(parts[1])+'</div>'+audio(parts[1],'▶ نطق الإجابة'):'')+'</article>'}).join('')+'</div>';
if(idx===5)h=head('🎯 تدرب','أنشطة تدريبية متدرجة مأخوذة من أهداف ومهارات الدرس.')+listCards(p,'تدريب الدرس')+'<div class="cards" style="margin-top:14px"><article class="box quiz" data-key="q1"><h3>اختبار سريع</h3><p>اختر العبارة المرتبطة مباشرة بموضوع الدرس.</p><div class="options">'+v.slice(0,4).map((x,i)=>'<button class="option" data-ok="'+(i===0?'1':'0')+'" onclick="answer(this)">'+esc(x.fr)+'</button>').join('')+'</div><div class="feedback"></div></article><article class="box quiz" data-key="q2"><h3>فهم القاعدة</h3><p>اختر أول قاعدة من قواعد الدرس.</p><div class="options">'+g.slice(0,4).map((x,i)=>'<button class="option" data-ok="'+(i===0?'1':'0')+'" onclick="answer(this)">'+esc(x)+'</button>').join('')+'</div><div class="feedback"></div></article></div>';
if(idx===6)h=head('🎮 العب','ألعاب قصيرة داخل نفس نموذج الدرس، بدون فتح تصميم قديم.')+'<div class="cards"><article class="game"><div class="visual">🧩</div><h3>التقاط المفردة</h3><p>اختر المفردة الفرنسية الصحيحة لأول معنى في القائمة.</p><div class="options">'+v.slice(0,4).map((x,i)=>'<button class="option" data-ok="'+(i===0?'1':'0')+'" onclick="answer(this)">'+esc(x.fr)+'</button>').join('')+'</div><div class="feedback"></div></article><article class="game"><div class="visual">🎯</div><h3>تحدي القاعدة</h3><p>اختر القاعدة التي تحتاجها أولًا في هذا الدرس.</p><div class="options">'+g.slice(0,4).map((x,i)=>'<button class="option" data-ok="'+(i===0?'1':'0')+'" onclick="answer(this)">'+esc(x)+'</button>').join('')+'</div><div class="feedback"></div></article><article class="game"><div class="visual">🎤</div><h3>تحدي النطق</h3><p>استمع لأول عنصر ثم اختره.</p>'+audio(v[0]?.fr||'','🔊 استمع')+'<div class="options">'+v.slice(0,3).map((x,i)=>'<button class="option" data-ok="'+(i===0?'1':'0')+'" onclick="answer(this)">'+esc(x.fr)+'</button>').join('')+'</div><div class="feedback"></div></article></div>';
if(idx===7)h=head('🧠 راجع','ملخص سريع لأهم ما يجب أن تتقنه قبل التقييم.')+listCards([...v.slice(0,6).map(x=>x.fr+' — '+x.ar),...g.slice(0,4)],'نقطة مراجعة');
if(idx===8)h=head('🏆 قيّم نفسك','حوّل أهداف الدرس إلى نقاط تحقق واضحة.')+'<div class="cards">'+a.map((x,i)=>'<article class="box quiz" data-key="a'+i+'"><h3>'+(i+1)+'. '+esc(x)+'</h3><div class="options"><button class="option" data-ok="1" onclick="answer(this)">أستطيع تنفيذ ذلك</button><button class="option" data-ok="0" onclick="answer(this)">أحتاج إلى مراجعة</button></div><div class="feedback"></div></article>').join('')+'</div>';
if(idx===9){const total=a.length||1,done=Object.keys(scores).filter(k=>k.startsWith('a')).length,pct=Math.round(done/total*100);h=head('📈 تقدمك','تقدم هذا الدرس محفوظ على هذا الجهاز.')+'<div class="box"><h2>'+ (completed?'🏆 الدرس مكتمل':'🚀 واصل رحلتك')+'</h2><p>عناصر التقييم المنجزة: '+done+' من '+total+'</p><div class="progress"><span style="width:'+pct+'%"></span></div><b>'+pct+'%</b></div>'}
panel.innerHTML=h;status.textContent=completed?'تم إكمال الدرس وحفظ تقدمك على هذا الجهاز.':'تقدمك محفوظ على هذا الجهاز.';
}
document.getElementById('complete').onclick=()=>{completed=true;save();render()};
(async()=>{try{const r=await fetch('data/lessons/grade-9/semester-1/'+file+'?v=20260919-standard-v1',{cache:'no-store'});if(!r.ok)throw 0;data=await r.json();document.getElementById('titleAr').textContent=data.titleAr;document.getElementById('subtitle').textContent=data.titleFr+' · الصف الثالث الإعدادي · '+data.unit;const h=new URLSearchParams(location.search).get('section');const map={start:0,vocabulary:1,vocab:1,pronunciation:2,pron:2,grammar:3,conversation:4,conv:4,practice:5,games:6,'smart-review':7,review:7,evaluation:8,assessment:8,progress:9};if(h&&map[h]!=null)idx=map[h];render()}catch(e){panel.innerHTML='<div class="empty">تعذر تحميل محتوى الدرس. يرجى تحديث الصفحة.</div>'}})();
</script>
</body>
</html>
