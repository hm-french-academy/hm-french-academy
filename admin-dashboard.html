<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HM Academy - لوحة الإدارة</title>
<link rel="stylesheet" href="css/style.css?v=20260808">
<style>.admin-grid,.student-list,.admin-actions{display:grid;gap:16px}.admin-grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin:24px 0}.student-list{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.admin-actions{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.admin-card,.student-item,.admin-actions a{padding:18px;border-radius:16px;background:#f8fafc;border:1px solid #e5e7eb}.admin-card strong{display:block;font-size:28px;margin-top:8px}.admin-table{width:100%;border-collapse:collapse}.admin-table td,.admin-table th{padding:12px;border-bottom:1px solid #eee;text-align:right}</style>
</head>
<body>
<header><h2>🇫🇷 HM Academy</h2><p>لوحة الإدارة والمعلم</p></header>
<main>
<section class="hero"><h1>لوحة الإدارة</h1><p>إدارة المتعلمين والمحتوى والتقييمات والشهادات.</p></section>
<section class="admin-grid"><div class="admin-card">👨‍🎓 الطلاب<strong id="students">0</strong></div><div class="admin-card">📚 الدروس<strong id="lessons">0</strong></div><div class="admin-card">📝 التقييمات<strong id="assessments">0</strong></div><div class="admin-card">🏆 الشهادات<strong id="certificates">0</strong></div></section>
<section class="course"><h2>إدارة المتعلمين</h2><div class="student-list" id="student-list"></div></section>
<section class="course"><h2>الوحدات الإدارية</h2><div class="admin-actions" id="modules"></div></section>
</main>
<footer>HM Academy © 2026</footer>
<script>
const load=async(p,f)=>{try{return await (await fetch(p)).json()}catch{return f}};
(async()=>{const admin=await load('data/admin-dashboard.json',{overview:{},modules:[]});const students=await load('data/admin-students.json',{students:[]});const lessons=await load('data/lessons/lessons.json',{lessons:[]});const cert=await load('data/certificates/certificates.json',{certificates:[]});document.getElementById('students').textContent=students.students.length;document.getElementById('lessons').textContent=lessons.lessons.length;document.getElementById('certificates').textContent=cert.certificates.length;document.getElementById('assessments').textContent=localStorage.getItem('hm_assessments_count')||0;document.getElementById('student-list').innerHTML=students.students.map(s=>`<div class="student-item"><b>${s.name}</b><br>المستوى: ${s.level}<br>XP: ${s.xp}<br>الدروس المكتملة: ${s.completedLessons}<br>الشهادات: ${s.certificates}<br>الحالة: ${s.status}</div>`).join('');document.getElementById('modules').innerHTML=(admin.modules||[]).map(m=>`<a href="#"><b>${m.title}</b><br>${m.description}</a>`).join('')})();
</script>
</body></html>
