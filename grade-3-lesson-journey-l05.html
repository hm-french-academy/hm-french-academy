<style>
:root{--ink:#332b24;--soft:#665b4f;--cream:#fbf6f2;--paper:#fff;--violet:#8073b0;--violet-soft:#e7e3f3;--orange:#c97d3e;--orange-soft:#fbe8d6;--teal:#3e9187;--teal-soft:#dbf0ec;--green:#2e8b57;--red:#c0392b;--shadow:0 12px 32px rgba(51,43,36,.12)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 8%,#e7e3f3 0,transparent 38%),radial-gradient(circle at 92% 12%,#fbe8d6 0,transparent 38%),var(--cream);color:var(--ink);font-family:Arial,Tahoma,sans-serif}.wrap{max-width:1120px;margin:auto;padding:10px 14px 40px}.top{position:sticky;top:0;z-index:20;background:#ffffffee;backdrop-filter:blur(8px);padding:11px 15px;border-radius:0 0 22px 22px;display:flex;justify-content:space-between;box-shadow:0 8px 28px #332b2415}.top a{color:var(--ink);text-decoration:none;font-weight:900}.book{margin-top:14px;background:#fffdf9;border-radius:34px;box-shadow:0 18px 55px #332b2420;overflow:hidden}.hero{padding:30px 28px;background:linear-gradient(135deg,#d9cfee,#f7d5b7 55%,#c8e7e2);min-height:175px}.unit{font-weight:900;opacity:.78}.hero h1{margin:8px 0;font-size:clamp(28px,6vw,48px)}.hero p{margin:0;font-weight:800;color:#574c43}.journey{display:flex;gap:7px;overflow-x:auto;padding:12px;background:#fffffff5;border-bottom:1px solid #eadfd5}.step{border:0;background:#f3efeb;color:#665b4f;border-radius:999px;padding:9px 13px;font-weight:900;white-space:nowrap;cursor:pointer}.step.active{background:#332b24;color:#fff}.stepIcon{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin-left:5px;border-radius:50%;background:#fff8ef}.step.active .stepIcon{background:#fff;color:#332b24}.bookpage{margin:16px;background:#fff;border:1px solid #eee4d9;border-radius:26px;padding:22px;min-height:610px}.panel{line-height:1.9}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:16px}.card{background:linear-gradient(180deg,#fff,#fffaf5);border:2px solid #efe5da;border-radius:22px;padding:17px;box-shadow:0 10px 26px #332b2410}.pill{display:inline-block;border-radius:999px;padding:6px 11px;background:var(--orange-soft);font-weight:900}.btn{border:0;border-radius:14px;padding:11px 15px;font-weight:900;cursor:pointer;background:#332b24;color:#fff;margin:4px;touch-action:manipulation}.btn.light{background:#f2ece5;color:var(--ink)}.btn.good{background:var(--green)}.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.choices .btn{flex:1;min-width:145px}.feedback{font-weight:900;margin-top:9px;min-height:25px}.ok{color:var(--green)}.bad{color:var(--red)}.scene{height:180px;border-radius:18px;background:linear-gradient(180deg,#dff3f0,#fff);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.scene svg{width:100%;height:100%}.vocabGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.vcard{min-height:255px;perspective:900px;cursor:pointer}.vinner{height:255px;position:relative;transform-style:preserve-3d;transition:.5s}.vcard.flipped .vinner{transform:rotateY(180deg)}.vface{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:13px;background:#fff;border:2px solid #eee3d7;box-shadow:0 10px 22px #332b2410;text-align:center}.vface.back{transform:rotateY(180deg);background:var(--teal-soft)}.vface h3{margin:7px 0 3px}.mini{font-size:12px;color:var(--soft)}.vscene{height:145px;border-radius:15px;overflow:hidden;background:#f5faf8}.roomTabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.roomTab{border:2px solid #e7ddd2;background:#fff;border-radius:999px;padding:8px 13px;font-weight:900;cursor:pointer}.roomTab.active{background:var(--violet);color:#fff;border-color:var(--violet)}.dialogue{display:grid;gap:10px}.line{display:grid;grid-template-columns:105px 1fr auto;gap:9px;align-items:center;background:#fff;border:2px solid #eee5dc;border-radius:17px;padding:11px}.speaker{font-weight:900}.fr{direction:ltr;text-align:left;font-weight:800}.input{width:100%;padding:12px;border:2px solid #ddd2c6;border-radius:12px;font-size:16px}.quiz{background:#fff9f3;border-radius:18px;padding:16px;margin:12px 0;border:2px solid #efe1d3}.qtitle{font-weight:900;margin-bottom:8px}.refBox{background:linear-gradient(135deg,#f7f0ff,#fff7ea);border:2px solid #eadccf;border-radius:22px;padding:18px}.refGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.refItem{background:#fff;border-radius:16px;padding:13px;border:1px solid #eee3d7}.score{font-size:26px;font-weight:900;text-align:center;padding:16px}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding-top:14px;border-top:1px solid #eee5dc}.counter{font-weight:900;color:var(--soft)}@media(max-width:650px){.wrap{padding:7px 9px 25px}.hero{padding:24px 19px}.bookpage{margin:9px;padding:16px}.line{grid-template-columns:1fr}.fr{text-align:right}.vocabGrid{grid-template-columns:1fr 1fr}.step{padding:8px 10px;font-size:13px}}
</style></head>
<body><div class="wrap"><header class="top"><a href="grade-3.html">← الصف الثالث</a><a href="index.html">HM Academy · الرئيسية</a></header><section class="book"><header class="hero"><div class="unit">Le français pour vous · 3e année · PREMIUM</div><h1 id="title">C'est ma maison !</h1><p>رحلة تعلم تفاعلية مبنية على المحتوى الأصلي للدرس الخامس — غرف المنزل وأثاثها.</p></header><nav class="journey" id="journey"></nav><main id="viewer" class="bookpage"></main></section></div>
<script>
const rooms=[
{id:'chambre',name:'La chambre à coucher',ar:'غرفة النوم',emoji:'🛏️',items:[['un lit','سرير','🛏️'],['une armoire','دولاب','🚪'],['un rideau','ستارة','🪟'],['un tapis','سجادة','🟫']],sentence:'Dans ma chambre, il y a un lit.'},
{id:'salon',name:'Le salon & la salle à manger',ar:'الصالة وغرفة الطعام',emoji:'🛋️',items:[['un canapé','كنبة','🛋️'],['une télévision','تلفاز','📺'],['un fauteuil','كرسي بذراعين','🪑'],['une table','طاولة','🍽️']],sentence:'Dans le salon, il y a un canapé.'},
{id:'cuisine',name:'La cuisine & la salle de bains',ar:'المطبخ والحمام',emoji:'🚿',items:[['une cuisinière','بوتاجاز','🔥'],['un évier','حوض','🚰'],['un réfrigérateur','ثلاجة','❄️'],['une douche','دوش','🚿']],sentence:'Dans la cuisine, il y a un réfrigérateur.'}
];
const vocab=[...rooms.flatMap(r=>r.items.map(x=>({fr:x[0],ar:x[1],icon:x[2],room:r.name})))].filter((x,i,a)=>a.findIndex(y=>y.fr===x.fr)===i).slice(0,8);
const official=[
['tf','Dans la cuisine, il y a un lit.',['Vrai','Faux'],'Faux'],
['tf','Dans la salle à manger, il y a une table.',['Vrai','Faux'],'Vrai'],
['tf','Dans la chambre à coucher, il y a une armoire.',['Vrai','Faux'],'Vrai'],
['tf','Dans la salle de bains, il y a une cuisinière.',['Vrai','Faux'],'Faux'],
['mcq','Où cuisine-t-on ?',['la chambre','la cuisine','la salle de bains'],'la cuisine'],
['mcq','« Une armoire » se trouve généralement…',['dans la chambre','dans la cuisine'],'dans la chambre'],
['mcq','« Un canapé » se trouve…',['dans le salon','dans la salle de bains'],'dans le salon'],
['mcq','« C\'est un livre » au pluriel devient…',['Ce sont des livres','un livres'],'Ce sont des livres'],
['text','Comment dit-on « سرير » en français ?',[], 'lit'],
['text','Comment dit-on « دولاب » en français ?',[], 'armoire']
];
const dialogue=[
['👩 الأم','Bonjour ! Où est ton lit ?','Il est dans ma chambre.'],
['👧 الطفلة','Et la télévision ?','Elle est dans le salon.'],
['👩 الأم','Qu\'est-ce qu\'il y a dans la cuisine ?','Il y a un réfrigérateur et une cuisinière.'],
['👧 الطفلة','Et dans la salle de bains ?','Il y a une douche.'],
['👩 الأم','Très bien ! C\'est ta maison !','Oui, c\'est ma maison !']
];
const pages=['🚀 البداية','🔎 افهم','🧩 المفردات','🧠 القاعدة','💬 المحادثة','🎯 التدريب','🎧 اسمع وتحدث','🎬 الوسائط','🎮 مركز الألعاب','🏆 التقييم','🎓 بعد الرحلة'];let page=0,practiceState={};
function say(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function art(icon,label){return `<svg viewBox="0 0 260 150" role="img" aria-label="${esc(label)}"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7e3f3"/><stop offset="1" stop-color="#dbf0ec"/></linearGradient></defs><rect width="260" height="150" rx="18" fill="url(#g)"/><circle cx="218" cy="28" r="15" fill="#fff" opacity=".7"/><text x="130" y="92" text-anchor="middle" font-size="62">${icon}</text><text x="130" y="126" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#332b24">${esc(label)}</text></svg>`}
function nav(){return `<div class="nav"><button class="btn light" ${page===0?'disabled':''} onclick="go(${page-1})">← السابق</button><span class="counter">${page+1} / ${pages.length}</span><button class="btn" ${page===pages.length-1?'disabled':''} onclick="go(${page+1})">التالي →</button></div>`}
function go(n){page=Math.max(0,Math.min(pages.length-1,n));render()}
function shell(tag,h,p,body){document.getElementById('viewer').innerHTML=`<section class="panel"><span class="pill">${tag}</span><h2>${h}</h2><p>${p}</p>${body}${nav()}</section>`;document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say))}
function renderJourney(){document.getElementById('journey').innerHTML=pages.map((x,i)=>`<button class="step ${i===page?'active':''}" onclick="go(${i})"><span class="stepIcon">${i+1}</span>${x}</button>`).join('')}
function start(){shell('01 · START','🚀 C\'est ma maison !','هدف الرحلة: التعرف إلى غرف المنزل وأثاثها، استعمال un / une، وفهم C\'est → Ce sont.',`<div class="cards"><article class="card"><span class="pill">🎯 الهدف</span><h3>أتعرف إلى الأماكن والأشياء</h3><p>أربط كل كلمة بصورة ومكانها الصحيح داخل المنزل، ثم أستعملها في جمل قصيرة.</p></article><article class="card"><span class="pill">🧭 المسار</span><p>افهم → مفردات مصورة → قاعدة → محادثة → تدريب متنوع → اسمع وتحدث → فيديو → ألعاب → تقييم رسمي → مرجع المراجعة.</p></article></div>`)}
function discover(){let cards=rooms.map(r=>`<article class="card"><div class="scene">${art(r.emoji,r.name)}</div><h3>${r.emoji} ${r.name}</h3><p>${r.ar}</p><div class="choices">${r.items.map(x=>`<button class="btn light" data-say="${esc(x[0])}">${x[2]} ${x[0]} 🔊</button>`).join('')}</div><p><b>Ex :</b> <span dir="ltr">${r.sentence}</span> <button class="btn" data-say="${esc(r.sentence)}">🔊</button></p></article>`).join('');shell('02 · UNDERSTAND','🔎 افهم','لا نكرر المفردات فقط: كل غرفة تربط الكلمات بمشهد واضح وموقف استعمال.',`<div class="cards">${cards}</div>`)}
function vocabulary(){shell('03 · VOCABULARY','🧩 المفردات','اضغط على كل بطاقة: شاهد الصورة أولًا، ثم اقلبها للمعنى العربي، واستمع للنطق.',`<div class="vocabGrid">${vocab.map((x,i)=>`<article class="vcard" tabindex="0" onclick="this.classList.toggle('flipped')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.classList.toggle('flipped')}"><div class="vinner"><div class="vface"><div class="vscene">${art(x.icon,x.fr)}</div><h3 dir="ltr">${x.fr}</h3><div class="mini">اضغط لقلب البطاقة</div><button class="btn" data-say="${esc(x.fr)}" onclick="event.stopPropagation()">🔊 النطق</button></div><div class="vface back"><div class="vscene">${art(x.icon,x.ar)}</div><h3>${x.ar}</h3><p dir="ltr"><b>${x.fr}</b></p><button class="btn good" data-say="${esc(x.fr)}" onclick="event.stopPropagation()">🔊 استمع</button></div></div></article>`).join('')}</div>`)}
function grammar(){shell('04 · GRAMMAR','🧠 un / une + C\'est → Ce sont','القاعدة من محتوى الدرس: un مع المذكر، une مع المؤنث. وعند الجمع نستخدم des، ومع الجمع نقول Ce sont.',`<div class="cards"><article class="card"><span class="pill">UN 🔵</span><h3 dir="ltr">un lit · un canapé · un évier</h3><p>أسماء مذكرة مفردة.</p><button class="btn" data-say="un lit, un canapé, un évier">🔊 استمع</button></article><article class="card"><span class="pill">UNE 🟣</span><h3 dir="ltr">une armoire · une télévision · une douche</h3><p>أسماء مؤنثة مفردة.</p><button class="btn" data-say="une armoire, une télévision, une douche">🔊 استمع</button></article><article class="card"><span class="pill">SINGULIER → PLURIEL</span><h3 dir="ltr">un lit → des lits<br>une table → des tables</h3><p><b>C'est</b> للمفرد، و<b>Ce sont</b> للجمع.</p><button class="btn" data-say="C'est un lit. Ce sont des lits.">🔊 المثال</button></article></div>`)}
function conversation(){shell('05 · SPEAK','💬 المحادثة','محادثة حقيقية داخل المنزل: السؤال عن المكان والشيء، ثم الإجابة بجملة كاملة. ليست إعادة لقائمة المفردات.',`<div class="dialogue">${dialogue.map((x,i)=>`<div class="line"><div class="speaker">${x[0]}</div><div><div class="fr">${x[1]}</div><div class="fr" style="color:#665b4f">${x[2]}</div></div><button class="btn" data-say="${esc(x[1]+' '+x[2])}">🔊</button></div>`).join('')}</div><div class="card" style="margin-top:14px"><span class="pill">🎭 دورك</span><p>اقرأ سطر الطفلة بصوتك بعد سماعه، ثم حاول أن تجيب عن سؤال: <b>Où est le lit ?</b></p><button class="btn" data-say="Où est le lit ? Il est dans la chambre.">🔊 اسمع النموذج</button></div>`)}
function practice(){const qs=[['ما الكلمة المناسبة؟ «___ lit»',['un','une'],'un'],['أين يوجد canapé؟',['la chambre','le salon','la salle de bains'],'le salon'],['أكمل: Dans la cuisine, il y a ___ réfrigérateur.',['un','une'],'un'],['أكمل: Dans la salle de bains, il y a ___ douche.',['un','une'],'une'],['اختر الجمع الصحيح: C\'est un lit.',['Ce sont des lits.','C\'est des lit.'],'Ce sont des lits.'],['أي شيء يوجد في chambre؟',['une armoire','une cuisinière','un évier'],'une armoire']];shell('06 · PRACTICE','🎯 التدريب','تدريب متنوع: أدوات التعريف، الأماكن، الإكمال، والتحويل إلى الجمع.',`<div>${qs.map((q,i)=>`<div class="quiz"><div class="qtitle">${i+1}. ${q[0]}</div><div class="choices">${q[1].map(o=>`<button class="btn light pbtn" data-q="p${i}" data-a="${esc(o)}">${o}</button>`).join('')}</div><div class="feedback" id="pf${i}"></div></div>`).join('')}</div>`);document.querySelectorAll('.pbtn').forEach(b=>b.onclick=()=>{const i=+b.dataset.q.slice(1);const ok=b.dataset.a===qs[i][2];document.getElementById('pf'+i).textContent=ok?'🎉 صحيح!':'💡 حاول مرة أخرى.';document.getElementById('pf'+i).className='feedback '+(ok?'ok':'bad')})}
function listen(){const items=[['🛏️','Tu cherches le lit. Où est-il ?','Dans la chambre.'],['🛋️','Où est la télévision ?','Dans le salon.'],['🍳','Où cuisine-t-on ?','Dans la cuisine.'],['🚿','Qu\'est-ce qu\'il y a dans la salle de bains ?','Il y a une douche.'],['🧊','Qu\'est-ce qu\'il y a dans la cuisine ?','Il y a un réfrigérateur.'],['🪑','Qu\'est-ce qu\'il y a dans le salon ?','Il y a un canapé.']];shell('07 · LISTEN & SPEAK','🎧 اسمع وتحدث','ستة مواقف مختلفة بدل تكرار المثالين نفسيهما. استمع ثم انطق الإجابة بنفسك.',`<div class="cards">${items.map((x,i)=>`<article class="card"><span class="pill">موقف ${i+1}</span><div class="scene">${art(x[0],x[1])}</div><p dir="ltr"><b>${x[1]}</b></p><button class="btn" data-say="${esc(x[1])}">🔊 السؤال</button><details><summary>أظهر الإجابة</summary><p dir="ltr"><b>${x[2]}</b></p><button class="btn good" data-say="${esc(x[2])}">🔊 الإجابة</button></details></article>`).join('')}</div>`)}
function media(){shell('08 · MEDIA','🎬 الوسائط','أغنية الدرس الأصلية: Dans ma maison.',`<div class="card"><h3>Dans ma maison — la chanson</h3><div style="aspect-ratio:16/9"><iframe src="https://www.youtube.com/embed/LEffr6uKx-8" style="width:100%;height:100%;border:0;border-radius:18px" allowfullscreen title="Dans ma maison chanson"></iframe></div><p>شاهد الفيديو ثم ارجع إلى المفردات والمحادثة لتطبيق الكلمات.</p></div>`)}
function games(){shell('09 · GAME CENTER','🎮 مركز الألعاب','ألعاب قصيرة مرتبطة مباشرة بكلمات المنزل والقاعدة.',`<div class="cards"><article class="card"><span class="pill">🏠 لعبة 1</span><h3>من يعيش أين؟</h3><p>اختر الغرفة المناسبة للشيء.</p><div class="choices"><button class="btn light" onclick="game1(this,'un lit','chambre')">un lit → غرفة النوم</button><button class="btn light" onclick="game1(this,'un lit','cuisine')">un lit → المطبخ</button><button class="btn light" onclick="game1(this,'une douche','salle de bains')">une douche → الحمام</button></div><div class="feedback"></div></article><article class="card"><span class="pill">🔤 لعبة 2</span><h3>UN أم UNE؟</h3><div class="choices">${[['un canapé','un'],['une télévision','une'],['un évier','un'],['une douche','une']].map(x=>`<button class="btn light" onclick="game2(this,'${x[0]}','${x[1]}')">${x[0]}</button>`).join('')}</div><div class="feedback"></div></article></div>`)}
function game1(btn,word,room){const ok=(word==='un lit'&&room==='chambre')||(word==='une douche'&&room==='salle de bains');btn.parentElement.nextElementSibling.textContent=ok?'🎉 ممتاز!':'💡 جرّب غرفة أخرى.';btn.parentElement.nextElementSibling.className='feedback '+(ok?'ok':'bad')}
function game2(btn,word,ans){const ok=word.startsWith(ans);btn.parentElement.nextElementSibling.textContent=ok?'🎉 صحيح!':'💡 راقب أداة الاسم: un أم une؟';btn.parentElement.nextElementSibling.className='feedback '+(ok?'ok':'bad')}
function assessment(){shell('10 · ASSESSMENT','🏆 التقييم الرسمي','الأسئلة هنا مأخوذة من ملف الامتحان الإلكتروني الرسمي للدرس، دون اختراع أسئلة رسمية جديدة.',`<div id="assessArea">${official.map((q,i)=>`<div class="quiz"><div class="qtitle">${i+1}. ${q[1]}</div>${q[0]==='text'?`<input class="input aq" data-i="${i}" placeholder="اكتب الإجابة بالفرنسية">`:`<div class="choices">${q[2].map(o=>`<button class="btn light aqbtn" data-i="${i}" data-a="${esc(o)}">${o}</button>`).join('')}</div>`}<div class="feedback" id="af${i}"></div></div>`).join('')}</div><button class="btn good" onclick="checkOfficial()">✅ تحقق من التقييم</button><div id="ascore" class="score"></div>`)}
function checkOfficial(){let score=0;official.forEach((q,i)=>{let val;if(q[0]==='text'){val=(document.querySelector('.aq[data-i="'+i+'"]')?.value||'').trim().toLowerCase()}else{val=document.querySelector('.aqbtn.selected[data-i="'+i+'"]')?.dataset.a||''}const ok=val===q[3].toLowerCase();if(ok)score++;document.getElementById('af'+i).textContent=ok?'✔️ صحيح':'✘ الإجابة الصحيحة: '+q[3];document.getElementById('af'+i).className='feedback '+(ok?'ok':'bad')});document.getElementById('ascore').textContent='النتيجة: '+score+' / '+official.length}
document.addEventListener('click',e=>{const b=e.target.closest('.aqbtn');if(!b)return;document.querySelectorAll('.aqbtn[data-i="'+b.dataset.i+'"]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});
