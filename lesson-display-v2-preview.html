<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HM Academy | Lesson Display V2 Preview</title>
<style>
:root{--navy:#173a82;--blue:#2563eb;--teal:#0f9f91;--pink:#e92d83;--bg:#eef3f9;--ink:#15213d;--muted:#68758c;--card:#fff;--line:#dfe6f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans Arabic",sans-serif}.shell{max-width:1280px;margin:auto;padding:14px}.top{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:24px;padding:20px;box-shadow:0 12px 32px #173a8226}.eyebrow{font-size:13px;opacity:.85}.top h1{margin:5px 0;font-size:clamp(23px,4vw,36px)}.top p{margin:0;line-height:1.7;opacity:.92}.badge{background:#ffffff20;border:1px solid #ffffff35;border-radius:16px;padding:14px;text-align:center;min-width:130px}.layout{display:grid;grid-template-columns:250px 1fr;gap:14px;margin-top:14px}.side,.main{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 7px 24px #0000000a}.side{padding:12px;height:max-content;position:sticky;top:10px}.side h3{margin:4px 6px 10px}.lesson{display:block;width:100%;border:0;background:#f5f7fb;color:var(--ink);padding:11px;border-radius:12px;margin:6px 0;text-align:right;font-weight:800;cursor:pointer}.lesson.on{background:#e9f0ff;color:var(--blue);outline:2px solid #cddcff}.main{padding:16px}.journey{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:8px;margin-bottom:14px}.stage{border:1px solid var(--line);background:#f8faff;border-radius:13px;padding:10px;text-align:center;font-size:13px;font-weight:800;cursor:pointer}.stage.on{background:var(--blue);color:#fff;border-color:var(--blue)}.content{min-height:440px;border:1px solid var(--line);border-radius:18px;padding:18px;background:#fff}.content h2{margin-top:0}.source{border-right:5px solid var(--teal)}.hint{background:#fff8e8;border-right:4px solid #f59e0b;border-radius:10px;padding:11px;margin-top:12px}.frame{width:100%;height:720px;border:0;border-radius:16px;background:#f6f8fc}.note{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:11px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#edf2fb;color:var(--navy)}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static}.journey{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.shell{padding:8px}.top{grid-template-columns:1fr}.journey{grid-template-columns:repeat(2,1fr)}.main{padding:10px}.content{padding:12px}.frame{height:650px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div><div class="eyebrow">🇫🇷 HM Academy · Preview · Presentation Layer Only</div><h1>رحلة الدرس</h1><p>معاينة آمنة لطبقة العرض الجديدة فوق Lesson Studio الحالي، بدون تعديل بيانات الدروس.</p></div><div class="badge"><strong>V2</strong><br><span>SAFE PREVIEW</span></div></header>
<div class="layout">
<aside class="side"><h3>الدروس</h3><div id="lessons"></div></aside>
<section class="main"><div id="journey" class="journey"></div><div class="content"><h2 id="heading">جاري التحميل…</h2><div id="description"></div><div class="actions"><button class="btn" id="open">فتح الدرس</button><button class="btn secondary" id="reset">إعادة المعاينة</button></div><div class="note">هذه صفحة Preview مستقلة. الملف الأصلي grade7-lesson-studio.html لا يتم استبداله أو تعديل بياناته من هذه الصفحة.</div></div></section>
</div></div>
<script>
const lessons=[['grade7-u1-l1','الدرس 1'],['grade7-u1-l2','الدرس 2'],['grade7-u1-l3','الدرس 3'],['grade7-u1-l4','الدرس 4'],['grade7-u1-l5','الدرس 5'],['grade7-u1-l6','الدرس 6'],['grade7-u1-l7','الدرس 7'],['grade7-u1-l8','الدرس 8'],['grade7-u1-l9','الدرس 9'],['grade7-u1-l10','الدرس 10'],['grade7-u1-l11','الدرس 11']];
const stages=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];
const qs=new URLSearchParams(location.search);let lesson=qs.get('id')||lessons[0][0],stage=qs.get('section')||stages[0][0];
const lessonEl=document.getElementById('lessons'),journeyEl=document.getElementById('journey'),heading=document.getElementById('heading'),description=document.getElementById('description');
function render(){lessonEl.innerHTML=lessons.map(x=>`<button class="lesson ${x[0]===lesson?'on':''}" data-id="${x[0]}">${x[1]}</button>`).join('');journeyEl.innerHTML=stages.map(x=>`<button class="stage ${x[0]===stage?'on':''}" data-stage="${x[0]}">${x[1]}</button>`).join('');const lm=lessons.find(x=>x[0]===lesson)||lessons[0];const sm=stages.find(x=>x[0]===stage)||stages[0];heading.textContent=`${lm[1]} — ${sm[1]}`;description.innerHTML=`<div class="source"><p>هذه المعاينة تحافظ على معرف الدرس <b>${lm[0]}</b> والمرحلة <b>${sm[0]}</b> ثم تفتح Lesson Studio الأصلي بنفس السياق.</p><div class="hint">لا يتم نسخ المحتوى أو إعادة كتابته هنا؛ الهدف هو اختبار طبقة العرض قبل اعتمادها.</div></div>`;document.querySelectorAll('.lesson').forEach(b=>b.onclick=()=>{lesson=b.dataset.id;render()});document.querySelectorAll('.stage').forEach(b=>b.onclick=()=>{stage=b.dataset.stage;render()})}
document.getElementById('open').onclick=()=>{location.href=`grade7-lesson-studio.html?id=${encodeURIComponent(lesson)}&section=${encodeURIComponent(stage)}`};document.getElementById('reset').onclick=()=>{lesson=lessons[0][0];stage=stages[0][0];render()};render();
</script>
</body></html>
