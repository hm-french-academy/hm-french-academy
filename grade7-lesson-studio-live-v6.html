function loadVoices(){voices=window.speechSynthesis?window.speechSynthesis.getVoices():[]}
if('speechSynthesis' in window){loadVoices();window.speechSynthesis.onvoiceschanged=loadVoices}
function speak(text,btn){if(!('speechSynthesis' in window)){alert('ميزة النطق غير متاحة في هذا المتصفح.');return}window.speechSynthesis.cancel();document.querySelectorAll('.audio-btn').forEach(b=>b.classList.remove('speaking'));if(btn)btn.classList.add('speaking');const u=new SpeechSynthesisUtterance(String(text));u.lang='fr-FR';u.rate=.76;u.pitch=1;u.volume=1;const v=voices.find(x=>x.lang&&x.lang.toLowerCase().startsWith('fr-FR'))||voices.find(x=>x.lang&&x.lang.toLowerCase().startsWith('fr'));if(v)u.voice=v;u.onend=u.onerror=()=>{if(btn)btn.classList.remove('speaking')};window.speechSynthesis.speak(u)}
function stopSpeech(){if('speechSynthesis' in window)window.speechSynthesis.cancel();document.querySelectorAll('.audio-btn').forEach(b=>b.classList.remove('speaking'))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-speak]');if(b)speak(b.dataset.speak,b);const st=e.target.closest('[data-stop]');if(st)stopSpeech()});

function save(){localStorage.setItem(store,JSON.stringify(state))}
function nav(){document.getElementById('nav').innerHTML=S.map(x=>'<a class="'+(x[0]===sec?'on':'')+'" href="?id=grade7-u1-l2&section='+x[0]+'&v=20260925">'+x[1]+'</a>').join('')}
function audio(text,label='🔊 استمع'){return '<button type="button" class="audio-btn" aria-label="تشغيل نطق '+E(text)+'" data-speak="'+E(text).replace(/"/g,'&quot;')+'">'+label+'</button>'}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function qbox(arr,key){return (arr||[]).map((q,i)=>{const opts=shuffle(q.options);return '<article class="card question-card"><span class="tag">سؤال '+(i+1)+'</span><h3>'+E(q.q)+'</h3><div class="options">'+opts.map(o=>'<button type="button" onclick="answer('+JSON.stringify(key+i)+','+JSON.stringify(o)+','+JSON.stringify(q.answer)+',this)">'+E(o)+'</button>').join('')+'</div><div class="feedback" id="f-'+key+i+'"></div></article>'}).join('')}
function answer(k,v,c,b){const f=document.getElementById('f-'+k);const box=b.closest('.question-card');if(box.dataset.answered==='1')return;box.dataset.answered='1';box.querySelectorAll('.options button').forEach(x=>x.disabled=true);if(v===c){b.classList.add('selected-correct');f.innerHTML='<span class="ok">✅ إجابة صحيحة — أحسنت!</span>' ;state.done[k]=1}else{b.classList.add('selected-wrong');const right=[...box.querySelectorAll('.options button')].find(x=>x.textContent.trim()===c);if(right)right.classList.add('correct-answer');f.innerHTML='<span class="bad">❌ إجابة غير صحيحة.</span><br><span class="answer-reveal">الإجابة الصحيحة: <b>'+E(c)+'</b></span>';state.wrong=[...new Set([...(state.wrong||[]),k])]}save()}

else if(sec==='vocabulary')h='<h2>🖼️ المفردات</h2><p>'+E(L2.vocabulary.instruction)+'</p><div class="grid">'+L2.vocabulary.items.map(x=>'<article class="card audio-card"><div class="audio-icon">'+(visual[x[0]]||'💬')+'</div><div class="big-fr">'+E(x[0])+'</div><div class="ar">'+E(x[1])+'</div><p class="fr">'+E(x[2]||'')+'</p><div class="listen">'+audio(x[0],'🔊 الكلمة')+audio(x[2]||x[0],'🗣️ المثال')+'</div></article>').join('')+'</div>';
else if(sec==='pronunciation')h='<h2>🎧 مختبر النطق</h2><p>'+E(L2.pronunciation.instruction)+'</p><div class="grid">'+L2.pronunciation.items.map(x=>'<article class="card audio-card"><div class="audio-icon">'+(visual[x]||'🗣️')+'</div><div class="big-fr">'+E(x)+'</div><div class="listen">'+audio(x,'▶️ استمع')+audio(x,'🔁 كرر')+'</div></article>').join('')+'</div><div class="note enriched"><b>نظام التدريب:</b> اضغط ▶️ للاستماع، ثم 🔁 للتكرار. زر النطق يستخدم الصوت الفرنسي fr-FR ويحمّل الصوت المتاح تلقائيًا.</div>';
else if(sec==='grammar')h='<h2>📘 ملاحظات الاستعمال</h2><div class="note enriched">'+E(L2.grammar.explanation)+'</div><div class="grid">'+L2.grammar.notes.map((x,i)=>'<article class="card"><span class="tag">ملاحظة '+(i+1)+'</span><h3>'+E(x)+'</h3></article>').join('')+'</div><div class="note gold">هذه الصفحة مساعدة على الاستعمال وليست وحدة قواعد مستقلة.</div>';
else if(sec==='conversation')h='<h2>💬 المحادثة</h2><div class="note source"><b>المصدر الأصلي:</b> الحوار محفوظ كما ورد في بيانات الدرس.</div><div class="dialogue">'+L2.conversation.sourcePreserved.map((x,i)=>'<div class="bubble"><span class="tag">المصدر · '+(i+1)+'</span><p class="big-fr">'+E(x)+'</p>'+audio(x)+'</div>').join('')+'</div><h3>مواقف إثرائية</h3><div class="grid">'+L2.conversation.enrichmentPairs.map(x=>'<article class="card"><span class="tag">إثراء</span><p class="big-fr">'+E(x[0])+'</p><p class="big-fr">'+E(x[1])+'</p><p class="ar">'+E(x[2])+'</p>'+audio(x[0]+' '+x[1],'🔊 استمع للحوار')+'</article>').join('')+'</div>';
else if(sec==='practice')h='<h2>✍️ التدريب</h2><div class="note gold"><b>تدريب إثرائي:</b> الأسئلة مبنية على مفردات ومواقف الدرس، مع تغذية راجعة فورية.</div>'+qbox(L2.practice.questions,'p');
else if(sec==='video')h='<h2>🎬 الفيديو التكميلي</h2><div class="video"><iframe src="https://www.youtube-nocookie.com/embed/DJSMzUXkAQg?rel=0&modestbranding=1" title="Les salutations en français" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe><div class="video-info"><span class="tag">فيديو إثرائي · A1 · 3:18 تقريبًا</span><h3>French Greetings & Introductions | Beginner Lesson</h3><p>فيديو فرنسي قصير مدته نحو 3 دقائق و18 ثانية من Campus Langues، يشرح التحيات الفرنسية بحسب الموقف والوقت، ومنها Bonjour وSalut وBonsoir.</p><div class="video-actions"><a href="https://www.youtube.com/watch?v=DJSMzUXkAQg" target="_blank" rel="noopener">↗️ فتح الفيديو على YouTube</a></div></div></div><div class="note source"><b>ملاحظة الفيديو:</b> هذا الفيديو إثرائي مختار للدرس، وليس ادعاءً بأنه رابط فيديو المصدر الأصلي.</div>';
else if(sec==='games')h='<h2>🎮 الألعاب</h2><p>أنشطة سريعة لتثبيت الفرق بين التحيات والسياقات.</p><div class="grid">'+L2.games.map((g,i)=>{const opts=shuffle(g.options);return '<article class="card game-card"><span class="tag">لعبة '+(i+1)+'</span><h3>'+E(g.title)+'</h3><p>'+E(g.prompt)+'</p><div class="options">'+opts.map(o=>'<button type="button" onclick="game('+JSON.stringify(o)+','+JSON.stringify(g.answer)+','+JSON.stringify('game'+i)+',this)">'+E(o)+'</button>').join('')+'</div><div id="game'+i+'" class="feedback"></div></article>'}).join('')+'</div>';
else if(sec==='smart-review')h='<h2>🧠 المراجعة الذكية</h2><div class="note enriched">مراجعة مركزة على أكثر نقاط الدرس أهمية: Salut / Bonjour، Bonjour / Bonsoir، وصيغ الرد.</div>'+qbox(L2.smartReview.questions,'r');
else if(sec==='assessment')h='<h2>🏆 التقييم</h2><div class="note source"><b>المرجع الأصلي:</b> Vérifie-toi !</div><div class="note gold"><b>تقييم إلكتروني إثرائي:</b> '+L2.assessment.questions.length+' أسئلة. هذا الجزء إضافي ولا يحل محل نشاط المصدر.</div>'+qbox(L2.assessment.questions,'a')+'<button class="primary-btn" onclick="finish()">📊 احسب النتيجة</button><div id="result" class="feedback"></div>';
else{const done=Object.keys(state.done).length,total=Object.keys(L2.practice.questions).length+L2.smartReview.questions.length+L2.assessment.questions.length,pct=Math.min(100,Math.round(done/total*100));h='<h2>📈 تقدمك</h2><div class="card"><div class="score">'+pct+'%</div><div class="progress"><i style="width:'+pct+'%"></i></div><p>تم تسجيل '+done+' إجابة صحيحة في أنشطة الدرس.</p></div><div class="grid"><article class="card"><h3>📚 المحتوى الأصلي</h3><p>الأقسام والعبارات والأنشطة الأساسية محفوظة.</p></article><article class="card"><h3>✨ الإثراء</h3><p>نطق تفاعلي، فيديو، تدريب، ألعاب، مراجعة وتقييم.</p></article></div>'}
document.getElementById('app').innerHTML=h}
function game(v,c,id,b){const f=document.getElementById(id),box=b.closest('.card');if(box.dataset.answered==='1')return;box.dataset.answered='1';box.querySelectorAll('.options button').forEach(x=>x.disabled=true);if(v===c){b.classList.add('selected-correct');f.innerHTML='<span class="ok">✅ صحيح — ممتاز!</span>'}else{b.classList.add('selected-wrong');const right=[...box.querySelectorAll('.options button')].find(x=>x.textContent.trim()===c);if(right)right.classList.add('correct-answer');f.innerHTML='<span class="bad">❌ إجابة غير صحيحة.</span><br><span class="answer-reveal">الإجابة الصحيحة: <b>'+E(c)+'</b></span>'}}
function finish(){const n=Object.keys(state.done).filter(x=>x.startsWith('a')).length;state.score=n;save();document.getElementById('result').innerHTML='<span class="score">نتيجتك الحالية: '+n+' / '+L2.assessment.questions.length+'</span>'}
render();
</script></body></html>
