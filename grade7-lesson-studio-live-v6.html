<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | الصف الأول الإعدادي</title><style>:root{--g7p:#167c80;--g7p2:#2ca7a0;--g7soft:#e8f7f5;--g7bg:#f3f9f8;--g7ink:#123b46;--g7accent:#f0a44b}body{margin:0;background:var(--g7bg);color:var(--g7ink);font-family:Arial,"Noto Sans Arabic",sans-serif}body[data-lesson-section="vocabulary"]{--g7accent:#27a47d}body[data-lesson-section="pronunciation"]{--g7accent:#2496b8}body[data-lesson-section="grammar"]{--g7accent:#5272d1}body[data-lesson-section="conversation"]{--g7accent:#d88636}body[data-lesson-section="practice"]{--g7accent:#d05b75}body[data-lesson-section="video"]{--g7accent:#795cc8}body[data-lesson-section="games"]{--g7accent:#a24bb9}body[data-lesson-section="assessment"]{--g7accent:#c59a22}body[data-lesson-section="progress"]{--g7accent:#258467}.wrap{max-width:1100px;margin:auto;padding:10px}.hero{background:linear-gradient(135deg,var(--g7ink),var(--g7p),var(--g7p2));color:white;border-radius:24px;padding:22px;box-shadow:0 16px 36px rgba(22,124,128,.15);border-bottom:4px solid var(--g7accent)}.hero h1{margin:8px 0}.fr{direction:ltr;font-weight:900}.bar{display:flex;gap:7px;overflow:auto;background:#fff;padding:10px;border:1px solid #d5e9e7;border-radius:18px;margin-top:12px}.bar a{white-space:nowrap;text-decoration:none;background:#eef7f6;color:var(--g7ink);padding:8px 12px;border-radius:999px;font-weight:800}.bar a.on{background:var(--g7p);color:white;box-shadow:0 5px 14px rgba(22,124,128,.16)}.panel,.card{background:white;border:1px solid #d5e9e7;border-radius:18px}.panel{padding:16px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}.card{padding:14px;box-shadow:0 8px 24px rgba(18,59,70,.04)}.ar{text-align:center;color:var(--g7p);font-weight:800}.note{padding:12px;border-radius:12px;background:#f8fafc;border-right:4px solid var(--g7accent);margin:10px 0}.source{background:var(--g7soft);border-right-color:var(--g7p2)}button{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer;background:var(--g7p);color:white}.options{display:grid;gap:7px;margin-top:8px}.options button{background:white;color:var(--g7ink);border:1px solid #d5e9e7;text-align:right}.ok{color:#087443;font-weight:900}.bad{color:#b42318;font-weight:900}.feedback{min-height:25px;margin-top:7px}.score{font-size:22px;font-weight:900;color:var(--g7p)}.video{position:relative;width:100%;padding-top:56.25%;overflow:hidden;border-radius:16px;background:#111}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}</style><body data-lesson-section="introduction"><div class="wrap"><header class="hero"><b>🇫🇷 HM Academy · الصف الأول الإعدادي</b><h1 id="lessonTitle">جاري التحميل…</h1><div id="lessonFr" class="fr"></div><p id="lessonGoal"></p></header><nav class="bar" id="lessonNav"></nav><main class="panel" id="lessonApp">جاري تجهيز الدرس…</main></div><script>const P=new URLSearchParams(location.search),id=P.get('id')||'grade7-u1-l2',sec=P.get('section')||'introduction';
const stages=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];
const paths={'grade7-u1-l3':'unit-1/lesson-3.json','grade7-u1-l4':'unit-1/lesson-4.json','grade7-u1-l5':'unit-1/lesson-5.json','grade7-u1-l6':'unit-1/lesson-6.json'};
const L2={id:'grade7-u1-l2',titleFr:'Les salutations',titleAr:'التحيات',journeyContent:{introduction:{goal:'تمييز التحيات الفرنسية واختيار التعبير المناسب حسب الموقف.'},vocabulary:{items:[['Salut !','مرحبًا/أهلًا','Salut ! Comment ça va ?'],['Bonjour','صباح الخير/مرحبًا','Bonjour madame !'],['Bonsoir','مساء الخير','Bonsoir !'],['Bonjour madame !','مرحبًا سيدتي!','Bonjour madame !'],['Bonjour monsieur !','مرحبًا سيدي!','Bonjour monsieur !'],['Ça va bien.','أنا بخير.','Ça va bien, merci.'],['Ça va mal.','أنا لست بخير.','Ça va mal aujourd’hui.'],['Comme ci, comme ça.','هكذا هكذا.','Comme ci, comme ça.']]},pronunciation:{items:['Salut','Bonjour','Bonsoir','Ça va bien','Ça va mal','Comme ci, comme ça']},grammar:{notes:['Bonjour / Bonsoir يرتبطان بسياق الوقت.','Salut تعبير تحية غير رسمي.','Ça va ? سؤال شائع عن الحال.']},conversation:{sourcePreserved:['Salut ! Comment ça va ?','Bonjour madame ! Bonjour monsieur !']},games:['morning-or-evening','greeting-match','choose-the-right-greeting','dialogue-order']},assessment:{source:'Vérifie-toi !'}};
let D={};
const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function speak(t){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;window.speechSynthesis.speak(u)}
function nav(){document.body.dataset.lessonSection=sec;document.getElementById('lessonNav').innerHTML=stages.map(x=>'<a class="'+(x[0]===sec?'on':'')+'" href="?id='+encodeURIComponent(id)+'&section='+x[0]+'">'+x[1]+'</a>').join('')}
function vocab(){const a=D.journeyContent?.vocabulary?.items||[];return '<h2>🖼️ المفردات</h2><div class="grid">'+a.map(x=>'<article class="card"><b dir="ltr">'+E(x[0])+'</b><p class="ar">'+E(x[1])+'</p><p dir="ltr">'+E(x[2]||'')+'</p><button onclick="speak('+JSON.stringify(x[0])+')">🔊 استمع</button></article>').join('')+'</div>'}
function render(){const app=document.getElementById('lessonApp');let h='';
if(sec==='introduction')h='<h2>🚀 البداية</h2><div class="note source"><b>هدف الدرس</b><br>'+E(D.journeyContent?.introduction?.goal||'')+'</div><p>محتوى الدرس مبني على المصدر المعتمد.</p>';
else if(sec==='vocabulary')h=vocab();
else if(sec==='pronunciation'){const a=D.journeyContent?.pronunciation?.items||[];h='<h2>🎧 النطق</h2><div class="grid">'+a.map(x=>'<article class="card"><b dir="ltr">'+E(x)+'</b><br><button onclick="speak('+JSON.stringify(x)+')">🔊 استمع</button></article>').join('')+'</div>'}
else if(sec==='grammar'){h='<h2>📘 القواعد</h2>'+(D.journeyContent?.grammar?.notes||[]).map((x,i)=>'<article class="card" style="margin:8px 0"><b>'+String(i+1)+'</b> — '+E(x)+'</article>').join('')}
else if(sec==='conversation'){h='<h2>💬 المحادثة</h2><div class="grid">'+(D.journeyContent?.conversation?.sourcePreserved||[]).map(x=>'<article class="card"><p dir="ltr">'+E(x)+'</p><button onclick="speak('+JSON.stringify(x)+')">🔊 استمع</button></article>').join('')+'</div>'}
else if(sec==='games'){h='<h2>🎮 الألعاب</h2><div class="grid">'+(D.journeyContent?.games||[]).map((x,i)=>'<article class="card">🎮 <b>'+String(i+1)+'. '+E(x)+'</b></article>').join('')+'</div>'}
else if(sec==='video')h='<h2>🎬 الفيديو</h2><p class="note">لا يوجد فيديو مصدر محفوظ.</p>';
else if(sec==='practice')h='<h2>✍️ التدريب</h2><p class="note">تدريبات الدرس متاحة من محتوى التحيات والمفردات.</p>';
else if(sec==='assessment')h='<h2>🏆 التقييم</h2><p class="note source">التقييم المرجعي: Vérifie-toi !</p>';
else h='<h2>📈 التقدم</h2><p class="note">يمكن تسجيل إتمام الدرس من نسخة المشاركة الكاملة.</p>';
app.innerHTML=h;nav()}
async function start(){D=id==='grade7-u1-l2'?L2:null;
if(!D){try{const r=await fetch('data/lessons/grade-7/'+paths[id]+'?v=20260925',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);D=await r.json()}catch(e){document.getElementById('lessonApp').innerHTML='<div class="note"><b>تعذر تحميل محتوى هذا الدرس.</b></div>';return}}
document.getElementById('lessonTitle').textContent=D.titleAr||id;document.getElementById('lessonFr').textContent=D.titleFr||'';document.getElementById('lessonGoal').textContent=D.journeyContent?.introduction?.goal||'';render()}
start();</script>
