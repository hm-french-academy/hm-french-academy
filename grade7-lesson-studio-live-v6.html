ut"],"answer":"Bonsoir","reason":"Bonsoir ترتبط بسياق المساء."},{"q":"أي تحية تناسب صديقًا في موقف غير رسمي؟","options":["Salut","Bonjour monsieur !","Bonjour madame !"],"answer":"Salut","reason":"Salut تحية غير رسمية."},{"q":"أكمل: Salut ! ___ ça va ?","options":["Comment","Bonsoir","Madame"],"answer":"Comment","reason":"الصيغة المصدرية هي Salut ! Comment ça va ?"},{"q":"ماذا تعني Comme ci, comme ça ؟","options":["هكذا هكذا","صباح الخير","مساء الخير"],"answer":"هكذا هكذا","reason":"هي إحدى صيغ الإجابة عن الحال في الدرس."}]},"assessment":{"source":"Vérifie-toi !","sourceBoundary":"التقييم الأصلي هو المرجع.","questions":[{"q":"اختر تحية المساء.","options":["Bonjour","Bonsoir","Salut"],"answer":"Bonsoir","reason":"Bonsoir مرتبطة بالمساء."},{"q":"اختر التحية غير الرسمية.","options":["Salut","Bonjour madame !","Bonjour monsieur !"],"answer":"Salut","reason":"Salut تعبير غير رسمي."},{"q":"أكمل: Salut ! ___ ça va ?","options":["Comment","Bonsoir","Madame"],"answer":"Comment","reason":"الصيغة الصحيحة: Salut ! Comment ça va ?"},{"q":"ما معنى Bonjour monsieur !؟","options":["مرحبًا سيدي!","مساء الخير!","أنا بخير."],"answer":"مرحبًا سيدي!","reason":"monsieur تعني سيدي."},{"q":"ما معنى Bonjour madame !؟","options":["مرحبًا سيدتي!","مساء الخير!","هكذا هكذا."],"answer":"مرحبًا سيدتي!","reason":"madame تعني سيدتي."},{"q":"اختر التعبير الذي يدل على أنك بخير.","options":["Ça va bien.","Ça va mal.","Bonsoir."],"answer":"Ça va bien.","reason":"Ça va bien تعني أنا بخير."},{"q":"اختر التعبير الذي يدل على أنك لست بخير.","options":["Ça va mal.","Bonjour.","Salut."],"answer":"Ça va mal.","reason":"Ça va mal تعني أنا لست بخير."},{"q":"ما التعبير الذي يعني «هكذا هكذا»؟","options":["Comme ci, comme ça.","Ça va bien.","Bonsoir."],"answer":"Comme ci, comme ça.","reason":"هذه إحدى صيغ الإجابة عن الحال."},{"q":"أي تحية تناسب بداية النهار؟","options":["Bonjour","Bonsoir","Ça va mal."],"answer":"Bonjour","reason":"Bonjour تُستخدم في الصباح وكذلك كتحية عامة."},{"q":"أي كلمة مرتبطة بسياق الوقت؟","op const visual=L2.vocabulary.visuals||{};const store='hm_g7_l2_v3';let state=JSON.parse(localStorage.getItem(store)||'{"done":{},"wrong":[],"score":0}');
function E(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function speak(t){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;window.speechSynthesis.speak(u)}
function save(){localStorage.setItem(store,JSON.stringify(state))}
function nav(){document.getElementById('nav').innerHTML=S.map(x=>'<a class="'+(x[0]===sec?'on':'')+'" href="?id=grade7-u1-l2&section='+x[0]+'">'+x[1]+'</a>').join('')}
function qbox(arr,key){return (arr||[]).map((q,i)=>'<article class="card"><span class="tag">سؤال '+(i+1)+'</span><h3>'+E(q.q)+'</h3><div class="options">'+q.options.map(o=>'<button onclick="answer('+JSON.stringify(key+i)+','+JSON.stringify(o)+','+JSON.stringify(q.answer)+',this)">'+E(o)+'</button>').join('')+'</div><div class="feedback" id="f-'+key+i+'"></div></article>').join('')}
function answer(k,v,c,b){const f=document.getElementById('f-'+k);if(v===c){f.innerHTML='<span class="ok">✅ صحيح — أحسنت!</span>';state.done[k]=1;b.disabled=true}else{f.innerHTML='<span class="bad">❌ حاول مرة أخرى.</span><br>الإجابة الصحيحة: <b>'+E(c)+'</b>';state.wrong=[...new Set([...(state.wrong||[]),k])]}save()}
function render(){nav();let h='';
if(sec==='introduction')h='<h2>🚀 البداية</h2><p>'+E(L2.introduction.goal)+'</p><div class="grid">'+L2.introduction.learningPath.map((x,i)=>'<article class="card"><span class="tag">'+String(i+1).padStart(2,'0')+'</span><h3>'+E(x)+'</h3></article>').join('')+'</div><div class="note gold"><b>مسار الدرس:</b> المصدر الأصلي محفوظ، والإثراء التفاعلي موضح بوضوح داخل الصفحات.</div>';
else if(sec==='vocabulary')h='<h2>🖼️ المفردات</h2><p>'+E(L2.vocabulary.instruction)+'</p><div class="grid">'+L2.vocabulary.items.map(x=>'<article class="card"><div class="visual">'+(visual[x[0]]||'💬')+'</div><div class="big-fr">'+E(x[0])+'</div><div class="ar">'+E(x[1])+'</div><p class="fr">'+E(x[2]||'')+'</p><div class="listen"><button onclick="speak('+JSON.stringify(x[0])+')">🔊 التعبير</button><button onclick="speak('+JSON.stringify(x[2]||'')+')">🗣️ المثال</button></div></article>').join('')+'</div>';
else if(sec==='pronunciation')h='<h2>🎧 النطق</h2><p>'+E(L2.pronunciation.instruction)+'</p><div class="grid">'+L2.pronunciation.items.map(x=>'<article class="card"><div class="visual">'+(visual[x]||'🗣️')+'</div><div class="big-fr">'+E(x)+'</div><div class="listen"><button onclick="speak('+JSON.stringify(x)+')">🔊 استمع</button><button onclick="speak('+JSON.stringify(x)+')">🔁 كرر</button></div></article>').join('')+'</div><div class="note enriched"><b>تفاعل النطق:</b> استمع → كرر → أعد الاستماع → اختر السياق الصحيح.</div>';

else if(sec==='practice')h='<h2>✍️ التدريب</h2><div class="note gold"><b>تدريب إثرائي:</b> 6 أسئلة مبنية مباشرة على كلمات ومواقف الدرس. الإجابة الخاطئة لا تنهي المحاولة.</div>'+qbox(L2.practice.questions,'p');
else if(sec==='video')h='<h2>🎬 الفيديو التكميلي</h2><div class="card"><div class="visual">🎬</div><h3>Vidéo complémentaire</h3><p>يوجد في المصدر قسم فيديو تكميلي، لكن لا يوجد رابط فيديو موثّق داخل بيانات الدرس الحالية؛ لذلك لن نضع رابطًا افتراضيًا.</p><div class="note source">المصدر: Vidéo complémentaire</div></div>';
else if(sec==='games')h='<h2>🎮 الألعاب</h2><p>ألعاب قصيرة مرتبطة مباشرة بسياقات التحيات.</p><div class="grid">'+L2.games.map((g,i)=>'<article class="card"><span class="tag">لعبة '+(i+1)+'</span><h3>'+E(g.title)+'</h3><p>'+E(g.prompt)+'</p><div class="options">'+g.options.map(o=>'<button onclick="game('+JSON.stringify(o)+','+JSON.stringify(g.answer)+','+JSON.stringify('game'+i)+',this)">'+E(o)+'</button>').join('')+'</div><div id="game'+i+'" class="feedback"></div></article>').join('')+'</div>';
else if(sec==='smart-review')h='<h2>🧠 المراجعة الذكية</h2><div class="note enriched">مراجعة قصيرة تستهدف الفروق التي يجب إتقانها: Salut / Bonjour، Bonjour / Bonsoir، وصيغ الرد والحوار.</div>'+qbox(L2.smartReview.questions,'r');
else if(sec==='assessment')h='<h2>🏆 التقييم</h2><div class="note source"><b>المرجع الأصلي:</b> Vérifie-toi !</div><div class="note gold"><b>التقييم الإلكتروني الإثرائي:</b> '+L2.assessment.questions.length+' أسئلة لقياس إتقان عناصر الدرس. هذا الجزء ليس بديلًا عن نشاط المصدر.</div><div id="assessment">'+qbox(L2.assessment.questions,'a')+'</div><button onclick="finish()">📊 احسب النتيجة</button><div id="result" class="feedback"></div>';
else{const done=Object.keys(state.done).length,total=6+4+L2.assessment.questions.length,pct=Math.min(100,Math.round(done/total*100));h='<h2>📈 التقدم</h2><div class="card"><div class="score">'+pct+'%</div><div class="progress"><i style="width:'+pct+'%"></i></div><p>تم تسجيل '+done+' إجابة صحيحة في أنشطة الدرس.</p></div><div class="grid"><article class="card"><h3>📚 المصدر</h3><p>أقسام المصدر والعبارات الأساسية محفوظة.</p></article><article class="card"><h3>🎯 الإثراء</h3><p>تدريب، ألعاب، مراجعة ذكية وتقييم إلكتروني.</p></article></div>'}
document.getElementById('app').innerHTML=h}

function finish(){const n=Object.keys(state.done).filter(x=>x.startsWith('a')).length;state.score=n;save();document.getElementById('result').innerHTML='<span class="score">نتيجتك الحالية: '+n+' / '+L2.assessment.questions.length+'</span>'}
document.getElementById('title').textContent='التحيات';document.getElementById('fr').textContent='Les salutations';render();
</script></body></html>
