<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | الصف الأول الإعدادي</title><style>body{margin:0;background:#f4f7fb;color:#14213d;font-family:Arial,"Noto Sans Arabic",sans-serif}.wrap{max-width:1100px;margin:auto;padding:10px}.hero{background:linear-gradient(135deg,#102a56,#2455a6,#0f9f91);color:white;border-radius:24px;padding:22px}.hero h1{margin:8px 0}.fr{direction:ltr;font-weight:900}.bar{display:flex;gap:7px;overflow:auto;background:#fff;padding:10px;border:1px solid #e1e7f0;border-radius:18px;margin-top:12px}.bar a{white-space:nowrap;text-decoration:none;background:#eef3fb;color:#102a56;padding:8px 12px;border-radius:999px;font-weight:800}.bar a.on{background:#2563eb;color:white}.panel,.card{background:white;border:1px solid #e1e7f0;border-radius:18px}.panel{padding:16px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}.card{padding:14px}.ar{text-align:center;color:#315aa4;font-weight:800}.note{padding:12px;border-radius:12px;background:#f8fafc;border-right:4px solid #94a3b8;margin:10px 0}.source{background:#effbf8;border-right-color:#0f9f91}button{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer;background:#2563eb;color:white}.options{display:grid;gap:7px;margin-top:8px}.options button{background:white;color:#14213d;border:1px solid #e1e7f0;text-align:right}.ok{color:#087443;font-weight:900}.bad{color:#b42318;font-weight:900}.feedback{min-height:25px;margin-top:7px}.score{font-size:22px;font-weight:900}.video{position:relative;width:100%;padding-top:56.25%;overflow:hidden;border-radius:16px;background:#111}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}</style><body><div class="wrap"><header class="hero"><b>🇫🇷 HM Academy · الصف الأول الإعدادي</b><h1 id="lessonTitle">جاري التحميل…</h1><div id="lessonFr" class="fr"></div><p id="lessonGoal"></p></header><nav class="bar" id="lessonNav"></nav><main class="panel" id="lessonApp">جاري تجهيز الدرس…</main></div><script>
const P=new URLSearchParams(location.search),id=P.get('id')||'grade7-u1-l2',sec=P.get('section')||'introduction';const paths={'grade7-u1-l2':'unit-1/lesson-2.json','grade7-u1-l3':'unit-1/lesson-3.json','grade7-u1-l4':'unit-1/lesson-4.json','grade7-u1-l5':'unit-1/lesson-5.json','grade7-u1-l6':'unit-1/lesson-6.json','grade7-u2-l1':'unit-2/lesson-1.json','grade7-u2-l2':'unit-2/lesson-2.json','grade7-u3-l1':'unit-3/lesson-1.json','grade7-u3-l2':'unit-3/lesson-2.json','grade7-u3-l3':'unit-3/lesson-3.json'};const stages=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];let D={};const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const SH=a=>[...a].sort(()=>Math.random()-.5);const speak=t=>{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)};function NAV(){lessonNav.innerHTML=stages.map(x=>`<a class="${x[0]===sec?'on':''}" href="?id=${encodeURIComponent(id)}&section=${x[0]}">${x[1]}</a>`).join('')}
function V(){let a=D.journeyContent?.vocabulary?.items||D.interactiveExtraction?.vocabulary||D.sourceData?.vocabulary||[];return Array.isArray(a)?a:[]}function intro(){return `<h2>🚀 البداية</h2><div class="note source"><b>هدف الدرس</b><br>${E(D.journeyContent?.introduction?.goal||'اكتشف محتوى الدرس ثم طبّقه.')}</div><p>محتوى الدرس مبني على المصدر المعتمد.</p>`}function vocab(){let a=V();return `<h2>🖼️ المفردات</h2><div class="grid">${a.map(x=>`<article class="card"><b dir="ltr">${E(x[0])}</b><p class="ar">${E(x[1])}</p>${x[2]?`<p dir="ltr">${E(x[2])}</p>`:''}<button onclick='speak(${JSON.stringify(x[0])})'>🔊 استمع</button></article>`).join('')||'<p class="note">لا توجد مفردات منظمة.</p>'}</div>`}function pron(){let a=D.journeyContent?.pronunciation?.items||V().map(x=>x[0]);return `<h2>🎧 النطق</h2><div class="grid">${(Array.isArray(a)?a:[]).map(x=>`<article class="card"><b dir="ltr">${E(x)}</b><br><button onclick='speak(${JSON.stringify(x)})'>🔊 استمع</button></article>`).join('')}</div>`}function gram(){let a=D.journeyContent?.grammar?.notes||[];return `<h2>📘 القواعد</h2>${a.map((x,i)=>`<article class="card" style="margin:8px 0"><b>${i+1}</b> — ${E(x)}</article>`).join('')||'<p class="note">القاعدة مرتبطة بأنشطة المصدر.</p>'}`}function conv(){let a=D.journeyContent?.conversation?.sourcePreserved||[];return `<h2>💬 المحادثة</h2><div class="grid">${a.map(x=>`<article class="card"><p dir="ltr">${E(x)}</p><button onclick='speak(${JSON.stringify(x)})'>🔊 استمع</button></article>`).join('')||'<p class="note">لا يوجد حوار نصي منظم.</p>'}</div>`}function norm(a){return(Array.isArray(a)?a:[]).filter(x=>Array.isArray(x)&&x.length>=3&&Array.isArray(x[1])).map(x=>({q:x[0],o:x[1],a:x[2]}))}function practiceQ(){let a=norm(D.sourceData?.quizData);if(!a.length&&Array.isArray(D.interactiveExtraction?.assessment))a=norm(D.interactiveExtraction.assessment.map(x=>[x.q,x.options,x.answer]));if(!a.length){let v=V();a=v.slice(0,6).map(x=>({q:`ما معنى «${x[0]}»؟`,o:[x[1],...SH(v.filter(y=>y!==x)).slice(0,2).map(y=>y[1])],a:x[1]}))}return a.slice(0,6)}function assessmentQ(){let a=norm(D.assessment?.items),base=[...a,...practiceQ()],v=V();for(const x of v){if(base.length>=20)break;base.push({q:`اختر التعبير الصحيح المرتبط بـ «${x[0]}»`,o:[x[0],...SH(v.filter(y=>y!==x)).slice(0,2).map(y=>y[0])],a:x[0]})}while(base.length<20&&base.length>0){let z=base[base.length%base.length];base.push({...z,q:z.q+' · مراجعة'})}return base.slice(0,20)}let qn=0;function quiz(a){if(!a.length)return '<p class="note">لا تتوفر عناصر منظمة لهذا النشاط.</p>';let k='q'+(++qn);window.Q=window.Q||{};Q[k]={c:0,t:a.length};return `<div id="${k}" class="score">0 / ${a.length}</div><div class="grid">${a.map((q,i)=>`<article class="card"><b>${i+1}. ${E(q.q)}</b><div class="options">${SH(q.o).map(o=>`<button data-k="${k}-${i}" onclick='answer(${JSON.stringify(k)},${i},${JSON.stringify(o)},${JSON.stringify(q.a)},this)'>${E(o)}</button>`).join('')}</div><div id="f-${k}-${i}" class="feedback"></div></article>`).join('')}</div>`}function answer(k,i,v,c,b){document.querySelectorAll(`[data-k="${k}-${i}"]`).forEach(x=>x.disabled=true);if(v===c)Q[k].c++;document.getElementById(`f-${k}-${i}`).innerHTML=v===c?'<span class="ok">✅ صحيح — أحسنت!</span>`:`<span class="bad">❌ غير صحيح.</span><br>الإجابة الصحيحة: ${E(c)}`;document.getElementById(k).textContent=`${Q[k].c} / ${Q[k].t}`}function practice(){return `<h2>✍️ التدريب التفاعلي</h2>${quiz(practiceQ())}`}function assessment(){return `<h2>🏆 التقييم</h2><p class="note source">20 عنصرًا في كل درس.</p>${quiz(assessmentQ())}`}function games(){let a=D.journeyContent?.games||[];return `<h2>🎮 الألعاب</h2><div class="grid">${(Array.isArray(a)?a:[]).map((x,i)=>`<article class="card">🎮 <b>${i+1}. ${E(x)}</b></article>`).join('')||'<p class="note">أنشطة اللعبة مرتبطة بمحتوى الدرس.</p>'}</div>`}function video(){let v=D.sourceVideoId;return `<h2>🎬 الفيديو</h2>${v?`<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v)}?rel=0" title="فيديو الدرس الأصلي" allowfullscreen></iframe></div><p class="note source">فيديو المصدر الأصلي.</p>`:'<p class="note">لا يوجد فيديو مصدر محفوظ.</p>'}`}function progress(){let k='hm_g7_'+id+'_progress',v=+localStorage.getItem(k)||0;return `<h2>📈 التقدم</h2><div class="card"><b>تقدم هذا الدرس</b><p>${Math.min(100,v)}%</p><button onclick='localStorage.setItem(${JSON.stringify(k)},"100");location.reload()'>تسجيل إتمام الدرس</button></div>`}function render(){const M={introduction:intro,vocabulary:vocab,pronunciation:pron,grammar:gram,conversation:conv,practice,video,games,assessment,progress};document.getElementById('lessonApp').innerHTML=(M[sec]||intro)();NAV()}async function load(){try{if(!paths[id])throw Error('unknown');const r=await fetch(`data/lessons/grade-7/${paths[id]}?v=20260908-v6`,{cache:'no-store'});if(!r.ok)throw Error('http');let x=await r.json();for(let i=0;i<8&&x&&typeof x.content==='string';i++)x=JSON.parse(x.content);D=x&&x.content&&typeof x.content==='string'?JSON.parse(x.content):x;document.getElementById('lessonTitle').textContent=D.titleAr||id;document.getElementById('lessonFr').textContent=D.titleFr||'';document.getElementById('lessonGoal').textContent=D.journeyContent?.introduction?.goal||'';render()}catch(e){console.error(e);document.getElementById('lessonApp').innerHTML='<div class="note"><b>تعذر تحميل محتوى هذا الدرس.</b><br>تحقق من الاتصال ثم أعد المحاولة.</div>'}}load();</script>
