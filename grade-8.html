<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14264a"><title>HM Academy | Français simple 2</title><link rel="stylesheet" href="css/premium-shell.css?v=20260811-gradehub12"><style>.term-switch{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 22px}.term-switch button{border:1px solid #dfe6f2;background:#fff;color:#315fc8;border-radius:14px;padding:11px 18px;font:inherit;font-weight:900;cursor:pointer}.term-switch button.active{background:#2563eb;color:#fff;border-color:#2563eb}.term-note{margin:0 0 18px;padding:15px 17px;border-radius:18px;background:#f7f9fd;border:1px solid #e4eaf3;color:#68758b;line-height:1.8}.term-note strong{color:#14264a}.unit-card{grid-column:1/-1}.unit-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}.unit-head h2{margin:0;color:#14264a}.unit-head p{margin:5px 0 0;color:#6c7890}.lesson-card{margin-top:14px;padding:17px;border:1px solid #e5eaf4;border-radius:20px;background:#fbfcff}.lesson-title{font-size:18px;font-weight:900;color:#14264a;margin-bottom:12px}.file-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.file-link{display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;text-align:center;min-height:82px;padding:12px;border-radius:15px;background:#fff;border:1px solid #dfe6f2;color:#315fc8;text-decoration:none;font-weight:900;font-size:13px}.file-link:hover{border-color:#2563eb;transform:translateY(-1px)}.file-link small{color:#7a879a;font-weight:700}.map-box{padding:15px;border-radius:16px;background:#f7f9fd;border:1px dashed #cad6e8;color:#68758b;line-height:1.8}.map-box strong{color:#14264a}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{padding:6px 9px;background:#fff;border:1px solid #dfe6f2;border-radius:10px;font-size:12px;color:#4d5d76}.excluded{display:none!important}@media(max-width:1050px){.file-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){.file-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.file-grid{grid-template-columns:1fr}.term-switch button{flex:1}}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="index.html">الرئيسية</a><a href="dashboard.html">الطالب</a><a href="course.html">المناهج الدراسية</a><a href="levels.html">مستويات اللغة</a><a href="grade-8.html">Français simple 2</a><a href="library.html">المكتبة</a><a href="settings.html">الإعدادات</a></nav><div class="hm-tools"><select class="hm-lang" data-lang-select aria-label="Display language"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select><a class="hm-student" href="student-profile.html">👨‍🎓</a></div></header><div class="hm-page"><main class="hm-main"><section class="hm-hero"><h1 id="gradeTitle"></h1><p id="gradeSubtitle"></p></section><div class="term-switch"><button id="term1Btn" class="active" type="button"></button><button id="term2Btn" type="button"></button></div><div id="termNote" class="term-note"></div><section id="units" class="hm-grid"></section></main></div><footer class="hm-footer"><div class="hm-footer-brand"><strong>HM Academy</strong><span>French Language Education</span><small>© 2026</small></div></footer><script src="scripts/i18n.js?v=20260811-i18n3"></script><script src="scripts/brand.js?v=20260811-grade12"></script><script>(function(){const T={ar:{title:'🇫🇷 Français simple 2 — الصف الثاني الإعدادي',sub:'الترم الأول · الوحدات المعتمدة حاليًا: الأولى والثانية والثالثة.',term1:'الترم الأول',term2:'الترم الثاني',note:'تم اعتماد الوحدات 1–3 لهذا النطاق. الوحدة الرابعة مستبعدة ولن تظهر أو تدخل في البحث أو التقييمات.',term2note:'محتوى الترم الثاني سيظهر عند اعتماده وإتاحته.',unit:'الوحدة',lesson:'الدرس',interactive:'الملف التفاعلي',reference:'الملف المرجعي',assessment:'التقييم الرسمي',interactiveAssessment:'الاختبار التفاعلي',games:'مركز الألعاب',map:'خريطة محتوى الوحدة',mapped:'المحتوى الدراسي مربوط، ويجري تجهيز تقسيمه إلى الدروس الفعلية.',vocab:'المفردات',grammar:'القواعد',verbs:'الأفعال'},fr:{title:'🇫🇷 Français simple 2 — 2e année du collège',sub:'1er semestre · Unités actuellement approuvées : 1, 2 et 3.',term1:'1er semestre',term2:'2e semestre',note:'Les unités 1–3 sont incluses. L’unité 4 est exclue et ne sera ni affichée ni indexée ni utilisée dans les évaluations.',term2note:'Le contenu du deuxième semestre apparaîtra dès qu’il sera validé.',unit:'Unité',lesson:'Leçon',interactive:'Fichier interactif',reference:'Fichier de référence',assessment:'Évaluation officielle',interactiveAssessment:'Évaluation interactive',games:'Centre de jeux',map:'Carte du contenu',mapped:'Le contenu est cartographié ; la répartition en leçons réelles est en cours.',vocab:'Vocabulaire',grammar:'Grammaire',verbs:'Verbes'},en:{title:'🇫🇷 Français simple 2 — Grade 8',sub:'Term 1 · Approved units currently included: 1, 2 and 3.',term1:'Term 1',term2:'Term 2',note:'Units 1–3 are included. Unit 4 is excluded and will not be displayed, indexed, or used in assessments.',term2note:'Term 2 content will appear once approved and available.',unit:'Unit',lesson:'Lesson',interactive:'Interactive file',reference:'Reference file',assessment:'Formal assessment',interactiveAssessment:'Interactive assessment',games:'Game center',map:'Unit content map',mapped:'The curriculum content is mapped; the official lesson breakdown is being prepared.',vocab:'Vocabulary',grammar:'Grammar',verbs:'Verbs'}};let data=null,term='term-1';function lang(){return window.HMLanguage?.get?.()||'ar'}function t(){return T[lang()]||T.ar}function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function title(u){return (lang()==='ar'?u.titleAr:u.titleFr)||u.titleFr||u.id}function file(h,i,l,d){return h?`<a class="file-link" href="${esc(h)}">${i}<span>${esc(l)}</span><small>${esc(d)}</small></a>`:''}function render(){const x=t();document.getElementById('gradeTitle').textContent=x.title;document.getElementById('gradeSubtitle').textContent=x.sub;document.getElementById('term1Btn').textContent=x.term1;document.getElementById('term2Btn').textContent=x.term2;document.getElementById('termNote').innerHTML=`<strong>${term==='term-1'?x.term1:x.term2}:</strong> ${esc(term==='term-1'?x.note:x.term2note)}`;document.getElementById('term1Btn').classList.toggle('active',term==='term-1');document.getElementById('term2Btn').classList.toggle('active',term==='term-2');const root=document.getElementById('units');if(term==='term-2'){root.innerHTML=`<article class="hm-card"><h2>${esc(x.term2note)}</h2></article>`;return}root.innerHTML=(data?.units||[]).filter(u=>!data.scope?.excludedUnits?.includes(u.id)).map((u,i)=>{const keys=Object.keys(u.lessonFiles||{});let body=keys.length?keys.map(k=>{const l=u.lessonFiles[k];return `<div class="lesson-card"><div class="lesson-title">📖 ${esc(l.titleFr||`${x.lesson} ${k}`)}</div><div class="file-grid">${file(l.interactive,'🎧',x.interactive,'Audio + pratique')}${file(l.reference,'📄',x.reference,'PDF / impression')}${file(l.assessment,'🎯',x.assessment,'Évaluation')}${file(l.interactiveAssessment,'🧠',x.interactiveAssessment,'Défis')}${file(l.games,'🎮',x.games,'Jeux indépendants')}</div></div>`}).join(''):`<div class="map-box"><strong>📚 ${esc(x.map)} :</strong> ${esc(x.mapped)}<div class="chips">${(u.vocabulary||[]).map(v=>`<span class="chip">${esc(v)}</span>`).join('')}</div><p><strong>${esc(x.grammar)}:</strong> ${esc((u.grammar||[]).join(' · '))}</p><p><strong>${esc(x.verbs)}:</strong> ${esc((u.verbs||[]).join(' · '))}</p></div>`;return `<article class="hm-card unit-card"><div class="unit-head"><div class="hm-icon">${i===0?'🏫':i===1?'🏠':'✈️'}</div><div><h2>${esc(title(u))}</h2><p>${esc(x.unit)} ${i+1}</p></div></div>${body}</article>`}).join('')}async function load(){try{const r=await fetch('data/curricula/grade-8-french-semester-1.json?v=20260811-scope4',{cache:'no-store'});data=await r.json();render()}catch(e){document.getElementById('units').innerHTML='<article class="hm-card"><h2>تعذر تحميل بيانات المنهج</h2></article>'}}document.getElementById('term1Btn').onclick=()=>{term='term-1';render()};document.getElementById('term2Btn').onclick=()=>{term='term-2';render()};load();window.addEventListener('hm:languagechange',render)})();</script></body></html>
