.term-switch{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 22px}.term-switch button{border:1px solid #dfe6f2;background:#fff;color:#315fc8;border-radius:14px;padding:11px 18px;font:inherit;font-weight:900;cursor:pointer}.term-switch button.active{background:#2563eb;color:#fff;border-color:#2563eb}.term-note{margin:0 0 18px;padding:15px 17px;border-radius:18px;background:#f7f9fd;border:1px solid #e4eaf3;color:#68758b;line-height:1.8}.term-note strong{color:#14264a}.unit-card{grid-column:1/-1}.unit-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}.unit-head h2{margin:0;color:#14264a}.unit-head p{margin:5px 0 0;color:#6c7890}.lesson-card{margin-top:14px;padding:17px;border:1px solid #e5eaf4;border-radius:20px;background:#fbfcff}.lesson-title{font-size:18px;font-weight:900;color:#14264a;margin-bottom:12px}.file-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.file-link{display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;text-align:center;min-height:82px;padding:12px;border-radius:15px;background:#fff;border:1px solid #dfe6f2;color:#315fc8;text-decoration:none;font-weight:900;font-size:13px}.file-link:hover{border-color:#2563eb;transform:translateY(-1px)}.file-link small{color:#7a879a;font-weight:700}.empty-files{padding:14px;border-radius:14px;background:#f5f7fa;color:#7a8497;font-size:13px}@media(max-width:1050px){.file-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){.file-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.file-grid{grid-template-columns:1fr}.term-switch button{flex:1}}
</style>

<header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline" data-i18n="tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="index.html" data-i18n="home">الرئيسية</a><a href="dashboard.html" data-i18n="student">الطالب</a><a href="course.html" data-i18n="schoolCurriculum">المناهج الدراسية</a><a href="levels.html" data-i18n="languageTracks">مستويات اللغة</a><a href="grade-8.html">Français simple 2</a><a href="library.html" data-i18n="library">المكتبة</a><a href="settings.html" data-i18n="settings">الإعدادات</a></nav><div class="hm-tools"><select class="hm-lang" data-lang-select aria-label="Display language"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select><a class="hm-student" href="student-profile.html">👨‍🎓</a></div></header>
<div class="hm-page"><main class="hm-main"><section class="hm-hero"><h1 id="gradeTitle"></h1><p id="gradeSubtitle"></p></section><div class="term-switch" role="tablist" aria-label="Academic term"><button id="term1Btn" class="active" type="button"></button><button id="term2Btn" type="button"></button></div><div id="termNote" class="term-note"></div><section id="units" class="hm-grid"></section></main></div>

<script src="scripts/i18n.js?v=20260811-i18n3"></script><script src="scripts/brand.js?v=20260811-grade11"></script>
<script>
(function(){
const T={ar:{title:'🇫🇷 Français simple 2 — الصف الثاني الإعدادي',sub:'اختر الترم الدراسي للوصول إلى الوحدات والدروس والملفات والأنشطة التعليمية الخاصة بالمنهج.',term1:'الترم الأول',term2:'الترم الثاني',note:'اختر الترم لعرض الوحدات والدروس والمواد التعليمية المتاحة.',term2note:'محتوى الترم الثاني سيظهر هنا عند اعتماده وإتاحته على المنصة.',unit:'الوحدة',lesson:'الدرس',interactive:'الملف التفاعلي',reference:'الملف المرجعي',assessment:'التقييم الرسمي',interactiveAssessment:'الاختبار التفاعلي',games:'مركز الألعاب',gamesDetail:'ألعاب وتحديات خاصة بالدرس',empty:'لا توجد دروس متاحة في هذه الوحدة حاليًا.',loading:'جاري تحميل المنهج…',error:'تعذر تحميل المنهج',errorSub:'تحقق من الاتصال ثم أعد تحميل الصفحة.'},fr:{title:'🇫🇷 Français simple 2 — 2e année du collège',sub:'Choisissez le semestre pour accéder aux unités, leçons, ressources et activités du programme.',term1:'1er semestre',term2:'2e semestre',note:'Choisissez un semestre pour afficher ses unités, leçons et ressources disponibles.',term2note:'Le contenu du deuxième semestre apparaîtra ici dès qu’il sera validé et disponible.',unit:'Unité',lesson:'Leçon',interactive:'Fichier interactif',reference:'Fichier de référence',assessment:'Évaluation officielle',interactiveAssessment:'Évaluation interactive',games:'Centre de jeux',gamesDetail:'Jeux et défis de la leçon',empty:'Aucune leçon disponible dans cette unité pour le moment.',loading:'Chargement du programme…',error:'Impossible de charger le programme',errorSub:'Vérifiez la connexion puis rechargez la page.'},en:{title:'🇫🇷 Français simple 2 — Grade 8',sub:'Choose the term to access the units, lessons, resources and learning activities for this curriculum.',term1:'Term 1',term2:'Term 2',note:'Choose a term to display its available units, lessons and resources.',term2note:'Term 2 content will appear here once it is approved and made available.',unit:'Unit',lesson:'Lesson',interactive:'Interactive file',reference:'Reference file',assessment:'Formal assessment',interactiveAssessment:'Interactive assessment',games:'Game center',gamesDetail:'Lesson games and challenges',empty:'No lessons are currently available in this unit.',loading:'Loading curriculum…',error:'Unable to load curriculum',errorSub:'Check the connection and reload the page.'}};
let data=null,current='term-1';
function L(){return T[window.HMLanguage?.get?.()||'ar']||T.ar}
function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function header(){const t=L();document.getElementById('gradeTitle').textContent=t.title;document.getElementById('gradeSubtitle').textContent=t.sub;document.getElementById('term1Btn').textContent=t.term1;document.getElementById('term2Btn').textContent=t.term2}
function fileButton(href,icon,label,detail){return href?`<a class="file-link" href="${esc(href)}">${icon}<span>${esc(label)}</span><small>${esc(detail)}</small></a>`:''}
function render(){const t=L(),root=document.getElementById('units');document.getElementById('termNote').innerHTML=current==='term-1'?`<strong>${esc(t.term1)}:</strong> ${esc(t.note)}`:`<strong>${esc(t.term2)}:</strong> ${esc(t.term2note)}`;document.getElementById('term1Btn').classList.toggle('active',current==='term-1');document.getElementById('term2Btn').classList.toggle('active',current==='term-2');if(current==='term-2'){root.innerHTML='<article class="hm-card"><h2>'+esc(t.term2note)+'</h2></article>';return}const units=data?.units||[];if(!units.length){root.innerHTML='<article class="hm-card"><h2>'+esc(t.error)+'</h2><p>'+esc(t.errorSub)+'</p></article>';return}root.innerHTML=units.map((u,i)=>{const title=langTitle(u),lessons=u.lessonFiles||{},keys=Object.keys(lessons);let lessonHtml='';if(keys.length){lessonHtml=keys.map(k=>{const l=lessons[k]||{};const titleL=(lang()==='ar'?l.titleAr:lang()==='fr'?l.titleFr:l.titleFr)||`${t.lesson} ${k.replace('lesson-','')}`;return `<div class="lesson-card"><div class="lesson-title">📖 ${esc(titleL)}</div><div class="file-grid">${fileButton(l.interactive,'🎧',t.interactive,'Audio + pratique')}${fileButton(l.reference,'📄',t.reference,'PDF / impression')}${fileButton(l.assessment,'🎯',t.assessment,'10 tâches')}${fileButton(l.interactiveAssessment,'🧠',t.interactiveAssessment,'8 défis')}${fileButton(l.games,'🎮',t.games,t.gamesDetail)}</div></div>`}).join('')}else{lessonHtml=`<div class="empty-files">${esc(t.empty)}</div>`}return `<article class="hm-card unit-card" id="unit-${i+1}"><div class="unit-head"><div class="hm-icon">${i===0?'🏫':'📘'}</div><div><h2>${esc(title)}</h2><p>${esc(t.unit)} ${i+1}</p></div></div>${lessonHtml}</article>`}).join('')}
function lang(){return window.HMLanguage?.get?.()||'ar'}
function langTitle(u){return (lang()==='ar'?u.titleAr:lang()==='fr'?u.titleFr:u.titleFr)||u.titleFr||u.titleAr||u.id}
async function load(){const root=document.getElementById('units');root.innerHTML='<article class="hm-card"><h2>'+esc(L().loading)+'</h2></article>';try{const r=await fetch('data/curricula/grade-8-french-semester-1.json?v=20260811-grade8-final3',{cache:'no-store'});if(!r.ok)throw Error(r.status);data=await r.json();render()}catch(e){console.error('HM curriculum load:',e);root.innerHTML='<article class="hm-card"><h2>'+esc(L().error)+'</h2><p>'+esc(L().errorSub)+'</p></article>'}}
document.getElementById('term1Btn').addEventListener('click',()=>{current='term-1';render()});document.getElementById('term2Btn').addEventListener('click',()=>{current='term-2';render()});header();load();window.addEventListener('hm:languagechange',function(){header();if(data)render()})
})();
</script>
</body></html>
