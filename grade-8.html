<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14264a"><title>HM Academy | الصف الثاني الإعدادي</title><link rel="stylesheet" href="css/premium-shell.css?v=20260811-gradehub4"></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline" data-i18n="tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="index.html" data-i18n="home">الرئيسية</a><a href="dashboard.html" data-i18n="student">الطالب</a><a href="course.html" data-i18n="courses">المسارات</a><a href="grade-8.html" data-i18n="grade8">الصف الثاني الإعدادي</a><a href="library.html" data-i18n="library">المكتبة</a><a href="settings.html" data-i18n="settings">الإعدادات</a></nav><div class="hm-tools"><select class="hm-lang" data-lang-select aria-label="Display language"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select><a class="hm-student" href="student-profile.html">👨‍🎓</a></div></header><div class="hm-page"><main class="hm-main"><section class="hm-hero"><h1 id="gradeTitle">🇫🇷 الصف الثاني الإعدادي</h1><p id="gradeSubtitle">الفصل الدراسي الأول — الوحدات والدروس محملة من سجل المنهج المركزي.</p></section><section id="units" class="hm-grid" style="grid-template-columns:repeat(2,1fr)"><article class="hm-card"><h2 id="loadingText">جاري تحميل المنهج…</h2></article></section></main></div><footer class="hm-footer"><div class="hm-footer-brand"><strong>HM Academy</strong><span>French Language Education</span><small>Founded by Hatem ElMorsi · © 2026</small></div></footer><script src="scripts/i18n.js?v=20260810"></script><script src="scripts/brand.js?v=20260810-brand2"></script><script src="scripts/curriculum-registry-loader.js"></script><script src="scripts/grade-curriculum-runtime.js"></script><script>(async()=>{const root=document.getElementById('units');const lang=()=>window.HMLanguage?.get?.()||localStorage.getItem('hm_display_language')||'ar';const T={ar:{title:'🇫🇷 الصف الثاني الإعدادي',sub:'الفصل الدراسي الأول — الوحدات والدروس محملة من سجل المنهج المركزي.',loading:'جاري تحميل المنهج…',unit:'الوحدة',lessons:'درس/دروس مرتبطة',open:'فتح الدرس الأول',lesson:'الدرس',empty:'لا توجد دروس مرتبطة بعد.',error:'تعذر تحميل بيانات المنهج',errorSub:'يمكن مراجعة ملفات المنهج مباشرة من المستودع.'},fr:{title:'🇫🇷 2e année préparatoire',sub:'Premier trimestre — unités et leçons chargées depuis le registre central du programme.',loading:'Chargement du programme…',unit:'Unité',lessons:'leçon(s) associée(s)',open:'Ouvrir la première leçon',lesson:'Leçon',empty:'Aucune leçon associée pour le moment.',error:'Impossible de charger les données du programme',errorSub:'Les fichiers du programme peuvent être consultés directement dans le dépôt.'},en:{title:'🇫🇷 Grade 8',sub:'First term — units and lessons loaded from the central curriculum registry.',loading:'Loading curriculum…',unit:'Unit',lessons:'linked lesson(s)',open:'Open Lesson 1',lesson:'Lesson',empty:'No linked lessons yet.',error:'Unable to load curriculum data',errorSub:'The curriculum files can be reviewed directly in the repository.'}};function applyStatic(){const t=T[lang()]||T.ar;document.getElementById('gradeTitle').textContent=t.title;document.getElementById('gradeSubtitle').textContent=t.sub;}function render(data){const t=T[lang()]||T.ar;root.innerHTML=(data.units||[]).map((u,i)=>`<article class="hm-card"><div class="hm-icon">${i===0?'🏫':'📘'}</div><h2>${t.unit} ${i+1} — ${u.title||u.id}</h2><div style="margin-top:14px;padding:12px;border-radius:14px;background:#f7f9fd;color:#68758c;font-size:12px">${(u.lessons||[]).length} ${t.lessons}</div><div class="hm-actions">${(u.lessons||[]).map((l,j)=>`<a class="hm-btn" href="${l.id==='grade8-u1-l1'?'lesson.html':'#'}">▶ ${l.id==='grade8-u1-l1'?t.open:t.lesson+' '+(j+1)}</a>`).join('')}</div></article>`).join('')||`<article class="hm-card"><h2>${t.empty}</h2></article>`;}let curriculum=null;async function load(){try{const index=await fetch('data/curriculum/index.json',{cache:'no-store'});if(!index.ok)throw new Error('index');const registry=await index.json();const grade=(registry.grades||[]).find(x=>x.id==='grade-8');if(!grade?.file)throw new Error('grade');const r=await fetch(grade.file,{cache:'no-store'});if(!r.ok)throw new Error('grade-data');curriculum=await r.json();render(curriculum);}catch(e){const t=T[lang()]||T.ar;root.innerHTML=`<article class="hm-card"><h2>${t.error}</h2><p>${t.errorSub}</p></article>`;}}applyStatic();load();window.addEventListener('hm:languagechange',()=>{applyStatic();if(curriculum)render(curriculum);});})();</script></body></html>
