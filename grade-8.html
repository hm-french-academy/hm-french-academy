m 1 is currently connected to the available pilot curriculum data.',notReady:'Term 2 files are not connected yet. They will appear here when integrated.',empty:'No units are connected to this term yet.'}};let data=null,current='term-1';function L(){return T[window.HMLanguage?.get?.()||'ar']||T.ar}function header(){const t=L();document.getElementById('gradeTitle').textContent=t.title;document.getElementById('gradeSubtitle').textContent=t.sub;document.getElementById('term1Btn').textContent=t.term1;document.getElementById('term2Btn').textContent=t.term2}function render(){const t=L(),root=document.getElementById('units');document.getElementById('termNote').innerHTML=current==='term-1'?'<strong>'+t.term1+':</strong> '+t.ready:'<strong>'+t.term2+':</strong> '+t.notReady;document.getElementById('term1Btn').classList.toggle('active',current==='term-1');document.getElementById('term2Btn').classList.toggle('active',current==='term-2');if(current==='term-2'){root.innerHTML='<article class="hm-card"><div class="hm-icon">📚</div><h2>'+t.empty+'</h2><p>'+t.notReady+'</p></article>';return}const units=data?.units||[];if(!units.length){root.innerHTML='<article class="hm-card"><h2>'+t.error+'</h2><p>'+t.errorSub+'</p></article>';return}root.innerHTML=units.map((u,i)=>{const lessons=u.lessons||[];return '<article class="hm-card" id="unit-'+(i+1)+'"><div class="hm-icon">'+(i===0?'🏫':'📘')+'</div><h2>'+((u.title&&u.title.trim())||t.unit+' '+(i+1))+'</h2><p>'+lessons.length+' '+t.lessons+'</p><div class="hm-actions">'+lessons.map((l,j)=>'<a class="hm-btn" href="'+(l.id==='grade8-u1-l1'?'lesson.html':(l.file||'#'))+'">▶ '+t.open+' '+(j+1)+'</a>').join('')+'</div></article>'}).join('')}async function load(){const root=document.getElementById('units');root.innerHTML='<article class="hm-card"><h2>'+L().loading+'</h2></article>';try{const r=await fetch('data/curricula/grade-8-french-semester-1.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);data=await r.json();render()}catch(e){console.error('HM curriculum load:',e);root.innerHTML='<article class="hm-card"><h2>'+L().error+'</h2><p>'+L().errorSub+'</p></article>'}}document.getElementById('term1Btn').addEventListener('click',()=>{current='term-1';render()});document.getElementById('term2Btn').addEventListener('click',()=>{current='term-2';render()});header();load();window.addEventListener('hm:languagechange',function(){header();if(data)render()})})();</script></body></html>
