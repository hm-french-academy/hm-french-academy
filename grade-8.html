<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy — الصف الثاني الإعدادي</title><link rel="stylesheet" href="css/style.css?v=20260809"><link rel="stylesheet" href="css/theme-refresh.css?v=20260809"><style>main{max-width:1100px;margin:auto;padding:24px}.unit{margin:18px 0;padding:20px;border-radius:18px;background:#fff;box-shadow:0 5px 18px #0001}.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.lesson{padding:16px;border:1px solid #e5e7eb;border-radius:14px}.btn{display:inline-block;margin-top:10px}</style></head><body><header><a href="index.html">🇫🇷 HM Academy</a><p>الصف الثاني الإعدادي</p></header><main><section class="hero"><h1>اللغة الفرنسية — الصف الثاني الإعدادي</h1><p>اختر الوحدة ثم الدرس. الملفات التفاعلية تحتفظ بالصوت داخلها، وفيديوهات الدروس تعمل عبر YouTube.</p><a class="btn" href="dashboard.html">لوحة الطالب</a></section><div id="units"><p>جارٍ تحميل المنهج…</p></div></main><footer>HM Academy © 2026</footer><script>const units=[{id:'unit-1',fr:"À l'école",ar:'في المدرسة',count:4},{id:'unit-2',fr:'La maison',ar:'المنزل',count:4},{id:'unit-3',fr:'Le voyage',ar:'السفر',count:4},{id:'unit-4',fr:'La fête',ar:'الحفلة',count:4}];const root=document.getElementById('units');root.innerHTML=units.map((u,ui)=>`<section class="unit"><h2>Unité ${ui+1} — ${u.fr}</h2><p>${u.ar}</p><div class="lessons">${Array.from({length:u.count},(_,i)=>{const n=i+1;const pilot=ui===0&&n===1;return `<article class="lesson"><h3>Leçon ${n}</h3><p>${pilot?'Pilot جاهز للتجربة':'سيتم ربط ملفات الدرس الأصلية'}</p>${pilot?`<a class="btn" href="data/lessons/grade-8/unit-1/lesson-1-route.html">فتح الدرس التفاعلي ▶</a>`:`<button class="btn" disabled>قريبًا</button>`}</article>`}).join('')}</div></section>`).join('');</script></body></html>
