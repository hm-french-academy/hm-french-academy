id">'+u.lessons.map(l=>'<div class="lesson-card"><span class="lesson-number">'+esc(x.lesson)+' '+l.number+'</span><div class="lesson-title">'+esc(lTitle(l))+'</div><span class="status '+(l.status==='live'?'live':'')+'">'+esc(statusText(l.status))+'</span><div class="lesson-actions"><a class="lesson-action primary" href="'+esc(l.interactive)+'">'+esc(x.open)+'</a><a class="lesson-action" href="'+esc(l.files)+'">'+esc(x.files)+'</a></div><a class="lesson-action games" href="'+esc(l.games)+'">🎮 '+esc(x.games)+'</a></div>').join('')+'</div></article>').join('')}async function load(){try{const r=await fetch('data/lessons/grade-8/lesson-registry.json?v=20260811-registry2',{cache:'no-store'});if(!r.ok)throw new Error();registry=await r.json();render()}catch(e){units.innerHTML='<article class="hm-card unit-card"><h2>تعذر تحميل خريطة الدروس</h2></article>'}}term1Btn.onclick=()=>{term=1;render()};term2Btn.onclick=()=>{term=2;render()};window.addEventListener('hm:languagechange',render);load();</script></body></html>
