<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Français simple 2</title><link rel="stylesheet" href="css/premium-shell.css?v=20260812-gradehub16"><style>.term-switch{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 20px}.term-switch button{border:1px solid #dfe6f2;background:#fff;color:#315fc8;border-radius:14px;padding:11px 18px;font:inherit;font-weight:900;cursor:pointer}.term-switch button.active{background:#2563eb;color:#fff}.unit-card{grid-column:1/-1}.unit-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}.unit-head h2{margin:0;color:#14264a}.unit-head p{margin:4px 0;color:#718096}.lessons-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.lesson-card{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid #e3e9f3;border-radius:18px;background:#fff;min-height:205px}.lesson-number{font-size:12px;font-weight:900;color:#2563eb}.lesson-title{font-size:16px;font-weight:900;color:#14264a;line-height:1.5}.lesson-actions{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.lesson-action{padding:9px;border-radius:11px;text-decoration:none;text-align:center;font-size:12px;font-weight:900;border:1px solid #dfe6f2;color:#315fc8;background:#f8faff}.lesson-action.primary{background:#2563eb;color:#fff;border-color:#2563eb}.lesson-action.games{background:#f7f0ff;color:#713bd1;border-color:#e5d7fb}.term-empty{padding:28px;text-align:center;color:#68758b}@media(max-width:1000px){.lessons-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.lessons-grid{grid-template-columns:1fr}.term-switch button{flex:1}}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline" data-i18n="tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="index.html" data-i18n= const T={ar:{title:'🇫🇷 Français simple 2 — الصف الثاني الإعدادي',sub:'الترم الأول · 3 وحدات · 12 درسًا',t1:'الترم الأول',t2:'الترم الثاني',t2note:'سيظهر محتوى الترم الثاني عند اعتماده.',unit:'الوحدة',lesson:'الدرس',open:'فتح الدرس',files:'ملفات الدرس',games:'الألعاب'},fr:{title:'🇫🇷 Français simple 2 — 2e année du collège',sub:'1er semestre · 3 unités · 12 leçons',t1:'1er semestre',t2:'2e semestre',t2note:'Le contenu du deuxième semestre apparaîtra après validation.',unit:'Unité',lesson:'Leçon',open:'Ouvrir',files:'Fichiers',games:'Jeux'},en:{title:'🇫🇷 Français simple 2 — Grade 8',sub:'Term 1 · 3 units · 12 lessons',t1:'Term 1',t2:'Term 2',t2note:'Term 2 content will appear after approval.',unit:'Unit',lesson:'Lesson',open:'Open lesson',files:'Lesson files',games:'Games'}};
let registry=null,term=1;const lang=()=>window.HMLanguage?.get?.()||'ar',tr=()=>T[lang()]||T.ar,uTitle=u=>lang()==='ar'?u.titleAr:u.titleFr,lTitle=l=>lang()==='ar'?l.titleAr:l.titleFr;
function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function route(id){return 'lesson.html?id='+encodeURIComponent(id)}
function render(){const x=tr();gradeTitle.textContent=x.title;gradeSubtitle.textContent=x.sub;term1Btn.textContent=x.t1;term2Btn.textContent=x.t2;term1Btn.classList.toggle('active',term===1);term2Btn.classList.toggle('active',term===2);if(term===2){units.innerHTML='<article class="hm-card unit-card"><div class="term-empty">'+esc(x.t2note)+'</div></article>';return}units.innerHTML=(registry?.includedUnits||[]).map((u,i)=>'<article class="hm-card unit-card"><div class="unit-head"><div class="hm-icon">'+(i===0?'🏫':i===1?'🏠':'✈️')+'</div><div><h2>'+esc(uTitle(u))+'</h2><p>'+esc(x.unit)+' '+(i+1)+' · 4 '+esc(x.lesson)+'s</p></div></div><div class="lessons-grid">'+(u.lessons||[]).map(l=>'<div class="lesson-card"><span class="lesson-number">'+esc(x.lesson)+' '+l.number+'</span><div class="lesson-title">'+esc(lTitle(l))+'</div><div class="lesson-actions"><a class="lesson-action primary" href="'+route(l.id)+'">'+esc(x.open)+'</a><a class="lesson-action" href="'+route(l.id)+'">'+esc(x.files)+'</a></div><a class="lesson-action games" href="'+route(l.id)+'">🎮 '+esc(x.games)+'</a></div>').join('')+'</div></article>').join('')}
async function load(){try{const r=await fetch('data/lessons/grade-8/lesson-registry.json?v=20260812-registry4',{cache:'no-store'});if(!r.ok)throw new Error();registry=await r.json();render()}catch(e){units.innerHTML='<article class="hm-card unit-card"><div class="term-empty">تعذر تحميل خريطة الدروس</div></article>'}}
term1Btn.onclick=()=>{term=1;render()};term2Btn.onclick=()=>{term=2;render()};window.addEventListener('hm:languagechange',render);load();
</script></body></html>
