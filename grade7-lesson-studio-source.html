<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | الصف الأول الإعدادي — Source Learning Studio</title><style>body{margin:0;background:#f5f7fb;color:#17223b;font-family:Arial,"Cairo",sans-serif}.wrap{max-width:1120px;margin:auto;padding:16px}.header,.hero,.panel,.complete{border-radius:22px}.header{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#0f1b33;color:#fff;padding:12px 14px}.header a{color:#173a82;background:#eef3ff;text-decoration:none;border-radius:11px;padding:9px 12px;font-weight:900}.hero{margin-top:14px;background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff;padding:24px}.hero h1{margin:0 0 8px}.journey,.nav{display:flex;gap:7px;overflow:auto}.journey{margin-top:14px}.journey span,.nav button{border-radius:999px;padding:9px 12px;white-space:nowrap;font-weight:900}.journey span{background:#ffffff22;border:1px solid #ffffff44}.nav{background:#fff;padding:8px;margin:14px 0}.nav button{border:0;background:#eef3ff;color:#173a82;cursor:pointer}.nav button.active{background:#e92d83;color:#fff}.panel{background:#fff;padding:20px;box-shadow:0 10px 30px #14264a12}.card{border:1px solid #e1e6ef;border-radius:16px;padding:14px;margin:10px 0;background:#fff}.source{background:#f7f9fd;border-right:4px solid #2563eb;line-height:1.9}.fr{direction:ltr;text-align:left;font-weight:900}.small{color:#718096;font-size:13px}.complete{margin-top:14px;background:#fff;padding:17px}.progress{height:10px;background:#e7ecf5;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:#2563eb}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:900;cursor:pointer}.primary{background:#2563eb;color:#fff}.option{padding:12px;border:1px solid #dbe1eb;border-radius:11px;background:#fff;font-weight:800;cursor:pointer;margin:4px}.correct{background:#ecfdf3!important}.wrong{background:#fff2f8!important}@media(max-width:650px){.wrap{padding:10px}.header{border-radius:14px}}</style></head><body><div class="wrap"><header class="header"><b>🇫🇷 HM Academy · الصف الأول الإعدادي</b><a href="grade-7.html">المرحلة</a></header><section class="hero"><h1 id="title">Learning Studio</h1><p id="subtitle">رحلة تعلم مستقلة مبنية على المصدر الأصلي للصف الأول الإعدادي</p><div class="journey"><span>🚀 البداية</span><span>🖼️ المفردات</span><span>🎧 النطق</span><span>📘 القواعد</span><span>💬 المحادثة</span><span>✍️ التدريب</span><span>🎬 الفيديو</span><span>🎮 الألعاب</span><span>🧠 المراجعة الذكية</span><span>🏆 التقييم</span><span>📈 التقدم</span></div></section><nav class="nav" id="nav"></nav><section class="panel" id="panel"></section><section class="complete"><b>📈 التقدم</b><div class="small" id="status">التقدم محفوظ على هذا الجهاز.</div><div class="progress"><div class="bar" id="bar"></div></div><button class="btn primary" onclick="done()">إكمال الدرس</button></section></div><script>const q=new URLSearchParams(location.search),id=q.get('id')||'grade7-u1-l1',section=q.get('section')||'introduction';const sections=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];let d=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.86;speechSynthesis.speak(u)}function go(s){location.href='grade7-lesson-studio-source.html?id='+encodeURIComponent(id)+'&section='+encodeURIComponent(s)}function done(){localStorage.setItem('hm-grade7-source-progress-'+id,'1');status()}function status(){let ok=localStorage.getItem('hm-grade7-source-progress-'+id)==='1';document.getElementById('status').textContent=ok?'✅ تم إكمال هذا الدرس على هذا الجهاز.':'التقدم محفوظ على هذا الجهاز.';document.getElementById('bar').style.width=ok?'100%':'0%'}function render(){document.getElementById('nav').innerHTML=sections.map(x=>`<button class="${x[0]===section?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');document.getElementById('title').textContent=d.titleAr+' · '+d.titleFr;let f=views[section]||views.introduction;document.getElementById('panel').innerHTML=f();status()}function sourceCards(){return (d.sections||[]).map((s,i)=>`<article class="card source"><b>${esc(s)}</b><div class="small">هذا المحور مأخوذ من المصدر الأصلي للدرس ${d.sourceLesson}، ويُقدَّم داخل HM Academy دون تغيير هوية المصدر.</div></article>`).join('')}const views={introduction:()=>`<h2>🚀 البداية</h2><p><b>${esc(d.titleFr)}</b></p><div class="card">المصدر الأصلي: <b>Leçon ${d.sourceLesson}</b><br>هوية المرحلة: <b>grade-7</b><br>الصف الثاني الإعدادي مرجع بصري/تفاعلي فقط ولا يُستخدم كمصدر محتوى.</div><h3>مكونات المصدر</h3>${sourceCards()}`,vocabulary:()=>`<h2>🖼️ المفردات</h2><p>استخرج المفردات والعبارات من محاور المصدر قبل التدريب، مع النطق الفرنسي.</p>${sourceCards()}<button class="btn primary" onclick="speak(${JSON.stringify(d.titleFr)})">🔊 استمع لعنوان الدرس</button>`,pronunciation:()=>`<h2>🎧 النطق</h2><div class="card">استخدم أزرار الاستماع أثناء دراسة النصوص والمفردات. لا يتم إدخال نطق أو كلمات غير موجودة في المصدر.</div>${sourceCards()}`,grammar:()=>`<h2>📘 القواعد</h2><div class="card">تُعرض القاعدة من المادة الأصلية المرتبطة بالدرس، وتُحافظ الصفحة على سياق المصدر بدل استبداله بمحتوى خارجي.</div>${sourceCards()}`,conversation:()=>`<h2>💬 المحادثة</h2><div class="card">المحادثة والعبارات الحوارية تُستخرج من المصدر الأصلي للدرس وتُقدَّم كجزء من رحلة HM Academy.</div>${sourceCards()}`,practice:()=>`<h2>✍️ التدريب</h2><div class="card">التدريب هنا مرتبط بمحاور المصدر. ابدأ من كل محور ثم انتقل إلى التقييم.</div>${sourceCards()}`,video:()=>`<h2>🎬 الفيديو</h2><div class="card">الفيديوهات المرفقة بالمصدر تبقى مرتبطة بالدرس. لا يتم اختلاق روابط خارجية غير موثقة.</div>`,games:()=>`<h2>🎮 الألعاب</h2><div class="card">الألعاب طبقة تفاعلية مستقلة فوق المحتوى الأصلي ولا تستبدل المصدر.</div><button class="btn primary" onclick="alert('ابدأ التحدي من محاور الدرس ثم انتقل إلى التقييم.')">ابدأ التحدي</button>`,"smart-review":()=>`<h2>🧠 المراجعة الذكية</h2><div class="card">راجع محاور المصدر بالترتيب ثم انتقل إلى التقييم.</div><button class="btn primary" onclick="go('vocabulary')">ابدأ المراجعة</button>`,assessment:()=>`<h2>🏆 التقييم</h2><div class="card">التقييم الرسمي مرتبط بملف Assessment الأصلي للدرس.</div><button class="btn primary" onclick="done()">تسجيل إكمال التقييم</button>`,progress:()=>`<h2>📈 التقدم</h2><div class="card">الدرس: <b>${esc(id)}</b><br>المصدر: Leçon ${d.sourceLesson}<br>التقدم محفوظ محليًا.</div>`};fetch('data/lessons/grade-7/grade7-source-content.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{d=x.lessons.find(l=>l.id===id);if(!d){document.getElementById('panel').innerHTML='<div class="card">لم يتم العثور على الدرس.</div>';return}render()}).catch(()=>document.getElementById('panel').innerHTML='<div class="card">تعذر تحميل بيانات المنهج.</div>');</script></body></html>
