<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Grade 7 Learning Studio</title><style>body{margin:0;background:#f5f7fb;color:#17223b;font-family:Arial,"Cairo",sans-serif}.wrap{max-width:1120px;margin:auto;padding:12px}.top,.hero,.panel,.progressbox{border-radius:22px}.top{display:flex;justify-content:space-between;align-items:center;background:#0f1b33;color:#fff;padding:12px 14px}.top a{color:#173a82;background:#eef3ff;padding:9px 12px;border-radius:11px;text-decoration:none;font-weight:900}.hero{margin-top:12px;padding:24px;color:#fff;background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6)}h1{margin:0;font-size:clamp(25px,6vw,42px)}.hero p{line-height:1.8}.chips,.nav{display:flex;gap:7px;overflow:auto}.chips{margin-top:13px}.chips span,.nav button{white-space:nowrap;padding:9px 12px;border-radius:999px;font-weight:900}.chips span{background:#ffffff22;border:1px solid #ffffff44}.nav{background:#fff;margin:12px 0;padding:8px}.nav button{border:0;background:#eef3ff;color:#173a82;cursor:pointer}.nav button.active{background:#e92d83;color:#fff}.panel{background:#fff;padding:20px;box-shadow:0 10px 30px #14264a12}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.card{border:1px solid #e1e6ef;border-radius:17px;padding:14px;background:#fff}.source{background:#f7f9fd;border-right:4px solid #2563eb}.fr{direction:ltr;text-align:center;font-weight:900;font-size:20px}.ar{text-align:center;color:#315aa4;font-weight:800;margin-top:5px}.letter{font-size:34px;text-align:center;font-weight:1000;direction:ltr}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:900;cursor:pointer;margin:5px 3px 0 0}.primary{background:#2563eb;color:#fff}.secondary{background:#edf3ff;color:#173a82}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}.option{padding:11px;border:1px solid #dbe1eb;border-radius:11px;background:#fff;font-weight:800;cursor:pointer}.correct{background:#ecfdf3!important;border-color:#20a45a}.wrong{background:#fff2f8!important;border-color:#e92d83}.note{background:#fff7fb;border-right:4px solid #e92d83;border-radius:14px;padding:14px;line-height:1.9}.progressbox{margin-top:12px;background:#fff;padding:15px}.barbg{height:10px;background:#e7ecf5;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:#2563eb}.small{font-size:13px;color:#718096}@media(max-width:650px){.wrap{padding:8px}.top{border-radius:14px}.panel{padding:14px}}
</style></head><body><div class="wrap"><header class="top"><b>🇫🇷 HM Academy · الصف الأول الإعدادي</b><a href="grade-7.html">المرحلة</a></header><section class="hero"><h1 id="title">Learning Studio</h1><p>رحلة تعلم Source-Grounded مع إثراء تربوي من HM Academy</p><div class="chips"><span>🚀 البداية</span><span>🖼️ المفردات</span><span>🎧 النطق</span><span>📘 القواعد</span><span>💬 المحادثة</span><span>✍️ التدريب</span><span>🎬 الفيديو</span><span>🎮 الألعاب</span><span>🧠 Smart Review</span><span>🏆 التقييم</span><span>📈 التقدم</span></div></section><nav class="nav" id="nav"></nav><main class="panel" id="panel"></main><section class="progressbox"><b>📈 تقدم الدرس</b><div class="small" id="status">التقدم محفوظ على هذا الجهاز.</div><div class="barbg"><div class="bar" id="bar"></div></div><button class="btn primary" onclick="completeLesson()">إكمال الدرس</button></section></div><script>const p=new URLSearchParams(location.search),id=p.get('id')||'grade7-u1-l1',sec=p.get('section')||'introduction';const nav=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];let d=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.84;speechSynthesis.speak(u)}function go(s){location.href='grade7-lesson-studio-source.html?id='+encodeURIComponent(id)+'&section='+s}function key(){return'hm-grade7-progress-'+id}function completeLesson(){localStorage.setItem(key(),'1');updateProgress()}function updateProgress(){const ok=localStorage.getItem(key())==='1';document.getElementById('status').textContent=ok?'✅ تم إكمال الدرس على هذا الجهاز.':'التقدم محفوظ على هذا الجهاز.';document.getElementById('bar').style.width=ok?'100%':'0%'}function sourceSections(){return d.sourceSections||[]}function words(){const out=[];sourceSections().forEach(s=>(s.items||[]).forEach(x=>out.push({fr:x[0],ar:x[1],example:x[2]||''})));return out}function renderNav(){document.getElementById('nav').innerHTML=nav.map(x=>`<button class="${x[0]===sec?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}function intro(){return `<h2>🚀 البداية</h2><div class="note"><b>🎯 هدف الدرس:</b><br>التعرف على الأبجدية الفرنسية، الحروف المتحركة، وقراءة الكلمات الشفافة تدريجيًا.</div><div class="cards">${sourceSections().map(s=>`<article class="card source"><b>${esc(s.title)}</b><p class="small">محور أصلي من الدرس ${d.sourceLesson}، محفوظ داخل رحلة HM Academy.</p></article>`).join('')}</div><h3>كيف تتعلم؟</h3><p>ابدأ بالمفردات والنطق، ثم استخدم الإثراء في القواعد والمحادثة، وبعدها التدريب والألعاب والتقييم.</p>`}function vocabulary(){const ws=words();return `<h2>🖼️ المفردات</h2><p>كل الكلمات المسجلة في مصدر الدرس محفوظة هنا، مع نطق فرنسي وتفاعل سريع.</p><div class="cards">${ws.map(w=>`<article class="card"><div class="fr">${esc(w.fr)}</div><div class="ar">${esc(w.ar)}</div>${w.example?`<div class="small">${esc(w.example)}</div>`:''}<button class="btn primary" onclick='speak(${JSON.stringify(w.fr)})'>🔊 استمع</button></article>`).join('')}</div>`}function pronunciation(){const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');const ws=words();return `<h2>🎧 النطق</h2><div class="note">استمع ثم كرر. الهدف هنا تثبيت العلاقة بين شكل الحرف/الكلمة وصوتها دون تغيير محتوى المنهج.</div><h3>الأبجدية الفرنسية</h3><div class="cards">${letters.map(x=>`<button class="card letter" onclick='speak(${JSON.stringify(x)})'>${x}<br><span class="small">🔊</span></button>`).join('')}</div><h3>مفردات الدرس</h3><div class="cards">${ws.map(w=>`<article class="card"><div class="fr">${esc(w.fr)}</div><button class="btn primary" onclick='speak(${JSON.stringify(w.fr)})'>🔊 استمع</button></article>`).join('')}</div>`}function grammar(){return `<h2>📘 القواعد</h2><div class="note"><b>إثراء HM Academy:</b> لا يوجد في المصدر درس قواعد مستقل لهذا الدرس؛ لذلك لا نقدّم «قاعدة رسمية» من عندنا. نستخدم ملاحظات لغوية خفيفة مرتبطة بما يراه الطالب في الكلمات مثل أدوات التعريف <span dir="ltr">Un / Une</span>، مع التأكيد أنها تمهيد وليست درس قواعد مستقلًا.</div><div class="cards"><article class="card"><b>🔎 لاحظ</b><p dir="ltr">Un pyjama · Un taxi · Une caméra · Une guitare</p><p>راقب الفرق بين <b>Un</b> و<b>Une</b> أثناء حفظ الكلمة كاملة.</p></article><article class="card"><b>🧠 استراتيجية</b><p>لا تحفظ الاسم منفصلًا عن أداته. احفظ: <b dir="ltr">Une caméra</b> وليس <b dir="ltr">caméra</b> فقط.</p></article></div>`}function conversation(){const ws=words().slice(0,4);return `<h2>💬 المحادثة</h2><div class="note"><b>إثراء HM Academy:</b> لا يوجد حوار مستقل في المصدر. لذلك صُممت مواقف قصيرة جدًا باستخدام مفردات الدرس، وهي <b>إثراء وليست نصًا أصليًا</b>.</div><div class="card"><div class="source"><b>الموقف:</b> زميلك يريد معرفة ما الذي تراه أو تعرفه من كلمات فرنسية.</div>${ws.map((w,i)=>`<div class="card"><b>${i%2?'🧑‍🎓 الطالب':'👩‍🏫 المحاور'}:</b> ${i%2?'Oui, je connais ce mot.':'Regarde : '+esc(w.fr)+'.'}<br><button class="btn secondary" onclick='speak(${JSON.stringify(i%2?'Oui, je connais ce mot.':'Regarde : '+w.fr+'.')})'>🔊 استمع</button></div>`).join('')}<p><b>🎭 Role Play:</b> اقرأ دور المحاور أولًا، ثم بدّل الدور.</p></div>`}function practice(){const qs=[['ما الحرف الذي تبدأ به éléphant؟',['A','E','O'],'E'],['اختر الكلمة الشفافة لـ تليفون',['Un taxi','Un téléphone','Un piano'],'Un téléphone'],['ما معنى Un autobus؟',['أوتوبيس','تاكسي','دراجة'],'أوتوبيس'],['أي حرف يُنطق /igʁɛk/؟',['W','Y','H'],'Y'],['اختر الكلمة الشفافة لـ جيتار',['Une radio','Une guitare','Un vase'],'Une guitare']];return `<h2>✍️ التدريب</h2>${qs.map((q,i)=>`<article class="card"><b>${i+1}. ${esc(q[0])}</b><div class="options">${q[1].map(o=>`<button class="option" onclick="answer(this,${JSON.stringify(o===q[2])})">${esc(o)}</button>`).join('')}</div></article>`).join('')}`}function answer(b,ok){b.classList.remove('correct','wrong');b.classList.add(ok?'correct':'wrong');if(ok)b.parentElement.querySelectorAll('.option').forEach(x=>{if(x!==b)x.disabled=true})}function video(){return `<h2>🎬 الفيديو</h2><div class="note">🎥 الفيديو التكميلي جزء من المصدر الأصلي. لن يتم إنشاء رابط أو فيديو بديل غير موثق. عند توفر الـasset الرسمي في مسار الإنتاج، يظهر هنا داخل نفس رحلة الدرس.</div>`}function games(){const letters=['A','E','I','O','U','Y'];return `<h2>🎮 الألعاب</h2><div class="note">تحدي الحروف: اضغط على الحروف المتحركة بالترتيب.</div><div class="options">${letters.map(x=>`<button class="option" onclick="gamePick(this,'${x}')">${x}</button>`).join('')}</div><p id="gameMsg" class="small"></p>`}let gi=0;function gamePick(b,x){const seq=['A','E','I','O','U','Y'];if(x===seq[gi]){b.classList.add('correct');gi++;document.getElementById('gameMsg').textContent=gi===seq.length?'🏆 أحسنت! أكملت التحدي.':'صحيح — أكمل.'}else{b.classList.add('wrong');document.getElementById('gameMsg').textContent='🔁 حاول مرة أخرى.'}}function smart(){return `<h2>🧠 المراجعة الذكية</h2><div class="note">المراجعة الذكية في HM Academy ليست صفحة ثابتة: تعيد الطالب إلى العناصر التي تحتاج ممارسة، ثم تقوده للتقييم.</div><button class="btn primary" onclick="go('vocabulary')">راجع المفردات</button><button class="btn secondary" onclick="go('pronunciation')">راجع النطق</button><button class="btn secondary" onclick="go('practice')">تدرب</button>`}function assessment(){return `<h2>🏆 التقييم</h2><div class="note">التقييم الرسمي محفوظ في ملفات المصدر. هذه الشاشة لا تستبدله ولا تعيد احتساب درجاته من تلقاء نفسها.</div><div class="card"><b>التقييم الرسمي:</b> 20 نقطة حسب المصدر، ويشمل 8 أنواع من التمارين.</div><button class="btn primary" onclick="completeLesson()">تأكيد إتمام التقييم</button>`}function progress(){return `<h2>📈 التقدم</h2><div class="card">الدرس: <b>${esc(d.id)}</b><br>المهارات: Vocabulary · Pronunciation · Reading · Practice<br>حالة الإكمال: <b>${localStorage.getItem(key())==='1'?'مكتمل':'قيد التعلم'}</b></div>`}const views={introduction:intro,vocabulary,pronunciation,grammar,conversation,practice,video,games,'smart-review':smart,assessment,progress};fetch('data/lessons/grade-7/unit-1/lesson-1.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{d=x;document.getElementById('title').textContent=d.titleAr+' · '+d.titleFr;renderNav();document.getElementById('panel').innerHTML=(views[sec]||intro)();updateProgress()}).catch(()=>{document.getElementById('panel').innerHTML='<div class="card">تعذر تحميل بيانات الدرس.</div>'});</script></body></html>
