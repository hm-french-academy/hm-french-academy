 if(/tête|head/.test(t)){x=100;y=29;r=25}
 else if(/cou|neck/.test(t)){x=100;y=66;r=13}

 const body='<circle cx="100" cy="29" r="22" fill="#f1c9a2" stroke="#91694f" stroke-width="2"/>'+

 '<path d="M70 76 Q53 83 44 111 L29 163 L42 169 L61 119 L78 98Z M130 76 Q147 83 156 111 L171 163 L158 169 L139 119 L122 98Z" fill="#4f83ad" stroke="#345b7d" stroke-width="2"/>'+
 '<path d="M29 163 L22 177 L28 185 L37 180 L42 169 M171 163 L178 177 L172 185 L163 180 L158 169" fill="#efc49b" stroke="#91694f" stroke-width="2"/>'+
 '<path d="M64 164 L59 244 L83 246 L91 173Z M136 164 L141 244 L117 246 L109 173Z" fill="#46536b" stroke="#2e3c50" stroke-width="2"/>'+

 (back?'<path d="M100 83 L100 158 M72 102 Q100 115 128 102" stroke="#d5e2eb" stroke-width="3" fill="none"/>':'<path d="M100 80 L100 163" stroke="#d5e2eb" stroke-width="2" opacity=".6"/>')+

function speak(t){try{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}catch(e){}}
function quiz(arr){return '<div class="grid">'+arr.map((q,i)=>'<article class="card question"><div class="qnum">QUESTION '+(i+1)+'</div><h3>'+q[0]+'</h3>'+shuffle(q[1]).map(o=>'<button type="button" class="choice" data-ok="'+(o===q[2])+'">'+o+'</button>').join('')+'<p class="feedback"></p></article>').join('')+'</div>'}
function vocab(){const mode=(id==='g4-l04'||id==='g4-l05')?'face':'body';return '<div class="vocab-grid">'+D.vocab.map(v=>'<article class="vocab-card"><div class="visual">'+partVisual(v[1],mode)+'</div><div class="fr">'+v[1]+'</div><div class="ar">'+v[2]+'</div><span class="article-chip">'+v[3]+'</span><p class="hint">'+v[4]+'</p><button type="button" class="btn light" data-say="'+v[1]+'">🔊 استمع</button></article>').join('')+'</div>'}
function understand(){const mode=(id==='g4-l04'||id==='g4-l05')?'face':'body';return '<div class="grid">'+D.understand.map(x=>'<article class="card"><div class="visual">'+partVisual(x[0],mode)+'</div><div class="fr">'+x[0]+'</div><p>'+x[1]+'</p><button class="btn light" data-say="'+x[0]+'">🔊 استمع إلى الجملة</button></article>').join('')+'</div>'}
function render(s){
 nav.querySelectorAll('.step').forEach(b=>b.classList.toggle('active',b.dataset.s===s));
 let h='';
 if(s==='start')h=head('01','ابدأ رحلتك التعليمية','رحلة متكاملة مصممة للدرس الحالي. انتقل بين المحطات بالترتيب أو اختر أي محطة من الشريط.')+'<div class="grid"><article class="card"><div class="visual"><div class="emoji">'+(id==='g4-l04'?'🙂':id==='g4-l07'?'💪':'👀')+'</div></div><h3>🎯 هدف الدرس</h3><p>'+D.focus+'</p><button class="btn" data-go="vocab">ابدأ بالمفردات ←</button></article><article class="card"><h3>🧭 مسار التعلم</h3><p>المفردات ← الفهم ← القاعدة ← التفاعل ← المحادثة ← النطق ← التدريب ← الشرح البصري ← الفيديو ← الألعاب ← التقييم ← المراجعة.</p><span class="pill">14 محطة تعليمية</span></article></div>';
 if(s==='vocab')h=head('02','المفردات الأساسية','تعرّف على الكلمات مع معناها وأمثلة صحيحة، واستمع إلى النطق الفرنسي.')+vocab();
 if(s==='understand')h=head('03','افهم داخل السياق','اقرأ الجمل ولاحظ كيف تُستخدم الكلمات في مواقف حقيقية، وليس كقائمة حفظ فقط.')+understand();
 if(s==='rules')h=head('04',id==='g4-l04'?'القاعدة: أدوات التعريف':'القاعدة: صفات الملكية','افهم وظيفة كل أداة، ثم لاحظ الأمثلة قبل الانتقال إلى التطبيق.')+'<div class="grammar-grid">'+D.rules.map(r=>'<article class="grammar-card"><div class="grammar-word">'+r[0]+'</div><h3>'+r[1]+'</h3><p class="fr">'+r[2]+'</p></article>').join('')+'</div><div class="rule-note">'+(id==='g4-l04'?'<b>تذكّر:</b> احفظ الاسم مع أداته. نقول <b>le nez</b> و<b>la bouche</b> و<b>les yeux</b>.':'<b>قاعدة مهمة:</b> صفة الملكية تتبع جنس وعدد الاسم المملوك، لا جنس الشخص المالك. وقبل الاسم المؤنث المفرد الذي يبدأ بصوت متحرك نستخدم mon / ton / son: <b>mon oreille</b> و<b>mon épaule</b>.')+'</div>';
 if(s==='interact')h=head('05','تفاعل وتحقق من الفهم','أسئلة قصيرة لقياس الفهم الأولي. هذه المجموعة مستقلة عن التدريب والتقييم والمراجعة.')+quiz(D.interact);
 if(s==='talk')h=head('06','المحادثة','اقرأ السؤال ثم استمع إلى الإجابة ورددها بصوت واضح.')+'<div class="card">'+D.dialogue.map(x=>'<div class="example"><b>'+x[0]+'</b><div class="fr">'+x[1]+'</div><button class="btn light" data-say="'+x[1]+'">🔊 استمع للإجابة</button></div>').join('')+'</div>';
 if(s==='listen')h=head('07','اسمع وانطق','استمع إلى مفردات الدرس منفردة. حاول تكرار كل كلمة قبل الانتقال إلى التالية.')+'<div class="listen-list">'+D.vocab.map(v=>'<div class="listen-row"><span class="fr">'+v[1]+'</span><span>'+v[2]+'</span><button class="btn light" data-say="'+v[1]+'">🔊</button></div>').join('')+'</div>';
 if(s==='practice')h=head('08','التدريب','تطبيق مستقل يركز على الاستخدام الصحيح وبناء الجملة. الأسئلة هنا لا تتكرر في التفاعل أو التقييم أو المراجعة.')+quiz(D.practice);
 if(s==='media')h=head('09','شرح بصري','قارن بين المجموعات التالية لتلاحظ الفروق الأساسية في الدرس.')+(id==='g4-l04'?'<div class="grammar-grid"><article class="grammar-card"><div class="grammar-word">LE</div><h3>مفرد مذكر</h3><p class="fr">le front · le nez · le menton</p></article><article class="grammar-card"><div class="grammar-word">LA</div><h3>مفرد مؤنث</h3><p class="fr">la bouche</p></article><article class="grammar-card"><div class="grammar-word">LES</div><h3>جمع</h3><p class="fr">les yeux · les oreilles · les dents</p></article></div><div class="rule-note">لاحظ أن بعض الأسماء لها صيغة جمع غير متوقعة: <b>un œil → les yeux</b>.</div>':'<div class="grammar-grid"><article class="grammar-card"><div class="grammar-word">MON</div><h3>مفرد مذكر</h3><p class="fr">mon bras · mon cou · mon dos</p></article><article class="grammar-card"><div class="grammar-word">MA</div><h3>مفرد مؤنث</h3><p class="fr">ma tête · ma main · ma jambe</p></article><article class="grammar-card"><div class="grammar-word">MES</div><h3>جمع</h3><p class="fr">mes bras · mes doigts · mes pieds</p></article></div><div class="rule-note">نفس التقسيم مع المخاطب: <b>ton / ta / tes</b>، ومع الغائب: <b>son / sa / ses</b>. ومع الاسم المؤنث الذي يبدأ بصوت متحرك: <b>mon épaule</b>.</div>');
 if(s==='video')h=head('10','فيديو الدرس','شاهد الفيديو ثم حاول استخراج الكلمات أو التراكيب التي تعلمتها. يمكنك فتحه على YouTube إذا لم يعمل المشغل داخل الصفحة.')+'<article class="card"><div class="visual"><div class="emoji">🎬</div><h3>'+D.videoTitle+'</h3><p>استمع جيدًا وكرر الكلمات الفرنسية بصوت واضح.</p><div class="video-frame"><iframe src="https://www.youtube-nocookie.com/embed/'+D.video+'?rel=0" title="'+D.videoTitle+'" loading="lazy" allow="accelerometer; autoplay; encrypted-media; picture-in-picture; web-share" allowfullscreen></iframe></div><p><a class="btn" href="https://www.youtube.com/watch?v='+D.video+'" target="_blank" rel="noopener noreferrer">▶ فتح الفيديو على YouTube</a></p></div></article><div class="task"><b>🎯 مهمة المشاهدة</b><p>'+(id==='g4-l04'?'اذكر خمسة أجزاء من الوجه سمعتها في الفيديو، وحدد أداة التعريف مع كل اسم.':id==='g4-l07'?'استخرج ثلاث عبارات لصفات الملكية مع أجزاء الجسم، ثم كوّن جملة جديدة.':'استخرج ثلاث عبارات لصفات الملكية من الفيديو أو كوّن ثلاث عبارات من مفردات الدرس.')+'</p></div>';
 if(s==='games')h=head('11','مركز الألعاب','اختر تحديًا تفاعليًا قصيرًا. يتم خلط الكلمات والاختيارات في كل محاولة.')+'<div class="game-menu"><button class="btn" data-game="match">🧩 اختر المعنى</button><button class="btn" data-game="article">🎯 اختر الأداة</button><button class="btn" data-game="recall">⚡ تحدي السرعة</button></div><div id="gamePanel" class="game-panel"><p>اختر لعبة للبدء.</p></div>';
 if(s==='assessment')h=head('12','التقييم النهائي','اختبار مستقل عن الأنشطة السابقة لقياس مدى إتقانك للدرس.')+quiz(D.assessment);
 if(s==='review')h=head('13','المراجعة الذكية','مراجعة تشخيصية أخيرة بأسئلة جديدة. راجع القاعدة إذا وجدت صعوبة في الإجابة.')+quiz(D.review);
 if(s==='after')h=head('14','بعد الرحلة','تحقق من قدرتك على استخدام ما تعلمته خارج الأسئلة المباشرة.')+'<div class="grid"><article class="card"><h3>🧠 استرجع دون مساعدة</h3><p>'+(id==='g4-l04'?'اذكر ستة أجزاء من الوجه بالفرنسية، مع أداة التعريف.':id==='g4-l07'?'قل mon / ma / mes مع ثلاثة أسماء مختلفة من أجزاء الجسم.':'قل mon / ma / mes مع ثلاثة أسماء مختلفة من أجزاء الوجه.')+'</p></article><article class="card"><h3>✍️ مهمة إنتاج</h3><p>'+(id==='g4-l04'?'اكتب ثلاث جمل: أرى بعينيّ، أتنفس بأنفي، أتحدث بفمي.':id==='g4-l07'?'اكتب أربع جمل تصف حركات أجزاء الجسم باستخدام صفات الملكية.':'اكتب أربع جمل تصف وجهك باستخدام mon وma وmes.')+'</p></article><article class="card"><h3>✅ تحقق من إتقانك</h3><p>هل تستطيع فهم الكلمات ونطقها واستخدامها في جملة دون مساعدة؟</p><button class="btn" data-go="assessment">إعادة التقييم ←</button></article></div>';
 page.innerHTML=h;
 page.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.go)));
 page.querySelectorAll('[data-say]').forEach(b=>b.addEventListener('click',()=>speak(b.dataset.say)));
 page.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{const c=b.closest('.question');if(c.dataset.done)return;c.dataset.done='1';const ok=b.dataset.ok==='true';c.querySelectorAll('.choice').forEach(x=>{x.disabled=true;if(x.dataset.ok==='true')x.classList.add('correct')});if(!ok)b.classList.add('wrong');c.querySelector('.feedback').textContent=ok?'✅ إجابة صحيحة!':'❌ ليست الإجابة المناسبة. راجع الدرس ثم حاول مرة أخرى.'}));
 page.querySelectorAll('[data-game]').forEach(b=>b.addEventListener('click',()=>startGame(b.dataset.game)));
}
let gameRound=0,gameScore=0,gameDeck=[];
function startGame(kind){gameRound=0;gameScore=0;gameDeck=shuffle(D.gameWords);nextGame(kind)}
function nextGame(kind){
 const p=document.getElementById('gamePanel');if(!p)return;
 if(gameRound>=5){p.innerHTML='<div class="score">انتهى التحدي · نتيجتك '+gameScore+' من 5</div><button class="btn" data-restart="'+kind+'">العب مرة أخرى</button>';p.querySelector('[data-restart]').onclick=()=>startGame(kind);return}
 const word=gameDeck[gameRound%gameDeck.length],others=shuffle(gameDeck.filter(x=>x!==word)).slice(0,2),opts=shuffle([word,...others]);
 let prompt,correct=word;
 if(kind==='match'){prompt=id==='g4-l04'?'اختر العبارة الفرنسية الصحيحة للكلمة: '+(D.vocab.find(v=>v[1]===word)?.[2]||word):'اختر العبارة التي تعبّر عن: '+(D.vocab.find(v=>v[1]===word)?.[2]||word)}
 else if(kind==='article'){const v=D.vocab.find(v=>v[1]===word);prompt='ما صفة/أداة الملكية المناسبة؟ '+word;correct=v?v[3]:word}
 else{prompt='تحدي الاسترجاع: اختر الكلمة التي راجعتها للتو.'}
 const choices=kind==='article'?shuffle([correct,...(id==='g4-l04'?['le','la','les']:['mon','ma','mes','ton','ta','tes','son','sa','ses']).filter(x=>x!==correct).slice(0,2)]):opts;
 p.innerHTML='<div class="score">النقاط: '+gameScore+' · الجولة '+(gameRound+1)+' / 5</div><h3>'+prompt+'</h3>'+choices.map(x=>'<button class="choice" data-game-choice="'+x+'" data-game-ok="'+(x===correct)+'">'+x+'</button>').join('')+'<p class="feedback" id="gameFeedback"></p><button class="btn" id="gameNext" disabled>التالي ←</button>';
 p.querySelectorAll('[data-game-choice]').forEach(b=>b.onclick=()=>{if(p.dataset.answered==='1')return;p.dataset.answered='1';const ok=b.dataset.gameOk==='true';if(ok)gameScore++;p.querySelectorAll('[data-game-choice]').forEach(x=>{x.disabled=true;if(x.dataset.gameOk==='true')x.classList.add('correct')});if(!ok)b.classList.add('wrong');p.querySelector('#gameFeedback').textContent=ok?'أحسنت! إجابة صحيحة.':'الإجابة الصحيحة: '+correct;p.querySelector('#gameNext').disabled=false});
 p.querySelector('#gameNext').onclick=()=>{gameRound++;p.dataset.answered='0';nextGame(kind)};
}
nav.innerHTML=tabs.map((t,i)=>'<button type="button" class="step" data-s="'+t[0]+'">'+(i+1)+'. '+t[1]+'</button>').join('');
nav.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b)render(b.dataset.s)});
render(params.get('section')||'start');
})();
