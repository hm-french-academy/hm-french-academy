<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>HM Academy - الإشعارات</title><link rel="stylesheet" href="css/style.css?v=20260808"><style>.wrap{padding:24px}.nav{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}.nav a{padding:10px 14px;background:#f1f5f9;border-radius:12px;text-decoration:none;color:inherit}.card{background:#fff;padding:20px;border-radius:18px;box-shadow:0 5px 20px #0001;margin-bottom:12px}.empty{text-align:center;color:#666}</style></head><body><header><h2>🇫🇷 HM Academy</h2><p>مركز الإشعارات</p></header><main class="wrap"><nav class="nav"><a href="admin-center.html">مركز الإدارة</a><a href="admin-dashboard.html">لوحة الإدارة</a><a href="admin-students.html">المتعلمين</a><a href="admin-assessments.html">التقييمات</a><a href="admin-analytics.html">التحليلات</a><a href="admin-activity.html">النشاط</a><a href="admin-settings.html">الإعدادات</a></nav><h1>🔔 الإشعارات</h1><div id="notifications"></div></main><footer>HM Academy © 2026</footer><script>(async()=>{try{const d=await(await fetch('data/admin-notifications.json')).json();notifications.innerHTML=(d.notifications||[]).map(n=>`<div class="card"><h3>${n.title}</h3><p>${n.message}</p><small>${n.date}</small></div>`).join('')||'<div class="card empty">لا توجد إشعارات</div>'}catch(e){}})()</script></body></html>
