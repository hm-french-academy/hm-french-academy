<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HM Academy - ملف الطالب</title>
<link rel="stylesheet" href="css/style.css?v=20260807">
</head>
<body>
<header><h2>🇫🇷 HM Academy</h2><p>ملف الطالب الذكي</p><nav><a href="dashboard.html">لوحة الطالب</a><a href="achievements.html">الإنجازات</a><a href="course.html">المنهج</a></nav></header>
<main>
<section class="hero"><h1>👤 ملف الطالب</h1><p>الاسم: <strong>طالب HM Academy</strong></p><p>المستوى: <strong id="level">A1 Beginner</strong></p><p>XP: <strong id="xp">0</strong></p></section>
<section class="grid course-grid">
<div class="course-card"><h3>📚 المسار الحالي</h3><p>French A1</p><p>الدروس المكتملة: <strong id="lessons">0</strong></p><div class="progress-wrap"><div class="progress-bar"><div id="progress-fill"></div></div><p id="progress-text">0%</p></div></div>
<div class="course-card"><h3>🏆 الإنجازات</h3><p>الشارات: <strong id="badges">0</strong></p><a class="btn secondary" href="achievements.html">عرض الشارات</a></div>
<div class="course-card"><h3>📈 الحالة</h3><p id="status">مستمر في التعلم</p></div>
</section>
<section class="hero"><h2>🕘 آخر النشاطات</h2><div id="activity-list">لا توجد نشاطات بعد</div></section>
</main>
<script src="scripts/learning-progress.js"></script>
<script src="scripts/activity-log.js"></script>
<script>
const data=HMProgress.get();
document.getElementById('xp').textContent=data.xp||0;
document.getElementById('lessons').textContent=(data.completedLessons||[]).length;
document.getElementById('badges').textContent=(data.achievements||[]).length;
const percent=Math.min(100,Math.round(((data.completedLessons||[]).length/30)*100));
document.getElementById('progress-fill').style.width=percent+'%';
document.getElementById('progress-text').textContent=percent+'% مكتمل';
const activities=HMActivity.get();
if(activities.length){document.getElementById('activity-list').innerHTML=activities.map(a=>'<p>• '+a.title+'</p>').join('');}
</script>
<footer>HM Academy © 2026</footer>
</body>
</html>
