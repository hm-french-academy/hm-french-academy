<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>HM Academy | تحويل إلى درس الساعة</title>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var id = params.get('id') || 'g4-l03';
  if (id === 'g4-l03') {
    // Legacy student links used this retired filename. Keep every student/session
    // parameter and move the student to the real, existing lesson page.
    var target = new URL('grade-4-start-under-presentation.html', location.href);
    params.set('id', 'g4-l03');
    if (params.get('section') === 'lesson') params.set('section', 'start');
    target.search = params.toString();
    location.replace(target.href);
  } else {
    location.replace('lesson.html' + location.search);
  }
})();
</script>
</head>
<body><p>جارٍ فتح درس الساعة…</p></body>
</html>
