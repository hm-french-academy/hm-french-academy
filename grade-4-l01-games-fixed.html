<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎮 ألعاب Les saisons — الصف الرابع</title><style>body{margin:0;font-family:Arial,Cairo,sans-serif;background:linear-gradient(135deg,#eef9ff,#fff7e9,#f5f1ff);color:#17324d;padding:18px}.wrap{max-width:1050px;margin:auto}.hero,.game{background:#fff;border-radius:24px;padding:20px;box-shadow:0 14px 40px #17324d18}.hero{text-align:center;margin-bottom:14px}.hero h1{margin:6px 0;font-size:clamp(26px,6vw,42px)}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.mode{border:2px solid #e5eaf1;background:#f8fafc;border-radius:18px;padding:14px 8px;font-weight:900;cursor:pointer}.mode.active{background:#17324d;color:#fff;border-color:#17324d}.mode:focus-visible,.option:focus-visible{outline:3px solid #f2b84b;outline-offset:2px}.q{font-size:20px;font-weight:900;margin:0 0 14px}.options{display:grid;gap:10px}.option{border:2px solid #dfe6ee;background:#fff;border-radius:15px;padding:13px;text-align:right;font-size:17px;font-weight:800;cursor:pointer}.option:hover{transform:translateY(-1px)}.option.correct{background:#e9f8ed;border-color:#46a35a}.option.wrong{background:#fff0f0;border-color:#dc5a5a}.option:disabled{cursor:default}.feedback{margin-top:14px;padding:12px;border-radius:14px;font-weight:900;background:#f4f7fb}.next{border:0;background:#17324d;color:#fff;border-radius:13px;padding:12px 18px;font-weight:900;cursor:pointer;margin-top:12px}.score{text-align:center;font-weight:900;margin-bottom:14px}.small{color:#64748b}.order{display:grid;gap:9px}.order .item{border:2px solid #dfe6ee;border-radius:14px;background:#fff;padding:13px;font-weight:900;cursor:pointer}.order .item.selected{border-color:#2563eb;background:#eef5ff}.done{background:#e9f8ed;border-color:#46a35a!important}.wrong-order{background:#fff0f0;border-color:#dc5a5a!important}@media(max-width:700px){.modes{grid-template-columns:repeat(2,1fr)}body{padding:10px}}</style></head><body><main class="wrap"><section class="hero"><div>🎮 HM Game Studio · الصف الرابع الابتدائي · الدرس الأول</div><h1>Les saisons</h1><p class="small">ألعاب تفاعلية حقيقية — اختر لعبة واحدة فقط، وكل سؤال له إجابة واحدة صحيحة.</p></section><nav id="modes" class="modes" aria-label="أنواع الألعاب"></nav><section id="game" class="game"></section></main><script>(()=>{'use strict';const seasons=[{fr:'le printemps',ar:'الربيع',emoji:'🌸'},{fr:"l'été",ar:'الصيف',emoji:'☀️'},{fr:"l'automne",ar:'الخريف',emoji:'🍂'},{fr:"l'hiver",ar:'الشتاء',emoji:'❄️'}];const modes=[['race','🏁 سباق الفصول'],['who','🕵️ من أنا؟'],['order','🔢 رتب الفصول'],['choose','🎯 اختر الفصل']];let mode='race',index=0,score=0,locked=false,order=[];const modesEl=document.getElementById('modes'),game=document.getElementById('game');function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}function setMode(m){mode=m;index=0;score=0;locked=false;order=[];modesEl.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));render()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function answer(correct,button,buttons,feedback,next){if(locked)return;locked=true;buttons.forEach(b=>b.disabled=true);if(correct){button.classList.add('correct');score++;feedback.innerHTML='✅ إجابة صحيحة!';}else{button.classList.add('wrong');feedback.innerHTML='❌ ليست الإجابة الصحيحة. الإجابة: <b>'+esc(correctAnswerText)+'</b>';buttons.find(b=>b.dataset.correct==='1')?.classList.add('correct')}next.style.display='inline-block'}let correctAnswerText='';function mcq(q,opts,correct,nextLabel='السؤال التالي'){const shuffled=shuffle(opts.map((text,i)=>({text,correct:i===correct})));correctAnswerText=opts[correct];game.innerHTML='<div class="score">النتيجة: '+score+' / '+index+'</div><p class="q">'+esc(q)+'</p><div class="options" id="opts">'+shuffled.map(o=>'<button type="button" class="option" data-correct="'+(o.correct?'1':'0')+'">'+esc(o.text)+'</button>').join('')+'</div><div id="fb" class="feedback" aria-live="polite">اختر إجابتك.</div><button id="next" class="next" style="display:none">'+nextLabel+'</button>';const bs=[...document.querySelectorAll('.option')],fb=document.getElementById('fb'),n=document.getElementById('next');bs.forEach(b=>b.addEventListener('click',()=>answer(correctAnswerText,b,bs,fb,n)));n.onclick=()=>{index++;locked=false;if(index>=seasons.length)finish();else render()}}function finish(){game.innerHTML='<div style="text-align:center"><h2>🎉 أحسنت!</h2><p class="q">نتيجتك: '+score+' / '+seasons.length+'</p><button class="next" id="again">إعادة اللعبة</button></div>';document.getElementById('again').onclick=()=>{index=0;score=0;locked=false;order=[];render()}}function race(){const s=seasons[index];mcq('أي فصل هو: '+s.emoji+' '+s.ar+'؟',seasons.map(x=>x.fr),index)}function who(){const clues=[['أنا فصل تتساقط فيه الأوراق. 🍂','l\'automne'],['أنا فصل يكون فيه الجو باردًا جدًا. ❄️','l\'hiver'],['أنا فصل تزهر فيه النباتات. 🌸','le printemps'],['أنا فصل يكون فيه الجو حارًا. ☀️','l\'été']];const [q,a]=clues[index];const ci=seasons.findIndex(x=>x.fr===a);mcq(q,seasons.map(x=>x.fr),ci)}function choose(){const qs=[['Il fait chaud. ☀️','l\'été'],['Il fait froid. ❄️','l\'hiver'],['Les fleurs poussent. 🌸','le printemps'],['Les feuilles tombent. 🍂','l\'automne']];const [q,a]=qs[index];const ci=seasons.findIndex(x=>x.fr===a);mcq(q,seasons.map(x=>x.fr),ci)}function orderGame(){if(!order.length)order=shuffle(seasons);game.innerHTML='<div class="score">رتّب الفصول حسب ترتيبها الصحيح في السنة الفرنسية.</div><div class="order" id="order">'+order.map((s,i)=>'<button type="button" class="item" data-i="'+i+'">'+s.emoji+' '+s.fr+'</button>').join('')+'</div><div id="fb" class="feedback">اضغط على الفصول بالترتيب: 1 ثم 2 ثم 3 ثم 4.</div><button id="check" class="next">تحقق</button>';let picked=[];const items=[...document.querySelectorAll('.item')];items.forEach(b=>b.onclick=()=>{if(b.classList.contains('done'))return;if(b.classList.contains('selected')){b.classList.remove('selected');picked=picked.filter(x=>x!==+b.dataset.i)}else{b.classList.add('selected');picked.push(+b.dataset.i)}});document.getElementById('check').onclick=()=>{const target=[0,1,2,3].map(i=>seasons.findIndex(s=>s.fr===order[i].fr));const ok=picked.length===4&&picked.every((v,i)=>v===target[i]);const fb=document.getElementById('fb');if(ok){items.forEach(b=>b.classList.add('done'));fb.innerHTML='✅ ممتاز! الترتيب صحيح.';document.getElementById('check').style.display='none';score=4}else{items.forEach(b=>b.classList.remove('wrong-order'));picked.forEach((v,i)=>{if(v!==target[i])items.find(b=>+b.dataset.i===v)?.classList.add('wrong-order')});fb.innerHTML='❌ الترتيب غير صحيح. اضغط لإعادة المحاولة.'}}}function render(){if(mode==='order'){orderGame();return}if(index>=seasons.length){finish();return}if(mode==='race')race();else if(mode==='who')who();else choose()}modesEl.innerHTML=modes.map(([id,label])=>'<button type="button" class="mode '+(id===mode?'active':'')+'" data-mode="'+id+'">'+label+'</button>').join('');modesEl.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));setMode(mode)})()</script></body></html>
