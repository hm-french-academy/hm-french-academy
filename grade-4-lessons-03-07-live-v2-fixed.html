ath d="M66 70H94V104H66Z" fill="#f2b6a0" stroke="#2e2a25" stroke-width="3"/>'};return '<svg viewBox="0 0 160 160"><circle cx="80" cy="88" r="54" fill="#fde1d1" stroke="#2e2a25" stroke-width="3"/>'+s[k]+'</svg>'}const s={head:'<circle cx="80" cy="40" r="28" fill="#fde1d1" stroke="#2e2a25" stroke-width="3"/>',neck:'<path d="M67 60H93V88H67Z" fill="#f2b6a0" stroke="#2e2a25" stroke-width="3"/>',chest:'<path d="M48 75Q80 60 112 75L104 125Q80 137 56 125Z" fill="#f7b267" stroke="#2e2a25" stroke-width="3"/>',belly:'<ellipse cx="80" cy="120" rx="30" ry="34" fill="#f7b267" stroke="#2e2a25" stroke-width="3"/>',arm:'<path d="M55 74L34 124Q30 138 43 141Q52 142 57 129L72 91Z" fill="#fde1d1" stroke="#2e2a25" stroke-width="3"/>',hand:'<path d="M38 116Q22 111 20 123Q19 132 29 134L44 137Q52 135 50 126Q48 119 38 116Z" fill="#fde1d1" stroke="#2e2a25" stroke-width="3"/>',finger:'<path d="M48 128L28 112Q23 108 19 113Q17 118 22 122L40 140" fill="#fde1d1" stroke="#2e2a25" stroke-width="3"/>',leg:'<path d="M63 122L60 176Q60 188 71 188Q81 188 81 176L82 127Z" fill="#fde1d1" stroke="#2e2a25" stroke-width="3"/>',knee:'<circle cx="70" cy="160" r="18" fill="#f7b267" stroke="#2e2a25" stroke-width="3"/>',foot:'<path d="M62 174L84 175L94 195Q95 204 84 206H52Q45 203 51 195Z" fill="#fde1d1" stroke="#2e2a25" stroke-width="3"/>'};return '<svg viewBox="0 0 160 220"><path d="M58 72Q80 58 102 72L108 128L92 128L92 186L70 186L70 128L52 128Z" fill="#deebf5" stroke="#2e2a25" stroke-width="3"/><path d="M52 70L28 120M108 70L132 120M70 126L54 190M92 126L108 190" stroke="#2e2a25" stroke-width="9" stroke-linecap="round"/>'+s[k]+'</svg>'}let last='';setInterval(patch,300);f.addEventListener('load',()=>{patch();try{new MutationObserver(patch).observe(f.contentDocument.body,{subtree:true,childList:true})}catch(e){}})})();</script></body></html>
