<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Premium Learning Studio</title><style>:root{--b:#4a7fb0;--g:#5ea85b;--ink:#2e2a25;--soft:#5b5750;--bg:#f3f8fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Cairo,sans-serif;color:var(--ink);padding:18px}.wrap{max-width:1080px;margin:auto}.top,.hero,.page{background:#fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px #2e2a2515}.top{display:flex;justify-content:space-between}.top a{color:var(--b);font-weight:900;text-decoration:none}.hero{background:linear-gradient(135deg,#e8f7ff,#fff0f5)}.nav{display:flex;gap:7px;overflow:auto;padding:8px;position:sticky;top:0;background:#f3f8fbf5;z-index:5}.nav button,.btn,.choice{border:0;border-radius:12px;padding:10px 13px;font-weight:900;cursor:pointer}.nav button{background:#fff;white-space:nowrap}.nav button.active,.btn{background:var(--b);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{border:1px solid #dce5ee;border-radius:18px;padding:16px;background:#fff}.visual{height:170px;border-radius:16px;background:linear-gradient(135deg,#edf8ff,#fff2f6);display:grid;place-items:center}.visual svg{width:145px;height:145px}.fr{direction:ltr;text-align:left;font-size:20px;font-weight:900}.ar{color:var(--soft);font-weight:700}.choice{display:block;width:100%;background:#fff;border:2px solid #dce5ee;margin:8px 0;text-align:right}.choice.ok{background:#eaf7ee;border-color:var(--g)}.choice.no{background:#fff0f0}.feedback{min-height:22px;font-weight:900}.rule,.passage{background:#eaf1f6;border-radius:16px;padding:16px;line-height:2}.video{position:relative;aspect-ratio:16/9}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:18px}.review{border:1px solid #dce5ee;border-radius:18px;padding:16px;background:#f8fbff}.score{font-size:20px;font-weight:900;text-align:center;margin:12px}.exam{width:100%;height:700px;border:0;border-radius:18px}</style></head><body><main class="wrap"><header class="top"><a href="grade-4.html">← الصف الرابع</a><b>HM Academy · Premium Learning Studio</b></header><section class="hero"><span id="unit"></span><h1 id="title"></h1><p id="focus"></p></section><nav id="nav" class="nav"></nav><section id="page" class="page"></section></main><script>(function(){const id=new URLSearchParams(location.search).get('id')||'g4-l04';if(id==='g4-l03'){location.replace('grade-4-l03-learning-studio-v2.html'+location.search);return}const D={'g4-l04':{fr:'Mon visage',ar:'وجهي',unit:'Unité 3 · الدرس الأول',focus:'مفردات الوجه + أدوات التعريف والتنكير',kind:'face',video:'lB_mkVGT_lM',parts:[['cheveux','Les cheveux','الشعر','les'],['front','Le front','الجبهة','le'],['sourcils','Les sourcils','الحواجب','les'],['yeux','Les yeux','العينان','les'],['cils','Les cils','الرموش','les'],['oreilles','Les oreilles','الأذنان','les'],['nez','Le nez','الأنف','le'],['bouche','La bouche','الفم','la'],['dents','Les dents','الأسنان','les'],['menton','Le menton','الذقن','le']]},'g4-l05':{fr:'Les adjectifs possessifs',ar:'صفات الملكية — الوجه',unit:'Unité 3 · الدرس الثاني',focus:'صفات الملكية مع مفردات الوجه',kind:'face',video:'aH8xvSp43CM',parts:[['nez','mon nez','أنفي','mon'],['tête','ma tête','رأسي','ma'],['cils','mes cils','رموشي','mes'],['oreilles','mes oreilles','أذناي','mes'],['bouche2','ta bouche','فمك','ta'],['menton','son menton','ذقنه','son'],['bouche2','sa bouche','فمها','sa'],['dents','ses dents','أسنانها','ses']]},'g4-l06':{fr:'Le corps',ar:'جسمي',unit:'Unité 4 · الدرس الأول',focus:'مفردات الجسم + قراءة نص Samy',kind:'body',video:'KeYXG5Xq5DU',parts:[['tête','La tête','الرأس','la'],['cou','Le cou','الرقبة','le'],['poitrine','La poitrine','الصدر','la'],['ventre','Le ventre','البطن','le'],['bras','Le bras','الذراع','le'],['main','La main','اليد','la'],['doigt','Le doigt','الإصبع','le'],['jambe','La jambe','الرجل',' 0" stroke="#2e2a25" stroke-width="3"/>`,nez:`<path d="M80 65L68 105Q80 112 92 105L80 65Z" fill="#f2b6a0" stroke="#2e2a25" stroke-width="3"/><circle cx="73" cy="104" r="2"/><circle cx="87" cy="104" r="2"/>`,bouche:`<path d="M56 119Q80 105 104 119Q80 140 56 119Z" fill="#e87878" stroke="#2e2a25" stroke-width="3"/>`,dents:`<path d="M59 117Q80 106 101 117L98 130Q80 137 62 130Z" fill="#fff" stroke="#2e2a25" stroke-width="3"/><path d="M70 112v20M80 110v25M90 112v20" stroke="#d8d8d8" stroke-width="2"/>`,menton:`<path d="M57 128Q80 143 103 128Q98 151 80 153Q62 151 57 128Z" fill="#f7b267" stroke="#2e2a25" stroke-width="3"/>`};return `<svg viewBox="0 0 160 160"><circle cx="80" cy="88" r="54" fill="#fde1d1" stroke="#2e2a25" stroke-width="3"/><path d="M40 65Q80 24 120 65" fill="none" stroke="#6b4b35" stroke-width="8" stroke-linecap="round"/>${p[part]||p.front}<text x="80" y="151" text-anchor="middle" font-size="10" font-weight="700">${part}</text></svg>`}if((id==='g4-l04'||id==='g4-l06')&&kind==='body'){const p={tête:`<circle cx="80" cy="47" r="28" fill="#fde1d1" stroke="#2e2a25" stroke-width="3"/><path d="M55 42Q80 15 105 42" stroke="#6b4b35" stroke-width="8" fill="none"/>`,cou:`<path d="M68 63H92V91H68Z" fill="#f2b6a0" stroke="#2e2a25" stroke-width="3"/>`,poitrine:`<path d="M52 75Q80 60 108 75L102 115Q80 128 58 115Z" fill="#f7b267" stroke="#2e2a25" stroke-width="3"/>`,ventre:`<ellipse cx="80" cy="117" rx="29" ry="31" fill="#f7b267" stroke="#2e2a25" stroke-width="3"/>`,bras:`<path d="M56 75L36 124Q32 137 43 141Q51 142 56 130L72 91Z" fill="#fde1d1" stroke="#2e2a25" stroke-width="3"/>`,main:`<path d="M35 116Q23 111 20 121Q18 129 26 132L40 136Q48 136 50 128Q48 119 35 116Z" fill="#fde1d1" stroke="#2e2a25" stroke-width="3"/>`,doigt:`<path d="M48 126L30 111Q24 106 20 111Q17 116 22 120L40 138" fill="#fde1d1" stroke="#2e2a25" stroke-width="3"/><path d="M29 111L25 100" stroke="#fde1d1" stroke-width="8" stroke-linecap="round"/>`,jambe:`<path d="M63 118L60 174Q60 187 71 187Q80 187 81 175L82 125Z" fill="#fde1d1" stroke="#2e2a25" stroke-width="3"/>`,genou:`<circle cx="70" cy="158" r="17" fill="#f7b267" stroke="#2e2a25" stroke-width="3"/>`,pied:`<path d="M62 171L84 173L92 194Q93 203 83 205H52Q45 202 51 194Z" fill="#fde1d1" stroke="#2e2a25" stroke-width="3"/>`};return `<svg viewBox="0 0 160 220"><path d="M58 72Q80 58 102 72L108 124L94 130L94 177L72 177L72 130L52 124Z" fill="#deebf5" stroke="#2e2a25" stroke-width="3"/>${p[part]||p.tête}<text x="80" y="215" text-anchor="middle" font-size="10" font-weight="700">${part}</text></svg>`}const pos={tête:[80,30],cou:[80,52],poitrine:[80,78],ventre:[80,104],bras:[48,76],main:[34,115],doigt:[27,127],jambe:[62,147],genou:[62,163],pied:[58,190],doigts:[27,127],pieds:[58,190]};const q=pos[part]||pos.tête;return `<svg viewBox="0 0 160 220"><circle cx="80" cy="32" r="21" fill="#fde1d1" stroke="#2e2a25" stroke-width="3"/><path d="M60 58Q80 48 100 58L108 128L92 128L92 185L70 185L70 128L52 128Z" fill="#deebf5" stroke="#2e2a25" stroke-width="3"/><path d="M52 68L28 120M108 68L132 120M70 126L54 190M92 126L108 190" stroke="#2e2a25" stroke-width="9" stroke-linecap="round"/><circle cx="${q[0]}" cy="${q[1]}" r="14" fill="#c96a2e"/><text x="80" y="213" text-anchor="middle" font-size="10" font-weight="700">${part}</text></svg>`}function speak(t){if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}}function vocab(){return `<h2>المفردات</h2><p>كل مفردة لها صورة توضيحية مستقلة تعبّر عن الجزء المقصود، وليست أيقونة عامة.</p><div class="grid">${D.parts.map(x=>`<article class="card"><div class="visual">${svg(x[0],D.kind)}</div><div class="fr">${x[1]}</div><div class="ar">${x[2]}</div><span>${x[3]}</span><br><button class="btn" data-s="${x[1]}">🔊 اسمع</button></article>`).join('')}</div>`}function quiz(){const qs=D.parts.slice(0,8).map((x,i)=>['ما الجزء الموضح في الصورة؟',x[1],D.parts[(i+1)%D.parts.length][1],D.parts[(i+2)%D.parts.length][1]]);return `<h2>المراجعة الذكية</h2><div class="grid">${qs.map((q,i)=>`<article class="review"><div class="visual">${svg(D.parts[i][0],D.kind)}</div><h3>${q[0]}</h3>${[q[1],q[2],q[3]].map(o=>`<button class="choice" data-ok="${o===q[1]}">${o}</button>`).join('')}<p class="feedback"></p></article>`).join('')}</div>`}function bind(){page.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>speak(b.dataset.s));page.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('.choice').forEach(x=>x.disabled=true);b.classList.add(b.dataset.ok==='true'?'ok':'no');b.parentElement.querySelector('.feedback').textContent=b.dataset.ok==='true'?'✅ صحيح':'❌ الإجابة الصحيحة موضحة بالاختيار الصحيح'})}function render(s){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.s===s));let h='';if(s==='start')h=`<h2>ابدأ الرحلة</h2><div class="rule">${D.focus}</div>`;if(s==='vocab')h=vocab();if(s==='under')h=vocab();if(s==='rules')h=`<h2>القاعدة</h2><div class="rule">راجع أدوات التعريف أو صفات الملكية باستخدام مفردات الدرس الأصلية.</div>`;if(s==='interact'||s==='practice')h=quiz();if(s==='talk')h=`<h2>المحادثة</h2><div class="grid">${D.parts.slice(0,5).map(x=>`<article class="card"><div class="fr">Qu'est-ce que c'est ?</div><p>${x[1]}</p><button class="btn" data-s="${x[1]}">🔊 استمع</button></article>`).join('')}</div>`;if(s==='media')h=`<h2>الفيديو</h2><div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${D.video}?rel=0&modestbranding=1" allowfullscreen></iframe></div>`;if(s==='review')h=quiz();if(s==='after')h=`<h2>بعد الرحلة</h2><div class="rule">أحسنت! أكملت رحلة الدرس وراجعت مفرداته بصريًا وتفاعليًا.</div>`;page.innerHTML=h;bind()}nav.onclick=e=>{const b=e.target.closest('button');if(b)render(b.dataset.s)};render(new URLSearchParams(location.search).get('section')||'start')})();</script></body></html>
