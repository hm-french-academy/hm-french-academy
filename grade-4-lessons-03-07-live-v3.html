:900;text-align:center;margin:12px}.exam{width:100%;height:700px;border:0;border-radius:18px}</style></head><body><main class="wrap"><header class="top"><a href="grade-4.html">← الصف الرابع</a><b>HM Academy · Premium Learning Studio</b></header><section class="hero"><span id="unit"></span><h1 id="title"></h1><p id="focus"></p></section><nav id="nav" class="nav"></nav><section id="page" class="page"></section></main><script>(function(){const id=new URLSearchParams(location.search).get('id')||'g4-l04';if(id==='g4-l03'){location.replace('grade-4-l03-learning-studio-v2.html'+location.search);return}const D={

47],genou:[62,163],pied:[58,190],doigts:[27,127],pieds:[58,190]};const q=pos[part]||pos.tête;return `<svg viewBox="0 0 160 220"><circle cx="80" cy="32" r="21" fill="#fde1d1" stroke="#2e2a25" stroke-width="3"/><path d="M60 58 Q80 48 100 58 L108 128 L92 128 L92 185 L70 185 L70 128 L52 128 Z" fill="#deebf5" stroke="#2e2a25" stroke-width="3"/><path d="M52 68 L28 120 M108 68 L132 120 M70 126 L54 190 M92 126 L108 190" stroke="#2e2a25" stroke-width="9" stroke-linecap="round"/><circle cx="${q[0]}" cy="${q[1]}" r="14" fill="#c96a2e"/><text x="80" y="213" text-anchor="middle" font-size="10" font-weight="700">${part}</text></svg>`}function speak(t){if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}}function vocab(){return `<h2>المفردات</h2><p>كل مفردة لها صورة توضيحية مستقلة تعبّر عن الجزء المقصود، وليست أيقونة عامة.</p><div class="grid">${D.parts.map(x=>`<article class="card"><div class="visual">${svg(x[0],D.kind)}</div><div class="fr">${x[1]}</div><div class="ar">${x[2]}</div><span>${x[3]}</span><br><button class="btn" data-s="${x[1]}">🔊 اسمع</button></article>`).join('')}</div>`}function quiz(){const qs=D.parts.slice(0,8).map((x,i)=>[D.kind==='face'?'ما الجزء الموضح في الصورة؟':'ما الجزء الموضح في الصورة؟',x[1],D.parts[(i+1)%D.parts.length][1],D.parts[(i+2)%D.parts.length][1]]);return `<h2>المراجعة الذكية</h2><div class="grid">${qs.map((q,i)=>`<article class="review"><div class="visual">${svg(D.parts[i][0],D.kind)}</div><h3>${q[0]}</h3>${[q[1],q[2],q[3]].map(o=>`<button class="choice" data-ok="${o===q[1]}">${o}</button>`).join('')}<p class="feedback"></p></article>`).join('')}</div>`}function bind(){page.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>speak(b.dataset.s));page.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('.choice').forEach(x=>x.disabled=true);b.classList.add(b.dataset.ok==='true'?'ok':'no');b.parentElement.querySelector('.feedback').textContent=b.dataset.ok==='true'?'✅ صحيح':'❌ الإجابة الصحيحة موضحة بالاختيار الصحيح'})}function render(s){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.s===s));let h='';if(s==='start')h=`<h2>ابدأ الرحلة</h2><div class="rule">${D.focus}</div>`;if(s==='vocab')h=vocab();if(s==='under')h=vocab();if(s==='rules')h=`<h2>القاعدة</h2><div class="rule">راجع أدوات التعريف أو صفات الملكية باستخدام مفردات الدرس الأصلية.</div>`;if(s==='interact'||s==='practice')h=quiz();if(s==='talk')h=`<h2>المحادثة</h2><div class="grid">${D.parts.slice(0,5).map(x=>`<article class="card"><div class="fr">Qu'est-ce que c'est ?</div><p>${x[1]}</p><button class="btn" data-s="${x[1]}">🔊 استمع</button></article>`).join('')}</div>`;if(s==='media')h=`<h2>الفيديو</h2><div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${D.video}?rel=0&modestbranding=1" allowfullscreen></iframe></div>`;if(s==='review')h=quiz();if(s==='after')h=`<h2>بعد الرحلة</h2><div class="rule">أحسنت! أكملت رحلة الدرس وراجعت مفرداته بصريًا وتفاعليًا.</div>`;page.innerHTML=h;bind()}nav.onclick=e=>{const b=e.target.closest('button');if(b)render(b.dataset.s)};render(new URLSearchParams(location.search).get('section')||'start')})();</script></body></html>
