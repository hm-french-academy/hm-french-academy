<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Leçon 1 Preview QA</title><link rel="stylesheet" href="css/premium-shell.css"></head><body><main class="hm-page"><section class="hm-card"><h1>🧪 Leçon 1 — Preview QA</h1><p>هذه الصفحة مخصصة لمعاينة الدرس الأول فقط قبل تعميم القالب.</p><div id="summary">جاري الفحص…</div><ul id="checks"></ul><p id="result"></p><hr><section id="student-result"><h2>📊 حالة الطالب</h2><p>لم يتم إنهاء الاختبار أو التقييم بعد.</p></section><hr><section><h2>🔄 اختبار الرحلة الكاملة</h2><ul id="e2e-status"></ul></section></section></main><script src="scripts/beta-checklist.js"></script><script src="scripts/beta-flow-runner.js"></script><script src="scripts/student-progress-summary.js"></script><script src="scripts/lesson1-preview-result-panel.js"></script><script src="scripts/lesson1-end-to-end-preview.js"></script><script>const lesson='data/lessons/grade-8/unit-1/lesson-1.json';const checks=document.getElementById('checks');const summary=document.getElementById('summary');const result=document.getElementById('result');const e2e=document.getElementById('e2e-status');const required=['lesson-1-interactive.html','reference_lecon1_unite1.html','formal_assessment_lecon1_unite1.html','interactive_assessment_lecon1_unite1.html','memory_game_lecon1_unite1.html','drag_drop_lecon1_unite1.html','pronunciation_challenge_lecon1_unite1.html','vocabulary_challenge_lecon1_unite1.html'];async function check(path,label){try{const r=await fetch('data/lessons/grade-8/unit-1/'+path,{method:'HEAD',cache:'no-store'});return {label,ok:r.ok}}catch(e){return {label,ok:false}}}async function run(){try{const r=await fetch(lesson,{cache:'no-store'});if(!r.ok)throw Error('lesson json');const d=await r.json();summary.textContent='بيانات الدرس محملة: '+d.title;const rows=await Promise.all(required.map(x=>check(x,x)));rows.forEach(x=>{const li=document.createElement('li');li.textContent=(x.ok?'✅ ':'❌ ')+x.label;checks.appendChild(li)});const all=rows.every(x=>x.ok);result.textContent=all?'🎉 البنية المرجعية للدرس الأول جاهزة للمعاينة.':'⚠️ توجد ملفات تحتاج مراجعة قبل الاعتماد.';if(window.HMLecon1PreviewResultPanel)HMLecon1PreviewResultPanel.render('#student-result');if(window.HMLesson1E2E)HMLesson1E2E.report().forEach(x=>{const li=document.createElement('li');li.textContent=(x.done?'✅ ':'⬜ ')+x.step;e2e.appendChild(li)})}catch(e){summary.textContent='❌ تعذر تحميل بيانات الدرس.';result.textContent='راجع مسار JSON والملفات المرتبطة.'}}run();</script></body></html>
