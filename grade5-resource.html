<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | موارد الدرس</title><link rel="stylesheet" href="css/grade5-lesson.css?build=20260819-41"><style>.resource{max-width:980px;margin:auto;padding:20px}.resource-hero{background:linear-gradient(135deg,#152a55,#7041e8 55%,#2563eb);color:#fff;border-radius:24px;padding:22px}.resource-card{background:#191b1f;border:1px solid #2b3444;border-radius:20px;padding:20px;margin-top:16px;color:#eee;line-height:1.9}.resource-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.resource-actions a,.resource-actions button{border:0;border-radius:12px;padding:11px 15px;background:#d51b78;color:#fff;text-decoration:none;font-weight:900;cursor:pointer}.paper{white-space:pre-wrap;font-family:Arial,"Noto Sans Arabic",sans-serif}@media print{body{background:#fff!important}.top,.resource-actions,.resource-hero p{display:none!important}.resource{max-width:none;padding:0}.resource-card{border:0;color:#111;background:#fff}}
</style></head><body><header class="top"><a class="brand" href="grade-5.html">🇫🇷 HM Academy</a></header><main class="resource"><section class="resource-hero"><div>HM Academy · 5e année</div><h1 id="title">موارد الدرس</h1><p>موارد مرتبطة بالدرس ومهيأة للقراءة والطباعة.</p><div class="resource-actions"><button onclick="window.print()">🖨️ طباعة / حفظ PDF</button><a id="back" href="#">← العودة إلى الدرس</a></div></section><section class="resource-card"><h2 id="heading">جارٍ تحميل المورد…</h2><div id="body" class="paper"></div></section></main><script>const p=new URLSearchParams(location.search),id=p.get('lesson')||'g5-t1-l01',type=p.get('type')||'printable';let D=null;const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function items(){const a=[],pr=D.practice||[],v=D.vocabulary||[],g=D.grammar||{};pr.forEach(x=>a.push({...x}));v.forEach(x=>{const m=x.meaning||x.translation;if(m)a.push({q:`ما المعنى الصحيح لـ «${x.word}»؟`,answer:m,options:[m,...v.filter(y=>y.word!==x.word).map(y=>y.meaning||y.translation).filter(Boolean).slice(0,3)]})});if(g.miniRule)a.push({q:'ما القاعدة الأساسية في هذا الدرس؟',answer:g.miniRule,options:[g.miniRule,...(g.steps||[]).slice(0,3)]});return a.slice(0,10)}async function load(){let r=await fetch('data/lessons/grade-5/lesson-studio-content.json?v=20260819-41',{cache:'no-store'});let x=await r.json();for(let i=0;i<5&&typeof x.content==='string';i++)x=JSON.parse(x.content);D=x.lessons?.[id];document.getElementById('title').textContent=D?.titleFr||'موارد الدرس';document.getElementById('back').href='grade-5-lesson-v3.html?id='+encodeURIComponent(id);const h=document.getElementById('heading'),b=document.getElementById('body');if(type==='printable'){h.textContent='🖨️ مرجع المراجعة والطباعة';b.innerHTML='<h3>'+esc(D.titleFr||'')+'</h3><p>'+esc(D.objectiveAr||'')+'</p><h3>القاعدة</h3><p>'+esc(D.grammar?.explanationAr||'')+'</p><p><b>'+esc(D.grammar?.miniRule||'')+'</b></p><h3>أمثلة</h3>'+((D.grammar?.examples||[]).map((e,i)=>'<p>'+(i+1)+'. <b>'+esc(e.fr)+'</b> — '+esc(e.ar)+'</p>').join(''))+'<h3>المفردات</h3>'+((D.vocabulary||[]).map(v=>'<p>• <b>'+esc(v.word)+'</b> — '+esc(v.meaning||v.translation||'')+(v.example?' — '+esc(v.example):'')+'</p>').join(''))}else{const q=items();h.textContent='🏆 التقييم الورقي';b.innerHTML='<p>نسخة تقييم مستقلة للطالب. الدرجة المقترحة: 10 درجات.</p>'+q.map((x,i)=>'<div style="margin:18px 0"><b>'+((i+1)+'. '+esc(x.q))+'</b><div>'+((x.options||[]).map(o=>'□ '+esc(o)).join('<br>'))+'</div></div>').join('')+'<hr><p>الاسم: ____________________ &nbsp;&nbsp; الفصل: __________ &nbsp;&nbsp; الدرجة: ____ / '+q.length+'</p>'}}load().catch(()=>{document.getElementById('heading').textContent='تعذر تحميل المورد';document.getElementById('body').textContent='أعد المحاولة.'});</script></body></html>
