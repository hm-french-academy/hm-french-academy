<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>HM Academy | مركز الألعاب</title><style>:root{--ink:#17223b;--muted:#68758b;--blue:#2563eb;--navy:#173a82;--cyan:#0f9f91;--line:#dfe6f2;--soft:#f7f9fd;--green:#16a34a;--red:#d14b4b}*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:var(--ink);font-family:Arial,"Noto Sans Arabic",sans-serif}.wrap{max-width:1050px;margin:auto;padding:22px 14px 50px}.hero,.panel,.game{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:0 10px 28px #14264a0d}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#0f9f91);color:#fff}.hero h1{margin:0 0 5px;font-size:clamp(28px,6vw,42px)}.hero p{margin:7px 0;line-height:1.8}.meta{color:var(--muted)}.hero .meta{color:#eef5ff}.games{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.game{margin:0}.game h2{margin:4px 0 8px}.game p{color:var(--muted);line-height:1.75}.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--blue);color:#fff;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.back{background:#eef4ff;color:var(--navy);margin-top:10px}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}.opt{border:1px solid #dbe3ef;background:#fff;border-radius:14px;padding:13px;font-weight:800;cursor:pointer;text-align:right}.opt:hover{background:#f8fbff;border-color:#b9c9e3}.opt.good{background:#eaf8f0!important;border-color:#20a45a!important;color:#087443}.opt.bad{background:#fff0f0!important;border-color:#d14b4b!important;color:#b42318}.q{font-size:21px;font-weight:900;line-height:1.7;margin:14px 0}.result{font-size:20px;font-weight:900;margin-top:14px}.round{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.tag{display:inline-block;background:#eef4ff;color:var(--navy);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:900}.hint{padding:12px;border-radius:14px;background:var(--soft);border-right:4px solid var(--cyan);line-height:1.8;margin-top:12px}.success{color:#087443;font-weight:900}.wrong{color:#b42318;font-weight:900}@media(max-width:650px){.games,.opts{grid-template-columns:1fr}.wrap{padding:10px 8px 35px}.hero,.panel,.game{padding:16px;border-radius:20px}}</style></head><body><main class="wrap"><section class="hero"><h1>🎮 مركز الألعاب</h1><p id="lesson">Les salutations · التحيات</p><p class="meta">أربع ألعاب مختلفة الوظيفة، وكل لعبة عبارة عن جولات حقيقية. اختر لعبة ثم ابدأ التحدي.</p></section><section id="hub" class="games"></section><section id="play" class="panel" style="display:none"></section></main><script>(function(){const id=new URLSearchParams(location.search).get('lesson')||'grade7-u1-l2';const pools={vocab:[['ما معنى Salut ؟',['مرحبًا / أهلًا','مساء الخير','إلى الغد'],0],['ما معنى Bonsoir ؟',['مساء الخير','صباح الخير','صديقي'],0],['ما معنى Une école ؟',['مدرسة','تلميذة','معلمة'],0],['ما معنى Un garçon ؟',['ولد','بنت','زميلة'],0],['ما معنى Une amie ؟',['صديقة','صديق','مدرسة'],0],['ما معنى À demain ؟',['إلى الغد','إلى اللقاء الآن','صباح الخير'],0],['ما معنى Voilà ؟',['ها هو / ها هي','كيف حالك؟','مساء الخير'],0],['ما معنى Une professeure ؟',['مدرسة / معلمة','تلميذة','صديقة'],0]],context:[['إن كان الوقت صباحًا، ماذا تختار؟',['Bonjour','Bonsoir','À demain'],0],['إن كان الوقت مساءً، ماذا تختار؟',['Bonsoir','Bonjour','Salut'],0],['تريد تحية غير رسمية لصديق، ماذا تختار؟',['Salut !','Bonjour monsieur !','Bonsoir madame !'],0],['تريد إنهاء اللقاء بعبارة غير رسمية، ماذا تختار؟',['À plus !','Bonjour !','Voilà !'],0],['تريد أن تقول: إلى الغد، ماذا تختار؟',['À demain','Au revoir','Salut'],0],['تقدم شخصًا أمام زميلك، أي تعبير يناسب الموقف؟',['Voilà mon ami.','Bonsoir le matin.','À demain mon ami.'],0],['تخاطب معلمة: أي تحية مناسبة؟',['Bonjour madame !','Bonjour garçon !','Salut professeur !'],0],['تخاطب مدرسًا: أي تحية مناسبة؟',['Bonjour monsieur !','Bonjour fille !','Bonsoir demain !'],0]],pronunciation:[['أي ملاحظة صحيحة عن Salut؟',['حرف t الأخير لا يُنطق','حرف t الأخير يُنطق دائمًا','حرف l لا يُنطق'],0],['في Bonjour، ماذا نلاحظ؟',['صوت أنفي في bon وr فرنسية في النهاية','كل الحروف تُنطق منفصلة','r لا تُنطق'],0],['في Une fille، ll تعطي صوتًا قريبًا من:',['الياء الفرنسية /j/','صوت l مزدوج','صوت r'],0],['في Un ami، قد يحدث في الكلام المتصل:',['liaison بين n وa','حذف ami','نطق n ككلمة مستقلة'],0],['في À plus !، ماذا يحدث غالبًا لـ s في plus؟',['لا تُنطق','تُنطق مثل z','تُنطق مثل k'],0],['في Au revoir، oi تعطي تقريبًا:',['wa','ou','é'],0],['في demain، النهاية تحتوي على:',['صوت أنفي','صوت t واضح','صوت s'],0],['في Une école، يمكن سماع:',['liaison بين une وécole','حذف une','نطق école ككلمة إنجليزية'],0]],dialogue:[['أكمل: Salut ! Comment ça va ?',['Ça va bien, merci.','Bonsoir demain.','Voilà une école.'],0],['أكمل: Bonjour madame !',['Bonjour !','À demain !','Salut garçon !'],0],['أكمل: Bonsoir !',['À demain !','Bonjour monsieur ! صباحًا فقط','Un garçon !'],0],['أكمل: Salut !',['À plus !','Le matin !','Une école !'],0],['اختر الرد الأنسب بعد: Ça va bien.',['Merci !','Bonsoir !','Au revoir !'],0],['اختر الحوار الأكثر منطقية:',['Bonjour ! → Voilà mon ami.','Bonsoir ! → Le matin.','À demain ! → Bonjour madame !'],0],['أي ترتيب يبني حوارًا طبيعيًا؟',['Salut → Comment ça va ? → Ça va bien.','À demain → Bonjour → Le matin','Voilà → Bonsoir → garçon'],0],['أي عبارة تصلح ختامًا للحوار؟',['Au revoir !','Bonjour !','Voilà !'],0]]};const titles={vocab:['📚 تحدي المفردات','معاني كلمات الدرس الأساسية.'],context:['🕒 تحدي الموقف','اختر التحية أو العبارة المناسبة حسب الوقت والموقف.'],pronunciation:['🎧 اسمع واكتشف','اختبر ملاحظات النطق الخاصة بكلمات الدرس.'],dialogue:['💬 ابنِ الحوار','اختر الرد أو التسلسل الذي يجعل الحوار طبيعيًا.']};const hub=document.getElementById('hub'),play=document.getElementById('play');hub.innerHTML=Object.entries(titles).map(([k,v])=>'<article class="game"><span class="tag">'+(k==='vocab'?'اللعبة 1':k==='context'?'اللعبة 2':k==='pronunciation'?'اللعبة 3':'اللعبة 4')+'</span><h2>'+v[0]+'</h2><p>'+v[1]+'</p><button class="btn" data-game="'+k+'">ابدأ اللعبة</button></article>').join('');let type='',round=0,score=0,current=[];const sh=a=>[...a].sort(()=>Math.random()-.5);function start(t){type=t;round=0;score=0;current=sh(pools[t]);hub.style.display='none';play.style.display='block';next()}function next(){if(round>=10){round=0;current=sh(pools[type]);play.innerHTML='<div class="result">🏆 انتهت الجولة — نتيجتك: '+score+' / 10</div><p class="meta">يمكنك إعادة الجولة بأسئلة مرتبة بشكل مختلف.</p><button class="btn" id="again">جولة جديدة</button> <button class="btn back" id="hubbtn">← مركز الألعاب</button>';document.getElementById('again').onclick=()=>start(type);document.getElementById('hubbtn').onclick=showHub;return}const x=current[round%current.length],opts=sh(x[1].map((o,i)=>({o,i})));round++;play.innerHTML='<div class="round"><span class="tag">'+titles[type][0]+'</span><span class="meta">السؤال '+round+' / 10 · النقاط '+score+'</span></div><div class="q">'+x[0]+'</div><div class="opts">'+opts.map(p=>'<button class="opt" type="button" data-i="'+p.i+'">'+p.o+'</button>').join('')+'</div><div id="fb" class="hint">فكّر أولًا ثم اختر إجابتك.</div>';document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.opt').forEach(x=>x.disabled=true);const ok=Number(b.dataset.i)===x[2];b.classList.add(ok?'good':'bad');if(ok){score++;document.getElementById('fb').innerHTML='<span class="success">✓ إجابة صحيحة</span>'}else{const right=[...document.querySelectorAll('.opt')].find(z=>Number(z.dataset.i)===x[2]);if(right)right.classList.add('good');document.getElementById('fb').innerHTML='<span class="wrong">✗ الإجابة الصحيحة: '+x[1][x[2]]+'</span>'}setTimeout(next,650)})}function showHub(){play.style.display='none';hub.style.display='grid'}document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>start(b.dataset.game));})();</script></body></html>
