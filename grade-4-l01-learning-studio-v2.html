<style>
body{margin:0;background:#f3f8fb;color:#2e2a25;font-family:Arial,Cairo,sans-serif}.wrap{max-width:1080px;margin:auto;padding:14px}.top{position:sticky;top:0;z-index:5;background:#ffffffee;padding:12px 16px;border-radius:0 0 18px 18px;display:flex;justify-content:space-between;font-weight:900}.top a{color:inherit;text-decoration:none}.hero{margin-top:12px;padding:30px 24px;border-radius:28px;background:linear-gradient(120deg,#dff5ff,#fff1d6 55%,#e9f6e5)}h1{font-size:clamp(32px,6vw,54px);margin:10px 0}.tag{display:inline-block;background:#c96a2e;color:#fff;padding:6px 12px;border-radius:999px;font-weight:900}.journey{position:sticky;top:54px;z-index:4;background:#fffffff5;padding:10px 2px;display:flex;gap:7px;overflow:auto}.step{border:0;background:#edf2f5;border-radius:999px;padding:10px 14px;font-weight:900;white-space:nowrap;cursor:pointer}.step.active{background:#2e2a25;color:#fff}.page{background:#fff;border-radius:26px;padding:22px;margin-top:12px;min-height:620px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{border:2px solid #edf1f4;border-radius:20px;padding:17px;background:#fff}.muted{color:#5b5750;font-weight:800}.fr{direction:ltr;text-align:left;font-weight:900}.seasonGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.season{border:0;border-radius:22px;padding:12px;min-height:245px;cursor:pointer;font:inherit}.spring{background:#e4f3e1}.summer{background:#fcefd6}.autumn{background:#f7e4d5}.winter{background:#deebf5}.season.selected{outline:3px solid #2e2a25}.season img,.word img{width:100%;height:130px;object-fit:cover;border-radius:16px}.season b{display:block;font-size:19px;margin-top:8px}.detail,.rule{margin-top:16px;padding:18px;border-radius:20px;background:#f8fbfd;border:1px solid #e5edf3}.months{display:flex;flex-wrap:wrap;gap:7px}.month{background:#fff;border-radius:999px;padding:7px 11px;font-weight:900}.phrase{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid #edf1f4;border-radius:14px;padding:10px;margin:7px 0}.speak{border:0;background:#2e2a25;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer}.word{display:flex;flex-direction:column;gap:9px}.word .term{font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:space-between;direction:ltr}.word img{height:145px}.word .example{background:#f8fbfd;border-radius:14px;padding:10px;direction:ltr;text-align:left;font-weight:900}.note{font-size:13px;color:#6b7280;font-weight:800}.choice{border:2px solid #e5edf3;background:#fff;border-radius:13px;padding:10px 14px;margin:4px;cursor:pointer;font-weight:900}.choice.correct{border-color:#5ea85b;background:#e4f3e1}.choice.wrong{border-color:#c9503b;background:#fbe0dc}.feedback{font-weight:900;min-height:24px}.year{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.year .seasonYear{border-radius:20px;padding:16px}.springY{background:#e4f3e1}.summerY{background:#fcefd6}.autumnY{background:#f7e4d5}.winterY{background:#deebf5}.yearMonth{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:12px;padding:8px 10px;margin:6px 0;font-weight:900}.btn{border:0;border-radius:13px;padding:11px 15px;background:#2e2a25;color:#fff;font-weight:900;cursor:pointer}.small{font-size:12px;color:#6b7280;font-weight:800}@media(max-width:760px){.seasonGrid,.year{grid-template-columns:1fr 1fr}}@media(max-width:500px){.seasonGrid,.year{grid-template-columns:1fr}.page{padding:15px}}

<body>
<div class="wrap">
<header class="top"><a href="grade-4.html">← الصف الرابع</a><a href="index.html">HM Academy</a></header>
<section class="hero"><span class="tag">Le français pour vous · 4e année · Unité 1</span><h1>🍂 Les 4 saisons</h1><p>Learning Studio — g4-l01 فقط</p></section>
<nav class="journey" id="nav"></nav><main class="page" id="page"></main>
</div>
<script>
const seasons=[
{k:'spring',fr:'Le printemps',ar:'الربيع',img:'https://images.unsplash.com/photo-1781757588811-786f0ea57292?auto=format&fit=crop&fm=jpg&q=80&w=1200',months:['Mars','Avril','Mai'],sentences:['Il fait beau.','Le ciel est bleu.','Les feuilles sont vertes.','Il y a des fleurs.']},
{k:'summer',fr:"L'été",ar:'الصيف',img:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&fm=jpg&q=80&w=1200',months:['Juin','Juillet','Août'],sentences:['Il fait chaud.','Le ciel est bleu.','Le soleil brille.','Les arbres ont des fruits.']},
{k:'autumn',fr:"L'automne",ar:'الخريف',img:'https://images.unsplash.com/photo-1507371341162-763b5e419408?auto=format&fit=crop&fm=jpg&q=80&w=1200',months:['Septembre','Octobre','Novembre'],sentences:['Il fait mauvais.','Le ciel est gris.','Les feuilles sont jaunes.',"Les feuilles d'arbres tombent."]},
{k:'winter',fr:"L'hiver",ar:'الشتاء',img:'https://images.unsplash.com/photo-1483921020237-2ff51e8e4b22?auto=format&fit=crop&fm=jpg&q=80&w=1200',months:['Décembre','Janvier','Février'],sentences:['Il fait froid.','Il pleut.','Les vents soufflent.','La neige tombe.']}
];
const steps=[['discover','🚀','اكتشف'],['vocab','🖼️','تعلم · المفردات'],['pronounce','🎧','انطق'],['understand','📘','افهم'],['year','🗓️','Une année'],['practice','🤝','تواصل · تدريب']];
const nav=document.getElementById('nav');nav.innerHTML=steps.map((s,i)=>`<button class="step" data-step="${s[0]}">${s[1]} ${i+1}. ${s[2]}</button>`).join('');nav.onclick=e=>{const b=e.target.closest('.step');if(b)render(b.dataset.step)};
function speak(t,b){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;if(b){b.textContent='🔊';u.onend=()=>b.textContent='🔊'}speechSynthesis.speak(u)}
function sp(t){return `<button class="speak" onclick="speak(${JSON.stringify(t)},this)">🔊</button>`}
const vocab={
'Le printemps':['Le printemps','L','https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&fm=jpg&q=80&w=900','الفصل نفسه'],
'beau':['beau','b','https://images.unsplash.com/photo-1499346030926-9a72daac6c63?auto=format&fit=crop&fm=jpg&q=80&w=900','Il fait beau.'],
'ciel':['ciel','c','https://images.unsplash.com/photo-1534088568595-a066f410bcda?auto=format&fit=crop&fm=jpg&q=80&w=900','Le ciel est bleu.'],
'bleu':['bleu','b','https://images.unsplash.com/photo-1499346030926-9a72daac6c63?auto=format&fit=crop&fm=jpg&q=80&w=900','Le ciel est bleu.'],
'feuilles':['feuilles','f','https://images.unsplash.com/photo-1507371341162-763b5e419408?auto=format&fit=crop&fm=jpg&q=80&w=900','Les feuilles sont vertes. / Les feuilles sont jaunes.'],
'vertes':['vertes','v','https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&fm=jpg&q=80&w=900','Les feuilles sont vertes.'],
'fleurs':['fleurs','f','https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&fm=jpg&q=80&w=900','Il y a des fleurs.'],
"L'été":["L'été",'L','https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&fm=jpg&q=80&w=900','الفصل نفسه'],
'chaud':['chaud','ch','https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&fm=jpg&q=80&w=900','Il fait chaud.'],
'soleil':['soleil','s','https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&fm=jpg&q=80&w=900','Le soleil brille.'],
'brille':['brille','br','https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&fm=jpg&q=80&w=900','Le soleil brille.'],
'arbres':['arbres','ar','https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&fm=jpg&q=80&w=900','Les arbres ont des fruits. / Les feuilles d’arbres tombent.'],
'fruits':['fruits','fr','https://images.unsplash.com/photo-1610832958506-aa56368176cf?auto=format&fit=crop&fm=jpg&q=80&w=900','Les arbres ont des fruits.'],
"L'automne":["L'automne",'L','https://images.unsplash.com/photo-1507371341162-763b5e419408?auto=format&fit=crop&fm=jpg&q=80&w=900','الفصل نفسه'],
'mauvais':['mauvais','m','https://images.unsplash.com/photo-1519692933481-e162a57d6721?auto=format&fit=crop&fm=jpg&q=80&w=900','Il fait mauvais.'],
'gris':['gris','gr','https://images.unsplash.com/photo-1534274988757-a28bf1a57c17?auto=format&fit=crop&fm=jpg&q=80&w=900','Le ciel est gris.'],
'jaunes':['jaunes','j','https://images.unsplash.com/photo-1507371341162-763b5e419408?auto=format&fit=crop&fm=jpg&q=80&w=900','Les feuilles sont jaunes.'],
'tombent':['tombent','t','https://images.unsplash.com/photo-1507371341162-763b5e419408?auto=format&fit=crop&fm=jpg&q=80&w=900',"Les feuilles d'arbres tombent. / La neige tombe."],
"L'hiver":["L'hiver",'L','https://images.unsplash.com/photo-1483921020237-2ff51e8e4b22?auto=format&fit=crop&fm=jpg&q=80&w=900','الفصل نفسه'],
'froid':['froid','fr','https://images.unsplash.com/photo-1483664852095-d6cc6870702d?auto=format&fit=crop&fm=jpg&q=80&w=900','Il fait froid.'],
'pleut':['pleut','pl','https://images.unsplash.com/photo-1519692933481-e162a57d6721?auto=format&fit=crop&fm=jpg&q=80&w=900','Il pleut.'],
'vents':['vents','v','https://images.unsplash.com/photo-1482192596544-9eb780fc7f66?auto=format&fit=crop&fm=jpg&q=80&w=900','Les vents soufflent.'],
'soufflent':['soufflent','s','https://images.unsplash.com/photo-1482192596544-9eb780fc7f66?auto=format&fit=crop&fm=jpg&q=80&w=900','Les vents soufflent.'],
'neige':['neige','n','https://images.unsplash.com/photo-1483664852095-d6cc6870702d?auto=format&fit=crop&fm=jpg&q=80&w=900','La neige tombe.']};
const pronunciation={beau:'eau = /o/ مثل صوت «o» واضح؛ لا تُنطق الحروف الأخيرة.',ciel:'ci- تُنطق «سي» تقريبًا، و-iel تُنطق مع صوت /j/ في نهاية المقطع.',bleu:'eu صوت واحد فرنسي، مع شفاه مستديرة.',feuilles:'feuill- فيها صوت /œj/ تقريبًا؛ لا تُنطق s في النهاية.',vertes:'ver- ثم صوت t خفيف؛ الـs النهائية لا تُنطق.',fleurs:'fleur تبدأ بـ f، وeu صوت فرنسي واحد؛ s النهائية لا تُنطق.',chaud:'ch = /ʃ/، وau = /o/؛ d النهائية لا تُنطق.',soleil:'so-leil؛ الجزء -eil يعطي صوت /ɛj/ تقريبًا.',brille:'br = بْر، وill تعطي صوت /j/ تقريبًا.',arbres:'arbre؛ r فرنسية، وs النهائية لا تُنطق.',fruits:'fruit؛ ui صوت فرنسي مركب، وs النهائية لا تُنطق.',mauvais:'mau- ثم -vais؛ s النهائية لا تُنطق.',gris:'g هنا /g/، وs النهائية لا تُنطق.',jaunes:'j = /ʒ/، وau = /o/، وs النهائية لا تُنطق.',tombent:'tom- ثم bent؛ ent في نهاية الفعل لا تُنطق.',froid:'froid؛ oi تعطي /wa/، وd النهائية لا تُنطق.',pleut:'eu صوت فرنسي واحد، t النهائية لا تُنطق.',vents:'vent؛ ent في الجمع هنا لا تُنطق.',soufflent:'souff- ثم lent؛ ent النهائية لا تُنطق.',neige:'nei- ثم ge؛ g قبل e تُنطق /ʒ/.'};
const words=Object.keys(vocab);
function vocabPage(){return `<span class="tag">02 · تعلم / المفردات</span><h2>🖼️ الكلمات الفعلية من الدرس</h2><p class="muted">لا توجد قائمة خارجية: كل كلمة هنا مستخرجة من أسماء الفصول أو الجمل الموجودة في g4-l01. الكلمات المتكررة تظهر مرة واحدة فقط، مع أمثلتها الأصلية.</p><div class="cards">${words.map(w=>{const x=vocab[w];return `<article class="card word"><img loading="lazy" src="${x[2]}" alt="${x[0]}"><div class="term"><span>${x[0]}</span>${sp(x[0])}</div>${x[3]!=='الفصل نفسه'?`<div class="example">${x[3]} ${sp(x[3])}</div>`:'<div class="note">اسم فصل من محتوى الدرس.</div>'}</article>`}).join('')}</div>`}
function pronouncePage(){return `<span class="tag">03 · انطق</span><h2>🎧 نطق الكلمات نفسها</h2><p class="muted">هنا لا نكرر الأمثلة؛ نركز على الكلمة وملاحظة النطق الخاصة بها.</p><div class="cards">${words.filter(w=>pronunciation[w]).map(w=>`<article class="card"><div class="term fr">${w} ${sp(w)}</div><p class="note">${pronunciation[w]}</p></article>`).join('')}</div>`}
function understandPage(){return `<span class="tag">04 · افهم</span><h2>📘 افهم كل فصل</h2><div class="cards">${seasons.map(s=>`<article class="card"><img style="width:100%;height:180px;object-fit:cover;border-radius:16px" src="${s.img}" alt="${s.fr}"><h3>${s.fr} · ${s.ar}</h3><div class="months">${s.months.map(m=>`<span class="month">${m}</span>`).join('')}</div>${s.sentences.map(t=>`<div class="phrase"><span class="fr">${t}</span>${sp(t)}</div>`).join('')}</article>`).join('')}</div>`}
function yearPage(){return `<span class="tag">05 · Une année</span><h2>🗓️ سنة كاملة في صورة واحدة</h2><p class="muted">الشهور الـ12 مرتبطة مباشرة بالفصول الأربعة، وكل شهر له زر نطق.</p><div class="year">${seasons.map((s,i)=>`<section class="seasonYear ${['springY','summerY','autumnY','winterY'][i]}"><h3>${s.fr}</h3>${s.months.map(m=>`<div class="yearMonth"><span class="fr">${m}</span>${sp(m)}</div>`).join('')}</section>`).join('')}</div>`}
function choice(q,opts,ans){return `<article class="card"><h3>${q}</h3><div>${opts.map(o=>`<button class="choice" data-v="${o}" data-a="${ans}" onclick="answer(this)">${o}</button>`).join('')}</div><p class="feedback"></p></article>`}
function answer(b){const box=b.parentElement;box.querySelectorAll('.choice').forEach(x=>x.classList.remove('correct','wrong'));const ok=b.dataset.v===b.dataset.a;b.classList.add(ok?'correct':'wrong');box.nextElementSibling.textContent=ok?'✅ إجابة صحيحة!':'❌ حاول مرة أخرى.'}
function practicePage(){return `<span class="tag">06 · تواصل / تدريب</span><h2>🤝 تواصل وتدرب من محتوى الدرس</h2><div class="cards">${choice('Au printemps, le ciel est…',['bleu','gris'],'bleu')}${choice("En été, le soleil…",['brille','tombe'],'brille')}${choice("Les mois de l'automne sont…",['Septembre · Octobre · Novembre','Décembre · Janvier · Février'],'Septembre · Octobre · Novembre')}${choice("Les mois de l'hiver sont…",['Décembre · Janvier · Février','Mars · Avril · Mai'],'Décembre · Janvier · Février')}${choice('Les mois du printemps sont…',['Mars · Avril · Mai','Juin · Juillet · Août'],'Mars · Avril · Mai')}${choice("Les mois de l'été sont…",['Juin · Juillet · Août','Septembre · Octobre · Novembre'],'Juin · Juillet · Août')}</div><div class="rule"><h3>🧩 تذكير</h3><p class="fr">au printemps · en été · en automne · en hiver</p><p class="muted">هذه الصيغة موجودة ضمن تدريبات الدرس، ولم يتم اختراع أمثلة بديلة.</p></div>`}
function render(k){document.querySelectorAll('.step').forEach(b=>b.classList.toggle('active',b.dataset.step===k));const p=document.getElementById('page');if(k==='discover')p.innerHTML=`<span class="tag">01 · اكتشف</span><h2>🚀 اكتشف قبل أن تحفظ</h2><p class="muted">ابدأ بالنظر إلى الفصول الأربعة، ثم لاحظ الشهور والطقس والجمل قبل حفظ الكلمات.</p><div class="seasonGrid">${seasons.map((s,i)=>`<button class="season ${s.k}" onclick="this.parentElement.querySelectorAll('.season').forEach(x=>x.classList.remove('selected'));this.classList.add('selected');document.getElementById('discoverDetail').innerHTML='<h3>${s.fr} · ${s.ar}</h3><div class=\"months\">${s.months.map(m=>`<span class=\"month\">${m}</span>`).join('')}</div><p class=\"fr\">${s.sentences[0]}</p>'"><img src="${s.img}" alt="${s.fr}"><b>${s.fr}</b><span class="muted">${s.ar}</span></button>`).join('')}</div><div class="detail" id="discoverDetail">اختر فصلًا لتلاحظ ما يميزه.</div>`;else if(k==='vocab')p.innerHTML=vocabPage();else if(k==='pronounce')p.innerHTML=pronouncePage();else if(k==='understand')p.innerHTML=understandPage();else if(k==='year')p.innerHTML=yearPage();else p.innerHTML=practicePage()}
render('discover');
</script>
</body></html>
