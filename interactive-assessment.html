<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | التقييم التفاعلي</title><style>body{margin:0;background:#f4f7fc;color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:960px;margin:auto;padding:22px 14px 50px}.hero,.card,.result{background:#fff;border:1px solid #dfe6f0;border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:0 10px 30px #14264a10}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#7c3aed);color:#fff}.q{padding:18px 0;border-bottom:1px solid #e3e8f0}.q:last-child{border-bottom:0}.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.opt{border:1px solid #dbe3ef;background:#fff;border-radius:14px;padding:13px;text-align:right;font-weight:800;cursor:pointer}.opt.sel{border-color:#2563eb;background:#edf3ff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{display:inline-block;border:0;border-radius:12px;padding:12px 16px;background:#713bd1;color:#fff;font-weight:900;text-decoration:none;cursor:pointer}.muted{color:#68758b;line-height:1.8}.result{display:none}.score{font-size:24px;font-weight:900}@media(max-width:650px){.opts{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><h1 id="title">التقييم التفاعلي</h1><p id="subtitle">اختبار قصير مستقل عن التقييم الرسمي.</p></section><section class="card"><div id="form"><p class="muted">جارٍ تحميل أسئلة الدرس…</p></div><div class="actions"><button class="btn" id="submit" type="button">تصحيح التقييم</button><a class="btn" id="back" href="#">← العودة إلى الدرس</a></div></section><section class="result" id="result"></section></main><script>(async function(){const p=new URLSearchParams(location.search),lessonId=p.get('lesson')||'grade8-u1-l1',m=lessonId.match(/^grade8-u(\d+)-l(\d+)$/);if(!m)return;const u=m[1],l=m[2],url='data/lessons/grade-8/unit-'+u+'/lesson-'+l+'.json';let data=null;try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(r.status);data=await r.json();if(typeof data.content==='string')data=JSON.parse(data.content)}catch(e){document.getElementById('form').innerHTML='<p>تعذر تحميل أسئلة هذا الدرس.</p>';return}const lang=localStorage.getItem('hm_language')||localStorage.getItem('hm_lang')||'ar';const titleAr=data.titleAr||data.title||'التقييم التفاعلي';const titleFr=data.titleFr||data.title||'';document.documentElement.lang=lang;document.getElementById('title').textContent=lang==='fr'?'Évaluation interactive':lang==='en'?'Interactive Assessment':'التقييم التفاعلي — '+titleAr;document.getElementById('subtitle').textContent=lang==='fr'?titleFr+' · Questions d’entraînement':lang==='en'?titleFr+' · Practice questions':'أسئلة تدريبية مستقلة عن التقييم الرسمي';document.getElementById('back').href='lesson.html?id='+encodeURIComponent(lessonId)+'&section=assessment';let qs=Array.isArray(data.assessment?.questions)?data.assessment.questions:[];const practice=Array.isArray(data.practice)?data.practice:[];const extra=practice.filter(q=>q&&Array.isArray(q.options)&&typeof q.answer==='number');qs=[...qs,...extra].slice(0,12);const form=document.getElementById('form');const answers={};form.innerHTML=qs.length?qs.map((q,i)=>'<div class="q"><h3>'+(i+1)+'. '+q.question+'</h3><div class="opts">'+q.options.map((o,k)=>'<button class="opt" type="button" data-i="'+i+'" data-k="'+k+'">'+o+'</button>').join('')+'</div></div>').join(''):'<p class="muted">لا توجد أسئلة تفاعلية مسجلة لهذا الدرس.</p>';form.onclick=e=>{if(!e.target.classList.contains('opt'))return;const i=+e.target.dataset.i;answers[i]=+e.target.dataset.k;form.querySelectorAll('.opt[data-i="'+i+'"]').forEach(x=>x.classList.remove('sel'));e.target.classList.add('sel')};document.getElementById('submit').onclick=()=>{let score=0,answered=0;qs.forEach((q,i)=>{if(answers[i]!==undefined){answered++;if(answers[i]===q.answer)score++}});const pct=qs.length?Math.round(score/qs.length*100):0;const r=document.getElementById('result');r.style.display='block';r.innerHTML='<div class="score">النتيجة: '+score+' / '+qs.length+' ('+pct+'%)</div><p class="muted">أجبت عن '+answered+' من '+qs.length+' سؤالًا. هذا التقييم تدريبي ولا يستبدل التقييم الرسمي.</p>';window.scrollTo({top:r.offsetTop-20,behavior:'smooth'});};})();</script></body></html>
