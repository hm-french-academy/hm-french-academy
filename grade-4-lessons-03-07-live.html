function render(s){nav.querySelectorAll('.step').forEach(x=>x.classList.toggle('active',x.dataset.s===s));let h='';if(s==='start')h=head('01','ابدأ الرحلة','مسار Premium Learning Studio مبني من محتوى الدرس الأصلي، مع إعادة تقديم تفاعلية داخل المنصة.')+`<div class="grid"><article class="card"><div class="visual">🇫🇷</div><h3>هدف الدرس</h3><p>${D.focus}</p><button class="btn" data-go="vocab">🚀 ابدأ</button></article><article class="card soft"><h3>رحلة الدرس</h3><p>مفردات → افهم → قاعدة → تفاعل → محادثة → تدريب → فيديو → ألعاب → تقييم → مراجعة → بعد الرحلة.</p><p class="note">المصدر الأصلي يُستخدم لبناء المحتوى فقط ولا يظهر للطالب كملف تحميل.</p></article></div>`;if(s==='vocab')h=vocab();if(s==='under'){if(D.kind==='body')h=head('03','افهم','اقرأ نص Samy ولاحظ كيف تُستخدم مفردات الجسم داخل جمل حقيقية.')+`<div class="passage">${D.passage.map(x=>`<div>${x}</div>`).join('')}<button class="sound" data-speak="${D.passage.join(' ')}">🔊 استمع للنص كاملًا</button></div>`;else if(D.kind==='face')h=head('03','افهم','اربط الكلمة بالجزء الصحيح من الوجه، ثم لاحظ استخدام أدوات التعريف.')+`<div class="grid">${D.parts.map(x=>`<article class="card"><div class="fr">${x[1]}</div><div class="ar">${x[2]}</div><p>أداة التعريف: <b>${x[3]}</b></p><button class="sound" data-speak="${x[1]}">🔊</button></article>`).join('')}</div>`;else h=head('03','افهم','حوّل الجملة إلى صيغة الملكية ولاحظ أن الاسم المملوك هو الذي يحدد الشكل.')+`<div class="cards">${(D.statements||D.statementsA||[]).concat(D.statementsB||[]).map(x=>`<div class="flip" onclick="this.classList.toggle('open')"><div class="flipin"><div class="face front">${x[0]}</div><div class="face back">${x[1]}</div></div></div>`).join('')}</div>`}if(s==='rules'){if(D.kind==='face')h=head('04','القاعدة','أدوات التعريف والتنكير المرتبطة بمفردات الوجه.')+`<div class="grid"><div class="rule"><b>Articles définis</b><br><b>le</b> + مذكر مفرد — le nez<br><b>la</b> + مؤنث مفرد — la bouche<br><b>l'</b> + حرف متحرك — l'oreille<br><b>les</b> + جمع — les yeux</div><div class="rule"><b>Articles indéfinis</b><br><b>un</b> للمذكر المفرد<br><b>une</b> للمؤنث المفرد<br><b>des</b> للجمع</div></div>`;else if(D.kind==='body')h=head('04','القاعدة','راجع le وla مع مفردات الجسم قبل الانتقال إلى التدريب.')+`<div class="grid"><div class="rule"><b>le</b> : le bras, le cou, le ventre, le doigt, le genou, le pied</div><div class="rule"><b>la</b> : la tête, la poitrine, la main, la jambe</div></div>`;else h=head('04','القاعدة','الشيء المملوك هو الذي يحدد صيغة صفة الملكية.')+`<table class="table"><tr><th>Pronom</th><th>مذكر / متحرك</th><th>مؤنث</th><th>جمع</th></tr><tr><td>Je / J'</td><td>mon</td><td>ma</td><td>mes</td></tr><tr><td>Tu</td><td>ton</td><td>ta</td><td>tes</td></tr><tr><td>Il / Elle</td><td>son</td><td>sa</td><td>ses</td></tr></table><div class="rule">⚠️ مؤنث يبدأ بحرف متحرك: <b>mon école</b> وليس <b>ma école</b>.</div>`}if(s==='interact'){const Q=D.kind==='face'?D.quiz:D.kind==='body'?D.quiz.concat([['Complète : ____ main','le|la','la'],['Complète : ____ ventre','le|la','le']]):(D.mini||[]).concat(D.quiz||[]);h=head('05','تفاعل','طبّق ما فهمته في أسئلة مستقلة؛ الإجابة لا تظهر داخل السؤال.')+`<div class="grid">${Q.map(x=>`<article class="card"><h3>${x[0]}</h3>${choices(x[1],x[2])}<p class="feedback"></p></article>`).join('')}</div>`}if(s==='talk'){const T=D.talk||((D.statements||[]).concat(D.statementsA||[],D.statementsB||[]));h=head('06','المحادثة','جمل مرتبطة بموضوع الدرس مع زر نطق لكل جملة.')+`<div>${T.map((x,i)=>`<div class="line"><b>${i%2?'👧':'👦'}</b><br><span class="fr">${x[0]}</span> <button class="sound" data-speak="${x[0]}">🔊</button><br><span class="fr">${x[1]}</span> <button class="sound" data-speak="${x[1]}">🔊</button></div>`).join('')}</div>`}if(s==='practice'){const Q=D.practice||D.mini||[];h=head('07','التدريب','تدريب مستقل عن التفاعل، مع تغذية راجعة فورية.')+`<div class="grid">${Q.concat(Q.slice(0,Math.min(4,Q.length))).map(x=>`<article class="card"><h3>${x[0]}</h3>${choices(x[1],x[2])}<p class="feedback"></p></article>`).join('')}</div>`}if(s==='media')h=head('08','الفيديو','الفيديو الأصلي المرتبط بهذا الدرس مضمّن داخل الـLearning Studio.')+`<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${D.video}?rel=0&modestbranding=1" title="${D.fr}" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`;if(s==='games')h=head('09','مركز الألعاب','أربع ألعاب مختلفة؛ كل لعبة لها عدة جولات ومهارة مختلفة.')+`<div class="games"><button class="gamebtn active" data-game="choice">🎯 اختَر</button><button class="gamebtn" data-game="listen">🎧 اسمع</button><button class="gamebtn" data-game="memory">🧠 ذاكرة</button><button class="gamebtn" data-game="speed">⚡ تحدي</button></div><div class="gamepanel" id="gamepanel"></div>`;if(s==='test'){const folder=id==='g4-l04'?'04_Mon_visage':id==='g4-l05'?'05_Adjectifs_possessifs_visage':id==='g4-l06'?'06_Le_corps':'07_Adjectifs_possessifs_corps',file=id==='g4-l04'?'mon_visage':id==='g4-l05'?'adjectifs_possessifs_visage':id==='g4-l06'?'le_corps':'adjectifs_possessifs_corps';h=head('10','التقييم الرسمي','الاختبار الإلكتروني الرسمي مضمّن داخل الصفحة؛ لا يتم تحميل ملف المصدر ولا خلط أسئلة التدريب بالتقييم.')+`<iframe class="exam" src="data/lessons/grade-4/source/4eme_Complet/${folder}/04_examen_electronique_${file}.html" title="التقييم الإلكتروني الرسمي"></iframe>`}if(s==='review')h=head('11','المراجعة الذكية','مراجعة مختلفة عن التدريب: استدعاء وتمييز وتصحيح خطأ.')+`<div class="reviewgrid" id="reviewgrid"></div>`;if(s==='after')h=head('12','بعد الرحلة','أغلق الدرس بقياس ما أتقنته، دون روابط تحميل للمصادر الخام.')+`<div class="reviewgrid">${D.after.map((x,i)=>`<article class="review"><h3>${i+1}. ${x}</h3><button class="sound" data-speak="${x}">🔊</button></article>`).join('')}</div><div class="rule"><b>أحسنت!</b> أكملت رحلة الدرس.</div>`;page.innerHTML=h;page.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>render(b.dataset.go));page.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));bindChoices();if(s==='vocab')bindVocab();if(s==='games')bindGames();if(s==='review')bindReview()}
function bindGames(){let game='choice',score=0,round=0,mem=[],open=[],matched=[];const panel=document.getElementById('gamepanel');let pool=(D.parts||[]).map(x=>[x[1],x[2]]);if(D.kind==='possface')pool.push(['mon nez','أنفي'],['ma tête','رأسي'],['mes yeux','عيناي']);if(D.kind==='possbody')pool.push(['ton nez','أنفك'],['ta tête','رأسك'],['ses mains','يداهما']);function draw(){if(game==='choice'||game==='listen'||game==='speed'){let x=pool[round%pool.length],opts=pool.slice(0,Math.min(4,pool.length));if(game==='choice')panel.innerHTML=`<div class="score">الجولة ${round+1} · النقاط ${score}</div><h3>ما معنى <span class="fr">${x[0]}</span>؟</h3>${opts.map(o=>`<button class="choice" data-g="${o[1]===x[1]}">${o[1]}</button>`).join('')}<p class="feedback"></p>`;else if(game==='listen')panel.innerHTML=`<div class="score">الجولة ${round+1} · النقاط ${score}</div><button class="sound" id="listenword">🔊 استمع</button><h3>أي بطاقة سمعت؟</h3>${opts.map(o=>`<button class="choice" data-g="${o[0]===x[0]}">${o[0]}</button>`).join('')}<p class="feedback"></p>`;else panel.innerHTML=`<div class="score">الجولة ${round+1} · النقاط ${score}</div><h3>اختر بسرعة: ${x[1]}</h3>${opts.map(o=>`<button class="choice" data-g="${o[0]===x[0]}">${o[0]}</button>`).join('')}<p class="feedback"></p>`;if(game==='listen')document.getElementById('listenword').onclick=()=>speak(x[0])}else{if(!mem.length){let a=pool.slice(0,Math.min(4,pool.length));mem=a.map((x,i)=>({t:x[0],k:i})).concat(a.map((x,i)=>({t:x[1],k:i}))).sort(()=>Math.random()-.5)}panel.innerHTML=`<div class="score">مطابقات ${matched.length/2} / ${mem.length/2}</div><div class="memory">${mem.map((x,i)=>`<button class="mem ${open.includes(i)||matched.includes(i)?'open':''}" data-m="${i}">${open.includes(i)||matched.includes(i)?x.t:'؟'}</button>`).join('')}</div>`}}document.querySelectorAll('.gamebtn').forEach(b=>b.onclick=()=>{game=b.dataset.game;score=0;round=0;mem=[];open=[];matched=[];document.querySelectorAll('.gamebtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw()});panel.onclick=e=>{let g=e.target.closest('[data-g]');if(g){if(g.dataset.g==='true'){score++;g.classList.add('ok')}else g.classList.add('no');round++;setTimeout(draw,400)}let m=e.target.closest('[data-m]');if(m&&!matched.includes(+m.dataset.m)){let i=+m.dataset.m;if(open.includes(i))return;open.push(i);draw();if(open.length===2){let a=mem[open[0]],b=mem[open[1]];if(a.k===b.k){matched.push(open[0],open[1]);open=[];draw()}else setTimeout(()=>{open=[];draw()},650)}}};draw()}
function bindReview(){let Q=[];if(D.kind==='face')Q=[['بدل حفظ الكلمة فقط: أي أداة مع yeux؟','le|la|les','les'],['أي كلمة تعني الفم؟','le nez|la bouche|le front','la bouche'],['صح أم خطأ: l’oreille تبدأ بحرف متحرك.','صح|خطأ','صح']];else if(D.kind==='body')Q=[['أي كلمة تعني البطن؟','le ventre|la poitrine|le cou','le ventre'],['صح أم خطأ: Sa tête est ronde جملة واردة في نص Samy.','صح|خطأ','صح'],['أي كلمة من الآتي مؤنثة؟','le bras|la main|le pied','la main']];else Q=[['J’ai une tête → ؟','mon|ma|mes','ma'],['Tu as des oreilles → ؟','ton|ta|tes','tes'],['Il a des gommes → ؟','son|sa|ses','ses'],['أي قاعدة صحيحة؟','الاسم المملوك يحدد الصيغة|الضمير لا يهم|كل الكلمات تأخذ mon','الاسم المملوك يحدد الصيغة']];document.getElementById('reviewgrid').innerHTML=Q.map(x=>`<article class="review"><h3>${x[0]}</h3>${choices(x[1],x[2])}<p class="feedback"></p></article>`).join('');bindChoices()}
nav.onclick=e=>{const b=e.target.closest('.step');if(b)render(b.dataset.s)};render(p.get('section')||'start')})();</script></main></body></html>
