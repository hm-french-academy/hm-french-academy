<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>HM Academy | المراجعة الذكية — الصف الثالث</title><style>body{margin:0;background:#f5f7fb;color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:1050px;margin:auto;padding:16px}.top{background:#0f1b33;color:#fff;padding:12px 16px;border-radius:18px;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none;font-weight:900}.hero,.card{background:#fff;border:1px solid #dfe6f0;border-radius:22px;padding:20px;margin-top:14px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff}.q{border:1px solid #e1e6ef;border-radius:16px;padding:16px;margin:12px 0}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.choices button,.primary{border:0;border-radius:11px;padding:11px;background:#eef3ff;color:#173a82;font-weight:900;cursor:pointer}.primary{background:#2563eb;color:#fff;text-decoration:none;display:inline-block}.result{font-size:18px;font-weight:900;margin-top:14px}.muted{color:#667085}@media(max-width:600px){.wrap{padding:10px}}</style></head><body><div class="wrap"><header class="top"><a id="back" href="grade-3.html">← الصف الثالث</a><a href="index.html">HM Academy</a></header><section class="hero"><div>🧠 مراجعة مستقلة</div><h1 id="title">المراجعة الذكية</h1><p>مراجعة الدرس الحالي فقط، خارج صفحات رحلة الدرس.</p></section><main id="app" class="card">جارٍ تحميل بيانات الدرس...</main></div><script>(async()=>{const p=new URLSearchParams(location.search),id=p.get('lesson')||'g3-l01',R={'g3-l01':['التعريف والتهيئة','01_Introduction','01_interactif_introduction.html'],'g3-l02':['في الفصل','02_En_classe','01_interactif_enclasse.html'],'g3-l03':['الأفعال والأنشطة','03_Actes_et_verbes','01_interactif_actesverbes.html'],'g3-l04':['هذا فصلي','04_Unite1_Cest_ma_classe','01_interactif_maclasse.html'],'g3-l05':['هذا منزلي','05_Unite2_Cest_ma_maison','01_interactif_maison.html'],'g3-l06':['الفواكه والخضروات','06_Unite3_Fruits_et_legumes','01_interactif_fruits.html']};const d=R[id],A=document.getElementById('app');if(!d){A.innerHTML='<h2>الدرس غير متاح</h2>';return}document.getElementById('title').textContent='المراجعة الذكية · '+d[0];document.getElementById('back').href='grade-3-lesson-journey.html?id='+id;try{const root='data/lessons/grade-3/source/3eme%20prim/'+encodeURIComponent(d[1])+'/',r=await fetch(root+d[2],{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const html=await r.text(),doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('script,style,noscript').forEach(e=>e.remove());const words=[...new Set([...doc.querySelectorAll('table tr,li')].map(e=>(e.textContent||'').replace(/\s+/g,' ').trim()).filter(x=>x.length>2&&x.length<90))].slice(0,16);if(!words.length){A.innerHTML='<h2>لا توجد بيانات قابلة للمراجعة</h2><p class="muted">لم يتم العثور على عناصر نصية مستقلة في المصدر الأصلي لهذا الدرس.</p>';return}let i=0,score=0;function render(){if(i>=Math.min(words.length,10)){A.innerHTML='<h2>انتهت المراجعة 🎉</h2><div class="result">نتيجتك: '+score+' / '+Math.min(words.length,10)+'</div><br><a class="primary" href="grade-3-lesson-journey.html?id='+id+'">العودة إلى رحلة الدرس</a>';return}const answer=words[i],choices=[answer,...words.filter((_,j)=>j!==i).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);A.innerHTML='<div class="q"><h2>سؤال '+(i+1)+'</h2><p>اختر العنصر الصحيح من محتوى الدرس:</p><div class="choices">'+choices.map(x=>'<button data-x="'+x.replace(/"/g,'&quot;')+'">'+x+'</button>').join('')+'</div></div><div class="muted">النتيجة الحالية: '+score+'</div>';A.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{if(b.dataset.x===answer)score++;i++;render()})}render()}catch(e){A.innerHTML='<h2>تعذر تحميل المراجعة</h2><p class="muted">'+e.message+'</p>'}})();</script></body></html>
