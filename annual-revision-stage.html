<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14264a"><title>HM Academy | مراجعة الاستعداد</title><link rel="stylesheet" href="css/premium-shell.css?v=20260831-revision-stage-v3"><style>main{max-width:1000px;margin:auto;padding:24px 16px 60px}.hero{background:linear-gradient(135deg,#14264a,#315fc8);color:#fff;border-radius:24px;padding:26px;margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:clamp(25px,5vw,40px)}.hero p{margin:0;line-height:1.9}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(20,38,74,.07)}.status{padding:14px;border-radius:14px;background:#f7faff;color:#52627a;line-height:1.8}.btn{display:inline-block;margin-top:16px;padding:12px 18px;border-radius:12px;background:#315fc8;color:#fff;text-decoration:none;font-weight:900;border:0;cursor:pointer}.back{margin-right:8px;background:#eef2f7;color:#14264a}.quiz{margin-top:18px}.q{padding:18px 0;border-top:1px solid #e7ebf2}.q h3{margin:0 0 12px;color:#14264a;font-size:18px}.option{display:block;width:100%;text-align:right;background:#fff;border:1px solid #dfe5ef;border-radius:13px;padding:12px;margin:8px 0;cursor:pointer}.option.selected{border-color:#315fc8;background:#eef4ff}.option input{margin-left:8px}.result{margin-top:18px;padding:18px;border-radius:16px;background:#edf9f6;color:#176b60;font-weight:900;line-height:1.8}.hidden{display:none}.writing{width:100%;min-height:110px;border:1px solid #dfe5ef;border-radius:13px;padding:12px;font:inherit}@media(max-width:650px){.hero{border-radius:20px;padding:22px 18px}}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="index.html">الرئيسية</a><a href="course.html">المناهج</a><a href="language-courses.html">الكورسات</a><a href="annual-revision.html" aria-current="page">🧠 المراجعة السنوية</a></nav><div class="hm-tools"><a class="hm-student" href="student-profile.html" aria-label="حساب الطالب">👨‍🎓</a></div></header><main><section class="hero"><h1 id="title">مراجعة الاستعداد</h1><p id="subtitle">إعادة تثبيت أهم ما تم دراسته قبل الانتقال إلى الصف التالي.</p></section><section class="panel"><div class="status" id="status">جاري تحميل بنك المراجعة...</div><div id="actions"></div><div id="quiz" class="quiz hidden"></div><div id="result"></div><a class="btn back" href="annual-revision.html">العودة إلى المراجعة السنوية</a></section></main><script>(async()=>{const p=new URLSearchParams(location.search),g=Number(p.get('target')),run=p.get('run')==='1';const map={4:3,5:5,6:6,8:8,9:9};const title={4:'مراجعة الاستعداد للصف الرابع الابتدائي',5:'مراجعة الاستعداد للصف الخامس الابتدائي',6:'مراجعة الاستعداد للصف السادس الابتدائي',7:'مراجعة الاستعداد للصف الأول الإعدادي',8:'مراجعة الاستعداد للصف الثاني الإعدادي',9:'مراجعة الاستعداد للصف الثالث الإعدادي'};const t=document.getElementById('title'),s=document.getElementById('status'),a=document.getElementById('actions'),qz=document.getElementById('quiz'),res=document.getElementById('result');t.textContent=title[g]||'مراجعة الاستعداد';if(!map[g]){s.textContent='هذه المراجعة غير منشورة بعد.';return}try{const r=await fetch('data/reviews/grade-'+map[g]+'/review-content.json',{cache:'no-store'});if(!r.ok)throw new Error('missing');let d=await r.json();while(d&&d.content&&typeof d.content==='string'){d=JSON.parse(d.content)}const diagnostic=d.diagnostic?.questions||[];const final=d.finalAssessment?.questions||d.finalReadiness?.questions||[];s.textContent='المحتوى جاهز: تشخيص '+diagnostic.length+' سؤالًا، واختبار جاهزية '+final.length+' سؤالًا.';if(!run){const b=document.createElement('button');b.className='btn';b.textContent='بدء المراجعة';b.onclick=()=>location.href='annual-revision-stage.html?target='+g+'&run=1';a.appendChild(b);return}let questions=diagnostic.map(x=>({...x,_stage:'التشخيص'}));let index=0,score=0;function render(){if(index>=questions.length){qz.classList.add('hidden');res.innerHTML='<div class="result">انتهى التشخيص. النتيجة: '+score+' / '+questions.length+' ('+Math.round(score/questions.length*100)+'%).<br>تم تحميل بنك المراجعة بنجاح ويمكن متابعة المراجعة من خلال إعادة الاختبار أو العودة للصفحة السابقة.</div>';const b=document.createElement('button');b.className='btn';b.textContent='إعادة التشخيص';b.onclick=()=>{index=0;score=0;res.innerHTML='';render()};a.innerHTML='';a.appendChild(b);return}const x=questions[index];let opts=(x.options||[]).map((text,i)=>({text,i}));for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}qz.classList.remove('hidden');qz.innerHTML='<div class="q"><h3>سؤال '+(index+1)+' من '+questions.length+'</h3><p><strong>'+x.q+'</strong></p>'+opts.map(o=>'<label class="option"><input type="radio" name="ans" value="'+o.i+'"> '+o.text+'</label>').join('')+'<button class="btn" id="next">'+(index===questions.length-1?'إنهاء التشخيص':'التالي')+'</button></div>';document.getElementById('next').onclick=()=>{const v=document.querySelector('input[name="ans"]:checked');if(!v){alert('اختر إجابة أولًا');return}if(Number(v.value)===Number(x.answer))score++;index++;render()}}render()}catch(e){s.textContent='تعذر تحميل بنك المراجعة حاليًا. لم يتم تغيير أي صفحة أخرى.'}})();</script><script src="scripts/brand.js?v=20260831-revision-stage-v3"></script></body></html>
