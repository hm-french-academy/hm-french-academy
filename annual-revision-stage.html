<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14264a"><title>HM Academy | مراجعة الاستعداد</title><link rel="stylesheet" href="css/premium-shell.css?v=20260831-revision-stage"><style>main{max-width:1000px;margin:auto;padding:24px 16px 60px}.hero{background:linear-gradient(135deg,#14264a,#315fc8);color:#fff;border-radius:24px;padding:26px;margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:clamp(25px,5vw,40px)}.hero p{margin:0;line-height:1.9}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(20,38,74,.07)}.status{padding:14px;border-radius:14px;background:#f7faff;color:#52627a;line-height:1.8}.btn{display:inline-block;margin-top:16px;padding:12px 18px;border-radius:12px;background:#315fc8;color:#fff;text-decoration:none;font-weight:900}.back{margin-right:8px;background:#eef2f7;color:#14264a}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="index.html">الرئيسية</a><a href="course.html">المناهج</a><a href="language-courses.html">الكورسات</a><a href="annual-revision.html" aria-current="page">🧠 المراجعة السنوية</a></nav><div class="hm-tools"><a class="hm-student" href="student-profile.html" aria-label="حساب الطالب">👨‍🎓</a></div></header><main><section class="hero"><h1 id="title">مراجعة الاستعداد</h1><p id="subtitle">إعادة تثبيت أهم ما تم دراسته قبل الانتقال إلى الصف التالي.</p></section><section class="panel"><div class="status" id="status">جاري تحميل بنك المراجعة...</div><a class="btn" id="start" href="#" style="display:none">بدء المراجعة</a><a class="btn back" href="annual-revision.html">العودة إلى المراجعة السنوية</a></section></main><script>(async()=>{const p=new URLSearchParams(location.search),g=Number(p.get('target'));const map={4:3,5:5,6:6,8:8,9:9};const title={4:'مراجعة الاستعداد للصف الرابع الابتدائي',5:'مراجعة الاستعداد للصف الخامس الابتدائي',6:'مراجعة الاستعداد للصف السادس الابتدائي',7:'مراجعة الاستعداد للصف الأول الإعدادي',8:'مراجعة الاستعداد للصف الثاني الإعدادي',9:'مراجعة الاستعداد للصف الثالث الإعدادي'};document.getElementById('title').textContent=title[g]||'مراجعة الاستعداد';if(!map[g]){document.getElementById('status').textContent='هذه المراجعة غير منشورة بعد. سيتم إتاحتها عند اعتماد محتوى الصف السابق، ولن يتم توجيه الطالب إلى مراجعة صف آخر بالخطأ. ';return}try{const r=await fetch('data/reviews/grade-'+map[g]+'/review-content.json',{cache:'no-store'});if(!r.ok)throw new Error();const d=await r.json();const qs=(d.diagnostic?.questions||[]).length;const fs=(d.finalAssessment?.questions||d.finalReadiness?.questions||[]).length;document.getElementById('status').textContent='المحتوى جاهز: تشخيص '+qs+' سؤالًا، واختبار جاهزية '+fs+' سؤالًا. المسار مصمم لمراجعة الصف السابق استعدادًا للصف التالي.';const start=document.getElementById('start');start.href=g===4?'revision-grade4.html':g===8?'revision-dashboard.html':'#';if(start.getAttribute('href')!=='#')start.style.display='inline-block';}catch(e){document.getElementById('status').textContent='تعذر تحميل بنك المراجعة حاليًا.'}})();</script><script src="scripts/brand.js?v=20260831-revision-stage"></script></body></html>
