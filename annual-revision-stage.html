<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14264a"><title>HM Academy | مراجعة الاستعداد</title><link rel="stylesheet" href="css/premium-shell.css?v=20260831-revision-stage-v4"><style>main{max-width:1000px;margin:auto;padding:24px 16px 60px}.hero{background:linear-gradient(135deg,#14264a,#315fc8);color:#fff;border-radius:24px;padding:26px;margin-bottom:18px}.hero h1{margin:0 0 8px}.hero p{line-height:1.9}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:22px}.status{padding:14px;border-radius:14px;background:#f7faff;color:#52627a;line-height:1.8}.btn{display:inline-block;margin:8px 6px 0 0;padding:12px 18px;border:0;border-radius:12px;background:#315fc8;color:#fff;text-decoration:none;font-weight:900;cursor:pointer}.back{background:#eef2f7;color:#14264a}.q{padding:18px 0;border-top:1px solid #e7ebf2}.option{display:block;width:100%;text-align:right;background:#fff;border:1px solid #dfe5ef;border-radius:13px;padding:12px;margin:8px 0;cursor:pointer}.result{margin-top:18px;padding:18px;border-radius:16px;background:#edf9f6;color:#176b60;font-weight:900;line-height:1.8}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="index.html">الرئيسية</a><a href="course.html">المناهج</a><a href="language-courses.html">الكورسات</a><a href="annual-revision.html">🧠 المراجعة السنوية</a></nav><div class="hm-tools"><a class="hm-student" href="student-profile.html">👨‍🎓</a></div></header><main><section class="hero"><h1 id="title">مراجعة الاستعداد</h1><p>مراجعة ما تم دراسته قبل الانتقال إلى الصف التالي.</p></section><section class="panel"><div class="status" id="status">جاري تحميل بنك المراجعة...</div><div id="actions"></div><div id="quiz"></div><div id="result"></div><a class="btn back" href="annual-revision.html">العودة إلى المراجعة السنوية</a></section></main><script>(async()=>{const g=Number(new URLSearchParams(location.search).get('target'));const map={4:3,5:5,6:6,8:8,9:9};const titles={4:'مراجعة الاستعداد للصف الرابع الابتدائي',5:'مراجعة الاستعداد للصف الخامس الابتدائي',6:'مراجعة الاستعداد للصف السادس الابتدائي',7:'مراجعة الاستعداد للصف الأول الإعدادي',8:'مراجعة الاستعداد للصف الثاني الإعدادي',9:'مراجعة الاستعداد للصف الثالث الإعدادي'};const T=document.getElementById('title'),S=document.getElementById('status'),A=document.getElementById('actions'),Q=document.getElementById('quiz'),R=document.getElementById('result');T.textContent=titles[g]||'مراجعة الاستعداد';if(!map[g]){S.textContent='هذه المراجعة غير منشورة بعد.';return}const urls=['https://hm-french-academy.github.io/hm-french-academy/data/reviews/grade-'+map[g]+'/review-content.json?v=20260831','data/reviews/grade-'+map[g]+'/review-content.json?v=20260831'];let d=null,last='';for(const u of urls){try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);d=await r.json();for(let i=0;i<4&&d&&typeof d.content==='string';i++)d=JSON.parse(d.content);if(d&&d.diagnostic){break}}catch(e){last=e.message}}if(!d||!d.diagnostic){S.innerHTML='⚠️ تعذر تحميل بنك المراجعة.';return}const diag=d.diagnostic.questions||[],fin=d.finalAssessment?.questions||d.finalReadiness?.questions||[];S.textContent='تم تحميل بنك المراجعة بنجاح: '+diag.length+' سؤالًا تشخيصيًا و'+fin.length+' سؤالًا للجاهزية.';let bank=diag,idx=0,score=0;function render(){if(idx>=bank.length){Q.innerHTML='';R.innerHTML='<div class="result">✅ انتهى الاختبار<br>النتيجة: '+score+' / '+bank.length+' ('+Math.round(score/bank.length*100)+'%)</div>';A.innerHTML='';if(fin.length){const b=document.createElement('button');b.className='btn';b.textContent='🏆 اختبار الجاهزية';b.onclick=()=>{bank=fin;idx=0;score=0;R.innerHTML='';render()};A.appendChild(b)}const x=document.createElement('button');x.className='btn';x.textContent='إعادة الاختبار';x.onclick=()=>{bank=diag;idx=0;score=0;R.innerHTML='';render()};A.appendChild(x);return}const q=bank[idx];let opts=(q.options||[]).map((text,i)=>({text,i}));for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}Q.innerHTML='<article class="q"><h3>سؤال '+(idx+1)+' من '+bank.length+'</h3><p><strong>'+q.q+'</strong></p>'+opts.map(o=>'<label class="option"><input type="radio" name="answer" value="'+o.i+'"> '+o.text+'</label>').join('')+'<button class="btn" id="next">'+(idx===bank.length-1?'إنهاء':'التالي')+'</button></article>';document.getElementById('next').onclick=()=>{const v=document.querySelector('input[name="answer"]:checked');if(!v){alert('اختر إجابة أولًا');return}if(Number(v.value)===Number(q.answer))score++;idx++;render()}}const start=document.createElement('button');start.className='btn';start.textContent='🎯 بدء التشخيص';start.onclick=()=>{A.innerHTML='';render()};A.appendChild(start)})().catch(()=>{document.getElementById('status').textContent='⚠️ حدث خطأ أثناء تحميل بنك المراجعة.'});</script><script src="scripts/brand.js?v=20260831-revision-stage-v4"></script></body></html>
