<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎮 Les saisons — ألعاب الصف الرابع</title><style>body{margin:0;font-family:Arial,Cairo,sans-serif;background:linear-gradient(135deg,#eef9ff,#fff7e9,#f5f1ff);color:#17324d;padding:16px}.wrap{max-width:1050px;margin:auto}.hero,.game{background:#fff;border-radius:24px;padding:20px;box-shadow:0 14px 40px #17324d18}.hero{text-align:center;margin-bottom:14px}.hero h1{margin:6px 0;font-size:clamp(26px,6vw,42px)}.small{color:#64748b}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.mode,.option,.item,.next{font:inherit;font-weight:900;cursor:pointer}.mode{border:2px solid #e5eaf1;background:#f8fafc;border-radius:18px;padding:14px 8px}.mode.active{background:#17324d;color:#fff;border-color:#17324d}.q{font-size:20px;font-weight:900}.options,.order{display:grid;gap:10px}.option,.item{border:2px solid #dfe6ee;background:#fff;border-radius:15px;padding:13px;text-align:right}.option.correct,.item.correct{background:#e9f8ed;border-color:#46a35a}.option.wrong,.item.wrong{background:#fff0f0;border-color:#dc5a5a}.option:disabled{cursor:default}.feedback{margin-top:14px;padding:12px;border-radius:14px;font-weight:900;background:#f4f7fb}.next{border:0;background:#17324d;color:#fff;border-radius:13px;padding:12px 18px;margin-top:12px}.score{text-align:center;font-weight:900;margin-bottom:14px}.item.selected{border-color:#2563eb;background:#eef5ff}.order-note{margin:10px 0;color:#64748b}@media(max-width:700px){.modes{grid-template-columns:repeat(2,1fr)}body{padding:10px}}</style></head><body><main class="wrap"><section class="hero"><div>🎮 HM Game Studio · الصف الرابع الابتدائي · الدرس الأول</div><h1>Les saisons</h1><p class="small">كل لعبة مستقلة، واختيار واحد فقط يكون مفعّلًا في كل مرة. الإجابات موزعة عشوائيًا وليست ثابتة في الاختيار الأول.</p></section><nav id="modes" class="modes" aria-label="أنواع الألعاب"></nav><section id="game" class="game"></section></main><script>(()=>{'use strict';const seasons=[{fr:'le printemps',ar:'الربيع',emoji:'🌸'},{fr:"l'été",ar:'الصيف',emoji:'☀️'},{fr:"l'automne",ar:'الخريف',emoji:'🍂'},{fr:"l'hiver",ar:'الشتاء',emoji:'❄️'}],modes=[['race','🏁 سباق الفصول'],['who','🕵️ من أنا؟'],['order','🔢 رتب الفصول'],['choose','🎯 اختر الفصل']];let mode='race',q=0,score=0,locked=false;const M=document.getElementById('modes'),G=document.getElementById('game');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function setMode(m){mode=m;q=0;score=0;locked=false;M.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));render()}function finish(){G.innerHTML='<div style="text-align:center"><h2>🎉 أحسنت!</h2><p class="q">نتيجتك: '+score+' / 4</p><button class="next" id="again">إعادة اللعبة</button></div>';document.getElementById('again').onclick=()=>{q=0;score=0;locked=false;render()}}function mcq(question,correctIndex,choices=seasons.map(s=>s.fr)){const correct=choices[correctIndex],opts=shuffle(choices.map((x,i)=>({x,ok:i===correctIndex})));G.innerHTML='<div class="score">النتيجة: '+score+' / '+q+'</div><p class="q">'+esc(question)+'</p><div class="options">'+opts.map(o=>'<button type="button" class="option" data-ok="'+(o.ok?'1':'0')+'">'+esc(o.x)+'</button>').join('')+'</div><div id="fb" class="feedback">اختر إجابتك.</div><button id="next" class="next" style="display:none">السؤال التالي</button>';const bs=[...G.querySelectorAll('.option')],fb=document.getElementById('fb'),next=document.getElementById('next');bs.forEach(b=>b.onclick=()=>{if(locked)return;locked=true;bs.forEach(x=>x.disabled=true);if(b.dataset.ok==='1'){b.classList.add('correct');score++;fb.innerHTML='✅ إجابة صحيحة!'}else{b.classList.add('wrong');bs.find(x=>x.dataset.ok==='1').classList.add('correct');fb.innerHTML='❌ الإجابة الصحيحة: <b>'+esc(correct)+'</b>'}next.style.display='inline-block'});next.onclick=()=>{q++;locked=false;q>=4?finish():render()}}function race(){let s=seasons[q];mcq('أي فصل هو: '+s.emoji+' '+s.ar+'؟',q)}function who(){const data=[['أنا فصل تتساقط فيه الأوراق. 🍂',2],['أنا فصل يكون فيه الجو باردًا جدًا. ❄️',3],['أنا فصل تزهر فيه النباتات. 🌸',0],['أنا فصل يكون فيه الجو حارًا. ☀️',1]];mcq(data[q][0],data[q][1])}function choose(){const data=[['Il fait chaud. ☀️',1],['Il fait froid. ❄️',3],['Les fleurs poussent. 🌸',0],['Les feuilles tombent. 🍂',2]];mcq(data[q][0],data[q][1])}function orderGame(){const display=shuffle(seasons);G.innerHTML='<div class="score">رتّب الفصول ترتيبًا صحيحًا من الربيع إلى الشتاء.</div><p class="order-note">اضغط على العناصر بالترتيب: 1 ثم 2 ثم 3 ثم 4.</p><div class="order">'+display.map(s=>'<button type="button" class="item" data-fr="'+esc(s.fr)+'">'+s.emoji+' '+s.fr+'</button>').join('')+'</div><div id="fb" class="feedback">لم يتم اختيار أي فصل بعد.</div><button id="check" class="next">تحقق من الترتيب</button>';let picked=[];const items=[...G.querySelectorAll('.item')];items.forEach(b=>b.onclick=()=>{if(b.classList.contains('selected')){b.classList.remove('selected');picked=picked.filter(x=>x!==b.dataset.fr)}else{b.classList.add('selected');picked.push(b.dataset.fr)}document.getElementById('fb').textContent=picked.length?'الترتيب الحالي: '+picked.join(' ← '):'لم يتم اختيار أي فصل بعد.'});document.getElementById('check').onclick=()=>{const target=seasons.map(s=>s.fr),ok=picked.length===4&&picked.every((x,i)=>x===target[i]);const fb=document.getElementById('fb');items.forEach(b=>b.classList.remove('wrong'));if(ok){items.forEach(b=>b.classList.add('correct'));score=4;fb.innerHTML='✅ ممتاز! الترتيب صحيح.';document.getElementById('check').style.display='none'}else{picked.forEach((x,i)=>{if(x!==target[i])items.find(b=>b.dataset.fr===x)?.classList.add('wrong')});fb.innerHTML='❌ الترتيب غير صحيح. يمكنك تغيير اختيارك ثم المحاولة مرة أخرى.'}}}function render(){if(q>=4&&mode!=='order'){finish();return}if(mode==='race')race();else if(mode==='who')who();else if(mode==='choose')choose();else orderGame()}M.innerHTML=modes.map(([id,label])=>'<button type="button" class="mode '+(id===mode?'active':'')+'" data-mode="'+id+'">'+label+'</button>').join('');M.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));setMode('race')})()</script></body></html>
