<style>
:root{--ink:#20324f;--muted:#63748b;--line:#e1e9f2;--blue:#3267c8;--mint:#dff7ed;--gold:#fff2c8}
*{box-sizing:border-box}body{margin:0;background:#f3f8fb;color:var(--ink);font-family:Arial,Cairo,sans-serif}.wrap{max-width:1080px;margin:auto;padding:12px}.top,.hero,.page{background:#fff;border-radius:22px;padding:18px;margin-bottom:12px;box-shadow:0 8px 25px #20324f0b}.top{display:flex;justify-content:space-between;align-items:center}.top a{font-weight:900;color:var(--blue);text-decoration:none}.hero{background:linear-gradient(120deg,#d7f4ff,#e8e5ff 54%,#fff0c8);padding:24px}.hero h1{font-size:clamp(30px,6vw,48px);margin:9px 0}.hero p{line-height:1.9}.tag{display:inline-block;background:#3267c8;color:white;padding:6px 12px;border-radius:99px;font-weight:900}.journey{display:flex;gap:7px;overflow:auto;position:sticky;top:0;background:#f3f8fb;padding:9px 2px;z-index:5}.step,.choice,.btn,.gameTab{border:0;border-radius:14px;padding:10px 14px;font-weight:900;cursor:pointer}.step{background:#e7edf5;white-space:nowrap;color:var(--ink)}.step.active,.btn{background:#263f69;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.card{border:2px solid #edf1f6;border-radius:19px;padding:16px;background:#fff;min-width:0}.fr{direction:ltr;text-align:left;font-size:22px;font-weight:900}.muted{color:var(--muted);font-weight:700;line-height:1.9}.choice{display:block;width:100%;margin:7px 0;background:#fff;border:2px solid var(--line);text-align:right;color:var(--ink)}.choice.correct{background:#e2f6e6;border-color:#52a96b}.choice.wrong{background:#ffebe7;border-color:#d76b58}.feedback{min-height:24px;font-weight:900}.detail,.review{margin-top:14px;padding:16px;border-radius:18px;background:#f8fbfd;border:1px solid var(--line)}.clock{width:180px;height:180px;border:9px solid #3267c8;border-radius:50%;position:relative;margin:8px auto;background:radial-gradient(circle,#fff 0 66%,#eff5ff 67%)}.clock:before{content:"";position:absolute;width:5px;height:58px;background:#263f69;left:calc(50% - 2px);top:28px;border-radius:6px;transform-origin:bottom;transform:rotate(var(--minute,0deg))}.clock:after{content:"";position:absolute;width:7px;height:43px;background:#e49b28;left:calc(50% - 3px);top:43px;border-radius:6px;transform-origin:bottom;transform:rotate(var(--hour,30deg))}.clocknum{position:absolute;font-weight:900;font-size:15px;transform:translate(-50%,-50%)}.visual{background:linear-gradient(135deg,#eff8ff,#fff8e7);border-radius:18px;padding:14px;text-align:center}.time{font-size:26px;font-weight:900;direction:ltr}.memoryGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.memoryCard{min-height:72px;border:2px solid var(--line);border-radius:14px;background:#fff;font-weight:900}.open{background:var(--mint)}.gameTabs{display:flex;gap:8px;flex-wrap:wrap}.gameTab{background:#edf2f8;color:var(--ink)}.gameTab.active{background:#263f69;color:white}.score{text-align:center;font-size:20px;font-weight:900;margin:10px}.pill{display:inline-block;background:#edf5ff;padding:6px 10px;border-radius:99px;font-weight:900;margin:3px}.example{padding:13px;border-radius:15px;background:#f8fbfd;margin-top:8px;line-height:1.9}.btn{display:inline-block;margin:5px 0;text-decoration:none}.small{font-size:13px;color:var(--muted)}@media(max-width:600px){.wrap{padding:8px}.top,.hero,.page{padding:14px}.memoryGrid{grid-template-columns:repeat(2,1fr)}}
</style>

<body data-hm-grade-theme="primary-4">
<main class="wrap">

<section class="hero"><span class="tag">Le français · 4e année · Unité 2</span><h1>🕐 L'heure · الساعة</h1><p>الدرس الثالث — تعلّم قراءة الساعة بنظام 12 ساعة، والسؤال عن الوقت والإجابة عنه، واستخدام <span class="fr">midi</span> و<span class="fr">minuit</span> والربع والنصف إلا الربع.</p></section>
<nav id="nav" class="journey" aria-label="أقسام الدرس"></nav>
<section id="page" class="page" aria-live="polite"></section>
</main>
<script>
(function(){
const steps=[['start','🚀 البداية'],['vocab','🖼️ المفردات'],['understand','🧠 افهم'],['rules','📘 القاعدة'],['interact','🤝 تفاعل'],['listen','🎧 اسمع وانطق'],['practice','✍️ التدريب'],['media','🎬 شرح بصري'],['games','🎮 الألعاب'],['assessment','🏆 التقييم'],['review','🧠 المراجعة'],['after','📚 بعد الرحلة']];
const nav=document.getElementById('nav'),page=document.getElementById('page');
nav.innerHTML=steps.map((s,i)=>'<button class="step" data-s="'+s[0]+'">'+(i+1)+'. '+s[1]+'</button>').join('');
const words=[['une heure','ساعة واحدة'],['deux heures','الساعتان / الساعة الثانية'],['midi','الظهر — 12:00 ظهرًا'],['minuit','منتصف الليل — 12:00 ليلًا'],['et quart','والربع — :15'],['et demie','والنصف — :30'],['moins le quart','إلا ربع — :45'],['Quelle heure est-il ?','كم الساعة؟'],['Il est…','الساعة…'],['du matin','صباحًا'],['de l’après-midi','بعد الظهر'],['du soir','مساءً']];
const examples=[
{t:'1:00',f:'Il est une heure.',a:'الساعة الواحدة.',h:1,m:0},
{t:'2:00',f:'Il est deux heures.',a:'الساعة الثانية.',h:2,m:0},
{t:'3:15',f:'Il est trois heures et quart.',a:'الساعة الثالثة والربع.',h:3,m:15},
{t:'4:30',f:'Il est quatre heures et demie.',a:'الساعة الرابعة والنصف.',h:4,m:30},
{t:'5:45',f:'Il est six heures moins le quart.',a:'الساعة السادسة إلا ربعًا (5:45).',h:5,m:45},
{t:'12:00',f:'Il est midi.',a:'الساعة الثانية عشرة ظهرًا.',h:12,m:0},
{t:'00:00',f:'Il est minuit.',a:'الساعة الثانية عشرة منتصف الليل.',h:12,m:0}
];
function head(n,title,desc){return '<span class="tag">'+n+'</span><h2>'+title+'</h2><p class="muted">'+desc+'</p>'}
function choices(q,opts,ans){return '<article class="card"><h3>'+q+'</h3>'+opts.map(o=>'<button class="choice" data-answer="'+o.replace(/"/g,'&quot;')+'" data-correct="'+ans.replace(/"/g,'&quot;')+'">'+o+'</button>').join('')+'<p class="feedback"></p></article>'}
function clockFace(e,showAnswer=true){let nums='';for(let i=1;i<=12;i++){const angle=(i*30-90)*Math.PI/180,x=50+37*Math.cos(angle),y=50+37*Math.sin(angle);nums+='<span class="clocknum" style="left:'+x+'%;top:'+y+'%">'+i+'</span>'}return '<div class="visual"><div class="clock" style="--minute:'+(e.m*6)+'deg;--hour:'+((e.h%12)*30+e.m*.5)+'deg">'+nums+'</div>'+(showAnswer?'<div class="time">'+e.t+'</div><div class="fr">'+e.f+'</div><p>'+e.a+'</p><button class="btn" data-say="'+e.f.replace(/"/g,'&quot;')+'">🔊 استمع إلى الجملة</button>':'')+'</div>'}
function clockCard(e){return '<article class="card">'+clockFace(e,true)+'</article>'}
let game='clock',score=0,round=0,deck=[],memory=[],opened=[],matched=[];
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
function resetDeck(){deck=shuffle([0,1,2,3,4,5,6]);round=0}
function games(){return head('09','مركز الألعاب','ألعاب متنوعة على قراءة الوقت وصياغة الجملة؛ لا تعتمد على حفظ معنى المفردة فقط.')+'<div class="gameTabs"><button class="gameTab active" data-game="clock">🕰️ اقرأ الساعة</button><button class="gameTab" data-game="phrase">🧩 أكمل العبارة</button><button class="gameTab" data-game="memory">🧠 ذاكرة الوقت</button></div><div id="gamePanel" class="review"></div>'}
function renderGame(){const p=document.getElementById('gamePanel');if(!p)return;
if(game==='clock'){if(!deck.length||round>=deck.length)resetDeck();const e=examples[deck[round]];const opts=shuffle([e.f,examples[(deck[round]+1)%7].f,examples[(deck[round]+3)%7].f]);p.innerHTML='<div class="score">النقاط: '+score+' · الجولة '+(round+1)+' / '+deck.length+'</div><article class="card">'+clockFace(e,false)+'</article><h3>اختر الجملة الفرنسية المكتوبة بالحروف التي تعبّر عن الوقت:</h3>'+opts.map((x,i)=>'<button class="choice" data-game-answer="'+x.replace(/"/g,'&quot;')+'" data-game-correct="'+e.f.replace(/"/g,'&quot;')+'"><b>'+['أ','ب','ج'][i]+')</b> <span class="fr">'+x+'</span></button>').join('')+'<p class="feedback" id="gameFeedback"></p><button class="btn" id="nextGame">السؤال التالي ←</button>'}
else if(game==='phrase'){if(!deck.length||round>=deck.length)resetDeck();const e=examples[deck[round]];const opts=shuffle([e.f,examples[(deck[round]+2)%7].f,examples[(deck[round]+4)%7].f]);p.innerHTML='<div class="score">النقاط: '+score+' · الجولة '+(round+1)+' / '+deck.length+'</div><div class="visual"><div class="time">'+e.t+'</div><p>اختر الجملة الفرنسية المناسبة:</p></div>'+opts.map(x=>'<button class="choice" data-game-answer="'+x.replace(/"/g,'&quot;')+'" data-game-correct="'+e.f.replace(/"/g,'&quot;')+'">'+x+'</button>').join('')+'<p class="feedback" id="gameFeedback"></p><button class="btn" id="nextGame">السؤال التالي ←</button>'}
else{if(!memory.length){const ids=[0,2,3,4,5,6];memory=shuffle([...ids.map(i=>({key:String(i),text:examples[i].t})),...ids.map(i=>({key:String(i),text:examples[i].f}))]);}p.innerHTML='<div class="score">مطابقات: '+matched.length/2+' / 6</div><div class="memoryGrid">'+memory.map((c,i)=>'<button class="memoryCard '+(opened.includes(i)||matched.includes(i)?'open':'')+'" data-mi="'+i+'">'+(opened.includes(i)||matched.includes(i)?c.text:'؟')+'</button>').join('')+'</div><p class="feedback">طابق الوقت الرقمي مع الجملة الفرنسية.</p>'}}
function render(s){nav.querySelectorAll('.step').forEach(b=>b.classList.toggle('active',b.dataset.s===s));let h='';
if(s==='start')h=head('01','ابدأ رحلة الساعة','في هذا الدرس ستتعلم قراءة الوقت على ساعة عقارب، ثم تقول الوقت بالفرنسية وتختبر فهمك في ألعاب وتقييم مستقل.')+'<div class="grid"><article class="card"><div class="visual"><div style="font-size:64px">🕐</div><h3>سؤالنا الأساسي</h3><div class="fr">Quelle heure est-il ?</div><p>كم الساعة؟</p></div></article><article class="card"><h3>🎯 أهداف الدرس</h3><ul><li>قراءة الساعات من 1 إلى 12.</li><li>استخدام <span class="fr">midi</span> و<span class="fr">minuit</span>.</li><li>التعبير عن والربع والنصف وإلا ربعًا.</li><li>الإجابة بجملة فرنسية كاملة.</li></ul><button class="btn" data-go="vocab">ابدأ بالمفردات ←</button></article></div>';
if(s==='vocab')h=head('02','مفردات الساعة','اضغط على زر الاستماع لسماع التعبير الفرنسي؛ اقرأ المعنى العربي في البطاقة نفسها.')+'<div class="grid">'+words.map(w=>'<article class="card"><div class="fr">'+w[0]+'</div><p>'+w[1]+'</p><button class="btn" data-say="'+w[0].replace(/"/g,'&quot;')+'">🔊 استمع</button></article>').join('')+'</div>';
if(s==='understand')h=head('03','افهم الوقت بالصور','لاحظ أن التعبير الفرنسي يختلف حسب الدقائق: في الدقيقة 15 نقول et quart، وفي الدقيقة 30 نقول et demie، وفي الدقيقة 45 نقول moins le quart مع الساعة التالية.')+'<div class="grid">'+examples.map(clockCard).join('')+'</div>';
if(s==='rules')h=head('04','القاعدة ببساطة','احفظ تركيب السؤال والإجابة، ثم لاحظ طريقة التعبير عن الأجزاء الشائعة من الساعة.')+'<div class="grid"><article class="card"><h3>السؤال</h3><div class="fr">Quelle heure est-il ?</div><p>كم الساعة؟</p><div class="example"><div class="fr">Il est trois heures.</div>الساعة الثالثة.</div></article><article class="card"><h3>والربع — :15</h3><div class="fr">Il est trois heures et quart.</div><p>الساعة الثالثة والربع (3:15).</p></article><article class="card"><h3>والنصف — :30</h3><div class="fr">Il est quatre heures et demie.</div><p>الساعة الرابعة والنصف (4:30).</p></article><article class="card"><h3>إلا ربعًا — :45</h3><div class="fr">Il est six heures moins le quart.</div><p>الساعة السادسة إلا ربعًا، أي 5:45. نذكر الساعة القادمة.</p></article><article class="card"><h3>الظهر</h3><div class="fr">Il est midi.</div><p>12:00 ظهرًا.</p></article><article class="card"><h3>منتصف الليل</h3><div class="fr">Il est minuit.</div><p>00:00 أو 12:00 ليلًا.</p></article></div><div class="review"><b>ملاحظة مهمة:</b> في هذا الدرس نستخدم نظام 12 ساعة؛ أضف <span class="fr">du matin</span> للصباح، و<span class="fr">de l’après-midi</span> لما بعد الظهر، و<span class="fr">du soir</span> للمساء عند الحاجة.</div>';
if(s==='interact')h=head('05','تفاعل واختبر فهمك','اختر الإجابة ثم اقرأ سبب الاختيار.')+'<div class="grid">'+choices('كيف نقول الساعة الواحدة؟',['Il est une heure.','Il est un heure.','Il est midi.'],'Il est une heure.')+choices('ما معنى midi؟',['منتصف الليل','الظهر','الساعة والنصف'],'الظهر')+choices('3:15 تساوي:',['trois heures et demie','trois heures et quart','quatre heures moins le quart'],'trois heures et quart')+choices('كيف نقول 5:45؟',['Il est cinq heures et quart.','Il est cinq heures et demie.','Il est six heures moins le quart.'],'Il est six heures moins le quart.')+'</div>';
if(s==='listen')h=head('06','اسمع وانطق','استمع إلى الجمل كاملة وكررها بصوت واضح. إذا لم يصدر صوت، تأكد من أن صوت الجهاز يعمل.')+'<div class="grid">'+examples.map(e=>'<article class="card"><div class="time">'+e.t+'</div><div class="fr">'+e.f+'</div><p>'+e.a+'</p><button class="btn" data-say="'+e.f.replace(/"/g,'&quot;')+'">🔊 استمع للنطق الفرنسي</button></article>').join('')+'</div>';
if(s==='practice')h=head('07','التدريب','تدريب مستقل عن التقييم: اقرأ الوقت ثم اختر الجملة أو التعبير الصحيح.')+'<div class="grid">'+choices('السؤال الصحيح عن الساعة هو:',['Quel âge as-tu ?','Quelle heure est-il ?','Comment tu t’appelles ?'],'Quelle heure est-il ?')+choices('4:30 بالفرنسية:',['Il est quatre heures et demie.','Il est quatre heures et quart.','Il est cinq heures moins le quart.'],'Il est quatre heures et demie.')+choices('12:00 ليلًا:',['midi','minuit','une heure'],'minuit')+choices('ما التعبير الذي يعني «إلا ربعًا»؟',['et quart','et demie','moins le quart'],'moins le quart')+'</div>';
if(s==='media')h=head('08','فيديو شرح الساعة بالفرنسية','شاهد فيديو تعليمي مناسب للأطفال يشرح قراءة الساعة، والربع، والنصف، وإلا ربعًا. بعد المشاهدة انتقل إلى الألعاب والتقييم.')+'<article class="card"><div class="visual"><div style="font-size:54px">🎬 🕐</div><h3>Primaire — apprendre à lire l’heure</h3><p>فيديو من قناة Les cours de Sandra، يشرح قراءة الساعة والتعبيرات <span class="fr">et quart</span> و<span class="fr">et demie</span> و<span class="fr">moins le quart</span>.</p><div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:14px;background:#e8eef6"><iframe src="https://www.youtube-nocookie.com/embed/B9yImmJlDs4" title="Apprendre à lire l’heure — et quart, et demie, moins le quart" style="position:absolute;inset:0;width:100%;height:100%;border:0" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div><p><a class="btn" href="https://www.youtube.com/watch?v=B9yImmJlDs4" target="_blank" rel="noopener">▶ مشاهدة الفيديو على YouTube</a></p></div></article><div class="review"><h3>أثناء المشاهدة ركّز على:</h3><p><span class="pill">:15 — et quart</span><span class="pill">:30 — et demie</span><span class="pill">:45 — moins le quart</span></p></div>';
if(s==='games')h=games();
if(s==='assessment')h=head('10','التقييم النهائي','أسئلة التقييم مختلفة عن أسئلة التدريب. أجب بنفسك قبل مراجعة القاعدة.')+'<div class="grid">'+choices('1) 2:00',['Il est deux heures.','Il est deux heures et quart.','Il est midi.'],'Il est deux heures.')+choices('2) 3:30',['Il est trois heures moins le quart.','Il est trois heures et demie.','Il est quatre heures et quart.'],'Il est trois heures et demie.')+choices('3) 5:45',['Il est six heures moins le quart.','Il est cinq heures et demie.','Il est cinq heures et quart.'],'Il est six heures moins le quart.')+choices('4) الساعة الثانية عشرة ظهرًا',['minuit','midi','et demie'],'midi')+choices('5) «كم الساعة؟»',['Quelle heure est-il ?','Où habites-tu ?','Quel jour sommes-nous ?'],'Quelle heure est-il ?')+'</div>';
if(s==='review')h=head('11','المراجعة الذكية','راجع النقاط الأساسية، ثم ارجع إلى القسم الذي تحتاجه.')+'<div class="grid"><article class="card"><h3>🔹 تركيب الجملة</h3><div class="fr">Il est + heure(s)</div><p>نبدأ الإجابة بـ Il est ثم الوقت.</p></article><article class="card"><h3>🔹 ثلاثة تعبيرات أساسية</h3><p><span class="fr">et quart</span> = والربع</p><p><span class="fr">et demie</span> = والنصف</p><p><span class="fr">moins le quart</span> = إلا ربعًا</p></article><article class="card"><h3>🔹 انتبه</h3><p><span class="fr">midi</span> = الظهر، و<span class="fr">minuit</span> = منتصف الليل.</p></article></div>';
if(s==='after')h=head('12','بعد الرحلة','أحسنت! قبل الانتقال للدرس التالي، تأكد أنك تستطيع قراءة الوقت وكتابته بجملة فرنسية كاملة.')+'<div class="grid"><article class="card"><h3>✅ أتقنت الدرس إذا استطعت:</h3><ul><li>السؤال: Quelle heure est-il ?</li><li>قول الساعة والربع والنصف وإلا ربعًا.</li><li>التمييز بين midi وminuit.</li></ul><button class="btn" data-go="assessment">ابدأ التقييم النهائي ←</button></article><article class="card"><h3>🔁 تحتاج مراجعة؟</h3><p>ارجع إلى «افهم» و«القاعدة» ثم أعد التدريب.</p><button class="btn" data-go="understand">مراجعة الساعة ←</button></article></div>';
page.innerHTML=h;
page.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>render(b.dataset.go));
page.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const ok=b.dataset.answer===b.dataset.correct;b.parentElement.querySelectorAll('.choice').forEach(x=>x.classList.remove('correct','wrong'));b.classList.add(ok?'correct':'wrong');const f=b.parentElement.querySelector('.feedback');if(f)f.textContent=ok?'✅ إجابة صحيحة!':'❌ حاول مرة أخرى، وراجع القاعدة.'});
if(s==='games'){renderGame();page.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{game=b.dataset.game;score=0;round=0;deck=[];memory=[];opened=[];matched=[];page.querySelectorAll('.gameTab').forEach(x=>x.classList.toggle('active',x===b));renderGame()});const gp=document.getElementById('gamePanel');gp.onclick=e=>{const a=e.target.closest('[data-game-answer]');if(a){const f=document.getElementById('gameFeedback');const ok=a.dataset.gameAnswer===a.dataset.gameCorrect;if(ok)score++;if(f)f.textContent=ok?'✅ صحيح!':'❌ الصحيح: '+a.dataset.gameCorrect;gp.querySelectorAll('[data-game-answer]').forEach(x=>x.disabled=true);const sc=gp.querySelector('.score');if(sc)sc.textContent='النقاط: '+score+' · الجولة '+(round+1);return}if(e.target.closest('#nextGame')){round++;if(!deck.length||round>=deck.length)resetDeck();renderGame();return}const m=e.target.closest('[data-mi]');if(m&&!matched.includes(+m.dataset.mi)&&!opened.includes(+m.dataset.mi)){opened.push(+m.dataset.mi);if(opened.length===2){const [x,y]=opened;if(memory[x].key===memory[y].key){matched.push(x,y);opened=[]}else setTimeout(()=>{opened=[];renderGame()},650)}renderGame()}}}
}
if(!window.__HM_G4_L03_SPEECH_BOUND){document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(!b)return;e.preventDefault();e.stopPropagation();const t=b.dataset.say;try{const ss=window.speechSynthesis;if(!ss)return;ss.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;ss.speak(u)}catch(err){}},true);window.__HM_G4_L03_SPEECH_BOUND=true}
nav.onclick=e=>{const b=e.target.closest('[data-s]');if(b)render(b.dataset.s)};
const requested=new URLSearchParams(location.search).get('section');
const valid=steps.some(s=>s[0]===requested);
render(valid?requested:'start');
