y</a></header><section class="hero"><div>Le français · 4e année · Leçon 03</div><h1>L'heure · الساعة</h1><p>Learning Studio مستقل — محتوى الدرس الثالث فقط.</p></section><nav id="nav" class="nav"></nav><section id="page" class="page"></section></main><script>(function(){const root='data/lessons/grade-4/source/4eme_Complet/03_L_heure/';const tabs=[['start','🚀 البداية'],['vocab','🖼️ المفردات'],['under','🧠 افهم'],['interact','🤝 تفاعل'],['talk','💬 المحادثة'],['practice','✍️ التدريب'],['media','🎬 الوسائط'],['games','🎮 الألعاب'],['test','🏆 التقييم'],['after','📚 بعد الرحلة']];const vocab=[['🕐','une heure','ساعة واحدة'],['🕜','une heure et demie','ساعة ونصف'],['🕒','trois heures','الساعة الثالثة'],['🕒','trois heures et quart','الثالثة والربع'],['🕤','trois heures et demie','الثالثة والنصف'],['🕙','dix heures moins le quart','العاشرة إلا ربعًا'],['🕛','midi','الثانية عشرة ظهرًا'],['🌙','minuit','منتصف الليل']];const nav=document.getElementById('nav'),page=document.getElementById('page');nav.innerHTML=tabs.map(t=>'<button class="tab" data-tab="'+t[0]+'">'+t[1]+'</button>').join('');function speak(t){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.8;window.speechSynthesis.speak(u)}function head(n,t,d){return '<span class="tag">'+n+'</span><h2>'+t+'</h2><p class="muted">'+d+'</p>'}function opts(items){return items.map(x=>'<button class="choice" data-ok="'+x[1]+'">'+x[0]+'</button>').join('')}function bind(){page.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));page.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>render(b.dataset.go));page.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const card=b.parentElement;card.querySelectorAll('.choice').forEach(x=>x.disabled=true);const ok=b.dataset.ok==='true';b.classList.add(ok?'ok':'no');const f=card.querySelector('.feedback');if(f)f.textContent=ok?'✅ إجابة صحيحة — أحسنت!':'❌ ليست مناسبة لهذا الموقف. راجع المث ,'Il est midi et quart.']].map(x=>'<article class="card"><div class="big">'+x[0]+'</div>'+opts([[x[1],true],[x[2],false],[x[3],false]])+'<p class="feedback"></p></article>').join('')+'</div>';if(s==='media')h=head('07','الوسائط — الفيديو والمصدر التفاعلي','تم تخصيص مشغل داخل الصفحة لمحتوى الدرس الأصلي. إذا لم يسمح المتصفح بالإطار، افتح المصدر مباشرة.')+'<iframe class="media" src="'+root+'01_interactif_lheure.html" title="الدرس التفاعلي الأصلي — L'heure"></iframe><div class="card"><b>🎬 المصدر الأصلي:</b> 01_interactif_lheure.html<br><br><a class="btn" href="'+root+'01_interactif_lheure.html" target="_blank">فتح المحتوى الأصلي ↗</a></div>';if(s==='games')h=head('08','الألعاب — تحديات الساعة','ألعاب قصيرة مختلفة تقيس قراءة الربع والنصف وإلا ربعًا بدل تكرار نفس السؤال.')+'<div class="grid"><article class="card"><h3>🎯 سباق الربع</h3><div class="big">3:15</div>'+opts([['trois heures et quart',true],['trois heures et demie',false],['quatre heures moins le quart',false]])+'<p class="feedback"></p></article><article class="card"><h3>🎯 تحدي النصف</h3><div class="big">8:30</div>'+opts([['huit heures et demie',true],['huit heures et quart',false],['neuf heures moins le quart',false]])+'<p class="feedback"></p></article><article class="card"><h3>🎯 لغز إلا ربع</h3><div class="big">9:45</div>'+opts([['dix heures moins le quart',true],['neuf heures et quart',false],['neuf heures et demie',false]])+'<p class="feedback"></p></article></div>';if(s==='test')h=head('09','التقييم — المصدر الرسمي','هذه الصفحة منظمة كمسار تقييم، ولا تستبدل المصدر الرسمي بأسئلة مخترعة.');h+=(s==='test'?'<div class="grid"><article class="card"><h3>📝 التقييم المعتمد</h3><p>03_evaluation_lheure.docx</p><a class="btn" href="'+root+'03_evaluation_lheure.docx" target="_blank">فتح التقييم المعتمد</a></article><article class="card"><h3>🏆 الاختبار الإلكتروني</h3><p>04_examen_electronique_lheure.html</p><a class="btn" href="'+root+'04_examen_electronique_lheure.html" target="_blank">فتح الاختبار الإلكتروني</a></artic
