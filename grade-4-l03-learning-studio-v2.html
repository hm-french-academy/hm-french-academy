<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HM Academy | L'heure — الدرس الثالث</title><style>body{margin:0;background:#f4f7fb;color:#20354d;font-family:Arial,sans-serif}.wrap{max-width:1120px;margin:auto;padding:14px}.top,.hero,.page{background:#fff;border-radius:22px;padding:20px;margin-bottom:12px;box-shadow:0 8px 28px #20354d12}.hero{background:linear-gradient(135deg,#e4f6ff,#fff0f3)}.nav{display:flex;gap:7px;overflow:auto;background:#fff;padding:10px;border-radius:18px;position:sticky;top:0;z-index:5}.tab,.btn,.choice{border:0;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer}.tab{background:#edf2f7;white-space:nowrap}.tab.on,.btn{background:#4169e1;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{border:1px solid #dce5ee;border-radius:18px;padding:17px;background:#fff}.icon{height:120px;border-radius:15px;background:linear-gradient(135deg,#edf7ff,#fff3f4);display:grid;place-items:center;font-size:58px}.fr{direction:ltr;text-align:left;font-size:22px;font-weight:900}.muted{color:#65778a;line-height:1.8}.choice{display:block;width:100%;margin:7px 0;background:#fff;border:1px solid #dce5ee;text-align:right}.choice.ok{background:#eaf7ee}.choice.no{background:#fff0f0}.feedback{min-height:22px;font-weight:900}.rule{background:#f7faff;border-right:5px solid #4169e1;border-radius:14px;padding:14px;margin:10px 0;line-height:1.8}.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.hub a{display:block;text-decoration:none;color:#20354d;border:1px solid #dce5ee;border-radius:18px;padding:17px}.hub b{display:block;font-size:18px;margin:6px 0}.video{width:100%;aspect-ratio:16/9;border:0;border-radius:18px;background:#111}@media(max-width:600px){.wrap{padding:8px}.hero,.page{padding:15px}}</style></head><body><main class="wrap"><header class="top"><a href="grade-4.html">← الصف الرابع</a><span>HM Academy · Premium Learning Studio</span></header><section class="hero"><b>Le français · 4e année · Leçon 03</b><h1>L'heure · الساعة</h1><p>من السؤال عن الوقت إلى فهم القاعدة وتطبيقها ومراجعتها.</p></section><nav id="nav" class="nav"></nav><section id="page" class="page"></section></main><script>(function(){const root='data/lessons/grade-4/source/4eme_Complet/03_L_heure/';const tabs=[['start','🚀 البداية'],['vocab','🖼️ المفردات'],['under','🧠 افهم'],['rules','📘 القواعد'],['interact','🤝 تفاعل'],['talk','💬 المحادثة'],['practice','✍️ التدريب'],['media','🎬 الفيديو'],['games','🎮 مركز الألعاب'],['test','🏆 التقييم'],['after','📚 بعد الرحلة']];const nav=document.getElementById('nav'),page=document.getElementById('page');nav.innerHTML=tabs.map(x=>'<button class="tab" data-s="'+x[0]+'">'+x[1]+'</button>').join('');function speak(t){if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}function head(a,b,c){return '<span>'+a+'</span><h2>'+b+'</h2><p class="muted">'+c+'</p>'}function opts(a){return a.map(x=>'<button class="choice" data-ok="'+x[1]+'">'+x[0]+'</button>').join('')}function bind(){page.querySelectorAll('[data-speak]').forEach(x=>x.onclick=()=>speak(x.dataset.speak));page.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>render(x.dataset.go));page.querySelectorAll('.choice').forEach(x=>x.onclick=()=>{const c=x.closest('.card'),ok=x.dataset.ok==='true';c.querySelectorAll('.choice').forEach(y=>y.disabled=true);x.classList.add(ok?'ok':'no');const f=c.querySelector('.feedback');if(f)f.textContent=ok?'✅ صحيح!':'❌ ليست الإجابة المناسبة.'})}function render(s){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.s===s));if(s==='smart'){location.href='grade-4-l03-smart-evaluation.html';return}let h='';if(s==='start')h=head('01','ابدأ الرحلة','مسار Premium متدرج دون تكرار المحتوى.')+'<div class="grid"><article class="card"><div class="icon">🕒</div><h3>هدف الدرس</h3><p>السؤال عن الساعة، الساعة الكاملة، الربع، النصف، إلا ربعًا، وmidi/minuit.</p><button class="btn" data-go="vocab">ابدأ</button></article><article class="card"><div class="icon">🧭</div><h3>المسار</h3><p>مفردات → فهم → قواعد → تطبيق → محادثة → تدريب → فيديو → ألعاب → تقييم → مراجعة.</p></article></div>';if(s==='vocab')h=head('02','المفردات','قاموس مصور للوقت ومعانيه.')+'<div class="grid">'+[['🕐','une heure','ساعة واحدة'],['🕜','une heure et demie','ساعة ونصف'],['🕒','trois heures','الثالثة'],['🕒','trois heures et quart','الثالثة والربع'],['🕞','trois heures et demie','الثالثة والنصف'],['🕙','dix heures moins le quart','العاشرة إلا ربعًا'],['🕛','midi','الظهر'],['🌙','minuit','منتصف الليل']].map(x=>'<article class="card"><div class="icon">'+x[0]+'</div><h3 class="fr">'+x[1]+'</h3><p>'+x[2]+'</p><button class="btn" data-speak="'+x[1]+'">🔊 اسمع</button></article>').join('')+'</div>';if(s==='under')h=head('03','افهم','أمثلة متدرجة تربط الوقت الرقمي بالجملة الفرنسية.')+'<div class="grid">'+[['1:00','Il est une heure.'],['2:00','Il est deux heures.'],['3:15','Il est trois heures et quart.'],['1:30','Il est une heure et demie.'],['3:30','Il est trois heures et demie.'],['9:45','Il est dix heures moins le quart.'],['12:00','Il est midi.'],['00:00','Il est minuit.']].map(x=>'<article class="card"><b>'+x[0]+'</b><h3 class="fr">'+x[1]+'</h3><button class="btn" data-speak="'+x[1]+'">🔊 اسمع</button></article>').join('')+'</div>';if(s==='rules')h=head('04','القواعد','شرح واضح لاستخدام الساعة وصيغة المفرد والجمع وطرق السؤال.')+'<div class="rule"><b>heure / heures</b><br><span class="fr">Il est une heure.</span> ← مفرد.<br><span class="fr">Il est deux heures.</span> ← جمع من ساعتين فأكثر.</div><div class="rule"><b>midi و minuit</b><br><span class="fr">Il est midi. · Il est minuit.</span><br>لا نستخدم heures معهما.</div><div class="rule"><b>الربع والنصف</b><br><span class="fr">et quart</span> = والربع · <span class="fr">et demie</span> = والنصف.</div><div class="rule"><b>إلا ربعًا</b><br><span class="fr">9:45 → Il est dix heures moins le quart.</span></div><div class="rule"><b>طرق السؤال</b><br><span class="fr">Quelle heure est-il ?</span> للسؤال العام.<br><span class="fr">À quelle heure commence le cours ?</span> للسؤال عن موعد.</div>';if(s==='interact')h=head('05','تفاعل وتطبيق','مواقف حقيقية باختيارات منطقية وتصحيح فوري.')+'<div class="grid"><article class="card"><h3>🏫 الحصة 8:30</h3>'+opts([['À huit heures et demie.',true],['À huit heures et quart.',false],['À neuf heures et demie.',false]])+'<p class="feedback"></p></article><article class="card"><h3>🚌 الحافلة 3:15</h3>'+opts([['Il est trois heures et quart.',true],['Il est trois heures et demie.',false],['Il est quatre heures et quart.',false]])+'<p class="feedback"></p></article><article class="card"><h3>⏰ الموعد 9:45</h3>'+opts([['Il est dix heures moins le quart.',true],['Il est neuf heures et demie.',false],['Il est neuf heures et quart.',false]])+'<p class="feedback"></p></article><article class="card"><h3>🍽️ الغداء 12:00</h3>'+opts([['Il est midi.',true],['Il est minuit.',false],['Il est midi et quart.',false]])+'<p class="feedback"></p></article></div>';if(s==='talk')h=head('06','المحادثة','موقف عملي داخل المدرسة، لا إعادة للمفردات.')+'<article class="card">'+[['👧','Quelle heure est-il ?','Il est trois heures et quart.'],['👦','À quelle heure commence le cours ?','À huit heures et demie.'],['👧','Et la pause ?','À dix heures moins le quart.'],['👦','Et le déjeuner ?','À midi.'],['👧','Merci !','De rien !']].map(x=>'<p><b>'+x[0]+' '+x[1]+'</b><br><span class="fr">'+x[2]+'</span> <button class="btn" data-speak="'+x[2]+'">🔊</button></p>').join('')+'</article>';if(s==='practice')h=head('07','التدريب','تدريب مستقل عن التفاعل مع تصحيح فوري.')+'<div class="grid">'+[['3:15','Il est trois heures et quart.','Il est trois heures et demie.'],['8:30','Il est huit heures et demie.','Il est huit heures et quart.'],['9:45','Il est dix heures moins le quart.','Il est neuf heures et demie.'],['12:00','Il est midi.','Il est minuit.']].map(x=>'<article class="card"><h3>'+x[0]+'</h3>'+opts([[x[1],true],[x[2],false]])+'<p class="feedback"></p></article>').join('')+'</div>';if(s==='media')h=head('08','الفيديو','هذه الصفحة للفيديو فقط، ولا تعرض الملف التفاعلي.')+'<div class="video"><iframe width="100%" height="100%" style="border:0" src="https://www.youtube.com/embed/qt40aGoB3iY" title="L’heure — فيديو الدرس" allowfullscreen></iframe></div>';if(s==='games')h=head('09','مركز الألعاب','الألعاب منفصلة عن التدريب، وكل لعبة لها مهارة مختلفة.')+'<div class="hub"><a href="#" data-game="1"><b>⏱️ ساعة في ثوانٍ</b>اقرأ الوقت بسرعة.</a><a href="#" data-game="2"><b>¼ سباق الربع</b>طابق 15 دقيقة.</a><a href="#" data-game="3"><b>½ تحدي النصف</b>طابق 30 دقيقة.</a><a href="#" data-game="4"><b>↩️ لغز moins le quart</b>اكتشف الساعة التالية.</a></div><div id="game" class="card" style="margin-top:14px">اختر لعبة من المركز.</div>';if(s==='test')h=head('10','التقييم','التقييم الرسمي والاختبار الإلكتروني الأصلي منفصلان عن تقييم HM Academy التفاعلي.')+'<div class="hub"><a href="grade-4-l03-reference.html"><b>📄 الملف المرجعي</b>عرض المرجع داخل المنصة.</a><a href="grade-4-l03-official-evaluation.html"><b>🏆 التقييم الرسمي</b>عرض التقييم الرسمي داخل المنصة دون تحميل.</a><a href="'+root+'04_examen_electronique_lheure.html"><b>🧪 الاختبار التفاعلي الأصلي</b>عرض المصدر التفاعلي الأصلي.</a><a href="grade-4-l03-smart-evaluation.html"><b>✨ التقييم التفاعلي HM Academy</b>اختبار مستقل بدرجة نهائية.</a></div>';if(s==='after')h=head('11','بعد الرحلة — مراجعة ذكية','لوحة إنهاء ومراجعة، بدون نطق وبدون إعادة أسئلة التدريب.')+'<div class="hub"><a href="grade-4-l03-reference.html"><b>📄 المرجع</b>عرض الملف المرجعي داخل المنصة.</a><a href="grade-4-l03-smart-evaluation.html"><b>✨ المراجعة الذكية</b>تقييم سريع من أهم نقاط الدرس.</a><a href="#" data-go="rules"><b>📘 ملخص القواعد</b>heure/heures · quart · demie · moins le quart · midi/minuit.</a><a href="grade-4-l03-official-evaluation.html"><b>🏆 التقييم الرسمي</b>الوصول المباشر للتقييم الرسمي.</a><a href="#" data-go="games"><b>🎮 مركز الألعاب</b>العودة إلى الألعاب.</a><a href="#" data-go="media"><b>🎬 الفيديو</b>مشاهدة فيديو الدرس.</a></div>';page.innerHTML=h;bind();if(s==='games')page.querySelectorAll('[data-game]').forEach(a=>a.onclick=e=>{e.preventDefault();const data={1:['3:15','trois heures et quart','trois heures et demie'],2:['4:15','quatre heures et quart','quatre heures et demie'],3:['8:30','huit heures et demie','huit heures et quart'],4:['9:45','dix heures moins le quart','neuf heures et quart']}[a.dataset.game];const box=document.getElementById('game');box.innerHTML='<h3>التحدي</h3><div style="font-size:34px;font-weight:900;text-align:center">'+data[0]+'</div>'+opts([[data[1],true],[data[2],false]])+'<p class="feedback"></p>';bind()})}nav.onclick=e=>{const b=e.target.closest('.tab');if(b)render(b.dataset.s)};render(new URLSearchParams(location.search).get('section')||'start')})();</script></body></html>
