<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HM Academy | L'heure — الصف الرابع</title><style>:root{--ink:#20354d;--blue:#4169e1;--red:#d95d57;--gold:#e8a52b;--green:#4e9b68;--bg:#f4f7fb;--card:#fff;--muted:#66778a;--line:#dce5ee}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 5%,#e8f5ff,transparent 35%),radial-gradient(circle at 90% 10%,#fff0f2,transparent 35%),var(--bg);font-family:Arial,sans-serif;color:var(--ink)}.wrap{max-width:1180px;margin:auto;padding:18px}.top,.hero,.page{background:var(--card);border-radius:24px;box-shadow:0 12px 35px #20354d12}.top{padding:14px 18px;display:flex;justify-content:space-between;margin-bottom:12px}.top a{color:var(--ink);font-weight:900;text-decoration:none}.hero{padding:26px;margin-bottom:12px;background:linear-gradient(135deg,#e4f6ff,#fff0f3)}.eyebrow,.tag{display:inline-block;border-radius:999px;padding:6px 12px;font-weight:900;font-size:13px}.eyebrow{background:#fff}.hero h1{font-size:clamp(30px,5vw,48px);margin:12px 0 4px}.hero p{margin:0;color:var(--muted);font-weight:700}.nav{position:sticky;top:0;z-index:5;display:flex;gap:7px;overflow:auto;background:#fff;border-radius:18px;padding:10px;margin-bottom:12px;box-shadow:0 8px 25px #20354d10}.tab{border:0;border-radius:12px;padding:11px 14px;background:#eef2f7;color:var(--ink);font-weight:900;white-space:nowrap;cursor:pointer}.tab.active{background:var(--blue);color:#fff}.section-title{display:flex;align-items:center;gap:10px}.section-title h2{margin:0;font-size:28px}.tag{background:#e7f1ff;color:#2460b7}.lead{color:var(--muted);line-height:1.8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.card{border:1px solid var(--line);border-radius:20px;padding:18px;background:#fff;transition:.2s}.card:hover{transform:translateY(-2px);box-shadow:0 10px 25px #20354d10}.icon{height:120px;border-radius:16px;background:linear-gradient(135deg,#edf7ff,#fff3f4);display:grid;place-items:center;font-size:58px}.fr{direction:ltr;text-align:left;font-size:22px;font-weight:900}.meaning{font-size:17px;color:#42586e}.sound,.btn,.choice{border:0;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}.sound{background:#20354d;color:#fff}.btn{background:var(--blue);color:#fff;text-decoration:none;display:inline-block}.choice{display:block;width:100%;margin:7px 0;background:#fff;border:1px solid var(--line);text-align:right}.choice.ok{background:#eaf7ee;border-color:#5ba673}.choice.no{background:#fff0f0;border-color:#db6a6a}.feedback{min-height:22px;font-weight:900}.rule{border-right:5px solid var(--red);background:#fff7f6;padding:14px 16px;border-radius:14px;margin:10px 0;line-height:1.8}.rule strong{color:var(--red)}.example{background:#f7faff;border:1px solid #dce8fa;border-radius:15px;padding:14px;margin-top:9px}.formula{font-size:20px;font-weight:900;direction:ltr;text-align:left}.pill{display:inline-block;background:#eef5ff;border-radius:999px;padding:5px 9px;font-weight:900;margin:3px}.big{font-size:34px;font-weight:900;color:var(--blue);text-align:center}.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.hub a{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:17px;background:#fff}.hub a b{display:block;font-size:18px;margin:6px 0}.media{width:100%;aspect-ratio:16/9;border:0;border-radius:20px;background:#111}.video-note{margin-top:12px;padding:13px;border-radius:14px;background:#f7fafc;color:var(--muted);font-weight:700}@media(max-width:600px){.wrap{padding:9px}.hero,.page{padding:16px}.top{font-size:13px}.section-title h2{font-size:23px}}</style></head><body><main class="wrap"><header class="top"><a href="grade-4.html">← الصف الرابع</a><a href="index.html">HM Academy</a></header><section class="hero"><span class="eyebrow">Le français · 4e année · Leçon 03</span><h1>L'heure · الساعة</h1><p>من السؤال عن الوقت إلى قراءته والتعبير عنه واستخدامه في الحياة اليومية.</p></section><nav id="nav" class="nav"></nav><section id="page" class="page"></section></main><script>(function(){const root='data/lessons/grade-4/source/4eme_Complet/03_L_heure/';const tabs=[['start','🚀 البداية'],['vocab','🖼️ المفردات'],['under','🧠 افهم'],['rules','📘 القواعد'],['interact','🤝 تفاعل'],['talk','💬 المحادثة'],['practice','✍️ التدريب'],['media','🎬 الفيديو'],['games','🎮 مركز الألعاب'],['test','🏆 التقييم'],['after','📚 بعد الرحلة']];const vocab=[['🕐','une heure','ساعة واحدة'],['🕜','une heure et demie','ساعة ونصف'],['🕒','trois heures','الساعة الثالثة'],['🕒','trois heures et quart','الثالثة والربع'],['🕞','trois heures et demie','الثالثة والنصف'],['🕙','dix heures moins le quart','العاشرة إلا ربعًا'],['🕛','midi','الظهر / الثانية عشرة ظهرًا'],['🌙','minuit','منتصف الليل']];const examples=[['1:00','Il est une heure.','ساعة واحدة'],['2:00','Il est deux heures.','ساعتان'],['3:15','Il est trois heures et quart.','الثالثة والربع'],['3:30','Il est trois heures et demie.','الثالثة والنصف'],['9:45','Il est dix heures moins le quart.','العاشرة إلا ربعًا'],['12:00 ☀️','Il est midi.','الظهر'],['00:00 🌙','Il est minuit.','منتصف الليل']];const nav=document.getElementById('nav'),page=document.getElementById('page');nav.innerHTML=tabs.map(x=>`<button class="tab" data-tab="${x[0]}">${x[1]}</button>`).join('');function speak(t){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.8;window.speechSynthesis.speak(u)}function head(tag,title,desc){return `<div class="section-title"><span class="tag">${tag}</span><h2>${title}</h2></div><p class="lead">${desc}</p>`}function choices(a){return a.map(x=>`<button class="choice" data-ok="${x[1]}">${x[0]}</button>`).join('')}function bind(){page.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));page.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>render(b.dataset.go));page.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const card=b.closest('.card');const ok=b.dataset.ok==='true';card.querySelectorAll('.choice').forEach(x=>x.disabled=true);b.classList.add(ok?'ok':'no');const f=card.querySelector('.feedback');if(f)f.textContent=ok?'✅ صحيح! أحسنت.':'❌ ليست الإجابة المناسبة لهذا الموقف.'})}function render(s){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===s));let h='';if(s==='start')h=head('01','ابدأ الرحلة','الدرس مبني في مسار واضح: كلمات ومعاني → فهم → قواعد → تطبيق → محادثة → تدريب → فيديو → مركز ألعاب → تقييم → مراجعة ختامية.')+`<div class="grid"><article class="card"><div class="icon">🕒</div><h3>هدف اليوم</h3><p>أن تسأل عن الساعة وتقولها بدقة: كاملة، وربع، ونصف، وإلا ربعًا، مع فهم الفرق بين midi و minuit.</p><button class="btn" data-go="vocab">ابدأ المفردات</button></article><article class="card"><div class="icon">🧭</div><h3>خريطة التعلم</h3><p>كل صفحة لها وظيفة مختلفة؛ لن نكرر نفس السؤال أو نفس المثال في أكثر من مرحلة.</p></article><article class="card"><div class="icon">🎯</div><h3>تحدي البداية</h3><p class="fr">Quelle heure est-il ?</p><p>حاول الإجابة قبل الانتقال إلى القواعد.</p></article></div>`;if(s==='vocab')h=head('02','المفردات — ماذا نقول للوقت؟','هذه الصفحة تبني قاموس الدرس قبل القاعدة. كل كلمة لها معنى عربي ونطق فرنسي.')+`<div class="grid">${vocab.map(x=>`<article class="card"><div class="icon">${x[0]}</div><h3 class="fr">${x[1]}</h3><p class="meaning">${x[2]}</p><button class="sound" data-speak="${x[1]}">🔊 اسمع</button></article>`).join('')}</div>`;if(s==='under')h=head('03','افهم — من شكل الساعة إلى الجملة','لاحظ أن الجملة تتغير حسب الوقت، وليس المطلوب حفظ جملة واحدة فقط.')+`<div class="grid">${examples.map(x=>`<article class="card"><span class="pill">${x[0]}</span><h3 class="fr">${x[1]}</h3><p>${x[2]}</p><button class="sound" data-speak="${x[1]}">🔊 اسمع المثال</button></article>`).join('')}</div><div class="card"><h3>قاعدة ذكية</h3><p>نقول <b>heures</b> مع معظم الساعات، لكن مع الساعة الواحدة نستخدم <b>heure</b> بالمفرد.</p></div>`;if(s==='rules')h=head('04','القواعد — كيف نستخدم الساعة؟','صفحة القواعد تجمع التفاصيل التي يحتاجها الطفل للانتقال من الحفظ إلى تكوين الجملة بنفسه.')+`<div class="rule"><strong>1 · heure أم heures؟</strong><br>مع 1 نستخدم المفرد: <span class="formula">Il est une heure.</span><br>من 2 فما فوق نستخدم الجمع: <span class="formula">Il est deux heures. · Il est huit heures.</span></div><div class="rule"><strong>2 · متى لا نستخدم heures؟</strong><br>مع <b>midi</b> و<b>minuit</b> نقول مباشرة: <span class="formula">Il est midi. · Il est minuit.</span></div><div class="rule"><strong>3 · الربع</strong><br><span class="formula">et quart</span> = وربع: <span class="formula">Il est trois heures et quart.</span></div><div class="rule"><strong>4 · النصف</strong><br><span class="formula">et demie</span> = ونصف: <span class="formula">Il est une heure et demie. · Il est trois heures et demie.</span></div><div class="rule"><strong>5 · إلا ربعًا</strong><br>ننتقل إلى الساعة التالية مع <b>moins le quart</b>: <span class="formula">9:45 → Il est dix heures moins le quart.</span></div><div class="rule"><strong>6 · كيف نسأل؟</strong><br><span class="formula">Quelle heure est-il ?</span> للسؤال العام عن الوقت.<br><span class="formula">À quelle heure commence le cours ?</span> للسؤال عن موعد نشاط.</div><div class="grid"><article class="example"><b>1:00</b><p class="formula">Il est une heure.</p></article><article class="example"><b>1:30</b><p class="formula">Il est une heure et demie.</p></article><article class="example"><b>3:15</b><p class="formula">Il est trois heures et quart.</p></article><article class="example"><b>9:45</b><p class="formula">Il est dix heures moins le quart.</p></article></div>`;if(s==='interact')h=head('05','تفاعل وتطبيق — مواقف من يومك','اختر الإجابة المناسبة لكل موقف. البدائل أخطاء شائعة أو أوقات قريبة من الموقف، وليست اختيارات غير منطقية.')+`<div class="grid"><article class="card"><h3>🏫 تبدأ الحصة 8:30</h3>${choices([['À huit heures et demie.',true],['À huit heures et quart.',false],['À neuf heures et demie.',false]])}<p class="feedback"></p></article><article class="card"><h3>🚌 الحافلة تصل 3:15</h3>${choices([['Il est trois heures et quart.',true],['Il est trois heures et demie.',false],['Il est quatre heures et quart.',false]])}<p class="feedback"></p></article><article class="card"><h3>⏰ الموعد 9:45</h3>${choices([['Il est dix heures moins le quart.',true],['Il est neuf heures et quart.',false],['Il est neuf heures et demie.',false]])}<p class="feedback"></p></article><article class="card"><h3>🍽️ الغداء 12:00 ظهرًا</h3>${choices([['Il est midi.',true],['Il est minuit.',false],['Il est douze heures et quart.',false]])}<p class="feedback"></p></article></div>`;if(s==='talk')h=head('06','المحادثة — موعد الحصة والاستراحة','حوار قصير قابل للاستخدام في المدرسة. لاحظ الفرق بين السؤال عن الساعة والسؤال عن موعد نشاط.')+`<article class="card">${[['👧','Quelle heure est-il ?','Il est trois heures et quart.'],['👦','À quelle heure commence le cours ?','À huit heures et demie.'],['👧','Et la pause, à quelle heure ?','À dix heures moins le quart.'],['👦','Et le déjeuner ?','À midi.'],['👧','D’accord, merci !','De rien !']].map(x=>`<p><b>${x[0]} ${x[1]}</b><br><span class="fr">${x[2]}</span> <button class="sound" data-speak="${x[2]}">🔊</button></p>`).join('')}</article>`;if(s==='practice')h=head('07','التدريب — ابنِ الإجابة بنفسك','تدريبات مختلفة عن صفحة التفاعل: هنا الهدف قراءة الوقت واختيار الصياغة الفرنسية الدقيقة.')+`<div class="grid">${[['3:00',['Il est trois heures.','Il est trois heures et quart.','Il est deux heures.']],['1:30',['Il est une heure et demie.','Il est une heure et quart.','Il est deux heures et demie.']],['4:15',['Il est quatre heures et quart.','Il est quatre heures et demie.','Il est cinq heures moins le quart.']],['9:45',['Il est dix heures moins le quart.','Il est neuf heures et quart.','Il est neuf heures et demie.']],['12:00 ☀️',['Il est midi.','Il est minuit.','Il est douze heures et demie.']]].map(q=>`<article class="card"><div class="big">${q[0]}</div>${choices(q[1].map((o,i)=>[o,i===0]))}<p class="feedback"></p></article>`).join('')}</div>`;if(s==='media')h=head('08','الفيديو — شاهد فقط','هذه الصفحة مخصصة للفيديو فقط، وليست لعرض الملف التفاعلي. الفيديو المستخدم هو الفيديو الموجود في المصدر الأصلي للدرس.')+`<div class="card"><div style="position:relative;padding-top:56.25%;overflow:hidden;border-radius:18px;background:#111"><iframe style="position:absolute;inset:0;width:100%;height:100%;border:0" src="https://www.youtube-nocookie.com/embed/qt40aGoB3iY?rel=0" title="Apprendre à lire l'heure" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div><div class="video-note">🎬 Apprendre à lire l'heure — الفيديو الأصلي المرتبط بالدرس.</div></div>`;if(s==='games')h=head('09','مركز الألعاب — اختر مغامرتك','الألعاب أصبحت مركزًا مستقلًا. كل بطاقة لعبة مختلفة، وليست نسخة من صفحة التدريب.')+`<div class="hub"><a href="#" data-game="clock"><span class="icon">🕒</span><b>ساعة في ثوانٍ</b><small>طابق الوقت الرقمي مع التعبير الفرنسي.</small></a><a href="#" data-game="quarter"><span class="icon">¼</span><b>تحدي الربع</b><small>اكتشف et quart.</small></a><a href="#" data-game="half"><span class="icon">½</span><b>تحدي النصف</b><small>ميّز et demie.</small></a><a href="#" data-game="quarterless"><span class="icon">⏳</span><b>سباق moins le quart</b><small>حوّل 9:45 إلى الجملة الصحيحة.</small></a></div><div id="gameArea" class="card" style="margin-top:14px"><h3>🎮 اختر لعبة من المركز</h3><p class="lead">كل لعبة تفتح داخل هذا المركز.</p></div>`;if(s==='test')h=head('10','التقييم — مركز الموارد الرسمية','هذه الصفحة لا تعيد اختراع التقييم؛ هي لوحة وصول منظمة للملفات المتخصصة المرتبطة بالدرس.')+`<div class="hub"><a href="${root}02_reference_lheure.docx" target="_blank"><span class="icon">📖</span><b>الملف المرجعي</b><small>المرجع الأصلي.</small></a><a href="${root}03_evaluation_lheure.docx" target="_blank"><span class="icon">📝</span><b>التقييم الرسمي</b><small>ملف التقييم المعتمد.</small></a><a href="${root}04_examen_electronique_lheure.html" target="_blank"><span class="icon">🏆</span><b>الاختبار الإلكتروني</b><small>الاختبار الرسمي.</small></a><a href="${root}01_interactif_lheure.html" target="_blank"><span class="icon">🧩</span><b>المحتوى التفاعلي</b><small>النسخة الأصلية.</small></a><a href="#" data-go="rules"><span class="icon">📘</span><b>قواعد الساعة</b><small>مراجعة القاعدة.</small></a><a href="#" data-go="practice"><span class="icon">✍️</span><b>مراجعة سريعة</b><small>تدريب قبل الاختبار.</small></a></div>`;if(s==='after')h=head('11','بعد الرحلة — ماذا أتقنت؟','صفحة ختامية تجمع الاختصارات التي يحتاجها الطالب بعد إنهاء الدرس دون تكرار محتواه.')+`<div class="grid"><article class="card"><div class="icon">🏅</div><h3>إنجازك</h3><p>السؤال عن الساعة، الساعة الكاملة، الربع، النصف، إلا ربعًا، midi وminuit.</p></article><article class="card"><div class="icon">📖</div><h3>مراجعة القواعد</h3><button class="btn" data-go="rules">فتح القواعد</button></article><article class="card"><div class="icon">📝</div><h3>التقييم الرسمي</h3><a class="btn" href="${root}03_evaluation_lheure.docx" target="_blank">فتح التقييم</a></article><article class="card"><div class="icon">🏆</div><h3>الاختبار الإلكتروني</h3><a class="btn" href="${root}04_examen_electronique_lheure.html" target="_blank">فتح الاختبار</a></article><article class="card"><div class="icon">🧩</div><h3>التفاعلي الأصلي</h3><a class="btn" href="${root}01_interactif_lheure.html" target="_blank">فتح التفاعلي</a></article><article class="card"><div class="icon">📚</div><h3>المرجع الأصلي</h3><a class="btn" href="${root}02_reference_lheure.docx" target="_blank">فتح المرجع</a></article><article class="card"><div class="icon">🔊</div><h3>النطق</h3><button class="sound" data-speak="Quelle heure est-il ? Il est trois heures et quart.">تشغيل النطق</button></article></div>`;page.innerHTML=h;bind();if(s==='games')setupGames()}function setupGames(){document.querySelectorAll('[data-game]').forEach(a=>a.onclick=e=>{e.preventDefault();const type=a.dataset.game,area=document.getElementById('gameArea');const data={clock:['🕒 ساعة في ثوانٍ','3:15',['trois heures et quart','trois heures et demie','trois heures']],quarter:['¼ تحدي الربع','7:15',['sept heures et quart','sept heures et demie','huit heures moins le quart']],half:['½ تحدي النصف','8:30',['huit heures et demie','huit heures et quart','neuf heures moins le quart']],quarterless:['⏳ moins le quart','9:45',['dix heures moins le quart','neuf heures et quart','neuf heures et demie']]}[type];area.innerHTML=`<h3>${data[0]}</h3><div class="big">${data[1]}</div>${choices(data[2].map((o,i)=>[o,i===0]))}<p class="feedback"></p>`;bind()})}nav.onclick=e=>{const b=e.target.closest('.tab');if(b)render(b.dataset.tab)};render('start')})();</script></body></html>
