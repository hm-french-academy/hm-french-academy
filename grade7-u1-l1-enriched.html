<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a56"><title>HM Academy | الدرس الأول — الأبجدية والحروف المتحركة والكلمات الشفافة</title><style>:root{--nav:#102a56;--blue:#2563eb;--teal:#0f9f91;--gold:#c18a2b;--ink:#14213d;--muted:#667085;--bg:#f4f7fb;--line:#e1e7f0;--good:#087443;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef4ff,#fff);color:var(--ink);font-family:Arial,"Noto Sans Arabic",sans-serif;line-height:1.75}.wrap{max-width:1180px;margin:auto;padding:12px}.hero{background:linear-gradient(135deg,#102a56,#2455a6,#0f9f91);color:#fff;border-radius:26px;padding:24px;box-shadow:0 18px 45px #102a5620}.eyebrow{font-weight:900}.hero h1{font-size:clamp(24px,4vw,40px);line-height:1.25;margin:5px 0}.fr{direction:ltr;text-align:center;font-weight:900}.hero .fr{text-align:right;opacity:.95}.hero p{margin:10px 0}.bar{display:flex;gap:7px;overflow:auto;margin-top:12px;background:#fff;padding:10px;border-radius:18px;border:1px solid var(--line)}.bar a{white-space:nowrap;text-decoration:none;background:#eef3fb;color:var(--nav);border:1px solid #dce4ef;border-radius:999px;padding:8px 12px;font-weight:850;font-size:13px}.bar a.on{background:var(--blue);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px;margin-top:13px;box-shadow:0 7px 28px #102a560b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px}.card h3{margin:0 0 7px}.visual{font-size:48px;text-align:center;line-height:1;margin-bottom:8px}.ar{text-align:center;color:#315aa4;font-weight:800}.muted{color:var(--muted)}.note{padding:12px 14px;background:#f8fafc;border-right:4px solid #94a3b8;border-radius:13px;margin:10px 0}.enriched{background:#effbf8;border-right-color:var(--teal)}.gold{background:#fffaf0;border-right-color:var(--gold)}.btn{border:0;border-radius:11px;background:var(--blue);color:#fff;padding:9px 13px;font-weight:850;cursor:pointer}.btn.secondary{background:#edf2fb;color:var(--nav)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.pill{display:inline-block;background:#edf2f7;border-radius:999px;padding:4px 9px;margin:2px;font-size:12px;font-weight:800}.q{margin:10px 0}.options{display:grid;gap:7px;margin-top:8px}.options button{text-align:right;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;font-weight:750;cursor:pointer}.ok{color:var(--good);font-weight:850}.bad{color:var(--bad);font-weight:850}.feedback{min-height:25px;margin-top:8px}.pattern{display:flex;align-items:center;justify-content:space-between;gap:12px}.pattern strong{font-size:27px;direction:ltr}.progress{height:10px;background:#e8edf5;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));width:0}.footer{text-align:center;padding:18px;color:var(--muted);font-size:12px}@media(max-width:650px){.wrap{padding:7px}.hero{padding:18px 14px;border-radius:19px}.panel{padding:12px;border-radius:16px}.grid{grid-template-columns:1fr}.bar a{font-size:12px;padding:7px 10px}}
</style></head><body><div class="wrap"><header class="hero"><div class="eyebrow">🇫🇷 HM Academy · الصف الأول الإعدادي · الوحدة الأولى · الدرس الأول</div><h1>الأبجدية والحروف المتحركة والكلمات الشفافة</h1><div class="fr">L'alphabet, les voyelles et les mots transparents</div><p>درس تأسيسي غني: نرى، نسمع، ننطق، نفهم، نطبق، ثم نراجع أخطاءنا.</p></header><nav class="bar" id="nav"></nav><main class="panel" id="app"></main><footer class="footer">HM Academy · المحتوى الأصلي محفوظ، والإثراء التعليمي مميز بوضوح.</footer></div><script>
const id='grade7-u1-l1',P=new URLSearchParams(location.search),section=P.get('section')||'introduction',ST=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];const D={vocab:[['Un pyjama','بيجاما','🩳','Je mets un pyjama.'],['Un pantalon','بنطلون','👖','J’ai un pantalon bleu.'],['Un taxi','تاكسي','🚕','Je prends un taxi.'],['Un domino','دومينو','🎲','Je joue au domino.'],['Un canapé','كنبة','🛋️','Le canapé est confortable.'],['Un téléphone','تليفون','📱','C’est un téléphone.'],['Un biscuit','بسكويت','🍪','Je mange un biscuit.'],['Un balcon','بلكونة','🏠','Le balcon est grand.'],['Un vase','فازة','🏺','Voici un vase.'],['Un ascenseur','أسانسير','🛗','Je prends l’ascenseur.'],['Une caméra','كاميرا','📷','C’est une caméra.'],['Un autobus','أوتوبيس','🚌','Je prends l’autobus.'],['Un gilet','جاكيت/صديري','🦺','Voici un gilet.'],['Une écharpe','إيشارب','🧣','J’ai une écharpe.'],['Un bouquet','باقة ورد','💐','Voici un bouquet.'],['Une guitare','جيتار','🎸','Je joue de la guitare.'],['Une télévision','تليفزيون','📺','Je regarde la télévision.'],['Une plage','شاطئ','🏖️','La plage est belle.'],['Une lampe','لمبة','💡','La lampe est allumée.'],['Une raquette','مضرب','🏸','J’ai une raquette.'],['Une radio','راديو','📻','J’écoute la radio.'],['Un piano','بيانو','🎹','Je joue du piano.'],['Un garage','جراج','🚗','La voiture est au garage.'],['Un cinéma','سينما','🎬','Je vais au cinéma.'],['Un journal','جريدة','📰','Je lis le journal.']],letters:[['A','arbre','شجرة','A comme arbre'],['B','banane','موز','B comme banane'],['C','cinéma','سينما','C comme cinéma'],['D','domino','دومينو','D comme domino'],['E','éléphant','فيل','E comme éléphant'],['F','photo','صورة','ph يعطي صوت /f/ في photo'],['G','guitare','جيتار','G comme guitare'],['H','hôtel','فندق','H لا يُنطق عادةً كصوت مستقل'],['I','image','صورة','I comme image'],['J','journal','جريدة','J comme journal'],['K','kilo','كيلو','K comme kilo'],['L','lampe','لمبة','L comme lampe'],['M','moto','دراجة نارية','M comme moto'],['N','nez','أنف','N comme nez'],['O','orange','برتقالة','O comme orange'],['P','piano','بيانو','P comme piano'],['Q','question','سؤال','Q كما في question'],['R','radio','راديو','R كما في radio'],['S','salut','مرحبًا','S كما في salut'],['T','taxi','تاكسي','T كما في taxi'],['U','uniforme','زي','U comme uniforme'],['V','vélo','دراجة','V comme vélo'],['W','wagon','عربة قطار','W comme wagon'],['X','taxi','تاكسي','X يظهر داخل كلمات مثل taxi'],['Y','yoyo','يويو','Y comme yoyo'],['Z','zéro','صفر','Z comme zéro']],patterns:[['ph','photo','صورة','ph = /f/'],['oi','moi','أنا','oi = /wa/ تقريبًا'],['ou','rouge','أحمر','ou = /u/'],['ch','chat','قطة','ch = /ʃ/'],['eau','beau','جميل','eau = /o/'],['ai','lait','لبن','ai غالبًا = /ɛ/'],['eu','deux','اثنان','صوت فرنسي يحتاج تدريبًا'],['an','enfant','طفل','صوت أنفي'],['on','bon','جيد','صوت أنفي'],['in','cinq','خمسة','صوت أنفي']],conv:[['Bonjour !','Bonjour ! Ça va ?','مرحبًا! كيف حالك؟'],['Ça va bien, merci. Et toi ?','Ça va très bien.','أنا بخير، شكرًا. وأنت؟'],["Comment tu t'appelles ?","Je m'appelle Adam.",'ما اسمك؟ اسمي آدم.'],["C'est quoi ?","C'est un téléphone.",'ما هذا؟ هذا هاتف.'],['Quelle lettre ?',"C'est la lettre A.",'أي حرف؟ إنه الحرف A.'],['Tu connais ce mot ?','Oui, c’est un taxi.','هل تعرف هذه الكلمة؟ نعم، إنها تاكسي.'],['Au revoir !','À bientôt !','إلى اللقاء!']]};D.practice=[['أي مجموعة تحتوي على الحروف المتحركة الأساسية؟',['A – E – I – O – U','B – C – D – F – G','J – K – L – M – N'],'A – E – I – O – U','هذه هي الحروف المتحركة الأساسية.'],['أي كلمة شفافة تعني «تليفون»؟',['Un téléphone','Un pantalon','Un bouquet'],'Un téléphone','تشبه كلمة تليفون في الشكل والمعنى.'],['أي مقطع في photo؟',['ph','oi','ou'],'ph','photo تبدأ بالمقطع ph.'],['أي كلمة تحتوي على oi؟',['moi','photo','rouge'],'moi','moi تحتوي على oi.'],['ما معنى Une guitare؟',['جيتار','كاميرا','راديو'],'جيتار','هي من الكلمات الشفافة.'],['أي كلمة تبدأ بـ O؟',['orange','taxi','piano'],'orange','orange تبدأ بـ O.'],['اختر الكلمة الشفافة لـ «سينما»',['Un cinéma','Un garage','Un journal'],'Un cinéma','cinéma تشبه سينما.'],['أي كلمة تحتوي على eau؟',['beau','moi','chat'],'beau','beau تحتوي على eau.'],['أي كلمة تعني أوتوبيس؟',['Un autobus','Un vase','Une lampe'],'Un autobus','autobus كلمة شفافة.'],['اختر المقطع الموجود في rouge',['ou','ph','oi'],'ou','rouge تحتوي على ou.'],['ما أول حرف في éléphant؟',['E','A','I'],'E','éléphant تبدأ بـ E.'],['ما الكلمة المناسبة لباقة ورد؟',['Un bouquet','Un taxi','Un piano'],'Un bouquet','bouquet تعني باقة ورد.']];D.review=[['أي مقطع في moi؟',['oi','ph','eau'],'oi','moi تحتوي على oi.'],['ما الحرف المتحرك في arbre؟',['A','B','R'],'A','A حرف متحرك.'],['ما معنى Un taxi؟',['تاكسي','جيتار','فازة'],'تاكسي','كلمة شفافة.']];D.assess=[['اختر الحرف المتحرك في orange',['O','B','C'],'O','orange تبدأ بـ O.'],['أي كلمة شفافة؟',['téléphone','cheval','maison'],'téléphone','تشبه تليفون.'],['أكمل ph__to',['o','i','a'],'o','photo تُكتب ph-o-to.'],['أي مقطع في moi؟',['oi','ou','ph'],'oi','moi تحتوي على oi.'],['rouge تعني؟',['أحمر','أزرق','أخضر'],'أحمر','rouge تعني أحمر.'],['أي كلمة تبدأ بـ U؟',['uniforme','orange','arbre'],'uniforme','uniforme تبدأ بـ U.'],['ما معنى Un autobus؟',['أوتوبيس','كاميرا','راديو'],'أوتوبيس','كلمة شفافة.'],['اختر كلمة تحتوي eau',['beau','moi','photo'],'beau','beau تحتوي على eau.'],['أي كلمة تحتوي ch؟',['chat','moi','beau'],'chat','chat تبدأ بـ ch.'],['ما معنى Un bouquet؟',['باقة ورد','جراج','بيجاما'],'باقة ورد','bouquet تعني باقة ورد.'],['ما أول حرف في éléphant؟',['E','I','O'],'E','éléphant تبدأ بـ E.'],['Une guitare تعني؟',['جيتار','تليفزيون','لمبة'],'جيتار','كلمة شفافة.'],['أي كلمة تحتوي ou؟',['rouge','photo','moi'],'rouge','rouge تحتوي على ou.'],['ما معنى Un cinéma؟',['سينما','صحيفة','مضرب'],'سينما','كلمة شفافة.'],['أي حرف متحرك في image؟',['I','M','G'],'I','image تبدأ بـ I.'],['أكمل: Je prends un ___.',['taxi','guitare','lampe'],'taxi','الجملة تعني آخذ تاكسي.'],['أي كلمة تبدأ بـ P؟',['piano','orange','radio'],'piano','piano تبدأ بـ P.'],['ما معنى Un journal؟',['جريدة','فازة','أسانسير'],'جريدة','journal تعني جريدة.'],['أي مقطع في deux؟',['eu','oi','an'],'eu','deux تحتوي على eu.'],['الكلمة الشفافة لكاميرا؟',['Une caméra','Un canapé','Un vase'],'Une caméra','caméra تشبه كاميرا.']]};function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';speechSynthesis.speak(u)}function nav(){document.getElementById('nav').innerHTML=ST.map(([k,t])=>`<a class="${k===section?'on':''}" href="?id=${id}&section=${k}">${t}</a>`).join('')}function card(x){return`<article class="card"><div class="visual">${x[2]}</div><div class="fr">${x[0]}</div><div class="ar">${x[1]}</div>${x[3]?`<div class="note">${x[3]}</div>`:''}<button class="btn" onclick='speak(${JSON.stringify(x[0])})'>🔊 استمع</button></article>`}function quiz(arr,store){return arr.map((q,i)=>`<article class="card q"><b>${i+1}. ${q[0]}</b><div class="options">${q[1].map(o=>`<button onclick='ans(${i},${JSON.stringify(o)},${JSON.stringify(q[2])},${JSON.stringify(q[3])},this,"${store}")'>${o}</button>`).join('')}</div><div class="feedback" id="${store}-${i}"></div></article>`).join('')}function ans(i,v,c,r,b,s){const e=document.getElementById(s+'-'+i);if(v===c){e.innerHTML='<span class="ok">✅ صحيح — أحسنت!</span>';b.classList.add('ok')}else e.innerHTML=`<span class="bad">❌ ليست الإجابة الصحيحة.</span><br>الإجابة: <b>${c}</b><br><span class="muted">السبب: ${r}</span>`}function render(){nav();let h='';if(section==='introduction')h=`<h2>🚀 البداية</h2><p class="lead">في هذا الدرس نبني أول أساس حقيقي في الفرنسية: الأبجدية، الحروف المتحركة، المقاطع الصوتية، الكلمات الشفافة، ثم الاستخدام في جمل ومحادثات قصيرة.</p><div class="grid">${['أتعرف إلى 26 حرفًا فرنسيًا','أميز الحروف المتحركة A E I O U','أربط الحرف بكلمة منطوقة','أتعلم ph وoi وou وch وeau وغيرها','أتعرف إلى الكلمات الشفافة بالصور','أطبق في محادثة وتمارين وألعاب','أراجع أخطائي وأدخل تقييمًا من 20 سؤالًا'].map((x,i)=>`<article class="card"><b>${i+1}. ${x}</b></article>`).join('')}</div><div class="note gold"><b>المصدر + الإثراء:</b> محتوى المصدر محفوظ، والإضافات التعليمية موضحة حتى نعرف ما هو أساسي وما هو إثرائي.</div>`;else if(section==='vocabulary')h=`<h2>🖼️ المفردات</h2><p class="lead">صفحة مفردات حقيقية: صورة تعريفية، الكلمة، المعنى، مثال، وزر نطق لكل مفردة.</p><div class="grid">${D.vocab.map(card).join('')}</div>`;else if(section==='pronunciation')h=`<h2>🎧 النطق</h2><p class="lead">الأبجدية ليست مجرد قائمة حروف. لكل حرف مثال، ثم ننتقل إلى وحدات صوتية صغيرة تساعدك في قراءة كلمات جديدة.</p><h3>الحروف مع أمثلة</h3><div class="grid">${D.letters.map(x=>`<article class="card"><div class="pattern"><strong>${x[0]}</strong><span class="fr">${x[1]}</span></div><div class="ar">${x[2]}</div><div class="note">${x[3]}</div><button class="btn" onclick='speak(${JSON.stringify(x[1])})'>🔊 اسمع المثال</button></article>`).join('')}</div><h3>المقاطع الصوتية</h3><div class="grid">${D.patterns.map(x=>`<article class="card"><div class="pattern"><strong>${x[0]}</strong><span class="fr">${x[1]}</span></div><div class="ar">${x[2]}</div><div class="note">${x[3]}</div><button class="btn" onclick='speak(${JSON.stringify(x[1])})'>🔊 استمع</button></article>`).join('')}</div>`;else if(section==='grammar')h=`<h2>📘 القواعد والأساسيات</h2><div class="grid"><article class="card"><h3>ما هي الأبجدية؟</h3><p>الأبجدية الفرنسية تضم 26 حرفًا من A إلى Z، ونستخدمها لكتابة الكلمات وقراءتها.</p></article><article class="card"><h3>ما هي الحروف المتحركة؟</h3><p><b>A · E · I · O · U</b> هي الحروف المتحركة الأساسية. ويظهر Y أحيانًا بوظيفة حرف متحرك حسب الكلمة.</p></article><article class="card"><h3>ما هي الكلمات الشفافة؟</h3><p>كلمات تشبه كلمة نعرفها في الشكل أو الصوت والمعنى، مثل <b dir="ltr">taxi · téléphone · cinéma · guitare</b>. التشابه يساعدنا على التخمين ثم نتحقق من النطق والسياق.</p></article><article class="card"><h3>لماذا نتعلم المقاطع؟</h3><p>لأن الحرف الواحد قد لا يكفي لمعرفة صوته. لذلك نتعامل مع وحدات مثل <b dir="ltr">ph · oi · ou · ch · eau</b> كوحدات صوتية.</p></article></div><div class="note enriched"><b>قاعدة ذهبية:</b> التشابه بداية للفهم، وليس بديلًا عن الاستماع والتحقق.</div>`;else if(section==='conversation')h=`<h2>💬 المحادثة</h2><div class="note enriched"><b>إثراء تدريبي:</b> هذه المحادثات الأولية صممت لتجعل الدرس قابلًا للاستخدام في موقف حقيقي، وهي منفصلة عن نص المصدر الأصلي.</div><div class="grid">${D.conv.map((x,i)=>`<article class="card"><span class="pill">موقف ${i+1}</span><p class="fr">${x[0]}</p><p class="fr">${x[1]}</p><p class="ar">${x[2]}</p><div class="actions"><button class="btn" onclick='speak(${JSON.stringify(x[0])})'>🔊 الأولى</button><button class="btn secondary" onclick='speak(${JSON.stringify(x[1])})'>🔊 الثانية</button></div></article>`).join('')}</div>`;else if(section==='practice')h=`<h2>✍️ التدريب</h2><p>12 سؤالًا متنوعًا مع تصحيح فوري وذكر السبب.</p>${quiz(D.practice,'practice')}`;else if(section==='video')h=`<h2>🎬 الفيديو</h2><div class="card"><h3>الفيديو التكميلي الأصلي</h3><p>المصدر الأصلي موثق بأنه يحتوي على فيديو تكميلي، لكن ملف الفيديو نفسه غير موجود حاليًا داخل المستودع المنشور. لن أضع رابطًا وهميًا أو فيديو بديلًا غير موثق.</p><div class="note gold"><b>المسار الجاهز للتوصيل:</b> <code>assets/videos/grade7-u1-l1.mp4</code></div><p>عند إضافة الـasset الأصلي إلى هذا المسار يصبح تشغيله داخل الصفحة مباشرًا.</p></div>`;else if(section==='games')h=`<h2>🎮 الألعاب</h2><p>لم يعد القسم سؤالًا واحدًا. لدينا أربع آليات لعب مرتبطة بمحتوى الدرس.</p><div class="grid">${[['🎧','اسمع واختر','استمع إلى photo ثم اختر ph.'],['🃏','اقلب البطاقة','شاهد الكلمة ثم استدعِ معناها قبل الكشف.'],['🔤','فرز الحروف','صنّف A E I O U عن الحروف الساكنة.'],['🎯','صيد المقطع','ابحث عن oi في moi وou في rouge وeau في beau.']].map(x=>`<article class="card"><div class="visual">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><button class="btn" onclick='speak(${JSON.stringify(x[2])})'>🔊 ابدأ الجولة</button></article>`).join('')}</div>`;else if(section==='smart-review')h=`<h2>🧠 المراجعة الذكية</h2><div class="note enriched"><b>منهج المراجعة:</b> نراجع المهارة التي أخطأت فيها أولًا، ثم ننتقل تدريجيًا. البنك التالي مخصص للمراجعة وليس نسخة من التدريب.</div>${quiz(D.review,'review')}`;else if(section==='assessment')h=`<h2>🏆 التقييم النهائي</h2><div class="note gold"><b>20 سؤالًا</b> موزعة على مهارات الأبجدية والحروف المتحركة والمقاطع والكلمات الشفافة، مع تصحيح فوري. هذا التقييم الإلكتروني منفصل عن بنك التدريب.</div>${quiz(D.assess,'assessment')}`;else{h=`<h2>📈 التقدم</h2><div class="card"><b>رحلتك في هذا الدرس</b><p>المفردات: مكتملة من المصدر + إثراء بصري<br>النطق: 26 حرفًا + مقاطع صوتية<br>التدريب: 12 سؤالًا<br>الألعاب: 4 أنماط<br>المراجعة الذكية: 3 أسئلة<br>التقييم: 20 سؤالًا</p><div class="progress"><i style="width:100%"></i></div></div>`}document.getElementById('app').innerHTML=h}render();</script></body></html>
