 i=+m.dataset.m;if(open.includes(i))return;open.push(i);draw();if(open.length===2){const a=mem[open[0]],b=mem[open[1]];if(a.k===b.k){matched.push(open[0],open[1]);open=[];draw()}else setTimeout(()=>{open=[];draw()},600)}}};draw()}nav.onclick=e=>{const b=e.target.closest('.step');if(b)render(b.dataset.s)};render(p.get('section')||'start')})();</script></body></html>
