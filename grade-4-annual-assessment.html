<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | تقييم المراجعة السنوية — الصف الرابع</title><style>body{margin:0;background:#f4f7fc;color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:920px;margin:auto;padding:22px 14px 50px}.hero,.card,.result{background:#fff;border:1px solid #dfe6f0;border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:0 10px 30px #14264a10}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#7c3aed);color:#fff}.q{padding:18px 0;border-bottom:1px solid #e3e8f0}.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.opt{border:1px solid #dbe3ef;background:#fff;border-radius:14px;padding:13px;text-align:right;font-weight:800;cursor:pointer}.opt.sel{border-color:#2563eb;background:#edf3ff}.btn{display:inline-block;border:0;border-radius:12px;padding:12px 16px;background:#2563eb;color:#fff;font-weight:900;text-decoration:none;cursor:pointer;margin:8px 5px 0 0}.muted{color:#68758b;line-height:1.8}.result{display:none}.score{font-size:27px;font-weight:900}.weak{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:8px 10px;border-radius:999px;background:#fff3e8;color:#9a4d08;font-weight:900}.status{font-weight:900;padding:10px 12px;border-radius:12px;background:#eef7ef;margin:10px 0}.feedback{margin-top:14px;padding:14px 16px;border-radius:16px;background:#fff8f7;border:1px solid #ffd8d3;line-height:1.9}.feedback-title{font-weight:900;margin-bottom:5px}.feedback-answer{font-weight:900}.feedback-reason{margin-top:4px}.correct-inline{color:#16803c;font-weight:900}@media(max-width:650px){.opts{grid-template-columns:1fr}.hero,.card,.result{padding:17px}}</style></head><body><main class="wrap"><section class="hero"><h1 id="title">🧠 المراجعة السنوية — الصف الرابع</h1><p id="subtitle">4e → 5e primaire</p></section><section class="card"><div id="loading">جاري تحميل بنك أسئلة المراجعة…</div><div id="form"></div><button class="btn" id="submit" hidden>تصحيح التقييم</button><a class="btn" href="grade-4-annual-revision.html">← العودة للمراجعة</a></section><section class="result" id="result"></section></main><script>(async function(){const mode=new URLSearchParams(location.search).get('mode')||'diagnostic';const meta={diagnostic:['🎯 تشخيص المستوى','تشخيص مهارات الصف الرابع وتحديد المحاور التي تحتاج إلى مراجعة.'],practice:['🎮 التدريب السنوي','تدريب سنوي مبني على محاور منهج الصف الرابع.'],final:['🏆 اختبار الجاهزية','اختبار ختامي لقياس الاستعداد للصف الخامس.']};document.getElementById('title').textContent=meta[mode]?.[0]||meta.diagnostic[0];document.getElementById('subtitle').textContent=meta[mode]?.[1]||meta.diagnostic[1];const form=document.getElementById('form'),submit=document.getElementById('submit'),loading=document.getElementById('loading'),result=document.getElementById('result');let d;try{const r=await fetch('data/reviews/grade-5/review-content.json?v=20260831');if(!r.ok)throw Error('load');d=await r.json()}catch(e){loading.textContent='تعذر تحميل بيانات المراجعة. حاول مرة أخرى.';return}const qs=mode==='final'?d.finalReadiness.questions:mode==='practice'?(d.practiceQuestions||[]):d.diagnostic.questions;loading.remove();const answers={};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));form.innerHTML=qs.map((q,i)=>`<div class="q"><h3>${i+1}. ${esc(q.q)} ${q.hint?`<span class="muted">${esc(q.hint)}</span>`:''}</h3>${q.type==='writing'?`<textarea data-i="${i}" rows="4" style="width:100%;box-sizing:border-box;border:1px solid #dbe3ef;border-radius:14px;padding:12px;font:inherit" placeholder="اكتب إجابتك هنا…"></textarea>`:`<div class="opts">${q.options.map((o,k)=>`<button class="opt" type="button" data-i="${i}" data-k="${k}">${esc(o)}</button>`).join('')}</div>`}</div>`).join('');submit.hidden=false;form.onclick=e=>{if(!e.target.classList.contains('opt'))return;const i=+e.target.dataset.i;answers[i]=+e.target.dataset.k;form.querySelectorAll('.opt[data-i="'+i+'"]').forEach(x=>x.classList.remove('sel'));e.target.classList.add('sel')};const reasonFor=q=>{const id=q.id||'';const reasons={D01:'Une veste تعني جاكت وهي من الملابس، بينما nez هو الأنف و saison هي فصل.',D02:'مع J نستخدم تصريف avoir: J’ai، لذلك الاختيار ai هو الصحيح.',D03:'La chemise مؤنث مفرد، لذلك bleu تصبح bleue للمؤنث.',D04:'مع Nous تصريف être هو sommes: Nous sommes.',D05:'gros في المؤنث تصبح grosse بإضافة se وفق الصيغة الخاصة بهذه الصفة.',D06:'مع Mon père، الفاعل مفرد، وتصريف être هو est: Mon père est long.',D07:'بعد النفي مع avoir تتحول un/une/des إلى de/d’: Je n’ai pas de pull.',D08:'في النفي قبل الفعل être، ne تُختصر إلى n’ قبل حرف متحرك: n’est.',P01:'pantalon مذكر مفرد، لذلك نستخدم un.',P02:'مع Nous تصريف avoir هو avons: Nous avons.',P03:'chaussettes مؤنث جمع، لذلك blanc تصبح blanches.',P04:'مع Elle تصريف être هو est: Elle est petite.',P05:'vieux للمذكر المفرد تبقى vieux.',P06:'مع Ils تصريف avoir هو ont، ومع النفي تصبح n’ont pas.',F01:'مع Vous تصريف avoir هو avez: Vous avez.',F02:'La chemise مؤنث مفرد، لذلك bleu تصبح bleue.',F03:'Elles مؤنث جمع، لذلك courte تصبح courtes.',F04:'Il مذكر مفرد، لذلك الصفة هي vieux.',F05:'Ma mère مفرد مؤنث، وتصريف être مع المفرد هو est.',F06:'Elle مفرد، وتصريف aimer هو aime: Elle n’aime pas.',F07:'بعد النفي مع avoir نستخدم de/d’: Je n’ai pas de pantalon.',F08:'مع Nous تصريف avoir هو avons: Nous avons.'};return reasons[id]||'الإجابة الصحيحة تتبع قاعدة المفرد والجمع، أو جنس الاسم، أو تصريف الفعل المستخدم في الجملة.'};submit.onclick=()=>{let score=0,answered=0;const weak={};const feedback=[];qs.forEach((q,i)=>{if(q.type==='writing'){if((form.querySelector('textarea[data-i="'+i+'"]')?.value||'').trim())answered++;return}if(answers[i]!==undefined){answered++;if(answers[i]===q.answer)score++;else{weak[q.unit]=(weak[q.unit]||0)+1;feedback.push({i,q,chosen:q.options[answers[i]],correct:q.options[q.answer]})}}});const objective=qs.filter(q=>q.type!=='writing').length;const pct=objective?Math.round(score/objective*100):0;const units=d.units||[];const names=Object.keys(weak).sort((a,b)=>weak[b]-weak[a]).map(id=>units.find(u=>u.id===id)).filter(Boolean);const status=mode==='final'?(pct>=70?'جاهز للصف الخامس 🎉':pct>=50?'جاهز بعد مراجعة مركزة 📚':'يحتاج إلى مراجعة مكثفة 🧠'):pct>=70?'مستوى جيد — واصل المراجعة 💪':'نوصي بمراجعة المحاور الضعيفة 🎯';const payload={mode,score,objective,percent:pct,answered,weak:names.map(u=>u.id),status,at:new Date().toISOString()};localStorage.setItem('hm_grade4_annual_review',JSON.stringify(payload));result.style.display='block';result.innerHTML=`<div class="score">النتيجة: ${score} / ${objective} (${pct}%)</div><div class="status">${status}</div>${feedback.length?`<h3>📝 تصحيح الإجابات الخاطئة</h3>${feedback.map((f,n)=>`<div class="feedback"><div class="feedback-title">❌ السؤال ${f.i+1}: الإجابة غير صحيحة</div><div>إجابتك: ${esc(f.chosen)}</div><div class="feedback-answer">✅ الإجابة الصحيحة: ${esc(f.correct)}</div><div class="feedback-reason">💡 السبب: ${esc(reasonFor(f.q))}</div></div>`).join(''):`<div class="feedback" style="background:#f3fff6;border-color:#c9efd4"><div class="correct-inline">✅ ممتاز! لا توجد إجابات خاطئة في الأسئلة الموضوعية.</div></div>`}<p class="muted">تم حفظ نتيجة المراجعة على هذا الجهاز.</p>${names.length?`<h3>🎯 محاور تحتاج إلى مراجعة</h3><div class="weak">${names.map(u=>`<span class="chip">${esc(u.titleAr)}</span>`).join('')}</div>`:'<p>رائع! لم تظهر نقاط ضعف واضحة في الأسئلة الموضوعية.</p>'}<a class="btn" href="grade-4-annual-revision.html">🧠 العودة لمسار المراجعة</a><a class="btn" href="grade-4-annual-revision-map.html">🗺️ خريطة المراجعة</a>`;result.scrollIntoView({behavior:'smooth'})}})();</script></body></html>
