<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | تقييم المراجعة السنوية — الصف الرابع</title><style>body{margin:0;background:#f4f7fc;color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:900px;margin:auto;padding:22px 14px 50px}.hero,.card,.result{background:#fff;border:1px solid #dfe6f0;border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:0 10px 30px #14264a10}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#7c3aed);color:#fff}.q{padding:18px 0;border-bottom:1px solid #e3e8f0}.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.opt{border:1px solid #dbe3ef;background:#fff;border-radius:14px;padding:13px;text-align:right;font-weight:800;cursor:pointer}.opt.sel{border-color:#2563eb;background:#edf3ff}.btn{display:inline-block;border:0;border-radius:12px;padding:12px 16px;background:#2563eb;color:#fff;font-weight:900;text-decoration:none;cursor:pointer;margin-top:18px}.muted{color:#68758b;line-height:1.8}.result{display:none}.score{font-size:26px;font-weight:900}@media(max-width:650px){.opts{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><h1 id="title">🧠 المراجعة السنوية — الصف الرابع</h1><p id="subtitle">4e → 5e primaire</p></section><section class="card"><div id="form"></div><button class="btn" id="submit">تصحيح التقييم</button><a class="btn" href="grade-4-annual-revision.html">← العودة للمراجعة</a></section><section class="result" id="result"></section></main><script>(function(){const mode=new URLSearchParams(location.search).get('mode')||'diagnostic';const labels={diagnostic:['🎯 تشخيص المستوى','اختبار تشخيصي سريع لتحديد نقاط القوة والمهارات التي تحتاج إلى مراجعة.'],practice:['🎮 التدريب السنوي','تدريب متنوع على أهم مفردات وتراكيب الصف الرابع.'],final:['🏆 اختبار الجاهزية','اختبار ختامي لقياس الاستعداد للصف الخامس.']};const data={diagnostic:[['Comment tu t’appelles ?',['Je m’appelle Lina.','J’ai dix ans.','Bonjour.','Merci.'],0],['Quel âge as-tu ?',['Je m’appelle Sami.','J’ai neuf ans.','Salut !','À bientôt.'],1],['Choisis le bon mot : une école',['une école','un livre','une chaise','un garçon'],0],['Comment dire « صباح الخير » ?',['Bonsoir.','Bonjour.','Merci.','Au revoir.'],1],['Quelle couleur est le soleil ?',['bleu','vert','jaune','noir'],2],['Choisis le nombre 8.',['six','sept','huit','neuf'],2]],practice:[['Choisis la bonne réponse : Salut !',['Bonjour !','Au revoir !','Merci !','Pardon !'],0],['« Merci » signifie :',['من فضلك','شكرًا','آسف','وداعًا'],1],['Complète : Je ___ français.',['parle','parles','parlons','parlez'],0],['Choisis le féminin :',['un ami','un garçon','une amie','un livre'],2],['Quel jour vient après lundi ?',['dimanche','mardi','vendredi','samedi'],1],['Choisis le bon article : ___ livre',['une','des','un','la'],2],['Comment dire 5 ?',['quatre','cinq','six','sept'],1],['Choisis la bonne formule de départ.',['Bonjour','Au revoir','Merci','Pardon'],1]],final:[['Présente-toi : « Je m’appelle… »',['Je m’appelle Sara.','J’ai bleu.','Merci livre.','Au revoir dix.'],0],['Choisis : J’ai ___ ans.',['une','dix','français','école'],1],['« Au revoir » signifie :',['أهلًا','شكرًا','إلى اللقاء','صباح الخير'],2],['Complète : Nous ___ français.',['parle','parles','parlons','parlez'],2],['Choisis le pluriel de « un livre ».',['une livre','des livres','le livre','un livres'],1],['Quel mois vient après janvier ?',['mars','février','avril','juin'],1],['Choisis la couleur : la neige est…',['blanche','rouge','verte','bleue'],0],['Comment demander poliment ?',['Merci !','S’il vous plaît.','Au revoir.','Salut.'],1],['Quel est le bon nombre ? 10',['huit','neuf','dix','onze'],2],['Choisis la bonne réponse : Ça va ?',['Oui, ça va bien.','Je m’appelle Paul.','J’ai dix ans.','Au revoir.'],0]]};document.getElementById('title').textContent=labels[mode][0];document.getElementById('subtitle').textContent=labels[mode][1];const qs=data[mode]||data.diagnostic,form=document.getElementById('form'),answers={};form.innerHTML=qs.map((q,i)=>'<div class="q"><h3>'+(i+1)+'. '+q[0]+'</h3><div class="opts">'+q[1].map((o,k)=>'<button class="opt" type="button" data-i="'+i+'" data-k="'+k+'">'+o+'</button>').join('')+'</div></div>').join('');form.onclick=e=>{if(!e.target.classList.contains('opt'))return;const i=+e.target.dataset.i;answers[i]=+e.target.dataset.k;form.querySelectorAll('.opt[data-i="'+i+'"]').forEach(x=>x.classList.remove('sel'));e.target.classList.add('sel')};document.getElementById('submit').onclick=()=>{let score=0;qs.forEach((q,i)=>{if(answers[i]===q[2])score++});const pct=Math.round(score/qs.length*100);const r=document.getElementById('result');r.style.display='block';r.innerHTML='<div class="score">النتيجة: '+score+' / '+qs.length+' ('+pct+'%)</div><p class="muted">تم احتساب الأسئلة التي أُجيب عنها. يمكنك العودة إلى المراجعة ومتابعة المسار السنوي.</p>';window.scrollTo({top:r.offsetTop-20,behavior:'smooth'})}})();</script></body></html>
