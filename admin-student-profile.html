<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HM Academy - ملف الطالب الإداري</title>
<link rel="stylesheet" href="css/style.css?v=20260808">
<style>
.wrap{padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{padding:20px;background:#fff;border-radius:18px;box-shadow:0 5px 20px #0001}.tag{display:inline-block;padding:6px 12px;border-radius:20px;background:#eef7ff}
</style>
</head>
<body>
<header><h2>🇫🇷 HM Academy</h2><p>الملف الإداري للطالب</p></header>
<main class="wrap">
<div class="card"><h1 id="name">طالب HM Academy</h1><span class="tag" id="status">active</span></div>
<div class="grid" style="margin-top:20px">
<div class="card">المستوى<h2 id="level">A1</h2></div>
<div class="card">XP<h2 id="xp">0</h2></div>
<div class="card">الدروس المكتملة<h2 id="lessons">0</h2></div>
<div class="card">الشهادات<h2 id="certs">0</h2></div>
</div>
<div class="card" style="margin-top:20px"><h2>المهارات</h2><p id="skills">لا توجد بيانات إضافية</p></div>
</main>
<footer>HM Academy © 2026</footer>
<script>
(async()=>{try{const data=await (await fetch('data/admin-students.json')).json();const s=data.students[0]||{};name.textContent=s.name||'طالب HM Academy';status.textContent=s.status||'--';level.textContent=s.level||'--';xp.textContent=s.xp||0;lessons.textContent=s.completedLessons||0;certs.textContent=s.certificates||0;}catch(e){}})();
</script>
</body></html>
