<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>HM Academy - ملف الطالب الإداري</title><link rel="stylesheet" href="css/style.css?v=20260808"><style>.wrap{padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{padding:20px;background:#fff;border-radius:18px;box-shadow:0 5px 20px #0001}.tag{padding:6px 12px;border-radius:20px;background:#eef7ff;display:inline-block}.bar{height:12px;background:#eee;border-radius:10px}.fill{height:100%;background:#2563eb}</style></head>
<body><header><h2>🇫🇷 HM Academy</h2><p>الملف الإداري للطالب</p></header><main class="wrap"><div class="card"><h1 id="name">طالب HM Academy</h1><span class="tag" id="status">active</span></div><div class="grid"><div class="card">المستوى<h2 id="level">A1</h2></div><div class="card">XP<h2 id="xp">0</h2></div><div class="card">الدروس<h2 id="lessons">0</h2></div><div class="card">الشهادات<h2 id="certs">0</h2></div><div class="card">آخر تقييم<h2 id="score">--</h2></div></div><div class="card"><h2>تحليل المهارات</h2><div id="skills"></div></div><div class="card"><h2>تحليل التقييمات</h2><p id="assessment">لا توجد تقييمات بعد.</p></div><div class="card"><h2>توصيات المعلم</h2><p id="recommendation"></p></div></main><footer>HM Academy © 2026</footer>
<script>(async()=>{try{const [st,as]=await Promise.all([(await fetch('data/admin-students.json')).json(),(await fetch('data/admin-assessments.json')).json()]);const id=new URLSearchParams(location.search).get('id');const s=(st.students||[]).find(x=>x.id===id)||st.students[0]||{};const a=(as.assessments||[]).find(x=>x.studentId===s.id)||{};name.textContent=s.name||'طالب HM Academy';status.textContent=s.status||'--';level.textContent=s.level||'--';xp.textContent=s.xp||0;lessons.textContent=s.completedLessons||0;certs.textContent=s.certificates||0;score.textContent=(a.score||0)+'%';assessment.textContent=`المستوى: ${a.level||'--'} | نقاط القوة: ${(a.strengths||[]).join('، ')||'--'} | التحسين: ${(a.improvements||[]).join('، ')||'--'}`;const skills=s.skills||{};skills.innerHTML=Object.entries(skills).map(([k,v])=>`<p>${k}<div class="bar"><div class="fill" style="width:${v}%"></div></div></p>`).join('');recommendation.textContent=a.score>80?'مستوى ممتاز - جاهز للتقدم':'يحتاج إلى خطة تدريب إضافية';}catch(e){}})();</script></body></html>
