r=function(s){orig(s);if(s==='start')start();if(s==='under')under()};function shell(h,p){return '<div style="background:linear-gradient(135deg,#eef9ff,#fff3f7);border-radius:24px;padding:22px;margin-bottom:16px"><span style="display:inline-block;background:#4a7fb0;color:#fff;padding:7px 12px;border-radius:999px;font-weight:900">'+h+'</span><p style="font-weight:800;color:#5b5750;line-height:1.9">'+p+'</p></div>'}function start(){if(!D)return;const cards=D.items.map(x=>'<article class="card"><div class="visual" style="font-size:58px">'+x[0]+'</div><h3 class="fr">'+x[1]+'</h3><p class="ar">'+x[2]+'</p><div class="rule"><b>'+x[3]+'</b></div></article>').join('');d.getElementById('page').innerHTML=shell(D.title,D.focus)+'<div class="grid">'+cards+'</div><div class="rule" style="margin-top:16px"><b>🎯 هدف الدرس</b><p>افهم الكلمات أولاً، ثم استخدمها في جملة قصيرة قبل الانتقال إلى بقية رحلة التعلم.</p></div>'}function under(){if(!D)return;const qs=D.items.map((x,i)=>({q:'أي عبارة صحيحة؟ '+x[2],opts:[x[1],D.items[(i+1)%D.items.length][1],D.items[(i+2)%D.items.length][1]],ans:x[1]}));d.getElementById('page').innerHTML=shell('🧠 افهم — '+D.fr,'نحوّل المفردات إلى معنى وسياق، ثم نتحقق من الفهم بأسئلة متنوعة مرتبطة بمحتوى الدرس.')+'<div class="grid">'+qs.map(x=>'<article class="card"><h3>'+x.q+'</h3>'+x.opts.map(o=>'<button class="choice" data-v="'+o+'">'+o+'</button>').join('')+'<p class="feedback"></p></article>').join('')+'</div>';d.querySelectorAll('.choice').forEach(b=>b.onclick=function(){const c=this.parentElement;c.querySelectorAll('.choice').forEach(x=>x.classList.remove('ok','no'));const q=c.querySelector('h3').textContent;const ok=this.textContent===qs.find(x=>q.includes(x.q.slice(0,18)))?.ans;this.classList.add(ok?'ok':'no');c.querySelector('.feedback').textContent=ok?'✅ ممتاز! فهمت المعنى.':'❌ حاول مرة أخرى بناءً على الكلمة الفرنسية.'})}})})()</script></body></html>
