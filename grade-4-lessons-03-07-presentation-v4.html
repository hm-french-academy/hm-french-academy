<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173a82">
<link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2">
<title>HM Academy | Grade 4 · Mon visage</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fc}
#studio{display:block;width:100%;height:100%;border:0;background:#f5f7fc}
#load-error{display:none;position:fixed;inset:16px;z-index:10;place-items:center;background:#fff;border:1px solid #e5eaf3;border-radius:20px;padding:24px;text-align:center;font-family:Arial,sans-serif;color:#173a82;line-height:1.9}
</style>
</head>
<body>
<iframe id="studio" title="درس وجهي - الصف الرابع - HM Academy" allow="autoplay"></iframe>
<div id="load-error">تعذّر تحميل الدرس الآن.<br>تحقّق من اتصال الإنترنت ثم أعد فتح الصفحة.</div>
<script>
(function(){
 const frame=document.getElementById('studio');
 const params=new URLSearchParams(location.search);
 if(!params.has('id'))params.set('id','g4-l04');
 // Older student links use section=lesson; map that legacy value to the real opening section.
 if(!['start','vocab','under','rules','interact','talk','practice','media','review','after'].includes(params.get('section')))params.set('section','start');
 // Explicit build token prevents an old cached lesson file from hiding published changes.
 params.set('_build','20261019-face-map-3');
 frame.src='grade-4-lessons-03-07-live-v4.html?'+params.toString();
 frame.addEventListener('error',()=>document.getElementById('load-error').style.display='grid');
})();
</script>
</body>
</html>
