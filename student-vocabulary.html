<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | قاموسي الشخصي</title><link rel="stylesheet" href="css/premium-shell.css"><style>body{background:#f5f7fb}.wrap{max-width:1100px;margin:auto;padding:28px 16px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff;border-radius:28px;padding:25px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px;margin-top:18px}.card{background:#fff;border:1px solid #e1e7f0;border-radius:20px;padding:18px}.word{font-size:27px;font-weight:900}.fr{color:#2563eb;font-weight:900}.small{color:#718096;line-height:1.7}.btn{border:0;background:#2563eb;color:#fff;padding:10px 14px;border-radius:11px;cursor:pointer;font-weight:900}.empty{background:#fff;padding:25px;border-radius:20px;margin-top:18px}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="index.html">الرئيسية</a><a href="dashboard.html">الطالب</a><a href="academy-map.html">خريطة المنصة</a><a href="library.html">المكتبة</a></nav></header><main class="wrap"><section class="hero"><h1>📚 قاموسي الشخصي</h1><p>كل كلمة حفظتها كمكتسبة أثناء دراستك، مع المثال والنطق.</p></section><div id="stats"></div><section class="grid" id="words"></section></main><script src="scripts/vocabulary-runtime.js"></script><script>const p=HMVocabulary.getProgress(),keys=Object.keys(p).filter(k=>p[k]);const stats=document.getElementById('stats');stats.innerHTML='<div class="empty"><b>⭐ '+keys.length+' كلمة مكتسبة</b><p class="small">استمع للكلمة والمثال، ثم راجعها متى احتجت.</p></div>';const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const sources=['data/vocabulary/unit1/lesson1.json'];let all=[];for(const url of sources){try{const r=await fetch(url);if(r.ok){const d=await r.json();all=all.concat(d.vocabulary||[])}}catch(e){}}const learned=all.map((x,i)=>({x,i,key:`${x.lessonId||'lesson'}:${i}`})).filter(a=>keys.includes(a.key)||keys.some(k=>k.endsWith(':'+a.i)));document.getElementById('words').innerHTML=learned.length?learned.map(a=>`<article class="card"><div class="word">${esc(a.x.word)}</div><div class="fr">${esc(a.x.translation)}</div><p class="small">${esc(a.x.example)}</p><button class="btn" onclick="HMVocabulary.speak(${JSON.stringify(a.x.example)})">🔊 نطق المثال</button></article>`).join(''):'<div class="empty">لم تحفظ كلمات بعد. افتح مفردات أحد الدروس واختر «حفظ كمكتسبة» لتظهر هنا.</div>'}load();</script></body></html>
