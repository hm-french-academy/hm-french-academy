function initEtreGames(){const forms=[['Je','suis'],['Tu','es'],['Il / Elle','est'],['Nous','sommes'],['Vous','êtes'],['Ils / Elles','sont']];let index=0,score=0;const match=document.getElementById('etre-match'),builder=document.getElementById('etre-builder');if(!match||!builder)return;function drawMatch(){if(index>=forms.length){match.innerHTML='<div class="note">🏆 انتهت الجولة! نتيجتك '+score+' من '+forms.length+'.</div><button type="button" id="etre-restart">العب مرة أخرى ↻</button>';return}const row=forms[index],opts=[row[1],...forms.filter(x=>x[1]!==row[1]).map(x=>x[1]).sort(()=>Math.random()-.5).slice(0,2)].sort(()=>Math.random()-.5);match.innerHTML='<div class="fr" style="font-size:25px;margin:12px 0">'+row[0]+' ___</div><div class="options">'+opts.map(x=>'<button type="button" data-etre-choice="'+x+'" data-etre-correct="'+row[1]+'">'+x+'</button>').join('')+'</div><p id="etre-feedback" class="feedback"></p><p class="small">السؤال '+(index+1)+' من '+forms.length+' · النقاط '+score+'</p>'}function drawBuilder(){const words=['Je','suis','élève.'].sort(()=>Math.random()-.5);builder.innerHTML='<div id="etre-built" class="fr" style="min-height:45px;font-size:22px;margin:12px 0"></div><div class="game-controls">'+words.map((w,i)=>'<button type="button" data-etre-word="'+w+'" data-word-id="'+i+'">'+w+'</button>').join('')+'</div><div class="game-controls"><button type="button" id="etre-check">تحقق</button><button type="button" id="etre-reset">إعادة</button></div><p id="etre-builder-feedback" class="feedback"></p>'}match.onclick=e=>{const b=e.target.closest('[data-etre-choice]');if(b){const group=[...match.querySelectorAll('[data-etre-choice]')];group.forEach(x=>x.disabled=true);const ok=b.dataset.etreChoice===b.dataset.etreCorrect;if(ok){b.classList.add('good');score++}else{b.classList.add('bad');const right=group.find(x=>x.dataset.etreChoice===b.dataset.etreCorrect);if(right)right.classList.add('good')}document.getElementById('etre-feedback').textContent=ok?'✅ صحيح!':'الإجابة الصحيحة: '+b.dataset.etreCorrect;match.insertAdjacentHTML('beforeend','<button type="button" id="etre-next" style="margin-top:10px">السؤال التالي ←</button>');return}if(e.target.closest('#etre-next')){index++;drawMatch();return}if(e.target.closest('#etre-restart')){index=0;score=0;drawMatch()}};builder.onclick=e=>{const b=e.target.closest('[data-etre-word]');if(b){const out=document.getElementById('etre-built');out.textContent=(out.textContent+' '+b.dataset.etreWord).trim();b.disabled=true;return}if(e.target.closest('#etre-check')){const val=document.getElementById('etre-built').textContent.trim().replace(/\\s+/g,' ');document.getElementById('etre-builder-feedback').textContent=val==='Je suis élève.'?'✅ ممتاز! الجملة صحيحة.':'جرّب الترتيب: Je suis élève.';return}if(e.target.closest('#etre-reset'))drawBuilder()};drawMatch();drawBuilder()}

if(current==='practice') content='<section class="age-panel"><h2>✍️ تدريبات تفاعلية</h2><p class="age-lead">اختر كل إجابة صحيحة. في السؤال الأول توجد صيغتان صحيحتان للسؤال عن العمر.</p><div class="age-question" data-multi="1"><p>1. اختر الصيغ الصحيحة للسؤال عن العمر:</p>'+[['Quel âge as-tu ?','correct'],['Tu as quel âge ?','correct'],['Comment tu t’appelles ?','wrong']].map(x=>'<button class="age-option" data-answer="'+x[1]+'" onclick="ageMultiAnswer(this)">'+x[0]+'</button>').join('')+'<div class="age-feedback"></div><button class="age-btn secondary" onclick="ageCheckMulti(this)">تحقّق من اختياراتي</button></div>'+[['2. أكمل: J’___ treize ans.',['ai','as','est'],0],['3. معنى «J’ai douze ans» هو:',['عمري 12 سنة','اسمي 12','أنا في الفصل 12'],0],['4. أكمل: Elle ___ quinze ans.',['a','as','avons'],0],['5. اختر الإجابة المناسبة للسؤال Tu as quel âge ?',['J’ai treize ans.','J’habite au Caire.','Je m’appelle Sara.'],0],['6. اختر التصريف المناسب: Nous ___ quatorze ans.',['avons','avez','ont'],0]].map((q,i)=>'<div class="age-question"><p>'+q[0]+'</p>'+q[1].map((o,j)=>'<button class="age-option" data-answer="'+(j===q[2]?'correct':'wrong')+'" onclick="ageAnswer(this,this.dataset.answer)">'+o+'</button>').join('')+'<div class="age-feedback"></div></div>').join('')+'</section>';

if(current==='review') content='<section class="age-panel"><h2>🧠 خلاصة الدرس</h2><div class="age-rule"><div><b>Tu as quel âge ?</b><span>كم عمرك؟</span></div><div><b>J’ai … ans.</b><span>عمري … سنة.</span></div><div><b>avoir</b><span>الفعل المستخدم مع العمر</span></div><div><b>Quel âge as-tu ?</b><span>صيغة صحيحة أخرى للسؤال</span></div></div><h2 style="margin-top:20px">تذكّر التصريف</h2><p class="age-lead" dir="ltr">j’ai · tu as · il/elle a · nous avons · vous avez · ils/elles ont</p><div class="age-actions"><button class="age-btn" onclick="ageSection('practice')">حل التدريبات ←</button><button class="age-btn secondary" onclick="ageSection('assessment')">انتقل للتقييم</button></div></section>';

function ageSection(s){const p=new URLSearchParams(location.search);p.set('id','grade7-u2-l1');p.set('section',s);history.replaceState({},'',location.pathname+'?'+p.toString());render()}
function ageAnswer(b,state){const box=b.closest('.age-question');if(box.dataset.done)return;box.dataset.done='1';b.classList.add(state);box.querySelector('.age-feedback').textContent=state==='correct'?'✅ إجابة صحيحة!':'❌ إجابة غير صحيحة. راجع الإجابة المظللة بالأخضر.';if(state!=='correct'){const right=box.querySelector('.age-option[data-answer="correct"]');if(right)right.classList.add('correct')}[...box.querySelectorAll('.age-option')].forEach(x=>x.disabled=true)}
function ageMultiAnswer(b){if(b.closest('.age-question').dataset.checked)return;b.classList.toggle('correct');b.dataset.selected=b.dataset.selected==='1'?'0':'1'}
function ageCheckMulti(b){const box=b.closest('.age-question');if(box.dataset.checked)return;box.dataset.checked='1';let ok=true;box.querySelectorAll('.age-option').forEach(x=>{const should=x.dataset.answer==='correct',selected=x.dataset.selected==='1';if(should!==selected)ok=false;x.classList.remove('correct','wrong');x.classList.add(should?'correct':(selected?'wrong':''));x.disabled=true});box.querySelector('.age-feedback').textContent=ok?'✅ ممتاز! الصيغتان صحيحتان.':'راجِع الاختيارات: «Quel âge as-tu ?» و«Tu as quel âge ?» كلاهما صحيح.';b.disabled=true}
function render(){let[id,s]=qs(),m=LES.find(x=>x[0]===id)||LES[0],v=D[id]||[];if(id==='grade7-u2-l1'){renderAgeLesson(id,s,m,v);return}title.textContent=m[1]+' — '+m[2];goal.textContent='Source First · إثراء تعليمي منفصل · تقدم محفوظ على الجهاز';lessons.innerHTML=LES.map((x,i)=>'<a class="'+(x[0]===id?'on':'')+'" href="?id='+x[0]+'&section='+s+'">الدرس '+(i+1)+'</a>').join('');stages.innerHTML=ST.map(x=>'<a class="'+(x[0]===s?'on':'')+'" href="?id='+id+'&section='+x[0]+'">'+x[1]+'</a>').join('');save(id,s);let h='';if(s==='intro')h='<h2>🚀 البداية</h2><p>'+m[2]+'</p><div>'+RULE[id].map(x=>'<span class="pill">'+x+'</span>').join('')+'</div><p class="small">المحتوى الأصلي هو المرجع. لا تُعرض الإضافات باعتبارها جزءًا من المصدر.</p>';else if(s==='vocab')h='<h2>🖼️ المفردات</h2>'+cards(v);else if(s==='pron')h='<h2>🎧 النطق</h2><p>اضغط «استمع» ثم كرر بصوتك.</p>'+cards(v);else if(s==='grammar')h='<h2>📘 القواعد</h2><div class="note">يتم عرض القاعدة المرتبطة فعليًا بالدرس. لا تُنسب هذه الصفحة للمصدر إذا كانت شرحًا إثرائيًا.</div><p>'+RULE[id].join(' · ')+'</p>';else if(s==='conversation')h='<h2>💬 المحادثة</h2><div class="note">الحوار لا يُقدَّم كمحتوى أصلي إلا إذا كان موجودًا في المصدر المستخرج لهذا الدرس.</div>';else if(s==='practice')h='<h2>✍️ التدريب</h2>'+quiz(v.slice(0,6).map((x,i)=>({q:'اختر العنصر الصحيح: '+x[0],o:[x[0],(v[(i+1)%v.length]||x)[0],(v[(i+2)%v.length]||x)[0]],a:0})));else if(s==='video')h='<h2>🎬 الفيديو</h2><div class="note">سيتم تشغيل الـasset الأصلي فقط عندما يكون مساره متاحًا وموثقًا. لا توجد روابط فيديو مخترعة.</div>';else if(s==='games')h=id==='grade7-u1-l4'?etreGames():'<h2>🎮 الألعاب</h2><p>مطابقة وفرز وتعرّف مبنية على عناصر الدرس.</p>'+cards(v.slice(0,8));else if(s==='review')h='<h2>🧠 المراجعة الذكية</h2><p>المراجعة مبنية على العناصر التي تم فتحها والأخطاء التي ظهرت أثناء التدريب.</p>';else if(s==='assessment')h='<h2>🏆 التقييم</h2><div class="note">هذا تقييم تدريبي. لا يُعرض كتقييم رسمي إلا بعد دمج ملف التقييم الأصلي والتحقق من أسئلته وإجاباته.</div>'+quiz(v.slice(0,6).map((x,i)=>({q:'تحقق: '+x[0],o:[x[0],(v[(i+3)%v.length]||x)[0],(v[(i+5)%v.length]||x)[0]],a:0})));else{let n=prog(id),p=Math.round(n/ST.length*100);h='<h2>📈 التقدم</h2><p>'+n+' / '+ST.length+' مراحل مكتملة · '+p+'%</p><div class="bar"><div class="fill" style="width:'+p+'%"></div></div><p class="small">يُحفظ التقدم محليًا على هذا الجهاز.</p>'}main.innerHTML=h;if(id==='grade7-u1-l4'&&s==='games')initEtreGames()}render();</script></body></html>
