function speak(t){
  const status=document.getElementById('hm-speech-status');
  const sayStatus=m=>{if(status)status.textContent=m};
  try{
    const synth=window.speechSynthesis;
    if(!synth || !('SpeechSynthesisUtterance' in window)){
      sayStatus('هذا المتصفح لا يدعم النطق الصوتي. جرّب Google Chrome على الهاتف.');
      return false;
    }
    const phrase=String(t||'').trim();
    if(!phrase)return false;
    if(hmSpeechPending){clearTimeout(hmSpeechPending);hmSpeechPending=null;}
    synth.cancel();
    try{synth.resume()}catch(e){}
    sayStatus('⏳ جارٍ تجهيز النطق الفرنسي…');
    const speakNow=()=>{
      try{
        const utterance=new SpeechSynthesisUtterance(phrase);
        utterance.lang='fr-FR';
        utterance.rate=0.82;
        utterance.pitch=1;
        utterance.volume=1;
        const voices=synth.getVoices?synth.getVoices():[];
        const frenchVoice=voices.find(v=>/^fr[-_]/i.test(v.lang)) || voices.find(v=>/french|français/i.test(v.name));
        if(frenchVoice)utterance.voice=frenchVoice;
        utterance.onstart=()=>sayStatus('🔊 استمع إلى النطق الفرنسي');
        utterance.onend=()=>sayStatus('');
        utterance.onerror=(event)=>{
          sayStatus('لم يعمل الصوت على هذا الجهاز. تأكد من تثبيت وتفعيل خدمة تحويل النص إلى كلام (TTS) وصوت فرنسي.');
        };
        synth.speak(utterance);
        // Chrome on Android may leave speech paused after cancel; resume after enqueue.
        setTimeout(()=>{try{if(synth.paused)synth.resume()}catch(e){}},180);
      }catch(err){sayStatus('تعذّر تشغيل الصوت. تحقق من إعدادات النطق في الجهاز.')}
    };
    // Android Chrome may populate its voice list asynchronously.
    const voices=synth.getVoices?synth.getVoices():[];
    if(voices.length){hmSpeechPending=setTimeout(()=>{hmSpeechPending=null;speakNow()},80);}
    else{
      let finished=false;
      const run=()=>{if(finished)return;finished=true;synth.removeEventListener?.('voiceschanged',run);hmSpeechPending=null;speakNow()};
      synth.addEventListener?.('voiceschanged',run);
      hmSpeechPending=setTimeout(run,900);
    }
    return true;
  }catch(err){sayStatus('خاصية النطق غير متاحة حاليًا في المتصفح.');return false}

function initEtreGames(){const forms=[['Je','suis'],['Tu','es'],['Il / Elle','est'],['Nous','sommes'],['Vous','êtes'],['Ils / Elles','sont']];let index=0,score=0;const match=document.getElementById('etre-match'),builder=document.getElementById('etre-builder');if(!match||!builder)return;function drawMatch(){if(index>=forms.length){match.innerHTML='<div class="note">🏆 انتهت الجولة! نتيجتك '+score+' من '+forms.length+'.</div><button type="button" id="etre-restart">العب مرة أخرى ↻</button>';return}const row=forms[index],opts=[row[1],...forms.filter(x=>x[1]!==row[1]).map(x=>x[1]).sort(()=>Math.random()-.5).slice(0,2)].sort(()=>Math.random()-.5);match.innerHTML='<div class="fr" style="font-size:25px;margin:12px 0">'+row[0]+' ___</div><div class="options">'+opts.map(x=>'<button type="button" data-etre-choice="'+x+'" data-etre-correct="'+row[1]+'">'+x+'</button>').join('')+'</div><p id="etre-feedback" class="feedback"></p><p class="small">السؤال '+(index+1)+' من '+forms.length+' · النقاط '+score+'</p>'}function drawBuilder(){const words=['Je','suis','élève.'].sort(()=>Math.random()-.5);builder.innerHTML='<div id="etre-built" class="fr" style="min-height:45px;font-size:22px;margin:12px 0"></div><div class="game-controls">'+words.map((w,i)=>'<button type="button" data-etre-word="'+w+'" data-word-id="'+i+'">'+w+'</button>').join('')+'</div><div class="game-controls"><button type="button" id="etre-check">تحقق</button><button type="button" id="etre-reset">إعادة</button></div><p id="etre-builder-feedback" class="feedback"></p>'}match.onclick=e=>{const b=e.target.closest('[data-etre-choice]');if(b){const group=[...match.querySelectorAll('[data-etre-choice]')];group.forEach(x=>x.disabled=true);const ok=b.dataset.etreChoice===b.dataset.etreCorrect;if(ok){b.classList.add('good');score++}else{b.classList.add('bad');const right=group.find(x=>x.dataset.etreChoice===b.dataset.etreCorrect);if(right)right.classList.add('good')}document.getElementById('etre-feedback').textContent=ok?'✅ صحيح!':'الإجابة الصحيحة: '+b.dataset.etreCorrect;match.insertAdjacentHTML('beforeend','<button type="button" id="etre-next" style="margin-top:10px">السؤال التالي ←</button>');return}if(e.target.closest('#etre-next')){index++;drawMatch();return}if(e.target.closest('#etre-restart')){index=0;score=0;drawMatch()}};builder.onclick=e=>{const b=e.target.closest('[data-etre-word]');if(b){const out=document.getElementById('etre-built');out.textContent=(out.textContent+' '+b.dataset.etreWord).trim();b.disabled=true;return}if(e.target.closest('#etre-check')){const val=document.getElementById('etre-built').textContent.trim().replace(/\\s+/g,' ');document.getElementById('etre-builder-feedback').textContent=val==='Je suis élève.'?'✅ ممتاز! الجملة صحيحة.':'جرّب الترتيب: Je suis élève.';return}if(e.target.closest('#etre-reset'))drawBuilder()};drawMatch();drawBuilder()}

te">هذا تقييم تدريبي. لا يُعرض كتقييم رسمي إلا بعد دمج ملف التقييم الأصلي والتحقق من أسئلته وإجاباته.</div>'+quiz(v.slice(0,6).map((x,i)=>({q:'تحقق: '+x[0],o:[x[0],(v[(i+3)%v.length]||x)[0],(v[(i+5)%v.length]||x)[0]],a:0})));else{let n=prog(id),p=Math.round(n/ST.length*100);h='<h2>📈 التقدم</h2><p>'+n+' / '+ST.length+' مراحل مكتملة · '+p+'%</p><div class="bar"><div class="fill" style="width:'+p+'%"></div></div><p class="small">يُحفظ التقدم محليًا على هذا الجهاز.</p>'}main.innerHTML=h;if(id==='grade7-u1-l4'&&s==='games')initEtreGames()}render();</script></body></html>
