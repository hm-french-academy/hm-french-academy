<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | الصف الأول الإعدادي</title><style>body{margin:0;background:#f4f7fb;color:#17233d;font-family:Arial,sans-serif}.wrap{max-width:1120px;margin:auto;padding:14px}.hero,.panel{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 5px 18px #0001}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#159b8b);color:#fff}.nav{display:flex;gap:7px;overflow:auto}.nav a{padding:9px 11px;background:#edf2fb;border-radius:10px;text-decoration:none;font-weight:700;white-space:nowrap;color:#173a82}.nav a.on{background:#2563eb;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}.card{background:#fff;border:1px solid #dce5f1;border-radius:14px;padding:13px}.fr{direction:ltr;text-align:center;font-size:20px;font-weight:800}.ar{text-align:center;margin:6px;color:#365d9f}.btn{border:0;border-radius:9px;padding:8px 11px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.opt{display:block;width:100%;margin:5px 0;padding:9px;border:1px solid #d7dfeb;border-radius:9px;background:#f8fafc;text-align:right;cursor:pointer}.good{background:#dff7e8!important}.bad{background:#ffe4e8!important}.note{padding:12px;border-right:4px solid #f59e0b;background:#fff8e8;border-radius:9px}.small{font-size:13px;color:#65738b;line-height:1.7}.bar{height:9px;background:#e5ebf4;border-radius:20px;overflow:hidden}.fill{height:100%;background:#2563eb;width:0}.pill{display:inline-block;padding:5px 8px;border-radius:20px;background:#edf2fb;margin:3px;font-size:13px}</style><body><div class="wrap"><section class="hero"><div>🇫🇷 HM Academy · Learning Studio</div><h1 id="title"></h1><p id="goal"></p></section><div class="panel nav" id="lessons"></div><div class="panel nav" id="stages"></div><main class="panel" id="main"></main></div><script>
const ST=[['intro','🚀 البداية'],['vocab','🖼️ المفردات'],['pron','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];
const LES=[['grade7-u1-l1','L’alphabet et les mots transparents','الأبجدية والكلمات الشفافة'],['grade7-u1-l2','Les salutations','التحيات'],['grade7-u1-l3','Les pronoms sujets et les verbes en -er','ضمائر الفاعل وأفعال -er'],['grade7-u1-l4','Le verbe être et la présentation','être والتقديم'],['grade7-u1-l5','Les nombres (0-20)','الأعداد 0–20'],['grade7-u1-l6','L’heure','الساعة'],['grade7-u2-l1','Tu as quel âge ?','كم عمرك؟'],['grade7-u2-l2','Qu’est-ce que c’est ? Les objets de la classe','ما هذا؟ أدوات الفصل'],['grade7-u3-l1','Les couleurs','الألوان'],['grade7-u3-l2','Les articles définis et les jours de la semaine','أدوات المعرفة وأيام الأسبوع'],['grade7-u3-l3','Les mois de l’année et les saisons','الشهور والفصول']];
const D={
'grade7-u1-l1':[['A','arbre — شجرة'],['E','éléphant — فيل'],['I','image — صورة'],['O','orange — برتقالة'],['U','uniforme — زي مدرسي'],['Y','yoyo — يويو'],['H','hôpital — مستشفى'],['Un pyjama','بيجاما'],['Un pantalon','بنطلون'],['Un taxi','تاكسي'],['Un domino','دومينو'],['Un canapé','كنبة'],['Un téléphone','تليفون'],['Un biscuit','بسكويت'],['Un balcon','بلكونة'],['Un vase','فازة'],['Un ascenseur','أسانسير'],['Une caméra','كاميرا'],['Un autobus','أوتوبيس'],['Un gilet','جيلية'],['Une écharpe','إيشارب'],['Un bouquet','باقة ورد'],['Une guitare','جيتار'],['Une télévision','تليفزيون'],['Une plage','شاطئ'],['Une lampe','لمبة'],['Une raquette','مضرب'],['Une radio','راديو'],['Un piano','بيانو'],['Un garage','جراج'],['Un cinéma','سينما'],['Un journal','جورنال']],
'grade7-u1-l2':[['Bonjour','مرحبًا'],['Salut','أهلًا'],['Bonsoir','مساء الخير'],['Ça va bien','أنا بخير'],['Ça va mal','لست بخير'],['Comme ci, comme ça','هكذا هكذا']],
'grade7-u1-l3':[['Je','أنا'],['Tu','أنت'],['Il','هو'],['Elle','هي'],['Nous','نحن'],['Vous','أنتم'],['Ils','هم'],['Elles','هنّ'],['parler','يتحدث'],['aimer','يحب'],['habiter','يسكن']],
'grade7-u1-l4':[['Je suis','أنا'],['Tu es','أنت'],['Il est','هو'],['Elle est','هي'],['Nous sommes','نحن'],['Vous êtes','أنتم'],['Ils sont','هم'],['Elles sont','هنّ']],
'grade7-u1-l5':[['zéro','0'],['un','1'],['deux','2'],['trois','3'],['quatre','4'],['cinq','5'],['six','6'],['sept','7'],['huit','8'],['neuf','9'],['dix','10'],['onze','11'],['douze','12'],['treize','13'],['quatorze','14'],['quinze','15'],['seize','16'],['dix-sept','17'],['dix-huit','18'],['dix-neuf','19'],['vingt','20']],
'grade7-u1-l6':[['Il est une heure','1:00'],['Il est deux heures cinq','2:05'],['Il est deux heures dix','2:10'],['Il est deux heures et quart','2:15'],['Il est deux heures vingt','2:20'],['Il est deux heures et demie','2:30'],['Il est trois heures moins vingt','2:40'],['Il est trois heures moins le quart','2:45'],['Il est trois heures moins cinq','2:55'],['Il est midi','12:00'],['Il est minuit','00:00']],
'grade7-u2-l1':[['J’ai','ai'],['Tu as','as'],['Il / Elle a','a'],['Nous avons','avons'],['Vous avez','avez'],['Ils / Elles ont','ont'],['J’ai treize ans.','عمري 13 سنة']],
'grade7-u2-l2':[['un','مذكر مفرد'],['une','مؤنث مفرد'],['des','جمع'],['un livre','كتاب'],['un cahier','كراسة'],['un stylo','قلم'],['un crayon','قلم رصاص'],['un banc','مقعد'],['un tableau','سبورة'],['un sac à dos','حقيبة ظهر'],['une maison','منزل'],['une règle','مسطرة'],['une trousse','مقلمة'],['une chaise','كرسي'],['une table','طاولة'],['une gomme','ممحاة'],['une porte','باب'],['une fenêtre','نافذة'],['une classe','فصل']],
'grade7-u3-l1':[['rouge','أحمر'],['orange','برتقالي'],['blanc','أبيض'],['gris','رمادي'],['bleu','أزرق'],['violet','بنفسجي'],['jaune','أصفر'],['vert','أخضر'],['marron','بني'],['rose','وردي'],['noir','أسود']],
'grade7-u3-l2':[['Le','مذكر مفرد'],['La','مؤنث مفرد'],['L’','قبل حرف متحرك'],['Les','جمع'],['Lundi','الاثنين'],['Mardi','الثلاثاء'],['Mercredi','الأربعاء'],['Jeudi','الخميس'],['Vendredi','الجمعة'],['Samedi','السبت'],['Dimanche','الأحد']],
'grade7-u3-l3':[['Janvier','يناير'],['Février','فبراير'],['Mars','مارس'],['Avril','أبريل'],['Mai','مايو'],['Juin','يونيو'],['Juillet','يوليو'],['Août','أغسطس'],['Septembre','سبتمبر'],['Octobre','أكتوبر'],['Novembre','نوفمبر'],['Décembre','ديسمبر'],['Le printemps','الربيع'],['L’été','الصيف'],['L’automne','الخريف'],['L’hiver','الشتاء'],['Il fait beau','الجو جميل'],['Il fait chaud','الجو حار'],['Il fait mauvais','الجو سيئ'],['Il fait froid','الجو بارد']]};
const RULE={
'grade7-u1-l1':['alphabet','source-vocabulary'],'grade7-u1-l2':['salutations'],'grade7-u1-l3':['pronouns','-er verbs'],'grade7-u1-l4':['être','presentation'],'grade7-u1-l5':['numbers 0-20'],'grade7-u1-l6':['telling time'],'grade7-u2-l1':['avoir','age'],'grade7-u2-l2':['indefinite articles','classroom objects'],'grade7-u3-l1':['colors','agreement'],'grade7-u3-l2':['definite articles','weekdays'],'grade7-u3-l3':['months','seasons','weather']};
function qs(){let q=new URLSearchParams(location.search);return[q.get('id')||'grade7-u1-l1',q.get('section')||'intro']};function save(id,s){let k='hm-g7-progress-'+id,st=JSON.parse(localStorage.getItem(k)||'{}');st[s]=true;localStorage.setItem(k,JSON.stringify(st))};function prog(id){let st=JSON.parse(localStorage.getItem('hm-g7-progress-'+id)||'{}');return ST.filter(x=>st[x[0]]).length};function speak(t){if(!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';speechSynthesis.speak(u)}function cards(a){return '<div class="grid">'+a.map(x=>'<article class="card"><div class="fr">'+x[0]+'</div><div class="ar">'+x[1]+'</div><button class="btn" onclick="speak('+JSON.stringify(x[0])+')">🔊 استمع</button></article>').join('')+'</div>'};function quiz(a){return '<div>'+a.map(q=>'<article class="card"><b>'+q.q+'</b>'+q.o.map((o,i)=>'<button class="opt" onclick="answer(this,'+i+','+q.a+')">'+o+'</button>').join('')+'</article>').join('')+'</div>'};function answer(b,i,a){let box=b.parentNode;if(box.dataset.done)return;box.dataset.done=1;[...box.querySelectorAll('.opt')].forEach((x,n)=>{if(n===a)x.classList.add('good')});if(i!==a)b.classList.add('bad')};
function render(){let[id,s]=qs(),m=LES.find(x=>x[0]===id)||LES[0],v=D[id]||[];title.textContent=m[1]+' — '+m[2];goal.textContent='Source First · إثراء تعليمي منفصل · تقدم محفوظ على الجهاز';lessons.innerHTML=LES.map((x,i)=>'<a class="'+(x[0]===id?'on':'')+'" href="?id='+x[0]+'&section='+s+'">الدرس '+(i+1)+'</a>').join('');stages.innerHTML=ST.map(x=>'<a class="'+(x[0]===s?'on':'')+'" href="?id='+id+'&section='+x[0]+'">'+x[1]+'</a>').join('');save(id,s);let h='';if(s==='intro')h='<h2>🚀 البداية</h2><p>'+m[2]+'</p><div>'+RULE[id].map(x=>'<span class="pill">'+x+'</span>').join('')+'</div><p class="small">المحتوى الأصلي هو المرجع. لا تُعرض الإضافات باعتبارها جزءًا من المصدر.</p>';else if(s==='vocab')h='<h2>🖼️ المفردات</h2>'+cards(v);else if(s==='pron')h='<h2>🎧 النطق</h2><p>اضغط «استمع» ثم كرر بصوتك.</p>'+cards(v);else if(s==='grammar')h='<h2>📘 القواعد</h2><div class="note">يتم عرض القاعدة المرتبطة فعليًا بالدرس. لا تُنسب هذه الصفحة للمصدر إذا كانت شرحًا إثرائيًا.</div><p>'+RULE[id].join(' · ')+'</p>';else if(s==='conversation')h='<h2>💬 المحادثة</h2><div class="note">الحوار لا يُقدَّم كمحتوى أصلي إلا إذا كان موجودًا في المصدر المستخرج لهذا الدرس.</div>';else if(s==='practice')h='<h2>✍️ التدريب</h2>'+quiz(v.slice(0,6).map((x,i)=>({q:'اختر العنصر الصحيح: '+x[0],o:[x[0],(v[(i+1)%v.length]||x)[0],(v[(i+2)%v.length]||x)[0]],a:0})));else if(s==='video')h='<h2>🎬 الفيديو</h2><div class="note">سيتم تشغيل الـasset الأصلي فقط عندما يكون مساره متاحًا وموثقًا. لا توجد روابط فيديو مخترعة.</div>';else if(s==='games')h='<h2>🎮 الألعاب</h2><p>مطابقة وفرز وتعرّف مبنية على عناصر الدرس.</p>'+cards(v.slice(0,8));else if(s==='review')h='<h2>🧠 المراجعة الذكية</h2><p>المراجعة مبنية على العناصر التي تم فتحها والأخطاء التي ظهرت أثناء التدريب.</p>';else if(s==='assessment')h='<h2>🏆 التقييم</h2><div class="note">هذا تقييم تدريبي. لا يُعرض كتقييم رسمي إلا بعد دمج ملف التقييم الأصلي والتحقق من أسئلته وإجاباته.</div>'+quiz(v.slice(0,6).map((x,i)=>({q:'تحقق: '+x[0],o:[x[0],(v[(i+3)%v.length]||x)[0],(v[(i+5)%v.length]||x)[0]],a:0})));else{let n=prog(id),p=Math.round(n/ST.length*100);h='<h2>📈 التقدم</h2><p>'+n+' / '+ST.length+' مراحل مكتملة · '+p+'%</p><div class="bar"><div class="fill" style="width:'+p+'%"></div></div><p class="small">يُحفظ التقدم محليًا على هذا الجهاز.</p>'}main.innerHTML=h}render();</script></body></html>
