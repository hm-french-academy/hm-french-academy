<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a56"><title>HM Academy | الصف الأول الإعدادي</title><style>:root{--n:#102a56;--b:#2563eb;--t:#0f9f91;--g:#c18a2b;--ink:#14213d;--muted:#667085;--line:#e1e7f0;--ok:#087443;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef4ff,#fff);color:var(--ink);font-family:Arial,"Noto Sans Arabic",sans-serif;line-height:1.7}.wrap{max-width:1180px;margin:auto;padding:10px}.hero{background:linear-gradient(135deg,#102a56,#2455a6,#0f9f91);color:#fff;border-radius:24px;padding:22px;box-shadow:0 15px 40px #102a5620}.hero h1{margin:6px 0;font-size:clamp(24px,4vw,40px)}.fr{direction:ltr;text-align:right;font-weight:900}.bar{display:flex;gap:7px;overflow:auto;background:#fff;padding:10px;border:1px solid var(--line);border-radius:18px;margin-top:12px}.bar a{white-space:nowrap;text-decoration:none;background:#eef3fb;color:var(--n);padding:8px 12px;border-radius:999px;font-weight:800}.bar a.on{background:var(--b);color:#fff}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:18px}.panel{padding:16px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}.card{padding:14px}.visual{font-size:42px;text-align:center}.ar{text-align:center;color:#315aa4;font-weight:800}.note{padding:12px;border-radius:12px;background:#f8fafc;border-right:4px solid #94a3b8;margin:10px 0}.enriched{background:#effbf8;border-right-color:var(--t)}button{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer;background:var(--b);color:#fff}.options{display:grid;gap:7px;margin-top:8px}.options button{text-align:right;background:#fff;color:var(--ink);border:1px solid var(--line)}.feedback{min-height:24px;margin-top:7px}.ok{color:var(--ok);font-weight:900}.bad{color:var(--bad);font-weight:900}.score{font-size:22px;font-weight:900}.progress{height:10px;background:#e8edf5;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--t))}.cta{display:inline-block;text-decoration:none;background:var(--b);color:#fff;border-radius:11px;padding:10px 14px;font-weight:900;margin:4px}.secondary{background:#eef3fb;color:var(--n)}.footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}@media(max-width:650px){.wrap{padding:7px}.panel{padding:12px}.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header class="hero"><b>🇫🇷 HM Academy · الصف الأول الإعدادي</b><h1 id="title">جاري التحميل…</h1><div id="fr" class="fr"></div><p id="goal"></p></header><nav class="bar" id="nav"></nav><main class="panel" id="app">جاري تجهيز الدرس…</main><footer class="footer">HM Academy · تعلّم الفرنسية بطريقة أبسط وأذكى.</footer></div><script>
const p=new URLSearchParams(location.search),id=p.get('id')||'grade7-u1-l1',sec=p.get('section')||'introduction';
const paths={'grade7-u1-l1':'unit-1/lesson-1-gold-standard.json','grade7-u1-l2':'unit-1/lesson-2.json','grade7-u1-l3':'unit-1/lesson-3.json','grade7-u1-l4':'unit-1/lesson-4.json','grade7-u1-l5':'unit-1/lesson-5.json','grade7-u1-l6':'unit-1/lesson-6.json','grade7-u2-l1':'unit-2/lesson-1.json','grade7-u2-l2':'unit-2/lesson-2.json','grade7-u3-l1':'unit-3/lesson-1.json','grade7-u3-l2':'unit-3/lesson-2.json','grade7-u3-l3':'unit-3/lesson-3.json'};
const stages=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];
let D={};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s??'').trim().toLowerCase().replace(/[.!؟?،,:;«»]/g,'').replace(/\s+/g,' ');const shuffle=a=>[...a].sort(()=>Math.random()-.5);function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function nav(){document.getElementById('nav').innerHTML=stages.map(x=>`<a class="${x[0]===sec?'on':''}" href="?id=${encodeURIComponent(id)}&section=${x[0]}">${x[1]}</a>`).join('')}
function vocab(){const items=(D.journeyContent?.vocabulary?.items||[]).filter(x=>x&&x[0]);return `<h2>🖼️ المفردات</h2><p class="note enriched">تعلم الكلمة مع معناها ثم استمع إليها وكررها.</p><div class="grid">${items.map(x=>`<article class="card"><b dir="ltr">${esc(x[0])}</b><p class="ar">${esc(x[1]||'')}</p>${x[2]?`<p dir="ltr">${esc(x[2])}</p>`:''}<button onclick='speak(${JSON.stringify(x[0])})'>🔊 استمع</button></article>`).join('')}</div>`}
function introduction(){const j=D.journeyContent?.introduction||{};return `<h2>🚀 البداية</h2><div class="note enriched"><b>هدف الدرس</b><br>${esc(j.goal||'اكتشف عناصر الدرس ثم طبّقها خطوة بخطوة.')}</div><p>هذا الدرس مبني على المحتوى الأصلي، مع إثراءات تفاعلية واضحة لا تستبدل المصدر.</p><a class="cta" href="?id=${encodeURIComponent(id)}&section=vocabulary">ابدأ الاكتشاف ←</a>`}
function pronunciation(){const j=D.journeyContent?.pronunciation||{},items=Array.isArray(j.items)?j.items:[];return `<h2>🎧 النطق</h2><p class="note">استمع، كرر، ثم أعد المحاولة. عناصر النطق هنا مرتبطة بمفردات الدرس.</p><div class="grid">${items.map(x=>`<article class="card"><b dir="ltr">${esc(x)}</b><br><button onclick='speak(${JSON.stringify(x)})'>🔊 استمع</button></article>`).join('')}</div>`}
function grammar(){const j=D.journeyContent?.grammar||{};return `<h2>📘 القواعد</h2>${j.sourceBoundary?`<p class="note enriched">${esc(j.sourceBoundary)}</p>`:''}<div class="grid">${(j.notes||[]).map((n,i)=>`<article class="card"><b>${i+1}. القاعدة في صورة مبسطة</b><p>${esc(n)}</p></article>`).join('')||'<p class="note">راجع القاعدة من الأمثلة والأنشطة الأصلية لهذا الدرس.</p>'}</div>`}
function conversation(){const j=D.journeyContent?.conversation||{};const s=j.sourcePreserved||[];return `<h2>💬 المحادثة</h2><p class="note">نحافظ على الحوار الأصلي ونفصل عنه الأنشطة الإثرائية.</p><div class="grid">${s.map((x,i)=>`<article class="card"><b>${i+1}</b><p dir="ltr">${esc(x)}</p><button onclick='speak(${JSON.stringify(x)})'>🔊 استمع</button></article>`).join('')||'<p>لا يوجد حوار نصي محفوظ في هذا الدرس.</p>'}</div><div class="note enriched"><b>تطبيق إثرائي:</b> اقرأ الحوار بصوت مرتفع، ثم حاول إعادة إنتاجه دون النظر إلى النص.</div>`}
function makeQs(count=6){const v=(D.journeyContent?.vocabulary?.items||[]).filter(x=>x&&x[0]&&x[1]);let qs=[];for(const x of shuffle(v).slice(0,Math.min(v.length,count))){qs.push({q:`ما معنى «${x[0]}»؟`,opts:[x[1],...shuffle(v.filter(y=>y!==x)).slice(0,2).map(y=>y[1])],a:x[1],why:`هذه المفردة جزء من محتوى الدرس.`})}return qs}
function quiz(qs,prefix){return `<div class="grid">${qs.map((q,i)=>`<article class="card"><b>${i+1}. ${esc(q.q)}</b><div class="options">${shuffle(q.opts).map(o=>`<button onclick='answer(${JSON.stringify(prefix+i)},${JSON.stringify(o)},${JSON.stringify(q.a)},this,${JSON.stringify(q.why)})'>${esc(o)}</button>`).join('')}</div><div class="feedback" id="f-${prefix+i}"></div></article>`).join('')}</div>`}
function answer(k,v,c,b,why){const f=document.getElementById('f-'+k);if(v===c){f.innerHTML='<span class="ok">✅ صحيح — أحسنت!</span>';b.disabled=true}else{f.innerHTML=`<span class="bad">❌ ليست الإجابة الصحيحة.</span><br><span class="muted">💡 ${esc(why)}</span>`}if(v!==c)b.disabled=true}
function practice(){const qs=makeQs(6);return `<h2>✍️ التدريب التفاعلي</h2><p class="note">تدريب قصير من مفردات الدرس مع تصحيح فوري.</p>${quiz(qs,'p')}`}
function assessment(){const qs=makeQs(20);return `<h2>🏆 التقييم</h2><p class="note">تقييم ختامي من 20 عنصرًا مبني على عناصر الدرس المتاحة في المصدر. كل إجابة تُصحح فورًا.</p>${quiz(qs,'a')}`}
function games(){const g=D.journeyContent?.games||[];return `<h2>🎮 الألعاب</h2><div class="grid">${g.map((x,i)=>`<article class="card"><div class="visual">🎮</div><b>${i+1}. ${esc(x)}</b><p class="muted">تحدٍ قصير: اختر مفردة أو تعبيرًا من الدرس وطبّقه في موقف مناسب.</p></article>`).join('')||'<p>ألعاب هذا الدرس قيد التجهيز من الأنشطة الأصلية.</p>'}</div>`}
function video(){const source=D.sourceAssets?.video||D.videoUrl||D.video;return `<h2>🎬 الفيديو</h2><div class="note">الفيديو الأصلي يُعرض عندما يكون رابطه محفوظًا في بيانات المصدر.</div>${source?`<div class="card"><video controls playsinline preload="metadata" src="${esc(source)}"></video></div>`:'<div class="card"><p>لا يوجد رابط فيديو مباشر محفوظ في بيانات هذا الدرس حاليًا. لن نستبدل الفيديو الأصلي بفيديو آخر.</p></div>'}`}
function review(){return `<h2>🧠 المراجعة الذكية</h2><div class="note enriched">مراجعة مستقلة خارج محتوى الدرس، مرتبطة مباشرة بمعرّف هذا الدرس.</div><a class="cta" href="grade7-smart-review.html?lesson=${encodeURIComponent(id)}">فتح المراجعة الذكية ←</a>`}
function progress(){const k='hm_g7_'+id+'_progress',v=Number(localStorage.getItem(k)||0);return `<h2>📈 التقدم</h2><div class="card"><b>تقدم هذا الدرس</b><div class="progress" style="margin:12px 0"><i style="width:${Math.min(100,v)}%"></i></div><p>${Math.min(100,v)}%</p><button onclick='localStorage.setItem(${JSON.stringify(k)},"100");location.reload()'>تسجيل إتمام الدرس</button></div>`}
function render(){const map={introduction, vocabulary:vocab,pronunciation,grammar,conversation,practice,video,games, 'smart-review':review,assessment,progress};document.getElementById('app').innerHTML=(map[sec]||introduction)();nav()}
async function load(){try{let r=await fetch(`data/lessons/grade-7/${paths[id]}?v=20260908-studio`,{cache:'no-store'});let x=await r.json();for(let i=0;i<8&&typeof x.content==='string';i++)x=JSON.parse(x.content);D=x;document.getElementById('title').textContent=D.titleAr||id;document.getElementById('fr').textContent=D.titleFr||'';document.getElementById('goal').textContent=D.journeyContent?.introduction?.goal||'مسار تعليمي تفاعلي مرتبط بالمصدر.';render()}catch(e){document.getElementById('app').innerHTML='<div class="note">تعذر تحميل محتوى هذا الدرس الآن. حاول تحديث الصفحة.</div>';}}
load();
</script></body></html>
