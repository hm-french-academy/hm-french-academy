<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Learning Studio · الصف السادس</title><link rel="stylesheet" href="css/premium-shell.css?v=20260825-g6studio2"><style>body{background:#f5f7fb}main{max-width:1180px;margin:auto;padding:18px 14px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff;border-radius:26px;padding:22px;box-shadow:0 12px 30px #173a8220}.hero h1{margin:5px 0;font-size:clamp(28px,6vw,42px)}.hero p{margin:5px 0;line-height:1.8}.toolbar,.journey{display:flex;gap:8px;flex-wrap:wrap}.toolbar{margin:13px 0}.btn,.journey button{display:inline-flex;border:0;text-decoration:none;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:900}.secondary,.journey button{background:#eef3ff;color:#173a82}.primary{background:#2563eb;color:#fff}.journey{overflow:auto;background:#fff;padding:8px;border-radius:18px;margin:13px 0;box-shadow:0 5px 20px #14264a0b}.journey button.active{background:#e92d83;color:#fff}.panel{background:#fff;border-radius:22px;padding:18px;box-shadow:0 10px 30px #14264a12;min-height:340px}.source{background:#fff8e7;border:1px solid #f0d99b;border-radius:14px;padding:12px;line-height:1.8;margin-bottom:14px}.source-content{line-height:1.9}.source-content h1,.source-content h2,.source-content h3{color:#173a82}.source-content table{width:100%;border-collapse:collapse}.source-content td,.source-content th{border:1px solid #e1e6ef;padding:8px}.source-content img{max-width:100%;height:auto}.video{background:#101827;color:#fff;border-radius:20px;padding:20px}.video a{color:#fff}.complete{margin-top:14px;background:#fff;border-radius:18px;padding:15px;display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid #e4e9f2}@media(max-width:650px){main{padding:11px 9px}.complete{display:block}}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="index.html">الرئيسية</a><a href="grade-6.html">الصف السادس</a><a href="course.html">المناهج الدراسية</a></nav></header><main><section class="hero"><div>Le français pour vous · 6e année</div><h1 id="title">Learning Studio</h1><p id="subtitle"></p></section><div class="toolbar"><a class="btn secondary" href="grade-6.html">← دروس الصف السادس</a></div><nav class="journey" id="journey"></nav><section class="panel" id="panel"></section><section class="complete"><div><b>🏁 رحلة التعلم</b><div id="status">يتم تحميل محتوى المصدر الأصلي...</div></div><button class="btn primary" id="next">الخطوة التالية</button></section><iframe id="sourceFrame" hidden></iframe></main><script>(async()=>{const id=new URLSearchParams(location.search).get('id')||'g6-l01',section=new URLSearchParams(location.search).get('section')||'introduction';const map={"g6-l01":["01_Au_marche","01_interactif_au_marche.html","Au marché","في السوق"],"g6-l02":["02_Le_present","01_interactif_le_present.html","Le présent","زمن الحاضر"],"g6-l03":["03_La_negation","01_interactif_la_negation.html","La négation","النفي"],"g6-l04":["04_Mon_bureau","01_interactif_mon_bureau.html","Mon bureau","مكتبي"],"g6-l05":["05_Le_futur_proche","01_interactif_futur_proche.html","Le futur proche","المستقبل القريب"],"g6-l06":["06_Les_vetements","01_interactif_les_vetements.html","Les vêtements","الملابس"],"g6-l07":["07_Adjectifs_possessifs","01_interactif_adjectifs_possessifs.html","Les adjectifs possessifs","صفات الملكية"],"g6-l08":["08_L_heure","01_interactif_lheure.html","L'heure","الساعة"]};const steps=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['smart-review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];const L=map[id]||map['g6-l01'];document.title='HM Academy | '+L[2];document.getElementById('title').textContent=L[2]+' — '+L[3];document.getElementById('subtitle').textContent='Unité · '+L[2]+' · محتوى مستخرج ومراجع من المصدر الأصلي';const nav=document.getElementById('journey');steps.forEach((s,i)=>{let b=document.createElement('button');b.textContent=s[1];b.onclick=()=>show(i);nav.appendChild(b)});const frame=document.getElementById('sourceFrame');frame.src='data/lessons/grade-6/source/6eme_Complet/'+L[0]+'/'+L[1];await new Promise(r=>frame.onload=r);const doc=frame.contentDocument;const clean=()=>{const d=doc.body.cloneNode(true);d.querySelectorAll('script,style,nav,header,footer').forEach(x=>x.remove());return d};const text=()=>{const d=clean();return d.innerText.replace(/\n{3,}/g,'\n\n').trim()};function render(i){nav.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('active',j===i));let key=steps[i][0],d=clean(),title=steps[i][1];let html='<div class="source"><b>'+title+'</b><br>المحتوى أدناه مستخرج من الملف التفاعلي الأصلي للدرس، ثم يُعرض داخل Learning Studio بدل فتح المصدر في نافذة مستقلة.</div>';if(key==='introduction')html+='<div class="source-content"><h2>'+L[2]+' — '+L[3]+'</h2><p>'+text().slice(0,1800)+'</p></div>';else if(key==='vocabulary')html+='<div class="source-content"><h2>Vocabulaire</h2><p>'+text().split(/\n/).filter(x=>/Vocabulaire|vocabulaire|مفردات|كلمة|🧺|🗂️|🧳|👗/.test(x)).slice(0,100).join('<br>')+'</p></div>';else if(key==='grammar')html+='<div class="source-content"><h2>Grammaire</h2><p>'+text().split(/\n/).filter(x=>/grammaire|présent|négation|partitif|démonstratif|futur|possessif|heure|aller|être|avoir|ne \.\.\. pas|ce |cet |cette |ces |mon |ma |mes |et quart|et demie|moins le quart/.test(x)).slice(0,120).join('<br>')+'</p></div>';else if(key==='conversation')html+='<div class="source-content"><h2>Écoute et lis</h2><p>'+text().split(/\n/).filter(x=>/Bonjour|Salut|vendeur|client|Ahmed|Sara|Je |Tu |Il |Elle |Nous |Vous |Ils |Quelle heure|train/.test(x)).slice(0,60).join('<br>')+'</p></div>';else if(key==='video'){const a=[...d.querySelectorAll('a[href*="youtube.com"]')][0];html+='<div class="video"><h2>'+((a&&a.innerText)||'Regarde et écoute')+'</h2><p>الفيديو الأصلي المرتبط بهذا الدرس.</p>'+(a?'<a class="btn primary" target="_blank" href="'+a.href+'">▶️ فتح الفيديو على YouTube</a>':'<p>لم يتم العثور على رابط فيديو في المصدر.</p>')+'</div>'}else if(key==='progress'){html+='<div class="source-content"><h2>📈 التقدم</h2><p>تم تحميل المصدر الأصلي بنجاح. اكتملت مراجعة المصدر لهذه الرحلة.</p><ul>'+steps.map(s=>'<li>'+s[1]+'</li>').join('')+'</ul></div>'}else{html+='<div class="source-content"><h2>'+title+'</h2><p>'+text().slice(0,6500)+'</p></div>'}document.getElementById('panel').innerHTML=html;document.getElementById('status').textContent='تم تحميل المصدر الأصلي: '+L[2]+' · '+(i+1)+' / '+steps.length;history.replaceState(null,'',`grade6-lesson-v2.html?id=${id}&section=${key}`)}function show(i){render(i)}let ci=steps.findIndex(s=>s[0]===section);if(ci<0)ci=0;render(ci);document.getElementById('next').onclick=()=>render(Math.min(ci+1,steps.length-1));})();</script></body></html>
