function show(i){ci=i;n.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('active',j===i));let k=steps[i][0],h='';if(k==='introduction')h='<h2>'+L[0]+' — '+L[1]+'</h2><p>'+L[2]+'</p><div class="cards"><div class="card"><h3>🖼️ المفردات</h3><p>تصنيف موضوعي وصور توضيحية حقيقية المعنى.</p></div><div class="card"><h3>🎧 النطق</h3><p>كلمة + مثال كامل + زري نطق.</p></div><div class="card"><h3>💬 المحادثة</h3><p>حوار كامل متعدد الجمل.</p></div><div class="card"><h3>🎮 الألعاب</h3><p>أربع ألعاب مختلفة.</p></div></div>';if(k==='vocabulary')h=vocab();if(k==='pronunciation')h=pronunciation();if(k==='grammar')h=id==='g6-l01'?grammarLesson1():grammarLesson();if(k==='conversation')h='<h2>💬 المحادثة</h2>'+L[7].map(x=>'<div class="dialogue"><div class="fr">'+x+'</div><button type="button" class="btn" onclick="say('+JSON.stringify(x)+')">🔊 استمع</button></div>').join('');if(k==='practice')h='<h2>✍️ التدريب</h2>'+qs(L[8],'p')+'<div class="score" id="sc"></div>';if(k==='video')h='<div class="video"><h2>🎬 '+L[4]+'</h2>'+listenBtn(L[4],'🔊 استمع لعنوان الفيديو')+'<a class="btn" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v='+L[3]+'">▶️ مشاهدة الفيديو</a></div>';if(k==='games')h=games();if(k==='smart-review'){let a=[...L[8]].sort(()=>Math.random()-.5);h='<h2>🧠 المراجعة الذكية</h2>'+qs(a,'r')}if(k==='assessment')h='<h2>🏆 التقييم النهائي</h2><p>أسئلة مختلفة عن التدريب لقياس الفهم والتطبيق.</p>'+qs(assessment[id]||[],'e');if(k==='progress')h='<h2>📈 التقدم</h2><div class="cards">'+steps.map((x,j)=>'<div class="card"><b>'+(j+1)+'. '+x[1]+'</b><p>'+(j<=ci?'تم الوصول إليها':'لم تبدأ بعد')+'</p></div>').join('')+'</div>';p.innerHTML=h;next.onclick=()=>show(Math.min(steps.length-1,ci+1));history.replaceState(null,'','grade6-lesson-v2.html?id='+id+'&section='+steps[i][0])}
function ans(b,j,c,prefix){if(!b||b.disabled||b.parentElement.dataset.done)return;b.parentElement.dataset.done='1';let ok=b.textContent.trim()===c;b.classList.add(ok?'ok':'bad');b.parentElement.querySelectorAll('.opt').forEach(x=>x.disabled=true);let target=document.getElementById(prefix+j);if(target)target.textContent=ok?'✅ إجابة صحيحة':'❌ الإجابة الصحيحة: '+c;score+=ok?1:0;let z=document.getElementById('sc');if(z)z.textContent='النتيجة: '+score}
function say(t){if(!t)return;let status=document.getElementById('pronStatus');try{if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){if(status)status.textContent='⚠️ النطق الصوتي غير مدعوم في هذا المتصفح.';return}const synth=window.speechSynthesis;const speakNow=()=>{synth.cancel();synth.resume();const u=new SpeechSynthesisUtterance(String(t));u.lang='fr-FR';u.rate=.82;u.pitch=1;u.volume=1;const voices=synth.getVoices();const v=voices.find(x=>/^fr(-|_)/i.test(x.lang))||voices.find(x=>/french|français/i.test(x.name));if(v)u.voice=v;u.onstart=()=>{if(status)status.textContent='🔊 جارٍ تشغيل النطق الفرنسي…'};u.onend=()=>{if(status)status.textContent='اضغط على زر الاستماع لتشغيل النطق الفرنسي.'};u.onerror=()=>{if(status)status.textContent='⚠️ تعذر تشغيل النطق. جرّب الضغط مرة أخرى أو استخدم متصفحًا يدعم النطق الصوتي.'};synth.speak(u)};if(synth.getVoices().length){speakNow()}else{let once=()=>{synth.removeEventListener('voiceschanged',once);speakNow()};synth.addEventListener('voiceschanged',once);setTimeout(()=>{synth.removeEventListener('voiceschanged',once);speakNow()},800)}}catch(e){if(status)status.textContent='⚠️ تعذر تشغيل النطق الصوتي.'}}
