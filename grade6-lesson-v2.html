<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | الصف السادس</title></head><body><script>/* PATCH: preserve the existing lesson and expose a gesture-safe pronunciation bridge. */
(function(){
  const nativeSpeech=window.speechSynthesis;
  window.say=function(text){
    text=String(text||'').trim();
    if(!text)return;
    if(nativeSpeech&&window.SpeechSynthesisUtterance){
      try{nativeSpeech.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=.82;u.pitch=1;u.volume=1;nativeSpeech.speak(u);return}catch(e){}
    }
  };
})();</script></body></html>
