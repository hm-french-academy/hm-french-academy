<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy — Grade 7 Source QA Studio</title><style>body{margin:0;background:#f4f7fb;color:#17233d;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:14px}.hero,.panel{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 5px 18px #0001}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#159b8b);color:#fff}.nav{display:flex;gap:7px;overflow:auto}.nav a{padding:9px 11px;background:#edf2fb;border-radius:10px;color:#173a82;text-decoration:none;font-weight:700;white-space:nowrap}.nav a.on{background:#2563eb;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}.card{background:#fff;border:1px solid #dce5f1;border-radius:14px;padding:13px;margin:7px 0}.fr{direction:ltr;text-align:center;font-size:20px;font-weight:800}.muted{color:#65738b;font-size:13px;line-height:1.7}.btn,.opt{border:0;border-radius:9px;padding:9px 11px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.opt{display:block;width:100%;margin:5px 0;text-align:right;background:#f4f7fb;color:#17233d;border:1px solid #d7dfeb}.good{background:#dff7e8!important}.bad{background:#ffe4e8!important}.note{padding:12px;border-right:4px solid #f59e0b;background:#fff8e8;border-radius:9px}.tag{display:inline-block;background:#edf2fb;padding:5px 8px;border-radius:20px;margin:3px}</style><body><div class="wrap"><section class="hero"><div>🇫🇷 HM Academy · Learning Studio</div><h1 id="title">جاري تحميل الدرس…</h1><div id="source"></div></section><div class="panel nav" id="lessons"></div><div class="panel nav" id="sections"></div><main class="panel" id="main"></main></div><script>
const LES=[['grade7-u1-l1','L’alphabet et les mots transparents','الأبجدية والكلمات الشفافة'],['grade7-u1-l2','Les salutations','التحيات'],['grade7-u1-l3','Les pronoms sujets et les verbes en -er','ضمائر الفاعل وأفعال -er'],['grade7-u1-l4','Le verbe être et la présentation','فعل être والتقديم'],['grade7-u1-l5','Les nombres (0-20)','الأعداد 0–20'],['grade7-u1-l6','L’heure','الساعة'],['grade7-u2-l1','Tu as quel âge ?','كم عمرك؟'],['grade7-u2-l2','Qu’est-ce que c’est ? Les objets de la classe','ما هذا؟ أدوات الفصل'],['grade7-u3-l1','Les couleurs','الألوان'],['grade7-u3-l2','Les articles définis et les jours de la semaine','أدوات المعرفة وأيام الأسبوع'],['grade7-u3-l3','Les mois de l’année et les saisons','الشهور والفصول']];
const ST=[['intro','🚀 البداية'],['source','📚 محتوى المصدر'],['vocab','🖼️ المفردات'],['pron','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['video','🎬 الفيديو'],['games','🎮 الألعاب'],['review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];
const q=new URLSearchParams(location.search),id=q.get('id')||'grade7-u2-l1',sec=q.get('section')||'source';
let raw=null;try{raw=JSON.parse(localStorage.getItem('hm-g7-source-pack')||'null')}catch(e){}
async function load(){if(!raw){try{let r=await fetch('data/lessons/grade-7/unit-1/lessons-7-11-source-extracted.json',{cache:'no-store'});let j=await r.json();raw=JSON.parse(j.content);localStorage.setItem('hm-g7-source-pack',JSON.stringify(raw))}catch(e){raw={lessons:{}}}}render()}
function sp(t){if(!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';speechSynthesis.speak(u)}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function card(fr,ar=''){return '<article class="card"><div class="fr">'+esc(fr)+'</div>'+(ar?'<p style="text-align:center">'+esc(ar)+'</p>':'')+'<button class="btn" onclick="sp('+JSON.stringify(fr)+')">🔊 استمع</button></article>'}
function quiz(items){return items.map((x,i)=>'<article class="card"><b>'+esc(x.q)+'</b>'+x.o.map((o,n)=>'<button class="opt" onclick="pick(this,'+n+','+x.a+')">'+esc(o)+'</button>').join('')+'</article>').join('')}
function pick(b,n,a){let box=b.parentNode;if(box.dataset.done)return;box.dataset.done=1;[...box.querySelectorAll('.opt')].forEach((x,i)=>{if(i===a)x.classList.add('good')});if(n!==a)b.classList.add('bad')}
function link(s){return '?id='+encodeURIComponent(id)+'&section='+encodeURIComponent(s)}
function render(){let m=LES.find(x=>x[0]===id)||LES[6],n=raw?.lessons?.[String(LES.findIndex(x=>x[0]===id)+1)]||null;title.textContent=m[1]+' — '+m[2];source.textContent=n?'المصدر: '+(raw.source||'المصدر الأصلي')+' · verified-from-original-interactive-html':'المصدر المنظم للدرس';lessons.innerHTML=LES.map((x,i)=>'<a class="'+(x[0]===id?'on':'')+'" href="?id='+x[0]+'&section='+sec+'">الدرس '+(i+1)+'</a>').join('');sections.innerHTML=ST.map(x=>'<a class="'+(x[0]===sec?'on':'')+'" href="'+link(x[0])+'">'+x[1]+'</a>').join('');let h='';if(n)h=renderSource(n,sec);else h='<div class="note">هذا الدرس يحتاج إلى حزمة المصدر الخاصة به لإجراء المطابقة التفصيلية. لن يتم اختراع محتوى غير موجود.</div>';main.innerHTML=h}
function renderSource(n,s){let h='';if(s==='intro')h='<h2>🚀 البداية</h2><p>'+esc(n.title)+'</p><div class="note">المصدر هو المرجع. أي شرح إضافي هنا يجب أن يبقى موسومًا كإثراء.</div>';else if(s==='source'){h='<h2>📚 محتوى المصدر</h2><div class="grid">'+n.sections.map((x,i)=>'<article class="card"><b>قسم '+(i+1)+'</b><p>'+esc(x)+'</p></article>').join('')+'</div>'}else if(s==='vocab'||s==='pron'){let a=n.number_words||n.objects||n.colors||n.months||n.days_france||n.weather||n.sections||[];if(n.avoir)a=n.avoir.map(x=>[x[0]+' '+x[1]]);h='<h2>'+ (s==='pron'?'🎧 النطق':'🖼️ المفردات')+'</h2><div class="grid">'+a.map(x=>card(Array.isArray(x)?x[0]:x)).join('')+'</div>'}else if(s==='grammar'){let a=n.avoir||n.articles||n.agreement||n.seasons||[];h='<h2>📘 القواعد</h2><div class="grid">'+a.map(x=>card(Array.isArray(x)?x.join(' — '):((x.fr||'')+' — '+(x.months||'')+' — '+(x.weather||'')))).join('')+'</div>'}else if(s==='conversation')h='<h2>💬 المحادثة</h2><div class="note">لا يوجد حوار مصدر مستقل في البيانات المستخرجة لهذا الدرس. لن ننسب حوارًا مخترعًا للمصدر.</div>';else if(s==='practice'){let a=n.fill||n.match||[];h='<h2>✍️ التدريب</h2><div class="grid">'+a.map(x=>card(Array.isArray(x)?x.join(' → '):x)).join('')+'</div>'}else if(s==='video')h='<h2>🎬 الفيديو</h2><div class="note">الفيديو التكميلي مذكور في أقسام المصدر، لكن لا يتم اختلاق رابط تشغيل غير موجود في الـasset.</div>';else if(s==='games')h='<h2>🎮 الألعاب</h2><p>نشاط مبني مباشرة من بيانات المصدر.</p><div class="grid">'+(n.match||n.backpack||n.colors||n.objects||[]).slice(0,8).map(x=>card(Array.isArray(x)?x.join(' ↔ '):x)).join('')+'</div>';else if(s==='review')h='<h2>🧠 المراجعة الذكية</h2><div class="note">مراجعة تكيفية مبنية على أخطاء المتعلم؛ لا تُعد جزءًا من المصدر الأصلي.</div>';else if(s==='assessment'){let count=n.quiz_count||6,base=n.number_words||n.colors||n.months||n.objects||n.days_france||n.weather||['source'];let items=Array.from({length:Math.min(count,6)},(_,i)=>{let v=base[i%base.length];v=Array.isArray(v)?v[0]:v;let opts=[v,Array.isArray(base[(i+1)%base.length])?base[(i+1)%base.length][0]:base[(i+1)%base.length],Array.isArray(base[(i+2)%base.length])?base[(i+2)%base.length][0]:base[(i+2)%base.length]];return{q:'تحقق من: '+v,o:opts,a:0}});h='<h2>🏆 التقييم</h2><div class="note">عدد أسئلة التقييم الرسمي في المصدر: '+count+' — المعروض هنا تدريب تفاعلي، وليس نسخة مزعومة من التقييم الرسمي.</div>'+quiz(items)}else{let key='hm-g7-q-'+id,done=localStorage.getItem(key)||'0';h='<h2>📈 التقدم</h2><p>هذا الدرس مفتوح. مراحل Studio الحالية: '+ST.length+'</p><button class="btn" onclick="localStorage.setItem('+JSON.stringify(key)+',String(Date.now()));location.reload()">تسجيل إتمام المرحلة</button><p class="muted">حفظ التقدم محليًا على هذا الجهاز.</p>}return h}load();</script></body></html>
