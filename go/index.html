<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>HM Academy — رابط مختصر</title>
  <style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f8fc;color:#14264a}main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}section{max-width:520px;background:#fff;border:1px solid #e3e8f0;border-radius:22px;padding:28px;box-shadow:0 14px 40px rgba(20,38,74,.08)}h1{margin:0 0 10px;font-size:22px}p{margin:0;color:#667085;line-height:1.8}.err{color:#b42318}</style>
</head>
<body>
<main><section><h1>HM Academy</h1><p id="status">جاري فتح الرابط المختصر…</p></section></main>
<script>
const SHORT_LINKS={
  "4":"../annual-revision-stage.html?target=4",
  "5":"../annual-revision-stage.html?target=5",
  "6":"../annual-revision-stage.html?target=6"
};
const params=new URLSearchParams(location.search);
const key=(params.get("key")||params.get("s")||"").trim().toLowerCase();
const target=SHORT_LINKS[key];
if(target){location.replace(target)}else{document.getElementById("status").className="err";document.getElementById("status").textContent="الرابط المختصر غير موجود أو غير صالح."}
</script>
</body>
</html>
