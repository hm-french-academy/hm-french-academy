<title>HM Academy - الإنجازات</title>

</head>
<body>
<header>
<h2>🇫🇷 HM Academy</h2>
<p>🏆 إنجازات الطالب</p>
<nav>
<a href="index.html">الرئيسية</a>
<a href="dashboard.html">لوحة الطالب</a>

<main>
<section class="hero">
<h1>🏆 الإنجازات والشارات</h1>
<p>تُعرض الإنجازات من قاعدة البيانات المركزية.</p>
<div id="achievements-list"></div>
</section>
</main>
<script src="scripts/learning-progress.js"></script>
<script>
(async function(){
 const box=document.getElementById('achievements-list');
 try{
  const data=await (await fetch('data/achievements.json')).json();
  const progress=HMProgress.get();
  box.innerHTML=(data.achievements||[]).map(a=>`<div class="course" style="margin:12px 0;opacity:${progress.achievements.includes(a.id)?1:.55}"><h2>${a.icon} ${a.title}</h2><p>${a.description}</p><strong>${progress.achievements.includes(a.id)?'تم الحصول عليها':'غير مكتملة'} - ${a.xp} XP</strong></div>`).join('');
 }catch(e){console.warn(e);}
})();
</script>
<script src="scripts/app.js"></script>
<footer>HM Academy © 2026</footer>
</body>
</html>
