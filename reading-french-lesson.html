<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | درس القراءة</title><link rel="stylesheet" href="css/premium-shell.css"><link rel="stylesheet" href="css/hm-fonts.css"><style>main{max-width:1000px;margin:auto;padding:28px 16px}.panel{background:#fff;border:1px solid #e3e8f0;border-radius:20px;padding:24px}.word,.text{background:#f7f9fc;border-radius:14px;padding:16px;margin:10px 0}.speak,.check-btn,.complete,.nav-btn{border:0;border-radius:10px;padding:9px 13px;background:#eef4ff;color:#0d47a1;font-weight:700;cursor:pointer}.check{border-top:1px solid #edf0f5;padding:16px 0}.result,.progress{padding:14px;border-radius:12px;background:#eef7ee;font-weight:700;margin-top:12px}.note{background:#fff8e6;padding:14px;border-radius:12px;margin-top:16px}.primary{background:#0d47a1;color:#fff}.fluency-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric{padding:14px;background:#f7f9fc;border-radius:14px}.metric input{width:100%;box-sizing:border-box;padding:9px;margin-top:7px;border:1px solid #d7dce5;border-radius:9px}.course-progress{margin:18px 0;padding:15px;background:#f7f9fc;border-radius:16px}.bar{height:9px;background:#e7ebf2;border-radius:20px;overflow:hidden;margin:9px 0}.fill{height:100%;background:#2563eb;width:0}.lesson-nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}.nav-btn{text-decoration:none;display:inline-block}.nav-btn.disabled{opacity:.45;pointer-events:none}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy</span></a><nav class="hm-nav"><a href="reading-french.html">← كورس القراءة</a><a href="dashboard.html">لوحة الطالب</a></nav></header><main><div id="app" class="panel">جاري تحميل الدرس...</div></main><script>(async()=>{const p=new URLSearchParams(location.search),u=p.get('unit'),id=p.get('lesson'),app=document.getElementById('app');const speak=t=>{try{if(window.HMSpeech?.speak){HMSpeech.speak(t,{lang:'fr-FR'});return}}catch(e){}if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.resume();const x=new SpeechSynthesisUtterance(t);x.lang='fr-FR';x.rate=.85;speechSynthesis.speak(x)}};const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));try{const d=await (await fetch('data/specialized/reading-french-course.json?v=20260819-flow',{cache:'no-store'})).json(),unit=d.units.find(x=>x.id===u),l=unit?.lessons.find(x=>x.id===id);if(!l)throw Error('لم يتم العثور على الدرس');const all=d.units.flatMap(x=>x.lessons.map(y=>({unit:x,lesson:y}))),idx=all.findIndex(x=>x.lesson.id===id),prev=all[idx-1],next=all[idx+1],t=x=>typeof x==='string'?x:(x?.ar||x?.fr||x?.en||'');let h='<div><strong>'+esc(unit.level)+' · '+esc(unit.title.ar)+'</strong><h1>'+esc(t(l.title))+'</h1><div class="course-progress"><strong>تقدم كورس القراءة</strong><div class="bar"><div id="courseFill" class="fill"></div></div><span id="coursePct">0%</span> · '+(idx+1)+' / '+all.length+' درس</div>';if(l.objectives)h+='<h2>🎯 أهداف الدرس</h2><ul>'+l.objectives.ar.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';if(l.graphemes)h+='<h2>🔤 الأنماط الكتابية</h2><div>'+l.graphemes.map(x=>'<div class="word"><strong>'+esc(x)+'</strong> <button class="speak" data-s="'+esc(x)+'">🔊 استمع</button></div>').join('')+'</div>';if(l.examples)h+='<h2>📖 أمثلة</h2>'+l.examples.map(x=>'<div class="word"><strong>'+esc(x)+'</strong> <button class="speak" data-s="'+esc(x)+'">🔊 استمع</button></div>').join('');if(l.text)h+='<h2>📚 نص القراءة</h2><div class="text">'+esc(l.text)+'</div><button class="speak primary" data-s="'+esc(l.text)+'">🔊 استمع إلى النص</button>';if(l.practice)h+='<h2>🗣️ التدريب</h2><ol>'+l.practice.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>';if(l.assessment)h+='<h2>✅ معايير التقييم</h2><ul>'+l.assessment.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';if(Array.isArray(l.checks)&&l.checks.length){h+='<h2>🧩 اختبار فكّ الترميز</h2><div id="checks">'+l.checks.map((q,i)=>'<div class="check"><strong>'+(i+1)+'. '+esc(q.q)+'</strong>'+q.options.map((o,j)=>'<label style="display:block;margin:8px 0"><input type="radio" name="q'+i+'" value="'+j+'"> '+esc(o)+'</label>').join('')+'</div>').join('')+'</div><button id="grade" class="check-btn primary">تصحيح الاختبار</button><div id="result"></div>'}if(l.text||l.examples){h+='<h2>📈 تقييم الطلاقة</h2><p>أدخل الوقت وعدد الكلمات والأخطاء الملحوظة بعد القراءة.</p><div class="fluency-grid"><div class="metric"><strong>الوقت (ثانية)</strong><input id="secs" type="number" min="1" placeholder="60"></div><div class="metric"><strong>عدد الكلمات</strong><input id="words" type="number" min="1" placeholder="35"></div><div class="metric"><strong>الأخطاء</strong><input id="errors" type="number" min="0" value="0"></div></div><button id="fluency" class="check-btn primary">حساب الطلاقة</button><div id="fluencyResult"></div>'}h+='<div class="note"><strong>المراجعة الأكاديمية:</strong> '+esc(l.reviewFlag||'مُعد للمراجعة الأكاديمية')+'</div><button id="complete" class="complete primary">✓ إكمال الدرس وحفظ التقدم</button><div id="progress"></div><div class="lesson-nav"><a class="nav-btn '+(prev?'':'disabled')+'" href="'+(prev?'reading-french-lesson.html?unit='+encodeURIComponent(prev.unit.id)+'&lesson='+encodeURIComponent(prev.lesson.id):'#')+'">← الدرس السابق</a><a class="nav-btn" href="reading-french.html">قائمة الدروس</a><a class="nav-btn '+(next?'':'disabled')+'" href="'+(next?'reading-french-lesson.html?unit='+encodeURIComponent(next.unit.id)+'&lesson='+encodeURIComponent(next.lesson.id):'#')+'">الدرس التالي →</a></div></div>';app.innerHTML=h;app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>speak(b.dataset.s));const completedCount=()=>all.filter(x=>{try{return JSON.parse(localStorage.getItem('hm-reading-progress-'+x.lesson.id)||'null')?.completed===true}catch(e){return false}}).length;const updateCourse=()=>{const n=completedCount(),pct=Math.round(n/all.length*100);document.getElementById('courseFill').style.width=pct+'%';document.getElementById('coursePct').textContent=pct+'%'};updateCourse();const saved=JSON.parse(localStorage.getItem('hm-reading-progress-'+l.id)||'null');if(saved)document.getElementById('progress').textContent='آخر تقدم محفوظ: '+new Date(saved.at).toLocaleString('ar-EG');const grade=document.getElementById('grade');if(grade)grade.onclick=()=>{let score=0;l.checks.forEach((q,i)=>{const a=app.querySelector('input[name="q'+i+'"]:checked');if(a&&Number(a.value)===q.answer)score++});const pct=Math.round(score/l.checks.length*100);document.getElementById('result').className='result';document.getElementById('result').textContent='النتيجة: '+score+' / '+l.checks.length+' — '+pct+'%';localStorage.setItem('hm-reading-check-'+l.id,JSON.stringify({score,pct,at:Date.now()}))};const flu=document.getElementById('fluency');if(flu)flu.onclick=()=>{const s=Number(document.getElementById('secs').value),w=Number(document.getElementById('words').value),e=Math.max(0,Number(document.getElementById('errors').value)||0);if(!s||!w){document.getElementById('fluencyResult').className='note';document.getElementById('fluencyResult').textContent='أدخل الوقت وعدد الكلمات أولًا.';return}const gross=w*60/s,accuracy=Math.max(0,(w-e)/w*100),net=Math.max(0,gross*(accuracy/100));document.getElementById('fluencyResult').className='result';document.getElementById('fluencyResult').textContent='معدل القراءة: '+gross.toFixed(1)+' كلمة/دقيقة · الدقة: '+accuracy.toFixed(0)+'% · المعدل المصحح: '+net.toFixed(1)+' كلمة/دقيقة';localStorage.setItem('hm-reading-fluency-'+l.id,JSON.stringify({gross,accuracy,net,at:Date.now()}))};document.getElementById('complete').onclick=()=>{localStorage.setItem('hm-reading-progress-'+l.id,JSON.stringify({lessonId:l.id,unitId:unit.id,completed:true,at:Date.now()}));document.getElementById('progress').className='progress';document.getElementById('progress').textContent='✓ تم حفظ إكمال الدرس على هذا الجهاز.';updateCourse()}}catch(e){app.innerHTML='<div class="note">تعذر عرض الدرس: '+esc(e.message)+'</div>'}})();</script></body></html>
