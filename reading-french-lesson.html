<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | درس القراءة</title><link rel="stylesheet" href="css/premium-shell.css"><link rel="stylesheet" href="css/hm-fonts.css"><style>main{max-width:1000px;margin:auto;padding:28px 16px}.panel{background:#fff;border:1px solid #e3e8f0;border-radius:20px;padding:24px}.word,.text{background:#f7f9fc;border-radius:14px;padding:16px;margin:10px 0}.speak{border:0;border-radius:10px;padding:8px 12px;background:#eef4ff;color:#0d47a1;font-weight:700;cursor:pointer}.note{background:#fff8e6;padding:14px;border-radius:12px}</style></head><body><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy</span></a><nav class="hm-nav"><a href="reading-french.html">← كورس القراءة</a></nav></header><main><div id="app" class="panel">جاري تحميل الدرس...</div></main><script>(async()=>{const p=new URLSearchParams(location.search),u=p.get('unit'),id=p.get('lesson'),app=document.getElementById('app');const speak=t=>{try{if(window.HMSpeech?.speak){HMSpeech.speak(t,{lang:'fr-FR'});return}}catch(e){}if('speechSynthesis'in window){speechSynthesis.cancel();const x=new SpeechSynthesisUtterance(t);x.lang='fr-FR';x.rate=.85;speechSynthesis.speak(x)}};try{const d=await (await fetch('data/specialized/reading-french-course.json?v=20260819',{cache:'no-store'})).json(),unit=d.units.find(x=>x.id===u),l=unit?.lessons.find(x=>x.id===id);if(!l)throw Error('لم يتم العثور على الدرس');const t=x=>typeof x==='string'?x:(x?.ar||x?.fr||x?.en||'');let h='<div><strong>'+unit.level+' · '+unit.title.ar+'</strong><h1>'+t(l.title)+'</h1>';if(l.objectives)h+='<h2>🎯 أهداف الدرس</h2><ul>'+l.objectives.ar.map(x=>'<li>'+x+'</li>').join('')+'</ul>';if(l.graphemes)h+='<h2>🔤 الأنماط الكتابية</h2><div>'+l.graphemes.map(x=>'<div class="word"><strong>'+x+'</strong> <button class="speak" data-s="'+x+'">🔊 استمع</button></div>').join('')+'</div>';if(l.examples)h+='<h2>📖 أمثلة</h2>'+l.examples.map(x=>'<div class="word"><strong>'+x+'</strong> <button class="speak" data-s="'+x+'">🔊 استمع</button></div>').join('');if(l.text)h+='<h2>📚 نص القراءة</h2><div class="text">'+l.text+'</div><button class="speak" data-s="'+l.text+'">🔊 استمع إلى النص</button>';if(l.practice)h+='<h2>🗣️ التدريب</h2><ol>'+l.practice.map(x=>'<li>'+x+'</li>').join('')+'</ol>';if(l.assessment)h+='<h2>✅ التقييم</h2><ul>'+l.assessment.map(x=>'<li>'+x+'</li>').join('')+'</ul>';h+='<div class="note"><strong>المراجعة الأكاديمية:</strong> '+(l.reviewFlag||'مُعد للمراجعة الأكاديمية')+'</div></div>';app.innerHTML=h;app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>speak(b.dataset.s))}catch(e){app.innerHTML='<div class="note">تعذر عرض الدرس: '+e.message+'</div>'}})();</script></body></html>
