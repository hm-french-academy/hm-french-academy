<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy — درس 7</title><style>body{margin:0;background:#f5f7fb;color:#17233d;font-family:Arial,"Noto Sans Arabic",sans-serif}.app{max-width:900px;margin:auto}.top{background:#fff;padding:14px 18px;position:sticky;top:0;z-index:2;border-bottom:1px solid #e2e7ef}.brand{font-weight:900;color:#173a82}.sub{color:#69768b;font-size:13px;margin-top:4px}.choice{padding:28px 18px}.choice h1{text-align:center}.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mode{background:#fff;border:2px solid #e1e7f0;border-radius:22px;padding:22px;text-align:center;cursor:pointer}.mode:hover{border-color:#2563eb}.big{font-size:48px}.btn{border:0;border-radius:12px;padding:11px 18px;background:#2563eb;color:#fff;font-weight:900}.lesson{padding:18px}.nav{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.nav button{border:0;background:#eaf0fa;border-radius:10px;padding:9px 12px;white-space:nowrap}.nav .on{background:#2563eb;color:#fff}.card{background:#fff;border:1px solid #e0e6ef;border-radius:18px;padding:17px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.word{text-align:center;direction:ltr;font-size:23px;font-weight:900}.ar{text-align:center;color:#3560a7}.center{text-align:center}.bubble{background:#edf4ff;border-radius:16px;padding:13px;margin:9px 0;line-height:1.9}.me{background:#fff0f7}.rule{background:#f7fbfa;border-right:5px solid #0f9f91;padding:18px;border-radius:14px;line-height:2}.formula{text-align:center;direction:ltr;font-size:21px;font-weight:900}.video{aspect-ratio:16/9;background:#18233f;color:#fff;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:25px;text-align:center}.q{padding:16px;border:1px solid #dfe6ef;border-radius:16px}.opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.opts button{padding:10px 18px;border:1px solid #dfe6ef;background:#fff;border-radius:10px}.hidden{display:none}@media(max-width:600px){.modes{grid-template-columns:1fr}.lesson{padding:10px}}</style><body><div class="app"><header class="top"><div class="brand">🇫🇷 HM Academy</div><div class="sub">الصف السابع الإعدادي · الدرس 7</div></header><section id="choice" class="choice"><h1>Tu as quel âge ?</h1><p class="center">اختر طريقة عرض الدرس</p><div class="modes"><div class="mode" onclick="start(0)"><div class="big">🧭</div><h2>رحلة الدرس</h2><p>تعلم خطوة بخطوة، مرحلة بعد مرحلة.</p><button class="btn">ابدأ</button></div><div class="mode" onclick="start(1)"><div class="big">⚡</div><h2>الدرس التفاعلي</h2><p>كل عناصر الدرس في تجربة تعليمية متصلة.</p><button class="btn">ابدأ</button></div></div></section><section id="lesson" class="lesson hidden"><div id="nav" class="nav"></div><div id="content"></div></section></div><script>let mode=0,st=0;const s=[['🚀','البداية'],['🖼️','المفردات'],['🎧','النطق'],['📘','القواعد'],['💬','المحادثة'],['✍️','التدريب'],['🎬','الفيديو'],['🎮','الألعاب'],['🧠','المراجعة'],['🏆','التقييم']];const v=[['Quel âge as-tu ?','كم عمرك؟'],['J’ai treize ans.','عمري 13 سنة'],['Tu as quel âge ?','كم عمرك؟']];function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';speechSynthesis.speak(u)}function cards(){return `<div class=grid>${v.map(x=>`<div class=card><div class=word>${x[0]}</div><div class=ar>${x[1]}</div><p class=center><button class=btn onclick="speak('${x[0]}')">🔊 استمع</button></p></div>`).join('')}</div>`}function quiz(){return `<div class=q><b>Complète : J’___ treize ans.</b><div class=opts>${['ai','as','a'].map(x=>`<button onclick="this.innerHTML=x==='ai'?'✓ صحيح':'✗ حاول مرة أخرى'">${x}</button>`).join('')}</div></div>`}function start(x){mode=x;document.getElementById('choice').classList.add('hidden');document.getElementById('lesson').classList.remove('hidden');render()}function render(){document.getElementById('nav').innerHTML=mode?s.map((x,i)=>`<button class=${i===st?'on':''} onclick="st=${i};render()">${x[0]} ${x[1]}</button>`).join(''):s.map((x,i)=>`<button class=${i===st?'on':''} onclick="st=${i};render()">${x[0]} ${x[1]}</button>`).join('');let h='';if(mode===0){if(st===0)h=`<div class=card><h2>🚀 البداية</h2><h1>Tu as quel âge ?</h1><p>سنتعلم السؤال عن العمر والإجابة عنه باستخدام فعل <b>avoir</b>.</p></div>`;if(st===1)h=`<h2>🖼️ المفردات</h2>${cards()}`;if(st===2)h=`<h2>🎧 النطق</h2><div class=card><p>استمع إلى كل عبارة وكررها.</p>${cards()}</div>`;if(st===3)h=`<h2>📘 القواعد</h2><div class=rule><h3>Le verbe avoir</h3><p>نستخدم فعل avoir للتعبير عن العمر.</p><div class=formula>J’ai · Tu as · Il/Elle a</div><div class=formula>Nous avons · Vous avez · Ils/Elles ont</div></div>`;if(st===4)h=`<h2>💬 المحادثة</h2><div class=bubble>👦 Quel âge as-tu ?</div><div class='bubble me'>👧 J’ai treize ans.</div>`;if(st===5)h=`<h2>✍️ التدريب</h2>${quiz()}`;if(st===6)h=`<h2>🎬 الفيديو</h2><div class=video>▶️<br>الفيديو التعليمي</div>`;if(st===7)h=`<h2>🎮 الألعاب</h2><div class='card center'><div class=big>🎯</div><p>اختر الإجابة الصحيحة.</p><button class=btn onclick="this.innerHTML='🎉 أحسنت!'">ابدأ</button></div>`;if(st===8)h=`<h2>🧠 المراجعة الذكية</h2><div class=card><b>نقطة المراجعة:</b><p>J’ai treize ans.</p></div>`;if(st===9)h=`<h2>🏆 التقييم</h2>${quiz()}`}else{h=`<h2>⚡ الدرس التفاعلي</h2><div class=card><h3>👋 تمهيد</h3><p>هل تعرف كيف تقول: «كم عمرك؟» بالفرنسية؟</p><div class=word>Quel âge as-tu ?</div><p class=center><button class=btn onclick="speak('Quel âge as-tu ?')">🔊 استمع</button></p></div><div class=card><h3>🖼️ اكتشف الكلمات</h3>${cards()}</div><div class=rule><h3>📘 افهم</h3><p>السؤال عن العمر والإجابة باستخدام avoir.</p><div class=formula>J’ai treize ans.</div></div><div class=card><h3>💬 استخدمها</h3><div class=bubble>Quel âge as-tu ?</div><div class='bubble me'>J’ai treize ans.</div></div><div class=card><h3>✍️ جرّب</h3>${quiz()}</div><div class=card><h3>🎮 تحدَّ نفسك</h3><button class=btn onclick="this.innerHTML='🎉 التحدي مكتمل'">ابدأ التحدي</button></div><div class=card><h3>🏆 اختبر نفسك</h3>${quiz()}</div>`}document.getElementById('content').innerHTML=h}render();</script></body></html>
