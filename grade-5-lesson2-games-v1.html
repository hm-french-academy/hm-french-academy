<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="cache-control" content="no-cache,no-store,must-revalidate"><title>HM Academy | مركز الألعاب · Les déterminants</title><style>body{margin:0;background:#f5f8ff;font-family:Arial,Cairo,sans-serif;color:#17223b}.wrap{max-width:1050px;margin:auto;padding:18px 14px 60px}.top{display:flex;justify-content:space-between;background:#fff;border:1px solid #dfe6f2;border-radius:18px;padding:12px 16px}.a,.btn{padding:11px 15px;border-radius:12px;text-decoration:none;font-weight:900}.a{color:#14264a}.btn{background:#2563eb;color:#fff;border:0;cursor:pointer}.hero{margin-top:16px;padding:28px;border-radius:28px;background:linear-gradient(135deg,#173a82,#2563eb 58%,#713bd1);color:#fff}.hero h1{margin:0 0 8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.stat{background:#ffffff18;border:1px solid #ffffff30;border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:25px}.panel{margin-top:18px;background:#fff;border:1px solid #dfe6f2;border-radius:24px;padding:22px}.progress{height:9px;background:#e8edf5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#2563eb}.game{display:none}.game.active{display:block}.q{font-size:21px;font-weight:900;line-height:1.8;margin:18px 0}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.opt{padding:14px;border:1px solid #d5ddea;border-radius:14px;background:#fff;text-align:right;font-weight:900;cursor:pointer}.correct{border-color:#20a45a!important;background:#eaf8f0!important}.wrong{border-color:#d14b4b!important;background:#fff0f0!important}.fb{min-height:28px;margin-top:12px;font-weight:900}.next{display:none;margin-top:12px}.result{text-align:center;padding:30px}.result h2{color:#14264a}.tag{display:inline-block;padding:8px 12px;background:#eef3ff;border-radius:12px;color:#2451a0;font-weight:900}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.choice{padding:14px;border:1px solid #d5ddea;border-radius:14px;background:#fff;font-weight:900;cursor:pointer}@media(max-width:650px){.stats,.opts,.choices{grid-template-columns:1fr}.top{display:block}}</style></head><body><main class="wrap"><header class="top"><a class="a" href="grade-5-lesson-v3.html?id=g5-t1-l02&section=overview">HM 🇫🇷 ACADEMY</a><a class="btn" href="grade-5-lesson-v3.html?id=g5-t1-l02&section=overview">← العودة للدرس</a></header><section class="hero"><h1>🎮 مركز الألعاب · Les déterminants</h1><p>6 ألعاب مستقلة مبنية على محتوى الدرس الثاني فقط.</p><div class="stats"><div class="stat"><b id="points">0</b>XP</div><div class="stat"><b id="done">0</b>ألعاب مكتملة</div><div class="stat"><b>6</b>ألعاب</div></div></section><section class="panel"><div class="progress"><i id="bar"></i></div><div id="app"></div></section></main><script>(function(){const games=[{t:'🔎 صياد الأداة',q:'اختر الأداة الصحيحة: ___ stylo',o:['un','une','des'],a:'un'},{t:'🧩 اختيار الجنس',q:'اختر الأداة الصحيحة: ___ gomme',o:['un','une','des'],a:'une'},{t:'🎯 جمع الاسم',q:'اختر الأداة الصحيحة: ___ stylos',o:['un','une','des'],a:'des'},{t:'💡 أداة التعريف',q:"ما الأداة الصحيحة في «l'animal»؟",o:['le','l’','les'],a:'l’'},{t:'🧠 تمييز النوع',q:'أي مثال يدل على المذكر المفرد؟',o:['une gomme','un stylo','des stylos'],a:'un stylo'},{t:'⚡ التحدي النهائي',q:'أي مجموعة تحتوي على أدوات التنكير الثلاث التي درسناها؟',o:['un · une · des','le · la · les','l’ · les · la'],a:'un · une · des'}];let i=0,score=0,app=document.getElementById('app');function draw(){const g=games[i];app.innerHTML='<span class="tag">اللعبة '+(i+1)+' من 6 · '+g.t+'</span><div class="q">'+g.q+'</div><div class="opts">'+g.o.map(x=>'<button class="opt" data-v="'+x+'">'+x+'</button>').join('')+'</div><div class="fb"></div><button class="btn next">'+(i===5?'إنهاء المركز':'اللعبة التالية ←')+'</button>';app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{app.querySelectorAll('.opt').forEach(x=>x.disabled=true);const ok=b.dataset.v===g.a;if(ok)score++;app.querySelectorAll('.opt').forEach(x=>{if(x.dataset.v===g.a)x.classList.add('correct')});if(!ok)b.classList.add('wrong');app.querySelector('.fb').textContent=ok?'✅ صحيح — أحسنت!':'❌ غير صحيح.';app.querySelector('.next').style.display='inline-block';document.getElementById('points').textContent=score*10});app.querySelector('.next').onclick=()=>{if(i<5){i++;document.getElementById('done').textContent=i;document.getElementById('bar').style.width=(i/6*100)+'%';draw()}else{document.getElementById('done').textContent=6;document.getElementById('bar').style.width='100%';app.innerHTML='<div class="result"><div style="font-size:50px">🏆</div><h2>أكملت مركز ألعاب الدرس الثاني</h2><p>6 ألعاب مستقلة · '+score+' / 6 إجابات صحيحة · '+(score*10)+' XP</p><a class="btn" href="grade-5-lesson2-assessment-v1.html">📝 التقييم الرسمي</a> <a class="btn" href="grade-5-lesson-v3.html?id=g5-t1-l02&section=overview">← العودة للدرس</a></div>'}}}draw()})();</script></body></html>
