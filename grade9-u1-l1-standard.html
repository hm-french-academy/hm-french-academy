-height:1.7}.video{position:relative;padding-top:56.25%;border-radius:18px;overflow:hidden;background:#0f1b33}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.game-launch{background:linear-gradient(135deg,#f7f9ff,#fff7fb);border:1px solid #dfe6f2;border-radius:20px;padding:20px;text-align:center}.game-launch a{display:inline-block;background:#2563eb;color:#fff;text-decoration:none;border-radius:13px;padding:12px 18px;font-weight:900}.assessment-grid{display:grid;gap:12px}.result{background:#f7f9fd;border-radius:18px;padding:18px;text-align:center}.result strong{font-size:34px;color:#173a82}.progress{height:9px;background:#e8edf5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#2563eb}.file-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.file-card{display:block;text-decoration:none;color:#17223b;background:linear-gradient(135deg,#fff,#f7f9ff);border:1px solid #e1e6ef;border-radius:18px;padding:16px;cursor:pointer}.file-card span{display:block;font-size:30px;margin-bottom:8px}.file-card small{display:block;color:#66738a;font-weight:700;margin-top:5px;line-height:1.6}.review-box{background:linear-gradient(135deg,#f7f9ff,#fff7fb);border:1px solid #dfe6f2;border-radius:18px;padding:17px}.review-answer{font-size:20px;font-weight:900;direction:ltr;text-align:center;margin:12px 0}.small{font-size:13px;color:#718096;line-height:1.8}.complete{margin-top:14px;background:#fff;border-radius:20px;padding:17px;display:flex;justify-content:space-between;gap:12px;align-items:center}.student-note{font-size:12px;color:#718096;margin:7px 2px;text-align:right}.lesson-intro{display:grid;grid-template-columns:1.4fr .8fr;gap:16px;align-items:stretch}.intro-main{padding:22px;border-radius:22px;background:linear-gradient(135deg,#f7f9ff,#fff7fb);border:1px solid #dfe6f2}.intro-main h2{font-size:30px;margin:0 0 10px}.intro-main p{line-height:2}.learning-goals{display:grid;gap:10px}.goal{padding:15px;border-radius:16px;background:#fff;border:1px solid #e1e6ef}.goal b{display:block;margin-bottom:4px}.tip{margin-top:14px;padding:15px;border-radius:16px;background:#eef6ff;border:1px solid #cfe0ff;line-height:1.9}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.section-title h2{margin:0}.badge{font-size:12px;background:#eef3ff;color:#173a82;padding:7px 10px;border-radius:999px;font-weight:900}@media(max-width:650px){.wrap{padding:10px}.complete{display:block}.unit-btn{display:none}.dialogue-card{max-width:94%}.contrast{grid-template-columns:1fr}.lesson-intro{grid-template-columns:1fr}}

<body data-hm-grade-theme="prep-3"><div class="wrap">
<header class="student-header"><a class="brand" href="index.html"><span class="brand-logo">HM</span><span>🇫🇷 HM Academy</span></a><div class="header-actions"><a class="unit-btn" href="unit-map.html?unit=unit-1">🧭 خريطة الوحدة</a><a class="home-btn" href="index.html">⌂ الرئيسية</a></div></header>
<div class="student-note">هذا الدرس مستقل عن باقي الدروس، وتقدمك محفوظ على هذا الجهاز.</div>
<section class="hero"><h1>الرياضات</h1><p>Les sports · Le sport · الصف الثالث الإعدادي · الوحدة الأولى</p><div class="journey"><span>🚀 استكشف</span><span>🖼️ تعلم</span><span>🎧 انطق</span><span>📘 افهم</span><span>💬 تواصل</span><span>🎬 شاهد</span><span>🎯 تدرب</span><span>🎮 العب</span><span>🧠 راجع</span><span>🏆 قيّم</span><span>📁 ملفات</span><span>📈 تقدم</span></div></section>

</div>
<script>
const data={vocab:[['le football','كرة القدم','⚽','Je joue au football.'],['le ping-pong','تنس الطاولة','🏓','Je joue au ping-pong.'],['le karaté','الكاراتيه','🥋','Je pratique le karaté.'],['le cyclisme / le vélo','ركوب الدراجات','🚴','Je fais du vélo.'],['la boxe','الملاكمة','🥊','Je pratique la boxe.'],['la natation','السباحة','🏊','Je fais de la natation.'],['le tennis','التنس','🎾','Je joue au tennis.'],['le basket-ball','كرة السلة','🏀','Je joue au basket-ball.'],['le volley-ball','الكرة الطائرة','🏐','Je joue au volley-ball.'],["l'équitation",'الفروسية','🏇',"Je fais de l'équitation."],["l'escrime",'المبارزة','🤺',"Je pratique l'escrime."],['le ski','التزلج','⛷️','Je fais du ski.'],['le judo','الجودو','🥋','Je pratique le judo.'],['le rugby','الرجبي','🏉','Je joue au rugby.'],['la pêche','صيد السمك','🎣','Je pratique la pêche.'],['la voile','الإبحار','⛵','Je fais de la voile.'],['la gymnastique','الجمباز','🤸','Je fais de la gymnastique.'],['les échecs','الشطرنج','♟️','Je joue aux échecs.'],['la marche','المشي','🚶','Je fais de la marche.'],['la randonnée','التنزه','🥾','Je fais de la randonnée.']],conv:[['Sara','Quel sport pratiques-tu ?','ما الرياضة التي تمارسها؟','Quel sport pratiques-tu ?'],['Adam','Je pratique le football.','أنا أمارس كرة القدم.','Je pratique le football.'],['Sara',"Qu'est-ce que tu préfères ?",'ماذا تفضل؟',"Quest-ce que tu preferes ?"],['Adam','Je préfère le tennis.','أفضل التنس.','Je prefere le tennis.'],['Sara','Où pratiques-tu ton sport préféré ?','أين تمارس رياضتك المفضلة؟','Ou pratiques-tu ton sport prefere ?'],['Adam','Je le pratique au club.','أمارسها في النادي.','Je le pratique au club.'],['Sara','Tu fais du sport ?','هل تمارس الرياضة؟','Tu fais du sport ?'],['Adam','Oui, je fais de la natation.','نعم، أمارس السباحة.','Oui, je fais de la natation.']]};
const steps=[['intro','🚀','البداية'],['vocab','🖼️','المفردات'],['pron','🎧','النطق'],['grammar','📘','القواعد'],['conv','💬','المحادثة'],['video','🎬','الفيديو'],['practice','🎯','التدريب'],['games','🎮','الألعاب'],['review','🧠','المراجعة الذكية'],['assessment','🏆','التقييم'],['files','📁','ملفات الدرس'],['progress','📈','التقدم']];
let idx=0,assessmentScore=0,assessmentDone=0,reviewScore=0,reviewDone=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const navEl=document.getElementById('nav');const panelEl=document.getElementById('panel');
function speechText(text){const s=String(text||'').trim();if(/^l[’']équitation$/i.test(s))return 'léquitation';if(/^l[’']escrime$/i.test(s))return 'lescrime';if(/^Qu'est-ce que tu préfères \?$/i.test(s))return 'Quest-ce que tu preferes ?';if(/^Où pratiques-tu ton sport préféré \?$/i.test(s))return 'Ou pratiques-tu ton sport prefere ?';return s}
function speak(text){const s=speechText(text);if(!s||!window.speechSynthesis||!window.SpeechSynthesisUtterance)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='fr-FR';u.rate=.78;u.pitch=1;u.volume=1;const vs=speechSynthesis.getVoices();const v=vs.find(x=>/^fr[-_]FR$/i.test(x.lang))||vs.find(x=>/^fr[-_]/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function shuffle(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function go(i){idx=i;render();window.scrollTo({top:0,behavior:'smooth'})}
function renderNav(){navEl.innerHTML=steps.map((s,i)=>`<button class="${i===idx?'active':''}" onclick="go(${i})">${s[1]} ${s[2]}</button>`).join('')}
const notes={"le football":'le: صوت فرنسي خفيف، و football تُنطق بانسيابية دون فصل الحروف.',"le ping-pong":'لاحظ الصوت الأنفي في ping و pong.',"le karaté":'é في النهاية صوت /e/ واضح.',"le cyclisme / le vélo":'في vélo حرف é يعطي صوت /e/.',"la boxe":'x في boxe تُنطق /ks/.',"la natation":'ti في natation تُنطق تقريبًا /sjɔ̃/.',"l'équitation":'ابدأ بصوت l ثم équitation، واحرص على الوصل.',"l'escrime":'e في البداية خفيفة، والكلمة تبدأ بصوت /ɛs/.',"les échecs":'ch في échecs تُنطق /ʃ/.',"la randonnée":'حافظ على الصوت الأنفي في randonnée.'};
function render(){renderNav();let h='';if(idx===0)h=`<div class="section-title"><h2>🚀 قبل أن تبدأ</h2><span class="badge">استكشف → لاحظ → طبّق</span></div><div class="lesson-intro"><div class="intro-main"><h2>Les sports — الرياضات</h2><p>في هذا الدرس ستتعلم كيف تتحدث عن الرياضات التي تمارسها، وما تفضله، وأين تمارس نشاطك الرياضي. لن نبدأ بالحفظ فقط؛ سنبني المعنى من كلمات وصور وأمثلة ثم نستخدمها في محادثة وتدريب وتقييم.</p><div class="tip">💡 <b>سؤال الدرس:</b> <span dir="ltr">Quel sport pratiques-tu ?</span><br>كيف تسأل شخصًا عن الرياضة التي يمارسها؟ وكيف تجيب بطريقة صحيحة؟</div></div><div class="learning-goals"><div class="goal">🖼️ <b>أتعرّف</b> على أهم مفردات الرياضات.</div><div class="goal">🎧 <b>أنطق</b> الكلمات والعبارات الأساسية.</div><div class="goal">📘 <b>أفهم</b> استخدام jouer / faire / pratiquer.</div><div class="goal">💬 <b>أتواصل</b> في حوار قصير عن الرياضة.</div><div class="goal">🏆 <b>أقيس</b> تقدمي بتقييم نهائي.</div></div></div>`;else if(idx===1)h=`<div class="section-title"><h2>🖼️ مفردات الرياضات</h2><span class="badge">20 كلمة أساسية</span></div><div class="cards">${data.vocab.map((v,i)=>`<article class="card"><div class="sport-art">${v[2]}</div><div class="fr">${esc(v[0])}</div><div class="ar">${esc(v[1])}</div><div class="example">${esc(v[3])}</div><button class="btn secondary" onclick="speak(${JSON.stringify(v[0])})">🔊 استمع</button><div class="small">${esc(notes[v[0]]||'لاحظ نطق الكلمة ثم كررها بصوت واضح.')}</div></article>`).join('')}</div>`;else if(idx===2)h=`<div class="section-title"><h2>🎧 النطق</h2><span class="badge">اسمع ثم كرر</span></div><div class="pron-grid">${data.vocab.slice(0,10).map(v=>`<article class="pron-card"><div class="fr">${esc(v[0])}</div><div class="ar">${esc(v[1])}</div><button class="btn primary" onclick="speak(${JSON.stringify(v[0])})">🔊 استمع للنطق الفرنسي</button><div class="small">${esc(notes[v[0]]||'كرر الكلمة مرتين، ثم استخدمها في الجملة.')}</div></article>`).join('')}</div><div class="note">🎯 طريقة التدريب: استمع → كرر → غطِّ الكلمة الفرنسية → حاول تذكرها من المعنى.</div>`;else if(idx===3)h=`<div class="section-title"><h2>📘 القاعدة في سياقها</h2><span class="badge">3 تراكيب مهمة</span></div><div class="grammar-grid"><div class="formula"><b>jouer à + sport</b><p>نستخدم <b>jouer à</b> غالبًا مع الألعاب والرياضات التي نقول معها «ألعب».</p><div class="example">Je joue au football.<br>Je joue au tennis.<br>Je joue aux échecs.</div></div><div class="formula"><b>faire de + sport</b><p>نستخدم <b>faire de</b> مع أنشطة كثيرة نقول عنها «أمارس / أفعل».</p><div class="example">Je fais de la natation.<br>Je fais du ski.<br>Je fais de la randonnée.</div></div><div class="formula"><b>pratiquer + sport</b><p>تأتي <b>pratiquer</b> مباشرة قبل اسم الرياضة.</p><div class="example">Je pratique le karaté.<br>Je pratique la boxe.<br>Je pratique l'escrime.</div></div></div><div class="contrast"><div class="yes">✅ <b>صحيح:</b><br><span dir="ltr">Je joue au football.</span></div><div class="no">⚠️ <b>انتبه:</b><br><span dir="ltr">Je joue de football.</span> ❌</div></div>`;else if(idx===4)h=`<div class="section-title"><h2>💬 المحادثة</h2><span class="badge">استمع وتحدث</span></div><div class="dialogue-wrap">${data.conv.map(c=>`<article class="dialogue-card ${c[0].toLowerCase()}"><div class="speaker">${c[0]}</div><div class="line-fr">${esc(c[1])}</div><div class="line-ar">${esc(c[2])}</div><button class="btn secondary" onclick="speak(${JSON.stringify(c[3])})">🔊 استمع</button></article>`).join('')}</div>`;else if(idx===5)h=`<div class="section-title"><h2>🎬 شاهد واستمع</h2><span class="badge">فهم من السياق</span></div><div class="video"><iframe src="https://www.youtube.com/embed/akKplmnr01M" title="HM Academy — Les sports" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="note">👀 أثناء المشاهدة: التقط 3 كلمات عن الرياضات، ثم ارجع إلى المفردات وكرر نطقها.</div>`;else if(idx===6){const qs=[['اختر الجملة الصحيحة','كرة القدم','Je joue au football.','Je fais au football.'],['اختر الجملة الصحيحة','السباحة','Je fais de la natation.','Je joue de la natation.'],['اختر الجملة الصحيحة','الكاراتيه','Je pratique le karaté.','Je joue le karaté.'],['اختر الترجمة الصحيحة','Je préfère le tennis.','أفضل التنس.','أمارس التنس.'],['اختر الترجمة الصحيحة','Où pratiques-tu ton sport ?','أين تمارس رياضتك؟','ما الرياضة التي تفضلها؟']];h=`<div class="section-title"><h2>🎯 تدريب فوري</h2><span class="badge">5 أسئلة</span></div><div class="assessment-grid">${qs.map((q,i)=>{const a=i<3?q[2]:q[2],b=q[3];return `<div class="task"><b>${i+1}. ${q[0]}: ${esc(q[1])}</b><div class="options"><button class="option" onclick="checkPractice(this,${i},true)">${esc(a)}</button><button class="option" onclick="checkPractice(this,${i},false)">${esc(b)}</button></div><div class="feedback" id="pf${i}"></div></div>`}).join('')}</div>`}else if(idx===7)h=`<div class="section-title"><h2>🎮 لعبة سريعة</h2><span class="badge">طابق المعنى</span></div><div class="game-launch"><p>اختبر سرعتك في ربط الرياضة بالكلمة الفرنسية.</p><button class="btn primary" onclick="startGame()">ابدأ اللعبة</button><div id="gameArea"></div></div>`;else if(idx===8)h=`<div class="section-title"><h2>🧠 المراجعة الذكية</h2><span class="badge">استرجاع نشط</span></div><div class="review-box"><p>بدل إعادة القراءة، حاول الإجابة من الذاكرة:</p><div id="reviewQuestion"><b>ما ترجمة: <span dir="ltr">Je fais de la natation.</span>؟</b><div class="options"><button class="option" onclick="reviewAnswer(this,true)">أنا أمارس السباحة.</button><button class="option" onclick="reviewAnswer(this,false)">أنا ألعب التنس.</button></div><div class="feedback" id="rf"></div></div></div>`;else if(idx===9)h=`<div class="section-title"><h2>🏆 التقييم النهائي</h2><span class="badge">5 عناصر</span></div><div class="assessment-grid">${[['ما الرياضة التي تمارسها؟','Quel sport pratiques-tu ?','Quel sport fais-tu ?'],['أنا ألعب كرة القدم.','Je joue au football.','Je fais au football.'],['أنا أمارس السباحة.','Je fais de la natation.','Je joue de la natation.'],['أين تمارس رياضتك؟','Où pratiques-tu ton sport ?','Quel sport pratiques-tu ?'],['أنا أفضل التنس.','Je préfère le tennis.','Je pratique le tennis.']].map((q,i)=>`<div class="assessment-card"><b>${i+1}. ${esc(q[0])}</b><div class="options"><button class="option" onclick="checkAssessment(this,${i},true)">${esc(q[1])}</button><button class="option" onclick="checkAssessment(this,${i},false)">${esc(q[2])}</button></div><div class="feedback" id="af${i}"></div></div>`).join('')}</div><div class="result" id="assessmentResult">أجب عن الأسئلة الخمسة لمعرفة نتيجتك.</div>`;else if(idx===10)h=`<div class="section-title"><h2>📁 ملفات الدرس</h2><span class="badge">مواد مساعدة</span></div><div class="file-grid"><a class="file-card" href="data/lessons/grade-9/semester-1/u1-l1.json" target="_blank"><span>📄</span><b>بيانات الدرس</b><small>المصدر المنظم لمحتوى الدرس والأنشطة.</small></a><a class="file-card" href="unit-map.html?unit=unit-1"><span>🧭</span><b>خريطة الوحدة</b><small>العودة إلى مسار الوحدة الأولى.</small></a></div>`;else h=`<div class="section-title"><h2>📈 تقدمك</h2><span class="badge">احفظ تقدمك</span></div><div class="result"><strong id="progressPct">0%</strong><p>أكملت ${idx+1} من ${steps.length} مراحل في هذه الرحلة.</p><div class="progress"><i id="progressBar"></i></div><button class="btn primary" onclick="finish()">🏁 إكمال الدرس</button></div>`;panelEl.innerHTML=h;updateProgress()}
function checkPractice(btn,i,correct){const box=btn.parentElement;[...box.children].forEach(x=>x.disabled=true);btn.classList.add(correct?'correct':'wrong');document.getElementById('pf'+i).textContent=correct?'✅ ممتاز!':'❌ راجع القاعدة ثم حاول مرة أخرى.'}
function checkAssessment(btn,i,correct){const box=btn.parentElement;if(box.dataset.done)return;box.dataset.done='1';assessmentDone++;if(correct)assessmentScore++;[...box.children].forEach(x=>x.disabled=true);btn.classList.add(correct?'correct':'wrong');document.getElementById('af'+i).textContent=correct?'✅ إجابة صحيحة':'❌ الإجابة الصحيحة هي الزر الآخر.';if(assessmentDone===5)document.getElementById('assessmentResult').innerHTML=`<strong>${assessmentScore}/5</strong><br>${assessmentScore===5?'🏆 ممتاز! إتقان رائع.':assessmentScore>=3?'👍 جيد جدًا، راجع الأخطاء فقط.':'📘 أعد القاعدة والمفردات ثم جرّب مرة أخرى.'}`}
function reviewAnswer(btn,correct){if(document.getElementById('reviewQuestion').dataset.done)return;document.getElementById('reviewQuestion').dataset.done='1';reviewDone=1;reviewScore=correct?1:0;btn.classList.add(correct?'correct':'wrong');[...btn.parentElement.children].forEach(x=>x.disabled=true);document.getElementById('rf').textContent=correct?'✅ استرجاع ممتاز!':'❌ تذكّر: faire de la natation = أمارس السباحة.'}
function startGame(){const area=document.getElementById('gameArea');const q=data.vocab[Math.floor(Math.random()*data.vocab.length)];const choices=shuffle([q[1],data.vocab.find(x=>x[1]!==q[1])[1],data.vocab.find(x=>x[1]!==q[1]&&x[1]!==data.vocab.find(y=>y[1]!==q[1])[1])[1]]);area.innerHTML=`<h3 dir="ltr">${esc(q[0])}</h3><p>اختر المعنى الصحيح:</p><div class="choice-grid">${choices.map(c=>`<button class="choice" onclick="gameAnswer(this,${JSON.stringify(c===q[1])})">${esc(c)}</button>`).join('')}</div><div class="feedback" id="gf"></div>`}
function gameAnswer(btn,correct){if(document.getElementById('gf').dataset.done)return;document.getElementById('gf').dataset.done='1';btn.classList.add(correct?'correct':'wrong');document.getElementById('gf').textContent=correct?'🎉 صحيح!':'❌ حاول مرة أخرى في جولة جديدة.'}
function updateProgress(){const pct=Math.round(((idx+1)/steps.length)*100);const p=document.getElementById('progressPct'),b=document.getElementById('progressBar');if(p)p.textContent=pct+'%';if(b)b.style.width=pct+'%';localStorage.setItem('hm_g9_u1_l1_idx',String(idx));document.getElementById('status').textContent='المرحلة الحالية: '+steps[idx][2]+' · تقدمك محفوظ على هذا الجهاز.'}
function finish(){localStorage.setItem('hm_g9_u1_l1_complete','1');document.getElementById('status').textContent='✅ تم تسجيل إكمال الدرس على هذا الجهاز.';alert('تم تسجيل إكمال الدرس بنجاح 🎉')}
const saved=Number(localStorage.getItem('hm_g9_u1_l1_idx'));if(Number.isInteger(saved)&&saved>=0&&saved<steps.length)idx=saved;render();
</script>
</body></html>
