function render(){renderNav();let h='';
if(idx===0)h=`<h2>🚀 ضربة البداية</h2><p>في هذا الدرس سنكتشف أسماء الرياضات أولًا، ثم نتعلم كيف نستخدم معها أدوات التعريف، وبعد ذلك نسمع ونقرأ ونطبق في مواقف حقيقية.</p><div class="note"><b>🎯 هدف الدرس</b><br>أن تتعرف على أسماء الرياضات، وتختار أداة التعريف المناسبة: <b>le / la / l' / les</b>، ثم تستخدمها في جمل بسيطة.</div>`;

if(idx===2)h=`<h2>🎧 النطق</h2><p>هنا لا نكرر صفحة المفردات؛ نركز على <b>كيف ننطق الكلمة</b> وما الصوت الذي يجب أن ينتبه إليه الطالب.</p><div class="pron-grid">${data.vocab.map(x=>`<article class="pron-card"><div class="fr">${esc(x[0])}</div><div class="ar">${esc(x[1])}</div><div class="note" style="margin-top:9px"><b>💡 ملاحظة النطق:</b><br>${esc(notes[x[0]])}</div><button class="btn primary" onclick='speak(${JSON.stringify(x[0])})'>🔊 استمع للكلمة</button></article>`).join('')}</div>`;
if(idx===3)h=`<h2>📘 القاعدة: أدوات التعريف مع أسماء الرياضات</h2><p>في هذا الدرس نركز على <b>أسماء الرياضات</b>، ولذلك نتعلم كيف نضع أداة التعريف المناسبة قبل اسم الرياضة.</p><div class="grammar-grid"><div class="formula"><b>le</b><p>مع الاسم المذكر المفرد:</p><strong>le football · le tennis · le judo</strong></div><div class="formula"><b>la</b><p>مع الاسم المؤنث المفرد:</p><strong>la natation · la boxe · la voile</strong></div><div class="formula"><b>l'</b><p>قبل اسم مفرد يبدأ بحرف متحرك:</p><strong>l'équitation · l'escrime</strong></div><div class="formula"><b>les</b><p>مع الاسم الجمع:</p><strong>les échecs</strong></div></div><div class="contrast"><div class="yes"><b>✅ نستخدم أداة التعريف</b><br>Je pratique <b>le</b> football.<br>Je fais de <b>la</b> natation.<br>Je pratique <b>l'</b>escrime.</div><div class="no"><b>❌ ليست هذه قاعدة الدرس</b><br>لا نبدأ هنا بشرح <b>un / une / des</b>؛ لأنها أدوات نكرة، بينما هدفنا الآن هو استعمال أسماء الرياضات كأسماء محددة في التعبير الفرنسي.</div></div><div class="note" style="margin-top:14px"><b>⭐ تذكّر:</b> أداة التعريف لا تُختار عشوائيًا؛ ننظر إلى جنس الاسم وعدده، ومع المفرد الذي يبدأ بحرف متحرك نستخدم <b>l'</b>.</div>`;
if(idx===4)h=`<h2>💬 محادثة تفاعلية</h2><p>اقرأ الحوار كما لو كنت داخل كتاب تفاعلي، ثم استمع إلى السطر الذي تريد سماعه.</p><div class="dialogue-wrap">${data.conv.map(x=>`<article class="dialogue-card ${x[0].toLowerCase()}"><div class="speaker">${x[0]}</div><div class="line-fr">${esc(x[1])}</div><div class="line-ar">${esc(x[2])}</div><button class="btn primary" onclick='speak(${JSON.stringify(x[1])})'>🔊 استمع</button></article>`).join('')}</div><div class="note" style="margin-top:14px"><b>🎯 جرّب أنت:</b> أجب شفهيًا عن سؤال «Quel sport pratiques-tu ?» ثم قارن إجابتك بالحوار.</div>`;
if(idx===5)h=`<h2>🎬 شاهد وتعلّم</h2><p>شاهد الفيديو ثم حاول التعرف على الرياضات التي سمعتها، وبعدها انتقل للتدريب.</p><div class="video"><iframe src="https://www.youtube.com/embed/pnmoexHphZ0" title="Apprendre les sports en français" allowfullscreen></iframe></div>`;
if(idx===6)h=`<h2>🎯 التدريب</h2><p>الأسئلة هنا تطبيق مباشر على ما تعلمناه، ولا تعرض السؤال بصيغته الإجابة بشكل مكشوف.</p><div class="assessment-grid">${practiceQuestions().map(q=>questionCard(q,'mcq')).join('')}</div>`;
if(idx===7)h=`<h2>🎮 مركز الألعاب</h2><p>الألعاب موجودة في صفحة مستقلة حتى يكون لكل لعبة مساحة واضحة ومركز ألعاب كامل مثل الدرس المرجعي.</p><div class="game-launch"><div style="font-size:52px">🎮</div><h3>مركز الألعاب · Les sports</h3><p>ستجد عدة ألعاب مستقلة للمفردات وأدوات التعريف والاستعمال والنطق والمراجعة السريعة، وكلها خاصة بهذا الدرس فقط.</p><a href="grade9-u1-l1-games.html">🚀 فتح مركز الألعاب</a></div>`;
if(idx===8)h=`<h2>🧠 المراجعة الذكية</h2><p>المراجعة الآن <b>اختبار قصير فعلي</b>: كل إجابة تقيس مهارة، ولا تُحسب المراجعة مكتملة بمجرد الضغط على زر.</p><div class="review-box note"><div><b>التقدم: <span id="reviewScore">${reviewScore} / ${reviewDone}</span></b></div></div><div class="note" style="margin-top:12px"><h3>السؤال 1: اختر أداة التعريف المناسبة.</h3><div class="fr">___ équitation</div><div class="choice-grid">${[['l’',true],['la',false],['le',false],['les',false]].map(x=>`<button class="choice" onclick="reviewChoice(this,${x[1]})">${x[0]}</button>`).join('')}</div><div class="feedback"></div></div><div class="note" style="margin-top:12px"><h3>السؤال 2: أي جملة صحيحة؟</h3><div class="choice-grid">${[['Je joue à la natation.',false],['Je fais de la natation.',true],['Je fais du natation.',false],['Je pratique une natation.',false]].map(x=>`<button class="choice" onclick="reviewChoice(this,${x[1]})">${x[0]}</button>`).join('')}</div><div class="feedback"></div></div><div class="note" style="margin-top:12px"><h3>السؤال 3: اختر الأداة المناسبة.</h3><div class="fr">___ échecs</div><div class="choice-grid">${[['le',false],['la',false],['les',true],['l’',false]].map(x=>`<button class="choice" onclick="reviewChoice(this,${x[1]})">${x[0]}</button>`).join('')}</div><div class="feedback"></div></div>`;
if(idx===9)h=`<h2>🏆 التقييم النهائي</h2><p>هذا تقييم الدرس نفسه: أسئلة متنوعة، ويتم توزيع الاختيارات عشوائيًا في كل فتح للصفحة حتى لا تكون الإجابة الصحيحة دائمًا في المكان نفسه.</p><div class="note"><b>📌 قبل البدء:</b> اقرأ السؤال جيدًا، اختر إجابتك، ثم انتقل للسؤال التالي.</div><div class="score" style="margin:14px 0">النتيجة: <span id="assessmentScore">${assessmentScore} / ${assessmentDone}</span></div><div class="progress"><i id="assessmentBar" style="width:${assessmentQuestions().length?assessmentDone/assessmentQuestions().length*100:0}%"></i></div><div class="assessment-grid" style="margin-top:14px">${assessmentQuestions().map(q=>`<article class="assessment-card"><h3>${q.q}</h3><div class="options">${shuffled(q).map(o=>`<button class="option" onclick="assess(this,${o.correct})">${o.text}</button>`).join('')}</div><div class="feedback"></div></article>`).join('')}</div><div id="assessmentResult" style="margin-top:14px"></div>`;
if(idx===10)h=`<h2>📁 ملفات الدرس</h2><p>مواد هذا الدرس وروابطه الأساسية، مرتبطة بالصف الثالث الإعدادي وهذا الدرس فقط.</p><div class="file-grid"><a class="file-card" href="#vocab" onclick="go(1)"><span>🖼️</span>ملف المفردات<small>العودة مباشرة إلى مفردات Les sports.</small></a><a class="file-card" href="#pron" onclick="go(2)"><span>🎧</span>ملف النطق<small>ملاحظات النطق التفصيلية لكل كلمة.</small></a><a class="file-card" href="#grammar" onclick="go(3)"><span>📘</span>ملف القواعد<small>شرح أدوات التعريف مع أسماء الرياضات.</small></a><a class="file-card" href="#conv" onclick="go(4)"><span>💬</span>ملف المحادثة<small>الحوار التفاعلي الخاص بالدرس.</small></a><a class="file-card" href="#video" onclick="go(5)"><span>🎬</span>فيديو الدرس<small>الفيديو المرتبط بهذا الدرس.</small></a><a class="file-card" href="grade9-u1-l1-games.html"><span>🎮</span>مركز الألعاب<small>صفحة ألعاب مستقلة تضم عدة تحديات خاصة بهذا الدرس فقط.</small></a><a class="file-card" href="#practice" onclick="go(6)"><span>🎯</span>التدريب<small>تدريبات الدرس التفاعلية.</small></a><a class="file-card" href="#assessment" onclick="go(9)"><span>🏆</span>التقييم<small>التقييم النهائي للدرس.</small></a></div>`;
if(idx===11)h=`<h2>📈 التقدم</h2><div class="result"><div>رحلة هذا الدرس</div><strong>12 مراحل</strong><p>المفردات → النطق → القاعدة → المحادثة → الفيديو → التدريب → الألعاب → المراجعة → التقييم → الملفات.</p><p class="small">نتيجة التقييم: ${assessmentDone}/10 أسئلة تمت الإجابة عنها. نتيجة المراجعة: ${reviewDone}/3 أسئلة تمت الإجابة عنها.</p></div>`;
panel.innerHTML=h}
function assess(btn,ok){if(btn.disabled)return;const c=btn.closest('.assessment-card');if(c.dataset.done)return;c.dataset.done='1';c.querySelectorAll('.option').forEach(x=>x.disabled=true);btn.classList.add(ok?'correct':'wrong');assessmentDone++;if(ok)assessmentScore++;const s=document.getElementById('assessmentScore');if(s)s.textContent=`${assessmentScore} / ${assessmentDone}`;const b=document.getElementById('assessmentBar');if(b)b.style.width=(assessmentDone/10*100)+'%';const f=c.querySelector('.feedback');if(f)f.textContent=ok?'✅ صحيح!':'❌ ليست الإجابة الصحيحة.';if(assessmentDone===10){const r=document.getElementById('assessmentResult');if(r)r.innerHTML=`<div class="result"><strong>${assessmentScore}/10</strong><p>${assessmentScore>=8?'🏆 ممتاز!':'💪 راجع النقاط التي أخطأت فيها ثم أعد المحاولة.'}</p></div>`}}
render();
</script></body></html>
