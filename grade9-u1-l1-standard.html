if(idx===2)h=`<h2>🎧 النطق</h2><p>هنا نركز على الأصوات التي قد تسبب صعوبة، مع ملاحظة خاصة لكل كلمة.</p><div class="pron-grid">${v.map(x=>`<article class="pron-card"><div class="fr">${esc(x[0])}</div><div class="ar">${esc(x[1])}</div><div class="note"><b>💡 ملاحظة النطق:</b><br>${esc(notes[x[0]])}</div><button class="btn primary" onclick='speak(${JSON.stringify(x[0])})'>🔊 استمع للكلمة</button></article>`).join('')}</div>`;
if(idx===3)h=`<h2>📘 القاعدة: أدوات التعريف مع أسماء الرياضات</h2><p>نتعلم هنا أدوات التعريف التي تأتي قبل أسماء الرياضات.</p><div class="grammar-grid"><div class="formula"><b>le</b><p>مع الاسم المذكر المفرد:</p><strong>le football · le tennis · le judo</strong></div><div class="formula"><b>la</b><p>مع الاسم المؤنث المفرد:</p><strong>la natation · la boxe · la voile</strong></div><div class="formula"><b>l'</b><p>قبل الاسم المفرد الذي يبدأ بحرف متحرك:</p><strong>l'équitation · l'escrime</strong></div><div class="formula"><b>les</b><p>مع الاسم الجمع:</p><strong>les échecs</strong></div></div><div class="contrast"><div class="yes"><b>✅ أمثلة</b><br>Je pratique <b>le</b> football.<br>Je fais de <b>la</b> natation.<br>Je pratique <b>l'</b>escrime.</div><div class="no"><b>📌 انتبه</b><br>لا نخلط بين أدوات التعريف <b>le / la / l' / les</b> وأدوات النكرة <b>un / une / des</b>.</div></div><div class="note" style="margin-top:14px"><b>⭐ تذكّر:</b> انظر إلى جنس الاسم وعدده، وإذا كان مفردًا ويبدأ بحرف متحرك نستخدم <b>l'</b>.</div>`;
if(idx===4)h=`<h2>💬 محادثة تفاعلية</h2><p>اقرأ الحوار ثم استمع إلى أي سطر تريد سماعه.</p><div class="dialogue-wrap">${data.conv.map(x=>`<article class="dialogue-card ${x[0].toLowerCase()}"><div class="speaker">${x[0]}</div><div class="line-fr">${esc(x[1])}</div><div class="line-ar">${esc(x[2])}</div><button class="btn primary" onclick='speak(${JSON.stringify(x[3])})'>🔊 استمع</button></article>`).join('')}</div><div class="note" style="margin-top:14px"><b>🎯 جرّب أنت:</b> أجب شفهيًا عن سؤال «Quel sport pratiques-tu ?» ثم قارن إجابتك بالحوار.</div>`;
if(idx===5)h=`<h2>🎬 شاهد وتعلّم</h2><p>شاهد الفيديو ثم حاول التعرف على الرياضات التي سمعتها.</p><div class="video"><iframe src="https://www.youtube.com/embed/pnmoexHphZ0" title="Apprendre les sports en français" allowfullscreen></iframe></div>`;
if(idx===6)h=`<h2>🎯 التدريب</h2><p>أسئلة تطبيقية على ما تعلمناه، والاختيارات تتغير ترتيبها.</p><div class="assessment-grid">${practiceQuestions().map((q,i)=>`<article class="task assessment-card"><h3>${i+1}. ${q.q}</h3><div class="options">${shuffledQuestion(q).map(o=>`<button class="option" data-correct="${o.correct}" onclick="mcq(this,${o.correct})">${o.text}</button>`).join('')}</div><div class="feedback"></div></article>`).join('')}</div>`;
if(idx===7)h=`<h2>🎮 الألعاب</h2><p>مركز الألعاب الكامل لهذا الدرس موجود في صفحة مستقلة.</p><div class="game-launch"><div style="font-size:52px">🎮</div><h3>مركز الألعاب · Les sports</h3><p>ستجد عدة ألعاب مستقلة للمفردات وأدوات التعريف والاستعمال والنطق.</p><a href="grade9-u1-l1-games.html">🚀 فتح مركز الألعاب</a></div>`;
if(idx===8)h=`<h2>🧠 المراجعة الذكية</h2><p>ثلاثة أسئلة قصيرة؛ اختر إجابتك ثم تُغلق خيارات السؤال الذي أجبت عنه فقط.</p><div class="score" style="margin-bottom:12px">التقدم: <span id="reviewScore">${reviewScore} / ${reviewDone}</span></div><div class="review-box"><h3>السؤال 1: اختر أداة التعريف المناسبة.</h3><div class="review-answer">___ équitation</div><div class="choice-grid"><button class="choice" data-correct="true" onclick="reviewQuestion(this,true)">l’</button><button class="choice" data-correct="false" onclick="reviewQuestion(this,false)">la</button><button class="choice" data-correct="false" onclick="reviewQuestion(this,false)">le</button><button class="choice" data-correct="false" onclick="reviewQuestion(this,false)">les</button></div><div class="feedback"></div></div><div class="review-box" style="margin-top:12px"><h3>السؤال 2: أي جملة صحيحة؟</h3><div class="choice-grid"><button class="choice" data-correct="false" onclick="reviewQuestion(this,false)">Je joue à la natation.</button><button class="choice" data-correct="true" onclick="reviewQuestion(this,true)">Je fais de la natation.</button><button class="choice" data-correct="false" onclick="reviewQuestion(this,false)">Je fais du natation.</button><button class="choice" data-correct="false" onclick="reviewQuestion(this,false)">Je pratique une natation.</button></div><div class="feedback"></div></div><div class="review-box" style="margin-top:12px"><h3>السؤال 3: اختر الأداة المناسبة.</h3><div class="review-answer">___ échecs</div><div class="choice-grid"><button class="choice" data-correct="false" onclick="reviewQuestion(this,false)">le</button><button class="choice" data-correct="false" onclick="reviewQuestion(this,false)">la</button><button class="choice" data-correct="true" onclick="reviewQuestion(this,true)">les</button><button class="choice" data-correct="false" onclick="reviewQuestion(this,false)">l’</button></div><div class="feedback"></div></div>`;
if(idx===9)h=`<h2>🏆 التقييم النهائي</h2><p>أسئلة متنوعة مع توزيع عشوائي للاختيارات.</p><div class="score" style="margin:14px 0">النتيجة: <span id="assessmentScore">${assessmentScore} / ${assessmentDone}</span></div><div class="progress"><i id="assessmentBar" style="width:${assessmentDone/10*100}%"></i></div><div class="assessment-grid" style="margin-top:14px">${assessmentQuestions().map((q,i)=>`<article class="assessment-card"><h3>${i+1}. ${q.q}</h3><div class="options">${shuffledQuestion(q).map(o=>`<button class="option" data-correct="${o.correct}" onclick="assess(this,${o.correct})">${o.text}</button>`).join('')}</div><div class="feedback"></div></article>`).join('')}</div>`;
if(idx===10)h=`<h2>📁 ملفات الدرس</h2><p>مواد هذا الدرس وروابطه الأساسية، مرتبطة بالصف الثالث الإعدادي وهذا الدرس فقط.</p><div class="file-grid"><a class="file-card" href="#vocab" onclick="go(1)"><span>🧠</span>ملف المفردات<small>مفردات Les sports مع الأمثلة.</small></a><a class="file-card" href="#pron" onclick="go(2)"><span>🎧</span>ملف النطق<small>ملاحظات النطق التفصيلية لكل كلمة.</small></a><a class="file-card" href="#grammar" onclick="go(3)"><span>📘</span>ملف القواعد<small>شرح أدوات التعريف مع أسماء الرياضات.</small></a><a class="file-card" href="#conv" onclick="go(4)"><span>💬</span>ملف المحادثة<small>الحوار كاملًا مع زر استماع لكل سطر.</small></a><a class="file-card" href="#video" onclick="go(5)"><span>🎬</span>فيديو الدرس<small>الفيديو المرتبط بالدرس.</small></a><a class="file-card" href="grade9-u1-l1-games.html"><span>🎮</span>مركز الألعاب<small>صفحة ألعاب مستقلة تحتوي عدة تحديات للدرس.</small></a><a class="file-card" href="#practice" onclick="go(6)"><span>🎯</span>التدريب<small>تدريبات تفاعلية على محتوى الدرس.</small></a><a class="file-card" href="#assessment" onclick="go(9)"><span>🏆</span>التقييم<small>التقييم النهائي للدرس.</small></a></div>`;
if(idx===11)h=`<h2>📈 التقدم</h2><div class="result"><div>رحلة هذا الدرس</div><strong>12 مراحل</strong><p>المفردات → النطق → القاعدة → المحادثة → الفيديو → التدريب → الألعاب → المراجعة → التقييم → الملفات.</p><p class="small">نتيجة التقييم: ${assessmentDone}/10 أسئلة تمت الإجابة عنها. نتيجة المراجعة: ${reviewDone}/3 أسئلة تمت الإجابة عنها.</p></div>`;
panel.innerHTML=h}
render();
</script>
</body>
</html>
