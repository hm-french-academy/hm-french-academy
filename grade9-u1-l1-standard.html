ne-height:1.7}.video{position:relative;padding-top:56.25%;border-radius:18px;overflow:hidden;background:#0f1b33}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.game-launch{background:linear-gradient(135deg,#f7f9ff,#fff7fb);border:1px solid #dfe6f2;border-radius:20px;padding:20px;text-align:center}.game-launch a{display:inline-block;background:#2563eb;color:#fff;text-decoration:none;border-radius:13px;padding:12px 18px;font-weight:900}.assessment-grid{display:grid;gap:12px}.result{background:#f7f9fd;border-radius:18px;padding:18px;text-align:center}.result strong{font-size:34px;color:#173a82}.progress{height:9px;background:#e8edf5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#2563eb}.file-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.file-card{display:block;text-decoration:none;color:#17223b;background:linear-gradient(135deg,#fff,#f7f9ff);border:1px solid #e1e6ef;border-radius:18px;padding:16px;cursor:pointer}.file-card span{display:block;font-size:30px;margin-bottom:8px}.file-card small{display:block;color:#66738a;font-weight:700;margin-top:5px;line-height:1.6}.complete{margin-top:14px;background:#fff;border-radius:20px;padding:17px;display:flex;justify-content:space-between;gap:12px;align-items:center}.student-note{font-size:12px;color:#718096;margin:7px 2px;text-align:right}@media(max-width:650px){.wrap{padding:10px}.complete{display:block}.unit-btn{display:none}.dialogue-card{max-width:94%}}</style></head>
<body data-hm-grade-theme="prep-3"><div class="wrap"><header class="student-header"><a class="brand" href="index.html"><span class="brand-logo">HM</span><span>🇫🇷 HM Academy</span></a><div class="header-actions"><a class="unit-btn" href="unit-map.html?unit=unit-1">🧭 خريطة الوحدة</a><a class="home-btn" href="index.html">⌂ الرئيسية</a></div></header><div class="student-note">درس الصف الثالث الإعدادي · الوحدة الأولى · Les sports</div><section class="hero"><h1>الرياضات</h1><p>Les sports · Le sport · الصف الثالث الإعدادي · الوحدة الأولى</p><div class="journey"><span>🚀 استكشف</span><span>🖼️ تعلم</span><span>🎧 انطق</span><span>📘 افهم</span><span>💬 تواصل</span><span>🎬 شاهد</span><span>🎯 تدرب</span><span>🎮 العب</span><span>🧠 راجع</span><span>🏆 قيّم</span><span>📁 ملفات</span><span>📈 تقدم</span></div></section><nav class="nav" id="nav"></nav><section class="panel" id="panel"></section><section class="complete"><div><b>🏁 رحلة التعلم</b><div id="status">تقدمك محفوظ على هذا الجهاز.</div></div><button class="btn primary" id="finishBtn">إكمال الدرس</button></section></div>
<script>
const vocab=[['le football','كرة القدم','⚽','Je joue au football.','le'],['le ping-pong','تنس الطاولة','🏓','Je joue au ping-pong.','le'],['le karaté','الكاراتيه','🥋','Je pratique le karaté.','le'],['le cyclisme / le vélo','ركوب الدراجات','🚴','Je fais du vélo.','le'],['la boxe','الملاكمة','🥊','Je pratique la boxe.','la'],['la natation','السباحة','🏊','Je fais de la natation.','la'],['le tennis','التنس','🎾','Je joue au tennis.','le'],['le basket-ball','كرة السلة','🏀','Je joue au basket-ball.','le'],['le volley-ball','الكرة الطائرة','🏐','Je joue au volley-ball.','le'],["l'équitation",'الفروسية','🏇',"Je fais de l'équitation.",'l’'],["l'escrime",'المبارزة','🤺',"Je pratique l'escrime.",'l’'],['le ski','التزلج','⛷️','Je fais du ski.','le'],['le judo','الجودو','🥋','Je pratique le judo.','le'],['le rugby','الرجبي','🏉','Je joue au rugby.','le'],['la pêche','صيد السمك','🎣','Je pratique la pêche.','la'],['la voile','الإبحار','⛵','Je fais de la voile.','la'],['la gymnastique','الجمباز','🤸','Je fais de la gymnastique.','la'],['les échecs','الشطرنج','♟️','Je joue aux échecs.','les'],['la marche','المشي','🚶','Je fais de la marche.','la'],['la randonnée','التنزه','🥾','Je fais de la randonnée.','la']];
const conv=[['Sara','Quel sport pratiques-tu ?','ما الرياضة التي تمارسها؟'],['Adam','Je pratique le football.','أنا أمارس كرة القدم.'],['Sara',"Qu'est-ce que tu préfères ?",'ماذا تفضل؟'],['Adam','Je préfère le tennis.','أفضل التنس.'],['Sara','Où pratiques-tu ton sport préféré ?','أين تمارس رياضتك المفضلة؟'],['Adam','Je le pratique au club.','أمارسها في النادي.'],['Sara','Tu fais du sport ?','هل تمارس الرياضة؟'],['Adam','Oui, je fais de la natation.','نعم، أمارس السباحة.']];
const steps=[['intro','🚀','البداية'],['vocab','🖼️','المفردات'],['pron','🎧','النطق'],['grammar','📘','القواعد'],['conv','💬','المحادثة'],['video','🎬','الفيديو'],['practice','🎯','التدريب'],['games','🎮','الألعاب'],['review','🧠','المراجعة الذكية'],['assessment','🏆','التقييم'],['files','📁','ملفات الدرس'],['progress','📈','التقدم']];
let idx=0,assessmentScore=0,assessmentDone=0,reviewDone=0,finished=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getFrenchVoice(){if(!window.speechSynthesis)return null;const v=speechSynthesis.getVoices();return v.find(x=>/^fr[-_]FR$/i.test(x.lang))||v.find(x=>/^fr[-_]/i.test(x.lang))||null}
function speak(text){const s=String(text||'').trim();if(!s||!window.speechSynthesis||!window.SpeechSynthesisUtterance)return;const isProblem=/^l[’'](équitation|escrime)$/i.test(s);const spoken=isProblem?s.replace(/^l[’']/i,''):s;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(spoken);u.lang='fr-FR';u.rate=.8;u.pitch=1;u.volume=1;const v=getFrenchVoice();if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function shuffle(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function setStep(i){idx=i;renderNav();render();scrollTo({top:0,behavior:'smooth'})}
function renderNav(){nav.innerHTML=steps.map((s,i)=>`<button class="${i===idx?'active':''}" data-i="${i}">${s[1]} ${s[2]}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>setStep(+b.dataset.i))}
const notes={"le football":'حرف le يُنطق متصلًا مع اسم الرياضة، وانتبه إلى صوت ll في نهاية football.',"le ping-pong":'حافظ على وضوح المقطعين ping وpong مع توقف خفيف بينهما.',"le karaté":'النبرة واضحة في المقطع الأخير، ولا تُهمِل صوت é في النهاية.',"le cyclisme / le vélo":'في cyclisme يظهر صوت c الأول مثل s، أما vélo فصوت é في البداية واضح.',"la boxe":'صوت x في boxe يُسمع في نهاية الكلمة، والكلمة قصيرة الإيقاع.',"la natation":'انتبه إلى المقطع الأخير -tion وإلى نطق a في بداية الكلمة.',"le tennis":'حافظ على التاء الفرنسية الواضحة في بداية الكلمة ولا تطيل حرف e.',"le basket-ball":'انطق basket ثم ball بوضوح، مع عدم إسقاط المقطع الأخير.',"le volley-ball":'حافظ على صوت v في البداية وعلى المقطع الأخير ball.',"l'équitation":'زر النطق ينطق اسم الرياضة نفسه بصورة طبيعية دون تحويل علامة l’ إلى كلمة مستقلة.',"l'escrime":'الكلمة تبدأ مباشرة بالصوت المتصل بعد l’، فلا تُنطق علامة الحذف ككلمة.',"le ski":'الكلمة قصيرة؛ اجعل صوت s واضحًا ثم k مباشرة.',"le judo":'صوت j في البداية فرنسي واضح، مع o في نهاية الكلمة.',"le rugby":'انتبه إلى r الفرنسية وإلى المقطع الأخير من rugby.',"la pêche":'صوت ch هنا مثل «ش»، وê صوت علّة واضح ومفتوح.',"la voile":'انتبه إلى صوت oi الذي يعطي حركة صوتية واحدة متصلة.',"la gymnastique":'حرف g في البداية يُنطق مثل j الفرنسية، مع الحفاظ على نهاية -tique.',"les échecs":'انتبه إلى أن les تُوصل بالاسم، ثم انطق échecs دون إسقاط الصوت الأول.',"la marche":'ch تُنطق مثل «ش»، والكلمة تنتهي بصوت واضح دون مبالغة.',"la randonnée":'حافظ على صوت r الفرنسية وعلى المقطع الأخير -née.'};
function intro(){return `<h2>🚀 ضربة البداية</h2><p>في هذا الدرس ستتعرف إلى أسماء الرياضات ومعانيها وتستخدمها في مواقف بسيطة.</p><div class="note"><b>🎯 هدف الدرس:</b> التعرف إلى مفردات Les sports وفهمها واستخدامها شفهيًا وكتابيًا.</div>`}
function vocabPage(){return `<h2>🖼️ المفردات</h2><p>استمع إلى الكلمة أو إلى المثال من البطاقة نفسها.</p><div class="cards">${vocab.map(v=>`<article class="card"><div class="sport-art">${v[2]}</div><div class="fr">${esc(v[0])}</div><div class="ar">${esc(v[1])}</div><div class="example">${esc(v[3])}</div><button class="btn primary" data-speak="${esc(v[0])}">🔊 نطق الكلمة</button><button class="btn secondary" data-speak="${esc(v[3])}">▶ نطق المثال</button></article>`).join('')}</div>`}
function pron(){return `<h2>🎧 النطق</h2><p>كل كلمة لها ملاحظة نطق خاصة بها. لا توجد ملاحظة عامة مكررة.</p><div class="pron-grid">${vocab.map(v=>`<article class="pron-card"><div class="fr">${esc(v[0])}</div><div class="ar">${esc(v[1])}</div><div class="note"><b>💡 ملاحظة:</b> ${esc(notes[v[0]])}</div><button class="btn primary" data-speak="${esc(v[0])}">🔊 استمع للكلمة</button></article>`).join('')}</div>`}
function grammar(){return `<h2>📘 القواعد</h2><div class="note"><b>📌 تنبيه منهجي:</b> شرح قواعد <span dir="ltr">faire du / de la / de l’</span> و<span dir="ltr">pratiquer</span> و<span dir="ltr">jouer à</span> بالتفصيل ليس ضمن هذا الدرس؛ سيُقدَّم في الدرس المخصص له لاحقًا. هنا نكتفي بملاحظة استعمال الرياضات داخل الجمل دون تقديم قاعدة الدرس القادم.</div><div class="formula" style="margin-top:14px"><b>Les sports</b><p>ركز في هذه المرحلة على التعرف إلى اسم الرياضة ونطقها ومعناها واستعمالها في سياق الدرس.</p></div>`}
function convPage(){return `<h2>💬 المحادثة</h2><p>زر واحد فقط للاستماع إلى كل سطر.</p><div class="dialogue-wrap">${conv.map(x=>`<article class="dialogue-card ${x[0].toLowerCase()}"><div class="speaker">${x[0]}</div><div class="line-fr">${esc(x[1])}</div><div class="line-ar">${esc(x[2])}</div><button class="btn primary" data-speak="${esc(x[1])}">🔊 استمع</button></article>`).join('')}</div>`}
function videoPage(){return `<h2>🎬 فيديو الدرس</h2><p>شاهد الفيديو ثم حاول تذكر أسماء الرياضات التي سمعتها.</p><div class="video"><iframe src="https://www.youtube.com/embed/pnmoexHphZ0" title="Les sports" allowfullscreen></iframe></div>`}
const practiceQ=[['أي كلمة تعني كرة القدم؟',['le football','la boxe','la voile','le ski'],0],['أي كلمة تعني السباحة؟',['le tennis','la natation','le rugby','la marche'],1],['أي كلمة تعني الفروسية؟',["l'équitation",'la pêche','le judo','le volley-ball'],0],['أي كلمة تعني الشطرنج؟',['le basket-ball','les échecs','le karaté','le cyclisme'],1],['أي كلمة تعني الإبحار؟',['la voile','la boxe','la randonnée','le ping-pong'],0],['أي كلمة تعني المبارزة؟',["l'escrime",'la gymnastique','le football','la pêche'],0]];
function task(q,i,p){const opts=shuffle(q[1].map((text,index)=>({text,index})));return `<article class="task" data-answer="${q[2]}"><b>${i+1}. ${q[0]}</b><div class="options">${opts.map(o=>`<button class="option" data-index="${o.index}">${esc(o.text)}</button>`).join('')}</div><div class="feedback"></div></article>`}
function practice(){return `<h2>🎯 التدريب</h2><p>الأسئلة هنا تقيس المفردات نفسها، ولا تكشف الإجابة داخل صياغة السؤال.</p><div class="assessment-grid">${practiceQ.map((q,i)=>task(q,i,'p')).join('')}</div>`}
function games(){return `<h2>🎮 الألعاب التعليمية</h2><div class="game-launch"><div style="font-size:52px">🎮</div><h3>مركز الألعاب · Les sports</h3><p>تم فصل مركز الألعاب عن صفحة الدرس حتى تكون الألعاب منظمة مثل مركز ألعاب الدرس المرجعي، وتضم عدة تحديات مستقلة مبنية على مفردات الصف الثالث الإعدادي فقط.</p><a href="grade9-u1-l1-games.html">🚀 فتح مركز الألعاب</a></div>`}
const assessmentQ=[['أي كلمة تعني التنس؟',['le tennis','la natation','le rugby'],0],['أي كلمة تعني الملاكمة؟',['la voile','la boxe','le judo'],1],['أي كلمة تعني التزلج؟',['le ski','la marche','la pêche'],0],['أي كلمة تعني الجمباز؟',['le karaté','la gymnastique','le football'],1],['أي كلمة تعني التنزه؟',['la randonnée','la boxe','les échecs'],0],['أي كلمة تعني ركوب الدراجات؟',['le cyclisme / le vélo','la voile','le volley-ball'],0],['أي كلمة تعني صيد السمك؟',['la pêche','la marche','le tennis'],0],['أي كلمة تعني الكرة الطائرة؟',['le basket-ball','le volley-ball','le ping-pong'],1],['أي كلمة تعني الجودو؟',['le judo','le rugby','le ski'],0],['أي كلمة تعني المشي؟',['la marche','la gymnastique','la boxe'],0]];
function assessment(){return `<h2>🏆 التقييم النهائي</h2><p>اختيارات كل سؤال تتغير أماكنها، ولا تكون الإجابة الصحيحة ثابتة في الخيار الأول.</p><div class="assessment-grid">${assessmentQ.map((q,i)=>task(q,i,'a')).join('')}</div><div class="result" style="margin-top:14px"><strong id="assessmentResult">0 / 10</strong><div class="progress" style="margin-top:10px"><i id="assessmentProgress"></i></div><p id="assessmentMsg">أجب عن الأسئلة لعرض النتيجة.</p></div>`}
function files(){return `<h2>📁 ملفات الدرس</h2><p>هذه هي موارد الدرس المرتبطة به مباشرة، دون روابط إلى درس آخر أو مرحلة أخرى.</p><div class="file-grid"><a class="file-card" href="#" data-step="1"><span>🖼️</span><b>ملف المفردات</b><small>مفردات Les sports مع المعنى والصور والأمثلة الصوتية.</small></a><a class="file-card" href="#" data-step="2"><span>🎧</span><b>ملف النطق</b><small>ملاحظات نطق مستقلة لكل كلمة.</small></a><a class="file-card" href="#" data-step="3"><span>📘</span><b>ملف القواعد</b><small>تمهيد الدرس فقط؛ قواعد الدرس القادم ليست مضافة هنا.</small></a><a class="file-card" href="#" data-step="4"><span>💬</span><b>ملف المحادثة</b><small>الحوار الكامل مع زر استماع واحد لكل سطر.</small></a><a class="file-card" href="#" data-step="5"><span>🎬</span><b>فيديو الدرس</b><small>الفيديو المخصص لهذا الدرس.</small></a><a class="file-card" href="grade9-u1-l1-games.html"><span>🎮</span><b>مركز الألعاب</b><small>صفحة ألعاب مستقلة تضم مجموعة تحديات خاصة بدرس Les sports.</small></a><a class="file-card" href="#" data-step="6"><span>🎯</span><b>التدريب</b><small>تدريبات المفردات الخاصة بالدرس.</small></a><a class="file-card" href="#" data-step="9"><span>🏆</span><b>التقييم</b><small>التقييم النهائي الخاص بهذا الدرس.</small></a></div>`}
function progressPage(){return `<h2>📈 التقدم</h2><div class="result"><p>التقييم النهائي: <b>${assessmentDone}/10</b> سؤال مكتمل</p><p>${finished?'🏁 تم إكمال الدرس.':'أكمل التدريب والتقييم ثم اضغط «إكمال الدرس».'}</p></div>`}
function render(){const f=[intro,vocabPage,pron,grammar,convPage,videoPage,practice,games,()=>'<h2>🧠 المراجعة الذكية</h2><p>راجع كلمات الرياضات مرة أخرى ثم انتقل إلى التقييم.</p>',assessment,files,progressPage][idx];panel.innerHTML=f();bind();if(idx===9)bindAssessment()}
function bind(){panel.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));panel.querySelectorAll('.task .option').forEach(b=>b.onclick=()=>{const c=b.closest('.task');if(c.dataset.done)return;const ok=+b.dataset.index===+c.dataset.answer;b.classList.add(ok?'correct':'wrong');c.querySelector('.feedback').textContent=ok?'✅ صحيح!':'🔁 حاول مرة أخرى.';if(ok){c.dataset.done='1';c.querySelectorAll('.option').forEach(x=>x.disabled=true)}});panel.querySelectorAll('[data-step]').forEach(a=>a.onclick=e=>{e.preventDefault();setStep(+a.dataset.step)})}
function bindAssessment(){panel.querySelectorAll('.task .option').forEach(b=>b.onclick=()=>{const c=b.closest('.task');if(c.dataset.done)return;const ok=+b.dataset.index===+c.dataset.answer;b.classList.add(ok?'correct':'wrong');c.querySelector('.feedback').textContent=ok?'✅ صحيح!':'🔁 حاول مرة أخرى.';if(ok){c.dataset.done='1';c.querySelectorAll('.option').forEach(x=>x.disabled=true);assessmentDone++;assessmentScore++;const r=document.getElementById('assessmentResult');const p=document.getElementById('assessmentProgress');const m=document.getElementById('assessmentMsg');r.textContent=assessmentScore+' / 10';p.style.width=(assessmentDone*10)+'%';m.textContent=assessmentDone<10?'أكمل باقي الأسئلة.':assessmentScore>=8?'🏆 ممتاز!':assessmentScore>=6?'👍 جيد جدًا، راجع الأخطاء.':'🔁 راجع الدرس ثم حاول مرة أخرى.'}})}
finishBtn.onclick=()=>{finished=true;localStorage.setItem('hm-g9-u1-l1-finished','1');status.textContent='✅ تم إكمال الدرس وحفظ التقدم.';setStep(11)};renderNav();render();
</script></body></html>
