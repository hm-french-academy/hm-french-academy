<style>
body{margin:0;background:#f5f7fb;color:#17223b;font-family:Arial,"Cairo",sans-serif}.wrap{max-width:1120px;margin:auto;padding:16px}.student-header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0f1b33;color:#fff;padding:10px 12px;border-radius:18px;margin-bottom:14px;box-shadow:0 8px 22px #0f1b3325}.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:#fff;font-weight:900}.brand-logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#e92d83);font-weight:1000}.brand-text{font-size:16px}.header-actions{display:flex;gap:7px;align-items:center}.home-btn,.unit-btn{display:inline-flex;align-items:center;gap:5px;text-decoration:none;border-radius:12px;padding:10px 12px;font-weight:900;white-space:nowrap}.home-btn{background:#2563eb;color:#fff}.unit-btn{background:#eef3ff;color:#173a82}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff;border-radius:28px;padding:24px}.hero h1{margin:0;font-size:clamp(28px,6vw,42px)}.hero p{line-height:1.8}.journey{display:flex;gap:7px;overflow:auto;margin-top:15px}.journey span{background:#ffffff22;border:1px solid #ffffff44;border-radius:999px;padding:8px 12px;white-space:nowrap;font-weight:800}.nav{display:flex;gap:7px;overflow:auto;background:#fff;padding:8px;border-radius:18px;margin:14px 0}.nav button{border:0;background:#eef3ff;color:#173a82;border-radius:12px;padding:10px 13px;font-weight:900;white-space:nowrap}.nav button.active{background:#e92d83;color:#fff}.panel{background:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 30px #14264a12}.group{margin-bottom:24px}.group:last-child{margin-bottom:0}.group-head{background:linear-gradient(135deg,#f4f7ff,#fff7fb);border:1px solid #dfe6f2;border-radius:18px;padding:16px;margin-bottom:12px}.group-head h3{margin:0;color:#173a82;font-size:24px}.group-head p{margin:6px 0 0;color:#66738a;line-height:1.7}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.card{border:1px solid #e1e6ef;border-radius:18px;padding:15px;background:#fff}.icon{text-align:center;font-size:50px;padding:10px}.fr{font-weight:900;direction:ltr;text-align:center;font-size:20px}.ar{color:#315aa4;font-weight:800;text-align:center}.example{background:#f7f9fd;border-radius:12px;padding:10px;margin-top:8px;direction:ltr;text-align:center;line-height:1.6}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;margin:5px 3px 0 0}.primary{background:#2563eb;color:#fff}.secondary{background:#edf3ff;color:#173a82}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}.option{padding:12px;border:1px solid #dbe1eb;border-radius:11px;background:#fff;font-weight:800;cursor:pointer}.option.selected{border-color:#2563eb;background:#eef4ff}.option.correct{border-color:#20a45a;background:#ecfdf3}.option.wrong{border-color:#e92d83;background:#fff2f8}.feedback{min-height:24px;font-weight:800;margin-top:10px}.dialogue{border-right:4px solid #e92d83;padding:12px;margin:8px 0;background:#fff7fb;border-radius:12px;line-height:1.8}.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.file{padding:18px;border:1px solid #e1e6ef;border-radius:16px;font-weight:900}.file a{color:#2563eb;text-decoration:none}.complete{margin-top:14px;background:#fff;border-radius:20px;padding:17px;display:flex;justify-content:space-between;gap:12px;align-items:center}.goal{background:#f7f9fd;border-radius:16px;padding:15px;line-height:2}.road{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.road button{display:block;width:100%;border:0;text-align:right;color:#173a82;background:#f7f9fd;border-radius:15px;padding:14px;font-weight:900;cursor:pointer}.empty{padding:20px;background:#f8fafc;border-radius:16px;color:#66738a}.student-note{font-size:12px;color:#718096;margin:7px 2px 0;text-align:right}.practice-card{border:1px solid #e1e6ef;border-radius:18px;padding:16px;margin:12px 0}.practice-card h3{margin:0 0 8px;color:#173a82}.progress-line{height:8px;background:#e8edf5;border-radius:99px;overflow:hidden;margin:12px 0}.progress-line i{display:block;height:100%;background:#2563eb;width:0}.video-box{background:#0f1b33;color:#fff;border-radius:20px;padding:24px;text-align:center}.video-box .play{font-size:64px}.nextrow{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.nextrow button{border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer}.nextrow .next{background:#2563eb;color:#fff}@media(max-width:650px){.complete{display:block}.student-header{border-radius:14px;padding:8px}.brand-text{font-size:14px}.unit-btn{display:none}.home-btn{padding:9px 11px}.wrap{padding:10px}}
</style>
</head>
<body data-hm-grade-theme="prep-3">
<div class="wrap">
<header class="student-header" aria-label="تنقل الطالب"><a class="brand" href="index.html" aria-label="العودة إلى الصفحة الرئيسية"><span class="brand-logo">HM</span><span class="brand-text">🇫🇷 HM Academy</span></a><div class="header-actions"><a class="unit-btn" href="unit-map.html?unit=unit-1">🧭 خريطة الوحدة</a><a class="home-btn" href="index.html">⌂ الرئيسية</a></div></header>
<div class="student-note">يمكنك العودة إلى الرئيسية أو خريطة الوحدة من أي جزء من الدرس.</div>
<section class="hero"><h1>الرياضات</h1><p>Les sports · Le sport · الصف الثالث الإعدادي</p><div class="journey"><span>🚀 استكشف</span><span>🖼️ تعلم</span><span>🎧 انطق</span><span>💬 تواصل</span><span>📘 افهم</span><span>🎬 شاهد</span><span>🎮 تدرب</span><span>🏆 قيّم نفسك</span></div></section>
<nav class="nav" id="nav" aria-label="رحلة الدرس"></nav>
<section class="panel" id="panel"></section>
<section class="complete"><div><b>🏁 رحلة التعلم</b><div id="status">تقدمك محفوظ على هذا الجهاز.</div></div><button class="btn primary" onclick="finish()">إكمال الدرس</button></section>
</div>
<script>
const d={id:'g9-u1-l1',unit:'Le sport',titleFr:'Les sports',titleAr:'الرياضات',sourcePages:'16-20',vocabulary:[['le football','كرة القدم'],['le ping-pong','تنس الطاولة'],['le karaté','الكاراتيه'],['le cyclisme / le vélo','ركوب الدراجات'],['la boxe','الملاكمة'],['la natation','السباحة'],['le tennis','التنس'],['le basket-ball','كرة السلة'],['le volley-ball','الكرة الطائرة'],["l'équitation",'الفروسية'],["l'escrime",'المبارزة'],['le ski','التزلج'],['le judo','الجودو'],['le rugby','الرجبي'],['la pêche','صيد السمك'],['la voile','الإبحار'],['la gymnastique','الجمباز'],['les échecs','الشطرنج'],['la marche','المشي'],['la randonnée','التنزه']],grammar:["Faire du / de la / de l'","Pratiquer + le / la / l' / les","Jouer à + sport"],conversation:["Quel sport pratiques-tu ? — Je pratique le football.","Qu'est-ce que tu préfères ? — Je préfère le tennis.","Où pratiques-tu ton sport préféré ? — Je le pratique au club.","Tu fais du sport ? — Oui, je fais de la natation."],pronunciation:["Répéter chaque sport avec son article","Distinguer les articles le, la, l' et les à l'oral","Répéter les questions Qu'est-ce que tu pratiques ? et Où pratiques-tu ton sport préféré ?","Lire à voix haute les noms de sports puis les utiliser dans une phrase","Faire une écoute-répétition puis répondre spontanément à une question sur le sport préféré","Travailler le rythme des groupes faire du, faire de la, faire de l' et pratiquer le/la/l'/les"],visual:["Associer chaque sport à une illustration claire","Classer visuellement les sports individuels et collectifs","Identifier les sports selon les équipements et lieux représentés","Associer une image de situation à la phrase française correspondante","Créer une carte sportive interactive: sélectionner une image, choisir le sport puis produire une phrase complète","Associer visuellement chaque sport à la structure correcte: jouer à, faire de ou pratiquer"],practice:["Classer les sports selon le genre","Compléter des phrases avec le sport convenable","Associer chaque sport à jouer, faire ou pratiquer","Construire une phrase complète à partir d'une image","Choisir l'article correct devant le sport","Décrire son sport préféré en deux phrases","Corriger une erreur d'article ou de structure"],assessment:["Nommer des sports à partir d'images","Choisir le sport adapté à une situation","Prononcer correctement les noms de sports","Associer une représentation visuelle à l'expression française correcte","Produire oralement trois phrases sur un sport préféré","Choisir correctement entre jouer à, faire de et pratiquer","Répondre à une question orale sans modèle"]};
const steps=[['introduction','🚀','البداية'],['vocabulary','🖼️','المفردات'],['pronunciation','🎧','النطق'],['grammar','📘','القواعد'],['conversation','💬','المحادثة'],['video','🎬','الفيديو'],['practice','🎯','التدريب'],['games','🎮','الألعاب'],['assessment','🏆','التقييم']];
let idx=0,done=JSON.parse(localStorage.getItem('hm-g9-u1-l1-done')||'{}');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.84;speechSynthesis.speak(u)}
function go(i){idx=Math.max(0,Math.min(steps.length-1,i));render();scrollTo({top:0,behavior:'smooth'})}
function finish(){done.finished=true;localStorage.setItem('hm-g9-u1-l1-done',JSON.stringify(done));document.getElementById('status').textContent='✅ تم إكمال الدرس وحفظ التقدم على هذا الجهاز.'}
function render(){document.getElementById('nav').innerHTML=steps.map((s,i)=>`<button class="${i===idx?'active':''}" onclick="go(${i})">${s[1]} ${s[2]}</button>`).join('');const k=steps[idx][0];let h='';
if(k==='introduction')h=`<h2>🚀 ضربة البداية</h2><p>ابدأ رحلة الدرس من موضوع <b>Les sports</b> وتدرّج من المفردات إلى النطق والقواعد والمحادثة ثم الفيديو والتدريب والألعاب والتقييم.</p><div class="goal"><b>🎯 في هذا الدرس ستتعلم:</b><br>🖼️ 20 مفردة رياضية أساسية<br>🎧 النطق الصحيح وأدوات التعريف<br>📘 Faire du / de la / de l' و Pratiquer و Jouer à<br>💬 محادثة عن الرياضة المفضلة<br>🎬 مساحة الفيديو<br>🎮 تدريب وألعاب ثم تقييم نهائي</div><h3>🧭 خريطة الرحلة</h3><div class="road">${steps.slice(1).map((s,i)=>`<button onclick="go(${i+1})">${s[1]} ${i+1}. ${s[2]}</button>`).join('')}</div>`;
else if(k==='vocabulary')h=`<h2>🖼️ مفردات الدرس</h2><p>كل كلمة مرتبطة مباشرة بموضوع الرياضات، مع ترجمتها العربية وإمكانية الاستماع للنطق.</p><section class="group"><div class="group-head"><h3>🏅 Les sports</h3><p>أسماء الرياضات الواردة في بيانات الدرس الأول.</p></div><div class="cards">${d.vocabulary.map((v,i)=>`<article class="card"><div class="icon">🏅</div><div class="fr">${esc(v[0])}</div><div class="ar">${esc(v[1])}</div><button class="btn primary" onclick="speak(${JSON.stringify(v[0])})">🔊 نطق الكلمة</button></article>`).join('')}</div></section>`;
else if(k==='pronunciation')h=`<h2>🎧 النطق</h2><p>تدرّب على نطق أسماء الرياضات وأدوات التعريف ثم استخدمها داخل جمل.</p>${d.pronunciation.map((x,i)=>`<div class="practice-card"><h3>${String(i+1).padStart(2,'0')} · تدريب نطقي</h3><p dir="ltr">${esc(x)}</p><button class="btn primary" onclick="speak(${JSON.stringify(x)})">🔊 استمع</button></div>`).join('')}`;
else if(k==='grammar')h=`<h2>📘 القواعد</h2><p>افهم الفرق بين البنى الأساسية المستخدمة مع الرياضات، ثم جرّبها في جملة.</p>${d.grammar.map((x,i)=>`<div class="practice-card"><h3>${i+1}. ${esc(x)}</h3><p>${i===0?'Faire + de للتعبير عن ممارسة الرياضة.':i===1?'Pratiquer يأتي معه اسم الرياضة بأداة التعريف المناسبة.':'Jouer à يُستخدم مع الرياضات التي تأتي مع jouer à.'}</p><button class="btn secondary" onclick="speak(${JSON.stringify(x)})">🔊 نطق القاعدة</button></div>`).join('')}`;
else if(k==='conversation')h=`<h2>💬 المحادثة</h2><p>استمع إلى الحوار ثم اقرأه بصوت مرتفع وحاول الإجابة من دون نموذج.</p>${d.conversation.map((x,i)=>`<div class="dialogue"><b>${i%2?'👤 Élève':'🧑‍🏫 Dialogue'}</b><div dir="ltr">${esc(x)}</div><button class="btn primary" onclick="speak(${JSON.stringify(x)})">🔊 استمع</button></div>`).join('')}`;
else if(k==='video')h=`<div class="video-box"><div class="play">🎬</div><h2>فيديو الدرس</h2><p>مساحة الفيديو محفوظة داخل هيكل الدرس. لا يتم عرض فيديو وهمي أو رابط غير معتمد عند غياب مصدر فيديو موثوق.</p></div>`;
else if(k==='practice')h=`<h2>🎯 التدريب</h2><p>أنجز مهام التدريب السبع بالترتيب.</p>${d.practice.map((x,i)=>`<div class="practice-card"><h3>${i+1}. ${esc(x)}</h3><div class="options"><button class="option" onclick="this.classList.add('correct');this.parentElement.nextElementSibling.textContent='✓ تم تسجيل المهمة.'">أتقنت المهمة</button><button class="option" onclick="this.classList.add('selected');this.parentElement.nextElementSibling.textContent='↻ أحتاج مراجعة'">أحتاج مراجعة</button></div><div class="feedback"></div></div>`).join('')}`;
else if(k==='games')h=`<h2>🎮 الألعاب</h2><p>تحديات قصيرة تعيد استخدام مفردات الرياضات وأدوات التعريف والتراكيب الثلاثة.</p>${['اختَر الرياضة المناسبة للصورة أو الموقف.','صنّف الرياضات مع le / la / l’ / les.','اختر بين jouer à وfaire de وpratiquer.','كوّن جملة عن رياضتك المفضلة.'].map((x,i)=>`<div class="practice-card"><h3>🎮 التحدي ${i+1}</h3><p>${x}</p><button class="btn primary" onclick="this.textContent='✓ تم اجتياز التحدي'">ابدأ التحدي</button></div>`).join('')}`;
else h=`<h2>🏆 التقييم النهائي</h2><p>تحقق من قدرتك على استخدام محتوى الدرس في مواقف جديدة.</p>${d.assessment.map((x,i)=>`<div class="practice-card"><h3>${i+1}. ${esc(x)}</h3><button class="btn primary" onclick="this.textContent='✓ تم تسجيل الإجابة'">إجابة التقييم</button></div>`).join('')}<div class="goal"><b>🎉 نهاية الرحلة</b><br>بعد إتمام التقييم يمكنك العودة لأي مرحلة لإعادة المراجعة.</div>`;
document.getElementById('panel').innerHTML=h+`<div class="nextrow">${idx?`<button onclick="go(${idx-1})">→ السابق</button>`:'<span></span>'}${idx<steps.length-1?`<button class="next" onclick="go(${idx+1})">التالي ←</button>`:'<button class="next" onclick="finish()">🏁 إكمال الدرس</button>'}</div>`}
render();
</script>
</body></html>
