der-radius:18px;overflow:hidden;background:#0f1b33}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.pron-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.sound-rule{background:#f7f9fd;border-radius:13px;padding:11px;margin-top:9px;line-height:1.8}.sound-rule b{color:#173a82}.game-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:13px}.game-card{border:1px solid #dfe6f2;border-radius:18px;padding:17px;background:linear-gradient(135deg,#fff,#f7f9ff)}.game-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:12px}.game-tile{min-height:72px;border:1px solid #dbe1eb;border-radius:13px;background:#fff;font-weight:900;cursor:pointer;padding:10px}.game-tile.selected{background:#eef4ff;border-color:#2563eb}.game-tile.matched{background:#ecfdf3;border-color:#20a45a}.score{font-size:22px;font-weight:900;color:#173a82}.review-list{display:grid;gap:10px}.review-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px;border:1px solid #e1e6ef;border-radius:14px;background:#fff}.badge{display:inline-flex;padding:6px 10px;border-radius:99px;background:#eef3ff;color:#173a82;font-weight:900}.assessment-grid{display:grid;gap:12px}.assessment-card h3{margin-top:0}.result{background:#f7f9fd;border-radius:18px;padding:18px;text-align:center}.result strong{font-size:34px;color:#173a82}.progress{height:9px;background:#e8edf5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#2563eb}.complete{margin-top:14px;background:#fff;border-radius:20px;padding:17px;display:flex;justify-content:space-between;gap:12px;align-items:center}.student-note{font-size:12px;color:#718096;margin:7px 2px;text-align:right}.small{font-size:13px;color:#718096;line-height:1.8}.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}.choice{padding:13px;border:1px solid #dbe1eb;border-radius:12px;background:#fff;font-weight:900;cursor:pointer}.choice.selected{background:#eef4ff;border-color:#2563eb}.review-box{background:linear-gradient(135deg,#f7f9ff,#fff7fb);border:1px solid #dfe6f2;border-radius:18px;padding:17px}.review-answer{font-size:20px;font-weight:900;direction:ltr;text-align:center;margin:12px 0}.hidden{display:none}@media(max-width:650px){.wrap{padding:10px}.complete{display:block}.unit-btn{display:none}.dialogue-card{max-width:94%}.contrast{grid-template-columns:1fr}}

<script>
const data={id:'g9-u1-l1',title:'Les sports',ar:'الرياضات',vocab:[['le football','كرة القدم','⚽','Je joue au football.','le'],['le ping-pong','تنس الطاولة','🏓','Je joue au ping-pong.','le'],['le karaté','الكاراتيه','🥋','Je pratique le karaté.','le'],['le cyclisme / le vélo','ركوب الدراجات','🚴','Je fais du vélo.','le'],['la boxe','الملاكمة','🥊','Je pratique la boxe.','la'],['la natation','السباحة','🏊','Je fais de la natation.','la'],['le tennis','التنس','🎾','Je joue au tennis.','le'],['le basket-ball','كرة السلة','🏀','Je joue au basket-ball.','le'],['le volley-ball','الكرة الطائرة','🏐','Je joue au volley-ball.','le'],["l'équitation",'الفروسية','🏇',"Je fais de l'équitation.",'l’'],["l'escrime",'المبارزة','🤺',"Je pratique l'escrime.",'l’'],['le ski','التزلج','⛷️','Je fais du ski.','le'],['le judo','الجودو','🥋','Je pratique le judo.','le'],['le rugby','الرجبي','🏉','Je joue au rugby.','le'],['la pêche','صيد السمك','🎣','Je pratique la pêche.','la'],['la voile','الإبحار','⛵','Je fais de la voile.','la'],['la gymnastique','الجمباز','🤸','Je fais de la gymnastique.','la'],['les échecs','الشطرنج','♟️','Je joue aux échecs.','les'],['la marche','المشي','🚶','Je fais de la marche.','la'],['la randonnée','التنزه','🥾','Je fais de la randonnée.','la']],conv:[['Sara','Quel sport pratiques-tu ?','ما الرياضة التي تمارسها؟'],['Adam','Je pratique le football.','أنا أمارس كرة القدم.'],['Sara',"Qu'est-ce que tu préfères ?",'ماذا تفضل؟'],['Adam','Je préfère le tennis.','أفضل التنس.'],['Sara','Où pratiques-tu ton sport préféré ?','أين تمارس رياضتك المفضلة؟'],['Adam','Je le pratique au club.','أمارسها في النادي.'],['Sara','Tu fais du sport ?','هل تمارس الرياضة؟'],['Adam','Oui, je fais de la natation.','نعم، أمارس السباحة.']]};
const steps=[['intro','🚀','البداية'],['vocab','🖼️','المفردات'],['pron','🎧','النطق'],['grammar','📘','القواعد'],['conv','💬','المحادثة'],['video','🎬','الفيديو'],['practice','🎯','التدريب'],['games','🎮','الألعاب'],['review','🧠','المراجعة الذكية'],['assessment','🏆','التقييم'],['progress','📈','التقدم']];
let idx=0,assessmentScore=0,assessmentDone=0,reviewScore=0,reviewDone=0,matchPick=null,matchFound=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function speechSafeText(text){return String(text||'').normalize('NFC').replace(/l[’']equitation/gi,'l équitation').replace(/l[’']escrime/gi,'l escrime').replace(/[’‘]/g,"'").trim()}
function speak(text){text=String(text||'').trim();if(!text||!window.speechSynthesis||!window.SpeechSynthesisUtterance)return;const synth=window.speechSynthesis,spoken=speechSafeText(text),retry=spoken.replace(/\bl\s+(équitation|escrime)\b/gi,'$1');const play=(t,again)=>{try{synth.cancel();synth.resume()}catch(e){}const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;u.pitch=1;u.volume=1;u.onerror=()=>{if(!again&&retry!==t)setTimeout(()=>play(retry,true),100)};try{synth.speak(u)}catch(e){if(!again&&retry!==t)setTimeout(()=>play(retry,true),100)}};play(spoken,false)}
function go(n){idx=Math.max(0,Math.min(steps.length-1,n));render();scrollTo({top:0,behavior:'smooth'})}
function finish(){localStorage.setItem('hm-g9-u1-l1-finished','1');document.getElementById('status').textContent='✅ تم إكمال الدرس وحفظ التقدم.'}
function mcq(btn,ok){const c=btn.closest('.task');if(c.dataset.done)return;c.dataset.done='1';c.querySelectorAll('.option').forEach(x=>x.disabled=true);btn.classList.add(ok?'correct':'wrong');c.querySelector('.feedback').textContent=ok?'✅ صحيح!':'❌ ليست الإجابة الصحيحة. راجع الفكرة وحاول في المراجعة.'}
function reviewQuestion(btn,ok){const c=btn.closest('.review-box');if(c.dataset.done)return;c.dataset.done='1';reviewDone++;if(ok)reviewScore++;c.querySelectorAll('.choice').forEach(x=>x.disabled=true);btn.classList.add(ok?'correct':'wrong');c.querySelector('.feedback').textContent=ok?'✅ إجابة صحيحة.':'❌ راجع المثال ثم انتقل للسؤال التالي.';document.getElementById('reviewScore').textContent=`${reviewScore} / ${reviewDone}`}
function assess(btn,ok){const c=btn.closest('.assessment-card');if(c.dataset.done)return;c.dataset.done='1';assessmentDone++;if(ok)assessmentScore++;c.querySelectorAll('.option').forEach(x=>x.disabled=true);btn.classList.add(ok?'correct':'wrong');c.querySelector('.feedback').textContent=ok?'✅ إجابة صحيحة.':'❌ ليست الإجابة الصحيحة.';document.getElementById('assessmentScore').textContent=`${assessmentScore} / ${assessmentDone}`;document.getElementById('assessmentBar').style.width=(assessmentDone/10*100)+'%';if(assessmentDone===10)document.getElementById('assessmentResult').innerHTML=`<div class="result"><div>النتيجة النهائية</div><strong>${assessmentScore} / 10</strong><p>${assessmentScore>=8?'ممتاز! أتقنت أساسيات الدرس.':assessmentScore>=6?'جيد جدًا، تحتاج إلى مراجعة بسيطة لبعض النقاط.':'ارجع إلى القواعد والمفردات ثم أعد التقييم.'}</p></div>`}
function match(btn,type,value){if(btn.classList.contains('matched'))return;if(!matchPick){matchPick={btn,type,value};btn.classList.add('selected');return}if(matchPick.type!==type&&matchPick.value===value){btn.classList.add('matched');matchPick.btn.classList.remove('selected');matchPick.btn.classList.add('matched');matchFound++;document.getElementById('matchScore').textContent=`${matchFound} / 4`;matchPick=null}else{matchPick.btn.classList.remove('selected');btn.classList.add('selected');matchPick={btn,type,value}}}
function render(){document.getElementById('nav').innerHTML=steps.map((s,i)=>`<button class="${i===idx?'active':''}" onclick="go(${i})">${s[1]} ${s[2]}</button>`).join('');let h='',v=data.vocab;
if(idx===0)h=`<h2>🚀 ضربة البداية</h2><p>في هذا الدرس سنكتشف أسماء الرياضات أولًا، ثم نتعلم كيف نستخدم معها أدوات التعريف، وبعد ذلك نسمع ونقرأ ونطبق في مواقف حقيقية.</p><div class="note"><b>🎯 هدف الدرس</b><br>أن تتعرف على أسماء الرياضات، وتختار أداة التعريف المناسبة: <b>le / la / l' / les</b>، ثم تستخدمها في جمل بسيطة.</div>`;
if(idx===1)h=`<h2>🖼️ المفردات</h2><p>تعلم الكلمة مع معناها ومثالها، ويمكنك الاستماع إلى الكلمة أو المثال من نفس البطاقة.</p><div class="cards">${v.map(x=>`<article class="card"><div class="sport-art">${x[2]}</div><div class="fr">${esc(x[0])}</div><div class="ar">${esc(x[1])}</div><div class="example">${esc(x[3])}</div><button class="btn primary" onclick='speak(${JSON.stringify(x[0])})'>🔊 نطق الكلمة</button><button class="btn secondary" onclick='speak(${JSON.stringify(x[3])})'>▶ نطق المثال</button></article>`).join('')}</div>`;
if(idx===2){const notes={'le football':'le: e في football تُنطق مثل «أُ/و» خفيفة، و ll لا تُنطق كحرفين منفصلين.','le ping-pong':'ping: in صوت أنفي؛ و pong: on صوت أنفي.','le karaté':'é في النهاية صوت /e/ واضح مثل «إيه».','le cyclisme / le vélo':'cy في cyclisme تبدأ بصوت /si/؛ و é في vélo صوت /e/.','la boxe':'x في boxe تُنطق /ks/؛ و e النهائية لا تُنطق.','la natation':'tion في النهاية تُنطق تقريبًا /sjɔ̃/، و a الأخيرة ليست صوتًا مستقلًا.','le tennis':'e الأولى قصيرة؛ و s بين الحركتين تُنطق /s/ هنا.','le basket-ball':'a واضحة، و t النهائية في basket تُسمع.','le volley-ball':'y تعطي صوتًا قريبًا من /j/، و ball تُنطق في المقطع الأخير.','l\'équitation':'é في équitation صوت /e/، و qu تُنطق /k/؛ لا نقرأ الحروف منفصلة.','l\'escrime':'es في البداية تُنطق /ɛs/، و cr تُنطق /kʁ/؛ e النهائية لا تُنطق.','le ski':'sk تُنطق متتابعة /sk/، و i صوت /i/.','le judo':'j تُنطق /ʒ/ مثل ج الفرنسية، و o النهائية واضحة.','le rugby':'r فرنسية /ʁ/، و u في المقطع الأول ليست مثل u العربية.','la pêche':'ê تُنطق /ɛ/، و ch تُنطق /ʃ/ مثل «ش».','la voile':'oi تُنطق /wa/ تقريبًا، و e النهائية لا تُنطق.','la gymnastique':'gy تُنطق /ʒi/، و que في النهاية /k/.','les échecs':'ch تُنطق /ʃ/، و s النهائية في échecs لا تُنطق.','la marche':'ch تُنطق /ʃ/، و e النهائية لا تُنطق.','la randonnée':'an و on أصوات أنفية؛ و é في البداية صوت /e/.',};h=`<h2>🎧 النطق</h2><p>هنا لا نكرر صفحة المفردات؛ نركز على <b>كيف ننطق الكلمة</b> وما الصوت الذي يجب أن ينتبه إليه الطالب.</p><div class="pron-grid">${v.map(x=>`<article class="pron-card"><div class="fr">${esc(x[0])}</div><div class="ar">${esc(x[1])}</div><div class="sound-rule"><b>💡 ملاحظة النطق:</b><br>${esc(notes[x[0]]||'انتبه إلى المقاطع والحروف الأخيرة، واقرأ الكلمة كوحدة صوتية واحدة.')}</div><button class="btn primary" onclick='speak(${JSON.stringify(x[0])})'>🔊 استمع للكلمة</button></article>`).join('')}</div>`}
if(idx===3)h=`<h2>📘 القاعدة: أدوات التعريف مع أسماء الرياضات</h2><p>في هذا الدرس نركز على <b>أسماء الرياضات</b>، ولذلك نتعلم كيف نضع أداة التعريف المناسبة قبل اسم الرياضة.</p><div class="grammar-grid"><div class="formula"><b>le</b><p>مع الاسم المذكر المفرد:</p><strong>le football · le tennis · le judo</strong></div><div class="formula"><b>la</b><p>مع الاسم المؤنث المفرد:</p><strong>la natation · la boxe · la voile</strong></div><div class="formula"><b>l'</b><p>قبل اسم مفرد يبدأ بحرف متحرك:</p><strong>l'équitation · l'escrime</strong></div><div class="formula"><b>les</b><p>مع الاسم الجمع:</p><strong>les échecs</strong></div></div><div class="contrast"><div class="yes"><b>✅ نستخدم أداة التعريف</b><br>Je pratique <b>le</b> football.<br>Je fais de <b>la</b> natation.<br>Je pratique <b>l'</b>escrime.</div><div class="no"><b>❌ ليست هذه قاعدة الدرس</b><br>لا نبدأ هنا بشرح <b>un / une / des</b>؛ لأنها أدوات نكرة، بينما هدفنا الآن هو استعمال أسماء الرياضات كأسماء محددة في التعبير الفرنسي.</div></div><div class="note" style="margin-top:14px"><b>⭐ تذكّر:</b> أداة التعريف لا تُختار عشوائيًا؛ ننظر إلى جنس الاسم وعدده، ومع المفرد الذي يبدأ بحرف متحرك نستخدم <b>l'</b>.</div>`;

if(idx===5)h=`<h2>🎬 شاهد وتعلّم</h2><p>شاهد الفيديو ثم حاول التعرف على الرياضات التي سمعتها، وبعدها انتقل للتدريب.</p><div class="video"><iframe src="https://www.youtube.com/embed/pnmoexHphZ0" title="Apprendre les sports en français" allowfullscreen></iframe></div>`;
