<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | الصف الثالث الإعدادي — Les sports</title><link rel="stylesheet" href="css/hm-academy-grade-themes.css?v=20260911"><style>body{margin:0;background:#f5f7fb;color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:1120px;margin:auto;padding:12px}.student-header{display:flex;justify-content:space-between;align-items:center;background:#0f1b33;color:#fff;padding:12px 14px;border-radius:18px;margin-bottom:12px}.brand{color:#fff;text-decoration:none;font-weight:900}.home-btn{background:#2563eb;color:#fff;text-decoration:none;padding:10px 13px;border-radius:12px;font-weight:900}.hero{background:linear-gradient(135deg,#5b4bdb,#e3aa4d);color:#fff;border-radius:28px;padding:24px;margin-bottom:12px}.hero h1{margin:0;font-size:40px}.hero p{font-weight:800}.journey,.nav{display:flex;gap:8px;overflow:auto}.journey span,.nav button{white-space:nowrap;border-radius:999px;padding:9px 13px;border:1px solid #ffffff55;background:#ffffff22;color:#fff;font-weight:900}.nav{background:#fff;padding:9px;border-radius:18px;margin:12px 0}.nav button{border:0;background:#eef3ff;color:#173a82;border-radius:12px;cursor:pointer}.nav button.active{background:#5b4bdb;color:#fff}.panel{background:#fff;border-radius:22px;padding:18px;min-height:280px;box-shadow:0 8px 25px #17223b12}.cards,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card,.box{border:1px solid #e1e6ef;border-radius:17px;padding:15px;background:#fff}.sport{font-size:55px;text-align:center;background:#f4f7ff;border-radius:14px;padding:8px}.fr{font-size:19px;font-weight:900;direction:ltr;text-align:center}.ar{text-align:center;color:#315aa4;font-weight:800}.example{direction:ltr;text-align:center;background:#f7f9fd;padding:9px;border-radius:10px;margin-top:8px}.btn,.choice{border:0;border-radius:11px;padding:10px 13px;font-weight:900;cursor:pointer}.btn{background:#2563eb;color:#fff}.choice{background:#fff;border:1px solid #dbe1eb}.choice.correct{background:#ecfdf3;border-color:#20a45a}.choice.wrong{background:#fff2f8;border-color:#e92d83}.feedback{font-weight:900;min-height:24px;margin-top:9px}.dialogue{padding:14px;border-radius:18px;background:#f7f9ff;margin:9px 0}.ltr{direction:ltr;text-align:left;font-weight:900}.note{background:#fffaf0;border:1px solid #f2d58b;border-radius:14px;padding:13px;line-height:1.8}.complete{margin-top:12px;background:#fff;border-radius:20px;padding:16px;display:flex;justify-content:space-between;align-items:center}.small{color:#718096;line-height:1.8}@media(max-width:650px){.hero h1{font-size:32px}.complete{display:block}}</style></head><body><div class="wrap"><header class="student-header"><a class="brand" href="index.html">🇫🇷 HM Academy</a><a class="home-btn" href="index.html">⌂ الرئيسية</a></header><div class="small">هذا الدرس مستقل عن باقي الدروس، وتقدمك محفوظ على هذا الجهاز.</div><section class="hero"><h1>الرياضات</h1><p>Les sports · Le sport · الصف الثالث الإعدادي · الوحدة الأولى</p><div class="journey"><span>🚀 استكشف</span><span>🖼️ تعلم</span><span>🎧 انطق</span><span>📘 افهم</span><span>💬 تواصل</span><span>🎯 تدرب</span><span>🧠 راجع</span><span>🏆 قيّم</span></div></section><nav class="nav" id="nav"></nav><section class="panel" id="panel"></section><section class="complete"><div><b>🏁 رحلة التعلم</b><div id="status">تقدمك محفوظ على هذا الجهاز.</div></div><button class="btn" id="finish">إكمال الدرس</button></section></div><script>(function(){'use strict';const nav=document.getElementById('nav');const panel=document.getElementById('panel');const vocab=[['le football','كرة القدم','⚽','Je joue au football.'],['le ping-pong','تنس الطاولة','🏓','Je joue au ping-pong.'],['le karaté','الكاراتيه','🥋','Je pratique le karaté.'],['le cyclisme / le vélo','ركوب الدراجات','🚴','Je fais du vélo.'],['la boxe','الملاكمة','🥊','Je pratique la boxe.'],['la natation','السباحة','🏊','Je fais de la natation.'],['le tennis','التنس','🎾','Je joue au tennis.'],['le basket-ball','كرة السلة','🏀','Je joue au basket-ball.'],['le volley-ball','الكرة الطائرة','🏐','Je joue au volley-ball.'],["l'équitation",'الفروسية','🏇',"Je fais de l'équitation."],["l'escrime",'المبارزة','🤺',"Je pratique l'escrime."],['le ski','التزلج','⛷️','Je fais du ski.'],['le judo','الجودو','🥋','Je pratique le judo.'],['le rugby','الرجبي','🏉','Je joue au rugby.'],['la pêche','صيد السمك','🎣','Je pratique la pêche.'],['la voile','الإبحار','⛵','Je fais de la voile.'],['la gymnastique','الجمباز','🤸','Je fais de la gymnastique.'],['les échecs','الشطرنج','♟️','Je joue aux échecs.'],['la marche','المشي','🚶','Je fais de la marche.'],['la randonnée','التنزه','🥾','Je fais de la randonnée.']];const conv=[['Sara','Quel sport pratiques-tu ?','ما الرياضة التي تمارسها؟'],['Adam','Je pratique le football.','أنا أمارس كرة القدم.'],['Sara',"Qu'est-ce que tu préfères ?",'ماذا تفضل؟'],['Adam','Je préfère le tennis.','أفضل التنس.'],['Sara','Où pratiques-tu ton sport préféré ?','أين تمارس رياضتك المفضلة؟'],['Adam','Je le pratique au club.','أمارسها في النادي.']];const steps=[['intro','🚀 البداية'],['vocab','🖼️ المفردات'],['pron','🎧 النطق'],['grammar','📘 القواعد'],['conv','💬 المحادثة'],['video','🎬 الفيديو'],['practice','🎯 التدريب'],['games','🎮 الألعاب'],['review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['files','📁 ملفات الدرس'],['progress','📈 التقدم']];let idx=0;function speechText(t){t=String(t||'');if(/^l[’']équitation$/i.test(t))return 'léquitation';if(/^l[’']escrime$/i.test(t))return 'lescrime';if(/^Qu'est-ce que tu préfères \?$/i.test(t))return 'Quest-ce que tu preferes ?';if(/^Où pratiques-tu ton sport préféré \?$/i.test(t))return 'Ou pratiques-tu ton sport prefere ?';return t}window.speak=function(t){if(!speechSynthesis)return;const u=new SpeechSynthesisUtterance(speechText(t));u.lang='fr-FR';u.rate=.78;speechSynthesis.cancel();speechSynthesis.speak(u)};window.go=function(i){idx=i;render();window.scrollTo(0,0)};function renderNav(){nav.innerHTML=steps.map((s,i)=>'<button class="'+(i===idx?'active':'')+'" data-i="'+i+'">'+s[1]+'</button>').join('');nav.querySelectorAll('button').forEach(b=>b.onclick=function(){go(Number(b.dataset.i))})}function review(q,choices,answer){panel.innerHTML='<h2>🧠 المراجعة الذكية</h2><div class="box"><b>'+q+'</b><div class="grid" style="margin-top:12px">'+choices.map(c=>'<button class="choice" data-a="'+(c===answer)+'">'+c+'</button>').join('')+'</div><div class="feedback" id="fb"></div></div>';panel.querySelectorAll('.choice').forEach(b=>b.onclick=function(){panel.querySelectorAll('.choice').forEach(x=>x.disabled=true);const ok=b.dataset.a==='true';b.classList.add(ok?'correct':'wrong');if(!ok)panel.querySelector('[data-a="true"]').classList.add('correct');document.getElementById('fb').textContent=ok?'✅ إجابة صحيحة!':'❌ إجابة غير صحيحة. راجع القاعدة ثم انتقل للسؤال التالي.'})}function render(){renderNav();if(idx===0){panel.innerHTML='<h2>🚀 ابدأ من الملاحظة</h2><div class="note">في هذا الدرس ستتعلم أسماء الرياضات، طرق التعبير عن ممارسة الرياضة، والسؤال عن الرياضة المفضلة.</div>'}else if(idx===1){panel.innerHTML='<h2>🖼️ المفردات</h2><div class="cards">'+vocab.map(x=>'<article class="card"><div class="sport">'+x[2]+'</div><div class="fr">'+x[0]+'</div><div class="ar">'+x[1]+'</div><div class="example">'+x[3]+'</div><button class="btn" onclick="speak('+JSON.stringify(x[0])+')">🔊 نطق الكلمة</button><button class="btn" onclick="speak('+JSON.stringify(x[3])+')">🔊 نطق المثال</button></article>').join('')+'</div>'}else if(idx===2){panel.innerHTML='<h2>🎧 النطق</h2><div class="cards">'+vocab.map(x=>'<article class="card"><div class="fr">'+x[0]+'</div><p class="ar">'+x[1]+'</p><button class="btn" onclick="speak('+JSON.stringify(x[0])+')">🔊 اسمع الكلمة</button><div class="note">استمع أكثر من مرة وركز على الأصوات الأنفية والنهايات غير المنطوقة.</div></article>').join('')+'</div>'}else if(idx===3){panel.innerHTML='<h2>📘 القواعد</h2><div class="grid"><div class="box"><h3>Jouer</h3><p class="ltr">jouer au + sport masculin</p><p class="ltr">jouer à la + sport féminin</p><p class="ltr">jouer aux + pluriel</p></div><div class="box"><h3>Faire / Pratiquer</h3><p class="ltr">faire du / de la</p><p class="ltr">pratiquer le / la</p></div></div><div class="note">مثال: Je joue au football. · Je fais de la natation. · Je pratique l'escrime.</div>'}else if(idx===4){panel.innerHTML='<h2>💬 المحادثة</h2><div>'+conv.map(x=>'<div class="dialogue"><b>'+x[0]+'</b><div class="ltr">'+x[1]+'</div><div>'+x[2]+'</div><button class="btn" onclick="speak('+JSON.stringify(x[1])+')">🔊 نطق</button></div>').join('')+'</div>'}else if(idx===5){panel.innerHTML='<h2>🎬 الفيديو</h2><div class="note">راجع مفردات الرياضات والقواعد قبل الانتقال إلى التدريب.</div>'}else if(idx===6){review('اختر الجملة الصحيحة للتعبير عن ممارسة السباحة',['Je joue de la natation.','Je fais de la natation.','Je pratique au natation.'],'Je fais de la natation.')}else if(idx===7){panel.innerHTML='<h2>🎮 الألعاب</h2><div class="note">🎯 تحدَّ نفسك: اختر أي 5 رياضات من المفردات وقل جملة فرنسية صحيحة لكل واحدة.</div>'}else if(idx===8){review('كيف تقول: «ماذا تفضل؟»',['Quel sport pratiques-tu ?','Qu’est-ce que tu préfères ?','Où pratiques-tu ton sport préféré ?'],'Qu’est-ce que tu préfères ?')}else if(idx===9){review('اختر التعبير الصحيح: أنا أمارس كرة القدم.',['Je pratique le football.','Je fais au football.','Je joue de football.'],'Je pratique le football.')}else if(idx===10){panel.innerHTML='<h2>📁 ملفات الدرس</h2><div class="grid"><div class="box">📄 ملخص المفردات</div><div class="box">📘 ملخص القواعد</div><div class="box">💬 نص المحادثة</div></div>'}else{panel.innerHTML='<h2>📈 تقدمك</h2><div class="result"><strong>الدرس جاهز للمراجعة والتقييم</strong><p>أكمل الأقسام السابقة ثم اضغط «إكمال الدرس».</p></div>'}}document.getElementById('finish').onclick=function(){localStorage.setItem('hm_grade9_u1_l1_done','1');document.getElementById('status').textContent='✅ تم تسجيل إكمال الدرس على هذا الجهاز.'};render()})();</script></body></html>
