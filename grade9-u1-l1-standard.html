<style>
body{margin:0;background:#f5f7fb;color:#17223b;font-family:Arial,"Cairo",sans-serif}.wrap{max-width:1120px;margin:auto;padding:16px}.student-header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0f1b33;color:#fff;padding:10px 12px;border-radius:18px;margin-bottom:14px;box-shadow:0 8px 22px #0f1b3325}.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:#fff;font-weight:900}.brand-logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#e92d83);font-weight:1000}.header-actions{display:flex;gap:7px}.home-btn,.unit-btn{display:inline-flex;align-items:center;text-decoration:none;border-radius:12px;padding:10px 12px;font-weight:900;white-space:nowrap}.home-btn{background:#2563eb;color:#fff}.unit-btn{background:#eef3ff;color:#173a82}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff;border-radius:28px;padding:24px}.hero h1{margin:0;font-size:clamp(28px,6vw,42px)}.hero p{line-height:1.8}.journey,.nav{display:flex;gap:7px;overflow:auto}.journey{margin-top:15px}.journey span{background:#ffffff22;border:1px solid #ffffff44;border-radius:999px;padding:8px 12px;white-space:nowrap;font-weight:800}.nav{background:#fff;padding:8px;border-radius:18px;margin:14px 0}.nav button{border:0;background:#eef3ff;color:#173a82;border-radius:12px;padding:10px 13px;font-weight:900;white-space:nowrap;cursor:pointer}.nav button.active{background:#e92d83;color:#fff}.panel{background:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 30px #14264a12}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px}.card,.task,.pron-card,.assessment-card,.game-card,.file-card{border:1px solid #e1e6ef;border-radius:18px;padding:16px;background:#fff}.sport-art{height:100px;border-radius:15px;background:#f4f7ff;display:grid;place-items:center;font-size:62px;margin-bottom:10px}.fr{font-weight:900;direction:ltr;text-align:center;font-size:20px}.ar{text-align:center;color:#315aa4;font-weight:800}.example{background:#f7f9fd;border-radius:12px;padding:10px;margin-top:8px;direction:ltr;text-align:center;line-height:1.6}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;margin:5px 3px 0 0}.primary{background:#2563eb;color:#fff}.secondary{background:#edf3ff;color:#173a82}.options,.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}.option,.choice{padding:12px;border:1px solid #dbe1eb;border-radius:11px;background:#fff;font-weight:800;cursor:pointer}.option:disabled,.choice:disabled{cursor:default}.option.correct,.choice.correct{border-color:#20a45a;background:#ecfdf3}.option.wrong,.choice.wrong{border-color:#e92d83;background:#fff2f8}.feedback{min-height:24px;font-weight:800;margin-top:10px}.note{background:#fffaf0;border:1px solid #f2d58b;border-radius:15px;padding:13px;line-height:1.9}.grammar-grid,.pron-grid,.game-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.formula{background:#f7f9fd;border-radius:16px;padding:16px;border:1px solid #e2e8f0}.formula b{display:block;color:#173a82;font-size:20px;direction:ltr}.dialogue-wrap{background:linear-gradient(135deg,#f5f8ff,#fff7fb);border:1px solid #dfe6f2;border-radius:22px;padding:18px}.dialogue-card{border:1px solid #e1e6ef;border-radius:18px;padding:14px;margin:10px 0;max-width:78%;box-shadow:0 5px 18px #14264a0c;background:#fff}.dialogue-card.sara{margin-left:auto;border-right:4px solid #2563eb}.dialogue-card.adam{margin-right:auto;border-left:4px solid #e92d83}.speaker{font-weight:900;color:#173a82}.line-fr{direction:ltr;text-align:left;font-size:18px;font-weight:900;margin-top:5px}.line-ar{color:#66738a;margin-top:6px;line-height:1.7}.video{position:relative;padding-top:56.25%;border-radius:18px;overflow:hidden;background:#0f1b33}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.game-card{background:linear-gradient(135deg,#fff,#f7f9ff)}.game-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:12px}.game-tile{min-height:64px;border:1px solid #dbe1eb;border-radius:13px;background:#fff;font-weight:900;cursor:pointer;padding:10px}.game-tile.selected{background:#eef4ff;border-color:#2563eb}.game-tile.matched{background:#ecfdf3;border-color:#20a45a}.score{font-size:22px;font-weight:900;color:#173a82}.review-list{display:grid;gap:10px}.review-box{background:linear-gradient(135deg,#f7f9ff,#fff7fb);border:1px solid #dfe6f2;border-radius:18px;padding:17px}.assessment-grid{display:grid;gap:12px}.assessment-card h3{margin-top:0}.result{background:#f7f9fd;border-radius:18px;padding:18px;text-align:center}.result strong{font-size:34px;color:#173a82}.progress{height:9px;background:#e8edf5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#2563eb}.file-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.file-card{display:block;text-decoration:none;color:#17223b;background:linear-gradient(135deg,#fff,#f7f9ff)}.file-card span{display:block;font-size:30px;margin-bottom:8px}.file-card small{display:block;color:#66738a;font-weight:700;margin-top:5px;line-height:1.6}.complete{margin-top:14px;background:#fff;border-radius:20px;padding:17px;display:flex;justify-content:space-between;gap:12px;align-items:center}.student-note{font-size:12px;color:#718096;margin:7px 2px;text-align:right}.small{font-size:13px;color:#718096;line-height:1.8}@media(max-width:650px){.wrap{padding:10px}.complete{display:block}.unit-btn{display:none}.dialogue-card{max-width:94%}}

<body data-hm-grade-theme="prep-3">
<div class="wrap">
<header class="student-header"><a class="brand" href="index.html"><span class="brand-logo">HM</span><span>🇫🇷 HM Academy</span></a><div class="header-actions"><a class="unit-btn" href="unit-map.html?unit=unit-1">🧭 خريطة الوحدة</a><a class="home-btn" href="index.html">⌂ الرئيسية</a></div></header>
<div class="student-note">درس الصف الثالث الإعدادي · الوحدة الأولى · Les sports</div>
<section class="hero"><h1>الرياضات</h1><p>Les sports · Le sport · الصف الثالث الإعدادي · الوحدة الأولى</p><div class="journey"><span>🚀 استكشف</span><span>🖼️ تعلم</span><span>🎧 انطق</span><span>📘 افهم</span><span>💬 تواصل</span><span>🎬 شاهد</span><span>🎯 تدرب</span><span>🎮 العب</span><span>🧠 راجع</span><span>🏆 قيّم</span><span>📁 ملفات</span><span>📈 تقدم</span></div></section>
<nav class="nav" id="nav"></nav><section class="panel" id="panel"></section>
<section class="complete"><div><b>🏁 رحلة التعلم</b><div id="status">تقدمك محفوظ على هذا الجهاز.</div></div><button class="btn primary" id="finishBtn">إكمال الدرس</button></section>
</div>
<script>
const data={
 vocab:[['le football','كرة القدم','⚽','Je joue au football.','le'],['le ping-pong','تنس الطاولة','🏓','Je joue au ping-pong.','le'],['le karaté','الكاراتيه','🥋','Je pratique le karaté.','le'],['le cyclisme / le vélo','ركوب الدراجات','🚴','Je fais du vélo.','le'],['la boxe','الملاكمة','🥊','Je pratique la boxe.','la'],['la natation','السباحة','🏊','Je fais de la natation.','la'],['le tennis','التنس','🎾','Je joue au tennis.','le'],['le basket-ball','كرة السلة','🏀','Je joue au basket-ball.','le'],['le volley-ball','الكرة الطائرة','🏐','Je joue au volley-ball.','le'],["l'équitation",'الفروسية','🏇',"Je fais de l'équitation.",'l’'],["l'escrime",'المبارزة','🤺',"Je pratique l'escrime.",'l’'],['le ski','التزلج','⛷️','Je fais du ski.','le'],['le judo','الجودو','🥋','Je pratique le judo.','le'],['le rugby','الرجبي','🏉','Je joue au rugby.','le'],['la pêche','صيد السمك','🎣','Je pratique la pêche.','la'],['la voile','الإبحار','⛵','Je fais de la voile.','la'],['la gymnastique','الجمباز','🤸','Je fais de la gymnastique.','la'],['les échecs','الشطرنج','♟️','Je joue aux échecs.','les'],['la marche','المشي','🚶','Je fais de la marche.','la'],['la randonnée','التنزه','🥾','Je fais de la randonnée.','la']],
 conv:[['Sara','Quel sport pratiques-tu ?','ما الرياضة التي تمارسها؟'],['Adam','Je pratique le football.','أنا أمارس كرة القدم.'],['Sara',"Qu'est-ce que tu préfères ?",'ماذا تفضل؟'],['Adam','Je préfère le tennis.','أفضل التنس.'],['Sara','Où pratiques-tu ton sport préféré ?','أين تمارس رياضتك المفضلة؟'],['Adam','Je le pratique au club.','أمارسها في النادي.'],['Sara','Tu fais du sport ?','هل تمارس الرياضة؟'],['Adam','Oui, je fais de la natation.','نعم، أمارس السباحة.']]
};
const steps=[['intro','🚀','البداية'],['vocab','🖼️','المفردات'],['pron','🎧','النطق'],['grammar','📘','القواعد'],['conv','💬','المحادثة'],['video','🎬','الفيديو'],['practice','🎯','التدريب'],['games','🎮','الألعاب'],['review','🧠','المراجعة الذكية'],['assessment','🏆','التقييم'],['files','📁','ملفات الدرس'],['progress','📈','التقدم']];
let idx=0,matchPick=null,matchFound=0,assessmentScore=0,assessmentDone=0,reviewScore=0,reviewDone=0,finished=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normalizeSpeech(s){return String(s||'').normalize('NFC').replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim()}
function speechVariants(text){let s=normalizeSpeech(text),a=[s];const add=x=>{x=normalizeSpeech(x);if(x&&!a.includes(x))a.push(x)};if(/l'equitation|l'équitation/i.test(s)){add("l' équitation");add('équitation')}if(/l'escrime/i.test(s)){add("l' escrime");add('escrime')}if(/qu'est-ce/i.test(s)){add('quest-ce que tu preferes')}if(/où pratiques-tu ton sport préféré/i.test(s)){add('Ou pratiques-tu ton sport prefere')}return a}
function getFrenchVoice(){if(!('speechSynthesis'in window))return null;const vs=window.speechSynthesis.getVoices();return vs.find(v=>/^fr[-_]FR$/i.test(v.lang))||vs.find(v=>/^fr[-_]/i.test(v.lang))||null}
function speak(text){const variants=speechVariants(text);if(!('speechSynthesis'in window)||typeof SpeechSynthesisUtterance==='undefined')return;const synth=window.speechSynthesis;let n=0;const run=()=>{if(n>=variants.length)return;const t=variants[n++];try{synth.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;u.pitch=1;u.volume=1;const v=getFrenchVoice();if(v)u.voice=v;u.onerror=()=>setTimeout(run,180);synth.resume();synth.speak(u)}catch(e){setTimeout(run,180)}};if(synth.onvoiceschanged!==undefined){try{synth.getVoices()}catch(e){}}run()}
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
function setStep(i){idx=i;renderNav();render()}
function renderNav(){nav.innerHTML=steps.map((s,i)=>`<button class="${i===idx?'active':''}" data-step="${i}">${s[1]} ${s[2]}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>setStep(Number(b.dataset.step)))}
function intro(){return `<h2>🚀 ضربة البداية</h2><p>في هذا الدرس ستتعلم أسماء الرياضات، أدوات التعريف المرتبطة بها، واستعمال <b>faire</b> و<b>pratiquer</b> و<b>jouer à</b> في مواقف حقيقية.</p><div class="note"><b>🎯 هدف الدرس:</b> أن تستطيع تسمية الرياضات، اختيار الأداة المناسبة، ثم تكوين جمل صحيحة عنها.</div>`}
function vocab(){return `<h2>🖼️ المفردات</h2><p>استمع إلى الكلمة أو إلى المثال من نفس البطاقة.</p><div class="cards">${data.vocab.map((v,i)=>`<article class="card"><div class="sport-art">${v[2]}</div><div class="fr">${esc(v[0])}</div><div class="ar">${esc(v[1])}</div><div class="example">${esc(v[3])}</div><button class="btn primary speak-word" data-text="${esc(v[0])}">🔊 نطق الكلمة</button><button class="btn secondary speak-example" data-text="${esc(v[3])}">▶ نطق المثال</button></article>`).join('')}</div>`}
function pron(){const notes={"l'équitation":'تبدأ بأداة l’ لأن الكلمة تبدأ بحرف متحرك؛ لا تنطق l منفصلة عن الكلمة.',"l'escrime":'تبدأ بأداة l’ لأن الكلمة تبدأ بحرف متحرك، والنطق يكون متصلًا.',"les échecs":'انتبه إلى s في les، ثم انطق échecs بوضوح.',"la natation":'حافظ على نطق المقطع الأخير -tion بوضوح.'};return `<h2>🎧 النطق</h2><p>تدرب على النطق من الكلمة نفسها. أمثلة الجمل الصوتية موجودة في صفحة المفردات.</p><div class="pron-grid">${data.vocab.map(v=>`<article class="pron-card"><div class="fr">${esc(v[0])}</div><div class="ar">${esc(v[1])}</div><div class="sound-rule"><b>💡 ملاحظة:</b> ${esc(notes[v[0]]||'انطق أداة التعريف مع اسم الرياضة كوحدة واحدة.')}</div><button class="btn primary speak-word" data-text="${esc(v[0])}">🔊 استمع للكلمة</button></article>`).join('')}</div>`}
function grammar(){return `<h2>📘 القواعد</h2><div class="grammar-grid"><div class="formula"><b>faire du + masculin</b><p>Je fais du ski.</p></div><div class="formula"><b>faire de la + féminin</b><p>Je fais de la natation.</p></div><div class="formula"><b>faire de l' + voyelle</b><p>Je fais de l'équitation.</p></div><div class="formula"><b>pratiquer + article</b><p>Je pratique le karaté.<br>Je pratique l'escrime.</p></div><div class="formula"><b>jouer à + sport</b><p>Je joue au football.<br>Je joue aux échecs.</p></div></div><div class="note" style="margin-top:14px"><b>💡 تذكّر:</b> بعد jouer à تتغير à + le إلى <b>au</b>، وà + les إلى <b>aux</b>.</div>`}
function conv(){return `<h2>💬 المحادثة</h2><p>استمع لكل سطر منفردًا، ثم حاول الإجابة قبل الانتقال للسطر التالي.</p><div class="dialogue-wrap">${data.conv.map(x=>`<article class="dialogue-card ${x[0].toLowerCase()}"><div class="speaker">${x[0]}</div><div class="line-fr">${esc(x[1])}</div><div class="line-ar">${esc(x[2])}</div><button class="btn primary speak-line" data-text="${esc(x[1])}">🔊 استمع</button></article>`).join('')}</div>`}
function video(){return `<h2>🎬 فيديو الدرس</h2><p>شاهد ثم حاول تكرار أسماء الرياضات التي تسمعها.</p><div class="video"><iframe src="https://www.youtube.com/embed/pnmoexHphZ0" title="Apprendre les sports en français" allowfullscreen></iframe></div>`}
const practiceQ=[
['أكمل الجملة: ___ boxe.',['la','le','l’','les'],0],
['اختر الجملة الصحيحة.',['Je joue au tennis.','Je fais au tennis.','Je pratique au tennis.','Je joue de tennis.'],0],
['أكمل الجملة: ___ escrime.',['la','l’','le','les'],1],
['أي جملة تستعمل أداة جمع صحيحة؟',['Je pratique les échecs.','Je pratique le échecs.','Je fais de la échecs.','Je joue à le échecs.'],0],
['اختر الجملة الصحيحة.',['Je fais de la natation.','Je fais du natation.','Je joue de la natation.','Je pratique au natation.'],0],
['أكمل الجملة: ___ voile.',['le','l’','la','les'],2]
];
function optionTask(q,i,prefix){return `<article class="task" data-q="${prefix}${i}" data-answer="${q[2]}"><b>${i+1}. ${q[0]}</b><div class="options">${q[1].map((o,j)=>`<button class="option" data-index="${j}">${esc(o)}</button>`).join('')}</div><div class="feedback"></div></article>`}
function practice(){return `<h2>🎯 التدريب</h2><p>اختر الإجابة التي تكمل المعنى أو البنية الفرنسية بشكل صحيح. لن يظهر لك السؤال نفسه الإجابة.</p><div class="assessment-grid">${practiceQ.map((q,i)=>optionTask(q,i,'p')).join('')}</div>`}
function games(){return `<h2>🎮 الألعاب التعليمية</h2><div class="game-grid"><article class="game-card"><h3>🧩 طابق الرياضة مع أداة التعريف</h3><p>اختر بطاقة من كل نوع لتكوين زوج صحيح.</p><div class="score" id="matchScore">0 / 4</div><div class="game-board" id="matchBoard"></div><div class="feedback" id="matchFeedback"></div></article><article class="game-card"><h3>🎯 أي استعمال صحيح؟</h3><p>اقرأ الجملة واختر الصيغة الفرنسية الصحيحة.</p><div id="usageGame"></div></article></div>`}
const usageQ=[['مع الرياضة football، أي جملة صحيحة؟',['Je joue au football.','Je joue à le football.','Je fais de football.'],0],['مع natation، أي جملة صحيحة؟',['Je fais du natation.','Je fais de la natation.','Je joue au natation.'],1],['مع escrime، أي جملة صحيحة؟',["Je pratique l'escrime.","Je pratique la escrime.","Je fais du escrime."],0]];
function initGames(){const sports=data.vocab.filter(v=>['le football','la natation',"l'équitation",'les échecs'].includes(v[0]));const articles=['le','la','l’','les'];const board=document.getElementById('matchBoard');if(!board)return;board.innerHTML=shuffle(sports.map(v=>({type:'sport',key:v[4],text:v[0]})).concat(articles.map(a=>({type:'article',key:a,text:a})))).map((x,i)=>`<button class="game-tile" data-type="${x.type}" data-key="${esc(x.key)}" data-i="${i}">${esc(x.text)}</button>`).join('');board.querySelectorAll('.game-tile').forEach(b=>b.onclick=()=>matchClick(b));document.getElementById('usageGame').innerHTML=usageQ.map((q,i)=>`<article class="task usage-task" data-answer="${q[2]}"><b>${i+1}. ${q[0]}</b><div class="options">${shuffle(q[1].map((text,j)=>({text,j}))).map(x=>`<button class="option" data-index="${x.j}">${esc(x.text)}</button>`).join('')}</div><div class="feedback"></div></article>`).join('');document.querySelectorAll('.usage-task .option').forEach(b=>b.onclick=()=>answerOption(b))}
function matchClick(b){if(b.classList.contains('matched'))return;if(!matchPick){matchPick=b;b.classList.add('selected');return}if(matchPick===b)return;if(matchPick.dataset.type===b.dataset.type){matchPick.classList.remove('selected');b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),250);return}const ok=matchPick.dataset.key===b.dataset.key;const a=matchPick;matchPick=null;if(ok){a.classList.remove('selected');a.classList.add('matched');b.classList.add('matched');matchFound++;document.getElementById('matchScore').textContent=matchFound+' / 4';document.getElementById('matchFeedback').textContent='✅ زوج صحيح.';if(matchFound===4)document.getElementById('matchFeedback').textContent='🏆 أحسنت! أكملت المطابقة كلها.'}else{a.classList.remove('selected');a.classList.add('wrong');b.classList.add('wrong');document.getElementById('matchFeedback').textContent='🔁 ليسا زوجًا صحيحًا. جرّب مرة أخرى.';setTimeout(()=>{a.classList.remove('wrong');b.classList.remove('wrong')},450)}}
function answerOption(btn){const card=btn.closest('.task');if(!card||card.dataset.done==='1')return;const ok=Number(btn.dataset.index)===Number(card.dataset.answer);card.querySelectorAll('.option').forEach(x=>x.classList.remove('correct','wrong'));btn.classList.add(ok?'correct':'wrong');const f=card.querySelector('.feedback');f.textContent=ok?'✅ صحيح!':'🔁 ليست الإجابة الصحيحة، حاول مرة أخرى.';if(ok){card.dataset.done='1';card.querySelectorAll('.option').forEach(x=>x.disabled=true)}}
function review(){const qs=[['اختر الأداة المناسبة: ___ équitation.',['le','la','l’','les'],2],['أي جملة صحيحة؟',['Je fais de la natation.','Je fais du natation.','Je joue de la natation.'],0],['أكمل: ___ échecs.',['le','la','l’','les'],3]];return `<h2>🧠 المراجعة الذكية</h2><p>هذه مراجعة تطبيقية قصيرة؛ لن تعتبر المراجعة مكتملة إلا بعد الإجابة عن الأسئلة.</p><div class="review-list">${qs.map((q,i)=>`<article class="review-box task" data-answer="${q[2]}" data-q="r${i}"><b>${i+1}. ${q[0]}</b><div class="options">${shuffle(q[1].map((text,j)=>({text,j}))).map(x=>`<button class="option" data-index="${x.j}">${esc(x.text)}</button>`).join('')}</div><div class="feedback"></div></article>`).join('')}</div><div class="result" style="margin-top:14px">نتيجة المراجعة: <b id="reviewResult">0 / 3</b></div>`}
const assessmentQ=[['أكمل: ___ randonnée.',['le','la','l’','les'],1],['أي جملة صحيحة؟',["Je fais de l'équitation.",'Je fais du équitation.','Je joue à l’équitation.'],0],['أكمل: ___ basket-ball.',['la','l’','le','les'],2],['أي صياغة صحيحة مع escrime؟',["Je pratique l'escrime.",'Je pratique la escrime.','Je fais du escrime.'],0],['أي جملة صحيحة مع échecs؟',['Je joue aux échecs.','Je joue au échecs.','Je fais de la échecs.'],0],['أكمل: ___ gymnastique.',['le','la','l’','les'],1],['أي جملة صحيحة؟',['Je pratique le judo.','Je pratique du judo.','Je joue de judo.'],0],['أكمل: ___ voile.',['le','l’','la','les'],2],['أي جملة صحيحة؟',['Je joue au rugby.','Je joue à le rugby.','Je fais de rugby.'],0],['أي جملة صحيحة؟',['Je fais de la marche.','Je fais du marche.','Je joue au marche.'],0]];
function assessment(){return `<h2>🏆 التقييم النهائي</h2><p>أجب عن الأسئلة العشرة. ترتيب الاختيارات يتغير عند فتح التقييم حتى لا تكون الإجابة الصحيحة ثابتة في موضع واحد.</p><div class="assessment-grid">${assessmentQ.map((q,i)=>optionTask(q,i,'a')).join('')}</div><div class="result" style="margin-top:14px"><strong id="assessmentResult">0 / 10</strong><div class="progress" style="margin-top:10px"><i id="assessmentProgress"></i></div><p id="assessmentMsg">أجب عن الأسئلة لعرض النتيجة.</p></div>`}
function files(){return `<h2>📁 ملفات الدرس</h2><p>هذه الصفحة تعرض فقط موارد مرتبطة مباشرة بدرس <b>Les sports</b>. الروابط التالية لا تنقل إلى ملفات أو دروس صف آخر.</p><div class="file-grid"><a class="file-card" href="#vocab" data-file-step="1"><span>🖼️</span>المفردات<small>الانتقال إلى مفردات درس Les sports مع الصوت والأمثلة.</small></a><a class="file-card" href="#grammar" data-file-step="3"><span>📘</span>القواعد<small>Faire de · Pratiquer · Jouer à داخل هذا الدرس.</small></a><a class="file-card" href="#conversation" data-file-step="4"><span>💬</span>المحادثة<small>المحادثة الخاصة بموضوع الرياضات.</small></a><a class="file-card" href="#video" data-file-step="5"><span>🎬</span>فيديو الدرس<small>فيديو الرياضات المرتبط بهذا الدرس.</small></a><a class="file-card" href="#practice" data-file-step="6"><span>🎯</span>التدريب والألعاب<small>أنشطة تطبيقية مرتبطة بمحتوى الدرس نفسه.</small></a><a class="file-card" href="#assessment" data-file-step="9"><span>🏆</span>التقييم النهائي<small>التقييم الخاص بدرس Les sports فقط.</small></a></div>`}
function progressPage(){return `<h2>📈 التقدم</h2><div class="result"><p>التقييم النهائي: <b>${assessmentDone}/10</b> إجابة مكتملة</p><p>المراجعة الذكية: <b>${reviewDone}/3</b></p><p>المطابقة: <b>${matchFound}/4</b></p><p>${finished?'🏁 تم إكمال الدرس.':'أكمل التدريب والتقييم ثم اضغط «إكمال الدرس».'}</p></div>`}
function render(){const f=[intro,vocab,pron,grammar,conv,video,practice,games,review,assessment,files,progressPage][idx];panel.innerHTML=f();bind();if(idx===7)initGames();if(idx===9)bindAssessment();if(idx===8)bindReview()}
function bind(){panel.querySelectorAll('.speak-word,.speak-example,.speak-line').forEach(b=>b.onclick=()=>speak(b.dataset.text));panel.querySelectorAll('.task:not(.usage-task) .option').forEach(b=>b.onclick=()=>answerOption(b));panel.querySelectorAll('[data-file-step]').forEach(a=>a.onclick=e=>{e.preventDefault();setStep(Number(a.dataset.fileStep))})}
function bindAssessment(){panel.querySelectorAll('.assessment-card,.task .option').forEach(()=>{});panel.querySelectorAll('.task[data-q^="a"] .option').forEach(b=>b.onclick=()=>{const card=b.closest('.task');if(card.dataset.done==='1')return;const ok=Number(b.dataset.index)===Number(card.dataset.answer);b.classList.add(ok?'correct':'wrong');card.querySelectorAll('.option').forEach(x=>x.disabled=ok);card.querySelector('.feedback').textContent=ok?'✅ صحيح!':'🔁 حاول مرة أخرى.';if(ok){card.dataset.done='1';assessmentDone++;assessmentScore++;updateAssessment()}})}
function updateAssessment(){const r=document.getElementById('assessmentResult'),p=document.getElementById('assessmentProgress'),m=document.getElementById('assessmentMsg');if(!r)return;r.textContent=assessmentScore+' / 10';p.style.width=(assessmentDone*10)+'%';m.textContent=assessmentDone<10?'أكمل باقي الأسئلة.':assessmentScore>=8?'🏆 ممتاز!':assessmentScore>=6?'👍 جيد جدًا، راجع الأخطاء.':'🔁 راجع القاعدة ثم أعد المحاولة.'}
function bindReview(){panel.querySelectorAll('.review-box .option').forEach(b=>b.onclick=()=>{const card=b.closest('.review-box');if(card.dataset.done==='1')return;const ok=Number(b.dataset.index)===Number(card.dataset.answer);b.classList.add(ok?'correct':'wrong');card.querySelectorAll('.option').forEach(x=>x.disabled=ok);card.querySelector('.feedback').textContent=ok?'✅ صحيح!':'🔁 حاول مرة أخرى.';if(ok){card.dataset.done='1';reviewDone++;reviewScore++;const r=document.getElementById('reviewResult');if(r)r.textContent=reviewScore+' / 3'}})}
function finish(){finished=true;localStorage.setItem('hm_g9_u1_l1_complete','1');status.textContent='✅ تم إكمال درس الصف الثالث الإعدادي — Les sports على هذا الجهاز.';setStep(11)}
finishBtn.onclick=finish;renderNav();render();
</script>
</body>
</html>
