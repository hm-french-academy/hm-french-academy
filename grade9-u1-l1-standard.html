<style>
:root{--ink:#17223b;--muted:#66738a;--blue:#2563eb;--navy:#173a82;--pink:#e92d83;--line:#dfe6f2;--soft:#f7f9fd;--green:#16a34a;--gold:#d99a16}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font-family:Arial,"Cairo",sans-serif}.wrap{max-width:1120px;margin:auto;padding:16px}.student-header{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0f1b33;color:#fff;padding:10px 12px;border-radius:18px;margin-bottom:12px;box-shadow:0 8px 22px #0f1b3325}.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:#fff;font-weight:900}.brand-logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#e92d83);font-weight:1000}.header-actions{display:flex;gap:7px}.home-btn,.unit-btn{display:inline-flex;align-items:center;text-decoration:none;border-radius:12px;padding:10px 12px;font-weight:900;white-space:nowrap}.home-btn{background:var(--blue);color:#fff}.unit-btn{background:#eef3ff;color:var(--navy)}.student-note{font-size:12px;color:#718096;margin:7px 2px 10px;text-align:right}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff;border-radius:28px;padding:24px}.hero h1{margin:0;font-size:clamp(30px,6vw,44px)}.hero p{line-height:1.8;margin:8px 0 0}.journey{display:flex;gap:7px;overflow:auto;margin-top:16px}.journey span{background:#ffffff22;border:1px solid #ffffff44;border-radius:999px;padding:8px 12px;white-space:nowrap;font-weight:800}.nav{display:flex;gap:7px;overflow:auto;background:#fff;padding:8px;border-radius:18px;margin:14px 0;box-shadow:0 6px 20px #14264a10}.nav button{border:0;background:#eef3ff;color:var(--navy);border-radius:12px;padding:10px 13px;font-weight:900;white-space:nowrap;cursor:pointer}.nav button.active{background:var(--pink);color:#fff}.panel{background:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 30px #14264a12;min-height:420px}.section-head{background:linear-gradient(135deg,#f4f7ff,#fff7fb);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px}.section-head h2{margin:0;color:var(--navy);font-size:27px}.section-head p{margin:7px 0 0;color:var(--muted);line-height:1.8}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.card{border:1px solid #e1e6ef;border-radius:18px;padding:15px;background:#fff}.sport-art{height:105px;border-radius:15px;background:#f4f7ff;display:grid;place-items:center;font-size:62px;margin-bottom:10px}.fr{font-weight:900;direction:ltr;text-align:center;font-size:20px}.ar{text-align:center;color:#315aa4;font-weight:800;margin-top:5px}.example{background:var(--soft);border-radius:12px;padding:10px;margin-top:9px;direction:ltr;text-align:center;line-height:1.65}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;margin:5px 3px 0 0}.primary{background:var(--blue);color:#fff}.secondary{background:#edf3ff;color:var(--navy)}.btn:disabled{opacity:.65;cursor:default}.grid2,.grammar-grid,.dialogue-grid,.review-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:13px}.box{border:1px solid var(--line);border-radius:18px;padding:17px;background:#fff}.box h3{margin-top:0;color:var(--navy)}.formula{background:var(--soft);border:1px solid #e2e8f0;border-radius:16px;padding:15px;margin:9px 0}.formula b{display:block;color:var(--navy);font-size:20px;direction:ltr}.ltr{direction:ltr;text-align:left}.note{background:#fffaf0;border:1px solid #f2d58b;border-radius:15px;padding:14px;line-height:1.9}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}.option{padding:12px;border:1px solid #dbe1eb;border-radius:11px;background:#fff;font-weight:800;cursor:pointer}.option.correct{border-color:var(--green);background:#ecfdf3}.option.wrong{border-color:var(--pink);background:#fff2f8}.feedback{min-height:25px;font-weight:800;margin-top:10px}.dialogue{border:1px solid var(--line);border-radius:18px;padding:15px;background:#fff;margin:10px 0}.speaker{font-weight:900;color:var(--navy)}.line-fr{direction:ltr;text-align:left;font-size:18px;font-weight:900;margin-top:5px}.line-ar{color:var(--muted);margin-top:6px;line-height:1.7}.video{position:relative;padding-top:56.25%;border-radius:18px;overflow:hidden;background:#0f1b33}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.game-launch{background:linear-gradient(135deg,#f7f9ff,#fff7fb);border:1px solid var(--line);border-radius:20px;padding:22px;text-align:center}.game-launch a{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;border-radius:13px;padding:12px 18px;font-weight:900}.result{background:var(--soft);border-radius:18px;padding:18px;text-align:center}.file-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.file-card{display:block;text-decoration:none;color:var(--ink);background:linear-gradient(135deg,#fff,#f7f9ff);border:1px solid var(--line);border-radius:18px;padding:16px}.file-card b{display:block;color:var(--navy);font-size:18px}.file-card small{display:block;color:var(--muted);margin-top:6px;line-height:1.6}.progress{height:14px;background:#e8edf5;border-radius:999px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#14b8a6);width:0}.complete{margin-top:14px;background:#fff;border-radius:20px;padding:17px;display:flex;justify-content:space-between;gap:12px;align-items:center}.complete b{display:block}.empty{padding:20px;background:#f8fafc;border-radius:16px;color:var(--muted)}@media(max-width:650px){.wrap{padding:10px}.complete{display:block}.unit-btn{display:none}.panel{padding:14px}.dialogue{margin:8px 0}}

<body data-hm-grade-theme="prep-3">
<div class="wrap">
<header class="student-header"><a class="brand" href="index.html"><span class="brand-logo">HM</span><span>🇫🇷 HM Academy</span></a><div class="header-actions"><a class="unit-btn" href="unit-map.html?unit=unit-1">🧭 خريطة الوحدة</a><a class="home-btn" href="index.html">⌂ الرئيسية</a></div></header>
<div class="student-note">هذا الدرس مستقل عن باقي الدروس، وتقدمك محفوظ على هذا الجهاز.</div>
<section class="hero"><h1>الرياضات</h1><p>Les sports · Le sport · الصف الثالث الإعدادي · الوحدة الأولى</p><div class="journey"><span>🚀 استكشف</span><span>🖼️ تعلم</span><span>🎧 انطق</span><span>📘 افهم</span><span>💬 تواصل</span><span>🎬 شاهد</span><span>🎯 تدرب</span><span>🎮 العب</span><span>🧠 راجع</span><span>🏆 قيّم</span><span>📁 ملفات</span><span>📈 تقدم</span></div></section>

<section class="panel" id="panel"></section>
<section class="complete"><div><b>🏁 رحلة التعلم</b><div id="status">تقدمك محفوظ على هذا الجهاز.</div></div><button class="btn primary" id="complete">إكمال الدرس</button></section>
</div>
<script>
'use strict';
const vocab=[['le football','كرة القدم','⚽','Je joue au football.'],['le ping-pong','تنس الطاولة','🏓','Je joue au ping-pong.'],['le karaté','الكاراتيه','🥋','Je pratique le karaté.'],['le cyclisme / le vélo','ركوب الدراجات','🚴','Je fais du vélo.'],['la boxe','الملاكمة','🥊','Je pratique la boxe.'],['la natation','السباحة','🏊','Je fais de la natation.'],['le tennis','التنس','🎾','Je joue au tennis.'],['le basket-ball','كرة السلة','🏀','Je joue au basket-ball.'],['le volley-ball','الكرة الطائرة','🏐','Je joue au volley-ball.'],["l'équitation",'الفروسية','🏇',"Je fais de l'équitation."],["l'escrime",'المبارزة','🤺',"Je pratique l'escrime."],['le ski','التزلج','⛷️','Je fais du ski.'],['le judo','الجودو','🥋','Je pratique le judo.'],['le rugby','الرجبي','🏉','Je joue au rugby.'],['la pêche','صيد السمك','🎣','Je pratique la pêche.'],['la voile','الإبحار','⛵','Je fais de la voile.'],['la gymnastique','الجمباز','🤸','Je fais de la gymnastique.'],['les échecs','الشطرنج','♟️','Je joue aux échecs.'],['la marche','المشي','🚶','Je fais de la marche.'],['la randonnée','التنزه','🥾','Je fais de la randonnée.']];
const conversation=[['Quel sport pratiques-tu ?','Je pratique le football.'],["Qu'est-ce que tu préfères ?",'Je préfère le tennis.'],['Où pratiques-tu ton sport préféré ?','Je le pratique au club.'],['Tu fais du sport ?','Oui, je fais de la natation.']];
const practice=['Classer les sports selon le genre','Compléter des phrases avec le sport convenable','Associer chaque sport à jouer, faire ou pratiquer','Construire une phrase complète à partir d\'une image','Choisir l\'article correct devant le sport','Décrire son sport préféré en deux phrases','Corriger une erreur d\'article ou de structure'];
const pronunciation=['Répéter chaque sport avec son article','Distinguer les articles le, la, l\' et les à l\'oral',"Répéter les questions Qu'est-ce que tu pratiques ? et Où pratiques-tu ton sport préféré ?",'Lire à voix haute les noms de sports puis les utiliser dans une phrase','Faire une écoute-répétition puis répondre spontanément à une question sur le sport préféré',"Travailler le rythme des groupes faire du, faire de la, faire de l' et pratiquer le/la/l'/les"];
const visual=['Associer chaque sport à une illustration claire','Classer visuellement les sports individuels et collectifs','Identifier les sports selon les équipements et lieux représentés','Associer une image de situation à la phrase française correspondante','Créer une carte sportive interactive: sélectionner une image, choisir le sport puis produire une phrase complète','Associer visuellement chaque sport à la structure correcte: jouer à, faire de ou pratiquer'];
const assessment=['Nommer des sports à partir d\'images','Choisir le sport adapté à une situation','Prononcer correctement les noms de sports','Associer une représentation visuelle à l\'expression française correcte','Produire oralement trois phrases sur un sport préféré','Choisir correctement entre jouer à, faire de et pratiquer','Répondre à une question orale sans modèle'];
const steps=[['intro','🚀','استكشف'],['vocab','🖼️','تعلم'],['pron','🎧','انطق'],['grammar','📘','افهم'],['conv','💬','تواصل'],['video','🎬','شاهد'],['practice','🎯','تدرب'],['games','🎮','العب'],['review','🧠','راجع'],['assessment','🏆','قيّم'],['files','📁','ملفات'],['progress','📈','تقدم']];
const nav=document.getElementById('nav'),panel=document.getElementById('panel'),status=document.getElementById('status');let idx=0;let completed=JSON.parse(localStorage.getItem('hm_g9_u1_l1_completed')||'false');let scores=JSON.parse(localStorage.getItem('hm_g9_u1_l1_scores')||'{}');
const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
function speechText(t){return String(t||'').trim()}
function speak(t){const text=speechText(t);if(!text||!window.speechSynthesis||typeof SpeechSynthesisUtterance==='undefined')return;const synth=window.speechSynthesis;try{synth.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=.82;u.pitch=1;u.volume=1;const voices=synth.getVoices();const v=voices.find(x=>/^fr[-_]FR$/i.test(String(x.lang)))||voices.find(x=>/^fr[-_]/i.test(String(x.lang)));if(v)u.voice=v;synth.resume();synth.speak(u)}catch(e){setTimeout(()=>{try{synth.resume();synth.speak(new SpeechSynthesisUtterance(text))}catch(_){}} ,120)}}
window.speak=speak;
function audio(text,label='🔊 استمع'){return `<button class="btn secondary" type="button" onclick="speak(this.dataset.text)" data-text="${esc(text)}">${label}</button>`}
function save(){localStorage.setItem('hm_g9_u1_l1_scores',JSON.stringify(scores));localStorage.setItem('hm_g9_u1_l1_completed',JSON.stringify(completed))}
function go(i){idx=i;render();window.scrollTo({top:0,behavior:'smooth'})}window.go=go;
function head(title,desc){return `<div class="section-head"><h2>${title}</h2><p>${desc}</p></div>`}
function vocabCard(v){return `<article class="card"><div class="sport-art">${v[2]}</div><div class="fr">${esc(v[0])}</div><div class="ar">${esc(v[1])}</div><div class="example">${esc(v[3])}</div>${audio(v[0],'🔊 نطق الكلمة')}${audio(v[3],'▶ نطق المثال')}</article>`}
function choice(question,opts,answer,key){return `<article class="box quiz" data-key="${key}" data-answer="${answer}"><h3>${esc(question)}</h3><div class="options">${opts.map((o,i)=>`<button class="option" type="button" data-value="${i}" onclick="answer(this)">${esc(o)}</button>`).join('')}</div><div class="feedback"></div></article>`}
function answer(btn){const q=btn.closest('.quiz'),ok=Number(btn.dataset.value)===Number(q.dataset.answer);q.querySelectorAll('.option').forEach(x=>x.disabled=ok);q.querySelectorAll('.option').forEach(x=>x.classList.remove('correct','wrong'));btn.classList.add(ok?'correct':'wrong');q.querySelector('.feedback').textContent=ok?'✅ صحيح! أحسنت.':'🔁 حاول مرة أخرى.';if(ok){scores[q.dataset.key]=1;save()}}
function gameAnswer(btn){const card=btn.closest('.card');if(!card)return;const ok=btn.dataset.answer==='true';card.querySelectorAll('.option').forEach(x=>x.classList.remove('correct','wrong'));btn.classList.add(ok?'correct':'wrong');const f=card.querySelector('.feedback');if(ok){card.querySelectorAll('.option').forEach(x=>x.disabled=true);f.textContent='✅ صحيح! أحسنت.'}else{f.textContent='🔁 ليست الإجابة الصحيحة. حاول مرة أخرى.'}}
function render(){nav.innerHTML=steps.map((s,i)=>`<button class="${i===idx?'active':''}" onclick="go(${i})">${s[1]} ${s[2]}</button>`).join('');let h='';
if(idx===0)h=head('🚀 ضربة البداية','ابدأ من موضوع الدرس نفسه: الرياضيات، ثم انتقل تدريجيًا من المفردات إلى النطق والقواعد والتواصل والتدريب والتقييم.')+`<div class="grid2"><div class="box"><h3>🎯 أهداف الدرس</h3><ul><li>التعرف على أسماء الرياضات واستخدامها في جمل.</li><li>التمييز بين le / la / l’ / les.</li><li>استخدام faire du / de la / de l’، pratiquer، jouer à.</li><li>التحدث عن الرياضة المفضلة ومكان ممارستها.</li></ul></div><div class="box"><h3>🧭 خريطة الدرس</h3><p>المفردات ← النطق ← القاعدة ← المحادثة ← الفيديو ← التدريب ← الألعاب ← المراجعة ← التقييم.</p><div class="note"><b>المصدر:</b> Les sports · الصف الثالث الإعدادي · الوحدة الأولى · الصفحات الأصلية 16–20.</div></div></div>`;
if(idx===1)h=head('🖼️ تعلم المفردات','كل بطاقة تمثل كلمة رياضية مستقلة، مع ترجمتها ومثالها ونطق الكلمة ونطق المثال.')+`<div class="cards">${vocab.map(vocabCard).join('')}</div>`;
const pronunciationNotes={
'le football':'انتبه إلى نطق le بوضوح، وإلى صوت ou في football.',
'le ping-pong':'انتبه إلى النطق المتتابع للمقطعين ping و pong مع صوت الأنف في النهاية.',
'le karaté':'انتبه إلى صوت é في نهاية karaté، ويُنطق قريبًا من «إي».',
'le cyclisme / le vélo':'في cyclisme انتبه إلى c التي تُنطق مثل «س»، وفي vélo إلى صوت é.',
'la boxe':'انتبه إلى x في boxe؛ لا تُنطق كصوت عربي مستقل في نهاية الكلمة.',
'la natation':'انتبه إلى صوت tion في نهاية natation، ويُنطق قريبًا من «سيون».',
'le tennis':'انتبه إلى نطق e القصيرة في tennis، وإلى s الأخيرة غير المنطوقة.',
'le basket-ball':'انتبه إلى النطق الفرنسي للكلمة كاملة دون مدّ صوت a.',
'le volley-ball':'انتبه إلى صوت y في volley، وإلى النطق الفرنسي لـ ball.',
"l'équitation":'انتبه إلى l’ المتصلة بالكلمة، وإلى صوت é في équitation.',
"l'escrime":'انتبه إلى l’ المتصلة بالكلمة، وإلى نطق es- في بداية escrime دون إضافة صوت عربي زائد.',
'le ski':'انتبه إلى النطق القصير والواضح لـ ski، مع s غير المنطوقة كصوت منفصل.',
'le judo':'انتبه إلى صوت j الفرنسي في بداية judo، وهو قريب من «ژ».',
'le rugby':'انتبه إلى صوت r الفرنسي في البداية، وإلى نطق y في نهاية rugby.',
'la pêche':'انتبه إلى صوت è في pêche، وإلى ch التي تُنطق «ش».',
'la voile':'انتبه إلى صوت oi في voile؛ يُنطق قريبًا من «وا».',
'la gymnastique':'انتبه إلى y في gymnastique، وإلى صوت tique في النهاية.',
'les échecs':'انتبه إلى صوت é في échecs، وإلى ch التي تُنطق «ش».',
'la marche':'انتبه إلى ch في marche، وتُنطق «ش»، مع عدم نطق e الأخيرة.',
'la randonnée':'انتبه إلى صوت an الأنفي في randonnée، وإلى é في النهاية.'};
if(idx===2)h=head('🎧 انطق','النطق هنا مبني على قائمة النطق الأصلية للدرس: استمع إلى الكلمة، راجع ملاحظتها الخاصة، ثم كررها.')+`<div class="grid2">${vocab.map(v=>`<article class="box"><div class="fr">${esc(v[0])}</div><div class="ar">${esc(v[1])}</div>${audio(v[0],'🔊 استمع للكلمة')}<div class="note"><b>💡 ملاحظة النطق:</b><br>${esc(pronunciationNotes[v[0]])}</div></article>`).join('')}</div><div class="box" style="margin-top:14px"><h3>🎙️ تدريب النطق</h3><p>استمع، كرر، ثم قل الكلمة مرة أخرى دون النظر.</p></div>`;
if(idx===3)h=head('📘 افهم القاعدة','المحتوى النحوي في ملف الدرس الأصلي يدور حول ثلاث بنيات أساسية مرتبطة بالرياضات.')+`<div class="grammar-grid"><div class="box"><h3>1. Faire</h3><div class="formula"><b>faire du</b><div class="ltr">Je fais du sport.<br>Je fais du vélo.</div></div><div class="formula"><b>faire de la</b><div class="ltr">Je fais de la natation.</div></div><div class="formula"><b>faire de l'</b><div class="ltr">Je fais de l'équitation.</div></div></div><div class="box"><h3>2. Pratiquer</h3><div class="formula"><b>pratiquer + le / la / l' / les</b><div class="ltr">Je pratique le football.<br>Je pratique la boxe.<br>Je pratique l'escrime.</div></div></div><div class="box"><h3>3. Jouer à</h3><div class="formula"><b>jouer à + sport</b><div class="ltr">Je joue au football.<br>Je joue au tennis.<br>Je joue aux échecs.</div></div></div></div>`;
if(idx===4)h=head('💬 تواصل','محادثة الدرس مبنية على الأسئلة والأجوبة الأصلية حول الرياضة المفضلة ومكان ممارستها.')+`<div class="dialogue-grid">${conversation.map((c,i)=>`<article class="dialogue"><div class="speaker">${i%2?'👤 الطالب':'🗣️ الحوار'}</div><div class="line-fr">${esc(c[0])}</div>${audio(c[0],'🔊 نطق السؤال')}<div class="line-ar">ما المعنى؟</div><hr><div class="line-fr">${esc(c[1])}</div>${audio(c[1],'▶ نطق الإجابة')}<div class="line-ar">تدرب على الإجابة بنفسك بعد الاستماع.</div></article>`).join('')}</div>`;
if(idx===5)h=head('🎬 شاهد','فيديو الدرس المخصص لموضوع Les sports.')+`<div class="video"><iframe src="https://www.youtube.com/embed/pnmoexHphZ0" title="Les sports" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>`;
if(idx===6)h=head('🎯 تدرب','تدريبات الدرس الأصلية تنتقل من التعرف إلى الاختيار ثم بناء الجملة والتصحيح.')+`<div class="grid2">${practice.map((x,i)=>`<article class="box"><h3>${i+1}. تدريب</h3><p>${esc(x)}</p></article>`).join('')}</div><div style="margin-top:14px" class="review-grid">${choice('اختر أداة التعريف الصحيحة: ___ natation',['le','la','l’','les'],1,'p1')}${choice('اختر البنية الصحيحة: Je ___ football.',['fais du','fais de la','pratique de','joue de'],0,'p2')}${choice('اختر الجملة الصحيحة: الشطرنج',['Je joue aux échecs.','Je fais aux échecs.','Je pratique du échecs.','Je joue de la échecs.'],0,'p3')}${choice('اختر البنية الصحيحة مع escrime',['Je fais de la escrime.','Je pratique l’escrime.','Je joue l’escrime.','Je pratique le escrime.'],1,'p4')}</div>`;
