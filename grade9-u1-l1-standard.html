ckground:#f7f9fd;border-radius:18px;padding:18px;text-align:center}.file-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.file-card{display:block;text-decoration:none;color:#17223b;background:linear-gradient(135deg,#fff,#f7f9ff);border:1px solid #e1e6ef;border-radius:18px;padding:16px;cursor:pointer}.file-card span{display:block;font-size:30px;margin-bottom:8px}.file-card small{display:block;color:#66738a;font-weight:700;margin-top:5px;line-height:1.6}.complete{margin-top:14px;background:#fff;border-radius:20px;padding:17px;display:flex;justify-content:space-between;gap:12px;align-items:center}.student-note{font-size:12px;color:#718096;margin:7px 2px;text-align:right}@media(max-width:650px){.wrap{padding:10px}.complete{display:block}.unit-btn{display:none}.dialogue-card{max-width:94%}}

<body data-hm-grade-theme="prep-3"><div class="wrap">
<header class="student-header"><a class="brand" href="index.html"><span class="brand-logo">HM</span><span>🇫🇷 HM Academy</span></a><div class="header-actions"><a class="unit-btn" href="unit-map.html?unit=unit-1">🧭 خريطة الوحدة</a><a class="home-btn" href="index.html">⌂ الرئيسية</a></div></header>
<div class="student-note">هذا الدرس مستقل عن باقي الدروس، وتقدمك محفوظ على هذا الجهاز.</div>
<section class="hero"><h1>الرياضات</h1><p>Les sports · Le sport · الصف الثالث الإعدادي · الوحدة الأولى</p><div class="journey"><span>🚀 استكشف</span><span>🖼️ تعلم</span><span>🎧 انطق</span><span>📘 افهم</span><span>💬 تواصل</span><span>🎬 شاهد</span><span>🎯 تدرب</span><span>🎮 العب</span><span>🧠 راجع</span><span>🏆 قيّم</span><span>📁 ملفات</span><span>📈 تقدم</span></div></section>
<nav class="nav" id="nav"></nav><section class="panel" id="panel"></section>
<section class="complete"><div><b>🏁 رحلة التعلم</b><div id="status">تقدمك محفوظ على هذا الجهاز.</div></div><button class="btn primary" onclick="finish()">إكمال الدرس</button></section>
</div>
<script>
(function(){'use strict';
const vocab=[['le football','كرة القدم','⚽','Je joue au football.','le'],['le ping-pong','تنس الطاولة','🏓','Je joue au ping-pong.','le'],['le karaté','الكاراتيه','🥋','Je pratique le karaté.','le'],['le cyclisme / le vélo','ركوب الدراجات','🚴','Je fais du vélo.','le'],['la boxe','الملاكمة','🥊','Je pratique la boxe.','la'],['la natation','السباحة','🏊','Je fais de la natation.','la'],['le tennis','التنس','🎾','Je joue au tennis.','le'],['le basket-ball','كرة السلة','🏀','Je joue au basket-ball.','le'],['le volley-ball','الكرة الطائرة','🏐','Je joue au volley-ball.','le'],["l'équitation",'الفروسية','🏇',"Je fais de l'équitation.",'l’'],["l'escrime",'المبارزة','🤺',"Je pratique l'escrime.",'l’'],['le ski','التزلج','⛷️','Je fais du ski.','le'],['le judo','الجودو','🥋','Je pratique le judo.','le'],['le rugby','الرجبي','🏉','Je joue au rugby.','le'],['la pêche','صيد السمك','🎣','Je pratique la pêche.','la'],['la voile','الإبحار','⛵','Je fais de la voile.','la'],['la gymnastique','الجمباز','🤸','Je fais de la gymnastique.','la'],['les échecs','الشطرنج','♟️','Je joue aux échecs.','les'],['la marche','المشي','🚶','Je fais de la marche.','la'],['la randonnée','التنزه','🥾','Je fais de la randonnée.','la']];
const steps=[['intro','🚀','البداية'],['vocab','🖼️','المفردات'],['pron','🎧','النطق'],['grammar','📘','القواعد'],['conv','💬','المحادثة'],['video','🎬','الفيديو'],['practice','🎯','التدريب'],['games','🎮','الألعاب'],['review','🧠','المراجعة الذكية'],['assessment','🏆','التقييم'],['files','📁','ملفات الدرس'],['progress','📈','التقدم']];
const nav=document.getElementById('nav'),panel=document.getElementById('panel');let idx=0,done=JSON.parse(localStorage.getItem('hm_g9_u1_l1_done')||'false');
const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
function speechText(t){t=String(t||'').trim();return t.replace(/l[’']équitation/ig,'léquitation').replace(/l[’']escrime/ig,'lescrime').replace(/Qu'est-ce que tu préfères \?/i,'Quest-ce que tu preferes ?').replace(/Où pratiques-tu ton sport préféré \?/i,'Ou pratiques-tu ton sport prefere ?')}
function speak(t){if(!window.speechSynthesis||!window.SpeechSynthesisUtterance)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(speechText(t));u.lang='fr-FR';u.rate=.78;const v=speechSynthesis.getVoices().find(x=>/^fr[-_]FR$/i.test(x.lang))||speechSynthesis.getVoices().find(x=>/^fr[-_]/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
window.speak=speak;
function go(i){idx=i;render();window.scrollTo({top:0,behavior:'smooth'})}window.go=go;
function audio(t,label){return '<button class="btn secondary" type="button" onclick="speak('+JSON.stringify(t)+')">'+label+'</button>'}
function render(){nav.innerHTML=steps.map((s,i)=>'<button class="'+(i===idx?'active':'')+'" onclick="go('+i+')">'+s[1]+' '+s[2]+'</button>').join('');let h='';
if(idx===0)h='<h2>🚀 ضربة البداية</h2><p>في هذا الدرس سنكتشف أسماء الرياضات، ثم نتعلم أدوات التعريف ونستخدمها مع faire و pratiquer و jouer.</p><div class="note"><b>🎯 هدف الدرس</b><br>التعرف على الرياضات واختيار <b>le / la / l’ / les</b> واستخدامها في جمل صحيحة.</div>';
if(idx===1)h='<h2>🖼️ المفردات</h2><p>كل بطاقة تمثل رياضة مختلفة، وبها نطق مستقل للكلمة ونطق مستقل للمثال.</p><div class="cards">'+vocab.map(x=>'<article class="card"><div class="sport-art">'+x[2]+'</div><div class="fr">'+esc(x[0])+'</div><div class="ar">'+esc(x[1])+'</div><div class="example">'+esc(x[3])+'</div>'+audio(x[0],'🔊 نطق الكلمة')+audio(x[3],'▶ نطق المثال')+'</article>').join('')+'</div>';
if(idx===2)h='<h2>🎧 النطق</h2><p>استمع إلى كل كلمة وراجع الملاحظة الخاصة بها.</p><div class="pron-grid">'+vocab.map(x=>'<article class="pron-card"><div class="fr">'+esc(x[0])+'</div><div class="ar">'+esc(x[1])+'</div><div class="note"><b>💡 ملاحظة النطق</b><br>'+(/l[’']équitation/i.test(x[0])?'انتبه إلى بداية l’ وإلى صوت é في équitation.':/l[’']escrime/i.test(x[0])?'انتبه إلى نطق l’escrime مع الصوت الفرنسي الأولي دون إضافة صوت عربي زائد.':'استمع إلى الكلمة كاملة مع أداة التعريف ثم كررها بنفس الإيقاع.')+'</div>'+audio(x[0],'🔊 استمع للكلمة')+audio(x[3],'▶ استمع للمثال')+'</article>').join('')+'</div>';
if(idx===3)h='<h2>📘 القواعد</h2><div class="grammar-grid"><div class="formula"><b>le</b><p>للاسم المذكر المفرد.</p><strong>le football · le tennis · le judo</strong></div><div class="formula"><b>la</b><p>للاسم المؤنث المفرد.</p><strong>la boxe · la natation · la voile</strong></div><div class="formula"><b>l’</b><p>قبل الاسم المفرد الذي يبدأ بحرف متحرك.</p><strong>l’équitation · l’escrime</strong></div><div class="formula"><b>les</b><p>للاسم الجمع.</p><strong>les échecs</strong></div></div><div class="note" style="margin-top:14px"><b>⭐ تذكّر:</b> <b>faire du / de la / de l’</b>، و <b>pratiquer + le/la/l’/les</b>، و <b>jouer à</b> مع الرياضة.</div>';
if(idx===4)h='<h2>💬 المحادثة</h2><div class="dialogue-wrap">'+[['Sara','Quel sport pratiques-tu ?','ما الرياضة التي تمارسها؟'],['Adam','Je pratique le football.','أنا أمارس كرة القدم.'],['Sara',"Qu'est-ce que tu préfères ?",'ماذا تفضل؟'],['Adam','Je préfère le tennis.','أفضل التنس.'],['Sara','Où pratiques-tu ton sport préféré ?','أين تمارس رياضتك المفضلة؟'],['Adam','Je le pratique au club.','أمارسها في النادي.'],['Sara','Tu fais du sport ?','هل تمارس الرياضة؟'],['Adam','Oui, je fais de la natation.','نعم، أمارس السباحة.']].map((x,i)=>'<article class="dialogue-card '+(i%2?'adam':'sara')+'"><div class="speaker">'+x[0]+'</div><div class="line-fr">'+esc(x[1])+'</div><div class="line-ar">'+esc(x[2])+'</div>'+audio(x[1],'🔊 استمع')+'</article>').join('')+'</div>';
if(idx===5)h='<h2>🎬 شاهد وتعلّم</h2><p>فيديو الدرس:</p><div class="video"><iframe src="https://www.youtube.com/embed/pnmoexHphZ0" title="Les sports" allowfullscreen></iframe></div>';
if(idx===6)h='<h2>🎯 التدريب</h2><div class="task"><h3>اختر أداة التعريف الصحيحة: ___ boxe</h3><div class="options">'+['le','la','les'].map(x=>'<button class="option" onclick="feedback(this,'+JSON.stringify(x==='la')+')">'+x+'</button>').join('')+'</div><div class="feedback" id="f1"></div></div><div class="task" style="margin-top:12px"><h3>اختر الجملة الصحيحة.</h3><div class="options"><button class="option" onclick="feedback(this,true)">Je pratique le football.</button><button class="option" onclick="feedback(this,false)">Je pratique la football.</button></div><div class="feedback" id="f2"></div></div>';
if(idx===7)h='<h2>🎮 الألعاب</h2><div class="game-launch"><div style="font-size:52px">🎮</div><h3>مركز الألعاب · Les sports</h3><p>ألعاب المفردات وأدوات التعريف والنطق.</p><a href="grade9-u1-l1-games.html">🚀 فتح مركز الألعاب</a></div>';
if(idx===8)h='<h2>🧠 المراجعة الذكية</h2><div class="task"><h3>اختر: ___ équitation</h3><div class="options">'+['le','la','l’'].map(x=>'<button class="option" onclick="feedback(this,'+JSON.stringify(x==='l’')+')">'+x+'</button>').join('')+'</div><div class="feedback" id="f3"></div></div><div class="note" style="margin-top:14px">راجع كذلك الفرق بين <b>faire de</b> و <b>pratiquer</b> و <b>jouer à</b>.</div>';
if(idx===9)h='<h2>🏆 التقييم النهائي</h2><div class="result"><strong>جاهز للتقييم</strong><p>راجع المفردات والقواعد والنطق، ثم طبّق ما تعلمته في أنشطة الدرس.</p><div class="options"><button class="option" onclick="feedback(this,true)">✓ أبدأ التقييم</button></div><div class="feedback" id="f4"></div></div>';
if(idx===10)h='<h2>📁 ملفات الدرس</h2><div class="file-grid"><a class="file-card" href="#" onclick="go(1);return false"><span>🧠</span>المفردات<small>20 رياضة مع الترجمة والأمثلة والنطق.</small></a><a class="file-card" href="#" onclick="go(3);return false"><span>📘</span>القواعد<small>أدوات التعريف وبنى faire/pratiquer/jouer.</small></a><a class="file-card" href="grade9-u1-l1-games.html"><span>🎮</span>مركز الألعاب<small>الألعاب المستقلة للدرس.</small></a></div>';
if(idx===11)h='<h2>📈 التقدم</h2><div class="result"><strong>'+ (done?'🎉 مكتمل':'رحلة التعلم') +'</strong><p>'+ (done?'تم حفظ إكمال الدرس على هذا الجهاز.':'أكمل مراحل الدرس ثم اضغط «إكمال الدرس» لحفظ تقدمك.')+'</p></div>';
panel.innerHTML=h}
function feedback(btn,ok){const box=btn.parentNode.parentNode.querySelector('.feedback');box.textContent=ok?'✅ إجابة صحيحة!':'❌ حاول مرة أخرى.';btn.style.outline=ok?'3px solid #20a45a':'3px solid #e92d83'}window.feedback=feedback;
function finish(){done=true;localStorage.setItem('hm_g9_u1_l1_done','true');document.getElementById('status').textContent='تم حفظ إكمال الدرس على هذا الجهاز. ✓';go(11)}window.finish=finish;
render();
})();
</script><script src="scripts/grade9-u1-l1-recovery.js?v=20260911" defer></script>
