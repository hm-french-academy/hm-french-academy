<link rel="stylesheet" href="css/hm-academy-grade-themes.css?v=20260909-grade-themes">
<style>
body{margin:0;background:#f5f7fb;color:#17223b;font-family:Arial,"Cairo",sans-serif}.wrap{max-width:1120px;margin:auto;padding:16px}.student-header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0f1b33;color:#fff;padding:10px 12px;border-radius:18px;margin-bottom:14px;box-shadow:0 8px 22px #0f1b3325}.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:#fff;font-weight:900}.brand-logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#e92d83);font-weight:1000}.header-actions{display:flex;gap:7px}.home-btn,.unit-btn{display:inline-flex;align-items:center;text-decoration:none;border-radius:12px;padding:10px 12px;font-weight:900;white-space:nowrap}.home-btn{background:#2563eb;color:#fff}.unit-btn{background:#eef3ff;color:#173a82}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff;border-radius:28px;padding:24px}.hero h1{margin:0;font-size:clamp(28px,6vw,42px)}.hero p{line-height:1.8}.journey,.nav{display:flex;gap:7px;overflow:auto}.journey{margin-top:15px}.journey span{background:#ffffff22;border:1px solid #ffffff44;border-radius:999px;padding:8px 12px;white-space:nowrap;font-weight:800}.nav{background:#fff;padding:8px;border-radius:18px;margin:14px 0}.nav button{border:0;background:#eef3ff;color:#173a82;border-radius:12px;padding:10px 13px;font-weight:900;white-space:nowrap;cursor:pointer}.nav button.active{background:#e92d83;color:#fff}.panel{background:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 30px #14264a12}.group{margin-bottom:24px}.group-head{background:linear-gradient(135deg,#f4f7ff,#fff7fb);border:1px solid #dfe6f2;border-radius:18px;padding:16px;margin-bottom:12px}.group-head h3{margin:0;color:#173a82;font-size:24px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px}.card,.task{border:1px solid #e1e6ef;border-radius:18px;padding:15px;background:#fff}.sport-art{height:130px;border-radius:15px;background:#f4f7ff;display:grid;place-items:center;font-size:72px;margin-bottom:10px}.fr{font-weight:900;direction:ltr;text-align:center;font-size:20px}.ar{text-align:center;color:#315aa4;font-weight:800}.example{background:#f7f9fd;border-radius:12px;padding:10px;margin-top:8px;direction:ltr;text-align:center;line-height:1.6}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;margin:5px 3px 0 0}.primary{background:#2563eb;color:#fff}.secondary{background:#edf3ff;color:#173a82}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}.option{padding:12px;border:1px solid #dbe1eb;border-radius:11px;background:#fff;font-weight:800;cursor:pointer}.option.correct{border-color:#20a45a;background:#ecfdf3}.option.wrong{border-color:#e92d83;background:#fff2f8}.feedback{min-height:24px;font-weight:800;margin-top:10px}.dialogue{border-right:4px solid #e92d83;padding:12px;margin:8px 0;background:#fff7fb;border-radius:12px;line-height:1.8}.note{background:#fffaf0;border:1px solid #f2d58b;border-radius:15px;padding:13px;line-height:1.9}.grammar{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.formula{background:#f7f9fd;border-radius:16px;padding:16px}.formula b{display:block;color:#173a82;font-size:20px;direction:ltr}.video{position:relative;padding-top:56.25%;border-radius:18px;overflow:hidden;background:#0f1b33}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.score{font-size:22px;font-weight:900;color:#173a82}.memory{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.memory button{min-height:90px;border:1px solid #dbe1eb;border-radius:15px;background:#fff;font-size:22px;font-weight:900;cursor:pointer}.progress{height:9px;background:#e8edf5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#2563eb}.complete{margin-top:14px;background:#fff;border-radius:20px;padding:17px;display:flex;justify-content:space-between;gap:12px;align-items:center}.student-note{font-size:12px;color:#718096;margin:7px 2px;text-align:right}@media(max-width:650px){.wrap{padding:10px}.complete{display:block}.unit-btn{display:none}.brand-text{font-size:14px}}
</style></head>
<body data-hm-grade-theme="prep-3"><div class="wrap">
<header class="student-header"><a class="brand" href="index.html"><span class="brand-logo">HM</span><span>🇫🇷 HM Academy</span></a><div class="header-actions"><a class="unit-btn" href="unit-map.html?unit=unit-1">🧭 خريطة الوحدة</a><a class="home-btn" href="index.html">⌂ الرئيسية</a></div></header>
<div class="student-note">الدرس مستقل عن باقي الدروس، وتقدمك محفوظ على هذا الجهاز.</div>
<section class="hero"><h1>الرياضات</h1><p>Les sports · Le sport · الصف الثالث الإعدادي · الوحدة الأولى</p><div class="journey"><span>🚀 استكشف</span><span>🖼️ تعلم</span><span>🎧 انطق</span><span>📘 افهم</span><span>💬 تواصل</span><span>🎬 شاهد</span><span>🎯 تدرب</span><span>🎮 العب</span><span>🧠 راجع</span><span>🏆 قيّم</span><span>📈 تقدم</span></div></section>
<nav class="nav" id="nav"></nav><section class="panel" id="panel"></section>
<section class="complete"><div><b>🏁 رحلة التعلم</b><div id="status">التقدم محفوظ على هذا الجهاز.</div></div><button class="btn primary" onclick="finish()">إكمال الدرس</button></section></div>
<script>
const data={id:'g9-u1-l1',title:'Les sports',ar:'الرياضات',vocab:[['le football','كرة القدم','⚽','Je joue au football.','au'],['le ping-pong','تنس الطاولة','🏓','Je joue au ping-pong.','au'],['le karaté','الكاراتيه','🥋','Je pratique le karaté.','le'],['le cyclisme / le vélo','ركوب الدراجات','🚴','Je fais du vélo.','du'],['la boxe','الملاكمة','🥊','Je pratique la boxe.','la'],['la natation','السباحة','🏊','Je fais de la natation.','de la'],['le tennis','التنس','🎾','Je joue au tennis.','au'],['le basket-ball','كرة السلة','🏀','Je joue au basket-ball.','au'],['le volley-ball','الكرة الطائرة','🏐','Je joue au volley-ball.','au'],["l'équitation",'الفروسية','🏇',"Je fais de l'équitation.",'de l'],["l'escrime",'المبارزة','🤺',"Je pratique l'escrime.",'l'],['le ski','التزلج','⛷️','Je fais du ski.','du'],['le judo','الجودو','🥋','Je pratique le judo.','le'],['le rugby','الرجبي','🏉','Je joue au rugby.','au'],['la pêche','صيد السمك','🎣','Je pratique la pêche.','la'],['la voile','الإبحار','⛵','Je fais de la voile.','de la'],['la gymnastique','الجمباز','🤸','Je fais de la gymnastique.','de la'],['les échecs','الشطرنج','♟️','Je joue aux échecs.','aux'],['la marche','المشي','🚶','Je fais de la marche.','de la'],['la randonnée','التنزه','🥾','Je fais de la randonnée.','de la']],
conv:[['Sara','Quel sport pratiques-tu ?','ما الرياضة التي تمارسها؟'],['Adam','Je pratique le football.','أنا أمارس كرة القدم.'],['Sara',"Qu'est-ce que tu préfères ?",'ماذا تفضل؟'],['Adam','Je préfère le tennis.','أفضل التنس.'],['Sara','Où pratiques-tu ton sport préféré ?','أين تمارس رياضتك المفضلة؟'],['Adam','Je le pratique au club.','أمارسها في النادي.'],['Sara','Tu fais du sport ?','هل تمارس الرياضة؟'],['Adam','Oui, je fais de la natation.','نعم، أمارس السباحة.']]};
const steps=[['intro','🚀','البداية'],['vocab','🖼️','المفردات'],['pron','🎧','النطق'],['grammar','📘','القواعد'],['conv','💬','المحادثة'],['video','🎬','الفيديو'],['practice','🎯','التدريب'],['games','🎮','الألعاب'],['review','🧠','المراجعة الذكية'],['assessment','🏆','التقييم'],['progress','📈','التقدم']];let idx=0,wrong=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function speak(text){text=String(text||'').trim();if(!text||!window.speechSynthesis||!window.SpeechSynthesisUtterance)return;const synth=window.speechSynthesis;const normalize=t=>t.replace(/[’‘]/g,"'").replace(/'/g,' ');const make=(value,fallback)=>{const u=new SpeechSynthesisUtterance(value);u.lang='fr-FR';u.rate=.82;u.pitch=1;u.volume=1;const vs=synth.getVoices();const v=vs.find(x=>String(x.lang).toLowerCase()==='fr-fr')||vs.find(x=>String(x.lang).toLowerCase().startsWith('fr'));if(v)u.voice=v;u.onerror=()=>{if(fallback&&fallback!==value){synth.cancel();const f=new SpeechSynthesisUtterance(fallback);f.lang='fr-FR';f.rate=.82;f.pitch=1;f.volume=1;synth.resume();synth.speak(f)}};return u};const run=()=>{synth.cancel();synth.resume();const fallback=normalize(text);synth.speak(make(text,fallback))};if(synth.getVoices().length)run();else{const once=()=>{synth.removeEventListener('voiceschanged',once);run()};synth.addEventListener('voiceschanged',once);setTimeout(run,350)}}
function go(n){idx=Math.max(0,Math.min(steps.length-1,n));render();scrollTo({top:0,behavior:'smooth'})}
function answer(btn,ok){const c=btn.closest('.task');c.querySelectorAll('.option').forEach(x=>x.disabled=true);btn.classList.add(ok?'correct':'wrong');c.querySelector('.feedback').textContent=ok?'✅ صحيح!':'❌ راجع القاعدة ثم حاول مرة أخرى.';if(!ok)wrong.push(c.dataset.id||'item')}
function finish(){localStorage.setItem('hm-g9-u1-l1-finished','1');document.getElementById('status').textContent='✅ تم إكمال الدرس وحفظ التقدم.'}
function practiceCard(id,q,opts,ans){return `<article class="task" data-id="${id}"><h3>${q}</h3><div class="options">${opts.map((o,i)=>`<button class="option" onclick="answer(this,${i===ans})">${o}</button>`).join('')}</div><div class="feedback"></div></article>`}
function render(){document.getElementById('nav').innerHTML=steps.map((s,i)=>`<button class="${i===idx?'active':''}" onclick="go(${i})">${s[1]} ${s[2]}</button>`).join('');let h='';const v=data.vocab;
if(idx===0)h=`<h2>🚀 ضربة البداية</h2><p>هذا الدرس يطبق رحلة التعلم الكاملة على بيانات <b>Les sports</b>: مفردات → نطق → قواعد → محادثة → فيديو → تدريب → ألعاب → مراجعة ذكية → تقييم → تقدم.</p><div class="note"><b>🎯 أهداف الدرس</b><br>التعرف على 20 رياضة، نطقها مع أدوات التعريف، استعمال <b>faire de / jouer à / pratiquer</b>، والتحدث عن الرياضة المفضلة.</div>`;
if(idx===1)h=`<h2>🖼️ المفردات</h2><p>كل كلمة لها <b>صورة/رسمة مستقلة مرتبطة بالرياضة نفسها</b>، وترجمة، ومثال كامل، وزران مستقلان: نطق الكلمة ونطق المثال.</p><div class="cards">${v.map(x=>`<article class="card"><div class="sport-art" aria-label="${esc(x[0])}">${x[2]}</div><div class="fr">${esc(x[0])}</div><div class="ar">${esc(x[1])}</div><div class="example">${esc(x[3])}</div><button class="btn primary" onclick='speak(${JSON.stringify(x[0])})'>🔊 نطق الكلمة</button><button class="btn secondary" onclick='speak(${JSON.stringify(x[3])})'>▶ نطق المثال</button></article>`).join('')}</div>`;
if(idx===2)h=`<h2>🎧 صفحة النطق</h2><p>النطق هنا ليس مجرد زر. كل كلمة لها ملاحظة صوتية خاصة بها، مع تشغيل مستقل للكلمة والمثال.</p><div class="cards">${v.map((x,i)=>`<article class="card"><div class="fr">${esc(x[0])}</div><div class="ar">${esc(x[1])}</div><div class="note"><b>ملاحظة النطق:</b> انطق أداة التعريف مع الكلمة كوحدة واحدة، وانتبه إلى الصوت الفرنسي في نهاية الكلمة وعدم نطق الحروف الصامتة المعتادة.</div><button class="btn primary" onclick='speak(${JSON.stringify(x[0])})'>🔊 استمع</button><button class="btn secondary" onclick='speak(${JSON.stringify(x[3])})'>▶ استمع للمثال</button></article>`).join('')}</div>`;
if(idx===3)h=`<h2>📘 القواعد</h2><p>نفس منطق صفحة القواعد في الدرس المرجعي: شرح مختصر، ثم أمثلة، ثم اختيار التركيب الصحيح.</p><div class="grammar"><div class="formula"><b>FAIRE + DE</b><p>faire du football · faire de la natation · faire de l'équitation</p></div><div class="formula"><b>PRATIQUER + LE/LA/L'/LES</b><p>pratiquer le karaté · pratiquer la boxe · pratiquer l'escrime</p></div><div class="formula"><b>JOUER + À</b><p>jouer au tennis · jouer au rugby · jouer aux échecs</p></div></div>${practiceCard('g1','اختر: Je ___ de la natation.', ['joue','fais','pratique à'],1)}${practiceCard('g2','اختر: Je ___ le karaté.', ['pratique','fais à','joue de'],0)}${practiceCard('g3','اختر: Je ___ aux échecs.', ['fais','pratique de','joue'],2)}`;
if(idx===4)h=`<h2>💬 المحادثة</h2><p>استمع لكل سطر منفردًا، ثم اقرأ الترجمة، ثم أعد الحوار كاملًا.</p>${data.conv.map(x=>`<div class="dialogue"><b>${x[0]}</b> — <span dir="ltr">${esc(x[1])}</span><br><span>${esc(x[2])}</span><br><button class="btn secondary" onclick='speak(${JSON.stringify(x[1])})'>🔊 نطق السطر</button></div>`).join('')}<button class="btn primary" onclick='speak(${JSON.stringify(data.conv.map(x=>x[1]).join(' '))})'>▶ تشغيل الحوار كاملًا</button>`;
if(idx===5)h=`<h2>🎬 فيديو الدرس</h2><p>تم اختيار فيديو تعليمي مناسب مباشرة لموضوع الرياضات باللغة الفرنسية، وليس فيديوًّا عامًا بلا علاقة بالدرس.</p><div class="video"><iframe src="https://www.youtube.com/embed/pnmoexHphZ0" title="Apprendre les sports en français" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div><div class="note" style="margin-top:12px">🎯 مهمة المشاهدة: دوّن 5 رياضات تسمعها في الفيديو، ثم عد إلى صفحة المفردات واستمع إلى نطقها.</div>`;
if(idx===6)h=`<h2>🎯 صفحة التدريب</h2><p>التدريب متعدد المهارات: معنى، اختيار الرياضة، الأدوات، والتمييز بين <b>faire / jouer / pratiquer</b>.</p>${practiceCard('p1','ما معنى la randonnée؟',['التزلج','التنزه','الملاكمة'],1)}${practiceCard('p2','أكمل: Je joue ___ tennis.',['au','de la','le'],0)}${practiceCard('p3','أكمل: Je fais ___ boxe.',['du','de la','aux'],1)}${practiceCard('p4','اختر الجملة الصحيحة.',['Je pratique au karaté.','Je pratique le karaté.','Je joue de karaté.'],1)}${practiceCard('p5','أي جملة تناسب les échecs؟',['Je joue aux échecs.','Je fais des échecs.','Je pratique aux échecs.'],0)}${practiceCard('p6','أكمل: Je fais ___ équitation.',['du','de l’','au'],1)}${practiceCard('p7','اختر التعبير الصحيح مع la natation.',['jouer à la natation','faire de la natation','pratiquer de la natation'],1)}`;
if(idx===7)h=`<h2>🎮 الألعاب</h2><p>الألعاب ليست أسئلة اختيار فقط؛ هنا ثلاث مهام قصيرة: مطابقة، تصنيف، وتحدي سريع.</p><h3>🧠 لعبة المطابقة</h3><div class="memory" id="mem"></div><h3>🏅 التصنيف السريع</h3>${practiceCard('game1','أي مجموعة صحيحة؟',['jouer au tennis · faire de la natation · pratiquer la boxe','jouer de tennis · faire la boxe · pratiquer de la natation','jouer la natation · faire aux échecs · pratiquer au rugby'],0)}<h3>⚡ التحدي</h3>${practiceCard('game2','أي تركيب يطابق les échecs؟',['faire du','jouer aux','pratiquer de'],1)}`;
if(idx===8)h=`<h2>🧠 المراجعة الذكية</h2><p>هذه الصفحة تعيد النقاط التي تحتاج مراجعتها بدل إعادة الدرس كله.</p><div class="note"><b>🔁 أولويات المراجعة</b><br>1. أدوات التعريف مع أسماء الرياضات.<br>2. الفرق بين faire de و jouer à و pratiquer.<br>3. نطق الكلمات ثم استخدامها في جملة كاملة.</div><div class="goal" style="margin-top:12px">${wrong.length?`لقد أخطأت في ${wrong.length} محاولة أثناء هذه الجلسة؛ أعد أسئلة التدريب المرتبطة بالقواعد قبل التقييم.`:'لم تُسجّل أخطاء حتى الآن. جرّب النطق بصوتك ثم انتقل للتقييم.'}</div>`;
if(idx===9)h=`<h2>🏆 التقييم النهائي</h2><p>التقييم يقيس المعرفة والتطبيق، وليس الحفظ فقط.</p>${practiceCard('a1','سمِّ هذه الرياضة: 🏀',['le basket-ball','la boxe','le rugby'],0)}${practiceCard('a2','اختر: Je ___ du ski.',['fais','joue à','pratique de'],0)}${practiceCard('a3','اختر: Je ___ l’escrime.',['fais de','pratique','joue au'],1)}${practiceCard('a4','اختر: Je ___ aux échecs.',['fais','joue','pratique de'],1)}${practiceCard('a5','ما الجملة الصحيحة؟',['Je fais de la natation.','Je joue de la natation.','Je pratique de la natation.'],0)}<button class="btn primary" onclick="finish()">🏁 إنهاء الدرس</button>`;
if(idx===10)h=`<h2>📈 التقدم</h2><p>اكتملت بنية الرحلة الكاملة للدرس.</p><div class="score">${localStorage.getItem('hm-g9-u1-l1-finished')?'100% — الدرس مكتمل':'قيد التعلّم — أكمل التقييم ثم اضغط إكمال الدرس'}</div><div class="progress" style="margin-top:14px"><i style="width:${localStorage.getItem('hm-g9-u1-finished')?'100':'91'}%"></i></div><div class="note" style="margin-top:14px">المصدر التعليمي: الصف الثالث الإعدادي، الوحدة الأولى، Les sports، الصفحات 16–20.</div>`;
document.getElementById('panel').innerHTML=h;if(idx===7)initMemory()}
function initMemory(){const items=[['⚽','le football'],['🏊','la natation'],['🎾','le tennis'],['🏀','le basket-ball'],['🥊','la boxe'],['⛵','la voile']];const all=[...items.map(x=>x[0]),...items.map(x=>x[1])].sort(()=>Math.random()-.5);let first=null;document.getElementById('mem').innerHTML=all.map((x,i)=>`<button data-v="${esc(x)}" onclick="mem(this)">❓</button>`).join('')}
function mem(btn){if(btn.textContent!=='❓')return;btn.textContent=btn.dataset.v;const open=[...document.querySelectorAll('#mem button')].filter(x=>x.textContent!=='❓'&&!x.dataset.matched);if(open.length===2){const a=open[0].dataset.v,b=open[1].dataset.v;const pairs=[['⚽','le football'],['🏊','la natation'],['🎾','le tennis'],['🏀','le basket-ball'],['🥊','la boxe'],['⛵','la voile']];const ok=pairs.some(p=>p.includes(a)&&p.includes(b));if(ok){open.forEach(x=>x.dataset.matched='1')}else setTimeout(()=>open.forEach(x=>x.textContent='❓'),650)}}
render();
</script></body></html>
