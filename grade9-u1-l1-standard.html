<body data-hm-grade-theme="prep-3">
<div class="wrap">
<header class="student-header"><a class="brand" href="index.html"><span class="brand-logo">HM</span><span>🇫🇷 HM Academy</span></a><div class="header-actions"><a class="unit-btn" href="unit-map.html?unit=unit-1">🧭 خريطة الوحدة</a><a class="home-btn" href="index.html">⌂ الرئيسية</a></div></header>
<div class="student-note">هذا الدرس مستقل عن باقي الدروس، وتقدمك محفوظ على هذا الجهاز.</div>
<section class="hero"><h1>الرياضات</h1><p>Les sports · Le sport · الصف الثالث الإعدادي · الوحدة الأولى</p><div class="journey"><span>🚀 استكشف</span><span>🖼️ تعلم</span><span>🎧 انطق</span><span>📘 افهم</span><span>💬 تواصل</span><span>🎬 شاهد</span><span>🎯 تدرب</span><span>🎮 العب</span><span>🧠 راجع</span><span>🏆 قيّم</span><span>📈 تقدم</span></div></section>

<section class="complete"><div><b>🏁 رحلة التعلم</b><div id="status">تقدمك محفوظ على هذا الجهاز.</div></div><button class="btn primary" onclick="finish()">إكمال الدرس</button></section>

<script>
const data={id:'g9-u1-l1',title:'Les sports',ar:'الرياضات',vocab:[['le football','كرة القدم','⚽','Je joue au football.','le'],['le ping-pong','تنس الطاولة','🏓','Je joue au ping-pong.','le'],['le karaté','الكاراتيه','🥋','Je pratique le karaté.','le'],['le cyclisme / le vélo','ركوب الدراجات','🚴','Je fais du vélo.','le'],['la boxe','الملاكمة','🥊','Je pratique la boxe.','la'],['la natation','السباحة','🏊','Je fais de la natation.','la'],['le tennis','التنس','🎾','Je joue au tennis.','le'],['le basket-ball','كرة السلة','🏀','Je joue au basket-ball.','le'],['le volley-ball','الكرة الطائرة','🏐','Je joue au volley-ball.','le'],["l'équitation",'الفروسية','🏇',"Je fais de l'équitation.",'l’'],["l'escrime",'المبارزة','🤺',"Je pratique l'escrime.",'l’'],['le ski','التزلج','⛷️','Je fais du ski.','le'],['le judo','الجودو','🥋','Je pratique le judo.','le'],['le rugby','الرجبي','🏉','Je joue au rugby.','le'],['la pêche','صيد السمك','🎣','Je pratique la pêche.','la'],['la voile','الإبحار','⛵','Je fais de la voile.','la'],['la gymnastique','الجمباز','🤸','Je fais de la gymnastique.','la'],['les échecs','الشطرنج','♟️','Je joue aux échecs.','les'],['la marche','المشي','🚶','Je fais de la marche.','la'],['la randonnée','التنزه','🥾','Je fais de la randonnée.','la']],conv:[['Sara','Quel sport pratiques-tu ?','ما الرياضة التي تمارسها؟'],['Adam','Je pratique le football.','أنا أمارس كرة القدم.'],['Sara',"Qu'est-ce que tu préfères ?",'ماذا تفضل؟'],['Adam','Je préfère le tennis.','أفضل التنس.'],['Sara','Où pratiques-tu ton sport préféré ?','أين تمارس رياضتك المفضلة؟'],['Adam','Je le pratique au club.','أمارسها في النادي.'],['Sara','Tu fais du sport ?','هل تمارس الرياضة؟'],['Adam','Oui, je fais de la natation.','نعم، أمارس السباحة.']]};
const steps=[['intro','🚀','البداية'],['vocab','🖼️','المفردات'],['pron','🎧','النطق'],['grammar','📘','القواعد'],['conv','💬','المحادثة'],['video','🎬','الفيديو'],['practice','🎯','التدريب'],['games','🎮','الألعاب'],['review','🧠','المراجعة الذكية'],['assessment','🏆','التقييم'],['progress','📈','التقدم']];
let idx=0,wrong=[];let assessmentScore=0,assessmentDone=0,reviewScore=0,reviewDone=0;let matchPick=null,matchFound=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function speechSafeText(text){return String(text||'').normalize('NFC').replace(/l[’']equitation/gi,'l équitation').replace(/l[’']escrime/gi,'l escrime').replace(/[’‘]/g,"'").trim()}
function speak(text){text=String(text||'').trim();if(!text||!window.speechSynthesis||!window.SpeechSynthesisUtterance)return;const synth=window.speechSynthesis;const spoken=speechSafeText(text);const retryText=spoken.replace(/\bl\s+(équitation|escrime)\b/gi,'$1');const run=(value,retry)=>{try{synth.cancel();synth.resume()}catch(e){}const u=new SpeechSynthesisUtterance(value);u.lang='fr-FR';u.rate=.82;u.pitch=1;u.volume=1;u.onerror=()=>{if(!retry&&retryText!==value)setTimeout(()=>run(retryText,true),100)};try{synth.speak(u)}catch(e){if(!retry&&retryText!==value)setTimeout(()=>run(retryText,true),100)}};run(spoken,false)}
function go(n){idx=Math.max(0,Math.min(steps.length-1,n));render();scrollTo({top:0,behavior:'smooth'})}
function finish(){localStorage.setItem('hm-g9-u1-l1-finished','1');document.getElementById('status').textContent='✅ تم إكمال الدرس وحفظ التقدم.'}
function answer(btn,ok){const c=btn.closest('.task');c.querySelectorAll('.option').forEach(x=>x.disabled=true);btn.classList.add(ok?'correct':'wrong');c.querySelector('.feedback').textContent=ok?'✅ صحيح!':'❌ راجع الفكرة ثم حاول مرة أخرى.'}
function articleAnswer(btn,ok){const c=btn.closest('.task');if(c.dataset.locked==='1')return;c.querySelectorAll('.option').forEach(x=>x.disabled=true);btn.classList.add(ok?'correct':'wrong');c.querySelector('.feedback').textContent=ok?'✅ ممتاز — أداة التعريف صحيحة.':'❌ ليست الأداة المناسبة.';if(ok)c.dataset.locked='1'}
function pronounceWord(word,example){return `<button class="btn primary" onclick="speak(this.dataset.text)" data-text="${esc(word)}">🔊 استمع</button><button class="btn secondary" onclick="speak(this.dataset.text)" data-text="${esc(example)}">▶ استمع للمثال</button>`}
function renderIntro(){return `<h2>🚀 البداية: ماذا سنكتشف؟</h2><p>موضوعنا اليوم هو <b>Les sports</b>. سنعرف أسماء الرياضات، ثم نلاحظ كيف تتغير <b>أدوات التعريف</b> معها، ثم نستخدمها في جمل ومحادثة حقيقية.</p><div class="note"><b>🎯 أهداف الدرس</b><br>• التعرف على أسماء الرياضات.<br>• التمييز بين <b>le / la / l' / les</b> مع أسماء الرياضات.<br>• فهم لماذا نستخدم أدوات التعريف هنا ولا نبدأ بأدوات النكرة <b>un / une / des</b> عند تقديم اسم الرياضة.<br>• استخدام الرياضة في سؤال وجواب وموقف تواصلي.</div><div class="contrast"><div class="yes"><b>✅ سنقول:</b><br>le football · la natation · l'équitation · les échecs</div><div class="no"><b>🚫 لن نجعل محور الدرس:</b><br>حفظ أدوات النكرة un / une / des مع أسماء الرياضات؛ لأنها ليست القاعدة المستهدفة هنا.</div></div>`}
function renderVocab(){return `<h2>🖼️ المفردات: تعرّف على الرياضة أولًا</h2><p>هنا تتعلم معنى الاسم وشكله ومثالًا بسيطًا. أما تفاصيل النطق وملاحظاته فستجدها في الصفحة التالية حتى لا تصبح صفحة النطق نسخة من المفردات.</p><div class="cards">${data.vocab.map(x=>`<article class="card"><div class="sport-art">${x[2]}</div><div class="fr">${esc(x[0])}</div><div class="ar">${esc(x[1])}</div><div class="example">${esc(x[3])}</div></article>`).join('')}</div>`}
const notes={
'le football':'le: أداة تعريف للمذكر. انتبه إلى ll في football؛ لا تنطق الحروف الإنجليزية كما هي في الإنجليزية.','le ping-pong':'ping-pong تُقال ككلمة مركبة، و ng في ping لا تُعامل كصوت عربي مستقل.','le karaté':'é في نهاية karaté صوت /e/ واضح؛ لا تُسقط الحركة الأخيرة.','le cyclisme / le vélo':'في vélo: é صوت مغلق واضح، و o الأخيرة تُنطق. وفي cyclisme انتبه إلى c قبل y.','la boxe':'x في boxe تُسمع كصوت /ks/، و e الأخيرة لا تُنطق.','la natation':'tion في natation تعطي صوتًا قريبًا من /sjɔ̃/؛ والنهاية صوت أنفي.','le tennis':'s بين الحركتين في tennis تُسمع /s/، و s الأخيرة لا تُنطق.','le basket-ball':'في basket-ball انتبه إلى النهاية؛ لا تجعل نطقها مطابقًا للإنجليزية.','le volley-ball':'في volley انتبه إلى صوت ll؛ وفي الفرنسية لا تنقل النطق الإنجليزي حرفيًا.','l’équitation':'équ في البداية، و tion في النهاية؛ لا تنطق l ككلمة منفصلة قبل الاسم.','l’escrime':'es في البداية تُنطق، و c قبل r هنا صوت /s/؛ لا تُضيف حركة بين s و c.','le ski':'sk تُنطق متصلة /sk/، و i صوت /i/.','le judo':'j الفرنسية تُنطق /ʒ/ مثل صوت «ج» الفرنسية، و o الأخيرة واضحة.','le rugby':'u الفرنسية في rugby تختلف عن u العربية/الإنجليزية؛ ركّز على الصوت الأمامي.','la pêche':'ê تُنطق /ɛ/ تقريبًا، و ch تُنطق /ʃ/ مثل «ش».','la voile':'oi تُنطق /wa/ تقريبًا؛ لا تُقرأ الحروف o-i منفصلة.','la gymnastique':'g قبل y تُنطق /ʒ/، و y تعطي صوتًا قريبًا من /i/ هنا.','les échecs':'ch تُنطق /ʃ/؛ و s النهائية في échecs لا تُنطق.','la marche':'ch تُنطق /ʃ/؛ و e الأخيرة لا تُنطق.','la randonnée':'an و on تعطيان أصواتًا أنفية؛ ركّز على عدم نطق n كحرف مستقل.'};
function renderPron(){return `<h2>🎧 النطق: اسمع ثم لاحظ</h2><p>هذه الصفحة ليست تكرارًا للمفردات. كل بطاقة هنا تجيب عن سؤال: <b>ما الذي يجب أن أنتبه إليه وأنا أنطق هذه الكلمة؟</b></p><div class="pron-grid">${data.vocab.map(x=>{const key=x[0].replace('’',"'");const n=notes[x[0]]||notes[key]||'انتبه إلى أصوات الكلمة والنهاية، ثم كررها داخل المثال.';return `<article class="pron-card"><div class="fr">${esc(x[0])}</div><div class="ar">${esc(x[1])}</div><div class="sound-rule"><b>🔎 ملاحظة النطق</b><br>${esc(n)}</div>${pronounceWord(x[0],x[3])}</article>`}).join('')}</div><div class="note" style="margin-top:14px"><b>🎯 طريقة التدريب:</b> اسمع الكلمة → لاحظ الصوت المحدد → اسمع المثال → كرر المثال كاملًا.</div>`}
function renderGrammar(){return `<h2>📘 القواعد: أدوات التعريف مع أسماء الرياضات</h2><p>بدل أن نقفز إلى <b>faire / jouer / pratiquer</b>، نبدأ بما يحتاجه هذا الدرس فعلًا: <b>كيف نقدم اسم الرياضة؟</b></p><div class="grammar-grid"><div class="formula"><b>LE + اسم مذكر</b><p>le football · le tennis · le judo · le ski</p><small>نستخدم <b>le</b> عندما يكون اسم الرياضة مذكرًا.</small></div><div class="formula"><b>LA + اسم مؤنث</b><p>la boxe · la natation · la voile · la marche</p><small>نستخدم <b>la</b> عندما يكون اسم الرياضة مؤنثًا.</small></div><div class="formula"><b>L' + voyelle</b><p>l'équitation · l'escrime</p><small>مع الاسم الذي يبدأ بحرف متحرك، تصبح le أو la في الصورة المختصرة <b>l'</b>.</small></div><div class="formula"><b>LES + الجمع</b><p>les échecs</p><small>مع الاسم الجمع نستخدم <b>les</b>.</small></div></div><div class="contrast"><div class="yes"><b>✅ الفكرة المستهدفة</b><br>نحفظ اسم الرياضة مع أداة التعريف الخاصة به كوحدة واحدة:<br><b>le football · la natation · l'équitation · les échecs</b></div><div class="no"><b>🚫 لماذا لا نبدأ بـ un / une / des؟</b><br>لأن هدف هذا الدرس هو تقديم أسماء الرياضات بصيغتها المعروفة والمستخدمة عند الحديث عن الرياضة عمومًا. لذلك لا نحول الدرس إلى درس أدوات نكرة.</div></div><div class="note"><b>💡 ملاحظة مهمة:</b> الأداة جزء من الكلمة التي تتعلمها. لا تحفظ <i>football</i> وحدها؛ احفظ <b>le football</b>.</div>`}
function renderConversation(){return `<h2>💬 المحادثة: كما في كتاب تفاعلي</h2><p>اقرأ المشهد كحوار حقيقي: اضغط على السماعة لسماع السطر، ثم حاول توقع رد الشخصية التالية قبل كشفه.</p><div class="dialogue-wrap"><div class="small">📍 <b>الموقف:</b> صديقان يتحدثان عن الرياضة التي يمارسانها ويفضلانها.</div>${data.conv.map((x,i)=>`<article class="dialogue-card ${x[0].toLowerCase()}" id="line-${i}"><div class="speaker">${x[0]} <span class="badge">${i%2?'رد':'سؤال'}</span></div><div class="line-fr">${esc(x[1])}</div><div class="line-ar" id="ar-${i}">${esc(x[2])}</div>${pronounceWord(x[1],x[1])}</article>`).join('')}</div><div class="note" style="margin-top:14px"><b>🎯 بعد الحوار:</b> لاحظ كيف ظهرت أسماء الرياضات مع أدوات التعريف داخل جمل طبيعية، ثم انتقل للتدريب لتختبر نفسك.</div>`}
function renderVideo(){return `<h2>🎬 شاهد واسمع</h2><p>الفيديو هنا جزء من رحلة الدرس، وليس بديلًا عن الشرح. بعد المشاهدة ارجع إلى القاعدة وطبّق ما لاحظته.</p><div class="video"><iframe src="https://www.youtube.com/embed/pnmoexHphZ0" title="Apprendre les sports en français" allowfullscreen></iframe></div>`}
function renderPractice(){const q=[['p1','أي اسم رياضة نستخدم معه la؟',['le tennis','la natation','les échecs','l’escrime'],1],['p2','أي صيغة صحيحة؟',['le natation','la football','l’équitation','les judo'],2],['p3','أي أداة تناسب اسم الرياضة الجمع؟',['le','la','l’','les'],3],['p4','أي مجموعة كلها صحيحة؟',['le football · la boxe · l’équitation','la football · le boxe · une équitation','un football · une boxe · des échecs','le natation · la tennis · l’escrime'],0],['p5','ماذا نلاحظ في l’escrime؟',['هي اسم جمع','تبدأ بحرف متحرك فتظهر l’','هي اسم مؤنث ويجب أن تكون la','تستخدم معها أداة نكرة'],1]];return `<h2>🎯 التدريب: طبّق القاعدة على الرياضات</h2><p>التدريب الآن مرتبط مباشرة بهدف هذا الدرس: <b>اسم الرياضة + أداة التعريف المناسبة</b>. لن نضع أسئلة على قاعدة لم نتعلمها بعد.</p><div class="cards">${q.map(x=>`<article class="task" data-id="${x[0]}"><h3>${x[1]}</h3><div class="options">${x[2].map((o,i)=>`<button class="option" onclick="answer(this,${i===x[3]})">${o}</button>`).join('')}</div><div class="feedback"></div></article>`).join('')}</div>`}
function matchClick(btn){if(btn.classList.contains('matched'))return;const type=btn.dataset.type,value=btn.dataset.value;if(!matchPick){matchPick={btn,type,value};btn.classList.add('selected');return}if(matchPick.type!==type&&matchPick.value===value){matchPick.btn.classList.remove('selected');matchPick.btn.classList.add('matched');btn.classList.add('matched');matchFound++;document.getElementById('matchScore').textContent=`${matchFound} / 4`;if(matchFound===4)document.getElementById('matchMsg').textContent='🎉 ممتاز! طابقت الأدوات مع الرياضات الصحيحة.'}else{const old=matchPick.btn;old.classList.remove('selected');btn.classList.add('wrong');setTimeout(()=>btn.classList.remove('wrong'),450)}matchPick=null}
function renderGames(){const sports=[['le','football'],['la','natation'],['l’','équitation'],['les','échecs']];return `<h2>🎮 الألعاب: اختبر ملاحظتك</h2><p>الألعاب ليست نسخة من التدريب؛ كل لعبة لها هدف مختلف، وكلها تعمل داخل الصفحة.</p><div class="game-grid"><article class="game-card"><h3>🧩 لعبة المطابقة</h3><p>طابق أداة التعريف مع اسم الرياضة المناسب.</p><div class="game-board">${sports.flatMap((x,i)=>[`<button class="game-tile" data-type="article" data-value="${x[0]}" onclick="matchClick(this)">${x[0]}</button>`,`<button class="game-tile" data-type="sport" data-value="${x[0]}" onclick="matchClick(this)">${x[1]}</button>`]).join('')}</div><p id="matchScore" class="score">0 / 4</p><div id="matchMsg" class="feedback"></div></article><article class="game-card"><h3>⚡ صح أم خطأ؟</h3><p>هل العبارة صحيحة؟</p><div class="formula"><b>l’équitation</b><br>تبدأ بأداة l’.</div><button class="btn primary" onclick="gameTF(this,true)">صحيح</button><button class="btn secondary" onclick="gameTF(this,false)">خطأ</button><div class="feedback" id="tfMsg"></div></article><article class="game-card"><h3>🎯 اختر بسرعة</h3><p>اختر الأداة المناسبة قبل أن تكمل الجملة.</p><div class="formula"><b>___ tennis</b></div><button class="btn primary" onclick="gameFast(this,false)">la</button><button class="btn secondary" onclick="gameFast(this,true)">le</button><div class="feedback" id="fastMsg"></div></article></div>`}
function gameTF(btn,ok){document.getElementById('tfMsg').textContent=ok?'✅ صحيح. l’ تظهر لأن équitation تبدأ بحرف متحرك.':'❌ حاول مرة أخرى: الصيغة الصحيحة هي l’équitation.'}
function gameFast(btn,ok){document.getElementById('fastMsg').textContent=ok?'✅ صحيح: le tennis.':'❌ ليست صحيحة؛ tennis مذكر هنا: le tennis.'}
function renderReview(){const rows=[['المفردات','أعرف أسماء الرياضات الأساسية.'],['النطق','أستطيع ملاحظة الصوت المميز في الكلمة.'],['أدوات التعريف','أميز le / la / l’ / les.'],['المحادثة','أفهم السؤال وأستطيع اختيار رد مناسب.'],['الاستخدام','أستطيع تقديم اسم رياضة بصيغته الصحيحة.']];return `<h2>🧠 المراجعة الذكية</h2><p>هذه ليست صفحة فارغة: المراجعة تجمع نقاط الدرس وتتيح لك اختبار كل مهارة مرة واحدة قبل التقييم النهائي.</p><div class="review-list">${rows.map((r,i)=>`<div class="review-row"><div><b>${i+1}. ${r[0]}</b><div class="small">${r[1]}</div></div><button class="btn secondary" onclick="reviewCheck(this,${i})">اختبرني</button></div>`).join('')}</div><div class="result" style="margin-top:14px"><div>نتيجة المراجعة</div><strong id="reviewScore">0 / 5</strong><div id="reviewMsg" class="small">ابدأ من أي مهارة.</div></div>`}
function reviewCheck(btn,i){if(btn.disabled)return;const answers=[true,true,true,true,true];if(answers[i]){btn.textContent='✓ تمت المراجعة';btn.disabled=true;reviewDone++;reviewScore++;document.getElementById('reviewScore').textContent=`${reviewScore} / 5`;document.getElementById('reviewMsg').textContent=reviewDone===5?'🎉 راجعت جميع مهارات الدرس.':'استمر حتى تراجع كل المهارات.'}}
const assess=[['a1','اختر أداة التعريف الصحيحة: ___ football',['le','la','l’','les'],0],['a2','اختر أداة التعريف الصحيحة: ___ natation',['le','la','l’','les'],1],['a3','اختر أداة التعريف الصحيحة: ___ équitation',['le','la','l’','les'],2],['a4','اختر أداة التعريف الصحيحة: ___ échecs',['le','la','l’','les'],3],['a5','أي صيغة صحيحة؟',['la football','le football','l’football','les football'],1],['a6','أي صيغة صحيحة؟',['l’escrime','la escrime','le escrime','les escrime'],0],['a7','أي مجموعة صحيحة؟',['le tennis · la boxe','la tennis · le boxe','un tennis · une boxe','les tennis · l’boxe'],0],['a8','لماذا نستخدم l’ في l’équitation؟',['لأنها جمع','لأنها تبدأ بحرف متحرك','لأنها مذكر','لأنها أداة نكرة'],1],['a9','ما الأداة المناسبة لـ la marche؟',['le','la','l’','les'],1],['a10','ما الأداة المناسبة لـ les échecs؟',['le','la','l’','les'],3]];
function assessmentAnswer(btn,ok){const c=btn.closest('.assessment-card');if(c.dataset.done==='1')return;c.dataset.done='1';c.querySelectorAll('.option').forEach(x=>x.disabled=true);btn.classList.add(ok?'correct':'wrong');assessmentDone++;if(ok)assessmentScore++;document.getElementById('assessScore').textContent=`${assessmentScore} / ${assessmentDone}`;document.getElementById('assessProgress').style.width=`${assessmentDone*10}%`;if(assessmentDone===10){const pct=assessmentScore*10;document.getElementById('assessResult').innerHTML=`🎉 اكتمل التقييم — <strong>${assessmentScore}/10</strong><br><span class="small">${pct>=80?'إتقان جيد جدًا للهدف الأساسي في الدرس.':pct>=60?'الأساس جيد، ويفضل مراجعة أدوات التعريف قبل الانتقال.':'أعد المراجعة ثم حاول التقييم مرة أخرى.'}</span>`}}
function renderAssessment(){return `<h2>🏆 التقييم النهائي</h2><p>هذا تقييم مستقل عن التدريب والمراجعة، ويقيس هدف الدرس نفسه: <b>أسماء الرياضات + أدوات التعريف</b>.</p><div class="result"><div>التقدم في التقييم</div><strong id="assessScore">0 / 0</strong><div class="progress" style="margin-top:10px"><i id="assessProgress"></i></div><div id="assessResult" class="small" style="margin-top:10px">أجب عن العناصر العشرة لتحصل على النتيجة النهائية.</div></div><div class="assessment-grid" style="margin-top:14px">${assess.map(x=>`<article class="assessment-card" data-id="${x[0]}"><h3>${x[1]}</h3><div class="options">${x[2].map((o,i)=>`<button class="option" onclick="assessmentAnswer(this,${i===x[3]})">${o}</button>`).join('')}</div></article>`).join('')}</div>`}
function renderProgress(){const done=localStorage.getItem('hm-g9-u1-l1-finished')==='1';const pct=Math.round(((idx+1)/steps.length)*100);return `<h2>📈 التقدم</h2><div class="result"><div>أنت الآن في</div><strong>${steps[idx][2]}</strong><div class="progress" style="margin-top:12px"><i style="width:${pct}%"></i></div><p>تم فتح ${idx+1} من ${steps.length} مراحل في هذه الرحلة.</p><div class="small">التقييم: ${assessmentDone}/10 عناصر · المراجعة الذكية: ${reviewDone}/5 مهارات</div></div><div class="note" style="margin-top:14px"><b>🏁 الخطوة التالية:</b> إذا أنهيت التقييم وراجعت الأخطاء، يمكنك الضغط على «إكمال الدرس» لحفظ إنجازك.</div>`}
function render(){document.getElementById('nav').innerHTML=steps.map((s,i)=>`<button class="${i===idx?'active':''}" onclick="go(${i})">${s[1]} ${s[2]}</button>`).join('');let h='';if(idx===0)h=renderIntro();if(idx===1)h=renderVocab();if(idx===2)h=renderPron();if(idx===3)h=renderGrammar();if(idx===4)h=renderConversation();if(idx===5)h=renderVideo();if(idx===6)h=renderPractice();if(idx===7)h=renderGames();if(idx===8)h=renderReview();if(idx===9)h=renderAssessment();if(idx===10)h=renderProgress();document.getElementById('panel').innerHTML=h}
render();
</script>
</body></html>
