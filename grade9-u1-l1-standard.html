<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | الصف الثالث الإعدادي — Les sports</title><link rel="stylesheet" href="css/hm-academy-grade-themes.css?v=20260909-grade-themes"><style>body{margin:0;background:#f5f7fb;color:#17223b;font-family:Arial,"Cairo",sans-serif}.wrap{max-width:1120px;margin:auto;padding:16px}.student-header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0f1b33;color:#fff;padding:10px 12px;border-radius:18px;margin-bottom:14px;box-shadow:0 8px 22px #0f1b3325}.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:#fff;font-weight:900}.brand-logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#e92d83);font-weight:1000}.header-actions{display:flex;gap:7px}.home-btn,.unit-btn{display:inline-flex;align-items:center;text-decoration:none;border-radius:12px;padding:10px 12px;font-weight:900;white-space:nowrap}.home-btn{background:#2563eb;color:#fff}.unit-btn{background:#eef3ff;color:#173a82}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff;border-radius:28px;padding:24px}.hero h1{margin:0;font-size:clamp(28px,6vw,42px)}.hero p{line-height:1.8}.journey,.nav{display:flex;gap:7px;overflow:auto}.journey{margin-top:15px}.journey span{background:#ffffff22;border:1px solid #ffffff44;border-radius:999px;padding:8px 12px;white-space:nowrap;font-weight:800}.nav{background:#fff;padding:8px;border-radius:18px;margin:14px 0}.nav button{border:0;background:#eef3ff;color:#173a82;border-radius:12px;padding:10px 13px;font-weight:900;white-space:nowrap;cursor:pointer}.nav button.active{background:#e92d83;color:#fff}.panel{background:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 30px #14264a12}.group{margin-bottom:24px}.group-head{background:linear-gradient(135deg,#f4f7ff,#fff7fb);border:1px solid #dfe6f2;border-radius:18px;padding:16px;margin-bottom:12px}.group-head h3{margin:0;color:#173a82;font-size:24px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px}.card,.task{border:1px solid #e1e6ef;border-radius:18px;padding:15px;background:#fff}.sport-art{height:130px;border-radius:15px;background:#f4f7ff;display:grid;place-items:center;font-size:72px;margin-bottom:10px}.fr{font-weight:900;direction:ltr;text-align:center;font-size:20px}.ar{text-align:center;color:#315aa4;font-weight:800}.example{background:#f7f9fd;border-radius:12px;padding:10px;margin-top:8px;direction:ltr;text-align:center;line-height:1.6}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;margin:5px 3px 0 0}.primary{background:#2563eb;color:#fff}.secondary{background:#edf3ff;color:#173a82}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}.option{padding:12px;border:1px solid #dbe1eb;border-radius:11px;background:#fff;font-weight:800;cursor:pointer}.option.correct{border-color:#20a45a;background:#ecfdf3}.option.wrong{border-color:#e92d83;background:#fff2f8}.feedback{min-height:24px;font-weight:800;margin-top:10px}.dialogue{border-right:4px solid #e92d83;padding:12px;margin:8px 0;background:#fff7fb;border-radius:12px;line-height:1.8}.note{background:#fffaf0;border:1px solid #f2d58b;border-radius:15px;padding:13px;line-height:1.9}.grammar{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.formula{background:#f7f9fd;border-radius:16px;padding:16px}.formula b{display:block;color:#173a82;font-size:20px;direction:ltr}.video{position:relative;padding-top:56.25%;border-radius:18px;overflow:hidden;background:#0f1b33}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.score{font-size:22px;font-weight:900;color:#173a82}.memory{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.memory button{min-height:90px;border:1px solid #dbe1eb;border-radius:15px;background:#fff;font-size:22px;font-weight:900;cursor:pointer}.progress{height:9px;background:#e8edf5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#2563eb}.complete{margin-top:14px;background:#fff;border-radius:20px;padding:17px;display:flex;justify-content:space-between;gap:12px;align-items:center}.student-note{font-size:12px;color:#718096;margin:7px 2px;text-align:right}@media(max-width:650px){.wrap{padding:10px}.complete{display:block}.unit-btn{display:none}.brand-text{font-size:14px}}</style></head><body data-hm-grade-theme="prep-3"><div class="wrap"><header class="student-header"><a class="brand" href="index.html"><span class="brand-logo">HM</span><span>🇫🇷 HM Academy</span></a><div class="header-actions"><a class="unit-btn" href="unit-map.html?unit=unit-1">🧭 خريطة الوحدة</a><a class="home-btn" href="index.html">⌂ الرئيسية</a></div></header><div class="student-note">الدرس مستقل عن باقي الدروس، وتقدمك محفوظ على هذا الجهاز.</div><section class="hero"><h1>الرياضات</h1><p>Les sports · Le sport · الصف الثالث الإعدادي · الوحدة الأولى</p><div class="journey"><span>🚀 استكشف</span><span>🖼️ تعلم</span><span>🎧 انطق</span><span>📘 افهم</span><span>💬 تواصل</span><span>🎬 شاهد</span><span>🎯 تدرب</span><span>🎮 العب</span><span>🧠 راجع</span><span>🏆 قيّم</span><span>📈 تقدم</span></div></section><nav class="nav" id="nav"></nav><section class="panel" id="panel"></section><section class="complete"><div><b>🏁 رحلة التعلم</b><div id="status">التقدم محفوظ على هذا الجهاز.</div></div><button class="btn primary" onclick="finish()">إكمال الدرس</button></section></div><script>
const data={id:'g9-u1-l1',title:'Les sports',ar:'الرياضات',vocab:[['le football','كرة القدم','⚽','Je joue au football.','au'],['le ping-pong','تنس الطاولة','🏓','Je joue au ping-pong.','au'],['le karaté','الكاراتيه','🥋','Je pratique le karaté.','le'],['le cyclisme / le vélo','ركوب الدراجات','🚴','Je fais du vélo.','du'],['la boxe','الملاكمة','🥊','Je pratique la boxe.','la'],['la natation','السباحة','🏊','Je fais de la natation.','de la'],['le tennis','التنس','🎾','Je joue au tennis.','au'],['le basket-ball','كرة السلة','🏀','Je joue au basket-ball.','au'],['le volley-ball','الكرة الطائرة','🏐','Je joue au volley-ball.','au'],["l'équitation",'الفروسية','🏇',"Je fais de l'équitation.",'de l'],["l'escrime",'المبارزة','🤺',"Je pratique l'escrime.",'l'],['le ski','التزلج','⛷️','Je fais du ski.','du'],['le judo','الجودو','🥋','Je pratique le judo.','le'],['le rugby','الرجبي','🏉','Je joue au rugby.','au'],['la pêche','صيد السمك','🎣','Je pratique la pêche.','la'],['la voile','الإبحار','⛵','Je fais de la voile.','de la'],['la gymnastique','الجمباز','🤸','Je fais de la gymnastique.','de la'],['les échecs','الشطرنج','♟️','Je joue aux échecs.','aux'],['la marche','المشي','🚶','Je fais de la marche.','de la'],['la randonnée','التنزه','🥾','Je fais de la randonnée.','de la']],conv:[['Sara','Quel sport pratiques-tu ?','ما الرياضة التي تمارسها؟'],['Adam','Je pratique le football.','أنا أمارس كرة القدم.'],['Sara',"Qu'est-ce que tu préfères ?",'ماذا تفضل؟'],['Adam','Je préfère le tennis.','أفضل التنس.'],['Sara','Où pratiques-tu ton sport préféré ?','أين تمارس رياضتك المفضلة؟'],['Adam','Je le pratique au club.','أمارسها في النادي.'],['Sara','Tu fais du sport ?','هل تمارس الرياضة؟'],['Adam','Oui, je fais de la natation.','نعم، أمارس السباحة.']]};
const steps=[['intro','🚀','البداية'],['vocab','🖼️','المفردات'],['pron','🎧','النطق'],['grammar','📘','القواعد'],['conv','💬','المحادثة'],['video','🎬','الفيديو'],['practice','🎯','التدريب'],['games','🎮','الألعاب'],['review','🧠','المراجعة الذكية'],['assessment','🏆','التقييم'],['progress','📈','التقدم']];let idx=0,wrong=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function speechSafeText(text){return String(text||'').normalize('NFC').replace(/l[’']equitation/gi,'l équitation').replace(/l[’']escrime/gi,'l escrime').replace(/[’‘]/g,"'").trim()}
function speak(text){text=String(text||'').trim();if(!text||!window.speechSynthesis||!window.SpeechSynthesisUtterance)return;const synth=window.speechSynthesis;const spoken=speechSafeText(text);const retryText=spoken.replace(/\bl\s+(équitation|escrime)\b/gi,'$1');const run=(value,retry)=>{try{synth.cancel();synth.resume()}catch(e){}const u=new SpeechSynthesisUtterance(value);u.lang='fr-FR';u.rate=.82;u.pitch=1;u.volume=1;u.onend=()=>{};u.onerror=()=>{if(!retry&&retryText!==value)setTimeout(()=>run(retryText,true),80)};try{synth.speak(u)}catch(e){if(!retry&&retryText!==value)setTimeout(()=>run(retryText,true),80)}};run(spoken,false)}
function go(n){idx=Math.max(0,Math.min(steps.length-1,n));render();scrollTo({top:0,behavior:'smooth'})}
function answer(btn,ok){const c=btn.closest('.task');c.querySelectorAll('.option').forEach(x=>x.disabled=true);btn.classList.add(ok?'correct':'wrong');c.querySelector('.feedback').textContent=ok?'✅ صحيح!':'❌ راجع القاعدة ثم حاول مرة أخرى.';if(!ok)wrong.push(c.dataset.id||'item')}
function finish(){localStorage.setItem('hm-g9-u1-l1-finished','1');document.getElementById('status').textContent='✅ تم إكمال الدرس وحفظ التقدم.'}
function practiceCard(id,q,opts,ans){return `<article class="task" data-id="${id}"><h3>${q}</h3><div class="options">${opts.map((o,i)=>`<button class="option" onclick="answer(this,${i===ans})">${o}</button>`).join('')}</div><div class="feedback"></div></article>`}
function render(){document.getElementById('nav').innerHTML=steps.map((s,i)=>`<button class="${i===idx?'active':''}" onclick="go(${i})">${s[1]} ${s[2]}</button>`).join('');let h='';const v=data.vocab;if(idx===0)h=`<h2>🚀 ضربة البداية</h2><p>هذا الدرس يطبق رحلة التعلم الكاملة على بيانات <b>Les sports</b>: مفردات → نطق → قواعد → محادثة → فيديو → تدريب → ألعاب → مراجعة ذكية → تقييم → تقدم.</p><div class="note"><b>🎯 أهداف الدرس</b><br>التعرف على 20 رياضة، نطقها مع أدوات التعريف، استعمال <b>faire de / jouer à / pratiquer</b>، والتحدث عن الرياضة المفضلة.</div>`;if(idx===1)h=`<h2>🖼️ المفردات</h2><p>كل كلمة لها صورة/رسمة مستقلة، وترجمة، ومثال كامل، وزران مستقلان للنطق.</p><div class="cards">${v.map(x=>`<article class="card"><div class="sport-art" aria-label="${esc(x[0])}">${x[2]}</div><div class="fr">${esc(x[0])}</div><div class="ar">${esc(x[1])}</div><div class="example">${esc(x[3])}</div><button class="btn primary" onclick='speak(${JSON.stringify(x[0])})'>🔊 نطق الكلمة</button><button class="btn secondary" onclick='speak(${JSON.stringify(x[3])})'>▶ نطق المثال</button></article>`).join('')}</div>`;if(idx===2)h=`<h2>🎧 النطق</h2><p>اضغط على أي كلمة أو مثال. تم تجهيز النطق بحيث لا يعتمد على اختيار صوت فرنسي بعينه من الجهاز.</p><div class="cards">${v.map(x=>`<article class="card"><div class="fr">${esc(x[0])}</div><div class="example">${esc(x[3])}</div><button class="btn primary" onclick='speak(${JSON.stringify(x[0])})'>🔊 الكلمة</button><button class="btn secondary" onclick='speak(${JSON.stringify(x[3])})'>▶ المثال</button></article>`).join('')}</div>`;if(idx===3)h=`<h2>📘 القواعد</h2><div class="grammar"><div class="formula"><b>Faire du / de la / de l'</b><p>Je fais du ski. · Je fais de la natation. · Je fais de l'équitation.</p></div><div class="formula"><b>Pratiquer + le / la / l' / les</b><p>Je pratique le karaté. · Je pratique la boxe. · Je pratique l'escrime.</p></div><div class="formula"><b>Jouer à + sport</b><p>Je joue au football. · Je joue aux échecs.</p></div></div>`;if(idx===4)h=`<h2>💬 المحادثة</h2>${data.conv.map(x=>`<div class="dialogue"><b>${x[0]}</b> · <span dir="ltr">${esc(x[1])}</span><br><small>${esc(x[2])}</small><br><button class="btn secondary" onclick='speak(${JSON.stringify(x[1])})'>🔊 استمع</button></div>`).join('')}`;if(idx===5)h=`<h2>🎬 الفيديو</h2><div class="video"><iframe src="https://www.youtube.com/embed/pnmoexHphZ0" title="Apprendre les sports en français" allowfullscreen></iframe></div>`;if(idx===6)h=`<h2>🎯 التدريب</h2>${practiceCard('p1','Je ___ du tennis.',['joue','fais','pratique'],1)}${practiceCard('p2','Je pratique ___ escrime.',['le','la',"l'"],2)}${practiceCard('p3','Je joue ___ échecs.',['au','à la','aux'],2)}`;if(idx===7)h=`<h2>🎮 الألعاب</h2><div class="memory" id="memory"></div><p class="note">طابق الرياضة مع معناها. ابدأ بأي بطاقة.</p>`;if(idx===8)h=`<h2>🧠 المراجعة الذكية</h2><div class="note"><b>مراجعة مركزة:</b><br>${wrong.length?'راجع مواضع الخطأ ثم أعد التدريب.':'ابدأ بتحديد الأداة، ثم اختر jouer / faire / pratiquer حسب البنية.'}</div>`;if(idx===9)h=`<h2>🏆 التقييم</h2><p class="score">تقييم قصير شامل</p>${practiceCard('a1','Quelle structure est correcte ?',['Je fais le natation.','Je fais de la natation.','Je joue de la natation.'],1)}${practiceCard('a2','Quel sport avec « pratiquer » ?',['Je pratique la boxe.','Je pratique au football.','Je pratique aux échecs.'],0)}`;if(idx===10){const done=localStorage.getItem('hm-g9-u1-l1-finished')==='1';h=`<h2>📈 التقدم</h2><div class="progress"><i style="width:${done?'100':'90'}%"></i></div><p>${done?'🎉 تم إكمال الدرس.':'أكمل الرحلة ثم اضغط «إكمال الدرس» لحفظ الإنجاز.'}</p>`}document.getElementById('panel').innerHTML=h;if(idx===7)initMemory()}
function initMemory(){const box=document.getElementById('memory');if(!box)return;const items=[['football','كرة القدم'],['natation','السباحة'],['tennis','التنس'],['escrime','المبارزة'],['échecs','الشطرنج'],['équitation','الفروسية']];box.innerHTML=items.map((x,i)=>`<button onclick="this.textContent=this.textContent==='❓'?x[0]:this.textContent">❓</button>`).join('')}
render();
</script></body></html>
