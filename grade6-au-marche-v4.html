<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | Au marché · الصف السادس</title><link rel="icon" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="stylesheet" href="css/premium-shell.css?v=20260825-g6studio3"><style>
:root{--ink:#17213b;--blue:#2556d8;--cyan:#0d9f98;--pink:#e72b82;--gold:#e6a72d;--soft:#f4f7ff;--line:#e0e6f1;--good:#16864a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f3f6ff,#fff 58%);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}main{max-width:1200px;margin:auto;padding:18px 14px 44px}.hero{position:relative;overflow:hidden;border-radius:30px;padding:30px;background:linear-gradient(135deg,#142c69,#2860df 55%,#0ca49d);color:#fff;box-shadow:0 20px 55px #173a8230}.hero:before{content:"MARCHÉ";position:absolute;left:4%;bottom:-35px;font-size:105px;font-weight:1000;opacity:.07;direction:ltr}.eyebrow{font-weight:800;opacity:.86}.hero h1{font-size:clamp(38px,7vw,62px);margin:8px 0 3px}.hero p{font-size:18px;line-height:1.85;max-width:760px;margin:0}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.pill{padding:7px 12px;border-radius:999px;background:#fff2;border:1px solid #fff4;font-weight:850}.journey{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:14px 0}.journey button,.next{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:18px;padding:12px 7px;font-weight:900;cursor:pointer;box-shadow:0 5px 18px #14264a0a}.journey b{display:block;font-size:22px;margin-bottom:4px}.journey .active{background:var(--blue);border-color:var(--blue);color:#fff}.view{background:#fff;border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:0 12px 38px #14264a0b}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:17px}.head h2{margin:0;font-size:28px}.head p{margin:4px 0 0;color:#5c6780}.scene{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.market{min-height:280px;position:relative;overflow:hidden;border-radius:24px;padding:22px;color:#17213b;background:linear-gradient(#dff3ff 0 45%,#f7dfb2 45% 100%);border:1px solid #d9e4ed}.awning{height:55px;background:repeating-linear-gradient(90deg,#e72b82 0 48px,#fff 48px 96px);border-radius:16px 16px 7px 7px}.stall{position:absolute;right:7%;left:7%;bottom:25px;background:#fff;border:1px solid #d8dfe9;border-radius:18px;padding:14px;box-shadow:0 12px 30px #0001}.produce{display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap;font-size:42px}.sign{text-align:center;font-weight:1000;margin:7px}.scene-copy{background:var(--soft);border-radius:22px;padding:18px;border:1px solid #e1e7f5}.scene-copy h3{margin-top:0;color:#173a82}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.step{border:1px solid var(--line);border-radius:18px;padding:15px;background:#fff}.step span{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#edf3ff;color:#1746b8;font-weight:1000}.step h3{margin:8px 0 5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px}.group{margin:22px 0}.group-title{display:flex;align-items:center;gap:9px;background:#eff4ff;color:#173a82;border-radius:16px;padding:11px 14px;margin-bottom:12px;font-weight:950}.word{border:1px solid var(--line);border-radius:20px;padding:14px;background:#fff;transition:.18s}.word:hover{transform:translateY(-2px);box-shadow:0 10px 24px #14264a12}.visual{height:115px;border-radius:17px;display:grid;place-items:center;font-size:56px;background:linear-gradient(135deg,#edf3ff,#f2fbfa);border:1px solid #e7ebf5}.fr{direction:ltr;text-align:center;font-weight:950;font-size:20px;margin-top:10px}.ar{text-align:center;color:#56658a;font-weight:800;margin-top:3px}.ex{direction:ltr;text-align:center;margin:10px 0 0;padding:9px;background:#fbfcff;border-radius:12px;color:#33415f;font-size:14px;line-height:1.6}.say{display:block;margin:10px auto 0;border:0;background:#edf3ff;color:#1746b8;border-radius:12px;padding:9px 13px;font-weight:900;cursor:pointer;touch-action:manipulation}.say:active{transform:scale(.97)}.pron-box{background:#f5f8ff;border:1px solid #e0e7f5;border-radius:20px;padding:17px;margin-bottom:15px}.pron-box strong{color:#173a82}.status{text-align:center;font-weight:900;min-height:24px;color:#315a9e;margin-top:9px}.rules{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.rule{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fbfcff}.rule strong{display:block;font-size:24px;color:#173a82}.example{margin-top:10px;padding:10px;border-right:4px solid var(--pink);background:#fff;border-radius:12px;direction:ltr;text-align:left}.dialogue{display:grid;gap:10px;max-width:860px;margin:auto}.bubble{padding:14px 16px;border-radius:19px;line-height:1.85;position:relative}.seller{background:#eef3ff;border-right:4px solid var(--blue)}.client{background:#fff3f9;border-left:4px solid var(--pink)}.bubble button{float:left;border:0;background:#fff;border-radius:10px;padding:6px 9px;cursor:pointer}.practice{border:1px solid var(--line);border-radius:19px;padding:16px}.practice h3{margin-top:0}.option{width:100%;display:block;text-align:right;border:1px solid #d7dfec;background:#fff;border-radius:12px;padding:10px;margin-top:7px;cursor:pointer;font-weight:850}.option.correct{background:#ecfff4;border-color:#27a55e}.option.wrong{background:#fff0f7;border-color:#e72b82}.feedback{min-height:25px;font-weight:900;margin-top:8px}.finish{margin-top:15px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.bar{height:10px;background:#e8edf6;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:.25s}@media(max-width:850px){.journey{grid-template-columns:repeat(3,1fr)}.scene{grid-template-columns:1fr}.steps,.rules{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){main{padding:10px}.hero{padding:22px}.journey{grid-template-columns:repeat(2,1fr)}.view{padding:14px}.steps,.rules{grid-template-columns:1fr}.finish{align-items:stretch;flex-direction:column}}
</style></head><body data-hm-grade-theme="primary-6"><header class="hm-header"><a class="hm-brand" href="index.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">تعليم اللغة الفرنسية</small></span></a><nav class="hm-nav"><a href="index.html">الرئيسية</a><a href="grade-6.html">الصف السادس</a><a href="course.html">المناهج الدراسية</a></nav></header><main><section class="hero"><div class="eyebrow">Le français pour vous · 6e année</div><h1>Au marché</h1><p>في السوق — تعلّم الكلمة داخل موقف، اسمعها، افهمها، استخدمها، ثم اختبر نفسك.</p><div class="meta"><span class="pill">Unité 1 · الدرس الأول</span><span class="pill">🛒 Marché</span><span class="pill">🎯 تعلم → استخدم → أتقن</span></div></section><nav class="journey" id="journey"><button class="active" data-page="home"><b>🧭</b>ابدأ</button><button data-page="vocab"><b>🛒</b>تعلم</button><button data-page="pron"><b>🔊</b>انطق</button><button data-page="grammar"><b>📘</b>افهم</button><button data-page="talk"><b>💬</b>تواصل</button><button data-page="master"><b>🏆</b>أتقن</button></nav><section class="view" id="view"></section><div class="finish"><div style="flex:1"><b>رحلة الدرس</b><div id="status">ابدأ من المشهد.</div><div class="bar"><i id="bar"></i></div></div><button class="next" id="next">المحطة التالية</button></div></main><script>
const vocab=[['Le chariot','عربة التسوق','🛒','Je prends le chariot.'],['La balance','الميزان','⚖️','La balance est ici.'],['La caisse','صندوق الدفع','💳','Je vais à la caisse.'],['La vitrine','الفاترينة','🪟','Regarde la vitrine.'],['Le panier','السلة','🧺','Je prends le panier.'],['Le sachet','الكيس','🛍️','Un sachet, s’il vous plaît.'],["L'argent",'المال','💶',"J'ai de l'argent."],['Le vendeur','البائع','🧑‍🍳','Le vendeur est gentil.'],['La baguette','الخبز الفرنسي','🥖','Je voudrais une baguette.'],['Le pain','الخبز','🍞','Je voudrais du pain.'],['Le croissant','الكرواسون','🥐','J’aime le croissant.'],['Le gâteau','الكعكة','🍰','Le gâteau est bon.'],['La viande','اللحوم','🥩','Je voudrais de la viande.'],['Le poulet','الدجاج','🍗','Je prends du poulet.'],['Le fromage','الجبن','🧀','Je voudrais du fromage.'],['Le lait','اللبن','🥛','Je bois du lait.'],['Le beurre','الزبدة','🧈','Il faut du beurre.'],['Le poisson','السمك','🐟','J’achète du poisson.'],['La farine','الدقيق','🌾','Il faut de la farine.'],["L'œuf",'البيض','🥚',"Je prends de l'œuf."],['La crème','الكريمة','🥛','Je voudrais de la crème.'],['Le sucre','السكر','🍬','Je prends du sucre.'],['Le sel','الملح','🧂','Il faut du sel.'],['Le vinaigre','الخل','🫙','Je prends du vinaigre.'],['La pomme','التفاح','🍎','Je voudrais des pommes.'],['La banane','الموز','🍌','Je voudrais des bananes.'],['La fraise','الفراولة','🍓','Les fraises sont bonnes.'],["L'orange",'البرتقال','🍊',"Je prends de l'orange."],['La poire','الكمثرى','🍐','J’aime la poire.'],['La cerise','الكريز','🍒','Les cerises sont rouges.'],['Le raisin','العنب','🍇','Je voudrais du raisin.'],['Le citron','الليمون','🍋','Il faut du citron.'],['La carotte','الجزر','🥕','Je prends des carottes.'],['La tomate','الطماطم','🍅','Je prends des tomates.'],['Le concombre','الخيار','🥒','J’achète des concombres.'],['La pomme de terre','البطاطس','🥔','Je prends des pommes de terre.'],["L'aubergine",'الباذنجان','🍆',"J'achète de l'aubergine."],['Le chou','الكرنب','🥬','Je prends du chou.'],['Le chou-fleur','القرنبيط','🥦','Je prends du chou-fleur.']];
const groups=[['🛍️ أدوات السوق',0,8],['🥖 المخبوزات والأطعمة',8,24],['🍎 الفواكه',24,32],['🥕 الخضروات',32,39]];const rules=[['du','مذكر مفرد','du pain · du fromage'],['de la','مؤنث مفرد','de la viande · de la farine'],["de l'",'قبل حرف متحرك',"de l'eau · de l'œuf"],['des','جمع','des pommes · des bananes']];const dialogue=[['seller','Bonjour monsieur, vous désirez quoi ?'],['client',"Bonjour ! Je voudrais des pommes et des bananes, s'il vous plaît."],['seller','Combien de pommes voulez-vous ?'],['client','Je voudrais six pommes et deux kilos de bananes.'],['seller','Très bien. Vous voulez autre chose ?'],['client','Oui, du fromage, du pain et une bouteille de lait.'],['seller','Voilà. Ça fait vingt euros.'],['client','Tenez. Merci beaucoup !'],['seller','Merci à vous. Bonne journée !'],['client','Au revoir !']];const qs=[['Je voudrais ___ fromage.',['du','de la','des'],'du'],['Elle boit ___ eau.',['du','de la',"de l'"],"de l'"],['___ carottes sont fraîches.',['Du','Des'],'Des'],["Il achète ___ orange.",["de l'",'du'],"de l'"],['Nous achetons ___ pain.',['du','de la'],'du']];const pages=['home','vocab','pron','grammar','talk','master'];let current='home',score=0,answered=new Set();
function speak(t){t=String(t||'').trim();if(!t)return;const st=document.getElementById('pronStatus');if(st)st.textContent='🔊 جاري تشغيل النطق الفرنسي…';try{const a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&tl=fr&client=gtx&q='+encodeURIComponent(t));a.preload='auto';a.volume=1;a.onended=()=>{if(st)st.textContent='تم تشغيل النطق.'};a.onerror=()=>fallback(t,st);const p=a.play();if(p&&p.catch)p.catch(()=>fallback(t,st))}catch(e){fallback(t,st)}}function fallback(t,st){try{if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;u.onend=()=>{if(st)st.textContent='تم تشغيل النطق.'};speechSynthesis.speak(u);return}}catch(e){}if(st)st.textContent='⚠️ تعذر تشغيل النطق.'}
function card(w){return `<article class="word"><div class="visual">${w[2]}</div><div class="fr">${w[0]}</div><div class="ar">${w[1]}</div><div class="ex">${w[3]}</div><button class="say" onclick="speak(${JSON.stringify(w[0])})">🔊 نطق الكلمة</button><button class="say" onclick="speak(${JSON.stringify(w[3])})">🔊 نطق المثال</button></article>`}function render(){const v=document.getElementById('view');document.querySelectorAll('#journey button').forEach(b=>b.classList.toggle('active',b.dataset.page===current));if(current==='home')v.innerHTML=`<div class="head"><div><h2>🧭 ابدأ من المشهد</h2><p>اكتشف قبل أن تحفظ: السوق أولًا، ثم الكلمات والقواعد والتواصل.</p></div></div><div class="scene"><div class="market"><div class="awning"></div><div class="stall"><div class="sign">🛒 AU MARCHÉ</div><div class="produce">🥖 🍎 🥕 🧀 🍊 🍗 🥛</div></div></div><div class="scene-copy"><h3>ماذا ترى؟</h3><p>أشياء نشتريها في السوق، وأشخاص نتحدث معهم، وكلمات سنحتاجها لطلب الطعام.</p><button class="say" onclick="speak('Au marché')">🔊 استمع إلى عنوان الدرس</button></div></div><div class="steps"><div class="step"><span>01</span><h3>Observe</h3><p>لاحظ المشهد والكلمات.</p></div><div class="step"><span>02</span><h3>Notice</h3><p>لاحظ كيف تتغير أدوات الكمية.</p></div><div class="step"><span>03</span><h3>Rule</h3><p>استخرج القاعدة بنفسك.</p></div><div class="step"><span>04</span><h3>Try</h3><p>جرّبها في الحوار والتدريب.</p></div></div>`;else if(current==='vocab'){v.innerHTML=`<div class="head"><div><h2>🛒 تعلّم المفردات</h2><p>الكلمة + معناها + مثالها + نطق مستقل.</p></div></div>`+groups.map(g=>`<section class="group"><div class="group-title">${g[0]}</div><div class="grid">${vocab.slice(g[1],g[2]).map(card).join('')}</div></section>`).join('');}else if(current==='pron'){v.innerHTML=`<div class="head"><div><h2>🔊 انطق</h2><p>اسمع الكلمة، ثم اسمع المثال، وكررهما بصوتك.</p></div></div><div class="pron-box"><strong>نظام النطق</strong><p>كل زر يشغّل النطق الفرنسي مباشرة، مع بديل صوت الجهاز إذا تعذر تشغيل الصوت الخارجي.</p><div class="status" id="pronStatus">اختر كلمة من القائمة.</div></div><div class="grid">${vocab.slice(0,12).map(card).join('')}</div>`;}else if(current==='grammar'){v.innerHTML=`<div class="head"><div><h2>📘 افهم: الكمية</h2><p>Observe → Notice → Rule → Try</p></div></div><div class="steps"><div class="step"><span>01</span><h3>Observe</h3><p>du pain · de la viande · de l'œuf · des pommes</p></div><div class="step"><span>02</span><h3>Notice</h3><p>الأداة تتغير حسب النوع والعدد وبداية الكلمة.</p></div><div class="step"><span>03</span><h3>Rule</h3><p>مذكر: du · مؤنث: de la · متحرك: de l' · جمع: des</p></div><div class="step"><span>04</span><h3>Try</h3><p>طبّق القاعدة في التدريب ثم في الحوار.</p></div></div><div class="rules" style="margin-top:15px">${rules.map(r=>`<div class="rule"><strong>${r[0]}</strong><b>${r[1]}</b><div class="example">${r[2]}</div></div>`).join('')}</div>`;}else if(current==='talk'){v.innerHTML=`<div class="head"><div><h2>💬 تواصل في السوق</h2><p>استمع لكل جملة، ثم مثّل دور البائع أو العميل.</p></div></div><div class="dialogue">${dialogue.map(d=>`<div class="bubble ${d[0]==='seller'?'seller':'client'}"><button onclick="speak(${JSON.stringify(d[1])})">🔊</button><span>${d[0]==='seller'?'Vendeur : ':'Client : '}${d[1]}</span></div>`).join('')}</div>`;}else{v.innerHTML=`<div class="head"><div><h2>🏆 أتقن</h2><p>اختبر فهمك. لا تظهر النتيجة حتى تختار إجابتك.</p></div></div><div class="grid">${qs.map((q,i)=>`<article class="practice"><h3>${i+1}. ${q[0]}</h3>${q[1].map(o=>`<button class="option" onclick="answer(${i},${JSON.stringify(o)},this)">${o}</button>`).join('')}<div class="feedback" id="f${i}"></div></article>`).join('')}</div><div class="pron-box" style="margin-top:15px"><strong>النتيجة</strong><div id="scoreText">${score} / ${qs.length}</div></div>`;}updateProgress()}function answer(i,o,el){if(answered.has(i))return;answered.add(i);const ok=o===qs[i][2];if(ok){score++;el.classList.add('correct');document.getElementById('f'+i).textContent='✅ ممتاز!';}else{el.classList.add('wrong');document.getElementById('f'+i).textContent='❌ حاول مرة أخرى — الإجابة الصحيحة: '+qs[i][2];document.querySelectorAll('.practice')[i].querySelectorAll('.option').forEach(x=>{if(x.textContent.trim()===qs[i][2])x.classList.add('correct')})}document.getElementById('scoreText').textContent=score+' / '+qs.length;updateProgress()}function updateProgress(){const pct=Math.round((pages.indexOf(current)/(pages.length-1))*70+(score/qs.length)*30);document.getElementById('bar').style.width=Math.min(100,pct)+'%';document.getElementById('status').textContent=current==='master'?`إتقانك الحالي: ${score}/${qs.length}`:`المحطة الحالية: ${pages.indexOf(current)+1} من ${pages.length}`}
document.querySelectorAll('#journey button').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.page;render();window.scrollTo({top:document.querySelector('.view').offsetTop-12,behavior:'smooth'})}));document.getElementById('next').addEventListener('click',()=>{const n=Math.min(pages.length-1,pages.indexOf(current)+1);current=pages[n];render();window.scrollTo({top:document.querySelector('.view').offsetTop-12,behavior:'smooth'})});render();
</script></body></html>
