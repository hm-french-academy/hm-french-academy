<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | إعادة تعيين كلمة المرور</title><link rel="stylesheet" href="css/style.css?v=20260807"><style>.box{max-width:540px;margin:auto}.status{margin:12px 0;padding:11px 14px;border-radius:12px;display:none;font-weight:700}.status.error{display:block;background:#fff1f2;color:#b42318}.status.success{display:block;background:#ecfdf3;color:#067647}.box input{width:100%;box-sizing:border-box;padding:14px 16px;border:1px solid #d1d5db;border-radius:14px;margin:8px 0 16px}</style></head><body><header><h2>🇫🇷 HM Academy</h2><p>بوابة الطالب</p><nav><a href="index.html">الرئيسية</a><a href="login.html">تسجيل الدخول</a></nav></header><main><section class="hero"><h1>🔐 إعادة تعيين كلمة المرور</h1><p>اختر كلمة مرور جديدة لحسابك.</p><div class="course box"><label for="password">كلمة المرور الجديدة</label><input id="password" type="password" autocomplete="new-password" placeholder="6 أحرف على الأقل"><label for="confirm">تأكيد كلمة المرور</label><input id="confirm" type="password" autocomplete="new-password" placeholder="أعد كتابة كلمة المرور"><div id="status" class="status"></div><button id="save" class="btn" type="button">حفظ كلمة المرور</button></div></section></main><footer>HM Academy © 2026</footer><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY}from'./js/supabase-config.js';const s=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),msg=(t,c='error')=>{const e=document.getElementById('status');e.textContent=t;e.className='status '+c};s.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')document.getElementById('save').disabled=false});document.getElementById('save').addEventListener('click',async()=>{const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p.length<6)return msg('كلمة المرور يجب ألا تقل عن 6 أحرف.');if(p!==c)return msg('تأكيد كلمة المرور غير مطابق.');const{error}=await s.auth.updateUser({password:p});if(error)return msg('تعذر تحديث كلمة المرور. افتح رابط الاستعادة من بريدك مرة أخرى.');msg('تم تحديث كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول.','success');setTimeout(()=>location.href='login.html',1200)});</script></body></html>
