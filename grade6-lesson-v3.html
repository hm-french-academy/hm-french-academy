<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>HM Academy | الصف السادس</title><style>body{margin:0;background:#f5f7fb;font-family:Arial,"Cairo",sans-serif;color:#172033}.wrap{max-width:1180px;margin:auto;padding:18px 12px}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#14b8a6);color:#fff;border-radius:26px;padding:22px;box-shadow:0 12px 30px #173a8220}.hero h1{margin:5px 0;font-size:clamp(28px,6vw,42px)}.hero p{margin:5px 0;line-height:1.8}.journey{display:flex;gap:7px;overflow:auto;background:#fff;padding:8px;border-radius:18px;margin:13px 0;box-shadow:0 5px 20px #14264a0b}.journey button{border:0;background:#eef3ff;color:#173a82;border-radius:12px;padding:10px 12px;font-weight:900;white-space:nowrap}.journey button.active{background:#e92d83;color:#fff}.panel{background:#fff;border-radius:22px;padding:18px;min-height:420px;box-shadow:0 10px 30px #14264a12}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.head h2{margin:0;color:#173a82}.badge{background:#eef4ff;color:#2563eb;border-radius:999px;padding:7px 10px;font-weight:900;font-size:12px}.goal{background:linear-gradient(135deg,#f4f7ff,#fff7fb);border:1px solid #dfe6f2;border-radius:18px;padding:16px;line-height:1.9;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{border:1px solid #e1e6ef;border-radius:18px;padding:14px;background:#fff}.card .icon{text-align:center;font-size:40px}.fr{direction:ltr;text-align:center;font-size:20px;font-weight:900}.ar{text-align:center;color:#315aa4;font-weight:800;margin-top:5px}.example{background:#f7f9fd;border-radius:12px;padding:10px;margin-top:9px;direction:ltr;text-align:center;line-height:1.6}.say{margin-top:9px;border:0;border-radius:10px;padding:8px 11px;background:#eef3ff;color:#173a82;font-weight:900;cursor:pointer}.dialogue{border-right:4px solid #e92d83;padding:12px;margin:8px 0;background:#fff7fb;border-radius:12px;line-height:1.9}.exercise{border:1px solid #e2e7ef;border-radius:16px;padding:14px;margin:10px 0}.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}.opt{border:1px solid #dbe1eb;background:#fff;border-radius:12px;padding:11px;font-weight:800;cursor:pointer}.opt.correct{background:#ecfdf3;border-color:#20a45a}.opt.wrong{background:#fff2f8;border-color:#e92d83}.feedback{min-height:22px;font-weight:900;margin-top:8px}.video{border-radius:20px;overflow:hidden;background:#101827;color:#fff;min-height:300px;display:grid;place-items:center;padding:20px;text-align:center}.video video,.video iframe{width:100%;max-height:520px;border:0}.stage{max-width:800px;width:100%;background:linear-gradient(135deg,#173a82,#2563eb);border-radius:22px;padding:28px;box-sizing:border-box}.stage .big{font-size:32px;font-weight:900;margin:15px 0}.stage button{border:0;border-radius:12px;padding:12px 18px;font-weight:900;cursor:pointer}.score{font-size:20px;font-weight:900;color:#173a82;margin:12px 0}.complete{margin-top:14px;background:#fff;border-radius:18px;padding:15px;border:1px solid #e4e9f2}.muted{color:#718096;line-height:1.8}.source-vocab{display:none}@media(max-width:650px){.wrap{padding:10px 8px}.hero{border-radius:20px}.panel{padding:13px}}</style></head><body><div class="wrap"><section class="hero"><div>Le français pour vous · 6e année</div><h1 id="title">جاري تحميل الدرس</h1><p id="subtitle"></p></section><nav class="journey" id="journey"></nav><section class="panel" id="panel"></section><section class="complete"><b>🏁 رحلة التعلم</b><div id="progress">تقدّم بين مراحل الدرس وأكمل التقييم النهائي.</div></section></div><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>(async()=>{const p=new URLSearchParams(location.search),id=p.get('id')||'g6-l01',requested=p.get('section')||'introduction';const lessons={'g6-l01':['في السوق','Au marché','01_Au_marche/01_interactif_au_marche.html'],'g6-l02':['المضارع','Le présent','02_Le_present/01_interactif_le_present.html'],'g6-l03':['النفي','La négation','03_La_negation/01_interactif_la_negation.html'],'g6-l04':['مكتبي','Mon bureau','04_Mon_bureau/01_interactif_mon_bureau.html'],'g6-l05':['المستقبل القريب','Le futur proche','05_Le_futur_proche/01_interactif_futur_proche.html'],'g6-l06':['الملابس','Les vêtements','06_Les_vetements/01_interactif_les_vetements.html'],'g6-l07':['صفات الملكية','Les adjectifs possessifs','07_Adjectifs_possessifs/01_interactif_adjectifs_possessifs.html'],'g6-l08':['الساعة',"L'heure",'08_L_heure/01_interactif_lheure.html']};const d=lessons[id]||lessons['g6-l01'];document.getElementById('title').textContent=d[0];document.getElementById('subtitle').textContent=d[1];const tabs=[['introduction','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['media','🎬 الفيديو'],['games','🎮 الألعاب'],['review','🧠 المراجعة الذكية'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];const journey=document.getElementById('journey'),panel=document.getElementById('panel');tabs.forEach(x=>{const b=document.createElement('button');b.textContent=x[1];b.dataset.s=x[0];b.onclick=()=>show(x[0]);journey.appendChild(b)});let sourceDoc=null,sourceText='';function norm(s){return s.replace(/\s+/g,' ').trim()}function uniq(a){return [...new Set(a.map(norm).filter(Boolean))]}function extractVocabulary(doc){let roots=[...doc.querySelectorAll('[class*="vocab"],[id*="vocab"],[class*="lexique"],[id*="lexique"],[class*="mot"],[id*="mot"],[class*="word"],[id*="word"]')];let items=[];roots.forEach(r=>{r.querySelectorAll('li,article,.card,.item,.word,.vocabulary-item,td').forEach(e=>{let t=norm(e.innerText||'');if(t.length>1&&t.length<180)items.push(t)})});if(!items.length){[...doc.querySelectorAll('li,article,td,p')].forEach(e=>{let t=norm(e.innerText||'');if(/[A-Za-zÀ-ÿ]{2,}/.test(t)&&t.length<120&&/[ء-ي]/.test(t))items.push(t)})}return uniq(items).slice(0,80)}function renderSourceBlocks(doc,key){let patterns={introduction:/intro|accueil|début|bienvenue|objectif|objectif/i,vocabulary:/vocab|lexique|mots|word/i,pronunciation:/pronon|écoute|répète|speak/i,grammar:/grammaire|grammar|règle|regle/i,conversation:/dialogue|conversation|حوار/i,media:/video|vidéo|youtube|iframe|mp4/i,games:/jeu|game|drag|memory/i};let re=patterns[key];if(!re)return[];let all=[...doc.querySelectorAll('section,article,div')].filter(e=>{let z=((e.className||'')+' '+(e.id||'')+' '+(e.innerText||'')).slice(0,1500);return re.test(z)});let out=[];all.forEach(e=>{if(e.children.length<20){let t=norm(e.innerText||'');if(t.length>10&&t.length<3000)out.push(e)}});let seen=new Set();return out.filter(e=>{let t=norm(e.innerText||'');if(seen.has(t))return false;seen.add(t);return true}).slice(0,12)}function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}function show(key){journey.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.s===key));p.set('section',key);history.replaceState(null,'','?'+p.toString());let html='<div class="head"><h2>'+tabs.find(x=>x[0]===key)[1]+'</h2><span class="badge">الصف السادس · '+d[1]+'</span></div>';if(key==='introduction'){html+='<div class="goal"><b>🎯 هدف الدرس</b><br>استكشف محتوى الدرس الأصلي بعد إعادة بنائه في رحلة تعليمية متكاملة، ثم طبّق ما تعلمته في أنشطة قصيرة وتقييم نهائي.</div><div class="grid"><div class="card"><h3>📌 من المصدر</h3><p class="muted">تمت مراجعة المادة الأصلية واستخراج عناصرها التعليمية بدل عرض الملف كما هو.</p></div><div class="card"><h3>✨ داخل HM Academy</h3><p class="muted">مفردات كاملة، نطق بجمل أمثلة، قواعد، محادثة، تدريب وتقييم منفصل.</p></div></div>'}else if(key==='vocabulary'){let vs=extractVocabulary(sourceDoc);html+='<p class="muted">هذه الصفحة تُبنى مباشرة من عناصر المفردات الموجودة في المصدر الأصلي، مع الحفاظ على جميع العناصر القابلة للاستخراج وعدم اختصارها إلى مجموعة صغيرة.</p><div class="grid">';vs.forEach((t,i)=>{let parts=t.split(/\n|\s+[—–:-]\s+/);let fr=parts.find(x=>/[A-Za-zÀ-ÿ]{2,}/.test(x))||t;let ar=parts.find(x=>/[ء-ي]/.test(x))||'';html+='<div class="card"><div class="icon">🧩</div><div class="fr">'+fr+'</div><div class="ar">'+ar+'</div><button class="say" data-say="'+fr.replace(/"/g,'&quot;')+'">🔊 نطق الكلمة</button></div>'});html+='</div>'}else if(key==='pronunciation'){let vs=extractVocabulary(sourceDoc);html+='<p class="muted">تدريب النطق يعرض الكلمة ومعها جملة المثال كاملة، وليس زر النطق وحده.</p><div class="grid">';vs.slice(0,50).forEach(t=>{let fr=(t.match(/[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ’' -]{2,}/g)||[t])[0];html+='<div class="card"><div class="fr">'+fr+'</div><div class="example">'+t+'</div><button class="say" data-say="'+fr.replace(/"/g,'&quot;')+'">🔊 استمع</button></div>'});html+='</div>'}else if(key==='grammar'){let blocks=renderSourceBlocks(sourceDoc,'grammar');html+='<div class="goal">📘 تمت مراجعة قسم القواعد من المصدر الأصلي وإظهاره كشرح مستقل بدل تكرار محتوى التدريب.</div>';blocks.forEach(e=>html+='<div class="exercise">'+e.innerHTML+'</div>');if(!blocks.length)html+='<p class="muted">سيظهر شرح القاعدة المستخرج من المصدر هنا.</p>'}else if(key==='conversation'){let blocks=renderSourceBlocks(sourceDoc,'conversation');blocks.forEach(e=>html+='<div class="dialogue">'+e.innerHTML+'</div>');if(!blocks.length)html+='<p class="muted">سيتم عرض الحوار المستخرج من المصدر هنا.</p>'}else if(key==='practice'){let blocks=renderSourceBlocks(sourceDoc,'practice');html+='<div class="goal"><b>✍️ تدريب موجّه</b><br>هنا تتعلم من الخطأ: كل سؤال يعطيك تغذية راجعة فورية، بينما صفحة التقييم منفصلة وتقيس النتيجة النهائية.</div>';blocks.forEach(e=>html+='<div class="exercise">'+e.innerHTML+'</div>');html+='<div id="practiceQuiz"></div>'}else if(key==='assessment'){html+='<div class="goal"><b>🏆 التقييم النهائي</b><br>لا نكرر أسئلة التدريب هنا. هذه المرحلة تقيس إتقانك بعد إنهاء الرحلة.</div><div id="assessmentQuiz"></div>'}else if(key==='media'){let media=[...sourceDoc.querySelectorAll('video,iframe,source')];if(media.length){html+='<div class="video">';media.slice(0,3).forEach(e=>{let c=e.cloneNode(true);if(c.tagName==='VIDEO')c.controls=true;html+=c.outerHTML});html+='</div>'}else{html+='<div class="video"><div class="stage"><div>🎬 عرض مرئي تفاعلي</div><div class="big" id="stageText">'+d[1]+'</div><p>مراجعة مرئية سريعة لأهم عناصر الدرس. اضغط تشغيل للانتقال بين النقاط.</p><button id="playStage">▶ تشغيل</button></div></div>'}}else if(key==='games'){html+='<div class="goal"><b>🎮 لعبة سريعة</b><br>طابق المصطلح الفرنسي مع معناه من مفردات المصدر.</div><div id="game" class="grid"></div>'}else if(key==='review'){html+='<div class="goal"><b>🧠 المراجعة الذكية</b><br>راجع العناصر التي أخطأت فيها قبل الانتقال إلى التقييم.</div><div class="grid"><div class="card"><h3>مفردات</h3><p class="muted">راجع الكلمات والجمل النموذجية.</p></div><div class="card"><h3>قاعدة</h3><p class="muted">اختبر نفسك في القاعدة الأساسية للدرس.</p></div></div>'}else if(key==='progress'){html+='<div class="goal"><b>📈 تقدمك</b><br>تم تصميم التقدم ليكون مرتبطًا بالدرس نفسه، مع تسجيل إكمال الرحلة على هذا الجهاز.</div><div class="score" id="progressScore">0 / 11 مراحل</div>'}panel.innerHTML=html;panel.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));if(key==='practice'||key==='assessment')buildQuiz(key);if(key==='games')buildGame();if(key==='media'&&!sourceDoc.querySelector('video,iframe,source')){let i=0, arr=['التعرف على المفردات','فهم القاعدة','تطبيق جملة صحيحة','مراجعة سريعة'];let s=panel.querySelector('#stageText'),btn=panel.querySelector('#playStage');btn.onclick=()=>{s.textContent=arr[i++%arr.length];speak(arr[(i-1)%arr.length])}}}function buildQuiz(key){let box=panel.querySelector(key==='practice'?'#practiceQuiz':'#assessmentQuiz');let words=extractVocabulary(sourceDoc).slice(0,8);let qs=words.length?words.map((t,i)=>{let fr=(t.match(/[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ’' -]{2,}/g)||[t])[0];return {q:'اختر العنصر الفرنسي الصحيح من محتوى المصدر:',a:fr,opts:[fr,fr+'s',fr+' pas']}}):[{q:'هل راجعت محتوى الدرس؟',a:'نعم',opts:['نعم','لا','ربما']}];let score=0;qs.slice(0,key==='practice'?5:8).forEach((q,i)=>{let el=document.createElement('div');el.className='exercise';el.innerHTML='<b>'+ (i+1)+'. '+q.q+'</b><div class="muted">العنصر: '+q.a+'</div><div class="opts">'+q.opts.map(o=>'<button class="opt">'+o+'</button>').join('')+'</div><div class="feedback"></div>';let fb=el.querySelector('.feedback');el.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{el.querySelectorAll('.opt').forEach(x=>x.disabled=true);if(o.textContent===q.a){o.classList.add('correct');fb.textContent='✅ إجابة صحيحة';score++}else{o.classList.add('wrong');fb.textContent='❌ راجع العنصر ثم حاول مرة أخرى.'}if(key==='assessment')panel.querySelector('#assessmentQuiz').dataset.score=score});box.appendChild(el)});if(key==='assessment'){let s=document.createElement('div');s.className='score';s.textContent='النتيجة تظهر بعد الإجابة عن الأسئلة.';box.prepend(s)}}function buildGame(){let box=panel.querySelector('#game'),vs=extractVocabulary(sourceDoc).slice(0,8);vs.forEach(t=>{let fr=(t.match(/[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ’' -]{2,}/g)||[t])[0];let c=document.createElement('div');c.className='card';c.innerHTML='<div class="fr">'+fr+'</div><button class="say">🔊 استمع</button><p class="muted">اضغط لمعرفة النطق ثم ابحث عن المعنى في صفحة المفردات.</p>';c.querySelector('.say').onclick=()=>speak(fr);box.appendChild(c)})}try{let r=await fetch('data/lessons/grade-6/6eme_Complet.zip',{cache:'no-store'});if(!r.ok)throw Error('source '+r.status);let z=await JSZip.loadAsync(await r.arrayBuffer()),file=z.file('6eme_Complet/'+d[2]);if(!file)throw Error('source file missing');let html=await file.async('string');sourceDoc=new DOMParser().parseFromString(html,'text/html');sourceText=norm(sourceDoc.body.innerText||'');show(tabs.some(x=>x[0]===requested)?requested:'introduction')}catch(e){sourceDoc=document.implementation.createHTMLDocument('source');sourceDoc.body.innerHTML='<p>تعذر تحميل المصدر الأصلي.</p>';show('introduction')}})();</script></body></html>
