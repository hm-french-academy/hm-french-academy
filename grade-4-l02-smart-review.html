<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | المراجعة الذكية — الدرس الثاني</title><link rel="stylesheet" href="css/premium-shell.css?v=20260824-g4l02review1"><style>body{background:#f5f7fb}.wrap{max-width:900px;margin:auto;padding:28px 16px}.hero,.card{background:#fff;border:1px solid #e1e7f0;border-radius:24px;padding:22px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#5e6bb0,#2563eb);color:#fff}.mode{display:inline-block;padding:8px 11px;border-radius:10px;background:#edf3ff;color:#315aa4;font-weight:900}.options{display:grid;gap:10px}.option{border:1px solid #dce3ee;background:#fff;border-radius:14px;padding:13px;text-align:right;cursor:pointer;font-weight:800}.result{font-weight:900;margin-top:12px;min-height:24px}.btn{display:inline-block;border:0;background:#2563eb;color:#fff;border-radius:12px;padding:11px 15px;font-weight:900;text-decoration:none;margin:5px}</style></head><body><header class="hm-header"><a class="hm-brand" href="grade-4.html"><span class="hm-logo">HM</span><span class="hm-brand-text">🇫🇷 HM Academy <small class="hm-tagline">الصف الرابع</small></span></a></header><main class="wrap"><section class="hero"><h1>🧠 المراجعة الذكية</h1><p>الدرس الثاني · <b>Les chiffres</b></p><p>مراجعة مستقلة مبنية على أرقام الدرس الثاني من الصف الرابع فقط.</p></section><section class="card" id="app"></section></main><script>const Q=[['Quel nombre est 7 ?',['sept','six','huit','dix'],'sept'],['Quel nombre est « douze » ?',['10','11','12','13'],'12'],['Quel nombre vient après 19 ?',['18','19','20','21'],'20'],['Quel nombre vient avant 30 ?',['27','28','29','31'],'29'],['Quel nombre est « vingt-cinq » ?',['15','20','25','30'],'25'],['Quel nombre vient après 14 ?',['13','14','15','16'],'15'],['Quel nombre est 21 ?',['vingt','vingt et un','vingt-deux','trente'],'vingt et un'],['Quel nombre est « seize » ?',['14','15','16','17'],'16'],['Complète : 8, 9, 10, …',['11','12','13','14'],'11'],['Quel nombre est « trente » ?',['20','25','29','30'],'30']];let i=0,score=0;const app=document.getElementById('app');function render(){if(i>=Q.length){app.innerHTML='<h2>🎉 انتهت المراجعة</h2><p>نتيجتك: <b>'+score+' / '+Q.length+'</b></p><p>المحتوى خاص بالدرس الثاني من الصف الرابع: Les chiffres.</p><a class="btn" href="grade-4-l02-learning-studio.html">العودة إلى الدرس</a><a class="btn" href="grade-4.html">العودة إلى الصف الرابع</a>';return}const x=Q[i];app.innerHTML='<div class="mode">02 · Les chiffres</div><h2>'+x[0]+'</h2><p>السؤال '+(i+1)+' من '+Q.length+'</p><div class="options">'+x[1].map(o=>'<button class="option" data-v="'+o.replace(/"/g,'&quot;')+'">'+o+'</button>').join('')+'</div><div class="result" id="r"></div>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{document.querySelectorAll('.option').forEach(x=>x.disabled=true);const ok=b.dataset.v===x[2];if(ok)score++;document.getElementById('r').textContent=ok?'✅ إجابة صحيحة':'❌ الإجابة الصحيحة: '+x[2];setTimeout(()=>{i++;render()},650)})}render()</script></body></html>
