es cils','الرموش'],['oreilles','Les oreilles','الأذنان'],['nez','Le nez','الأنف'],['bouche','La bouche','الفم'],['dents','Les dents','الأسنان'],['menton','Le menton','الذقن']]},'g4-l06':{title:'Le corps · جسمي',unit:'Unité 4 · الدرس الأول',focus:'مفردات الجسم + قراءة نص Samy',items:[['tête','La tête','الرأس'],['cou','Le cou','الرقبة'],['poitrine','La poitrine','الصدر'],['ventre','Le ventre','البطن'],['bras','Le bras','الذراع'],['main','La main','اليد'],['doigt','Le doigt','الإصبع'],['jambe','La jambe','الرجل'],['genou','Le genou','الركبة'],['pied','Le pied','القدم']]}}[id];if(!data){location.href='grade-4-lessons-03-07-live.html'+location.search;return}unit.textContent=data.unit;title.textContent=data.title;focus.textContent=data.focus;const sections=[['vocab','🖼️ المفردات'],['start','🚀 البداية'],['under','🧠 افهم'],['rules','📘 القاعدة'],['interact','🤝 تفاعل'],['talk','💬 المحادثة'],['practice','✍️ التدريب'],['media','🎬 الفيديو'],['review','🧠 المراجعة الذكية'],['after','🌟 بعد الرحلة']];nav.innerHTML=sections.map(x=>`<button data-s="${x[0]}">${x[1]}</button>`).join('');function face(part){const common='<circle cx="100" cy="105" r="70" fill="#fde1d1" stroke="#2e2a25" stroke-width="3"/><path d="M50 82Q100 25 150 82" fill="none" stroke="#6b4b35" stroke-width="10" stroke-linecap="round"/>';const q={cheveux:'<path d="M38 78Q35 22 100 18Q165 22 162 78Q145 48 100 56Q55 48 38 78Z" fill="#6b4b35"/>',front:'<path d="M58 66Q100 43 142 66L135 86Q100 70 65 86Z" fill="#f7b267"/>',sourcils:'<path d="M60 91Q77 79 91 91M109 91Q123 79 140 91" fill="none" stroke="#5a3827" stroke-width="7" stroke-linecap="round"/>',yeux:'<ellipse cx="77" cy="105" rx="18" ry="11" fill="#fff" stroke="#2e2a25" stroke-width="3"/><ellipse cx="123" cy="105" rx="18" ry="11" fill="#fff" stroke="#2e2a25" stroke-width="3"/><circle cx="77" cy="105" r="5"/><circle cx="123" cy="105" r="5"/>',cils:'<path d="M58 101Q77 83 94 101M106 101Q123 83 142 101" fill="none" stroke="#2e2a25" stroke-width="4"/><path d="M62 91l-7-8M70 87l-3-10M79 86v-10M121 86v-10M130 87l3-10M138 91l7-8" stroke="#2e2a25" stroke-width="3"/>',oreilles:'<path d="M48 92Q25 82 28 118Q32 140 51 120L55 99M152 92Q175 82 172 118Q168 140 149 120L145 99" fill="#f2b6a0" stroke="#2e2a25" stroke-width="3"/>',nez:'<path d="M100 80L83 130Q100 141 117 130L100 80Z" fill="#f2b6a0" stroke="#2e2a25" stroke-width="3"/><circle cx="90" cy="130" r="3"/><circle cx="110" cy="130" r="3"/>',bouche:'<path d="M68 148Q100 128 132 148Q100 175 68 148Z" fill="#e87878" stroke="#2e2a25" stroke-width="3"/>',dents:'<path d="M72 145Q100 132 128 145L124 162Q100 172 76 162Z" fill="#fff" stroke="#2e2a25" stroke-width="3"/><path d="M88 140v28M100 138v31M112 140v28" stroke="#d8d8d8" stroke-width="2"/>',menton:'<path d="M70 158Q100 179 130 158Q124 192 100 195Q76 192 70 158Z" fill="#f7b267" stroke="#2e2a25" stroke-width="3"/>'};return `<svg viewBox="0 0 200 210">${common}${q[part]}</svg>`}function body(part){const q={tête:'<circle cx="100" cy="45" r="32" fill="#fde1d1" stroke="#2e2a25" stroke-width="3"/><path d="M70 42Q100 10 130 42" stroke="#6b4b35" stroke-width="9" fill="none"/>',cou:'<path d="M84 67H116V105H84Z" fill="#f2b6a0" stroke="#2e2a25" stroke-width="3"/>',poitrine:'<path d="M58 88Q100 68 142 88L134 142Q100 157 66 142Z" fill="#f7b267" stroke="#2e2a25" stroke-width="3"/>',ventre:'<ellipse cx="100" cy="142" rx="37" ry="39" fill="#f7b267" stroke="#2e2a25" stroke-width="3"/>',bras:'<path d="M72 90L45 150Q40 166 54 171Q65 171 70 157L92 108Z" fill="#fde1d1" stroke="#2e2a25" stroke-width="3"/>',main:'<path d="M45 145Q26 138 22 151Q20 162 32 166L53 171Q63 170 65 159Q61 149 45 145Z" fill="#fde1d1" stroke="#2e2a25" stroke-width="3"/>',doigt:'<path d="M56 158L31 139Q23 133 18 140Q14 147 22 153L48 173" fill="#fde1d1" stroke="#2e2a25" stroke-width="3"/><path d="M31 140L26 124" stroke="#fde1d1" stroke-width="10" stroke-linecap="round"/>',jambe:'<path d="M82 142L78 202Q78 218 91 218Q103 218 103 202L104 150Z" fill="#fde1d1" stroke="#2e2a25" stroke-width="3"/>',genou:'<circle cx="90" cy="184" r="20" fill="#f7b267" stroke="#2e2a25" stroke-width="3"/>',pied:'<path d="M79 203L107 205L119 226Q121 238 108 240H67Q58 235 65 226Z" fill="#fde1d1" stroke="#2e2a25" stroke-width="3"/>'};return `<svg viewBox="0 0 200 250"><path d="M72 72Q100 55 128 72L138 150L116 155L116 208L84 208L84 155L62 150Z" fill="#deebf5" stroke="#2e2a25" stroke-width="3"/>${q[part]}</svg>`}function speak(t){if(!speechSynthesis)return;const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}function render(s){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));if(s==='vocab'){page.innerHTML='<h2>المفردات</h2><p>صور تعليمية دقيقة: كل بطاقة تبرز العضو المقصود نفسه، وليس رمزًا عامًا أو نقطة غير واضحة.</p><div class="grid">'+data.items.map(x=>`<article class="card"><div class="visual">${id==='g4-l04'?face(x[0]):body(x[0])}</div><div class="fr">${x[1]}</div><div class="ar">${x[2]}</div><button class="btn" data-s="${x[1]}">🔊 اسمع</button></article>`).join('')+'</div>';page.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>speak(b.dataset.s));return}location.href='grade-4-lessons-03-07-live-v3.html?id='+id+'&section='+encodeURIComponent(s)}nav.onclick=e=>{const b=e.target.closest('button');if(b)render(b.dataset.s)};render(section)})();</script></body></html>
