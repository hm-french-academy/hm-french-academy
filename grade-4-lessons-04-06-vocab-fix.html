=new URLSearchParams(location.search),id=p.get('id')||'g4-l04',section=p.get('section')||'vocab';const data={'g4-l04':{title:'Mon visage · وجهي',unit:'Unité 3 · الدرس الرابع',focus:'مفردات الوجه + أدوات التعريف والتنكير',items:[['cheveux','Les cheveux','الشعر'],['front','Le front','الجبهة'],['sourcils','Les sourcils','الحواجب'],['yeux','Les yeux','العينان'],['cils','Les cils','الرموش'],['oreilles','Les oreilles','الأذنان'],['nez','Le nez','الأنف'],['bouche','La bouche','الفم'],['dents','Les dents','الأسنان'],['menton','Le menton','الذقن']]},'g4-l06':{title:'Le corps · جسمي',unit:'Unité 4 · الدرس السادس',focus:'مفردات الجسم + قراءة نص Samy',items:[['tête','La tête','الرأس'],['cou','Le cou','الرقبة'],['poitrine','La poitrine','الصدر'],['ventre','Le ventre','البطن'],['bras','Le bras','الذراع'],['main','La main','اليد'],['doigt','Le doigt','الإصبع'],['jambe','La jambe','الرجل'],['genou','Le genou','الركبة'],['pied','Le pied','القدم']]}}[id];if(!data){location.href='grade-4-lessons-03-07-live.html'+location.search;return}unit.textContent=data.unit;title.textContent=data.title;focus.textContent=data.focus;const sections=[['vocab','🖼️ المفردات'],['start','🚀 البداية'],['under','🧠 افهم'],['rules','📘 القاعدة'],['interact','🤝 تفاعل'],['talk','💬 المحادثة'],['practice','✍️ التدريب'],['media','🎬 الفيديو'],['review','🧠 المراجعة الذكية'],['after','🌟 بعد الرحلة']];nav.innerHTML=sections.map(x=>`<button data-s="${x[0]}">${x[1]}</button>`).join('');function face(k){const s='#fde1d1',d='#5a3827',l='#2e2a25',a={cheveux:`<path d="M32 82Q28 24 100 16Q172 24 168 82Q150 49 100 56Q50 49 32 82Z" fill="${d}"/>`,front:`<path d="M57 64Q100 41 143 64L137 86Q100 71 63 86Z" fill="#f7b267" stroke="${l}" stroke-width="2"/>`,sourcils:`<path d="M57 91Q76 78 93 90M107 90Q124 78 143 91" fill="none" stroke="${d}" stroke-width="7" stroke-linecap="round"/>`,yeux:`<ellipse cx="76" cy="105" rx="20" ry="13" fill="#fff" stroke="${l}" stroke-width="3"/><ellipse cx="124" cy="105" rx="20" ry="13" fill="#fff" strok
