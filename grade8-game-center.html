<!doctype html><html lang="ar" dir="rtl"><head><link rel="icon" type="image/svg+xml" href="assets/images/hm-academy-favicon.svg?v=2"><link rel="shortcut icon" href="assets/images/hm-academy-favicon.svg?v=2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy | مركز الألعاب</title><style>body{margin:0;background:#f4f7fc;color:#17223b;font-family:Arial,Cairo,sans-serif}.wrap{max-width:1050px;margin:auto;padding:22px 14px 50px}.hero,.panel,.game{background:#fff;border:1px solid #dfe6f0;border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:0 10px 28px #14264a0d}.hero{background:linear-gradient(135deg,#173a82,#2563eb,#7c3aed);color:#fff}.games{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.game h2{margin:4px 0 8px}.game p{color:#68758b;line-height:1.7}.btn{border:0;border-radius:12px;padding:11px 15px;background:#2563eb;color:#fff;font-weight:900;cursor:pointer;text-decoration:none}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.opt{border:1px solid #dbe3ef;background:#fff;border-radius:14px;padding:13px;font-weight:800;cursor:pointer}.good{background:#eaf8f0!important;border-color:#20a45a!important}.bad{background:#fff0f0!important;border-color:#d14b4b!important}.q{font-size:21px;font-weight:900;line-height:1.7;margin:14px 0}.meta{color:#68758b}.result{font-size:20px;font-weight:900;margin-top:14px}@media(max-width:650px){.games,.opts{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><h1>🎮 مركز الألعاب</h1><p id="lesson">جارٍ تحميل محتوى الدرس…</p><p>المحتوى هنا يُبنى من بيانات الدرس الحالي فقط، وليس من درس آخر.</p></section><section id="hub" class="games"></section><section id="play" class="panel" style="display:none"></section></main><script>(async function(){const p=new URLSearchParams(location.search),id=p.get('lesson')||'grade8-u1-l1',m=id.match(/^grade8-u(\d+)-l(\d+)$/);if(!m)return;let data;try{const r=await fetch('data/lessons/grade-8/unit-'+m[1]+'/lesson-'+m[2]+'.json',{cache:'no-store'});data=await r.json();if(typeof data.content==='string')data=JSON.parse(data.content)}catch(e){document.getElementById('lesson').textContent='تعذر تحميل بيانات الدرس.';return}const vocab=(data.vocabulary||[]).filter(x=>x&&x.word),practice=(data.practice||[]).filter(x=>x&&Array.isArray(x.options)),assessment=(data.assessment?.questions||[]).filter(x=>x&&Array.isArray(x.options));document.getElementById('lesson').textContent=(data.titleAr||data.title||'الدرس')+' · '+(data.titleFr||'');const hub=document.getElementById('hub'),play=document.getElementById('play');const games=[['vocab','📚 Vocabulary Challenge','أسئلة من مفردات هذا الدرس فقط.'],['grammar','📖 Grammar Challenge','أسئلة القواعد والتصريف من هذا الدرس.'],['mixed','⚡ Quiz Express','جولة مختلطة من مفردات وقواعد وتدريب الدرس.'],['assessment','🎯 Challenge Review','مراجعة تفاعلية لأسئلة التقييم الخاصة بهذا الدرس.']];hub.innerHTML=games.map(g=>'<article class="game"><h2>'+g[1]+'</h2><p>'+g[2]+'</p><button class="btn" data-game="'+g[0]+'">ابدأ</button></article>').join('');let pool=[],score=0,i=0,type='';const sh=a=>[...a].sort(()=>Math.random()-.5);function start(t){type=t;score=0;i=0;hub.style.display='none';play.style.display='block';next()}function next(){if(i>=10||!pool.length){play.innerHTML='<div class="result">🏆 انتهت الجولة — نتيجتك: '+score+' / '+Math.min(10,i)+'</div><button class="btn" id="again">جولة جديدة</button> <a class="btn" href="lesson.html?id='+id+'&section=games">← الدرس</a>';document.getElementById('again').onclick=()=>start(type);return}i++;let q,a,opts;if(type==='vocab'){const x=vocab[Math.floor(Math.random()*vocab.length)];q='ما معنى: '+x.word+' ؟';a=x.translation;opts=sh([a,...sh(vocab.filter(y=>y.word!==x.word)).slice(0,3).map(y=>y.translation)])}else if(type==='grammar'){const source=[...practice,...assessment];const x=source[Math.floor(Math.random()*source.length)];q=x.question;a=x.options[x.answer];opts=sh(x.options)}else if(type==='assessment'){const x=assessment[Math.floor(Math.random()*assessment.length)];q=x.question;a=x.options[x.answer];opts=sh(x.options)}else{const source=sh([...practice,...assessment]);const x=source[Math.floor(Math.random()*source.length)];q=x.question;a=x.options[x.answer];opts=sh(x.options)}play.innerHTML='<div class="meta">السؤال '+i+' / 10 · النقاط '+score+'</div><div class="q">'+q+'</div><div class="opts">'+opts.map(o=>'<button class="opt" type="button">'+o+'</button>').join('')+'</div><div id="fb" class="meta"></div>';document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.opt').forEach(x=>x.disabled=true);const ok=b.textContent===a;b.classList.add(ok?'good':'bad');if(ok){score++;document.getElementById('fb').textContent='✓ إجابة صحيحة'}else{document.getElementById('fb').textContent='✗ الإجابة الصحيحة: '+a}setTimeout(next,500)})}document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{type=b.dataset.game;pool=type==='vocab'?vocab:type==='grammar'?practice:type==='assessment'?assessment:[...practice,...assessment];start(type)});})();</script></body></html>
