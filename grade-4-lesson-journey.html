ssList.toggle('active',b.dataset.s===s));if(s==='lesson')viewer.innerHTML=`<div class="grid"><article class="card"><span class="tag">01 · البداية</span><h2 class="fr">${esc(L[0])}</h2><p class="ar">${esc(L[1])}</p><p>هذه هي نقطة دخول Learning Studio. تم فصل الواجهة عن ملف التفاعل الأصلي؛ المحتوى المعروض في المراحل التالية يُقرأ من المصدر الرسمي لهذا الدرس.</p><a class="btn" href="${root+L[3]}" target="_blank" rel="noopener">فتح المصدر الأصلي</a></article><article class="card"><span class="tag">مصدر موثّق</span><h3>مسار المحتوى</h3><p><b>${esc(L[2])}</b></p><p>Interactive: ${esc(L[3])}</p><p>Electronic Exam: ${esc(L[4])}</p><p>✓ Grade 4 only</p></article></div>`;else if(s==='vocabulary')viewer.innerHTML=`<span class="tag">02 · المفردات</span><h2>المفردات من المصدر الأصلي</h2>${cards(blocks(['vocabulaire','vocabulary','mots','words']))}`;else if(s==='pronunciation')viewer.innerHTML=`<span class="tag">03 · النطق</span><h2>النطق والعبارات</h2>${cards(blocks(['pronon','audio','écoute','listen','sound']))}`;else if(s==='grammar')viewer.innerHTML=`<span class="tag">04 · القواعد</span><h2>القواعد</h2>${cards(blocks(['grammaire','grammar','règle','au / en','article']))}`;else if(s==='conversation')viewer.innerHTML=`<span class="tag">05 · المحادثة</span><h2>المحادثة</h2>${cards(blocks(['conversation','dialogue','discussion','parle']))}`;else if(s==='practice')viewer.innerHTML=`<span class="tag">06 · التدريب</span><h2>التدريب</h2>${cards(blocks(['exercice','exercise','quiz','activité','practice']))}`;else if(s==='media')viewer.innerHTML=`<span class="tag">07 · الوسائط</span><h2>الوسائط الأصلية</h2><article class="card">${text().slice(0,3500)||'لا توجد وسائط نصية مستقلة.'}</article>`;else if(s==='games'&&id==='g4-l01')viewer.innerHTML=`<span class="tag">08 · الألعاب</span><h2>🎮 مركز ألعاب Les saisons</h2><p class="ar">تم ربط هذا الدرس بمركز ألعاب مستقل حتى تعمل كل لعبة واختياراتها بشكل صحيح دون التأثير على بقية صفحات الدرس.</p><iframe class="games-frame" src="grade-4-l01-games-
