<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate"><title>HM Academy | الصف الرابع | رحلة الدرس</title><style>:root{--ink:#17324d;--sky:#dff3ff;--paper:#fffdf8}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Arial,Cairo,sans-serif;background:linear-gradient(135deg,#dff5ff,#fff0f7 55%,#f0ffe5);min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:10px 14px 36px}.top{position:sticky;top:0;z-index:20;background:#ffffffee;padding:11px 15px;border-radius:0 0 22px 22px;display:flex;justify-content:space-between;box-shadow:0 8px 28px #17324d14}.top a{color:var(--ink);text-decoration:none;font-weight:900}.book{margin-top:14px;background:var(--paper);border-radius:34px;box-shadow:0 18px 55px #17324d20;overflow:hidden}.hero{padding:30px 28px;background:linear-gradient(135deg,#8fe0ff,#ffd6ea 55%,#fff0b5);min-height:170px}.unit{font-weight:900;opacity:.8}.hero h1{margin:8px 0;font-size:clamp(28px,6vw,46px)}.hero p{margin:0;font-weight:800}.journey{display:flex;gap:7px;overflow-x:auto;padding:12px;background:#fffffff5;border-bottom:1px solid #e8edf3}.step{border:0;background:#f3f7fb;color:#536078;border-radius:999px;padding:9px 13px;font-weight:900;white-space:nowrap;cursor:pointer}.step.active{background:#17324d;color:#fff}.bookpage{margin:16px;background:#fff;border:1px solid #eee8dc;border-radius:26px;padding:22px;min-height:590px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:16px}.card{background:linear-gradient(180deg,#fff,#fbfdff);border:2px solid #edf1f5;border-radius:22px;padding:17px;box-shadow:0 10px 26px #17324d10;line-height:1.9}.btn{border:0;border-radius:14px;padding:11px 15px;font-weight:900;cursor:pointer;background:#17324d;color:#fff;margin:4px}.btn.light{background:#eef4f8;color:var(--ink)}.source{width:100%;height:650px;border:1px solid #dfe6f0;border-radius:18px}.exam{width:100%;height:760px;border:1px solid #dfe6f0;border-radius:18px}.pill{display:inline-block;border-radius:999px;padding:6px 11px;background:var(--sky);font-weight:900}.text{white-space:pre-wrap}.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:20px}@media(max-width:650px){.wrap{padding:7px 9px 25px}.hero{padding:24px 19px}.bookpage{margin:9px;padding:16px}.source{height:560px}.exam{height:650px}}</style></head><body><div class="wrap"><header class="top"><a href="grade-4.html">← الصف الرابع</a><a href="index.html">HM Academy · الرئيسية</a></header><section class="book"><header class="hero"><div class="unit">Le français pour vous · 4e année · PREMIUM</div><h1 id="title">تهيئة الدرس…</h1><p id="subtitle">يتم تحميل محتوى المصدر الأصلي</p></header><nav class="journey" id="journey" aria-label="رحلة الدرس"></nav><main id="viewer" class="bookpage">يتم التحميل…</main></section></div><script>(async()=>{const p=new URLSearchParams(location.search),id=p.get('id')||'g4-l01';const DATA={'g4-l01':['Les saisons','فصول السنة','01_Les_saisons','01_interactif_les_saisons.html','04_examen_electronique_les_saisons.html'],'g4-l02':['Les chiffres','الأرقام','02_Les_chiffres','01_interactif_les_chiffres.html','04_examen_electronique_les_chiffres.html'],'g4-l03':["L'heure",'الساعة','03_L_heure','01_interactif_lheure.html','04_examen_electronique_lheure.html'],'g4-l04':['Mon visage','وجهي','04_Mon_visage','01_interactif_mon_visage.html','04_examen_electronique_mon_visage.html'],'g4-l05':['Adjectifs possessifs — visage','صفات الملكية مع الوجه','05_Adjectifs_possessifs_visage','01_interactif_adjectifs_possessifs_visage.html','04_examen_electronique_adjectifs_possessifs_visage.html'],'g4-l06':['Le corps','الجسم','06_Le_corps','01_interactif_le_corps.html','04_examen_electronique_le_corps.html'],'g4-l07':['Adjectifs possessifs — corps','صفات الملكية مع الجسم','07_Adjectifs_possessifs_corps','01_interactif_adjectifs_possessifs_corps.html','04_examen_electronique_adjectifs_possessifs_corps.html']};const L=DATA[id]||DATA['g4-l01'];const root='data/lessons/grade-4/source/4eme_Complet/'+L[2]+'/';const stages=[['lesson','🚀 البداية'],['vocabulary','🖼️ المفردات'],['pronunciation','🎧 النطق'],['grammar','📘 القواعد'],['conversation','💬 المحادثة'],['practice','✍️ التدريب'],['media','🎬 الفيديو'],['games','🎮 الألعاب'],['assessment','🏆 التقييم'],['progress','📈 التقدم']];document.getElementById('title').textContent=L[1]+' · '+L[0];document.getElementById('subtitle').textContent='المحتوى يُستخرج من مصادر الصف الرابع فقط — دون نسخ محتوى من الصف الثالث';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const q=s=>{history.replaceState(null,'',`grade-4-lesson-journey.html?id=${id}&section=${s}`);render(s);scrollTo({top:0,behavior:'smooth'})};document.getElementById('journey').innerHTML=stages.map((s,i)=>`<button class="step" data-s="${s[0]}">${i+1}. ${s[1]}</button>`).join('');document.getElementById('journey').onclick=e=>{const b=e.target.closest('[data-s]');if(b)q(b.dataset.s)};let src='';try{src=await fetch(root+L[3]).then(r=>r.text())}catch(e){}function sourceDoc(){const d=new DOMParser().parseFromString(src,'text/html');d.querySelectorAll('script,style,nav,header,footer').forEach(x=>x.remove());return d}function blocks(keys){const d=sourceDoc(),all=[...d.querySelectorAll('section,article,div')];const out=[];for(const el of all){const h=(el.querySelector('h1,h2,h3,h4,.tag,.block-head')?.textContent||'').toLowerCase();if(keys.some(k=>h.includes(k))){const t=(el.innerText||'').trim();if(t.length>20&&!out.includes(t))out.push(t.slice(0,1800));}}return out.slice(0,6)}function cards(arr){return arr.length?`<div class="cards">${arr.map(x=>`<article class="card"><div class="text">${esc(x)}</div></article>`).join('')}</div>`:`<article class="card">لم يتم العثور على كتلة معنونة مستقلة لهذا القسم داخل المصدر الأصلي؛ تم الحفاظ على المصدر كما هو.</article>`}function render(s){document.querySelectorAll('.step').forEach(b=>b.classList.toggle('active',b.dataset.s===s));const v=document.getElementById('viewer');if(s==='lesson'){v.innerHTML=`<article class="card"><span class="pill">01 · المصدر الأصلي</span><h2>${esc(L[0])}</h2><p>هذا هو ملف التفاعل الأصلي للدرس، وهو المرجع الأول للمحتوى.</p><iframe class="source" src="${root+L[3]}" title="${esc(L[0])}"></iframe></article>`}else if(s==='vocabulary'){v.innerHTML=`<span class="pill">02 · المفردات</span><h2>المفردات المستخرجة من المصدر</h2>${cards(blocks(['vocabulaire','vocabulary','mots','الكلمات']))}`}else if(s==='pronunciation'){v.innerHTML=`<span class="pill">03 · النطق</span><h2>النطق من العبارات والكلمات الأصلية</h2>${cards(blocks(['pronon','speak','écoute','audio']))}`}else if(s==='grammar'){v.innerHTML=`<span class="pill">04 · القواعد</span><h2>القواعد كما ظهرت في مصدر الدرس</h2>${cards(blocks(['grammaire','grammar','règle','au / en','article']))}`}else if(s==='conversation'){v.innerHTML=`<span class="pill">05 · المحادثة</span><h2>المحادثة / الحوار من المصدر</h2>${cards(blocks(['conversation','dialogue','parle','discussion']))}`}else if(s==='practice'){v.innerHTML=`<span class="pill">06 · التدريب</span><h2>أنشطة التدريب الأصلية</h2>${cards(blocks(['quiz','exercice','practice','entraînement','activité']))}`}else if(s==='media'){const d=sourceDoc(),ifr=[...d.querySelectorAll('iframe')].map(x=>x.src).filter(Boolean);v.innerHTML=`<span class="pill">07 · الفيديو</span><h2>الوسائط المرتبطة بالمصدر</h2>${ifr.length?ifr.slice(0,2).map(u=>`<iframe class="source" src="${esc(u)}" allowfullscreen></iframe>`).join(''):`<article class="card">لا يوجد فيديو مستقل مُستخرج من المصدر لهذا الدرس. المصدر التفاعلي هو الوسيط الأساسي.</article>`}`}else if(s==='games'){v.innerHTML=`<span class="pill">08 · الألعاب</span><h2>الألعاب والأنشطة التفاعلية الأصلية</h2>${cards(blocks(['game','jeu','joue','challenge']))}`}else if(s==='assessment'){v.innerHTML=`<span class="pill">09 · التقييم</span><h2>التقييم الرسمي للدرس</h2><iframe class="exam" src="${root+L[4]}" title="التقييم الإلكتروني الرسمي"></iframe>`}else{const k='hm-g4-complete-'+id,done=localStorage.getItem(k)==='1';v.innerHTML=`<span class="pill">10 · التقدم</span><h2>تقدم الدرس</h2><article class="card"><h3>${done?'✅ الدرس مكتمل':'⏳ الدرس غير مكتمل'}</h3><p>حالة التقدم معزولة حسب معرّف درس الصف الرابع.</p><button class="btn" id="done">${done?'إلغاء الإكمال':'تم إكمال الدرس'}</button></article>`;document.getElementById('done').onclick=()=>{if(done)localStorage.removeItem(k);else localStorage.setItem(k,'1');render('progress')}}}render(p.get('section')||'lesson')})()</script></body></html>
