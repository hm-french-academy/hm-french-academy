<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy — كورس الصوتيات الفرنسية</title><style>body{margin:0;font-family:Cairo,system-ui,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:24px}.hero,.unit,.lesson{background:#fff;border:1px solid #e6eaf0;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 8px 30px #17203310}.hero{background:linear-gradient(135deg,#0d47a1,#1565c0);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{padding:16px;border:1px solid #e7ebf2;border-radius:14px;background:#fbfcfe}.btn{border:0;border-radius:10px;padding:10px 14px;background:#0d47a1;color:#fff;cursor:pointer}.muted{color:#667085}.hero .muted{color:#e6eefc}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef4ff;color:#0d47a1;font-size:13px}.lesson{display:none}.lesson.active{display:block}.back{background:#eef4ff;color:#0d47a1}.status{margin-top:8px;font-size:12px}.done{color:#16846f;font-weight:800}.progress{height:10px;background:#e8edf5;border-radius:20px;overflow:hidden}.progress>i{display:block;height:100%;width:0;background:#2563eb}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.filters button.active{outline:3px solid #dbe8ff}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.ph-quiz{margin-top:20px;padding:16px;border:1px solid #e6eaf0;border-radius:14px;background:#fbfcfe}.ph-quiz fieldset{margin:12px 0;border:1px solid #e6eaf0;border-radius:10px;padding:12px}.ph-quiz label{display:block;margin:8px 0}.ph-quiz fieldset.correct{border-color:#16846f}.ph-quiz fieldset.wrong{border-color:#c0392b}.quiz-result{font-weight:700;margin-top:12px}.recommendation{margin-top:8px;padding:10px;border-radius:10px;background:#eef4ff}</style></head><body><main class="wrap"><section class="hero"><span class="pill">Draft for Lecturer Review</span><h1>🎙️ كورس الصوتيات الفرنسية</h1><p class="muted">من الاستماع والتمييز إلى النطق والتطبيق.</p><p>مسار تدريجي من A1 إلى B1/B2 مع IPA، الاستماع، التمييز السمعي، الإنتاج، والإيقاع والتنغيم.</p><div class="progress"><i id="courseBar"></i></div><p id="courseProgress">0%</p></section><div class="filters" id="filters"><button class="btn active" data-level="all">كل المستويات</button><button class="btn" data-level="A1">A1</button><button class="btn" data-level="A2">A2</button><button class="btn" data-level="B1">B1</button><button class="btn" data-level="B2">B2</button></div><section id="units"></section><section id="lesson" class="lesson"></section></main><script src="scripts/phonetics-course-runtime.js"></script><script src="scripts/phonetics-progress.js"></script><script src="scripts/phonetics-quiz.js"></script><script>const DATA=['data/specialized/phonetics-lessons-u01.json','data/specialized/phonetics-lessons-u02-u04.json','data/specialized/phonetics-lessons-u05-u08.json','data/specialized/phonetics-lessons-u09-u12.json'];let all=[],filter='all',quizBank=[];const t=v=>typeof v==='string'?v:(v?.ar||'');const total=()=>all.reduce((n,u)=>n+(u.lessons||[]).length,0);function updateProgress(){const s=HMPhoneticsProgress.summary(total());document.getElementById('courseBar').style.width=s.percent+'%';document.getElementById('courseProgress').textContent=s.completed+' / '+s.total+' درس مكتمل · '+s.percent+'%'}async function boot(){for(const u of DATA){try{const d=await HMPhonetics.loadLessons(u);all.push(...(d.units||[]))}catch(e){console.error(e)}}try{quizBank=await (await fetch('data/specialized/phonetics-quiz-bank.json?v='+Date.now(),{cache:'no-store'})).json()}catch(e){console.error(e)}renderUnits();updateProgress()}function renderUnits(){document.getElementById('units').innerHTML=all.map((u,i)=>{const ls=(u.lessons||[]).filter(l=>filter==='all'||l.level===filter);if(!ls.length)return '';return '<section class="unit"><div class="topline"><div><span class="pill">الوحدة '+(i+1)+'</span><h2>'+t(u.title)+'</h2></div></div><div class="grid">'+ls.map(l=>{const done=HMPhoneticsProgress.isDone(l.id);return '<article class="card"><h3>'+t(l.title)+'</h3><p class="muted">'+(l.level||'')+'</p><div class="status '+(done?'done':'')+'">'+(done?'✅ مكتمل':'○ لم يبدأ بعد')+'</div><button class="btn" onclick="openLesson(\''+u.id+'\',\''+l.id+'\')">'+(done?'مراجعة الدرس':'ابدأ الدرس')+'</button></article>'}).join('')+'</div></section>'}).join('')}function openLesson(uid,lid){let u=all.find(x=>x.id===uid),l=u?.lessons.find(x=>x.id===lid);if(!l)return;let box=document.getElementById('lesson');box.className='lesson active';box.innerHTML='<button class="btn back" onclick="closeLesson()">← العودة للكورس</button><h2>'+t(l.title)+'</h2><p class="muted">'+(l.level||'')+'</p><div id="lessonContent"></div><div id="quizHost"></div><div class="topline" style="margin-top:16px"><span id="lessonDone" class="status">'+(HMPhoneticsProgress.isDone(l.id)?'✅ مكتمل':'')+'</span><button class="btn" onclick="markDone(\''+l.id+'\')">✓ إكمال الدرس</button></div>';const d={lessons:[l]};HMPhonetics.render(document.getElementById('lessonContent'),d,lid);const qs=quizBank.questions?.filter(q=>q.lessonId===lid)||[];if(qs.length)HMPhoneticsQuiz.render(document.getElementById('quizHost'),qs,lid);box.scrollIntoView({behavior:'smooth'})}function markDone(id){HMPhoneticsProgress.complete(id);document.getElementById('lessonDone').textContent='✅ تم حفظ إكمال الدرس';updateProgress();renderUnits()}function closeLesson(){let b=document.getElementById('lesson');b.className='lesson';b.innerHTML='';window.scrollTo({top:0,behavior:'smooth'})}document.getElementById('filters').addEventListener('click',e=>{const b=e.target.closest('button[data-level]');if(!b)return;filter=b.dataset.level;document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('active',x===b));renderUnits()});window.addEventListener('hm:phonetics-progress',()=>{updateProgress();renderUnits()});boot()</script></body></html>
