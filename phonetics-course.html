<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HM Academy — كورس الصوتيات الفرنسية</title><style>body{margin:0;font-family:Cairo,system-ui,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:24px}.hero,.unit,.lesson{background:#fff;border:1px solid #e6eaf0;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 8px 30px #17203310}.hero{background:linear-gradient(135deg,#0d47a1,#1565c0);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{padding:16px;border:1px solid #e7ebf2;border-radius:14px;background:#fbfcfe}.btn{border:0;border-radius:10px;padding:10px 14px;background:#0d47a1;color:#fff;cursor:pointer}.muted{color:#667085}.hero .muted{color:#e6eefc}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef4ff;color:#0d47a1;font-size:13px}.unit h2{margin-top:0}.lesson{display:none}.lesson.active{display:block}.back{background:#eef4ff;color:#0d47a1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}code{direction:ltr;display:inline-block}.speak{font-size:18px;margin-inline-start:8px}</style></head><body><main class="wrap"><section class="hero"><span class="pill">Draft for Lecturer Review</span><h1>🎙️ كورس الصوتيات الفرنسية</h1><p class="muted">من الاستماع والتمييز إلى النطق والتطبيق.</p><p>مسار تدريجي من A1 إلى B1/B2 مع IPA، الاستماع، التمييز السمعي، الإنتاج، والإيقاع والتنغيم.</p></section><section id="units"></section><section id="lesson" class="lesson"></section></main><script src="scripts/phonetics-course-runtime.js"></script><script>const DATA=['data/specialized/phonetics-lessons-u01.json','data/specialized/phonetics-lessons-u02-u04.json','data/specialized/phonetics-lessons-u05-u08.json','data/specialized/phonetics-lessons-u09-u12.json'];let all=[];const t=v=>typeof v==='string'?v:(v?.ar||'');async function boot(){for(const u of DATA){try{const d=await HMPhonetics.loadLessons(u);all.push(...(d.units||[]))}catch(e){console.error(e)}}renderUnits()}function renderUnits(){document.getElementById('units').innerHTML=all.map((u,i)=>'<section class="unit"><span class="pill">الوحدة '+(i+1)+'</span><h2>'+t(u.title)+'</h2><div class="grid">'+u.lessons.map(l=>'<article class="card"><h3>'+t(l.title)+'</h3><p class="muted">'+(l.level||'')+'</p><button class="btn" onclick="openLesson(\''+u.id+'\',\''+l.id+'\')">ابدأ الدرس</button></article>').join('')+'</div></section>').join('')}function openLesson(uid,lid){let u=all.find(x=>x.id===uid),l=u?.lessons.find(x=>x.id===lid);if(!l)return;let box=document.getElementById('lesson');box.className='lesson active';box.innerHTML='<button class="btn back" onclick="closeLesson()">← العودة للكورس</button><h2>'+t(l.title)+'</h2><p class="muted">'+(l.level||'')+'</p><div id="lessonContent"></div>';const d={lessons:[l]};HMPhonetics.render(document.getElementById('lessonContent'),d,lid);box.scrollIntoView({behavior:'smooth'})}function closeLesson(){let b=document.getElementById('lesson');b.className='lesson';b.innerHTML=''}boot()</script></body></html>
