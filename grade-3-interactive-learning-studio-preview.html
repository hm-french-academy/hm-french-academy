<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f8ff">
<title>HM Academy | Interactive Learning Studio — Grade 3</title>
<style>
:root{--ink:#172554;--muted:#64748b;--line:#e3e8f3;--paper:#fff;--bg:#f5f7fc;--blue:#3157d5;--teal:#0f9b8e;--gold:#f4b942;--pink:#f6e9f7;--shadow:0 14px 38px #1c2f6310}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans Arabic",sans-serif}
button{font:inherit;cursor:pointer}a{color:inherit}.app{max-width:1220px;margin:auto;padding:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.logo{width:42px;height:42px;display:grid;place-items:center;background:var(--blue);color:#fff;border-radius:14px;font-size:22px;box-shadow:0 8px 18px #3157d533}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.ghost,.primary{border:0;border-radius:12px;padding:10px 14px;font-weight:800}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.primary{background:var(--blue);color:#fff}
.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:18px;align-items:start}.sidebar,.hero,.workspace,.bottom-card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.sidebar{padding:14px;position:sticky;top:12px}.side-label{color:var(--muted);font-size:12px;font-weight:900;padding:8px 10px}.navlist{display:grid;gap:5px}.navitem{border:0;background:transparent;text-align:right;display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:12px;color:#465573;font-weight:800}.navitem .ico{width:29px;height:29px;display:grid;place-items:center;background:#f0f3fb;border-radius:9px}.navitem.active{background:#eef2ff;color:var(--blue)}.navitem.active .ico{background:var(--blue);color:#fff}.navitem.done:after{content:'✓';margin-right:auto;color:var(--teal);font-weight:900}.side-progress{margin-top:16px;background:#f8faff;border-radius:16px;padding:13px}.side-progress strong{font-size:13px}.meter{height:8px;border-radius:99px;background:#e7ebf5;overflow:hidden;margin:10px 0 6px}.meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--teal));transition:width .25s}.small{font-size:12px;color:var(--muted);line-height:1.7}
.content{min-width:0}.hero{overflow:hidden;margin-bottom:15px}.hero-main{padding:25px;background:radial-gradient(circle at 85% 10%,#d7e7ff 0,transparent 36%),linear-gradient(120deg,#fff 5%,#f4f6ff 60%,#fff7e8)}.eyebrow{font-size:12px;letter-spacing:.04em;color:var(--blue);font-weight:900}.hero-row{display:flex;justify-content:space-between;gap:15px;align-items:center}.hero h1{font-size:clamp(27px,4vw,40px);margin:10px 0 6px}.hero p{color:var(--muted);line-height:1.8;margin:0;max-width:650px}.hero-art{font-size:64px;min-width:90px;text-align:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}.stat{padding:13px 18px}.stat b{display:block;font-size:19px}.stat span{font-size:12px;color:var(--muted)}
.workspace{padding:22px;min-height:570px}.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}.section-head h2{font-size:25px;margin:0 0 7px}.section-head p{margin:0;color:var(--muted);line-height:1.8}.tag{background:#edf3ff;color:var(--blue);border-radius:99px;padding:7px 11px;font-size:12px;font-weight:900;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:12px}.tile{border:1px solid var(--line);border-radius:17px;padding:15px;background:#fff}.tile h3{margin:5px 0 8px;font-size:18px}.fr{font-size:21px;font-weight:900;direction:ltr;text-align:left;line-height:1.5}.ar{color:var(--muted);line-height:1.7}.tile-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.emoji{font-size:27px}.action{border:0;background:#eef2ff;color:var(--blue);border-radius:10px;padding:9px 12px;font-weight:900;margin-top:12px}.action.dark{background:var(--blue);color:#fff}.action.green{background:#e3f8f0;color:#087b68}.action:disabled{opacity:.45;cursor:not-allowed}
.flash{max-width:600px;margin:auto;text-align:center;border:1px solid var(--line);border-radius:24px;padding:28px;background:linear-gradient(145deg,#fff,#f7f8ff);min-height:290px;display:flex;flex-direction:column;align-items:center;justify-content:center}.flash .big{font-size:clamp(30px,5vw,44px);font-weight:900;direction:ltr;margin:16px 0}.flash .meaning{font-size:22px;color:var(--muted)}.flash-controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:15px}
.dialogue{display:grid;gap:10px}.line{display:flex;gap:10px;align-items:flex-start;max-width:85%}.line:nth-child(even){margin-right:auto;flex-direction:row-reverse}.avatar{width:38px;height:38px;display:grid;place-items:center;background:#eef2ff;border-radius:13px;font-size:22px;flex-shrink:0}.bubble{padding:13px 15px;border-radius:16px;background:#f4f6fc;min-width:180px}.line:nth-child(even) .bubble{background:#e6f8f4}.bubble .fr{font-size:18px}.bubble .ar{font-size:13px;margin-top:4px}
.question{border:1px solid var(--line);border-radius:17px;padding:17px;margin:12px 0}.qtitle{font-weight:900;line-height:1.8;margin-bottom:12px}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.option{border:1px solid var(--line);border-radius:12px;background:#fff;text-align:right;padding:12px;font-weight:700;color:var(--ink)}.option.correct{background:#e4f8ef;border-color:#65c49e}.option.wrong{background:#fff0f0;border-color:#e7a0a0}.feedback{font-weight:800;min-height:25px;margin-top:10px}.note{background:#fff8e5;border:1px solid #f7e5ae;border-radius:14px;padding:14px;line-height:1.9;margin:12px 0}
.gamebox{background:#f7f9ff;border-radius:18px;padding:18px;border:1px solid var(--line)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid #dce4f4;background:#fff;border-radius:12px;padding:10px 13px;font-weight:900}.chip.selected{background:#e8edff;border-color:var(--blue);color:var(--blue)}.chip.used{opacity:.35}.result{font-weight:900;margin-top:12px;min-height:24px}
.footer-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:15px}.footer-nav .muted{font-size:12px}
.hidden{display:none!important}.empty{padding:25px;border-radius:16px;background:#fff8e5;color:#7c5711;line-height:1.8}.video-frame{width:100%;aspect-ratio:16/9;border:0;border-radius:17px;background:#10172c}.reference-list{display:grid;gap:10px}.refrow{padding:13px;border:1px solid var(--line);border-radius:13px;line-height:1.8}
@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{position:static}.navlist{display:flex;overflow-x:auto;padding-bottom:4px}.navitem{white-space:nowrap;flex-shrink:0}.side-label,.side-progress{display:none}.hero-art{font-size:45px;min-width:55px}.app{padding:10px}.workspace{padding:16px}.hero-main{padding:19px}}
@media(max-width:480px){.hero-row{align-items:flex-start}.hero-art{display:none}.stats .stat{padding:11px}.stat b{font-size:16px}.topbar{align-items:flex-start}.brand small{max-width:170px}.options{grid-template-columns:1fr}.section-head{display:block}.tag{display:inline-block;margin-top:10px}.line{max-width:100%}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
<div class="brand"><div class="logo">HM</div><div>HM Academy <small>مساحة التعلم التفاعلية · تجربة مستقلة</small></div></div>
<div class="top-actions"><a class="ghost" href="grade-3.html" style="text-decoration:none">← الصف الثالث</a><button class="ghost" id="reset">إعادة التقدم</button></div>
</header>
<div class="layout">
<aside class="sidebar">
<div class="side-label">رحلة التعلم</div><nav id="navlist" class="navlist" aria-label="أقسام الدرس"></nav>
<div class="side-progress"><strong>تقدمك في الدرس</strong><div class="meter"><span id="sidebar-meter"></span></div><div class="small" id="side-count">0 من 9 أقسام مكتملة</div></div>
</aside>
<main class="content">
<section class="hero">
<div class="hero-main"><div class="hero-row"><div><div class="eyebrow">PRIMARY 3 · FRENCH · LESSON 01</div><h1 id="lesson-title">جارٍ تحميل الدرس…</h1><p id="objective">نجهز لك رحلة تعلم قصيرة وتفاعلية.</p></div><div class="hero-art">🎒✨</div></div></div>
<div class="stats"><div class="stat"><b id="vocab-stat">—</b><span>عبارات للتعلم</span></div><div class="stat"><b id="activity-stat">—</b><span>أنشطة تفاعلية</span></div><div class="stat"><b id="score-stat">0%</b><span>إنجازك الحالي</span></div></div>
</section>
<section class="workspace" id="workspace"><div class="empty">يتم تحميل محتوى الدرس الأصلي…</div></section>
<div class="footer-nav"><button class="ghost" id="prev">السابق</button><span class="muted" id="step-label">الخطوة 1</span><button class="primary" id="next">التالي ←</button></div>
</main>
</div>
</div>
<script>
(function(){
'use strict';
const params=new URLSearchParams(location.search), lessonId=params.get('id')||'g3-l01';
const manifest='data/lessons/grade-3/premium-content-manifest.json';
const navItems=[
['start','✨','ابدأ هنا'],['vocabulary','🧩','المفردات'],['pronunciation','🔊','استمع وانطق'],['grammar','🧠','افهم النمط'],['conversation','💬','حوار قصير'],['practice','✍️','تدرب بنفسك'],['games','🎮','العب وتعلّم'],['media','🎬','شاهد واستمع'],['assessment','🏆','اختبر نفسك'],['reference','📘','مرجع الدرس'],['progress','🌱','تقدمك']
];
let data=null, current=0, done=new Set(), vocabIndex=0, scores={};
const $=id=>document.getElementById(id);
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function speak(text){if(!('speechSynthesis' in window)){alert('خاصية النطق غير متاحة في هذا المتصفح.');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u);}
function savedKey(){return 'hm-interactive-preview-'+lessonId;}
function save(){try{localStorage.setItem(savedKey(),JSON.stringify({done:[...done],scores}));}catch(e){} updateProgress();}
function loadSaved(){try{const s=JSON.parse(localStorage.getItem(savedKey())||'{}');done=new Set(s.done||[]);scores=s.scores||{};}catch(e){}}
function renderNav(){ $('navlist').innerHTML=navItems.map((n,i)=>'<button class="navitem '+(i===current?'active ':'')+(done.has(n[0])?'done':'')+'" data-index="'+i+'"><span class="ico">'+n[1]+'</span><span>'+n[2]+'</span></button>').join('');$('navlist').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.index));}
function updateProgress(){const total=navItems.length-1, count=navItems.filter(n=>done.has(n[0])).length; $('sidebar-meter').style.width=Math.round(count/total*100)+'%';$('side-count').textContent=count+' من '+total+' أقسام مكتملة';$('score-stat').textContent=Math.round(count/total*100)+'%';renderNav();}
function markDone(id){done.add(id);save();}
function go(i){current=Math.max(0,Math.min(navItems.length-1,i));renderNav();renderSection();$('step-label').textContent='الخطوة '+(current+1)+' من '+navItems.length;$('prev').disabled=current===0;$('next').textContent=current===navItems.length-1?'إلى البداية ↺':'التالي ←';window.scrollTo({top:0,behavior:'smooth'});}
function head(title,desc,tag){return '<div class="section-head"><div><h2>'+title+'</h2><p>'+desc+'</p></div><span class="tag">'+tag+'</span></div>';}
function tileVocab(v,i){return '<article class="tile"><div class="tile-top"><span class="emoji">'+(['👋','🙋','💬','🙂','🌟','👌','🌧️','😊','🎂','🎈'][i%10])+'</span><span class="small">'+(i+1)+' / '+data.vocabulary.length+'</span></div><div class="fr">'+safe(v.fr)+'</div><div class="ar">'+safe(v.ar)+'</div><button class="action" data-say="'+safe(v.audio||v.fr)+'">🔊 استمع للنطق</button></article>';}
function startView(){return head('أهلًا بك في رحلتك!','سنتعلم كيف نعرّف بأنفسنا، ونسأل عن الاسم والحال والعمر. اختر أي قسم من القائمة وارجع إليه في أي وقت.','الدرس 01')+'<div class="cards"><article class="tile"><div class="emoji">🎯</div><h3>هدفنا اليوم</h3><p class="ar">'+data.objectives.map(safe).join('<br>')+'</p></article><article class="tile"><div class="emoji">🪄</div><h3>ابدأ بخطوة صغيرة</h3><p class="ar">استمع إلى العبارات، اقلب بطاقات المفردات ذهنيًا، ثم جرّب أن تجيب بنفسك.</p><button class="action dark" id="begin">ابدأ التعلم ←</button></article><article class="tile"><div class="emoji">🌱</div><h3>تعلم على مهل</h3><p class="ar">تقدمك محفوظ على هذا الجهاز. يمكنك إعادة أي نشاط متى أردت.</p></article></div><div class="note">💡 تذكّر: مع سؤال الحال توجد أكثر من إجابة صحيحة في الدرس، وسنتدرب عليها كلها.</div>';}
function vocabularyView(){return head('اكتشف الكلمات والعبارات','تصفح البطاقات واستمع إلى النطق الفرنسي. كل بطاقة مرتبطة بمحتوى الدرس الأصلي.','المفردات')+'<div class="cards">'+data.vocabulary.map(tileVocab).join('')+'</div>';}
function pronunciationView(){return head('استمع ثم اختر المعنى','اضغط زر الاستماع ثم اختر المعنى المناسب لما سمعت.','استماع ونطق')+data.listening.map((q,i)=>questionHTML(q,i,'listen')).join('');}
function questionHTML(q,i,group){return '<div class="question" data-qgroup="'+group+'" data-qid="'+safe(q.id||i)+'"><div class="qtitle">'+(i+1)+'. '+safe(q.prompt||q.question||'')+'</div>'+(q.audio?'<button class="action" data-say="'+safe(q.audio)+'">🔊 استمع للسؤال</button>':'')+'<div class="options">'+q.options.map((o,j)=>'<button class="option" data-choice="'+j+'">'+safe(o)+'</button>').join('')+'</div><div class="feedback" aria-live="polite"></div></div>';}
function grammarView(){return head('افهم طريقة السؤال والإجابة','لاحظ كيف تتغير العبارة حسب ما نريد السؤال عنه. استمع للأمثلة ثم صنّفها.','افهم النمط')+'<div class="cards">'+data.grammar.map(g=>'<article class="tile"><span class="tag">'+safe(g.label)+'</span><h3>السؤال</h3>'+g.questionForms.map(q=>'<div class="fr">'+safe(q)+' <button class="action" data-say="'+safe(q)+'">🔊</button></div>').join('')+'<h3>الإجابة</h3>'+g.answers.map(a=>'<div class="fr">'+safe(a)+' <button class="action" data-say="'+safe(a)+'">🔊</button></div>').join('')+'<p class="ar">'+safe(g.note)+'</p></article>').join('')+'</div><div class="note">🧠 جرّب أن تقول كل سؤال بصوت مسموع، ثم اختر إجابة مناسبة له.</div>';}
function conversationView(){return head('حوار تعارف قصير','استمع إلى كل جملة لتتدرب على إيقاع الحوار.','تواصل')+'<div class="dialogue">'+data.conversation.map((l,i)=>'<div class="line"><div class="avatar">'+safe(l.speaker||'🙂')+'</div><div class="bubble"><div class="fr">'+safe(l.text)+'</div><button class="action" data-say="'+safe(l.audio||l.text)+'">🔊 استمع</button></div></div>').join('')+'</div><div class="note">🎤 تحدٍّ صغير: أعد الحوار بصوتك، وغيّر الاسم أو العمر عند التدريب إذا أحببت.</div>';}
function practiceView(){return head('حان دورك!','أجب عن الأسئلة واختر كل إجابة صحيحة. في سؤال الحال، أكثر من إجابة مقبولة.','تدريب')+data.practice.map((q,i)=>questionHTML(q,i,'practice')).join('');}
function gamesView(){return head('وقت اللعب والتعلّم','أنشطة قصيرة مستندة إلى مفردات الدرس وعباراته الأصلية.','ألعاب')+'<div class="cards">'+data.games.map((g,i)=>'<article class="tile"><div class="emoji">'+(['🎯','🧩','🃏','🔤'][i%4])+'</div><h3>'+safe(g.title)+'</h3><p class="ar">'+safe(g.description)+'</p><button class="action dark" data-game="'+i+'">ابدأ اللعبة ←</button></article>').join('')+'</div><div id="game-area" class="gamebox hidden" style="margin-top:16px"></div>';}
function mediaView(){return head('شاهد واستمع','وسيط الدرس الأصلي المرتبط بمحتوى التعارف.','وسائط')+'<div class="tile"><h3>'+safe(data.media.title||'وسيط الدرس')+'</h3><p class="ar">شاهد الفيديو ثم عد إلى الأنشطة لتستخدم العبارات التي تعلمتها.</p><iframe class="video-frame" src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(data.media.youtubeId)+'" title="'+safe(data.media.title||'فيديو الدرس')+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe><p class="small">إذا لم يظهر الفيديو، يمكنك فتحه من منصة الفيديو والعودة إلى الدرس.</p><a class="action" style="display:inline-block;text-decoration:none" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v='+encodeURIComponent(data.media.youtubeId)+'">فتح الفيديو في نافذة جديدة ↗</a></div>';}
function assessmentView(){return head('اختبر ما تعلمته','أجب عن الأسئلة الثلاثة. ستحصل على نتيجة فورية، ويمكنك المحاولة مرة أخرى.','تقييم')+data.assessment.map((q,i)=>questionHTML(q,i,'assessment')).join('')+'<div class="tile"><h3>نتيجتك</h3><p id="assessment-result" class="ar">أجب عن الأسئلة لعرض النتيجة.</p><button class="action dark" id="grade-assessment">احسب النتيجة</button></div>';}
function referenceView(){return head(data.reference.title||'مرجع الدرس','ملخص سريع لما يجب تذكره بعد التعلم.','مرجع')+'<div class="reference-list">'+data.reference.items.map((x,i)=>'<div class="refrow"><b>'+(i+1)+'.</b> '+safe(x)+'</div>').join('')+'</div><div class="note">المرجع مرتبط بملف الدرس الأصلي: '+safe(data.source.reference)+'</div>';}
function progressView(){return head('انظر إلى ما أنجزته','تستطيع الرجوع لأي نشاط لمراجعته. إنجازك محفوظ على هذا الجهاز.','تقدمك')+'<div class="tile"><div style="font-size:40px">🌱</div><h3 id="progress-title">أحسنت، أنت تتقدم!</h3><p id="progress-summary" class="ar"></p><div class="meter"><span id="final-meter"></span></div><div class="cards">'+navItems.filter(n=>n[0]!=='progress').map(n=>'<div class="refrow">'+n[1]+' '+n[2]+' <b style="float:left">'+(done.has(n[0])?'مكتمل ✓':'لم يكتمل بعد')+'</b></div>').join('')+'</div><button class="action dark" id="restart">ارجع إلى بداية الرحلة</button></div>';}
function renderSection(){const id=navItems[current][0],w=$('workspace');let html='';switch(id){case'start':html=startView();break;case'vocabulary':html=vocabularyView();break;case'pronunciation':html=pronunciationView();break;case'grammar':html=grammarView();break;case'conversation':html=conversationView();break;case'practice':html=practiceView();break;case'games':html=gamesView();break;case'media':html=mediaView();break;case'assessment':html=assessmentView();break;case'reference':html=referenceView();break;case'progress':html=progressView();break;}w.innerHTML=html;bindInteractions(id);}
function bindInteractions(section){
$('workspace').querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));
$('workspace').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{
 const box=b.closest('.question');if(box.dataset.answered==='1')return;
 const qid=box.dataset.qid,group=box.dataset.qgroup;let source=group==='listen'?data.listening:group==='practice'?data.practice:data.assessment;const q=source.find(x=>String(x.id)===qid)||source[+qid]||source[0];const chosen=q.options[+b.dataset.choice];const accepted=q.acceptedAnswers||[q.answer!==undefined?q.options[q.answer]:null];const ok=accepted.includes(chosen);
 if(q.multipleValid){box.querySelectorAll('.option').forEach(o=>{if(accepted.includes(q.options[+o.dataset.choice]))o.classList.add('correct');});box.querySelector('.feedback').textContent=ok?'صحيح! هذه إجابة مقبولة. ويمكن اختيار إجابات صحيحة أخرى أيضًا.':'هذه ليست إجابة مقبولة هنا؛ جرّب إحدى الإجابات الأخرى.';if(ok)box.dataset.answered='1';}
 else{box.dataset.answered='1';box.querySelectorAll('.option').forEach(o=>{if(+o.dataset.choice===+b.dataset.choice)o.classList.add(ok?'correct':'wrong');if(accepted.includes(q.options[+o.dataset.choice]))o.classList.add('correct');});box.querySelector('.feedback').textContent=ok?'أحسنت! إجابة صحيحة.':'حاول مرة أخرى. الإجابة الصحيحة مميزة باللون الأخضر.';}
 if(ok){scores[group+':'+qid]=1;save();}
 });

}
function startGame(i){const area=$('game-area');area.classList.remove('hidden');const g=data.games[i];if(g.type==='sentence-builder'){let chosen=[];const words=['Lina','m\'appelle','Je'];area.innerHTML='<h3>'+safe(g.title)+'</h3><p>'+safe(g.description)+'</p><div class="chips" id="word-pool">'+words.map((w,j)=>'<button class="chip" data-word="'+j+'">'+safe(w)+'</button>').join('')+'</div><div class="note">الجملة التي رتبتها: <b id="built" dir="ltr"></b></div><button class="action dark" id="check-sentence">تحقق من الترتيب</button><button class="action" id="clear-sentence">إعادة الترتيب</button><div class="result" id="game-result"></div>';const target=['Je',"m'appelle",'Lina'];area.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{const j=+b.dataset.word;if(chosen.includes(j))return;chosen.push(j);b.classList.add('used');$('built').textContent=chosen.map(k=>words[k]).join(' ');});$('check-sentence').onclick=()=>{const val=chosen.map(k=>words[k]).join(' ');$('game-result').textContent=val===target.join(' ')?g.successMessage:g.retryMessage;if(val===target.join(' '))markDone('games');};$('clear-sentence').onclick=()=>{chosen=[];$('built').textContent='';$('game-result').textContent='';area.querySelectorAll('.chip').forEach(b=>b.classList.remove('used'));};}
else{const pool=data.vocabulary;let index=Math.floor(Math.random()*pool.length);area.innerHTML='<h3>'+safe(g.title)+'</h3><p>'+safe(g.description)+'</p><div class="flash"><div class="small">اختر الترجمة الصحيحة</div><div class="big" id="game-word" dir="ltr"></div><div class="options" id="game-options"></div><div class="result" id="game-result"></div><button class="action" id="next-card">بطاقة أخرى ↻</button></div>';function draw(){index=Math.floor(Math.random()*pool.length);$('game-word').textContent=pool[index].fr;let opts=[pool[index].ar];while(opts.length<3){const t=pool[Math.floor(Math.random()*pool.length)].ar;if(!opts.includes(t))opts.push(t);}opts.sort(()=>Math.random()-.5);$('game-options').innerHTML=opts.map(o=>'<button class="option">'+safe(o)+'</button>').join('');$('game-result').textContent='';$('game-options').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('game-result').textContent=b.textContent===pool[index].ar?'رائع! إجابة صحيحة.':'حاول مرة أخرى.';if(b.textContent===pool[index].ar)markDone('games');});}$('next-card').onclick=draw;draw();}
area.scrollIntoView({behavior:'smooth',block:'start'});}

async function init(){try{const m=await fetch(manifest,{cache:'no-store'});if(!m.ok)throw Error('تعذر تحميل سجل المحتوى الأصلي.');const manifestData=await m.json();const binding=manifestData.bindings&&manifestData.bindings[lessonId];if(!binding||!binding.studio)throw Error('هذا الدرس غير موجود في سجل المحتوى المعتمد.');const r=await fetch(binding.studio,{cache:'no-store'});if(!r.ok)throw Error('تعذر تحميل ملف الدرس المعتمد.');data=await r.json();if(data.id!==lessonId)throw Error('معرّف محتوى الدرس لا يطابق المسار المطلوب.');loadSaved();$('lesson-title').textContent=data.title;$('objective').textContent=data.objectives.join(' • ');$('vocab-stat').textContent=data.vocabulary.length;$('activity-stat').textContent=data.listening.length+data.practice.length+data.games.length+data.assessment.length;go(0);}catch(e){$('lesson-title').textContent='تعذر فتح الدرس';$('objective').textContent='لم يتم عرض أي محتوى بديل حتى لا نخلط محتوى الدروس.';$('workspace').innerHTML='<div class="empty"><b>تعذر تحميل المحتوى المعتمد.</b><br>'+safe(e.message)+'<br>تحقق من الاتصال ثم أعد تحميل الصفحة.</div>';}}
